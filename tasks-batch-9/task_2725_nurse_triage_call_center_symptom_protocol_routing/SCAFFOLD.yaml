# ============================================================================
# Task 2725 — Nurse Triage Call Center & Symptom Protocol Routing
# Seed tables §1.0–§1.7 (single source of truth for PRD / tests / implementation)
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2725. Nurse Triage Call Center & Symptom Protocol Routing (health system nurse advice line): call intake with caller identification, patient matching and consent recording, symptom protocol selection with age and pregnancy modifiers, disposition determination from emergency referral through home care advice with override documentation, warm transfer to emergency services with location capture, after-hours coverage on behalf of practices with next-day callback lists, callback verification for high-risk dispositions, disposition compliance auditing against outcomes, staffing to call volume with licensure by state of the caller

domain_name: nurse-triage-call-center
api_prefix: ""

complexity_profile:
  difficulty_level: beyond_expert     # §0.4 Expert band, deliberately denser (see difficulty_notes)
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only four read paths are
  # nested (`/practices/{id}/patients`, `/practices/{id}/coverage-windows`,
  # `/nurses/{id}/licenses`, `/nurses/{id}/shifts`, `/triage-calls/{id}/warm-transfers`,
  # `/dispositions/{id}/audit-records`); every write targets a flat collection
  # or a flat action path, and every cross-entity link is an FK field in the body.

  state_machine_shape: parallel
  # TriageCall is cyclic (DISPOSITIONED -> ASSESSING re-assessment loop,
  # CLOSED -> DISPOSITIONED reopen loop). Disposition carries TWO independent
  # state dimensions on the same row (`advice_status` x `audit_status`).
  # CallbackTask is branching with a self-loop (ATTEMPTED -> ATTEMPTED).
  # WarmTransfer is branching (LOCATION_CONFIRMED -> {ACCEPTED_BY_PSAP, REJECTED_BY_PSAP}).

  relationship_patterns:
    - one_to_many        # Practice -> Patient / CoverageWindow / TriageCall; Nurse -> NurseLicense / NurseShift
    - cross_aggregate    # Disposition -> ProtocolAssessment, CallbackTask -> Practice (denormalised), ComplianceAuditRecord -> Disposition
    - polymorphic_actor  # Nurse rows are addressed by two different roles (TriageNurse, ChargeNurse) through X-User-Role

  role_model: segregation_of_duties
  # The Nurse who determined a Disposition may not verify that Disposition's
  # high-risk CallbackTask; de-escalating an authorized disposition requires a
  # ChargeNurse, never the determining TriageNurse acting on itself.

  consistency_model: immediate

difficulty_notes: |
  The scenario was requested "harder than expert level", so the scaffold sits above
  the §0.4 Expert band on surface area (13 entities / 44 endpoints / 50 errors) but
  the difficulty is carried by coupling, not by volume:
    - The same acuity number is computable two ways (PROVISIONAL vs CONFIRMED
      assessment) and the two ways route the caller to different disposition levels.
    - The same audited outcome set yields two different concordance percentages
      (strict vs band-tolerant), and only the strict one drives escalation.
    - Money/minutes rounding is pinned per-call-then-sum; the natural alternative
      (sum-then-round) is off by one cent on the very first two-call fixture.
    - The after-hours invoice looks circular (a volume credit that appears keyed on
      the invoice total) and is pinned to the pre-escalation subtotal.
    - Superseding an assessment voids its disposition, which cancels its callback,
      which decrements a practice counter — a four-hop chain from one POST.
    - Nurse selection is a server-side selector with a licensure-by-caller-state
      eligibility filter, a two-key ranking, a created_at tie-break, and an
      empty-pool error.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  # --------------------------------------------------------------------------
  - name: Practice
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the client medical practice served by the advice line.
        constraints: "1..120 chars"
      - name: office_open_utc_hhmm
        type: string
        source: input
        description: Start of the practice's own office hours, expressed as UTC HH:MM.
        constraints: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      - name: office_close_utc_hhmm
        type: string
        source: input
        description: End of the practice's own office hours, expressed as UTC HH:MM; must be strictly greater than office_open_utc_hhmm.
        constraints: "^([01][0-9]|2[0-3]):[0-5][0-9]$; close > open"
      - name: weekend_is_after_hours
        type: boolean
        source: input
        description: When true, ISO weekday 6 (Saturday) and 7 (Sunday) are after-hours regardless of clock time-of-day.
        default: true
      - name: per_minute_rate_millicents
        type: integer
        source: input
        description: Contracted advice-line rate in millicents (1/1000 cent) per billable minute; deliberately sub-cent so per-call rounding is observable.
        constraints: ">= 1"
      - name: consent_recording_required
        type: boolean
        source: input
        description: When true, POST /triage-calls/{id}/consent must carry recording_reference.
        default: false
      - name: variance_review_threshold
        type: integer
        source: input
        description: open_variance_count value at or above which compliance_posture flips to UNDER_REVIEW.
        default: 2
        constraints: ">= 1"
      - name: audit_period_start_utc
        type: datetime
        source: input
        description: Inclusive lower bound of the current compliance audit period; GET /practices/{id}/compliance-summary counts audit records created at or after this instant.
      - name: status
        type: enum
        source: system
        description: Practice contract state; SUSPENDED practices reject intake and coverage-window creation.
        default: ACTIVE
        constraints: "enum: {ACTIVE, SUSPENDED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived compliance gate; flips to UNDER_REVIEW when open_variance_count >= variance_review_threshold and then blocks coverage-window activation.
        default: NORMAL
        constraints: "enum: {NORMAL, UNDER_REVIEW}"
      - name: open_callback_count
        type: integer
        source: computed
        description: "Conserved counter: number of CallbackTask rows with practice_id == this.id and status IN {PENDING, ATTEMPTED, REACHED}."
        default: 0
      - name: open_variance_count
        type: integer
        source: computed
        description: Number of Disposition rows for this practice whose audit_status is VARIANCE_ESCALATED.
        default: 0
      - name: escalated_callback_count
        type: integer
        source: computed
        description: Cumulative count of CallbackTask rows for this practice that reached terminal status ESCALATED; drives the after-hours invoice escalation line.
        default: 0
      - name: billed_advice_minutes_total
        type: integer
        source: computed
        description: "Conserved ledger: sum of TriageCall.billable_minutes over this practice's calls with status == CLOSED. Debited exactly on reopen."
        default: 0
      - name: advice_fee_accrued_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of TriageCall.advice_fee_cents over this practice's calls with status == CLOSED (per-call rounding already applied)."
        default: 0

  # --------------------------------------------------------------------------
  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Registered nurse's display name.
        constraints: "1..120 chars"
      - name: seniority_level
        type: integer
        source: input
        description: Staffing seniority band; second ranking key (descending) in the assignment selector.
        constraints: "1..5"
      - name: max_concurrent_calls
        type: integer
        source: input
        description: Hard cap on the number of live calls this nurse may hold.
        constraints: "1..8"
      - name: high_risk_cap
        type: integer
        source: input
        description: pending_high_risk_count value at which the nurse is pulled OFF_ROTATION by cascade.
        constraints: "1..5"
      - name: active_call_load
        type: integer
        source: computed
        description: "Conserved counter: number of TriageCall rows with assigned_nurse_id == this.id and status IN {ASSIGNED, ASSESSING, DISPOSITIONED}."
        default: 0
      - name: pending_high_risk_count
        type: integer
        source: computed
        description: Number of TriageCall rows assigned to this nurse with requires_warm_transfer == true and status IN {ASSIGNED, ASSESSING, DISPOSITIONED}.
        default: 0
      - name: intake_eligibility
        type: enum
        source: computed
        description: Selector gate; set to OFF_ROTATION when pending_high_risk_count >= high_risk_cap and back to ON_ROTATION when it drops below the cap.
        default: ON_ROTATION
        constraints: "enum: {ON_ROTATION, OFF_ROTATION}"

  # --------------------------------------------------------------------------
  - name: NurseLicense
    parent: Nurse
    common_fields: false
    fields:
      - name: nurse_id
        type: string
        source: input
        description: FK -> Nurse.id; taken from the path segment of POST /nurses/{id}/licenses.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code this license authorizes triage advice in; matched against TriageCall.caller_state_code.
        constraints: "^[A-Z]{2}$"
      - name: license_number
        type: string
        source: input
        description: Board-issued license number; unique per (nurse_id, state_code).
        constraints: "1..40 chars"
      - name: expires_on
        type: string
        source: input
        description: Inclusive last calendar date (YYYY-MM-DD) on which the license is valid.
        constraints: "^\\d{4}-\\d{2}-\\d{2}$"
      - name: status
        type: enum
        source: computed
        description: "Derived from the logical clock at read time: ACTIVE when expires_on >= date(clock), otherwise EXPIRED. Never stored as an input."
        constraints: "enum: {ACTIVE, EXPIRED}"

  # --------------------------------------------------------------------------
  - name: NurseShift
    parent: Nurse
    common_fields: false
    fields:
      - name: nurse_id
        type: string
        source: input
        description: FK -> Nurse.id; taken from the path segment of POST /nurses/{id}/shifts.
      - name: start_utc
        type: datetime
        source: input
        description: Inclusive start of the staffed interval.
      - name: end_utc
        type: datetime
        source: input
        description: Exclusive end of the staffed interval; must be strictly after start_utc. Shift intervals are half-open [start_utc, end_utc), so a shift may begin at the exact instant a previous shift ends.
      - name: scheduled_minutes
        type: integer
        source: computed
        description: Whole minutes between start_utc and end_utc; summand of the staffing-adequacy scheduled_nurse_minutes total.
      - name: status
        type: enum
        source: computed
        description: "Derived from the logical clock at read time: SCHEDULED when clock < start_utc, ACTIVE when start_utc <= clock < end_utc, ENDED when clock >= end_utc."
        constraints: "enum: {SCHEDULED, ACTIVE, ENDED}"

  # --------------------------------------------------------------------------
  - name: CoverageWindow
    parent: Practice
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; the practice whose after-hours calls this window authorizes the advice line to answer.
      - name: start_utc
        type: datetime
        source: input
        description: Inclusive start of the coverage interval.
      - name: end_utc
        type: datetime
        source: input
        description: Exclusive end of the coverage interval; must be strictly after start_utc. Coverage intervals carry a mandatory 30-minute handoff buffer on BOTH sides, so two windows for the same practice collide unless separated by >= 30 minutes.
      - name: coverage_kind
        type: enum
        source: input
        description: Contracted coverage flavour for this window.
        constraints: "enum: {NIGHTS, WEEKEND, HOLIDAY, OVERFLOW}"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; only ACTIVE windows satisfy the after-hours intake coverage check.
        default: DRAFT
        constraints: "enum: {DRAFT, ACTIVE, EXPIRED, BLOCKED}"
      - name: suspend_reason
        type: string
        source: system
        description: Free-text reason stamped when a DRAFT window is BLOCKED by a practice compliance cascade; null otherwise.
        default: null

  # --------------------------------------------------------------------------
  - name: Patient
    parent: Practice
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; taken from the path segment of POST /practices/{id}/patients. A call may only be matched to a patient of the same practice.
      - name: full_name
        type: string
        source: input
        description: Patient's legal name as recorded by the practice.
        constraints: "1..120 chars"
      - name: dob
        type: string
        source: input
        description: Date of birth (YYYY-MM-DD); sole source of dob-derived age in the CONFIRMED acuity variant.
        constraints: "^\\d{4}-\\d{2}-\\d{2}$"
      - name: sex
        type: enum
        source: input
        description: Recorded sex, used only to gate whether pregnancy_status may be non-NOT_APPLICABLE.
        constraints: "enum: {FEMALE, MALE, UNKNOWN}"
      - name: pregnancy_status
        type: enum
        source: input
        description: Practice-recorded pregnancy status; sole source of the pregnancy modifier in the PROVISIONAL acuity variant.
        default: NOT_APPLICABLE
        constraints: "enum: {NOT_APPLICABLE, NOT_PREGNANT, PREGNANT, POSTPARTUM_6W}"
      - name: phone
        type: string
        source: input
        description: Callback number on file; matched by GET /practices/{id}/patients?phone=.
        constraints: "1..32 chars"
      - name: mrn
        type: string
        source: input
        description: Practice medical record number; when supplied it is unique within the practice.
        default: null

  # --------------------------------------------------------------------------
  - name: SymptomProtocol
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Short protocol code (e.g. ABDPAIN); globally unique.
        constraints: "^[A-Z0-9_]{3,20}$"
      - name: title
        type: string
        source: input
        description: Human-readable protocol title.
        constraints: "1..120 chars"
      - name: base_severity
        type: integer
        source: input
        description: Baseline acuity points contributed by the protocol before any modifier.
        constraints: "0..100"
      - name: min_age_years
        type: integer
        source: input
        description: Inclusive lower bound of the age band this protocol may be applied to.
        constraints: "0..120"
      - name: max_age_years
        type: integer
        source: input
        description: Inclusive upper bound of the age band this protocol may be applied to; must be >= min_age_years.
        constraints: "0..120"
      - name: pregnancy_sensitive
        type: boolean
        source: input
        description: When false the pregnancy modifier is always 0 points regardless of pregnancy status.
      - name: emergency_override
        type: boolean
        source: input
        description: When true, any assessment with red_flag_count >= 1 is forced to the EMERGENCY_911 band irrespective of the acuity score.
      - name: min_disposition_level
        type: enum
        source: input
        description: Protocol floor; the recommended level can never be less severe than this level.
        constraints: "enum: {EMERGENCY_911, ED_NOW, URGENT_CARE_24H, OFFICE_APPT_72H, HOME_CARE}"
      - name: infant_modifier_points
        type: integer
        source: input
        description: Acuity points added when the age used by the assessment is strictly less than 1 year.
        default: 20
        constraints: "0..40"
      - name: status
        type: enum
        source: system
        description: Publication state; only ACTIVE protocols may be selected for a new assessment.
        default: ACTIVE
        constraints: "enum: {ACTIVE, RETIRED}"

  # --------------------------------------------------------------------------
  - name: TriageCall
    parent: null
    common_fields: true
    fields:
      - name: practice_id
        type: string
        source: input
        description: FK -> Practice.id; the practice on whose behalf this call is answered.
      - name: patient_id
        type: string
        source: system
        description: FK -> Patient.id; null until POST /triage-calls/{id}/match-patient succeeds.
        default: null
      - name: caller_name
        type: string
        source: input
        description: Name of the person on the line (may differ from the patient).
        constraints: "1..120 chars"
      - name: caller_phone
        type: string
        source: input
        description: Number the caller can be reached back on.
        constraints: "1..32 chars"
      - name: caller_relationship
        type: enum
        source: input
        description: Relationship of the caller to the patient; PARENT_GUARDIAN and HEALTHCARE_PROXY are the only relationships that can supply guardian consent.
        constraints: "enum: {SELF, PARENT_GUARDIAN, SPOUSE, CAREGIVER, HEALTHCARE_PROXY, OTHER}"
      - name: caller_state_code
        type: string
        source: input
        description: Two-letter US state the caller is physically located in; the licensure jurisdiction for every nurse touching this call.
        constraints: "^[A-Z]{2}$"
      - name: reason_text
        type: string
        source: input
        description: Caller's stated reason for calling, verbatim.
        constraints: "1..500 chars"
      - name: status
        type: enum
        source: system
        description: Call lifecycle state.
        default: INTAKE
        constraints: "enum: {INTAKE, IDENTIFIED, CONSENTED, ASSIGNED, ASSESSING, DISPOSITIONED, CLOSED, ABANDONED}"
      - name: is_after_hours
        type: boolean
        source: computed
        description: Computed once at intake from the logical clock against the practice's office hours and weekend flag; never recomputed afterwards.
      - name: match_method
        type: enum
        source: system
        description: How the caller was matched to a patient record; null until matched.
        default: null
        constraints: "enum: {DOB_AND_NAME, PHONE_AND_NAME, MRN}"
      - name: match_confidence_pct
        type: integer
        source: system
        description: Identity-match confidence recorded by the intake agent; null until matched.
        default: null
        constraints: "0..100"
      - name: consent_type
        type: enum
        source: system
        description: Consent basis recorded for this call; null until consent is captured.
        default: null
        constraints: "enum: {PATIENT_SELF, GUARDIAN, HEALTHCARE_PROXY}"
      - name: consent_given_by
        type: string
        source: system
        description: Name of the person who granted consent; null until consent is captured.
        default: null
      - name: consent_recorded_at
        type: datetime
        source: system
        description: Logical-clock instant at which consent was captured; null until consent is captured.
        default: null
      - name: recording_reference
        type: string
        source: system
        description: Voice-recording locator supplied when the practice requires recorded consent; null otherwise.
        default: null
      - name: assigned_nurse_id
        type: string
        source: system
        description: FK -> Nurse.id; the nurse chosen by the assignment selector, null before assignment and after abandonment is irrelevant (retained for audit).
        default: null
      - name: assigned_at
        type: datetime
        source: system
        description: Logical-clock instant the nurse assignment succeeded; null before assignment.
        default: null
      - name: deferred_assignment_count
        type: integer
        source: computed
        description: Number of times an assignment attempt on this call found an empty eligible-nurse pool.
        default: 0
      - name: requires_warm_transfer
        type: boolean
        source: computed
        description: Set true when the call's live disposition has final_level == EMERGENCY_911; reset to false when that disposition is voided or overridden to a less severe level.
        default: false
      - name: warm_transfer_completed_at
        type: datetime
        source: system
        description: Logical-clock instant a WarmTransfer for this call reached HANDOFF_COMPLETE; null otherwise.
        default: null
      - name: handle_minutes
        type: integer
        source: system
        description: Nurse-attested wall time spent on the call, supplied at completion; reset to null on reopen.
        default: null
        constraints: "1..240"
      - name: billable_minutes
        type: integer
        source: computed
        description: handle_minutes rounded UP to the next multiple of 5 at completion; reset to 0 on reopen.
        default: 0
      - name: advice_fee_cents
        type: integer
        source: computed
        description: Per-call advice fee in whole cents, rounded once at completion (round_half_up); reset to 0 on reopen.
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the call was completed; retained after reopen to bound the 72-hour reopen window.
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times this call has been reopened after completion.
        default: 0
      - name: abandon_reason
        type: string
        source: system
        description: Reason recorded when the caller disconnects before a disposition is final; null unless status == ABANDONED.
        default: null

  # --------------------------------------------------------------------------
  - name: ProtocolAssessment
    parent: TriageCall
    common_fields: true
    fields:
      - name: call_id
        type: string
        source: input
        description: FK -> TriageCall.id; taken from the path segment of POST /triage-calls/{id}/assessments.
      - name: protocol_id
        type: string
        source: input
        description: FK -> SymptomProtocol.id; the protocol the nurse selected for this assessment.
      - name: confirmation_mode
        type: enum
        source: input
        description: Selects the acuity variant. PROVISIONAL scores from the caller-stated age and the practice-recorded pregnancy status; CONFIRMED scores from the patient's dob against the logical clock and the nurse-confirmed pregnancy status.
        constraints: "enum: {PROVISIONAL, CONFIRMED}"
      - name: stated_age_years
        type: integer
        source: input
        description: Age the caller stated on the line; required when confirmation_mode == PROVISIONAL, ignored when CONFIRMED.
        default: null
        constraints: "0..120"
      - name: confirmed_pregnancy_status
        type: enum
        source: input
        description: Pregnancy status the nurse confirmed with the caller; required when confirmation_mode == CONFIRMED, ignored when PROVISIONAL.
        default: null
        constraints: "enum: {NOT_APPLICABLE, NOT_PREGNANT, PREGNANT, POSTPARTUM_6W}"
      - name: red_flag_count
        type: integer
        source: input
        description: Number of protocol red flags the caller answered yes to.
        constraints: "0..10"
      - name: age_years_used
        type: integer
        source: computed
        description: The age actually used for scoring — stated_age_years in PROVISIONAL mode, full years elapsed from Patient.dob to date(clock) in CONFIRMED mode.
      - name: pregnancy_status_used
        type: enum
        source: computed
        description: The pregnancy status actually used for scoring — Patient.pregnancy_status in PROVISIONAL mode, confirmed_pregnancy_status in CONFIRMED mode.
        constraints: "enum: {NOT_APPLICABLE, NOT_PREGNANT, PREGNANT, POSTPARTUM_6W}"
      - name: age_modifier_points
        type: integer
        source: computed
        description: Age band contribution to the acuity score.
      - name: pregnancy_modifier_points
        type: integer
        source: computed
        description: Pregnancy contribution to the acuity score; always 0 when the protocol is not pregnancy_sensitive.
      - name: red_flag_points
        type: integer
        source: computed
        description: Capped red-flag contribution to the acuity score.
      - name: acuity_score
        type: integer
        source: computed
        description: Final 0..100 acuity score for this assessment.
        constraints: "0..100"
      - name: status
        type: enum
        source: system
        description: Only one ACTIVE assessment may exist per call; creating a new one supersedes the previous.
        default: ACTIVE
        constraints: "enum: {ACTIVE, SUPERSEDED}"

  # --------------------------------------------------------------------------
  - name: Disposition
    parent: TriageCall
    common_fields: true
    fields:
      - name: call_id
        type: string
        source: input
        description: FK -> TriageCall.id; the call this disposition resolves.
      - name: assessment_id
        type: string
        source: input
        description: FK -> ProtocolAssessment.id; must be the call's ACTIVE assessment at creation time.
      - name: determined_by_nurse_id
        type: string
        source: system
        description: FK -> Nurse.id; X-User-ID of the TriageNurse that created this disposition. Segregation of duties bars this nurse from verifying the resulting callback.
      - name: overridden_by_nurse_id
        type: string
        source: system
        description: FK -> Nurse.id; X-User-ID of the ChargeNurse that de-escalated this disposition, null unless advice_status == OVERRIDDEN.
        default: null
      - name: recommended_level
        type: enum
        source: computed
        description: Level the protocol routing produced from the assessment; never editable.
        constraints: "enum: {EMERGENCY_911, ED_NOW, URGENT_CARE_24H, OFFICE_APPT_72H, HOME_CARE}"
      - name: final_level
        type: enum
        source: input
        description: Level actually given to the caller; equals recommended_level unless documented as an override.
        constraints: "enum: {EMERGENCY_911, ED_NOW, URGENT_CARE_24H, OFFICE_APPT_72H, HOME_CARE}"
      - name: is_override
        type: boolean
        source: computed
        description: True when final_level != recommended_level at any point in this disposition's life.
        default: false
      - name: override_reason_code
        type: enum
        source: system
        description: Structured override justification; null when is_override is false.
        default: null
        constraints: "enum: {CALLER_REFUSED_ED, TRANSPORT_UNAVAILABLE, CLINICIAN_DIRECTED, PROTOCOL_MISMATCH, LANGUAGE_BARRIER}"
      - name: override_narrative
        type: string
        source: system
        description: Free-text override documentation; must be at least 40 characters when supplied.
        default: null
        constraints: ">= 40 chars when present"
      - name: requires_callback
        type: boolean
        source: computed
        description: True unless final_level == HOME_CARE and the call is not after-hours; recomputed on override.
      - name: advice_status
        type: enum
        source: system
        description: First of two independent state dimensions on this row — the advice lifecycle.
        default: AUTHORIZED
        constraints: "enum: {AUTHORIZED, OVERRIDDEN, VOIDED}"
      - name: audit_status
        type: enum
        source: system
        description: Second of two independent state dimensions on this row — the outcome-audit lifecycle, which advances independently of advice_status.
        default: AWAITING_OUTCOME
        constraints: "enum: {AWAITING_OUTCOME, OUTCOME_RECORDED, CONCORDANT_CLOSED, VARIANCE_ESCALATED}"
      - name: callback_verified_at
        type: datetime
        source: system
        description: Logical-clock instant this disposition's callback was verified; null until then.
        default: null

  # --------------------------------------------------------------------------
  - name: WarmTransfer
    parent: TriageCall
    common_fields: true
    fields:
      - name: call_id
        type: string
        source: input
        description: FK -> TriageCall.id; taken from the path segment of POST /triage-calls/{id}/warm-transfers.
      - name: psap_center_code
        type: string
        source: input
        description: Identifier of the public-safety answering point being warm-transferred to.
        constraints: "^[A-Z0-9-]{3,20}$"
      - name: location_source
        type: enum
        source: input
        description: Provenance of the captured location.
        constraints: "enum: {CALLER_STATED, DEVICE_GPS, PRACTICE_RECORD}"
      - name: location_address_line
        type: string
        source: input
        description: Street address captured for dispatch.
        constraints: "1..200 chars"
      - name: location_state_code
        type: string
        source: input
        description: Two-letter state of the captured location; must equal TriageCall.caller_state_code.
        constraints: "^[A-Z]{2}$"
      - name: location_lat
        type: number
        source: input
        description: Captured latitude in decimal degrees.
        constraints: "-90.0 .. 90.0"
      - name: location_lng
        type: number
        source: input
        description: Captured longitude in decimal degrees.
        constraints: "-180.0 .. 180.0"
      - name: callback_number
        type: string
        source: input
        description: Number dispatch can call back on.
        constraints: "1..32 chars"
      - name: location_verified_by
        type: string
        source: system
        description: Name of the person who read the location back for verification; null before LOCATION_CONFIRMED.
        default: null
      - name: location_confidence_pct
        type: integer
        source: system
        description: Read-back confidence; must be >= 75 to confirm the location.
        default: null
        constraints: "0..100"
      - name: psap_incident_number
        type: string
        source: system
        description: Incident number returned by the PSAP on acceptance; null unless status is ACCEPTED_BY_PSAP or HANDOFF_COMPLETE.
        default: null
      - name: status
        type: enum
        source: system
        description: Warm-transfer lifecycle; branches at the PSAP response.
        default: INITIATED
        constraints: "enum: {INITIATED, LOCATION_CONFIRMED, ACCEPTED_BY_PSAP, REJECTED_BY_PSAP, HANDOFF_COMPLETE}"

  # --------------------------------------------------------------------------
  - name: CallbackTask
    parent: Disposition
    common_fields: true
    fields:
      - name: disposition_id
        type: string
        source: system
        description: FK -> Disposition.id; the disposition whose advice this callback verifies.
      - name: practice_id
        type: string
        source: system
        description: FK -> Practice.id; denormalised from the disposition's call so practice callback lists are a single filtered read.
      - name: assigned_nurse_id
        type: string
        source: system
        description: FK -> Nurse.id; copied from Disposition.determined_by_nurse_id at creation. This nurse records attempts but is barred from verifying.
      - name: risk_class
        type: enum
        source: computed
        description: Callback urgency class derived from the disposition level and the call's after-hours flag.
        constraints: "enum: {HIGH_RISK, STANDARD, NEXT_DAY}"
      - name: due_by_utc
        type: datetime
        source: computed
        description: Deadline derived from the disposition's created_at and risk_class; NEXT_DAY tasks land on the practice's next office-open instant.
      - name: attempt_count
        type: integer
        source: computed
        description: Number of unsuccessful contact attempts recorded so far.
        default: 0
      - name: max_attempts
        type: integer
        source: computed
        description: 3 for HIGH_RISK, 2 otherwise; the task expires when attempt_count reaches this value.
      - name: last_attempt_outcome
        type: enum
        source: system
        description: Outcome of the most recent attempt; null before the first attempt.
        default: null
        constraints: "enum: {NO_ANSWER, BUSY, REACHED}"
      - name: patient_condition
        type: enum
        source: system
        description: Condition the caller reported at verification; null until verified.
        default: null
        constraints: "enum: {IMPROVED, UNCHANGED, WORSENED}"
      - name: advice_followed
        type: boolean
        source: system
        description: Whether the caller followed the disposition advice; null until verified.
        default: null
      - name: verifier_attestation
        type: string
        source: system
        description: Verifying nurse's attestation text; null until verified.
        default: null
      - name: verified_by_nurse_id
        type: string
        source: system
        description: FK -> Nurse.id; X-User-ID of the nurse that verified this callback, null until verified.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of verification; null until verified.
        default: null
      - name: status
        type: enum
        source: system
        description: Callback lifecycle; branches at verification and self-loops across failed attempts.
        default: PENDING
        constraints: "enum: {PENDING, ATTEMPTED, REACHED, VERIFIED, ESCALATED, EXPIRED, CANCELLED}"

  # --------------------------------------------------------------------------
  - name: ComplianceAuditRecord
    parent: Disposition
    common_fields: false
    fields:
      - name: disposition_id
        type: string
        source: input
        description: FK -> Disposition.id; taken from the path segment of POST /dispositions/{id}/audit-records.
      - name: auditor_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceAuditor that filed this record; never compared against any entity id.
      - name: reported_outcome
        type: enum
        source: input
        description: What actually happened to the patient, per the outcome feed.
        constraints: "enum: {ED_ADMITTED, ED_TREATED_RELEASED, URGENT_CARE_VISIT, OFFICE_VISIT, SELF_CARE_RESOLVED}"
      - name: outcome_source
        type: enum
        source: input
        description: Provenance of the reported outcome.
        constraints: "enum: {EHR_CLAIM, PATIENT_REPORT, ED_FEED}"
      - name: outcome_observed_at
        type: datetime
        source: input
        description: When the outcome was observed; must be at or after the disposition's created_at.
      - name: outcome_ordinal
        type: integer
        source: computed
        description: Severity ordinal of reported_outcome on the shared 1..5 scale.
        constraints: "1..5"
      - name: disposition_level_ordinal
        type: integer
        source: computed
        description: Severity ordinal of the disposition's final_level at the moment the record was filed.
        constraints: "1..5"
      - name: variance_class
        type: enum
        source: computed
        description: CONCORDANT when the ordinals match, UNDERTRIAGE when the outcome was more severe than the advice, OVERTRIAGE when less severe.
        constraints: "enum: {CONCORDANT, UNDERTRIAGE, OVERTRIAGE}"
      - name: variance_severity_points
        type: integer
        source: computed
        description: Ten points per ordinal step of divergence.

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  # --------------------------------------------------------------------------
  # Cyclic: DISPOSITIONED -> ASSESSING (re-assessment loop) and
  #         CLOSED -> DISPOSITIONED (reopen loop).
  - entity: TriageCall
    state_field: status
    initial_state: INTAKE
    terminal_states: [ABANDONED]
    transitions:

      - from: INTAKE
        to: IDENTIFIED
        trigger: "POST /triage-calls/{id}/match-patient"
        actor: IntakeAgent
        preconditions:
          - "TriageCall.status == INTAKE"
          - "Patient with id == body.patient_id exists"
          - "Patient.practice_id == TriageCall.practice_id"
          - "body.match_confidence_pct >= 80 OR body.match_method == MRN"
        side_effects:
          - "sets TriageCall.patient_id, TriageCall.match_method, TriageCall.match_confidence_pct"
          - "increments TriageCall.version by 1 and refreshes TriageCall.updated_at"

      - from: IDENTIFIED
        to: CONSENTED
        trigger: "POST /triage-calls/{id}/consent"
        actor: IntakeAgent
        preconditions:
          - "TriageCall.status == IDENTIFIED"
          - "if full years elapsed from Patient.dob to date(clock) < 18 then body.consent_type IN {GUARDIAN, HEALTHCARE_PROXY}"
          - "if Practice.consent_recording_required == true then body.recording_reference is present and non-empty"
        side_effects:
          - "sets TriageCall.consent_type, TriageCall.consent_given_by, TriageCall.recording_reference"
          - "sets TriageCall.consent_recorded_at = logical clock"
          - "increments TriageCall.version by 1"

      - from: CONSENTED
        to: ASSIGNED
        trigger: "POST /triage-calls/{id}/assign-nurse"
        actor: IntakeAgent | ChargeNurse
        preconditions:
          - "TriageCall.status == CONSENTED"
          - "calculations.nurse_assignment_selector candidate set is non-empty"
          - "if body.preferred_nurse_id is present, that Nurse satisfies every clause of the selector eligibility filter and Nurse.active_call_load < Nurse.max_concurrent_calls"
        side_effects:
          - "sets TriageCall.assigned_nurse_id to the selector winner (or to body.preferred_nurse_id when supplied)"
          - "sets TriageCall.assigned_at = logical clock"
          - "increments Nurse.active_call_load by 1 on the winning nurse (conserved counter, see calculations.nurse_load_conservation)"
          - "increments TriageCall.version by 1"

      - from: CONSENTED
        to: CONSENTED
        trigger: "POST /triage-calls/{id}/assign-nurse when the eligible-nurse candidate set is empty"
        actor: IntakeAgent | ChargeNurse
        preconditions:
          - "TriageCall.status == CONSENTED"
          - "calculations.nurse_assignment_selector candidate set is empty"
        side_effects:
          - "increments TriageCall.deferred_assignment_count by 1"
          - "increments TriageCall.version by 1"
          - "leaves TriageCall.status, TriageCall.assigned_nurse_id and every Nurse counter untouched"
        note: |
          The request answers 409 ERR_NO_LICENSED_NURSE_AVAILABLE, yet the failed
          attempt is still recorded on the call: deferred_assignment_count and
          version both advance. This is the only rejected request in the scaffold
          that mutates state, and it is deliberate — the advice line must be able
          to prove how many times a caller waited for a licensed nurse.

      - from: ASSIGNED
        to: ASSESSING
        trigger: "POST /triage-calls/{id}/assessments"
        actor: TriageNurse
        preconditions:
          - "TriageCall.status == ASSIGNED"
          - "X-User-ID == TriageCall.assigned_nurse_id"
          - "SymptomProtocol.status == ACTIVE"
          - "SymptomProtocol.min_age_years <= ProtocolAssessment.age_years_used <= SymptomProtocol.max_age_years"
        side_effects:
          - "creates ProtocolAssessment with status ACTIVE and every computed acuity field per calculations.assessment_acuity_score"
          - "increments TriageCall.version by 1"

      - from: DISPOSITIONED
        to: ASSESSING
        trigger: "POST /triage-calls/{id}/assessments (re-assessment loop)"
        actor: TriageNurse
        preconditions:
          - "TriageCall.status == DISPOSITIONED"
          - "X-User-ID == TriageCall.assigned_nurse_id"
          - "SymptomProtocol.status == ACTIVE"
          - "SymptomProtocol.min_age_years <= ProtocolAssessment.age_years_used <= SymptomProtocol.max_age_years"
        side_effects:
          - "HOP 1 — creates the new ProtocolAssessment with status ACTIVE and flips the call's previously ACTIVE ProtocolAssessment to SUPERSEDED"
          - "HOP 2 — because that assessment became SUPERSEDED, every Disposition whose assessment_id points at it and whose advice_status IN {AUTHORIZED, OVERRIDDEN} flips advice_status to VOIDED (and, when it had set TriageCall.requires_warm_transfer, clears that flag, decrements Nurse.pending_high_risk_count by 1 and restores Nurse.intake_eligibility to ON_ROTATION once the count drops below Nurse.high_risk_cap)"
          - "HOP 3 — because that Disposition became VOIDED, every CallbackTask with disposition_id == it and status IN {PENDING, ATTEMPTED, REACHED} flips status to CANCELLED"
          - "HOP 4 — because those CallbackTask rows left the open set, Practice.open_callback_count is decremented by one per cancelled task"
          - "sets TriageCall.status = ASSESSING and increments TriageCall.version by 1"
        note: |
          This is the scaffold's deepest cascade: one POST mutates
          ProtocolAssessment -> Disposition -> CallbackTask -> Practice, each hop
          caused by the previous hop rather than by the original request.

      - from: ASSESSING
        to: DISPOSITIONED
        trigger: "POST /dispositions"
        actor: TriageNurse
        preconditions:
          - "TriageCall.status == ASSESSING"
          - "X-User-ID == TriageCall.assigned_nurse_id"
          - "ProtocolAssessment.id == body.assessment_id has call_id == body.call_id and status == ACTIVE"
          - "body.expected_call_version == TriageCall.version (see concurrency_rules.disposition-create-stale-call)"
          - "the acting Nurse has a NurseLicense with state_code == TriageCall.caller_state_code and status == ACTIVE"
          - "if body.final_level is strictly less severe than the computed recommended_level, the request is rejected (de-escalation is a ChargeNurse-only operation on an existing disposition)"
          - "if body.final_level != recommended_level, body.override_reason_code is present and body.override_narrative is at least 40 characters"
        side_effects:
          - "creates Disposition with advice_status AUTHORIZED, audit_status AWAITING_OUTCOME, determined_by_nurse_id = X-User-ID, recommended_level per calculations.disposition_recommendation and requires_callback per calculations.callback_requirement"
          - "if Disposition.requires_callback == true, creates one CallbackTask with status PENDING, risk_class / due_by_utc / max_attempts per calculations.callback_requirement, practice_id copied from TriageCall.practice_id and assigned_nurse_id copied from Disposition.determined_by_nurse_id, then increments Practice.open_callback_count by 1"
          - "if Disposition.final_level == EMERGENCY_911 — HOP 1 sets TriageCall.requires_warm_transfer = true; HOP 2, because that flag turned on, increments Nurse.pending_high_risk_count by 1; HOP 3, because that count reached Nurse.high_risk_cap, sets Nurse.intake_eligibility = OFF_ROTATION which removes the nurse from the assignment selector's candidate set"
          - "sets TriageCall.status = DISPOSITIONED and increments TriageCall.version by 1"

      - from: DISPOSITIONED
        to: CLOSED
        trigger: "POST /triage-calls/{id}/complete"
        actor: TriageNurse
        preconditions:
          - "TriageCall.status == DISPOSITIONED"
          - "X-User-ID == TriageCall.assigned_nurse_id"
          - "if TriageCall.requires_warm_transfer == true then a WarmTransfer with call_id == this call and status == HANDOFF_COMPLETE exists"
          - "1 <= body.handle_minutes <= 240"
        side_effects:
          - "sets TriageCall.handle_minutes, TriageCall.billable_minutes and TriageCall.advice_fee_cents per calculations.call_advice_fee"
          - "credits Practice.billed_advice_minutes_total by TriageCall.billable_minutes and Practice.advice_fee_accrued_cents by TriageCall.advice_fee_cents"
          - "sets TriageCall.closed_at = logical clock"
          - "decrements Nurse.active_call_load by 1"
          - "if TriageCall.requires_warm_transfer == true, decrements Nurse.pending_high_risk_count by 1 and restores Nurse.intake_eligibility to ON_ROTATION when the count falls below Nurse.high_risk_cap"
          - "increments TriageCall.version by 1"

      - from: CLOSED
        to: DISPOSITIONED
        trigger: "POST /triage-calls/{id}/reopen (compensating action for complete)"
        actor: ChargeNurse
        preconditions:
          - "TriageCall.status == CLOSED"
          - "logical clock < TriageCall.closed_at + 72 hours"
        side_effects:
          - "debits Practice.billed_advice_minutes_total by exactly TriageCall.billable_minutes and Practice.advice_fee_accrued_cents by exactly TriageCall.advice_fee_cents (leaving both ledgers at their pre-completion values)"
          - "resets TriageCall.handle_minutes to null, TriageCall.billable_minutes to 0 and TriageCall.advice_fee_cents to 0"
          - "increments TriageCall.reopen_count by 1"
          - "increments Nurse.active_call_load by 1 (the call is live again)"
          - "if TriageCall.requires_warm_transfer == true, increments Nurse.pending_high_risk_count by 1 and re-evaluates Nurse.intake_eligibility against Nurse.high_risk_cap"
          - "increments TriageCall.version by 1"
        note: "TriageCall.closed_at is retained (not cleared) so the 72-hour reopen window remains anchored to the original completion."

      - from: [INTAKE, IDENTIFIED, CONSENTED, ASSIGNED, ASSESSING, DISPOSITIONED]
        to: ABANDONED
        trigger: "POST /triage-calls/{id}/abandon"
        actor: IntakeAgent | ChargeNurse
        preconditions:
          - "TriageCall.status IN {INTAKE, IDENTIFIED, CONSENTED, ASSIGNED, ASSESSING, DISPOSITIONED}"
        side_effects:
          - "sets TriageCall.abandon_reason and TriageCall.status = ABANDONED"
          - "if TriageCall.assigned_nurse_id is not null, decrements Nurse.active_call_load by 1 (compensating action for assign-nurse, see calculations.nurse_load_conservation)"
          - "HOP 1 — every Disposition with call_id == this call and advice_status IN {AUTHORIZED, OVERRIDDEN} flips advice_status to VOIDED"
          - "HOP 2 — because those Dispositions became VOIDED, every CallbackTask with a matching disposition_id and status IN {PENDING, ATTEMPTED, REACHED} flips to CANCELLED and Practice.open_callback_count is decremented once per cancelled task"
          - "if TriageCall.requires_warm_transfer == true, decrements Nurse.pending_high_risk_count by 1 and re-evaluates Nurse.intake_eligibility"
          - "increments TriageCall.version by 1"

  # --------------------------------------------------------------------------
  # Parallel dimension 1 of 2 on the SAME Disposition row.
  - entity: Disposition
    state_field: advice_status
    initial_state: AUTHORIZED
    terminal_states: [VOIDED]
    transitions:
      - from: AUTHORIZED
        to: OVERRIDDEN
        trigger: "POST /dispositions/{id}/override"
        actor: ChargeNurse
        preconditions:
          - "Disposition.advice_status == AUTHORIZED"
          - "TriageCall.status == DISPOSITIONED"
          - "Disposition.recommended_level != EMERGENCY_911 OR body.final_level == EMERGENCY_911 (de-escalating away from EMERGENCY_911 is forbidden outright)"
          - "abs(LEVEL_ORDINAL[body.final_level] - LEVEL_ORDINAL[Disposition.final_level]) <= 1"
          - "body.override_reason_code is present and body.override_narrative is at least 40 characters"
        side_effects:
          - "sets Disposition.final_level = body.final_level, Disposition.is_override = true, Disposition.override_reason_code, Disposition.override_narrative and Disposition.overridden_by_nurse_id = X-User-ID"
          - "recomputes Disposition.requires_callback per calculations.callback_requirement against the new final_level"
          - "if the new final_level is less severe and the existing CallbackTask.status IN {PENDING, ATTEMPTED, REACHED}, that task flips to CANCELLED, Practice.open_callback_count is decremented, and — when the recomputed requires_callback is still true — a replacement CallbackTask is created with the risk_class and due_by_utc of the NEW level and Practice.open_callback_count is incremented again"
          - "if Disposition.final_level was EMERGENCY_911 and the new level is not, sets TriageCall.requires_warm_transfer = false, decrements Nurse.pending_high_risk_count by 1 on Disposition.determined_by_nurse_id and restores that nurse's intake_eligibility when the count falls below high_risk_cap"
          - "increments Disposition.version by 1 and TriageCall.version by 1"

      - from: [AUTHORIZED, OVERRIDDEN]
        to: VOIDED
        trigger: "system: the Disposition's ProtocolAssessment was superseded by POST /triage-calls/{id}/assessments, or the call was abandoned by POST /triage-calls/{id}/abandon"
        actor: system
        preconditions:
          - "Disposition.advice_status IN {AUTHORIZED, OVERRIDDEN}"
          - "the causing hop has already flipped ProtocolAssessment.status to SUPERSEDED, or TriageCall.status to ABANDONED"
        side_effects:
          - "sets Disposition.advice_status = VOIDED"
          - "cascades to this disposition's CallbackTask rows (status IN {PENDING, ATTEMPTED, REACHED} -> CANCELLED) and decrements Practice.open_callback_count once per cancelled task"
          - "if this disposition had set TriageCall.requires_warm_transfer, clears the flag and decrements Nurse.pending_high_risk_count by 1"
          - "increments Disposition.version by 1"
        note: "advice_status VOIDED does NOT touch audit_status — the two dimensions are independent, which is why an already-audited disposition can still be voided and still counts in the compliance summary."

  # --------------------------------------------------------------------------
  # Parallel dimension 2 of 2 on the SAME Disposition row.
  - entity: Disposition
    state_field: audit_status
    initial_state: AWAITING_OUTCOME
    terminal_states: [CONCORDANT_CLOSED, VARIANCE_ESCALATED]
    transitions:
      - from: AWAITING_OUTCOME
        to: OUTCOME_RECORDED
        trigger: "POST /dispositions/{id}/audit-records"
        actor: ComplianceAuditor
        preconditions:
          - "Disposition.advice_status IN {AUTHORIZED, OVERRIDDEN}"
          - "Disposition.audit_status == AWAITING_OUTCOME"
          - "if Disposition.requires_callback == true, the CallbackTask with disposition_id == this disposition has status IN {VERIFIED, ESCALATED, EXPIRED, CANCELLED}"
          - "body.outcome_observed_at >= Disposition.created_at"
        side_effects:
          - "creates the immutable ComplianceAuditRecord with outcome_ordinal, disposition_level_ordinal, variance_class and variance_severity_points per calculations.outcome_variance_classification"
          - "sets Disposition.audit_status = OUTCOME_RECORDED"
          - "increments Disposition.version by 1"

      - from: OUTCOME_RECORDED
        to: CONCORDANT_CLOSED
        trigger: "system: evaluated inside the same POST /dispositions/{id}/audit-records request"
        actor: system
        preconditions:
          - "the just-created ComplianceAuditRecord.variance_class == CONCORDANT"
        side_effects:
          - "sets Disposition.audit_status = CONCORDANT_CLOSED"

      - from: OUTCOME_RECORDED
        to: VARIANCE_ESCALATED
        trigger: "system: evaluated inside the same POST /dispositions/{id}/audit-records request"
        actor: system
        preconditions:
          - "the just-created ComplianceAuditRecord.variance_class == UNDERTRIAGE"
        side_effects:
          - "HOP 1 — sets Disposition.audit_status = VARIANCE_ESCALATED"
          - "HOP 2 — because the disposition entered VARIANCE_ESCALATED, increments Practice.open_variance_count by 1"
          - "HOP 3 — because open_variance_count reached Practice.variance_review_threshold, sets Practice.compliance_posture = UNDER_REVIEW"
          - "HOP 4 — because the practice posture became UNDER_REVIEW, every CoverageWindow with practice_id == that practice and status == DRAFT flips to BLOCKED with suspend_reason 'PRACTICE_UNDER_COMPLIANCE_REVIEW'"
        note: "OVERTRIAGE records leave audit_status at OUTCOME_RECORDED — only under-triage escalates."

      - from: AWAITING_OUTCOME
        to: VARIANCE_ESCALATED
        trigger: "system: this disposition's CallbackTask reached ESCALATED via POST /callback-tasks/{id}/verify, or a HIGH_RISK CallbackTask reached EXPIRED via POST /callback-tasks/{id}/attempts"
        actor: system
        preconditions:
          - "Disposition.audit_status == AWAITING_OUTCOME"
          - "the causing hop has already flipped the CallbackTask to ESCALATED, or to EXPIRED with risk_class == HIGH_RISK"
        side_effects:
          - "HOP 1 — sets Disposition.audit_status = VARIANCE_ESCALATED"
          - "HOP 2 — because the disposition entered VARIANCE_ESCALATED, increments Practice.open_variance_count by 1"
          - "HOP 3 — because open_variance_count reached Practice.variance_review_threshold, sets Practice.compliance_posture = UNDER_REVIEW"
          - "HOP 4 — because the practice posture became UNDER_REVIEW, every DRAFT CoverageWindow of that practice flips to BLOCKED"
          - "increments Disposition.version by 1"

  # --------------------------------------------------------------------------
  # Branching plus a self-loop across failed attempts.
  - entity: CallbackTask
    state_field: status
    initial_state: PENDING
    terminal_states: [VERIFIED, ESCALATED, EXPIRED, CANCELLED]
    transitions:
      - from: [PENDING, ATTEMPTED]
        to: ATTEMPTED
        trigger: "POST /callback-tasks/{id}/attempts with outcome IN {NO_ANSWER, BUSY}"
        actor: TriageNurse
        preconditions:
          - "CallbackTask.status IN {PENDING, ATTEMPTED}"
          - "X-User-ID == CallbackTask.assigned_nurse_id"
          - "CallbackTask.attempt_count + 1 < CallbackTask.max_attempts"
        side_effects:
          - "increments CallbackTask.attempt_count by 1 and sets last_attempt_outcome"
          - "increments CallbackTask.version by 1"
        note: "ATTEMPTED -> ATTEMPTED is a genuine self-loop: the second failed attempt on a HIGH_RISK task (max_attempts 3) leaves the status unchanged while the counter advances."

      - from: [PENDING, ATTEMPTED]
        to: REACHED
        trigger: "POST /callback-tasks/{id}/attempts with outcome == REACHED"
        actor: TriageNurse
        preconditions:
          - "CallbackTask.status IN {PENDING, ATTEMPTED}"
          - "X-User-ID == CallbackTask.assigned_nurse_id"
        side_effects:
          - "sets CallbackTask.last_attempt_outcome = REACHED and CallbackTask.status = REACHED"
          - "leaves CallbackTask.attempt_count unchanged (a reached call is not a failed attempt)"
          - "increments CallbackTask.version by 1"

      - from: [PENDING, ATTEMPTED]
        to: EXPIRED
        trigger: "POST /callback-tasks/{id}/attempts with outcome IN {NO_ANSWER, BUSY} exhausting max_attempts"
        actor: TriageNurse
        preconditions:
          - "CallbackTask.status IN {PENDING, ATTEMPTED}"
          - "X-User-ID == CallbackTask.assigned_nurse_id"
          - "CallbackTask.attempt_count + 1 >= CallbackTask.max_attempts"
        side_effects:
          - "increments CallbackTask.attempt_count by 1, sets last_attempt_outcome and sets status = EXPIRED"
          - "decrements Practice.open_callback_count by 1"
          - "if CallbackTask.risk_class == HIGH_RISK, drives the parent Disposition's audit_status AWAITING_OUTCOME -> VARIANCE_ESCALATED cascade (an unreachable high-risk caller is itself a compliance variance)"
          - "increments CallbackTask.version by 1"

      - from: REACHED
        to: VERIFIED
        trigger: "POST /callback-tasks/{id}/verify with patient_condition IN {IMPROVED, UNCHANGED}"
        actor: TriageNurse
        preconditions:
          - "CallbackTask.status == REACHED"
          - "X-User-ID != Disposition.determined_by_nurse_id (segregation of duties)"
          - "if CallbackTask.risk_class == HIGH_RISK then logical clock <= CallbackTask.due_by_utc"
        side_effects:
          - "sets patient_condition, advice_followed, verifier_attestation, verified_by_nurse_id = X-User-ID, verified_at = logical clock and status = VERIFIED"
          - "decrements Practice.open_callback_count by 1"
          - "sets Disposition.callback_verified_at = logical clock and increments Disposition.version by 1"
          - "increments CallbackTask.version by 1"

      - from: REACHED
        to: ESCALATED
        trigger: "POST /callback-tasks/{id}/verify with patient_condition == WORSENED"
        actor: TriageNurse
        preconditions:
          - "CallbackTask.status == REACHED"
          - "X-User-ID != Disposition.determined_by_nurse_id (segregation of duties)"
          - "if CallbackTask.risk_class == HIGH_RISK then logical clock <= CallbackTask.due_by_utc"
        side_effects:
          - "sets patient_condition = WORSENED, advice_followed, verifier_attestation, verified_by_nurse_id, verified_at and status = ESCALATED"
          - "decrements Practice.open_callback_count by 1 and increments Practice.escalated_callback_count by 1"
          - "HOP 1 — because the task became ESCALATED, the parent Disposition's audit_status moves AWAITING_OUTCOME -> VARIANCE_ESCALATED"
          - "HOP 2 — because that disposition entered VARIANCE_ESCALATED, Practice.open_variance_count is incremented by 1"
          - "HOP 3 — because open_variance_count reached Practice.variance_review_threshold, Practice.compliance_posture becomes UNDER_REVIEW"
          - "HOP 4 — because the posture became UNDER_REVIEW, every DRAFT CoverageWindow of that practice flips to BLOCKED"
          - "increments CallbackTask.version by 1"

      - from: [PENDING, ATTEMPTED, REACHED]
        to: CANCELLED
        trigger: "system: the parent Disposition's advice_status became VOIDED or was de-escalated by POST /dispositions/{id}/override"
        actor: system
        preconditions:
          - "CallbackTask.status IN {PENDING, ATTEMPTED, REACHED}"
        side_effects:
          - "sets CallbackTask.status = CANCELLED"
          - "decrements Practice.open_callback_count by 1"
          - "increments CallbackTask.version by 1"

  # --------------------------------------------------------------------------
  # Branching at the PSAP response, with divergent side-effect sets per branch.
  - entity: WarmTransfer
    state_field: status
    initial_state: INITIATED
    terminal_states: [REJECTED_BY_PSAP, HANDOFF_COMPLETE]
    transitions:
      - from: INITIATED
        to: LOCATION_CONFIRMED
        trigger: "POST /warm-transfers/{id}/confirm-location"
        actor: TriageNurse
        preconditions:
          - "WarmTransfer.status == INITIATED"
          - "X-User-ID == TriageCall.assigned_nurse_id for WarmTransfer.call_id"
          - "body.location_confidence_pct >= 75"
        side_effects:
          - "sets WarmTransfer.location_verified_by, WarmTransfer.location_confidence_pct and status = LOCATION_CONFIRMED"
          - "increments WarmTransfer.version by 1"

      - from: LOCATION_CONFIRMED
        to: ACCEPTED_BY_PSAP
        trigger: "POST /warm-transfers/{id}/psap-response with accepted == true"
        actor: IntakeAgent
        preconditions:
          - "WarmTransfer.status == LOCATION_CONFIRMED"
          - "body.psap_incident_number is present when body.accepted == true"
        side_effects:
          - "sets WarmTransfer.psap_incident_number and status = ACCEPTED_BY_PSAP"
          - "increments WarmTransfer.version by 1"

      - from: LOCATION_CONFIRMED
        to: REJECTED_BY_PSAP
        trigger: "POST /warm-transfers/{id}/psap-response with accepted == false"
        actor: IntakeAgent
        preconditions:
          - "WarmTransfer.status == LOCATION_CONFIRMED"
        side_effects:
          - "sets status = REJECTED_BY_PSAP and leaves WarmTransfer.psap_incident_number null"
          - "leaves TriageCall.requires_warm_transfer == true, so the call still cannot be completed until a fresh WarmTransfer reaches HANDOFF_COMPLETE"
          - "increments WarmTransfer.version by 1"
        note: "Divergent branch: acceptance advances toward handoff, rejection is terminal and re-opens the ERR_WARM_TRANSFER_ALREADY_OPEN slot so a second transfer may be initiated."

      - from: ACCEPTED_BY_PSAP
        to: HANDOFF_COMPLETE
        trigger: "POST /warm-transfers/{id}/complete-handoff"
        actor: TriageNurse
        preconditions:
          - "WarmTransfer.status == ACCEPTED_BY_PSAP"
          - "X-User-ID == TriageCall.assigned_nurse_id for WarmTransfer.call_id"
        side_effects:
          - "sets status = HANDOFF_COMPLETE"
          - "sets TriageCall.warm_transfer_completed_at = logical clock and increments TriageCall.version by 1"
          - "increments WarmTransfer.version by 1"

  # --------------------------------------------------------------------------
  - entity: CoverageWindow
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, BLOCKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /coverage-windows/{id}/activate"
        actor: PlatformAdmin | PracticeLiaison
        preconditions:
          - "CoverageWindow.status == DRAFT"
          - "Practice.compliance_posture == NORMAL"
        side_effects:
          - "sets CoverageWindow.status = ACTIVE, making the window count for the after-hours intake coverage check"
          - "increments CoverageWindow.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazily evaluated whenever the window is read via GET /practices/{id}/coverage-windows or whenever an intake coverage check runs, once logical clock >= CoverageWindow.end_utc"
        actor: system
        preconditions:
          - "CoverageWindow.status == ACTIVE"
          - "logical clock >= CoverageWindow.end_utc"
        side_effects:
          - "sets CoverageWindow.status = EXPIRED"
          - "increments CoverageWindow.version by 1"

      - from: DRAFT
        to: BLOCKED
        trigger: "system: Practice.compliance_posture became UNDER_REVIEW (final hop of the variance cascade)"
        actor: system
        preconditions:
          - "CoverageWindow.status == DRAFT"
          - "Practice.compliance_posture == UNDER_REVIEW"
        side_effects:
          - "sets CoverageWindow.status = BLOCKED and suspend_reason = 'PRACTICE_UNDER_COMPLIANCE_REVIEW'"
          - "increments CoverageWindow.version by 1"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================

concurrency_rules:
  - rule_id: disposition-create-stale-call
    parent_entity: TriageCall
    write_endpoint: "POST /dispositions"
    occ_field: "expected_call_version"
    description: |
      Creating a Disposition against a TriageCall whose version has advanced
      since the client last read it is rejected. A call legitimately accepts
      more than one Disposition over its life — the re-assessment loop
      (DISPOSITIONED -> ASSESSING) voids the previous one and the next POST
      /dispositions supersedes it — so a second create on an unchanged call
      state is a valid product operation rather than an invalid-state request.
      The OCC check on TriageCall.version is therefore the only thing that
      distinguishes "I am writing the disposition I reasoned about" from
      "the call moved under me". Any of the version-bumping side effects
      (match-patient, consent, assign-nurse, a new assessment, a ChargeNurse
      override, a deferred assignment attempt) invalidates a previously read
      version.
    error_id: ERR_STALE_CALL_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Table
# ============================================================================

calculations:

  # --------------------------------------------------------------------------
  - name: after_hours_determination
    entity: TriageCall
    field: is_after_hours
    algorithm_type: threshold
    description: |
      Decides whether an inbound call lands inside the practice's own office
      hours or inside the advice line's after-hours coverage obligation.
      Evaluated once, at POST /triage-calls, against the logical clock, and
      then frozen on the call for the life of the row (later clock advances
      never re-flip it).
    constants:
      WEEKEND_ISO_WEEKDAYS: [6, 7]
    formula: |
      minute_of_day       = clock.hour * 60 + clock.minute            # UTC
      open_minute         = parse_hhmm(Practice.office_open_utc_hhmm)
      close_minute        = parse_hhmm(Practice.office_close_utc_hhmm)
      is_weekend          = iso_weekday(date(clock)) IN {6, 7}
      is_after_hours      = (Practice.weekend_is_after_hours AND is_weekend)
                            OR NOT (open_minute <= minute_of_day < close_minute)
    precision: "boolean; the office-hours window is half-open [open_minute, close_minute)"
    worked_examples:
      - "clock 2026-08-03T14:30:00Z (Monday), open 13:00 close 22:00 -> minute_of_day 870 IN [780, 1320) and not a weekend -> is_after_hours == false"
      - "clock 2026-08-01T14:30:00Z (Saturday), same practice hours, weekend_is_after_hours true -> is_after_hours == true even though 14:30 is inside the weekday window"
      - "clock 2026-08-03T22:00:00Z (Monday) -> minute_of_day 1320 is NOT < close_minute 1320 -> is_after_hours == true (the close boundary is exclusive)"

  # --------------------------------------------------------------------------
  - name: intake_coverage_check
    entity: TriageCall
    algorithm_type: interval_merge
    description: |
      An after-hours call may only be taken on behalf of a practice while that
      practice has a live coverage authorization. In-hours calls need no
      coverage row at all, which makes this a conditional cross-entity gate:
      the same POST /triage-calls body succeeds or fails purely on the clock.
    formula: |
      if TriageCall.is_after_hours == false:
          coverage is not required -> pass
      else:
          eligible = CoverageWindow rows where
                       practice_id == body.practice_id
                       AND status == ACTIVE
                       AND start_utc <= clock < end_utc
                       # coverage_kind is contractual metadata (NIGHTS, WEEKEND,
                       # HOLIDAY, OVERFLOW) and does not narrow the check: any
                       # ACTIVE window of any kind satisfies coverage.
          if eligible is empty -> ERR_NO_ACTIVE_COVERAGE (409)
      # Lazy expiry runs first: any ACTIVE window with clock >= end_utc is
      # flipped to EXPIRED before the eligible set is computed, so an expired
      # window can never satisfy the check.
    precision: "coverage interval is half-open [start_utc, end_utc)"
    worked_examples:
      - "window ACTIVE of coverage_kind WEEKEND [2026-08-01T00:00:00Z, 2026-08-08T00:00:00Z), clock 2026-08-01T14:30:00Z -> pass"
      - "same window, clock 2026-08-08T00:00:00Z -> window lazily flips to EXPIRED and the after-hours intake is rejected with ERR_NO_ACTIVE_COVERAGE"
      - "no coverage row at all, clock 2026-08-03T14:30:00Z (in-hours) -> pass, because coverage is only required after hours"

  # --------------------------------------------------------------------------
  - name: license_status_derivation
    entity: NurseLicense
    field: status
    algorithm_type: threshold
    description: |
      NurseLicense is immutable (common_fields: false) so its status is never
      stored-and-mutated; it is derived on every read and on every eligibility
      evaluation from the logical clock.
    formula: |
      status = ACTIVE  if NurseLicense.expires_on >= date(clock)
               EXPIRED otherwise
    precision: "date comparison at day granularity; expiry day itself is still ACTIVE"
    worked_examples:
      - "expires_on 2026-08-03, clock 2026-08-03T23:59:00Z -> ACTIVE (inclusive boundary)"
      - "expires_on 2026-08-03, clock 2026-08-04T00:00:00Z -> EXPIRED"

  # --------------------------------------------------------------------------
  - name: shift_status_derivation
    entity: NurseShift
    field: status
    algorithm_type: threshold
    description: "NurseShift is immutable; its status is derived from the logical clock against the half-open shift interval."
    formula: |
      status = SCHEDULED if clock <  NurseShift.start_utc
               ACTIVE    if NurseShift.start_utc <= clock < NurseShift.end_utc
               ENDED     if clock >= NurseShift.end_utc
    precision: "half-open [start_utc, end_utc); a shift is never ACTIVE at its own end instant"
    worked_examples:
      - "shift [2026-08-01T12:00:00Z, 2026-08-01T20:00:00Z), clock 2026-08-01T20:00:00Z -> ENDED, so the nurse is not assignable"
      - "same shift, clock 2026-08-01T12:00:00Z -> ACTIVE (inclusive start)"

  # --------------------------------------------------------------------------
  # DUAL-VARIANT CALCULATION #1
  - name: assessment_acuity_score
    entity: ProtocolAssessment
    field: acuity_score
    algorithm_type: weighted_scoring
    description: |
      Scores one protocol assessment on a 0..100 acuity scale from the
      protocol's base severity plus age, pregnancy and red-flag modifiers.
      The same assessment is scored by TWO variants that read the SAME
      underlying facts through different sources of truth: the intake agent's
      provisional inputs versus the nurse's confirmed inputs. The variant is
      selected by ProtocolAssessment.confirmation_mode.
    constants:
      RED_FLAG_WEIGHT: 8
      RED_FLAG_CAP: 24
      GERIATRIC_AGE_YEARS: 65
      GERIATRIC_POINTS: 12
      PEDIATRIC_AGE_YEARS: 12
      PEDIATRIC_POINTS: 10
      PREGNANT_POINTS: 15
      POSTPARTUM_POINTS: 8
      ACUITY_MIN: 0
      ACUITY_MAX: 100
    formula: |
      # --- shared core, identical for both variants ---
      age_modifier =
          SymptomProtocol.infant_modifier_points  if age_years_used < 1
          PEDIATRIC_POINTS (10)                   if 1 <= age_years_used < 12
          GERIATRIC_POINTS (12)                   if age_years_used >= 65
          0                                       otherwise
      pregnancy_modifier =
          0                        if SymptomProtocol.pregnancy_sensitive == false
          PREGNANT_POINTS (15)     if pregnancy_status_used == PREGNANT
          POSTPARTUM_POINTS (8)    if pregnancy_status_used == POSTPARTUM_6W
          0                        otherwise
      red_flag_points = min(RED_FLAG_CAP (24), red_flag_count * RED_FLAG_WEIGHT (8))
      acuity_score = min(ACUITY_MAX, max(ACUITY_MIN,
                       SymptomProtocol.base_severity
                       + age_modifier + pregnancy_modifier + red_flag_points))
    variants:
      - variant: intake_provisional
        applies_when: "ProtocolAssessment.confirmation_mode == PROVISIONAL"
        inputs: |
          age_years_used        = body.stated_age_years          (what the caller said)
          pregnancy_status_used = Patient.pregnancy_status        (whatever is on file)
        description: "Fast path: scores from the caller's self-reported age and the chart's stored pregnancy status, so the caller's own words drive the score."
      - variant: nurse_confirmed
        applies_when: "ProtocolAssessment.confirmation_mode == CONFIRMED"
        inputs: |
          age_years_used        = full years elapsed from Patient.dob to date(clock)
          pregnancy_status_used = body.confirmed_pregnancy_status (nurse-verified)
        description: "Verified path: ignores body.stated_age_years entirely and recomputes age from the chart's date of birth, and ignores the stored pregnancy status in favour of what the nurse confirmed on the line."
    divergence_note: |
      The two variants are not a formatting difference — they can land on
      opposite sides of the disposition bands. A caller who says "sixty" but
      whose chart dob is 1948-09-10 scores 78 provisionally (no age modifier)
      and 90 once confirmed (age 77 at 2026-08-03 -> +12), which is the
      difference between ED_NOW and EMERGENCY_911.
    worked_examples:
      - "PROVISIONAL, base_severity 62, stated_age_years 36, Patient.pregnancy_status NOT_PREGNANT, red_flag_count 1 -> age_mod 0 + preg 0 + rf 8 -> acuity_score == 70"
      - "PROVISIONAL, base_severity 62, stated_age_years 60, red_flag_count 2 -> age_mod 0 + rf 16 -> acuity_score == 78"
      - "CONFIRMED, base_severity 62, Patient.dob 1948-09-10, clock 2026-08-03 -> age_years_used == 77 -> age_mod 12 + rf 16 -> acuity_score == 90"
      - "CONFIRMED, base_severity 62, dob 1996-01-04 (age 30), confirmed_pregnancy_status PREGNANT on a pregnancy_sensitive protocol, red_flag_count 1 -> 62 + 0 + 15 + 8 -> acuity_score == 85; the identical assessment with NOT_PREGNANT -> 70"
      - "CONFIRMED, base_severity 40, Patient.dob 2026-05-01 (age 0 at clock 2026-08-03), protocol.infant_modifier_points 22, red_flag_count 0 -> 40 + 22 -> acuity_score == 62"
      - "CONFIRMED, base_severity 61, red_flag_count 3 -> rf capped at 24 -> acuity_score == 85 exactly; red_flag_count 4 also gives 85 because of RED_FLAG_CAP"

  # --------------------------------------------------------------------------
  # COMBINATORIAL FORMULA — mode (a): multi-step conditional routing
  - name: disposition_recommendation
    entity: Disposition
    field: recommended_level
    algorithm_type: threshold
    description: |
      Turns an acuity score into a recommended disposition level by banding it
      and then applying four override steps in a FIXED order. Every step reads
      the output of the previous step, so re-ordering the steps changes the
      answer for the same inputs.
    constants:
      BAND_EMERGENCY_911_MIN: 85
      BAND_ED_NOW_MIN: 70
      BAND_URGENT_CARE_24H_MIN: 50
      BAND_OFFICE_APPT_72H_MIN: 30
      LEVEL_ORDINAL:
        EMERGENCY_911: 5
        ED_NOW: 4
        URGENT_CARE_24H: 3
        OFFICE_APPT_72H: 2
        HOME_CARE: 1
    formula: |
      # STEP 1 — band the acuity score of the call's ACTIVE ProtocolAssessment
      level = EMERGENCY_911   if acuity_score >= 85
              ED_NOW          if 70 <= acuity_score <= 84
              URGENT_CARE_24H if 50 <= acuity_score <= 69
              OFFICE_APPT_72H if 30 <= acuity_score <= 49
              HOME_CARE       if acuity_score < 30

      # STEP 2 — hard protocol override: a red flag on an emergency-override
      #          protocol jumps straight to 911 regardless of the band
      if SymptomProtocol.emergency_override == true AND red_flag_count >= 1:
          level = EMERGENCY_911

      # STEP 3 — infant floor: children under one year are never sent home or
      #          told to wait three days
      if age_years_used < 1 AND level IN {OFFICE_APPT_72H, HOME_CARE}:
          level = URGENT_CARE_24H

      # STEP 4 — after-hours floor: no office appointment can be booked while
      #          the practice office is closed
      if TriageCall.is_after_hours == true AND level == OFFICE_APPT_72H:
          level = URGENT_CARE_24H

      # STEP 5 — protocol floor: never recommend below the protocol's own
      #          minimum, comparing by LEVEL_ORDINAL (not alphabetically)
      recommended_level = level if LEVEL_ORDINAL[level] >= LEVEL_ORDINAL[SymptomProtocol.min_disposition_level]
                          else SymptomProtocol.min_disposition_level
    order_sensitivity_note: |
      Steps 3 and 4 both consume the level produced by step 2, and step 5
      consumes the level produced by steps 3 and 4. Applying step 5 before
      step 2 would let a protocol floor of HOME_CARE be overwritten by the
      band and lose the 911 jump; applying step 3 before step 1 has nothing
      to read at all.
    worked_examples:
      - "acuity 70, non-override protocol, age 36, in-hours, min_disposition_level HOME_CARE -> step 1 ED_NOW, steps 2-4 inert, step 5 keeps ED_NOW -> recommended_level == ED_NOW"
      - "acuity 62 (band URGENT_CARE_24H), emergency_override protocol, red_flag_count 1 -> step 2 promotes to EMERGENCY_911 -> recommended_level == EMERGENCY_911"
      - "acuity 40 (band OFFICE_APPT_72H), age_years_used 0 -> step 3 -> recommended_level == URGENT_CARE_24H"
      - "acuity 40 (band OFFICE_APPT_72H), age 36, is_after_hours true -> step 4 -> recommended_level == URGENT_CARE_24H"
      - "acuity 20 (band HOME_CARE), age 36, in-hours, protocol.min_disposition_level OFFICE_APPT_72H -> step 5 raises 1 -> 2 -> recommended_level == OFFICE_APPT_72H"
      - "acuity 85 exactly -> recommended_level == EMERGENCY_911; acuity 84 -> recommended_level == ED_NOW"

  # --------------------------------------------------------------------------
  # COMBINATORIAL FORMULA — mode (b): rounding order pinned
  - name: call_advice_fee
    entity: TriageCall
    field: advice_fee_cents
    algorithm_type: tiered_pricing
    description: |
      Bills a completed advice call. Handle time is rounded UP to a five-minute
      increment, then converted from millicents-per-minute to whole cents with
      half-up rounding. The rounding happens ONCE PER CALL and the practice
      ledger accumulates the already-rounded per-call cents.
    constants:
      BILLING_INCREMENT_MINUTES: 5
    formula: |
      billable_minutes = ceil(handle_minutes / 5) * 5
      advice_fee_cents = round_half_up(billable_minutes * Practice.per_minute_rate_millicents / 1000)
      # ledger accumulation, per completed call:
      Practice.billed_advice_minutes_total += TriageCall.billable_minutes
      Practice.advice_fee_accrued_cents    += TriageCall.advice_fee_cents   # already rounded
    rounding_order_note: |
      ROUND-PER-CALL, THEN SUM — never sum the raw millicents across calls and
      round once at the end. With per_minute_rate_millicents 4225, two 18-minute
      calls each round 84.5 -> 85 for an accrued total of 170 cents; summing
      first would give 40 * 4225 / 1000 == 169.0 -> 169 cents. The one-cent gap
      is the observable signature of the wrong order.
    precision: "billable_minutes is an integer multiple of 5; advice_fee_cents is a whole cent, ROUND_HALF_UP"
    worked_examples:
      - "handle_minutes 13, rate 4225 -> billable_minutes 15 -> 63.375 -> advice_fee_cents == 63"
      - "handle_minutes 18, rate 4225 -> billable_minutes 20 -> 84.5 -> advice_fee_cents == 85 (half-up, not banker's rounding, which would give 84)"
      - "handle_minutes 28, rate 4225 -> billable_minutes 30 -> 126.75 -> advice_fee_cents == 127"
      - "handle_minutes 20 exactly -> ceil(20/5)*5 == 20, no inflation to 25"
      - "two completed 18-minute calls on one practice -> Practice.advice_fee_accrued_cents == 170 and Practice.billed_advice_minutes_total == 40"

  # --------------------------------------------------------------------------
  # COMBINATORIAL FORMULA — mode (c): evaluation order pinned (non-circular)
  - name: practice_after_hours_invoice
    entity: Practice
    algorithm_type: waterfall_allocation
    description: |
      Computes the monthly after-hours invoice for a covered practice from its
      accrued advice fees plus per-escalation charges, less a coverage credit.
      Read-only projection served by GET /practices/{id}/after-hours-invoice.
    constants:
      ESCALATION_UNIT_CENTS: 2500
      CREDIT_TIER_LOW_MAX_CENTS: 99
      CREDIT_TIER_MID_MAX_CENTS: 999
      CREDIT_PCT_LOW: 0
      CREDIT_PCT_MID: 5
      CREDIT_PCT_HIGH: 10
    formula: |
      # STEP 1
      advice_subtotal_cents  = Practice.advice_fee_accrued_cents
      # STEP 2
      escalation_gross_cents = Practice.escalated_callback_count * ESCALATION_UNIT_CENTS (2500)
      # STEP 3 — the credit tier is keyed on advice_subtotal_cents ALONE
      coverage_credit_pct    = CREDIT_PCT_LOW  (0)  if advice_subtotal_cents <= 99
                               CREDIT_PCT_MID  (5)  if 100 <= advice_subtotal_cents <= 999
                               CREDIT_PCT_HIGH (10) if advice_subtotal_cents >= 1000
      # STEP 4
      coverage_credit_cents  = round_half_up(escalation_gross_cents * coverage_credit_pct / 100)
      # STEP 5
      invoice_total_cents    = advice_subtotal_cents + escalation_gross_cents - coverage_credit_cents
    order_sensitivity_note: |
      Step 3 must read the STEP 1 subtotal, not the running total. Keying the
      tier on (subtotal + escalation_gross) is circular — the credit would
      depend on a figure that the credit itself reduces — and it silently
      changes the answer whenever the escalation charges push the running total
      across 1000 cents.
    precision: "whole cents, ROUND_HALF_UP at step 4 only"
    worked_examples:
      - "advice_fee_accrued_cents 127, escalated_callback_count 1 -> gross 2500, tier keyed on 127 -> 5%, credit 125 -> invoice_total_cents == 2502"
      - "the circular misreading (tier keyed on 127 + 2500 == 2627 -> 10%, credit 250) yields 2377 and is wrong"
      - "advice_fee_accrued_cents 99, escalated_callback_count 2 -> gross 5000, tier 0%, credit 0 -> invoice_total_cents == 5099"
      - "advice_fee_accrued_cents 100, escalated_callback_count 2 -> gross 5000, tier 5%, credit 250 -> invoice_total_cents == 4850 (one cent more subtotal removes 250 cents of charge)"
      - "escalated_callback_count 0 -> gross 0, credit 0 -> invoice_total_cents == advice_fee_accrued_cents"

  # --------------------------------------------------------------------------
  - name: outcome_variance_classification
    entity: ComplianceAuditRecord
    field: variance_class
    algorithm_type: threshold
    description: |
      Compares what actually happened to the patient against the advice that
      was given, on a shared five-point ordinal scale, and weights the gap.
      Under-triage (patient turned out sicker than the advice implied) is
      weighted harder than over-triage.
    constants:
      OUTCOME_ORDINAL:
        ED_ADMITTED: 5
        ED_TREATED_RELEASED: 4
        URGENT_CARE_VISIT: 3
        OFFICE_VISIT: 2
        SELF_CARE_RESOLVED: 1
      UNDERTRIAGE_POINTS_PER_ORDINAL: 7
      OVERTRIAGE_POINTS_PER_ORDINAL: 3
    formula: |
      outcome_ordinal           = OUTCOME_ORDINAL[reported_outcome]
      disposition_level_ordinal = LEVEL_ORDINAL[Disposition.final_level]   # final_level, never recommended_level
      diff                      = outcome_ordinal - disposition_level_ordinal
      variance_class = CONCORDANT  if diff == 0
                       UNDERTRIAGE if diff >= 1     # sicker than advised
                       OVERTRIAGE  if diff <= -1    # less sick than advised
      variance_severity_points = 0                             if variance_class == CONCORDANT
                                 abs(diff) * 7                 if variance_class == UNDERTRIAGE
                                 abs(diff) * 3                 if variance_class == OVERTRIAGE
    input_note: "The comparison always uses Disposition.final_level, so a ChargeNurse override changes the variance verdict for the same reported outcome."
    worked_examples:
      - "final_level ED_NOW (4), reported_outcome ED_ADMITTED (5) -> diff +1 -> UNDERTRIAGE, variance_severity_points == 7"
      - "final_level ED_NOW (4), reported_outcome ED_TREATED_RELEASED (4) -> diff 0 -> CONCORDANT, variance_severity_points == 0"
      - "final_level EMERGENCY_911 (5), reported_outcome SELF_CARE_RESOLVED (1) -> diff -4 -> OVERTRIAGE, variance_severity_points == 12"

  # --------------------------------------------------------------------------
  # DUAL-VARIANT CALCULATION #2
  - name: practice_concordance_rate
    entity: Practice
    algorithm_type: aggregation
    description: |
      The share of a practice's audited dispositions whose recorded outcome
      agreed with the advice given. Two variants disagree about what "agreed"
      means: the regulator's strict reading demands an exact ordinal match,
      while the clinical-committee reading tolerates a one-band gap. Both
      variants are returned by the SAME GET /practices/{id}/compliance-summary
      request, as concordance_rate_strict_pct and
      concordance_rate_band_tolerant_pct.
    input_set: |
      ComplianceAuditRecord rows R such that
        R.created_at IN [Practice.audit_period_start_utc, clock)
        AND Disposition D = R.disposition_id
        AND D.advice_status IN {AUTHORIZED, OVERRIDDEN}    # VOIDED advice is excluded
        AND TriageCall(D.call_id).practice_id == Practice.id
      audited_count = count of R
    variants:
      - variant: strict_level_match
        formula: |
          concordant = count of R where R.outcome_ordinal == R.disposition_level_ordinal
        description: "Regulator reading: only an exact ordinal match counts as concordant."
      - variant: band_tolerant
        formula: |
          concordant = count of R where abs(R.outcome_ordinal - R.disposition_level_ordinal) <= 1
        description: "Clinical-committee reading: a single adjacent band is clinically acceptable."
    formula: |
      rate_pct = 0.0 if audited_count == 0
                 else round_half_up(100.0 * concordant / audited_count, 1)
    precision: "one decimal place, ROUND_HALF_UP; the audited_count == 0 case is 0.0 and never a division error"
    divergence_note: |
      A single audit record with an ordinal gap of exactly 1 drives the two
      variants to opposite extremes: 0.0 strict versus 100.0 band-tolerant.
    worked_examples:
      - "one audit record, final_level ED_NOW (4), outcome ED_ADMITTED (5) -> concordance_rate_strict_pct == 0.0 and concordance_rate_band_tolerant_pct == 100.0"
      - "three audit records with diffs 0, +1, -3 -> strict 1/3 -> 33.3; band-tolerant 2/3 -> 66.7"
      - "no audit records in the period -> both rates == 0.0"
      - "an audit record whose Disposition later became VOIDED still exists but drops out of the input set, lowering audited_count by 1"

  # --------------------------------------------------------------------------
  - name: nurse_assignment_selector
    entity: Nurse
    algorithm_type: constraint_propagation
    description: |
      Picks the nurse for a consented call. Licensure is not a preference but a
      filter: the advice line may only give advice through a nurse licensed in
      the STATE OF THE CALLER, which is the caller's state, not the practice's.
      Ranking is fully deterministic and never consults a random value or an
      id ordering.
    formula: |
      # FILTER — all clauses must hold
      candidates = Nurse rows N where
          N.intake_eligibility == ON_ROTATION
          AND exists NurseLicense L: L.nurse_id == N.id
                                     AND L.state_code == TriageCall.caller_state_code
                                     AND L.status == ACTIVE   (expires_on >= date(clock))
          AND exists NurseShift S: S.nurse_id == N.id
                                   AND S.start_utc <= clock < S.end_utc
          AND N.active_call_load < N.max_concurrent_calls

      # RANK — lexicographic, deterministic
      order by N.active_call_load ASC,
               N.seniority_level  DESC,      # integer band 1..5, higher is more senior
               N.created_at       ASC        # sanctioned final tie-break

      selected = first candidate
      if candidates is empty -> ERR_NO_LICENSED_NURSE_AVAILABLE (409),
                                TriageCall.deferred_assignment_count += 1
    tie_break: "active_call_load ASC, then Nurse.seniority_level DESC, then created_at ASC. Nurse.id is never consulted and no random choice is ever made."
    worked_examples:
      - "two ON_ROTATION nurses licensed in the caller's state and both on an ACTIVE shift, loads 0 and 1 -> the load-0 nurse wins"
      - "both loads 0, seniority_level 4 and 2 -> the seniority_level 4 nurse wins"
      - "both loads 0 and both seniority_level 4 -> the earlier created_at wins"
      - "the only otherwise-eligible nurse holds an ACTIVE license in a different state than TriageCall.caller_state_code -> candidates empty -> ERR_NO_LICENSED_NURSE_AVAILABLE and deferred_assignment_count == 1 with status still CONSENTED"
      - "the only eligible nurse has active_call_load == max_concurrent_calls -> filtered out by the load clause -> ERR_NO_LICENSED_NURSE_AVAILABLE"

  # --------------------------------------------------------------------------
  - name: callback_requirement
    entity: Disposition
    algorithm_type: threshold
    description: |
      Decides whether a disposition owes the caller a verification callback and,
      if so, how urgent it is and when it is due. Recomputed from scratch when a
      ChargeNurse override changes final_level.
    constants:
      HIGH_RISK_MIN_LEVEL_ORDINAL: 4
      HIGH_RISK_DUE_HOURS: 2
      STANDARD_DUE_HOURS: 12
      HIGH_RISK_MAX_ATTEMPTS: 3
      STANDARD_MAX_ATTEMPTS: 2
    formula: |
      ordinal = LEVEL_ORDINAL[Disposition.final_level]

      requires_callback = NOT (Disposition.final_level == HOME_CARE
                               AND TriageCall.is_after_hours == false)
      # i.e. only in-hours home-care advice is exempt; after-hours home-care
      # advice given on behalf of a closed practice always owes a callback.

      risk_class = HIGH_RISK if ordinal >= 4
                   NEXT_DAY  if TriageCall.is_after_hours == true AND ordinal <= 2
                   STANDARD  otherwise

      due_by_utc = created_at + 2 hours                             if risk_class == HIGH_RISK
                   created_at + 12 hours                            if risk_class == STANDARD
                   (date(created_at) + 1 day) at Practice.office_open_utc_hhmm
                                                                    if risk_class == NEXT_DAY
      max_attempts = 3 if risk_class == HIGH_RISK else 2
    worked_examples:
      - "final_level EMERGENCY_911 (5), created_at 2026-08-01T14:30:00Z -> requires_callback true, risk_class HIGH_RISK, due_by_utc 2026-08-01T16:30:00Z, max_attempts 3"
      - "final_level URGENT_CARE_24H (3), created_at 2026-08-01T14:30:00Z -> risk_class STANDARD, due_by_utc 2026-08-02T02:30:00Z, max_attempts 2"
      - "final_level HOME_CARE (1) with is_after_hours true, created_at 2026-08-01T14:30:00Z, Practice.office_open_utc_hhmm '13:00' -> risk_class NEXT_DAY, due_by_utc 2026-08-02T13:00:00Z (the practice's next-day callback list)"
      - "final_level HOME_CARE (1) with is_after_hours false -> requires_callback == false and no CallbackTask is created at all"
      - "an ED_NOW disposition (HIGH_RISK) de-escalated to OFFICE_APPT_72H in-hours -> the HIGH_RISK task is CANCELLED and a replacement STANDARD task with a +12h due_by_utc is created"

  # --------------------------------------------------------------------------
  - name: staffing_adequacy
    entity: Nurse
    algorithm_type: aggregation
    description: |
      Compares scheduled licensed nurse minutes against the minutes the offered
      call volume demands, per state, over an arbitrary window. Served by
      GET /staffing-adequacy. Only nurses licensed in the queried state count
      toward supply, which is what makes licensure a staffing constraint rather
      than a routing detail.
    constants:
      AVG_HANDLE_MINUTES: 14
      TARGET_OCCUPANCY_PCT: 80
    formula: |
      offered_call_count = count of TriageCall T where
                             T.caller_state_code == query.state_code
                             AND T.created_at IN [window_start_utc, window_end_utc)

      required_nurse_minutes = ceil(offered_call_count * 14 * 100 / 80)

      scheduled_nurse_minutes = sum over NurseShift S of
                                  overlap_minutes([S.start_utc, S.end_utc),
                                                  [window_start_utc, window_end_utc))
                                where the shift's Nurse holds a NurseLicense with
                                  state_code == query.state_code
                                  AND expires_on >= date(window_start_utc)

      adequacy_ratio_pct = 100.0 if required_nurse_minutes == 0
                           else round_half_up(100.0 * scheduled_nurse_minutes
                                              / required_nurse_minutes, 1)

      staffing_posture = ADEQUATE if adequacy_ratio_pct >= 100.0
                         STRAINED if 80.0 <= adequacy_ratio_pct < 100.0
                         CRITICAL if adequacy_ratio_pct < 80.0
    precision: "half-open overlap on both intervals; ratio to one decimal place, ROUND_HALF_UP; the zero-demand case is 100.0 / ADEQUATE, never a division error"
    worked_examples:
      - "offered_call_count 2 -> required_nurse_minutes ceil(3500/80) == 35; scheduled_nurse_minutes 28 -> 80.0 -> staffing_posture == STRAINED (the boundary belongs to STRAINED)"
      - "same demand with scheduled_nurse_minutes 27 -> 77.142857 -> adequacy_ratio_pct == 77.1 -> CRITICAL"
      - "same demand with scheduled_nurse_minutes 35 -> 100.0 -> ADEQUATE"
      - "offered_call_count 0 -> required_nurse_minutes 0 -> adequacy_ratio_pct == 100.0 and staffing_posture == ADEQUATE"
      - "a shift whose nurse is licensed only in another state contributes 0 scheduled minutes, so adding that nurse cannot move the posture"

  # --------------------------------------------------------------------------
  - name: nurse_load_conservation
    entity: Nurse
    field: active_call_load
    algorithm_type: aggregation
    description: |
      Invariant, not a formula to be recomputed on read: Nurse.active_call_load
      is a stored counter that must at all times equal the number of live calls
      assigned to that nurse. Every path that adds a live call increments it and
      every path that removes one decrements it by exactly the same amount, so
      an assign/abandon or complete/reopen/complete round trip leaves no drift.
    formula: |
      INVARIANT: Nurse.active_call_load
               == count of TriageCall T where T.assigned_nurse_id == Nurse.id
                  AND T.status IN {ASSIGNED, ASSESSING, DISPOSITIONED}
      increments: assign-nurse (+1), reopen (+1)
      decrements: complete (-1), abandon (-1, only when assigned_nurse_id is set)
    worked_examples:
      - "assign a call to a nurse whose active_call_load was 0 -> 1; abandon that call -> back to 0, not -1 and not 1"
      - "complete the call (-1) then reopen it (+1) then complete it again (-1) -> the counter returns to its starting value"
      - "abandoning a call that was never assigned leaves every nurse counter untouched"

  # --------------------------------------------------------------------------
  - name: practice_ledger_conservation
    entity: Practice
    field: advice_fee_accrued_cents
    algorithm_type: aggregation
    description: |
      Invariant on the two billing ledgers. Completing a call credits exactly
      the values frozen on that call; reopening it debits exactly the same
      values. Because the debit reuses the stored TriageCall.billable_minutes
      and TriageCall.advice_fee_cents rather than recomputing them, a rate
      change between completion and reopen cannot strand cents on the ledger.
    formula: |
      INVARIANT: Practice.advice_fee_accrued_cents
               == sum of TriageCall.advice_fee_cents over that practice's CLOSED calls
         AND     Practice.billed_advice_minutes_total
               == sum of TriageCall.billable_minutes over that practice's CLOSED calls
    worked_examples:
      - "complete an 18-minute call (accrued 85, minutes 20) then reopen it -> accrued 0 and minutes 0, and the call's own advice_fee_cents resets to 0 with billable_minutes 0"
      - "complete, reopen, then complete again at 13 minutes -> accrued == 63 and minutes == 15 (the first completion leaves no residue)"

# ============================================================================
# §1.4 Validation Table
# Evaluated STRICTLY in ascending priority order. The first rule whose
# condition holds produces the response; no later rule is evaluated.
# ============================================================================

validations:

  # ---- authentication / authorisation ---------------------------------------
  - priority: 1
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: "X-User-ID or X-User-Role header missing or empty"

  - priority: 2
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    category: auth
    applies_to: "every endpoint with a roles list"
    condition: "X-User-Role is not present in the endpoint's roles list"

  # ---- schema ---------------------------------------------------------------
  - priority: 3
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: business_constraint
    applies_to: "every write endpoint"
    condition: |
      A required input field is missing, an enum field carries a value outside
      its declared set, a numeric field falls outside its declared range
      (base_severity outside 0..100, red_flag_count negative,
      match_confidence_pct outside 0..100, location_confidence_pct outside
      0..100, handle_minutes outside 1..240, per_minute_rate_millicents
      negative, max_concurrent_calls < 1, variance_review_threshold < 1),
      an interval is inverted (end_utc <= start_utc, office_close_utc_hhmm
      <= office_open_utc_hhmm, max_age_years < min_age_years), or a timestamp
      is not valid ISO-8601 UTC.

  # ---- existence ------------------------------------------------------------
  - priority: 4
    error_id: ERR_PRACTICE_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "any endpoint carrying a practice id in the path or body"
    condition: "no Practice with that id exists"

  - priority: 5
    error_id: ERR_NURSE_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "any endpoint carrying a nurse id in the path or body"
    condition: "no Nurse with that id exists"

  - priority: 6
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "POST /triage-calls/{id}/match-patient"
    condition: "no Patient with body.patient_id exists"

  - priority: 7
    error_id: ERR_PROTOCOL_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "POST /triage-calls/{id}/assessments, POST /symptom-protocols/{id}/retire"
    condition: "no SymptomProtocol with that id exists"

  - priority: 8
    error_id: ERR_TRIAGE_CALL_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "any endpoint carrying a triage call id in the path or body"
    condition: "no TriageCall with that id exists"

  - priority: 9
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "GET /protocol-assessments/{id}, POST /dispositions"
    condition: "no ProtocolAssessment with that id exists"

  - priority: 10
    error_id: ERR_DISPOSITION_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "any endpoint carrying a disposition id in the path or body"
    condition: "no Disposition with that id exists"

  - priority: 11
    error_id: ERR_CALLBACK_TASK_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "GET /callback-tasks/{id}, POST /callback-tasks/{id}/attempts, POST /callback-tasks/{id}/verify"
    condition: "no CallbackTask with that id exists"

  - priority: 12
    error_id: ERR_WARM_TRANSFER_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "POST /warm-transfers/{id}/confirm-location, /psap-response, /complete-handoff"
    condition: "no WarmTransfer with that id exists"

  - priority: 13
    error_id: ERR_COVERAGE_WINDOW_NOT_FOUND
    http_status: 404
    category: business_referential
    applies_to: "POST /coverage-windows/{id}/activate"
    condition: "no CoverageWindow with that id exists"

  # ---- ownership / scope ----------------------------------------------------
  - priority: 14
    error_id: ERR_NOT_ASSIGNED_NURSE
    http_status: 403
    category: auth
    applies_to: "POST /triage-calls/{id}/assessments, POST /dispositions, POST /triage-calls/{id}/complete, POST /triage-calls/{id}/warm-transfers, POST /warm-transfers/{id}/confirm-location, POST /warm-transfers/{id}/complete-handoff, POST /callback-tasks/{id}/attempts"
    condition: "X-User-ID is a TriageNurse who is not the assigned_nurse_id of the target call (or of the callback task)"

  - priority: 15
    error_id: ERR_PRACTICE_SCOPE_VIOLATION
    http_status: 403
    category: auth
    applies_to: "GET /practices/{id}/compliance-summary, GET /practices/{id}/after-hours-invoice, GET /practices/{id}/coverage-windows, GET /practices/{id}/patients, POST /coverage-windows/{id}/activate"
    condition: "X-User-Role == PracticeLiaison and X-User-ID is not the id of the Practice named in the path"

  # ---- lifecycle / state ---------------------------------------------------
  - priority: 16
    error_id: ERR_PRACTICE_SUSPENDED
    http_status: 409
    category: state
    applies_to: "POST /triage-calls, POST /practices/{id}/patients, POST /coverage-windows"
    condition: "Practice.status == SUSPENDED"

  - priority: 17
    error_id: ERR_CALL_INVALID_STATE
    http_status: 409
    category: state
    applies_to: "every TriageCall action endpoint, POST /dispositions"
    condition: "TriageCall.status is not in the from-set of the requested transition (see §1.2)"

  - priority: 18
    error_id: ERR_ASSESSMENT_SUPERSEDED
    http_status: 409
    category: state
    applies_to: "POST /dispositions"
    condition: "ProtocolAssessment.status == SUPERSEDED"

  - priority: 19
    error_id: ERR_DISPOSITION_INVALID_STATE
    http_status: 409
    category: state
    applies_to: "POST /dispositions/{id}/override, POST /dispositions/{id}/audit-records"
    condition: "Disposition.advice_status or Disposition.audit_status is not in the from-set of the requested transition (for example overriding a VOIDED disposition, or overriding one that is already OVERRIDDEN). Carve-out: on POST /dispositions/{id}/audit-records, when a ComplianceAuditRecord for the disposition already exists the request is ERR_OUTCOME_ALREADY_RECORDED (priority 49) rather than this rule, so this rule fires there only when advice_status == VOIDED"

  - priority: 20
    error_id: ERR_CALLBACK_INVALID_STATE
    http_status: 409
    category: state
    applies_to: "POST /callback-tasks/{id}/attempts, POST /callback-tasks/{id}/verify"
    condition: "CallbackTask.status is not in the from-set of the requested transition (attempting a VERIFIED task, verifying a PENDING one, touching a CANCELLED or EXPIRED one)"

  - priority: 21
    error_id: ERR_TRANSFER_INVALID_STATE
    http_status: 409
    category: state
    applies_to: "POST /warm-transfers/{id}/confirm-location, /psap-response, /complete-handoff"
    condition: "WarmTransfer.status is not in the from-set of the requested transition"

  - priority: 22
    error_id: ERR_COVERAGE_WINDOW_INVALID_STATE
    http_status: 409
    category: state
    applies_to: "POST /coverage-windows/{id}/activate"
    condition: "CoverageWindow.status != DRAFT (already ACTIVE, lazily EXPIRED, or BLOCKED by a compliance review)"

  # ---- optimistic concurrency ---------------------------------------------
  - priority: 23
    error_id: ERR_STALE_CALL_VERSION
    http_status: 412
    category: state
    applies_to: "POST /dispositions"
    condition: "body.expected_call_version != TriageCall.version"

  # ---- clinical safety -----------------------------------------------------
  - priority: 24
    error_id: ERR_NURSE_NOT_LICENSED_IN_STATE
    http_status: 409
    category: business_safety
    applies_to: "POST /dispositions, POST /dispositions/{id}/override"
    condition: "the acting nurse has no NurseLicense with state_code == TriageCall.caller_state_code and status == ACTIVE"

  - priority: 25
    error_id: ERR_MINOR_REQUIRES_GUARDIAN_CONSENT
    http_status: 422
    category: business_safety
    applies_to: "POST /triage-calls/{id}/consent"
    condition: "full years from Patient.dob to date(clock) < 18 and body.consent_type == PATIENT_SELF"

  - priority: 26
    error_id: ERR_CONSENT_RECORDING_REQUIRED
    http_status: 422
    category: business_safety
    applies_to: "POST /triage-calls/{id}/consent"
    condition: "Practice.consent_recording_required == true and body.recording_reference is absent or empty"

  - priority: 27
    error_id: ERR_OVERRIDE_DOCUMENTATION_REQUIRED
    http_status: 422
    category: business_safety
    applies_to: "POST /dispositions, POST /dispositions/{id}/override"
    condition: "the requested final_level differs from the computed recommended_level and body.override_reason_code is absent or body.override_narrative is shorter than 40 characters"

  - priority: 28
    error_id: ERR_DEESCALATION_REQUIRES_CHARGE_NURSE
    http_status: 403
    category: business_safety
    applies_to: "POST /dispositions"
    condition: "LEVEL_ORDINAL[body.final_level] < LEVEL_ORDINAL[recommended_level] on the create path (a TriageNurse may escalate away from the recommendation but only a ChargeNurse may soften it, and only through POST /dispositions/{id}/override)"

  - priority: 29
    error_id: ERR_EMERGENCY_DEESCALATION_FORBIDDEN
    http_status: 422
    category: business_safety
    applies_to: "POST /dispositions/{id}/override"
    condition: "Disposition.recommended_level == EMERGENCY_911 and body.final_level != EMERGENCY_911"

  - priority: 30
    error_id: ERR_OVERRIDE_STEP_LIMIT
    http_status: 422
    category: business_safety
    applies_to: "POST /dispositions/{id}/override"
    condition: "abs(LEVEL_ORDINAL[body.final_level] - LEVEL_ORDINAL[Disposition.final_level]) > 1"

  - priority: 31
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: business_safety
    applies_to: "POST /callback-tasks/{id}/verify, POST /dispositions/{id}/override"
    condition: "X-User-ID == Disposition.determined_by_nurse_id (the nurse who gave the advice may neither verify its outcome nor override their own disposition)"

  - priority: 32
    error_id: ERR_WARM_TRANSFER_INCOMPLETE
    http_status: 409
    category: business_safety
    applies_to: "POST /triage-calls/{id}/complete"
    condition: "TriageCall.requires_warm_transfer == true and no WarmTransfer for the call has status HANDOFF_COMPLETE"

  # ---- referential coherence ----------------------------------------------
  - priority: 33
    error_id: ERR_PATIENT_PRACTICE_MISMATCH
    http_status: 409
    category: business_referential
    applies_to: "POST /triage-calls/{id}/match-patient"
    condition: "Patient.practice_id != TriageCall.practice_id"

  - priority: 34
    error_id: ERR_ASSESSMENT_CALL_MISMATCH
    http_status: 409
    category: business_referential
    applies_to: "POST /dispositions"
    condition: "ProtocolAssessment.call_id != body.call_id"

  - priority: 35
    error_id: ERR_CALLBACK_NOT_RESOLVED
    http_status: 409
    category: business_referential
    applies_to: "POST /dispositions/{id}/audit-records"
    condition: "Disposition.requires_callback == true and the CallbackTask for that disposition has status IN {PENDING, ATTEMPTED, REACHED}"

  # ---- temporal ------------------------------------------------------------
  - priority: 36
    error_id: ERR_NO_ACTIVE_COVERAGE
    http_status: 409
    category: business_temporal
    applies_to: "POST /triage-calls"
    condition: "the call is after-hours and no ACTIVE CoverageWindow of the practice contains the logical clock in [start_utc, end_utc)"

  - priority: 37
    error_id: ERR_CALLBACK_PAST_DUE
    http_status: 409
    category: business_temporal
    applies_to: "POST /callback-tasks/{id}/verify"
    condition: "CallbackTask.risk_class == HIGH_RISK and logical clock > CallbackTask.due_by_utc (a late high-risk verification cannot be back-dated into compliance)"

  - priority: 38
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    http_status: 409
    category: business_temporal
    applies_to: "POST /triage-calls/{id}/reopen"
    condition: "logical clock >= TriageCall.closed_at + 72 hours"

  - priority: 39
    error_id: ERR_OUTCOME_PREDATES_DISPOSITION
    http_status: 422
    category: business_temporal
    applies_to: "POST /dispositions/{id}/audit-records"
    condition: "body.outcome_observed_at < Disposition.created_at"

  - priority: 40
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    category: business_temporal
    applies_to: "POST /nurses/{id}/shifts"
    condition: "the new [start_utc, end_utc) overlaps an existing shift of the same nurse: existing.start_utc < new.end_utc AND new.start_utc < existing.end_utc. Exact adjacency (new.start_utc == existing.end_utc) is allowed."

  - priority: 41
    error_id: ERR_COVERAGE_WINDOW_CONFLICT
    http_status: 409
    category: business_temporal
    applies_to: "POST /coverage-windows"
    condition: "for the same practice, the new window conflicts with an existing DRAFT or ACTIVE window once a 30-minute buffer is applied to BOTH SIDES of the existing window: (existing.start_utc - 30min) < new.end_utc AND new.start_utc < (existing.end_utc + 30min). A gap of exactly 30 minutes is allowed; 29 minutes is not."

  # ---- domain constraints -------------------------------------------------
  - priority: 42
    error_id: ERR_PROTOCOL_INACTIVE
    http_status: 409
    category: business_constraint
    applies_to: "POST /triage-calls/{id}/assessments"
    condition: "SymptomProtocol.status == RETIRED"

  - priority: 43
    error_id: ERR_PROTOCOL_AGE_INELIGIBLE
    http_status: 422
    category: business_constraint
    applies_to: "POST /triage-calls/{id}/assessments"
    condition: "the variant-selected age_years_used falls outside [SymptomProtocol.min_age_years, SymptomProtocol.max_age_years]"

  - priority: 44
    error_id: ERR_MATCH_CONFIDENCE_TOO_LOW
    http_status: 422
    category: business_constraint
    applies_to: "POST /triage-calls/{id}/match-patient"
    condition: "body.match_method != MRN and body.match_confidence_pct < 80"

  - priority: 45
    error_id: ERR_INVALID_LOCATION
    http_status: 422
    category: business_constraint
    applies_to: "POST /triage-calls/{id}/warm-transfers"
    condition: "body.location_lat outside -90..90, body.location_lng outside -180..180, or body.location_address_line empty"

  - priority: 46
    error_id: ERR_LOCATION_STATE_MISMATCH
    http_status: 409
    category: business_constraint
    applies_to: "POST /triage-calls/{id}/warm-transfers"
    condition: "body.location_state_code != TriageCall.caller_state_code (the PSAP is dispatched on the caller's state of record, so a mismatch is a data error rather than a routing choice)"

  - priority: 47
    error_id: ERR_WARM_TRANSFER_NOT_INDICATED
    http_status: 409
    category: business_constraint
    applies_to: "POST /triage-calls/{id}/warm-transfers"
    condition: "TriageCall.requires_warm_transfer == false"

  - priority: 48
    error_id: ERR_WARM_TRANSFER_ALREADY_OPEN
    http_status: 409
    category: business_constraint
    applies_to: "POST /triage-calls/{id}/warm-transfers"
    condition: "a WarmTransfer for the call already has status IN {INITIATED, LOCATION_CONFIRMED, ACCEPTED_BY_PSAP, HANDOFF_COMPLETE}; only a REJECTED_BY_PSAP transfer frees the slot for a second attempt"

  - priority: 49
    error_id: ERR_OUTCOME_ALREADY_RECORDED
    http_status: 409
    category: business_constraint
    applies_to: "POST /dispositions/{id}/audit-records"
    condition: "a ComplianceAuditRecord with disposition_id == that disposition already exists (audit records are immutable and one-per-disposition)"

  - priority: 50
    error_id: ERR_LOCATION_CONFIDENCE_TOO_LOW
    http_status: 422
    category: business_constraint
    applies_to: "POST /warm-transfers/{id}/confirm-location"
    condition: "body.location_confidence_pct < 75"

  # ---- capacity / fiscal ---------------------------------------------------
  - priority: 51
    error_id: ERR_NURSE_AT_CAPACITY
    http_status: 409
    category: business_fiscal
    applies_to: "POST /triage-calls/{id}/assign-nurse"
    condition: "body.preferred_nurse_id is supplied and that nurse's active_call_load >= max_concurrent_calls"

  - priority: 52
    error_id: ERR_NO_LICENSED_NURSE_AVAILABLE
    http_status: 409
    category: business_fiscal
    applies_to: "POST /triage-calls/{id}/assign-nurse"
    condition: "the nurse_assignment_selector candidate set is empty. The rejected attempt still increments TriageCall.deferred_assignment_count and TriageCall.version (see §1.2 TriageCall CONSENTED -> CONSENTED)."

  - priority: 53
    error_id: ERR_PRACTICE_COMPLIANCE_HOLD
    http_status: 409
    category: business_fiscal
    applies_to: "POST /coverage-windows/{id}/activate"
    condition: "Practice.compliance_posture == UNDER_REVIEW"

# ============================================================================
# §1.5 Endpoint Table
# api_prefix is "" — every collection is a flat top-level segment.
# Read endpoints are open to all six roles; PracticeLiaison reads are further
# narrowed by ERR_PRACTICE_SCOPE_VIOLATION (§1.4 priority 15).
# ============================================================================

endpoints:

  # ---- Practice -------------------------------------------------------------
  - method: POST
    path: /practices
    roles: [PlatformAdmin]
    description: "Registers a practice that the advice line answers for, with its office hours, billing rate and compliance thresholds."
    input:
      - name
      - office_open_utc_hhmm
      - office_close_utc_hhmm
      - per_minute_rate_millicents
      - weekend_is_after_hours?
      - consent_recording_required?
      - variance_review_threshold?
      - audit_period_start_utc?
    output: Practice
    side_effects:
      - "creates Practice with status ACTIVE, compliance_posture NORMAL and all five counters/ledgers at 0"

  - method: GET
    path: /practices/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one practice, including its live counters and billing ledgers."
    input: []
    output: Practice

  - method: PATCH
    path: /practices/{id}/status
    roles: [PlatformAdmin]
    description: "Suspends or reinstates a practice. A SUSPENDED practice accepts no new calls, patients or coverage windows."
    input:
      - status
    output: Practice
    side_effects:
      - "sets Practice.status and increments Practice.version by 1"

  - method: POST
    path: /practices/{id}/patients
    roles: [PlatformAdmin, IntakeAgent]
    description: "Adds a patient to a practice's panel. dob is the authoritative age source for the nurse_confirmed acuity variant."
    input:
      - full_name
      - dob
      - sex?
      - pregnancy_status?
      - phone?
      - mrn?
    output: Patient
    side_effects:
      - "creates Patient with practice_id from the path"

  - method: GET
    path: /practices/{id}/patients
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists a practice's patient panel. Reverse-reachability read for Patient.practice_id."
    input:
      - phone?
      - mrn?
      - limit?
      - offset?
    output: Patient[]

  - method: GET
    path: /patients/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one patient."
    input: []
    output: Patient

  - method: GET
    path: /practices/{id}/compliance-summary
    roles: [PlatformAdmin, ComplianceAuditor, PracticeLiaison]
    description: "Computed read. Returns BOTH variants of calculations.practice_concordance_rate over the practice's audit period, side by side in one response, plus the raw counters that feed the variance cascade."
    input: []
    output:
      audited_count: integer
      concordant_count_strict: integer
      concordant_count_band_tolerant: integer
      concordance_rate_strict_pct: number
      concordance_rate_band_tolerant_pct: number
      undertriage_count: integer
      overtriage_count: integer
      variance_severity_points_total: integer
      open_variance_count: integer
      compliance_posture: string

  - method: GET
    path: /practices/{id}/after-hours-invoice
    roles: [PlatformAdmin, PracticeLiaison]
    description: "Computed read. Runs calculations.practice_after_hours_invoice and exposes every intermediate step so the credit tier's keying is observable."
    input: []
    output:
      advice_subtotal_cents: integer
      billed_advice_minutes_total: integer
      escalated_callback_count: integer
      escalation_gross_cents: integer
      coverage_credit_pct: integer
      coverage_credit_cents: integer
      invoice_total_cents: integer

  # ---- CoverageWindow -------------------------------------------------------
  - method: POST
    path: /coverage-windows
    roles: [PlatformAdmin, PracticeLiaison]
    description: "Drafts an after-hours coverage authorization for a practice. Rejected when it comes within 30 minutes of an existing DRAFT or ACTIVE window for the same practice."
    input:
      - practice_id
      - start_utc
      - end_utc
      - coverage_kind
    output: CoverageWindow
    side_effects:
      - "creates CoverageWindow with status DRAFT and suspend_reason null"

  - method: POST
    path: /coverage-windows/{id}/activate
    roles: [PlatformAdmin, PracticeLiaison]
    description: "Activates a drafted coverage window so it can satisfy the after-hours intake coverage check. Blocked while the practice is under compliance review."
    input: []
    output: CoverageWindow
    side_effects:
      - "sets CoverageWindow.status = ACTIVE and increments CoverageWindow.version by 1"

  - method: GET
    path: /coverage-windows/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one coverage window, applying the lazy ACTIVE -> EXPIRED evaluation first."
    input: []
    output: CoverageWindow

  - method: GET
    path: /practices/{id}/coverage-windows
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists a practice's coverage windows, applying the lazy ACTIVE -> EXPIRED evaluation before filtering. Reverse-reachability read for CoverageWindow.practice_id."
    input:
      - status?
    output: CoverageWindow[]
    side_effects:
      - "lazily flips any ACTIVE window whose end_utc has passed to EXPIRED before the response is built"

  # ---- Nurse, licences, shifts ---------------------------------------------
  - method: POST
    path: /nurses
    roles: [PlatformAdmin]
    description: "Registers an advice-line nurse. active_call_load and pending_high_risk_count start at 0 and intake_eligibility starts ON_ROTATION."
    input:
      - full_name
      - seniority_level
      - max_concurrent_calls?
      - high_risk_cap?
    output: Nurse
    side_effects:
      - "creates Nurse with active_call_load 0, pending_high_risk_count 0 and intake_eligibility ON_ROTATION"

  - method: GET
    path: /nurses/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one nurse, including the conserved active_call_load counter."
    input: []
    output: Nurse

  - method: POST
    path: /nurses/{id}/licenses
    roles: [PlatformAdmin]
    description: "Records an immutable state licence for a nurse. Licensure in the CALLER's state is a hard filter in the assignment selector."
    input:
      - state_code
      - license_number
      - expires_on
    output: NurseLicense
    side_effects:
      - "creates NurseLicense; status is derived from the logical clock and never stored-and-mutated"

  - method: GET
    path: /nurses/{id}/licenses
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists a nurse's licences with clock-derived status. Reverse-reachability read for NurseLicense.nurse_id."
    input:
      - state_code?
      - status?
    output: NurseLicense[]

  - method: POST
    path: /nurses/{id}/shifts
    roles: [PlatformAdmin]
    description: "Schedules an immutable shift. Overlapping shifts for the same nurse are rejected; exact adjacency is allowed."
    input:
      - start_utc
      - end_utc
    output: NurseShift
    side_effects:
      - "creates NurseShift with scheduled_minutes computed as the whole minutes in [start_utc, end_utc)"

  - method: GET
    path: /nurses/{id}/shifts
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists a nurse's shifts with clock-derived status. Reverse-reachability read for NurseShift.nurse_id."
    input:
      - status?
    output: NurseShift[]

  # ---- SymptomProtocol -----------------------------------------------------
  - method: POST
    path: /symptom-protocols
    roles: [PlatformAdmin]
    description: "Publishes a symptom protocol with its base severity, age eligibility band, pregnancy sensitivity, emergency-override flag and disposition floor."
    input:
      - code
      - title
      - base_severity
      - min_age_years
      - max_age_years
      - pregnancy_sensitive?
      - emergency_override?
      - min_disposition_level?
      - infant_modifier_points?
    output: SymptomProtocol
    side_effects:
      - "creates SymptomProtocol with status ACTIVE"

  - method: GET
    path: /symptom-protocols/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one symptom protocol."
    input: []
    output: SymptomProtocol

  - method: GET
    path: /symptom-protocols
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists symptom protocols."
    input:
      - status?
      - code?
      - limit?
      - offset?
    output: SymptomProtocol[]

  - method: POST
    path: /symptom-protocols/{id}/retire
    roles: [PlatformAdmin]
    description: "Retires a protocol. Existing assessments keep their scores; new assessments against it are rejected."
    input: []
    output: SymptomProtocol
    side_effects:
      - "sets SymptomProtocol.status = RETIRED and increments SymptomProtocol.version by 1"

  # ---- TriageCall ----------------------------------------------------------
  - method: POST
    path: /triage-calls
    roles: [IntakeAgent]
    description: "Opens a call at intake. Freezes is_after_hours from the logical clock and enforces the after-hours coverage check before the row is created."
    input:
      - practice_id
      - caller_name
      - caller_phone
      - caller_state_code
      - caller_relationship?
      - reason_text?
    output: TriageCall
    side_effects:
      - "computes TriageCall.is_after_hours per calculations.after_hours_determination and freezes it on the row"
      - "runs calculations.intake_coverage_check, lazily expiring stale ACTIVE coverage windows first"
      - "creates TriageCall with status INTAKE, requires_warm_transfer false, billable_minutes 0, advice_fee_cents 0, reopen_count 0 and deferred_assignment_count 0"

  - method: GET
    path: /triage-calls/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one call, including its version for the OCC handshake on POST /dispositions."
    input: []
    output: TriageCall

  - method: GET
    path: /triage-calls
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists calls. Reverse-reachability read for TriageCall.practice_id, TriageCall.patient_id and TriageCall.assigned_nurse_id."
    input:
      - practice_id?
      - patient_id?
      - assigned_nurse_id?
      - status?
      - limit?
      - offset?
    output: TriageCall[]

  - method: POST
    path: /triage-calls/{id}/match-patient
    roles: [IntakeAgent]
    description: "Binds the call to a chart. A non-MRN match must carry at least 80% confidence."
    input:
      - patient_id
      - match_method
      - match_confidence_pct?
    output: TriageCall
    side_effects:
      - "sets patient_id, match_method, match_confidence_pct, status = IDENTIFIED and increments TriageCall.version by 1"

  - method: POST
    path: /triage-calls/{id}/consent
    roles: [IntakeAgent]
    description: "Records consent to receive advice. A minor may not self-consent, and practices that require recording must supply a recording reference."
    input:
      - consent_type
      - consent_given_by
      - recording_reference?
    output: TriageCall
    side_effects:
      - "sets consent_type, consent_given_by, recording_reference, consent_recorded_at = logical clock, status = CONSENTED and increments TriageCall.version by 1"

  - method: POST
    path: /triage-calls/{id}/assign-nurse
    roles: [IntakeAgent, ChargeNurse]
    description: "Assigns the call through calculations.nurse_assignment_selector. When preferred_nurse_id is supplied it must itself pass every eligibility clause. When the candidate set is empty the request is rejected but still records the deferral on the call."
    input:
      - preferred_nurse_id?
    output: TriageCall
    side_effects:
      - "on success: sets assigned_nurse_id, assigned_at, status = ASSIGNED, increments Nurse.active_call_load by 1 and increments TriageCall.version by 1"
      - "on an empty candidate set: increments TriageCall.deferred_assignment_count and TriageCall.version, changes nothing else, and answers 409 ERR_NO_LICENSED_NURSE_AVAILABLE"

  - method: POST
    path: /triage-calls/{id}/assessments
    roles: [TriageNurse]
    description: "Runs a symptom protocol against the call. confirmation_mode selects the acuity variant: PROVISIONAL scores from stated_age_years and the chart's pregnancy status, CONFIRMED recomputes age from Patient.dob and uses confirmed_pregnancy_status. A second assessment supersedes the first and voids anything downstream of it."
    input:
      - protocol_id
      - confirmation_mode
      - red_flag_count
      - stated_age_years?
      - confirmed_pregnancy_status?
    output: ProtocolAssessment
    side_effects:
      - "creates ProtocolAssessment with status ACTIVE and all acuity component fields populated per calculations.assessment_acuity_score"
      - "flips any previously ACTIVE assessment on the call to SUPERSEDED, which cascades Disposition -> CallbackTask -> Practice.open_callback_count"
      - "sets TriageCall.status = ASSESSING and increments TriageCall.version by 1"

  - method: GET
    path: /protocol-assessments/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one assessment with its acuity breakdown and the variant-selected inputs actually used."
    input: []
    output: ProtocolAssessment

  - method: GET
    path: /protocol-assessments
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists assessments. Reverse-reachability read for ProtocolAssessment.call_id and ProtocolAssessment.protocol_id."
    input:
      - call_id?
      - protocol_id?
      - status?
      - limit?
      - offset?
    output: ProtocolAssessment[]

  # ---- Disposition ---------------------------------------------------------
  - method: POST
    path: /dispositions
    roles: [TriageNurse]
    description: |
      Determines the disposition for the call's ACTIVE assessment. Carries the
      optimistic-concurrency handshake: expected_call_version must equal the
      TriageCall.version the client last read. The nurse may escalate above the
      recommendation with documentation, but may never soften it — softening is
      a ChargeNurse operation on the created disposition.
    input:
      - call_id
      - assessment_id
      - final_level
      - expected_call_version
      - override_reason_code?
      - override_narrative?
    output: Disposition
    side_effects:
      - "computes Disposition.recommended_level per calculations.disposition_recommendation"
      - "creates Disposition with advice_status AUTHORIZED, audit_status AWAITING_OUTCOME and determined_by_nurse_id = X-User-ID"
      - "computes requires_callback / risk_class / due_by_utc / max_attempts per calculations.callback_requirement and creates the CallbackTask, incrementing Practice.open_callback_count"
      - "when final_level == EMERGENCY_911: sets TriageCall.requires_warm_transfer = true, then increments Nurse.pending_high_risk_count, then flips Nurse.intake_eligibility to OFF_ROTATION once high_risk_cap is reached"
      - "sets TriageCall.status = DISPOSITIONED and increments TriageCall.version by 1"

  - method: GET
    path: /dispositions/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one disposition, exposing both independent state dimensions (advice_status and audit_status) in the same response."
    input: []
    output: Disposition

  - method: GET
    path: /dispositions
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists dispositions. Reverse-reachability read for Disposition.call_id, Disposition.assessment_id, Disposition.determined_by_nurse_id and Disposition.overridden_by_nurse_id."
    input:
      - call_id?
      - assessment_id?
      - determined_by_nurse_id?
      - overridden_by_nurse_id?
      - advice_status?
      - audit_status?
      - limit?
      - offset?
    output: Disposition[]

  - method: POST
    path: /dispositions/{id}/override
    roles: [ChargeNurse]
    description: |
      Charge-nurse override of a determined disposition, at most one ordinal
      step in either direction, never away from EMERGENCY_911, never by the
      nurse who determined it, and always with a reason code plus a narrative
      of at least 40 characters. Recomputes the callback obligation from the
      new level.
    input:
      - final_level
      - override_reason_code
      - override_narrative
    output: Disposition
    side_effects:
      - "sets final_level, is_override = true, override_reason_code, override_narrative, overridden_by_nurse_id = X-User-ID and advice_status = OVERRIDDEN"
      - "recomputes requires_callback / risk_class / due_by_utc; a softened level cancels the open CallbackTask (decrementing Practice.open_callback_count) and creates a replacement at the new risk_class when a callback is still owed"
      - "when the level leaves EMERGENCY_911: clears TriageCall.requires_warm_transfer, decrements Nurse.pending_high_risk_count and restores intake_eligibility"
      - "increments Disposition.version and TriageCall.version by 1 each"

  - method: POST
    path: /dispositions/{id}/audit-records
    roles: [ComplianceAuditor]
    description: |
      Records the observed clinical outcome against the advice given and
      classifies the variance. One immutable record per disposition; the
      callback obligation must be resolved first, and the outcome cannot
      predate the disposition.
    input:
      - reported_outcome
      - outcome_source
      - outcome_observed_at
    output: ComplianceAuditRecord
    side_effects:
      - "creates the immutable ComplianceAuditRecord with outcome_ordinal, disposition_level_ordinal, variance_class and variance_severity_points per calculations.outcome_variance_classification"
      - "sets Disposition.audit_status = OUTCOME_RECORDED, then CONCORDANT_CLOSED when variance_class == CONCORDANT or VARIANCE_ESCALATED when variance_class == UNDERTRIAGE"
      - "on UNDERTRIAGE only: increments Practice.open_variance_count, then flips Practice.compliance_posture to UNDER_REVIEW at variance_review_threshold, then flips that practice's DRAFT coverage windows to BLOCKED"

  - method: GET
    path: /dispositions/{id}/audit-records
    roles: [PlatformAdmin, ComplianceAuditor, PracticeLiaison]
    description: "Lists the audit records for a disposition. Reverse-reachability read for ComplianceAuditRecord.disposition_id."
    input: []
    output: ComplianceAuditRecord[]

  # ---- WarmTransfer --------------------------------------------------------
  - method: POST
    path: /triage-calls/{id}/warm-transfers
    roles: [TriageNurse]
    description: "Opens a warm transfer to emergency services, capturing the caller's location. Only permitted once the call requires one, and only while no other transfer for the call is still live or already completed."
    input:
      - psap_center_code
      - location_source
      - location_address_line
      - location_state_code
      - location_lat
      - location_lng
      - callback_number
    output: WarmTransfer
    side_effects:
      - "creates WarmTransfer with status INITIATED and location_verified_by / location_confidence_pct / psap_incident_number null"

  - method: GET
    path: /warm-transfers/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one warm transfer."
    input: []
    output: WarmTransfer

  - method: GET
    path: /triage-calls/{id}/warm-transfers
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists the warm transfers of a call. Reverse-reachability read for WarmTransfer.call_id."
    input:
      - status?
    output: WarmTransfer[]

  - method: POST
    path: /warm-transfers/{id}/confirm-location
    roles: [TriageNurse]
    description: "The assigned nurse attests to the captured location. Confidence below 75% is rejected, so the transfer cannot be offered to a PSAP on a guess."
    input:
      - location_confidence_pct
    output: WarmTransfer
    side_effects:
      - "sets location_verified_by = X-User-ID, location_confidence_pct, status = LOCATION_CONFIRMED and increments WarmTransfer.version by 1"

  - method: POST
    path: /warm-transfers/{id}/psap-response
    roles: [IntakeAgent]
    description: "Records the emergency dispatch centre's answer. Acceptance requires an incident number; rejection is terminal and frees the slot for a fresh transfer."
    input:
      - accepted
      - psap_incident_number?
    output: WarmTransfer
    side_effects:
      - "on accepted true: sets psap_incident_number and status = ACCEPTED_BY_PSAP"
      - "on accepted false: sets status = REJECTED_BY_PSAP, leaves psap_incident_number null and leaves TriageCall.requires_warm_transfer true"
      - "increments WarmTransfer.version by 1"

  - method: POST
    path: /warm-transfers/{id}/complete-handoff
    roles: [TriageNurse]
    description: "Closes the handoff to the PSAP, which is the precondition for completing a call that required a transfer."
    input: []
    output: WarmTransfer
    side_effects:
      - "sets status = HANDOFF_COMPLETE and increments WarmTransfer.version by 1"
      - "sets TriageCall.warm_transfer_completed_at = logical clock and increments TriageCall.version by 1"

  # ---- Call closure --------------------------------------------------------
  - method: POST
    path: /triage-calls/{id}/complete
    roles: [TriageNurse]
    description: "Closes the call and bills it. Handle time is rounded up to five-minute increments and priced per call before the practice ledgers are credited."
    input:
      - handle_minutes
    output: TriageCall
    side_effects:
      - "sets handle_minutes, billable_minutes and advice_fee_cents per calculations.call_advice_fee"
      - "credits Practice.billed_advice_minutes_total and Practice.advice_fee_accrued_cents with the already-rounded per-call values"
      - "sets closed_at = logical clock, status = CLOSED, decrements Nurse.active_call_load by 1 and releases any high-risk hold"
      - "increments TriageCall.version by 1"

  - method: POST
    path: /triage-calls/{id}/reopen
    roles: [ChargeNurse]
    description: "Compensating action for complete, available for 72 hours after closure. Reverses the exact amounts that were credited so neither ledger drifts."
    input:
      - reopen_reason?
    output: TriageCall
    side_effects:
      - "debits Practice.billed_advice_minutes_total and Practice.advice_fee_accrued_cents by exactly the amounts this call credited"
      - "resets handle_minutes to null, billable_minutes to 0 and advice_fee_cents to 0"
      - "sets status = DISPOSITIONED, increments reopen_count by 1, increments Nurse.active_call_load by 1 and re-applies any high-risk hold"
      - "increments TriageCall.version by 1"

  - method: POST
    path: /triage-calls/{id}/abandon
    roles: [IntakeAgent, ChargeNurse]
    description: "Terminates a live call. Voids any authorized advice and cancels any open callbacks, releasing every counter the call was holding."
    input:
      - abandon_reason
    output: TriageCall
    side_effects:
      - "sets abandon_reason, status = ABANDONED and increments TriageCall.version by 1"
      - "decrements Nurse.active_call_load by 1 when the call was assigned"
      - "voids the call's AUTHORIZED / OVERRIDDEN dispositions, which cancels their open CallbackTask rows and decrements Practice.open_callback_count once per cancelled task"

  # ---- CallbackTask --------------------------------------------------------
  - method: GET
    path: /callback-tasks/{id}
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Reads one callback task with its risk class, due time and attempt counter."
    input: []
    output: CallbackTask

  - method: GET
    path: /callback-tasks
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: "Lists callback tasks — this is the practice's next-day callback list when filtered by practice_id and due_before_utc. Reverse-reachability read for CallbackTask.disposition_id, CallbackTask.practice_id, CallbackTask.assigned_nurse_id and CallbackTask.verified_by_nurse_id."
    input:
      - practice_id?
      - disposition_id?
      - assigned_nurse_id?
      - verified_by_nurse_id?
      - status?
      - risk_class?
      - due_before_utc?
      - limit?
      - offset?
    output: CallbackTask[]

  - method: POST
    path: /callback-tasks/{id}/attempts
    roles: [TriageNurse]
    description: "Logs a callback attempt. A failed attempt that exhausts max_attempts expires the task, and an expired HIGH_RISK task is itself a compliance variance."
    input:
      - outcome
    output: CallbackTask
    side_effects:
      - "on a failed outcome below the attempt limit: increments attempt_count, sets last_attempt_outcome, sets status = ATTEMPTED"
      - "on outcome REACHED: sets status = REACHED and leaves attempt_count unchanged"
      - "on a failed outcome that exhausts max_attempts: sets status = EXPIRED, decrements Practice.open_callback_count and, for HIGH_RISK, drives the parent Disposition to VARIANCE_ESCALATED and the practice variance cascade"
      - "increments CallbackTask.version by 1"

  - method: POST
    path: /callback-tasks/{id}/verify
    roles: [TriageNurse]
    description: "Verification of a high-risk or standard disposition by a nurse other than the one who gave the advice. A worsened patient escalates the disposition into the compliance variance cascade."
    input:
      - patient_condition
      - advice_followed
      - verifier_attestation
    output: CallbackTask
    side_effects:
      - "sets patient_condition, advice_followed, verifier_attestation, verified_by_nurse_id = X-User-ID and verified_at = logical clock"
      - "on IMPROVED / UNCHANGED: sets status = VERIFIED, decrements Practice.open_callback_count and stamps Disposition.callback_verified_at"
      - "on WORSENED: sets status = ESCALATED, decrements Practice.open_callback_count, increments Practice.escalated_callback_count, then drives Disposition.audit_status to VARIANCE_ESCALATED, Practice.open_variance_count, Practice.compliance_posture and the practice's DRAFT coverage windows in that order"
      - "increments CallbackTask.version by 1"

  # ---- Staffing ------------------------------------------------------------
  - method: GET
    path: /staffing-adequacy
    roles: [PlatformAdmin, ChargeNurse, PracticeLiaison]
    description: |
      Computed read. Compares scheduled licensed nurse minutes against the
      minutes the offered call volume demands for one state over one window.
      All three query parameters are mandatory at runtime (a missing one is
      ERR_INVALID_REQUEST); they are declared optional in `input:` because
      they travel in the query string rather than in a body.
    input:
      - state_code?
      - window_start_utc?
      - window_end_utc?
    output:
      state_code: string
      window_start_utc: string
      window_end_utc: string
      offered_call_count: integer
      required_nurse_minutes: integer
      scheduled_nurse_minutes: integer
      adequacy_ratio_pct: number
      staffing_posture: string
      licensed_nurse_count: integer

  # ---- Test-driving clock --------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlatformAdmin, IntakeAgent, TriageNurse, ChargeNurse, ComplianceAuditor, PracticeLiaison]
    description: |
      Test-driving endpoint. Sets the server's logical clock, which is the sole
      source of "now" for after-hours determination, licence and shift status,
      callback due times, the 72-hour reopen window and every audit period.
      The logical clock starts at 2026-08-01T00:00:00Z on a fresh server and
      only ever moves through this endpoint. No authentication is required and
      the caller's role is ignored.
    input:
      - to_iso8601
    output:
      current_utc: string
    side_effects:
      - "sets the logical clock to to_iso8601; no business row is mutated by the call itself"

