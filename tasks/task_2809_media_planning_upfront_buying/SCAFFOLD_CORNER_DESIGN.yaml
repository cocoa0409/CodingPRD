  # =========================================================================
  # Consistency model - §1.0 declares immediate consistency.
  # =========================================================================
  - section: consistency_model
    instances:
      - name: rights_exercise_effects_are_visible_in_the_same_response_and_the_next_read
        claim_type: Immediate Visibility
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[POST /upfront/rights-exercises]"
          - "calculations.negotiated_buy_cost"
          - "entities.Campaign.fields.committed_gross_cents"
        distinguishing_aspect: |
          One option roll-up rewrites four rows: the exercise record, the buy, its allocation and the
          campaign. Under immediate consistency the 201 response already carries the computed deltas
          (delta_impressions 100,000 and delta_gross_cents 235,400) and the very next reads - with no
          retry, no polling and no second mutation - must show the recomputed buy (gross 2,589,400) and
          the recomputed rollups (campaign committed 2,589,400, uncommitted 7,410,600). An
          implementation that defers the rollups to the next write of the campaign fails on the first
          read even though the exercise row is correct.
        test_recipe:
          setup:
            - "a placed buy guaranteeing 1,000,000 impressions at 2200 CPM, inside its option window"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
