# =============================================================================
# SCAFFOLD.yaml — Drive-Thru-Only Coffee Stand Throughput & Crew Staffing
# (task_3048_drive_thru_only_coffee_stand_throughput_crew)
#
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Drive-Thru-Only Coffee Stand Throughput & Crew Staffing (Dutch Bros): small-footprint stands with dual drive-thru lanes and order-runner staffing outside the window, hand-crafted beverage build times balanced against line-of-car targets, order taking on tablets ahead of the window with payment capture and sequencing, crew scheduling with heavy peak staffing and rapid role rotation, shop operator selection from internal crew with regional franchise-like agreements, loyalty app ordering that must merge into a lane-based queue, seasonal and secret-menu drink introductions with recipe distribution, site selection constrained by lane stacking and traffic ingress

domain_name: drive-thru-coffee-stand
# Flat topology: all resources are peers joined by foreign keys, so there is no
# single top-level collection; api_prefix is empty and every collection hangs
# directly off the root (e.g. GET /stands/{id}, GET /orders?stand_id=...).
api_prefix: ""

# =============================================================================
# Complexity profile (§0.1–§0.4) — Expert band, pushed to maximum density
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating       # Stand posture (OPEN/THROTTLED/SUSPENDED) gates every child op
  secondary_archetype: quota_allocation          # finite lane stacking slots reserved/released per order
  complexity_layers:
    - optimistic_concurrency                     # OCC on Stand.version (order create/merge) and Shift.version (assignment plan)
    - cascading_side_effects                     # agreement termination → stand suspend → order abandon → payment void
    - dual_variant_calculation                   # provisional vs final throughput; provisional vs reconciled staffing deficit
    - selector_policy                            # lane-merge selector: eligibility, ranking, tie-break, empty-pool fallback
  entity_topology: flat
  state_machine_shape: parallel                  # Order carries queue × payment × build dimensions; plus cyclic machines elsewhere
  relationship_patterns:
    - one_to_many
    - cross_aggregate                            # OrderItem → Recipe crosses the catalog aggregate; ShiftAssignment → CrewMember crosses HR aggregate
  role_model: segregation_of_duties              # nominator ≠ approver (agreements); refund initiator ≠ approver (payments)
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities, flat topology)
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Region display name" }
      - { name: code, type: string, source: input, description: "Region code; unique across regions", constraints: "unique" }

  - name: Stand
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region this site belongs to" }
      - { name: name, type: string, source: input, description: "Stand display name" }
      - { name: min_ingress_gap_seconds, type: integer, source: input, description: "Measured traffic ingress gap at the site; must be >= 30 at approval" }
      - { name: lane_configs, type: array, source: input, description: "Array of {lane_code, max_stack_cars}; 1..2 entries, lane_code unique per stand, max_stack_cars >= 1" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | OPEN | THROTTLED | SUSPENDED | CLOSED", default: "PROPOSED" }
      - { name: consecutive_breach_windows, type: integer, source: computed, description: "Count of consecutive CLOSED_BREACH throughput windows; reset to 0 on CLOSED_PASS; stand auto-THROTTLED at >= 2", default: 0 }
      - { name: lane_occupancy, type: object, source: computed, description: "Map lane_code -> count of orders in that lane with queue_status IN {MERGED, AT_WINDOW}" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Crew member legal name" }
      - { name: home_stand_id, type: string, source: input, description: "FK -> Stand.id; home stand of this crew member" }
      - { name: hired_on, type: string, source: input, description: "ISO date of hire; operator nomination requires tenure >= 365 days at current logical clock" }
      - { name: food_handler_cert_expires_on, type: string, source: input, description: "ISO date; assignments and operator nominations require this to be strictly after the current logical clock date" }

  - name: OperatorAgreement
    parent: null
    common_fields: true
    fields:
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id; stand the agreement governs" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; internal crew member selected as shop operator" }
      - { name: revenue_share_pct, type: number, source: input, description: "Operator revenue share, 0 < pct < 1" }
      - { name: nominated_by, type: string, source: system, description: "X-User-ID of the nominating RegionalManager" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the approving PlatformAdmin; must differ from nominated_by" }
      - { name: activated_on, type: string, source: system, description: "ISO date the agreement became ACTIVE; null until activation" }
      - { name: status, type: enum, source: system, description: "NOMINATED | APPROVED | ACTIVE | SUSPENDED | TERMINATED", default: "NOMINATED" }

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Drink name; unique across recipes", constraints: "unique" }
      - { name: channel, type: enum, source: input, description: "CORE | SEASONAL | SECRET" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price in cents; >= 1" }
      - { name: base_build_seconds, type: integer, source: input, description: "Base hand-crafted build time; >= 1" }
      - { name: temperature_class, type: enum, source: input, description: "HOT | ICED | BLENDED; BLENDED adds +15s in build_time" }
      - { name: season_start, type: string, source: input, description: "ISO date, inclusive; required iff channel == SEASONAL", default: null }
      - { name: season_end, type: string, source: input, description: "ISO date, exclusive; required iff channel == SEASONAL; must be > season_start", default: null }
      - { name: modifiers, type: array, source: input, description: "Array of {name, price_cents, build_seconds_adder}; names unique within recipe", default: [] }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: "ACTIVE" }

  - name: RecipeDistribution
    parent: null
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id" }
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id" }
      - { name: status, type: enum, source: system, description: "STAGED | ACTIVATED | SUSPENDED | WITHDRAWN", default: "STAGED" }

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: home_stand_id, type: string, source: input, description: "FK -> Stand.id" }
      - { name: points, type: integer, source: computed, description: "Loyalty points; earned floor(captured_cents/100) per capture, reversed floor(refunded_cents/100) per refund; adjusted via points-adjustments", default: 0 }
      - { name: tier, type: enum, source: computed, description: "NONE | SILVER | GOLD from points: >=500 GOLD (10% line discount), >=200 SILVER (5%), else NONE", default: "NONE" }
      - { name: lifetime_captured_cents, type: integer, source: computed, description: "Sum of captured_cents across this account's orders", default: 0 }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start (ISO8601); must be after current logical clock at creation" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end; must be after starts_at" }
      - { name: is_peak, type: boolean, source: input, description: "Peak shifts require >= 4 non-cancelled assignments at publish; base minimum is 2" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | IN_PROGRESS | RECONCILED | LOCKED", default: "DRAFT" }
      - { name: provisional_deficit_score, type: integer, source: computed, description: "Forward-looking deficit at publish: max(0, required_crew - confirmed) * 10 + (has_lead ? 0 : 25); null until publish", default: null }
      - { name: reconciled_deficit_score, type: integer, source: computed, description: "Reconciled at reconcile: max(0, required_crew - checked_in) * 10 + (has_checked_in_lead ? 0 : 25) + no_show_count * 5; null until reconcile", default: null }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: role, type: enum, source: input, description: "TAKER | BAR | RUNNER | LEAD; rapid rotation: one assignment may not exceed 120 minutes" }
      - { name: starts_at, type: datetime, source: input, description: "Assignment start; must lie within shift bounds" }
      - { name: ends_at, type: datetime, source: input, description: "Assignment end; must be after starts_at and within shift bounds" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CHECKED_IN | NO_SHOW | CANCELLED", default: "ASSIGNED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id" }
      - { name: loyalty_account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; required when source == LOYALTY_APP; optional phone-lookup for WINDOW", default: null }
      - { name: source, type: enum, source: input, description: "WINDOW (tablet at the stand) | LOYALTY_APP (app-ahead order that later merges into a lane)" }
      - { name: lane_code, type: string, source: input, description: "Required when source == WINDOW; ignored for LOYALTY_APP (assigned by the lane-merge selector at merge)", default: null }
      - { name: lane_seq, type: integer, source: computed, description: "Per-lane monotonic sequence assigned when the order enters a lane (window create or app merge); governs payment-capture sequencing", default: null }
      - { name: queue_status, type: enum, source: system, description: "QUEUED | MERGED | AT_WINDOW | SERVED | ABANDONED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | AUTHORIZED | CAPTURED | REFUND_PENDING | REFUNDED | VOIDED; mirrors the order's Payment.status", default: "UNPAID" }
      - { name: build_status, type: enum, source: system, description: "QUEUED | BUILDING | READY | HANDED_OFF; derived from child OrderItems", default: "QUEUED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_gross_cents over non-cancelled items" }
      - { name: discount_cents, type: integer, source: computed, description: "Sum of per-line rounded loyalty discounts (round per line, then sum)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: outstanding_build_seconds, type: integer, source: computed, description: "Sum of build_time_seconds over items with build_status IN {PENDING, BUILDING}" }
      - { name: handoff_at, type: datetime, source: system, description: "Logical-clock timestamp of handoff; null until SERVED", default: null }

  - name: OrderItem
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id; price/build snapshots taken at order creation" }
      - { name: quantity, type: integer, source: input, description: "Quantity; >= 1" }
      - { name: modifier_names, type: array, source: input, description: "Subset of the recipe's modifier names", default: [] }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot: recipe.base_price_cents + sum of chosen modifier price_cents" }
      - { name: line_gross_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: line_discount_cents, type: integer, source: computed, description: "round_half_up(line_gross_cents * loyalty tier pct); 0 when no account" }
      - { name: line_net_cents, type: integer, source: computed, description: "line_gross_cents - line_discount_cents" }
      - { name: build_time_seconds, type: integer, source: computed, description: "Snapshot of build_time calculation at order creation (staffing multiplier applied)" }
      - { name: build_status, type: enum, source: system, description: "PENDING | BUILDING | READY | CANCELLED", default: "PENDING" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; exactly one payment per order" }
      - { name: authorized_cents, type: integer, source: computed, description: "Amount authorized; equals order total at authorize time" }
      - { name: captured_cents, type: integer, source: computed, description: "Amount captured; 0 until capture", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative refunded amount; never exceeds captured_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "AUTHORIZED | CAPTURED | REFUND_PENDING | REFUNDED | VOIDED" }
      - { name: refund_initiated_by, type: string, source: system, description: "X-User-ID of the ShiftLead who opened the pending refund; null unless REFUND_PENDING", default: null }
      - { name: refund_decided_by, type: string, source: system, description: "X-User-ID of the StandOperator who decided the pending refund", default: null }
      - { name: captured_at, type: datetime, source: system, description: "Logical-clock timestamp of capture; drives royalty month attribution", default: null }

  - name: ThroughputWindow
    parent: null
    common_fields: true
    fields:
      - { name: stand_id, type: string, source: input, description: "FK -> Stand.id" }
      - { name: starts_at, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: ends_at, type: datetime, source: input, description: "Window end, exclusive; windows on the same stand must be disjoint AND separated by >= 15 minutes" }
      - { name: target_cars, type: integer, source: input, description: "Line-of-cars target; PASS iff served_count >= target_cars" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_PASS | CLOSED_BREACH", default: "OPEN" }
      - { name: served_count, type: integer, source: computed, description: "Final chronological count of orders with handoff_at in [starts_at, ends_at); null until close", default: null }
      - { name: provisional_projected_cars, type: integer, source: computed, description: "Forward-looking projection while OPEN: orders handed off in window so far + orders at this stand with queue_status IN {QUEUED, MERGED, AT_WINDOW}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Stand
    initial_state: PROPOSED
    terminal_states: [CLOSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /stands/{standId}/approve"
        actor: PlatformAdmin
        preconditions:
          - "stand.status == PROPOSED (ERR_STAND_INVALID_TRANSITION)"
          - "sum of lane_configs[*].max_stack_cars >= 10 (ERR_SITE_STACKING_INSUFFICIENT)"
          - "min_ingress_gap_seconds >= 30 (ERR_INGRESS_GAP_INSUFFICIENT)"
        side_effects: []
      - from: APPROVED
        to: OPEN
        trigger: "POST /stands/{standId}/open"
        actor: StandOperator
        preconditions:
          - "stand.status IN {APPROVED, SUSPENDED} (ERR_STAND_INVALID_TRANSITION)"
          - "an OperatorAgreement with status == ACTIVE exists for this stand (ERR_NO_ACTIVE_AGREEMENT_FOR_STAND)"
        side_effects:
          - "stand.consecutive_breach_windows reset to 0"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /stands/{standId}/open"
        actor: StandOperator
        preconditions:
          - "an OperatorAgreement with status == ACTIVE exists for this stand (ERR_NO_ACTIVE_AGREEMENT_FOR_STAND)"
        side_effects:
          - "stand.consecutive_breach_windows reset to 0"
      - from: OPEN
        to: THROTTLED
        trigger: "POST /stands/{standId}/throttle"
        actor: ShiftLead
        preconditions:
          - "stand.status == OPEN (ERR_STAND_INVALID_TRANSITION)"
        side_effects: []
      - from: OPEN
        to: THROTTLED
        trigger: "system (automatic when a throughput window close raises stand.consecutive_breach_windows to >= 2)"
        actor: system
        preconditions:
          - "stand.status == OPEN"
        side_effects: []
      - from: THROTTLED
        to: OPEN
        trigger: "POST /stands/{standId}/resume"
        actor: ShiftLead
        preconditions:
          - "stand.status == THROTTLED (ERR_STAND_INVALID_TRANSITION)"
        side_effects: []
      - from: OPEN
        to: SUSPENDED
        trigger: "system (automatic when the last ACTIVE OperatorAgreement for the stand is terminated or suspended)"
        actor: system
        preconditions:
          - "no OperatorAgreement with status == ACTIVE remains for the stand"
        side_effects:
          - "every Order at this stand with queue_status IN {QUEUED, MERGED, AT_WINDOW} -> ABANDONED, lane slot released (lane_occupancy recomputed)"
          - "each such abandonment voids its AUTHORIZED Payment -> VOIDED"
      - from: THROTTLED
        to: SUSPENDED
        trigger: "system (same trigger as OPEN -> SUSPENDED)"
        actor: system
        preconditions:
          - "no OperatorAgreement with status == ACTIVE remains for the stand"
        side_effects:
          - "same abandonment + void cascade as OPEN -> SUSPENDED"
      - from: OPEN
        to: CLOSED
        trigger: "POST /stands/{standId}/close"
        actor: StandOperator
        preconditions:
          - "stand.status == OPEN (ERR_STAND_INVALID_TRANSITION)"
          - "no Order at this stand has queue_status IN {QUEUED, MERGED, AT_WINDOW} (ERR_STAND_INVALID_TRANSITION)"
        side_effects: []
      - from: THROTTLED
        to: CLOSED
        trigger: "POST /stands/{standId}/close"
        actor: StandOperator
        preconditions:
          - "no Order at this stand has queue_status IN {QUEUED, MERGED, AT_WINDOW} (ERR_STAND_INVALID_TRANSITION)"
        side_effects: []

  - entity: OperatorAgreement
    initial_state: NOMINATED
    terminal_states: [TERMINATED]
    transitions:
      - from: NOMINATED
        to: APPROVED
        trigger: "POST /operator-agreements/{agreementId}/approve"
        actor: PlatformAdmin
        preconditions:
          - "agreement.status == NOMINATED (ERR_AGREEMENT_INVALID_STATE)"
          - "approver X-User-ID != agreement.nominated_by (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "agreement.approved_by set to approver X-User-ID"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /operator-agreements/{agreementId}/activate"
        actor: StandOperator
        preconditions:
          - "agreement.status == APPROVED (ERR_AGREEMENT_INVALID_STATE)"
          - "acting StandOperator's X-User-ID == agreement.crew_member_id (ERR_UNAUTHORIZED_ROLE)"
          - "no other ACTIVE agreement exists for this stand (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "agreement.activated_on set to current logical clock date"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /operator-agreements/{agreementId}/suspend"
        actor: RegionalManager
        preconditions:
          - "agreement.status == ACTIVE (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "if no other ACTIVE agreement remains for the stand, stand OPEN|THROTTLED -> SUSPENDED with the full abandonment/void cascade"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /operator-agreements/{agreementId}/reinstate"
        actor: RegionalManager
        preconditions:
          - "agreement.status == SUSPENDED (ERR_AGREEMENT_INVALID_STATE)"
          - "no other ACTIVE agreement exists for this stand (ERR_AGREEMENT_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /operator-agreements/{agreementId}/terminate"
        actor: RegionalManager
        preconditions:
          - "agreement.status IN {ACTIVE, SUSPENDED} (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "if no other ACTIVE agreement remains for the stand, stand OPEN|THROTTLED -> SUSPENDED (link 1)"
          - "stand suspension abandons every order with queue_status IN {QUEUED, MERGED, AT_WINDOW} (link 2)"
          - "each abandoned order's AUTHORIZED payment -> VOIDED and its lane slot released (link 3)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /operator-agreements/{agreementId}/terminate"
        actor: RegionalManager
        preconditions: []
        side_effects:
          - "same cascade as ACTIVE -> TERMINATED (no-op if stand already SUSPENDED and queue already drained)"

  - entity: Shift
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /shifts/{shiftId}/publish"
        actor: StandOperator
        preconditions:
          - "shift.status == DRAFT (ERR_SHIFT_INVALID_STATE)"
          - "an OperatorAgreement with status == ACTIVE exists for shift.stand_id (ERR_AGREEMENT_NOT_ACTIVE)"
          - "if shift.is_peak: non-cancelled assignment count >= 4 (ERR_PEAK_STAFFING_INSUFFICIENT)"
        side_effects:
          - "provisional_deficit_score computed (staffing_deficit_score, provisional variant)"
      - from: PUBLISHED
        to: IN_PROGRESS
        trigger: "POST /shifts/{shiftId}/start"
        actor: StandOperator
        preconditions:
          - "shift.status == PUBLISHED (ERR_SHIFT_INVALID_STATE)"
          - "current logical clock >= shift.starts_at (ERR_SHIFT_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: RECONCILED
        trigger: "POST /shifts/{shiftId}/reconcile"
        actor: StandOperator
        preconditions:
          - "shift.status == IN_PROGRESS (ERR_SHIFT_INVALID_STATE)"
          - "current logical clock >= shift.ends_at (ERR_SHIFT_INVALID_STATE)"
        side_effects:
          - "every assignment still ASSIGNED -> NO_SHOW"
          - "reconciled_deficit_score computed (staffing_deficit_score, reconciled variant)"
      - from: RECONCILED
        to: LOCKED
        trigger: "POST /shifts/{shiftId}/lock"
        actor: StandOperator
        preconditions:
          - "shift.status == RECONCILED (ERR_SHIFT_INVALID_STATE)"
        side_effects: []

  - entity: ShiftAssignment
    initial_state: ASSIGNED
    terminal_states: [NO_SHOW, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /shift-assignments/{assignmentId}/check-in"
        actor: CrewMember
        preconditions:
          - "assignment.status == ASSIGNED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "acting X-User-ID == assignment.crew_member_id (ERR_UNAUTHORIZED_ROLE)"
          - "parent shift.status == IN_PROGRESS (ERR_SHIFT_INVALID_STATE)"
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /shift-assignments/{assignmentId}/cancel"
        actor: StandOperator
        preconditions:
          - "assignment.status == ASSIGNED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "parent shift.status IN {DRAFT, PUBLISHED} (ERR_SHIFT_INVALID_STATE)"
        side_effects: []
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system (automatic during shift reconcile)"
        actor: system
        preconditions: []
        side_effects:
          - "parent shift.reconciled_deficit_score recomputed"

  - entity: Recipe
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /recipes/{recipeId}/retire"
        actor: PlatformAdmin
        preconditions:
          - "recipe.status == ACTIVE (ERR_INVALID_PAYLOAD)"
          - "no RecipeDistribution for this recipe has status IN {STAGED, ACTIVATED, SUSPENDED} (ERR_RECIPE_HAS_ACTIVE_DISTRIBUTIONS)"
        side_effects: []

  - entity: RecipeDistribution
    initial_state: STAGED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: STAGED
        to: ACTIVATED
        trigger: "POST /recipe-distributions/{distributionId}/activate"
        actor: StandOperator
        preconditions:
          - "distribution.status IN {STAGED, SUSPENDED} (ERR_DISTRIBUTION_INVALID_STATE)"
          - "recipe.status == ACTIVE (ERR_DISTRIBUTION_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVATED
        trigger: "POST /recipe-distributions/{distributionId}/activate"
        actor: StandOperator
        preconditions:
          - "recipe.status == ACTIVE (ERR_DISTRIBUTION_INVALID_STATE)"
        side_effects: []
      - from: ACTIVATED
        to: SUSPENDED
        trigger: "POST /recipe-distributions/{distributionId}/suspend"
        actor: StandOperator
        preconditions:
          - "distribution.status == ACTIVATED (ERR_DISTRIBUTION_INVALID_STATE)"
        side_effects: []
      - from: ACTIVATED
        to: WITHDRAWN
        trigger: "POST /recipe-distributions/{distributionId}/withdraw"
        actor: StandOperator
        preconditions:
          - "distribution.status IN {ACTIVATED, SUSPENDED} (ERR_DISTRIBUTION_INVALID_STATE)"
        side_effects:
          - "every OrderItem at this stand referencing this recipe with build_status IN {PENDING, BUILDING} -> CANCELLED (link 1)"
          - "each affected parent Order recomputes subtotal_cents, discount_cents, total_cents and outstanding_build_seconds (link 2)"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /recipe-distributions/{distributionId}/withdraw"
        actor: StandOperator
        preconditions: []
        side_effects:
          - "same item-cancellation cascade as ACTIVATED -> WITHDRAWN"

  - entity: Order
    initial_state: QUEUED
    terminal_states: [SERVED, ABANDONED]
    note: "PARALLEL machine: queue_status, payment_status and build_status evolve independently on the same row. queue: QUEUED (LOYALTY_APP initial) or MERGED (WINDOW initial) -> AT_WINDOW -> SERVED | ABANDONED; QUEUED -> MERGED via merge; ABANDONED reachable from QUEUED|MERGED|AT_WINDOW. payment: UNPAID -> AUTHORIZED -> CAPTURED -> REFUND_PENDING -> REFUNDED; AUTHORIZED -> VOIDED; REFUND_PENDING -> CAPTURED on refund reject. build: QUEUED -> BUILDING -> READY -> HANDED_OFF derived from items."
    transitions:
      - from: QUEUED
        to: MERGED
        trigger: "POST /orders/{orderId}/merge"
        actor: LoyaltyCustomer
        preconditions:
          - "order.queue_status == QUEUED (ERR_ORDER_INVALID_STATE)"
          - "order.source == LOYALTY_APP (ERR_ORDER_INVALID_STATE)"
          - "acting LoyaltyCustomer's X-User-ID == order.loyalty_account_id (ERR_UNAUTHORIZED_ROLE)"
          - "stand.status IN {OPEN, THROTTLED} (ERR_STAND_NOT_ACCEPTING_ORDERS)"
          - "OCC: expected_stand_version == stand.version (ERR_STALE_VERSION)"
        side_effects:
          - "lane_code assigned by lane_merge_position selector; lane_seq assigned (max existing lane_seq in lane + 1, or 1)"
          - "lane slot reserved: stand.lane_occupancy[lane_code] += 1"
          - "increments Stand.version by 1"
      - from: MERGED
        to: AT_WINDOW
        trigger: "POST /orders/{orderId}/call-to-window"
        actor: ShiftLead
        preconditions:
          - "order.queue_status == MERGED (ERR_ORDER_INVALID_STATE)"
        side_effects: []
      - from: AT_WINDOW
        to: SERVED
        trigger: "POST /orders/{orderId}/handoff"
        actor: ShiftLead
        preconditions:
          - "order.queue_status == AT_WINDOW (ERR_ORDER_INVALID_STATE)"
          - "order.payment_status == CAPTURED (ERR_PAYMENT_INVALID_STATE)"
          - "order.build_status == READY (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "order.handoff_at set to current logical clock"
          - "order.build_status -> HANDED_OFF"
          - "lane slot released: stand.lane_occupancy[lane_code] -= 1"
      - from: QUEUED
        to: ABANDONED
        trigger: "POST /orders/{orderId}/abandon or system cascade from stand suspension"
        actor: ShiftLead
        preconditions:
          - "order.queue_status IN {QUEUED, MERGED, AT_WINDOW} (ERR_ORDER_INVALID_STATE)"
          - "order.payment_status NOT IN {CAPTURED, REFUND_PENDING, REFUNDED} (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "if payment_status == AUTHORIZED: payment -> VOIDED"
          - "if lane_code assigned: lane slot released (lane_occupancy recomputed)"
          - "child OrderItems with build_status IN {PENDING, BUILDING} -> CANCELLED"
      - from: MERGED
        to: ABANDONED
        trigger: "POST /orders/{orderId}/abandon or system cascade"
        actor: ShiftLead
        preconditions: ["same as QUEUED -> ABANDONED"]
        side_effects: ["same as QUEUED -> ABANDONED"]
      - from: AT_WINDOW
        to: ABANDONED
        trigger: "POST /orders/{orderId}/abandon or system cascade"
        actor: ShiftLead
        preconditions: ["same as QUEUED -> ABANDONED"]
        side_effects: ["same as QUEUED -> ABANDONED"]

  - entity: Payment
    initial_state: AUTHORIZED
    terminal_states: [REFUNDED, VOIDED]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /payments/{paymentId}/capture"
        actor: ShiftLead
        preconditions:
          - "payment.status == AUTHORIZED (ERR_PAYMENT_INVALID_STATE)"
          - "order.queue_status IN {MERGED, AT_WINDOW} (ERR_ORDER_INVALID_STATE)"
          - "capture sequencing: no other order in the same lane with smaller lane_seq has queue_status NOT IN {SERVED, ABANDONED} AND payment_status IN {UNPAID, AUTHORIZED} (ERR_CAPTURE_OUT_OF_SEQUENCE)"
        side_effects:
          - "captured_cents = authorized_cents; captured_at = current logical clock"
          - "order.payment_status -> CAPTURED"
          - "loyalty accrual: account.points += floor(captured_cents / 100); lifetime_captured_cents += captured_cents; tier recomputed (when order has loyalty_account_id)"
      - from: CAPTURED
        to: REFUND_PENDING
        trigger: "POST /payments/{paymentId}/refunds with amount_cents > 2000"
        actor: ShiftLead
        preconditions:
          - "payment.status == CAPTURED (ERR_PAYMENT_INVALID_STATE)"
          - "refunded_cents + amount_cents <= captured_cents (ERR_REFUND_EXCEEDS_CAPTURED)"
        side_effects:
          - "refund_initiated_by set to initiator X-User-ID; pending amount recorded"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /payments/{paymentId}/refunds with amount_cents <= 2000 (auto-approved) when refunded_cents + amount_cents == captured_cents"
        actor: ShiftLead
        preconditions:
          - "payment.status == CAPTURED (ERR_PAYMENT_INVALID_STATE)"
          - "refunded_cents + amount_cents <= captured_cents (ERR_REFUND_EXCEEDS_CAPTURED)"
        side_effects:
          - "refunded_cents += amount_cents"
          - "loyalty reversal: account.points -= floor(amount_cents / 100); tier recomputed (floor at 0)"
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "POST /payments/{paymentId}/refund-decisions with decision APPROVE"
        actor: StandOperator
        preconditions:
          - "payment.status == REFUND_PENDING (ERR_PAYMENT_INVALID_STATE)"
          - "decider X-User-ID != payment.refund_initiated_by (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "refunded_cents += pending amount; refund_decided_by set"
          - "loyalty reversal: account.points -= floor(pending amount / 100); tier recomputed"
      - from: REFUND_PENDING
        to: CAPTURED
        trigger: "POST /payments/{paymentId}/refund-decisions with decision REJECT"
        actor: StandOperator
        preconditions:
          - "payment.status == REFUND_PENDING (ERR_PAYMENT_INVALID_STATE)"
          - "decider X-User-ID != payment.refund_initiated_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "pending amount discarded; refund_decided_by set"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system (order abandonment) — never via a direct endpoint"
        actor: system
        preconditions: []
        side_effects:
          - "order.payment_status -> VOIDED"
    note: "Partial refunds that leave refunded_cents < captured_cents keep status CAPTURED; status becomes REFUNDED only when cumulative refunded_cents == captured_cents. A small auto-approved refund that completes the capture therefore transitions CAPTURED -> REFUNDED; a partial one stays CAPTURED (no state change)."

  - entity: OrderItem
    initial_state: PENDING
    terminal_states: [READY, CANCELLED]
    transitions:
      - from: PENDING
        to: BUILDING
        trigger: "POST /order-items/{itemId}/start-build"
        actor: CrewMember
        preconditions:
          - "item.build_status == PENDING (ERR_ORDER_INVALID_STATE)"
          - "parent order.queue_status IN {MERGED, AT_WINDOW} (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "parent order.build_status -> BUILDING; order.outstanding_build_seconds recomputed"
      - from: BUILDING
        to: READY
        trigger: "POST /order-items/{itemId}/complete-build"
        actor: CrewMember
        preconditions:
          - "item.build_status == BUILDING (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "order.outstanding_build_seconds recomputed"
          - "when all sibling items are READY: parent order.build_status -> READY"
      - from: PENDING
        to: CANCELLED
        trigger: "system (distribution withdrawal or order abandonment)"
        actor: system
        preconditions: []
        side_effects:
          - "parent order totals and outstanding_build_seconds recomputed"
      - from: BUILDING
        to: CANCELLED
        trigger: "system (distribution withdrawal or order abandonment)"
        actor: system
        preconditions: []
        side_effects:
          - "parent order totals and outstanding_build_seconds recomputed"

  - entity: ThroughputWindow
    initial_state: OPEN
    terminal_states: [CLOSED_PASS, CLOSED_BREACH]
    transitions:
      - from: OPEN
        to: CLOSED_PASS
        trigger: "POST /throughput-windows/{windowId}/close"
        actor: RegionalManager
        preconditions:
          - "window.status == OPEN (ERR_WINDOW_INVALID_STATE)"
          - "current logical clock >= window.ends_at (ERR_WINDOW_NOT_CLOSABLE)"
        side_effects:
          - "served_count computed chronologically: count of orders with handoff_at in [starts_at, ends_at) at this stand"
          - "CLOSED_PASS iff served_count >= target_cars"
          - "stand.consecutive_breach_windows reset to 0 on PASS"
      - from: OPEN
        to: CLOSED_BREACH
        trigger: "POST /throughput-windows/{windowId}/close"
        actor: RegionalManager
        preconditions: ["same as OPEN -> CLOSED_PASS"]
        side_effects:
          - "served_count computed as above; CLOSED_BREACH iff served_count < target_cars"
          - "stand.consecutive_breach_windows += 1"
          - "if consecutive_breach_windows >= 2 and stand.status == OPEN: stand -> THROTTLED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-stand
    parent_entity: Stand
    write_endpoint: "POST /orders"
    occ_field: "expected_stand_version"
    description: |
      Creating an Order (WINDOW or LOYALTY_APP) against a Stand whose version
      has advanced since the client last read it is rejected. Order creation
      legitimately mutates the stand (lane_seq allocation, lane_occupancy for
      window orders, version bump), so a second create carrying the pre-mutation
      version is stale even though the stand's status is unchanged.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-merge-stale-stand
    parent_entity: Stand
    write_endpoint: "POST /orders/{orderId}/merge"
    occ_field: "expected_stand_version"
    description: |
      Merging an app-ahead order into a lane against a Stand whose version has
      advanced since the client last read it is rejected. A merge legitimately
      coexists with any stand state of the same status (the selector could
      still place the car), so the conflict is a stale read of the queue
      epoch, resolved by OCC on Stand.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: shift-plan-stale-shift
    parent_entity: Shift
    write_endpoint: "POST /shifts/{shiftId}/assignments"
    occ_field: "expected_shift_version"
    description: |
      Adding a ShiftAssignment to a Shift whose version has advanced since the
      client last read it is rejected. Two non-overlapping assignments for
      different crew members both legitimately succeed, so the losing write is
      one made against a superseded view of the staffing plan, resolved by OCC
      on Shift.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total_cents
    trigger: "order creation and after any item cancellation cascade"
    algorithm: aggregation
    formula: |
      For each item:
        unit_price_cents = recipe.base_price_cents + sum(modifiers[name].price_cents for name in item.modifier_names)
        line_gross_cents  = unit_price_cents * quantity
        tier_pct          = 0.10 if loyalty tier GOLD, 0.05 if SILVER, else 0 (0 when no loyalty_account_id)
        line_discount_cents = round_half_up(line_gross_cents * tier_pct)   # ROUND PER LINE FIRST
        line_net_cents    = line_gross_cents - line_discount_cents
      Order:
        subtotal_cents = sum(line_gross_cents over non-CANCELLED items)
        discount_cents = sum(line_discount_cents over non-CANCELLED items)
        total_cents    = subtotal_cents - discount_cents
      PINNED ROUNDING ORDER: discount is rounded per line item with round_half_up
      and only then summed. Computing the discount on the summed gross is the
      rejected variant (it differs by 1 cent whenever two lines' fractional
      parts straddle a half-cent boundary).
    input_set: "non-CANCELLED OrderItems of the order; loyalty tier of order.loyalty_account_id at order creation"
    constants:
      GOLD_PCT: 0.10
      SILVER_PCT: 0.05
    precision: "integer cents; per-line round_half_up before summation"

  - name: build_time_seconds
    trigger: "order creation (snapshot per item)"
    algorithm: weighted_scoring
    formula: |
      base = recipe.base_build_seconds + sum(modifiers[name].build_seconds_adder for name in item.modifier_names)
      if recipe.temperature_class == BLENDED: base += 15
      crew_on_bar = count of ShiftAssignments with role == BAR and status == CHECKED_IN
                    on the stand's shift with status == IN_PROGRESS at current logical clock;
                    if no IN_PROGRESS shift exists, crew_on_bar defaults to 2
      multiplier = 0.8 if crew_on_bar >= 3 else (1.0 if crew_on_bar == 2 else 1.3)
      build_time_seconds = min(BUILD_CAP_SECONDS, round_half_up(base * multiplier))
    input_set: "recipe + chosen modifiers; checked-in BAR assignments on the stand's IN_PROGRESS shift"
    constants:
      BLENDED_ADD_SECONDS: 15
      BUILD_CAP_SECONDS: 240
    precision: "integer seconds, round_half_up after multiplier"

  - name: loyalty_tier
    trigger: "any change to LoyaltyAccount.points (capture accrual, refund reversal, points-adjustments)"
    algorithm: threshold
    formula: |
      tier = GOLD  if points >= 500
             SILVER if points >= 200
             NONE  otherwise
      Boundary is inclusive: exactly 500 -> GOLD, exactly 200 -> SILVER.
    input_set: "the account's current points"
    constants:
      GOLD_MIN_POINTS: 500
      SILVER_MIN_POINTS: 200
    precision: "integer points"

  - name: lane_merge_position
    trigger: "POST /orders (source WINDOW: lane given, only capacity checked) and POST /orders/{orderId}/merge (selector runs)"
    algorithm: constraint_propagation
    formula: |
      Eligibility: lanes of the stand whose occupied count (orders with
        queue_status IN {MERGED, AT_WINDOW} in that lane) < max_stack_cars.
      Ranking: ascending projected_clear_seconds(lane) = sum of
        outstanding_build_seconds over orders in the lane with
        queue_status IN {MERGED, AT_WINDOW}.
      Tie-break 1: fewer occupied slots.
      Tie-break 2: lane_code ascending (lexicographic; a domain field, never id).
      Empty pool: reject ERR_LANE_STACKING_FULL (app orders stay QUEUED — the
        merge attempt fails and may be retried later; window creates fail).
      lane_seq = (max lane_seq among orders ever assigned to that lane) + 1, or 1.
    input_set: "stand.lane_configs; orders at the stand with queue_status IN {MERGED, AT_WINDOW}"
    precision: "integer seconds; deterministic total order"

  - name: throughput_attainment
    trigger: "GET /throughput-windows/{windowId} (provisional) and POST /throughput-windows/{windowId}/close (final)"
    algorithm: aggregation
    formula: |
      served_so_far = count of orders at the stand with handoff_at in [starts_at, ends_at)
      provisional_projected_cars = served_so_far
        + count of orders at the stand with queue_status IN {QUEUED, MERGED, AT_WINDOW}
      At close: served_count = served_so_far (chronological, in-window handoffs only);
      status = CLOSED_PASS iff served_count >= target_cars else CLOSED_BREACH.
    input_set: "orders of window.stand_id"
    precision: "integer cars; window bounds half-open [start, end)"
    variants:
      - name: provisional
        when: "window OPEN; any read of the window"
        difference: "forward-looking: includes in-flight queue (QUEUED/MERGED/AT_WINDOW) so it can equal or exceed target while the final count still breaches"
      - name: final
        when: "window close"
        difference: "chronological: counts only orders actually handed off inside [starts_at, ends_at); in-flight queue is excluded"

  - name: staffing_deficit_score
    trigger: "POST /shifts/{shiftId}/publish (provisional) and POST /shifts/{shiftId}/reconcile (reconciled)"
    algorithm: weighted_scoring
    formula: |
      required_crew = 4 if shift.is_peak else 2
      Provisional (at publish):
        confirmed = count of assignments with status IN {ASSIGNED, CHECKED_IN}
        has_lead  = any assignment with role == LEAD and status IN {ASSIGNED, CHECKED_IN}
        provisional_deficit_score = max(0, required_crew - confirmed) * 10 + (0 if has_lead else 25)
      Reconciled (at reconcile):
        checked_in  = count of assignments with status == CHECKED_IN
        no_shows    = count of assignments with status == NO_SHOW
        has_ci_lead = any assignment with role == LEAD and status == CHECKED_IN
        reconciled_deficit_score = max(0, required_crew - checked_in) * 10 + (0 if has_ci_lead else 25) + no_shows * 5
    input_set: "assignments of the shift, filtered by status as specified per variant"
    constants:
      PEAK_MIN_CREW: 4
      BASE_MIN_CREW: 2
      MISSING_CREW_PENALTY: 10
      MISSING_LEAD_PENALTY: 25
      NO_SHOW_PENALTY: 5
    precision: "integer score"
    variants:
      - name: provisional
        when: "at publish; forward-looking over the plan"
        difference: "counts planned assignments (ASSIGNED included); a fully staffed plan scores 0 even if no-shows later make the reconciled score positive"
      - name: reconciled
        when: "at reconcile; chronological over actual check-ins"
        difference: "counts only CHECKED_IN and adds 5 per NO_SHOW; identical plan data yields a different score"

  - name: royalty_statement
    trigger: "GET /stands/{standId}/royalty-statement?month=YYYY-MM"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (the quantities are mutually defined; this order makes them well-defined):
        1. gross_cents = sum over payments with captured_at inside the calendar month of (captured_cents - refunded_cents)
        2. brand_fund_cents = round_half_up(gross_cents * BRAND_FUND_PCT)
        3. net_cents = gross_cents - brand_fund_cents
        4. royalty_rate = 0.06 if gross_cents >= TIER2_MIN else (0.05 if gross_cents >= TIER1_MIN else 0.04)
           (tier keyed on GROSS, inclusive lower bound)
        5. royalty_cents = round_half_up(net_cents * royalty_rate)
    input_set: "payments of orders at the stand with captured_at in [month-01T00:00:00Z, next-month-01T00:00:00Z)"
    constants:
      BRAND_FUND_PCT: 0.02
      TIER1_MIN: 1000000
      TIER2_MIN: 5000000
    precision: "integer cents, round_half_up at steps 2 and 5"

  - name: loyalty_points_accrual
    trigger: "payment capture (accrual) and refund (reversal)"
    algorithm: aggregation
    formula: |
      On capture: points += floor(captured_cents / 100)
      On refund (auto or approved): points -= floor(refund_amount_cents / 100); points floored at 0
      lifetime_captured_cents += captured_cents on capture (never reversed)
      tier recomputed after every change (see loyalty_tier)
    input_set: "the captured/refunded payment and the order's loyalty_account_id (no-op when null)"
    precision: "integer points, floor division"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's allowed roles; ownership rules (StandOperator == agreement.crew_member_id, LoyaltyCustomer == order.loyalty_account_id, CrewMember == assignment.crew_member_id) are enforced here"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right (region, stand, crew member, agreement, recipe, distribution, account, shift, assignment, order, item, payment, window)"
    error_id: "ERR_REGION_NOT_FOUND | ERR_STAND_NOT_FOUND | ERR_CREW_MEMBER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_LOYALTY_ACCOUNT_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_ITEM_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_WINDOW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids; body FKs (stand_id, recipe_id, loyalty_account_id, crew_member_id, home_stand_id) also resolve here"

  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types correct, enum members valid, SEASONAL recipes carry season_start/season_end with season_end > season_start, lane_configs well-formed (1..2 entries, unique lane_code, max_stack_cars >= 1), revenue_share_pct in (0,1)"
    error_id: ERR_INVALID_PAYLOAD
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_stand_version / expected_shift_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders, POST /orders/{orderId}/merge, POST /shifts/{shiftId}/assignments"

  - priority: 6
    category: state
    check: "Target resource state preconditions: stand transition guards; order queue/payment/build guards; payment status guards; shift status guards; distribution status guards; window OPEN for close"
    error_id: "ERR_STAND_INVALID_TRANSITION | ERR_ORDER_INVALID_STATE | ERR_PAYMENT_INVALID_STATE | ERR_SHIFT_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_DISTRIBUTION_INVALID_STATE | ERR_WINDOW_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "Stand posture gate: order creation requires stand.status == OPEN for LOYALTY_APP and IN {OPEN, THROTTLED} for WINDOW; merge requires IN {OPEN, THROTTLED}; stand open requires APPROVED|SUSPENDED"
    error_id: ERR_STAND_NOT_ACCEPTING_ORDERS
    http_status: 409
    applies_to: "POST /orders, POST /orders/{orderId}/merge"

  - priority: 8
    category: business_safety
    check: "Food-handler certification: crew_member.food_handler_cert_expires_on must be strictly after the current logical clock date for shift assignment creation and operator nomination"
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /shifts/{shiftId}/assignments, POST /operator-agreements"

  - priority: 9
    category: business_temporal
    check: "Temporal rules: shift.starts_at must be after current clock (ERR_SHIFT_IN_PAST); assignment intervals for the same crew member must not overlap, half-open [start,end) so adjacency is allowed (ERR_ASSIGNMENT_OVERLAP); throughput windows on a stand must be disjoint AND >= 15 minutes apart (ERR_WINDOW_OVERLAP); SEASONAL recipes orderable only when season_start <= current date < season_end (ERR_RECIPE_OUT_OF_SEASON); window close requires clock >= ends_at (ERR_WINDOW_NOT_CLOSABLE)"
    error_id: "ERR_SHIFT_IN_PAST | ERR_ASSIGNMENT_OVERLAP | ERR_WINDOW_OVERLAP | ERR_RECIPE_OUT_OF_SEASON | ERR_WINDOW_NOT_CLOSABLE"
    http_status: 409
    applies_to: "POST /shifts, POST /shifts/{shiftId}/assignments, POST /throughput-windows, POST /orders, POST /throughput-windows/{windowId}/close"

  - priority: 10
    category: business_constraint
    check: "Constraint rules: items non-empty (ERR_EMPTY_ORDER) and quantity >= 1 (ERR_INVALID_QUANTITY); modifier names must exist on the recipe (ERR_MODIFIER_UNKNOWN); assignment duration <= 120 minutes (ERR_ROTATION_STRETCH_EXCEEDED) and inside shift bounds (ERR_ASSIGNMENT_OUTSIDE_SHIFT); peak shift publish needs >= 4 non-cancelled assignments (ERR_PEAK_STAFFING_INSUFFICIENT); lane capacity (ERR_LANE_STACKING_FULL); capture sequencing by lane_seq (ERR_CAPTURE_OUT_OF_SEQUENCE); site approval stacking/ingress (ERR_SITE_STACKING_INSUFFICIENT / ERR_INGRESS_GAP_INSUFFICIENT); operator tenure >= 365 days (ERR_TENURE_INSUFFICIENT); retire blocked by live distributions (ERR_RECIPE_HAS_ACTIVE_DISTRIBUTIONS); ends_at > starts_at (ERR_INVALID_TIME_RANGE)"
    error_id: "ERR_EMPTY_ORDER | ERR_INVALID_QUANTITY | ERR_MODIFIER_UNKNOWN | ERR_ROTATION_STRETCH_EXCEEDED | ERR_ASSIGNMENT_OUTSIDE_SHIFT | ERR_PEAK_STAFFING_INSUFFICIENT | ERR_LANE_STACKING_FULL | ERR_CAPTURE_OUT_OF_SEQUENCE | ERR_SITE_STACKING_INSUFFICIENT | ERR_INGRESS_GAP_INSUFFICIENT | ERR_TENURE_INSUFFICIENT | ERR_RECIPE_HAS_ACTIVE_DISTRIBUTIONS | ERR_INVALID_TIME_RANGE"
    http_status: 422
    applies_to: "creation and action endpoints as listed"

  - priority: 11
    category: business_referential
    check: "Cross-aggregate references must be live: every order item's recipe must have an ACTIVATED distribution at the stand (ERR_DISTRIBUTION_NOT_ACTIVE); SECRET recipes require loyalty tier GOLD (ERR_SECRET_MENU_TIER_REQUIRED); shift publish and stand open require an ACTIVE OperatorAgreement (ERR_AGREEMENT_NOT_ACTIVE / ERR_NO_ACTIVE_AGREEMENT_FOR_STAND)"
    error_id: "ERR_DISTRIBUTION_NOT_ACTIVE | ERR_SECRET_MENU_TIER_REQUIRED | ERR_AGREEMENT_NOT_ACTIVE | ERR_NO_ACTIVE_AGREEMENT_FOR_STAND"
    http_status: 409
    applies_to: "POST /orders, POST /shifts/{shiftId}/publish, POST /stands/{standId}/open"

  - priority: 12
    category: business_fiscal
    check: "Fiscal rules: card_token DECLINE fails authorization (ERR_PAYMENT_DECLINED); cumulative refunds never exceed captured_cents (ERR_REFUND_EXCEEDS_CAPTURED); segregation of duties — agreement approver != nominator and refund decider != initiator (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_PAYMENT_DECLINED | ERR_REFUND_EXCEEDS_CAPTURED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 402
    applies_to: "POST /orders/{orderId}/payments/authorize, POST /payments/{paymentId}/refunds, POST /payments/{paymentId}/refund-decisions, POST /operator-agreements/{agreementId}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never falls back to wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all time-based validations and calculations use this clock"]

  # --- Region ---
  - method: POST
    path: "/regions"
    description: "Create a region"
    roles: [PlatformAdmin]
    code: 201
    input: [name, code]
    output: Region
    side_effects: []

  - method: GET
    path: "/regions/{regionId}"
    description: "Get a region"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember, LoyaltyCustomer]
    code: 200
    input: []
    output: Region
    side_effects: []

  # --- Stand ---
  - method: POST
    path: "/stands"
    description: "Propose a stand site (starts PROPOSED)"
    roles: [PlatformAdmin]
    code: 201
    input: [region_id, name, min_ingress_gap_seconds, lane_configs]
    output: Stand
    side_effects: ["status PROPOSED, consecutive_breach_windows 0"]

  - method: GET
    path: "/stands/{standId}"
    description: "Get a stand (includes lane_occupancy, consecutive_breach_windows, version)"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember, LoyaltyCustomer]
    code: 200
    input: []
    output: Stand
    side_effects: []

  - method: GET
    path: "/stands"
    description: "List stands, optionally by region"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: ["region_id?", "status?", "limit?", "offset?"]
    output: "Stand[]"
    side_effects: []

  - method: POST
    path: "/stands/{standId}/approve"
    description: "Approve a proposed site; enforces lane stacking (sum >= 10) and ingress gap (>= 30s)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Stand
    side_effects: ["status PROPOSED -> APPROVED"]

  - method: POST
    path: "/stands/{standId}/open"
