              captures: { qc_fix: $.data.id, fix_result: $.data.result }
            - call: "POST /poct/devices/${dev_1}/qc-unlock"
              payload: { confirming_qc_run_id: "${qc_fix}", note: "repeat control on the affected instrument" }
              as: QualityCoordinator
              captures: { dev1_status: $.data.status, dev1_reason: $.data.qc_lock_reason }
          assert:
            - "${d2_l2_result} == \"PASS\", ${lot_state} == \"VERIFIED\", ${fail_result} == \"FAIL\" and ${fail_locked} == true"
            - "the first unlock returns HTTP 422 with ${err} == \"ERR_QC_RUN_DEVICE_MISMATCH\" (NOT ERR_LOT_NOT_VERIFIED at priority 44, which passes, and NOT ERR_INVALID_STATE at 50)"
            - "the repeat control on the locked device returns HTTP 201 with ${fix_result} == \"PASS\" - qc-runs are exempt from priority 41"
            - "the second unlock returns HTTP 200 with ${dev1_status} == \"ACTIVE\" and ${dev1_reason} == null"
            - "Device.${dev_2} stayed ACTIVE throughout - the failed run on D1 never touched its sibling"

