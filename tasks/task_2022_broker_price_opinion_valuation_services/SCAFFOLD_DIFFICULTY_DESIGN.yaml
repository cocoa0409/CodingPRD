  - rule_id: transitive_cascade
    instances:
      - name: broker_terminate_cascades_licenses_then_orders
        grounds:
          - state_machines.Broker.ACTIVE_to_TERMINATED
          - state_machines.Broker.SUSPENDED_to_TERMINATED
        distinguishing_aspect: |
          Depth-3 cascade: POST /brokers/{id}/terminate mutates Broker
          (status -> TERMINATED); that mutation itself triggers every
          BrokerLicense for the broker to transition status -> REVOKED;
          revoked licenses in turn prevent any future dispatch referencing
          (broker, state) — the third link is observed by attempting a
          dispatch that fails with ERR_LICENSE_NOT_VALID_FOR_STATE on a
          different order. Originates from terminate trigger.
