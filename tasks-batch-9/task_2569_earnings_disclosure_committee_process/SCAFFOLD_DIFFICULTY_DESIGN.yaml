              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Priya Plant", function: "OPERATIONS", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { voting_count_before: $.data.active_voting_member_count }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${ops_id}", scope_area: "OPERATIONS", due_utc: "2026-08-04T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_ops_pending_id: $.data.id }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${ops_id}", scope_area: "LEGAL_CONTINGENCY", due_utc: "2026-08-04T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_ops_submitted_id: $.data.id }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_fin_id: $.data.id }
            - call: "POST /disclosure/sub-certifications/${sc_ops_submitted_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${ops_id}"
            - call: "POST /disclosure/sub-certifications/${sc_fin_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { total_before: $.data.total_assigned_scope_weight, coverage_before: $.data.certification_coverage_pct }
          trigger:
            - call: "POST /disclosure/committee-members/${ops_id}/transitions"
              payload: { action: "VACATE" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
          assert:
            - "${voting_count_before} == 3"
            - "${total_before} == 75.00"
            - "${coverage_before} == 73.33"
            - "CommitteeMember.${ops_id}.status == VACATED"
