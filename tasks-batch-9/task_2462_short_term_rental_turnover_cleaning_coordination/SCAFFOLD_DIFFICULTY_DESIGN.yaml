          - entities.Booking.fields.guest_notice_code
          - entities.Turnover.fields.pre_hold_status
        distinguishing_aspect: |
          Booking carries two independent dimensions: a blocking repair dispatch drives the incoming
          booking's checkin_gate OPEN -> BLOCKED with guest_notice_code CHECKIN_DELAYED while its
          status stays SCHEDULED, and the outgoing booking's status moves SCHEDULED -> CHECKED_OUT
          while its own checkin_gate stays OPEN; closing the repair returns the gate to RELEASED and
          restores the turnover's pre_hold_status IN_PROGRESS.
