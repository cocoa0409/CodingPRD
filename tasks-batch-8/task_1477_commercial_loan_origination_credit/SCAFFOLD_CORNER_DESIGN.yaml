            - { call: "GET /credit/loan-applications/${app}/committee-decisions", as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "GET /credit/committee-sessions/${sess}/committee-decisions", as: CreditAnalyst, as_user_id: "${an}" }
