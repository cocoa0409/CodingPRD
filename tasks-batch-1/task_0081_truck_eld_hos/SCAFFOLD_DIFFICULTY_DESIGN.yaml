              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "00000000-0000-4000-8000-000000000000", duty_status: "DRIVING", event_time: "2026-06-01T09:00:00Z", expected_driver_version: "${d_v1}" }
