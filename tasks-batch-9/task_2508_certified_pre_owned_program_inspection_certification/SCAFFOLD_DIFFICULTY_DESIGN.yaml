              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000141", model_year: 2020, in_service_date: "2020-08-02", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_under: $.data.id }
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000142", model_year: 2020, in_service_date: "2020-08-01", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_at: $.data.id }
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000143", model_year: 2020, in_service_date: "2020-07-31", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v_over: $.data.id }
          trigger:
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_under}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T05:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i_under: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_at}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i_at: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v_over}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T13:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 201 and Inspection.${i_under}.vehicle_age_days_at_inspection == 2189"
            - "trigger call 2 returns 201 and Inspection.${i_at}.vehicle_age_days_at_inspection == 2190, the inclusive limit"
            - "trigger call 3 returns 422 ERR_VEHICLE_AGE_EXCEEDED because the age is 2191 days"
            - "Vehicle.${v_at}.cpo_state == CERTIFICATION_PENDING and Vehicle.${v_over}.cpo_state == NOT_CERTIFIED"

      - name: claim_ratio_exactly_at_probation_threshold
        grounds:
          - validations[priority=33]
          - calculations.dealer_claim_ratio
          - calculations.claim_reimbursement
          - entities.ProgramConfig.fields.claim_ratio_probation_threshold
          - entities.Dealer.fields.privilege_status
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
