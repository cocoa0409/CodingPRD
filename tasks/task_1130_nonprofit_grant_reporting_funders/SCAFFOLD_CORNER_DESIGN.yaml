  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: reports_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "endpoints.GET_/grants/{id}/reports"]
        distinguishing_aspect: "GET /grants/{id}/reports on a 4-report grant: default page returns all 4 with total_count 4 and has_more false; ?limit=2 returns 2 rows with has_more true; ?limit=2&offset=2 returns the last 2 with has_more false."
        test_recipe:
          setup: ["Grant ACTIVE with its 4-row QUARTERLY calendar"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-P1", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer }
            - { call: "GET /grants/${g1}/reports?limit=2", payload: {}, as: GrantsOfficer }
            - { call: "GET /grants/${g1}/reports?limit=2&offset=2", payload: {}, as: GrantsOfficer, captures: { p3first: "$.data[0].period_index" } }
          assert:
            - "default page: 4 rows, total_count == 4, has_more == false (default limit 10)"
            - "?limit=2: 2 rows, total_count == 4, has_more == true"
            - "?limit=2&offset=2: has_more == false and p3first == 3 (rows ordered by period_index ASC)"

