          - errors[ERR_LIFEGUARD_NOT_FOUND]
        distinguishing_aspect: |
          Certification is the only entity in §1.1 with a declared parent, and the parent check must
          fire on the CREATE path before any field-level work: the request below is otherwise valid,
          with a well-formed cert_type and a strictly increasing date pair. The paired positive call
          then proves the child is reachable from its parent, since GET /swim-club/certifications
          filters by lifeguard_id.
        test_recipe:
          setup:
            - "One real lifeguard exists; a second, unknown lifeguard id is used for the negative call."
