            - "the response status is 422 and err == ERR_REPORT_MODEL_MISMATCH"
            - "LabelClaim.${cl_id} (on MSTD) remains DRAFT; the M95 report is untouched"

      - name: reserve_priority_state_beats_fiscal_corner
        claim_type: priority_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: reserve_factory_state_error_beats_capacity_fiscal_error
          rationale: "Dual-failure replay asserted by the named §1.8 instance (ERR_FACTORY_NOT_ACTIVE over ERR_CAPACITY_WEEK_EXCEEDED)."

