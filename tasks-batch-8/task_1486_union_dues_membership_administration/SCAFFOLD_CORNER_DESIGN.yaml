  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List responses carry the fixed pagination fields: limit=2 over 3 members yields has_more true and total_count 3; offset 2 returns the final item with has_more false."
        test_recipe:
          setup: ["PCT local; JOURNEYMAN class; three members registered"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Page One", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Page Two", member_number: "M-002", joined_at: "2026-01-15" }
              as: OfficeClerk
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Page Three", member_number: "M-003", joined_at: "2026-01-15" }
              as: OfficeClerk
          trigger:
            - call: "GET /api/members?local_id=${loc}&limit=2&offset=0"
              as: SecretaryTreasurer
              captures: { first_id: "$.data[0].id" }
            - call: "GET /api/members?local_id=${loc}&limit=2&offset=2"
              as: SecretaryTreasurer
          assert:
            - "page 1: total_count == 3, has_more == true, data has exactly 2 items"
            - "page 2 (offset 2): has_more == false, data has exactly 1 item"
            - "envelope carries meta.api_request_id and response_type == array on both calls"

      - name: reverse_reachability_filtered_lists
        claim_type: retrieval
        grounds: [entities.Member.fields.local_id, entities.LedgerEntry.fields.member_id, entities.MemberTransfer.fields.member_id, entities.ObjectorCase.fields.member_id]
        distinguishing_aspect: "Every FK is traversable from the parent: member-filtered lists for transfers, objector cases, ledger, and assessments each return exactly the one child row created."
        test_recipe:
          setup: ["FLAT locals L1+L2; member M with one assessment (run 2026-08), one payment, one transfer, one objector case"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l1: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local 400", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l2: "$.data.id" }
            - call: "POST /api/locals/${l1}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${l1}", classification_id: "${cls}", full_name: "Linked Liam", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id", m_v: "$.data.version" }
            - call: "POST /api/members/${mem}/objector-cases"
              payload: {}
              as: Member
              as_user_id: "${mem}"
              captures: { oc: "$.data.id" }
            - call: "POST /api/members/${mem}/transfers"
              payload: { to_local_id: "${l2}", effective_period: "2026-09", expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${mem}"
              captures: { tr: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${l1}", period: "2026-08" }, as: SecretaryTreasurer }
            - call: "POST /api/members/${mem}/payments"
              payload: { amount_cents: 1000 }
              as: Member
              as_user_id: "${mem}"
              captures: { le: "$.data.id" }
          trigger:
            - call: "GET /api/members/${mem}/assessments"
              as: SecretaryTreasurer
              captures: { a_id: "$.data[0].id" }
            - call: "GET /api/members/${mem}/ledger"
              as: SecretaryTreasurer
              captures: { l_first: "$.data[0].entry_type" }
            - call: "GET /api/transfers?member_id=${mem}"
              as: SecretaryTreasurer
              captures: { t_id: "$.data[0].id" }
            - call: "GET /api/objector-cases?member_id=${mem}"
              as: SecretaryTreasurer
              captures: { o_id: "$.data[0].id" }
          assert:
            - "assessments sub-resource returns 1 row (${a_id} is a UUID)"
            - "ledger sub-resource: first entry chronologically is ${l_first} == ASSESSMENT_CHARGE (charge precedes the payment credit)"
            - "${t_id} == ${tr} and ${o_id} == ${oc} via filtered lists"

