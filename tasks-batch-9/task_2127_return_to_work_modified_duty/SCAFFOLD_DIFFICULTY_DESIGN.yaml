          transitional_job_id: ${job_id}
          start_date: '2026-08-03'
          end_date: '2026-08-28'
          scheduled_hours_per_day: 4
          expected_restriction_set_version: ${rs_v}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          pl_id: $.data.id
          score: $.data.match_score
      assert:
      - RestrictionSet.${rs_id}.severity_index == 60
      - ${score} == 51.39
      - Placement.${pl_id}.placement_status == PROPOSED
  - name: wage_final_rounds_each_day_before_summing_four_day_period
