  # ===========================================================================
  - section: rbac
    instances:

      - name: installer_cannot_create_collection_returns_forbidden
        claim_type: Violation -> Error
        grounds:
          - roles[Installer]
          - errors[ERR_FORBIDDEN]
          - endpoints."POST /carpetloop/collections"
        distinguishing_aspect: "Endpoint-level RBAC: the Installer role is not in the collection-create role set and is rejected with ERR_FORBIDDEN before any payload validation."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /carpetloop/collections"
              payload: { name: "Sneaky", pattern_code: "SNK", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GATE" }
              as: Installer
              as_user_id: "inst-bob"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN with http 403; no collection persisted"

      - name: specifier_cannot_release_batch_returns_forbidden
        claim_type: Violation -> Error
        grounds:
          - roles[Specifier]
          - errors[ERR_FORBIDDEN]
          - endpoints."POST /carpetloop/batches/{batch_id}/release"
        distinguishing_aspect: "Release is PlatformAdmin-only: a Specifier caller gets ERR_FORBIDDEN even when the batch's mass balance would pass — role check precedes the release precondition."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 QUARANTINE with full 400 kg mix allocated."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
          trigger:
            - call: "POST /carpetloop/batches/${b1}/release"
              payload: {}
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403); TileBatch.${b1}.status remains QUARANTINE"

      - name: verification_action_role_split_enforced
        claim_type: Violation -> Error
        grounds:
          - roles[Verifier]
          - roles[SustainabilityManager]
          - validations[priority=2]
          - endpoints."POST /carpetloop/pcf-reports/{report_id}/verification"
        distinguishing_aspect: "Action-level role split on one endpoint: ASSIGN rejected for Verifier, CLEAR rejected for SustainabilityManager — the role set on the endpoint is necessary but not sufficient."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 RELEASED; REP-1 SUBMITTED."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
          trigger:
            - call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "ASSIGN", verifier_org: "EcoAssure" }
              as: Verifier
              as_user_id: "ver-dana"
              captures: { err1: $.data.error_id }
            - *c_assign1
            - call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "CLEAR" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_FORBIDDEN (ASSIGN is the manager's action)"
            - "err2 == ERR_FORBIDDEN (CLEAR is the verifier's action)"
            - "PCFReport.${rep1}.status == IN_VERIFICATION (only the legal ASSIGN landed)"

      - name: claim_review_requires_approver_role
        claim_type: Violation -> Error
        grounds:
          - roles[ClaimsApprover]
          - errors[ERR_FORBIDDEN]
          - endpoints."POST /carpetloop/carbon-claims/{claim_id}/review"
        distinguishing_aspect: "Review is ClaimsApprover-only: the SustainabilityManager who shepherded the claim cannot also review it at the role level."
        test_recipe:
          setup: ["Published report chain on GAT; claim CL-1 IN_REVIEW."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
            - *c_clear1
            - *c_publish1
            - *c_claim_neutral
            - *c_cl_submit
          trigger:
            - call: "POST /carpetloop/carbon-claims/${cl1}/review"
              payload: { decision: "APPROVE" }
              as: SustainabilityManager
              as_user_id: "sm-other"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403); CarbonClaim.${cl1}.status remains IN_REVIEW"

      - name: sod_verifier_cannot_clear_own_submission
        claim_type: Violation -> Error
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.PCFReport.IN_VERIFICATION_to_VERIFIED
        distinguishing_aspect: "Segregation of duties on verification: a Verifier whose X-User-ID equals the report's submitted_by is rejected ERR_SEGREGATION_OF_DUTIES; a distinct verifier clears the same report immediately after."
        test_recipe: 
          setup: ["REP-1 SUBMITTED by sm-carol and IN_VERIFICATION under EcoAssure."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
          trigger:
            - call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "CLEAR" }
              as: Verifier
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
            - *c_clear1
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (403): verifier identity equals submitted_by sm-carol"
            - "the follow-up CLEAR by ver-dana succeeds: status == VERIFIED, verified_by == \"ver-dana\""

      - name: sod_reviewer_cannot_approve_own_claim_and_vintage_floor
        claim_type: Violation -> Error
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_REQUEST]
          - entities.OffsetRetirement.fields.vintage_year
        distinguishing_aspect: "Claim-side segregation: a ClaimsApprover whose X-User-ID equals the claim's created_by is rejected; and the offset vintage floor (>= 2020) is enforced as ERR_INVALID_REQUEST on an IN_REVIEW claim."
        test_recipe:
          setup: ["Published report chain on GAT; claim CL-1 (created_by sm-carol) IN_REVIEW."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
            - *c_clear1
            - *c_publish1
            - *c_claim_neutral
            - *c_cl_submit
          trigger:
            - call: "POST /carpetloop/carbon-claims/${cl1}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsApprover
              as_user_id: "sm-carol"
              captures: { err1: $.data.error_id }
            - call: "POST /carpetloop/carbon-claims/${cl1}/offsets"
              payload: { registry: "VERRA", vintage_year: 2019, quantity_kgco2e: 5 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err2: $.data.error_id }
            - call: "POST /carpetloop/carbon-claims/${cl1}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsApprover
              as_user_id: "ap-erin"
          assert:
            - "err1 == ERR_SEGREGATION_OF_DUTIES (403): reviewer identity equals created_by sm-carol"
            - "err2 == ERR_INVALID_REQUEST (400): vintage_year 2019 below the 2020 floor"
            - "the follow-up review by ap-erin succeeds: status == APPROVED, reviewed_by == \"ap-erin\""

      - name: installer_ownership_mismatch_returns_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - roles[Installer]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Installer operations are bound to the site's contractor_name: inst-other cannot install inst-bob's site."
        test_recipe:
          setup: ["Site S-1 PLANNED with contractor_name inst-bob."]
          setup_api_calls:
            - *c_clock
            - *c_site1
          trigger:
            - call: "POST /carpetloop/sites/${site1}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-other"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403); CustomerSite.${site1}.status remains PLANNED"

      - name: specifier_ownership_mismatch_returns_forbidden
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - roles[Specifier]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Specifier operations are bound to created_by: spec-eve cannot open a replacement order on spec-ada's site, nor cancel spec-ada's take-back."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 RELEASED; site INSTALLED (created_by spec-ada) with zone Z-1 (10 m2); take-back TB-1 REQUESTED (created_by spec-ada)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_site1
            - *c_install1
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 10 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - *c_tb1
            - *c_get_site
          trigger:
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1}", reason: "WEAR", new_zone_code: "Z-9", expected_site_version: "${sv1}" }
              as: Specifier
              as_user_id: "spec-eve"
              captures: { err1: $.data.error_id }
            - call: "POST /carpetloop/take-back-requests/${tb1}/cancel"
              payload: {}
              as: Specifier
              as_user_id: "spec-eve"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_FORBIDDEN and err2 == ERR_FORBIDDEN (ownership via created_by)"
            - "no order persisted; TakeBackRequest.${tb1}.status remains REQUESTED"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails ERR_UNAUTHENTICATED 401 at priority 1 — before role, existence, or state checks — even though the endpoint and payload are otherwise legal."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /carpetloop/collections"
              payload: { name: "NoAuth", pattern_code: "NAU", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GATE" }
              omit_headers: true
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED with http 401"
            - "error envelope: response_type == error, data.message present"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_report_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-create-stale-collection]
          - endpoints."POST /carpetloop/pcf-reports"
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on the collection: a second report create replaying the version captured before the first create (1, now stale at 2) is rejected ERR_STALE_VERSION 412; re-reading the version and resubmitting the identical payload succeeds."
        test_recipe:
          setup: ["Collection GAT created (version 1); report R-A [2026-09-01, 2026-10-01) created with expected version 1 (collection now at 2)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_rep_gate
          trigger:
            - call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${col_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", boundary: "CRADLE_TO_GATE", expected_collection_version: "${col_v}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
            - *c_get_col
            - call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${col_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", boundary: "CRADLE_TO_GATE", expected_collection_version: "${col_v2}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { repB: $.data.id }
          assert:
            - "err == ERR_STALE_VERSION with http 412 (expected 1, current 2)"
            - "retry with the freshly read version succeeds: PCFReport.${repB}.status == DRAFT"
            - "the two reports coexist: R-A DRAFT [09-01, 10-01) and R-B DRAFT [10-01, 11-01) — half-open adjacency, no supersede"

      - name: occ_package_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[package-create-stale-collection]
          - endpoints."POST /carpetloop/spec-packages"
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The same OCC discipline on package issuance: replaying the pre-issuance collection version for a second (different-firm) package fails 412; refreshing the version lets FIRM-B's package issue at package_version 1 of its own sequence."
        test_recipe:
          setup: ["Published report chain on GAT; package PKG-A issued to FIRM-A (collection version advanced once)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
            - *c_clear1
            - *c_publish1
            - *c_get_col
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-A", collection_id: "${col_id}", report_id: "${rep1}", expected_collection_version: "${col_v2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { pkgA: $.data.id }
          trigger:
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-B", collection_id: "${col_id}", report_id: "${rep1}", expected_collection_version: "${col_v2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err: $.data.error_id }
            - call: "GET /carpetloop/collections/${col_id}"
              payload: {}
              as: PlatformAdmin
              captures: { col_v3: $.data.version }
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-B", collection_id: "${col_id}", report_id: "${rep1}", expected_collection_version: "${col_v3}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { pkgB: $.data.id }
          assert:
            - "err == ERR_STALE_VERSION (412) — PKG-A's issuance advanced the collection version past ${col_v2}"
            - "retry succeeds: SpecPackage.${pkgB}.status == ISSUED with package_version == 1 (FIRM-B sequence)"
            - "SpecPackage.${pkgA} remains ISSUED at package_version 1 (different firm pair — no supersede)"

      - name: occ_order_create_stale_site_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-create-stale-site]
          - endpoints."POST /carpetloop/replacement-orders"
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on the site: an order create replaying the pre-first-order site version fails 412 even though zone Z-2 is untouched — the supersede guard is about the writer's stale view of the site, not about the zone."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 RELEASED; site IN_SERVICE with zones Z-1 and Z-2 (10 m2 each); ORD-A created on Z-1 with the post-bubble version (site now one version ahead)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_site1
            - *c_install1
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 10 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-2", area_m2: 10 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z2: $.data.id }
            - *c_get_site
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1}", reason: "WEAR", new_zone_code: "Z-1R", expected_site_version: "${sv1}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ordA: $.data.id }
          trigger:
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z2}", reason: "DAMAGE", new_zone_code: "Z-2R", expected_site_version: "${sv1}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err: $.data.error_id }
            - call: "GET /carpetloop/sites/${site1}"
              payload: {}
              as: PlatformAdmin
              captures: { sv2: $.data.version }
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z2}", reason: "DAMAGE", new_zone_code: "Z-2R", expected_site_version: "${sv2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ordB: $.data.id }
          assert:
            - "err == ERR_STALE_VERSION (412): expected the pre-ORD-A version, site advanced by ORD-A's creation"
            - "retry with the fresh version succeeds: ReplacementOrder.${ordB}.status == DRAFT on zone Z-2"
            - "ORD-A on Z-1 is untouched (different zone — no supersede)"

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - calculations.pcf_footprint
          - calculations.takeback_credit
        excluded_because:
          difficulty_instance: dual_variant_calc / pcf_operational_vs_lifecycle_diverge
          rationale: "Both variants of both calculations are asserted with literal expected values in §1.8 (pcf_operational_vs_lifecycle_diverge, takeback_credit_standard_vs_circular)."
      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PCFReport.VERIFIED_to_PUBLISHED
          - endpoints."POST /carpetloop/manufacturing-targets/{target_id}/readings"
        excluded_because:
          difficulty_instance: transitive_cascade / publish_supersedes_report_retires_claim_revokes_package
          rationale: "Depth-3 publish cascade and depth-2 breach cascade are asserted end-to-end in §1.8."
      - name: layer_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.TileBatch.fields.available_m2
          - entities.CustomerSite.fields.spent_replacement_cents
        excluded_because:
          difficulty_instance: compensating_invariant / batch_area_conserved_across_order_lifecycle
          rationale: "Derived availability and spend reconciliations asserted step-by-step in §1.8 invariant and budget-boundary instances."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints."GET /carpetloop/feedstock-lots/{lot_id}"
        distinguishing_aspect: "Immediate consistency: a lot created then QC-passed reads back QC_PASSED with its computed reliability already stamped on the very next GET in the same logical instant — no lag, no staleness window."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls:
            - *c_clock
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "FRESHCO", source_type: "POST_INDUSTRIAL_SCRAP", quantity_kg: 75, carbon_factor_kgco2e_per_kg: 0.9 }
              as: PlatformAdmin
              captures: { lotF: $.data.id }
          trigger:
            - call: "POST /carpetloop/feedstock-lots/${lotF}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "GET /carpetloop/feedstock-lots/${lotF}"
              payload: {}
              as: Verifier
              as_user_id: "ver-dana"
          assert:
            - "GET immediately after the mutation: status == QC_PASSED, version == 2, updated_at refreshed"
            - "supplier_reliability_pct == 100.00 (stamped at creation, first lot for FRESHCO)"
            - "available_kg == 75 and allocated_kg == 0"
