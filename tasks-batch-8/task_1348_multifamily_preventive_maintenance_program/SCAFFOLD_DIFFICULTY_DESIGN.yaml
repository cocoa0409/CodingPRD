scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_age_vs_condition_bucket_divergence
        grounds:
          - calculations.capital_replacement_forecast
          - entities.Asset.fields.condition_score
          - entities.CapitalForecastSnapshot.fields.per_year_cents
        distinguishing_aspect: |
          The two capital_replacement_forecast variants operate on the Asset
          domain: with condition_score=5 (factor 1.30), CONDITION_BASED defers
          an asset installed 2020-08-01 with expected_life 84 months from
          bucket year 1 (AGE_BASED, replacement 2027-08-01) to bucket year 3
          (replacement 2029-09-01) under clock 2026-08-01 — same inputs,
          different outputs.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z (default; no clock call needed)"
            - "Property with one building, one unit, one HVAC asset installed 2020-08-01, expected_life_months=84, replacement_cost_cents=500000, condition_score=5 recorded via a completed PM visit"
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "DV-P1", display_name: "Dual Variant P1", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "OCCUPIED" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2020-08-01T00:00:00Z", warranty_months: 24, expected_life_months: 84, replacement_cost_cents: 500000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC service", frequency_days: 180, estimated_labor_minutes: 60, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 100000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v}" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/complete"
              payload: { actual_minutes: 55, condition_score_recorded: 5 }
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /properties/${p_id}/capital-forecasts"
              payload: { horizon_years: 5, variant: "AGE_BASED" }
              as: PropertyManager
              captures: { snap_age: $.data.per_year_cents }
            - call: "POST /properties/${p_id}/capital-forecasts"
              payload: { horizon_years: 5, variant: "CONDITION_BASED" }
              as: PropertyManager
              captures: { snap_cond: $.data.per_year_cents }
          assert:
            - "AGE_BASED snapshot per_year_cents == [0, 500000, 0, 0, 0] (replacement 2027-08-01 buckets to year 1)"
            - "CONDITION_BASED snapshot per_year_cents == [0, 0, 0, 500000, 0] (84*1.30=109 months floored -> 2029-09-01 buckets to year 3)"
            - "snap_age != snap_cond for identical asset inputs"

      - name: labor_plan_hours_vs_actual_minutes_divergence
        grounds:
          - calculations.labor_hour_aggregation
          - entities.PMPlan.fields.planned_labor_hours
          - entities.PMPlan.fields.actual_labor_minutes
        distinguishing_aspect: |
          labor_hour_aggregation operates on the PMPlan domain (different from
          Rule-1 instance 1's Asset domain): the plan variant rounds total
          estimated minutes UP to whole hours and includes open visits, while
          the actual variant sums only COMPLETED visits in exact minutes — for
          a plan with one 90-minute estimated visit completed in 45 minutes,
          planned_labor_hours=2 while actual_labor_minutes=45.
        test_recipe:
          setup:
            - "Property rate 6000 cents/hour; one template estimated 90 minutes; one adopted 2026 plan; one published batch with one visit scheduled 2026-08-02T09:00Z; clock advanced to that time"
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "DV-P2", display_name: "Dual Variant P2", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC tune-up", frequency_days: 90, estimated_labor_minutes: 90, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 100000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T18:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u_id}", template_id: "${t_id}", asset_id: "${a_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 1" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/complete"
              payload: { actual_minutes: 45, condition_score_recorded: 4 }
              as: Technician
              as_user_id: "tech-1"
            - call: "GET /properties/${p_id}/plans/${pl_id}"
              payload: {}
              as: PropertyManager
              captures: { plan_hours: $.data.planned_labor_hours, plan_actual: $.data.actual_labor_minutes }
          assert:
            - "PMPlan.planned_labor_hours == 2 (ceil(90/60))"
            - "PMPlan.actual_labor_minutes == 45"
            - "planned variant (120 implied minutes) > actual variant (45 minutes) for identical underlying visit"

  # ===========================================================================
  # Rule 2: Combinatorial formulas across DIFFERENT modes (a / b / c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: forecast_mode_a_nonlinear_interaction
        grounds:
          - calculations.capital_replacement_forecast
        distinguishing_aspect: |
          Mode (a): capital_replacement_forecast has >=3 inputs (expected_life_months,
          condition_score, horizon_years, clock) with non-linear interaction —
          a conditional branch on variant, a 5-level factor table lookup keyed on
          condition_score (with null mapping to the neutral factor), and a
          past-life clamp that re-buckets already-expired assets into year 0.
        test_recipe:
          setup:
            - "Clock 2026-08-01; property with two assets: A1 installed 2020-08-01 life 84 cost 500000 score 1 (factor 0.60 -> 50.4 floored 50 months -> 2024-10-01, past-life -> bucket 0); A2 installed 2024-08-01 life 96 cost 300000 score 3 (factor 1.00 -> 96 months -> 2032-08-01 -> bucket 6, outside horizon 5)"
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "CF-P1", display_name: "Comb Formula P1", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u1_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u1_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2020-08-01T00:00:00Z", warranty_months: 12, expected_life_months: 84, replacement_cost_cents: 500000 }
              as: PropertyManager
              captures: { a1_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u1_id}/assets"
              payload: { component_type: "WATER_HEATER", installed_on: "2024-08-01T00:00:00Z", warranty_months: 12, expected_life_months: 96, replacement_cost_cents: 300000 }
              as: PropertyManager
              captures: { a2_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 90, estimated_labor_minutes: 60, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t1_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "WATER_HEATER", task_name: "WH svc", frequency_days: 90, estimated_labor_minutes: 60, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t2_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 100000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T20:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u1_id}", template_id: "${t1_id}", asset_id: "${a1_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v1_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u1_id}", template_id: "${t2_id}", asset_id: "${a2_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T11:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v2_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 2" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v1_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v1_id}/complete"
              payload: { actual_minutes: 60, condition_score_recorded: 1 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T11:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v2_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v2_id}/complete"
              payload: { actual_minutes: 60, condition_score_recorded: 3 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /properties/${p_id}/capital-forecasts"
              payload: { horizon_years: 5, variant: "CONDITION_BASED" }
              as: PropertyManager
              captures: { per_year: $.data.per_year_cents, total: $.data.total_projected_cents, count: $.data.asset_count_projected }
          assert:
            - "per_year_cents == [500000, 0, 0, 0, 0] (A1 score-1 accelerates to 50 months -> already past life -> bucket 0)"
            - "total_projected_cents == 500000"
            - "asset_count_projected == 1 (A2's 96-month life lands in bucket 6, outside horizon 5)"

      - name: budget_burn_mode_b_rounding_order
        grounds:
          - calculations.budget_burn
        distinguishing_aspect: |
          Mode (b): budget_burn pins round-per-event-then-sum — each visit's
          estimated and actual cost is rounded half-up to whole cents
          INDIVIDUALLY before aggregation. With rate 6100 cents/hour and a
          7-minute task: round(7*6100/60)=round(711.666)=712 per event; three
          such visits settle 2136 cents — while sum-then-round would give
          round(3*711.666)=round(2135)=2135, a different total.
        test_recipe:
          setup:
            - "Property rate 6100 cents/hour; template estimated 7 minutes; adopted plan; three visits (one per unit across three units) all completed with actual_minutes=7 each; per-event rounding gives 712 cents each"
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "CF-P2", display_name: "Comb Formula P2", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6100 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u1_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "102", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u2_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "103", occupancy_status: "VACANT" }
              as: PropertyManager
              captures: { u3_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u1_id}/assets"
              payload: { component_type: "APPLIANCE", installed_on: "2024-01-01T00:00:00Z", warranty_months: 12, expected_life_months: 120, replacement_cost_cents: 100000 }
              as: PropertyManager
              captures: { a1_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u2_id}/assets"
              payload: { component_type: "APPLIANCE", installed_on: "2024-01-01T00:00:00Z", warranty_months: 12, expected_life_months: 120, replacement_cost_cents: 100000 }
              as: PropertyManager
              captures: { a2_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u3_id}/assets"
              payload: { component_type: "APPLIANCE", installed_on: "2024-01-01T00:00:00Z", warranty_months: 12, expected_life_months: 120, replacement_cost_cents: 100000 }
              as: PropertyManager
              captures: { a3_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "APPLIANCE", task_name: "Filter swap", frequency_days: 30, estimated_labor_minutes: 7, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 100000000 }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /properties/${p_id}/plans/${pl_id}/adopt"
              payload: {}
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches"
              payload: { batch_label: "b1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T20:00:00Z" }
              as: PropertyManager
              captures: { bat_id: $.data.id, bat_v: $.data.version }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u1_id}", template_id: "${t_id}", asset_id: "${a1_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T09:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v1_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u2_id}", template_id: "${t_id}", asset_id: "${a2_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T10:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v2_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits"
              payload: { unit_id: "${u3_id}", template_id: "${t_id}", asset_id: "${a3_id}", plan_id: "${pl_id}", scheduled_start: "2026-08-02T11:00:00Z", technician_id: "tech-1" }
              as: PropertyManager
              captures: { v3_id: $.data.id }
            - call: "POST /properties/${p_id}/batches/${bat_id}/publish"
              payload: { expected_batch_version: "${bat_v} + 3" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: PropertyManager
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v1_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v1_id}/complete"
              payload: { actual_minutes: 7, condition_score_recorded: 4 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v2_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v2_id}/complete"
              payload: { actual_minutes: 7, condition_score_recorded: 4 }
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v3_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v3_id}/complete"
              payload: { actual_minutes: 7, condition_score_recorded: 4 }
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "GET /properties/${p_id}/plans/${pl_id}"
              payload: {}
              as: PropertyManager
              captures: { spent: $.data.spent_cents, committed: $.data.committed_cents }
          assert:
            - "PMPlan.spent_cents == 2136 (3 x round_half_up(7*6100/60)=3 x 712)"
            - "PMPlan.committed_cents == 0 (every commit settled/released)"
            - "spent_cents != 2135 (the sum-then-round result); rounding order is pinned per-event"

  # ===========================================================================
  # Rule 3: Non-linear state machines on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_no_access_reschedule_cycle
        grounds:
          - state_machines.PMVisit
          - state_machines.PMVisit.NO_ACCESS_to_SCHEDULED
        distinguishing_aspect: |
          PMVisit has a cycle (NOTIFIED -> NO_ACCESS -> SCHEDULED via
          reschedule) on the PMVisit entity — a visit can loop through
          failed-entry then re-entry an unbounded number of times, with each
          loop releasing and re-committing its budget estimate.
        test_recipe:
          setup:
            - "Property (occupied unit, notice_lead 24h), adopted plan, template (30 min), published batch b1 window 2026-08-03 08:00-18:00 with visit v at 09:00; second DRAFT batch b2 window 2026-08-10 08:00-18:00"
          setup_api_calls:
            - call: "POST /properties"
              payload: { property_code: "SM-P1", display_name: "SM P1", notice_lead_hours: 24, default_labor_rate_cents_per_hour: 6000 }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings"
              payload: { building_label: "A", floors: 1 }
              as: PropertyManager
              captures: { b_id: $.data.id }
            - call: "POST /properties/${p_id}/buildings/${b_id}/units"
              payload: { unit_number: "101", occupancy_status: "OCCUPIED" }
              as: PropertyManager
              captures: { u_id: $.data.id }
            - call: "POST /properties/${p_id}/units/${u_id}/assets"
              payload: { component_type: "HVAC", installed_on: "2024-01-01T00:00:00Z", warranty_months: 24, expected_life_months: 120, replacement_cost_cents: 400000 }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /properties/${p_id}/pm-task-templates"
              payload: { component_type: "HVAC", task_name: "HVAC svc", frequency_days: 90, estimated_labor_minutes: 30, requires_evidence: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { t_id: $.data.id }
            - call: "POST /properties/${p_id}/plans"
              payload: { plan_year: 2026, budget_cents: 100000000 }
