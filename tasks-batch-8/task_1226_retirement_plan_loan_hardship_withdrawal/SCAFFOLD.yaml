# =============================================================================
# Task 1226: Retirement Plan Loan & Hardship Withdrawal Processing
# (401(k) recordkeeper) — scaffold seed tables
# =============================================================================

scenario: |
  1226. Retirement Plan Loan & Hardship Withdrawal Processing (401(k) recordkeeper): loan eligibility, limits & amortization schedule setup, payroll deduction remittance & missed-payment cure period, deemed distribution & taxable event determination, hardship substantiation standard & documentation retention, suspension rules & subsequent contribution restart, multiple-loan policy & refinancing, default on termination & offset, plan-specific approval workflow

domain_name: retirement-loan-hardship
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit        # regulatory gating, substantiation, retention, tax events
  secondary_archetype: ledger_reconciliation # amortization schedule vs remitted payroll deductions
  complexity_layers:
    - optimistic_concurrency      # OCC on Loan.version (schedule rebuild) and Plan.version (policy update)
    - cascading_side_effects      # deem/offset/termination/hardship-paid cascades spanning 3+ entities
    - dual_variant_calculation    # 30/360 vs ACT/360 amortization; NET vs GROSS hardship gross-up; DEEMED vs OFFSET taxable amount
    - scheduled_actions           # logical clock drives MISSED marking, cure expiry, suspension expiry
  entity_topology: hybrid          # Plan -> Participant -> children tree, plus polymorphic ApprovalTask subjects and self-referential Loan.refinances_loan_id
  state_machine_shape: parallel    # Loan carries lifecycle_status x delinquency_status as independent dimensions; HardshipRequest and ContributionElection are cyclic
  relationship_patterns:
    - one_to_many
    - self_referential             # Loan.refinances_loan_id
    - polymorphic                  # ApprovalTask.subject (LOAN | HARDSHIP), TaxEvent.source
    - cross_aggregate              # PayrollRemittance.allocations reference Loans across the Participant aggregate
  role_model: segregation_of_duties # plan-specific approval chains; same operator may not decide two steps of one subject
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan name" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | FROZEN | TERMINATED" }
      - { name: max_loans_outstanding, type: integer, source: input, default: 1, description: "Max loans per participant with lifecycle in {REQUESTED, APPROVED, DISBURSED}" }
      - { name: min_loan_amount_cents, type: integer, source: input, default: 100000, description: "Minimum loan principal" }
      - { name: max_loan_amount_cents, type: integer, source: input, default: 5000000, description: "Plan-level per-loan cap" }
      - { name: max_term_months, type: integer, source: input, default: 60, description: "Maximum loan term in months" }
      - { name: interest_rate_bps, type: integer, source: input, default: 500, description: "Fixed annual loan interest rate in basis points, snapshotted onto each Loan at request" }
      - { name: day_count_convention, type: enum, source: input, default: "THIRTY_360", description: "THIRTY_360 | ACT_360 — snapshotted onto each Loan at request" }
      - { name: allows_refinance, type: boolean, source: input, default: false, description: "Whether loan refinancing is permitted" }
      - { name: refinance_min_months_since_disbursement, type: integer, source: input, default: 12, description: "Minimum whole calendar months between old loan disbursement and refinance" }
      - { name: hardship_suspension_months, type: integer, source: input, default: 6, description: "Deferral suspension length after a hardship distribution is paid" }
      - { name: substantiation_standard, type: enum, source: input, default: "FULL_DOCUMENTATION", description: "FULL_DOCUMENTATION | SELF_CERTIFY" }
      - { name: withholding_rate_bps, type: integer, source: input, default: 2000, description: "Mandatory withholding rate on hardship distributions, basis points" }
      - { name: allowed_hardship_reasons, type: array, source: input, default: ["MEDICAL","FUNERAL","EVICTION","TUITION","HOME_PURCHASE","DISASTER"], description: "Plan-permitted safe-harbor reason categories" }
      - { name: loan_approval_chain, type: array, source: input, default: ["PLAN_SPONSOR","RECORDKEEPER_ADMIN"], description: "Ordered approver roles for loan requests; one ApprovalTask per entry" }
      - { name: hardship_approval_chain, type: array, source: input, default: ["PLAN_SPONSOR","RECORDKEEPER_ADMIN"], description: "Ordered approver roles for hardship requests" }

  - name: Participant
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id" }
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: external_ref, type: string, source: input, description: "External payroll/HR reference", default: null }
      - { name: vested_balance_cents, type: integer, source: input, description: "Current vested account balance; set at enrollment, adjustable via PATCH (custodian sync)" }
      - { name: employment_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | TERMINATED — mutated only via PATCH /participants/{id}" }
      - { name: terminated_on, type: datetime, source: system, default: null, description: "Termination date; defaults to logical clock date when PATCHed to TERMINATED without an explicit value" }
      - { name: contribution_status, type: enum, source: computed, default: "NONE", description: "NONE | ACTIVE | SUSPENDED | TERMINATED — mirrors the participant's ContributionElection.status, NONE when no election exists" }
      - { name: ytd_taxable_distributions_cents, type: integer, source: computed, default: 0, description: "Sum of taxable_amount_cents over all of the participant's TaxEvents (PENDING and REPORTED both count)" }
      - { name: loan_eligibility_locked_until, type: datetime, source: computed, default: null, description: "Set to event_date + 12 calendar months when any of the participant's loans is DEEMED or OFFSET; new loan requests before this instant are rejected" }

  - name: ContributionElection
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: deferral_pct, type: number, source: input, description: "Elective deferral percentage of pay (0 < pct <= 60)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: effective_on, type: datetime, source: system, description: "Date the election became effective (logical clock at creation)" }

  - name: Loan
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id" }
      - { name: refinances_loan_id, type: string, source: system, default: null, description: "FK -> Loan.id; set on the new loan created by a refinance, points at the loan it replaces" }
      - { name: principal_amount_cents, type: integer, source: input, description: "Requested principal" }
      - { name: term_months, type: integer, source: input, description: "Requested term in months (<= plan.max_term_months)" }
      - { name: interest_rate_bps, type: integer, source: system, description: "Plan rate snapshotted at request; later policy changes do not alter existing loans" }
      - { name: day_count_convention, type: enum, source: system, description: "THIRTY_360 | ACT_360 — snapshotted from plan at request" }
      - { name: scheduled_payment_cents, type: integer, source: computed, default: null, description: "Level monthly payment computed at disbursement per calculations.amortization_schedule" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "principal_amount_cents minus principal applied by non-reversed remittances (sum of per-installment principal coverage: max(0, paid_amount_cents - interest_portion_cents) per installment)" }
      - { name: accrued_unpaid_interest_cents, type: integer, source: computed, default: 0, description: "Sum of (interest_portion_cents - interest covered by payments) over installments with due_date <= evaluation date and status in {PENDING, MISSED}" }
      - { name: lifecycle_status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | DENIED | WITHDRAWN | DISBURSED | REPAID | REFINANCED | OFFSET" }
      - { name: delinquency_status, type: enum, source: system, default: "NONE", description: "NONE | CURRENT | DELINQUENT | DEEMED — NONE until disbursement; parallel state dimension to lifecycle_status" }
      - { name: disbursed_on, type: datetime, source: system, default: null, description: "Logical clock date of disbursement; installment due dates anchor to its day-of-month" }
      - { name: cure_deadline_on, type: datetime, source: computed, default: null, description: "Set when delinquency_status enters DELINQUENT: last day of the calendar quarter following the quarter of the earliest unpaid MISSED installment's due_date" }
      - { name: deemed_on, type: datetime, source: system, default: null, description: "Logical clock date the deemed distribution fired" }

  - name: LoanInstallment
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: installment_number, type: integer, source: system, description: "1-based sequence number" }
      - { name: due_date, type: datetime, source: system, description: "Monthly on the disbursement day-of-month, first due one month after disbursed_on" }
      - { name: scheduled_amount_cents, type: integer, source: system, description: "Level payment; final installment absorbs rounding remainder" }
      - { name: principal_portion_cents, type: integer, source: system, description: "Scheduled principal component" }
      - { name: interest_portion_cents, type: integer, source: system, description: "Scheduled interest component" }
      - { name: paid_amount_cents, type: integer, source: system, default: 0, description: "Cumulative amount applied by non-reversed remittances" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | PAID | MISSED | CURED | REBUILT | CLOSED" }

  - name: PayrollRemittance
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: amount_cents, type: integer, source: input, description: "Total remitted payroll deduction" }
      - { name: pay_date, type: datetime, source: input, description: "Payroll pay date the deduction corresponds to; used for cure-deadline comparison" }
      - { name: allocations, type: array, source: input, default: null, description: "Optional explicit [{loan_id, amount_cents}]; when omitted the server auto-allocates per calculations.remittance_waterfall_allocation" }
      - { name: applied_allocations, type: array, source: computed, description: "Server-recorded waterfall result: [{loan_id, installment_id, amount_cents, to_interest_cents, to_principal_cents}] in application order; snapshot used for exact reversal" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REVERSED" }

  - name: HardshipRequest
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id" }
      - { name: reason_category, type: enum, source: input, description: "MEDICAL | FUNERAL | EVICTION | TUITION | HOME_PURCHASE | DISASTER" }
      - { name: amount_cents, type: integer, source: input, description: "Requested amount; interpretation depends on amount_semantics" }
      - { name: amount_semantics, type: enum, source: input, default: "GROSS", description: "NET = participant must receive amount_cents after withholding and fee; GROSS = amount_cents is the total distribution" }
      - { name: attestation, type: boolean, source: input, default: null, description: "Self-certification attestation; required true when plan.substantiation_standard == SELF_CERTIFY" }
      - { name: gross_withdrawal_cents, type: integer, source: computed, description: "Per calculations.hardship_gross_up at creation" }
      - { name: withholding_cents, type: integer, source: computed, description: "Mandatory withholding on the distribution" }
      - { name: fee_cents, type: integer, source: computed, description: "Processing fee per tiered constant" }
      - { name: net_disbursed_cents, type: integer, source: computed, description: "gross_withdrawal_cents - withholding_cents - fee_cents" }
      - { name: status, type: enum, source: system, default: "UNDER_REVIEW", description: "UNDER_REVIEW | PENDING_DOCUMENTS | APPROVED | DENIED | PAID | WITHDRAWN" }
      - { name: paid_on, type: datetime, source: system, default: null, description: "Logical clock date of distribution payment" }

  - name: HardshipDocument
    parent: HardshipRequest
    common_fields: false
    fields:
      - { name: hardship_request_id, type: string, source: system, description: "FK -> HardshipRequest.id" }
      - { name: document_type, type: enum, source: input, description: "INVOICE | MEDICAL_BILL | BANK_STATEMENT | ATTESTATION | EVICTION_NOTICE | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Expense amount evidenced by the document" }
      - { name: description, type: string, source: input, default: null, description: "Free-text description" }
      - { name: retained_until, type: datetime, source: computed, default: null, description: "Documentation retention deadline: paid_on + 7 calendar years once the request is PAID; null before" }

  - name: ApprovalTask
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id" }
      - { name: subject_type, type: enum, source: system, description: "LOAN | HARDSHIP — polymorphic subject discriminator" }
      - { name: subject_id, type: string, source: system, description: "id of the Loan or HardshipRequest under approval (polymorphic; not a single-parent FK)" }
      - { name: step_order, type: integer, source: system, description: "1-based position in the plan's approval chain" }
      - { name: approver_role, type: enum, source: system, description: "PLAN_SPONSOR | RECORDKEEPER_ADMIN — the role required to decide this step" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | REJECTED | DOCS_REQUESTED | CANCELLED" }
      - { name: decided_by, type: string, source: system, default: null, description: "X-User-ID of the decider; recorded for segregation-of-duties checks" }
      - { name: decided_on, type: datetime, source: system, default: null, description: "Logical clock timestamp of decision" }

  - name: SuspensionRecord
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: hardship_request_id, type: string, source: system, description: "FK -> HardshipRequest.id; the distribution that caused this suspension" }
      - { name: starts_on, type: datetime, source: system, description: "= hardship paid_on" }
      - { name: ends_on, type: datetime, source: system, description: "= paid_on + plan.hardship_suspension_months calendar months (same day-of-month); window is half-open [starts_on, ends_on)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRED — flips to EXPIRED when the logical clock reaches ends_on" }

  - name: TaxEvent
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: source_type, type: enum, source: system, description: "LOAN_DEEMED | LOAN_OFFSET | HARDSHIP_DISTRIBUTION — polymorphic source discriminator" }
      - { name: source_id, type: string, source: system, description: "id of the Loan or HardshipRequest that produced the event" }
      - { name: taxable_amount_cents, type: integer, source: computed, description: "Computed at creation per calculations.distribution_taxable_amount" }
      - { name: event_date, type: datetime, source: system, description: "Logical clock date the event fired" }
      - { name: tax_year, type: integer, source: computed, description: "Calendar year of event_date" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | REPORTED (1099-R filed)" }

  - name: AuditEvent
    parent: Plan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the mutating call" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the mutating call" }
      - { name: action, type: string, source: system, description: "Machine action name, e.g. LOAN_REQUESTED, LOAN_DISBURSED, REMITTANCE_POSTED, HARDSHIP_PAID" }
      - { name: subject_type, type: string, source: system, description: "Entity type the action affected" }
      - { name: subject_id, type: string, source: system, description: "Entity id the action affected" }
      - { name: detail, type: object, source: system, description: "Action-specific payload snapshot" }
    note: "Append-only: every mutating endpoint in section 1.5 appends exactly one AuditEvent scoped to the affected plan before returning. AuditEvents are never updated or deleted."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /plans/{id}/freeze"
        actor: PlanSponsor | RecordkeeperAdmin
        preconditions: []
        side_effects:
          - "Appends AuditEvent PLAN_FROZEN"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /plans/{id}/unfreeze"
        actor: PlanSponsor | RecordkeeperAdmin
        preconditions: []
        side_effects:
          - "Appends AuditEvent PLAN_UNFROZEN"
      - from: ACTIVE
        to: TERMINATED
        trigger: "not exposed as an endpoint in this scaffold version (plan termination is administrative)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: TERMINATED
        trigger: "not exposed as an endpoint in this scaffold version"
        actor: system
        preconditions: []
        side_effects: []
    note: "Plan.status is a posture gate: plan must be ACTIVE for loan request/disburse/refinance/rebuild, remittance post/reverse, hardship create/pay, approval decisions, and election restart. FROZEN/TERMINATED cause ERR_PLAN_NOT_ACTIVE on those endpoints."

  - entity: Participant
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "State field is employment_status. Enrollment creates the participant in ACTIVE."
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /participants/{id} with employment_status=TERMINATED"
        actor: RecordkeeperAdmin
        preconditions:
          - "employment_status currently ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "terminated_on = provided value or logical clock date"
          - "Link 1 — for each Loan with lifecycle_status == DISBURSED and outstanding_principal_cents > 0 (processed in created_at ASC order): lifecycle_status -> OFFSET"
          - "Link 2 — each OFFSET transition itself creates a TaxEvent with source_type=LOAN_OFFSET, taxable_amount_cents per calculations.distribution_taxable_amount variant OFFSET, event_date = terminated_on"
          - "Link 3 — each created TaxEvent increments Participant.ytd_taxable_distributions_cents by taxable_amount_cents and sets Participant.loan_eligibility_locked_until = max(existing, terminated_on + 12 calendar months)"
          - "ContributionElection in ACTIVE or SUSPENDED -> TERMINATED; Participant.contribution_status -> TERMINATED"
          - "PENDING ApprovalTasks on the participant's open Loan subjects -> CANCELLED"
          - "Appends AuditEvent PARTICIPANT_TERMINATED"

  - entity: ContributionElection
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (side effect of SuspensionRecord creation when a HardshipRequest is PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Participant.contribution_status -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /participants/{id}/contribution-election/restart"
        actor: Participant
        preconditions:
          - "No SuspensionRecord for this participant with status == ACTIVE — i.e. logical clock >= ends_on of every suspension (else ERR_SUSPENSION_STILL_ACTIVE)"
          - "employment_status == ACTIVE (else ERR_EMPLOYMENT_NOT_ACTIVE)"
        side_effects:
          - "Participant.contribution_status -> ACTIVE"
          - "Appends AuditEvent ELECTION_RESTARTED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (participant termination cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (participant termination cascade)"
        actor: system
        preconditions: []
        side_effects: []
    note: "PUT /participants/{id}/contribution-election creates the election (one per participant) and may replace deferral_pct only while ACTIVE; calling it while SUSPENDED returns ERR_INVALID_STATE — use restart."

  - entity: Loan
    initial_state: REQUESTED
    terminal_states: [DENIED, WITHDRAWN, REPAID, REFINANCED, OFFSET]
    note: "Two parallel state dimensions. lifecycle_status: REQUESTED -> APPROVED -> DISBURSED -> {REPAID, REFINANCED, OFFSET}, with REPAID -> DISBURSED revert on remittance reversal. delinquency_status (independent, meaningful only while DISBURSED): CURRENT <-> DELINQUENT -> DEEMED."
    transitions:
      # ---- lifecycle dimension ----
      - from: REQUESTED
        to: APPROVED
        trigger: "system (final step of plan.loan_approval_chain decided APPROVE via POST /approval-tasks/{id}/decide)"
        actor: system
        preconditions:
          - "All ApprovalTasks for this subject APPROVED in step_order"
        side_effects:
          - "Appends AuditEvent LOAN_APPROVED"
      - from: REQUESTED
        to: DENIED
        trigger: "system (any ApprovalTask for this subject decided REJECT)"
        actor: system
        preconditions: []
        side_effects:
          - "Remaining PENDING ApprovalTasks for this subject -> CANCELLED"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /loans/{id}/withdraw"
        actor: Participant
        preconditions:
          - "X-User-ID == Loan.participant_id"
        side_effects:
          - "PENDING ApprovalTasks for this subject -> CANCELLED"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /loans/{id}/disburse"
        actor: RecordkeeperAdmin
        preconditions:
          - "Plan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "disbursed_on = logical clock date"
          - "delinquency_status NONE -> CURRENT"
          - "Runs calculations.amortization_schedule: sets scheduled_payment_cents and creates term_months LoanInstallment rows (status PENDING)"
          - "Appends AuditEvent LOAN_DISBURSED"
      - from: DISBURSED
        to: REPAID
        trigger: "system (remittance posting drives outstanding_principal_cents to exactly 0)"
        actor: system
        preconditions:
          - "outstanding_principal_cents == 0 after applying the remittance"
        side_effects:
          - "Remaining PENDING LoanInstallments -> CLOSED; MISSED/CURED retain history"
      - from: REPAID
        to: DISBURSED
        trigger: "system (reversal of a remittance restores outstanding_principal_cents > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Installment statuses recomputed from non-reversed remittances (CLOSED rows with paid_amount_cents < scheduled_amount_cents return to PENDING)"
      - from: DISBURSED
        to: REFINANCED
        trigger: "POST /loans/{id}/refinance"
        actor: RecordkeeperAdmin
        preconditions:
          - "Plan.allows_refinance == true (else ERR_REFINANCE_NOT_ALLOWED)"
          - "delinquency_status != DEEMED (else ERR_INVALID_STATE)"
          - "disbursed_on <= logical clock date minus plan.refinance_min_months_since_disbursement calendar months (else ERR_REFINANCE_LOOKBACK_VIOLATION)"
          - "new principal per calculations.refinance_terms <= calculations.loan_maximum_amount for the participant (else ERR_LOAN_LIMIT_EXCEEDED)"
        side_effects:
          - "Link 1 — old loan outstanding_principal_cents -> 0; remaining PENDING installments -> CLOSED; delinquency_status -> NONE"
          - "Link 2 — new Loan created already DISBURSED with refinances_loan_id = old loan id, principal per calculations.refinance_terms, disbursed_on = logical clock date, delinquency_status = CURRENT, and its amortization schedule generated"
          - "Appends AuditEvent LOAN_REFINANCED on both loans"
      - from: DISBURSED
        to: OFFSET
        trigger: "system (participant termination cascade)"
        actor: system
        preconditions:
          - "outstanding_principal_cents > 0"
        side_effects:
          - "Creates TaxEvent source_type=LOAN_OFFSET (see Participant machine link 2/3)"
          - "Remaining PENDING/MISSED installments -> CLOSED"
      # ---- delinquency dimension (parallel; valid while lifecycle == DISBURSED) ----
      - from: CURRENT
        to: DELINQUENT
        trigger: "system (POST /_clock/set_current_utc advances the logical clock past an installment due_date with paid_amount_cents < scheduled_amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Each newly past-due PENDING installment -> MISSED"
          - "cure_deadline_on = last day of the calendar quarter following the quarter containing the earliest still-unpaid MISSED installment's due_date (calculations.cure_window_deadline)"
      - from: DELINQUENT
        to: CURRENT
        trigger: "system (remittance posting results in every MISSED installment having paid_amount_cents >= scheduled_amount_cents AND remittance pay_date <= cure_deadline_on)"
        actor: system
        preconditions: []
        side_effects:
          - "Cured installments -> CURED"
          - "cure_deadline_on -> null"
      - from: DELINQUENT
        to: DEEMED
        trigger: "system (POST /_clock/set_current_utc advances the logical clock past cure_deadline_on while any MISSED installment remains unpaid)"
        actor: system
        preconditions: []
        side_effects:
          - "Link 1 — Loan.delinquency_status -> DEEMED; deemed_on = logical clock date; loan leaves the remittance waterfall input set"
          - "Link 2 — the DEEMED transition itself creates a TaxEvent source_type=LOAN_DEEMED with taxable_amount_cents per calculations.distribution_taxable_amount variant DEEMED and event_date = deemed_on"
          - "Link 3 — the created TaxEvent increments Participant.ytd_taxable_distributions_cents by taxable_amount_cents and sets Participant.loan_eligibility_locked_until = deemed_on + 12 calendar months"
          - "Link 4 — while logical clock < loan_eligibility_locked_until, POST /participants/{id}/loans for this participant is rejected with ERR_LOAN_ELIGIBILITY_LOCKED"
          - "Appends AuditEvent LOAN_DEEMED"
    note: "DEEMED is terminal for the delinquency dimension only; the loan keeps its outstanding principal for recordkeeping but accepts no further remittance application."

  - entity: LoanInstallment
    initial_state: PENDING
    terminal_states: [PAID, CURED, REBUILT, CLOSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "system (remittance waterfall covers scheduled_amount_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: MISSED
        trigger: "system (clock advance past due_date with paid_amount_cents < scheduled_amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Loan delinquency CURRENT -> DELINQUENT (see Loan machine)"
      - from: MISSED
        to: CURED
        trigger: "system (remittance with pay_date <= cure_deadline_on covers the shortfall)"
        actor: system
        preconditions: []
        side_effects:
          - "Loan delinquency re-evaluates to CURRENT when no MISSED installments remain"
      - from: PENDING
        to: REBUILT
        trigger: "POST /loans/{id}/schedule/rebuild supersedes the remaining schedule"
        actor: RecordkeeperAdmin
        preconditions: []
        side_effects:
          - "New PENDING installments are generated over the rebuild term; MISSED/PAID/CURED rows are retained unchanged"
      - from: PENDING
        to: CLOSED
        trigger: "system (loan reaches REPAID, REFINANCED, or OFFSET)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MISSED
        to: CLOSED
        trigger: "system (loan reaches OFFSET)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PayrollRemittance
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /remittances/{id}/reverse"
        actor: RecordkeeperAdmin
        preconditions:
          - "Plan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "Undo applied_allocations exactly: each referenced LoanInstallment.paid_amount_cents decremented by its recorded amount"
          - "Loan.outstanding_principal_cents recomputed; a REPAID loan with restored outstanding > 0 returns to DISBURSED"
          - "Installment statuses recomputed from remaining non-reversed remittances against the current logical clock (an unpaid row whose due_date has passed becomes MISSED again, a still-future unpaid row returns to PENDING); Loan delinquency re-evaluated (a cure may be undone: CURRENT -> DELINQUENT when a MISSED installment is again unpaid and logical clock <= the recomputed cure_deadline_on)"
          - "Appends AuditEvent REMITTANCE_REVERSED"
    note: "Creation applies calculations.remittance_waterfall_allocation immediately and stores the result in applied_allocations."

  - entity: HardshipRequest
    initial_state: UNDER_REVIEW
    terminal_states: [DENIED, PAID, WITHDRAWN]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system (final step of plan.hardship_approval_chain decided APPROVE)"
        actor: system
        preconditions:
          - "Substantiation check passed at final approval (validations priorities 9-10)"
        side_effects:
          - "Appends AuditEvent HARDSHIP_APPROVED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system (any ApprovalTask decided REJECT)"
        actor: system
        preconditions: []
        side_effects:
          - "Remaining PENDING ApprovalTasks for this subject -> CANCELLED"
      - from: UNDER_REVIEW
        to: PENDING_DOCUMENTS
        trigger: "system (an ApprovalTask decided REQUEST_DOCS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_DOCUMENTS
        to: UNDER_REVIEW
        trigger: "system (participant uploads a document via POST /hardship-requests/{id}/documents)"
        actor: system
        preconditions: []
        side_effects:
          - "The DOCS_REQUESTED ApprovalTask returns to PENDING for re-decision"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /hardship-requests/{id}/withdraw"
        actor: Participant
        preconditions:
          - "X-User-ID == HardshipRequest.participant_id"
        side_effects:
          - "PENDING ApprovalTasks for this subject -> CANCELLED"
      - from: PENDING_DOCUMENTS
        to: WITHDRAWN
        trigger: "POST /hardship-requests/{id}/withdraw"
        actor: Participant
        preconditions:
          - "X-User-ID == HardshipRequest.participant_id"
        side_effects:
          - "PENDING ApprovalTasks for this subject -> CANCELLED"
      - from: APPROVED
        to: PAID
        trigger: "POST /hardship-requests/{id}/pay"
        actor: RecordkeeperAdmin
        preconditions:
          - "Plan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
          - "gross_withdrawal_cents <= Participant.vested_balance_cents (else ERR_INSUFFICIENT_VESTED_BALANCE)"
        side_effects:
          - "paid_on = logical clock date; Participant.vested_balance_cents -= gross_withdrawal_cents"
          - "Link 1 — creates SuspensionRecord with starts_on = paid_on, ends_on per calculations.suspension_window, status ACTIVE"
          - "Link 2 — the new ACTIVE SuspensionRecord transitions the participant's ContributionElection ACTIVE -> SUSPENDED"
          - "Link 3 — the election suspension sets Participant.contribution_status -> SUSPENDED"
          - "Creates TaxEvent source_type=HARDSHIP_DISTRIBUTION, taxable_amount_cents = gross_withdrawal_cents, event_date = paid_on; Participant.ytd_taxable_distributions_cents += gross_withdrawal_cents"
          - "Sets retained_until = paid_on + 7 calendar years on every HardshipDocument of this request"
          - "Appends AuditEvent HARDSHIP_PAID"

  - entity: ApprovalTask
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /approval-tasks/{id}/decide with decision=APPROVE"
        actor: PlanSponsor | RecordkeeperAdmin
        preconditions:
          - "X-User-Role == approver_role (else ERR_UNAUTHORIZED_ROLE)"
          - "Every lower step_order task on the same subject is APPROVED (else ERR_APPROVAL_OUT_OF_ORDER)"
          - "X-User-ID differs from decided_by of every other decided task on the same subject, and from the subject's requesting participant id (else ERR_SEGREGATION_OF_DUTIES)"
          - "If this is the final step of a HARDSHIP subject: substantiation + suspension-overlap re-checks (validations priorities 9-10)"
        side_effects:
          - "decided_by = X-User-ID; decided_on = logical clock"
          - "When this is the final chain step: subject Loan REQUESTED -> APPROVED, or subject HardshipRequest UNDER_REVIEW -> APPROVED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /approval-tasks/{id}/decide with decision=REJECT"
        actor: PlanSponsor | RecordkeeperAdmin
        preconditions:
          - "Same role/order/segregation preconditions as APPROVE"
        side_effects:
          - "Subject Loan REQUESTED -> DENIED, or subject HardshipRequest UNDER_REVIEW -> DENIED; sibling PENDING tasks -> CANCELLED"
      - from: PENDING
        to: DOCS_REQUESTED
        trigger: "POST /approval-tasks/{id}/decide with decision=REQUEST_DOCS"
        actor: PlanSponsor | RecordkeeperAdmin
        preconditions:
          - "subject_type == HARDSHIP (REQUEST_DOCS on a LOAN subject returns ERR_INVALID_REQUEST)"
          - "Same role/order/segregation preconditions as APPROVE"
        side_effects:
          - "HardshipRequest UNDER_REVIEW -> PENDING_DOCUMENTS"
      - from: DOCS_REQUESTED
        to: PENDING
        trigger: "system (document upload returns the request to review)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_by and decided_on are cleared (the step reopens for a fresh decision; the prior DOCS_REQUESTED decision does not count for segregation-of-duties)"
      - from: PENDING
        to: CANCELLED
        trigger: "system (subject withdrawn, denied, or participant terminated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SuspensionRecord
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc advances the logical clock to >= ends_on)"
        actor: system
        preconditions: []
        side_effects: []
    note: "EXPIRED does not itself reactivate the ContributionElection; the participant must call restart (contribution restart is an explicit action)."

  - entity: TaxEvent
    initial_state: PENDING
    terminal_states: [REPORTED]
    transitions:
      - from: PENDING
        to: REPORTED
        trigger: "POST /tax-events/{id}/mark-reported"
        actor: RecordkeeperAdmin
        preconditions:
          - "status == PENDING (else ERR_TAX_EVENT_ALREADY_REPORTED)"
        side_effects:
          - "Appends AuditEvent TAX_EVENT_REPORTED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: loan-schedule-rebuild-stale-version
    parent_entity: Loan
    write_endpoint: "POST /loans/{id}/schedule/rebuild"
    occ_field: expected_loan_version
    description: |
      Rebuilding the amortization schedule supersedes the loan's current PENDING
      installment set. A rebuild request whose expected_loan_version does not equal
      the loan's current version is rejected: the client's view of outstanding
      principal and remaining schedule is stale (e.g. a prior rebuild or remittance
      has already advanced the version since the client read the loan).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-policy-update-stale-version
    parent_entity: Plan
    write_endpoint: "PUT /plans/{id}/policy"
    occ_field: expected_plan_version
    description: |
      Updating plan policy supersedes the prior policy revision that pending loan
      and hardship requests were validated against. A policy update whose
      expected_plan_version does not equal the plan's current version is rejected
      as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: loan_maximum_amount
    trigger: "POST /participants/{id}/loans validation; GET /participants/{id}/loan-eligibility; refinance fiscal check"
    algorithm: threshold
    formula: |
      vested_component = floor(Participant.vested_balance_cents * VESTED_RATIO)
      irc_cap_cents = IRC_CAP_CENTS - max(0, highest_outstanding_12mo_cents - current_outstanding_total_cents)
      max_loan_cents = min(vested_component, irc_cap_cents, Plan.max_loan_amount_cents)
      where:
        current_outstanding_total_cents = sum of outstanding_principal_cents over the
          participant's loans with lifecycle_status == DISBURSED
        highest_outstanding_12mo_cents = max over each calendar day D in the closed
          lookback window [today - LOOKBACK_MONTHS months, today - 1 day] of the
          end-of-day sum of outstanding_principal_cents across the participant's
          loans; end-of-day totals are derived chronologically from disbursement and
          remittance posting dates (created_at ASC tie-break for same-day events)
    input_set: "Participant plus all of their Loans in any lifecycle state; loans DEEMED/OFFSET/REFINANCED/REPAID contribute to the historical high-water mark but not to current_outstanding_total_cents"
    constants:
      VESTED_RATIO: 0.5
      IRC_CAP_CENTS: 5000000
      LOOKBACK_MONTHS: 12
    precision: "integer cents; floor applied to the vested component"
    variants:
      - name: standard
        when: "default"
        difference: "as written"
      - name: lookback_reduced
        when: "participant repaid or offset a loan within the trailing 12 months"
        difference: "highest_outstanding_12mo_cents exceeds current_outstanding_total_cents, shrinking irc_cap_cents below IRC_CAP_CENTS"

  - name: amortization_schedule
    trigger: "POST /loans/{id}/disburse; POST /loans/{id}/refinance (for the new loan); POST /loans/{id}/schedule/rebuild (for remaining principal over new term)"
    algorithm: tiered_pricing
    formula: |
      monthly_rate = Loan.interest_rate_bps / 10000 / 12
      raw_payment = principal * monthly_rate / (1 - (1 + monthly_rate) ** (-term_months))
      scheduled_payment_cents = round_half_up(raw_payment)          # step 1: round the level payment ONCE
      balance = principal
      for k in 1..term_months:                                       # step 2: per-installment rounding, order matters
        interest_k = round_half_up(balance * period_rate_k)          # period_rate_k depends on day_count_convention variant
        if k < term_months:
          principal_k = scheduled_payment_cents - interest_k
          scheduled_k = scheduled_payment_cents
        else:                                                        # step 3: final installment absorbs the rounding remainder
          principal_k = balance
          scheduled_k = principal_k + interest_k
        balance -= principal_k
      Invariant: sum(principal_k) == principal exactly.
    input_set: "the single loan being disbursed or rebuilt; rebuild input set is outstanding_principal_cents over the requested new term"
    constants: {}
    precision: "integer cents, round_half_up; rounding order pinned: level payment first, then each installment's interest, final installment takes the remainder"
    variants:
      - name: thirty_360
        when: "Loan.day_count_convention == THIRTY_360"
        difference: "period_rate_k = interest_rate_bps/10000/12 for every installment"
      - name: act_360
        when: "Loan.day_count_convention == ACT_360"
        difference: "period_rate_k = interest_rate_bps/10000 * actual_days(due_date_{k-1 or disbursement}, due_date_k)/360; identical inputs yield different interest portions and a different final installment"

  - name: remittance_waterfall_allocation
    trigger: "POST /participants/{id}/remittances when allocations is omitted"
    algorithm: waterfall_allocation
    formula: |
      eligible_loans = participant's loans with lifecycle_status == DISBURSED
                       and delinquency_status != DEEMED
      candidates = installments of eligible loans with status in {MISSED, PENDING}
                   and paid_amount_cents < scheduled_amount_cents
      order: MISSED installments first, then PENDING; within each group by
             due_date ASC, then Loan.created_at ASC, then installment_number ASC
      for each candidate in order: apply min(remaining, scheduled - paid);
        within an installment, covered interest = min(applied, interest_portion - interest_already_covered),
        remainder of applied reduces principal
      The candidate set spans ALL unpaid {MISSED, PENDING} installments, so the
      total coverable amount equals the full remaining scheduled balance; if
      remaining > 0 after all candidates (overpayment beyond the scheduled
      balance) the entire remittance is rejected with
      ERR_REMITTANCE_AMOUNT_MISMATCH (atomic — nothing is applied).
      If there are no eligible loans or no candidates at all, the remittance is
      rejected with ERR_INVALID_STATE.
      Explicit allocations: sum(allocations.amount_cents) must == amount_cents
        (else ERR_REMITTANCE_AMOUNT_MISMATCH); each referenced loan must be in
        eligible_loans (else ERR_INVALID_STATE); explicit amounts are applied to
        that loan's installments in the same order.
    input_set: "non-reversed context: only eligible loans and their {MISSED, PENDING} installments; REPAID/REFINANCED/OFFSET loans and DEEMED delinquency are excluded"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: cure_window_deadline
    trigger: "Loan delinquency CURRENT -> DELINQUENT"
    algorithm: threshold
    formula: |
      D = due_date of the earliest MISSED installment with paid_amount_cents < scheduled_amount_cents
      Q = calendar quarter containing D   (Q1: Jan-Mar, Q2: Apr-Jun, Q3: Jul-Sep, Q4: Oct-Dec)
      cure_deadline_on = last day of the calendar quarter immediately following Q
      Cure is valid when the curing remittance's pay_date <= cure_deadline_on (inclusive boundary).
      Deemed distribution fires on the first clock advance to a date > cure_deadline_on
      while any MISSED installment remains unpaid.
    input_set: "the loan's MISSED installments at the moment of evaluation"
    constants: {}
    precision: "date granularity"
    variants: []

  - name: distribution_taxable_amount
    trigger: "TaxEvent creation (LOAN_DEEMED, LOAN_OFFSET); HARDSHIP_DISTRIBUTION uses gross_withdrawal_cents directly"
    algorithm: aggregation
    formula: |
      taxable_amount_cents = Loan.outstanding_principal_cents + accrued_unpaid_interest_through(cutoff_date)
      accrued_unpaid_interest_through(cutoff) = sum of (interest_portion_cents - interest covered by
        non-reversed remittances) over installments with due_date <= cutoff and status in {PENDING, MISSED}
      tax_year = calendar year of event_date
    input_set: "the loan's installments filtered by due_date <= variant cutoff; states {PENDING, MISSED}"
    constants: {}
    precision: "integer cents"
    variants:
      - name: deemed
        when: "source_type == LOAN_DEEMED"
        difference: "cutoff_date = cure_deadline_on (quarter-end), regardless of the clock date the transition fires"
      - name: offset
        when: "source_type == LOAN_OFFSET"
        difference: "cutoff_date = event posting date (terminated_on); identical loan data and clock produce a different taxable amount than deemed whenever an installment due_date falls between the two cutoffs"

  - name: hardship_gross_up
    trigger: "POST /participants/{id}/hardship-requests (stored on the request at creation)"
    algorithm: constraint_propagation
    formula: |
      w = Plan.withholding_rate_bps / 10000
      Pinned evaluation order (the fee tier depends on the gross, and the gross
      depends on the fee — evaluate exactly in this order):
      Variant NET (participant must receive amount_cents):
        1. provisional_gross = amount_cents / (1 - w)
        2. fee_cents = FEE_LOW_CENTS if provisional_gross <= FEE_TIER_THRESHOLD_CENTS else FEE_HIGH_CENTS
        3. gross_withdrawal_cents = round_half_up((amount_cents + fee_cents) / (1 - w))
        4. withholding_cents = round_half_up(gross_withdrawal_cents * w)
        5. net_disbursed_cents = gross_withdrawal_cents - withholding_cents - fee_cents
      Variant GROSS (amount_cents is the total distribution):
        1. gross_withdrawal_cents = amount_cents
        2. fee_cents = FEE_LOW_CENTS if gross_withdrawal_cents <= FEE_TIER_THRESHOLD_CENTS else FEE_HIGH_CENTS
        3. withholding_cents = round_half_up(gross_withdrawal_cents * w)
        4. net_disbursed_cents = gross_withdrawal_cents - withholding_cents - fee_cents
    input_set: "the HardshipRequest being created"
    constants:
      FEE_TIER_THRESHOLD_CENTS: 1000000
      FEE_LOW_CENTS: 5000
      FEE_HIGH_CENTS: 7500
    precision: "integer cents, round_half_up"
    variants:
      - name: net_requested
        when: "amount_semantics == NET"
        difference: "gross is derived from the desired net; same amount_cents as GROSS yields a larger gross_withdrawal_cents"
      - name: gross_requested
        when: "amount_semantics == GROSS"
        difference: "amount_cents is the distribution total; net_disbursed_cents is derived"

  - name: refinance_terms
    trigger: "POST /loans/{id}/refinance"
    algorithm: aggregation
    formula: |
      accrued_unpaid_due = calculations.distribution_taxable_amount's interest component
        with cutoff = logical clock date
      new_principal_cents = old.outstanding_principal_cents + accrued_unpaid_due
                            + cash_out_cents + REFI_FEE_CENTS
      The new loan preserves the old loan's term_months, interest_rate_bps, and
      day_count_convention (refinance continues the original terms).
      The refinance replaces rather than adds: the old loan leaves
      {REQUESTED, APPROVED, DISBURSED} atomically, so max_loans_outstanding is not
      breached by the refinance itself. Fiscal gate: new_principal_cents must be
      <= calculations.loan_maximum_amount (which includes the trailing-12-month
      high-water reduction).
      Conserved-quantity invariant: sum of outstanding_principal_cents over the
      participant's loans after the refinance minus the same sum before equals
      exactly cash_out_cents + REFI_FEE_CENTS.
    input_set: "the old loan (DISBURSED, delinquency != DEEMED) and the participant's loan portfolio for the fiscal gate"
    constants:
      REFI_FEE_CENTS: 10000
    precision: "integer cents"
    variants: []

  - name: suspension_window
    trigger: "HardshipRequest APPROVED -> PAID"
    algorithm: threshold
    formula: |
      starts_on = paid_on
      ends_on = paid_on + Plan.hardship_suspension_months calendar months (same day-of-month)
      Window is half-open [starts_on, ends_on):
        - a new hardship request or loan request created while starts_on <= today < ends_on
          is rejected with ERR_SUSPENSION_OVERLAP
        - the suspension EXPIRES and restart is permitted when today >= ends_on
    input_set: "the participant's SuspensionRecords"
    constants: {}
    precision: "date granularity"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed for the endpoint; entity-backed ownership: when role is Participant, X-User-ID must equal the participant id in the path or the participant_id of the target resource (the ownership comparison is evaluated when the target resource is loaded, so a nonexistent target surfaces as the priority-5 not-found error rather than an ownership failure)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation of duties on decide: X-User-ID must differ from decided_by of every other decided task on the same subject and from the subject's requesting participant id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /approval-tasks/{id}/decide" }
  - { priority: 4, category: existence, check: "Request body schema: required fields present, types and enum members valid (unknown enum member for reason_category/document_type/decision/etc.)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Path resources exist, validated left-to-right (plan -> participant -> loan/hardship/remittance/task/tax-event)", error_id: ERR_PLAN_NOT_FOUND, http_status: 404, applies_to: "all", note: "uses the resource-specific not-found error: ERR_PLAN_NOT_FOUND, ERR_PARTICIPANT_NOT_FOUND, ERR_LOAN_NOT_FOUND, ERR_HARDSHIP_NOT_FOUND, ERR_REMITTANCE_NOT_FOUND, ERR_APPROVAL_TASK_NOT_FOUND, ERR_TAX_EVENT_NOT_FOUND" }
  - { priority: 6, category: state, check: "Target resource is in a valid from-state for the requested transition (includes ERR_TASK_ALREADY_DECIDED, ERR_APPROVAL_OUT_OF_ORDER, ERR_TAX_EVENT_ALREADY_REPORTED specifics)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "OCC: expected_loan_version == Loan.version on schedule rebuild; expected_plan_version == Plan.version on policy update", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /loans/{id}/schedule/rebuild, PUT /plans/{id}/policy" }
  - { priority: 8, category: state, check: "Plan posture gate: Plan.status == ACTIVE for loan request/disburse/refinance/rebuild, remittance post/reverse, hardship create/pay, approval decide, election restart", error_id: ERR_PLAN_NOT_ACTIVE, http_status: 409, applies_to: "plan-scoped mutating endpoints" }
  - { priority: 9, category: business_safety, check: "Hardship substantiation at final APPROVE: FULL_DOCUMENTATION plan requires >= 1 uploaded document; SELF_CERTIFY plan requires attestation == true", error_id: ERR_SUBSTANTIATION_INCOMPLETE, http_status: 422, applies_to: "POST /approval-tasks/{id}/decide" }
  - { priority: 10, category: business_temporal, check: "Suspension overlap: no ACTIVE SuspensionRecord (today < ends_on) for the participant — checked at hardship create, loan create, and re-checked at final hardship APPROVE; refinance lookback: disbursed_on <= today - plan.refinance_min_months_since_disbursement; election restart: all suspensions expired", error_id: ERR_SUSPENSION_OVERLAP, http_status: 422, applies_to: "POST /participants/{id}/hardship-requests, POST /participants/{id}/loans, POST /approval-tasks/{id}/decide", note: "also emits ERR_REFINANCE_LOOKBACK_VIOLATION on POST /loans/{id}/refinance and ERR_SUSPENSION_STILL_ACTIVE on POST /participants/{id}/contribution-election/restart" }
  - { priority: 11, category: business_constraint, check: "Evaluated in the order listed: reason_category in plan.allowed_hardship_reasons (else ERR_UNSAFE_HARBOR_REASON); employment_status == ACTIVE for new loan/hardship (else ERR_EMPLOYMENT_NOT_ACTIVE); logical clock >= loan_eligibility_locked_until or null (else ERR_LOAN_ELIGIBILITY_LOCKED); count of loans in {REQUESTED, APPROVED, DISBURSED} < plan.max_loans_outstanding (else ERR_MAX_LOANS_OUTSTANDING); principal_amount_cents >= plan.min_loan_amount_cents (else ERR_LOAN_BELOW_MINIMUM); term_months <= plan.max_term_months; plan.allows_refinance for refinance (else ERR_REFINANCE_NOT_ALLOWED)", error_id: ERR_UNSAFE_HARBOR_REASON, http_status: 422, applies_to: "POST /participants/{id}/loans, POST /participants/{id}/hardship-requests, POST /loans/{id}/refinance", note: "row emits the specific error per failed check: ERR_UNSAFE_HARBOR_REASON | ERR_EMPLOYMENT_NOT_ACTIVE | ERR_LOAN_ELIGIBILITY_LOCKED | ERR_MAX_LOANS_OUTSTANDING | ERR_LOAN_BELOW_MINIMUM | ERR_REFINANCE_NOT_ALLOWED" }
  - { priority: 12, category: business_fiscal, check: "principal_amount_cents <= calculations.loan_maximum_amount (else ERR_LOAN_LIMIT_EXCEEDED); refinance new principal <= loan_maximum_amount; hardship amount_cents <= vested_balance_cents at create (else ERR_INSUFFICIENT_VESTED_BALANCE); at final hardship APPROVE under FULL_DOCUMENTATION: sum of uploaded document amount_cents >= amount_cents (else ERR_HARDSHIP_AMOUNT_EXCEEDS_NEED); explicit remittance allocations sum == amount_cents (else ERR_REMITTANCE_AMOUNT_MISMATCH); hardship pay: gross_withdrawal_cents <= vested_balance_cents", error_id: ERR_LOAN_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /participants/{id}/loans, POST /loans/{id}/refinance, POST /participants/{id}/hardship-requests, POST /approval-tasks/{id}/decide, POST /participants/{id}/remittances, POST /hardship-requests/{id}/pay", note: "row emits the specific error per failed check: ERR_LOAN_LIMIT_EXCEEDED | ERR_INSUFFICIENT_VESTED_BALANCE | ERR_HARDSHIP_AMOUNT_EXCEEDS_NEED | ERR_REMITTANCE_AMOUNT_MISMATCH" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Plans ----
  - { method: POST, path: "/plans", description: "Create a retirement plan with loan/hardship policy", roles: [RecordkeeperAdmin], code: 201, input: [name, "max_loans_outstanding?", "min_loan_amount_cents?", "max_loan_amount_cents?", "max_term_months?", "interest_rate_bps?", "day_count_convention?", "allows_refinance?", "refinance_min_months_since_disbursement?", "hardship_suspension_months?", "substantiation_standard?", "withholding_rate_bps?", "allowed_hardship_reasons?", "loan_approval_chain?", "hardship_approval_chain?"], output: Plan, side_effects: [appends AuditEvent PLAN_CREATED] }
  - { method: GET, path: "/plans/{id}", description: "Read a plan", roles: [RecordkeeperAdmin, PlanSponsor, Auditor], code: 200, input: [], output: Plan, side_effects: [] }
  - { method: PUT, path: "/plans/{id}/policy", description: "Update plan policy (OCC). Supersedes the prior policy revision; existing loans keep their snapshotted terms.", roles: [RecordkeeperAdmin], code: 200, input: [expected_plan_version, "max_loans_outstanding?", "min_loan_amount_cents?", "max_loan_amount_cents?", "max_term_months?", "interest_rate_bps?", "day_count_convention?", "allows_refinance?", "refinance_min_months_since_disbursement?", "hardship_suspension_months?", "substantiation_standard?", "withholding_rate_bps?", "allowed_hardship_reasons?", "loan_approval_chain?", "hardship_approval_chain?"], output: Plan, side_effects: [increments Plan.version by 1, appends AuditEvent PLAN_POLICY_UPDATED] }
  - { method: POST, path: "/plans/{id}/freeze", description: "Freeze plan (posture gate)", roles: [PlanSponsor, RecordkeeperAdmin], code: 200, input: [], output: Plan, side_effects: [increments Plan.version by 1] }
  - { method: POST, path: "/plans/{id}/unfreeze", description: "Unfreeze plan", roles: [PlanSponsor, RecordkeeperAdmin], code: 200, input: [], output: Plan, side_effects: [increments Plan.version by 1] }
  - { method: GET, path: "/plans/{id}/participants", description: "List participants of a plan (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor], code: 200, input: ["limit?", "offset?"], output: "Participant[]", side_effects: [] }
  - { method: GET, path: "/plans/{id}/loans", description: "List loans booked under a plan (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor], code: 200, input: ["limit?", "offset?"], output: "Loan[]", side_effects: [] }
  - { method: GET, path: "/plans/{id}/hardship-requests", description: "List hardship requests under a plan (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor], code: 200, input: ["limit?", "offset?"], output: "HardshipRequest[]", side_effects: [] }
  - { method: GET, path: "/plans/{id}/approval-tasks", description: "List approval tasks under a plan (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor], code: 200, input: ["limit?", "offset?"], output: "ApprovalTask[]", side_effects: [] }
  - { method: GET, path: "/plans/{id}/audit-events", description: "List the plan's append-only audit trail, created_at ASC (paginated)", roles: [RecordkeeperAdmin, Auditor], code: 200, input: ["limit?", "offset?"], output: "AuditEvent[]", side_effects: [] }

  # ---- Participants ----
  - { method: POST, path: "/plans/{id}/participants", description: "Enroll a participant", roles: [RecordkeeperAdmin], code: 201, input: [full_name, vested_balance_cents, "external_ref?"], output: Participant, side_effects: [appends AuditEvent PARTICIPANT_ENROLLED] }
  - { method: GET, path: "/participants/{id}", description: "Read a participant (Participant role may read only itself)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: [], output: Participant, side_effects: [] }
  - { method: PATCH, path: "/participants/{id}", description: "Custodian sync / termination. employment_status ACTIVE->TERMINATED triggers the offset cascade.", roles: [RecordkeeperAdmin], code: 200, input: ["vested_balance_cents?", "employment_status?", "terminated_on?"], output: Participant, side_effects: [on termination: loan OFFSET cascade per Participant state machine, increments Participant.version by 1] }
  - { method: PUT, path: "/participants/{id}/contribution-election", description: "Create the participant's deferral election, or replace deferral_pct while ACTIVE", roles: [Participant], code: 200, input: [deferral_pct], output: ContributionElection, side_effects: [sets Participant.contribution_status = ACTIVE, appends AuditEvent ELECTION_SET] }
  - { method: GET, path: "/participants/{id}/contribution-election", description: "Read the participant's election (array of 0 or 1)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: [], output: "ContributionElection[]", side_effects: [] }
  - { method: POST, path: "/participants/{id}/contribution-election/restart", description: "Restart deferrals after suspension expiry", roles: [Participant], code: 200, input: [], output: ContributionElection, side_effects: [ContributionElection SUSPENDED -> ACTIVE, Participant.contribution_status = ACTIVE] }
  - { method: GET, path: "/participants/{id}/loan-eligibility", description: "Computed read of loan eligibility", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: [], output: { eligible: boolean, max_loan_amount_cents: integer, outstanding_loan_count: integer, loan_eligibility_locked_until: string }, side_effects: [runs calculations.loan_maximum_amount] }

  # ---- Loans ----
  - { method: POST, path: "/participants/{id}/loans", description: "Request a loan; snapshots plan terms; creates one ApprovalTask per entry of plan.loan_approval_chain", roles: [Participant], code: 201, input: [principal_amount_cents, term_months], output: Loan, side_effects: [runs calculations.loan_maximum_amount for validation, creates ApprovalTasks (step_order ASC), appends AuditEvent LOAN_REQUESTED] }
  - { method: GET, path: "/participants/{id}/loans", description: "List a participant's loans (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "Loan[]", side_effects: [] }
  - { method: GET, path: "/loans/{id}", description: "Read a loan", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: [], output: Loan, side_effects: [] }
  - { method: POST, path: "/loans/{id}/withdraw", description: "Participant withdraws a REQUESTED loan", roles: [Participant], code: 200, input: [], output: Loan, side_effects: [cancels PENDING ApprovalTasks, increments Loan.version by 1] }
  - { method: POST, path: "/loans/{id}/disburse", description: "Disburse an APPROVED loan; generates the amortization schedule", roles: [RecordkeeperAdmin], code: 200, input: [], output: Loan, side_effects: [runs calculations.amortization_schedule, creates LoanInstallment rows, delinquency_status = CURRENT, increments Loan.version by 1, appends AuditEvent LOAN_DISBURSED] }
  - { method: POST, path: "/loans/{id}/refinance", description: "Refinance a DISBURSED loan into a new loan (atomically DISBURSED); old loan becomes REFINANCED", roles: [RecordkeeperAdmin], code: 201, input: [cash_out_cents], output: Loan, side_effects: [runs calculations.refinance_terms and calculations.loan_maximum_amount, old loan REFINANCED, new loan schedule generated via calculations.amortization_schedule, appends AuditEvent LOAN_REFINANCED] }
  - { method: POST, path: "/loans/{id}/schedule/rebuild", description: "Re-amortize outstanding principal over a new remaining term (OCC on Loan.version); supersedes PENDING installments. New rows continue installment_number from the prior maximum and their due dates continue the monthly cadence from the last superseded row's due_date", roles: [RecordkeeperAdmin], code: 200, input: [expected_loan_version, term_months], output: Loan, side_effects: [PENDING installments -> REBUILT, new PENDING installments generated via calculations.amortization_schedule, scheduled_payment_cents recomputed, increments Loan.version by 1] }
  - { method: GET, path: "/loans/{id}/installments", description: "List the loan's amortization schedule rows, installment_number ASC (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, PayrollProvider, Participant], code: 200, input: ["limit?", "offset?"], output: "LoanInstallment[]", side_effects: [] }
  - { method: GET, path: "/loans/{id}/refinances", description: "List loans whose refinances_loan_id points at this loan (array of 0 or 1)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "Loan[]", side_effects: [] }
  - { method: GET, path: "/loans/{id}/approval-tasks", description: "List approval tasks for a loan subject, step_order ASC", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "ApprovalTask[]", side_effects: [] }

  # ---- Payroll remittances ----
  - { method: POST, path: "/participants/{id}/remittances", description: "Post a payroll deduction remittance; auto-allocates per waterfall when allocations omitted", roles: [PayrollProvider, RecordkeeperAdmin], code: 201, input: [amount_cents, pay_date, "allocations?"], output: PayrollRemittance, side_effects: [runs calculations.remittance_waterfall_allocation, updates installments/loans, cure and REPAID evaluation per Loan machine, appends AuditEvent REMITTANCE_POSTED] }
  - { method: GET, path: "/participants/{id}/remittances", description: "List a participant's remittances (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, PayrollProvider, Participant], code: 200, input: ["limit?", "offset?"], output: "PayrollRemittance[]", side_effects: [] }
  - { method: POST, path: "/remittances/{id}/reverse", description: "Reverse a POSTED remittance; restores loan/installment state exactly", roles: [RecordkeeperAdmin], code: 200, input: [], output: PayrollRemittance, side_effects: [undoes applied_allocations, re-evaluates delinquency and REPAID->DISBURSED revert, appends AuditEvent REMITTANCE_REVERSED] }

  # ---- Hardship ----
  - { method: POST, path: "/participants/{id}/hardship-requests", description: "Create a hardship withdrawal request; computes gross-up fields; creates ApprovalTasks per plan.hardship_approval_chain", roles: [Participant], code: 201, input: [reason_category, amount_cents, "amount_semantics?", "attestation?"], output: HardshipRequest, side_effects: [runs calculations.hardship_gross_up, creates ApprovalTasks, appends AuditEvent HARDSHIP_REQUESTED] }
  - { method: GET, path: "/participants/{id}/hardship-requests", description: "List a participant's hardship requests (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "HardshipRequest[]", side_effects: [] }
  - { method: GET, path: "/hardship-requests/{id}", description: "Read a hardship request", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: [], output: HardshipRequest, side_effects: [] }
  - { method: POST, path: "/hardship-requests/{id}/documents", description: "Upload substantiation evidence; while PENDING_DOCUMENTS this returns the request to UNDER_REVIEW", roles: [Participant], code: 201, input: [document_type, amount_cents, "description?"], output: HardshipDocument, side_effects: [PENDING_DOCUMENTS -> UNDER_REVIEW and DOCS_REQUESTED task -> PENDING when applicable, appends AuditEvent HARDSHIP_DOCUMENT_UPLOADED] }
  - { method: GET, path: "/hardship-requests/{id}/documents", description: "List uploaded documents", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "HardshipDocument[]", side_effects: [] }
  - { method: POST, path: "/hardship-requests/{id}/withdraw", description: "Participant withdraws an open hardship request", roles: [Participant], code: 200, input: [], output: HardshipRequest, side_effects: [cancels PENDING ApprovalTasks, increments HardshipRequest.version by 1] }
  - { method: POST, path: "/hardship-requests/{id}/pay", description: "Pay an APPROVED hardship distribution; fires the suspension cascade", roles: [RecordkeeperAdmin], code: 200, input: [], output: HardshipRequest, side_effects: [creates SuspensionRecord, ContributionElection SUSPENDED cascade, creates TaxEvent HARDSHIP_DISTRIBUTION, vested_balance_cents debited, document retention stamps, appends AuditEvent HARDSHIP_PAID] }
  - { method: GET, path: "/hardship-requests/{id}/approval-tasks", description: "List approval tasks for a hardship subject, step_order ASC", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "ApprovalTask[]", side_effects: [] }
  - { method: GET, path: "/hardship-requests/{id}/suspension-record", description: "Read the suspension record created by this hardship (array of 0 or 1)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "SuspensionRecord[]", side_effects: [] }

  # ---- Approval tasks ----
  - { method: GET, path: "/approval-tasks/{id}", description: "Read an approval task", roles: [RecordkeeperAdmin, PlanSponsor, Auditor], code: 200, input: [], output: ApprovalTask, side_effects: [] }
  - { method: POST, path: "/approval-tasks/{id}/decide", description: "Decide an approval step: APPROVE | REJECT | REQUEST_DOCS (REQUEST_DOCS valid only for HARDSHIP subjects)", roles: [PlanSponsor, RecordkeeperAdmin], code: 200, input: [decision], output: ApprovalTask, side_effects: [subject auto-transitions per ApprovalTask state machine, appends AuditEvent APPROVAL_DECIDED] }

  # ---- Tax events ----
  - { method: GET, path: "/participants/{id}/tax-events", description: "List a participant's taxable events (paginated)", roles: [RecordkeeperAdmin, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "TaxEvent[]", side_effects: [] }
  - { method: GET, path: "/tax-events/{id}", description: "Read a tax event", roles: [RecordkeeperAdmin, Auditor, Participant], code: 200, input: [], output: TaxEvent, side_effects: [] }
  - { method: POST, path: "/tax-events/{id}/mark-reported", description: "Mark a PENDING tax event as reported on Form 1099-R", roles: [RecordkeeperAdmin], code: 200, input: [], output: TaxEvent, side_effects: [increments TaxEvent.version by 1] }

  # ---- Suspension records ----
  - { method: GET, path: "/participants/{id}/suspension-records", description: "List a participant's suspension records (paginated)", roles: [RecordkeeperAdmin, PlanSponsor, Auditor, Participant], code: 200, input: ["limit?", "offset?"], output: "SuspensionRecord[]", side_effects: [] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-05-01T00:00:00Z; before any call the logical clock reads that default and never falls back to wall-clock time. Advancing the clock evaluates: installment MISSED marking and delinquency entry, cure-deadline expiry (DEEMED cascade), and suspension EXPIRED transitions.", roles: [RecordkeeperAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [clock-driven transitions per Loan, LoanInstallment, SuspensionRecord state machines] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint, or Participant role acting on a resource it does not own" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID deciding two steps of one subject, or the requesting participant deciding its own subject's task" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, unknown enum member, REQUEST_DOCS on a LOAN subject" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Plan id in path does not exist" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "Participant id in path does not exist (or does not belong to the plan in the path)" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "Loan id in path does not exist" }
  - { id: ERR_HARDSHIP_NOT_FOUND, http: 404, condition: "Hardship request id in path does not exist" }
  - { id: ERR_REMITTANCE_NOT_FOUND, http: 404, condition: "Remittance id in path does not exist" }
  - { id: ERR_APPROVAL_TASK_NOT_FOUND, http: 404, condition: "Approval task id in path does not exist" }
  - { id: ERR_TAX_EVENT_NOT_FOUND, http: 404, condition: "Tax event id in path does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition (e.g. withdraw a REPAID loan, reverse a REVERSED remittance, pay a non-APPROVED hardship, explicit remittance allocation to a DEEMED or non-DISBURSED loan)" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Plan posture gate: plan is FROZEN or TERMINATED and the endpoint requires ACTIVE" }
  - { id: ERR_TASK_ALREADY_DECIDED, http: 409, condition: "Approval task already in APPROVED/REJECTED/CANCELLED" }
  - { id: ERR_APPROVAL_OUT_OF_ORDER, http: 409, condition: "Deciding step N while a lower step_order task on the same subject is still PENDING" }
  - { id: ERR_TAX_EVENT_ALREADY_REPORTED, http: 409, condition: "mark-reported on a TaxEvent already REPORTED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_loan_version != Loan.version or expected_plan_version != Plan.version" }
  - { id: ERR_SUSPENSION_OVERLAP, http: 422, condition: "Participant has an ACTIVE SuspensionRecord (today < ends_on) at loan create, hardship create, or final hardship approval" }
  - { id: ERR_SUSPENSION_STILL_ACTIVE, http: 422, condition: "Election restart while any SuspensionRecord is still ACTIVE" }
  - { id: ERR_REFINANCE_LOOKBACK_VIOLATION, http: 422, condition: "Refinance requested before plan.refinance_min_months_since_disbursement whole calendar months have elapsed since the old loan's disbursed_on" }
  - { id: ERR_REFINANCE_NOT_ALLOWED, http: 422, condition: "Plan.allows_refinance is false" }
  - { id: ERR_EMPLOYMENT_NOT_ACTIVE, http: 422, condition: "New loan or hardship request while employment_status == TERMINATED; also blocks election restart" }
  - { id: ERR_LOAN_ELIGIBILITY_LOCKED, http: 422, condition: "Logical clock < Participant.loan_eligibility_locked_until (set by a deemed or offset distribution)" }
  - { id: ERR_LOAN_BELOW_MINIMUM, http: 422, condition: "principal_amount_cents < plan.min_loan_amount_cents" }
  - { id: ERR_LOAN_LIMIT_EXCEEDED, http: 422, condition: "principal_amount_cents (or refinance new principal) exceeds calculations.loan_maximum_amount" }
  - { id: ERR_MAX_LOANS_OUTSTANDING, http: 422, condition: "Loan count in {REQUESTED, APPROVED, DISBURSED} would exceed plan.max_loans_outstanding" }
  - { id: ERR_UNSAFE_HARBOR_REASON, http: 422, condition: "reason_category is a valid enum member but not in plan.allowed_hardship_reasons" }
  - { id: ERR_SUBSTANTIATION_INCOMPLETE, http: 422, condition: "Final hardship APPROVE without required substantiation (no documents under FULL_DOCUMENTATION, or missing attestation under SELF_CERTIFY)" }
  - { id: ERR_HARDSHIP_AMOUNT_EXCEEDS_NEED, http: 422, condition: "FULL_DOCUMENTATION: sum of uploaded document amount_cents < hardship amount_cents at final APPROVE" }
  - { id: ERR_INSUFFICIENT_VESTED_BALANCE, http: 422, condition: "Hardship amount_cents > vested_balance_cents at create, or gross_withdrawal_cents > vested_balance_cents at pay" }
  - { id: ERR_REMITTANCE_AMOUNT_MISMATCH, http: 422, condition: "Explicit allocations sum != amount_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Participant
    description: "Plan participant (employee); acts only on its own resources — X-User-ID must equal the Participant id"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /participants/{id}/loans (self)"
      - "POST /loans/{id}/withdraw (own loan)"
      - "POST /participants/{id}/hardship-requests (self)"
      - "POST /hardship-requests/{id}/documents (own request)"
      - "POST /hardship-requests/{id}/withdraw (own request)"
      - "PUT /participants/{id}/contribution-election (self)"
      - "POST /participants/{id}/contribution-election/restart (self)"
    shared_operations:
      - "GET on own participant record, loans, installments, hardship requests, documents, tax events, suspension records, approval tasks, refinances"
  - name: PlanSponsor
    description: "Employer plan administrator; decides PLAN_SPONSOR approval steps and manages plan posture"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans/{id}/freeze and /unfreeze (shared with RecordkeeperAdmin)"
    shared_operations:
      - "POST /approval-tasks/{id}/decide when task.approver_role == PLAN_SPONSOR"
      - "GET on plans, participants, loans, installments, hardship requests, documents, approval tasks, suspension records, remittances, eligibility"
  - name: RecordkeeperAdmin
    description: "Recordkeeper operations administrator"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans, PUT /plans/{id}/policy"
      - "POST /plans/{id}/participants, PATCH /participants/{id}"
      - "POST /loans/{id}/disburse, /refinance, /schedule/rebuild"
      - "POST /remittances/{id}/reverse"
      - "POST /hardship-requests/{id}/pay"
      - "POST /tax-events/{id}/mark-reported"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /approval-tasks/{id}/decide when task.approver_role == RECORDKEEPER_ADMIN"
      - "POST /participants/{id}/remittances"
      - "POST /plans/{id}/freeze and /unfreeze"
      - "GET on all resources"
  - name: PayrollProvider
    description: "Employer payroll system integration; posts deduction remittances"
    identity: "opaque"
    exclusive_operations:
      - "POST /participants/{id}/remittances (shared with RecordkeeperAdmin)"
    shared_operations:
      - "GET /participants/{id}/remittances, GET /loans/{id}/installments"
  - name: Auditor
    description: "Read-only compliance auditor"
    identity: "opaque"
    exclusive_operations:
      - "GET /plans/{id}/audit-events (shared with RecordkeeperAdmin)"
    shared_operations:
      - "GET on all business resources; no mutating operations"
