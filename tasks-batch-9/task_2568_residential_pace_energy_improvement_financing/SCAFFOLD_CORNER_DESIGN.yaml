# §1.9 Scaffold Corner Design — Residential PACE Energy-Improvement Financing
# Breadth probe: every testable claim §1.1-§1.7 declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml
# (§1.8) does not already cover. Sections and claim_type values come from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: property_creation_returns_computed_equity_and_zero_exposure
        claim_type: creation
        grounds:
          - entities.Property.fields.equity_ratio_bps
          - entities.Property.fields.senior_lien_balance_cents
          - endpoints[POST /pace/properties]
        distinguishing_aspect: |
          A parcel created with no MortgageLien must report senior_lien_balance_cents == 0 (the empty-sum
          case, not null) and therefore equity_ratio_bps == 10000, plus both PACE exposure rollups at 0.
          An implementation that leaves computed rollups null on create, or that skips the empty-set
          branch of the sum, fails on the first assertion.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-12; no liens, products or applications exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
          assert:
            - "201 with response_type == 'object' and a meta block carrying api_request_id and api_request_timestamp"
            - "Property.${p1}.id is a bare UUID with no type prefix, version == 1, created_at and updated_at are ISO 8601 UTC with three fractional digits"
            - "Every input field is echoed: apn == '06073-118-204-011', county_code == '06073', owner_full_name == 'Ada Ruiz', owner_birth_date == '1971-04-09', owner_email == 'ada@example.com', occupancy_type == 'OWNER_OCCUPIED', assessed_value_cents == 40000000, annual_property_tax_cents == 420000"
            - "Computed on the empty-lien set: senior_lien_balance_cents == 0 and equity_ratio_bps == 10000 (not null)"
            - "Both exposure rollups start empty: recorded_pace_principal_cents == 0 and committed_pace_principal_cents == 0"

      - name: mortgage_lien_and_product_defaults_applied_when_optionals_omitted
        claim_type: defaults
        grounds:
          - entities.MortgageLien.fields.status
          - entities.MortgageLien.fields.consent_response
          - entities.EligibleProduct.fields.requires_permit
          - entities.Property.fields.preferred_language
        distinguishing_aspect: |
          Three different default kinds must all land: an enum default (MortgageLien.status ACTIVE,
          consent_response NOT_NOTIFIED, EligibleProduct.status ACTIVE), a boolean default
          (requires_permit true, in_bankruptcy false) and a numeric default
          (tax_delinquency_count_36m 0) — while the genuinely nullable fields (market_value_cents,
          appraisal_effective_on, notified_at) stay null rather than being zero-filled.
        test_recipe:
          setup:
            - "Clock 2026-08-12. The parcel is created with every optional field omitted, then a lien of 25000000 is filed against it with status omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "GET /pace/properties/${p1}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "Property defaults: preferred_language == 'EN', tax_delinquency_count_36m == 0, in_bankruptcy == false"
            - "Property nullables stay null: market_value_cents is null and appraisal_effective_on is null (not 0 and not '')"
            - "MortgageLien.${l1} defaults: status == 'ACTIVE', consent_response == 'NOT_NOTIFIED', consent_application_id is null, notified_at is null, consent_deadline_at is null, consent_responded_at is null"
            - "EligibleProduct.${prod_solar} defaults: requires_permit == true and status == 'ACTIVE'"
            - "The lien immediately feeds the parcel's derived fields: the re-read Property.${p1} has senior_lien_balance_cents == 25000000 and equity_ratio_bps == 3750"

      - name: contractor_retrieval_returns_stored_and_baseline_scores
        claim_type: retrieval
        grounds:
          - entities.Contractor.fields.workmanship_score
          - entities.Contractor.fields.enrollment_status
          - endpoints[GET /pace/contractors/{id}]
        distinguishing_aspect: |
          A freshly created contractor must read back with both workmanship variants at the 10000 bps
          baseline (not 100, not 0) and enrollment_status PENDING_REVIEW rather than ENROLLED — creation
          alone never enrolls. All four ledger rollups must be 0 rather than null.
        test_recipe:
          setup:
            - "Clock 2026-08-12; a single contractor is registered and never enrolled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /pace/contractors/${c1}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "200 with response_type == 'object' and the stored values echoed: legal_name == 'Ridgeline Retrofit LLC', license_number == 'CSLB-884120', license_expires_on == '2030-06-30', workmanship_warranty_years == 10, counties_served == ['06073']"
            - "enrollment_status == 'PENDING_REVIEW' and suspension_reason is null — POST /pace/contractors never enrolls"
            - "Both score variants start at the basis-point baseline: workmanship_score == 10000 and lifetime_workmanship_score == 10000"
            - "Ledger rollups are zero, not null: upheld_open_remedy_count == 0, gross_disbursed_cents == 0, clawed_back_total_cents == 0, net_disbursed_cents == 0"
            - "version == 1 and updated_at == created_at because no mutation has happened yet"

      - name: products_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /pace/products]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Pagination and filtering must interact: with three ACTIVE products, limit=2/offset=0 returns two
          rows with has_more true, limit=2/offset=2 returns one row with has_more false, and adding
          category=SOLAR_PV collapses total_count to 1 — proving total_count reflects the FILTERED set,
          not the whole table.
        test_recipe:
          setup:
            - "Clock 2026-08-12; exactly three EligibleProducts exist: SOLAR_PV_ROOF (SOLAR_PV, 25 y), HVAC_HEATPUMP (HVAC, 18 y), WINDOWS_LOWE (WINDOWS, 20 y)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "HVAC_HEATPUMP", category: "HVAC", useful_life_years: 18, max_annual_savings_cents: 120000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_hvac: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "WINDOWS_LOWE", category: "WINDOWS", useful_life_years: 20, max_annual_savings_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_win: $.data.id }
          trigger:
            - call: "GET /pace/products"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "GET /pace/products"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "GET /pace/products"
              payload: { category: "SOLAR_PV" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "First page: 200 with response_type == 'array', exactly 2 rows in data, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: exactly 1 row in data, total_count == 3, offset == 2, has_more == false"
            - "Filtered read: exactly 1 row (product_code == 'SOLAR_PV_ROOF'), total_count == 1 and has_more == false — total_count counts the filtered set"
            - "Every row carries the full entity shape including useful_life_years, max_annual_savings_cents, requires_permit and status == 'ACTIVE'"

      - name: assessment_lookup_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A well-formed but unknown UUID in the path must yield the entity-specific 404
          ERR_ASSESSMENT_NOT_FOUND from the priority-4 existence rung, not a generic 400
          ERR_VALIDATION and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database, clock 2026-08-12. No Assessment has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "GET /pace/assessments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CountyOfficer
              as_user_id: "u_county"
              captures: { err_nf: $.data.error_id }
          assert:
            - "404 with err_nf == 'ERR_ASSESSMENT_NOT_FOUND' and response_type == 'error'"
            - "The error body carries both error_id and a human-readable message field"
            - "GET /pace/assessments returns total_count == 0 — the failed lookup created nothing"

      - name: application_missing_required_contractor_id_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_VALIDATION]
          - validations[priority=3]
          - endpoints[POST /pace/applications]
        distinguishing_aspect: |
          contractor_id is a required input with no default, so omitting it must fail at the
          priority-3 request-schema rung with 400 ERR_VALIDATION — BEFORE the priority-5 FK rung and
          before any business rule such as the enrollment check could speak.
        test_recipe:
          setup:
            - "Clock 2026-08-12; a parcel and an ENROLLED contractor both exist, so the only defect in the request is the missing contractor_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { err_req: $.data.error_id }
            - call: "GET /pace/applications"
              payload: { property_id: "${p1}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "400 with err_req == 'ERR_VALIDATION' and response_type == 'error'"
            - "No Application row was created: the follow-up list returns total_count == 0 and has_more == false"
            - "Property.${p1}.committed_pace_principal_cents is still 0 and Contractor.${c1}.enrollment_status is still 'ENROLLED'"

      - name: product_category_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.EligibleProduct.fields.category
          - errors[ERR_VALIDATION]
          - validations[priority=3]
        distinguishing_aspect: |
          category is a closed enum (SOLAR_PV | HVAC | ROOF | WINDOWS | WATER_EFFICIENCY); a plausible
          but undeclared member (GEOTHERMAL) must be rejected at priority 3 with 400 ERR_VALIDATION
          rather than stored as free text, and a negative max_annual_savings_cents must fail the same rung.
        test_recipe:
          setup:
            - "Clock 2026-08-12; the product catalog is empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /pace/products"
              payload: { product_code: "GEO_LOOP", category: "GEOTHERMAL", useful_life_years: 30, max_annual_savings_cents: 400000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { err_enum: $.data.error_id }
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: -1 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { err_negative: $.data.error_id }
            - call: "GET /pace/products"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "Undeclared enum member: 400 with err_enum == 'ERR_VALIDATION'"
            - "Negative cents value on an otherwise valid product: 400 with err_negative == 'ERR_VALIDATION' (priority 3 also enforces non-negative cents/bps integers)"
            - "Neither request persisted anything: GET /pace/products returns total_count == 0"

      - name: measure_computed_pv_and_sir_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ProjectMeasure.fields.pv_savings_cents
          - entities.ProjectMeasure.fields.sir_bps
          - calculations.savings_to_investment_ratio
        distinguishing_aspect: |
          pv_savings_cents and sir_bps are computed, and §1.2 pins them to 0 at creation time — they are
          only populated by the submit/cure recomputation. So a client-supplied pv_savings_cents must be
          ignored twice over: the created row reads 0, and after submit it reads the formula value
          3830892 / 12770 bps rather than the client's number.
        test_recipe:
          setup:
            - "Clock 2026-08-12; Fixture A parcel (assessed 40000000, senior 25000000) with a DRAFT application whose requested_term_years is 20."
            - "One solar measure: installed_cost 3000000, estimated_annual_savings 220000, useful life 25 y. Annuity factor AF(3%, 25) = 17.4131476913, so pv = round_half_up(220000 * 17.4131476913) = 3830892 and sir = round_half_up(3830892 / 3000000 * 10000) = 12770 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
          trigger:
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 220000, expected_application_version: "${a1_v0}", pv_savings_cents: 99999999, sir_bps: 99999 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m1: $.data.id }
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "GET /pace/measures/${m1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
          assert:
            - "201 and the client-supplied computed values are ignored at creation: ProjectMeasure.${m1}.pv_savings_cents == 0 and sir_bps == 0, status == 'PROPOSED'"
            - "After submit the recomputation lands the formula values: pv_savings_cents == 3830892 and sir_bps == 12770 — neither 99999999 nor 99999 survives anywhere"
            - "Application.${a1}.requested_principal_cents == 3000000, min_measure_sir_bps == 12770, portfolio_sir_bps == 12770 and weighted_useful_life_years == 25"
            - "Application.${a1}.status == 'UNDER_REVIEW' and screening_cltv_bps == 7000 ((25000000 + 3000000) / 40000000)"

      - name: application_system_fields_and_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Application.fields.status
          - entities.Application.fields.requested_principal_cents
          - endpoints[POST /pace/applications]
        distinguishing_aspect: |
          id / version / status / requested_principal_cents are system- or state-machine-owned. A create
          request that tries to seed them must produce a server-minted UUID, version 1, status DRAFT and
          requested_principal_cents 0 — an implementation that trusts the body would report APPROVED with
          a non-zero principal and skip the whole workflow.
        test_recipe:
          setup:
            - "Clock 2026-08-12 with an ENROLLED contractor and a Fixture A parcel available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20, id: "11111111-1111-4111-8111-111111111111", version: 7, status: "APPROVED", requested_principal_cents: 9999999 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id }
          assert:
            - "201 and Application.${a1}.id is a freshly minted UUID that is NOT '11111111-1111-4111-8111-111111111111'"
            - "System fields are server-owned: version == 1, created_at == updated_at, both ISO 8601 UTC"
            - "State-machine and computed fields ignore the body: status == 'DRAFT' (not APPROVED), requested_principal_cents == 0 (not 9999999), cure_round_count == 0, consent_posture == 'NOT_STARTED', notified_lien_count == 0"
            - "oral_confirmation_required == false because Property.preferred_language == 'EN' and occupancy_type == 'OWNER_OCCUPIED'"

      - name: measure_with_unknown_product_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - endpoints[POST /pace/applications/{id}/measures]
        distinguishing_aspect: |
          The scaffold's entity topology is flat, so every body FK must be validated independently of the
          path FK: with a valid application in the path and a syntactically valid but unknown product_id
          in the body, the answer is 404 ERR_PRODUCT_NOT_FOUND from priority 5 — not ERR_MEASURE_NOT_FOUND
          and not the OCC or product-status rung below it.
        test_recipe:
          setup:
            - "Clock 2026-08-12; Fixture A parcel with a DRAFT application and NO product in the catalog matching the referenced id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
