        grounds: ["validations[priority=29]", "errors[ERR_UTILIZATION_FILING_REQUIRED]"]
        distinguishing_aspect: "The filing requirement is conditional on request_type: with no UtilizationFiling at all, a GROWTH request returns ERR_UTILIZATION_FILING_REQUIRED (422) while an INITIAL request from the same carrier into the same rate center is accepted."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED with home_state_code OH and has never filed a utilization report. COLUMBUS under NPA 614 has no blocks loaded."]
          setup_api_calls:
