              payload: { customer_id: "${c48_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c48_id}"
              captures: { o48_id: $.data.id }
          trigger:
            - call: "POST /orders/${o48_id}/lines"
              payload: { item_id: "00000000-0000-4000-8000-000000000000", quantity: 1 }
              as: Customer
              as_user_id: "${c48_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_order_lines_reverse_reachability
        claim_type: flat
