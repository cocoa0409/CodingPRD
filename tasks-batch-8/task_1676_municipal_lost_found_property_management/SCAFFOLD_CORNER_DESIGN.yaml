              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${c1}", proof_serial: true, proof_photo: false, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v}" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { cl: $.data.id, score: $.data.proof_score }
          assert:
            - "score == 30 (only W_SERIAL applies; BRIEF detail and absent id_verification contribute 0)"
      - name: tier_low_mid_boundary
        claim_type: constants_applied
        grounds: [calculations.item_value_tier]
        distinguishing_aspect: "LOW/MID boundary at 10000: 10000 -> MID (inclusive lower bound), 9999 -> LOW."
        test_recipe:
          setup: ["TRANSIT program with LOW and MID policies, location"]
