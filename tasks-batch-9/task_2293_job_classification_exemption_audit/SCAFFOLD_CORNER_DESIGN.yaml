        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pay_conversion_blocked_until_a_voluntary_correction_is_approved
          rationale: "That instance tests both the invalid and the valid side of the cross-entity precondition on a sibling entity's state."

      - name: corner_temporal_validation_of_a_future_window
        claim_type: temporal_validation
        grounds: ["validations[priority=15]", "errors[ERR_RECLASS_WINDOW_CONFLICT]"]
        excluded_because:
