          - endpoints[POST /certifications]
        distinguishing_aspect: "Issuing a fresh CURRENT RAMP_SAFETY endorsement at the agent's own station flips Agent.status SUSPENDED -> ACTIVE and certification_posture LAPSED -> CURRENT, closing the certification-driven cycle without any explicit agent endpoint."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; Agent E001's only RAMP_SAFETY endorsement was revoked, so the agent is SUSPENDED with certification_posture LAPSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
              captures: { c_old: $.data.id }
            - call: "POST /certifications/${c_old}/revoke"
              payload: { reason: "TRAINING_AUDIT_FAILURE" }
              as: SafetyOfficer
              as_user_id: "safety-01"
            - call: "GET /agents/${a_id}"
              payload: {}
              as: StationManager
              captures: { status_before: $.data.status, posture_before: $.data.certification_posture }
          trigger:
            - call: "POST /certifications"
              payload: { agent_id: "${a_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-03-01T00:00:00Z", expires_at: "2027-06-01T00:00:00Z" }
              as: StationManager
              captures: { c_new: $.data.id, new_state: $.data.currency_state }
            - call: "GET /agents/${a_id}"
              payload: {}
              as: StationManager
              captures: { status_after: $.data.status, posture_after: $.data.certification_posture }
          assert:
            - "${status_before} == SUSPENDED"
            - "${posture_before} == LAPSED"
            - "${new_state} == CURRENT"
            - "${status_after} == ACTIVE"
            - "${posture_after} == CURRENT"
            - "Certification.${c_old}.status == REVOKED"
            - "Certification.${c_old}.currency_state == REVOKED"
            - "Certification.${c_old}.revoked_reason == TRAINING_AUDIT_FAILURE"

