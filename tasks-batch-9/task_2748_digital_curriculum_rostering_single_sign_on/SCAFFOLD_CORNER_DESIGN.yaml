          - validations[priority=26]
        distinguishing_aspect: "Deprovisioning is never post-dated and never repeated: a tomorrow-dated effective_date is refused with ERR_DEPROVISION_NOT_DUE (409), the same call dated today succeeds and freezes the identity axis (leaving the seat axis alone), and every later identity write — including the password set that is deliberately exempt from the seat rule — answers ERR_ACCOUNT_DEPROVISIONED (409)."
