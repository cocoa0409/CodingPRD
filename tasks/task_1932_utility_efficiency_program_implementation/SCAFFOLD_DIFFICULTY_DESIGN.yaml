  # ===========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: contractor_calendar_half_open_overlap
        grounds:
          - calculations.contractor_calendar_overlap
          - validations[priority=11]
          - errors[ERR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          WorkOrder scheduling uses half-open intervals [scheduled_on, scheduled_on+duration).
          Adjacent intervals (one ends exactly when another starts on the same date) do NOT
          conflict. Resource = Contractor calendar. Endpoint: POST /efficiency/work_orders/{id}/schedule.
        test_recipe:
          setup:
            - "Two work orders for the same contractor on 2026-08-05; WO1 scheduled 09:00 +4h"
            - "WO2 tries to schedule 13:00 +2h (adjacent — starts exactly when WO1 ends)"
            - "WO3 tries to schedule 12:00 +1h (overlaps WO1's [09:00,13:00))"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-OV", name: "OV", sector: "RESIDENTIAL", budget_cents: 500000, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "OV", license_number: "L-OV", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "OV", email: "ov@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-OV" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 100, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead1_id: $.data.id, lead1_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead1_id}/distribute"
              payload: { expected_lead_version: "${lead1_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead1_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead1_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 100, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj1_id: $.data.id }
            - call: "POST /efficiency/projects/${proj1_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj1_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-05T09:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo1_id: $.data.id }
          trigger:
            - call: "POST /efficiency/projects/${proj1_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-05T13:00:00Z", duration_hours: 2 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo2_id: $.data.id }
          assert:
            - "WO1 occupies [09:00, 13:00) half-open; WO2 starts at 13:00 — adjacent, NOT overlapping"
            - "WO2 creation succeeds (no ERR_SCHEDULE_CONFLICT)"

      - name: certification_expiry_window
        grounds:
          - state_machines.Certification.ACTIVE_to_EXPIRED
          - entities.Certification.fields.expires_on
        distinguishing_aspect: |
          Certification expiry uses a closed-boundary instant: when current clock equals
          expires_on exactly, certification is EXPIRED. Different interval semantics from
          half-open WorkOrder scheduling — this is a point-instant comparison, not an
          interval overlap. Resource = Certification (time-bounded credential).
          Endpoint: POST /efficiency/_clock/set_current_utc.
        test_recipe:
          setup:
            - "One ACTIVE certification with expires_on = 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "EXP", license_number: "L-EXP", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-08-10T00:00:00Z" }
              as: ProgramManager
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramManager
            - call: "GET /efficiency/certifications/${cert_id}"
              payload: {}
              as: ProgramManager
              captures: { cert_status: $.data.status }
          assert:
            - "cert_status == EXPIRED (closed boundary: at expires_on exactly, certification is expired)"

  # ===========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_commit_cancel_conserves_committed
        grounds:
          - entities.Program.fields.committed_cents
          - state_machines.Project.PROPOSED_to_APPROVED
          - state_machines.Project.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = Program.committed_cents. Forward action (approve) adds
          incentive_amount_cents to committed_cents; compensating action (cancel from
          APPROVED) subtracts the same amount. Invariant: after approve+cancel,
          Program.committed_cents returns to its pre-approve value.
        test_recipe:
          setup:
            - "Program ACTIVE, contractor APPROVED with cert, lead accepted, project PROPOSED"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-INV1", name: "INV1", sector: "RESIDENTIAL", budget_cents: 100000, avoided_kwh_target: 100, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version, committed0: $.data.committed_cents }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "I1", license_number: "L-I1", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "I1", email: "i1@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-I1" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 100, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead_id}/distribute"
              payload: { expected_lead_version: "${lead_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 100, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj_id}/cancel"
              payload: {}
              as: ProgramManager
            - call: "GET /efficiency/programs/${prog_id}"
              payload: {}
              as: ProgramManager
              captures: { committed_final: $.data.committed_cents }
          assert:
            - "committed0 == 0"
            - "After approve: committed_cents == 2500"
            - "After cancel: committed_final == committed0 == 0 (invariant restored)"

      - name: payment_disburse_reconcile_conserves_paid_plus_delta
        grounds:
          - entities.IncentivePayment.fields.reconciliation_delta_cents
          - entities.Program.fields.paid_cents
          - state_machines.IncentivePayment.AUTHORIZED_to_PAID
          - state_machines.IncentivePayment.PAID_to_RECONCILED
        distinguishing_aspect: |
          Conserved quantity = total customer-visible outlay. Disburse moves payment
          AUTHORIZED -> PAID and credits Program.paid_cents by amount_cents. Reconcile
          moves PAID -> RECONCILED and applies reconciliation_delta_cents. Invariant:
          Program.paid_cents after both steps == amount_provisional_cents + delta ==
          amount_cents. Different conserved quantity (payment ledger vs project budget).
        test_recipe:
          setup:
