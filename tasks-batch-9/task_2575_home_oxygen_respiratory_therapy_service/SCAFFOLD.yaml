scenario: |
  Generate task harder than expert level!

  2575. Home Oxygen & Respiratory Therapy Service (Lincare): qualifying testing and certificate of
  medical necessity documentation, equipment selection (concentrator, portable, liquid) by mobility
  and liter flow, competitive-bidding contract pricing and capped-rental month tracking, delivery,
  setup education and safety assessment in the home, tank exchange and portable refill route
  scheduling, equipment maintenance, recall and malfunction response, recertification and continued-
  need documentation, patient transfer, travel supply and discharge coordination

domain_name: home-oxygen-respiratory-therapy
api_prefix: "/home-oxygen"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Placement is a many-to-many junction between RentalContract and EquipmentUnit;
  # EquipmentUnit.replaces_unit_id is self-referential; RecallNotice reaches EquipmentUnit by
  # model_code (a non-id association) and reaches RentalContract only transitively through
  # Placement; RouteStop bridges the DeliveryRoute aggregate and the RentalContract aggregate.

  state_machine_shape: parallel
  # RentalContract carries two independent state dimensions on one row
  # (billing_status x service_status). CertificateOfMedicalNecessity is cyclic
  # (SUBMITTED -> RETURNED_FOR_CORRECTION -> DRAFT -> SUBMITTED). DeliveryRoute is cyclic
  # (PLANNING -> LOCKED -> PLANNING). Patient is cyclic (ACTIVE -> TRANSFER_PENDING -> ACTIVE).
  # DeliveryRoute also auto-completes by bubble-up from its RouteStop children (compound).

  relationship_patterns:
    - one_to_many          # Branch -> Patient, DeliveryRoute -> RouteStop
    - many_to_many         # RentalContract <-> EquipmentUnit via Placement
    - self_referential     # EquipmentUnit.replaces_unit_id -> EquipmentUnit.id
    - cross_aggregate      # RouteStop.contract_id crosses the route aggregate into the contract aggregate

  role_model: segregation_of_duties
  # The ComplianceAuditor who approves a CMN must not be the operator who submitted it nor the
  # physician who signed it (X-User-ID compared against CMN.submitted_by_user_id and
  # CMN.signed_by_user_id). Beyond that the seven roles are peer roles over disjoint resources.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable branch/service-centre name."
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code the branch operates in."
        constraints: "exactly 2 uppercase letters"
      - name: competitive_bid_area
        type: boolean
        source: input
        description: "True when the branch sits inside a Medicare competitive-bidding area."
        default: false
      - name: liquid_oxygen_certified
        type: boolean
        source: input
        description: "True when the branch is licensed to fill and deliver liquid oxygen."
        default: false
      - name: refill_capacity_per_day
        type: integer
        source: input
        description: "Maximum number of PORTABLE_REFILL stops the branch can service on one route."
        default: 4
        constraints: ">= 0, <= 40"
      - name: tank_exchange_buffer_minutes
        type: integer
        source: input
        description: "Trailing turnaround buffer appended to every RouteStop window on this branch's routes."
        default: 30
        constraints: "0..120"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number; globally unique across Patient rows."
        constraints: "1..40 chars, unique"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
        constraints: "1..120 chars"
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch that serves this patient today."
      - name: payer_type
        type: enum
        source: input
        description: "Payer class driving documentation strictness."
        constraints: "one of MEDICARE_COMPETITIVE_BID, MEDICARE_NON_BID, MEDICAID, COMMERCIAL"
      - name: mobility_profile
        type: enum
        source: input
        description: "Documented ambulation status; gates portable equipment selection."
        constraints: "one of HOMEBOUND, LIMITED_AMBULATORY, ACTIVE_AMBULATORY"
      - name: altitude_feet
        type: integer
        source: input
        description: "Elevation of the patient's residence, in feet; baseline for travel altitude adjustment."
        default: 0
        constraints: "0..15000"
      - name: status
        type: enum
        source: system
        description: "Patient lifecycle state; see state_machines[entity=Patient]."
        default: ACTIVE
        constraints: "one of ACTIVE, TRANSFER_PENDING, DISCHARGED"
      - name: transfer_to_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; receiving branch while status == TRANSFER_PENDING, else null."
      - name: transfer_effective_date
        type: string
        source: system
        description: "ISO date (YYYY-MM-DD) the requested transfer takes effect; null when no transfer pending."
      - name: current_cmn_status
        type: enum
        source: computed
        description: "Mirror of the status of this patient's most-recently-created CertificateOfMedicalNecessity (ranked created_at DESC); NONE when the patient has no CMN."
        default: NONE
        constraints: "one of NONE, DRAFT, SUBMITTED, PHYSICIAN_SIGNED, RETURNED_FOR_CORRECTION, ACTIVE, EXPIRED, VOIDED, SUPERSEDED"
      - name: oxygen_safety_risk_score
        type: number
        source: computed
        description: "Output of calculations.oxygen_safety_risk_score; 2 decimals, 0.00..100.00."
        default: 0.00
      - name: risk_variant_applied
        type: enum
        source: computed
        description: "Which calculations.oxygen_safety_risk_score variant produced the current oxygen_safety_risk_score."
        default: NONE
        constraints: "one of NONE, INITIAL_ASSESSMENT, ONGOING_SURVEILLANCE"
      - name: compliance_hold
        type: boolean
        source: computed
        description: "True exactly when oxygen_safety_risk_score >= 70.00; blocks new equipment assignment and new travel authorizations."
        default: false

  - name: QualifyingTest
    parent: Patient
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the tested patient."
      - name: test_type
        type: enum
        source: input
        description: "Which qualifying study was performed."
        constraints: "one of RESTING_ROOM_AIR, EXERCISE, NOCTURNAL_OVERNIGHT_OXIMETRY, SLEEP_STUDY"
      - name: spo2_percent
        type: integer
        source: input
        description: "Lowest documented arterial saturation during the study; null when only pao2_mmhg was drawn."
        constraints: "null or 50..100"
      - name: pao2_mmhg
        type: integer
        source: input
        description: "Documented arterial oxygen partial pressure; null when only pulse oximetry was performed."
        constraints: "null or 20..120"
      - name: desat_minutes
        type: integer
        source: input
        description: "Cumulative minutes at or below 88% saturation; only consulted for test_type == NOCTURNAL_OVERNIGHT_OXIMETRY."
        default: 0
        constraints: "0..1440"
      - name: cor_pulmonale_or_edema
        type: boolean
        source: input
        description: "True when the chart documents cor pulmonale, dependent edema, or erythrocythemia (the Group II secondary requirement)."
        default: false
      - name: tested_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the study was performed; must be <= the logical clock."
      - name: ordering_physician_npi
        type: string
        source: input
        description: "Ordering physician National Provider Identifier."
        constraints: "exactly 10 digits"
      - name: qualifying_group
        type: enum
        source: computed
        description: "Output of calculations.qualifying_group_determination."
        constraints: "one of GROUP_I, GROUP_II, NON_QUALIFYING"
      - name: validity_days
        type: integer
        source: computed
        description: "Number of days this study remains current: 30 for RESTING_ROOM_AIR and EXERCISE, 90 for NOCTURNAL_OVERNIGHT_OXIMETRY and SLEEP_STUDY."
      - name: test_validity_expires_at
        type: datetime
        source: computed
        description: "tested_at + validity_days, ISO 8601 UTC with three fractional digits."

  - name: CertificateOfMedicalNecessity
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the certified patient."
      - name: qualifying_test_id
        type: string
        source: input
        description: "FK -> QualifyingTest.id; the study this certificate rests on."
      - name: form_type
        type: enum
        source: input
        description: "INITIAL for the first certificate, RECERTIFICATION for continued-need renewal, REVISED for a changed prescription."
        constraints: "one of INITIAL, RECERTIFICATION, REVISED"
      - name: prescribed_lpm
        type: number
        source: input
        description: "Prescribed continuous flow in litres per minute; drives equipment class selection and travel supply."
        constraints: "0.5..15.0, one decimal place"
      - name: hours_per_day
        type: integer
        source: input
        description: "Documented hours of use per day."
        constraints: "1..24"
      - name: portable_prescribed
        type: boolean
        source: input
        description: "True when the certificate documents medical need for a portable system."
        default: false
      - name: length_of_need_months
        type: integer
        source: input
        description: "Physician-declared length of need in months (99 means lifetime)."
        constraints: "1..99"
      - name: narrative_element_count
        type: integer
        source: input
        description: "How many of the three required narrative elements (diagnosis, prior therapy trial, expected benefit) the chart carries."
        default: 0
        constraints: "0..3"
      - name: status
        type: enum
        source: system
        description: "Certificate lifecycle state; see state_machines[entity=CertificateOfMedicalNecessity]."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, PHYSICIAN_SIGNED, RETURNED_FOR_CORRECTION, ACTIVE, EXPIRED, VOIDED, SUPERSEDED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IntakeCoordinator who submitted; null while DRAFT."
      - name: signed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Physician who signed; cleared when the certificate is returned for correction."
      - name: audited_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor who approved the certificate to ACTIVE."
      - name: physician_signature_date
        type: string
        source: computed
        description: "ISO date (YYYY-MM-DD) taken from the logical clock at signature; cleared on return-for-correction."
      - name: initial_date
        type: string
        source: computed
        description: "ISO date (YYYY-MM-DD) taken from the logical clock when the certificate first reached ACTIVE."
      - name: recert_due_date
        type: string
        source: computed
        description: "Output of calculations.recert_due_date; null until the certificate reaches ACTIVE."
      - name: revision_round
        type: integer
        source: system
        description: "How many times this certificate has been returned for correction."
        default: 0
        constraints: "0..3"
      - name: correction_notes
        type: string
        source: system
        description: "Free text supplied by the reviewer on the most recent return-for-correction."
      - name: void_reason
        type: string
        source: system
        description: "Free text supplied by the ComplianceAuditor when voiding."
      - name: documentation_score
        type: number
        source: computed
        description: "Output of calculations.cmn_documentation_score; 2 decimals, 0.00..100.00."
        default: 0.00

  - name: RentalContract
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the contract holder."
      - name: cmn_id
        type: string
        source: input
        description: "FK -> CertificateOfMedicalNecessity.id; the certificate authorising this rental."
      - name: pricing_basis
        type: enum
        source: input
        description: "Reimbursement basis; selects both the allowable adjustment factor and the capped-rental counting variant."
        constraints: "one of COMPETITIVE_BID_SINGLE_PAYMENT, FEE_SCHEDULE_ADJUSTED, CASH"
      - name: cap_month_limit
        type: integer
        source: input
        description: "Number of rental months the payer will reimburse before the cap is reached."
        default: 36
        constraints: "1..36"
      - name: billing_status
        type: enum
        source: system
        description: "Billing dimension of the contract; evolves independently of service_status."
        default: ACCRUING
        constraints: "one of ACCRUING, CAP_REACHED, SUSPENDED, CLOSED"
      - name: service_status
        type: enum
        source: system
        description: "Service dimension of the contract; evolves independently of billing_status."
        default: PENDING_SETUP
        constraints: "one of PENDING_SETUP, SETUP_FAILED, IN_SERVICE, PICKUP_SCHEDULED, RETURNED"
      - name: suspension_reason
        type: enum
        source: system
        description: "Why billing_status is SUSPENDED; reset to NONE when billing resumes."
        default: NONE
        constraints: "one of NONE, CMN_VOIDED, CMN_EXPIRED, RECALL, SETUP_FAILED, TRANSFER"
      - name: first_service_month
        type: string
        source: computed
        description: "YYYY-MM of the logical clock at the instant service_status first became IN_SERVICE; null before that."
      - name: monthly_allowable_cents
        type: integer
        source: computed
        description: "Output of calculations.monthly_allowable_cents; recomputed whenever the set of Placement rows with status == PLACED for this contract changes."
        default: 0
      - name: posted_months
        type: array
        source: computed
        description: "Append-only-then-reversible ledger of posted rental months; each element is an object { service_month: 'YYYY-MM', amount_cents: integer, days_in_service: integer, posted_at: datetime }."
        default: []
      - name: posted_month_count
        type: integer
        source: computed
        description: "Number of elements in posted_months."
        default: 0
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Sum of amount_cents across posted_months; the conserved quantity of the post/reverse compensating pair."
        default: 0
      - name: last_posted_service_month
        type: string
        source: computed
        description: "Largest service_month present in posted_months (lexicographic on YYYY-MM); null when posted_months is empty."
      - name: malfunction_count
        type: integer
        source: computed
        description: "Number of malfunction reports filed against any Placement of this contract."
        default: 0
      - name: cumulative_oxygen_gap_minutes
        type: integer
        source: computed
        description: "Sum of oxygen_gap_minutes across all malfunction reports filed against any Placement of this contract."
        default: 0

  - name: EquipmentUnit
    parent: Branch
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch that owns this physical unit."
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial; globally unique across EquipmentUnit rows."
        constraints: "1..40 chars, unique"
      - name: model_code
        type: string
        source: input
        description: "Manufacturer model code; RecallNotice rows target units by this value."
        constraints: "1..40 chars"
      - name: equipment_class
        type: enum
        source: input
        description: "Physical modality of the unit."
        constraints: "one of STATIONARY_CONCENTRATOR, PORTABLE_CONCENTRATOR, LIQUID_RESERVOIR, LIQUID_PORTABLE, COMPRESSED_CYLINDER"
      - name: max_continuous_lpm
        type: number
        source: input
        description: "Rated maximum continuous litres per minute; must be >= the prescription to be eligible."
        constraints: "0.5..15.0, one decimal place"
      - name: max_pulse_setting
        type: integer
        source: input
        description: "Rated maximum pulse-dose setting; 0 for continuous-only units."
        default: 0
        constraints: "0..9"
      - name: pm_interval_days
        type: integer
        source: input
        description: "Preventive-maintenance interval in days; used to restamp next_pm_due_date after service."
        default: 365
        constraints: "30..1095"
      - name: next_pm_due_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) the next preventive maintenance falls due."
      - name: status
        type: enum
        source: system
        description: "Unit lifecycle state; see state_machines[entity=EquipmentUnit]."
        default: IN_STOCK
        constraints: "one of IN_STOCK, RESERVED, DEPLOYED, IN_QUARANTINE, RETIRED"
      - name: replaces_unit_id
        type: string
        source: input
        description: "FK -> EquipmentUnit.id; the retired or quarantined unit this one was procured to replace; null for original stock."
      - name: recall_remediated_at
        type: datetime
        source: system
        description: "Logical-clock instant this unit was serviced while a RecallNotice covering its model_code was OPEN or IN_REMEDIATION; null when never remediated."
      - name: quarantine_reason
        type: enum
        source: system
        description: "Why the unit is (or was last) in quarantine."
        default: NONE
        constraints: "one of NONE, RECALL, MALFUNCTION, SAFETY, TRANSFER"

  - name: Placement
    parent: RentalContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the contract this unit is placed against."
      - name: equipment_unit_id
        type: string
        source: system
        description: "FK -> EquipmentUnit.id; chosen by calculations.equipment_selection, never supplied by the client."
      - name: role
        type: enum
        source: input
        description: "What job the unit does in the home."
        constraints: "one of PRIMARY_STATIONARY, PORTABLE, BACKUP"
      - name: status
        type: enum
        source: system
        description: "Placement lifecycle state; see state_machines[entity=Placement]."
        default: RESERVED
        constraints: "one of RESERVED, PLACED, REMOVED, RECALLED_OUT_OF_SERVICE"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant the placement became PLACED; null before setup completes."
      - name: removed_at
        type: datetime
        source: system
        description: "Logical-clock instant the placement left service; null while RESERVED or PLACED."
      - name: removal_reason
        type: enum
        source: system
        description: "Why the placement left service."
        default: NONE
        constraints: "one of NONE, RELEASED, SETUP_FAILED, RECALL, MALFUNCTION, PICKUP, TRANSFER"
      - name: malfunction_count
        type: integer
        source: computed
        description: "Number of malfunction reports filed against this placement."
        default: 0
      - name: last_symptom
        type: enum
        source: computed
        description: "Symptom of the most recent malfunction report against this placement."
        default: NONE
        constraints: "one of NONE, NO_FLOW, ALARM_CONTINUOUS, LOW_PURITY, POWER_FAILURE, LEAK"
      - name: last_severity_tier
        type: enum
        source: computed
        description: "Output of calculations.malfunction_severity_tier for the most recent report against this placement."
        default: NONE
        constraints: "one of NONE, TIER_1, TIER_2, TIER_3"

  - name: DeliveryRoute
    parent: Branch
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch whose driver runs this route."
      - name: service_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) the route is run."
      - name: driver_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the DeliveryDriver assigned to the route."
      - name: shift_start_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the driver's shift; every stop window must start at or after this instant."
      - name: shift_end_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the driver's shift; every stop window plus buffer must end at or before this instant."
      - name: status
        type: enum
        source: system
        description: "Route lifecycle state; see state_machines[entity=DeliveryRoute]."
        default: PLANNING
        constraints: "one of PLANNING, LOCKED, DISPATCHED, COMPLETED"
      - name: total_o2_liters_committed
        type: integer
        source: computed
        description: "Output of calculations.route_liters_committed; the conserved quantity of the stop-create/stop-cancel compensating pair."
        default: 0
      - name: refill_slots_used
        type: integer
        source: computed
        description: "Count of RouteStop rows on this route with stop_type == PORTABLE_REFILL and status IN {PLANNED, COMPLETED}."
        default: 0
      - name: planned_stop_count
        type: integer
        source: computed
        description: "Count of RouteStop rows on this route with status == PLANNED."
        default: 0

  - name: RouteStop
    parent: DeliveryRoute
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> DeliveryRoute.id; the route this stop belongs to."
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the contract being serviced at this stop."
      - name: stop_type
        type: enum
        source: input
        description: "What the driver or therapist does at this stop."
        constraints: "one of SETUP_DELIVERY, TANK_EXCHANGE, PORTABLE_REFILL, PICKUP, MAINTENANCE_SWAP"
      - name: window_start_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the promised arrival window."
      - name: window_end_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the promised arrival window; must be strictly after window_start_utc."
      - name: service_minutes
        type: integer
        source: input
        description: "Expected minutes on site."
        constraints: "5..240"
      - name: cylinders_requested
        type: integer
        source: input
        description: "Number of E-cylinders to be dropped at this stop; consulted only for SETUP_DELIVERY, TANK_EXCHANGE and MAINTENANCE_SWAP."
        default: 0
        constraints: "0..6"
      - name: sequence_index
        type: integer
        source: computed
        description: "1-based position of this stop within its route, assigned by ordering the route's non-CANCELLED stops by window_start_utc ASC then created_at ASC; recomputed on every stop create and cancel."
      - name: liters_committed
        type: integer
        source: computed
        description: "Output of calculations.route_liters_committed, per-stop component."
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle state; see state_machines[entity=RouteStop]."
        default: PLANNED
        constraints: "one of PLANNED, COMPLETED, MISSED, CANCELLED"
      - name: safety_result
        type: enum
        source: computed
        description: "FAIL exactly when smoking_in_home == true, PASS otherwise; only ever leaves NOT_ASSESSED on a SETUP_DELIVERY stop that has been completed."
        default: NOT_ASSESSED
        constraints: "one of NOT_ASSESSED, PASS, FAIL"
      - name: smoking_in_home
        type: boolean
        source: system
        description: "In-home safety assessment finding recorded at setup completion; null until then."
      - name: electrical_pass
        type: boolean
        source: system
        description: "In-home electrical inspection finding recorded at setup completion; null until then."
      - name: patient_teachback_score
        type: integer
        source: system
        description: "Education teach-back score (0..5) recorded at setup completion; null until then."
      - name: education_topics_covered
        type: array
        source: system
        description: "Array of education topic strings recorded at setup completion."
        default: []
      - name: safety_findings_count
        type: integer
        source: computed
        description: "Count of true predicates among { smoking_in_home == true, electrical_pass == false, patient_teachback_score < 3 }."
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the stop reached COMPLETED or MISSED."
      - name: completed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the RespiratoryTherapist or DeliveryDriver who closed the stop."

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "EquipmentUnit.model_code this notice targets."
        constraints: "1..40 chars"
      - name: severity
        type: enum
        source: input
        description: "FDA-style recall class; CLASS_I quarantines the fleet immediately, CLASS_II and CLASS_III only block new assignment."
        constraints: "one of CLASS_I, CLASS_II, CLASS_III"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the notice was created."
      - name: remediation_deadline_utc
        type: datetime
        source: computed
        description: "Output of calculations.recall_remediation_deadline."
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle state; see state_machines[entity=RecallNotice]."
        default: OPEN
        constraints: "one of OPEN, IN_REMEDIATION, CLOSED"
      - name: affected_unit_count
        type: integer
        source: computed
        description: "Snapshot taken at creation: count of EquipmentUnit rows with model_code == this notice's model_code and status IN {IN_STOCK, RESERVED, DEPLOYED, IN_QUARANTINE}; never recomputed afterwards."
      - name: auto_quarantined_unit_count
        type: integer
        source: computed
        description: "Snapshot taken at creation: how many units the CLASS_I cascade moved into IN_QUARANTINE; always 0 for CLASS_II and CLASS_III."
      - name: remediated_unit_count
        type: integer
        source: computed
        description: "Live count of EquipmentUnit rows with model_code == this notice's model_code and recall_remediated_at >= this notice's issued_at."
        default: 0

  - name: TravelAuthorization
    parent: RentalContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the contract whose patient is travelling."
      - name: receiving_branch_id
        type: string
        source: input
        description: "FK -> Branch.id; branch that will service the patient at the destination; null when no hand-off is arranged."
      - name: destination_altitude_feet
        type: integer
        source: input
        description: "Elevation of the destination in feet."
        default: 0
        constraints: "0..15000"
      - name: depart_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC departure instant."
      - name: return_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC return instant; must be strictly after depart_utc."
      - name: status
        type: enum
        source: system
        description: "Authorization lifecycle state; see state_machines[entity=TravelAuthorization]."
        default: REQUESTED
        constraints: "one of REQUESTED, APPROVED, DENIED"
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the BranchManager who approved or denied."
      - name: trip_hours
        type: integer
        source: computed
        description: "Step 0 of calculations.travel_supply_authorization: whole hours between depart_utc and return_utc."
      - name: altitude_factor
        type: number
        source: computed
        description: "Step 1 of calculations.travel_supply_authorization; 2 decimals."
      - name: effective_lpm
        type: number
        source: computed
        description: "Step 2 of calculations.travel_supply_authorization; 2 decimals."
      - name: base_liters
        type: integer
        source: computed
        description: "Step 3 of calculations.travel_supply_authorization; whole litres."
      - name: reserve_liters
        type: integer
        source: computed
        description: "Step 4 of calculations.travel_supply_authorization; whole litres."
      - name: required_liters
        type: integer
        source: computed
        description: "Step 5 of calculations.travel_supply_authorization; whole litres."
      - name: cylinders_raw
        type: integer
        source: computed
        description: "Step 6 of calculations.travel_supply_authorization."
      - name: handling_surcharge_cylinders
        type: integer
        source: computed
        description: "Step 7 of calculations.travel_supply_authorization; 1 when cylinders_raw >= 6, else 0."
      - name: supply_cylinders_authorized
        type: integer
        source: computed
        description: "Step 8 of calculations.travel_supply_authorization; cylinders_raw + handling_surcharge_cylinders."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Patient
    state_field: status
    initial_state: ACTIVE
    terminal_states: [DISCHARGED]
    transitions:
      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /home-oxygen/patients/{patient_id}/transfer-requests"
        actor: IntakeCoordinator
        preconditions:
          - "patient.status == ACTIVE"
          - "body.receiving_branch_id resolves to an existing Branch"
          - "body.receiving_branch_id != patient.branch_id"
          - "body.transfer_effective_date >= the logical clock's date"
        side_effects:
          - "sets Patient.transfer_to_branch_id := body.receiving_branch_id"
          - "sets Patient.transfer_effective_date := body.transfer_effective_date"
          - "for every RentalContract with patient_id == this patient and billing_status IN {ACCRUING, CAP_REACHED}: billing_status := SUSPENDED, suspension_reason := TRANSFER"
          - "increments Patient.version by 1"
        note: "Cycle entry point; the pending transfer can be completed or cancelled, both returning the patient to ACTIVE."
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /home-oxygen/patients/{patient_id}/transfer-requests/complete"
        actor: BranchManager
        preconditions:
          - "patient.status == TRANSFER_PENDING"
          - "the logical clock's date >= Patient.transfer_effective_date"
        side_effects:
          - "sets Patient.branch_id := Patient.transfer_to_branch_id"
          - "sets Patient.transfer_to_branch_id := null and Patient.transfer_effective_date := null"
          - "for every RentalContract with patient_id == this patient and billing_status == SUSPENDED and suspension_reason == TRANSFER: billing_status := ACCRUING, suspension_reason := NONE"
          - "increments Patient.version by 1"
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /home-oxygen/patients/{patient_id}/transfer-requests/cancel"
        actor: IntakeCoordinator
        preconditions:
          - "patient.status == TRANSFER_PENDING"
        side_effects:
          - "sets Patient.transfer_to_branch_id := null and Patient.transfer_effective_date := null"
          - "Patient.branch_id is left unchanged"
          - "for every RentalContract with patient_id == this patient and billing_status == SUSPENDED and suspension_reason == TRANSFER: billing_status := ACCRUING, suspension_reason := NONE"
          - "increments Patient.version by 1"
        note: |
          Compensating counterpart of the ACTIVE -> TRANSFER_PENDING transition: the branch
          assignment and both transfer fields return to their exact pre-request values. Billing
          always resumes on the ACCRUING branch, even for a contract that was CAP_REACHED when the
          transfer opened, so such a contract's next posted month fails the priority-95 cap check
          rather than the priority-35 billing-state check.
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /home-oxygen/patients/{patient_id}/discharge"
        actor: BranchManager
        preconditions:
          - "patient.status == ACTIVE"
          - "no RentalContract with patient_id == this patient has service_status IN {PENDING_SETUP, IN_SERVICE, PICKUP_SCHEDULED}"
        side_effects:
          - "for every RentalContract with patient_id == this patient and billing_status != CLOSED: billing_status := CLOSED"
          - "for every CertificateOfMedicalNecessity with patient_id == this patient and status == ACTIVE: status := VOIDED, void_reason := 'PATIENT_DISCHARGED'"
          - "sets Patient.current_cmn_status to the status of the most-recently-created CMN (created_at DESC) after the void above"
          - "increments Patient.version by 1"

  # ---------------------------------------------------------------------------
  - entity: CertificateOfMedicalNecessity
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED, VOIDED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /home-oxygen/cmns/{cmn_id}/submit"
        actor: IntakeCoordinator
        preconditions:
          - "cmn.status == DRAFT"
          - "the linked QualifyingTest.qualifying_group != NON_QUALIFYING"
          - "the logical clock <= QualifyingTest.test_validity_expires_at + TEST_VALIDITY_GRACE_DAYS (15 days)"
          - "calculations.cmn_documentation_score for this certificate >= DOCUMENTATION_PASS_THRESHOLD (85.00)"
          - "Patient.status == ACTIVE"
        side_effects:
          - "recomputes CertificateOfMedicalNecessity.documentation_score"
          - "sets CertificateOfMedicalNecessity.submitted_by_user_id := X-User-ID"
          - "sets Patient.current_cmn_status := SUBMITTED when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: SUBMITTED
        to: PHYSICIAN_SIGNED
        trigger: "POST /home-oxygen/cmns/{cmn_id}/sign"
        actor: Physician
        preconditions:
          - "cmn.status == SUBMITTED"
        side_effects:
          - "sets CertificateOfMedicalNecessity.signed_by_user_id := X-User-ID"
          - "sets CertificateOfMedicalNecessity.physician_signature_date := the logical clock's date (YYYY-MM-DD)"
          - "sets Patient.current_cmn_status := PHYSICIAN_SIGNED when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: PHYSICIAN_SIGNED
        to: ACTIVE
        trigger: "POST /home-oxygen/cmns/{cmn_id}/approve"
        actor: ComplianceAuditor
        preconditions:
          - "cmn.status == PHYSICIAN_SIGNED"
          - "X-User-ID != CertificateOfMedicalNecessity.submitted_by_user_id (segregation of duties)"
          - "X-User-ID != CertificateOfMedicalNecessity.signed_by_user_id (segregation of duties)"
          - "calculations.cmn_documentation_score for this certificate >= DOCUMENTATION_PASS_THRESHOLD (85.00)"
        side_effects:
          - "sets CertificateOfMedicalNecessity.audited_by_user_id := X-User-ID"
          - "sets CertificateOfMedicalNecessity.initial_date := the logical clock's date (YYYY-MM-DD)"
          - "computes CertificateOfMedicalNecessity.recert_due_date via calculations.recert_due_date"
          - "for every other CertificateOfMedicalNecessity with the same patient_id and status == ACTIVE: status := SUPERSEDED"
          - "sets Patient.current_cmn_status := ACTIVE when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /home-oxygen/cmns/{cmn_id}/return-for-correction"
        actor: ComplianceAuditor
        preconditions:
          - "cmn.status == SUBMITTED"
          - "CertificateOfMedicalNecessity.revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "increments CertificateOfMedicalNecessity.revision_round by 1"
          - "sets CertificateOfMedicalNecessity.correction_notes := body.correction_notes"
          - "sets CertificateOfMedicalNecessity.signed_by_user_id := null and physician_signature_date := null"
          - "sets Patient.current_cmn_status := RETURNED_FOR_CORRECTION when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: PHYSICIAN_SIGNED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /home-oxygen/cmns/{cmn_id}/return-for-correction"
        actor: ComplianceAuditor
        preconditions:
          - "cmn.status == PHYSICIAN_SIGNED"
          - "CertificateOfMedicalNecessity.revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "increments CertificateOfMedicalNecessity.revision_round by 1"
          - "sets CertificateOfMedicalNecessity.correction_notes := body.correction_notes"
          - "sets CertificateOfMedicalNecessity.signed_by_user_id := null and physician_signature_date := null (the physician signature is discarded and must be re-obtained)"
          - "sets Patient.current_cmn_status := RETURNED_FOR_CORRECTION when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: RETURNED_FOR_CORRECTION
        to: DRAFT
        trigger: "PATCH /home-oxygen/cmns/{cmn_id}"
        actor: IntakeCoordinator
        preconditions:
          - "cmn.status == RETURNED_FOR_CORRECTION"
        side_effects:
          - "applies the supplied prescription/narrative edits"
          - "recomputes CertificateOfMedicalNecessity.documentation_score"
          - "sets CertificateOfMedicalNecessity.submitted_by_user_id := null"
          - "sets Patient.current_cmn_status := DRAFT when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
        note: "Closes the revision cycle DRAFT -> SUBMITTED -> RETURNED_FOR_CORRECTION -> DRAFT; the cycle terminates once revision_round reaches 3."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep executed inside POST /home-oxygen/_clock/set_current_utc"
        actor: system
        preconditions:
          - "cmn.status == ACTIVE"
          - "CertificateOfMedicalNecessity.recert_due_date < the new logical clock's date"
        side_effects:
          - "for every RentalContract with cmn_id == this certificate and billing_status IN {ACCRUING, CAP_REACHED}: billing_status := SUSPENDED, suspension_reason := CMN_EXPIRED"
          - "sets Patient.current_cmn_status := EXPIRED when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /home-oxygen/cmns/{cmn_id}/void"
        actor: ComplianceAuditor
        preconditions:
          - "cmn.status == ACTIVE"
          - "body.void_reason is a non-empty string"
        side_effects:
          - "sets CertificateOfMedicalNecessity.void_reason := body.void_reason"
          - "for every RentalContract with cmn_id == this certificate and billing_status IN {ACCRUING, CAP_REACHED}: billing_status := SUSPENDED, suspension_reason := CMN_VOIDED"
          - "sets Patient.current_cmn_status := VOIDED when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /home-oxygen/cmns/{cmn_id}/void"
        actor: ComplianceAuditor
        preconditions:
          - "cmn.status == DRAFT"
          - "body.void_reason is a non-empty string"
        side_effects:
          - "sets CertificateOfMedicalNecessity.void_reason := body.void_reason"
          - "sets Patient.current_cmn_status := VOIDED when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
      - from: RETURNED_FOR_CORRECTION
        to: VOIDED
        trigger: "POST /home-oxygen/cmns/{cmn_id}/void"
        actor: ComplianceAuditor
        preconditions:
          - "cmn.status == RETURNED_FOR_CORRECTION"
          - "body.void_reason is a non-empty string"
        side_effects:
          - "sets CertificateOfMedicalNecessity.void_reason := body.void_reason"
          - "sets Patient.current_cmn_status := VOIDED when this is the patient's most-recently-created CMN"
          - "increments CertificateOfMedicalNecessity.version by 1"
        note: "Escape hatch for a certificate that has exhausted MAX_REVISION_ROUNDS; SUBMITTED and PHYSICIAN_SIGNED certificates must be returned for correction before they can be voided."

  # ---------------------------------------------------------------------------
  - entity: RentalContract
    state_field: billing_status
    initial_state: ACCRUING
    terminal_states: [CLOSED]
    note: |
      Billing dimension. This machine evolves independently of the service_status machine declared
      immediately below: the same RentalContract row carries both, and a transition on one dimension
      never reads or writes the other's state field except where a side_effect says so explicitly.
    transitions:
      - from: ACCRUING
        to: ACCRUING
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == ACCRUING"
          - "contract.service_status == IN_SERVICE"
          - "the linked CertificateOfMedicalNecessity.status == ACTIVE"
          - "body.service_month is not already present in RentalContract.posted_months"
          - "body.service_month >= RentalContract.first_service_month"
          - "calculations.cap_month_position yields effective_position <= RentalContract.cap_month_limit"
          - "calculations.cap_month_position yields effective_position < RentalContract.cap_month_limit for this transition to remain in ACCRUING"
        side_effects:
          - "appends { service_month, amount_cents, days_in_service, posted_at } to RentalContract.posted_months"
          - "increments RentalContract.posted_month_count by 1"
          - "increases RentalContract.lifetime_paid_cents by the appended amount_cents"
          - "sets RentalContract.last_posted_service_month to the largest service_month in posted_months"
          - "increments RentalContract.version by 1"
      - from: ACCRUING
        to: CAP_REACHED
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == ACCRUING"
          - "contract.service_status == IN_SERVICE"
          - "the linked CertificateOfMedicalNecessity.status == ACTIVE"
          - "body.service_month is not already present in RentalContract.posted_months"
          - "calculations.cap_month_position yields effective_position == RentalContract.cap_month_limit"
        side_effects:
          - "appends { service_month, amount_cents, days_in_service, posted_at } to RentalContract.posted_months"
          - "increments RentalContract.posted_month_count by 1"
          - "increases RentalContract.lifetime_paid_cents by the appended amount_cents"
          - "sets RentalContract.last_posted_service_month to the largest service_month in posted_months"
          - "increments RentalContract.version by 1"
        note: "Whether the same posted month lands here or on the ACCRUING self-loop depends on which calculations.cap_month_position variant the contract's pricing_basis selects."
      - from: CAP_REACHED
        to: ACCRUING
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == CAP_REACHED"
          - "the path service_month is present in RentalContract.posted_months"
          - "calculations.cap_month_position recomputed over posted_months WITHOUT the reversed month yields effective_position < RentalContract.cap_month_limit"
        side_effects:
          - "removes the element whose service_month equals the path parameter from RentalContract.posted_months"
          - "decrements RentalContract.posted_month_count by 1"
          - "decreases RentalContract.lifetime_paid_cents by exactly the removed element's amount_cents"
          - "recomputes RentalContract.last_posted_service_month over the remaining posted_months (null when empty)"
          - "increments RentalContract.version by 1"
        note: "Compensating counterpart of the post-month transitions; lifetime_paid_cents must return to its exact pre-post value."
      - from: ACCRUING
        to: ACCRUING
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == ACCRUING"
          - "the path service_month is present in RentalContract.posted_months"
        side_effects:
          - "removes the element whose service_month equals the path parameter from RentalContract.posted_months"
          - "decrements RentalContract.posted_month_count by 1"
          - "decreases RentalContract.lifetime_paid_cents by exactly the removed element's amount_cents"
          - "recomputes RentalContract.last_posted_service_month over the remaining posted_months (null when empty)"
          - "increments RentalContract.version by 1"
      - from: ACCRUING
        to: SUSPENDED
        trigger: "system cascade from CertificateOfMedicalNecessity ACTIVE->VOIDED, ACTIVE->EXPIRED, RecallNotice creation with severity CLASS_I, Patient ACTIVE->TRANSFER_PENDING, or RentalContract PENDING_SETUP->SETUP_FAILED"
        actor: system
        preconditions:
          - "contract.billing_status == ACCRUING"
        side_effects:
          - "sets RentalContract.suspension_reason to CMN_VOIDED, CMN_EXPIRED, RECALL, TRANSFER or SETUP_FAILED matching the originating cascade"
          - "increments RentalContract.version by 1"
      - from: CAP_REACHED
        to: SUSPENDED
        trigger: "system cascade from CertificateOfMedicalNecessity ACTIVE->VOIDED, ACTIVE->EXPIRED, RecallNotice creation with severity CLASS_I, or Patient ACTIVE->TRANSFER_PENDING"
        actor: system
        preconditions:
          - "contract.billing_status == CAP_REACHED"
        side_effects:
          - "sets RentalContract.suspension_reason to CMN_VOIDED, CMN_EXPIRED, RECALL or TRANSFER matching the originating cascade"
          - "increments RentalContract.version by 1"
      - from: SUSPENDED
        to: ACCRUING
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/resume-billing"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == SUSPENDED"
          - "the linked CertificateOfMedicalNecessity.status == ACTIVE"
          - "Patient.status == ACTIVE"
          - "no Placement with contract_id == this contract has status == RECALLED_OUT_OF_SERVICE"
          - "calculations.cap_month_position over the current posted_months yields effective_position < RentalContract.cap_month_limit"
        side_effects:
          - "sets RentalContract.suspension_reason := NONE"
          - "recomputes RentalContract.monthly_allowable_cents via calculations.monthly_allowable_cents"
          - "increments RentalContract.version by 1"
        note: "Cross-entity guard: the contract's billing dimension cannot resume unless the certificate it hangs off is ACTIVE."
      - from: SUSPENDED
        to: CAP_REACHED
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/resume-billing"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == SUSPENDED"
          - "the linked CertificateOfMedicalNecessity.status == ACTIVE"
          - "Patient.status == ACTIVE"
          - "no Placement with contract_id == this contract has status == RECALLED_OUT_OF_SERVICE"
          - "calculations.cap_month_position over the current posted_months yields effective_position == RentalContract.cap_month_limit"
        side_effects:
          - "sets RentalContract.suspension_reason := NONE"
          - "recomputes RentalContract.monthly_allowable_cents via calculations.monthly_allowable_cents"
          - "increments RentalContract.version by 1"
      - from: ACCRUING
        to: CLOSED
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/close"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == ACCRUING"
          - "contract.service_status IN {RETURNED, SETUP_FAILED}"
        side_effects:
          - "sets RentalContract.monthly_allowable_cents := 0"
          - "increments RentalContract.version by 1"
      - from: CAP_REACHED
        to: CLOSED
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/close"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == CAP_REACHED"
          - "contract.service_status IN {RETURNED, SETUP_FAILED}"
        side_effects:
          - "sets RentalContract.monthly_allowable_cents := 0"
          - "increments RentalContract.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/close, or system cascade from Patient ACTIVE->DISCHARGED"
        actor: BillingSpecialist
        preconditions:
          - "contract.billing_status == SUSPENDED"
          - "contract.service_status IN {RETURNED, SETUP_FAILED} when invoked through POST /home-oxygen/rental-contracts/{contract_id}/close; unconditional when reached through the Patient discharge cascade"
        side_effects:
          - "sets RentalContract.monthly_allowable_cents := 0"
          - "increments RentalContract.version by 1"

  # ---------------------------------------------------------------------------
  - entity: RentalContract
    state_field: service_status
    initial_state: PENDING_SETUP
    terminal_states: [SETUP_FAILED, RETURNED]
    note: |
      Service dimension of the same RentalContract row, parallel to billing_status above. A contract
      can sit at (billing_status=CAP_REACHED, service_status=IN_SERVICE) or at
      (billing_status=ACCRUING, service_status=PICKUP_SCHEDULED) — every combination of a
      non-terminal billing state with a non-terminal service state is reachable.
    transitions:
      - from: PENDING_SETUP
        to: IN_SERVICE
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete-setup with body.smoking_in_home == false"
        actor: RespiratoryTherapist
        preconditions:
          - "contract.service_status == PENDING_SETUP"
          - "the stop's stop_type == SETUP_DELIVERY and stop.status == PLANNED"
          - "the stop's DeliveryRoute.status == DISPATCHED"
          - "at least one Placement with contract_id == this contract has status == RESERVED"
          - "body.smoking_in_home == false, so calculations-derived RouteStop.safety_result == PASS"
        side_effects:
          - "sets RouteStop.status := COMPLETED, safety_result := PASS, completed_at := the logical clock, completed_by_user_id := X-User-ID"
          - "sets RouteStop.safety_findings_count via the entity's declared predicate count"
          - "sets RentalContract.first_service_month := YYYY-MM of the logical clock"
          - "for every Placement with contract_id == this contract and status == RESERVED: status := PLACED, placed_at := the logical clock"
          - "for every EquipmentUnit referenced by those placements with status == RESERVED: status := DEPLOYED"
          - "recomputes RentalContract.monthly_allowable_cents via calculations.monthly_allowable_cents"
          - "recomputes Patient.oxygen_safety_risk_score via the INITIAL_ASSESSMENT variant and sets Patient.risk_variant_applied := INITIAL_ASSESSMENT and Patient.compliance_hold"
          - "when every RouteStop of the stop's route now has status IN {COMPLETED, MISSED, CANCELLED}: DeliveryRoute.status := COMPLETED (bubble-up)"
          - "increments RentalContract.version by 1"
      - from: PENDING_SETUP
        to: SETUP_FAILED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete-setup with body.smoking_in_home == true"
        actor: RespiratoryTherapist
        preconditions:
          - "contract.service_status == PENDING_SETUP"
          - "the stop's stop_type == SETUP_DELIVERY and stop.status == PLANNED"
          - "the stop's DeliveryRoute.status == DISPATCHED"
          - "body.smoking_in_home == true, so calculations-derived RouteStop.safety_result == FAIL"
        side_effects:
          - "HOP 1: sets RouteStop.status := COMPLETED, safety_result := FAIL, completed_at := the logical clock, completed_by_user_id := X-User-ID"
          - "HOP 2: because HOP 1 recorded safety_result == FAIL, sets RentalContract.service_status := SETUP_FAILED (and, off HOP 2, RentalContract.billing_status := SUSPENDED with suspension_reason := SETUP_FAILED)"
          - "HOP 3: because HOP 2 moved the contract to SETUP_FAILED, every Placement with contract_id == this contract and status == RESERVED becomes status := REMOVED, removal_reason := SETUP_FAILED, removed_at := the logical clock"
          - "HOP 4: because HOP 3 removed those placements, every EquipmentUnit they referenced with status == RESERVED becomes status := IN_QUARANTINE, quarantine_reason := SAFETY"
          - "RentalContract.first_service_month remains null and RentalContract.monthly_allowable_cents is set to 0"
          - "when every RouteStop of the stop's route now has status IN {COMPLETED, MISSED, CANCELLED}: DeliveryRoute.status := COMPLETED (bubble-up)"
          - "increments RentalContract.version by 1"
        note: "Depth-4 transitive cascade: stop -> contract -> placements -> equipment units, each hop caused by the preceding hop."
      - from: IN_SERVICE
        to: PICKUP_SCHEDULED
        trigger: "POST /home-oxygen/route-stops with body.stop_type == PICKUP"
        actor: BranchManager
        preconditions:
          - "contract.service_status == IN_SERVICE"
          - "the target DeliveryRoute.status == PLANNING"
        side_effects:
          - "creates the RouteStop in status PLANNED"
          - "increments RentalContract.version by 1"
      - from: PICKUP_SCHEDULED
        to: IN_SERVICE
        trigger: "POST /home-oxygen/route-stops/{stop_id}/cancel on the contract's only PLANNED PICKUP stop"
        actor: BranchManager
        preconditions:
          - "contract.service_status == PICKUP_SCHEDULED"
          - "after the cancel, no RouteStop with contract_id == this contract has stop_type == PICKUP and status == PLANNED"
        side_effects:
          - "sets RouteStop.status := CANCELLED"
          - "increments RentalContract.version by 1"
        note: "Cyclic revert of the pickup scheduling step."
      - from: PICKUP_SCHEDULED
        to: RETURNED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete on a PICKUP stop"
        actor: DeliveryDriver
        preconditions:
          - "contract.service_status == PICKUP_SCHEDULED"
          - "the stop's stop_type == PICKUP and stop.status == PLANNED"
          - "the stop's DeliveryRoute.status == DISPATCHED"
        side_effects:
          - "sets RouteStop.status := COMPLETED, completed_at := the logical clock, completed_by_user_id := X-User-ID"
          - "for every Placement with contract_id == this contract and status == PLACED: status := REMOVED, removal_reason := PICKUP, removed_at := the logical clock"
          - "for every EquipmentUnit referenced by those placements with status == DEPLOYED: status := IN_STOCK"
          - "sets RentalContract.monthly_allowable_cents := 0"
          - "when every RouteStop of the stop's route now has status IN {COMPLETED, MISSED, CANCELLED}: DeliveryRoute.status := COMPLETED (bubble-up)"
          - "increments RentalContract.version by 1"

  # ---------------------------------------------------------------------------
  - entity: EquipmentUnit
    state_field: status
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments"
        actor: RespiratoryTherapist
        preconditions:
          - "unit.status == IN_STOCK"
          - "the unit is the winner of calculations.equipment_selection for the requested role"
        side_effects:
          - "creates a Placement in status RESERVED referencing this unit"
          - "increments EquipmentUnit.version by 1"
      - from: RESERVED
        to: IN_STOCK
        trigger: "DELETE /home-oxygen/placements/{placement_id}"
        actor: RespiratoryTherapist
        preconditions:
          - "unit.status == RESERVED"
          - "the referencing Placement.status == RESERVED"
        side_effects:
          - "sets Placement.status := REMOVED, removal_reason := RELEASED, removed_at := the logical clock"
          - "returns the unit to its owning branch's IN_STOCK pool"
          - "increments EquipmentUnit.version by 1"
        note: "Compensating counterpart of the assignment transition; the branch's IN_STOCK count for the unit's model_code returns to its pre-assignment value."
      - from: RESERVED
        to: DEPLOYED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete-setup with body.smoking_in_home == false"
        actor: RespiratoryTherapist
        preconditions:
          - "unit.status == RESERVED"
          - "the referencing Placement moved RESERVED -> PLACED in the same request"
        side_effects:
          - "increments EquipmentUnit.version by 1"
      - from: RESERVED
        to: IN_QUARANTINE
        trigger: "system cascade HOP 4 of RentalContract PENDING_SETUP->SETUP_FAILED, or system cascade from RecallNotice creation with severity CLASS_I"
        actor: system
        preconditions:
          - "unit.status == RESERVED"
        side_effects:
          - "sets EquipmentUnit.quarantine_reason := SAFETY for the setup-failure cascade or := RECALL for the recall cascade"
          - "increments EquipmentUnit.version by 1"
      - from: DEPLOYED
        to: IN_STOCK
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete on a PICKUP stop"
        actor: DeliveryDriver
        preconditions:
          - "unit.status == DEPLOYED"
          - "the referencing Placement moved PLACED -> REMOVED in the same request"
        side_effects:
          - "increments EquipmentUnit.version by 1"
      - from: DEPLOYED
        to: IN_QUARANTINE
        trigger: "POST /home-oxygen/placements/{placement_id}/malfunction yielding severity_tier TIER_1, or system cascade from RecallNotice creation with severity CLASS_I"
        actor: RespiratoryTherapist
        preconditions:
          - "unit.status == DEPLOYED"
        side_effects:
          - "sets EquipmentUnit.quarantine_reason := MALFUNCTION for the malfunction path or := RECALL for the recall cascade"
          - "increments EquipmentUnit.version by 1"
      - from: IN_STOCK
        to: IN_QUARANTINE
        trigger: "system cascade from RecallNotice creation with severity CLASS_I"
        actor: system
        preconditions:
          - "unit.status == IN_STOCK"
          - "unit.model_code == the new RecallNotice.model_code"
        side_effects:
          - "sets EquipmentUnit.quarantine_reason := RECALL"
          - "increments EquipmentUnit.version by 1"
      - from: IN_QUARANTINE
        to: IN_STOCK
        trigger: "POST /home-oxygen/equipment-units/{equipment_unit_id}/service"
        actor: RespiratoryTherapist
        preconditions:
          - "unit.status == IN_QUARANTINE"
        side_effects:
          - "sets EquipmentUnit.next_pm_due_date := the logical clock's date + EquipmentUnit.pm_interval_days"
          - "sets EquipmentUnit.quarantine_reason := NONE"
          - "when a RecallNotice with model_code == this unit's model_code and status IN {OPEN, IN_REMEDIATION} exists: sets EquipmentUnit.recall_remediated_at := the logical clock and increases that notice's remediated_unit_count"
          - "increments EquipmentUnit.version by 1"
      - from: IN_QUARANTINE
        to: RETIRED
        trigger: "POST /home-oxygen/equipment-units/{equipment_unit_id}/retire"
        actor: BranchManager
        preconditions:
          - "unit.status == IN_QUARANTINE"
        side_effects:
          - "increments EquipmentUnit.version by 1"
      - from: IN_STOCK
        to: RETIRED
        trigger: "POST /home-oxygen/equipment-units/{equipment_unit_id}/retire"
        actor: BranchManager
        preconditions:
          - "unit.status == IN_STOCK"
        side_effects:
          - "increments EquipmentUnit.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Placement
    state_field: status
    initial_state: RESERVED
    terminal_states: [REMOVED, RECALLED_OUT_OF_SERVICE]
    transitions:
      - from: RESERVED
        to: PLACED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete-setup with body.smoking_in_home == false"
        actor: RespiratoryTherapist
        preconditions:
          - "placement.status == RESERVED"
          - "the placement's contract moved PENDING_SETUP -> IN_SERVICE in the same request"
        side_effects:
          - "sets Placement.placed_at := the logical clock"
          - "increments Placement.version by 1"
      - from: RESERVED
        to: REMOVED
        trigger: "DELETE /home-oxygen/placements/{placement_id}, or system cascade HOP 3 of RentalContract PENDING_SETUP->SETUP_FAILED"
        actor: RespiratoryTherapist
        preconditions:
          - "placement.status == RESERVED"
        side_effects:
          - "sets Placement.removal_reason := RELEASED for the explicit release or := SETUP_FAILED for the cascade"
          - "sets Placement.removed_at := the logical clock"
          - "increments Placement.version by 1"
      - from: PLACED
        to: REMOVED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete on a PICKUP stop, or system cascade from Patient ACTIVE->TRANSFER_PENDING when the receiving branch is null"
        actor: DeliveryDriver
        preconditions:
          - "placement.status == PLACED"
        side_effects:
          - "sets Placement.removal_reason := PICKUP or := TRANSFER matching the originating trigger"
          - "sets Placement.removed_at := the logical clock"
          - "increments Placement.version by 1"
      - from: PLACED
        to: RECALLED_OUT_OF_SERVICE
        trigger: "system cascade HOP 3 from RecallNotice creation with severity CLASS_I"
        actor: system
        preconditions:
          - "placement.status == PLACED"
          - "the referenced EquipmentUnit moved to IN_QUARANTINE with quarantine_reason == RECALL in the same request"
        side_effects:
          - "sets Placement.removal_reason := RECALL and removed_at := the logical clock"
          - "increments Placement.version by 1"
      - from: PLACED
        to: REMOVED
        trigger: "POST /home-oxygen/placements/{placement_id}/malfunction yielding severity_tier TIER_1"
        actor: RespiratoryTherapist
        preconditions:
          - "placement.status == PLACED"
          - "calculations.malfunction_severity_tier yields TIER_1"
        side_effects:
          - "sets Placement.removal_reason := MALFUNCTION and removed_at := the logical clock"
          - "sets Placement.last_symptom and Placement.last_severity_tier from the report"
          - "increments Placement.malfunction_count and RentalContract.malfunction_count by 1"
          - "increases RentalContract.cumulative_oxygen_gap_minutes by body.oxygen_gap_minutes"
          - "increments Placement.version by 1"

  # ---------------------------------------------------------------------------
  - entity: DeliveryRoute
    state_field: status
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNING
        to: LOCKED
        trigger: "POST /home-oxygen/delivery-routes/{route_id}/lock"
        actor: BranchManager
        preconditions:
          - "route.status == PLANNING"
          - "DeliveryRoute.planned_stop_count >= 1"
          - "DeliveryRoute.refill_slots_used <= the route's Branch.refill_capacity_per_day"
        side_effects:
          - "recomputes DeliveryRoute.total_o2_liters_committed via calculations.route_liters_committed"
          - "increments DeliveryRoute.version by 1"
      - from: LOCKED
        to: PLANNING
        trigger: "POST /home-oxygen/delivery-routes/{route_id}/unlock"
        actor: BranchManager
        preconditions:
          - "route.status == LOCKED"
        side_effects:
          - "increments DeliveryRoute.version by 1"
        note: "Cycle: a locked route can be reopened for stop edits any number of times before dispatch."
      - from: LOCKED
        to: DISPATCHED
        trigger: "POST /home-oxygen/delivery-routes/{route_id}/dispatch"
        actor: BranchManager
        preconditions:
          - "route.status == LOCKED"
        side_effects:
          - "increments DeliveryRoute.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system bubble-up evaluated at the end of POST /home-oxygen/route-stops/{stop_id}/complete, POST /home-oxygen/route-stops/{stop_id}/complete-setup and POST /home-oxygen/route-stops/{stop_id}/miss"
        actor: system
        preconditions:
          - "route.status == DISPATCHED"
          - "every RouteStop with route_id == this route has status IN {COMPLETED, MISSED, CANCELLED}"
        side_effects:
          - "sets DeliveryRoute.planned_stop_count := 0"
          - "increments DeliveryRoute.version by 1"
        note: "Compound/aggregate: the parent route's state is derived from its children's states and re-derived on every child terminal transition."

  # ---------------------------------------------------------------------------
  - entity: RouteStop
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete"
        actor: DeliveryDriver
        preconditions:
          - "stop.status == PLANNED"
          - "stop.stop_type IN {TANK_EXCHANGE, PORTABLE_REFILL, PICKUP, MAINTENANCE_SWAP}"
          - "the stop's DeliveryRoute.status == DISPATCHED"
        side_effects:
          - "sets RouteStop.completed_at := the logical clock and completed_by_user_id := X-User-ID"
          - "applies the stop_type-specific contract and placement side effects declared on the RentalContract service_status machine"
          - "when every RouteStop of the route now has status IN {COMPLETED, MISSED, CANCELLED}: DeliveryRoute.status := COMPLETED (bubble-up)"
          - "increments RouteStop.version by 1"
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/complete-setup"
        actor: RespiratoryTherapist
        preconditions:
          - "stop.status == PLANNED"
          - "stop.stop_type == SETUP_DELIVERY"
          - "the stop's DeliveryRoute.status == DISPATCHED"
        side_effects:
          - "records smoking_in_home, electrical_pass, patient_teachback_score and education_topics_covered from the body"
          - "computes RouteStop.safety_result (FAIL exactly when smoking_in_home == true) and RouteStop.safety_findings_count"
          - "drives the RentalContract service_status transition to IN_SERVICE or SETUP_FAILED"
          - "when every RouteStop of the route now has status IN {COMPLETED, MISSED, CANCELLED}: DeliveryRoute.status := COMPLETED (bubble-up)"
          - "increments RouteStop.version by 1"
      - from: PLANNED
        to: MISSED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/miss"
        actor: DeliveryDriver
        preconditions:
          - "stop.status == PLANNED"
          - "the stop's DeliveryRoute.status == DISPATCHED"
        side_effects:
          - "sets RouteStop.completed_at := the logical clock and completed_by_user_id := X-User-ID"
          - "decrements DeliveryRoute.planned_stop_count by 1"
          - "leaves DeliveryRoute.total_o2_liters_committed unchanged (a missed stop's litres stay committed for the day)"
          - "when every RouteStop of the route now has status IN {COMPLETED, MISSED, CANCELLED}: DeliveryRoute.status := COMPLETED (bubble-up)"
          - "increments RouteStop.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /home-oxygen/route-stops/{stop_id}/cancel"
        actor: BranchManager
        preconditions:
          - "stop.status == PLANNED"
          - "the stop's DeliveryRoute.status IN {PLANNING, LOCKED}"
        side_effects:
          - "decrements DeliveryRoute.planned_stop_count by 1"
          - "decreases DeliveryRoute.total_o2_liters_committed by exactly this stop's liters_committed"
          - "recomputes DeliveryRoute.refill_slots_used"
          - "recomputes sequence_index for every remaining non-CANCELLED stop of the route"
          - "when the cancelled stop was a PICKUP and no other PLANNED PICKUP stop remains for its contract: RentalContract.service_status := IN_SERVICE"
          - "increments RouteStop.version by 1"
        note: "Compensating counterpart of stop creation; DeliveryRoute.total_o2_liters_committed returns to its exact pre-creation value."

  # ---------------------------------------------------------------------------
  - entity: RecallNotice
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_REMEDIATION
        trigger: "POST /home-oxygen/recall-notices/{recall_notice_id}/start-remediation"
        actor: BranchManager
        preconditions:
          - "notice.status == OPEN"
        side_effects:
          - "increments RecallNotice.version by 1"
      - from: IN_REMEDIATION
        to: CLOSED
        trigger: "POST /home-oxygen/recall-notices/{recall_notice_id}/close"
        actor: BranchManager
        preconditions:
          - "notice.status == IN_REMEDIATION"
          - "RecallNotice.remediated_unit_count >= RecallNotice.affected_unit_count"
        side_effects:
          - "increments RecallNotice.version by 1"

  # ---------------------------------------------------------------------------
  - entity: TravelAuthorization
    state_field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /home-oxygen/travel-authorizations/{travel_authorization_id}/approve"
        actor: BranchManager
        preconditions:
          - "authorization.status == REQUESTED"
          - "the linked RentalContract.billing_status != SUSPENDED"
          - "the linked RentalContract.service_status == IN_SERVICE"
          - "the contract's Patient.compliance_hold == false"
        side_effects:
          - "sets TravelAuthorization.decided_by_user_id := X-User-ID"
          - "increments TravelAuthorization.version by 1"
        note: "Cross-entity guard on the Patient risk posture: an authorization for a patient on compliance_hold cannot be approved."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /home-oxygen/travel-authorizations/{travel_authorization_id}/deny"
        actor: BranchManager
        preconditions:
          - "authorization.status == REQUESTED"
        side_effects:
          - "sets TravelAuthorization.decided_by_user_id := X-User-ID"
          - "increments TravelAuthorization.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: cmn-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /home-oxygen/cmns"
    occ_field: "expected_patient_version"
    description: |
      Creating a CertificateOfMedicalNecessity against a Patient whose version has advanced since
      the client last read it is rejected. A newly approved certificate legitimately supersedes the
      patient's prior ACTIVE certificate, so a second sequential create observing the same patient
      state would itself succeed under the product's natural semantics; the stale-version check is
      what makes the outcome deterministic. Every CMN write bumps Patient.version through the
      current_cmn_status mirror, so a client that drafted its request against an older read carries
      a version the server no longer recognises.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: travel-auth-create-stale-contract
    parent_entity: RentalContract
    write_endpoint: "POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"
    occ_field: "expected_contract_version"
    description: |
      Creating a TravelAuthorization against a RentalContract whose version has advanced since the
      client last read it is rejected. A new authorization legitimately supersedes any prior
      REQUESTED authorization on the same contract, so a second sequential create sees a state in
      which it would itself succeed; the stale-version check pins which request the server honours.
      Billing-month posting, resume-billing and every placement change bump RentalContract.version,
      so a stale read is common in practice.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: qualifying_group_determination
    trigger: "POST /home-oxygen/qualifying-tests (QualifyingTest rows are immutable, so this runs exactly once per row, at creation)"
    algorithm: threshold
    formula: |
      # Step 1 — study currency window (pinned before the group test so the two are independent)
      if test_type IN {RESTING_ROOM_AIR, EXERCISE}:
          validity_days = VALIDITY_DAYS_ACUTE            # 30
      else:                                              # NOCTURNAL_OVERNIGHT_OXIMETRY, SLEEP_STUDY
          validity_days = VALIDITY_DAYS_SLEEP            # 90
      test_validity_expires_at = tested_at + validity_days days

      # Step 2 — Group I test (the more generous group wins; evaluated first)
      group_i_hit = (spo2_percent is not null AND spo2_percent <= GROUP_I_SPO2_MAX)     # <= 88
                    OR (pao2_mmhg is not null AND pao2_mmhg <= GROUP_I_PAO2_MAX)        # <= 55
      if test_type == NOCTURNAL_OVERNIGHT_OXIMETRY:
          group_i_hit = group_i_hit AND (desat_minutes >= NOCTURNAL_MIN_DESAT_MINUTES)  # >= 5
      if group_i_hit:
          qualifying_group = GROUP_I
          return

      # Step 3 — Group II test (borderline values plus a documented secondary finding)
      borderline = (spo2_percent is not null AND spo2_percent == GROUP_II_SPO2)          # == 89
                   OR (pao2_mmhg is not null AND GROUP_II_PAO2_MIN <= pao2_mmhg <= GROUP_II_PAO2_MAX)  # 56..59
      if borderline AND cor_pulmonale_or_edema == true:
          qualifying_group = GROUP_II
          return

      qualifying_group = NON_QUALIFYING
    input_set: |
      Exactly the fields of the QualifyingTest row being created. No other row participates; the
      calculation never reads Patient, CertificateOfMedicalNecessity or the logical clock.
    constants:
      GROUP_I_SPO2_MAX: 88
      GROUP_I_PAO2_MAX: 55
      GROUP_II_SPO2: 89
      GROUP_II_PAO2_MIN: 56
      GROUP_II_PAO2_MAX: 59
      NOCTURNAL_MIN_DESAT_MINUTES: 5
      VALIDITY_DAYS_ACUTE: 30
      VALIDITY_DAYS_SLEEP: 90
      TEST_VALIDITY_GRACE_DAYS: 15
    precision: "integers only; test_validity_expires_at is ISO 8601 UTC with three fractional digits"

  # ---------------------------------------------------------------------------
  - name: cmn_documentation_score
    trigger: "POST /home-oxygen/cmns; PATCH /home-oxygen/cmns/{cmn_id} (the RETURNED_FOR_CORRECTION -> DRAFT transition); and the DRAFT -> SUBMITTED transition"
    algorithm: weighted_scoring
    formula: |
      # Six additive components whose maxima sum to exactly 100. Each component is evaluated at
      # FULL precision (no intermediate rounding whatsoever); the sum is rounded ONCE at the end.
      c_group = 30 if QualifyingTest.qualifying_group == GROUP_I
                else (24 if QualifyingTest.qualifying_group == GROUP_II else 0)

      if logical_clock <= QualifyingTest.test_validity_expires_at:
          c_currency = 20
      elif logical_clock <= QualifyingTest.test_validity_expires_at + TEST_VALIDITY_GRACE_DAYS days:
          c_currency = 10
      else:
          c_currency = 0

      c_usage     = 15 * min(hours_per_day, 24) / 24
      c_narrative = 20 * narrative_element_count / 3
      c_portable  = 10 if (portable_prescribed == false)
                       OR (portable_prescribed == true
                           AND Patient.mobility_profile IN {LIMITED_AMBULATORY, ACTIVE_AMBULATORY})
                    else 0
      c_duration  = 5 if length_of_need_months >= LONG_TERM_NEED_MONTHS else 0    # >= 12

      documentation_score = round_half_up(c_group + c_currency + c_usage
                                         + c_narrative + c_portable + c_duration, 2)
    input_set: |
      The CertificateOfMedicalNecessity row being written, the single QualifyingTest row named by
      its qualifying_test_id (any status — QualifyingTest has no status), the single Patient row
      named by its patient_id, and the logical clock. No aggregation over sibling rows.
    constants:
      WEIGHT_GROUP_MAX: 30
      WEIGHT_CURRENCY_MAX: 20
      WEIGHT_USAGE_MAX: 15
      WEIGHT_NARRATIVE_MAX: 20
      WEIGHT_PORTABLE_MAX: 10
      WEIGHT_DURATION_MAX: 5
      GROUP_II_GROUP_POINTS: 24
      CURRENCY_GRACE_POINTS: 10
      LONG_TERM_NEED_MONTHS: 12
      TEST_VALIDITY_GRACE_DAYS: 15
      DOCUMENTATION_PASS_THRESHOLD: 85.00
    precision: |
      Components carry unlimited precision; exactly one rounding happens, on the final sum, to
      2 decimal places with round_half_up. Rounding the components first is forbidden — it changes
      the result. Worked counter-example: GROUP_I, within validity, hours_per_day 7,
      narrative_element_count 1, portable consistent, length_of_need_months 6 gives
      30 + 20 + 4.375 + 6.666... + 10 + 0 = 71.041666... -> 71.04, whereas rounding c_usage to 4.38
      and c_narrative to 6.67 first would give 71.05.

  # ---------------------------------------------------------------------------
  - name: monthly_allowable_cents
    trigger: |
      The RentalContract PENDING_SETUP -> IN_SERVICE transition; the PICKUP_SCHEDULED -> RETURNED
      transition; the SUSPENDED -> ACCRUING and SUSPENDED -> CAP_REACHED resume-billing
      transitions; DELETE /home-oxygen/placements/{placement_id}; and the CLASS_I RecallNotice
      cascade that moves placements to RECALLED_OUT_OF_SERVICE.
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: round EACH line item to whole cents FIRST, then sum the rounded
      # line items. Summing at full precision and rounding once at the end is a different,
      # explicitly rejected order and yields a different total for some configurations
      # (e.g. FEE_SCHEDULE_ADJUSTED with a STATIONARY_CONCENTRATOR + PORTABLE_CONCENTRATOR pair:
      # per-line 6875 + 1627 = 8502, while sum-then-round gives 8502.71030 -> 8503).
      basis_factor = BASIS_FACTOR[RentalContract.pricing_basis]
      monthly_allowable_cents = 0
      for each Placement p with p.contract_id == this contract AND p.status == PLACED,
          processed in created_at ASC order (order does not affect the total, which is a sum):
          unit  = the EquipmentUnit named by p.equipment_unit_id
          base  = CLASS_BASE_CENTS[unit.equipment_class]
          line_raw   = base * ROLE_FACTOR[p.role] * basis_factor * SEQUESTRATION_FACTOR
          line_cents = round_half_up(line_raw, 0)          # <-- per-line rounding, PINNED
          monthly_allowable_cents = monthly_allowable_cents + line_cents
      # A contract with no PLACED placement yields 0.

      # Month posting amount (used by POST /home-oxygen/rental-contracts/{id}/billing-months):
      days_in_month = number of days in the posted service_month
      if service_month == RentalContract.first_service_month:
          days_in_service = days_in_month
                            - (day-of-month of the logical clock at the instant service_status
                               first became IN_SERVICE) + 1
      else:
          days_in_service = days_in_month
      amount_cents = round_half_up(monthly_allowable_cents * days_in_service / days_in_month, 0)
    input_set: |
      Placement rows with contract_id == this contract and status == PLACED (RESERVED, REMOVED and
      RECALLED_OUT_OF_SERVICE placements are excluded), each joined to its EquipmentUnit by
      equipment_unit_id regardless of that unit's status; plus the contract's own pricing_basis.
      No time window applies — every currently-PLACED placement participates. The result is a
      sum, so no tie-break is needed.
    constants:
      CLASS_BASE_CENTS:
        STATIONARY_CONCENTRATOR: 7752
        PORTABLE_CONCENTRATOR: 7340
        LIQUID_RESERVOIR: 9315
        LIQUID_PORTABLE: 8420
        COMPRESSED_CYLINDER: 2520
      ROLE_FACTOR:
        PRIMARY_STATIONARY: 1.00
        PORTABLE: 0.25
        BACKUP: 0.10
      BASIS_FACTOR:
        COMPETITIVE_BID_SINGLE_PAYMENT: 0.7358
        FEE_SCHEDULE_ADJUSTED: 0.9050
        CASH: 1.0000
      SEQUESTRATION_FACTOR: 0.98
    precision: |
      Every line item is rounded to 0 decimal places (whole cents) with round_half_up before it
      enters the sum; the sum itself is exact integer arithmetic. amount_cents is rounded to
      0 decimal places with round_half_up.

  # ---------------------------------------------------------------------------
  - name: cap_month_position
    trigger: |
      POST /home-oxygen/rental-contracts/{contract_id}/billing-months;
      POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse;
      POST /home-oxygen/rental-contracts/{contract_id}/resume-billing;
      GET /home-oxygen/rental-contracts/{contract_id}/cap-summary.
    algorithm: chronological
    formula: |
      # service_month_basis (elapsed calendar months since service began — gaps consume cap months)
      service_month_basis_position =
          12 * (year(candidate_service_month) - year(first_service_month))
          + (month(candidate_service_month) - month(first_service_month)) + 1

      # paid_month_basis (only months actually paid consume cap months — gaps are free)
      paid_month_basis_position = (count of elements in RentalContract.posted_months whose
                                   service_month < candidate_service_month, compared
                                   lexicographically on the YYYY-MM string) + 1

      variant_applied  = SERVICE_MONTH_BASIS if pricing_basis == COMPETITIVE_BID_SINGLE_PAYMENT
                         else PAID_MONTH_BASIS
      effective_position = service_month_basis_position if variant_applied == SERVICE_MONTH_BASIS
                           else paid_month_basis_position
      months_remaining = max(0, cap_month_limit - effective_position)

      # Boundary semantics, pinned:
      #   effective_position <  cap_month_limit -> post succeeds, billing_status stays ACCRUING
      #   effective_position == cap_month_limit -> post succeeds, billing_status becomes CAP_REACHED
      #   effective_position >  cap_month_limit -> ERR_CAP_MONTHS_EXHAUSTED (409), nothing posted
    input_set: |
      RentalContract.first_service_month, RentalContract.pricing_basis,
      RentalContract.cap_month_limit, and the elements of RentalContract.posted_months (every
      element counts — the array only ever contains posted, non-reversed months). For the reverse
      transition the array is evaluated WITHOUT the month being reversed. Candidate month for the
      cap-summary read is RentalContract.last_posted_service_month, or first_service_month when
      posted_months is empty.
    constants:
      MAX_CAP_MONTHS: 36
    precision: "integer month positions; no rounding"
    variants:
      - name: service_month_basis
        when: "RentalContract.pricing_basis == COMPETITIVE_BID_SINGLE_PAYMENT"
        difference: |
          Counts elapsed calendar months from first_service_month through the candidate month
          inclusive, so a month in which nothing was billed still advances the cap position.
          Competitive-bidding single-payment contracts are paid against the rental period, not
          against submitted claims.
      - name: paid_month_basis
        when: "RentalContract.pricing_basis IN {FEE_SCHEDULE_ADJUSTED, CASH}"
        difference: |
          Counts only the months already present in posted_months, so a skipped month does not
          advance the cap position. With first_service_month 2026-08 and posted_months
          [2026-08], posting 2026-10 yields effective_position 3 under service_month_basis but
          2 under paid_month_basis — identical data, different result.

  # ---------------------------------------------------------------------------
  - name: oxygen_safety_risk_score
    trigger: |
      The RentalContract PENDING_SETUP -> IN_SERVICE and PENDING_SETUP -> SETUP_FAILED transitions
      (INITIAL_ASSESSMENT variant); POST /home-oxygen/patients/{patient_id}/risk-reassessments and
      POST /home-oxygen/placements/{placement_id}/malfunction (ONGOING_SURVEILLANCE variant);
      GET /home-oxygen/patients/{patient_id}/risk-assessment returns BOTH variants without
      persisting either.
    algorithm: weighted_scoring
    formula: |
      # Five factors, each on a 0..100 scale, computed identically for both variants.
      setup_stop = the RouteStop with stop_type == SETUP_DELIVERY and status == COMPLETED whose
                   contract_id belongs to a RentalContract of this patient, ranked
                   completed_at DESC, then created_at ASC; null when no such stop exists
      factor_smoking    = 100 if setup_stop is not null AND setup_stop.smoking_in_home == true else 0
      factor_electrical = 100 if setup_stop is not null AND setup_stop.electrical_pass == false else 0
      factor_teachback  = (5 - setup_stop.patient_teachback_score) * 20 if setup_stop is not null else 0
      active_cmn = the CertificateOfMedicalNecessity with patient_id == this patient and
                   status == ACTIVE (at most one exists — see validations priority 62)
      factor_flow = 0   if active_cmn is null OR active_cmn.prescribed_lpm <= 2.0
                  = 20  if 2.0 <  active_cmn.prescribed_lpm <= 4.0
                  = 40  if 4.0 <  active_cmn.prescribed_lpm <= 6.0
                  = 60  if 6.0 <  active_cmn.prescribed_lpm <= 9.0
                  = 100 if active_cmn.prescribed_lpm > 9.0
      incident_total = sum of RentalContract.malfunction_count over RentalContract rows with
                       patient_id == this patient AND billing_status != CLOSED
      factor_incident = min(100, INCIDENT_POINTS_PER_REPORT * incident_total)      # 30 each

      # --- INITIAL_ASSESSMENT: weighted average -------------------------------
      initial_assessment_score = round_half_up(
            0.30 * factor_smoking
          + 0.15 * factor_electrical
          + 0.15 * factor_teachback
          + 0.30 * factor_flow
          + 0.10 * factor_incident, 2)

      # --- ONGOING_SURVEILLANCE: worst-factor plus breadth escalation ---------
      base_factor    = max(factor_smoking, factor_electrical, factor_teachback,
                           factor_flow, factor_incident)
      nonzero_count  = count of those five factors whose value > 0
      ongoing_surveillance_score = round_half_up(
          min(100.00, base_factor + ESCALATION_STEP * max(0, nonzero_count - 1)), 2)

      # --- persisted result ---------------------------------------------------
      Patient.oxygen_safety_risk_score = the score of the variant selected by the trigger
      Patient.risk_variant_applied     = INITIAL_ASSESSMENT or ONGOING_SURVEILLANCE accordingly
      Patient.compliance_hold          = (Patient.oxygen_safety_risk_score >= COMPLIANCE_HOLD_THRESHOLD)
    input_set: |
      (a) RouteStop rows with stop_type == SETUP_DELIVERY and status == COMPLETED whose contract_id
      belongs to a RentalContract with patient_id == this patient — the single most recent one by
      completed_at DESC, tie-broken by created_at ASC; (b) the one CertificateOfMedicalNecessity
      with patient_id == this patient and status == ACTIVE; (c) RentalContract rows with
      patient_id == this patient and billing_status != CLOSED, summed over malfunction_count with
      no time window.
    constants:
      WEIGHT_SMOKING: 0.30
      WEIGHT_ELECTRICAL: 0.15
      WEIGHT_TEACHBACK: 0.15
      WEIGHT_FLOW: 0.30
      WEIGHT_INCIDENT: 0.10
      TEACHBACK_POINTS_PER_MISSED_STEP: 20
      INCIDENT_POINTS_PER_REPORT: 30
      ESCALATION_STEP: 5
      FLOW_BAND_LOW_LPM: 2.0
      FLOW_BAND_MID_LPM: 4.0
      FLOW_BAND_HIGH_LPM: 6.0
      FLOW_BAND_VERY_HIGH_LPM: 9.0
      COMPLIANCE_HOLD_THRESHOLD: 70.00
    precision: |
      Factors are exact integers. Each variant applies exactly one round_half_up to 2 decimal
      places on its own final expression; no intermediate rounding.
    variants:
      - name: INITIAL_ASSESSMENT
        when: "Applied by the RentalContract PENDING_SETUP -> IN_SERVICE and PENDING_SETUP -> SETUP_FAILED transitions (the in-home setup education and safety assessment)."
        difference: |
          Averages the five factors under fixed weights, so a single catastrophic factor is diluted
          by the four benign ones.
      - name: ONGOING_SURVEILLANCE
        when: "Applied by POST /home-oxygen/patients/{patient_id}/risk-reassessments and by POST /home-oxygen/placements/{placement_id}/malfunction (continued-need surveillance)."
        difference: |
          Takes the worst single factor and escalates by 5 points per additional non-zero factor,
          so it can be dramatically higher than the average on identical factor values. Factor
          vector (smoking 0, electrical 100, teachback 60, flow 60, incident 30) yields
          initial_assessment_score 45.00 and ongoing_surveillance_score 100.00.

  # ---------------------------------------------------------------------------
  - name: equipment_selection
    trigger: "POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments"
    algorithm: constraint_propagation
    formula: |
      prescribed_lpm = the prescribed_lpm of the CertificateOfMedicalNecessity named by
                       RentalContract.cmn_id
      branch         = the Branch named by the contract's Patient.branch_id
      today          = the logical clock's date (YYYY-MM-DD)

      # (a) eligibility filter — the candidate set, explicit predicate over entity fields
      candidates = EquipmentUnit rows where
            branch_id == branch.id
        AND status == IN_STOCK
        AND equipment_class IN REQUIRED_CLASSES[body.role]
        AND max_continuous_lpm >= prescribed_lpm
        AND next_pm_due_date >= today
        AND NOT EXISTS a RecallNotice with model_code == unit.model_code
                       AND status IN {OPEN, IN_REMEDIATION}
        AND (equipment_class NOT IN {LIQUID_RESERVOIR, LIQUID_PORTABLE}
             OR branch.liquid_oxygen_certified == true)

      # (b) ranking expression — tightest adequate unit first (minimise stranded capacity)
      order candidates by (max_continuous_lpm - prescribed_lpm) ASC

      # (c) tie-break — prefer the unit whose maintenance is furthest away, then oldest row
      then by next_pm_due_date DESC, then by created_at ASC

      # (d) empty-candidate-set fallback
      if candidates is empty: reject with ERR_NO_ELIGIBLE_EQUIPMENT (409); no Placement is created

      selected_unit = the first candidate under the ordering above
    input_set: |
      EquipmentUnit rows with status == IN_STOCK and branch_id == the contract's Patient.branch_id,
      filtered as above; RecallNotice rows with status IN {OPEN, IN_REMEDIATION} act only as an
      exclusion predicate. Units in RESERVED, DEPLOYED, IN_QUARANTINE or RETIRED never participate.
    constants:
      REQUIRED_CLASSES:
        PRIMARY_STATIONARY: [STATIONARY_CONCENTRATOR, LIQUID_RESERVOIR]
        PORTABLE: [PORTABLE_CONCENTRATOR, LIQUID_PORTABLE, COMPRESSED_CYLINDER]
        BACKUP: [COMPRESSED_CYLINDER, STATIONARY_CONCENTRATOR]
    precision: "no arithmetic rounding; max_continuous_lpm and prescribed_lpm are compared at one decimal place"

  # ---------------------------------------------------------------------------
  - name: travel_supply_authorization
    trigger: "POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"
    algorithm: waterfall_allocation
    formula: |
      # The evaluation order below is PINNED because the dependency graph is circular-looking:
      # the reserve percentage is keyed on trip_hours, the usable hours are keyed on both
      # trip_hours and hours_per_day, and the handling surcharge is keyed on the cylinder count
      # that the reserve produced. Crucially, STEP 7 reads cylinders_raw (the PRE-surcharge count)
      # and NOT supply_cylinders_authorized — otherwise the surcharge would feed the threshold that
      # produced it and the value would be undefined.
      cmn = the CertificateOfMedicalNecessity named by RentalContract.cmn_id

      STEP 0: trip_hours = floor((return_utc - depart_utc) in seconds / 3600)

      STEP 1: altitude_gain = max(0, destination_altitude_feet - Patient.altitude_feet)
              altitude_factor = min(ALTITUDE_FACTOR_MAX,
                                    round_half_up(1.00 + ALTITUDE_STEP_FACTOR
                                                  * ceil(altitude_gain / 1000), 2))

      STEP 2: effective_lpm = round_half_up(cmn.prescribed_lpm * altitude_factor, 2)

      STEP 3: usable_hours = min(trip_hours, cmn.hours_per_day * ceil(trip_hours / 24))
              base_liters  = floor(effective_lpm * 60 * usable_hours)

      STEP 4: reserve_pct = 0.20 if trip_hours <= RESERVE_TIER_1_HOURS          # <= 24
                          = 0.35 if trip_hours <= RESERVE_TIER_2_HOURS          # 25..72
                          = 0.50 otherwise
              reserve_liters = floor(base_liters * reserve_pct)

      STEP 5: required_liters = base_liters + reserve_liters

      STEP 6: cylinders_raw = ceil(required_liters / CYLINDER_LITERS)            # 680 L per E-cyl

      STEP 7: handling_surcharge_cylinders = 1 if cylinders_raw >= HANDLING_SURCHARGE_THRESHOLD
                                            else 0                              # >= 6
      STEP 8: supply_cylinders_authorized = cylinders_raw + handling_surcharge_cylinders

      if supply_cylinders_authorized > MAX_TRAVEL_CYLINDERS:                     # > 12
          reject with ERR_TRAVEL_SUPPLY_EXCEEDS_LIMIT (422); no TravelAuthorization is created
    input_set: |
      The TravelAuthorization request body, the RentalContract's CertificateOfMedicalNecessity
      (whatever its status — the endpoint's own validation at priority 20 requires it to be ACTIVE)
      and the contract's Patient.altitude_feet. No aggregation over other rows.
    constants:
      ALTITUDE_STEP_FACTOR: 0.03
      ALTITUDE_FACTOR_MAX: 1.30
      RESERVE_TIER_1_HOURS: 24
      RESERVE_TIER_2_HOURS: 72
      RESERVE_PCT_TIER_1: 0.20
      RESERVE_PCT_TIER_2: 0.35
      RESERVE_PCT_TIER_3: 0.50
      CYLINDER_LITERS: 680
      HANDLING_SURCHARGE_THRESHOLD: 6
      MAX_TRAVEL_CYLINDERS: 12
    precision: |
      altitude_factor and effective_lpm: 2 decimal places, round_half_up. base_liters and
      reserve_liters: floor to whole litres. cylinders_raw: ceil to whole cylinders. Each step is
      rounded before the next step reads it — carrying full precision forward is a different,
      rejected order.

  # ---------------------------------------------------------------------------
  - name: route_liters_committed
    trigger: |
      POST /home-oxygen/route-stops; POST /home-oxygen/route-stops/{stop_id}/cancel;
      the DeliveryRoute PLANNING -> LOCKED transition; and
      GET /home-oxygen/delivery-routes/{route_id}/manifest.
    algorithm: aggregation
    formula: |
      # per-stop component (stored on RouteStop.liters_committed at creation and never revised)
      if stop_type == PORTABLE_REFILL:
          liters_committed = LIQUID_PORTABLE_CAPACITY_LITERS            # 1085
      elif stop_type IN {SETUP_DELIVERY, TANK_EXCHANGE, MAINTENANCE_SWAP}:
          liters_committed = cylinders_requested * CYLINDER_LITERS      # 680 each
      else:                                                            # PICKUP
          liters_committed = 0

      # route roll-up
      DeliveryRoute.total_o2_liters_committed =
          sum of liters_committed over RouteStop rows with route_id == this route
          AND status IN {PLANNED, COMPLETED, MISSED}
      DeliveryRoute.refill_slots_used =
          count of RouteStop rows with route_id == this route
          AND stop_type == PORTABLE_REFILL AND status IN {PLANNED, COMPLETED}
      DeliveryRoute.planned_stop_count =
          count of RouteStop rows with route_id == this route AND status == PLANNED
    input_set: |
      (a) source entity RouteStop with explicit status filters as written above — CANCELLED stops
      are excluded from all three roll-ups, MISSED stops keep their litres committed but are not
      counted as planned; (b) window: every stop of the route regardless of window_start_utc, with
      no time bound; (c) all three roll-ups are order-insensitive (a sum and two counts), so no
      tie-break is required.
    constants:
      CYLINDER_LITERS: 680
      LIQUID_PORTABLE_CAPACITY_LITERS: 1085
    precision: "whole litres; integer arithmetic only"

  # ---------------------------------------------------------------------------
  - name: recall_remediation_deadline
    trigger: "POST /home-oxygen/recall-notices (RecallNotice fields are stamped once at creation)"
    algorithm: threshold
    formula: |
      days = CLASS_I_DAYS   if severity == CLASS_I      # 5
           = CLASS_II_DAYS  if severity == CLASS_II     # 30
           = CLASS_III_DAYS                            # 90
      remediation_deadline_utc = issued_at + days days

      affected_unit_count = count of EquipmentUnit rows with model_code == notice.model_code
                            AND status IN {IN_STOCK, RESERVED, DEPLOYED, IN_QUARANTINE}
                            evaluated BEFORE the CLASS_I quarantine cascade runs; this snapshot is
                            never recomputed afterwards
      auto_quarantined_unit_count =
          (count of EquipmentUnit rows with model_code == notice.model_code
           AND status IN {IN_STOCK, RESERVED, DEPLOYED} at that same instant) if severity == CLASS_I
          else 0
      remediated_unit_count = live count of EquipmentUnit rows with
          model_code == notice.model_code AND recall_remediated_at is not null
          AND recall_remediated_at >= notice.issued_at
    input_set: |
      EquipmentUnit rows with model_code == the notice's model_code; RETIRED units are excluded
      from every count. The affected_unit_count and auto_quarantined_unit_count snapshots are taken
      at the notice's issued_at instant, before any cascade mutation; remediated_unit_count is a
      live recount with the inclusive lower bound recall_remediated_at >= issued_at.
    constants:
      CLASS_I_DAYS: 5
      CLASS_II_DAYS: 30
      CLASS_III_DAYS: 90
    precision: "whole days; remediation_deadline_utc is ISO 8601 UTC with three fractional digits"

  # ---------------------------------------------------------------------------
  - name: malfunction_severity_tier
    trigger: "POST /home-oxygen/placements/{placement_id}/malfunction"
    algorithm: threshold
    formula: |
      if symptom IN {NO_FLOW, LOW_PURITY} OR oxygen_gap_minutes >= TIER_1_GAP_MINUTES:   # >= 60
          severity_tier = TIER_1
      elif symptom IN {ALARM_CONTINUOUS, POWER_FAILURE} OR oxygen_gap_minutes >= TIER_2_GAP_MINUTES:  # >= 15
          severity_tier = TIER_2
      else:
          severity_tier = TIER_3
      # TIER_1 additionally drives Placement PLACED -> REMOVED (removal_reason MALFUNCTION) and
      # EquipmentUnit DEPLOYED -> IN_QUARANTINE (quarantine_reason MALFUNCTION); TIER_2 and TIER_3
      # leave the placement and the unit in service.
    input_set: "Exactly the request body of the malfunction report; no other row participates in tier selection."
    constants:
      TIER_1_GAP_MINUTES: 60
      TIER_2_GAP_MINUTES: 15
    precision: "integer minutes; no rounding"

  # ---------------------------------------------------------------------------
  - name: recert_due_date
    trigger: "The CertificateOfMedicalNecessity PHYSICIAN_SIGNED -> ACTIVE transition"
    algorithm: chronological
    formula: |
      interval_months = RECERT_MONTHS_GROUP_I  if QualifyingTest.qualifying_group == GROUP_I   # 12
                      = RECERT_MONTHS_GROUP_II                                                # 3
      months = min(interval_months, length_of_need_months)
      recert_due_date = add_months(initial_date, months)
      # add_months keeps the day-of-month; when the target month has fewer days, it clamps to the
      # last day of the target month (2026-08-31 + 6 months -> 2027-02-28).
    input_set: |
      The certificate's own initial_date and length_of_need_months plus the qualifying_group of the
      single QualifyingTest named by qualifying_test_id.
    constants:
      RECERT_MONTHS_GROUP_I: 12
      RECERT_MONTHS_GROUP_II: 3
    precision: "whole calendar months; recert_due_date is an ISO date (YYYY-MM-DD)"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Domain ordering rationale: authentication and authorization first; then segregation of duties
# (a compliance control that must fire before any resource is read); then path existence
# left-to-right; then request-schema shape; then body foreign-key existence; then optimistic
# concurrency; then uniqueness; then state preconditions; then clinical safety and compliance;
# then referential coherence between clinical documents; then temporal/interval rules; then
# capacity and inventory constraints; and finally fiscal (capped-rental) checks. Safety precedes
# capacity, and capacity precedes money — a Lincare branch may not place unsafe equipment to
# protect revenue.
validations:

  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role request headers are present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in §1.7."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's roles list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "On CMN approval, X-User-ID differs from BOTH CertificateOfMedicalNecessity.submitted_by_user_id and CertificateOfMedicalNecessity.signed_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /home-oxygen/cmns/{cmn_id}/approve"

  - priority: 5
    category: existence
    check: "The {branch_id} path segment resolves to an existing Branch."
    error_id: ERR_BRANCH_NOT_FOUND
    http_status: 404
    applies_to: "GET /home-oxygen/branches/{branch_id}, PATCH /home-oxygen/branches/{branch_id}"

  - priority: 6
    category: existence
    check: "The {patient_id} path segment resolves to an existing Patient."
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {patient_id}"

  - priority: 7
    category: existence
    check: "The {qualifying_test_id} path segment resolves to an existing QualifyingTest."
    error_id: ERR_QUALIFYING_TEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /home-oxygen/qualifying-tests/{qualifying_test_id}"

  - priority: 8
    category: existence
    check: "The {cmn_id} path segment resolves to an existing CertificateOfMedicalNecessity."
    error_id: ERR_CMN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {cmn_id}"

  - priority: 9
    category: existence
    check: "The {contract_id} path segment resolves to an existing RentalContract."
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {contract_id}"

  - priority: 10
    category: existence
    check: "The {equipment_unit_id} path segment resolves to an existing EquipmentUnit."
    error_id: ERR_EQUIPMENT_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {equipment_unit_id}"

  - priority: 11
    category: existence
    check: "The {placement_id} path segment resolves to an existing Placement."
    error_id: ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {placement_id}"

  - priority: 12
    category: existence
    check: "The {route_id} path segment resolves to an existing DeliveryRoute."
    error_id: ERR_ROUTE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {route_id}"

  - priority: 13
    category: existence
    check: "The {stop_id} path segment resolves to an existing RouteStop."
    error_id: ERR_ROUTE_STOP_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {stop_id}"

  - priority: 14
    category: existence
    check: "The {recall_notice_id} path segment resolves to an existing RecallNotice."
    error_id: ERR_RECALL_NOTICE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {recall_notice_id}"

  - priority: 15
    category: existence
    check: "The {travel_authorization_id} path segment resolves to an existing TravelAuthorization."
    error_id: ERR_TRAVEL_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {travel_authorization_id}"

  - priority: 16
    category: existence
    check: "The {service_month} path segment matches the service_month of an element of RentalContract.posted_months."
    error_id: ERR_POSTED_MONTH_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse"

  - priority: 17
    category: business_constraint
    check: "Every field declared required in the endpoint's §1.5 input is present, every supplied value matches its declared type, and every numeric value falls inside its §1.1 constraints range. Fields not declared in the endpoint's input are ignored, and fields whose source is system or computed are ignored when supplied."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST, PATCH and DELETE endpoints"

  - priority: 18
    category: business_constraint
    check: "Every supplied enum-typed value is a member of that field's declared constraint set."
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "all POST and PATCH endpoints that accept an enum field, and all GET list endpoints that accept an enum filter"

  - priority: 19
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 20
    category: existence
    check: "A branch_id or receiving_branch_id supplied in the request body resolves to an existing Branch."
    error_id: ERR_BRANCH_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/patients, POST /home-oxygen/equipment-units, POST /home-oxygen/delivery-routes, POST /home-oxygen/patients/{patient_id}/transfer-requests, POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 21
    category: existence
    check: "A patient_id supplied in the request body resolves to an existing Patient."
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/qualifying-tests, POST /home-oxygen/cmns, POST /home-oxygen/rental-contracts"

  - priority: 22
    category: existence
    check: "A qualifying_test_id supplied in the request body resolves to an existing QualifyingTest."
    error_id: ERR_QUALIFYING_TEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/cmns"

  - priority: 23
    category: existence
    check: "A cmn_id supplied in the request body resolves to an existing CertificateOfMedicalNecessity."
    error_id: ERR_CMN_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/rental-contracts"

  - priority: 24
    category: existence
    check: "A contract_id supplied in the request body resolves to an existing RentalContract."
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 25
    category: existence
    check: "A route_id supplied in the request body resolves to an existing DeliveryRoute."
    error_id: ERR_ROUTE_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 26
    category: existence
    check: "A replaces_unit_id supplied in the request body resolves to an existing EquipmentUnit."
    error_id: ERR_EQUIPMENT_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /home-oxygen/equipment-units"

  - priority: 27
    category: state
    check: "The body's expected_patient_version equals the current Patient.version (concurrency_rules[cmn-create-stale-patient])."
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /home-oxygen/cmns"

  - priority: 28
    category: state
    check: "The body's expected_contract_version equals the current RentalContract.version (concurrency_rules[travel-auth-create-stale-contract])."
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 29
    category: business_constraint
    check: "No other Patient row already carries the supplied mrn."
    error_id: ERR_DUPLICATE_MRN
    http_status: 409
    applies_to: "POST /home-oxygen/patients"

  - priority: 30
    category: business_constraint
    check: "No other EquipmentUnit row already carries the supplied serial_number."
    error_id: ERR_DUPLICATE_SERIAL_NUMBER
    http_status: 409
    applies_to: "POST /home-oxygen/equipment-units"

  - priority: 31
    category: state
    check: "The target entity's state field equals one of the from: states declared for this trigger in §1.2 (generic invalid-transition and terminal-state lockdown guard)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 32
    category: state
    check: "CertificateOfMedicalNecessity.revision_round < MAX_REVISION_ROUNDS (3)."
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /home-oxygen/cmns/{cmn_id}/return-for-correction"

  - priority: 33
    category: state
    check: "The governing Patient.status == ACTIVE."
    error_id: ERR_PATIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /home-oxygen/qualifying-tests, POST /home-oxygen/cmns, POST /home-oxygen/cmns/{cmn_id}/submit, POST /home-oxygen/rental-contracts, POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments, POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 34
    category: state
    check: "RentalContract.billing_status != CLOSED."
    error_id: ERR_CONTRACT_CLOSED
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months, POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse, POST /home-oxygen/rental-contracts/{contract_id}/resume-billing, POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments, POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 35
    category: state
    check: "RentalContract.billing_status == ACCRUING (a SUSPENDED or CAP_REACHED contract cannot accept a new posted month)."
    error_id: ERR_CONTRACT_BILLING_SUSPENDED
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"

  - priority: 36
    category: state
    check: "RentalContract.service_status == IN_SERVICE (on POST /home-oxygen/route-stops this applies only when body.stop_type IN {TANK_EXCHANGE, PORTABLE_REFILL, PICKUP, MAINTENANCE_SWAP}; a SETUP_DELIVERY stop is by definition created while the contract is still PENDING_SETUP)."
    error_id: ERR_CONTRACT_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months, POST /home-oxygen/route-stops"

  - priority: 37
    category: state
    check: "The stop's DeliveryRoute.status == DISPATCHED."
    error_id: ERR_ROUTE_NOT_DISPATCHED
    http_status: 409
    applies_to: "POST /home-oxygen/route-stops/{stop_id}/complete, POST /home-oxygen/route-stops/{stop_id}/complete-setup, POST /home-oxygen/route-stops/{stop_id}/miss"

  - priority: 38
    category: state
    check: "The DeliveryRoute.status IN {PLANNING, LOCKED}."
    error_id: ERR_ROUTE_NOT_EDITABLE
    http_status: 409
    applies_to: "POST /home-oxygen/route-stops, POST /home-oxygen/route-stops/{stop_id}/cancel"

  - priority: 39
    category: state
    check: "RouteStop.stop_type == SETUP_DELIVERY for the complete-setup endpoint, and RouteStop.stop_type IN {TANK_EXCHANGE, PORTABLE_REFILL, PICKUP, MAINTENANCE_SWAP} for the generic complete endpoint."
    error_id: ERR_STOP_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /home-oxygen/route-stops/{stop_id}/complete, POST /home-oxygen/route-stops/{stop_id}/complete-setup"

  - priority: 40
    category: state
    check: "RecallNotice.remediated_unit_count >= RecallNotice.affected_unit_count."
    error_id: ERR_RECALL_NOT_REMEDIATED
    http_status: 409
    applies_to: "POST /home-oxygen/recall-notices/{recall_notice_id}/close"

  - priority: 41
    category: state
    check: "The logical clock's date >= Patient.transfer_effective_date."
    error_id: ERR_TRANSFER_NOT_DUE
    http_status: 409
    applies_to: "POST /home-oxygen/patients/{patient_id}/transfer-requests/complete"

  - priority: 42
    category: state
    check: "RentalContract.service_status IN {RETURNED, SETUP_FAILED}."
    error_id: ERR_CONTRACT_NOT_RETURNED
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/close"

  - priority: 49
    category: business_safety
    check: |
      The logical clock <= QualifyingTest.test_validity_expires_at + TEST_VALIDITY_GRACE_DAYS
      (15 days). Ordered BEFORE the documentation-completeness threshold at priority 50 on purpose:
      once a study is past its grace window c_currency is 0, and the remaining five components cap
      at 80.00, so a stale-study submission would otherwise always be reported as
      ERR_DOCUMENTATION_INCOMPLETE and this rule could never be observed. Staleness is also the
      more specific and more actionable finding — the fix is a new study, not a better narrative.
    error_id: ERR_QUALIFYING_TEST_STALE
    http_status: 422
    applies_to: "POST /home-oxygen/cmns/{cmn_id}/submit"

  - priority: 50
    category: business_safety
    check: "calculations.cmn_documentation_score for the certificate >= DOCUMENTATION_PASS_THRESHOLD (85.00)."
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /home-oxygen/cmns/{cmn_id}/submit, POST /home-oxygen/cmns/{cmn_id}/approve"

  - priority: 51
    category: business_safety
    check: |
      The linked QualifyingTest.qualifying_group != NON_QUALIFYING. Enforced at DRAFT creation
      rather than at submission: a NON_QUALIFYING study contributes c_group 0, and the remaining
      five documentation components cap at 70.00, so a certificate drafted on one could never
      clear the priority-50 threshold anyway. Rejecting at creation keeps the error reachable
      and stops the unusable draft from ever existing.
    error_id: ERR_TEST_NON_QUALIFYING
    http_status: 422
    applies_to: "POST /home-oxygen/cmns"

  - priority: 53
    category: business_safety
    check: "The governing Patient.compliance_hold == false."
    error_id: ERR_PATIENT_ON_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments, POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations, POST /home-oxygen/travel-authorizations/{travel_authorization_id}/approve"

  - priority: 54
    category: business_safety
    check: "When body.role == PORTABLE, the contract's CertificateOfMedicalNecessity.portable_prescribed == true AND the Patient.mobility_profile IN {LIMITED_AMBULATORY, ACTIVE_AMBULATORY}."
    error_id: ERR_PORTABLE_NOT_INDICATED
    http_status: 422
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments"

  - priority: 55
    category: business_safety
    check: "When body.stop_type == PORTABLE_REFILL, the named contract has at least one Placement with status == PLACED whose EquipmentUnit.equipment_class == LIQUID_PORTABLE."
    error_id: ERR_REFILL_REQUIRES_LIQUID_PORTABLE
    http_status: 422
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 56
    category: business_safety
    check: "When body.stop_type == SETUP_DELIVERY, the named contract has at least one Placement with status == RESERVED."
    error_id: ERR_NO_RESERVED_EQUIPMENT
    http_status: 422
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 60
    category: business_referential
    check: "The QualifyingTest named by body.qualifying_test_id has patient_id == body.patient_id."
    error_id: ERR_TEST_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /home-oxygen/cmns"

  - priority: 61
    category: business_referential
    check: "The CertificateOfMedicalNecessity named by body.cmn_id has patient_id == body.patient_id."
    error_id: ERR_CMN_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /home-oxygen/rental-contracts"

  - priority: 62
    category: business_referential
    check: "No other RentalContract with the same patient_id has billing_status != CLOSED (at most one open contract per patient, so every selector that says 'the patient's contract' resolves to exactly one row)."
    error_id: ERR_PATIENT_HAS_OPEN_CONTRACT
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts"

  - priority: 63
    category: business_referential
    check: "The RentalContract's linked CertificateOfMedicalNecessity.status == ACTIVE."
    error_id: ERR_CMN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts, POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments, POST /home-oxygen/rental-contracts/{contract_id}/billing-months, POST /home-oxygen/rental-contracts/{contract_id}/resume-billing, POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 64
    category: business_referential
    check: "The DeliveryRoute named by body.route_id has branch_id == the Patient.branch_id of the RentalContract named by body.contract_id."
    error_id: ERR_STOP_BRANCH_MISMATCH
    http_status: 422
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 65
    category: business_referential
    check: "body.receiving_branch_id != the Patient's current branch_id."
    error_id: ERR_RECEIVING_BRANCH_INVALID
    http_status: 422
    applies_to: "POST /home-oxygen/patients/{patient_id}/transfer-requests, POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 66
    category: business_referential
    check: "The EquipmentUnit named by body.replaces_unit_id has status IN {IN_QUARANTINE, RETIRED}."
    error_id: ERR_REPLACED_UNIT_NOT_REPLACEABLE
    http_status: 422
    applies_to: "POST /home-oxygen/equipment-units"

  - priority: 67
    category: business_referential
    check: "No Placement with contract_id == this contract has status == RECALLED_OUT_OF_SERVICE."
    error_id: ERR_CONTRACT_HAS_RECALLED_EQUIPMENT
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/resume-billing"

  - priority: 70
    category: business_temporal
    check: "body.tested_at <= the logical clock."
    error_id: ERR_TEST_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /home-oxygen/qualifying-tests"

  - priority: 71
    category: business_temporal
    check: "body.shift_end_utc > body.shift_start_utc, and the UTC date of body.shift_start_utc equals body.service_date."
    error_id: ERR_INVALID_SHIFT
    http_status: 422
    applies_to: "POST /home-oxygen/delivery-routes"

  - priority: 72
    category: business_temporal
    check: "body.window_end_utc > body.window_start_utc."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 73
    category: business_temporal
    check: "body.window_start_utc >= route.shift_start_utc AND body.window_end_utc + Branch.tank_exchange_buffer_minutes <= route.shift_end_utc."
    error_id: ERR_WINDOW_OUTSIDE_SHIFT
    http_status: 422
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 74
    category: business_temporal
    check: "The new stop's BUFFERED HALF-OPEN interval [window_start_utc, window_end_utc + Branch.tank_exchange_buffer_minutes) does not intersect the buffered half-open interval of any existing RouteStop on the same DeliveryRoute with status == PLANNED. Adjacency does not conflict: a new stop whose window_start_utc equals an existing stop's buffered end instant is accepted."
    error_id: ERR_ROUTE_STOP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 75
    category: business_temporal
    check: "body.return_utc > body.depart_utc."
    error_id: ERR_INVALID_TRAVEL_INTERVAL
    http_status: 422
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 76
    category: business_temporal
    check: "The new authorization's CLOSED interval [depart_utc, return_utc] does not intersect the closed interval of any existing TravelAuthorization on the same RentalContract with status IN {REQUESTED, APPROVED}. Touching endpoints DO conflict: a new authorization whose depart_utc equals an existing authorization's return_utc is rejected. No buffer is applied."
    error_id: ERR_TRAVEL_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 77
    category: business_temporal
    check: "body.transfer_effective_date >= the logical clock's date."
    error_id: ERR_TRANSFER_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /home-oxygen/patients/{patient_id}/transfer-requests"

  - priority: 78
    category: business_temporal
    check: "body.to_iso8601 is strictly greater than the current logical clock (the clock is monotone forward-only)."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /home-oxygen/_clock/set_current_utc"

  - priority: 79
    category: business_temporal
    check: "body.service_month >= RentalContract.first_service_month (lexicographic comparison on YYYY-MM)."
    error_id: ERR_SERVICE_MONTH_BEFORE_START
    http_status: 422
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"

  - priority: 80
    category: business_temporal
    check: "body.service_month <= the YYYY-MM of the logical clock."
    error_id: ERR_SERVICE_MONTH_IN_FUTURE
    http_status: 422
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"

  - priority: 81
    category: business_temporal
    check: "body.service_month is not already the service_month of an element of RentalContract.posted_months."
    error_id: ERR_SERVICE_MONTH_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"

  - priority: 85
    category: business_constraint
    check: "DeliveryRoute.planned_stop_count >= 1 (a route with an empty stop list cannot be locked)."
    error_id: ERR_ROUTE_HAS_NO_STOPS
    http_status: 422
    applies_to: "POST /home-oxygen/delivery-routes/{route_id}/lock"

  - priority: 86
    category: business_constraint
    check: "DeliveryRoute.refill_slots_used <= the route's Branch.refill_capacity_per_day."
    error_id: ERR_REFILL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /home-oxygen/delivery-routes/{route_id}/lock"

  - priority: 87
    category: business_constraint
    check: "No Placement with contract_id == this contract, the same role, and status IN {RESERVED, PLACED} already exists."
    error_id: ERR_ROLE_ALREADY_OCCUPIED
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments"

  - priority: 88
    category: business_constraint
    check: "The candidate set produced by calculations.equipment_selection is non-empty."
    error_id: ERR_NO_ELIGIBLE_EQUIPMENT
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments"

  - priority: 89
    category: business_constraint
    check: "body.cylinders_requested is 0 (or omitted) when body.stop_type IN {PICKUP, PORTABLE_REFILL}."
    error_id: ERR_CYLINDERS_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /home-oxygen/route-stops"

  - priority: 90
    category: business_constraint
    check: "When body.equipment_class IN {LIQUID_RESERVOIR, LIQUID_PORTABLE}, the named Branch.liquid_oxygen_certified == true."
    error_id: ERR_BRANCH_NOT_LIQUID_CERTIFIED
    http_status: 422
    applies_to: "POST /home-oxygen/equipment-units"

  - priority: 91
    category: business_constraint
    check: "No RentalContract with patient_id == this patient has service_status IN {PENDING_SETUP, IN_SERVICE, PICKUP_SCHEDULED}."
    error_id: ERR_PATIENT_HAS_ACTIVE_SERVICE
    http_status: 409
    applies_to: "POST /home-oxygen/patients/{patient_id}/discharge"

  - priority: 92
    category: business_constraint
    check: "calculations.travel_supply_authorization yields supply_cylinders_authorized <= MAX_TRAVEL_CYLINDERS (12)."
    error_id: ERR_TRAVEL_SUPPLY_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"

  - priority: 95
    category: business_fiscal
    check: "calculations.cap_month_position yields effective_position <= RentalContract.cap_month_limit."
    error_id: ERR_CAP_MONTHS_EXHAUSTED
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months, POST /home-oxygen/rental-contracts/{contract_id}/resume-billing"

  - priority: 96
    category: business_fiscal
    check: "When RentalContract.billing_status == CAP_REACHED, calculations.cap_month_position recomputed over posted_months WITHOUT the reversed month yields effective_position < RentalContract.cap_month_limit."
    error_id: ERR_REVERSAL_WOULD_NOT_CLEAR_CAP
    http_status: 409
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse"

  - priority: 97
    category: business_fiscal
    check: "RentalContract.monthly_allowable_cents > 0 (a contract with no PLACED equipment has nothing to bill)."
    error_id: ERR_NO_PLACED_EQUIPMENT
    http_status: 422
    applies_to: "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------- Branch ------------------------------------
  - method: POST
    path: "/home-oxygen/branches"
    description: "Register a service branch (Lincare service centre)."
    roles: [BranchManager]
    code: 201
    input: [name, state_code, "competitive_bid_area?", "liquid_oxygen_certified?", "refill_capacity_per_day?", "tank_exchange_buffer_minutes?"]
    output: Branch
    side_effects: []

  - method: GET
    path: "/home-oxygen/branches"
    description: "List branches."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor, Physician]
    code: 200
    input: ["state_code?", "competitive_bid_area?", "liquid_oxygen_certified?", "limit?", "offset?"]
    output: Branch[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/branches/{branch_id}"
    description: "Read one branch."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor, Physician]
    code: 200
    input: []
    output: Branch
    side_effects: []

  - method: PATCH
    path: "/home-oxygen/branches/{branch_id}"
    description: "Adjust branch operating parameters (refill capacity, turnaround buffer, liquid certification)."
    roles: [BranchManager]
    code: 200
    input: ["refill_capacity_per_day?", "tank_exchange_buffer_minutes?", "liquid_oxygen_certified?"]
    output: Branch
    side_effects:
      - "increments Branch.version by 1"

  # ------------------------------- Patient -----------------------------------
  - method: POST
    path: "/home-oxygen/patients"
    description: "Admit a patient to a branch's service population."
    roles: [IntakeCoordinator]
    code: 201
    input: [mrn, full_name, branch_id, payer_type, mobility_profile, "altitude_feet?"]
    output: Patient
    side_effects:
      - "sets Patient.status := ACTIVE, current_cmn_status := NONE, oxygen_safety_risk_score := 0.00, risk_variant_applied := NONE, compliance_hold := false"

  - method: GET
    path: "/home-oxygen/patients"
    description: "List patients, filterable by serving branch, pending receiving branch, lifecycle status, payer and compliance posture."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor, Physician]
    code: 200
    input: ["branch_id?", "transfer_to_branch_id?", "status?", "payer_type?", "mobility_profile?", "compliance_hold?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/patients/{patient_id}"
    description: "Read one patient, including the mirrored current_cmn_status and the persisted risk posture."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor, Physician]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/home-oxygen/patients/{patient_id}"
    description: "Update demographic and mobility data captured at reassessment."
    roles: [IntakeCoordinator]
    code: 200
    input: ["full_name?", "mobility_profile?", "altitude_feet?"]
    output: Patient
    side_effects:
      - "increments Patient.version by 1"

  - method: GET
    path: "/home-oxygen/patients/{patient_id}/risk-assessment"
    description: "Computed read: returns the five oxygen-safety factors together with BOTH calculations.oxygen_safety_risk_score variants evaluated over the same factor vector, plus the currently persisted score. Persists nothing."
    roles: [RespiratoryTherapist, BranchManager, ComplianceAuditor]
    code: 200
    input: []
    output: "{ patient_id: string, factor_smoking: integer, factor_electrical: integer, factor_teachback: integer, factor_flow: integer, factor_incident: integer, initial_assessment_score: number, ongoing_surveillance_score: number, persisted_score: number, persisted_variant: string, compliance_hold: boolean }"
    side_effects: []

  - method: POST
    path: "/home-oxygen/patients/{patient_id}/risk-reassessments"
    description: "Record a continued-need surveillance reassessment; recomputes calculations.oxygen_safety_risk_score under the ONGOING_SURVEILLANCE variant and re-evaluates the compliance hold."
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "recomputes Patient.oxygen_safety_risk_score via the ONGOING_SURVEILLANCE variant of calculations.oxygen_safety_risk_score"
      - "sets Patient.risk_variant_applied := ONGOING_SURVEILLANCE"
      - "sets Patient.compliance_hold := (Patient.oxygen_safety_risk_score >= 70.00)"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/patients/{patient_id}/transfer-requests"
    description: "Open a patient transfer to another branch (Patient ACTIVE -> TRANSFER_PENDING)."
    roles: [IntakeCoordinator]
    code: 200
    input: [receiving_branch_id, transfer_effective_date]
    output: Patient
    side_effects:
      - "drives the Patient ACTIVE -> TRANSFER_PENDING transition and all of its declared side effects"
      - "suspends every ACCRUING or CAP_REACHED RentalContract of the patient with suspension_reason TRANSFER"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/patients/{patient_id}/transfer-requests/complete"
    description: "Effect a due transfer: reassigns the patient to the receiving branch and resumes suspended billing."
    roles: [BranchManager]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "drives the Patient TRANSFER_PENDING -> ACTIVE (complete) transition and all of its declared side effects"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/patients/{patient_id}/transfer-requests/cancel"
    description: "Withdraw a pending transfer; the compensating counterpart of transfer-requests."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "drives the Patient TRANSFER_PENDING -> ACTIVE (cancel) transition and all of its declared side effects"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/patients/{patient_id}/discharge"
    description: "Discharge the patient from home-oxygen service; closes billing and voids the active certificate."
    roles: [BranchManager]
    code: 200
    input: []
    output: Patient
    side_effects:
      - "drives the Patient ACTIVE -> DISCHARGED transition and all of its declared side effects"
      - "increments Patient.version by 1"

