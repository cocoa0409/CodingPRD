  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_adjudication_blocked_until_its_delivery_is_validated
        grounds:
          - validations.priority_18_ERR_DELIVERY_NOT_VALIDATED
          - state_machines.Claim.SUBMITTED_to_VALIDATED
          - state_machines.RetailDelivery.REPORTED_to_VALIDATED
          - calculations.claim_payable_amount
        distinguishing_aspect: |
          Entity pair (Claim, RetailDelivery): the Claim write is refused because of the state of a
          DIFFERENT entity, its RetailDelivery, and the claim's own state is impeccable
          (SUBMITTED, UNPAID) both before and after the refusal. The identical call succeeds
          verbatim once the delivery alone moves REPORTED -> VALIDATED, with no change to the
          claim, the program or the payload.
        test_recipe:
          setup:
            - "One ACTIVE CUSTOMER_CASH program CED-CASH, per_unit_amount_cents 130000, budget 40000000, window [2026-08-01, 2026-09-01), MX5/WEST/CASH eligibility."
            - "Dealer D-860, ACTIVE, region WEST."
            - "One delivery reported at clock 2026-08-08 and deliberately LEFT IN REPORTED (back_dated_flag false, so nothing prevents a later validation)."
            - "One Claim submitted on that REPORTED delivery — claim submission does NOT require a validated delivery, only adjudication does."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
