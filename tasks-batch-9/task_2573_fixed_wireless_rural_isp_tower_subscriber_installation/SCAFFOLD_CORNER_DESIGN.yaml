              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr1_id: $.data.id }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr1_id}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr1_id}", service_plan_id: "${plan_id}", billing_email: "dana.reyes@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { subscriber_id: $.data.id }
          trigger:
            - call: "GET /subscribers?limit=0"
              as: SalesAgent
              captures: { err_limit_low: $.data.error_id }
            - call: "GET /subscribers?limit=101"
              as: SalesAgent
              captures: { err_limit_high: $.data.error_id }
            - call: "GET /subscribers?offset=-1"
              as: SalesAgent
              captures: { err_offset: $.data.error_id }
            - call: "GET /subscribers?limit=100&offset=0"
              as: SalesAgent
              captures: { ok_first: "$.data[0].id" }
            - call: "GET /subscribers?limit=1&offset=1"
              as: SalesAgent
              captures: { page_two_count: $.meta.total_count }
          assert:
            - "The first three calls each return HTTP 400 with error_id \"ERR_PAGINATION_INVALID\": ${err_limit_low}, ${err_limit_high} and ${err_offset} are all that code"
            - "limit == 100 is accepted (HTTP 200) and ${ok_first} == ${subscriber_id} - 100 is the inclusive ceiling, 101 is not"
            - "The offset==1 page returns HTTP 200 with an empty data array while ${page_two_count} == 1 - total_count counts matches, not returned rows"

  - section: rbac
    instances:
      - name: each_roles_exclusive_operation_is_closed_to_every_other_role
        claim_type: cannot_perform
        grounds:
          - roles.NetworkEngineer.exclusive_operations
          - roles.CapacityPlanner.exclusive_operations
          - roles.FieldTech.exclusive_operations
          - roles.FinanceApprover.exclusive_operations
          - roles.SalesAgent.exclusive_operations
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Authorisation is checked before the path id is resolved and before the body is parsed, so an
          unentitled role gets 403 even when the addressed resource does not exist at all (priority 2
          beats priority 5) and even when the payload is nonsense (priority 2 beats priority 3). A
          missing or unrecognised X-User-Role is a 401, not a 403 - the two must not collapse into one
          code, and neither may leak into a 404.
        test_recipe:
          setup:
            - "Exactly one tower exists; every id used in the denial probes is deliberately unknown."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { real_tower: $.data.id }
          trigger:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-999", latitude: 41.0000, longitude: -104.0000, ground_elevation_m: 1100.0, antenna_agl_m: 30.0, lease_landowner_name: "Nobody LLC", lease_monthly_base_rent_cents: 1000, lease_escalator_pct: 0.0100, lease_start_date: "2026-01-01", lease_term_months: 24 }
              as: SalesAgent
              captures: { err_tower_create: $.data.error_id }
            - call: "POST /service-plans"
              payload: { tier_code: "BAD10", downstream_mbps: 10, upstream_mbps: 2, monthly_price_cents: 1999, soft_cap_gb: 100.0, deprioritization_factor: 0.5, sla_uptime_pct: 99.0, sla_credit_method: "PER_INCIDENT", equipment_policy: "RENTAL_ONLY" }
              as: FieldTech
              captures: { err_plan_create: $.data.error_id }
            - call: "POST /outage-credits/00000000-0000-0000-0000-000000000000/application"
              payload: { note: "self-approval attempt" }
              as: BillingAdmin
              captures: { err_apply: $.data.error_id }
            - call: "POST /install-work-orders/00000000-0000-0000-0000-000000000000/survey"
              payload: { measured_tree_line_height_m: 3.0, measured_roof_height_m: 4.0, structure_penetration_allowed: true }
              as: CapacityPlanner
              captures: { err_survey: $.data.error_id }
            - call: "POST /sectors/00000000-0000-0000-0000-000000000000/capacity-policy"
              payload: { max_oversubscription_ratio: 99.0, justification: "not my job" }
              as: NetworkEngineer
              captures: { err_policy: $.data.error_id }
            - call: "GET /towers/${real_tower}"
              as: none
              captures: { err_anon: $.data.error_id }
            - call: "GET /towers/${real_tower}"
              as: Auditor
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /towers/${real_tower}"
              as: SalesAgent
              captures: { ok_site: $.data.site_code }
          assert:
            - "${err_tower_create} == \"ERR_UNAUTHORIZED\" with HTTP 403 - POST /towers is a NetworkEngineer exclusive"
            - "${err_plan_create} == \"ERR_UNAUTHORIZED\" with HTTP 403 - POST /service-plans is a CapacityPlanner exclusive"
            - "${err_apply} == \"ERR_UNAUTHORIZED\" with HTTP 403, NOT ERR_CREDIT_NOT_FOUND, even though the credit id is unknown"
            - "${err_survey} == \"ERR_UNAUTHORIZED\" with HTTP 403, NOT ERR_WORK_ORDER_NOT_FOUND"
            - "${err_policy} == \"ERR_UNAUTHORIZED\" with HTTP 403 - even the NetworkEngineer, who owns the RF plant, cannot rewrite capacity policy"
            - "${err_anon} == \"ERR_UNAUTHENTICATED\" with HTTP 401 for the header-less call, and ${err_unknown_role} == \"ERR_UNAUTHENTICATED\" with HTTP 401 for the undeclared role Auditor"
            - "${ok_site} == \"RB-TWR-001\" with HTTP 200 - GET /towers/{id} is a shared operation the SalesAgent does hold"
            - "No row was created by any of the refused calls: GET /towers/${real_tower} still succeeds and no second tower exists"

      - name: sales_and_capacity_share_the_reservation_endpoint_but_not_each_others_exclusives
        claim_type: peer_roles
        grounds:
          - roles.SalesAgent.shared_operations
          - roles.CapacityPlanner.shared_operations
          - roles.CapacityPlanner.exclusive_operations
          - roles.SalesAgent.exclusive_operations
        distinguishing_aspect: |
          SalesAgent and CapacityPlanner are peers over POST /capacity-holds: both may reserve, and a
          hold created by one is a first-class row for the other. The asymmetry is only at the edges -
          releasing a hold is CapacityPlanner-only even for the hold the SalesAgent created, and turning
          a qualified request into an account is SalesAgent-only even though the CapacityPlanner owns the
          capacity. A naive RBAC table that keys off "who created the row" gets both directions wrong.
        test_recipe:
          setup:
            - "PRELUDE P1 plus two QUALIFIED STD50 requests on the same ACTIVE sector (capacity 25, ratio 8.0, allowance 200)."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Peer One", premise_latitude: 41.2610, premise_longitude: -104.7610, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_a: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Peer Two", premise_latitude: 41.2620, premise_longitude: -104.7620, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_b: $.data.id }
          trigger:
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_a}", expected_sector_version: "${sector_v1}" }
              as: CapacityPlanner
              captures: { hold_a: $.data.id, hold_a_mbps: $.data.held_mbps }
            - call: "GET /sectors/${sector_id}"
              as: CapacityPlanner
              captures: { sector_v2: $.data.version }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_b}", expected_sector_version: "${sector_v2}" }
              as: SalesAgent
              captures: { hold_b: $.data.id }
            - call: "POST /capacity-holds/${hold_b}/release"
              payload: { note: "sales agent tries to release its own hold" }
              as: SalesAgent
              captures: { err_release: $.data.error_id }
            - call: "POST /capacity-holds/${hold_b}/release"
              payload: { note: "planner releases the sales agent's hold" }
              as: CapacityPlanner
              captures: { released_status: $.data.status }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr_a}", service_plan_id: "${plan_id}", billing_email: "peer.one@example.com", equipment_mode: "RENTAL" }
              as: CapacityPlanner
              captures: { err_subscriber: $.data.error_id }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr_a}", service_plan_id: "${plan_id}", billing_email: "peer.one@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { sub_a: $.data.id, sub_a_sector: $.data.sector_id }
          assert:
            - "Both reservations succeed with HTTP 201 and ${hold_a_mbps} == 50 - the shared operation works for either peer"
            - "${err_release} == \"ERR_UNAUTHORIZED\" with HTTP 403: the SalesAgent cannot release even the hold it created itself"
            - "${released_status} == \"RELEASED\" with HTTP 200 when the CapacityPlanner does it, and the linked ${sr_b} flips to \"EXPIRED\""
            - "${err_subscriber} == \"ERR_UNAUTHORIZED\" with HTTP 403: the CapacityPlanner cannot convert a request, and ${sr_a} is still \"QUALIFIED\" with its hold still \"HELD\" afterwards"
            - "The SalesAgent's identical call returns HTTP 201 with ${sub_a_sector} == ${sector_id} and consumes ${hold_a}"
            - "GET /capacity-holds?status=HELD returns total_count 0 - one hold was released and the other was consumed"

      - name: a_subscriber_reads_its_own_account_only_and_has_no_collection_read_at_all
        claim_type: cannot_perform
        grounds:
          - roles.Subscriber.shared_operations
          - roles.Subscriber.identity
          - errors.ERR_NOT_RESOURCE_OWNER
          - validations[priority=7]
        distinguishing_aspect: |
          The Subscriber role produces two different 403s that must not be conflated: ERR_UNAUTHORIZED
          (priority 2) when the endpoint is not in its list at all, and ERR_NOT_RESOURCE_OWNER
          (priority 7) when the endpoint IS in its list but the addressed id belongs to somebody else.
          Because the ownership check sits at priority 7 it must also lose to a genuine 404 on an
          unknown id, and every nested read - usage records, work orders, assignments - has to be
          ownership-checked, not just the top-level account.
        test_recipe:
          setup:
            - "PRELUDE P1 plus two accounts A and B on the same sector, each converted from its own QUALIFIED request; X-User-ID for the Subscriber role is the account id."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
