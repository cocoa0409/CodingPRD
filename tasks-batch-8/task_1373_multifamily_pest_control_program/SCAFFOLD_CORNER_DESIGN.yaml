      - name: unauthenticated_missing_role_header_returns_401
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role/X-User-ID headers -> ERR_UNAUTHENTICATED 401 before any other check (even for a non-existent resource id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
