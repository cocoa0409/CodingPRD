  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: vault_slot_conservation
        grounds:
          - calculations.vault_occupancy
          - state_machines.StoragePlacement.ACTIVE_to_RELEASED
          - entities.Vault.fields.occupied_slots
        distinguishing_aspect: |
          Conserved quantity = vault slot count: placement creation (+1) paired with its RELEASE
          (-1) leaves occupied_slots at 0, equal to count(ACTIVE placements)=0; no slot drift.
        test_recipe:
          setup:
            - "AMBIENT vault capacity 2; one artwork placed ACTIVE (occupied 1)"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Slot Trust", client_type: "INSTITUTION", billing_email: "ap@slot.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "Vault G", climate_class: "AMBIENT", capacity_slots: 2 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Keystone", artist: "J. Park", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /storage-placements/${p_id}/state"
              payload: { to_status: "RELEASED" }
              as: Registrar
          assert:
            - "Vault.${vault_id}.occupied_slots == 0"
            - "StoragePlacement.${p_id}.status == RELEASED"

      - name: invoice_outstanding_conservation
        grounds:
          - calculations.client_outstanding_balance
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Client.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = monetary ledger (different type than slot count): issuing an
          invoice (+10875) then voiding it (-10875) returns client.outstanding_balance_cents to 0.
        test_recipe:
          setup:
            - "client; DRAFT invoice with a single 10,000 manual line (total 10,875 incl. 875 tax); then ISSUED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Ledger House", client_type: "INSTITUTION", billing_email: "ap@ledger.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /invoices"
              payload: { client_id: "${client_id}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-05-31T00:00:00Z", manual_line_items: [ { description: "Storage", amount_cents: 10000 } ] }
              as: BillingAdmin
              captures: { invoice_id: $.data.id }
            - call: "POST /invoices/${invoice_id}/state"
              payload: { to_status: "ISSUED" }
              as: BillingAdmin
          trigger:
            - call: "POST /invoices/${invoice_id}/state"
              payload: { to_status: "VOID" }
              as: BillingAdmin
          assert:
            - "Invoice.${invoice_id}.total_cents == 10875"
            - "Client.${client_id}.outstanding_balance_cents == 0"
