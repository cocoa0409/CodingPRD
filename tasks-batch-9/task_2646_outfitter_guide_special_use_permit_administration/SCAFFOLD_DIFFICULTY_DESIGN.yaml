      - name: fee_money_identity_across_amend_and_reversal
        grounds:
          - calculations.fee_obligation_conservation
          - calculations.permit_fee_assessment
          - state_machines.FeeAssessment
        distinguishing_aspect: |
          CONSERVED QUANTITY: MONEY on one FeeAssessment — assessed_fee_cents + credit_balance_cents
          must always equal paid_to_date_cents + balance_due_cents. This is a different conserved
          quantity from service days and from guide capacity, and it is the only one that is
          RATCHETED: paid_to_date_cents never decreases, so the compensating pair (an amendment that
          raises the fee followed by the amendment that reverses it) cannot restore the identity by
          symmetry — the overpayment has to reappear as credit_balance_cents instead. Landing back on
          the original assessed_fee_cents with a stale balance_due, or with the credit swallowed, is
          the exact drift this checks.
