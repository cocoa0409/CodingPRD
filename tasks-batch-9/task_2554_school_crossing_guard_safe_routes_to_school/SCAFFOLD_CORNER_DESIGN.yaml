      - name: corner_certification_gate_error_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_GUARD_NOT_IN_TRAINING
          - errors.ERR_TRAINING_HOURS_INSUFFICIENT
          - validations.priority_50.ERR_TRAINING_HOURS_INSUFFICIENT
          - state_machines.Guard.certification_status
        distinguishing_aspect: |
          The certify endpoint carries two distinct rejections that are easy to conflate.
          An APPLICANT with no training at all is a STATE error (ERR_GUARD_NOT_IN_TRAINING,
          409); an IN_TRAINING guard with 8.0 of the required 12.0 hours is a THRESHOLD
          error (ERR_TRAINING_HOURS_INSUFFICIENT, 422). After a successful certification at
          12.0 hours, hours_since_last_certification resets to 0, so an immediate
          recertification hits the same 422 through the 4.0-hour recertification branch —
          the identical error code reached by a different rule clause.
        test_recipe:
          setup:
            - "One freshly enrolled guard in status APPLICANT with zero training hours."
          setup_api_calls:
            - call: "POST /srts/guards"
              payload: { full_name: "Tomas Reyes", home_zone_code: "Z-NORTH", hire_date: "2026-08-03", substitute_pool_optin: true }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { g_new_id: $.data.id }
          trigger:
            - call: "POST /srts/guards/${g_new_id}/certify"
              payload: { certified_on: "2026-08-07", certification_expires_on: "2027-06-30" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g_new_id}/training"
              payload: { training_date: "2026-08-05", hours: 8, curriculum_code: "SRTS-BASIC" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g_new_id}/certify"
              payload: { certified_on: "2026-08-07", certification_expires_on: "2027-06-30" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g_new_id}/training"
              payload: { training_date: "2026-08-06", hours: 4, curriculum_code: "SRTS-BASIC" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g_new_id}/certify"
              payload: { certified_on: "2026-08-07", certification_expires_on: "2027-06-30" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g_new_id}/certify"
              payload: { certified_on: "2026-08-08", certification_expires_on: "2027-06-30" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
          assert:
            - "trigger call 1 returns ERR_GUARD_NOT_IN_TRAINING with HTTP 409 and Guard.${g_new_id}.certification_status stays APPLICANT"
            - "trigger call 2 returns HTTP 200 with certification_status IN_TRAINING and training_hours_completed == 8"
            - "trigger call 3 returns ERR_TRAINING_HOURS_INSUFFICIENT with HTTP 422 and certification_status stays IN_TRAINING"
            - "trigger call 4 returns HTTP 200 with training_hours_completed == 12 and hours_since_last_certification == 12"
            - "trigger call 5 returns HTTP 200 with certification_status CERTIFIED, certified_on 2026-08-07 and hours_since_last_certification reset to 0"
            - "trigger call 6 returns ERR_TRAINING_HOURS_INSUFFICIENT with HTTP 422 and certification_expires_on still 2027-06-30 from call 5"

      - name: corner_reliability_floor_blocks_reinstatement
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RELIABILITY_TOO_LOW
          - validations.priority_50.ERR_RELIABILITY_TOO_LOW
          - calculations.guard_reliability_score.constants.SUSPENSION_THRESHOLD
          - state_machines.Guard.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Three UNEXCUSED absences charge both rolling coefficients (4.0 + 6.0 each), so a
          guard with 12 training hours (bonus 3.00) lands at
          100.0 - 30.0 + 3.00 = 73.00 rolling and 100.0 - 30.0 + 3.00 = 73.00
          season-to-date. 73.00 is below the 75.00 floor, so the third filing suspends the
          guard and vacates her assignment, and the reinstatement attempt returns
          ERR_RELIABILITY_TOO_LOW (422) — not ERR_TRAINING_HOURS_INSUFFICIENT, because the
          4.0-hour recertification clause applies only to a guard who is still CERTIFIED.
        test_recipe:
          setup:
            - "WARRANTED intersection with one ACTIVE AM post; Rita (12 training hours, fully equipped, CERTIFIED) assigned 2026-09-08 -> 2026-09-18; clock left at the default 2026-08-01T00:00:00Z so every report lands inside the 90-day rolling window."
