  - section: consistency_model
    instances:

      - name: every_derived_value_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED_install
          - state_machines.PermitApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The declared model is immediate, so nothing in this API may lag: the
          completion response itself already carries the new work-order status and
          stamps, and the four rows it cascaded into — contract, fleet product,
          invoice, account balance — read back with their final values on the very
          next call, with no retry, no delay and no second read needed. The same
          holds for a derived aggregate: the municipality's committed closure
          footage includes a permit the instant the approval response returns, and
          repeating any read yields byte-identical data.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01 (permit_lead_time_days 5, max_concurrent_closure_linear_feet 800, rental_tax_rate_bp 890), account A (credit_limit_cents 100000000), product PANEL-CL-10 (owned 400), crew CRW-A."
            - "Jobsite J1 (SOIL, no closure) carrying a 500 ft CONSTRUCTION term-3 contract CT1 in PENDING_MOBILIZATION with a SCHEDULED install order WO1."
            - "Jobsite J2 (ASPHALT, requires_sidewalk_closure true) carrying permit P1 for 300 ft over [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z), already SUBMITTED nine days ahead of the closure start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
