              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 100000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /rfis"
              payload: { project_id: "${proj}", subject: "Slab detail", question: "Which rebar size?" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { rfi: $.data.id }
          trigger:
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE  (open ARCHITECT-court RFI blocks certification)"
            - "PayApplication.${app1}.status == SUBMITTED  (unchanged)"

      - name: project_close_blocked_by_open_subcommitment
        grounds:
          - state_machines.Project.SUBSTANTIALLY_COMPLETE_to_CLOSED
