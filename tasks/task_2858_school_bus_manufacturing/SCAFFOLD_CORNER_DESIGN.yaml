        claim_type: input_set_filtering
        grounds:
          - calculations.line_capacity_ledger.input_set
          - endpoints[POST /build-slots].side_effects
          - endpoints[POST /build-slots/{id}/commit].side_effects
          - entities.ProductionLine.fields.committed_slot_days
        distinguishing_aspect: |
          committed_slot_days sums slot_days over exactly one status set on exactly one line. Four slots are
          arranged so that every excluded case is present at once: a PLANNED slot that was never committed
          (7 days, contributes 0), a slot committed then released (7 days, contributes 0 again), a
          COMMITTED slot (7 days, the only contributor), and a COMMITTED slot of the same size on a second
          line L-B1 whose 7 days must never leak into L-A1's ledger. The answer is 7, not 14, 21 or 28.
