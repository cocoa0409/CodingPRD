  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_version_increments_on_privacy_flip
        claim_type: OptimisticConcurrency
        grounds:
          - concurrency_rules[member-privacy-stale-version]
          - entities.Member
        distinguishing_aspect: "Each successful privacy flip increments Member.version by exactly 1; a second flip with the prior version is rejected 412."
        test_recipe:
          setup: ["Circle with one GRANTED adult member at version V."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "OCC", birthdate: "1990-01-01T00:00:00Z", email: "occ@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { mid: $.data.id, mv0: $.data.version }
            - call: "POST /api/circles/${cid}/members/${mid}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${mid}"
            - call: "GET /api/circles/${cid}/members/${mid}"
              payload: {}
              as: Member
              as_user_id: "${mid}"
              captures: { mv1: $.data.version }
          trigger:
            - call: "PATCH /api/circles/${cid}/members/${mid}/privacy"
              payload: { privacy_mode: "BLURRED", expected_member_version: "${mv1}" }
              as: Member
              as_user_id: "${mid}"
              captures: { mv2: $.data.version }
            - call: "PATCH /api/circles/${cid}/members/${mid}/privacy"
              payload: { privacy_mode: "PRECISE", expected_member_version: "${mv1}" }
              as: Member
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "mv2 == mv1 + 1"
            - "Second PATCH with ${mv1} returns HTTP 412 ERR_STALE_VERSION"

      - name: derived_assistance_units_reconciled_after_renewal
        claim_type: DerivedFieldReconciliation
        grounds:
          - entities.Circle.fields.assistance_units_balance
          - calculations.identity_credit_invariant
        distinguishing_aspect: "assistance_units_balance is a derived field; at a billing anchor the derivation is recomputed from the tier's grant (not accumulated), so a FREE tier's 0 does not roll forward."
        test_recipe:
          setup: ["FREE circle created at 2026-09-01 with anchor_day=1; clock advanced past the next anchor (2026-10-01)."]
          setup_api_calls:
            - *clock_set
            - *circle_create
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: System
            - call: "GET /api/circles/${cid}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { bal: $.data.assistance_units_balance }
          assert:
            - "bal == 0 (FREE tier grant is 0 per window; balance does not accumulate)"

      - name: cascading_fix_post_updates_member_battery_and_interval
        claim_type: CascadingSideEffects
        grounds:
          - entities.Member.fields.current_battery_pct
          - entities.Member.fields.effective_sample_interval_seconds
        distinguishing_aspect: "Posting a fix updates Member.current_battery_pct and recomputes effective_sample_interval_seconds atomically in the same response cycle."
        test_recipe:
          setup: ["Circle; member initially at battery 90, interval for BALANCED/UNKNOWN/batt>30/FREE = 60."]
          setup_api_calls:
            - *clock_set
            - *circle_create
          trigger:
            - call: "POST /api/circles/${cid}/members/${oid}/fixes"
              payload: { recorded_at: "2026-09-01T00:00:30Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 0.0, battery_pct: 12, phone_in_use: false, motion_context: "STILL" }
              as: Owner
              as_user_id: "${oid}"
            - call: "GET /api/circles/${cid}/members/${oid}"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
              captures: { batt: $.data.current_battery_pct, ivl: $.data.effective_sample_interval_seconds }
          assert:
            - "batt == 12 (cascade from fix post)"
            - "ivl == 240 (raw = 60 * 2.0 * 2.0 = 240; FREE floor 60; clamp [15,900] -> 240)"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: changes_visible_immediately_in_same_response
        claim_type: ImmediateConsistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "A successful POST /circles returns the fully-formed Circle with all computed fields populated in the same response — no polling or event lag."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "POST /api/circles"
              payload: { name: "ImmFam", subscription_tier: "PLUS", billing_anchor_day: 5, owner_display_name: "Im", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "im@example.com" }
              as: Owner
              captures: { cid: $.data.id, bal: $.data.assistance_units_balance, ret: $.data.history_retention_days }
          assert:
            - "bal == 2 (PLUS grant visible in POST response)"
            - "ret == 30 (PLUS retention visible in POST response)"
            - "version == 1"
