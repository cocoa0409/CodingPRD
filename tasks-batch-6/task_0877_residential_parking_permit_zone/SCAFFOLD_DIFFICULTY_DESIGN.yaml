            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "CE1-A", make: "Opel", model: "Astra" }, as: Resident, as_user_id: "${hh_id}", captures: { va: $.data.id } }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${va}" }, as: Resident, as_user_id: "${hh_id}", captures: { aa: $.data.id } }
          trigger:
            - { call: "POST /permit-applications/${aa}/review", payload: {}, as: ParkingClerk, captures: { err: $.data.error_id } }
          assert:
            - "PermitApplication.${aa}.status == SUBMITTED"
            - "response.data.error_id == ERR_PROOF_NOT_VERIFIED"
            - "response.status == 422"

      - name: visitor_pass_blocked_when_permit_not_active
        grounds:
          - state_machines.Permit.ACTIVE_to_REFUNDED
          - entities.Permit.fields.status
          - errors[ERR_PERMIT_HOUSEHOLD_MISMATCH]
