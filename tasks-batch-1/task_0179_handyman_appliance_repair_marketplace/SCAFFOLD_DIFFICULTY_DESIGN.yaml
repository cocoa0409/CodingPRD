scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: instant_vs_in_home_quote_diverge_same_job
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.priced_amount_cents
          - state_machines.Job.REQUESTED_to_INSTANT_QUOTED
          - state_machines.Job.ESTIMATE_REQUESTED_to_ESTIMATED
        distinguishing_aspect: |
          On the SAME HOURLY category the INSTANT variant yields a sight-unseen flat
          15000 while the IN_HOME variant yields itemized labor(22500)+trip(2500)=25000 —
          the two valid quoting algorithms diverge by 10000 cents on the Quote domain.
        test_recipe:
          setup:
            - "category HOURLY, instant_quote_eligible=true, instant_quote_flat_cents=15000, hourly_rate_cents=9000"
            - "two jobs in the same category and ZIP; one takes INSTANT path, one takes IN_HOME path priced by a CLEARED pro at 2.5h"
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "HVAC_TUNE", name: "HVAC Tune-Up", pricing_model: "HOURLY", hourly_rate_cents: 9000, instant_quote_eligible: true, instant_quote_flat_cents: 15000, skill_tags: ["hvac"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "p1@x.com", full_name: "P One", home_zip_code: "30301", skill_tags: ["hvac"], truck_stock_markup_pct: 0.35 }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_instant: $.data.id }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_home: $.data.id }
            - call: "POST /jobs/${job_home}/request-estimate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /jobs/${job_instant}/instant-quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_instant: $.data.priced_amount_cents }
            - call: "POST /jobs/${job_home}/quotes"
              payload: { estimated_labor_hours: 2.5 }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { q_home: $.data.priced_amount_cents }
          assert:
            - "Quote(${q_instant}).priced_amount_cents == 15000"
            - "Quote(${q_home}).priced_amount_cents == 25000"
            - "q_home - q_instant == 10000"

      - name: callback_rate_two_variants_diverge_on_pro
        grounds:
          - calculations.pro_callback_rate
          - entities.Pro.fields.callback_rate
          - state_machines.Job.IN_PROGRESS_to_COMPLETED
          - state_machines.Job.COMPLETED_to_CALLBACK_OPEN
        distinguishing_aspect: |
          On the Pro domain (NOT the Quote/Job pricing domain of instance 1) the base_completion
          variant grows the denominator (completed_job_count) while the callback_event variant
          grows the numerator (callback_job_count); after 4 completions then 1 callback the rate is
          0.25, distinct from the 0 it held after only completions.
        test_recipe:
          setup:
            - "a CLEARED pro who has driven 1 non-callback job to COMPLETED (completed_job_count=1, callback_rate=0)"
            - "that completed job is within its warranty window and eligible for a callback"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-categories"
              payload: { code: "PLUMB_FLAT", name: "Plumbing Flat", pricing_model: "FLAT", flat_task_fee_cents: 12000, callback_warranty_days: 30, skill_tags: ["plumb"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "p2@x.com", full_name: "P Two", home_zip_code: "30301", skill_tags: ["plumb"] }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-01T10:00:00.000Z", window_end: "2026-06-01T12:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win_id: $.data.id, win_v: $.data.version }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/instant-quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: $.data.id }
            - call: "POST /jobs/${job_id}/accept-quote"
              payload: { quote_id: "${q_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /dispatch-windows/${win_id}/book"
              payload: { job_id: "${job_id}", expected_dispatchwindow_version: "${win_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_id}/visits"
              payload: { dispatch_window_id: "${win_id}", arrived_at: "2026-06-01T10:30:00.000Z" }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/invoices"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /jobs/${job_id}/callbacks"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Pro(${pro_id}).completed_job_count == 1"
            - "Pro(${pro_id}).callback_job_count == 1"
            - "Pro(${pro_id}).callback_rate == 1.0"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: part_markup_cap_floor_nonlinear_mode_a
        grounds:
          - calculations.part_line_pricing
          - entities.PartLine.fields.line_total_cents
          - entities.Pro.fields.truck_stock_markup_pct
        distinguishing_aspect: |
          Mode (a): line_total = base + clamp(round(base*pct), FLOOR, CAP) is non-linear in three
          inputs (unit_cost, quantity, pct) via nested min/max — at base 60000 with pct 0.35 the
          raw markup 21000 is clamped to CAP 5000, so line_total=65000 not 81000.
        test_recipe:
          setup:
            - "an IN_PROGRESS job whose assigned pro has truck_stock_markup_pct=0.35"
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "APPL_FIX", name: "Appliance Fix", pricing_model: "HOURLY", hourly_rate_cents: 9000, instant_quote_eligible: true, instant_quote_flat_cents: 15000, skill_tags: ["appliance"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "p3@x.com", full_name: "P Three", home_zip_code: "30301", skill_tags: ["appliance"], truck_stock_markup_pct: 0.35 }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-02T10:00:00.000Z", window_end: "2026-06-02T12:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win_id: $.data.id, win_v: $.data.version }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/instant-quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: $.data.id }
            - call: "POST /jobs/${job_id}/accept-quote"
              payload: { quote_id: "${q_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /dispatch-windows/${win_id}/book"
              payload: { job_id: "${job_id}", expected_dispatchwindow_version: "${win_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_id}/visits"
              payload: { dispatch_window_id: "${win_id}", arrived_at: "2026-06-02T10:30:00.000Z" }
              as: Pro
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /jobs/${job_id}/part-lines"
              payload: { description: "Compressor", unit_cost_cents: 30000, quantity: 2, from_truck_stock: true }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { pl_id: $.data.id }
          assert:
            - "PartLine(${pl_id}).line_total_cents == 65000"

      - name: invoice_per_line_round_then_sum_mode_b
        grounds:
          - calculations.invoice_total
          - entities.LaborLine.fields.line_total_cents
          - entities.Invoice.fields.labor_subtotal_cents
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (b): rounding order is PINNED to per-line-round-then-sum — two HOURLY lines of
          1.5h and 2.5h at 9000/hr round to 13500 and 22500 then sum to 36000; this differs in
          structure (not just metric) from instance 1's clamp formula.
        test_recipe:
          setup:
            - "an IN_PROGRESS HOURLY job with two labor lines (1.5h, 2.5h) at rate 9000 and no parts; pro home ZIP == job ZIP"
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "ELEC_HR", name: "Electric Hourly", pricing_model: "HOURLY", hourly_rate_cents: 9000, skill_tags: ["electric"] }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "p4@x.com", full_name: "P Four", home_zip_code: "30301", skill_tags: ["electric"] }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-03T10:00:00.000Z", window_end: "2026-06-03T14:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win_id: $.data.id, win_v: $.data.version }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/request-estimate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_id}/quotes"
              payload: { estimated_labor_hours: 4.0 }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { q_id: $.data.id }
            - call: "POST /jobs/${job_id}/accept-quote"
              payload: { quote_id: "${q_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /dispatch-windows/${win_id}/book"
              payload: { job_id: "${job_id}", expected_dispatchwindow_version: "${win_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_id}/visits"
              payload: { dispatch_window_id: "${win_id}", arrived_at: "2026-06-03T10:30:00.000Z" }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/labor-lines"
              payload: { hours_worked: 1.5 }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/labor-lines"
              payload: { hours_worked: 2.5 }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /jobs/${job_id}/invoices"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
              captures: { sub: $.data.labor_subtotal_cents, tot: $.data.total_cents }
          assert:
            - "Invoice(${inv_id}).labor_subtotal_cents == 36000"
            - "Invoice(${inv_id}).parts_subtotal_cents == 0"
            - "Invoice(${inv_id}).trip_fee_cents == 2500"
            - "Invoice(${inv_id}).total_cents == 38500"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: job_branches_instant_vs_estimate_from_requested
        grounds:
          - state_machines.Job.REQUESTED_to_INSTANT_QUOTED
          - state_machines.Job.REQUESTED_to_ESTIMATE_REQUESTED
          - entities.Job.fields.quote_path
        distinguishing_aspect: |
          The Job machine FORKS at REQUESTED into two divergent branches with different side-effect
          sets — INSTANT_QUOTED writes quote_path=INSTANT and synthesizes a priced Quote, whereas
          ESTIMATE_REQUESTED writes quote_path=IN_HOME and creates no Quote; this is a branching
          (not linear) shape on the Job entity.
        test_recipe:
          setup:
            - "two REQUESTED jobs in an instant-eligible category"
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "GEN_FIX", name: "General Fix", pricing_model: "HOURLY", hourly_rate_cents: 9000, instant_quote_eligible: true, instant_quote_flat_cents: 15000 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_a: $.data.id }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_b: $.data.id }
          trigger:
            - call: "POST /jobs/${job_a}/instant-quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /jobs/${job_b}/request-estimate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Job(${job_a}).status == INSTANT_QUOTED"
            - "Job(${job_a}).quote_path == INSTANT"
            - "Job(${job_b}).status == ESTIMATE_REQUESTED"
            - "Job(${job_b}).quote_path == IN_HOME"

      - name: pro_parallel_background_and_license_dimensions
        grounds:
          - state_machines.Pro.PENDING_to_CLEARED
          - entities.Pro.fields.background_check_status
          - entities.Pro.fields.license_status
        distinguishing_aspect: |
          The Pro entity carries TWO independent state axes — background_check_status
          (PENDING->CLEARED) and license_status (NONE->VERIFIED) — that evolve on separate axes
          driven by distinct BackgroundCheck rows; clearing the criminal/identity axis leaves
          license_status NONE, proving the dimensions are orthogonal (parallel-dimension shape,
          not a single linear chain).
        test_recipe:
          setup:
            - "a freshly registered pro (background_check_status=PENDING, license_status=NONE)"
          setup_api_calls:
            - call: "POST /pros"
              payload: { email: "p6@x.com", full_name: "P Six", home_zip_code: "30301", skill_tags: ["hvac"] }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "LICENSE", license_expires_on: "2030-01-01T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { bc3: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
          trigger:
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
          assert:
            - "Pro(${pro_id}).background_check_status == CLEARED"
            - "Pro(${pro_id}).license_status == NONE"
            - "Pro(${pro_id}).license_expires_on == null"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_approve_work_incomplete_depth3_cascade
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_APPROVED
          - state_machines.Invoice.PAID_to_REFUNDED
          - state_machines.Job.COMPLETED_to_CALLBACK_OPEN
          - calculations.pro_callback_rate
          - entities.Pro.fields.callback_job_count
        distinguishing_aspect: |
          Depth-3 chain triggered by Dispute resolve(APPROVE, WORK_INCOMPLETE, full refund):
          (1) Dispute->APPROVED bumps Invoice.refunded_cents; (2) that refund being full flips
          Invoice PAID->REFUNDED; (3) the REFUNDED flip's WORK_INCOMPLETE rule cancels the spawned
          warranty-callback Job, which (4) decrements Pro.callback_job_count and recomputes
          callback_rate — each link caused by the prior link, not by the original resolve call.
        test_recipe:
          setup:
            - "a completed FLAT job (flat 12000 + local trip 2500), PAID invoice (total 14500), an OPEN warranty callback exists, a dispute in UNDER_REVIEW with reason WORK_INCOMPLETE and refund_destination WALLET"
          setup_api_calls:
