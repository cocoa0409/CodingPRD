            - "The error is the priority-30 absolute cap, NOT the priority-33 ERR_STAY_LENGTH_EXCEEDED that the same 48-night run also violates against the 44-night tier limit"
            - "The requested stay is only 6 nights on its own and would be legal in isolation; entitlement (46 of 60 class C nights) and the annual cap are untouched, so no fiscal rule can be the cause"
            - "No fourth Reservation row is created and consecutive_run_nights on the second stay stays 41"
      - name: out_and_back_gap_exactly_at_the_tier_minimum_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=34]
          - calculations.out_and_back_gap
          - errors[ERR_OUT_AND_BACK_VIOLATION]
          - entities.MembershipTier.fields.min_out_nights_between_stays
        distinguishing_aspect: "The rule is >=, so on a CLASSIC tier with min_out_nights_between_stays 3 a return arriving 2 nights after departure is refused while a return arriving exactly 3 nights after departure is accepted — the boundary value itself must pass."
        test_recipe:
          setup:
            - "One CLASSIC membership (min_out_nights_between_stays 3, class C entitlement 18) and one OPEN CLASS_C park with 40 sites at 60 percent"
            - "A first stay 2026-08-05 -> 2026-08-08 is confirmed, so out_and_back_gap measures from its 2026-08-08 departure_date"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id" }
            - call: "POST /parks"
              payload: { name: "Pine Crest Campground", park_class: "CLASS_C", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_pc_id: "$.data.id" }
            - call: "POST /parks/${park_pc_id}/season-openings"
              as: ParkManager
            - call: "POST /reservations"
              payload: { park_id: "${park_pc_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-05", scheduled_departure_date: "2026-08-08" }
              as: Member
              captures: { res_first_id: "$.data.id", res_first_status: "$.data.status" }
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_pc_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-12" }
              as: Member
              captures: { gap_two_error_id: "$.data.error_id" }
            - call: "POST /reservations"
              payload: { park_id: "${park_pc_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-11", scheduled_departure_date: "2026-08-13" }
              as: Member
              captures: { gap_three_id: "$.data.id", gap_three_status: "$.data.status", gap_three_run: "$.data.consecutive_run_nights" }
          assert:
            - "Arrival 2026-08-10 gives gap_nights 2 < 3: HTTP 422 with error_id ERR_OUT_AND_BACK_VIOLATION"
            - "Arrival 2026-08-11 gives gap_nights exactly 3: HTTP 201 with status CONFIRMED, so the boundary value satisfies the rule"
            - "The accepted stay reports consecutive_run_nights 2, not 8: a 3-night gap exceeds LINK_GAP_NIGHTS, so the two stays are separate runs and the tier's 14-night limit is nowhere near"
            - "nights_used_class_c ends at 5 (3 + 2) against the 18-night entitlement, so no fiscal rule interfered with either attempt"
      - name: affiliate_tier_eligibility_is_resolved_before_the_quota_arithmetic
        claim_type: cascading_validation
        grounds:
          - validations[priority=36]
          - validations[priority=45]
          - errors[ERR_AFFILIATE_TIER_INELIGIBLE]
          - calculations.affiliate_quota_consumption
          - entities.MembershipTier.fields.affiliate_access_enabled
        distinguishing_aspect: "A CLASSIC membership (affiliate_access_enabled false, tier_rank 1 below the agreement's min_tier_rank 2) books at a partner park whose quota of 1 night could never cover the ceil(2 * 1.5) == 3 charge; the eligibility check at priority 36 must resolve first, so the quota rule at 45 never gets to report."
        test_recipe:
          setup:
            - "An ACTIVE agreement with annual_member_night_quota 1, reciprocity_ratio 1.5, min_tier_rank 2, per_stay_night_cap 7 and advance_window_cap_days 45"
            - "One affiliated CLASS_C park with 40 sites at 60 percent, opened for the season"
            - "One CLASSIC membership: tier_rank 1 and affiliate_access_enabled false, so both halves of the priority-36 conjunction fail"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id" }
            - call: "POST /affiliate-agreements"
              payload: { partner_name: "Timberline Partner Network", effective_from: "2026-01-01", effective_to: "2026-12-31", annual_member_night_quota: 1, reciprocity_ratio: 1.5, min_tier_rank: 2, advance_window_cap_days: 45, per_stay_night_cap: 7, settlement_rate_cents_per_night: 1500 }
              as: ClubAdmin
              captures: { agr_tl_id: "$.data.id" }
            - call: "POST /affiliate-agreements/${agr_tl_id}/status-changes"
              payload: { new_status: "ACTIVE" }
              as: ClubAdmin
              captures: { agr_tl_status: "$.data.status" }
            - call: "POST /parks"
              payload: { name: "Timberline Ridge Partner Park", park_class: "CLASS_C", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20", affiliate_agreement_id: "${agr_tl_id}" }
              as: ClubAdmin
              captures: { park_tl_id: "$.data.id", park_tl_network_type: "$.data.network_type" }
            - call: "POST /parks/${park_tl_id}/season-openings"
              as: ParkManager
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_tl_id}", membership_id: "${mem_dw_id}", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-12" }
              as: Member
              captures: { cascade_error_id: "$.data.error_id" }
            - call: "GET /affiliate-agreements/${agr_tl_id}"
              as: ClubAdmin
              captures: { agr_nights_after: "$.data.nights_consumed_ytd", agr_settlement_after: "$.data.settlement_owed_cents" }
          assert:
            - "The park is AFFILIATE and its agreement is ACTIVE, so priority 26 passes and the affiliate branch is genuinely entered"
            - "HTTP 422 with error_id ERR_AFFILIATE_TIER_INELIGIBLE, not ERR_AFFILIATE_QUOTA_EXHAUSTED, even though ceil(2 * 1.5) == 3 exceeds the quota of 1"
            - "The agreement is untouched: nights_consumed_ytd 0 and settlement_owed_cents 0, so the quota arithmetic never wrote anything"
            - "The advance window used for the attempt is min(60, 45) == 45 and the arrival is 9 days out, so no temporal rule could have produced the failure"
      - name: park_not_open_is_a_cross_entity_precondition_on_booking
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=28]
          - errors[ERR_PARK_NOT_OPEN]
        distinguishing_aspect: "Booking validity depends on the Park state machine rather than on anything in the request, tested from both the closed and the open side."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reservation_create_blocked_until_park_state_is_open
          rationale: "§1.8 books the same request against SEASONAL_CLOSED (refused), then MAINTENANCE_HOLD (refused) and finally OPEN (confirmed), covering the valid and invalid sides of the cross-entity rule."
      - name: state_axis_error_outranks_the_fiscal_error_on_the_same_booking
        claim_type: priority_conflict
        grounds:
          - validations[priority=25]
          - validations[priority=44]
        distinguishing_aspect: "Two rules at widely separated priorities violated by one request; the lower number must win."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / membership_not_active_state_error_outranks_entitlement_exhausted_fiscal_error
          rationale: "§1.8 builds a suspended membership with zero entitlement headroom and asserts ERR_MEMBERSHIP_NOT_ACTIVE, then clears the state violation to show the fiscal error surfacing second."
      - name: advance_window_is_a_temporal_rule_measured_in_whole_days
        claim_type: temporal_validation
        grounds:
          - validations[priority=31]
          - errors[ERR_ADVANCE_WINDOW_EXCEEDED]
        distinguishing_aspect: "The day-count arithmetic at the window edge, including the affiliate cap that can shrink it."
        excluded_because:
          difficulty_instance: boundary_precision_check / advance_window_day_count_exact_at_59_60_and_61_days_on_reservation_create
          rationale: "§1.8 tests 59, 60 and 61 days out against a 60-day window on the same fixture, which is the temporal-validation row for priority 31."
  - section: endpoints
    instances:
      - name: annual_dues_run_bills_and_resets_only_the_memberships_whose_year_rolled_over
        claim_type: bulk_action
        grounds:
          - endpoints["POST /ops/annual-dues-run"]
          - calculations.dues_invoice_total
          - calculations.entitlement_nights_charge.constants.ENTITLEMENT_YEAR_DAYS
          - entities.Membership.fields.entitlement_year_start
        distinguishing_aspect: "The sweep is a skip-not-fail bulk action: of two memberships it bills the one whose entitlement_year_start is more than ENTITLEMENT_YEAR_DAYS old, rolls that membership's year forward and zeroes its used-night counters, and leaves the membership sold two months earlier completely untouched — one 200 response, no partial-failure entry, no second invoice for the skipped row."
        test_recipe:
          setup:
            - "Membership A: PRESIDENT, sold 2026-08-01, one COMPLETED CLASS_B stay of 3 nights, so nights_used_class_b and annual_nights_used are 3 and the 2026 invoice of 59508 is still OPEN"
            - "Membership B: PRESIDENT, sold 2027-06-01, whose own 2027 invoice is due 2027-07-01"
            - "The run is executed at 2027-08-05, four days past membership A's roll-over date of 2027-08-01 and two months short of membership B's"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pre_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_pre_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { mem_a_id: "$.data.id", mem_a_year_start: "$.data.entitlement_year_start" }
            - call: "POST /parks"
              payload: { name: "Elk Meadow RV Resort", park_class: "CLASS_B", total_sites: 40, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_em_id: "$.data.id" }
            - call: "POST /parks/${park_em_id}/season-openings"
              as: ParkManager
            - call: "POST /reservations"
              payload: { park_id: "${park_em_id}", membership_id: "${mem_a_id}", arrival_date: "2026-08-10", scheduled_departure_date: "2026-08-13" }
              as: Member
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T15:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_a_id}/check-in"
              as: Member
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /reservations/${res_a_id}/check-out"
              payload: { actual_departure_date: "2026-08-13" }
              as: Member
            - call: "GET /memberships/${mem_a_id}"
              as: ClubAdmin
              captures: { mem_a_nights_b_before: "$.data.nights_used_class_b", mem_a_annual_before: "$.data.annual_nights_used", mem_a_version_before: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /members"
              payload: { full_name: "Sergio Alvarado", email: "sergio.alvarado@example.com" }
              as: ClubAdmin
              captures: { member_sa_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_sa_id}", tier_id: "${tier_pre_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { mem_b_id: "$.data.id", mem_b_year_start: "$.data.entitlement_year_start" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-05T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /ops/annual-dues-run"
              payload: { cycle_year: 2027 }
              as: ClubAdmin
              captures: { run_cycle_year: "$.data.cycle_year", run_issued: "$.data.invoices_issued", run_billed: "$.data.total_billed_cents" }
            - call: "GET /memberships/${mem_a_id}"
              as: ClubAdmin
              captures: { mem_a_year_start_after: "$.data.entitlement_year_start", mem_a_nights_b_after: "$.data.nights_used_class_b", mem_a_annual_after: "$.data.annual_nights_used", mem_a_balance_after: "$.data.dues_balance_cents", mem_a_tenure_after: "$.data.tenure_years", mem_a_version_after: "$.data.version" }
            - call: "GET /memberships/${mem_a_id}/dues-invoices"
              payload: { cycle_year: 2027 }
              as: ClubAdmin
              captures: { inv_a_2027_amount: "$.data[0].amount_cents", inv_a_2027_due: "$.data[0].due_date" }
            - call: "GET /memberships/${mem_b_id}/dues-invoices"
              as: ClubAdmin
              captures: { inv_b_first_due: "$.data[0].due_date" }
            - call: "GET /memberships/${mem_b_id}"
              as: ClubAdmin
              captures: { mem_b_year_start_after: "$.data.entitlement_year_start", mem_b_balance_after: "$.data.dues_balance_cents" }
          assert:
            - "HTTP 200 with cycle_year 2027, invoices_issued 1 and total_billed_cents 59508 — exactly one membership was eligible"
            - "Membership A: entitlement_year_start moves from 2026-08-01 to 2027-08-01 (a forward roll of ENTITLEMENT_YEAR_DAYS, not to the run date 2027-08-05), nights_used_class_b and annual_nights_used drop from 3 to 0, tenure_years is 1, and version is one higher than before the run"
            - "Membership A's 2027 invoice is 59508 (base 58000, assessment 4640, loyalty 3132 because tenure_years 1 is below LOYALTY_TENURE_YEARS) and is due 2027-09-04, i.e. run date + DUES_NET_DAYS"
            - "Membership A's dues_balance_cents is 119016: the unpaid 2026 invoice plus the new one"
            - "Membership B is skipped: it still holds exactly one invoice, due 2027-07-01 (its own sale date + 30), its entitlement_year_start is still 2027-06-01 and its dues_balance_cents is still 59508"
            - "The response is a single success object with no per-item failure list, since a skipped membership is not an error"
      - name: reinstatement_is_allowed_only_after_the_balance_clears_and_the_exact_fee_arrives
        claim_type: conditional_action
        grounds:
          - endpoints["POST /memberships/{id}/reinstatement"]
          - validations[priority=48]
          - errors[ERR_REINSTATEMENT_FEE_REQUIRED]
          - calculations.transfer_fee_total.constants.REINSTATEMENT_FEE_CENTS
          - state_machines.Membership
        distinguishing_aspect: "The action carries a two-part condition and both halves are probed independently: with the correct 15000 fee but a 59508 balance it is refused, with a zero balance but a 10000 fee it is still refused, and only the zero-balance-plus-exact-fee combination lifts the suspension and clears suspension_reason."
        test_recipe:
          setup:
            - "One PRESIDENT membership suspended by an administrator (suspension_reason ADMIN_ACTION) while its 59508 invoice is still OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "PRESIDENT", name: "President Class", tier_rank: 3, upfront_cost_cents: 1850000, annual_dues_cents: 58000, entitlement_nights_class_a: 14, entitlement_nights_class_b: 21, entitlement_nights_class_c: 28, annual_total_night_cap: 45, advance_window_days: 120, max_consecutive_stay_nights: 21, min_out_nights_between_stays: 1, affiliate_access_enabled: true, resale_allowed: true, transfer_fee_cents: 95000 }
              as: ClubAdmin
              captures: { tier_pre_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_pre_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id", mem_dw_balance: "$.data.dues_balance_cents" }
            - call: "GET /memberships/${mem_dw_id}/dues-invoices"
              as: ClubAdmin
              captures: { inv_dw_id: "$.data[0].id", inv_dw_amount: "$.data[0].amount_cents" }
            - call: "POST /memberships/${mem_dw_id}/suspension"
              payload: { suspension_reason: "ADMIN_ACTION" }
              as: ClubAdmin
              captures: { mem_dw_status_suspended: "$.data.membership_status", mem_dw_reason: "$.data.suspension_reason" }
          trigger:
            - call: "POST /memberships/${mem_dw_id}/reinstatement"
              payload: { reinstatement_fee_paid_cents: 15000 }
              as: ClubAdmin
              captures: { balance_blocked_error_id: "$.data.error_id" }
            - call: "POST /dues-invoices/${inv_dw_id}/payments"
              payload: { amount_cents: 59508 }
              as: ClubAdmin
              captures: { inv_dw_status: "$.data.status" }
            - call: "POST /memberships/${mem_dw_id}/reinstatement"
              payload: { reinstatement_fee_paid_cents: 10000 }
              as: ClubAdmin
              captures: { fee_blocked_error_id: "$.data.error_id" }
            - call: "POST /memberships/${mem_dw_id}/reinstatement"
              payload: { reinstatement_fee_paid_cents: 15000 }
              as: ClubAdmin
              captures: { mem_dw_status_active: "$.data.membership_status", mem_dw_reason_after: "$.data.suspension_reason" }
          assert:
            - "The membership is SUSPENDED with suspension_reason ADMIN_ACTION before any attempt"
            - "First attempt (correct fee, dues_balance_cents 59508): HTTP 422 with error_id ERR_REINSTATEMENT_FEE_REQUIRED and the membership stays SUSPENDED"
            - "Paying the invoice while SUSPENDED is allowed and returns status PAID, which drops dues_balance_cents to 0 and dues_status to CURRENT"
            - "Second attempt (zero balance, fee 10000 != REINSTATEMENT_FEE_CENTS): HTTP 422 with error_id ERR_REINSTATEMENT_FEE_REQUIRED — the same error covers both halves of the condition"
            - "Third attempt (zero balance, fee 15000): HTTP 200, membership_status SUSPENDED -> ACTIVE, suspension_reason cleared to null, version incremented"
      - name: park_capital_project_read_returns_the_scores_the_latest_inspection_recomputed
        claim_type: computed_read
        grounds:
