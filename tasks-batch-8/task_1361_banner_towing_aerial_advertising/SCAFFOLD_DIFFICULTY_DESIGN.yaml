  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_double_booking_half_open
        grounds:
          - validations[priority=13]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on Aircraft — slot A
          ending at 15:00 and slot B starting at 15:00 do NOT overlap. Tests
          adjacency acceptance on the same aircraft.
