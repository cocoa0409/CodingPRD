        claim_type: violation_to_error
        grounds: ["errors[ERR_BRAND_NOT_FOUND]", "errors[ERR_TERM_SHEET_NOT_FOUND]", "errors[ERR_ENGAGEMENT_NOT_FOUND]", "errors[ERR_BOOKING_NOT_FOUND]", "errors[ERR_DELIVERABLE_NOT_FOUND]", "errors[ERR_DISCLOSURE_NOT_FOUND]", "errors[ERR_SLOT_NOT_FOUND]", "errors[ERR_PAYOUT_NOT_FOUND]", "errors[ERR_RENEWAL_NOT_FOUND]"]
        distinguishing_aspect: |
          Each path entity reports its own 404 code rather than a generic one: brand, term sheet, engagement, booking, deliverable, disclosure record, production slot, payout statement and renewal option are all distinguishable from the error_id alone.
