  - rule_id: resource_temporal_overlap
    instances:
      - name: practitioner_half_open_buffer_overlap
        grounds:
          - validations[priority=14]
          - entities.CareServiceAppointment.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics (a): half-open [start, end) PLUS a 15-minute
          practitioner buffer on the Practitioner resource. An appointment
          starting 14 minutes after an existing one's end is rejected
          (ERR_APPOINTMENT_OVERLAP); exactly 15 minutes after is accepted —
          the buffer, not raw overlap, decides.
        test_recipe:
          setup:
            - "Veterinarian V; Horse H in QUARANTINE (VET_EXAM permitted under quarantine restriction)"
            - "V has appointment 2026-08-02T09:00-10:00Z on H"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${vet_id}", service_type: VET_EXAM, scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${vet_id}", service_type: VET_EXAM, scheduled_start: "2026-08-02T10:14:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${vet_id}", service_type: VET_EXAM, scheduled_start: "2026-08-02T10:15:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: IntakeCoordinator, captures: { a2: $.data.id, a2_status: $.data.status } }
          assert:
            - "10:14 start: err == ERR_APPOINTMENT_OVERLAP (gap 14 min < 15-min buffer)"
            - "10:15 start: created with a2_status == REQUESTED (gap exactly 15 min satisfies the buffer)"

      - name: stall_closed_interval_disinfection_gap
        grounds:
          - validations[priority=15]
          - entities.StallAssignment.fields.start_date
        distinguishing_aspect: |
          Interval semantics (b): CLOSED date intervals on the Stall resource
          plus a 1-full-day disinfection gap for QUARANTINE_BARN only —
          different geometry than the practitioner half-open buffer. Same-day
          08-14 start hits plain overlap (ERR_STALL_OVERLAP, checked first);
          08-15 start hits the gap rule (ERR_DISINFECTION_GAP_REQUIRED);
          08-16 start succeeds.
        test_recipe:
          setup:
            - "Stall SQ in QUARANTINE_BARN; horse H1 (QUARANTINE) assigned 2026-08-01..2026-08-14, assignment ENDED at 08-14"
            - "Horse H2 in QUARANTINE awaiting a stall"
          setup_api_calls:
            - { call: "POST /rescue-ops/stalls", payload: { stall_code: "Q-01", barn_zone: QUARANTINE_BARN }, as: SanctuaryDirector, captures: { st: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H1", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h1: $.data.id } }
            - { call: "POST /rescue-ops/stall-assignments", payload: { horse_id: "${h1}", stall_id: "${st}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-14T00:00:00Z" }, as: IntakeCoordinator, captures: { sa1: $.data.id } }
            - { call: "POST /rescue-ops/stall-assignments/${sa1}/end", payload: { end_date: "2026-08-14T00:00:00Z" }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses", payload: { name: "H2", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 950, age_years: 7, body_condition_score: 4, training_level: UNHANDLED }, as: IntakeCoordinator, captures: { h2: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/stall-assignments", payload: { horse_id: "${h2}", stall_id: "${st}", start_date: "2026-08-14T00:00:00Z" }, as: IntakeCoordinator, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /rescue-ops/stall-assignments", payload: { horse_id: "${h2}", stall_id: "${st}", start_date: "2026-08-15T00:00:00Z" }, as: IntakeCoordinator, captures: { err_gap: $.data.error_id } }
            - { call: "POST /rescue-ops/stall-assignments", payload: { horse_id: "${h2}", stall_id: "${st}", start_date: "2026-08-16T00:00:00Z" }, as: IntakeCoordinator, captures: { sa2: $.data.id, sa2_status: $.data.status } }
          assert:
            - "08-14 start: err_overlap == ERR_STALL_OVERLAP (closed intervals share 08-14; overlap checked before gap)"
            - "08-15 start: err_gap == ERR_DISINFECTION_GAP_REQUIRED (zero full gap days in QUARANTINE_BARN)"
            - "08-16 start: sa2_status == ACTIVE (one full gap day 08-15 satisfies the rule)"

  - rule_id: compensating_invariant
    instances:
      - name: feed_lot_conservation_across_close_days
        grounds:
          - calculations.feed_supply_projection
          - entities.FeedLot.fields.initial_lbs
          - entities.FeedLot.fields.quantity_lbs
          - entities.FeedDayClose.fields.consumed_lbs
          - entities.FeedDayClose.fields.wasted_lbs
        distinguishing_aspect: |
          Conserved quantity: per feed_type, SUM(FeedLot.initial_lbs) ==
          SUM(FeedLot.quantity_lbs) + SUM(FeedDayClose.consumed_lbs) +
          SUM(FeedDayClose.wasted_lbs). Forward actions (three 333-lb receipts)
          paired with compensating close-day drawdown/expiry (3 closes) conserve
          999 lbs exactly: 646.78 on hand + 57.66 consumed + 294.56 wasted.
        test_recipe:
          setup:
            - "Horses A (ration 25.0, BCS 3) and B (ration 18.0, BCS 5) resident (QUARANTINE); grass demand 21.35 lbs/day; August multiplier 0.9 -> 19.22 lbs consumed per close"
            - "GRASS_HAY lots: 333 (exp 2026-08-20) + 333 (exp 2026-08-25) + 333 (exp 2026-09-01)"
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "A", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 3, training_level: GREEN }, as: IntakeCoordinator, captures: { ha: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "B", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 900, age_years: 7, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { hb: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders", payload: { feed_type: GRASS_HAY, quantity_lbs: 999, unit_cents_per_lb: 7.5 }, as: BarnManager, captures: { po: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders/${po}/mark-ordered", payload: {}, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 333, expiry_date: "2026-08-20T00:00:00Z" }, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 333, expiry_date: "2026-08-25T00:00:00Z" }, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 333, expiry_date: "2026-09-01T00:00:00Z" }, as: BarnManager }
          trigger:
            - { call: "POST /rescue-ops/feed-inventory/close-day", payload: { close_date: "2026-08-19T00:00:00Z" }, as: BarnManager }
            - { call: "POST /rescue-ops/feed-inventory/close-day", payload: { close_date: "2026-08-20T00:00:00Z" }, as: BarnManager }
            - { call: "POST /rescue-ops/feed-inventory/close-day", payload: { close_date: "2026-08-21T00:00:00Z" }, as: BarnManager }
            - { call: "GET /rescue-ops/feed-lots?feed_type=GRASS_HAY", as: BarnManager, captures: { lot1_qty: "$.data[0].quantity_lbs", lot2_qty: "$.data[1].quantity_lbs", lot3_qty: "$.data[2].quantity_lbs" } }
            - { call: "GET /rescue-ops/feed-day-closes?feed_type=GRASS_HAY", as: BarnManager, captures: { c1: "$.data[0].consumed_lbs", w3: "$.data[2].wasted_lbs" } }
          assert:
            - "lot quantities after 3 closes: 0.00 + 313.78 + 333.00 == 646.78 lbs on hand"
            - "consumed per close == 19.22 (round_half_up(21.35 * 0.9, 2)); total consumed == 57.66"
            - "wasted total == 294.56 (lot1 expired at the 2026-08-21 close after two drawdowns: 333 - 2*19.22)"
            - "invariant: 646.78 + 57.66 + 294.56 == 999.00 == SUM(initial_lbs)"

      - name: care_plan_coverage_compensation
        grounds:
          - entities.SanctuaryCarePlan.fields.funding_coverage_cents
          - state_machines.Sponsorship.PLEDGED_to_ACTIVE
          - state_machines.Sponsorship.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity of a different type (funding coverage, not stock):
          funding_coverage_cents == SUM(monthly_pledge_cents over ACTIVE
          sponsorships). The forward action (activate +20000) paired with its
          compensating action (cancel) returns coverage to exactly its prior
          value 0; the lapse/reinstate pair does the same through LAPSED.
        test_recipe:
          setup:
            - "Horse H SANCTUARY with APPROVED STRAIGHT_LINE plan (monthly 38500, coverage 0)"
            - "Sponsorship S1 (20000) exists in PLEDGED"
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 10, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: REHABILITATION }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses/${h}/designate-sanctuary", payload: { reason: "permanent resident" }, as: SanctuaryDirector }
            - { call: "GET /rescue-ops/horses/${h}", as: SanctuaryDirector, captures: { h_v: $.data.version } }
            - { call: "POST /rescue-ops/sanctuary-care-plans", payload: { horse_id: "${h}", expected_horse_version: "${h_v}", variant: STRAIGHT_LINE }, as: SanctuaryDirector, captures: { plan: $.data.id } }
            - { call: "POST /rescue-ops/sanctuary-care-plans/${plan}/approve", payload: {}, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/sponsors", payload: { name: "SP", contact_email: "sp@x.com" }, as: Sponsor, captures: { sp: $.data.id } }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp}", horse_id: "${h}", monthly_pledge_cents: 20000 }, as: Sponsor, as_user_id: "${sp}", captures: { s1: $.data.id } }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { cov0: $.data.funding_coverage_cents, fs0: $.data.funding_status } }
          trigger:
            - { call: "POST /rescue-ops/sponsorships/${s1}/activate", payload: {}, as: Sponsor, as_user_id: "${sp}" }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { cov1: $.data.funding_coverage_cents, fs1: $.data.funding_status } }
            - { call: "POST /rescue-ops/sponsorships/${s1}/lapse", payload: {}, as: SanctuaryDirector }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { cov2: $.data.funding_coverage_cents } }
            - { call: "POST /rescue-ops/sponsorships/${s1}/reinstate", payload: {}, as: Sponsor, as_user_id: "${sp}" }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { cov3: $.data.funding_coverage_cents } }
            - { call: "POST /rescue-ops/sponsorships/${s1}/cancel", payload: {}, as: SanctuaryDirector }
            - { call: "GET /rescue-ops/sanctuary-care-plans/${plan}", as: SanctuaryDirector, captures: { cov4: $.data.funding_coverage_cents, fs4: $.data.funding_status } }
          assert:
            - "cov0 == 0 AND fs0 == UNFUNDED (PLEDGED does not count toward coverage)"
            - "cov1 == 20000 AND fs1 == PARTIALLY_FUNDED (activate: +pledge)"
            - "cov2 == 0 (lapse: LAPSED excluded from coverage)"
            - "cov3 == 20000 (reinstate restores)"
            - "cov4 == 0 AND fs4 == UNFUNDED (cancel compensates activate exactly: invariant coverage == SUM(ACTIVE pledges) drift-free)"
