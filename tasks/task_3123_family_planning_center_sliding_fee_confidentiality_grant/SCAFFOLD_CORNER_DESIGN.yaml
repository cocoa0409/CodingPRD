        distinguishing_aspect: "When misconfigured tiers overlap (A [0,100) disc 100 and B [0,150) disc 80 both match fpl 48), the documented tie-break picks the highest discount_pct deterministically — tier A — rather than first-created or arbitrary."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate with overlapping tiers A [0,100) disc 100 (doc-only) and B [0,150) disc 80. One adult patient."
