            - "e2 == ERR_RESERVATION_NOT_ACTIVE (second release on the terminal reservation)"

  - section: rbac
    instances:
      - name: scheduler_cannot_release_load
        claim_type: exclusive_denial
        grounds:
          - "roles.SpdSupervisor"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Load release is SpdSupervisor-exclusive; OrScheduler is rejected with ERR_FORBIDDEN_ROLE before any state check."
        test_recipe:
          setup: ["technician, sterilizer, load LR in LOADING"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${ta}", captures: { lr: "$.data.id" } }
          trigger:
            - { call: "POST /spd/sterilization-loads/${lr}/release", as: OrScheduler, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403)"]

      - name: technician_cannot_create_case
        claim_type: exclusive_denial
        grounds:
          - "roles.OrScheduler"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "OR case scheduling is OrScheduler-exclusive; an SpdTechnician is rejected."
        test_recipe:
          setup: ["technician A exists"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
          trigger:
            - { call: "POST /spd/or-cases", payload: { case_number: "C-Z", surgeon: "Dr Z", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T10:00:00Z", priority: "ELECTIVE" }, as: SpdTechnician, as_user_id: "${ta}", captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403)"]

      - name: auditor_cannot_operate_load_start
        claim_type: exclusive_denial
        grounds:
          - "roles.SpdTechnician"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Load operation is technician work; QualityAuditor (who later reads the BI) cannot start the cycle — segregation of duties between operation and quality oversight."
        test_recipe:
          setup: ["technician, sterilizer, load LA in LOADING"]
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${ta}", captures: { la: "$.data.id" } }
          trigger:
            - { call: "POST /spd/sterilization-loads/${la}/start", as: QualityAuditor, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403)"]

      - name: facility_admin_cannot_record_bi_result
        claim_type: exclusive_denial
        grounds:
          - "roles.QualityAuditor"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "BI result recording is QualityAuditor-exclusive; FacilityAdmin is rejected (role gate precedes existence, so even a placeholder BI id yields 403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spd/biological-indicators/00000000-0000-0000-0000-000000000000/record-result", payload: { result: "NEGATIVE" }, as: FacilityAdmin, captures: { err: "$.data.error_id" } }
          assert: ["err == ERR_FORBIDDEN_ROLE (http 403)"]

      - name: shared_read_allowed_for_business_roles
        claim_type: shared_allowance
        grounds:
          - "roles.Any"
        distinguishing_aspect: "GET endpoints carry roles [Any], admitting every declared role; the Any marker instructs the harness to issue the read with any one declared role (e.g. OrScheduler, an opaque role with no SPD duties) and expect success."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /spd/trays", as: Any }
          assert: ["response 200 with response_type array, total_count == 0"]

