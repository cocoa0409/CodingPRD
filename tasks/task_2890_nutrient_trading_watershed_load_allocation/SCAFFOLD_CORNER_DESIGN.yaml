        distinguishing_aspect: "Approving the first TMDL is the only path out of PROVISIONAL: the same call stamps TmdlAssessment.approved_at and flips Watershed.program_status to ACTIVE with trading_enabled true."
        test_recipe:
          setup:
            - "Watershed SCR is PROVISIONAL with trading_enabled false."
            - "TmdlAssessment TMDL-P-2026 sits in PUBLIC_COMMENT with one INVENTORIED POINT source and one ACTIVE allocation run, satisfying the approval precondition."
