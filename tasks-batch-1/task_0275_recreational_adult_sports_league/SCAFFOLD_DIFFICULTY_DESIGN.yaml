              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: LeagueAdmin
            - call: "POST /seasons/${s_id}/transition"
              payload: { target: "OPEN", expected_season_version: "${s_v0}" }
              as: LeagueAdmin
            - call: "GET /divisions/${d_id}"
              payload: {}
              as: LeagueAdmin
              captures: { d_v: $.data.version }
            - call: "POST /divisions/${d_id}/teams"
              payload: { name: "INV Team", captain_player_id: "${cap_id}", expected_division_version: "${d_v}" }
              as: TeamCaptain
              as_user_id: "${cap_id}"
              captures: { t_id: $.data.id }
            - call: "POST /teams/${t_id}/pay-fee"
              payload: { amount_cents: 8000 }
              as: TeamCaptain
              as_user_id: "${cap_id}"
            - call: "POST /teams/${t_id}/confirm"
              payload: {}
              as: LeagueAdmin
          trigger:
            - call: "POST /teams/${t_id}/withdraw"
              payload: {}
