  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_half_open_window_overlap
        grounds:
          - validations[priority=26]
          - entities.AuctionSale.fields.venue_name
        distinguishing_aspect: |
          Interval semantics: half-open [start, start+60min) occupancy on the
          venue resource. A second sale at the same venue starting 30 min into
          the first is rejected ERR_AUCTION_SCHEDULE_CONFLICT; a sale starting
          exactly at the first sale's end (+60min) is accepted — adjacency is
          not overlap under half-open semantics. Distinct resource and
          semantics from the publication min-gap instance.
        test_recipe:
          setup:
            - "Cases LN-O1A / LN-O1B both at PUBLICATION_COMPLETE; case A's sale scheduled 2026-11-23T10:00:00Z at VEN-O1"
          setup_api_calls:
