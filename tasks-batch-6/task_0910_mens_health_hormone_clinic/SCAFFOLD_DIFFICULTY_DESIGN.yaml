        distinguishing_aspect: |
          Different pair RefillOrder -> ControlledSubstancePrescription: creating a refill while the referenced
          prescription is SUSPENDED (not ISSUED) -> ERR_PRESCRIPTION_SUSPENDED.
        test_recipe:
          setup:
            - "Prescription SUSPENDED via MONITORING_HOLD cascade; membership ACTIVE/CURRENT."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr A", npi: "1000000015", dea_number: "AB1515151" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Thirteen", date_of_birth: "1977-03-17", sex: "MALE", email: "p13@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
