scaffold_corner_design:
  # =================================================================
  # Entities — creation, required fields, not-found, system/computed fields
  # =================================================================
  - section: entities
    instances:
      - name: create_license_returns_201_active_version_1
        claim_type: Creation
        grounds:
          - entities.License
          - endpoints
        distinguishing_aspect: "POST /compliance/licenses with all required fields returns 201, status defaults ACTIVE, version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/licenses"
              payload: { license_number: "LIC-CR1", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { lic_id: $.data.id, lic_status: $.data.status, lic_v: $.data.version }
          assert:
            - "response code 201; License.status == ACTIVE; License.version == 1; id is a non-prefixed UUID"

      - name: create_license_missing_license_type_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.License.fields.license_type
          - "validations[priority=16]"
        distinguishing_aspect: "Omitting required license_type returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/licenses"
              payload: { license_number: "LIC-CR2", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "response code 400; data.error_id == ERR_INVALID_REQUEST"

      - name: get_license_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.License
          - "validations[priority=3]"
        distinguishing_aspect: "GET /compliance/licenses/{id} with a random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/licenses/00000000-0000-4000-8000-000000000000"
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "response code 404; data.error_id == ERR_NOT_FOUND"

      - name: license_daily_limit_default_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.License.fields.daily_purchase_limit_grams
        distinguishing_aspect: "Omitting daily_purchase_limit_grams on a RETAIL license applies default 28.5."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/licenses"
              payload: { license_number: "LIC-CR3", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { limit: $.data.daily_purchase_limit_grams }
          assert:
            - "License.daily_purchase_limit_grams == 28.5 (default)"

      - name: plant_batch_live_count_computed_from_plant_count
        claim_type: Computed Fields
        grounds:
          - entities.PlantBatch.fields.live_plant_count
        distinguishing_aspect: "On create, PlantBatch.live_plant_count equals plant_count; a client-supplied live_plant_count would be ignored."
        test_recipe:
          setup: ["A CULTIVATION license."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "LIC-CR4", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
          trigger:
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-CR4", strain: "X", plant_count: 12, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { live: $.data.live_plant_count }
          assert:
            - "PlantBatch.live_plant_count == 12 (computed from plant_count)"

      - name: package_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Package.fields.id
          - entities.Package.fields.created_at
          - entities.Package.fields.version
        distinguishing_aspect: "Package id/created_at/version are server-generated; supplying them in the body is ignored (id is a fresh UUID, version == 1)."
        test_recipe:
          setup: ["A CULTIVATION license, a cured harvest."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "LIC-CR5", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-CR5", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-CR5", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
          trigger:
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-CR5", product_category: "FLOWER", quantity_grams: 50 }
              as: Cultivator
              captures: { pkg_v: $.data.version, pkg_status: $.data.status }
          assert:
            - "Package.version == 1; Package.status == TESTING; Package.lab_hold == true; Package.remaining_grams == 50"

      - name: license_invalid_enum_license_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.License.fields.license_type
          - "validations[priority=16]"
        distinguishing_aspect: "An out-of-enum license_type (e.g. WHOLESALE) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/licenses"
              payload: { license_number: "LIC-CR6", license_type: "WHOLESALE", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "response code 400; data.error_id == ERR_INVALID_REQUEST"

      - name: lab_result_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.LabResult
        distinguishing_aspect: "LabResult is common_fields:false (append-only) — it exposes id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["A TESTING package and a TESTING license; one recorded lab result."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-CR7", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-CR7", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-CR7", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-CR7", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-CR7", product_category: "FLOWER", quantity_grams: 50 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
              captures: { lr_id: $.data.id }
          trigger:
            - call: "GET /compliance/lab-results/${lr_id}"
              as: QALabUser
              captures: { lr_result: $.data.overall_result }
          assert:
            - "LabResult exposes id, created_at, overall_result but no version field"

  # =================================================================
  # State machines — invalid transitions, terminal lockdown, initial state, valid transition
  # =================================================================
  - section: state_machines
    instances:
      - name: advance_harvested_batch_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlantBatch
          - "validations[priority=4]"
        distinguishing_aspect: "Advancing a HARVESTED batch (no outgoing advance transition) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A batch advanced to FLOWERING then harvested (status HARVESTED)."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-S1", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-S1", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-S1", wet_weight_grams: 1000 }
              as: Cultivator
          trigger:
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; data.error_id == ERR_INVALID_STATE; batch stays HARVESTED"

      - name: finalize_already_finalized_sale_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Sale
          - "validations[priority=4]"
        distinguishing_aspect: "Finalizing a sale already in terminal FINALIZED returns 409 ERR_INVALID_STATE (second-call idempotency rejection)."
        test_recipe:
          setup: ["A FINALIZED sale (adult customer, one small flower line within limit)."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-S2", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-S2", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-S2", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-S2", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-S2", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-S2", product_category: "FLOWER", quantity_grams: 50 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: false }
              as: Budtender
              captures: { cust_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-12T00:00:00Z" }
              as: Budtender
              captures: { sale_id: $.data.id }
            - call: "POST /compliance/sales/${sale_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 5.0 }
              as: Budtender
            - call: "GET /compliance/sales/${sale_id}"
              as: Budtender
              captures: { sale_v: $.data.version }
            - call: "POST /compliance/sales/${sale_id}/finalize"
              payload: { expected_sale_version: "${sale_v}" }
              as: Budtender
          trigger:
            - call: "GET /compliance/sales/${sale_id}"
              as: Budtender
              captures: { sale_v2: $.data.version }
            - call: "POST /compliance/sales/${sale_id}/finalize"
              payload: { expected_sale_version: "${sale_v2}" }
              as: Budtender
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; data.error_id == ERR_INVALID_STATE; sale stays FINALIZED"

      - name: new_manifest_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.Manifest
          - entities.Manifest.fields.status
        distinguishing_aspect: "A newly created manifest starts in DRAFT with departed_at null, line_count 0, total_grams 0."
        test_recipe:
          setup: ["A DISTRIBUTION origin and a destination license."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "DIST-S3", license_type: "DISTRIBUTION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dist_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-S3", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dest_id: $.data.id }
          trigger:
            - call: "POST /compliance/manifests"
              payload: { origin_license_id: "${dist_id}", destination_license_id: "${dest_id}" }
              as: DistributionAgent
              captures: { man_status: $.data.status, man_lines: $.data.line_count }
          assert:
            - "Manifest.status == DRAFT; line_count == 0; total_grams == 0; departed_at == null"

      - name: cure_a_drying_harvest_records_dry_weight
        claim_type: Valid Transition
        grounds:
          - state_machines.Harvest.DRYING_to_CURED
          - entities.Harvest.fields.dry_weight_grams
        distinguishing_aspect: "POST cure on a DRYING harvest sets dry_weight_grams and moves status to CURED, recomputing remaining_weight_grams (no packages yet -> remaining == dry_weight)."
        test_recipe:
          setup: ["A DRYING harvest with wet 1000g."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-S4", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-S4", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-S4", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
          trigger:
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 700 }
              as: Cultivator
              captures: { harv_status: $.data.status, harv_rem: $.data.remaining_weight_grams }
          assert:
            - "Harvest.status == CURED; dry_weight_grams == 700; remaining_weight_grams == 700.0"

      - name: package_pass_branch_excluded_stub
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Package.TESTING_to_PASSED
        excluded_because:
          difficulty_instance: package_testing_branch_pass_vs_fail
          rationale: "PASS-branch side effects (lab_hold cleared, thc_pct set) are asserted in the named §1.8 instance."

  # =================================================================
  # Calculations — correctness, input-set filtering, constants
  # =================================================================
  - section: calculations
    instances:
      - name: flower_equiv_concentrate_factor_applied
        claim_type: Correct Result
        grounds:
          - calculations.package_flower_equivalent
          - entities.SaleLine.fields.flower_equiv_grams
        distinguishing_aspect: "A 2.0 g CONCENTRATE sale line yields flower_equiv_grams == 10.0 (factor 5.0)."
        test_recipe:
          setup: ["An ACTIVE CONCENTRATE package; OPEN sale; medical customer (so 10g equiv is within limit)."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-C1", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-C1", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-C1", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-C1", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-C1", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-C1", product_category: "CONCENTRATE", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 60.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: true, medical_card_number: "MED-C1" }
              as: Budtender
              captures: { cust_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-13T00:00:00Z" }
              as: Budtender
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /compliance/sales/${sale_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 2.0 }
              as: Budtender
              captures: { line_equiv: $.data.flower_equiv_grams }
          assert:
            - "SaleLine.flower_equiv_grams == 10.0 (2.0 * 5.0)"

      - name: daily_limit_excludes_voided_sales
        claim_type: Input Set Filtering
        grounds:
          - calculations.customer_daily_limit_check
          - entities.Sale.fields.status
        distinguishing_aspect: "A prior VOIDED same-day sale of 20g is excluded from the daily-limit window; a fresh 28.5g flower line still finalizes (28.5 == 28.5)."
        test_recipe:
          setup: ["RETAIL limit 28.5; adult customer; a prior VOIDED 20g sale dated 2026-06-14; a fresh OPEN sale with one 28.5g flower line same date."]
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-C2", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-C2", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-C2", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-C2", strain: "X", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-C2", wet_weight_grams: 1000 }
              as: Cultivator
