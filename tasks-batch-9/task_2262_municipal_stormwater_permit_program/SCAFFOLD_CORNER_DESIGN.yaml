      - name: scoped_natural_keys_reject_duplicates_but_allow_reuse_across_terms
        claim_type: type_constraints
        grounds:
          - validations[priority=65]
          - errors.ERR_DUPLICATE_PERMIT_NUMBER
          - errors.ERR_DUPLICATE_MEASURE_CODE
          - errors.ERR_DUPLICATE_OUTFALL_CODE
          - errors.ERR_DUPLICATE_PARCEL_ID
        distinguishing_aspect: "permit_number is unique globally while measure_code, outfall_code and parcel_id are unique only per permit_term_id, so the same three values are accepted under a second term and rejected under the first."
        test_recipe:
          setup:
            - "term A with PUBLIC_EDUCATION, outfall OF-01 and account P-1000; term B empty"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
