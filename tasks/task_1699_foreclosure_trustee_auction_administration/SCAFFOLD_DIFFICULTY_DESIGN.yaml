            - "Case LN-C1 driven to SOLD on 2026-11-23 with one third-party bid 43000000 (opening 42000000, deposit 1000000); close created CLEARED TRUSTEE_FEE and BENEFICIARY_DEBT_PAYOFF disbursements"
