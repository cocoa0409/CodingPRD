# §1.9 Scaffold Corner Design (breadth coverage of testable claims in §1.1–§1.7
# not already covered by §1.8). Sections / claim_types follow references/claim-extraction-guide.md.
# Every grounds[] resolves into SCAFFOLD.yaml; every literal in assert: is precomputed.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_order_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "POST /orders with customer_id+store_id returns 201; fulfillment_status==DRAFT, payment_status==UNAUTHORIZED, verified==false, version==1."
        test_recipe:
          setup: ["Customer C and Store S exist"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status, v: $.data.version }
          assert:
            - "response code 201"
            - "Order.fulfillment_status == DRAFT, payment_status == UNAUTHORIZED, verified == false, version == 1"

      - name: store_default_hold_window_applied
        claim_type: Defaults
        grounds: [entities.Store.fields.hold_window_minutes]
        distinguishing_aspect: "Omitting hold_window_minutes on POST /stores applies default 120."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { hw: $.data.hold_window_minutes }
          assert:
            - "Store.hold_window_minutes == 120 (default applied)"

      - name: slot_default_cutoff_offset_applied
        claim_type: Defaults
        grounds: [entities.PickupSlot.fields.cutoff_offset_minutes]
        distinguishing_aspect: "Omitting cutoff_offset_minutes on POST /pickup-slots applies default 30."
        test_recipe:
          setup: ["Store S exists"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T01:00:00Z", capacity: 3 }
              as: PlatformAdmin
              captures: { co: $.data.cutoff_offset_minutes }
          assert:
            - "PickupSlot.cutoff_offset_minutes == 30 (default applied)"

      - name: inventory_computed_available_equals_on_hand_at_create
        claim_type: Computed Fields
        grounds: [entities.StoreInventory.fields.available, entities.StoreInventory.fields.reserved]
        distinguishing_aspect: "On POST /store-inventory, reserved==0 and available==on_hand regardless of any input; computed, input ignored."
        test_recipe:
          setup: ["Store S, Product P exist"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 7 }
              as: PlatformAdmin
              captures: { res: $.data.reserved, avail: $.data.available }
          assert:
            - "StoreInventory.reserved == 0 and available == 7 at create"

      - name: pickup_event_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PickupEvent]
        distinguishing_aspect: "PickupEvent has common_fields:false — append-only; it exposes id and created_at but no version, and is created only as a side effect of pickup (never via a direct create/update endpoint)."
        test_recipe:
          setup: ["An order that completed a partial pickup, producing one PickupEvent"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
            - call: "POST /order-lines/${l_id}/pick"
              payload: { qty_picked: 1 }
              as: StorePicker
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/verify"
              payload: { presented_name: "Cust", presented_phone: "111" }
              as: StoreAssociate
            - call: "POST /orders/${o_id}/pickup"
              payload: { handovers: [ { order_line_id: "${l_id}", qty_handed_over: 1 } ] }
              as: StoreAssociate
          trigger:
            - call: "GET /orders/${o_id}/pickup-events"
              payload: {}
              as: StoreAssociate
              captures: { ev_id: "$.data[0].id", ev_cap: "$.data[0].captured_cents" }
          assert:
            - "GET /orders/{id}/pickup-events returns exactly 1 PickupEvent with captured_cents == 1000"
            - "no POST/PUT/PATCH/DELETE endpoint exists for PickupEvent (append-only)"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Order"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /orders/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response 404 with error_id == ERR_NOT_FOUND"

      - name: create_order_missing_store_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Order.fields.store_id"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /orders without store_id returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Customer C exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_enum_substitution_group_type
        claim_type: Type Constraints
        grounds:
          - "entities.OrderLine.fields.qty_ordered"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /orders/{id}/lines with qty_ordered 0 (non-positive) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["DRAFT order O at store S, product P"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 0 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id == ERR_INVALID_REQUEST (qty_ordered must be > 0)"

      - name: duplicate_inventory_same_store_product_returns_409
        claim_type: parent_relationships
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_DUPLICATE_INVENTORY]"
          - "entities.StoreInventory.fields.product_id"
        distinguishing_aspect: "Creating a second StoreInventory for the same (store_id, product_id) returns 409 ERR_DUPLICATE_INVENTORY."
        test_recipe:
          setup: ["StoreInventory(S,P) already exists"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
          trigger:
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 3 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_DUPLICATE_INVENTORY"

      - name: reference_not_found_submit_nonexistent_slot
        claim_type: parent_relationships
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
          - "entities.Order.fields.slot_id"
        distinguishing_aspect: "POST /orders/{id}/submit with a slot_id that does not exist returns 404 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["DRAFT order O with one line; no slot created"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "11111111-1111-4111-8111-111111111111", expected_slot_version: "${o_v}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 404 with error_id == ERR_REFERENCE_NOT_FOUND (existence priority 5 fires before OCC priority 9, regardless of version)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: start_picking_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Order.SUBMITTED_to_PICKING"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "start-picking on a DRAFT (not SUBMITTED) order returns 409 ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["DRAFT order O"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_INVALID_STATE"

      - name: stage_with_pending_line_returns_stage_not_ready
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Order.PICKING_to_STAGED"
          - "validations[priority=20]"
          - "errors[ERR_STAGE_NOT_READY]"
        distinguishing_aspect: "stage while a line is still RESERVED (not picked) returns 409 ERR_STAGE_NOT_READY."
        test_recipe:
          setup: ["Order in PICKING with one line RESERVED (not yet picked)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
          trigger:
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_STAGE_NOT_READY (a line is still RESERVED)"

      - name: cancel_completed_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Order.terminal_states"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "cancel on a COMPLETED order (terminal) returns 409 ERR_INVALID_STATE; no transition out of a terminal state."
        test_recipe:
          setup: ["An order driven to COMPLETED via full pickup"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
            - call: "POST /order-lines/${l_id}/pick"
              payload: { qty_picked: 1 }
              as: StorePicker
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/verify"
              payload: { presented_name: "Cust", presented_phone: "111" }
              as: StoreAssociate
            - call: "POST /orders/${o_id}/pickup"
              payload: { handovers: [ { order_line_id: "${l_id}", qty_handed_over: 1 } ] }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_INVALID_STATE (COMPLETED is terminal)"

      - name: submit_twice_idempotency_second_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.Order.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "submit again after a successful submit returns 409 ERR_INVALID_STATE (order no longer DRAFT)."
        test_recipe:
          setup: ["A DRAFT order with one line and an OPEN slot"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sv1: $.data.version }
          trigger:
            - call: "GET /pickup-slots/${slot_id}"
              payload: {}
              as: StoreManager
              captures: { sv_now: $.data.version }
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv_now}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second submit returns 409 with error_id == ERR_INVALID_STATE (order is SUBMITTED, not DRAFT)"

      - name: abandon_short_line_to_not_fulfilled
        claim_type: Valid Transition
        grounds: [state_machines.OrderLine.SHORT_PICKED_to_NOT_FULFILLED, entities.OrderLine.fields.line_status]
        distinguishing_aspect: "A SHORT_PICKED line with qty_picked 0 can be abandoned to NOT_FULFILLED, releasing its residual reservation."
        test_recipe:
          setup: ["Order in PICKING; line P x2 short-picked to 0 (SHORT_PICKED, no substitution group)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
