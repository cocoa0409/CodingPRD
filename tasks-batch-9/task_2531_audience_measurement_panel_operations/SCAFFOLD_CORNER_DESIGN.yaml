            - call: "GET /markets/${m13_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m13_v2: "$.data.version" }
          trigger:
            - call: "POST /processing-runs"
              payload: { market_id: "${m13_id}", universe_estimate_id: "${ue13_id}", edit_rule_set_id: "${rs13_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T12:00:00Z", expected_market_version: "${m13_v2}" }
