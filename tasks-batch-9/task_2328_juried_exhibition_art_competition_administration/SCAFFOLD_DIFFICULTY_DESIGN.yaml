          trigger:
            - { call: "POST /sales/${sale_id}/void", payload: { reason: "Buyer financing withdrawn." }, as: FinanceOfficer, as_user_id: "fin-001" }
          assert:
            - "before the void: Exhibition.${ex_id}.sales_gross_cents == 250000, commission_total_cents == 80460, sales_tax_total_cents == 20115, artist_payable_total_cents == 149425"
            - "after the void: Sale.${sale_id}.status == VOIDED and Sale.${sale_id}.void_reason == Buyer financing withdrawn."
            - "after the void: Exhibition.${ex_id}.sales_gross_cents == 0, commission_total_cents == 0, sales_tax_total_cents == 0, artist_payable_total_cents == 0 — every cent reversed, none stranded"
            - "after the void: Artwork.${aw_a_id}.status == ON_VIEW and Artwork.${aw_a_id}.sold_price_cents == null"
            - "Sale.${sale_id}.artist_payable_cents == 149425 is retained on the voided row (the ledger keeps the history, the aggregate excludes it)"
            - "Exhibition.${ex_id}.payouts_released_cents == 0 and Artwork.${aw_b_id}.status == ON_VIEW"
            - "GET /sales?artwork_id=${aw_a_id} returns total_count 1 (the void does not delete the row)"

      - name: deinstall_restores_wall_segment_occupancy
        grounds:
          - state_machines.Artwork[axis=placement_status].INSTALLED_to_DEINSTALLED
          - entities.WallSegment.fields.occupied_cm
          - entities.WallSegment.fields.available_cm
          - entities.WallSegment.fields.loaded_weight_kg
          - endpoints[POST /artworks/{id}/deinstall]
          - validations[priority=16]
        distinguishing_aspect: |
          Conserved quantity: WALL CENTIMETRES AND KILOGRAMS (not money). Deinstalling one of two
          installed works releases exactly its own 100 cm and 5 kg — occupied 200.0 -> 100.0,
          available 400.0 -> 500.0, loaded 11.0 -> 6.0 — while the invariant
          occupied_cm + available_cm == length_cm 600.0 holds throughout and the other work's span
          is untouched.
        test_recipe:
          setup:
            - "Exhibition ON_VIEW with wall W1 (length_cm 600, max_weight_kg 60)."
            - "aw_a (6 kg) installed at [0,100) and aw_b (5 kg) installed at [200,300): occupied_cm 200.0, available_cm 400.0, loaded_weight_kg 11.0."
            - "Both works have an INTAKE ConditionReport, so a DEINSTALL report is permitted."
