              as: ComplianceOfficer
            # The forecast reads completed_at; with no completed orders in window, predicted_order_count == 0
          trigger:
            - call: "POST /bpo/volume-forecasts"
              payload: { state_code: "NM", forecast_month: "2026-08" }
              as: OperationsManager
              captures: { pred: $.data.predicted_order_count }
          assert:
            - "VolumeForecast.predicted_order_count == 0 (no completed orders in trailing 3 months)"
            - "VolumeForecast.model_version == 'VWMA-3m-v1'"
            - "VolumeForecast.generated_at == 2026-08-01T00:00:00Z (current clock)"

