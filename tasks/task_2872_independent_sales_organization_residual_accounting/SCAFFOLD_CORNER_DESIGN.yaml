            - call: "GET /chargeback-events"
              payload: { merchant_id: "${m1}", limit: 2, offset: 2 }
              as: ResidualController
            - call: "GET /chargeback-events"
              payload: { merchant_id: "${m1}", limit: 2, offset: 4 }
              as: ResidualController
            - call: "GET /chargeback-events"
              payload: { merchant_id: "${m1}", period_month: "2026-07" }
              as: ResidualController
            - call: "GET /chargeback-events"
