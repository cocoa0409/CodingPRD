            - { call: "GET /network/members/00000000-0000-4000-8000-000000000010", as: NetworkManager, captures: { e_mem: "$.data.error_id" } }
            - { call: "GET /network/attestation-cycles/00000000-0000-4000-8000-000000000010", as: NetworkManager, captures: { e_cyc: "$.data.error_id" } }
            - { call: "GET /network/attestation-records/00000000-0000-4000-8000-000000000010", as: NetworkManager, captures: { e_rec: "$.data.error_id" } }
