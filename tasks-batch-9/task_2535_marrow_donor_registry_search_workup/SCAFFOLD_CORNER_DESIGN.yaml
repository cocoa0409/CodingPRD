            - "the corrected response succeeds with 200, status \"RESPONDED\" and reported_match_grade 9"
            - "a THIRD response to the same request returns 409 with error_id \"ERR_TYPING_REQUEST_NOT_OPEN\" - the row is no longer REQUESTED"
