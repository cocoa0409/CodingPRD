              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/fair-entries"
              payload: { member_id: "${mem_id}", project_id: "${proj_id}", fair_level: "COUNTY" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { fe_id: $.data.id }
          trigger:
            - call: "POST /api/fair-entries/${fe_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # member posture INELIGIBLE blocks confirm"

      - name: record_book_approve_requires_volunteer_cleared
        grounds:
          - state_machines.RecordBook.UNDER_REVIEW_to_APPROVED
          - entities.Volunteer.fields.screening_status
