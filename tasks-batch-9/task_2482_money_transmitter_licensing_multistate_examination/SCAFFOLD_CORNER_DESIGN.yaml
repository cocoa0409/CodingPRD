          - errors[ERR_STALE_LICENSE_VERSION]
        distinguishing_aspect: "StateLicense.version advances on every write including a pair of obligation adjustments that net to zero, so a caller holding the post-bond version is refused with ERR_STALE_LICENSE_VERSION (412) even though the license's business state is identical to what it saw."
