# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Endoscopy Suite Scheduling & Scope Reprocessing
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: patient_created_with_system_defaults
        claim_type: creation
        grounds: [entities.Patient, "endpoints[POST /endoscopy/patients]"]
        distinguishing_aspect: "A valid create returns 201 with server-minted UUID id, created_at/updated_at set, version == 1, and optional contact_phone defaulting to null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-1", full_name: "Pat One", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id, p1_v: $.data.version, p1_phone: $.data.contact_phone } }
          assert:
            - "Patient.${p1}.id is a server-minted UUID (no type prefix)"
            - "Patient.${p1}.version == 1 and created_at == updated_at"
            - "Patient.${p1}.contact_phone is null (default applied)"
      - name: patient_duplicate_mrn_rejected
        claim_type: type_constraints
        grounds: [entities.Patient.fields.mrn, "errors[ERR_PATIENT_MRN_EXISTS]"]
        distinguishing_aspect: "Second patient with the same mrn is rejected with 409 ERR_PATIENT_MRN_EXISTS."
        test_recipe:
          setup: ["one patient with mrn MRN-DUP"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-DUP", full_name: "Pat Dup", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-DUP", full_name: "Pat Two", date_of_birth: "1985-01-01" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PATIENT_MRN_EXISTS (409)"]
      - name: patient_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random unused UUID returns 404 ERR_PATIENT_NOT_FOUND inside the standard error envelope (response_type == error, data.error_id + data.message present)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /endoscopy/patients/00000000-0000-0000-0000-000000000000", payload: {}, as: UnitAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PATIENT_NOT_FOUND (404)"
            - "envelope response_type == 'error' and data.message is a non-empty string"
      - name: booking_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random unused booking UUID returns 404 ERR_BOOKING_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /endoscopy/bookings/00000000-0000-0000-0000-000000000000", payload: {}, as: UnitAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BOOKING_NOT_FOUND (404)"]
      - name: procedure_type_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.ProcedureType.fields.prep_protocol, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "prep_protocol outside {NONE, CLEAR_LIQUIDS, SPLIT_DOSE} is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /endoscopy/procedure-types", payload: { code: "BAD", display_name: "Bad", base_duration_minutes: 30, prep_protocol: "DEEP_CLEAN", colonoscopy_family: false, adr_relevant: false, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (400)"]
      - name: booking_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ProcedureBooking, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required room_id yields 400 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["patient, provider, procedure type exist"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-REQ", full_name: "Pat Req", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Req", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (400) — missing room_id"]
      - name: booking_system_and_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.ProcedureBooking.fields.procedure_minutes, entities.ProcedureBooking.fields.status]
        distinguishing_aspect: "Client-supplied id, version, status, and procedure_minutes are ignored: the response carries a server UUID, version 1, computed procedure_minutes == 40, status SCHEDULED."
        test_recipe:
          setup: ["patient P, provider DR1, COLONO type (base 40), room R_STD"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-SYS", full_name: "Pat Sys", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Sys", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { id: "11111111-1111-1111-1111-111111111111", version: 99, status: "COMPLETED", procedure_minutes: 999, patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id, b1_v: $.data.version, b1_status: $.data.status, b1_pm: $.data.procedure_minutes } }
          assert:
            - "Booking id != 11111111-1111-1111-1111-111111111111 (server-minted)"
            - "version == 1, status == SCHEDULED, procedure_minutes == 40 (computed, client value 999 ignored)"
      - name: scope_duplicate_serial_rejected
        claim_type: type_constraints
        grounds: [entities.Scope.fields.serial_number, "errors[ERR_SERIAL_NUMBER_EXISTS]"]
        distinguishing_aspect: "Duplicate scope serial_number yields 409 ERR_SERIAL_NUMBER_EXISTS."
        test_recipe:
          setup: ["one scope with serial SN-DUP"]
          setup_api_calls:
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SN-DUP", scope_type: "COLONOSCOPE" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SN-DUP", scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SERIAL_NUMBER_EXISTS (409)"]
      - name: procedure_type_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.ProcedureType.fields.code, "errors[ERR_PROCEDURE_TYPE_CODE_EXISTS]"]
        distinguishing_aspect: "Duplicate procedure-type code yields 409 ERR_PROCEDURE_TYPE_CODE_EXISTS."
        test_recipe:
          setup: ["one procedure type with code COLONO"]
          setup_api_calls:
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy variant", base_duration_minutes: 45, prep_protocol: "CLEAR_LIQUIDS", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PROCEDURE_TYPE_CODE_EXISTS (409)"]
      - name: quality_report_snapshot_unchanged_by_later_activity
        claim_type: immutability
        grounds: [entities.QualityMetricReport, calculations.adenoma_detection_rate]
        distinguishing_aspect: "A report is an immutable snapshot (common_fields: false — no version, no update endpoint): after a second procedure completes, re-reading the report shows adr_denominator still 1 and rate still 100.0."
        test_recipe:
          setup:
            - "DRQ, P_MID (1976-03-10, 50), COLONO, room RQ, scopes QS1/QS2"
            - "B1 SCREENING completed with adenomas 1; report R created (STRICT); then B2 SCREENING completed with adenomas 0"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-SNAP", full_name: "Pat Snap", date_of_birth: "1976-03-10" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Snap", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { drq: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RQ", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rq: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QS-1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qs1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "QS-2", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { qs2: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T08:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${drq}", procedure_type_id: "${t_col}", room_id: "${rq}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b2: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b2}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${qs1}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b1}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:40:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 500, adenomas_detected: 1 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/quality-reports", payload: { provider_id: "${drq}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-03T23:59:59Z", metric_variant: "STRICT" }, as: QualityOfficer, captures: { rep: $.data.id, rep_den: $.data.adr_denominator, rep_rate: $.data.adenoma_detection_rate } }
            # second procedure AFTER the snapshot
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b2}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b2}/start", payload: { scope_id: "${qs2}" }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/bookings/${b2}/record-prep-assessment", payload: { bbps_left: 3, bbps_right: 3, bbps_transverse: 3 }, as: Endoscopist, as_user_id: "${drq}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:40:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b2}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 600, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${drq}" }
          trigger:
            - { call: "GET /endoscopy/quality-reports/${rep}", payload: {}, as: QualityOfficer, captures: { rep_den_after: $.data.adr_denominator, rep_rate_after: $.data.adenoma_detection_rate } }
          assert:
            - "Report at creation: adr_denominator == 1, adenoma_detection_rate == 100.0"
            - "After B2 completes (would make it 1/2 == 50.0 in a live view): adr_denominator still == 1 and rate still == 100.0 (immutable snapshot)"
            - "Report has NO version/updated_at fields (common_fields: false)"
      - name: room_and_scope_defaults_on_create
        claim_type: defaults
        grounds: [entities.Room.fields.status, entities.Scope.fields.status, entities.Scope.fields.use_count]
        distinguishing_aspect: "New room: status ACTIVE; new scope: status AVAILABLE, use_count 0, storage_expires_at null, is_storage_current true."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /endoscopy/rooms", payload: { name: "R-D", room_class: "ERCP_CAPABLE", supports_anesthesia: false }, as: UnitAdmin, captures: { rm: $.data.id, rm_status: $.data.status } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SN-D", scope_type: "SIGMOIDOSCOPE" }, as: UnitAdmin, captures: { sc: $.data.id, sc_status: $.data.status, sc_uses: $.data.use_count, sc_exp: $.data.storage_expires_at, sc_cur: $.data.is_storage_current } }
          assert:
            - "Room ${rm}.status == ACTIVE (default)"
            - "Scope ${sc}: status == AVAILABLE, use_count == 0, storage_expires_at is null, is_storage_current == true (null expiry is current)"

  - section: state_machines
    instances:
      - name: booking_created_in_scheduled_prep_pending
        claim_type: initial_state
        grounds: [state_machines.ProcedureBooking, state_machines.ProcedureBookingPrep]
        distinguishing_aspect: "A new booking starts in (SCHEDULED, PREP_PENDING) with both axes visible in the create response."
        test_recipe:
          setup: ["patient, provider, COLONO type, room"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-INIT", full_name: "Pat Init", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Init", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id, b1_status: $.data.status, b1_prep: $.data.prep_status } }
          assert:
            - "status == SCHEDULED and prep_status == PREP_PENDING"
            - "rescheduled_from_id is null; notification_flag == false; bbps_* null; actual_start/actual_end null"
      - name: confirm_prep_happy_path
        claim_type: valid_transition
        grounds: [state_machines.ProcedureBookingPrep.PREP_PENDING_to_PREP_CONFIRMED]
        distinguishing_aspect: "confirm-prep on a SCHEDULED booking moves only the prep axis to PREP_CONFIRMED; booking axis stays SCHEDULED; version increments."
        test_recipe:
          setup: ["SCHEDULED booking B (COLONO/NONE)"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-CP", full_name: "Pat Cp", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Cp", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id, b1_v: $.data.version } }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator, captures: { prep: $.data.prep_status, v2: $.data.version } }
          assert:
            - "prep_status == PREP_CONFIRMED; status still SCHEDULED; version == ${b1_v} + 1"
      - name: check_in_requires_confirmed_prep_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ProcedureBooking.SCHEDULED_to_CHECKED_IN, "errors[ERR_PREP_NOT_CONFIRMED]"]
        distinguishing_aspect: "Check-in while prep axis is PREP_PENDING is rejected with ERR_PREP_NOT_CONFIRMED even inside the time window."
        test_recipe:
          setup: ["SCHEDULED booking at 2026-08-03T09:00, prep NOT confirmed, clock at 2026-08-03T09:00"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-PC", full_name: "Pat Pc", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Pc", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PREP_NOT_CONFIRMED (409); booking stays SCHEDULED"]
      - name: start_requires_checked_in_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProcedureBooking.CHECKED_IN_to_IN_PROGRESS, "errors[ERR_BOOKING_NOT_CHECKED_IN]"]
        distinguishing_aspect: "start from SCHEDULED (never checked in) is rejected with ERR_BOOKING_NOT_CHECKED_IN."
        test_recipe:
          setup: ["SCHEDULED booking, prep confirmed, scope SC1 available; clock at start time"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-SC", full_name: "Pat Sc", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Sc", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-S1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${dr1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BOOKING_NOT_CHECKED_IN (409); no ScopeUsage created"]
      - name: complete_requires_assessed_prep_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ProcedureBooking.IN_PROGRESS_to_COMPLETED, "errors[ERR_PREP_NOT_ASSESSED]"]
        distinguishing_aspect: "complete while prep axis is still PREP_CONFIRMED (never assessed) is rejected with ERR_PREP_NOT_ASSESSED."
        test_recipe:
          setup: ["booking IN_PROGRESS with scope SC1; no BBPS assessment recorded"]
          setup_api_calls:
