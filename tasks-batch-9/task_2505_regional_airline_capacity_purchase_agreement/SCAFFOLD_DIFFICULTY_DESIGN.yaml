  - rule_id: priority_pair_validation_conflict
    instances:
      - name: final_invoice_on_open_cycle_state_beats_fiscal
        grounds:
          - validations[priority=20]
          - validations[priority=74]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PASSTHROUGH_UNRECONCILED]
          - concurrency_rules[invoice-create-stale-cycle]
        distinguishing_aspect: |
          Category pair state (priority 20) vs business_fiscal (priority 74): one
          request violates both — a FINAL invoice is requested while the cycle is
          still OPEN and while a pass-through claim sits in ACTUAL_SUBMITTED — and
          the response must be ERR_INVALID_STATE, never ERR_PASSTHROUGH_UNRECONCILED.
        test_recipe:
          setup:
            - "ACTIVE agreement with one base."
            - "OPEN cycle 2026-09 with published_departures 5 (never closed)."
            - "One FUEL pass-through claim in ACTUAL_SUBMITTED (estimate 4000.00, actual 4300.00) — deliberately not reconciled."
            - "The caller holds the cycle's current version, so the OCC precondition passes and cannot mask the conflict."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
