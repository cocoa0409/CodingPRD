    roles: [HousingAuthorityAdmin, Landlord]
    code: 200
    input: ["limit?", "offset?"]
    output: Recertification[]
    side_effects: []

  - method: POST
    path: "/hcv/contracts/{id}/inspections"
    description: "Schedule a non-initial inspection (ANNUAL, REINSPECTION, COMPLAINT)"
    roles: [HousingAuthorityAdmin]
    code: 201
    input: [inspection_type, scheduled_date]
    output: Inspection
    side_effects: []
  - method: GET
    path: "/hcv/inspections/{id}"
    description: "Get inspection"
    roles: [HousingAuthorityAdmin, Landlord, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/hcv/inspections/{id}/record-result"
    description: "Record PASS or FAIL for a scheduled inspection"
    roles: [Inspector]
    code: 200
