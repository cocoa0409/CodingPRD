              captures: { aw: "$.data[0].id", monthly: "$.data[0].draw_schedule_monthly_cents" }
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 1 }
              as: CycleAdmin
              captures: { paid_after_first: "$.data.draw_paid_cents" }
          trigger:
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 1 }
              as: CycleAdmin
              captures: { err_bucket: "$.data.error_id" }
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 2 }
              as: CycleAdmin
              captures: { paid_after_second: "$.data.draw_paid_cents" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 1 }
              as: CycleAdmin
              captures: { paid_after_reuse: "$.data.draw_paid_cents" }
          assert:
            - "${monthly} == 1333333"
            - "${paid_after_first} == 1333333"
            - "${err_bucket} == ERR_DRAW_PERIOD_ALREADY_PAID with HTTP 409"
            - "no second SCHEDULED_DRAW DrawPayment for (2026, 1) is appended by the refused call, so GET /comp/awards/${aw}/draw-payments still shows one row at that point"
            - "${paid_after_second} == 2666666, so the 2026-02 bucket is free even though its calendar month is adjacent to the paid one"
            - "the reopen appends two DRAW_REVERSAL rows of -1333333 and marks both SCHEDULED_DRAW rows reversed == true"
            - "${paid_after_reuse} == 1333333, so the (2026, 1) bucket became available again purely because its occupant is now reversed"
            - "GET /comp/awards/${aw}/draw-payments returns 5 rows: SCHEDULED_DRAW 2026-01 (reversed), SCHEDULED_DRAW 2026-02 (reversed), DRAW_REVERSAL 2026-01, DRAW_REVERSAL 2026-02, SCHEDULED_DRAW 2026-01 (not reversed)"
            - "CompensationAward.${aw}.reconsideration_count == 1 and CompensationCycle.${cy}.reopen_count == 1"

      - name: non_billable_service_windows_require_more_than_one_day_gap
        grounds:
          - validations[priority=120]
          - errors[ERR_SERVICE_PERIOD_BUFFER_VIOLATION]
          - governance_constants.SERVICE_PERIOD_BUFFER_DAYS
          - entities.ContributionRecord.fields.service_period_start
          - entities.ContributionRecord.fields.service_period_end
          - endpoints[POST /comp/contribution-records]
        distinguishing_aspect: |
          A third resource entity (ContributionRecord, keyed per (partner_id, category))
          under a third interval semantics: closed intervals [start, end] plus a
          SERVICE_PERIOD_BUFFER_DAYS = 1 separation requirement. Unlike the half-open
          Matter windows, here adjacency is *illegal* - a March 31 end and an April 1 start
          are one day apart, which is not more than one, so they collide even though they
          do not overlap - and unlike the discrete draw buckets, the resource key is a
          category rather than the whole entity, so the identical April window is accepted
          under RECRUITING.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner P is FORMULA with one existing NON_BILLABLE ContributionRecord: category PRO_BONO, closed service period [2026-03-01, 2026-03-31], unverified."
            - "SERVICE_PERIOD_BUFFER_DAYS is 1, so two PRO_BONO windows must be separated by more than one day."
            - "No RECRUITING record exists for P."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Pia Probono", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "PRO_BONO", hours: 40.00, service_period_start: "2026-03-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { pb1: "$.data.id" }
          trigger:
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "PRO_BONO", hours: 30.00, service_period_start: "2026-04-01", service_period_end: "2026-04-30" }
              as: CycleAdmin
              captures: { err_buffer: "$.data.error_id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "PRO_BONO", hours: 30.00, service_period_start: "2026-04-02", service_period_end: "2026-04-30" }
              as: CycleAdmin
              captures: { ok_pb: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "RECRUITING", hours: 20.00, service_period_start: "2026-04-01", service_period_end: "2026-04-30" }
              as: CycleAdmin
              captures: { ok_rc: "$.data.id" }
          assert:
            - "${err_buffer} == ERR_SERVICE_PERIOD_BUFFER_VIOLATION with HTTP 409"
            - "the refused window [2026-04-01, 2026-04-30] does not overlap [2026-03-01, 2026-03-31] at all; it is rejected purely for being exactly 1 day away, which is not more than SERVICE_PERIOD_BUFFER_DAYS"
            - "GET /comp/contribution-records with partner_id ${pp} and category PRO_BONO returns exactly 1 row immediately after the refused call"
            - "the second call returns HTTP 201 and ContributionRecord.${ok_pb}.service_period_start == 2026-04-02, a 2-day gap, which is more than the buffer"
            - "the third call returns HTTP 201 for ContributionRecord.${ok_rc} with the identical [2026-04-01, 2026-04-30] window, because the buffer is keyed per (partner_id, category)"
            - "ContributionRecord.${pb1}.standard_value_cents == 0 and verified == false, so the buffer is enforced on unverified rows too"
            - "Partner.${pp}.non_billable_points == 0.00, since none of the three rows is verified"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: matter_origination_pct_conserved_across_effectuate_and_void
        grounds:
          - state_machines.CreditTransition.EFFECTIVE_to_VOIDED
          - endpoints[POST /comp/credit-transitions/{id}/void]
          - entities.Matter.fields.origination_pct_assigned
          - entities.Matter.fields.prior_responsible_attorney_id
          - entities.CreditTransition.fields.prior_credit_pct
          - concurrency_rules[transition-void-stale-matter]
        distinguishing_aspect: |
          Conserved quantity: Matter.origination_pct_assigned, a percentage-point capacity.
          The void is a true compensating action rather than a delete: it must restore the
          departing partner's allocation to ACTIVE at prior_credit_pct with credit_through
          cleared, supersede the successor row rather than remove it, restore
          responsible_attorney_id from the snapshot and clear that snapshot, so the
          conserved 100.00 holds before, between and after with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner A (FORMULA) originates two OPEN matters at ORIGINATING 100.00 each after ALLOCATE adjudications: M1 opened 2026-01-15 and M2 opened 2026-02-01. A is also billing and responsible attorney of both."
            - "Partner S (FORMULA) is ACTIVE and holds no allocation; Partner ARB is the is_credit_arbiter."
            - "A has given notice with departure_effective_on 2026-12-31, so two CreditTransitions exist in PROPOSED, T1 for M1 and T2 for M2, each with transferred_pct = prior_credit_pct = 100.00."
            - "Because T2 stays PROPOSED throughout, A remains NOTICE_GIVEN and never auto-transitions to DEPARTED, which is what keeps the void of T1 legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Stan Staying", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { ps: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-V1", client_display_name: "Void Ventures", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id", m1v: "$.data.version" }
            - call: "POST /comp/matters/${m1}/financials"
              payload: { billed_delta_cents: 400000, collected_delta_cents: 400000, direct_cost_delta_cents: 0, expected_matter_version: "${m1v}" }
              as: CycleAdmin
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Originated Void Ventures." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v2: "$.data.version" }
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m1v2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-V2", client_display_name: "Second Ventures", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m2: "$.data.id", m2v: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m2}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "Originated Second Ventures." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl2: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl2}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "POST /comp/credit-claims/${cl2}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 100.00, expected_matter_version: "${m2v}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "POST /comp/partners/${pa}/notice-of-departure"
              payload: { departure_effective_on: "2026-12-31" }
              as: CycleAdmin
            - call: "GET /comp/credit-transitions"
              payload: { departing_partner_id: "${pa}", matter_id: "${m1}" }
              as: CycleAdmin
              captures: { t1: "$.data[0].id", t1_pct: "$.data[0].prior_credit_pct" }
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v3: "$.data.version", opa_before: "$.data.origination_pct_assigned", resp_before: "$.data.responsible_attorney_id" }
          trigger:
            - call: "POST /comp/credit-transitions/${t1}/effectuate"
              payload: { successor_partner_id: "${ps}", effective_on: "2026-09-01", expected_matter_version: "${m1v3}" }
              as: CycleAdmin
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { m1v4: "$.data.version", opa_mid: "$.data.origination_pct_assigned", resp_mid: "$.data.responsible_attorney_id", prior_resp_mid: "$.data.prior_responsible_attorney_id" }
            - call: "POST /comp/credit-transitions/${t1}/void"
              payload: { void_reason: "The departure was withdrawn for this client relationship.", expected_matter_version: "${m1v4}" }
              as: CycleAdmin
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { opa_after: "$.data.origination_pct_assigned", resp_after: "$.data.responsible_attorney_id", prior_resp_after: "$.data.prior_responsible_attorney_id" }
          assert:
            - "${t1_pct} == 100.00"
            - "${opa_before} == 100.00"
            - "${opa_mid} == 100.00"
            - "${opa_after} == 100.00"
            - "${resp_before} == ${pa} and ${resp_after} == ${pa}"
            - "${prior_resp_mid} == ${pa} while the transition is EFFECTIVE, and ${prior_resp_after} is null after the void"
            - "CreditTransition.${t1}.state == VOIDED and CreditTransition.${t1}.void_reason is the supplied string"
            - "after the void the ORIGINATING allocation of ${pa} on ${m1} is ACTIVE again at credit_pct 100.00 with credit_from 2026-01-15 and credit_through null"
            - "after the void the ORIGINATING allocation of ${ps} on ${m1} is SUPERSEDED, not deleted, so GET /comp/matters/${m1}/credit-allocations with credit_role=ORIGINATING returns 2 rows"
            - "Partner.${ps}.credited_collection_provisional_cents == 0 after the void"
            - "Partner.${pa}.credited_collection_provisional_cents is identical before the effectuate and after the void"
            - "CompensationCycle.${cy}.total_formula_score is identical before the effectuate and after the void"
            - "Partner.${pa}.status == NOTICE_GIVEN throughout, since T2 on ${m2} is still PROPOSED"

      - name: cycle_undistributed_cash_conserved_across_draw_and_reopen
        grounds:
          - state_machines.CompensationCycle.AWARDS_PUBLISHED_to_DELIBERATION
          - entities.CompensationCycle.fields.undistributed_cash_cents
          - entities.CompensationCycle.fields.reopen_count
          - entities.CompensationAward.fields.draw_paid_cents
          - entities.CompensationAward.fields.reconsideration_count
          - entities.DrawPayment.fields.reversed
          - entities.DrawPayment.enums.kind
        distinguishing_aspect: |
          A different conserved quantity from
          matter_origination_pct_conserved_across_effectuate_and_void: cash cents rather
          than percentage points, reconciled over an append-only immutable ledger. The
          reopen may not delete or mutate the two SCHEDULED_DRAW rows; it must append
          signed DRAW_REVERSAL rows of -1333333 and flip reversed, so
          undistributed_cash_cents returns to exactly 100000000 while the ledger grows from
          2 rows to 4.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Cycle fiscal_year 2026 with distributable_pool_cents 100000000, discretionary_pool_pct 0.2000 and draw_pct 0.8000 has been advanced to AWARDS_PUBLISHED."
            - "Partner SUBJ is DISCRETIONARY with evaluation_required true and committee_points 700.00 from two CAST ballots of 800.00 and 600.00; CM1 and CM2 are committee members with evaluation_required false."
            - "SUBJ's award is PUBLISHED with target_award_cents 20000000 and draw_schedule_monthly_cents 1333333, payment_state PENDING, draw_paid_cents 0."
            - "No DrawPayment row exists yet and CompensationCycle.undistributed_cash_cents equals distributable_pool_cents exactly."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Dana Subject", practice_group: "CORPORATE", compensation_model: "DISCRETIONARY", admission_year: 2012, target_capital_cents: 30000000 }
              as: CycleAdmin
              captures: { subj: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cora Chair", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { cm1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Milo Member", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2007, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { cm2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Client development and firm service summary.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${subj}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${subj}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${cm1}" }
              as: CycleAdmin
              captures: { pr1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${cm2}" }
              as: CycleAdmin
              captures: { pr2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${pr1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Consistently strong." }
              as: Partner
              as_user_id: "${cm1}"
            - call: "POST /comp/peer-reviews/${pr2}/decide"
              payload: { outcome: "SCORE", technical_score: 5, collaboration_score: 4, client_service_score: 3, comment: "Excellent technically." }
              as: Partner
              as_user_id: "${cm2}"
            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm1}" }
              as: CycleAdmin
              captures: { b1: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm2}" }
              as: CycleAdmin
              captures: { b2: "$.data[0].id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv1: "$.data.version" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "CAST", points_proposed: 800.00, rationale: "Outstanding origination year.", expected_cycle_version: "${cyv1}" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv2: "$.data.version" }
            - call: "POST /comp/ballots/${b2}/cast"
              payload: { action: "CAST", points_proposed: 600.00, rationale: "Solid but not exceptional.", expected_cycle_version: "${cyv2}" }
              as: CommitteeMember
              as_user_id: "${cm2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
            - call: "GET /comp/awards"
              payload: { cycle_id: "${cy}", partner_id: "${subj}" }
              as: CycleAdmin
              captures: { aw: "$.data[0].id", target: "$.data[0].target_award_cents" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cash_before: "$.data.undistributed_cash_cents" }
          trigger:
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 1 }
              as: CycleAdmin
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 2 }
              as: CycleAdmin
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cash_mid: "$.data.undistributed_cash_cents" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
              captures: { cash_after: "$.data.undistributed_cash_cents", reopens: "$.data.reopen_count" }
          assert:
            - "${target} == 20000000"
            - "${cash_before} == 100000000"
            - "${cash_mid} == 97333334"
            - "${cash_after} == 100000000"
            - "${reopens} == 1"
            - "CompensationAward.${aw}.draw_paid_cents == 0 after the reopen"
            - "CompensationAward.${aw}.award_state == PROPOSED, payment_state == PENDING and reconsideration_count == 1 after the reopen"
            - "Partner.${subj}.ytd_draw_paid_cents == 0 after the reopen"
            - "GET /comp/awards/${aw}/draw-payments returns exactly 4 rows in created_at ASC order; the two SCHEDULED_DRAW rows still carry amount_cents 1333333 and are unmodified except for reversed == true"
            - "exactly 2 of those rows have kind == DRAW_REVERSAL and each has amount_cents == -1333333, with period_month 1 and 2 respectively"
            - "the signed sum of amount_cents over all 4 DrawPayment rows is exactly 0, which is why ${cash_after} equals ${cash_before}"
            - "Partner.${subj}.committee_points == 700.00 is unchanged by the reopen, since the CAST ballots are not reset"
