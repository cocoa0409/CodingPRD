  - rule_id: boundary_precision_check
    instances:
      - name: candidate_select_at_exactly_sixty_composite_is_allowed
        grounds:
          - calculations.candidate_composite_score.constants.SELECTION_THRESHOLD
          - validations.priority_24.ERR_PRIORITY_SCORE_BELOW_THRESHOLD
          - state_machines.PriorityCandidate.SCORED_to_SELECTED
        distinguishing_aspect: |
          Two candidates share identical severity (50.00), disparity points
          (40.00) and community concern (80.00) and differ only in hospital
          capacity: 70 gives a composite of exactly 60.00 and 69.96 gives
          59.99. The selection threshold is inclusive, so the first is
          selectable and the second — one hundredth of a point below — is not.
          The 0.04 capacity gap also proves the composite is rounded once at
          the end rather than per term.
        test_recipe:
          setup:
            - "AssessmentCycle in PRIORITIZATION with posture OPEN"
            - "two HealthIndicator rows in the BEHAVIORAL_HEALTH domain, each with benchmark_value 12.0 and ACTIVE data points OVERALL 12.0, BLACK_NH 14.0, WHITE_NH 10.0 — so each has severity_score 50.00 and disparity_ratio 1.40 (disparity points 40.00)"
            - "one COMPLETED StakeholderInterview rating BEHAVIORAL_HEALTH at 4 with attendee_count 10, giving community_concern_index 80.00"
            - "candidate A with hospital_capacity_score 70 and candidate B with hospital_capacity_score 69.96, both SCORED under EQUAL_WEIGHT"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
