      # --- calculations: claims already exercised by the difficulty design --------
      - name: trust_deposit_first_installment_rounds_up_before_summation
        claim_type: waterfall_allocation
        grounds:
          - calculations.minor_trust_deposit_schedule
          - entities.MinorProtection.fields.per_installment_cents
          - entities.MinorProtection.fields.trust_deposited_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / trust_installments_rounded_per_installment_then_summed_mode_b
          rationale: |
            The difficulty instance already drives the whole allocation: it pins
            per_installment_cents 4,286 from 30,000 over 7 installments and the summed
            deposited total 30,002, proving the round_half_up happens per installment
            and only then sums (a single division rounded once would return 30,000).
            A corner duplicate would re-run the same arithmetic on the same endpoint.

      - name: welfare_band_threshold_at_five_million
        claim_type: threshold
        grounds:
          - calculations.welfare_commitment_rollup
          - calculations.welfare_commitment_rollup.constants.BAND_MID_FLOOR_CENTS
        excluded_because:
          difficulty_instance: boundary_precision_check / welfare_band_floor_exactly_five_million_crosses_rate
          rationale: |
            The difficulty instance sits exactly on BAND_MID_FLOOR_CENTS and shows a
            subtotal of 5,000,000 taking the 0.07 band (5,350,000) while 4,999,999
            stays on 0.04, which is the strongest possible form of this threshold
            claim. Restating it here would add no independent coverage.

      - name: stipend_variants_diverge_on_the_same_row
        claim_type: variant_divergence
        grounds:
          - calculations.agreement_stipend_commitment
          - calculations.agreement_stipend_commitment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / agreement_stipend_provisional_vs_final_diverge
          rationale: |
            The difficulty instance already establishes that the two variants disagree
            on one unchanged row (2,106,625 FINAL against 3,945,000 PROVISIONAL, a
            1,838,375 delta) with every divergence source active at once: the
            episodes_used floor, the press reserve, the assumed reunion and the
            suppressed depiction discount. Divergence is its whole subject.

  # ===========================================================================
  - section: validations
    instances:

      - name: eligibility_age_band_upper_bound_is_inclusive
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_33
          - entities.Applicant.fields.date_of_birth
          - entities.CastingCall.fields.min_age
          - entities.CastingCall.fields.max_age
          - entities.CastingCall.fields.residency_state_code
        distinguishing_aspect: |
          Satisfaction claim on both halves of priority 33. Completed age is measured at
          photography_start_utc 2026-09-15, not at the logical clock: a 1981-09-15
          birthday lands on exactly 45 and passes the inclusive upper bound, while
          1980-09-15 is 46 and fails. The residency clause is separately falsifiable —
          an otherwise perfectly aged NY applicant is rejected against a GA-restricted
          call — so a build that dropped either clause, or that measured age at the
          clock date (2026-08-01, where the 1981 applicant is still 44), diverges.
        test_recipe:
          setup:
            - "One production with photography_start_utc 2026-09-15; one PUBLISHED REFERRAL call restricted to GA with an 18..45 age band."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 18, max_age: 45, exclusivity_window_days: 0, residency_state_code: "GA" }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Rita Boundary", date_of_birth: "1981-09-15", residency_state_code: "GA" }
              as: CastingDirector
              captures: { at_bound_id: $.data.id, at_bound_status: $.data.screening_status, at_bound_minor: $.data.is_minor }
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Oren Overage", date_of_birth: "1980-09-15", residency_state_code: "GA" }
              as: CastingDirector
              captures: { over_err: $.data.error_id }
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Nadia Elsewhere", date_of_birth: "1994-04-02", residency_state_code: "NY" }
              as: CastingDirector
              captures: { resid_err: $.data.error_id }
          assert:
            - "${at_bound_status} == SUBMITTED"
            - "${at_bound_minor} == false"
            - "${over_err} == ERR_ELIGIBILITY_NOT_MET"
            - "HTTP 422 with ERR_ELIGIBILITY_NOT_MET for the 1980-09-15 applicant"
            - "${resid_err} == ERR_ELIGIBILITY_NOT_MET"
            - "CastingCall.${call_id}.screened_pass_count == 0"

      - name: minor_application_without_guardian_name_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_34
          - entities.Applicant.fields.guardian_name
          - entities.Applicant.fields.is_minor
        distinguishing_aspect: |
          Violation claim isolated to priority 34. The 2011-05-20 applicant is 15 at
          photography start, inside the call's 13..60 band, so priority 33 passes and
          only the missing guardian_name can fail — ERR_GUARDIAN_REQUIRED at 422, not
          ERR_INVALID_REQUEST at 400, because guardian_name is an optional body field
          whose necessity is derived from the computed is_minor flag rather than
          declared in the request shape. Supplying it turns the same request into a 201.
        test_recipe:
          setup:
            - "One production with photography_start_utc 2026-09-15; one PUBLISHED REFERRAL call with a 13..60 age band."
