            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: CustomerServiceRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WORK_ORDER_NOT_CANCELLABLE with http 409; order stays IN_PROCESS"

      - name: release_from_running_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.LoadBatch.BUILDING_to_RELEASED
          - errors[ERR_LOAD_NOT_BUILDING]
        excluded_because:
          difficulty_instance: release_state_error_beats_furnace_safety_error
          rationale: "Asserted there as the priority-5 winning error of the dual-failure release attempt."

      - name: abort_branch_compensation
        claim_type: side_effect_execution
        grounds:
          - state_machines.LoadBatch.RUNNING_to_ABORTED
        excluded_because:
          difficulty_instance: load_batch_complete_vs_abort_divergent_branches
          rationale: "The ABORTED branch's compensation side effects (assignment REMOVED, order back to RECEIVED, weight 0) are asserted there."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: furnace_posture_progression_and_overdue_precedence
        claim_type: correct_result
        grounds:
          - calculations.furnace_qualification_posture
          - entities.Furnace.fields.qualification_status
        distinguishing_aspect: "Posture derivation is pinned step by step: no records -> UNQUALIFIED; TUS only -> UNQUALIFIED (calibration missing); both PASS -> QUALIFIED; after the clock passes both due dates the precedence rule yields SURVEY_OVERDUE (not CALIBRATION_OVERDUE)."
        test_recipe:
          setup: ["one CLASS_3 furnace; TUS and calibration PASS performed 2026-08-01 (both due 2026-10-30)"]
          setup_api_calls:
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id, posture0: $.data.qualification_status } }
          trigger:
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "GET /furnaces/${furn_id}", payload: {}, as: ShopScheduler, captures: { posture1: $.data.qualification_status } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "GET /furnaces/${furn_id}", payload: {}, as: ShopScheduler, captures: { posture2: $.data.qualification_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: ShopScheduler }
            - { call: "GET /furnaces/${furn_id}", payload: {}, as: ShopScheduler, captures: { posture3: $.data.qualification_status } }
          assert:
            - "Initially (no records): qualification_status == UNQUALIFIED"
            - "After TUS PASS only: still UNQUALIFIED (calibration record missing)"
            - "After calibration PASS: QUALIFIED"
            - "With clock at 2026-10-31 (both due 2026-10-30, both overdue): SURVEY_OVERDUE — TUS precedence over calibration is honored"

      - name: pyrometry_next_due_intervals_per_class
        claim_type: constants_applied
        grounds:
          - calculations.pyrometry_next_due
        distinguishing_aspect: "The TUS interval constant is per furnace class (CLASS_1 30d -> 2026-08-31, CLASS_5 180d -> 2027-01-28) while calibration is a flat 90d (2026-10-30), all anchored at performed_at 2026-08-01."
        test_recipe:
          setup: ["one CLASS_1 furnace and one CLASS_5 furnace"]
          setup_api_calls:
            - { call: "POST /furnaces", payload: { furnace_code: "F-C1", furnace_class: "CLASS_1", max_load_weight_lb: 500, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_c1: $.data.id } }
            - { call: "POST /furnaces", payload: { furnace_code: "F-C5", furnace_class: "CLASS_5", max_load_weight_lb: 2000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_c5: $.data.id } }
          trigger:
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_c1}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech, captures: { due_c1: $.data.next_due_at } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_c5}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech, captures: { due_c5: $.data.next_due_at } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_c5}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-1" }, as: CalibrationTech, captures: { due_cal: $.data.next_due_at } }
          assert:
            - "CLASS_1 TUS next_due_at == 2026-08-31T00:00:00Z (30 days)"
            - "CLASS_5 TUS next_due_at == 2027-01-28T00:00:00Z (180 days)"
            - "Calibration next_due_at == 2026-10-30T00:00:00Z (flat 90 days regardless of class)"

      - name: turnaround_exactly_at_due_not_breached
        claim_type: precision
        grounds:
          - calculations.turnaround_breach_assessment
        distinguishing_aspect: "Boundary precision on the guarantee clock: shipping exactly at promised_due_at is NOT a breach (strictly-greater semantics), so the final rush surcharge equals the 35000-cent quote instead of being waived to 0."
        test_recipe:
          setup: ["RUSH order (charge 100000, 48h guarantee, received 2026-08-01T00:00:00Z, due 2026-08-03T00:00:00Z) processed and PASSed; clock advanced to exactly promised_due_at"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Exact Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 48 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [40, 42, 41], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CustomerServiceRep }
          trigger:
            - { call: "POST /work-orders/${wo_id}/ship", payload: {}, as: CustomerServiceRep }
          assert:
            - "WorkOrder.${wo_id}.shipped_at == 2026-08-03T00:00:00Z == promised_due_at"
            - "turnaround_breached == false (equality is not a breach)"
            - "rush_surcharge_final_cents == 35000 (full quote retained, not waived to 0)"

      - name: hardness_and_distortion_inclusive_boundaries
        claim_type: precision
        grounds:
          - entities.InspectionTest.fields.result
          - entities.InspectionTest.fields.avg_hardness_hrc
        distinguishing_aspect: "Both acceptance bands are inclusive: avg hardness exactly at hardness_min_hrc (38.0) passes, distortion exactly at fixture_distortion_allowance_in (0.005) passes, and distortion 0.006 fails even with in-band hardness."
        test_recipe:
          setup: ["three orders processed in one completed load on a QUALIFIED furnace (recipe band [38, 44], allowance 0.005)"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Band Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_a: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_b: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_c: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_a}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v2: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_b}", expected_load_batch_version: "${load_v2}" }, as: ShopScheduler }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v3: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_c}", expected_load_batch_version: "${load_v3}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
          trigger:
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_a}", hardness_readings: [38, 38], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1", captures: { res_a: $.data.result, avg_a: $.data.avg_hardness_hrc } }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_b}", hardness_readings: [40, 42, 41], measured_distortion_in: 0.005 }, as: QualityEngineer, as_user_id: "qe-1", captures: { res_b: $.data.result } }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_c}", hardness_readings: [40], measured_distortion_in: 0.006 }, as: QualityEngineer, as_user_id: "qe-1", captures: { res_c: $.data.result } }
          assert:
            - "Order A: avg_hardness_hrc == 38.0 == hardness_min_hrc and result == PASS (inclusive lower band)"
            - "Order B: distortion 0.005 == allowance and result == PASS (inclusive distortion boundary)"
            - "Order C: distortion 0.006 > 0.005 and result == FAIL despite in-band hardness; quality_status FAILED and a DispositionCase OPEN created"

      - name: tc_excursion_tolerance_boundary
        claim_type: precision
        grounds:
          - calculations.tc_excursion_assessment
          - entities.LoadBatch.fields.out_of_spec
        distinguishing_aspect: "The excursion test is strictly-greater on the tolerance band: a reading at exactly soak_temp + tolerance (1660) leaves the load in-spec, while 1665 marks it out_of_spec at complete-run."
        test_recipe:
          setup: ["QUALIFIED furnace, recipe soak 1650 +/- 10; load A with a 1665 reading and load B with a 1660 reading, each with one order, both run to COMPLETED"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "TC Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_a: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_b: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_a: $.data.id, load_a_v: $.data.version } }
            - { call: "POST /load-batches/${load_a}/assignments", payload: { work_order_id: "${wo_a}", expected_load_batch_version: "${load_a_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_a}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_a}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /thermocouple-readings", payload: { load_batch_id: "${load_a}", channel: "LOAD_TC_1", recorded_at: "2026-08-02T10:00:00Z", temp_f: 1665 }, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_a}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-03T08:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ShopScheduler, captures: { load_b: $.data.id, load_b_v: $.data.version } }
            - { call: "POST /load-batches/${load_b}/assignments", payload: { work_order_id: "${wo_b}", expected_load_batch_version: "${load_b_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_b}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_b}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /thermocouple-readings", payload: { load_batch_id: "${load_b}", channel: "LOAD_TC_1", recorded_at: "2026-08-03T10:00:00Z", temp_f: 1660 }, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_b}/complete-run", payload: {}, as: FurnaceOperator }
          trigger:
            - { call: "GET /load-batches/${load_a}", payload: {}, as: ShopScheduler, captures: { oos_a: $.data.out_of_spec } }
            - { call: "GET /load-batches/${load_b}", payload: {}, as: ShopScheduler, captures: { oos_b: $.data.out_of_spec } }
          assert:
            - "LoadBatch.${load_a}.out_of_spec == true (|1665 - 1650| = 15 > 10)"
            - "LoadBatch.${load_b}.out_of_spec == false (|1660 - 1650| = 10, exactly at tolerance, in spec)"

      - name: rush_quote_clamp_formula
        claim_type: correct_result
        grounds: [calculations.rush_surcharge_quote]
        excluded_because:
          difficulty_instance: rush_quote_nested_clamp_and_expedite_branch
          rationale: "All three clamp/branch paths are asserted with computed literals there."

      - name: energy_surcharge_rounding_order
        claim_type: precision
        grounds: [calculations.energy_surcharge_settlement]
        excluded_because:
          difficulty_instance: energy_surcharge_round_per_order_then_sum
          rationale: "The pinned round-per-line-then-sum order is asserted there with a 3992 vs 3991 divergence."

      - name: liability_payout_variants
        claim_type: variant_divergence
        grounds: [calculations.liability_payout]
        excluded_because:
          difficulty_instance: liability_payout_standard_vs_extended_tier
          rationale: "Both tier variants asserted with computed payouts 300000 vs 85000 there."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers fails at priority 1 before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /customer-accounts"
              payload: { name: "NoAuth Co" }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with http 400"

      - name: segregation_of_duties_blocks_same_user_decide
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.InspectionTest.fields.recorded_by_user_id
