      - name: duty_window_lower_bound_exclusive
        claim_type: correct_result
        grounds: [calculations.duty_hours_accumulation]
        distinguishing_aspect: "The rolling 7-day window is (now-7d, now] — lower bound EXCLUSIVE: an assignment whose duty_end_at is exactly 2026-08-03T00:00:00Z (now-7d with the clock at 2026-08-10T00:00:00Z) contributes 0 to duty_hours_7d."
