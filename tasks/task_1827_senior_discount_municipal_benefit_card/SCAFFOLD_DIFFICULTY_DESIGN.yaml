# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 1827 — Senior Discount & Municipal Benefit Card Program
# Two instances per Difficulty Rule (§0.5). All numeric fixtures precomputed.
#
# Shared onboarding convention (from empty DB, default logical clock
# 2026-08-01T00:00:00Z): INITIAL application with dob 1961-08-01 (age exactly
# 65) and income 1000000 (<= 2400000) -> start-review by EligibilitySpecialist
# "spec-1" -> 3 documents (PROOF_OF_AGE / PROOF_OF_INCOME / PROOF_OF_RESIDENCY)
# each VERIFIED by "spec-1" -> approve by ProgramAdministrator "admin-1"
# (segregation: admin-1 != spec-1). Result: Cardholder ACTIVE with
# recertification_due_date 2027-08-01 and one ACTIVE card expiring 2028-08-01.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_provisional_vs_final_basis_divergence
        grounds:
          - calculations.merchant_claim_amount
          - state_machines.UsageTransaction.POSTED_to_FLAGGED
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Dual-variant calculation on the MERCHANT REIMBURSEMENT (fiscal) domain:
          the same five August transactions yield provisional_amount_cents == 2500
          under provisional_submission_basis (POSTED+FLAGGED included) but
          final_amount_cents == 2000 under final_approval_basis (POSTED only),
          because the fifth transaction is FLAGGED at approval time.
        test_recipe:
          setup:
            - "Cardholder onboarded (INITIAL approved); one ACTIVE card"
            - "Merchant: reimbursement_rate_pct 50, monthly cap 100000; GROCERY offer 10% off, max_discount_cents 1000, window [2026-01-01, 2027-01-01)"
            - "ProgramFund fiscal_year 2026 allocated 1000000"
            - "Five August transactions of purchase 10000: each discount_cents = min(1000 raw, 1000 cap, monthly remaining) = 1000; the 5th same-day transaction is auto-FLAGGED (calendar-day count reaches 5)"
            - "Clock advanced to 2026-09-01 so period 2026-08 is closed"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Ada Lovelace", date_of_birth: "1961-08-01", annual_income_cents: 1000000, residency_address: "1 Main St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "DOD-1961" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "IRS-2025" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "UTIL-0716" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Corner Grocery", reimbursement_rate_pct: 50, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 1000, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/program-funds", payload: { fiscal_year: 2026, allocated_cents: 1000000 }, as: ProgramAdministrator, captures: { fund_id: $.data.id } }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 10000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 10000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 10000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 10000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 10000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/merchants/${m_id}/reimbursement-claims", payload: { period_month: "2026-08" }, as: MerchantOperator, as_user_id: "${m_id}", captures: { claim_id: $.data.id, prov: $.data.provisional_amount_cents } }
            - { call: "POST /senior-benefits/reimbursement-claims/${claim_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { fin: $.data.final_amount_cents } }
          assert:
            - "ReimbursementClaim.${claim_id}.provisional_amount_cents == 2500  (5 lines: POSTED+FLAGGED basis, round_half_up(1000*50/100)=500 each)"
            - "ReimbursementClaim.${claim_id}.final_amount_cents == 2000  (4 POSTED lines only; the FLAGGED 5th transaction is excluded)"
            - "ReimbursementClaim.${claim_id}.status == APPROVED"
            - "provisional (2500) != final (2000): identical transaction set, two valid bases, different cents"
            - "ProgramFund.${fund_id}.paid_cents == 2000 and available_cents == 998000"

      - name: velocity_calendar_day_vs_trailing_24h_divergence
        grounds:
          - calculations.velocity_transaction_count
          - "errors[ERR_VELOCITY_HARD_LIMIT]"
          - state_machines.UsageTransaction.POSTED_to_FLAGGED
        distinguishing_aspect: |
          Dual-variant calculation on the CARDHOLDER FRAUD-RISK domain (different
          domain from merchant reimbursement): for an identical transaction history
          the calendar_day_window variant (governs auto-flag) counts 1 while the
          trailing_24h_window variant (governs hard reject) counts 5 — probe A stays
          POSTED, proving calendar-day governs flagging; probe B (9 prior within
          24h across two calendar dates) is rejected ERR_VELOCITY_HARD_LIMIT although
          its calendar-day count is only 6 — proving trailing-24h governs rejection.
        test_recipe:
          setup:
            - "Two cardholders X and Y, each onboarded with an ACTIVE card"
            - "Merchant (rate 10, cap 100000) with GROCERY offer 10% max 100 over [2026-01-01, 2027-01-01)"
            - "X: 4 transactions at 2026-08-10T20:00:00Z (all POSTED, day counts 1-4)"
            - "Y: 4 transactions at 2026-08-10T20:00:00Z, then clock to 2026-08-11T08:00:00Z and 5 more (the 5th that day auto-FLAGGED; fraud_flag_count == 1 < 3 so Y stays ACTIVE)"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Xavier Senior", date_of_birth: "1960-01-01", annual_income_cents: 900000, residency_address: "2 Oak St" }, as: Applicant, captures: { app_x: $.data.id } }
