            - "${r_status3} == FINAL and ${r_by3} == admin-1 and ${ev_status3} == RECONCILED"
            - "ReconciliationReport.${r_id}.scan_derived_attendance is still 2 after the loop — reopening does not clear the derived figures"
            - "GET /events/${ev_id}/audit-log-entries?subject_id=${r_id} returns at least three entries (finalize, reopen, finalize)"

      - name: ticket_parallel_state_dimensions_are_independent
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[Ticket].field=lifecycle_status
          - state_machines[Ticket].field=admission_status
        excluded_because:
          difficulty_instance: ticket_lifecycle_and_admission_dimensions_advance_independently
          rationale: |
            That instance already drives both Ticket dimensions across the same fixture —
            a resale moves lifecycle_status ISSUED → LISTED → RESOLD while admission_status
            stays NOT_ADMITTED, and a scan then moves admission_status to INSIDE without
            disturbing lifecycle_status — which is exactly the parallel-shape claim.

      - name: credential_request_revision_loop_terminates
        claim_type: cyclic
        grounds:
          - state_machines[CredentialRequest].transitions[CHANGES_REQUESTED_to_SUBMITTED]
          - calculations.credential_window_overlap_capacity.constants.MAX_CREDENTIAL_REVISIONS
          - validations[priority=40]
        excluded_because:
          difficulty_instance: credential_request_revision_cycle_caps_at_two_resubmissions
          rationale: |
            The loop-count termination condition is the whole point of that instance: it
            walks the SUBMITTED ↔ CHANGES_REQUESTED cycle twice, checks revision_count
            after each pass, and asserts ERR_MAX_REVISIONS_EXCEEDED on the third submit.

      - name: denied_entry_incident_branches_to_remediated_or_dismissed
        claim_type: branching
        grounds:
          - state_machines[DeniedEntryIncident].transitions
          - state_machines[DeniedEntryIncident].terminal_states
        excluded_because:
          difficulty_instance: denied_entry_incident_fork_remediate_and_dismiss_diverge
          rationale: |
            Both fork arms are exercised there on sibling incidents from the same review
            state, including the divergent field consequences (a credit is computed on the
            remediate arm and stays null on the dismiss arm), so a separate fork test would
            duplicate it.

      - name: cross_entity_side_effect_from_a_denied_scan
        claim_type: cross_entity
        grounds:
          - state_machines[ResaleListing].transitions[LISTED_to_SUSPENDED]
          - state_machines[Ticket].transitions[LISTED_to_ISSUED]
        excluded_because:
          difficulty_instance: device_mismatch_denial_cascades_to_listing_suspension_and_lifecycle_revert
          rationale: |
            That instance follows the full four-link chain from a ScanEvent through the
            incident, the recomputed fraud score, the suspended listing and back to the
            ticket's lifecycle_status, verifying each intermediate entity's state.

      - name: void_compensates_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines[Ticket].transitions[LISTED_to_VOIDED]
          - endpoints[POST /tickets/{id}/void].side_effects
        excluded_because:
          difficulty_instance: ticket_void_cascade_reverses_listing_zone_and_settlement_pool
          rationale: |
            The undo path is measured there field by field — zone issued count, event
            entitlements_outstanding, settlement pool and listing status — with before and
            after values captured, which is the compensation claim in full.

      - name: guarded_transition_depends_on_the_gate_state
        claim_type: guarded_transitions
        grounds:
          - validations[priority=11]
          - state_machines[Gate].transitions[SCANNING_to_IDLE]
        excluded_because:
          difficulty_instance: scan_refused_when_the_gate_of_the_session_is_no_longer_scanning
          rationale: |
            The guard "a scan is accepted only while the session's Gate is SCANNING" is
            tested there in both directions: accepted while SCANNING, then
            ERR_GATE_NOT_SCANNING once the gate has returned to IDLE.
  # ===========================================================================
  # Table 3 — Calculations
  # Twelve calculation rules; the four heavily-composed ones and both
  # dual-variant ones are owned by §1.8 and recorded here as exclusions.
  # ===========================================================================
  - section: calculations
    instances:
      - name: rotating_barcode_is_stable_within_an_epoch_and_changes_across_epochs
        claim_type: correct_result
        grounds:
          - calculations.rotating_barcode_token
          - calculations.rotating_barcode_token.constants.BARCODE_ROTATION_SECONDS
          - endpoints[GET /tickets/{id}/barcode]
        distinguishing_aspect: |
          With barcode_anchor_at 2026-09-12T18:00:00Z and BARCODE_ROTATION_SECONDS 30, the
          logical clock at 18:10:00Z is epoch floor(600 / 30) == 20 and at 18:10:30Z is
          epoch 21; two reads inside the same epoch return byte-identical barcodes, and
          accepted_epoch_floor trails the current epoch by exactly SKEW_TOLERANCE_EPOCHS.
        test_recipe:
          setup:
            - "Event ON_SALE with AccessZone GA1 and one PAID ticket for Ada."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 200, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /tickets/${t_id}/barcode"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { seed: $.data.barcode_seed, ep1: $.data.barcode_epoch_index, bc1: $.data.current_barcode, floor1: $.data.accepted_epoch_floor }
            - call: "GET /tickets/${t_id}/barcode"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { ep2: $.data.barcode_epoch_index, bc2: $.data.current_barcode }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:30Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "GET /tickets/${t_id}/barcode"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { ep3: $.data.barcode_epoch_index, bc3: $.data.current_barcode, floor3: $.data.accepted_epoch_floor }
          assert:
            - "${ep1} == 20 and ${floor1} == 19 — 600 seconds after the anchor divided by 30, minus SKEW_TOLERANCE_EPOCHS 1"
            - "${ep2} == 20 and ${bc2} == ${bc1} — the token is a pure function of seed and epoch, so a re-read inside the same epoch is identical"
            - "${bc1} == the concatenation ${seed} + \"-\" + \"20\""
            - "${ep3} == 21 and ${floor3} == 20 and ${bc3} != ${bc1}"
            - "GET /tickets/${t_id}/barcode is a pure read: Ticket.${t_id}.version is still 1 after all three reads"

      - name: price_cap_regime_none_permits_any_ask_price_with_a_null_cap
        claim_type: constants_applied
        grounds:
          - calculations.resale_price_cap
          - entities.Event.fields.price_cap_regime
          - validations[priority=35]
          - entities.ResaleListing.fields.cap_price_cents
        distinguishing_aspect: |
          Under regime NONE the cap is null rather than 0 or face value, and the
          priority-35 comparison is skipped entirely, so an ask of 9,999,900 cents on a
          12,000-cent ticket is accepted — the opposite of every capped regime, where the
          same ask would be ERR_PRICE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Event created with price_cap_regime NONE, advanced to ON_SALE; Ada verified and holding a PAID 12,000-cent ticket at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
