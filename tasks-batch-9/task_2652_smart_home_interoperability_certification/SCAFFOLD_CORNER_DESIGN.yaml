        distinguishing_aspect: >
          Five error ids that no other corner reaches, each shown next to the nearly identical request that
          succeeds: feature_code uniqueness is scoped to (specification_id, device_type) so the same code
          is legal on a second device type but not on the first; declared_feature_codes is validated
          against the pinned specification's codes; a plugfest registration whose submission is pinned to a
          different specification than the event is a device-type coherence failure, not a not-found; a
