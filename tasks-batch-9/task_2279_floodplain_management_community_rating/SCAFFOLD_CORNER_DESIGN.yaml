      - name: conditional_action_review_grants_floodproofing_credit_by_use
        claim_type: conditional_action
        grounds:
          - endpoints."POST /floodplain/permits/{permitId}/submit"
          - calculations.required_lowest_floor_elevation.constants.FLOODPROOFING_CREDIT_FT
        excluded_because:
          difficulty_instance: required_elevation_non_residential_floodproofing_credit_applies
          rationale: |
            That §1.8 conditional_branch instance submits the same floodproofing request against
            a NON_RESIDENTIAL and a RESIDENTIAL structure and contrasts the two requirements,
            which is this conditional-action claim in full.

      - name: computed_read_tracks_the_a510_probation_credit
        claim_type: computed_read
        grounds:
          - endpoints."GET /floodplain/communities/{communityId}/compliance-summary"
          - calculations.sanction_risk_and_posture
        excluded_because:
          difficulty_instance: sanction_probation_credit_applied_once_from_provisional_tier
          rationale: |
            That §1.8 instance drives the summary's a510_credit_applied and the single-pass
            provisional-tier ordering, so a second computed-read probe of the credit path would
            duplicate it.

      - name: action_endpoint_appeal_decision_compensates_the_determination
        claim_type: action_endpoint
        grounds:
          - endpoints."POST /floodplain/determination-cases/{caseId}/appeal-decision"
          - state_machines.DeterminationCase.APPEALED_to_APPEAL_SUSTAINED
        excluded_because:
          difficulty_instance: appeal_sustain_branch_compensates_substantial_improvement
          rationale: |
            That §1.8 compensation instance already asserts the SUSTAIN branch's outcome,
            reverted substantial_status and untouched ledger, covering every side effect of
            this endpoint's interesting branch.

  # ===========================================================================
  # Guide section 6 — From Table 6 (Errors)
  # Triggerability sweep: every §1.6 code must have at least one producing test.
  # The instances below close the codes that no other section reaches.
  # ===========================================================================
  - section: errors
    instances:

      - name: read_without_a_role_header_is_unauthorized
        claim_type: error_triggerability
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          A blank X-User-Role on an endpoint that every role may call still fails closed with
          401 ERR_UNAUTHENTICATED at priority 1 — authentication is checked before the
          endpoint's role list, so this is not the 403 ERR_ROLE_NOT_PERMITTED case.
        test_recipe:
          setup:
            - "A community exists."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
          trigger:
            - call: "GET /floodplain/communities/${comm_id}"
              as: ""
              as_user_id: ""
              note: "X-User-Role and X-User-ID sent blank"
          assert:
            - "HTTP status == 401"
            - "data.error_id == 'ERR_UNAUTHENTICATED'"
            - "no Community field is read or written"

      - name: certificate_naming_a_structure_outside_its_permit_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_28
          - errors.ERR_CERTIFICATE_STRUCTURE_MISMATCH
        distinguishing_aspect: |
          Both structures sit on the same parcel and both ids resolve, so this is not a 404:
          the certificate's structure_id simply disagrees with its permit's structure_id, which
          is 422 ERR_CERTIFICATE_STRUCTURE_MISMATCH and not the sibling
          ERR_STRUCTURE_PROPERTY_MISMATCH raised at permit creation.
        test_recipe:
          setup:
            - "Canonical base fixture plus a second structure on the same parcel."
            - "Permit ISSUED against the first structure."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_a_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "NON_RESIDENTIAL", pre_firm: false, construction_year: 2004, market_value_usd: 90000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_b_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_a_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 20000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /floodplain/permits/${permit_id}/review"
              payload: { decision: "APPROVE" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/permits/${permit_id}/issue"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/elevation-certificates"
              payload: { permit_id: "${permit_id}", structure_id: "${struct_b_id}", certificate_type: "FINISHED_CONSTRUCTION", datum: "NAVD88", measured_lowest_floor_ft: 14.0, measured_bfe_ft: 12.0, surveyor_license_no: "TX-5511" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_CERTIFICATE_STRUCTURE_MISMATCH'"
            - "Structure.${struct_b_id}.lowest_floor_elevation_ft == null"
            - "DevelopmentPermit.${permit_id}.status == ISSUED"

      - name: reversal_record_without_a_target_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_28
          - errors.ERR_REVERSAL_TARGET_INVALID
          - entities.ImprovementRecord.fields.reverses_record_id
        distinguishing_aspect: |
          reverses_record_id is conditionally required rather than schema-required, so omitting
          it on a REVERSAL yields 422 ERR_REVERSAL_TARGET_INVALID at priority 28 instead of the
          priority-20 ERR_INVALID_REQUEST, and the ledger aggregates of the structure stay
          exactly where the single counted record left them.
        test_recipe:
          setup:
            - "Canonical base fixture; one IMPROVEMENT record of 60000 on 2026-06-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
