# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1269: College & Career Readiness Advising
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Section values follow the guide's nine sections. Instances already exercised
# by §1.8 are emitted as excluded_because stubs.
# Logical clock default: 2026-05-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: student_creation_defaults_and_system_fields
        claim_type: creation
        grounds: ["entities.Student", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /ccr/students with only required fields applies defaults (first_generation=false, status=ENROLLED), mints a UUID id, starts version at 1, and stamps created_at/updated_at with 3 fractional digits."
        test_recipe:
          setup: ["Advisor A exists with capacity"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "E Adv", email: "ea@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
          trigger:
            - { call: "POST /ccr/students", payload: { student_ref: "ES1", full_name: "Stu Ent", grade_level: 9, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id } }
          assert:
            - "Student.${s_id}.status == ENROLLED and first_generation == false"
            - "Student.${s_id}.version == 1 and id is a server-minted UUID (no type prefix)"
            - "created_at == updated_at with millisecond (3-digit) fraction"
            - "Student.${s_id}.assigned_advisor_id == ${ad_id}"

      - name: student_create_missing_required_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=2]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required demographic_group is a schema violation -> 400 ERR_VALIDATION before any role/existence work."
        test_recipe:
          setup: ["Advisor A exists"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "E Adv2", email: "ea2@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
          trigger:
            - call: "POST /ccr/students"
              payload: { student_ref: "ES2", full_name: "No Group", grade_level: 10, advisor_id: "${ad_id}" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status == 400"

      - name: student_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Student.fields.demographic_group", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "demographic_group=GROUP_Z is not in the declared enum -> ERR_VALIDATION; grade_level=13 violates the 9..12 range the same way (second probe in the same trigger)."
        test_recipe:
          setup: ["Advisor A exists"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "E Adv3", email: "ea3@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
          trigger:
            - call: "POST /ccr/students"
              payload: { student_ref: "ES3", full_name: "Bad Enum", grade_level: 10, demographic_group: "GROUP_Z", advisor_id: "${ad_id}" }
              as: DistrictAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /ccr/students"
              payload: { student_ref: "ES4", full_name: "Bad Grade", grade_level: 13, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }
              as: DistrictAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_VALIDATION (enum closure)"
            - "err2 == ERR_VALIDATION (numeric range)"

      - name: advisor_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID hits existence (priority 4) -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "Ghost Anchor", email: "ghost@d.org", max_caseload: 10 }, as: DistrictAdmin }
          trigger:
            - call: "GET /ccr/advisors/00000000-0000-4000-8000-000000000000"
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: student_list_pagination_and_filters
        claim_type: listing
        grounds: ["endpoints.GET /ccr/students", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /ccr/students honors limit/offset and demographic_group filter, and the envelope carries total_count and has_more per §1.0."
        test_recipe:
          setup: ["Advisor A; 3 students GROUP_A and 2 students GROUP_B"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "L Adv", email: "la2@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "LP1", full_name: "P One", grade_level: 9, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "LP2", full_name: "P Two", grade_level: 9, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "LP3", full_name: "P Three", grade_level: 10, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "LP4", full_name: "P Four", grade_level: 10, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "LP5", full_name: "P Five", grade_level: 10, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin }
          trigger:
            - { call: "GET /ccr/students", payload: { demographic_group: "GROUP_A", limit: 2, offset: 0 }, as: DistrictAdmin }
          assert:
            - "response_type == array; data has exactly 2 students, all GROUP_A"
            - "total_count == 3 and has_more == true"
            - "Second page (offset 2) returns 1 student with has_more == false"

      - name: plan_patch_active_plan_returns_409
        claim_type: conditional_validation
        grounds: ["endpoints.PATCH /ccr/plans/{id}", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PATCH is legal in DRAFT/REVISING only; an ACTIVE plan rejects edits with ERR_INVALID_STATE (conditional on entity state)."
        test_recipe:
          setup: ["Advisor A; pathway GEN; grade-12 student with plan ACTIVE"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "PP Adv", email: "ppa@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GP", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "PP1", full_name: "Stu Patch", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
          trigger:
            - call: "PATCH /ccr/plans/${pl_id}"
              payload: { interest_inventory: [{ interest_code: "ART", score: 4 }] }
              as: Advisor
              as_user_id: "${ad_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (ACTIVE plan is not editable without revise)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: enrollment_completed_terminal_lockdown_returns_409
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CourseEnrollment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: a follow-up transition to ENROLLED fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; enrollment completed"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "SM Adv", email: "sma@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GS", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "SM1", full_name: "Stu SM", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "X1", term: "2026-SPRING", credits: 2 }, as: Advisor, as_user_id: "${ad_id}", captures: { en_id: $.data.id } }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "COMPLETED", grade: "A" }, as: Advisor, as_user_id: "${ad_id}" }
          trigger:
            - call: "POST /ccr/enrollments/${en_id}/transition"
              payload: { to_status: "ENROLLED" }
              as: Advisor
              as_user_id: "${ad_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; CourseEnrollment.${en_id} stays COMPLETED with grade A"

      - name: milestone_complete_from_pending_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.ApplicationMilestone.READY_to_COMPLETED", "errors[ERR_MILESTONE_NOT_ACTIONABLE]"]
        distinguishing_aspect: "A milestone whose dependency is unmet sits in PENDING; completing it fails with ERR_MILESTONE_NOT_ACTIONABLE — the self-referential gate is enforced via the state machine."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; application with custom INTERVIEW milestone depending on seeded ESSAY (still READY, not COMPLETED)"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "MS Adv", email: "msa@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GM", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "MS1", full_name: "Stu MS", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "GET /ccr/applications/${ap_id}/milestones", as: Student, as_user_id: "${s_id}", captures: { m0: "$.data[0].id" } }
            - { call: "POST /ccr/applications/${ap_id}/milestones", payload: { kind: "INTERVIEW", due_at: "2026-06-01T00:00:00Z", depends_on_milestone_id: "${m0}" }, as: Student, as_user_id: "${s_id}", captures: { m3: $.data.id } }
          trigger:
            - call: "POST /ccr/milestones/${m3}/transition"
              payload: { to_status: "COMPLETED" }
              as: Student
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "ApplicationMilestone.${m3}.status == PENDING (created with unmet dependency)"
            - "error_id == ERR_MILESTONE_NOT_ACTIONABLE"

      - name: milestone_dependency_bubble_up_to_ready
        claim_type: side_effect_execution
        grounds: ["state_machines.ApplicationMilestone.PENDING_to_READY"]
        distinguishing_aspect: "Completing the prerequisite flips the dependent milestone PENDING -> READY inside the same request's side effects (bubble-up along the self-referential edge)."
        test_recipe:
          setup: ["Same shape as milestone_complete_from_pending_returns_409: INTERVIEW depends on seeded ESSAY"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "MB Adv", email: "mba@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GMB", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "MB1", full_name: "Stu MB", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "GET /ccr/applications/${ap_id}/milestones", as: Student, as_user_id: "${s_id}", captures: { m0: "$.data[0].id" } }
            - { call: "POST /ccr/applications/${ap_id}/milestones", payload: { kind: "INTERVIEW", due_at: "2026-06-01T00:00:00Z", depends_on_milestone_id: "${m0}" }, as: Student, as_user_id: "${s_id}", captures: { m3: $.data.id } }
          trigger:
            - { call: "POST /ccr/milestones/${m0}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "GET /ccr/milestones/${m3}", as: Student, as_user_id: "${s_id}" }
            - { call: "GET /ccr/milestones/${m0}/dependents", as: Student, as_user_id: "${s_id}" }
          assert:
            - "ApplicationMilestone.${m3}.status == READY after the dependency completed"
            - "GET dependents of ${m0} returns exactly [${m3}]"

      - name: audit_flag_requires_reason_returns_400
        claim_type: precondition_enforcement
        grounds: ["state_machines.SeniorAudit.IN_REVIEW_to_FLAGGED", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "IN_REVIEW -> FLAGGED without a non-empty flag_reason is a schema violation (400), not a state error."
        test_recipe:
          setup: ["Advisors AX (assigned), AY (auditor); grade-12 student; audit IN_REVIEW"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "FRx", email: "frx@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "FRy", email: "fry@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "FR1", full_name: "Stu FR", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/senior-audits", payload: { auditor_advisor_id: "${ay_id}" }, as: DistrictAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay_id}" }
          trigger:
            - call: "POST /ccr/senior-audits/${aud_id}/transition"
              payload: { to_status: "FLAGGED" }
              as: Advisor
              as_user_id: "${ay_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (missing flag_reason); audit stays IN_REVIEW"

      - name: outcome_verified_terminal_lockdown_returns_409
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.OutcomeRecord", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED is terminal: DISPUTED afterwards -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["GRADUATED student with an outcome record already VERIFIED"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "OVx", email: "ovx@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "OVy", email: "ovy@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GOV", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "OV1", full_name: "Stu OV", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ax_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "CR24", term: "2026-SPRING", credits: 24 }, as: Advisor, as_user_id: "${ax_id}", captures: { en_id: $.data.id } }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "COMPLETED", grade: "PASS" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/senior-audits", payload: { auditor_advisor_id: "${ay_id}" }, as: DistrictAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay_id}" }
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "CERTIFIED" }, as: Advisor, as_user_id: "${ay_id}" }
            - { call: "POST /ccr/students/${s_id}/graduate", as: DistrictAdmin }
            - { call: "POST /ccr/students/${s_id}/outcome-records", payload: { outcome_type: "EMPLOYED", reported_at: "2026-05-02T00:00:00Z" }, as: DistrictAdmin, captures: { oc_id: $.data.id } }
            - { call: "POST /ccr/outcome-records/${oc_id}/transition", payload: { to_status: "VERIFIED" }, as: DistrictAdmin }
          trigger:
            - call: "POST /ccr/outcome-records/${oc_id}/transition"
              payload: { to_status: "DISPUTED" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; OutcomeRecord.${oc_id}.verification_status stays VERIFIED"

      - name: plan_revise_patch_reactivate_cycle
        claim_type: valid_transition
        grounds: ["state_machines.StudentPlan.ACTIVE_to_REVISING", "state_machines.StudentPlan.REVISING_to_ACTIVE"]
        distinguishing_aspect: "The revision loop ACTIVE -> REVISING -> (PATCH allowed) -> ACTIVE is traversable; PATCH in REVISING recomputes pathway alignment when pathway_id changes."
        test_recipe:
          setup: ["Advisor A; pathways GEN1 (requires [C1]) and GEN2 (requires [C2]); student; plan on GEN1 ACTIVE; C1 enrollment COMPLETED"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "RV Adv", email: "rva@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GEN1", name: "Gen One", required_course_codes: ["C1"] }, as: DistrictAdmin, captures: { pw1: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GEN2", name: "Gen Two", required_course_codes: ["C2"] }, as: DistrictAdmin, captures: { pw2: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "RV1", full_name: "Stu RV", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw1}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "C1", term: "2026-SPRING", credits: 4 }, as: Advisor, as_user_id: "${ad_id}", captures: { en_id: $.data.id } }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "COMPLETED", grade: "A" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/plans/${pl_id}/revise", as: Advisor, as_user_id: "${ad_id}" }
          trigger:
            - { call: "PATCH /ccr/plans/${pl_id}", payload: { pathway_id: "${pw2}" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/enrollments/${en_id}", as: Advisor, as_user_id: "${ad_id}" }
          assert:
            - "After PATCH: CourseEnrollment.${en_id}.counts_toward_pathway == false (C1 not in GEN2 requirements)"
            - "StudentPlan.${pl_id}.status == ACTIVE after re-activation and alignment_official_pct == 0.0"
  # ===========================================================================
  - section: calculations
    instances:
      - name: certification_points_levels
        claim_type: correct_result
        grounds: ["calculations.certification_points"]
        distinguishing_aspect: "Threshold ladder: no PASSED cert -> 0; PASSED non-required -> 50; PASSED required CNA -> 100; pathway without requirement -> 100. Staged asserts on one student plus a no-requirement control student."
        test_recipe:
          setup:
            - "Advisor A; pathway HLTH requires cert CNA (no courses, 0 hours); pathway FREE requires nothing"
            - "Student S1 on HLTH with ACTIVE plan; student S2 on FREE with ACTIVE plan"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "CP Adv", email: "cpa@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "HLTH", name: "Health", required_course_codes: [], required_certification_code: "CNA", required_work_hours: 0 }, as: DistrictAdmin, captures: { pw1: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "FREE", name: "Free", required_course_codes: [] }, as: DistrictAdmin, captures: { pw2: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "CP1", full_name: "Stu CP1", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /ccr/students/${s1}/plans", payload: { pathway_id: "${pw1}", expected_student_version: "${s1_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { p1: $.data.id } }
            - { call: "POST /ccr/plans/${p1}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students", payload: { student_ref: "CP2", full_name: "Stu CP2", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s2: $.data.id, s2_v: $.data.version } }
            - { call: "POST /ccr/students/${s2}/plans", payload: { pathway_id: "${pw2}", expected_student_version: "${s2_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { p2: $.data.id } }
            - { call: "POST /ccr/plans/${p2}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s1}/certifications", payload: { cert_code: "OSHA" }, as: WblCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /ccr/certifications/${c1}/transition", payload: { to_status: "EXAM_SCHEDULED", exam_at: "2026-05-10T09:00:00Z" }, as: WblCoordinator }
            - { call: "POST /ccr/certifications/${c1}/transition", payload: { to_status: "PASSED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${s1}/certifications", payload: { cert_code: "CNA" }, as: WblCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /ccr/certifications/${c2}/transition", payload: { to_status: "EXAM_SCHEDULED", exam_at: "2026-05-12T09:00:00Z" }, as: WblCoordinator }
          trigger:
            - { call: "GET /ccr/plans/${p1}", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/certifications/${c2}/transition", payload: { to_status: "PASSED" }, as: WblCoordinator }
            - { call: "GET /ccr/plans/${p1}", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/plans/${p2}", as: Advisor, as_user_id: "${ad_id}" }
          assert:
            - "Before CNA PASSED: StudentPlan.${p1}.certification_points == 50 (OSHA PASSED, CNA only scheduled)"
            - "After CNA PASSED: StudentPlan.${p1}.certification_points == 100"
            - "StudentPlan.${p2}.certification_points == 100 (pathway FREE requires none)"

      - name: wbl_hours_capped_at_100
        claim_type: correct_result
        grounds: ["calculations.wbl_hours_progress"]
        distinguishing_aspect: "hours_logged 45 against required_work_hours 40 caps at 100.0 (cap applied after rounding), not 112.5."
        test_recipe:
          setup: ["Advisor A; pathway WBL40 (no courses, no cert, 40 hours); student with ACTIVE plan; site; placement completed with 45 hours"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "WH Adv", email: "wha@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "WBL40", name: "Work", required_course_codes: [], required_work_hours: 40 }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "WH1", full_name: "Stu WH", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "WHS", name: "WH Site", max_concurrent_placements: 5 }, as: DistrictAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-04-01T00:00:00Z", term_end: "2026-05-01T00:00:00Z", hours_per_week: 12 }, as: WblCoordinator, captures: { plc: $.data.id } }
            - { call: "POST /ccr/placements/${plc}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/placements/${plc}/transition", payload: { to_status: "ACTIVE" }, as: WblCoordinator }
          trigger:
            - { call: "POST /ccr/placements/${plc}/transition", payload: { to_status: "COMPLETED", hours_logged: 45 }, as: WblCoordinator }
            - { call: "GET /ccr/plans/${pl_id}", as: Advisor, as_user_id: "${ad_id}" }
          assert:
            - "StudentPlan.${pl_id}.wbl_hours_pct == 100.0 (capped; raw 112.5 must not leak)"

      - name: ops_run_reminder_window_and_restamp_rule
        claim_type: correct_result
        grounds: ["endpoints.POST /ccr/ops-runs", "entities.OpsRun.fields.reminders_queued"]
        distinguishing_aspect: "At clock 2026-05-01, milestones due in [now, now+7d) are reminder-stamped; a second run at the same clock re-stamps nothing because last_reminder_sent_at is not older than 24h — the 24h rule is what keeps reminders_queued at 0."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; application whose 3 seeded milestones (due 2026-06-15) are untouched; plus one custom milestone due 2026-05-05"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "OR Adv", email: "ora@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GOR", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "OR1", full_name: "Stu OR", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /ccr/applications/${ap_id}/milestones", payload: { kind: "FAFSA", due_at: "2026-05-05T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /ccr/ops-runs", as: DistrictAdmin, captures: { run1: $.data.id } }
            - { call: "POST /ccr/ops-runs", as: DistrictAdmin, captures: { run2: $.data.id } }
          assert:
            - "OpsRun.${run1}.reminders_queued == 1 (only the FAFSA milestone due 2026-05-05 is inside [2026-05-01, 2026-05-08))"
            - "OpsRun.${run1}.milestones_marked_missed == 0"
            - "OpsRun.${run2}.reminders_queued == 0 (24h restamp rule at unchanged clock)"
            - "ApplicationMilestone.${m_id}.last_reminder_sent_at == 2026-05-01T00:00:00Z"

  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers fail before everything else -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /ccr/advisors"
              payload: { full_name: "No Auth", email: "na@d.org", max_caseload: 5 }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: forbidden_role_pathway_create_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", "roles"]
        distinguishing_aspect: "Teacher is not in POST /ccr/pathways roles -> 403 ERR_FORBIDDEN (role authorization precedes existence checks)."
        test_recipe:
          setup: ["Teacher T exists"]
          setup_api_calls:
            - { call: "POST /ccr/teachers", payload: { full_name: "T Forbidden", department: "ELA", max_active_letters: 5 }, as: DistrictAdmin, captures: { t_id: $.data.id } }
          trigger:
            - call: "POST /ccr/pathways"
              payload: { pathway_code: "NOPE", name: "Nope", required_course_codes: [] }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP status == 403"

      - name: stale_plan_create_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[plan-create-stale-student]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Plan create with expected_student_version observed before a prior successful plan create is rejected 412 — the OCC loser is deterministic with two sequential requests."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student S (version captured at creation = 1); plan1 created with that version (Student.version advances to 2)"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "OC Adv", email: "oca@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GOC", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "OC1", full_name: "Stu OC", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { p1: $.data.id } }
          trigger:
            - call: "POST /ccr/students/${s_id}/plans"
              payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }
              as: Advisor
              as_user_id: "${ad_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION and HTTP status == 412 (${s_v} was 1; the server is at 2 after plan1)"
            - "GET /ccr/students/${s_id}/plans still returns exactly 1 plan"

      - name: stale_reassignment_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[reassignment-stale-advisor]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reassignment replayed with the pre-first-reassignment advisor version is rejected 412; the first reassignment advanced Advisor.version."
        test_recipe:
          setup: ["Advisors AX (v captured), AY; students S1, S2 on AX"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "OCx", email: "ocx@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax: $.data.id, ax_v: $.data.version } }
            - { call: "POST /ccr/advisors", payload: { full_name: "OCy", email: "ocy@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ay: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "OC2", full_name: "Stu OC2", grade_level: 11, demographic_group: "GROUP_A", advisor_id: "${ax}" }, as: DistrictAdmin, captures: { s1: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "OC3", full_name: "Stu OC3", grade_level: 11, demographic_group: "GROUP_B", advisor_id: "${ax}" }, as: DistrictAdmin, captures: { s2: $.data.id } }
            - { call: "POST /ccr/advisors/${ax}/reassignments", payload: { student_ids: ["${s1}"], target_advisor_id: "${ay}", expected_advisor_version: "${ax_v}" }, as: DistrictAdmin }
          trigger:
            - call: "POST /ccr/advisors/${ax}/reassignments"
              payload: { student_ids: ["${s2}"], target_advisor_id: "${ay}", expected_advisor_version: "${ax_v}" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412): Advisor.${ax}.version advanced to 2 after the first reassignment"
            - "Student.${s2}.assigned_advisor_id remains ${ax}"

      - name: duplicate_pathway_code_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "pathway_code uniqueness is tenant-wide; the second create with the same code fails 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["Pathway STEM exists"]
          setup_api_calls:
            - { call: "POST /ccr/pathways", payload: { pathway_code: "STEM", name: "STEM", required_course_codes: [] }, as: DistrictAdmin }
          trigger:
            - call: "POST /ccr/pathways"
              payload: { pathway_code: "STEM", name: "STEM Again", required_course_codes: [] }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_CODE and HTTP status == 409"

      - name: milestone_due_date_past_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUE_DATE_PAST]"]
        distinguishing_aspect: "Milestone due_at <= now (default clock 2026-05-01) is rejected ERR_DUE_DATE_PAST at creation."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; application"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "DP Adv", email: "dpa@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GDP", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "DP1", full_name: "Stu DP", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
          trigger:
            - call: "POST /ccr/applications/${ap_id}/milestones"
              payload: { kind: "OTHER", due_at: "2026-04-01T00:00:00Z" }
              as: Student
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUE_DATE_PAST (due_at 2026-04-01 <= now 2026-05-01)"

      - name: sod_auditor_is_assigned_advisor_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AUDITOR_IS_ASSIGNED_ADVISOR]", "roles"]
        distinguishing_aspect: "Segregation of duties: the student's own assigned advisor cannot certify the audit even when every graduation gate passes — 409 ERR_AUDITOR_IS_ASSIGNED_ADVISOR (priority 8, ahead of the priority-11 gates that all pass)."
        test_recipe:
          setup: ["Advisor AX is BOTH assigned advisor and named auditor; pathway CR (empty); 24-credit course COMPLETED; audit IN_REVIEW"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "SoD X", email: "sodx@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "CRS", name: "Credit", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "SD1", full_name: "Stu SD", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ax}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ax}" }
            - { call: "POST /ccr/students/${s}/enrollments", payload: { plan_id: "${pl}", course_code: "CR24", term: "2026-SPRING", credits: 24 }, as: Advisor, as_user_id: "${ax}", captures: { en: $.data.id } }
            - { call: "POST /ccr/enrollments/${en}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax}" }
            - { call: "POST /ccr/enrollments/${en}/transition", payload: { to_status: "COMPLETED", grade: "PASS" }, as: Advisor, as_user_id: "${ax}" }
            - { call: "POST /ccr/students/${s}/senior-audits", payload: { auditor_advisor_id: "${ax}" }, as: DistrictAdmin, captures: { aud: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ax}" }
          trigger:
            - call: "POST /ccr/senior-audits/${aud}/transition"
              payload: { to_status: "CERTIFIED" }
              as: Advisor
              as_user_id: "${ax}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AUDITOR_IS_ASSIGNED_ADVISOR (SoD fires even though credits/pathway/cert/hours gates all pass)"
            - "SeniorAudit.${aud}.status remains IN_REVIEW"

      - name: audit_transition_by_non_auditor_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_NOT_AUDITOR]"]
        distinguishing_aspect: "An advisor who is not auditor_advisor_id cannot move the audit — 403 ERR_NOT_AUDITOR (ownership priority 6 precedes state checks)."
        test_recipe:
          setup: ["Advisors AX (assigned), AY (auditor), AZ (bystander); grade-12 student; audit DRAFT"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "NAx", email: "nax@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "NAy", email: "nay@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ay: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "NAz", email: "naz@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { az: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "NA1", full_name: "Stu NA", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax}" }, as: DistrictAdmin, captures: { s: $.data.id } }
            - { call: "POST /ccr/students/${s}/senior-audits", payload: { auditor_advisor_id: "${ay}" }, as: DistrictAdmin, captures: { aud: $.data.id } }
          trigger:
            - call: "POST /ccr/senior-audits/${aud}/transition"
              payload: { to_status: "IN_REVIEW" }
              as: Advisor
              as_user_id: "${az}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_AUDITOR and HTTP status == 403; audit stays DRAFT"

      - name: teacher_capacity_at_max_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_TEACHER_CAPACITY_EXCEEDED]", "entities.Teacher.fields.open_request_count"]
        distinguishing_aspect: "Teacher with max_active_letters 1 accepts one request (open_request_count == 1); the next create to the same teacher fails 409 — equality at the open-letter cap rejects."
        test_recipe:
          setup: ["Advisor A; teacher T (max_active_letters 1); students S1, S2; one request already REQUESTED to T"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "TC Adv", email: "tca@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/teachers", payload: { full_name: "TC Tee", department: "ELA", max_active_letters: 1 }, as: DistrictAdmin, captures: { t: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "TC1", full_name: "Stu TC1", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s1: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "TC2", full_name: "Stu TC2", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s2: $.data.id } }
            - { call: "POST /ccr/students/${s1}/recommendation-requests", payload: { teacher_id: "${t}", due_at: "2026-06-01T00:00:00Z" }, as: Student, as_user_id: "${s1}" }
          trigger:
            - call: "POST /ccr/students/${s2}/recommendation-requests"
              payload: { teacher_id: "${t}", due_at: "2026-06-01T00:00:00Z" }
              as: Student
              as_user_id: "${s2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEACHER_CAPACITY_EXCEEDED (open_request_count 1 >= max_active_letters 1)"

      - name: cross_student_reference_on_rec_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CROSS_STUDENT_REFERENCE]"]
        distinguishing_aspect: "A letter request naming another student's application_id is rejected — the FK must stay inside the same student aggregate."
        test_recipe:
          setup: ["Advisor A; teacher T; students S1 (with ACTIVE plan + application) and S2"]
          setup_api_calls:
