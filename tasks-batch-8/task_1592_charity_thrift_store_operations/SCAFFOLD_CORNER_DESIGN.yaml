  - section: endpoints
    instances:
      - name: cycle_second_open_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=9]", "errors[ERR_CYCLE_INVALID_STATE]"]
        distinguishing_aspect: "At most one OPEN WeeklyCycle: a second POST /api/cycles while one is OPEN fails 409; after closing the first, a new cycle can be opened."
        test_recipe:
          setup: ["one OPEN cycle"]
          setup_api_calls:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { err: $.data.error_id }
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
          assert:
            - "${err} == ERR_CYCLE_INVALID_STATE"
            - "closing C1 auto-spawned the next OPEN cycle, so a further POST /api/cycles still fails — exactly one OPEN at all times"

      - name: cycle_close_blocked_by_open_till
        claim_type: conditional_action
        grounds: ["validations[priority=6]", "errors[ERR_TILL_SESSIONS_UNCLOSED]", "state_machines.WeeklyCycle.OPEN_to_CLOSED"]
        distinguishing_aspect: "Cycle close is gated on ALL till sessions being CLOSED; the block lifts only after the lingering session is reconciled and closed."
        test_recipe:
          setup: ["OPEN cycle; cashier session left OPEN"]
          setup_api_calls:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Cash", employment_type: "STAFF" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/till-sessions"
              payload: { opening_float_cents: 4000 }
              as: Cashier
              as_user_id: "${w1}"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
              captures: { err: $.data.error_id }
            - call: "POST /api/till-sessions/${s1}/count"
              payload: { counted_cash_cents: 4000 }
              as: StoreManager
            - call: "POST /api/till-sessions/${s1}/close"
              as: StoreManager
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
          assert:
            - "${err} == ERR_TILL_SESSIONS_UNCLOSED"
            - "after the session closes, the retry closes the cycle: WeeklyCycle.${c1}.status == CLOSED"

      - name: to_floor_without_open_cycle_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=11]", "errors[ERR_NO_OPEN_CYCLE]"]
        distinguishing_aspect: "Flooring requires an OPEN cycle to stamp floor_cycle_id/tag_color; before the first cycle exists the action fails ERR_NO_OPEN_CYCLE."
        test_recipe:
          setup: ["item PRICED; no cycle has ever been created"]
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000 }
              as: StoreManager
            - call: "POST /api/donors"
              payload: { full_name: "D Nc" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "SALABLE" }
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/price"
              as: Pricer
          trigger:
            - call: "POST /api/items/${i1}/to-floor"
              as: Pricer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NO_OPEN_CYCLE"
            - "DonationItem.${i1}.status == PRICED (unchanged)"

      - name: reschedule_no_show_creates_new_stop
        claim_type: cross_reference_link
        grounds: ["state_machines.PickupStop", "endpoints"]
        distinguishing_aspect: "Rescheduling a NO_SHOW stop creates a NEW SCHEDULED stop on the target DRAFT route carrying the same donor and volume; the original stays NO_SHOW and the target route's aggregates move."
        test_recipe:
          setup: ["route R1 IN_PROGRESS with stop S1 departed then NO_SHOW; empty DRAFT route R2 (capacity 500, 2026-08-11)"]
          setup_api_calls:
            - call: "POST /api/workers"
