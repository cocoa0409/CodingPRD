          - state_machines.RemoteCommand.PENDING_to_EXPIRED
        distinguishing_aspect: "Remote commands that expire (clock passes expires_at) are excluded from period_remote_commands_used; only ACKNOWLEDGED and FAILED rows count, so a vehicle can absorb repeated expiry without ever tripping the cap."
        test_recipe:
