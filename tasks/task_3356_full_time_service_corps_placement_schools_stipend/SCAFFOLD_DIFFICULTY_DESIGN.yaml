  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: stipend_pay_clawback_cash_conservation
        grounds:
          - state_machines.StipendPayment.status.APPROVED_to_PAID
          - state_machines.StipendPayment.status.PAID_to_CLAWED_BACK
          - entities.Site.fields.stipend_outlay_cents
          - entities.CorpsMember.fields.net_stipend_received_cents
        distinguishing_aspect: |
          Conserved quantity: CASH. Invariant I-CASH — site.stipend_outlay_cents
          == sum of member.net_stipend_received_cents across the site — holds
          after the forward action (pay) and is exactly restored by its
          compensating action (clawback): 50000 out and back to 0, headroom
          restored to 700000.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE; 2000000 philanthropy received (headroom 2000000 - 0 - 1300000 obligations = 700000, FUNDED). Member ACTIVE with stipend ACTIVE. Payment P (period 2026-09-01..2026-09-14) created by sa-1, approved by sa-2 with deduction 0."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - call: "POST /corps/sites/${site_id}/funding/receive"
              payload: { funding_type: "PHILANTHROPY", amount_cents: 2000000 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { site_pre_posture: $.data.funding_posture, site_pre_headroom: $.data.funding_headroom_cents }
            - call: "POST /corps/members/${member_id}/stipend-payments"
              payload: { period_start: "2026-09-01", period_end: "2026-09-14" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { pay_id: $.data.id }
            - call: "POST /corps/stipend-payments/${pay_id}/state"
              payload: { to_status: "APPROVED", deduction_cents: 0 }
              as: StipendAdministrator
              as_user_id: "sa-2"
          trigger:
            - call: "POST /corps/stipend-payments/${pay_id}/state"
              payload: { to_status: "PAID" }
              as: StipendAdministrator
              as_user_id: "sa-2"
              captures: { st_paid: $.data.status }
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { outlay_paid: $.data.stipend_outlay_cents, headroom_paid: $.data.funding_headroom_cents }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { member_net_paid: $.data.net_stipend_received_cents }
            - call: "POST /corps/stipend-payments/${pay_id}/state"
              payload: { to_status: "CLAWED_BACK", reason: "overpayment" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { st_claw: $.data.status }
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { outlay_claw: $.data.stipend_outlay_cents, headroom_claw: $.data.funding_headroom_cents, posture_claw: $.data.funding_posture }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { member_net_claw: $.data.net_stipend_received_cents }
          assert:
            - "${site_pre_posture} == FUNDED and ${site_pre_headroom} == 700000"
            - "${st_paid} == PAID and ${outlay_paid} == 50000 and ${member_net_paid} == 50000 (I-CASH: site outlay == member net after the forward action)"
            - "${headroom_paid} == 650000 (700000 - 50000)"
            - "${st_claw} == CLAWED_BACK and ${outlay_claw} == 0 and ${member_net_claw} == 0 (compensating action restores the conserved quantity exactly)"
            - "${headroom_claw} == 700000 and ${posture_claw} == FUNDED (headroom fully restored)"

      - name: hour_verify_void_reverify_ledger_conservation
        grounds:
          - calculations.verified_hour_aggregation
          - state_machines.ServiceHourEntry.status
          - entities.CorpsMember.fields.verified_hours_total
        distinguishing_aspect: |
          Conserved quantity: VERIFIED SERVICE HOURS (not cash). Invariant
          I-HOURS — member.verified_hours_total == sum of hours over VERIFIED
          entries — holds at every step of a verify / void / re-verify
          sequence: 8.0 after verify, 0.0 after the compensating void, 8.0
          again after a replacement entry verifies.
        test_recipe:
          setup:
            - "Clock 2026-09-09T00:00:00Z. Site ACTIVE. Member ACTIVE. Entry E1: 8.0 DIRECT_SERVICE on 2026-09-01, PENDING."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 8.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /corps/hour-entries/${e1}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e1_v: $.data.status }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tot_v: $.data.verified_hours_total }
            - call: "POST /corps/hour-entries/${e1}/review"
              payload: { decision: "VOID", reason: "duplicate submission" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e1_x: $.data.status }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tot_x: $.data.verified_hours_total }
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-02", hours: 8.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { e2: $.data.id }
            - call: "POST /corps/hour-entries/${e2}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e2_v: $.data.status }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tot_v2: $.data.verified_hours_total }
          assert:
            - "${e1_v} == VERIFIED and ${tot_v} == 8.0"
            - "${e1_x} == VOIDED and ${tot_x} == 0.0 (void compensates verify exactly — no drift)"
            - "${e2_v} == VERIFIED and ${tot_v2} == 8.0 (replacement entry restores the total; ledger == sum over VERIFIED entries at every step)"
