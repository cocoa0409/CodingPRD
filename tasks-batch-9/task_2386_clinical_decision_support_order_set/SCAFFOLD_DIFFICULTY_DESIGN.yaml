            - "${rev4_assigned_before} == 15 and ${rev4_remaining_before} == 465 and ${rev4_open_before} == 1"
            - "${al_review_before} == CAST"
            - "${ra3_state} == CAST and ${ra3_vote} == REVISE — the triggering assignment is deliberately NOT voided"
            - "${os_review_after} == DRAFT and ${os_round} == 1 — LINK 1"
            - "${os_voided} == 3 and ${os_cast} == 1 — LINK 2: the two CAST peer assignments and the one still-ASSIGNED specialty assignment were voided, leaving only the trigger"
            - "${ra4_state} == VOIDED and ${ra4_void_reason} == ARTIFACT_RETURNED_TO_DRAFT"
            - "${rev4_assigned_after} == 0 and ${rev4_remaining_after} == 480 and ${rev4_open_after} == 0 — LINK 3, and the invariant 480 == 0 + 480 still holds"
            - "${al_review_after} == DRAFT and ${al_restage} == 1 and ${al_life} == UNPUBLISHED — LINK 4, reached only because LINK 1 pulled the order set out of approval"
            - "${ra5_state_after} == CAST — the alert's own assignment is NOT voided, so Clinician.${rev5_id}.review_workload_assigned_minutes stays 10: the cascade walks the artifact link, it does not sweep all assignments"
            - "Breaking the chain at LINK 1 (casting APPROVE instead) leaves review_state APPROVED, revision_round 0, ra4 ASSIGNED, rev4 assigned 15 and the alert APPROVED with restage_count 0."

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_conflict_stale_parent_version_412_beats_request_not_accepted_409
        conflicting_priorities: [9, 10]
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - concurrency_rules.order-set-create-stale-content-request
          - errors.ERR_STALE_CONTENT_REQUEST_VERSION
          - errors.ERR_CONTENT_REQUEST_NOT_ACCEPTED
        distinguishing_aspect: |
          A concurrency violation (category concurrency, priority 9, HTTP 412) is raced
          against a primary-entity state violation (category state, priority 10, HTTP 409)
          on the same request. The naive implementation checks the parent's status before
          bothering with the version guard and returns 409; the ordered pipeline must
          return 412.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and an ACTIVATED vendor release exist."
            - "One ContentRequest with 5 citations of which 3 are peer reviewed is triaged with decision RETURN_TO_SPONSOR, so its status is RETURNED_TO_SPONSOR — never BUILD_IN_PROGRESS — and its version is captured immediately after that triage."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Reyes", npi: "1000000001", specialty: "CARDIOLOGY", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Bhatt", npi: "1000000003", specialty: "INFORMATICS", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Okafor", npi: "1000000002", specialty: "INTERNAL_MEDICINE", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Iqbal", npi: "1000000006", specialty: "PHARMACY", authorized_roles: ["PharmacyInformaticist"] }
              as: SystemAdmin
              captures: { pharm_id: $.data.id }
            - call: "POST /cds/vendor-releases"
              payload: { vendor_name: "FDB", release_label: "2026.08", content_domain: "DRUG_INTERACTION" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /cds/vendor-releases/${vr_id}/deltas"
              payload: { rule_code: "DDI-0001", change_type: "NEW_INTERACTION", description: "New moderate interaction", new_severity: "MODERATE" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /cds/vendor-releases/${vr_id}/run-impact-analysis"
              payload: { analysis_note: "Single low-weight delta" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/vendor-rule-deltas/${d1_id}/disposition"
              payload: { disposition: "ACCEPT" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/vendor-releases/${vr_id}/activate"
              payload: { activation_note: "Fast track" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/content-requests"
              payload:
                title: "Hyperkalaemia order set"
                request_type: "ORDER_SET"
                clinical_domain: "NEPHROLOGY"
                urgency: "ROUTINE"
                evidence_grade: "C"
                clinical_sponsor_id: "${sponsor_id}"
                patient_safety_flag: false
                evidence_citations:
                  - { citation: "KDIGO 2025", peer_reviewed: true }
                  - { citation: "AJKD 2025;85:12", peer_reviewed: true }
                  - { citation: "NEJM 2024;391:77", peer_reviewed: true }
                  - { citation: "Unit protocol", peer_reviewed: false }
                  - { citation: "Vendor brief", peer_reviewed: false }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /cds/content-requests/${cr_id}/triage"
              payload: { decision: "RETURN_TO_SPONSOR", triage_note: "Dosing table needs a pharmacy source" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { cr_v: $.data.version, cr_status: $.data.status }
          trigger:
            - call: "POST /cds/content-requests/${cr_id}/order-sets"
              payload: { expected_content_request_version: "${cr_v} - 1", name: "Hyperkalaemia", specialty: "NEPHROLOGY", pinned_vendor_release_id: "${vr_id}", built_by_clinician_id: "${builder_id}" }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { conflict_error: $.data.error_id }
            - call: "POST /cds/content-requests/${cr_id}/order-sets"
              payload: { expected_content_request_version: "${cr_v}", name: "Hyperkalaemia", specialty: "NEPHROLOGY", pinned_vendor_release_id: "${vr_id}", built_by_clinician_id: "${builder_id}" }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { control_error: $.data.error_id }
          assert:
            - "${cr_status} == RETURNED_TO_SPONSOR — the priority-10 state violation is genuinely present in both calls"
            - "${conflict_error} == ERR_STALE_CONTENT_REQUEST_VERSION with HTTP 412: priority 9 wins"
            - "${control_error} == ERR_CONTENT_REQUEST_NOT_ACCEPTED with HTTP 409 — with the version guard satisfied the lower-priority state error surfaces, proving both violations were live"
            - "No OrderSet row was created by either call: GET /cds/order-sets?content_request_id=${cr_id} returns total_count 0"

      - name: priority_conflict_content_frozen_409_beats_segregation_of_duties_403
        conflicting_priorities: [12, 13]
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors.ERR_CDS_CONTENT_FROZEN
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.DowntimeEvent.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          A different error-category pair from the OCC-versus-state race: business_temporal
          (priority 12, HTTP 409) is raced against business_constraint (priority 13, HTTP
          403). The 403 is the far more intuitive answer — the caller is nominating the
          order set's own builder as its reviewer — but the downtime freeze is evaluated
          first, and an implementation that runs identity checks before environmental
          gates returns the wrong status class entirely.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair, pharmacist and one peer reviewer exist."
