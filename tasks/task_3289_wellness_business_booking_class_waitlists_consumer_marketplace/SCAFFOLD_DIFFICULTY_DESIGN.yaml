            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_in_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_in_id}", substitute_class_template_ids: ["${tpl_in_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_in_id}"
              captures: { ivy_in_id: $.data.id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_out_id}", class_template_id: "${tpl_out_id}", instructor_staff_id: "${ivy_out_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_out_v}" }
              as: StudioOwner
