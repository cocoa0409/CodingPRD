        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Citation pay response itself shows status PAID; subsequent GET of the member shows credit accrued and strikes recomputed with no lag (immediate model)."
        test_recipe:
          setup: ["Association A; member MV; FineSchedule INACCURACY 30000c; citation C OPEN"]
          setup_api_calls:
            - call: "POST /mls/associations"
              payload: { association_code: "K1", name: "Consist Assoc", membership_dues_cents: 100000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { a_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/members"
              payload: { member_nr: "MV", full_name: "Violator" }
              as: AssociationStaff
              captures: { mv_id: $.data.id }
            - call: "POST /mls/associations/${a_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 30000, effective_from: "2026-01-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${a_id}/citations"
              payload: { member_id: "${mv_id}", rule_code: "INACCURACY" }
              as: AssociationStaff
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /mls/associations/${a_id}/citations/${c_id}/pay"
