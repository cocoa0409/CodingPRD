      - name: invoice_create_with_unmeasured_episode_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_MEASUREMENT_PENDING]"]
        distinguishing_aspect: "An ENDED campaign whose impressions sit on a PUBLISHED-but-not-MEASURED episode cannot be invoiced: ERR_MEASUREMENT_PENDING."
