            - "Case B remains DRAFT"

      - name: document_verify_requires_case_in_review
        grounds:
          - state_machines.CaseDocument.SUBMITTED_to_VERIFIED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          DIFFERENT entity pair (CaseDocument -> ExchangeCase): a document's
          verify transition is guarded by the PARENT case's state — verify while
          the case is merely SUBMITTED fails; after start_review it succeeds.
        test_recipe:
          setup:
            - "Producer, client, K_STD contract; case SUBMITTED (never reviewed); one REPLACEMENT_DISCLOSURE document SUBMITTED"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
