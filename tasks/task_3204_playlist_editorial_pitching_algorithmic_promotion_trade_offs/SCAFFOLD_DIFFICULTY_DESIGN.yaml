  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: royalty_pool_total_conserved_across_close_and_clawback
        grounds:
          - calculations.royalty_pool_share
          - calculations.clawback_amount
          - entities.RoyaltyStatement.fields.net_payout_cents
        distinguishing_aspect: |
          Conserved quantity — pool cents: for any close, sum of
          gross_payout_cents across statements == RoyaltyPeriod.pool_cents
          exactly (77777 = 38889 + 38888 under GROSS 4/1 raw), and a pre-close
          clawback only moves money WITHIN a statement (B: gross 15555,
          clawback 0.40, net 15554.60) — the pool sum is unchanged by the
