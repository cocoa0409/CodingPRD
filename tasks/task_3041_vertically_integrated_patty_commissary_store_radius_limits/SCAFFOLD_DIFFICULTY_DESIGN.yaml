              as: CommissaryPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { commissary_id: "${com_id}", truck_id: "${truck_id}", service_date: "2026-09-02T00:00:00Z", store_ids: ["${store_id}"] }
              as: CommissaryPlanner
              captures: { route_id: $.data.id }
            - call: "POST /v1/batches/${batch_id}/load"
              payload: { production_run_id: "${run_id}", route_id: "${route_id}" }
              as: CommissaryPlanner
            - call: "POST /v1/routes/${route_id}/finalize"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/batches/${batch_id}/deliver"
              payload: {}
              as: CommissaryPlanner
          trigger:
            - call: "POST /v1/stores/${store_id}/orders"
              payload: { placed_by_associate_id: "${mgr_id}", lines: [{ menu_item_id: "${item_id}", qty: 10, modifier_codes: ["EXTRA_PATTY"] }] }
              as: Associate
              as_user_id: "${mgr_id}"
              captures: { order_id: $.data.id }
            - call: "POST /v1/orders/${order_id}/cancel"
              payload: {}
              as: Associate
              as_user_id: "${mgr_id}"
          assert:
            - "Order.${order_id}.patties_reserved == 20 at placement"
            - "after cancel, the store on-hand ledger is back to exactly 100 patties / 60 buns / 60 produce (compensating invariant: place + cancel == identity)"
            - "Order.${order_id}.status == CANCELLED"
      - name: run_plan_cancel_restores_beef
        grounds:
          - state_machines.ProductionRun.PLANNED_to_CANCELLED
          - entities.Commissary.fields.raw_beef_lbs_on_hand
        distinguishing_aspect: "Conserved quantity: commissary raw_beef_lbs_on_hand. Plan-then-cancel of a production run is a forward/compensating pair that must leave the beef ledger bit-identical; the sibling invariant conserves a different quantity (store inventory)."
        test_recipe:
          setup:
            - "Commissary with 500 lbs raw beef received."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SupplyChainDirector
            - call: "POST /v1/suppliers"
              payload: { supplier_code: "RANCH-CI2", spec_profile: { lean_point_pct: 80, max_fat_pct: 20, max_bacterial_count_cfu_g: 10000, chilled_never_frozen: true }, audit_frequency_days: 30 }
              as: SupplyChainDirector
              captures: { sup_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits"
              payload: { scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { aud_id: $.data.id }
            - call: "POST /v1/suppliers/${sup_id}/audits/${aud_id}/record-audit"
              payload: { result: "PASS" }
              as: QualityAuditor
            - call: "POST /v1/commissaries"
              payload: { name: "CI2 Commissary", lat: 34.0, lng: -118.0, radius_limit_km: 500, daily_patty_capacity: 100000, daily_bun_capacity: 60000, daily_produce_capacity: 40000, delivery_days_mask: [true, true, true, true, true, true, false], supplier_id: "${sup_id}" }
              as: SupplyChainDirector
              captures: { com_id: $.data.id }
            - call: "POST /v1/commissaries/${com_id}/begin-build"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/commissaries/${com_id}/activate"
              payload: {}
              as: SupplyChainDirector
            - call: "POST /v1/beef-deliveries"
              payload: { commissary_id: "${com_id}", supplier_id: "${sup_id}", shipped_at: "2026-09-01T06:00:00Z", raw_beef_lbs: 500, transit_temp_celsius: 2.0 }
              as: CommissaryPlanner
              captures: { bd_id: $.data.id }
            - call: "POST /v1/beef-deliveries/${bd_id}/ship"
              payload: {}
              as: CommissaryPlanner
            - call: "POST /v1/beef-deliveries/${bd_id}/confirm-receiving"
              payload: {}
              as: CommissaryPlanner
          trigger:
            - call: "POST /v1/commissaries/${com_id}/production-runs"
              payload: { run_date: "2026-09-02T00:00:00Z", patties_planned: 1000, buns_planned: 100, produce_units_planned: 100 }
              as: CommissaryPlanner
              captures: { run_id: $.data.id, beef_required: $.data.beef_lbs_required }
            - call: "POST /v1/production-runs/${run_id}/cancel"
              payload: {}
              as: CommissaryPlanner
          assert:
            - "ProductionRun.${run_id}.beef_lbs_required == 334 (CEIL(1000/3))"
            - "Commissary.${com_id}.raw_beef_lbs_on_hand == 500 after plan + cancel (compensating invariant: debit then reversal == identity)"
            - "ProductionRun.${run_id}.status == CANCELLED"
