  # ---------------------------------------------------------------------------
  # Endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Object responses carry meta.api_request_id, meta.api_request_timestamp and response_type 'object'; list responses use response_type 'array' and expose the fixed pagination fields limit/offset/total_count/has_more with defaults limit 10, offset 0."
        test_recipe:
          setup: ["borrower and loan exist"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
