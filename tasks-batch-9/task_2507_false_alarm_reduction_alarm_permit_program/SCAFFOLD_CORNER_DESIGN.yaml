        distinguishing_aspect: "days_late is floor((now - term_end_at)/86400) = 15 on 2027-08-16, and the tier scan takes the FIRST entry whose max_days_late is null or >= days_late, so 15 selects {max_days_late 15 -> 1500} and not the 3000 tier; the renewal invoice therefore assesses 3000 + 1500 + the 500 admin floor = 5000."
