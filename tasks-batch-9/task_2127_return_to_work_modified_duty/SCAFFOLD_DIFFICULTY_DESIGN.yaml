      - ${risk_after} == 65
      - ${variant_after} == SURVEILLANCE
      - ${comp_after} == WATCH
      - ${stat_after} == ACTIVE
      - ${posture} == RESTRICTED
- rule_id: combinatorial_formula
  instances:
  - name: match_score_five_weight_headroom_with_severity_damping
    grounds:
    - calculations.restriction_match_score
    - calculations.restriction_severity_index
    - entities.Placement.fields.match_score
    - endpoints.POST /rtw/placements
    distinguishing_aspect: 'Mode (a): match_score combines five weighted headroom ratios, a conditional RISK_CLASS_PENALTY branch and a nested min/clamp damping term keyed on severity_index, so with severity
      60 and the LOW-risk job the single correct value is 51.39 and no simpler linear reading reproduces it.'
    test_recipe:
      setup:
      - ACTIVE RestrictionSet with lift 20, standing 30, hours 6, keyboard 45, no overhead, no driving -> severity_index 60.
      - One OPEN LOW-risk job demanding lift 10, standing 15, hours 4, keyboard 20.
      setup_api_calls:
      - call: POST /rtw/employees
        payload:
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_wage_cents: 120000
          pre_injury_weekly_hours: 40
          benefit_tier: TIER_B
        as: ProgramAdmin
