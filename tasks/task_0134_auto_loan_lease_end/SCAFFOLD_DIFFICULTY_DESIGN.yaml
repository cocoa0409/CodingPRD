# =============================================================================
# Task 0134 — Auto Loan & Lease End
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in §1.1–§1.6 of SCAFFOLD.yaml and is reachable from
# an empty database using only declared endpoints.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains (>=2)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: loan_payoff_book_vs_cash_on_loan_contract
        grounds:
          - calculations.loan_payoff_balance
          - endpoints.GET /customers/{customerId}/loan-contracts/{contractId}/payoff-quote
          - entities.LoanContract.fields.remaining_principal_cents
          - entities.LoanContract.fields.apr_bps
        distinguishing_aspect: |
          The dual-variant calculation operates on the LoanContract entity domain (book payoff
          = remaining_principal_cents; cash payoff = remaining_principal_cents + accrued daily
          interest + prepayment penalty). The two variants produce different cents for the
          same loan once the clock has advanced past the last paid date.
        test_recipe:
          setup:
            - "POST /customers full_name='A', fico_score=750 → Customer C (fico_tier=TIER_1)"
            - "POST /vehicles vin='V1', msrp_cents=3000000, residual_factor_bps=5500 → Vehicle V (status=AVAILABLE)"
            - "POST /customers/{C.id}/loan-contracts vehicle_id=V.id, down_payment_cents=150000, term_months=36 → Loan L (principal_cents=2850000)"
            - "POST /customers/{C.id}/loan-contracts/{L.id}/approve → status=APPROVED, apr_bps=450, monthly_payment_cents=84779"
            - "POST /customers/{C.id}/loan-contracts/{L.id}/activate → status=ACTIVE, 36 Payment rows generated"
            - "Loop 12 times: POST /customers/{C.id}/clock/advance days_advanced=30 then POST /customers/{C.id}/payments/{nextPayment.id}/pay → after 12 payments remaining_principal_cents=1942326"
            - "POST /customers/{C.id}/clock/advance days_advanced=15 (15 days past the last paid day)"
          trigger:
            - "GET /customers/{C.id}/loan-contracts/{L.id}/payoff-quote?variant=BOOK → response data.payoff_cents"
            - "GET /customers/{C.id}/loan-contracts/{L.id}/payoff-quote?variant=CASH → response data.payoff_cents"
          assert:
            - "BOOK response data.payoff_cents == 1942326"
            - "CASH response data.payoff_cents == 1984814   # remaining 1942326 + accrued floor(1942326*(450/120000)*15/30)=3641 + penalty ceil(1942326*200/10000)=38847"
            - "BOOK payoff_cents != CASH payoff_cents"

      - name: lease_end_purchase_at_maturity_vs_early_buyout_on_lease_contract
        grounds:
          - calculations.lease_end_purchase_quote
          - endpoints.GET /customers/{customerId}/lease-contracts/{contractId}/purchase-quote
          - entities.LeaseContract.fields.residual_value_cents
          - entities.LeaseContract.fields.payments_made_count
          - entities.LeaseContract.fields.payments_scheduled_count
        distinguishing_aspect: |
          The dual-variant calculation operates on the LeaseContract entity domain — a structurally
          different entity from LoanContract — where AT_MATURITY uses only residual + purchase fee
          and EARLY_BUYOUT additionally adds unpaid remaining lease payments.
        test_recipe:
          setup:
            - "POST /customers full_name='B', fico_score=700 → Customer C (fico_tier=TIER_2)"
            - "POST /vehicles vin='V2', msrp_cents=3275000, residual_factor_bps=5800 → Vehicle V"
            - "POST /customers/{C.id}/lease-contracts vehicle_id=V.id, down_payment_cents=393000, term_months=36, mileage_allowance=36000 → Lease L (residual_value_cents=1899500)"
            - "POST /customers/{C.id}/lease-contracts/{L.id}/approve → money_factor_micro=2800, monthly_payment_cents=43934"
            - "POST /customers/{C.id}/lease-contracts/{L.id}/activate → 36 Payment rows generated"
            - "Loop 12 times: POST /customers/{C.id}/clock/advance days_advanced=30 then pay the next Payment → payments_made_count=12, payments_scheduled_count=36"
          trigger:
            - "GET /customers/{C.id}/lease-contracts/{L.id}/purchase-quote?variant=AT_MATURITY → response data.purchase_option_cents"
            - "GET /customers/{C.id}/lease-contracts/{L.id}/purchase-quote?variant=EARLY_BUYOUT → response data.purchase_option_cents"
          assert:
            - "AT_MATURITY purchase_option_cents == 1934500   # residual 1899500 + PURCHASE_OPTION_FEE 35000"
            - "EARLY_BUYOUT purchase_option_cents == 1934500 + 24 * 43934 == 2988916"
            - "AT_MATURITY purchase_option_cents != EARLY_BUYOUT purchase_option_cents"

      - name: default_apr_uplift_forward_vs_chronological_on_loan_contract
        grounds:
          - calculations.default_apr_uplift
          - state_machines.LoanContract.ACTIVE_to_DEFAULTED
          - entities.LoanContract.fields.apr_bps
          - entities.LoanContract.fields.base_apr_bps
          - entities.Payment.fields.principal_portion_cents
          - entities.Payment.fields.interest_portion_cents
        distinguishing_aspect: |
          A third dual-variant: the FORWARD-LOOKING variant (pinned) re-prices only SCHEDULED
          payments after default; the CHRONOLOGICAL alternative (not used) would back-fill
          principal/interest on every PAID Payment retroactively. Two algorithms, same data,
          different totals.
        test_recipe:
          setup:
            - "Same Customer C and Loan L as loan_payoff_book_vs_cash_on_loan_contract setup, but with TIER_1 750 fico"
            - "After 12 paid Payments (remaining_principal_cents=1942326), cause 3 consecutive defaults: POST /customers/{C.id}/clock/advance days_advanced=120 (skipping 3 due dates well past DEFAULT_GRACE_DAYS=15)"
          trigger:
            - "Observe Customer.default_count and LoanContract.apr_bps after defaults are applied"
          assert:
            - "LoanContract.base_apr_bps == 450 (unchanged)"
            - "LoanContract.apr_bps == 750  # 450 + APR_UPLIFT_BPS 300"
            - "LoanContract.monthly_payment_cents == 87404  # re-priced over remaining 24 payments using new apr_bps and current remaining_principal_cents (forward-looking)"
            - "Already-PAID Payment rows (period_index 1..12) have principal_portion_cents and interest_portion_cents UNCHANGED from their original amortization (would differ under the chronological variant)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes {(a),(b),(c)} (>=2)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: loan_monthly_payment_three_input_nonlinear_mode_a
        grounds:
          - calculations.loan_monthly_payment
          - entities.LoanContract.fields.principal_cents
          - entities.LoanContract.fields.apr_bps
          - entities.LoanContract.fields.term_months
        distinguishing_aspect: |
          Mode (a) — formula with three inputs (principal, apr, term) and non-linear interaction
          via the (1+r)^n compounding. None of the three inputs interact linearly; doubling
          apr does not double monthly_payment.
        test_recipe:
          setup:
            - "POST /customers fico=750 → TIER_1"
            - "POST /vehicles msrp_cents=3000000, residual_factor_bps=5500"
            - "POST /customers/{C.id}/loan-contracts vehicle_id=V.id, down_payment_cents=150000, term_months=36"
            - "POST .../approve"
          trigger:
            - "Observe LoanContract.monthly_payment_cents"
          assert:
            - "LoanContract.monthly_payment_cents == 84779  # ceil(2850000 * (0.045/12) * (1+0.045/12)^36 / ((1+0.045/12)^36 - 1))"

      - name: lease_monthly_payment_rounding_order_pinned_mode_b
        grounds:
          - calculations.lease_monthly_payment
          - entities.LeaseContract.fields.capitalized_cost_cents
          - entities.LeaseContract.fields.residual_value_cents
          - entities.LeaseContract.fields.money_factor_micro
        distinguishing_aspect: |
          Mode (b) — pinned rounding order: floor(depreciation), floor(finance), sum, ceil(tax).
          With msrp=32_750_00, rf=5800, mf=2800, term=36, the per-component-then-sum order
          produces 43934 cents/month, while a round-once-at-the-end order would produce
          43935 cents. The scaffold's order is the one that produces 43934.
        test_recipe:
          setup:
            - "POST /customers fico=700 → TIER_2"
            - "POST /vehicles msrp_cents=3275000, residual_factor_bps=5800"
            - "POST /customers/{C.id}/lease-contracts vehicle_id=V.id, down_payment_cents=393000, term_months=36, mileage_allowance=36000"
            - "POST .../approve"
          trigger:
            - "Observe LeaseContract.monthly_payment_cents"
          assert:
            - "LeaseContract.monthly_payment_cents == 43934   # depreciation=27291 + finance=13388 = 40679; ceil(40679*0.08)=3255; sum=43934 (NOT 43935 which is what round-once-at-end produces)"

      - name: apr_then_monthly_payment_evaluation_order_mode_c
        grounds:
          - calculations.fico_tier_apr
          - calculations.loan_monthly_payment
          - calculations.default_apr_uplift
          - state_machines.LoanContract.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by explicit evaluation order:
          (1) fico_tier_apr is resolved from Customer.fico_tier first → base_apr_bps and apr_bps;
          (2) loan_monthly_payment is then resolved using apr_bps;
          (3) only AFTER three lifetime defaults does default_apr_uplift fire and re-trigger
          loan_monthly_payment over remaining principal. The evaluation order is fixed at
          (apr → monthly → uplift → monthly') — never (monthly → apr) — eliminating the
          circular appearance.
        test_recipe:
          setup:
            - "POST /customers fico=750 → TIER_1, apr_bps=450, monthly=84779"
            - "Drive 3 defaults to trigger uplift"
          trigger:
            - "Observe sequence of apr_bps and monthly_payment_cents"
          assert:
            - "Initial apr_bps == 450 and monthly_payment_cents == 84779 (computed in pinned order)"
            - "Post-uplift apr_bps == 750 and monthly_payment_cents == 87404 (re-computed in pinned order with new APR)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities (>=2)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_contract_three_way_branching_at_maturity
        grounds:
          - state_machines.LeaseContract.MATURED_to_PURCHASED
          - state_machines.LeaseContract.MATURED_to_RENEWED
          - state_machines.LeaseContract.MATURED_to_RETURNED
          - entities.LeaseContract.fields.lease_end_election
        distinguishing_aspect: |
          LeaseContract exhibits branching fork: MATURED → {PURCHASED, RENEWED, RETURNED} with
          divergent side-effect sets per branch (PURCHASE sets purchase_option > 0 and
          disposition_fee=0; RENEW sets both to 0; RETURN sets disposition_fee>0 and
          purchase_option=0). This is fork-join branching, NOT linear A→B→C.
        test_recipe:
          setup:
            - "Originate three separate Customer+Vehicle+Lease triples (C1/V1/L1, C2/V2/L2, C3/V3/L3); drive each lease to MATURED via clock advance and full payment"
            - "PATCH each lease's assessment with an odometer_reading so each LeaseEndAssessment is ISSUED"
          trigger:
            - "POST .../L1/lease-end election=PURCHASE"
            - "POST .../L2/lease-end election=RENEW"
            - "POST .../L3/lease-end election=RETURN"
          assert:
            - "L1.status == PURCHASED, L1.lease_end_election == 'PURCHASE', assessment.purchase_option_cents > 0, assessment.disposition_fee_cents == 0"
            - "L2.status == RENEWED, L2.lease_end_election == 'RENEW', assessment.purchase_option_cents == 0, assessment.disposition_fee_cents == 0"
            - "L3.status == RETURNED, L3.lease_end_election == 'RETURN', assessment.purchase_option_cents == 0, assessment.disposition_fee_cents == 39500"

      - name: payment_revert_cycle_late_to_paid_and_defaulted_to_paid
        grounds:
          - state_machines.Payment.LATE_to_PAID
          - state_machines.Payment.LATE_to_DEFAULTED
          - state_machines.Payment.DEFAULTED_to_PAID
          - state_machines.Payment.SCHEDULED_to_LATE
        distinguishing_aspect: |
          Payment (a different entity from LeaseContract) exhibits a revert/cycle pattern:
          SCHEDULED→LATE→PAID (revert) and LATE→DEFAULTED→PAID (revert from a non-final
          terminal). The presence of DEFAULTED→PAID is the cycle: a payment can return to
          PAID even after reaching the DEFAULTED state.
        test_recipe:
          setup:
            - "Originate a loan and activate it (36 Payments). Customer.clock_day_index=0."
            - "POST /clock/advance days_advanced=35  → first Payment status flips SCHEDULED→LATE (due was at day 30)"
            - "POST /payments/{p1.id}/pay → status flips LATE→PAID (revert; less than DEFAULT_GRACE_DAYS=15 over due)"
            - "Advance clock more for a second payment: POST /clock/advance days_advanced=50  → p2 (due day 60) becomes LATE, then within the same advance reaches DEFAULTED (110-60=50 >= 15)"
            - "POST /loan-contracts/{L.id}/reinstate is rejected because still defaulted; first POST /payments/{p2.id}/pay → DEFAULTED→PAID"
          trigger:
            - "(setup itself triggers the revert transitions)"
          assert:
            - "p1.status transitioned SCHEDULED→LATE→PAID (observable via state_machines.Payment transitions)"
            - "p2.status transitioned SCHEDULED→LATE→DEFAULTED→PAID (revert from DEFAULTED)"
            - "Customer.default_count does NOT decrement when p2 transitions DEFAULTED→PAID (defaults are sticky per side_effects)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers (>=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_default_cascade_depth_4
        grounds:
          - state_machines.Payment.LATE_to_DEFAULTED
          - state_machines.LoanContract.ACTIVE_to_DEFAULTED
          - calculations.default_apr_uplift
          - calculations.loan_monthly_payment
          - entities.Customer.fields.default_count
          - entities.LoanContract.fields.apr_bps
          - entities.LoanContract.fields.monthly_payment_cents
        distinguishing_aspect: |
          Triggered by POST /customers/{id}/clock/advance crossing DEFAULT_GRACE_DAYS on a
          3rd Payment row. Chain depth 4:
            (1) Payment row p3 → DEFAULTED  (by clock advance)
            (2) Payment→DEFAULTED CAUSES Customer.default_count += 1  (link 2 caused by link 1)
            (3) Customer.default_count crossing 3 CAUSES LoanContract.apr_bps uplift  (link 3 caused by link 2, not by the original clock-advance)
            (4) LoanContract.apr_bps change CAUSES every SCHEDULED Payment.monthly_payment to
                be re-priced via loan_monthly_payment  (link 4 caused by link 3)
          Each link is caused by the previous one, satisfying the transitive (not fan-out) clause.
        test_recipe:
          setup:
            - "Originate Customer C (fico=750), Loan L (principal=2850000, apr=450, monthly=84779). Activate."
            - "Drive defaults: POST /clock/advance days_advanced=180  (skipping due days 30, 60, 90, 120, 150, 180 well past 15-day grace)"
          trigger:
            - "(the single clock advance above; subsequent state changes are auto-cascade)"
          assert:
            - "Customer.default_count >= 3"
            - "At least one DelinquencyEvent has apr_uplift_bps_applied == 300"
            - "LoanContract.apr_bps == 750 (base 450 + uplift 300)"
            - "LoanContract.monthly_payment_cents == 87404 (re-priced over remaining 24 payments using new APR and current remaining_principal_cents == 1942326)"
            - "Every still-SCHEDULED Payment row on L has amount_due_cents == 87404"

      - name: lease_maturity_to_assessment_to_closed_depth_3
        grounds:
          - state_machines.LeaseContract.ACTIVE_to_MATURED
          - state_machines.LeaseEndAssessment.DRAFT_to_ISSUED
          - state_machines.LeaseEndAssessment.ISSUED_to_SETTLED
          - state_machines.LeaseContract.PURCHASED_to_CLOSED
          - calculations.lease_end_total
        distinguishing_aspect: |
          Triggered by POST /customers/{id}/clock/advance crossing maturity_day_index. Chain depth 3:
            (1) LeaseContract → MATURED (by clock advance) creates a DRAFT LeaseEndAssessment
            (2) LeaseContract → MATURED CAUSES creation of LeaseEndAssessment (link 2 caused by link 1)
            (3) Subsequent PATCH/odometer_reading and POST /lease-end/PURCHASE then settle CAUSES
                LeaseContract → CLOSED through ISSUED→SETTLED transition (link 3 caused by link 2)
          Different originating transition (lease maturity) and different chain pattern
          from the Payment-default cascade.
        test_recipe:
          setup:
            - "Originate Customer/Vehicle/Lease (TIER_1, 36-month). Activate. Pay all 36 Payments via clock advances and /pay calls."
          trigger:
            - "POST /customers/{C.id}/clock/advance days_advanced=1 (now Customer.clock_day_index >= maturity_day_index)"
            - "Observe lease auto-transition to MATURED and a DRAFT LeaseEndAssessment auto-created"
            - "PATCH .../assessment odometer_reading=36000 → assessment status=ISSUED"
            - "POST .../lease-end election=PURCHASE → lease status=PURCHASED"
            - "POST .../assessment/settle → assessment status=SETTLED"
          assert:
            - "LeaseContract.status transitioned ACTIVE → MATURED → PURCHASED → CLOSED (each step caused by the previous)"
            - "LeaseEndAssessment created automatically with status==DRAFT, then ISSUED, then SETTLED"
            - "LeaseEndAssessment.total_due_cents == 1934500 (residual 1650000 + fee 35000) wait — actually residual depends on V's rf; assert == LeaseContract.residual_value_cents + 35000"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs (>=2)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_lease_approve
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors.ERR_LEASE_NOT_PENDING_APPROVAL
          - errors.ERR_DOWN_PAYMENT_BELOW_MINIMUM
        distinguishing_aspect: |
          Error-category pair = (state, business_fiscal). Dual-failure scenario: a lease
          contract that is ALREADY APPROVED (state violation) AND whose down payment is
          below the FICO-tier minimum (business_fiscal violation). Per priority ordering,
          the state error must win — the response MUST be ERR_LEASE_NOT_PENDING_APPROVAL,
          NOT ERR_DOWN_PAYMENT_BELOW_MINIMUM.
        test_recipe:
          setup:
            - "Create Customer C (fico=750, TIER_1), Vehicle V (msrp=3000000), Lease L (vehicle_id=V.id, down_payment_cents=10000 (way below 8% minimum=240000), term_months=36, mileage_allowance=36000)"
            - "FIRST attempt approve: rejected with ERR_DOWN_PAYMENT_BELOW_MINIMUM. Reissue Lease with proper down payment, approve once → L.status=APPROVED."
            - "Now ATTEMPT a second approve on the already-APPROVED lease with the original (insufficient) down payment in body — but since approve takes no body, the dual-failure is constructed by: approve a lease, then attempt to approve it AGAIN with the body indicating altered down_payment (server ignores body on approve; checks state first)."
          trigger:
            - "POST /customers/{C.id}/lease-contracts/{L.id}/approve  (second call)"
          assert:
            - "Response status == 409"
            - "Response data.error_id == 'ERR_LEASE_NOT_PENDING_APPROVAL'  (NOT ERR_DOWN_PAYMENT_BELOW_MINIMUM — state precedes business_fiscal)"

      - name: business_safety_vs_business_referential_on_gap_claim
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_GAP_RIDER_PARENT_TERMINAL
          - errors.ERR_RIDER_CONTRACT_OWNERSHIP_MISMATCH
        distinguishing_aspect: |
          Different error-category pair = (business_safety, business_referential). Dual-failure
          scenario: a GapInsuranceRider /claim where the rider's parent contract is CLOSED
          (safety violation, priority 5) AND the claim is being initiated by a Customer
          whose id does not match the rider's parent contract owner (referential violation,
          priority 6). Per priority ordering, the SAFETY error must win.
        test_recipe:
          setup:
            - "Create Customer C1 with an ACTIVE lease and an ACTIVE GapInsuranceRider G on that lease"
            - "Drive C1's lease through to CLOSED (mature, return, settle assessment) → G is auto-CANCELLED on CLOSED side-effect; reset rider status to ACTIVE via direct DB only if needed. Alternatively, use a contract that reached PAID_OFF for the LOAN path: originate C1's loan, pay it off → G auto-CANCELLED."
            - "Re-attach a fresh rider on a CLOSED lease (this should itself be rejected, but the construction here is a rider whose parent reached a terminal state AFTER attachment)"
            - "Create Customer C2 (different id)"
          trigger:
            - "POST /customers/{C2.id}/gap-riders/{G.id}/claim payout_cents=10000"
          assert:
            - "Response status == 409"
            - "Response data.error_id == 'ERR_GAP_RIDER_PARENT_TERMINAL'  (business_safety priority 5) — NOT 'ERR_RIDER_CONTRACT_OWNERSHIP_MISMATCH' (business_referential priority 6)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints (>=2)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fico_tier_boundary_720_vs_719_on_customer_creation
        grounds:
          - calculations.fico_tier_assignment
          - entities.Customer.fields.fico_score
          - entities.Customer.fields.fico_tier
          - endpoints.POST /customers
        distinguishing_aspect: |
          Numeric threshold metric — FICO score. Boundary at exactly 720: 720 → TIER_1,
          719 → TIER_2 (comparator is `>=`, NOT `>`). Reached through POST /customers,
          which is structurally distinct from the empty-set check below.
        test_recipe:
          setup:
            - "(no setup beyond a clean DB)"
          trigger:
            - "POST /customers full_name='X', fico_score=720 → Customer A"
            - "POST /customers full_name='Y', fico_score=719 → Customer B"
            - "POST /customers full_name='Z', fico_score=660 → Customer C"
            - "POST /customers full_name='W', fico_score=659 → Customer D"
          assert:
            - "A.fico_tier == 'TIER_1'"
            - "B.fico_tier == 'TIER_2'"
            - "C.fico_tier == 'TIER_2'"
            - "D.fico_tier == 'TIER_3'"

      - name: mileage_overage_zero_at_exact_allowance_on_assessment_patch
        grounds:
          - calculations.mileage_overage_penalty
          - entities.LeaseEndAssessment.fields.mileage_overage
          - entities.LeaseEndAssessment.fields.mileage_penalty_cents
          - endpoints.PATCH /customers/{customerId}/lease-contracts/{contractId}/assessment
        distinguishing_aspect: |
          Different metric (mileage, not FICO) and different endpoint (PATCH assessment, not
          POST /customers). Boundary semantics: at exactly allowance, overage=0 and penalty=0
          (empty-overage edge); at allowance+1 a single penalized mile triggers PENALTY_PER_MILE_CENTS.
        test_recipe:
          setup:
            - "Originate Customer C, Lease L with mileage_allowance=36000. Drive L to MATURED."
          trigger:
            - "PATCH /customers/{C.id}/lease-contracts/{L1.id}/assessment odometer_reading=36000 (exact allowance)"
            - "PATCH /customers/{C.id}/lease-contracts/{L2.id}/assessment odometer_reading=36001 (one over)"
          assert:
            - "L1.assessment.mileage_overage == 0 AND L1.assessment.mileage_penalty_cents == 0  (empty overage at exact boundary)"
            - "L2.assessment.mileage_overage == 1 AND L2.assessment.mileage_penalty_cents == 25  (PENALTY_PER_MILE_CENTS)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs (>=2)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assessment_settle_requires_all_payments_paid_on_lease
        grounds:
          - state_machines.LeaseEndAssessment.ISSUED_to_SETTLED
          - entities.Payment.fields.status
          - entities.LeaseEndAssessment.fields.status
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair = (LeaseEndAssessment, Payment). LeaseEndAssessment.status=SETTLED is
          only allowed when EVERY child Payment row of the parent LeaseContract has
          status==PAID. The valid transition on entity A (LeaseEndAssessment) depends on
          aggregate state of entity B (Payment).
        test_recipe:
          setup:
            - "Originate lease L, activate. Pay 35 of 36 payments. Drive L to MATURED via clock advance (the unpaid 36th becomes LATE or DEFAULTED). PATCH assessment odometer_reading and elect RETURN → assessment ISSUED."
          trigger:
            - "POST /customers/{C.id}/lease-contracts/{L.id}/assessment/settle"
          assert:
            - "Response status == 409"
            - "Response data.error_id == 'ERR_ASSESSMENT_NOT_ISSUED' or a state-precondition error referencing outstanding payments  (settle rejected because not all child Payment rows are PAID)"
            - "After paying the missing 36th payment, retrying /settle succeeds and L.status becomes CLOSED"

      - name: gap_claim_requires_parent_contract_non_terminal_on_rider
        grounds:
          - state_machines.GapInsuranceRider.ACTIVE_to_CLAIMED
          - state_machines.LoanContract.ACTIVE_to_PAID_OFF
          - validations[priority=5]
          - entities.LoanContract.fields.status
          - entities.GapInsuranceRider.fields.status
        distinguishing_aspect: |
          Different entity pair = (GapInsuranceRider, LoanContract). GapInsuranceRider may
          only transition ACTIVE→CLAIMED while the parent LoanContract is in {ACTIVE, DEFAULTED}.
          A claim against a PAID_OFF / CHARGED_OFF / CLOSED contract is rejected. This is a
          different cross-entity pairing from Assessment↔Payment above.
        test_recipe:
          setup:
            - "Originate loan L (TIER_1, principal=2850000, monthly=84779). Activate. Attach GapInsuranceRider G."
            - "Pay all 36 Payment rows via clock+pay → L auto-transitions to PAID_OFF and G is auto-CANCELLED as a side-effect."
          trigger:
            - "POST /customers/{C.id}/gap-riders/{G.id}/claim payout_cents=50000"
          assert:
            - "Response status == 409"
            - "Response data.error_id == 'ERR_GAP_RIDER_PARENT_TERMINAL' (rider's parent is PAID_OFF) or 'ERR_GAP_RIDER_NOT_CLAIMABLE' (rider is CANCELLED) — both are valid framings of the cross-entity dependency"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics (>=2)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: payment_due_day_uniqueness_on_contract_closed_interval
        grounds:
          - validations[priority=8]
          - errors.ERR_PAYMENT_DUE_DATE_COLLISION
          - entities.Payment.fields.due_day_index
          - endpoints.POST /customers/{customerId}/loan-contracts/{contractId}/activate
        distinguishing_aspect: |
          Resource = Payment rows on a single contract. Interval semantics = single-point
          (closed) occupation: at most one non-terminal (SCHEDULED|LATE|DEFAULTED) Payment
          may occupy a given due_day_index. Adjacency is NOT meaningful (each Payment is a
          point in time, not an interval). Rejection on collision.
        test_recipe:
          setup:
            - "Originate Loan L, activate (36 Payments generated at due_day_index 30, 60, 90, …, 1080)"
          trigger:
            - "Attempt a manual POST /customers/{C.id}/payments with contract_id=L.id, period_index=4, due_day_index=120 (collides with the auto-generated period_index=4 at day 120)"
          assert:
            - "Response status == 409"
            - "Response data.error_id == 'ERR_PAYMENT_DUE_DATE_COLLISION'"

      - name: lease_window_overlap_on_customer_half_open_interval
        grounds:
          - validations[priority=9]
          - errors.ERR_LEASE_WINDOW_OVERLAP
          - entities.LeaseContract.fields.origination_day_index
          - entities.LeaseContract.fields.maturity_day_index
          - endpoints.POST /customers/{customerId}/lease-contracts/{contractId}/approve
        distinguishing_aspect: |
          DIFFERENT resource (LeaseContract on a Customer) AND DIFFERENT interval semantics:
          half-open intervals [origination, maturity) such that adjacency
          (lease_A.maturity == lease_B.origination) is ALLOWED, but any overlap of
          ≥1 day is rejected. This is geometrically distinct from the Payment due-day point
          uniqueness above.
        test_recipe:
          setup:
            - "Originate Customer C. Approve & activate Lease L1 (term_months=24, origination_day_index=0, maturity_day_index=720)."
          trigger:
            - "Originate a second lease L2 with vehicle V2; immediately POST .../L2/approve (Customer.clock_day_index is still 0, so L2.origination_day_index=0 and L2.maturity_day_index=720 — fully overlapping with L1)"
            - "Then advance clock to day 720 (L1 still non-terminal), originate L3 and approve → should SUCCEED (adjacent, not overlapping under half-open semantics)"
          assert:
            - "L2 approve response status == 409 with data.error_id == 'ERR_LEASE_WINDOW_OVERLAP'"
            - "L3 approve response status == 200 (adjacency at day 720 is allowed per half-open [start, end))"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities (>=2)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: loan_principal_conservation_across_payments
        grounds:
          - calculations.amortization_step
          - entities.LoanContract.fields.principal_cents
          - entities.LoanContract.fields.remaining_principal_cents
          - entities.LoanContract.fields.total_principal_paid_cents
          - state_machines.Payment.SCHEDULED_to_PAID
        distinguishing_aspect: |
          Conserved quantity = TOTAL PRINCIPAL (a monetary stock). For any sequence of /pay
          operations followed by a partial /claim against a GapInsuranceRider (compensating
          action: rider claim debits remaining_principal_cents and behaves as a forward
          payment that pays principal without interest), the invariant
            total_principal_paid_cents + remaining_principal_cents + sum(GapRider.claim_payout_cents on this loan)
              == principal_cents (origination value)
          MUST hold at every step.
        test_recipe:
          setup:
            - "Originate Loan L (principal_cents=2850000), activate, attach GapInsuranceRider G"
            - "Make 12 /pay calls; observe total_principal_paid_cents=907674, remaining_principal_cents=1942326, sum_gap_claims=0 → invariant 907674 + 1942326 + 0 == 2850000 ✓"
            - "POST /gap-riders/{G.id}/claim payout_cents=100000 → remaining_principal_cents=1842326, sum_gap_claims=100000"
          trigger:
            - "(invariant is observed at each step, not triggered by a single endpoint)"
          assert:
            - "After step 1: total_principal_paid_cents + remaining_principal_cents == principal_cents → 907674 + 1942326 == 2850000"
            - "After step 2 (gap claim 100000): 907674 + 1842326 + 100000 == 2850000  (principal stock conserved)"

      - name: lease_end_assessment_charges_conservation
        grounds:
          - calculations.lease_end_total
          - entities.LeaseEndAssessment.fields.mileage_penalty_cents
          - entities.LeaseEndAssessment.fields.disposition_fee_cents
          - entities.LeaseEndAssessment.fields.purchase_option_cents
          - entities.LeaseEndAssessment.fields.total_due_cents
          - state_machines.LeaseEndAssessment.ISSUED_to_SETTLED
          - state_machines.LeaseEndAssessment.DISPUTED_to_RESOLVED
        distinguishing_aspect: |
          DIFFERENT conserved quantity (a per-assessment AGGREGATE FLOW, not a stock).
          For every state transition that mutates a component (PATCH odometer, lease-end
          election, dispute/resolve), the invariant
            total_due_cents == mileage_penalty_cents + disposition_fee_cents + purchase_option_cents
          MUST hold. A dispute+resolve cycle (forward → compensating action) MUST leave the
          named quantity (total_due_cents) consistent with the three component sums; no
          drift may accumulate across the cycle.
        test_recipe:
          setup:
            - "Originate lease L, drive to MATURED, PATCH odometer_reading=37500 → assessment.mileage_overage=1500, mileage_penalty=37500"
            - "POST /lease-end election=RETURN → disposition_fee=39500, purchase_option=0, total_due=77000"
            - "POST /assessment/dispute → status=DISPUTED, components unchanged"
            - "POST /assessment/resolve revised_odometer_reading=36500 → mileage_overage=500, mileage_penalty=12500, total_due recomputed"
          trigger:
            - "(invariant observed after each mutation)"
          assert:
            - "After PATCH odo=37500: total_due_cents == mileage_penalty_cents (37500) + disposition_fee_cents (0) + purchase_option_cents (0) == 37500"
            - "After /lease-end RETURN: total_due_cents == 37500 + 39500 + 0 == 77000"
            - "After /resolve odo=36500: total_due_cents == 12500 + 39500 + 0 == 52000  (invariant holds before AND after the dispute/resolve compensating cycle; no drift)"
