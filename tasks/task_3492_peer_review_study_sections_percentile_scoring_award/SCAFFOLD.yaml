# =============================================================================
# SCAFFOLD — Peer Review Study Sections, Percentile Scoring & Award Cycles (NIH)
# §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Peer Review Study Sections, Percentile Scoring & Award Cycles (National Institutes of Health): application submission against funding opportunity announcements with page limits, budget structures and institutional certifications, referral to review groups and funding institutes with assignment requests from applicants, peer review panels with reviewer recruitment, conflict of interest screening and scoring across criteria, impact score computation and percentile ranking within a review group with normalization across panels, advisory council second-level review considering program priorities and portfolio balance, payline determination and select pay decisions with institute discretion, just-in-time information requests and award issuance with terms and conditions, progress reporting, carryover authority, no-cost extensions and change of institution transfers

domain_name: nih-peer-review
api_prefix: /grants

complexity_profile:
  primary_archetype: quota_allocation        # finite institute appropriation competed for via percentile ranking
  secondary_archetype: multi_party_negotiation  # applicant / SRO / reviewer / council / grants-officer staged agreement
  complexity_layers:
    - optimistic_concurrency                 # OCC on Application.version (referral) and Institute.version (payline)
    - cascading_side_effects                 # withdraw cascade, transfer-accept cascade, payline publication fan-out
    - dual_variant_calculation               # raw vs normalized percentile; time-prorated vs ledger transfer relinquishment
    - derived_field_reconciliation           # normalized percentile recomputed for whole activity pool on every release
  entity_topology: flat                      # peer entities joined by foreign keys; nested URLs only for creation convenience
  state_machine_shape: cyclic                # REFERRED<->UNDER_REVIEW quorum loop; JIT SUBMITTED->RETURNED->SUBMITTED loop
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties          # program / referral / review / council / grants duties are disjoint
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: FundingOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: pa_number, type: string, source: input, description: "Announcement number; unique across all funding opportunities" }
      - { name: title, type: string, source: input, description: "Announcement title" }
      - { name: activity_code, type: enum, source: input, description: "Grant mechanism: R01 | R21 | R03" }
      - { name: research_strategy_page_limit, type: integer, source: input, description: "Maximum allowed research_strategy pages (>= 1)" }
      - { name: min_direct_cents_per_year, type: integer, source: input, description: "Minimum allowable requested direct cost per year, in cents (>= 0)" }
      - { name: max_direct_cents_per_year, type: integer, source: input, description: "Maximum allowable requested direct cost per year, in cents (>= min)" }
      - { name: max_years, type: integer, source: input, description: "Maximum requested project years (1..5)" }
      - { name: open_date, type: datetime, source: input, description: "ISO8601 UTC instant the announcement opens" }
      - { name: receipt_deadline, type: datetime, source: input, description: "ISO8601 UTC instant after which submissions are rejected" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; starts OPEN; close endpoint moves to CLOSED" }

  - name: Institute
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institute name (e.g., National Cancer Institute)" }
      - { name: appropriation_cents, type: integer, source: input, description: "Total fiscal appropriation available for awards (>= 0)" }
      - { name: reserve_cents, type: integer, source: input, description: "Untouchable reserve withheld from all commitment walks (>= 0)" }
      - { name: indirect_cost_rate, type: number, source: input, description: "F&A indirect rate applied to direct costs (0..1)" }
      - { name: select_pay_cap_pct, type: number, source: input, description: "Fraction of appropriation spendable via select pay (0..1)" }
      - { name: select_pay_extension_percentile, type: number, source: input, description: "Percentile points beyond the published payline reachable by select pay (>= 0)" }
      - { name: committed_cents, type: integer, source: computed, description: "Outstanding obligations across non-terminal awards; starts 0" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Cumulative outlays from accepted progress reports; starts 0" }
      - { name: select_pay_spent_cents, type: integer, source: computed, description: "Cumulative projected cost committed through select-pay decisions; starts 0" }
      - { name: current_payline_percentile, type: number, source: computed, description: "Most recently published base payline percentile; null until first payline decision" }

  - name: Institution
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution name" }
      - { name: human_subjects_certification_expiry, type: datetime, source: input, description: "ISO8601 UTC expiry of the human-subjects certification; null = not certified" }
      - { name: animal_welfare_assurance_expiry, type: datetime, source: input, description: "ISO8601 UTC expiry of the animal-welfare assurance; null = no assurance" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Principal investigator full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: career_stage, type: enum, source: input, description: "NEW_INVESTIGATOR | EARLY_STAGE_INVESTIGATOR | ESTABLISHED_INVESTIGATOR" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: foa_id, type: string, source: input, description: "FK -> FundingOpportunity.id; announcement this application responds to" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; taken from X-User-ID at creation, never from the body" }
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; applicant institution" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: research_strategy_page_count, type: integer, source: input, description: "Research strategy length in pages (>= 1)" }
      - { name: direct_cents_per_year, type: array, source: input, description: "Requested direct cost per project year, array of integer cents; length must equal requested_years" }
      - { name: requested_years, type: integer, source: input, description: "Requested project period length in years (1..5)" }
      - { name: human_subjects_involved, type: boolean, source: input, default: false, description: "Whether human subjects are involved (drives certification + JIT IRB item)" }
      - { name: vertebrate_animals_involved, type: boolean, source: input, default: false, description: "Whether vertebrate animals are involved (drives certification + JIT IACUC item)" }
      - { name: requested_study_section_id, type: string, source: input, description: "FK -> StudySection.id; applicant-requested review group (advisory but honored unless overridden); null allowed" }
      - { name: requested_institute_id, type: string, source: input, description: "FK -> Institute.id; applicant-requested funding institute; null allowed" }
      - { name: excluded_reviewer_ids, type: array, source: input, default: [], description: "Reviewer ids the applicant asks to exclude; enforced at assignment time; no existence check at create" }
      - { name: study_section_id, type: string, source: system, description: "FK -> StudySection.id; assigned review group; null until referral" }
      - { name: institute_id, type: string, source: system, description: "FK -> Institute.id; assigned funding institute; null until referral" }
      - { name: live_assignment_count, type: integer, source: computed, description: "Assignments with status ASSIGNED | ACCEPTED | CRITIQUE_SUBMITTED; starts 0" }
      - { name: impact_score, type: integer, source: computed, description: "Overall impact score 10..90 from weighted reviewer ratings; null until scored" }
      - { name: approach_mean, type: number, source: computed, description: "Mean of approach criterion scores over submitted critiques, 2 decimals round_half_up; null until scored" }
      - { name: significance_mean, type: number, source: computed, description: "Mean of significance criterion scores, 2 decimals; null until scored" }
      - { name: innovation_mean, type: number, source: computed, description: "Mean of innovation criterion scores, 2 decimals; null until scored" }
      - { name: percentile_raw, type: number, source: computed, description: "Within-section percentile (1 decimal); null until scored" }
      - { name: percentile_normalized, type: number, source: computed, description: "Cross-panel normalized percentile within the activity-code pool (1 decimal); null until scored" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REFERRED | UNDER_REVIEW | SCORED | UNSCORED | DEFERRED | COUNCIL_REVIEWED | JIT_PENDING | JIT_COMPLETE | AWARDED | NOT_FUNDED | WITHDRAWN" }

  - name: StudySection
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Study section / review group name" }
      - { name: meeting_date, type: datetime, source: input, description: "ISO8601 UTC instant of the review meeting" }
      - { name: application_quota, type: integer, source: input, description: "Maximum applications assignable to this section (>= 1)" }
      - { name: assigned_application_count, type: integer, source: computed, description: "Applications with study_section_id == this section and status REFERRED | UNDER_REVIEW; starts 0" }
      - { name: status, type: enum, source: system, description: "RECRUITING | MEETING_HELD | SCORES_RELEASED" }

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Reviewer full name" }
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; reviewer affiliation, drives institutional COI" }
      - { name: expertise_keywords, type: array, source: input, description: "List of expertise keyword strings" }
      - { name: declared_conflicts, type: array, source: system, description: "Application ids the reviewer has self-declared a conflict with; starts []" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Assignments with status ASSIGNED | ACCEPTED; starts 0" }
      - { name: status, type: enum, source: system, description: "INVITED | ACTIVE | DECLINED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application under review" }
      - { name: reviewer_id, type: string, source: input, description: "FK -> Reviewer.id; assigned reviewer" }
      - { name: role, type: enum, source: input, description: "PRIMARY | SECONDARY; PRIMARY carries weight 2 in impact scoring" }
      - { name: significance_score, type: integer, source: input, description: "Criterion score 1..9, supplied via submit-critique; null until submitted" }
      - { name: innovation_score, type: integer, source: input, description: "Criterion score 1..9; null until submitted" }
      - { name: approach_score, type: integer, source: input, description: "Criterion score 1..9; null until submitted" }
      - { name: investigator_score, type: integer, source: input, description: "Criterion score 1..9; null until submitted" }
      - { name: environment_score, type: integer, source: input, description: "Criterion score 1..9; null until submitted" }
      - { name: overall_impact_score, type: integer, source: input, description: "Overall impact rating 1..9; null until submitted" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ACCEPTED | DECLINED | CRITIQUE_SUBMITTED | CANCELLED" }

  - name: CouncilReview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; scored application under second-level review" }
      - { name: recommendation, type: enum, source: input, description: "FUND | DEFER | NOT_FUND" }
      - { name: priority_alignment_score, type: integer, source: input, description: "Program-priority alignment 1..5; required when recommendation == FUND" }
      - { name: portfolio_balance_note, type: string, source: input, description: "Optional portfolio-balance rationale" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the recording council member (opaque)" }

  - name: JitRequest
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; funding-selected application" }
      - { name: required_items, type: array, source: computed, description: "OTHER_SUPPORT + BUDGET_JUSTIFICATION always; IRB_APPROVAL iff human_subjects_involved; IACUC_APPROVAL iff vertebrate_animals_involved" }
      - { name: submitted_items, type: array, source: system, description: "Items accepted so far; starts []" }
      - { name: due_date, type: datetime, source: computed, description: "creation clock + 30 days (JIT_RESPONSE_WINDOW_DAYS)" }
      - { name: budget_cut_pct, type: number, source: system, description: "Uniform direct-cost cut recorded at JIT acceptance (0..0.30); default 0" }
      - { name: status, type: enum, source: system, description: "ISSUED | SUBMITTED | RETURNED | ACCEPTED | EXPIRED" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; funded application" }
      - { name: institute_id, type: string, source: system, description: "FK -> Institute.id; issuing institute" }
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; current awardee institution" }
      - { name: start_date, type: datetime, source: input, description: "ISO8601 UTC project start; must be >= current clock" }
      - { name: end_date, type: datetime, source: computed, description: "start_date + requested_years * 365 days; shifted by approved no-cost extensions" }
      - { name: period_total_cents, type: array, source: computed, description: "Per-year total (direct+indirect) budgets; mutated in place by carryover approvals; sum is invariant" }
      - { name: total_awarded_cents, type: integer, source: computed, description: "Sum of period_total_cents at issuance; conserved across carryover and NCE" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Cumulative outlays from accepted progress reports; starts 0" }
      - { name: disbursed_per_period_cents, type: array, source: computed, description: "Per-period disbursal recorded at report acceptance; starts as zeros" }
      - { name: carried_out_per_period_cents, type: array, source: computed, description: "Per-period amounts carried forward out of that period; starts as zeros" }
      - { name: current_period, type: integer, source: system, description: "1-based open budget period; advances on progress-report acceptance; starts 1" }
      - { name: terms_and_conditions, type: array, source: computed, description: "STANDARD_TERMS_V1 always; + RESTRICTED_DRAW_DOWN when budget_cut_pct > 0; + TRANSFERRED_AWARD on successor awards" }
      - { name: originating_transfer_id, type: string, source: system, description: "FK -> TransferRequest.id; set on awards created by an accepted transfer; null otherwise" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TRANSFERRED | TERMINATED" }

  - name: ProgressReport
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> Award.id; reported award" }
      - { name: period_year, type: integer, source: input, description: "Budget period being reported; must equal award.current_period" }
      - { name: actual_expenditure_cents, type: integer, source: input, description: "Actual spending for the period, cents (>= 0)" }
      - { name: publications_count, type: integer, source: input, description: "Publications arising in the period (>= 0)" }
      - { name: submitted_late, type: boolean, source: computed, description: "true when the creation clock is past period end (window close is period end + 90 days)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED" }

  - name: AwardModification
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> Award.id; modified award" }
      - { name: type, type: enum, source: input, description: "CARRYOVER | NO_COST_EXTENSION | TERMINATION" }
      - { name: amount_cents, type: integer, source: input, description: "Carryover amount; required iff type == CARRYOVER" }
      - { name: from_period, type: integer, source: input, description: "Source budget period; required iff type == CARRYOVER" }
      - { name: new_end_date, type: datetime, source: input, description: "Requested new end date; required iff type == NO_COST_EXTENSION" }
      - { name: reason, type: string, source: input, description: "Optional justification" }
      - { name: auto_approved, type: boolean, source: computed, description: "true when the request auto-approves at creation (carryover <= 25% of unobligated; first NCE <= 365 days; any TERMINATION)" }
      - { name: status, type: enum, source: system, description: "AUTO_APPROVED | PENDING_APPROVAL | APPROVED | DENIED" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> Award.id; award proposed for change-of-institution transfer" }
      - { name: to_institution_id, type: string, source: input, description: "FK -> Institution.id; proposed receiving institution" }
      - { name: effective_date, type: datetime, source: input, description: "ISO8601 UTC transfer effective date; must be >= current clock" }
      - { name: proration_variant, type: enum, source: computed, description: "TIME_PRORATED | LEDGER_ACTUALS; chosen at relinquish; null until then" }
      - { name: relinquished_amount_cents, type: integer, source: computed, description: "Amount moving to the successor award; computed at relinquish; null until then" }
      - { name: status, type: enum, source: system, description: "PROPOSED | RELINQUISHED | ACCEPTED | DECLINED" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: FundingOpportunity
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /grants/funding-opportunities/{id}/close"
        actor: ProgramOfficer
        preconditions:
          - "FOA must be OPEN (ERR_FOA_NOT_OPEN)"
        side_effects:
          - "status -> CLOSED; further submissions against this FOA are rejected"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [AWARDED, NOT_FUNDED, UNSCORED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /grants/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "FOA must be OPEN (ERR_FOA_NOT_OPEN)"
          - "logical clock must be <= foa.receipt_deadline (ERR_RECEIPT_DEADLINE_PASSED)"
          - "research_strategy_page_count <= foa.research_strategy_page_limit (ERR_PAGE_LIMIT_EXCEEDED)"
          - "requested_years <= foa.max_years and direct_cents_per_year length == requested_years (ERR_INVALID_BUDGET_STRUCTURE)"
          - "every direct_cents_per_year[y] >= foa.min_direct_cents_per_year (ERR_INVALID_BUDGET_STRUCTURE)"
          - "every direct_cents_per_year[y] <= foa.max_direct_cents_per_year (ERR_BUDGET_CAP_EXCEEDED)"
          - "if human_subjects_involved: institution.human_subjects_certification_expiry non-null (ERR_CERTIFICATION_MISSING) and >= foa.receipt_deadline (ERR_CERTIFICATION_EXPIRED)"
          - "if vertebrate_animals_involved: institution.animal_welfare_assurance_expiry non-null (ERR_CERTIFICATION_MISSING) and >= foa.receipt_deadline (ERR_CERTIFICATION_EXPIRED)"
        side_effects:
          - "status -> SUBMITTED; application.version += 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /grants/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: REFERRED
        trigger: "POST /grants/applications/{id}/referral"
        actor: ReferralOfficer
        preconditions:
          - "OCC: expected_application_version == application.version (ERR_STALE_APPLICATION_VERSION, 412)"
          - "target study section exists (ERR_STUDY_SECTION_NOT_FOUND) and is RECRUITING (ERR_SECTION_NOT_RECRUITING)"
          - "section.assigned_application_count < section.application_quota (ERR_SECTION_QUOTA_EXCEEDED)"
          - "target institute exists (ERR_INSTITUTE_NOT_FOUND)"
          - "honor rule: if requested_study_section_id set and differs from target and requested section is RECRUITING with capacity and override_assignment_request is not true -> ERR_ASSIGNMENT_REQUEST_IGNORED; same rule for requested_institute_id"
        side_effects:
          - "study_section_id / institute_id set; status -> REFERRED"
          - "section.assigned_application_count += 1"
          - "application.version += 1"

      - from: REFERRED
        to: REFERRED
        trigger: "POST /grants/applications/{id}/referral (re-referral supersedes prior referral)"
        actor: ReferralOfficer
        preconditions:
          - "OCC: expected_application_version == application.version (ERR_STALE_APPLICATION_VERSION, 412)"
          - "no live assignments (live_assignment_count == 0), else ERR_LIVE_ASSIGNMENTS_EXIST"
          - "same target-state preconditions as SUBMITTED -> REFERRED"
        side_effects:
          - "old section.assigned_application_count -= 1 when the section changes; new section.assigned_application_count += 1"
          - "study_section_id / institute_id replaced; application.version += 1"

      - from: REFERRED
        to: UNDER_REVIEW
        trigger: "system (automatic whenever an Assignment is created while the application is REFERRED, i.e., live_assignment_count rises to >= 1)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> UNDER_REVIEW; application.version += 1"

      - from: UNDER_REVIEW
        to: REFERRED
        trigger: "system (automatic when live_assignment_count drops below MIN_LIVE_ASSIGNMENTS = 2)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> REFERRED; application.version += 1; application must attract new assignments before it can be scored"

      - from: REFERRED
        to: WITHDRAWN
        trigger: "POST /grants/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "section.assigned_application_count -= 1"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /grants/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "L1: every live Assignment (ASSIGNED | ACCEPTED | CRITIQUE_SUBMITTED) -> CANCELLED"
          - "L2: each cancelled assignment's Reviewer.active_assignment_count -= 1 (only when the assignment was ASSIGNED or ACCEPTED)"
          - "L3: section.assigned_application_count -= 1"

      - from: UNDER_REVIEW
        to: SCORED
        trigger: "system (release-scores, when the application has >= MIN_CRITIQUES_TO_SCORE submitted critiques)"
        actor: system
        preconditions: []
        side_effects:
          - "impact_score, criterion means computed (calculations.impact_score)"
          - "percentile_raw computed (calculations.percentile_scoring, raw variant)"
          - "percentile_normalized computed for the entire activity-code pool (calculations.percentile_scoring, normalized variant)"
          - "application.version += 1"

      - from: UNDER_REVIEW
        to: UNSCORED
        trigger: "system (release-scores, when the application has < MIN_LIVE_ASSIGNMENTS submitted critiques)"
        actor: system
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: SCORED
        to: COUNCIL_REVIEWED
        trigger: "POST /grants/council-reviews with recommendation FUND"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: SCORED
        to: DEFERRED
        trigger: "POST /grants/council-reviews with recommendation DEFER"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: DEFERRED
        to: COUNCIL_REVIEWED
        trigger: "POST /grants/council-reviews with recommendation FUND"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: DEFERRED
        to: DEFERRED
        trigger: "POST /grants/council-reviews with recommendation DEFER (re-deferral)"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: SCORED
        to: NOT_FUNDED
        trigger: "POST /grants/council-reviews with recommendation NOT_FUND"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: DEFERRED
        to: NOT_FUNDED
        trigger: "POST /grants/council-reviews with recommendation NOT_FUND"
        actor: CouncilMember
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: COUNCIL_REVIEWED
        to: JIT_PENDING
        trigger: "system (payline publication funds the application) OR POST /grants/applications/{id}/select-pay"
        actor: system
        preconditions: []
        side_effects:
          - "JitRequest auto-created (status ISSUED) with required_items derived from application flags and due_date = clock + 30 days"
          - "application.version += 1"

      - from: JIT_PENDING
        to: JIT_COMPLETE
        trigger: "system (JitRequest adjudicated ACCEPT)"
        actor: system
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: JIT_PENDING
        to: NOT_FUNDED
        trigger: "system (JitRequest expires: any jit operation attempted with clock > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "application.version += 1"

      - from: JIT_COMPLETE
        to: AWARDED
        trigger: "POST /grants/applications/{id}/award"
        actor: GrantsOfficer
        preconditions: []
        side_effects:
          - "Award created per calculations.award_budget_build"
          - "institute.committed_cents += award.total_awarded_cents"
          - "application.version += 1"

  - entity: StudySection
    initial_state: RECRUITING
    terminal_states: [SCORES_RELEASED]
    transitions:
      - from: RECRUITING
        to: MEETING_HELD
        trigger: "POST /grants/study-sections/{id}/convene"
        actor: ScientificReviewOfficer
        preconditions:
          - "at least one application with study_section_id == section is UNDER_REVIEW (ERR_SECTION_NOT_CONVENABLE)"
        side_effects: []

      - from: MEETING_HELD
        to: SCORES_RELEASED
        trigger: "POST /grants/study-sections/{id}/release-scores"
        actor: ScientificReviewOfficer
        preconditions: []
        side_effects:
          - "every UNDER_REVIEW application of this section -> SCORED (>= 2 submitted critiques) or UNSCORED (< 2)"
          - "calculations.impact_score runs per application"
          - "calculations.percentile_scoring raw variant runs over this section's SCORED pool"
          - "calculations.percentile_scoring normalized variant re-runs over the whole activity-code pool (touches other sections' applications)"

  - entity: Reviewer
    initial_state: INVITED
    terminal_states: [DECLINED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /grants/reviewers/{id}/respond with decision ACCEPT"
        actor: Reviewer
        preconditions: []
        side_effects: []

      - from: INVITED
        to: DECLINED
        trigger: "POST /grants/reviewers/{id}/respond with decision DECLINE"
        actor: Reviewer
        preconditions: []
        side_effects: []

  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [DECLINED, CRITIQUE_SUBMITTED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /grants/assignments/{id}/respond with decision ACCEPT"
        actor: Reviewer
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /grants/assignments/{id}/respond with decision DECLINE"
        actor: Reviewer
        preconditions: []
        side_effects:
          - "Reviewer.active_assignment_count -= 1"
          - "application.live_assignment_count -= 1; if application UNDER_REVIEW and live_assignment_count < 2 -> application auto-transitions to REFERRED"

      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /grants/assignments/{id}/respond with decision DECLINE"
        actor: Reviewer
        preconditions: []
        side_effects:
          - "Reviewer.active_assignment_count -= 1"
          - "application.live_assignment_count -= 1; if application UNDER_REVIEW and live_assignment_count < 2 -> application auto-transitions to REFERRED"

      - from: ACCEPTED
        to: CRITIQUE_SUBMITTED
        trigger: "POST /grants/assignments/{id}/submit-critique"
        actor: Reviewer
        preconditions:
          - "application's study section must be MEETING_HELD (ERR_SECTION_NOT_IN_MEETING)"
          - "all six scores integers 1..9 (ERR_VALIDATION)"
        side_effects:
          - "criterion + overall scores recorded; reviewer.active_assignment_count -= 1 (critique done frees active slot)"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (application withdrawn)"
        actor: system
        preconditions: []
        side_effects:
          - "Reviewer.active_assignment_count -= 1"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (application withdrawn)"
        actor: system
        preconditions: []
        side_effects:
          - "Reviewer.active_assignment_count -= 1"

      - from: CRITIQUE_SUBMITTED
        to: CANCELLED
        trigger: "system (application withdrawn)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: JitRequest
    initial_state: ISSUED
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: ISSUED
        to: SUBMITTED
        trigger: "POST /grants/jit-requests/{id}/submit-items"
        actor: Applicant
        preconditions:
          - "logical clock <= due_date (else -> EXPIRED and ERR_JIT_EXPIRED)"
          - "items_submitted covers every element of required_items (ERR_JIT_ITEM_MISSING)"
        side_effects:
          - "submitted_items := items_submitted"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /grants/jit-requests/{id}/adjudicate with decision RETURN"
        actor: GrantsOfficer
        preconditions:
          - "logical clock <= due_date (else -> EXPIRED and ERR_JIT_EXPIRED)"
        side_effects: []

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /grants/jit-requests/{id}/submit-items"
        actor: Applicant
        preconditions:
          - "logical clock <= due_date (else -> EXPIRED and ERR_JIT_EXPIRED)"
          - "items_submitted covers every element of required_items (ERR_JIT_ITEM_MISSING)"
        side_effects:
          - "submitted_items := items_submitted"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /grants/jit-requests/{id}/adjudicate with decision ACCEPT"
        actor: GrantsOfficer
        preconditions:
          - "logical clock <= due_date (else -> EXPIRED and ERR_JIT_EXPIRED)"
        side_effects:
          - "budget_cut_pct recorded from adjudicate payload (default 0)"
          - "application -> JIT_COMPLETE"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (any jit operation attempted with clock > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "application -> NOT_FUNDED"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (any jit operation attempted with clock > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "application -> NOT_FUNDED"

      - from: RETURNED
        to: EXPIRED
        trigger: "system (any jit operation attempted with clock > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "application -> NOT_FUNDED"

  - entity: Award
    initial_state: ACTIVE
    terminal_states: [TRANSFERRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (AwardModification of type TERMINATION auto-approves at creation)"
        actor: system
        preconditions: []
        side_effects:
          - "institute.committed_cents -= (total_awarded_cents - disbursed_cents)"

      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system (TransferRequest decide ACCEPT)"
        actor: system
        preconditions: []
        side_effects:
          - "institute.committed_cents -= (relinquished_amount_cents + retained_cents) where retained = total - disbursed - relinquished"
          - "successor Award created: institution_id = to_institution_id, total_awarded_cents = relinquished, start_date = effective_date, end_date = original end_date, period_total_cents = [relinquished], current_period = 1, terms += TRANSFERRED_AWARD, originating_transfer_id set"
          - "institute.committed_cents += relinquished_amount_cents"

  - entity: ProgressReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /grants/progress-reports/{id}/accept"
        actor: GrantsOfficer
        preconditions: []
        side_effects:
          - "disbursed = min(actual_expenditure_cents, period_total_cents[current_period])"
          - "award.disbursed_cents += disbursed; award.disbursed_per_period_cents[current_period] = disbursed"
          - "institute.committed_cents -= disbursed; institute.disbursed_cents += disbursed"
          - "award.current_period += 1"

  - entity: AwardModification
    initial_state: "PENDING_APPROVAL (creation lands in AUTO_APPROVED instead when the type-specific auto-approval rule fires: carryover <= 25% of unobligated, first NCE <= 365 days, any TERMINATION)"
    terminal_states: [AUTO_APPROVED, APPROVED, DENIED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /grants/award-modifications/{id}/adjudicate with decision APPROVE"
        actor: GrantsOfficer
        preconditions: []
        side_effects:
          - "CARRYOVER: period_total_cents[from_period] -= amount; carried_out_per_period_cents[from_period] += amount; period_total_cents[current_period] += amount (total conserved)"
          - "NO_COST_EXTENSION: award.end_date := new_end_date (extension adjoins the prior end date; no gap, no overlap)"

      - from: PENDING_APPROVAL
        to: DENIED
        trigger: "POST /grants/award-modifications/{id}/adjudicate with decision DENY"
        actor: GrantsOfficer
        preconditions: []
        side_effects: []

  - entity: TransferRequest
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: PROPOSED
        to: RELINQUISHED
        trigger: "POST /grants/transfer-requests/{id}/relinquish"
        actor: GrantsOfficer
        preconditions: []
        side_effects:
          - "calculations.transfer_relinquishment runs: proration_variant chosen and relinquished_amount_cents computed"

      - from: RELINQUISHED
        to: ACCEPTED
        trigger: "POST /grants/transfer-requests/{id}/decide with decision ACCEPT"
        actor: GrantsOfficer
        preconditions: []
        side_effects:
          - "L1: original Award -> TRANSFERRED with its institute commitment reduction"
          - "L2: successor Award created per Award TRANSFERRED transition side effects"
          - "L3: institute.committed_cents += relinquished_amount_cents"

      - from: RELINQUISHED
        to: DECLINED
        trigger: "POST /grants/transfer-requests/{id}/decide with decision DECLINE"
        actor: GrantsOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on parent version only
# =============================================================================
concurrency_rules:
  - rule_id: referral-stale-application-version
    parent_entity: Application
    write_endpoint: "POST /grants/applications/{id}/referral"
    occ_field: expected_application_version
    description: |
      Referral (including a re-referral that legitimately supersedes the prior
      referral under the REFERRED -> REFERRED self-transition) is rejected when
      the supplied expected_application_version no longer matches the
      application's current version: the caller is acting on a stale view of
      the application's referral state.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: payline-stale-institute-version
    parent_entity: Institute
    write_endpoint: "POST /grants/institutes/{id}/payline-decisions"
    occ_field: expected_institute_version
    description: |
      Publishing a payline decision supersedes the institute's previously
      published payline; a request carrying an expected_institute_version that
      no longer matches the institute's current version is rejected as stale.
    error_id: ERR_STALE_INSTITUTE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: impact_score
    trigger: "study section release-scores (for each UNDER_REVIEW application of the section)"
    algorithm: weighted_scoring
    formula: |
      critiques = assignments of the application with status == CRITIQUE_SUBMITTED
      if count(critiques) < MIN_CRITIQUES_TO_SCORE:
        application -> UNSCORED; impact_score, means, percentiles remain null
      else:
        weight(a) = PRIMARY_WEIGHT when a.role == PRIMARY else SECONDARY_WEIGHT
        weighted_mean = sum(overall_impact_score(a) * weight(a)) / sum(weight(a))
        impact_score = round_half_up(weighted_mean * 10)          # integer, 10..90
        approach_mean     = round_half_up(mean(approach_score over critiques), 2)
        significance_mean = round_half_up(mean(significance_score over critiques), 2)
        innovation_mean   = round_half_up(mean(innovation_score over critiques), 2)
        application -> SCORED
    input_set: "assignments of the application in status CRITIQUE_SUBMITTED only; ASSIGNED/ACCEPTED/DECLINED/CANCELLED excluded"
    constants:
      MIN_CRITIQUES_TO_SCORE: 2
      MIN_LIVE_ASSIGNMENTS: 2
      PRIMARY_WEIGHT: 2
      SECONDARY_WEIGHT: 1
    precision: "impact_score integer via round_half_up; criterion means 2 decimals round_half_up"

  - name: percentile_scoring
    trigger: "release-scores, after impact scores for the section are computed"
    algorithm: aggregation
    formula: |
      RAW VARIANT (within-section):
        pool = all applications with study_section_id == this section AND status == SCORED
        sort by impact_score ASC; ties: approach_mean ASC, then significance_mean ASC,
          then innovation_mean ASC, then created_at ASC (id is never a tie-break)
        rank r is 1-based; N = pool size
        percentile_raw = round_half_up(100.0 * (r - 0.5) / N, 1)
      NORMALIZED VARIANT (cross-panel):
        pool = all applications with status == SCORED whose FOA.activity_code equals
               this application's FOA.activity_code (any study section)
        section_mean(s) = round_half_up(mean of impact_score over SCORED apps of section s, 1)
        pool_mean = round_half_up(mean of impact_score over the whole pool, 1)
        adjusted_i = impact_score_i - section_mean(section_of_i) + pool_mean
        sort by adjusted ASC; ties: impact_score ASC, then created_at ASC
        percentile_normalized = round_half_up(100.0 * (r - 0.5) / M, 1)
      The normalized variant re-runs over the ENTIRE activity-code pool on every
      release-scores, so a later-releasing section mutates earlier sections'
      percentile_normalized values (derived-field reconciliation).
    input_set: "raw: SCORED applications of this section; normalized: SCORED applications across all sections sharing the activity_code"
    constants:
      PERCENTILE_DECIMALS: 1
    precision: "1 decimal, round_half_up"
    variants:
      - name: raw
        when: "stored as percentile_raw; also the metric select-pay band checks use"
        difference: "ranks only within the application's own study section, no cross-panel adjustment"
      - name: normalized
        when: "stored as percentile_normalized; the metric payline decisions use"
        difference: "impact adjusted by (pool_mean - section_mean) before ranking across the activity-code pool; identical inputs yield different ranks whenever section means differ"

  - name: award_budget_build
    trigger: "POST /grants/applications/{id}/award (award issuance)"
    algorithm: tiered_pricing
    formula: |
      cut = jit_request.budget_cut_pct            # 0..0.30, recorded at JIT acceptance
      for year y in 1 .. requested_years:
        capped_direct_y = min(direct_cents_per_year[y], foa.max_direct_cents_per_year)
        direct_y        = round_half_up(capped_direct_y * (1 - cut))      # integer cents
        indirect_y      = round_half_up(direct_y * institute.indirect_cost_rate)
        period_total_cents[y] = direct_y + indirect_y
      EVALUATION ORDER PINNED: round each component per year BEFORE summing
      (per-year-then-sum). Sum-then-round is a different, rejected order.
      total_awarded_cents = sum(period_total_cents)
      end_date = start_date + requested_years * 365 days
      terms_and_conditions = [STANDARD_TERMS_V1] + ([RESTRICTED_DRAW_DOWN] if cut > 0)
    input_set: "the application's budget array, its FOA caps, its institute indirect rate, and the accepted JitRequest's budget_cut_pct"
    constants:
      BUDGET_CUT_MAX_PCT: 0.30
      AWARD_PERIOD_DAYS: 365
    precision: "integer cents, round_half_up per component per year"

  - name: payline_determination
    trigger: "POST /grants/institutes/{id}/payline-decisions"
    algorithm: waterfall_allocation
    formula: |
      committable = appropriation_cents - committed_cents - disbursed_cents - reserve_cents
      candidates = applications with institute_id == this institute AND status == COUNCIL_REVIEWED
      esi(c) = ESI_PAYLINE_BONUS if c.applicant.career_stage == EARLY_STAGE_INVESTIGATOR else 0
      effective_pctl(c) = max(c.percentile_normalized - esi(c), 0.1)
      eligible = candidates with effective_pctl(c) <= base_payline_percentile (request payload)
      sort eligible by effective_pctl ASC; ties: percentile_raw ASC, impact_score ASC, created_at ASC
      projected_cost(c) = sum over years of
          ( min(direct_y, foa.max_direct_cents_per_year)
          + round_half_up(min(direct_y, foa.max_direct_cents_per_year) * indirect_cost_rate) )
          # pre-JIT estimate: budget_cut_pct NOT applied here
      CIRCULARITY-BREAKING EVALUATION ORDER (pinned):
        (1) compute committable from institute fields as they stand;
        (2) sort eligible candidates as above;
        (3) walk in order, funding candidate c iff cumulative_projected + projected_cost(c) <= committable;
        (4) stop at the first candidate that would exceed committable (no skipping);
        the published percentile is NEVER re-derived from the walk outcome.
      funded applications -> JIT_PENDING with a JitRequest auto-created
        (due_date = logical clock + JIT_RESPONSE_WINDOW_DAYS)
      institute.current_payline_percentile := base_payline_percentile (the requested value)
      institute.version += 1
    input_set: "institute ledger fields, COUNCIL_REVIEWED applications of the institute, their FOAs and applicants"
    constants:
      ESI_PAYLINE_BONUS: 5.0
      JIT_RESPONSE_WINDOW_DAYS: 30
    precision: "integer cents; percentiles 1 decimal"

  - name: transfer_relinquishment
    trigger: "POST /grants/transfer-requests/{id}/relinquish"
    algorithm: dual_variant_proration
    formula: |
      if award.disbursed_cents > 0:
        variant = LEDGER_ACTUALS
        relinquished = total_awarded_cents - disbursed_cents
      else:
        variant = TIME_PRORATED
        total_days = (award.end_date - award.start_date) in whole days
        days_remaining = max((award.end_date - effective_date) in whole days, 0)
        relinquished = round_half_up(total_awarded_cents * days_remaining / total_days)
      retained = total_awarded_cents - disbursed_cents - relinquished   # returned to institute on accept
      INVARIANT (pinned): total_awarded_cents == disbursed_cents + retained + relinquished
    input_set: "the original award's ledger fields and the transfer's effective_date"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: TIME_PRORATED
        when: "no progress report has been accepted (disbursed_cents == 0)"
        difference: "straight-line proration by calendar days remaining; ignores expenditure pattern"
      - name: LEDGER_ACTUALS
        when: "at least one progress report accepted (disbursed_cents > 0)"
        difference: "undisbursed balance moves wholesale; identical totals/dates yield a different amount whenever spending deviates from straight-line"

  - name: carryover_auto_approval
    trigger: "POST /grants/awards/{id}/modifications with type CARRYOVER"
    algorithm: threshold
    formula: |
      unobligated(p) = period_total_cents[p] - disbursed_per_period_cents[p]
        (period_total_cents is reduced by prior carryovers, so carried_out_per_period_cents
         is audit-only and MUST NOT be subtracted again)
      gates (validation): from_period == current_period - 1; amount_cents <= unobligated(from_period)
        (current_period advances only on report acceptance, so from_period's report is always ACCEPTED)
      auto_limit = round_half_up(unobligated(from_period) * CARRYOVER_AUTO_APPROVE_PCT)
      if amount_cents <= auto_limit:  status = AUTO_APPROVED; effects apply immediately
      else:                           status = PENDING_APPROVAL; effects apply on adjudicate APPROVE
      effects: period_total_cents[from_period] -= amount_cents
               carried_out_per_period_cents[from_period] += amount_cents
               period_total_cents[current_period] += amount_cents
      CONSERVED QUANTITY (pinned): sum(period_total_cents) unchanged by carryover.
    input_set: "the award's per-period budget, disbursal, and carryover arrays"
    constants:
      CARRYOVER_AUTO_APPROVE_PCT: 0.25
    precision: "integer cents, round_half_up for the auto-approval limit"

  - name: reviewer_capacity_check
    trigger: "POST /grants/assignments"
    algorithm: threshold
    formula: |
      active = count of the reviewer's assignments with status IN {ASSIGNED, ACCEPTED}
      if active >= MAX_ACTIVE_ASSIGNMENTS_PER_REVIEWER: reject ERR_REVIEWER_CAPACITY_EXCEEDED
      (the 4th active assignment is allowed; the 5th is rejected — boundary is inclusive-at-limit)
    input_set: "assignments of the reviewer in ASSIGNED | ACCEPTED status"
    constants:
      MAX_ACTIVE_ASSIGNMENTS_PER_REVIEWER: 4

  - name: meeting_proximity_check
    trigger: "POST /grants/assignments"
    algorithm: interval_overlap
    formula: |
      INTERVAL SEMANTICS: closed intervals with an inclusive buffer.
      For each live assignment (ASSIGNED | ACCEPTED | CRITIQUE_SUBMITTED) of this reviewer
      to an application whose study_section S2 != the target section (same-section co-review
      is normal panel service and is EXEMPT):
        conflict iff |meeting_date(S2) - meeting_date(target section)| <= MEETING_PROXIMITY_BUFFER_DAYS * 86400 seconds
      Exactly 7 days apart IS a conflict (inclusive); 7 days + 1 second is not.
    input_set: "the reviewer's live assignments and the meeting dates of their applications' sections"
    constants:
      MEETING_PROXIMITY_BUFFER_DAYS: 7

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The supplied role must be listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template resource ids must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Body-referenced foreign-key ids must exist (foa_id, institution_id, requested_* ids, reviewer_id, application_id, to_institution_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: "creation and action endpoints carrying body FKs"

  - priority: 5
    category: auth
    check: "Entity-backed ownership: Applicant X-User-ID must equal the application's (or award's application's) applicant_id; Reviewer X-User-ID must equal the reviewer id of the target reviewer/assignment"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped endpoints (submit, withdraw, jit submit-items, progress-report create, modification create, transfer create, reviewer respond, reviewer declare-conflict, assignment respond, assignment submit-critique)"

  - priority: 6
    category: state
    check: "Target resource lifecycle state must permit the operation (application submittable/referrable/withdrawable/scored/fundable/jit-complete; section recruiting/convenable/in-meeting; reviewer invited/active; assignment respondable/accepted; jit open/submitted; award active; report submitted; modification pending; transfer proposed/relinquished)"
    error_id: "ERR_APPLICATION_NOT_SUBMITTABLE | ERR_APPLICATION_NOT_REFERRABLE | ERR_APPLICATION_NOT_WITHDRAWABLE | ERR_APPLICATION_NOT_SCORED | ERR_APPLICATION_NOT_FUNDABLE | ERR_APPLICATION_NOT_JIT_COMPLETE | ERR_FOA_NOT_OPEN | ERR_SECTION_NOT_RECRUITING | ERR_SECTION_NOT_CONVENABLE | ERR_SECTION_NOT_IN_MEETING | ERR_SECTION_NOT_RELEASABLE | ERR_REVIEWER_INVALID_STATE | ERR_REVIEWER_NOT_ACTIVE | ERR_ASSIGNMENT_INVALID_STATE | ERR_JIT_INVALID_STATE | ERR_AWARD_NOT_ACTIVE | ERR_REPORT_INVALID_STATE | ERR_MODIFICATION_NOT_PENDING | ERR_TRANSFER_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version must equal the parent entity's current version"
    error_id: "ERR_STALE_APPLICATION_VERSION | ERR_STALE_INSTITUTE_VERSION"
    http_status: 412
    applies_to: "POST /grants/applications/{id}/referral; POST /grants/institutes/{id}/payline-decisions"

  - priority: 8
    category: business_safety
    check: "Institutional certifications: human_subjects_involved requires institution human-subjects certification non-null and expiring >= foa.receipt_deadline; vertebrate_animals_involved likewise for animal-welfare assurance; transfer proposals re-check the receiving institution's certifications against the application's flags at effective_date"
    error_id: "ERR_CERTIFICATION_MISSING | ERR_CERTIFICATION_EXPIRED"
    http_status: 422
    applies_to: "POST /grants/applications/{id}/submit; POST /grants/awards/{id}/transfer-requests"

  - priority: 9
    category: business_safety
    check: "Conflict-of-interest screening: reviewer.institution_id == application.institution_id (ERR_COI_INSTITUTION_MATCH); reviewer.id in application.excluded_reviewer_ids (ERR_REVIEWER_EXCLUDED); application.id in reviewer.declared_conflicts (ERR_REVIEWER_SELF_DECLARED_CONFLICT)"
    error_id: "ERR_COI_INSTITUTION_MATCH | ERR_REVIEWER_EXCLUDED | ERR_REVIEWER_SELF_DECLARED_CONFLICT"
    http_status: 409
    applies_to: "POST /grants/assignments"

  - priority: 10
    category: business_constraint
    check: "Research strategy page limit: research_strategy_page_count <= foa.research_strategy_page_limit"
    error_id: ERR_PAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /grants/applications/{id}/submit"

  - priority: 11
    category: business_constraint
    check: "Budget structure: direct_cents_per_year length == requested_years; requested_years <= foa.max_years; every per-year direct >= foa.min_direct_cents_per_year (structure) and <= foa.max_direct_cents_per_year (cap)"
    error_id: "ERR_INVALID_BUDGET_STRUCTURE (400) | ERR_BUDGET_CAP_EXCEEDED (422)"
    http_status: 400
    applies_to: "POST /grants/applications (structure); POST /grants/applications/{id}/submit (FOA bounds)"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: pa_number unique across FOAs; one non-terminal application per (applicant, foa); no second live assignment for the same (application, reviewer); at most one live PRIMARY assignment per application; at most 3 live assignments per application"
    error_id: "ERR_DUPLICATE_PA_NUMBER | ERR_DUPLICATE_APPLICATION | ERR_DUPLICATE_ASSIGNMENT | ERR_PRIMARY_ALREADY_ASSIGNED | ERR_ASSIGNMENT_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /grants/funding-opportunities; POST /grants/applications; POST /grants/assignments"

  - priority: 13
    category: business_constraint
    check: "Quotas: section.assigned_application_count < section.application_quota at referral; reviewer active assignment count < MAX_ACTIVE_ASSIGNMENTS_PER_REVIEWER at assignment"
    error_id: "ERR_SECTION_QUOTA_EXCEEDED | ERR_REVIEWER_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /grants/applications/{id}/referral; POST /grants/assignments"

  - priority: 14
    category: business_constraint
    check: "Assignment-request honor rule: differing from a satisfiable requested_study_section_id or requested_institute_id without override_assignment_request=true is rejected; re-referral with live assignments is rejected"
    error_id: "ERR_ASSIGNMENT_REQUEST_IGNORED | ERR_LIVE_ASSIGNMENTS_EXIST"
    http_status: 409
    applies_to: "POST /grants/applications/{id}/referral"

  - priority: 15
    category: business_constraint
    check: "Select-pay band: application.percentile_raw <= institute.current_payline_percentile + institute.select_pay_extension_percentile (raw percentile, NOT normalized; no payline published yet -> ERR_NO_PAYLINE_PUBLISHED); JIT completeness: items_submitted must cover every required_items element"
    error_id: "ERR_SELECT_PAY_BAND_EXCEEDED | ERR_NO_PAYLINE_PUBLISHED | ERR_JIT_ITEM_MISSING"
    http_status: 422
    applies_to: "POST /grants/applications/{id}/select-pay; POST /grants/jit-requests/{id}/submit-items"

  - priority: 16
    category: business_temporal
    check: "Receipt deadline: logical clock <= foa.receipt_deadline at submission"
    error_id: ERR_RECEIPT_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /grants/applications/{id}/submit"

  - priority: 17
    category: business_temporal
    check: "Reviewer meeting proximity: no live assignment whose application's DIFFERENT section meets within +/- 7 days (inclusive) of the target section's meeting; same-section co-review is exempt"
    error_id: ERR_MEETING_PROXIMITY_CONFLICT
    http_status: 409
    applies_to: "POST /grants/assignments"

  - priority: 18
    category: business_temporal
    check: "Window checks: JIT operations with clock > due_date expire the request; progress report must target period == award.current_period and clock <= period_end(current_period) + 90 days; carryover from_period == current_period - 1; NCE requested while clock <= end_date with extension <= 365 days and new_end_date > end_date"
    error_id: "ERR_JIT_EXPIRED | ERR_REPORT_PERIOD_MISMATCH | ERR_REPORT_WINDOW_CLOSED | ERR_CARRYOVER_PERIOD_MISMATCH | ERR_NCE_TOO_LATE | ERR_NCE_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "JIT endpoints; progress-report create; modification create"

  - priority: 19
    category: business_fiscal
    check: "Carryover amount must not exceed the unobligated balance of from_period"
    error_id: ERR_CARRYOVER_EXCEEDS_UNOBLIGATED
    http_status: 422
    applies_to: "POST /grants/awards/{id}/modifications"

  - priority: 20
    category: business_fiscal
    check: "Select pay fiscal gates, in this order: (i) commitment headroom committed_cents + disbursed_cents + projected_cost <= appropriation_cents - reserve_cents (ERR_INSUFFICIENT_COMMITMENT_AUTHORITY); (ii) select_pay_spent_cents + projected_cost <= round_half_up(appropriation_cents * select_pay_cap_pct) (ERR_SELECT_PAY_CAP_EXCEEDED). Authority is checked before the cap."
    error_id: "ERR_INSUFFICIENT_COMMITMENT_AUTHORITY | ERR_SELECT_PAY_CAP_EXCEEDED"
    http_status: 402
    applies_to: "POST /grants/applications/{id}/select-pay"

# =============================================================================
# Response Envelope (§1.0 — FIXED, verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Clock (test-driving; outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time. to_iso8601 must be a valid ISO8601 UTC timestamp and must be >= the current logical time (monotonic non-decreasing)."
    roles: [ProgramOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; lazy time-gated evaluations observe the new clock on subsequent calls"]

  # --- FundingOpportunity ---
  - method: POST
    path: "/grants/funding-opportunities"
    description: "Create a funding opportunity announcement; starts OPEN"
    roles: [ProgramOfficer]
    code: 201
    input: [pa_number, title, activity_code, research_strategy_page_limit, min_direct_cents_per_year, max_direct_cents_per_year, max_years, open_date, receipt_deadline]
    output: FundingOpportunity
    side_effects: ["status = OPEN; ERR_DUPLICATE_PA_NUMBER if pa_number already exists"]

  - method: GET
    path: "/grants/funding-opportunities/{id}"
    description: "Get a funding opportunity"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: FundingOpportunity
    side_effects: []

  - method: POST
    path: "/grants/funding-opportunities/{id}/close"
    description: "Close an open FOA to further submissions"
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: FundingOpportunity
    side_effects: ["status OPEN -> CLOSED"]

  # --- Institute ---
  - method: POST
    path: "/grants/institutes"
    description: "Create a funding institute with its appropriation ledger configuration"
    roles: [ProgramOfficer]
    code: 201
    input: [name, appropriation_cents, reserve_cents, indirect_cost_rate, select_pay_cap_pct, select_pay_extension_percentile]
    output: Institute
    side_effects: ["committed_cents = 0; disbursed_cents = 0; select_pay_spent_cents = 0; current_payline_percentile = null"]

  - method: GET
    path: "/grants/institutes/{id}"
    description: "Get an institute (ledger fields included)"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: Institute
    side_effects: []

  - method: POST
    path: "/grants/institutes/{id}/payline-decisions"
    description: "Publish a base payline percentile; funds eligible COUNCIL_REVIEWED applications by budget walk; supersedes any prior published payline (OCC on institute version)"
    roles: [ProgramOfficer]
    code: 200
    input: [base_payline_percentile, expected_institute_version]
    output: Institute
    side_effects:
      - "calculations.payline_determination runs (budget walk, ESI-adjusted ordering)"
      - "each funded application COUNCIL_REVIEWED -> JIT_PENDING with JitRequest auto-created (ISSUED, due = clock + 30 days)"
      - "current_payline_percentile := base_payline_percentile"
      - "increments Institute.version by 1"

  # --- Institution ---
  - method: POST
    path: "/grants/institutions"
    description: "Register an institution with its certifications"
    roles: [ProgramOfficer]
    code: 201
    input: [name, "human_subjects_certification_expiry?", "animal_welfare_assurance_expiry?"]
    output: Institution
    side_effects: []

  - method: GET
    path: "/grants/institutions/{id}"
    description: "Get an institution"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: Institution
    side_effects: []

  # --- Applicant ---
  - method: POST
    path: "/grants/applicants"
    description: "Register a principal investigator"
    roles: [ProgramOfficer]
    code: 201
    input: [full_name, email, career_stage]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/grants/applicants/{id}"
    description: "Get an applicant"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/grants/applications"
    description: "Create a draft application against a FOA; applicant_id is taken from X-User-ID"
    roles: [Applicant]
    code: 201
    input: [foa_id, institution_id, title, research_strategy_page_count, direct_cents_per_year, requested_years, "human_subjects_involved?", "vertebrate_animals_involved?", "requested_study_section_id?", "requested_institute_id?", "excluded_reviewer_ids?"]
    output: Application
    side_effects:
      - "status = DRAFT; applicant_id := X-User-ID"
      - "ERR_INVALID_BUDGET_STRUCTURE when direct_cents_per_year length != requested_years"
      - "ERR_DUPLICATE_APPLICATION when the same applicant already has a non-terminal application against the same FOA"

  - method: GET
    path: "/grants/applications"
    description: "List applications with filters"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["foa_id?", "applicant_id?", "institution_id?", "requested_study_section_id?", "requested_institute_id?", "study_section_id?", "institute_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: GET
    path: "/grants/applications/{id}"
    description: "Get an application (scores, percentiles, status)"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/grants/applications/{id}/submit"
    description: "Submit a draft application; runs the full submission validation chain"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["status DRAFT -> SUBMITTED; increments Application.version by 1"]

  - method: POST
    path: "/grants/applications/{id}/withdraw"
    description: "Withdraw a non-terminal application before scoring; cascades to assignments and reviewer capacity"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "status -> WITHDRAWN (from DRAFT | SUBMITTED | REFERRED | UNDER_REVIEW only)"
      - "live assignments -> CANCELLED; reviewer active_assignment_count decremented; section assigned_application_count decremented"
      - "increments Application.version by 1"

  - method: POST
    path: "/grants/applications/{id}/referral"
    description: "Refer a submitted application to a study section and funding institute; re-referral from REFERRED supersedes (OCC on application version)"
    roles: [ReferralOfficer]
    code: 200
    input: [study_section_id, institute_id, expected_application_version, "override_assignment_request?"]
    output: Application
    side_effects:
      - "status SUBMITTED -> REFERRED (or REFERRED -> REFERRED supersede)"
      - "study_section_id / institute_id set or replaced; section counts adjusted"
      - "increments Application.version by 1"

  - method: POST
    path: "/grants/applications/{id}/select-pay"
    description: "Select a COUNCIL_REVIEWED application for pay under institute discretion (band check on percentile_raw, cap check on select_pay budget)"
    roles: [GrantsOfficer]
    code: 200
    input: ["rationale?"]
    output: Application
    side_effects:
      - "status COUNCIL_REVIEWED -> JIT_PENDING; JitRequest auto-created (ISSUED, due = clock + 30 days)"
      - "institute.select_pay_spent_cents += projected_cost (pre-JIT estimate)"

  - method: GET
    path: "/grants/applications/{id}/council-reviews"
    description: "List council reviews recorded for an application"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CouncilReview[]"
    side_effects: []

  - method: GET
    path: "/grants/applications/{id}/jit-requests"
    description: "List JIT requests for an application"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "JitRequest[]"
    side_effects: []

  # --- StudySection ---
  - method: POST
    path: "/grants/study-sections"
    description: "Create a study section (review group); starts RECRUITING"
    roles: [ScientificReviewOfficer]
    code: 201
    input: [name, meeting_date, application_quota]
    output: StudySection
    side_effects: ["status = RECRUITING; assigned_application_count = 0"]

  - method: GET
    path: "/grants/study-sections/{id}"
    description: "Get a study section"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: StudySection
    side_effects: []

  - method: POST
    path: "/grants/study-sections/{id}/convene"
    description: "Convene the review meeting (RECRUITING -> MEETING_HELD)"
    roles: [ScientificReviewOfficer]
    code: 200
    input: []
    output: StudySection
    side_effects: ["status -> MEETING_HELD; requires >= 1 UNDER_REVIEW application assigned to the section"]

  - method: POST
    path: "/grants/study-sections/{id}/release-scores"
    description: "Release scores (MEETING_HELD -> SCORES_RELEASED); computes impact scores and both percentile variants; recomputes the normalized percentile pool for the activity code"
    roles: [ScientificReviewOfficer]
    code: 200
    input: []
    output: StudySection
    side_effects:
      - "UNDER_REVIEW applications -> SCORED or UNSCORED per calculations.impact_score"
      - "calculations.percentile_scoring raw + normalized variants run; normalized re-runs for the entire activity-code pool"

  # --- Reviewer ---
  - method: POST
    path: "/grants/reviewers"
    description: "Recruit a reviewer onto the roster; starts INVITED"
    roles: [ScientificReviewOfficer]
    code: 201
    input: [full_name, institution_id, expertise_keywords]
    output: Reviewer
    side_effects: ["status = INVITED; declared_conflicts = []; active_assignment_count = 0"]

  - method: GET
    path: "/grants/reviewers"
    description: "List reviewers with filters"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["institution_id?", "status?", "limit?", "offset?"]
    output: "Reviewer[]"
    side_effects: []

  - method: GET
    path: "/grants/reviewers/{id}"
    description: "Get a reviewer"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: Reviewer
    side_effects: []

  - method: POST
    path: "/grants/reviewers/{id}/respond"
    description: "Reviewer responds to recruitment invitation (ACCEPT -> ACTIVE, DECLINE -> DECLINED)"
    roles: [Reviewer]
    code: 200
    input: [decision]
    output: Reviewer
    side_effects: ["status transition per decision; only from INVITED (ERR_REVIEWER_INVALID_STATE)"]

  - method: POST
    path: "/grants/reviewers/{id}/declare-conflict"
    description: "Reviewer self-declares a conflict of interest with an application"
    roles: [Reviewer]
    code: 200
    input: [application_id]
    output: Reviewer
    side_effects: ["application_id appended to declared_conflicts (no duplicates)"]

  # --- Assignment ---
  - method: POST
    path: "/grants/assignments"
    description: "Assign a reviewer to an application with a scoring role; runs COI, capacity, proximity, uniqueness and state gates"
    roles: [ScientificReviewOfficer]
    code: 201
    input: [application_id, reviewer_id, role]
    output: Assignment
    side_effects:
      - "status = ASSIGNED; reviewer.active_assignment_count += 1; application.live_assignment_count += 1"
      - "creating an assignment while the application is REFERRED flips it REFERRED -> UNDER_REVIEW"

  - method: GET
    path: "/grants/assignments"
    description: "List assignments with filters"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["application_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/grants/assignments/{id}"
    description: "Get an assignment (scores included once submitted)"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/grants/assignments/{id}/respond"
    description: "Reviewer accepts or declines an assignment (from ASSIGNED or ACCEPTED)"
    roles: [Reviewer]
    code: 200
    input: [decision]
    output: Assignment
    side_effects:
      - "ACCEPT: ASSIGNED -> ACCEPTED"
      - "DECLINE: -> DECLINED; reviewer.active_assignment_count -= 1; quorum cascade: application live_assignment_count -= 1 and if UNDER_REVIEW and < 2 live -> application REFERRED"

  - method: POST
    path: "/grants/assignments/{id}/submit-critique"
    description: "Reviewer submits criterion scores and overall impact (requires section MEETING_HELD)"
    roles: [Reviewer]
    code: 200
    input: [significance_score, innovation_score, approach_score, investigator_score, environment_score, overall_impact_score]
    output: Assignment
    side_effects: ["ACCEPTED -> CRITIQUE_SUBMITTED; reviewer.active_assignment_count -= 1"]

  # --- CouncilReview ---
  - method: POST
    path: "/grants/council-reviews"
    description: "Record an advisory-council second-level review for a scored application"
    roles: [CouncilMember]
    code: 201
    input: [application_id, recommendation, "priority_alignment_score?", "portfolio_balance_note?"]
    output: CouncilReview
    side_effects:
      - "FUND: application SCORED|DEFERRED -> COUNCIL_REVIEWED"
      - "DEFER: application SCORED -> DEFERRED (DEFERRED -> DEFERRED on re-deferral)"
      - "NOT_FUND: application SCORED|DEFERRED -> NOT_FUNDED"
      - "priority_alignment_score required iff recommendation == FUND (ERR_VALIDATION)"

  # --- JitRequest ---
  - method: GET
    path: "/grants/jit-requests/{id}"
    description: "Get a JIT request"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: JitRequest
    side_effects: []

  - method: POST
    path: "/grants/jit-requests/{id}/submit-items"
    description: "Applicant submits the full set of outstanding JIT items (from ISSUED or RETURNED)"
    roles: [Applicant]
    code: 200
    input: [items_submitted]
    output: JitRequest
    side_effects: ["ISSUED|RETURNED -> SUBMITTED; submitted_items := items_submitted; past due_date -> EXPIRED + ERR_JIT_EXPIRED"]

  - method: POST
    path: "/grants/jit-requests/{id}/adjudicate"
    description: "Grants officer accepts (with optional uniform budget cut) or returns a submitted JIT package"
    roles: [GrantsOfficer]
    code: 200
    input: [decision, "budget_cut_pct?", "return_reason?"]
    output: JitRequest
    side_effects:
      - "ACCEPT: SUBMITTED -> ACCEPTED; budget_cut_pct recorded (default 0, max 0.30); application -> JIT_COMPLETE"
      - "RETURN: SUBMITTED -> RETURNED"
      - "past due_date -> EXPIRED + ERR_JIT_EXPIRED"

  # --- Award ---
  - method: POST
    path: "/grants/applications/{id}/award"
    description: "Issue the award for a JIT_COMPLETE application; computes the per-year budget; charges institute commitment authority"
    roles: [GrantsOfficer]
    code: 201
    input: [start_date]
    output: Award
    side_effects:
      - "calculations.award_budget_build runs (per-year rounding then sum)"
      - "institute.committed_cents += total_awarded_cents"
      - "application JIT_COMPLETE -> AWARDED"

  - method: GET
    path: "/grants/awards"
    description: "List awards with filters"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["application_id?", "institute_id?", "institution_id?", "originating_transfer_id?", "status?", "limit?", "offset?"]
    output: "Award[]"
    side_effects: []

  - method: GET
    path: "/grants/awards/{id}"
    description: "Get an award (budget arrays, disbursal, status)"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: Award
    side_effects: []

  # --- ProgressReport ---
  - method: POST
    path: "/grants/awards/{id}/progress-reports"
    description: "Submit the progress report for the award's current budget period"
    roles: [Applicant]
    code: 201
    input: [period_year, actual_expenditure_cents, publications_count]
    output: ProgressReport
    side_effects: ["status = SUBMITTED; submitted_late computed against period end"]

  - method: GET
    path: "/grants/awards/{id}/progress-reports"
    description: "List progress reports for an award"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProgressReport[]"
    side_effects: []

  - method: POST
    path: "/grants/progress-reports/{id}/accept"
    description: "Accept a submitted progress report; disburses the period's actual expenditure and advances the current period"
    roles: [GrantsOfficer]
    code: 200
    input: []
    output: ProgressReport
    side_effects:
      - "SUBMITTED -> ACCEPTED"
      - "disbursed = min(actual_expenditure_cents, period_total_cents[current_period]); award.disbursed_cents += disbursed; award.disbursed_per_period_cents[current_period] = disbursed"
      - "institute.committed_cents -= disbursed; institute.disbursed_cents += disbursed; award.current_period += 1"

  # --- AwardModification (carryover / no-cost extension / termination) ---
  - method: POST
    path: "/grants/awards/{id}/modifications"
    description: "Request a post-award modification; Applicant for CARRYOVER | NO_COST_EXTENSION, GrantsOfficer for TERMINATION"
    roles: [Applicant, GrantsOfficer]
    code: 201
    input: [type, "amount_cents?", "from_period?", "new_end_date?", "reason?"]
    output: AwardModification
    side_effects:
      - "CARRYOVER: auto-approves iff amount_cents <= round_half_up(unobligated(from_period) * 0.25); else PENDING_APPROVAL"
      - "NO_COST_EXTENSION: auto-approves iff no prior approved NCE on this award and extension <= 365 days; else PENDING_APPROVAL"
      - "TERMINATION: auto-approves at creation; award -> TERMINATED and undisbursed commitment returns to the institute"

  - method: GET
    path: "/grants/awards/{id}/modifications"
    description: "List modifications for an award"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AwardModification[]"
    side_effects: []

  - method: POST
    path: "/grants/award-modifications/{id}/adjudicate"
    description: "Approve or deny a PENDING_APPROVAL modification"
    roles: [GrantsOfficer]
    code: 200
    input: [decision, "denial_reason?"]
    output: AwardModification
    side_effects: ["PENDING_APPROVAL -> APPROVED | DENIED; approval applies the type-specific budget/end-date effects"]

  # --- TransferRequest (change of institution) ---
  - method: POST
    path: "/grants/awards/{id}/transfer-requests"
    description: "Propose a change-of-institution transfer for an active award; re-checks receiving-institution certifications at effective_date"
    roles: [Applicant]
    code: 201
    input: [to_institution_id, effective_date]
    output: TransferRequest
    side_effects: ["status = PROPOSED; ERR_TRANSFER_ALREADY_PENDING when another non-terminal transfer exists for the award"]

  - method: GET
    path: "/grants/transfer-requests"
    description: "List transfer requests with filters"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: ["award_id?", "to_institution_id?", "status?", "limit?", "offset?"]
    output: "TransferRequest[]"
    side_effects: []

  - method: GET
    path: "/grants/transfer-requests/{id}"
    description: "Get a transfer request"
    roles: [ProgramOfficer, ReferralOfficer, ScientificReviewOfficer, CouncilMember, GrantsOfficer, Applicant, Reviewer]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  - method: POST
    path: "/grants/transfer-requests/{id}/relinquish"
    description: "Relinquish the award from the current institution; computes the relinquished amount via the applicable proration variant"
    roles: [GrantsOfficer]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["PROPOSED -> RELINQUISHED; calculations.transfer_relinquishment runs (proration_variant + relinquished_amount_cents set)"]

  - method: POST
    path: "/grants/transfer-requests/{id}/decide"
    description: "Accept (creates the successor award cascade) or decline a relinquished transfer"
    roles: [GrantsOfficer]
    code: 200
    input: [decision, "decline_reason?"]
    output: TransferRequest
    side_effects:
      - "ACCEPT: RELINQUISHED -> ACCEPTED; original award -> TRANSFERRED; successor Award created at to_institution with the relinquished amount; institute commitment adjusted"
      - "DECLINE: RELINQUISHED -> DECLINED; no fiscal movement"

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Supplied role is not in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed role acts on a resource owned by a different entity (application.applicant_id or assignment.reviewer_id mismatch)" }
  - { id: ERR_MODIFICATION_TYPE_ROLE_MISMATCH, http: 403, condition: "Applicant may create only CARRYOVER | NO_COST_EXTENSION modifications; GrantsOfficer may create only TERMINATION" }

  # --- Not found ---
  - { id: ERR_FOA_NOT_FOUND, http: 404, condition: "Funding opportunity id does not exist" }
  - { id: ERR_INSTITUTE_NOT_FOUND, http: 404, condition: "Institute id does not exist" }
  - { id: ERR_INSTITUTION_NOT_FOUND, http: 404, condition: "Institution id does not exist" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Applicant id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_STUDY_SECTION_NOT_FOUND, http: 404, condition: "Study section id does not exist" }
  - { id: ERR_REVIEWER_NOT_FOUND, http: 404, condition: "Reviewer id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Assignment id does not exist" }
  - { id: ERR_JIT_REQUEST_NOT_FOUND, http: 404, condition: "JIT request id does not exist" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "Award id does not exist" }
  - { id: ERR_PROGRESS_REPORT_NOT_FOUND, http: 404, condition: "Progress report id does not exist" }
  - { id: ERR_MODIFICATION_NOT_FOUND, http: 404, condition: "Award modification id does not exist" }
  - { id: ERR_TRANSFER_REQUEST_NOT_FOUND, http: 404, condition: "Transfer request id does not exist" }

  # --- Malformed input ---
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, wrong type, enum value outside the declared set, score outside 1..9, budget_cut_pct outside 0..0.30, new_end_date not after current end_date, or start/effective date before the logical clock" }
  - { id: ERR_INVALID_BUDGET_STRUCTURE, http: 400, condition: "direct_cents_per_year length != requested_years, requested_years > foa.max_years, or a per-year direct below foa.min_direct_cents_per_year" }
  - { id: ERR_INVALID_CLOCK_VALUE, http: 400, condition: "to_iso8601 malformed or earlier than the current logical clock (monotonic non-decreasing)" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit outside 1..100 or offset negative" }

  # --- State gates (409) ---
  - { id: ERR_FOA_NOT_OPEN, http: 409, condition: "Submission requires the FOA to be OPEN; closing an already-CLOSED FOA is also rejected" }
  - { id: ERR_APPLICATION_NOT_SUBMITTABLE, http: 409, condition: "submit requires the application to be DRAFT" }
  - { id: ERR_APPLICATION_NOT_REFERRABLE, http: 409, condition: "referral requires the application to be SUBMITTED or REFERRED" }
  - { id: ERR_APPLICATION_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires DRAFT | SUBMITTED | REFERRED | UNDER_REVIEW" }
  - { id: ERR_APPLICATION_NOT_SCORED, http: 409, condition: "council review requires the application to be SCORED or DEFERRED" }
  - { id: ERR_APPLICATION_NOT_FUNDABLE, http: 409, condition: "select-pay requires the application to be COUNCIL_REVIEWED" }
  - { id: ERR_APPLICATION_NOT_JIT_COMPLETE, http: 409, condition: "award issuance requires the application to be JIT_COMPLETE" }
  - { id: ERR_SECTION_NOT_RECRUITING, http: 409, condition: "Referral or assignment requires the study section to be RECRUITING" }
  - { id: ERR_SECTION_NOT_CONVENABLE, http: 409, condition: "convene requires RECRUITING with at least one UNDER_REVIEW application assigned" }
  - { id: ERR_SECTION_NOT_IN_MEETING, http: 409, condition: "critique submission requires the application's study section to be MEETING_HELD" }
  - { id: ERR_SECTION_NOT_RELEASABLE, http: 409, condition: "release-scores requires the section to be MEETING_HELD" }
  - { id: ERR_REVIEWER_INVALID_STATE, http: 409, condition: "respond requires the reviewer to be INVITED" }
  - { id: ERR_REVIEWER_NOT_ACTIVE, http: 409, condition: "assignment requires the reviewer to be ACTIVE" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "respond requires ASSIGNED | ACCEPTED; submit-critique requires ACCEPTED" }
  - { id: ERR_JIT_INVALID_STATE, http: 409, condition: "submit-items requires ISSUED | RETURNED; adjudicate requires SUBMITTED" }
  - { id: ERR_JIT_EXPIRED, http: 409, condition: "Any JIT operation attempted with the logical clock past due_date; the request transitions to EXPIRED and the application to NOT_FUNDED" }
  - { id: ERR_AWARD_NOT_ACTIVE, http: 409, condition: "progress reports, modifications, and transfers require the award to be ACTIVE" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "accept requires the progress report to be SUBMITTED" }
  - { id: ERR_MODIFICATION_NOT_PENDING, http: 409, condition: "adjudicate requires the modification to be PENDING_APPROVAL" }
  - { id: ERR_TRANSFER_ALREADY_PENDING, http: 409, condition: "A non-terminal transfer request already exists for this award" }
  - { id: ERR_TRANSFER_INVALID_STATE, http: 409, condition: "relinquish requires PROPOSED; decide requires RELINQUISHED" }
  - { id: ERR_NO_PAYLINE_PUBLISHED, http: 409, condition: "select-pay requires the institute to have a published current_payline_percentile" }

  # --- Uniqueness & quotas (409) ---
  - { id: ERR_DUPLICATE_PA_NUMBER, http: 409, condition: "A funding opportunity with this pa_number already exists" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "The applicant already has a non-terminal application against this FOA" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "A live assignment for this (application, reviewer) pair already exists" }
  - { id: ERR_PRIMARY_ALREADY_ASSIGNED, http: 409, condition: "A live PRIMARY assignment already exists for this application" }
  - { id: ERR_ASSIGNMENT_LIMIT_REACHED, http: 409, condition: "The application already has 3 live assignments" }
  - { id: ERR_SECTION_QUOTA_EXCEEDED, http: 409, condition: "Referral would exceed the study section's application_quota" }
  - { id: ERR_REVIEWER_CAPACITY_EXCEEDED, http: 409, condition: "The reviewer already holds 4 active (ASSIGNED | ACCEPTED) assignments" }
  - { id: ERR_LIVE_ASSIGNMENTS_EXIST, http: 409, condition: "Re-referral to a different section requires live_assignment_count == 0" }

  # --- Compliance / COI ---
  - { id: ERR_CERTIFICATION_MISSING, http: 422, condition: "Required human-subjects certification or animal-welfare assurance is absent on the institution" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 422, condition: "Required certification expires before the FOA receipt deadline (submission) or before the transfer effective_date" }
  - { id: ERR_COI_INSTITUTION_MATCH, http: 409, condition: "Reviewer's institution matches the applicant institution" }
  - { id: ERR_REVIEWER_EXCLUDED, http: 409, condition: "Reviewer is on the application's excluded_reviewer_ids list" }
  - { id: ERR_REVIEWER_SELF_DECLARED_CONFLICT, http: 409, condition: "Reviewer has self-declared a conflict with this application" }
  - { id: ERR_ASSIGNMENT_REQUEST_IGNORED, http: 409, condition: "Referral overrides a satisfiable applicant-requested study section or institute without override_assignment_request=true" }

  # --- Temporal ---
  - { id: ERR_RECEIPT_DEADLINE_PASSED, http: 409, condition: "Logical clock is past the FOA receipt_deadline at submission" }
  - { id: ERR_MEETING_PROXIMITY_CONFLICT, http: 409, condition: "Reviewer holds a live assignment to a section whose meeting is within +/- 7 days (inclusive) of the target section's meeting" }
  - { id: ERR_REPORT_PERIOD_MISMATCH, http: 409, condition: "period_year != award.current_period" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 409, condition: "Logical clock is past period end + 90 days for the current period" }
  - { id: ERR_CARRYOVER_PERIOD_MISMATCH, http: 409, condition: "Carryover from_period != award.current_period - 1" }
  - { id: ERR_NCE_TOO_LATE, http: 409, condition: "No-cost extension requested after the award end_date" }
  - { id: ERR_NCE_LIMIT_EXCEEDED, http: 409, condition: "Requested extension exceeds 365 days beyond the current end_date" }

  # --- Fiscal ---
  - { id: ERR_PAGE_LIMIT_EXCEEDED, http: 422, condition: "research_strategy_page_count exceeds the FOA page limit" }
  - { id: ERR_BUDGET_CAP_EXCEEDED, http: 422, condition: "A per-year requested direct cost exceeds foa.max_direct_cents_per_year" }
  - { id: ERR_CARRYOVER_EXCEEDS_UNOBLIGATED, http: 422, condition: "Carryover amount exceeds the unobligated balance of from_period" }
  - { id: ERR_JIT_ITEM_MISSING, http: 422, condition: "items_submitted does not cover every element of required_items" }
  - { id: ERR_SELECT_PAY_BAND_EXCEEDED, http: 422, condition: "application.percentile_raw is beyond current_payline_percentile + select_pay_extension_percentile" }
  - { id: ERR_INSUFFICIENT_COMMITMENT_AUTHORITY, http: 402, condition: "Select pay would drive committed_cents + disbursed_cents + projected_cost above appropriation_cents - reserve_cents (checked before the select-pay cap)" }
  - { id: ERR_SELECT_PAY_CAP_EXCEEDED, http: 402, condition: "Select pay would drive select_pay_spent_cents above round_half_up(appropriation_cents * select_pay_cap_pct)" }

  # --- OCC ---
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match the application's current version" }
  - { id: ERR_STALE_INSTITUTE_VERSION, http: 412, condition: "expected_institute_version does not match the institute's current version" }

# =============================================================================
# Table 7: RBAC Permission Matrix (§1.7)
# =============================================================================
roles:
  - name: ProgramOfficer
    description: "Program official; configures funding opportunities, institutes, institutions, applicants; publishes paylines; operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /grants/funding-opportunities"
      - "POST /grants/funding-opportunities/{id}/close"
      - "POST /grants/institutes"
      - "POST /grants/institutes/{id}/payline-decisions"
      - "POST /grants/institutions"
      - "POST /grants/applicants"
      - "POST /_clock/set_current_utc"
    shared_operations: ["GET endpoints (all)"]

  - name: ReferralOfficer
    description: "Referral officer; assigns submitted applications to study sections and funding institutes"
    identity: opaque
    exclusive_operations:
      - "POST /grants/applications/{id}/referral"
    shared_operations: ["GET endpoints (all)"]

  - name: ScientificReviewOfficer
    description: "SRO; runs study sections, recruits reviewers, creates assignments, convenes meetings, releases scores"
    identity: opaque
    exclusive_operations:
      - "POST /grants/study-sections"
      - "POST /grants/study-sections/{id}/convene"
      - "POST /grants/study-sections/{id}/release-scores"
      - "POST /grants/reviewers"
      - "POST /grants/assignments"
    shared_operations: ["GET endpoints (all)"]

  - name: Reviewer
    description: "Panel reviewer; responds to recruitment, declares conflicts, responds to assignments, submits critiques"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /grants/reviewers/{id}/respond (self only)"
      - "POST /grants/reviewers/{id}/declare-conflict (self only)"
      - "POST /grants/assignments/{id}/respond (own assignments only)"
      - "POST /grants/assignments/{id}/submit-critique (own assignments only)"
    shared_operations: ["GET endpoints (all)"]

  - name: CouncilMember
    description: "Advisory council member; records second-level reviews with program-priority alignment and portfolio balance"
    identity: opaque
    exclusive_operations:
      - "POST /grants/council-reviews"
    shared_operations: ["GET endpoints (all)"]

  - name: GrantsOfficer
    description: "Grants management officer; select pay, JIT adjudication, award issuance, report acceptance, modification adjudication, terminations, transfer relinquish/decide"
    identity: opaque
    exclusive_operations:
      - "POST /grants/applications/{id}/select-pay"
      - "POST /grants/jit-requests/{id}/adjudicate"
      - "POST /grants/applications/{id}/award"
      - "POST /grants/progress-reports/{id}/accept"
      - "POST /grants/award-modifications/{id}/adjudicate"
      - "POST /grants/transfer-requests/{id}/relinquish"
      - "POST /grants/transfer-requests/{id}/decide"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /grants/awards/{id}/modifications (type TERMINATION only)"

  - name: Applicant
    description: "Principal investigator; drafts/submits/withdraws own applications, answers JIT, files progress reports, requests carryovers/extensions, proposes transfers"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /grants/applications"
      - "POST /grants/applications/{id}/submit (own applications only)"
      - "POST /grants/applications/{id}/withdraw (own applications only)"
      - "POST /grants/jit-requests/{id}/submit-items (own application's JIT only)"
      - "POST /grants/awards/{id}/progress-reports (own award only)"
      - "POST /grants/awards/{id}/transfer-requests (own award only)"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /grants/awards/{id}/modifications (types CARRYOVER | NO_COST_EXTENSION only, own award only)"
