  - rule_id: cross_entity_state_dependency
    instances:
      - name: image_bill_resolve_gated_by_plate_data_agreement
        grounds:
          - state_machines.ImageBill.PENDING_LOOKUP_to_BILLED
          - entities.PlateDataAgreement
          - errors.ERR_PLATE_LOOKUP_NOT_AVAILABLE
        distinguishing_aspect: |
          Entity pair ImageBill x PlateDataAgreement: the resolve transition
          is valid only while an ACTIVE agreement covers the plate state at
          the current logical clock; revoking the agreement between bill
          creation and resolve makes the SAME call fail.
        test_recipe:
          setup:
            - "Agencies AWAY/HOME; AWAY schedule P1 CLASS_2 base 800; agreement AWAY<-HOME covering NY ACTIVE from 2026-09-01."
            - "Two image bills created for NY plates (B-ok, B-blocked)."
            - "Agreement revoked after the first resolve but before the second."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
