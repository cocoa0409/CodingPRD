        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without X-User-Role/X-User-ID headers is rejected ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 3 }, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "no X-User-Role / X-User-ID headers were sent"

