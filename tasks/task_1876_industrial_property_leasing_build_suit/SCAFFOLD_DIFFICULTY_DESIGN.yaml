  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_draft_loi_with_ner_below_floor
        grounds:
          - validations[priority=8]
          - validations[priority=25]
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: the LOI is in DRAFT (ERR_INVALID_STATE eligible) AND
          its NER 5.69 is below the floor 7.20 for asking 12.00 (ERR_NER_BELOW_FLOOR
          eligible). Priority 8 beats priority 25, so the response must be ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "SITE_HI asking 12.00 toured and LOI created but never submitted (stays DRAFT); NER at 8.00 rate == 5.69 < 7.20 floor"
