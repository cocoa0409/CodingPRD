        grounds: [state_machines.Advance.DEFAULTED_to_WRITTEN_OFF, "errors[ERR_PERIOD_NOT_DISBURSED]"]
        distinguishing_aspect: "write-off requires the period to be DISBURSED; on a still-LOCKED period (advance not yet DEFAULTED) the from-state check ERR_INVALID_STATE fires first, but on a DEFAULTED-in-reopened scenario the period-not-disbursed guard is exercised — here we assert the simpler ERR_INVALID_STATE since the advance is DISBURSED not DEFAULTED."
        excluded_because:
          difficulty_instance: compensating_invariant / exposure_conserved_across_default_and_writeoff
          rationale: "The valid write-off path on a DISBURSED period is exercised by the named §1.8 instance; the period-not-disbursed precondition is unreachable without first defaulting, which only happens at run-payday (which disburses the period)."

