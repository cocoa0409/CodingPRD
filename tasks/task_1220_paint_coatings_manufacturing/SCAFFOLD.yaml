    roles: [LabTechnician, QCInspector]
    code: 201
    input: [batch_id, measured_delta_e]
    output: ColorMatch
    side_effects: ["cycle_index and threshold_delta_e snapshotted; measured_by_user_id recorded; status = PENDING"]
  - method: GET
    path: "/coatings/color-matches/{id}"
    description: "Get a color match record"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: ColorMatch
    side_effects: []
  - method: GET
    path: "/coatings/color-matches"
    description: "List color match records, optionally by batch"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: ["batch_id?"]
    output: ColorMatch[]
    side_effects: []
  - method: POST
    path: "/coatings/color-matches/{id}/approve"
    description: "Approve a color match (segregated from measurer; mints retain sample)"
    roles: [QCInspector]
    code: 200
    input: []
    output: ColorMatch
    side_effects: ["status -> APPROVED; retain_sample_id and retain_until set; batch QC_PENDING -> QC_APPROVED"]
  - method: POST
    path: "/coatings/color-matches/{id}/reject"
    description: "Reject a color match (drives batch rework or condemnation)"
    roles: [QCInspector]
    code: 200
    input: []
    output: ColorMatch
    side_effects: ["status -> REJECTED; batch -> REWORK (rework_count += 1) or -> DISPOSAL_PENDING at rework cap; order -> BLOCKED"]

  # --- Container ---
  - method: GET
    path: "/coatings/containers/{id}"
    description: "Get a container"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: Container
    side_effects: []
  - method: GET
    path: "/coatings/containers"
    description: "List containers with optional filters"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: ["batch_id?", "order_id?", "disposal_request_id?", "status?"]
    output: Container[]
    side_effects: []
  - method: POST
    path: "/coatings/containers/{id}/reweigh"
    description: "Reweigh a QUARANTINED container (pass -> IN_STOCK; mark_rejected -> REJECTED)"
    roles: [QCInspector]
    code: 200
    input: [actual_fill_g, "mark_rejected?"]
    output: Container
    side_effects: ["weights recomputed; batch.filled_net_kg reconciled"]
  - method: POST
    path: "/coatings/containers/{id}/ship"
    description: "Ship an IN_STOCK container against an order (VOC compliance gate)"
    roles: [ProductionOperator]
    code: 200
    input: [order_id]
    output: Container
    side_effects: ["status -> SHIPPED; order_id/destination/shipped_at set; order may bubble to FULFILLED"]
  - method: POST
    path: "/coatings/containers/{id}/mark-freeze-exposure"
    description: "Record a freeze-exposure event on an IN_STOCK, SHIPPED, or RETURNED container"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Container
    side_effects: ["freeze_exposure_count += 1"]
  - method: POST
    path: "/coatings/containers/{id}/customer-return"
    description: "Receive a shipped container back as returned goods (SHIPPED -> RETURNED)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Container
    side_effects: ["status -> RETURNED"]

  # --- SalesOrder ---
  - method: POST
    path: "/coatings/orders"
    description: "Place an order (rush orders fork into RUSH_REVIEW); pricing computed per pinned order"
    roles: [Dealer]
    code: 201
    input: [customer_id, destination_state_code, rush_flag, lines]
    output: SalesOrder
    side_effects: ["subtotal/setup/total computed (rush_fee = 0 until approval); status = PLACED or RUSH_REVIEW"]
  - method: GET
    path: "/coatings/orders/{id}"
    description: "Get an order"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: GET
    path: "/coatings/orders"
    description: "List orders with optional filters"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: ["customer_id?", "status?"]
    output: SalesOrder[]
    side_effects: []
  - method: POST
    path: "/coatings/orders/{id}/rush-approve"
    description: "Approve rush service (daily capacity 3; applies rush fee)"
    roles: [PlantManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status RUSH_REVIEW -> PLACED; rush_fee_cents and total_cents computed; rush_approved_date stamped"]
  - method: POST
    path: "/coatings/orders/{id}/rush-reject"
    description: "Reject rush service (order continues standard without fee)"
    roles: [PlantManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status RUSH_REVIEW -> PLACED; rush_flag = false"]
  - method: POST
    path: "/coatings/orders/{id}/schedule"
    description: "Schedule an order against its PLANNED batch (PLACED -> SCHEDULED)"
    roles: [ProductionOperator]
    code: 200
    input: [batch_id]
    output: SalesOrder
    side_effects: ["status -> SCHEDULED"]
  - method: POST
    path: "/coatings/orders/{id}/cancel"
    description: "Cancel an order before production (Dealer: own orders only)"
    roles: [Dealer, PlantManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> CANCELLED"]

  # --- CreditClaim ---
  - method: POST
    path: "/coatings/credit-claims"
    description: "Submit a freeze-damage or shelf-life credit claim (Dealer: own customer only)"
    roles: [Dealer]
    code: 201
    input: [customer_id, container_id, claim_type, invoice_value_cents, "claimed_exposure_count?"]
    output: CreditClaim
    side_effects: ["remaining_days_at_claim and provisional_credit_cents computed; status = SUBMITTED"]
  - method: GET
    path: "/coatings/credit-claims/{id}"
    description: "Get a credit claim"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: CreditClaim
    side_effects: []
  - method: GET
    path: "/coatings/credit-claims"
    description: "List credit claims with optional filters"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: ["customer_id?", "container_id?"]
    output: CreditClaim[]
    side_effects: []
  - method: POST
    path: "/coatings/credit-claims/{id}/review"
    description: "Verify claim evidence (copies container freeze count; SUBMITTED -> UNDER_REVIEW)"
    roles: [RegulatoryClerk]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["verified_exposure_count = container.freeze_exposure_count; status -> UNDER_REVIEW"]
  - method: POST
    path: "/coatings/credit-claims/{id}/approve"
    description: "Approve a claim (computes final credit; annual cap enforced)"
    roles: [PlantManager]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["final_credit_cents computed; approved_by_user_id set; status -> APPROVED"]
  - method: POST
    path: "/coatings/credit-claims/{id}/reject"
    description: "Reject a claim from SUBMITTED or UNDER_REVIEW"
    roles: [PlantManager]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/coatings/credit-claims/{id}/settle"
    description: "Post an approved claim to the customer's credit balance (segregated from approver)"
    roles: [PlantManager]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["customer.credit_balance_cents += final_credit_cents; credit_used_ytd_cents += final; status -> SETTLED"]
  - method: POST
    path: "/coatings/credit-claims/{id}/void"
    description: "Void a settled claim (compensating reversal of the credit ledger)"
    roles: [PlantManager]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["customer.credit_balance_cents -= final_credit_cents; credit_used_ytd_cents -= final; status -> VOIDED"]

  # --- DisposalRequest ---
  - method: POST
    path: "/coatings/disposal-requests"
    description: "Request disposal of obsolete/returned/rejected containers and condemned batches"
    roles: [RegulatoryClerk]
    code: 201
    input: [reason, container_ids, "batch_ids?"]
    output: DisposalRequest
    side_effects:
      - "containers (OBSOLETE|RETURNED|REJECTED) -> DISPOSAL_PENDING with pre_disposal_status stored"
      - "batches must be DISPOSAL_PENDING"
      - "hazmat_class and expected_destroyed_kg computed"
  - method: GET
    path: "/coatings/disposal-requests/{id}"
    description: "Get a disposal request"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: DisposalRequest
    side_effects: []
  - method: POST
    path: "/coatings/disposal-requests/{id}/manifest"
    description: "Attach the hazmat manifest (REQUESTED -> MANIFESTED)"
    roles: [RegulatoryClerk]
    code: 200
    input: [manifest_no]
    output: DisposalRequest
    side_effects: ["status -> MANIFESTED"]
  - method: POST
    path: "/coatings/disposal-requests/{id}/complete"
    description: "Certify destruction (quantity reconciliation; NON_HAZARDOUS may skip manifest)"
    roles: [PlantManager]
    code: 200
    input: [actual_destroyed_kg]
    output: DisposalRequest
    side_effects: ["containers and batches -> DISPOSED; disposal_cost computed"]
  - method: POST
    path: "/coatings/disposal-requests/{id}/cancel"
    description: "Cancel a REQUESTED disposal (containers restored to pre-disposal status)"
    roles: [RegulatoryClerk]
    code: 200
    input: []
    output: DisposalRequest
    side_effects: ["containers restore pre_disposal_status; status -> CANCELLED"]

  # --- Operations / test-driving ---
  - method: POST
    path: "/coatings/ops/run-daily-sweep"
    description: "Daily operations checkpoint: IN_STOCK containers at/past expiry_date -> OBSOLETE; APPROVED color matches past retain_until -> retain purged"
    roles: [PlantManager]
    code: 200
    input: []
    output: "{ obsolete_container_ids: string[], purged_retain_sample_ids: string[] }"
    side_effects: ["lifecycle_dates sweep applied"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Default before any call is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; all date-sensitive rules evaluate against it"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or Dealer acting on another customer's resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum, empty lines/container_ids, window end <= start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_formula_version does not match the predecessor formula's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state forbids the operation (wrong phase, terminal, stale cycle, IN_PRODUCTION cancel, HAZARDOUS complete without manifest, adjustment in wrong phase)" }
  - { id: ERR_FORMULA_NOT_ACTIVE, http: 422, condition: "Referenced formula is not ACTIVE (batch creation, order lines, resume)" }
  - { id: ERR_ORDER_BATCH_MISMATCH, http: 422, condition: "Scheduled batch's order_id does not equal the order's id" }
  - { id: ERR_CONTAINER_NOT_CREDITABLE, http: 422, condition: "Claim container is not SHIPPED, or was not shipped to the claiming customer" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Claim submitted more than 30 days after container shipment" }
  - { id: ERR_VOC_RULE_MISSING, http: 422, condition: "No ACTIVE VocRule covers (category, destination state or '*', ship date)" }
  - { id: ERR_VOC_LIMIT_EXCEEDED, http: 422, condition: "Batch voc_actual_gpl exceeds the resolved limit for the shipment" }
  - { id: ERR_VOC_RULE_OVERLAP, http: 409, condition: "Activating rule's half-open window intersects an ACTIVE rule with the same (category, state_code)" }
  - { id: ERR_MILL_NOT_AVAILABLE, http: 409, condition: "Mill is in MAINTENANCE (batch start-mill / rework)" }
  - { id: ERR_MILL_BUSY, http: 409, condition: "Mill has in-flight batches; cannot enter maintenance" }
  - { id: ERR_MILL_CAPACITY_EXCEEDED, http: 422, condition: "planned_gallons exceeds mill capacity_gallons" }
  - { id: ERR_MILL_WINDOW_CONFLICT, http: 409, condition: "Mill reservation window violates overlap / washdown-buffer rules" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "base_code / colorant_code / mill_code duplicated, formula_code duplicated among non-DEPRECATED, or manifest_no duplicated among non-CANCELLED requests" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 422, condition: "Approver is the same user who entered the measurement, or settler is the claim's approver" }
  - { id: ERR_DELTA_E_EXCEEDED, http: 422, condition: "measured_delta_e exceeds the pinned threshold_delta_e on approval" }
  - { id: ERR_RETAIN_SAMPLE_MISSING, http: 422, condition: "Batch close attempted without a live (unpurged) retain sample from an approved match of the final cycle" }
  - { id: ERR_FILL_RECONCILIATION_FAILED, http: 422, condition: "Filled mass + waste deviates from batch drawdown by more than 0.5%" }
  - { id: ERR_RUSH_CAPACITY_EXCEEDED, http: 422, condition: "RUSH_DAILY_LIMIT (3) approvals already granted on the current UTC date" }
  - { id: ERR_CUSTOM_MINIMUM_NOT_MET, http: 422, condition: "Custom-formula line or batch below the custom minimum gallons (50; 100 for rush orders)" }
  - { id: ERR_CREDIT_CAP_EXCEEDED, http: 422, condition: "Final credit would push the customer past annual_credit_cap_cents" }
  - { id: ERR_DISPOSAL_QUANTITY_MISMATCH, http: 422, condition: "actual_destroyed_kg deviates from expected_destroyed_kg by more than 2%" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant leadership: mills, rush approvals, claim approval/settlement/void, disposal completion, clock and sweep"
    identity: opaque
    exclusive_operations:
      - "POST /coatings/customers"
      - "POST /coatings/mills, /enter-maintenance, /return-to-service"
      - "POST /coatings/orders/{id}/rush-approve, /rush-reject"
      - "POST /coatings/credit-claims/{id}/approve, /reject, /settle, /void"
      - "POST /coatings/disposal-requests/{id}/complete"
      - "POST /coatings/ops/run-daily-sweep, POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints", "POST /coatings/orders/{id}/cancel"]
  - name: LabTechnician
    description: "Color lab: tint bases, colorants, formula library, measurement entry"
    identity: opaque
    exclusive_operations:
      - "POST /coatings/tint-bases, /coatings/colorants"
      - "POST /coatings/formulas, /supersede, /activate, /deprecate"
    shared_operations: ["all GET endpoints", "POST /coatings/color-matches (shared with QCInspector)"]
  - name: ProductionOperator
    description: "Floor operator: batch lifecycle, adjustments, filling, shipping, returns, order scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /coatings/batches and all /coatings/batches/{id}/* actions"
      - "POST /coatings/containers/{id}/ship, /mark-freeze-exposure, /customer-return"
      - "POST /coatings/orders/{id}/schedule"
    shared_operations: ["all GET endpoints"]
  - name: QCInspector
    description: "Quality control: color match verdicts and reweighs; segregated from the measuring user and from filling"
    identity: opaque
    exclusive_operations:
      - "POST /coatings/color-matches/{id}/approve, /reject"
      - "POST /coatings/containers/{id}/reweigh"
    shared_operations: ["all GET endpoints", "POST /coatings/color-matches (shared with LabTechnician)"]
  - name: RegulatoryClerk
    description: "Compliance desk: VOC rules, claim evidence review, disposal requests and manifests"
    identity: opaque
    exclusive_operations:
      - "POST /coatings/voc-rules, /activate, /retire"
      - "POST /coatings/credit-claims/{id}/review"
      - "POST /coatings/disposal-requests, /manifest, /cancel"
    shared_operations: ["all GET endpoints"]
  - name: Dealer
    description: "External dealer account; places orders and credit claims for its own customer record only"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /coatings/orders"
      - "POST /coatings/credit-claims"
    shared_operations: ["all GET endpoints (own customer_id scoped)", "POST /coatings/orders/{id}/cancel (own orders only)"]
