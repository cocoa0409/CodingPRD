        excluded_because:
          difficulty_instance: cross_entity_state_dependency / unwind_opening_gated_on_the_qei_compliance_year_counter_reaching_seven
          rationale: "That instance already refuses the unwind at compliance_years_completed 6 with this exact error and then succeeds at 7, including the pricing snapshot."

