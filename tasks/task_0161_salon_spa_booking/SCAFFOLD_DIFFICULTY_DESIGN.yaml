              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Wash", duration_minutes: 30, base_price_cents: 6000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Voidee", email: "void@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T14:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt}", tip_cents: 0 }
              as: FrontDesk
              captures: { co: $.data.id }
          trigger:
            - call: "POST /checkouts/${co}/void"
              payload: {}
              as: SalonOwner
          assert:
            - "Checkout.${co}.status == VOIDED"
            - "Appointment.${appt}.status == NO_SHOW"
            - "Client.${cli}.no_show_strikes == 1"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: type_mismatch_beats_double_booked
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_RESOURCE_TYPE_MISMATCH]
          - errors[ERR_STYLIST_DOUBLE_BOOKED]
        distinguishing_aspect: |
          business_referential (priority 5, ERR_RESOURCE_TYPE_MISMATCH) vs business_temporal (priority 9,
          ERR_STYLIST_DOUBLE_BOOKED): a single booking request both names a CHAIR for a ROOM-only service AND
          collides with the stylist's existing appointment; the lower-priority-number referential error wins.
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, one CHAIR, one ROOM-required service (requires_room true)."
            - "An existing appointment on that stylist+room at 13:00. A second booking at 13:00 names the CHAIR (type mismatch) AND the same stylist (double-booked)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Conflict Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Room A", resource_type: "ROOM" }
              as: SalonOwner
              captures: { room: $.data.id }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chair: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Massage", duration_minutes: 60, base_price_cents: 7000, deposit_pct: 0.0, requires_room: true }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "c1@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${room}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt1: $.data.id, st1_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chair}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_RESOURCE_TYPE_MISMATCH"

      - name: booking_in_past_beats_resource_inactive
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_BOOKING_IN_PAST]
          - errors[ERR_RESOURCE_INACTIVE]
        distinguishing_aspect: |
          business_temporal (priority 7, ERR_BOOKING_IN_PAST) vs business_constraint (priority 8,
          ERR_RESOURCE_INACTIVE) — a different category pair than the first instance. A booking with a past
          start_utc AND an INACTIVE stylist returns the temporal error because priority 7 < 8.
        test_recipe:
          setup:
            - "Salon, an INACTIVE stylist, an ACTIVE chair, Service base 5000 deposit 0, a client."
            - "Clock at 2026-07-01T12:00:00Z. Booking requests start_utc 2026-07-01T11:00:00Z (past) on the INACTIVE stylist."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "PastInactive Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "Inactive S", compensation_model: "COMMISSION", commission_pct: 0.40, status: "INACTIVE", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "c1b@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T11:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_BOOKING_IN_PAST"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: resource_back_to_back_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.Appointment.fields.end_utc
          - errors[ERR_RESOURCE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          On the Resource half-open occupancy metric via POST /appointments: an appointment ending exactly at
          13:30 and a second starting exactly at 13:30 on the SAME chair do NOT overlap ([13:00,13:30) and
          [13:30,14:00) share only the open boundary) — adjacency at the exact end==start instant is allowed,
          so the second booking succeeds (201), whereas 13:29 would collide.
        test_recipe:
          setup:
            - "Salon, stylist buffer 0 (so resource overlap is the binding check), one chair, Service duration 30 base 5000 deposit 0, a client."
            - "First appointment [13:00,13:30) booked. Clock at 12:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Adjacency Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "adj@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt1: $.data.id, st1_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:30:00Z", expected_stylist_version: "${st1_v1}" }
              as: FrontDesk
              captures: { appt2: $.data.id }
          assert:
            - "response.status == 201"
            - "Appointment.${appt2}.status == BOOKED"

      - name: third_strike_at_threshold_suspends
        grounds:
          - validations[priority=6]
          - entities.Client.fields.no_show_strikes
          - entities.Salon.fields.no_show_suspend_threshold
          - state_machines.Appointment.BOOKED_to_NO_SHOW
        distinguishing_aspect: |
          On the no_show_strikes count metric via POST /appointments/{id}/no-show, the suspend fires at exactly
          strikes >= threshold (>=, not >): with threshold 3, the client is NOT suspended at 2 strikes but IS
          suspended the instant strikes reaches 3. A different metric/endpoint than the resource-adjacency boundary.
        test_recipe:
          setup:
            - "Salon suspend threshold 3 no_show_fee_pct 0.0, one stylist buffer 0, one chair, Service base 5000 deposit 0."
            - "Client booked into three appointments at 13:00/14:00/15:00; clock advanced past all three."
            - "First two no-shows applied in setup (strikes -> 2, still ACTIVE)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Threshold Salon", no_show_suspend_threshold: 3, no_show_fee_pct: 0.0, tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Quick", duration_minutes: 15, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Rep", email: "rep2@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt1: $.data.id, st1_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T14:00:00Z", expected_stylist_version: "${st1_v1}" }
              as: FrontDesk
              captures: { appt2: $.data.id, st1_v2: "$.data.version" }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T15:00:00Z", expected_stylist_version: "${st1_v2}" }
              as: FrontDesk
              captures: { appt3: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T16:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /appointments/${appt1}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt2}/no-show"
              payload: {}
              as: FrontDesk
            - call: "GET /clients/${cli}"
              payload: {}
              as: FrontDesk
              captures: { strikes_at_two: $.data.no_show_strikes, status_at_two: $.data.status }
          trigger:
            - call: "POST /appointments/${appt3}/no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "${strikes_at_two} == 2"
            - "${status_at_two} == ACTIVE"
            - "Client.${cli}.no_show_strikes == 3"
            - "Client.${cli}.status == SUSPENDED"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: suspended_client_self_book_rejected_pair_appointment_client
        grounds:
          - validations[priority=6]
          - entities.Client.fields.status
          - errors[ERR_CLIENT_NOT_BOOKABLE]
        distinguishing_aspect: |
          Entity pair Appointment->Client: an Appointment booking's validity depends on Client.status. A SUSPENDED
          client acting as Client (self-book) is rejected with ERR_CLIENT_NOT_BOOKABLE, while the SAME booking
          succeeds when submitted by FrontDesk — the transition gates on the sibling Client's state.
        test_recipe:
          setup:
            - "Salon suspend threshold 1 no_show_fee_pct 0.0, stylist buffer 0, chair, Service base 5000 deposit 0."
            - "Client driven to SUSPENDED by one no-show (threshold 1). Clock then advanced to a future point for the self-book attempt."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Suspend Salon", no_show_suspend_threshold: 1, no_show_fee_pct: 0.0, tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Quick", duration_minutes: 15, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Self", email: "self@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt1: $.data.id, st1_v1: "$.data.version" }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T13:30:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /appointments/${appt1}/no-show"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T15:00:00Z", expected_stylist_version: "${st1_v1}" }
              as: Client
              as_user_id: "${cli}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_CLIENT_NOT_BOOKABLE"
            - "Client.${cli}.status == SUSPENDED"

      - name: pastdue_membership_priced_as_non_member_pair_appointment_membership
        grounds:
          - calculations.appointment_service_quote
          - state_machines.Membership.ACTIVE_to_PAST_DUE
          - entities.Membership.fields.status
          - entities.Appointment.fields.quoted_service_price_cents
        distinguishing_aspect: |
          Entity pair Appointment->Membership (different from Appointment->Client): the Appointment quote depends on
          Membership.status. With the membership ACTIVE the quote is 8000 (20% off 10000); after the membership is
          lapsed to PAST_DUE the next booking of the same service quotes the full 10000 — the discount is gated on
          the sibling Membership's state.
        test_recipe:
          setup:
            - "Salon, two stylists buffer 0, two chairs, Service base 10000 deposit 0, Gold plan 0.20."
            - "Client enrolled ACTIVE. Clock at 12:00. First booking made while ACTIVE; then membership lapsed; second booking made while PAST_DUE."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Lapse Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S2", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st2: $.data.id, st2_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair B", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chB: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Color", duration_minutes: 60, base_price_cents: 10000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /membership-plans"
              payload: { salon_id: "${sid}", name: "Gold", monthly_fee_cents: 5000, service_discount_pct: 0.20 }
              as: SalonOwner
              captures: { plan: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Mem", email: "lap@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /memberships"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T14:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt_active: $.data.id }
            - call: "POST /memberships/${mem}/lapse"
              payload: {}
              as: SalonOwner
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st2}", resource_id: "${chB}", service_id: "${svc}", start_utc: "2026-07-01T14:00:00Z", expected_stylist_version: "${st2_v0}" }
              as: FrontDesk
              captures: { appt_pastdue: $.data.id }
          assert:
            - "Appointment.${appt_active}.quoted_service_price_cents == 8000"
            - "Appointment.${appt_pastdue}.quoted_service_price_cents == 10000"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stylist_buffer_padded_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.Stylist.fields.buffer_minutes
          - errors[ERR_STYLIST_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Stylist interval semantics = buffer-padded: with buffer 10 min, an existing [13:00,13:30) appointment
          pads to [12:50,13:40); a new booking starting at 13:35 on a SEPARATE chair (no resource clash) still
          collides because its padded interval [13:25,...) overlaps the first stylist's padded tail — rejected
          ERR_STYLIST_DOUBLE_BOOKED. The geometric treatment (buffer expansion) is what distinguishes it.
        test_recipe:
          setup:
            - "Salon, ONE stylist buffer_minutes 10, TWO chairs (so the resource check never binds), Service duration 30 base 5000 deposit 0, a client."
            - "First appointment [13:00,13:30) on chair A. Clock at 12:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Buffer Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 10 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair B", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chB: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "buf@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt1: $.data.id, st1_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chB}", service_id: "${svc}", start_utc: "2026-07-01T13:35:00Z", expected_stylist_version: "${st1_v1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STYLIST_DOUBLE_BOOKED"

      - name: resource_bare_halfopen_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.Appointment.fields.end_utc
          - errors[ERR_RESOURCE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource interval semantics = bare half-open [start,end) with NO buffer (different geometry, different
          entity than Stylist): two DIFFERENT stylists both want chair A; the first holds [13:00,13:30), the second
          requests [13:15,13:45) — the half-open intervals overlap on (13:15,13:30) so it is rejected
          ERR_RESOURCE_DOUBLE_BOOKED even though no buffer is involved.
        test_recipe:
          setup:
            - "Salon, TWO stylists buffer 0 (stylist check never binds — different stylists), ONE chair, Service duration 30 base 5000 deposit 0, a client."
            - "First appointment [13:00,13:30) on stylist 1 + chair A. Clock at 12:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Res Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S2", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st2: $.data.id, st2_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "res@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st2}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:15:00Z", expected_stylist_version: "${st2_v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RESOURCE_DOUBLE_BOOKED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_product_inventory_units
        grounds:
          - state_machines.Checkout.SETTLED_to_VOIDED
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - entities.ProductSku.fields.qty_on_hand
          - entities.ProductSale.fields.quantity
        distinguishing_aspect: |
          Conserved quantity = total product inventory units (ProductSku.qty_on_hand). Checkout completion sells 3
          units (qty 10 -> 7); voiding the checkout restores exactly 3 (7 -> 10). Invariant pinned:
          ProductSku.qty_on_hand after void == qty_on_hand before the checkout; no drift.
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, Service base 0 deposit 0, client, SKU unit 2000 qty 10."
            - "Appointment at 13:00 completed with a 3-unit retail line (qty_on_hand 10 -> 7). Clock at 14:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Inv Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Wash", duration_minutes: 30, base_price_cents: 0, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "inv@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /product-skus"
              payload: { salon_id: "${sid}", sku: "SH-2", name: "Shampoo", unit_price_cents: 2000, qty_on_hand: 10 }
              as: SalonOwner
              captures: { sku1: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T14:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt}", tip_cents: 0, retail_lines: [ { product_sku_id: "${sku1}", quantity: 3 } ] }
              as: FrontDesk
              captures: { co: $.data.id }
            - call: "GET /product-skus/${sku1}"
              payload: {}
              as: FrontDesk
              captures: { qty_after_sale: $.data.qty_on_hand }
          trigger:
            - call: "POST /checkouts/${co}/void"
              payload: {}
              as: SalonOwner
          assert:
            - "${qty_after_sale} == 7"
            - "ProductSku.${sku1}.qty_on_hand == 10"

      - name: cancel_conserves_package_sessions
        grounds:
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - entities.PackagePurchase.fields.sessions_remaining
          - entities.Package.fields.session_count
        distinguishing_aspect: |
          Conserved quantity = prepaid package sessions (PackagePurchase.sessions_remaining), a DIFFERENT quantity
          than inventory units. A purchase starts at 4 sessions; redeeming one at checkout drops it to 3; cancelling
          a SECOND (still-booked) package appointment restores its held session leaving 3, so total prepaid value
          (consumed 1 + remaining 3 == original 4) is conserved with no drift.
        test_recipe:
          setup:
            - "Salon, ONE stylist buffer 0, two chairs, Service base 9000 deposit 0, Package 4 sessions price 24000."
            - "Client buys the package (sessions_remaining 4). Two package appointments at 13:00 (chair A) and 16:00 (chair B). Clock at 14:00."
            - "First appointment completed via checkout (sessions 4 -> 3)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Pkg Salon", tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair B", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chB: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Facial", duration_minutes: 45, base_price_cents: 9000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /packages"
              payload: { salon_id: "${sid}", service_id: "${svc}", session_count: 4, price_cents: 24000 }
              as: SalonOwner
              captures: { pkg: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Pkg C", email: "pkg@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /package-purchases"
              payload: { client_id: "${cli}", package_id: "${pkg}" }
              as: FrontDesk
              captures: { pp: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}", package_purchase_id: "${pp}" }
              as: FrontDesk
              captures: { appt1: $.data.id, st1_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chB}", service_id: "${svc}", start_utc: "2026-07-01T16:00:00Z", expected_stylist_version: "${st1_v1}", package_purchase_id: "${pp}" }
              as: FrontDesk
              captures: { appt2: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T14:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt1}", tip_cents: 0 }
              as: FrontDesk
              captures: { co: $.data.id }
            - call: "GET /package-purchases/${pp}"
              payload: {}
              as: FrontDesk
              captures: { sessions_after_redeem: $.data.sessions_remaining }
          trigger:
            - call: "POST /appointments/${appt2}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "${sessions_after_redeem} == 3"
            - "PackagePurchase.${pp}.sessions_remaining == 3"
            - "PackagePurchase.${pp}.status == ACTIVE"
