  # -------------------------------------- cross_cutting_complexity_layers
  # complexity_profile.complexity_layers declares four layers.
  # optimistic_concurrency is covered once per §1.2.1 concurrency_rules entry,
  # each using that rule's own declared write_endpoint and occ_field, and
  # derived_field_reconciliation is covered on the restricted corpus (correct
  # after create, after the mutation of the source row, and after the retraction
  # of that mutation - the scaffold has no destructive delete, so unwind is the
  # retraction). cascading_side_effects and dual_variant_calculation are already
  # carried end-to-end by §1.8 instances and are stubbed out below.
  - section: cross_cutting_complexity_layers
    instances:
      - name: letter_of_intent_occ_pins_the_deal_version_the_writer_saw
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.loi-round-create-stale-restructuring
          - errors.ERR_STALE_RESTRUCTURING_VERSION
          - validations.priority_15_ERR_STALE_RESTRUCTURING_VERSION
          - endpoints.POST_/letters-of-intent
        distinguishing_aspect: "This is the §1.2.1 rule loi-round-create-stale-restructuring exercised on its own declared write_endpoint POST /letters-of-intent with its own declared occ_field expected_restructuring_version. The interesting arithmetic is that a WITHDRAW of the letter increments LetterOfIntent.version but NOT Restructuring.version, so a token read before the withdrawal is still current afterwards - the OCC token guards the parent deal, not the child row. The successful create then invalidates that very token, so the same literal value is first current and then stale within one recipe."
        test_recipe:
          setup:
            - "A deal in LOI_NEGOTIATION with one ISSUED letter; the create that issued it already advanced Restructuring.version from 2 to 3, so the token captured before it (rv_a == 2) is stale on arrival"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
          trigger:
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 9, exclusivity_days: 45, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_stale1: $.data.error_id }
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { v2: $.data.version }
            - call: "POST /letters-of-intent/${loi}/withdraw"
              payload: { withdrawal_reason: "Seat split reopened by the initiator board" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { v3: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${v3}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 9, exclusivity_days: 45, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi2: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${v3}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 9, exclusivity_days: 45, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_stale2: $.data.error_id }
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { v4: $.data.version }
          assert:
            - "the first create returns HTTP status 412 and e_stale1 == ERR_STALE_RESTRUCTURING_VERSION - rv_a was captured before the setup letter and is one behind"
            - "v2 == 3 - the refused request incremented nothing"
            - "GET /restructurings/${deal}/letters-of-intent returns exactly one row after that refusal"
            - "the withdraw returns HTTP status 200; LetterOfIntent.${loi}.status == WITHDRAWN, exclusivity_status == RELEASED and its own version == 2"
            - "v3 == 3 - a letter-only write does not touch the parent OCC token, so the token read before the withdrawal is still current after it"
            - "the create carrying ${v3} returns HTTP status 201; LetterOfIntent.${loi2}.status == ISSUED, exclusivity_status == ACTIVE, round_no == 1, counter_round_count == 0"
            - "LetterOfIntent.${loi2}.exclusivity_end_date == 2026-08-01 plus 44 days == 2026-09-14 and expires_at == 2026-09-14T00:00:00.000Z"
            - "the repeat create carrying the same ${v3} returns HTTP status 412 and e_stale2 == ERR_STALE_RESTRUCTURING_VERSION - the successful create invalidated the token it consumed"
            - "v4 == 4 - exactly one increment for the one successful parent write, and none for either refusal"
            - "GET /restructurings/${deal}/letters-of-intent returns exactly two rows, and Restructuring.${deal}.status is still LOI_NEGOTIATION"
            - "the cooling-off rule at priority 41 does not fire on ${loi2}: the released window belongs to the SAME counterparty pair, which the rule exempts"

      - name: board_approval_occ_pins_the_deal_version_the_board_deliberated_over
        claim_type: optimistic_concurrency
        grounds:
