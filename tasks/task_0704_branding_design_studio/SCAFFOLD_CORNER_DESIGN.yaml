        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROJECT_NOT_ACTIVATED]
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
        distinguishing_aspect: "Approving a change order whose project is still DRAFT returns ERR_PROJECT_NOT_ACTIVATED (409)."
        test_recipe:
