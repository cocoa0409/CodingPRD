  # ===========================================================================
  - section: validations
    instances:
      - name: state_vs_privacy_priority_claim
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_error_beats_privacy_business_safety
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: temporal_vs_referential_priority_claim
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / temporal_error_beats_referential_eligibility
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: award_approve_requires_final_snapshot
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_SNAPSHOT_NOT_FINAL
        distinguishing_aspect: "Approving an award priced by a PROVISIONAL snapshot fails 409 ERR_SNAPSHOT_NOT_FINAL; after a FINAL snapshot reprices the award, approve succeeds."
        test_recipe:
          setup:
            - "Clock set; base setup; driver has no events; PROVISIONAL driver snapshot computed, award PROJECTED."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/fleets/${fleet_id}/score-snapshots/compute"
              payload: { scope_type: "DRIVER", scope_id: "${drv_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", finalize: false }
              as: FleetAdmin
            - call: "GET /api/drivers/${drv_id}/incentive-awards"
              payload: {}
              as: FleetAdmin
              captures: { award_nf: "$.data[0].id" }
          trigger:
            - call: "POST /api/incentive-awards/${award_nf}/approve"
              payload: {}
              as: FleetAdmin
              captures: { err_nf: $.data.error_id }
            - call: "POST /api/fleets/${fleet_id}/score-snapshots/compute"
              payload: { scope_type: "DRIVER", scope_id: "${drv_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", finalize: true }
              as: FleetAdmin
            - call: "POST /api/incentive-awards/${award_nf}/approve"
              payload: {}
              as: FleetAdmin
          assert:
            - "first approve: HTTP 409 and err_nf == ERR_SNAPSHOT_NOT_FINAL"
            - "after the FINAL snapshot: second approve returns 200 and IncentiveAward.${award_nf}.status == APPROVED"

      - name: incentive_budget_exceeded_on_pay
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_INCENTIVE_BUDGET_EXCEEDED
        distinguishing_aspect: "Fiscal check: a fleet with budget 40000c cannot pay a GOLD 50000c award — 402 ERR_INCENTIVE_BUDGET_EXCEEDED — while a fleet whose budget equals 50000c exactly pays it (<= inclusive)."
        test_recipe:
          setup:
            - "Clock set; two fleets each with terminal/driver/vehicle/policy and a FINAL GOLD award APPROVED; fleet A budget 40000c, fleet B budget 50000c."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/fleets"
              payload: { name: "Tight Budget Freight", incentive_budget_cents: 40000 }
              as: PlatformAdmin
              captures: { fleet_a: $.data.id }
            - call: "POST /api/terminals"
              payload: { fleet_id: "${fleet_a}", name: "Depot A", region_code: "TN" }
              as: PlatformAdmin
              captures: { term_a: $.data.id }
            - call: "POST /api/drivers"
              payload: { terminal_id: "${term_a}", employee_ref: "E-9001", name: "Driver A", hire_date: "2024-01-01T00:00:00Z", inward_camera_consent: true }
              as: PlatformAdmin
              captures: { drv_a: $.data.id }
            - call: "POST /api/fleets/${fleet_a}/score-snapshots/compute"
              payload: { scope_type: "DRIVER", scope_id: "${drv_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", finalize: true }
              as: FleetAdmin
            - call: "GET /api/drivers/${drv_a}/incentive-awards"
              payload: {}
              as: FleetAdmin
              captures: { award_a: "$.data[0].id" }
            - call: "POST /api/incentive-awards/${award_a}/approve"
              payload: {}
              as: FleetAdmin
            - call: "POST /api/fleets"
              payload: { name: "Exact Budget Freight", incentive_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { fleet_b: $.data.id }
            - call: "POST /api/terminals"
              payload: { fleet_id: "${fleet_b}", name: "Depot B", region_code: "TN" }
              as: PlatformAdmin
              captures: { term_b: $.data.id }
            - call: "POST /api/drivers"
              payload: { terminal_id: "${term_b}", employee_ref: "E-9002", name: "Driver B", hire_date: "2024-01-01T00:00:00Z", inward_camera_consent: true }
              as: PlatformAdmin
              captures: { drv_b: $.data.id }
            - call: "POST /api/fleets/${fleet_b}/score-snapshots/compute"
              payload: { scope_type: "DRIVER", scope_id: "${drv_b}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", finalize: true }
              as: FleetAdmin
            - call: "GET /api/drivers/${drv_b}/incentive-awards"
              payload: {}
              as: FleetAdmin
              captures: { award_b: "$.data[0].id" }
            - call: "POST /api/incentive-awards/${award_b}/approve"
              payload: {}
              as: FleetAdmin
          trigger:
            - call: "POST /api/incentive-awards/${award_a}/pay"
              payload: {}
              as: FleetAdmin
              captures: { err_pay: $.data.error_id }
            - call: "POST /api/incentive-awards/${award_b}/pay"
              payload: {}
              as: FleetAdmin
          assert:
            - "fleet A pay: HTTP 402 and err_pay == ERR_INCENTIVE_BUDGET_EXCEEDED; IncentiveAward.${award_a}.status stays APPROVED"
            - "fleet B pay: HTTP 200 and IncentiveAward.${award_b}.status == PAID  (50000 <= 50000 boundary inclusive)"

      - name: event_type_disabled_by_active_policy
        claim_type: Conditional Validation
        grounds:
          - validations[priority=10]
          - errors.ERR_EVENT_TYPE_DISABLED
        distinguishing_aspect: "With the ACTIVE policy's distraction_detection_enabled false, ingesting DISTRACTION fails 422 ERR_EVENT_TYPE_DISABLED while HARSH_BRAKE still ingests; re-enabling via a new policy admits DISTRACTION again."
        test_recipe:
          setup:
            - "Clock set; base setup but the ACTIVE policy has distraction_detection_enabled false."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - call: "POST /api/camera-policies"
              payload: { fleet_id: "${fleet_id}", name: "No-Distraction Policy", retention_days_standard: 30, retention_days_collision: 180, daily_upload_cap_mb: 100, inward_capture_enabled: true, distraction_detection_enabled: false, seatbelt_detection_enabled: true, effective_from: "2026-01-01T00:00:00Z" }
