              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loan-payments"
              payload: { loan_id: "${loan_id}", payment_date: "2026-06-30", principal_cents: 0, interest_cents: 0 }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { pay_id: $.data.id }
          assert:
            - "LoanPayment.${pay_id}.released_shares == 0"
            - "LoanPayment.${pay_id}.suspense_shares_before == 600000 and LoanPayment.${pay_id}.suspense_shares_after == 600000"
            - "LoanPayment.${pay_id}.principal_balance_after_cents == 4000000000 and LoanPayment.${pay_id}.remaining_interest_after_cents == 1600000000"
            - "EsopLoan.${loan_id}.status == AMORTIZING and EsopLoan.${loan_id}.released_shares_cumulative == 0"
            - "EsopPlan.${plan_id}.unallocated_released_shares == 0 and EsopPlan.${plan_id}.suspense_shares == 600000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_finalize_gated_by_valuation_status_run_to_valuation
        grounds:
          - state_machines.AllocationRun.DRAFT_to_FINALIZED
          - state_machines.Valuation.SUBMITTED_to_CHALLENGED
          - validations[priority=12]
          - errors[ERR_NO_APPROVED_VALUATION]
        distinguishing_aspect: |
          The entity pair here is AllocationRun depending on Valuation: an unchanged DRAFT
          run flips from unfinalizable to finalizable purely because the Valuation it names
          moves CHALLENGED -> SUBMITTED -> APPROVED, with no mutation of the run itself.
        test_recipe:
          setup:
            - "A plan in VALUATION_PENDING with one ACTIVE participant at 34500000 cents of compensation."
            - "One valuation for plan_year 2026 currently in CHALLENGED."
            - "One DRAFT allocation run naming that valuation and contributing 500 shares, created by tpa-01."
