          - state_machines.Household.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair: auth (ERR_FORBIDDEN, priority 3) vs state (ERR_INVALID_STATE,
          priority 6). FraudInvestigator (not in Caseworker exclusive_ops for
          /suspend) attempts /suspend on an already-SUSPENDED household.
          ERR_FORBIDDEN wins. Different error-category pair from
          state_beats_business_fiscal_on_double_approve (state vs
          business_fiscal).
        test_recipe:
          setup:
            - "Clock: 2026-09-01T00:00:00Z"
            - "Household HH ACTIVE size=1 state_code=MI"
            - "FraudFlag SUBSTANTIATED on HH"
