  - section: validations
    instances:
      - name: underage_check_counts_the_birthday_itself
        claim_type: violation_to_error
        grounds:
          - validations.priority_50
          - errors[ERR_CONSUMER_UNDERAGE]
          - entities.StateRule.fields.min_purchaser_age
          - entities.Consumer.fields.birthdate
        distinguishing_aspect: |
          The rule is calendar-anniversary arithmetic with the birthday counting, so the pass/fail edge is
          a single day: a consumer born 2005-08-01 has completed exactly 21 years on a 2026-08-01 clock and
          clears, while one born 2005-08-02 has completed 20 and is refused. Both consumers are ID-verified and
          ship the identical order to the identical ZIP, so age is the only variable. An implementation using
          floor(days / 365.25) or a strict > comparison gets the first consumer wrong.
        test_recipe:
          setup:
            - "The TX rule sets min_purchaser_age 21. Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment. Clock 2026-08-01."
            - "Ada Buyer was born 2005-08-01 \u2014 her 21st birthday is the clock date itself."
            - "Zed Buyer was born 2005-08-02 \u2014 one day short of 21."
            - "Both are ID-verified and both order one 750 ml bottle at 4200 c shipped to 78701."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
