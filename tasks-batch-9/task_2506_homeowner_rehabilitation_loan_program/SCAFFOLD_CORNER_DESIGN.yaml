  - section: rbac
    instances:
      - name: a_request_with_a_missing_x_user_role_header_is_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: "Authentication is checked before anything else: with no X-User-Role header the answer is 401 ERR_UNAUTHENTICATED even on a read that would otherwise succeed, and an unrecognised role string gets the same 401 rather than a 403."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "GET /rehab/program-years/${py_id}"
              payload: {}
              as: "<no X-User-Role header sent>"
              captures: { seen_error: $.data.error_id }
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED and response_type == error"
            - "an X-User-Role of Auditor (not one of the seven declared roles) also returns 401 ERR_UNAUTHENTICATED"
            - "an empty X-User-Role header returns 401 ERR_UNAUTHENTICATED"
            - "the same GET with X-User-Role IntakeSpecialist returns 200"

      - name: an_inspector_cannot_create_an_applicant_forbidden
        claim_type: exclusive_operations
        grounds:
          - validations.priority_2
          - errors.ERR_FORBIDDEN_ROLE
          - roles.IntakeSpecialist.exclusive_operations
          - roles.Inspector.exclusive_operations
        distinguishing_aspect: "POST /rehab/applicants is exclusive to IntakeSpecialist, so an authenticated Inspector gets 403 ERR_FORBIDDEN_ROLE before any payload or business validation runs — the request is refused even though the body is perfectly valid, and the reverse direction is refused too."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000 }
              as: Inspector
              as_user_id: "insp-1"
              captures: { seen_error: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "no Applicant row is created"
            - "the same body with an omitted required field still returns 403, not 400 — role precedes shape"
            - "the reverse holds: an IntakeSpecialist calling POST /rehab/inspections or POST /rehab/contractors also gets 403 ERR_FORBIDDEN_ROLE"
            - "a ProgramManager calling POST /rehab/applicants gets 403 as well — there is no hierarchical override in this role model"

      - name: read_endpoints_are_shared_across_every_operator_role
        claim_type: shared_operations
        grounds:
          - roles
          - endpoints.GET_/rehab/program-years/{program_year_id}
          - endpoints.GET_/rehab/applications/{application_id}
        distinguishing_aspect: "The five opaque operator roles all read the same program year successfully, and the two entity-backed roles are deliberately absent from that endpoint's roles list — so shared does not mean universal, and the split is per endpoint rather than per record."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "GET /rehab/program-years/${py_id}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "GET /rehab/program-years/${py_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
            - call: "GET /rehab/program-years/${py_id}"
              payload: {}
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /rehab/program-years/${py_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-1"
            - call: "GET /rehab/program-years/${py_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "all five calls return HTTP 200 with identical bodies"
            - "the same GET as Applicant or as Contractor returns 403 ERR_FORBIDDEN_ROLE (neither role is on that endpoint)"
            - "GET /rehab/applications/{application_id} does list Applicant, so an applicant may read their own application even though they cannot read the program year"

      - name: an_applicant_cannot_read_another_households_application
        claim_type: peer_roles
        grounds:
          - validations.priority_3
          - errors.ERR_OWNERSHIP_MISMATCH
          - roles.Applicant
          - complexity_profile.role_model
        distinguishing_aspect: "The Applicant role is entity-backed, so authorisation is per record: household A's user reading household B's application is 403 ERR_OWNERSHIP_MISMATCH, which outranks the 404 they would get for a genuinely unknown id and is distinct from the 403 ERR_FORBIDDEN_ROLE a wrong-role caller receives."
        test_recipe:
          setup:
            - "one ProgramYear 2026 with two income-verified Applicants A and B"
            - "one RehabApplication belonging to A"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Household A", email: "a@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
