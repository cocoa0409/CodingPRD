        grounds:
          - calculations.guest_risk_score
          - entities.Guest.fields.risk_tier
          - endpoints.POST_rentals_guests_id_payment_signals
        distinguishing_aspect: |
          Metric: the risk_tier band edge on risk_score, exercised at 45 (ELEVATED, upper
          band is inclusive through 49) and at exactly 50 (HIGH floor) through the payment
          signal endpoint. An implementation that bands with an exclusive upper edge or
          with `< 50 -> HIGH` mislabels the boundary point.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One UNVERIFIED guest with no stays, no incidents and no claims, so risk_score is exactly BASE_RISK 35."
            - "A first payment-signal write of CLEAN with chargeback_count 2 puts the score at 35 + 10 = 45, one band below the edge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Priya Shah", email: "priya@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
