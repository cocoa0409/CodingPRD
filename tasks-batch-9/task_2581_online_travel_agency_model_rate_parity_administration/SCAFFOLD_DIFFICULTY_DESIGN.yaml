            - "after the cancel: remaining 3, held 0, sold 0 (3 == 3 + 0 + 0) - the unit is returned to remaining, not to held"
            - "after the cancel: cancellation_refund_pct == 1.00, refunded_cents == 24240, marketplace_margin_cents == 0, supplier_payable_cents == 0, taxes_fees_cents == 0, payment_status == REFUNDED_FULL and 24240 == 0 + 0 + 0 + 24240"
