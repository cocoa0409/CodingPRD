  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: label_task_parallel_print_and_placement_axes_advance_independently
        grounds:
          - state_machines.LabelTask
          - state_machines.LabelTask.print_status=NOT_PRINTED_to_print_status=PRINTED
          - state_machines.LabelTask.placement_status=UNPLACED_to_placement_status=PLACED
          - state_machines.LabelTask.placement_status=PLACED_to_placement_status=REJECTED
          - state_machines.LabelTask.print_status=REPRINT_REQUIRED_to_print_status=PRINTED
          - entities.LabelTask.fields.print_status
          - entities.LabelTask.fields.placement_status
          - entities.LabelTask.fields.rejection_count
        distinguishing_aspect: |
          Shape is parallel: LabelTask carries two independent state dimensions on one row, so
          printing moves print_status NOT_PRINTED -> PRINTED while placement_status stays UNPLACED,
          and placing moves placement_status UNPLACED -> PLACED while print_status stays PRINTED —
          six ordered calls walk the axes through PRINTED x REJECTED and back to PRINTED x VERIFIED
          without either axis ever implying the other's value.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with grace_period_hours 48."
            - "One store (posture OPEN), one aisle, one CERTIFIED LABEL_ASSOCIATE and one CERTIFIED PRICE_AUDITOR."
            - "A DISTRIBUTED price change file with TWO lines, effective_date 2026-08-03T00:00:00Z, and exactly one label task on the first line, so verifying it cannot complete the file."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48, unit_price_uom_rule: "PER_SINGLE_ITEM" }
