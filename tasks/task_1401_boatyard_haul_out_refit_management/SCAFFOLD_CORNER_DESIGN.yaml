            - "49.9 ppm -> LOGGED"
            - "50.0 ppm -> ADVISORY (>= boundary)"
            - "no compliance holds exist (ADVISORY never creates one)"

      - name: slot_booking_uses_latest_expiry_certificate
        claim_type: correct_result
        grounds: [calculations.active_certificate_selection, "errors[ERR_INSURANCE_MISSING]"]
        distinguishing_aspect: "Selector determinism: with two ACTIVE certificates the one with the latest expiry_date qualifies the operation; a HAUL_OUT on 2026-12-15 fails while only a 2026-12-01-expiry certificate exists and succeeds once a 2027-06-01 certificate is added."
        test_recipe:
          setup: ["Vessel with certificate expiring 2026-12-01; job submitted to INTAKE"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Sel", owner_name: "O S", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "ShortCo", policy_no: "SH-1", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2026-12-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-12-15T08:00:00Z", scheduled_end: "2026-12-15T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { err: $.data.error_id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "LongCo", policy_no: "LG-1", liability_coverage_cents: 200000000, effective_date: "2026-06-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-12-15T08:00:00Z", scheduled_end: "2026-12-15T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
          assert:
            - "first booking fails ERR_INSURANCE_MISSING (selected certificate's expiry 2026-12-01 does not cover 2026-12-15)"
            - "after the longer certificate is added, the selector ranks expiry 2027-06-01 first and the booking succeeds"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: labor_state_beats_subcontractor_policy
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=17]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Priority pair state vs business_constraint (a pair not exercised in §1.8): subcontractor labor on an ESTIMATE BOTTOM_PAINT work order violates both the IN_PROGRESS state gate and the subcontractor policy; ERR_INVALID_STATE (p7) wins over ERR_SUBCONTRACTOR_NOT_ALLOWED (p17)."
        test_recipe:
          setup: ["Job ON_HARD with a BOTTOM_PAINT work order still in ESTIMATE"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Prio2", owner_name: "O P", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PP3", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "P2", total_stands: 6 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "BOTTOM_PAINT", description: "Bottom paint", quoted_hours: 8, quoted_rate_cents: 7500, quoted_parts_cents: 20000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
          trigger:
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "SUBCONTRACTOR", hours: 2, rate_cents: 9000, subcontractor_name: "Sub X" }, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_INVALID_STATE (state gate outranks the subcontractor policy)"

      - name: owner_supplied_bottom_paint_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_OWNER_PARTS_PROHIBITED]"]
        distinguishing_aspect: "Yard policy: owner-supplied BOTTOM_PAINT parts are prohibited at registration (422), while a yard-supplied BOTTOM_PAINT part is accepted."
        test_recipe:
          setup: ["Job INTAKE"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Paint", owner_name: "O P", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "SAIL", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PP4", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/parts", payload: { job_id: "${j_id}", description: "Owner bottom paint", category: "BOTTOM_PAINT", owner_supplied: true, declared_value_cents: 40000 }, as: Owner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
            - { call: "POST /yard/parts", payload: { job_id: "${j_id}", description: "Yard bottom paint", category: "BOTTOM_PAINT", owner_supplied: false, declared_value_cents: 40000 }, as: ServiceWriter, captures: { p_ok: $.data.id } }
          assert:
            - "owner-supplied BOTTOM_PAINT -> 422 ERR_OWNER_PARTS_PROHIBITED"
            - "yard-supplied BOTTOM_PAINT -> 201 EXPECTED"

      - name: winterization_window_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_WINTERIZATION_WINDOW]"]
        distinguishing_aspect: "Temporal window: a WINTERIZATION work order created on 2026-08-01 is rejected; the same creation on 2026-10-15 (inside [09-15, 12-15]) succeeds."
        test_recipe:
          setup: ["Vessel with DRAFT job; logical clock initially 2026-08-01 (default season is closed)"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Winter", owner_name: "O W", owner_user_id: "owner-1", loa_ft: 34, beam_ft: 11, hull_type: "SAIL", displacement_tons: 14 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
          trigger:
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "WINTERIZATION", description: "Fog engine", quoted_hours: 2, quoted_rate_cents: 8500, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { err: $.data.error_id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "SHRINK_WRAP", description: "Shrink wrap", quoted_hours: 4, quoted_rate_cents: 8500, quoted_parts_cents: 12000 }, as: ServiceWriter, captures: { wo_id: $.data.id, wo_status: $.data.status } }
          assert:
            - "August creation -> 422 ERR_WINTERIZATION_WINDOW"
            - "October 15 creation -> 201 with status ESTIMATE"

      - name: duplicate_active_job_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_DUPLICATE_ACTIVE_JOB]"]
        distinguishing_aspect: "Aggregate/uniqueness rule: a vessel with any non-terminal job (here DRAFT) rejects a second refit job with ERR_DUPLICATE_ACTIVE_JOB."
        test_recipe:
          setup: ["Vessel with one DRAFT job"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Dup", owner_name: "O D", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
          trigger:
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_DUPLICATE_ACTIVE_JOB"

      - name: lift_capacity_boundary_60_tons
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_LIFT_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Boundary rule is <= : exactly 60 tons books successfully; 60.5 tons fails with ERR_LIFT_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["Two vessels with jobs in INTAKE"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Heavy", owner_name: "O H", owner_user_id: "owner-1", loa_ft: 50, beam_ft: 15, hull_type: "POWER", displacement_tons: 60 }, as: ServiceWriter, captures: { v_a: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_a}", provider: "P", policy_no: "PH2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_a}" }, as: ServiceWriter, captures: { j_a: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_a}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/vessels", payload: { name: "MV TooHeavy", owner_name: "O T", owner_user_id: "owner-2", loa_ft: 52, beam_ft: 16, hull_type: "POWER", displacement_tons: 60.5 }, as: ServiceWriter, captures: { v_b: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_b}", provider: "P", policy_no: "PT3", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_b}" }, as: ServiceWriter, captures: { j_b: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_b}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_a}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 60 }, as: YardManager, captures: { slot_ok: $.data.id } }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_b}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", vessel_displacement_tons: 60.5 }, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "60 tons (== limit) books successfully"
            - "60.5 tons -> 409 ERR_LIFT_CAPACITY_EXCEEDED"

      - name: charge_kind_via_api_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION]", entities.LedgerEntry]
        distinguishing_aspect: "CHARGE entries are system-created only: POST /yard/ledger-entries with kind=CHARGE is a 400 ERR_VALIDATION, never a posted charge."
        test_recipe:
          setup: ["Job INTAKE"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Chg", owner_name: "O C", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PC3", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_id}", kind: "CHARGE", amount_cents: 100 }, as: Accountant, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_VALIDATION"

      - name: subcontractor_name_missing_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION]", entities.LaborEntry.fields.subcontractor_name]
        distinguishing_aspect: "Conditional required field: worker_type SUBCONTRACTOR without subcontractor_name fails shape validation (400), even though the work order is IN_PROGRESS."
        test_recipe:
          setup: ["Job ON_HARD; MECHANICAL work order IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Sub", owner_name: "O S", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PS4", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "SB", total_stands: 6 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 2, quoted_rate_cents: 8000, quoted_parts_cents: 0 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "SUBCONTRACTOR", hours: 1, rate_cents: 9000 }, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_VALIDATION (subcontractor_name required for SUBCONTRACTOR lines)"

      - name: slot_end_not_after_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Temporal shape rule: scheduled_end equal to scheduled_start is rejected at 400 before any state or business check runs."
        test_recipe:
          setup: ["Job INTAKE"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Win", owner_name: "O W", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PW2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_VALIDATION (scheduled_end must be strictly after scheduled_start)"

      - name: haul_complete_without_stands_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_STAND_ASSIGNMENT_MISSING]", state_machines.LiftSlot.BOOKED_to_COMPLETED]
        distinguishing_aspect: "Cross-entity completion gate: completing a HAUL_OUT with no ACTIVE StandAssignment on the job fails with ERR_STAND_ASSIGNMENT_MISSING and the slot stays BOOKED."
        test_recipe:
          setup: ["Job HAUL_SCHEDULED (no stand assignment created); clock inside the slot window"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV NoStand", owner_name: "O N", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PN3", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
          trigger:
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_STAND_ASSIGNMENT_MISSING"
            - "job remains HAUL_SCHEDULED (no hauled_at set)"

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: statement_computed_read
        claim_type: computed_read
        grounds: [endpoints, calculations.ledger_balance, calculations.deposit_requirement]
        excluded_because:
          difficulty_instance: "compensating_invariant / ledger_post_void_conserves_balance"
          rationale: "The statement's balance_cents and charge aggregates are asserted with literal values at three points in that difficulty instance (40000 -> 18750 -> 40000), and storage/labor aggregates are asserted in dual_variant_calc / storage_daily_vs_monthly_divergence."

      - name: parts_filtered_list_by_status
        claim_type: standard_crud
        grounds: [endpoints, entities.Part]
        distinguishing_aspect: "The job-scoped parts list filters by status: after inspecting one of two parts RECEIVED, ?status=RECEIVED returns exactly that part and ?status=EXPECTED returns the other."
        test_recipe:
          setup: ["Job INTAKE with two EXPECTED parts"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Filter", owner_name: "O F", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PF2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/parts", payload: { job_id: "${j_id}", description: "Filter A", category: "MECHANICAL", owner_supplied: false, declared_value_cents: 1000 }, as: ServiceWriter, captures: { p_a: $.data.id } }
            - { call: "POST /yard/parts", payload: { job_id: "${j_id}", description: "Filter B", category: "ELECTRICAL", owner_supplied: false, declared_value_cents: 2000 }, as: ServiceWriter, captures: { p_b: $.data.id } }
            - { call: "POST /yard/parts/${p_a}/inspect", payload: { outcome: "RECEIVED" }, as: ServiceWriter }
          trigger:
            - { call: "GET /yard/refit-jobs/${j_id}/parts", payload: { status: "RECEIVED" }, as: ServiceWriter, captures: { recv_id: "$.data[0].id" } }
            - { call: "GET /yard/refit-jobs/${j_id}/parts", payload: { status: "EXPECTED" }, as: ServiceWriter, captures: { exp_id: "$.data[0].id" } }
          assert:
            - "RECEIVED filter returns exactly ${p_a}"
            - "EXPECTED filter returns exactly ${p_b}"

      - name: daily_close_idempotent_same_day
        claim_type: conditional_action
        grounds: [endpoints, calculations.storage_accrual]
        distinguishing_aspect: "Same-day re-run of the daily close is a no-op for storage: first close at 2026-08-05 posts 4 entries (lay days Aug 02-05, 8000 cents); an immediate second close posts 0 and the statement is unchanged."
        test_recipe:
          setup: ["40 ft vessel, DAILY job hauled 2026-08-02"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Idem", owner_name: "O I", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PI2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "ID", total_stands: 6 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: YardManager }
          trigger:
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager, captures: { posted1: $.data.storage_entries_posted } }
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { store1: $.data.storage_charges_cents } }
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager, captures: { posted2: $.data.storage_entries_posted } }
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { store2: $.data.storage_charges_cents } }
          assert:
            - "first close storage_entries_posted == 4 and storage_charges_cents == 8000"
            - "second close storage_entries_posted == 0 (last_accrual_date guard) and storage_charges_cents still == 8000"

  # =====================================================================
  # Section: errors
  # =====================================================================
  - section: errors
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check, even for a read endpoint."
        test_recipe:
          setup: ["Empty database; the request is sent with no auth headers at all"]
          setup_api_calls: []
          trigger:
            - { call: "GET /yard/vessels", payload: {}, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "401 with error_id == ERR_UNAUTHENTICATED (request sent without X-User-Role / X-User-ID)"

  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: accountant_cannot_create_work_order
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Segregation of duties: the Accountant (fiscal role) is denied work-order authoring — POST /yard/work-orders as Accountant returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Vessel with DRAFT job"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Rbac", owner_name: "O R", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
          trigger:
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 1, quoted_rate_cents: 8000, quoted_parts_cents: 0 }, as: Accountant, captures: { err: $.data.error_id } }
          assert:
            - "403 with error_id == ERR_UNAUTHORIZED"

      - name: owner_cannot_approve_others_vessel_work_order
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_OWNERSHIP_MISMATCH]", state_machines.WorkOrder.ESTIMATE_to_APPROVED]
        distinguishing_aspect: "Ownership scope: an Owner whose X-User-ID (owner-2) differs from the vessel's owner_user_id (owner-1) cannot approve its work order — 403 ERR_OWNERSHIP_MISMATCH, and the work order stays ESTIMATE."
        test_recipe:
          setup: ["Job ON_HARD (vessel owned by owner-1) with an ESTIMATE work order"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Scope", owner_name: "O One", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PS5", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 1, quoted_rate_cents: 8000, quoted_parts_cents: 0 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
          trigger:
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-2", captures: { err: $.data.error_id } }
          assert:
            - "403 with error_id == ERR_OWNERSHIP_MISMATCH"
            - "work order remains ESTIMATE"

      - name: hold_release_kind_role_segregation
        claim_type: violation_to_error
        grounds: [roles, state_machines.ComplianceHold.OPEN_to_RELEASED, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Segregation of duties on a shared endpoint: EnvironmentalOfficer cannot release a PAYMENT hold and Accountant cannot release an ENVIRONMENTAL hold; each kind releases only under its own role."
        test_recipe:
          setup: ["Job INTAKE with one MANUAL PAYMENT hold and one MANUAL ENVIRONMENTAL hold"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Seg", owner_name: "O S", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PS6", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/compliance-holds", payload: { job_id: "${j_id}", kind: "PAYMENT", note: "Unpaid invoice" }, as: Accountant, captures: { hold_pay: $.data.id } }
            - { call: "POST /yard/compliance-holds", payload: { job_id: "${j_id}", kind: "ENVIRONMENTAL", note: "Dust complaint" }, as: EnvironmentalOfficer, captures: { hold_env: $.data.id } }
          trigger:
            - { call: "POST /yard/compliance-holds/${hold_pay}/release", payload: {}, as: EnvironmentalOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /yard/compliance-holds/${hold_env}/release", payload: {}, as: Accountant, captures: { err2: $.data.error_id } }
            - { call: "POST /yard/compliance-holds/${hold_pay}/release", payload: {}, as: Accountant, captures: { st1: $.data.status } }
            - { call: "POST /yard/compliance-holds/${hold_env}/release", payload: {}, as: EnvironmentalOfficer, captures: { st2: $.data.status } }
          assert:
            - "EnvironmentalOfficer releasing PAYMENT hold -> 403 ERR_UNAUTHORIZED; hold stays OPEN"
            - "Accountant releasing ENVIRONMENTAL hold -> 403 ERR_UNAUTHORIZED; hold stays OPEN"
            - "Accountant releases the PAYMENT hold and EnvironmentalOfficer releases the ENVIRONMENTAL hold (both RELEASED)"

      - name: yard_manager_cannot_release_hold
        claim_type: violation_to_error
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "YardManager is not in the release endpoint's role list at all: releasing a hold as YardManager returns 403 ERR_UNAUTHORIZED regardless of hold kind."
        test_recipe:
          setup: ["Job INTAKE with one MANUAL PAYMENT hold"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Role", owner_name: "O R", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PR3", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/compliance-holds", payload: { job_id: "${j_id}", kind: "PAYMENT", note: "Deposit late" }, as: Accountant, captures: { hold_id: $.data.id } }
          trigger:
            - { call: "POST /yard/compliance-holds/${hold_id}/release", payload: {}, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "403 with error_id == ERR_UNAUTHORIZED (endpoint role list excludes YardManager)"

  # =====================================================================
  # Section: complexity_layers (cross-cutting)
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: job_patch_occ_stale_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[job-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on RefitJob.version: a PATCH carrying the version observed before a prior successful PATCH is rejected 412 ERR_STALE_VERSION; each successful PATCH increments version by 1."
        test_recipe:
          setup: ["Vessel with DRAFT job; client observed version at creation"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Occ", owner_name: "O O", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id, j_v: $.data.version } }
          trigger:
            - { call: "PATCH /yard/refit-jobs/${j_id}", payload: { expected_refit_job_version: "${j_v}", billing_mode: "MONTHLY_CONTRACT" }, as: ServiceWriter, captures: { j_v2: $.data.version, j_mode: $.data.billing_mode } }
            - { call: "PATCH /yard/refit-jobs/${j_id}", payload: { expected_refit_job_version: "${j_v}", scope_notes: "stale edit" }, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH succeeds: billing_mode == MONTHLY_CONTRACT and version == ${j_v} + 1"
            - "second PATCH with the pre-mutation version ${j_v} -> 412 ERR_STALE_VERSION"

      - name: stand_assign_occ_stale_row_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[stand-assign-stale-row]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on YardRow.version guards the capacity decision: after one assignment bumps the row version, a second assignment carrying the stale version is rejected 412 ERR_STALE_VERSION even though capacity would still allow it."
        test_recipe:
          setup: ["Row total_stands 10 at version 1; two vessels with jobs in INTAKE"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/yard-rows", payload: { code: "OC", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/vessels", payload: { name: "MV OccA", owner_name: "O A", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_a: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_a}", provider: "P", policy_no: "POA", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_a}" }, as: ServiceWriter, captures: { j_a: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_a}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/vessels", payload: { name: "MV OccB", owner_name: "O B", owner_user_id: "owner-2", loa_ft: 30, beam_ft: 10, hull_type: "SAIL", displacement_tons: 10 }, as: ServiceWriter, captures: { v_b: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_b}", provider: "P", policy_no: "POB", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_b}" }, as: ServiceWriter, captures: { j_b: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_b}/submit", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_a}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager, captures: { sa_a: $.data.id } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_b}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "first assignment succeeds (row version now ${row_v} + 1, stands_in_use == 3)"
            - "second assignment with stale version ${row_v} -> 412 ERR_STALE_VERSION despite capacity remaining"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: statement_immediate_consistency
        claim_type: immediate_consistency
        grounds: [calculations.ledger_balance, endpoints]
        excluded_because:
          difficulty_instance: "compensating_invariant / ledger_post_void_conserves_balance"
          rationale: "Immediate visibility of writes is asserted there by reading the statement in the same request sequence as the mutations (balance 40000 -> 18750 -> 40000 with no delay or reconciliation step)."
