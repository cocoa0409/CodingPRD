          assert:
            - "the first create returns 201 and its Station recompute leaves accessible_source_count == 1 of 2 required, so compliance_score == 100.00 - 25.00 == 75.00 (WATCH)"
            - "${e_stale} == 'ERR_STALE_STATION_VERSION' with HTTP 412 — the payload was otherwise perfectly valid (READY device, uncovered source_type, assigned engineer)"
            - "the refused write incremented nothing: ${sv2} equals ${sv1} + 1, not ${sv1} + 2"
            - "retrying with ${sv2} returns 201; GET /monitoring-assignments for the station reports total_count == 2, both ACTIVE"
            - "the final summary reads accessible_source_count == 2, missing_source_count == 0, compliance_score == 100.00, compliance_posture 'COMPLIANT'"
            - "reusing ${sv2} a second time would fail the same way — each captured version authorises exactly one write"

      - name: occ_rule_filing_create_stale_test_event_blocks_the_blind_amendment
        claim_type: optimistic_concurrency
        grounds:
          - "§1.2.1 concurrency_rules[filing-create-stale-test-event]: parent_entity TestEvent, write_endpoint 'POST /filing-records', occ_field 'expected_test_event_version', error_id ERR_STALE_TEST_EVENT_VERSION, http_status 412"
          - "§1.5 POST /filing-records side effects 'increments TestEvent.version by 1' and 'prior SUBMITTED/ACCEPTED filing for the same event -> REVERSED with reversal_reason SUPERSEDED_BY_AMENDMENT and superseded_filing_id set'"
          - "§1.2 state_machines.TestEvent FILED -> FILED (amendment) and §1.6 ERR_STALE_TEST_EVENT_VERSION (412)"
        distinguishing_aspect: "The OCC field is exactly what stops a blind amendment from silently reversing a filing the officer never read: with the stale version the amendment is 412 and the original filing survives as SUBMITTED, while with the refreshed version the amendment lands and the original flips to REVERSED / SUPERSEDED_BY_AMENDMENT."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 requiring ['PEP'] activated; station KWEA; dev1 READY; ma1 PEP/WXPEP."
