              payload: { measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 550001 }, { measure_code: "HP-DUCT-01", planned_quantity: 1, estimated_cost_cents: 250000 } ], estimated_project_cost_cents: 800001 }
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "GET /rebate-projects/${proj_id}/incentive-quote"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
          assert:
            - "AT the cap (group sum 550000 + 250000 == 800000): ProjectMeasure(HP-HVAC-01).provisional_incentive_cents == 550000 and ProjectMeasure(HP-DUCT-01).provisional_incentive_cents == 250000 — untouched, because Stage 2 prorates only when S > cap"
            - "AT the cap: the first GET /rebate-projects/${proj_id}/incentive-quote returns group_cap_applied == false and residual_cents_assigned_to_measure_code == null"
            - "ONE CENT OVER (group sum 550001 + 250000 == 800001): ProjectMeasure(HP-HVAC-01).provisional_incentive_cents == 550000 (floor(550001 * 800000 / 800001)) and ProjectMeasure(HP-DUCT-01).provisional_incentive_cents == 250000 (residual 800000 - 550000)"
            - "ONE CENT OVER: the second GET /rebate-projects/${proj_id}/incentive-quote returns group_cap_applied == true and residual_cents_assigned_to_measure_code == \"HP-DUCT-01\""
            - "RebateProject.${proj_id}.provisional_total_incentive_cents == 800000 in BOTH cases — the total hides the boundary, only the per-line split and the flag reveal it"
            - "An implementation using >= instead of > is detectable at the exact-cap case: the per-line cents happen to coincide (floor(550000 * 800000 / 800000) == 550000), but it would report group_cap_applied true and residual_cents_assigned_to_measure_code \"HP-DUCT-01\" where the scaffold requires false and null"

      - name: extension_window_inclusive_lower_bound_and_day_limits
        grounds:
          - calculations.reservation_extension_expiry
          - validations.priority_18
          - entities.Reservation.fields.extension_count
          - entities.Reservation.fields.extension_days_granted
          - endpoints.POST_/reservations/{id}/extensions
        distinguishing_aspect: |
          A temporal metric on a third endpoint: the extension window's
          INSTANT of opening, expires_at minus extension_window_days, whose
          lower bound is inclusive. One second before the boundary the request
          is refused with ERR_EXTENSION_WINDOW_NOT_OPEN; at the boundary
          instant exactly it succeeds. The same trigger sequence also pins the
          two other priority-18 boundaries — additional_days one day over
          max_extension_days, and one extension past
          max_extensions_per_reservation.
        test_recipe:
          setup:
            - "An OPEN program with reservation_ttl_days 120, extension_window_days 30, max_extension_days 60 and max_extensions_per_reservation 1."
