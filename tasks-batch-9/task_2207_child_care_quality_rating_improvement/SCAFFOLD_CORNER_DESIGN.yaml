      - name: credential_compliance_reconciles_after_create_link_and_expiry
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.credential_compliance_pct
          - endpoints[POST /staff-credentials/{credential_id}/registry-link]
          - endpoints[GET /providers/{provider_id}/credential-compliance]
        distinguishing_aspect: "provider.credential_compliance_pct walks 0.00 -> 50.00 -> 50.00 -> 100.00 -> 50.00 as a credential is created (UNLINKED contributes nothing), linked VERIFIED, joined by a second UNLINKED row, that row is linked, and finally that row is re-linked as EXPIRED - showing the denominator is always active_staff_fte 2.00 and never the number of rows."
        test_recipe:
          setup:
            - "ENROLLED provider with active_staff_fte 2.00 and no credentials; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Reconcile Center", license_number: "LIC-6111", county_code: "DANE", region_code: "URBAN", licensed_capacity: 40, active_staff_fte: 2.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { pid: $.data.id } }
            - { call: "POST /providers/${pid}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          trigger:
            - { call: "POST /providers/${pid}/staff-credentials", payload: { staff_registry_id: "REG-1", role_type: "DIRECTOR", credential_level: 5, fte: 1.00, employment_status: "ACTIVE" }, as: Provider, as_user_id: "${pid}", captures: { cred1: $.data.id } }
            - { call: "POST /staff-credentials/${cred1}/registry-link", payload: { registry_status: "VERIFIED", verified_on: "2026-08-03T00:00:00Z", expires_on: "2030-01-01T00:00:00Z", credential_level: 5 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers/${pid}/staff-credentials", payload: { staff_registry_id: "REG-2", role_type: "LEAD_TEACHER", credential_level: 4, fte: 1.00, employment_status: "ACTIVE" }, as: Provider, as_user_id: "${pid}", captures: { cred2: $.data.id } }
            - { call: "POST /staff-credentials/${cred2}/registry-link", payload: { registry_status: "VERIFIED", verified_on: "2026-08-03T00:00:00Z", expires_on: "2030-01-01T00:00:00Z", credential_level: 4 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /staff-credentials/${cred2}/registry-link", payload: { registry_status: "EXPIRED" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "after trigger 1 Provider.${pid}.credential_compliance_pct == 0.00 and StaffCredential.${cred1}.registry_status == UNLINKED"
            - "after trigger 2 Provider.${pid}.credential_compliance_pct == 50.00"
            - "after trigger 3 Provider.${pid}.credential_compliance_pct == 50.00 (the new UNLINKED row adds nothing to the numerator)"
            - "after trigger 4 Provider.${pid}.credential_compliance_pct == 100.00 and GET /providers/${pid}/credential-compliance returns the same 100.00"
            - "after trigger 5 Provider.${pid}.credential_compliance_pct == 50.00 with StaffCredential.${cred2}.registry_status == EXPIRED"
            - "GET /staff-credentials?provider_id=${pid}&registry_status=VERIFIED returns total_count == 1 with data[0].id == ${cred1}"

      - name: provider_list_pagination_and_filter_stay_consistent_under_mutation
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /providers]
          - consistency_model
          - entities.Provider.status
        distinguishing_aspect: "With two ENROLLED providers and one still APPLIED, GET /providers?status=ENROLLED&limit=1 reports total_count 2 and has_more true on offset 0 and has_more false on offset 1, and a third approval made between the two pages is immediately reflected as total_count 3 on the next request - the filter never counts the APPLIED row."
        test_recipe:
          setup:
            - "Three providers created, the first two APPROVEd to ENROLLED, the third left APPLIED; a fourth provider is created and approved between page reads; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Page One", license_number: "LIC-6121", county_code: "DANE", region_code: "URBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { p1: $.data.id } }
            - { call: "POST /providers/${p1}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Page Two", license_number: "LIC-6122", county_code: "DANE", region_code: "URBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { p2: $.data.id } }
            - { call: "POST /providers/${p2}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Still Applied", license_number: "LIC-6123", county_code: "IOWA", region_code: "RURAL", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { p3: $.data.id } }
          trigger:
            - { call: "GET /providers", payload: { status: "ENROLLED", limit: 1, offset: 0 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /providers", payload: { status: "ENROLLED", limit: 1, offset: 1 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "POST /providers", payload: { legal_name: "Page Three", license_number: "LIC-6124", county_code: "DANE", region_code: "URBAN", licensed_capacity: 30, active_staff_fte: 1.00 }, as: StateAdministrator, as_user_id: "admin_ops_1", captures: { p4: $.data.id } }
            - { call: "POST /providers/${p4}/enrollment-decisions", payload: { decision: "APPROVE" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
            - { call: "GET /providers", payload: { status: "ENROLLED", limit: 2, offset: 2 }, as: StateAdministrator, as_user_id: "admin_ops_1" }
          assert:
            - "trigger 1 returns HTTP 200 with total_count == 2, has_more == true and exactly 1 row"
            - "trigger 2 returns total_count == 2, has_more == false and exactly 1 row; the two pages together are exactly {${p1}, ${p2}} with no duplicate"
            - "neither page contains ${p3}, and GET /providers?status=APPLIED returns total_count == 1 with data[0].id == ${p3}"
            - "trigger 5 returns total_count == 3, has_more == false and exactly 1 row whose id is one of {${p1}, ${p2}, ${p4}}"
            - "GET /providers?county_code=DANE returns total_count == 3 covering {${p1}, ${p2}, ${p4}}"

