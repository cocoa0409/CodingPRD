  # ===================================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: prepare_blocked_until_institution_closed_in_receivership
        grounds:
          - validations[priority=46]
          - state_machines.InsuranceDetermination.DRAFT_to_PREPARED
          - state_machines.Institution.RESOLUTION_READY_to_CLOSED_IN_RECEIVERSHIP
          - errors[ERR_INSTITUTION_NOT_CLOSED]
        distinguishing_aspect: |
          Entity pair InsuranceDetermination -> Institution: the determination's own status is a
          perfectly legal DRAFT, and nothing about the determination changes between the two prepare
          calls. The only thing that changes is the OTHER entity's status
          (RESOLUTION_READY -> CLOSED_IN_RECEIVERSHIP). An implementation that validates only the
          determination's own state passes the first call and fails this test.
        test_recipe:
          setup:
            - "Institution 34578 has a STANDARDIZED readiness package, so status == RESOLUTION_READY and readiness_standardized == true — but it has NOT been closed."
            - "Depositor Lena owns one SINGLE account of 30000000 cents, still insurance_status PENDING (the close cascade has not run)."
            - "Lena has an InsuranceDetermination in status DRAFT with method_variant null and revision_round 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "34578", legal_name: "Snake River Guaranty Bank", charter_state: "ID", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { instE_id: $.data.id }
