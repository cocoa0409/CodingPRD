  - section: consistency_model
    instances:
      - name: immediate_read_after_create_consistency
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a created resource is fully readable with all computed/system fields in the very next GET — no lag, no reconciliation delay."
        test_recipe:
          setup: ["Intake worker; one created client"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Imm", residence_county: "CountyA", household_size: 2, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false, vulnerability_factors: ["VETERAN"] }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
          trigger:
            - { call: "GET /clients/${client_id}", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { g_name: "$.data.full_name", g_ver: "$.data.version", g_status: "$.data.status" } }
          assert:
            - "GET returns full_name == 'Cli Imm', version == 1, status == ACTIVE, vulnerability_factors == ['VETERAN'] — identical to the create response, in the same request sequence"
