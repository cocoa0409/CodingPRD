      - name: usage_record_dated_outside_the_open_cycle_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors.ERR_USAGE_DATE_OUT_OF_CYCLE
          - entities.Subscriber.fields.cycle_start_date
        distinguishing_aspect: |
          The cycle window is half-open and anchored on cycle_start_date 2026-08-02, so 2026-09-01 - the
          first day of the next window and a date already in the past for a clock at 2026-09-02 - is
          refused with 409 rather than silently stored with in_current_cycle false. Because the record is
          rejected, the subscriber's version and usage roll-up must be untouched.
        test_recipe:
          setup:
            - "ACTIVE Tower / ACTIVE Sector / STD50 with Subscriber SUB1 installed at clock 2026-08-02T00:00:00Z, so cycle_start_date == 2026-08-02 and the open window is [2026-08-02, 2026-09-01)."
            - "One in-cycle usage record for 2026-08-03 (100.0 GB down, 10.0 GB up) is accepted, then the clock is advanced to 2026-09-02T00:00:00Z WITHOUT closing the cycle."
