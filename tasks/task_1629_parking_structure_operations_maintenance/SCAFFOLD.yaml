scenario: 'Parking Structure Operations & Maintenance (parking garage operator): access/revenue

  control equipment & rate configuration, monthly parker agreements & badge/transponder

  issuance, structural inspection & sealant/repair capital planning, lighting/security

  patrol & incident reporting, cleaning/sweeping & drain maintenance schedule, EV charger

  installation & utilization, event parking surge & staffing, revenue reconciliation &

  theft controls

  '
domain_name: parking-structure-ops
api_prefix: /ops
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
  - optimistic_concurrency
  - ops_run_checkpoint
  - cascading_side_effects
  - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 17
  state_machine_count: 16
  calculation_count: 12
  endpoint_count: 110
  error_code_count: 37
  role_count: 7
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Facility
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Facility display name
  - name: total_spaces
    type: integer
    source: input
    description: Total physical parking spaces
    constraints: '> 0'
  - name: monthly_capacity
    type: integer
    source: input
    description: Maximum monthly agreements consuming a slot (status ACTIVE or SUSPENDED)
    constraints: '>= 0'
  - name: event_pool_spaces
    type: integer
    source: input
    description: Maximum combined presale_allocation across mutually overlapping CONFIRMED/ACTIVE events
    constraints: '>= 0'
  - name: levy_pct
    type: number
    source: input
    description: Fraction of daily gross collected credited to the capital reserve at close-of-business
    default: 0.1
    constraints: 0 <= levy_pct <= 1
  - name: posture
    type: enum
    source: system
    description: Operating posture gate
    constraints: NORMAL | EVENT_SURGE | RESTRICTED | CLOSED_TEMPORARY | DECOMMISSIONED; initial NORMAL
  - name: closed_spaces
    type: integer
    source: computed
    description: Spaces out of service due to CRITICAL inspections or IN_PROGRESS repair projects
    default: 0
  - name: occupied_spaces
    type: integer
    source: computed
    description: Count of ParkingSession rows with occupancy_state PARKED; derived on read
    default: 0
  - name: monthly_allocated
    type: integer
    source: computed
    description: Count of MonthlyAgreement rows with agreement_status IN {ACTIVE, SUSPENDED}; derived on read
    default: 0
  - name: capital_reserve_cents
    type: integer
    source: computed
    description: 'Capital reserve ledger balance: sum of close-of-business levies minus repair draws plus refunded draws on cancel'
    default: 0
  - name: deposit_liability_cents
    type: integer
    source: computed
    description: Sum of deposit_cents over credentials with credential_status IN {ACTIVE, LOST_REPORTED}; issue/return/revoke/replace adjust
    default: 0
  - name: cumulative_collected_cents
    type: integer
    source: computed
    description: Lifetime sum of settled_fee_cents at settle minus refunded amounts at refund
    default: 0
  - name: last_close_date
    type: string
    source: system
    description: ISO date (YYYY-MM-DD) of the most recent close-of-business run; null before first run
    default: null
