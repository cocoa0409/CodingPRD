            - "Product.${prod_id}.formula_status == \"DRAFT\""
            - "Product.${prod_id}.testing_plan_status == \"NONE\""

      - name: testing_plan_activation_on_an_uncleared_formula_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_10
          - errors.ERR_INVALID_PRODUCT_STATE
          - endpoints."POST /gfco/products/{productId}/testing-plan"
        distinguishing_aspect: |
          The testing plan may only be activated from formula_status == CLEARED, so a
          REJECTED formula - a legal state for re-review but not for planning - is refused
          with a product state conflict even though the OCC version supplied is current. No
          threshold may be computed.
        test_recipe:
          setup:
            - "One applicant, one facility, one supplier and one DRAFT ingredient linked to one product."
            - "The reviewer has REJECTED the formula, so formula_status is REJECTED."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
