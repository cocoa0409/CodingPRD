              as: PermitDesk
              captures: { permit_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${permit_id}", hauler_id: "${hauler_id}", sequence_no: 1, corridor_id: "TX-I35", state_code: "TX", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z" }
              as: PermitDesk
