# §1.9 Scaffold Corner Design — breadth coverage of §1.1–§1.7 claims
# not already exercised by §1.8. claim_type/section values follow
# references/claim-extraction-guide.md.
scaffold_corner_design:

  # ================================================== entities
  - section: entities
    instances:
      - name: entity_creation_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.ContestEvent.fields.max_entries_per_contestant, entities.Entry.fields.requires_prejudging, entities.Contestant.fields.accessibility_needs]
        distinguishing_aspect: "Omitted optional inputs take declared defaults (2 / true / []), system fields id/version=1/created_at are server-minted, and a client-supplied id or version in the payload is rejected as an unknown field."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id, cont_v: $.data.version } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id, c1_acc: $.data.accessibility_needs } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e_rp: $.data.requires_prejudging, e_safe: $.data.safety_status } }
          trigger:
            - { call: "GET /contest-events/${cont}", payload: {}, as: ContestLead, captures: { cont_max: $.data.max_entries_per_contestant, cont_res: $.data.budget_reserved_cents, cont_avail: $.data.budget_available_cents } }
          assert:
            - "ContestEvent.max_entries_per_contestant == 2 (default applied), version == 1 at creation (captured before the transition bump)"
            - "Contestant.accessibility_needs == [] (default)"
            - "Entry.requires_prejudging == true (default) and safety_status == PENDING on creation"
            - "budget_reserved_cents == 0 and budget_available_cents == 50000"

      - name: entry_create_missing_required_title_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /entries without the required `title` fails with ERR_VALIDATION before any state or business check runs."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN with one category; contestant exists"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_VALIDATION"

      - name: slot_end_before_start_returns_400
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.PreJudgingSlot.fields.end_at]
        distinguishing_aspect: "A slot with end_at <= start_at is a malformed-range 400, distinct from the overlap 409 and outside-window 422."
        test_recipe:
          setup: ["Contest with one category"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
          trigger:
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P1", start_at: "2026-08-15T11:00:00Z", end_at: "2026-08-15T11:00:00Z" }, as: ContestLead, captures: { err: $.data.error_id } }
          assert:
            - "400 ERR_VALIDATION (equal endpoints violate end_at > start_at)"

      - name: get_missing_entry_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but non-existent entry id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /entries/00000000-0000-0000-0000-000000000000", payload: {}, as: ContestLead, captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"

  # ================================================== state_machines
  - section: state_machines
    instances:
      - name: contest_creation_initial_state_and_open_requires_category
        claim_type: initial_state
        grounds: [state_machines.ContestEvent.SETUP_to_REGISTRATION_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A new contest starts in SETUP, and opening registration with zero categories violates the >=1-category precondition."
        test_recipe:
          setup: ["Contest created, no categories"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id, cont_st: $.data.status } }
          trigger:
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead, captures: { err: $.data.error_id } }
          assert:
            - "ContestEvent.status == SETUP at creation"
            - "Transition rejected: 409 ERR_INVALID_STATE"

      - name: contest_transition_skip_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ContestEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SETUP -> JUDGING is not a declared edge; phase skipping is rejected."
        test_recipe:
          setup: ["Contest SETUP with one category"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead }
          trigger:
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead, captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_INVALID_STATE; contest remains SETUP"

      - name: entry_create_when_registration_closed
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6]", "errors[ERR_REGISTRATION_NOT_OPEN]"]
        distinguishing_aspect: "Entry creation after REGISTRATION_CLOSED is rejected with the registration-specific error, not generic state."
        test_recipe:
          setup: ["Contest REGISTRATION_CLOSED; category OPEN; contestant exists"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_REGISTRATION_NOT_OPEN"

      - name: withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Entry, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw and a disqualify attempt are both rejected."
        test_recipe:
          setup: ["Entry SUBMITTED then withdrawn"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/withdraw", payload: {}, as: Contestant, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /entries/${e}/withdraw", payload: {}, as: Contestant, as_user_id: "${c1}", captures: { err1: $.data.error_id } }
            - { call: "POST /entries/${e}/disqualify", payload: {}, as: ContestLead, captures: { err2: $.data.error_id } }
          assert:
            - "Second withdraw: 409 ERR_INVALID_STATE"
            - "Disqualify of terminal entry: 409 ERR_INVALID_STATE"

      - name: advance_skipping_on_stage_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PerformanceSlot, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "QUEUED -> COMPLETED skips ON_STAGE and is rejected; the stage walk is strictly ordered."
        test_recipe:
          setup: ["Contest JUDGING; entry queued at sequence 1 (safety approved, consent granted, requires_prejudging false)"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps: $.data.id } }
          trigger:
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "COMPLETED" }, as: StageManager, captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_INVALID_STATE; slot remains QUEUED"

      - name: prejudging_flow_gates_craftsmanship_phase
        claim_type: side_effect_execution
        grounds: [state_machines.PreJudgingSlot.BOOKED_to_COMPLETED, state_machines.Entry.SAFETY_APPROVED_to_PREJUDGED]
        distinguishing_aspect: "A CRAFTSMANSHIP sheet is rejected while the entry is only SAFETY_APPROVED; completing the booked slot flips the entry to PREJUDGED and the same sheet create then succeeds."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; entry (requires_prejudging default true) SAFETY_APPROVED; judge assigned to the category; one OPEN slot P1 10:00-11:00"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P1", start_at: "2026-08-15T10:00:00Z", end_at: "2026-08-15T11:00:00Z" }, as: ContestLead, captures: { sl: $.data.id } }
          trigger:
            - { call: "POST /scoresheets", payload: { entry_id: "${e}", phase: "CRAFTSMANSHIP", craftsmanship: 8, accuracy: 8, presentation: 8 }, as: Judge, as_user_id: "${j1}", captures: { err: $.data.error_id } }
            - { call: "POST /prejudging-slots/${sl}/book", payload: { entry_id: "${e}" }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /prejudging-slots/${sl}/complete", payload: {}, as: ContestLead, captures: { sl_st: $.data.status } }
            - { call: "GET /entries/${e}", payload: {}, as: ContestLead, captures: { e_st: $.data.status } }
            - { call: "POST /scoresheets", payload: { entry_id: "${e}", phase: "CRAFTSMANSHIP", craftsmanship: 8, accuracy: 8, presentation: 8 }, as: Judge, as_user_id: "${j1}", captures: { s_st: $.data.status } }
          assert:
            - "Before completion: 409 ERR_INVALID_STATE (CRAFTSMANSHIP requires PREJUDGED)"
            - "Slot COMPLETED and Entry.status == PREJUDGED (bubble side effect)"
            - "After completion: scoresheet created with status DRAFT"

      - name: consent_required_on_stage_queue
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7]", "errors[ERR_CONSENT_REQUIRED]", entities.Contestant.fields.consents]
        distinguishing_aspect: "Stage queueing without a GRANTED LIVESTREAM consent item fails; granting the consent item (cyclic upsert on Contestant.consents) unlocks the identical request."
        test_recipe:
          setup: ["Contest JUDGING; entry SAFETY_APPROVED (requires_prejudging false); NO consent granted"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
          trigger:
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { err: $.data.error_id } }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps_st: $.data.status } }
          assert:
            - "Without consent: 409 ERR_CONSENT_REQUIRED"
            - "After grant: 201, slot QUEUED"

      - name: consent_revoke_regrant_cycle
        claim_type: valid_transition
        grounds: [entities.Contestant.fields.consents]
        distinguishing_aspect: "Consent items cycle GRANTED -> REVOKED -> GRANTED via repeated upsert; revocation of LIVESTREAM re-blocks stage advance for an already-queued entry."
        test_recipe:
          setup: ["Contest JUDGING; entry STAGE_QUEUED (consent was granted at queue time); slot QUEUED"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps: $.data.id } }
          trigger:
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: false }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "ON_STAGE" }, as: StageManager, captures: { err: $.data.error_id } }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "ON_STAGE" }, as: StageManager, captures: { ps_st: $.data.status } }
          assert:
            - "After revoke: advance rejected 409 ERR_CONSENT_REQUIRED (consent is re-checked at advance time, not only at queue time)"
            - "After re-grant: advance succeeds, slot ON_STAGE"

      - name: requires_prejudging_gate_on_stage_queue
        claim_type: precondition_enforcement
        grounds: [state_machines.Entry.PREJUDGED_to_STAGE_QUEUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An entry with requires_prejudging == true cannot jump from SAFETY_APPROVED to STAGE_QUEUED; only PREJUDGED entries queue."
        test_recipe:
          setup: ["Contest JUDGING; entry SAFETY_APPROVED with requires_prejudging == true (default); consent granted"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
          trigger:
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_INVALID_STATE (must complete pre-judging first)"

  # ================================================== calculations
  - section: calculations
    instances:
      - name: placement_tiebreak_craftsmanship_mean
        claim_type: correct_result
        grounds: [calculations.placement_rank_assignment, calculations.entry_final_score, entities.ScoreSheet.fields.sheet_total]
        distinguishing_aspect: "Two entries tie on final_score 7.00; the craftsmanship_mean tie-break (7.67 vs 6.67) decides rank 1 — and sheet_total itself is verified at 7.90 for inputs (9,8,5)."
        test_recipe:
          setup:
            - "WEIGHTED_MEAN category, 3 judges, entries A and B PERFORMED"
            - "A sheets: (9,8,5)->7.9, (9,8,5)->7.9, (5,9,0)->5.2 ; B sheets: (7,8,8)->7.5, (7,8,8)->7.5, (6,6,6)->6.0 ; both means 7.00"
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 100000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 100000 }, as: ContestLead, captures: { cat: $.data.id } }
