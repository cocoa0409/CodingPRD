        distinguishing_aspect: "Rendering a decision while carrying an expected_treatment_plan_version observed before the plan advanced is rejected with 412 ERR_PLAN_VERSION_STALE, and the stale check fires before the clinical score gate — so a 412 rather than a 422 is the marker that the OCC check ran first."
