# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per the claim-extraction guide.
# §1.8-covered corners appear as excluded_because stubs. Bogus ids below are
# well-formed UUIDs that simply do not exist in the empty test database.
scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: c_zone_create_defaults
        claim_type: creation
        grounds:
          - "entities.Zone"
        distinguishing_aspect: "POST /zones with all required fields returns 201 with system defaults applied."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Prime Zone", zone_code: "Z-PRI", bond_coverage_cents: 5000000 }
              as: ZoneOperator
              captures: { z: $.data.id, zs: $.data.status, zp: $.data.compliance_posture, ze: $.data.deferred_duty_exposure_cents, zc: $.data.active_lot_count, zv: "$.data.version" }
          trigger: []
          assert:
            - "Zone.${z}.status == ACTIVE and compliance_posture == NORMAL"
            - "Zone.${z}.deferred_duty_exposure_cents == 0 and active_lot_count == 0"
            - "Zone.${z}.version == 1 and id is a server-minted UUID"

      - name: c_zone_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Zone.fields.bond_coverage_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required bond_coverage_cents yields ERR_INVALID_REQUEST (400); no zone persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "No Bond Zone", zone_code: "Z-NB" }
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
            - "GET /zones returns total_count == 0"

      - name: c_zone_create_unknown_field_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Strict schema: an unknown body field (version) is rejected with ERR_INVALID_REQUEST rather than silently ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "Sneaky Zone", zone_code: "Z-SNK", bond_coverage_cents: 100, version: 9 }
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400); client-supplied system fields are never accepted"

      - name: c_admission_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_ADMISSION_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but nonexistent admission id returns ERR_ADMISSION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /zones/admissions/00000000-0000-4000-8000-0000000000aa"
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ADMISSION_NOT_FOUND (http 404)"

      - name: c_child_resources_not_found_return_404
        claim_type: not_found
        grounds:
          - "errors[ERR_LOT_NOT_FOUND]"
          - "errors[ERR_WITHDRAWAL_NOT_FOUND]"
          - "errors[ERR_WEEKLY_ENTRY_NOT_FOUND]"
          - "errors[ERR_RECONCILIATION_NOT_FOUND]"
          - "errors[ERR_BADGE_NOT_FOUND]"
          - "errors[ERR_ACCESS_EVENT_NOT_FOUND]"
          - "errors[ERR_MANIPULATION_ORDER_NOT_FOUND]"
        distinguishing_aspect: "Each remaining child resource type reports its own domain-specific 404 error id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /zones/lots/00000000-0000-4000-8000-000000000001"
              as: ZoneOperator
              captures: { e_lot: "$.data.error_id" }
            - call: "GET /zones/withdrawals/00000000-0000-4000-8000-000000000002"
              as: ZoneOperator
              captures: { e_w: "$.data.error_id" }
            - call: "GET /zones/weekly-entries/00000000-0000-4000-8000-000000000003"
              as: ZoneOperator
              captures: { e_e: "$.data.error_id" }
            - call: "GET /zones/annual-reconciliations/00000000-0000-4000-8000-000000000004"
              as: ZoneOperator
              captures: { e_r: "$.data.error_id" }
            - call: "GET /zones/access-badges/00000000-0000-4000-8000-000000000005"
              as: ZoneOperator
              captures: { e_b: "$.data.error_id" }
            - call: "GET /zones/access-events/00000000-0000-4000-8000-000000000006"
              as: ZoneOperator
              captures: { e_ev: "$.data.error_id" }
            - call: "GET /zones/manipulation-orders/00000000-0000-4000-8000-000000000007"
              as: ZoneOperator
              captures: { e_m: "$.data.error_id" }
          assert:
            - "e_lot == ERR_LOT_NOT_FOUND; e_w == ERR_WITHDRAWAL_NOT_FOUND; e_e == ERR_WEEKLY_ENTRY_NOT_FOUND"
            - "e_r == ERR_RECONCILIATION_NOT_FOUND; e_b == ERR_BADGE_NOT_FOUND; e_ev == ERR_ACCESS_EVENT_NOT_FOUND; e_m == ERR_MANIPULATION_ORDER_NOT_FOUND"
            - "all seven responses use http 404"

      - name: c_lots_filtered_by_admission_id
        claim_type: listing
        grounds:
          - "entities.InventoryLot.fields.admission_id"
        distinguishing_aspect: "Filtered list reverse-reachability: GET /zones/lots?admission_id= returns exactly the lots of that admission."
        test_recipe:
          setup:
            - "Zone with two ADMITTED admissions (each produces exactly one lot)"
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Filter Zone", zone_code: "Z-FLT", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy A", hts_code: "0401.10", quantity: 2, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a1: "$.data.id" }
            - call: "POST /zones/admissions/${a1}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a1}/admit"
              as: CustomsOfficer
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy B", hts_code: "0401.10", quantity: 3, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a2: "$.data.id" }
            - call: "POST /zones/admissions/${a2}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a2}/admit"
              as: CustomsOfficer
          trigger:
            - call: "GET /zones/lots?admission_id=${a1}"
              as: ZoneOperator
              captures: { lot1: "$.data[0].id", lot1_adm: "$.data[0].admission_id" }
          assert:
            - "GET /zones/lots?admission_id=${a1} returns total_count == 1 and the lot's admission_id == ${a1}"
            - "GET /zones/lots?zone_id=${z} returns total_count == 2"

      - name: c_access_event_default_occurred_at
        claim_type: defaults
        grounds:
          - "entities.ZoneAccessEvent.fields.occurred_at"
        distinguishing_aspect: "Omitting occurred_at defaults it to the logical clock (startup default 2026-08-01T00:00:00Z)."
        test_recipe:
          setup: ["Zone; ACTIVE badge for 'Ada Lovelace' valid [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z]"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Event Zone", zone_code: "Z-EVT", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Ada Lovelace", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ZoneOperator
              captures: { b: "$.data.id" }
          trigger:
            - call: "POST /zones/access-events"
              payload: { zone_id: "${z}", badge_id: "${b}", direction: "IN" }
              as: GateOfficer
              captures: { ev: $.data.id, ts: "$.data.occurred_at" }
          assert:
            - "ZoneAccessEvent.${ev}.occurred_at == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"

      - name: c_access_event_immutable_shape
        claim_type: immutability
        grounds:
          - "entities.ZoneAccessEvent"
        distinguishing_aspect: "common_fields:false append-only event: response carries id and created_at but no version/updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup: ["Zone; ACTIVE badge covering the default clock"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Event Zone 2", zone_code: "Z-EV2", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Alan Turing", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ZoneOperator
              captures: { b: "$.data.id" }
          trigger:
            - call: "POST /zones/access-events"
              payload: { zone_id: "${z}", badge_id: "${b}", direction: "IN", occurred_at: "2026-08-02T08:00:00Z" }
              as: GateOfficer
              captures: { ev: "$.data.id" }
          assert:
            - "the creation response for ZoneAccessEvent.${ev} contains id and created_at but no version and no updated_at keys"
            - "§1.5 declares no PUT/PATCH/DELETE for /zones/access-events — the log is append-only"

      - name: c_badge_invalid_window_rejected
        claim_type: type_constraints
        grounds:
          - "entities.AccessBadge.fields.valid_until"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "valid_from == valid_until violates the strictly-before rule -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Zone"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Badge Check Zone", zone_code: "Z-BCK", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
          trigger:
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Bad Window", valid_from: "2026-08-10T00:00:00Z", valid_until: "2026-08-10T00:00:00Z" }
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

  # =================================================================
  - section: state_machines
    instances:
      - name: c_admission_initial_state_draft
        claim_type: initial_state
        grounds:
          - "entities.Admission.fields.status"
          - "state_machines.Admission.DRAFT_to_SUBMITTED"
        distinguishing_aspect: "A newly created admission starts in DRAFT with version 1 and null admission_date."
        test_recipe:
          setup: ["Zone"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Init Zone", zone_code: "Z-INI", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
          trigger:
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: $.data.id, st: $.data.status, ad: $.data.admission_date, v: "$.data.version" }
          assert:
            - "Admission.${a}.status == DRAFT, version == 1, admission_date is null"

      - name: c_admit_after_cancel_returns_invalid_transition
        claim_type: invalid_transition
        grounds:
          - "state_machines.Admission.DRAFT_to_CANCELLED"
          - "errors[ERR_ADMISSION_INVALID_TRANSITION]"
        distinguishing_aspect: "CANCELLED is terminal: admit after cancel fails with ERR_ADMISSION_INVALID_TRANSITION and no lot is created."
        test_recipe:
          setup: ["Zone; admission created and cancelled from DRAFT"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Term Zone", zone_code: "Z-TRM", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/cancel"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ADMISSION_INVALID_TRANSITION (http 409)"
            - "Admission.${a}.status remains CANCELLED; GET /zones/lots?admission_id=${a} total_count == 0"

      - name: c_manipulation_cancel_releases_reservation
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ManipulationOrder.APPROVED_to_CANCELLED"
        distinguishing_aspect: "Cancelling an APPROVED order releases the reservation: reserved_quantity returns to 0 and quantity_on_hand is untouched."
        test_recipe:
          setup: ["Zone; lot (qty 100, unit 10000, HTS 8542.31, NPF); manipulation order input 40 approved (lot.reserved_quantity == 40)"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Reserve Zone", zone_code: "Z-RSV", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 100, unit_value_cents: 10000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/manipulation-orders"
              payload: { zone_id: "${z}", source_lot_id: "${lot}", input_quantity: 40, output_hts_code: "9503.00", output_quantity: 20, value_added_cents: 50000, output_description: "Kitting" }
              as: Importer
              as_user_id: "imp-1"
              captures: { m: "$.data.id" }
            - call: "POST /zones/manipulation-orders/${m}/approve"
              as: ZoneOperator
          trigger:
            - call: "POST /zones/manipulation-orders/${m}/cancel"
              as: Importer
              as_user_id: "imp-1"
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { onhand: $.data.quantity_on_hand, rsv: $.data.reserved_quantity, lst: "$.data.status" }
          assert:
            - "ManipulationOrder.${m}.status == CANCELLED"
            - "InventoryLot.${lot}.reserved_quantity == 0 (released) and quantity_on_hand == 100 (never debited)"
            - "InventoryLot.${lot}.status == IN_ZONE"

      - name: c_manipulation_complete_creates_output_lot
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ManipulationOrder.APPROVED_to_COMPLETED"
          - "calculations.manipulation_output_valuation"
        distinguishing_aspect: "Completion creates the output lot with pinned valuation: unit 24000 = round((round(100x10000) + 200000)/50); output inherits the source lot's zone_status and carries source_manipulation_id."
        test_recipe:
          setup: ["Zone; lot (qty 100, unit 10000, HTS 8542.31, NPF); approved manipulation input 100 -> 50 units HTS 9503.00 with value_added 200000"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Output Zone", zone_code: "Z-OUT", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 100, unit_value_cents: 10000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/manipulation-orders"
              payload: { zone_id: "${z}", source_lot_id: "${lot}", input_quantity: 100, output_hts_code: "9503.00", output_quantity: 50, value_added_cents: 200000, output_description: "Assembled toys" }
              as: Importer
              as_user_id: "imp-1"
              captures: { m: "$.data.id" }
            - call: "POST /zones/manipulation-orders/${m}/approve"
              as: ZoneOperator
          trigger:
            - call: "POST /zones/manipulation-orders/${m}/complete"
              as: Importer
              as_user_id: "imp-1"
              captures: { mst: $.data.status, mout: "$.data.output_lot_id" }
            - call: "GET /zones/lots?source_manipulation_id=${m}"
              as: ZoneOperator
              captures: { ol: "$.data[0].id", ol_unit: "$.data[0].unit_value_cents", ol_hts: "$.data[0].hts_code", ol_zs: "$.data[0].zone_status", ol_adm: "$.data[0].admission_id" }
            - call: "GET /zones/lots/${lot}"
              as: ZoneOperator
              captures: { src_status: $.data.status, src_consumed: "$.data.cumulative_consumed" }
          assert:
            - "ManipulationOrder.${m}.status == COMPLETED and output_lot_id == ${ol}"
            - "output lot: unit_value_cents == 24000, hts_code == 9503.00, zone_status == NON_PRIVILEGED_FOREIGN, admitted_quantity == 50, admission_id is null"
            - "source lot: status == DEPLETED and cumulative_consumed == 100"

      - name: c_withdrawal_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Withdrawal.FILED_to_DUTY_PAID"
          - "errors[ERR_WITHDRAWAL_INVALID_TRANSITION]"
        distinguishing_aspect: "DUTY_PAID is terminal: cancel afterwards fails with ERR_WITHDRAWAL_INVALID_TRANSITION; nothing is restored."
        test_recipe:
          setup: ["Zone; lot (qty 5, unit 1000, HTS 0401.10, NPF); CONSUMPTION withdrawal qty 2 filed and duty paid"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Lock Zone", zone_code: "Z-LCK", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "CONSUMPTION", quantity: 2 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w: "$.data.id" }
            - call: "POST /zones/withdrawals/${w}/file"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/withdrawals/${w}/pay-duty"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/withdrawals/${w}/cancel"
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_WITHDRAWAL_INVALID_TRANSITION (http 409)"
            - "Withdrawal.${w}.status remains DUTY_PAID; InventoryLot.${lot}.quantity_on_hand remains 3"

      - name: c_badge_suspend_reinstate_cycle
        claim_type: invalid_transition
        grounds:
          - "state_machines.AccessBadge.ACTIVE_to_SUSPENDED"
          - "state_machines.AccessBadge.SUSPENDED_to_ACTIVE"
          - "errors[ERR_BADGE_INVALID_TRANSITION]"
        distinguishing_aspect: "ACTIVE -> SUSPENDED -> ACTIVE cycle is legal; REVOKED is terminal and a later reinstate attempt fails."
        test_recipe:
          setup: ["Zone; ACTIVE badge for 'Grace Hopper'"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Cycle Badge Zone", zone_code: "Z-CB", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Grace Hopper", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ZoneOperator
              captures: { b: "$.data.id" }
          trigger:
            - call: "POST /zones/access-badges/${b}/transition"
              payload: { to_status: "SUSPENDED" }
              as: ZoneOperator
              captures: { s1: "$.data.status" }
            - call: "POST /zones/access-badges/${b}/transition"
              payload: { to_status: "ACTIVE" }
              as: ZoneOperator
              captures: { s2: "$.data.status" }
            - call: "POST /zones/access-badges/${b}/transition"
              payload: { to_status: "REVOKED" }
              as: ZoneOperator
              captures: { s3: "$.data.status" }
            - call: "POST /zones/access-badges/${b}/transition"
              payload: { to_status: "ACTIVE" }
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "cycle: status SUSPENDED then ACTIVE again (loop is legal)"
            - "after REVOKED: status == REVOKED; a further transition -> ERR_BADGE_INVALID_TRANSITION (http 409)"

      - name: c_entry_filed_returned_to_open
        claim_type: invalid_transition
        grounds:
          - "state_machines.WeeklyEntry.FILED_to_OPEN"
          - "errors[ERR_ENTRY_INVALID_TRANSITION]"
        distinguishing_aspect: "Customs may return a FILED entry to OPEN (cycle) and it can be re-filed; but ACCEPTED is terminal and a later transition fails."
        test_recipe:
          setup: ["Zone; lot (qty 10, unit 1221, HTS 8708.29, NPF); entry week [2026-07-27, 2026-08-03); attached withdrawal qty 1 FILED; entry FILED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Entry Cycle Zone", zone_code: "Z-EC", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
