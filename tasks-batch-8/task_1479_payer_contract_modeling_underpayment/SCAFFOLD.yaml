    code: 201
    input: [contract_id, proposed_terms, projected_volume_mix, expected_contract_version]
    output: ContractProposal
    side_effects:
      - "status = DRAFT, round_number = 1"
      - "Prior open (DRAFT/MODELED/SUBMITTED/COUNTERED) proposal on the same contract -> WITHDRAWN (its version +1)"
      - "increments PayerContract.version by 1"
  - method: GET
    path: "/api/contract-proposals/{id}"
    description: "Get a proposal"
    roles: [ContractAnalyst, ContractManager, RevenueIntegrityAnalyst, RecoveryManager, FinanceDirector, SystemAdmin, Auditor]
    code: 200
    input: []
    output: ContractProposal
    side_effects: []
  - method: GET
    path: "/api/contract-proposals"
    description: "List proposals"
    roles: [ContractAnalyst, ContractManager, RevenueIntegrityAnalyst, RecoveryManager, FinanceDirector, SystemAdmin, Auditor]
    code: 200
    input: ["contract_id?", "status?"]
    output: "ContractProposal[]"
    side_effects: []
  - method: POST
    path: "/api/contract-proposals/{id}/run_model"
