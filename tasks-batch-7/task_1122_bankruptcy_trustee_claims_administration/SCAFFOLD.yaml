scenario: |
  1122. Bankruptcy Trustee & Claims Administration (chapter 7 panel trustee): case assignment & asset investigation, claims register & bar date administration, claim objection & allowance determination, preference/avoidance action analysis & demand, asset liquidation & auction approval, distribution waterfall by priority class, trustee compensation calculation & court approval, final report & case closing

domain_name: bankruptcy-trustee-claims
api_prefix: /trustee

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: Ledger reconciliation        # claims register vs. distribution waterfall: two views of the same dollars must reconcile exactly
  secondary_archetype: Quota / allocation         # waterfall allocation of finite estate funds across priority classes with pro-rata splits
  complexity_layers:
    - dual_variant_calculation                    # trustee commission: DISBURSED-basis (§326 actual) vs PROPOSED-basis (fee application estimate)
    - rate_threshold_triggers                     # §326(a) tiered commission 25%/10%/5%/3% at exact dollar breakpoints
    - cascading_side_effects                      # claim allowance -> reserve recompute -> plan feasibility -> dividend amount
    - optimistic_concurrency                      # OCC on Case.version guards plan approval / fee application against stale case state
    - derived_field_reconciliation                # Case.estate_cash_on_hand_cents, Case.allowed_claims_total_cents, Class.paid_total_cents
    - temporal_windowing                          # bar date window [claim_bar_date, +INF); preference lookback windows 90d / 1y insider
    - waterfall_allocation                        # distribution proceeds cascade through priority classes with per-class pro-rata remainder rules
    - scheduled_actions                           # auction sale only becomes final after objection window elapses

  entity_topology: hierarchical                   # Case is the root aggregate; claims, assets, objections, actions, sales, plans, fees all hang off it
  state_machine_shape: cyclic                     # Claim review loop (FILED -> UNDER_REVIEW -> OBJECTED -> ALLOWED -> UNDER_REVIEW on reconsideration) + parallel dimensions on DistributionPlan
  relationship_patterns:
    - one_to_many                                 # Case -> Claim / Asset / AvoidanceAction / FeeApplication / DistributionPlan
    - many_to_many                                # Claim x AuctionSale via Dividend; Asset x AvoidanceAction via recovery credits
    - cross_aggregate                             # Dividend references Claim AND DistributionPlan; RecoveryDeposit references AvoidanceAction AND Case
    - self_referential                            # Claim.reclassified_from_claim_id (a claim re-noticed under a new class)
  role_model: segregation_of_duties               # Trustee files fee application; only Court approves it. Trustee proposes plan; only Court confirms. Clerk administers bar date; only Trustee objects.
  consistency_model: immediate                    # all cascades atomic in single request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: input, description: "Court docket number; unique across all cases", constraints: "unique" }
      - { name: debtor_name, type: string, source: input, description: "Debtor full legal name" }
      - { name: filed_on, type: datetime, source: input, description: "Petition filing date (ISO 8601); anchor for preference lookback windows" }
      - { name: district, type: string, source: input, description: "Federal judicial district code, e.g. 'D.Del.'" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSET_INVESTIGATION | CLAIMS_ADMINISTRATION | LIQUIDATION | DISTRIBUTION | FINAL_REPORT | CLOSED | CONVERTED_DISMISSED" }
      - { name: claim_bar_date, type: datetime, source: system, description: "Claims bar date; null until Clerk sets it via set_bar_date" }
      - { name: bar_date_noticed, type: boolean, source: system, default: false, description: "True once Clerk has issued §341/bar-date notice to scheduled creditors" }
      - { name: estate_cash_on_hand_cents, type: integer, source: computed, default: 0, description: "Sum of posted sale proceeds + posted avoidance recoveries - posted dividends - posted fee disbursements; never negative" }
      - { name: allowed_claims_total_cents, type: integer, source: computed, default: 0, description: "Sum of allowed_amount_cents over all Claims with status ALLOWED" }
      - { name: scheduled_unsecured_total_cents, type: integer, source: input, default: 0, description: "Debtor-scheduled general unsecured total (informational; does not gate claims)" }
      - { name: no_asset_report_filed, type: boolean, source: system, default: false, description: "True when trustee reports no assets to administer" }
      - { name: objection_window_days, type: integer, source: input, default: 30, description: "Days a sale order or fee application must sit before becoming effective (court local rule)" }
      - { name: trustee_user_id, type: string, source: input, description: "X-User-ID of the panel Trustee assigned to this case" }

  - name: Creditor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Creditor legal name" }
      - { name: creditor_ref, type: string, source: input, description: "External reference; unique", constraints: "unique" }
      - { name: insider, type: boolean, source: input, default: false, description: "True if creditor is a §101(31) insider of the debtor (drives 1-year preference lookback)" }
      - { name: contact_email, type: string, source: input, description: "Service email" }

  - name: Claim
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning bankruptcy case" }
      - { name: creditor_id, type: string, source: input, description: "FK -> Creditor.id; claimant" }
      - { name: claim_number, type: integer, source: system, description: "Sequential claim-register number within case, assigned at filing in order of received_at (ties broken by Creditor.created_at then created_at)" }
      - { name: received_at, type: datetime, source: input, description: "Timestamp the proof of claim was received by the clerk" }
      - { name: filed_amount_cents, type: integer, source: input, description: "Face amount asserted on the proof of claim" }
      - { name: allowed_amount_cents, type: integer, source: computed, default: 0, description: "Court-allowed amount after objection resolution; equals filed_amount_cents when allowed as filed" }
      - { name: priority_class, type: enum, source: input, description: "SECURED | PRIORITY_TAX | PRIORITY_WAGE | PRIORITY_CONSUMER | GENERAL_UNSECURED" }
      - { name: secured_by_asset_id, type: string, source: input, description: "FK -> Asset.id; required iff priority_class == SECURED", constraints: "required when priority_class=SECURED" }
      - { name: reclassified_from_claim_id, type: string, source: system, description: "FK -> Claim.id; set when this claim supersedes an earlier claim via reclassification", constraints: "nullable" }
      - { name: late, type: boolean, source: computed, default: false, description: "True iff received_at > case.claim_bar_date (strictly greater; a claim received exactly at the bar date instant is timely)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | OBJECTED | ALLOWED | DISALLOWED | WITHDRAWN" }
      - { name: objection_id, type: string, source: system, description: "FK -> ClaimObjection.id; the currently open objection, null when none", constraints: "nullable" }

  - name: ClaimObjection
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; claim under attack" }
      - { name: grounds, type: enum, source: input, description: "DUPLICATE | INSUFFICIENT_DOCUMENTATION | AMOUNT_DISPUTED | WRONG_CLASS | LATE_FILED | NOT_OWED" }
      - { name: proposed_allowed_amount_cents, type: integer, source: input, description: "Trustee's proposed allowed amount (0 = full disallowance)" }
      - { name: proposed_priority_class, type: enum, source: input, description: "Trustee's proposed class; must equal claim's current class unless grounds == WRONG_CLASS" }
      - { name: status, type: enum, source: system, description: "PENDING | SUSTAINED | OVERRULED | SETTLED | WITHDRAWN" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of resolution", constraints: "nullable" }

  - name: Asset
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: description, type: string, source: input, description: "Asset description" }
      - { name: scheduled_value_cents, type: integer, source: input, description: "Value per debtor schedules" }
      - { name: exempt, type: boolean, source: input, default: false, description: "Claimed exempt by debtor; exempt assets may not be liquidated" }
      - { name: encumbered_claim_id, type: string, source: input, description: "FK -> Claim.id; the SECURED claim encumbering this asset", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | UNDER_INVESTIGATION | MARKED_FOR_SALE | IN_AUCTION | SOLD | ABANDONED | EXEMPT_RELEASED" }
      - { name: realized_proceeds_cents, type: integer, source: computed, default: 0, description: "Posted net sale proceeds credited to this asset" }

  - name: AvoidanceAction
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: transferee_creditor_id, type: string, source: input, description: "FK -> Creditor.id; the transferee under preference/fraudulent-transfer analysis" }
      - { name: transfer_date, type: datetime, source: input, description: "Date the avoidable transfer occurred" }
      - { name: transfer_amount_cents, type: integer, source: input, description: "Amount of the transfer" }
      - { name: action_type, type: enum, source: input, description: "PREFERENCE_547 | FRAUDULENT_548" }
      - { name: lookback_window_days, type: integer, source: computed, description: "90 for non-insider PREFERENCE_547; 365 for insider PREFERENCE_547; 730 for FRAUDULENT_548" }
      - { name: avoidable, type: boolean, source: computed, description: "True iff transfer_date >= case.filed_on - lookback_window_days AND transfer_date < case.filed_on" }
      - { name: demand_amount_cents, type: integer, source: input, description: "Amount demanded from transferee (may be less than transfer_amount_cents)" }
      - { name: recovered_amount_cents, type: integer, source: computed, default: 0, description: "Posted recoveries against this action" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | ANALYZED | DEMANDED | SETTLED | JUDGMENT | RESCINDED | ABANDONED" }

  - name: RecoveryDeposit
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: avoidance_action_id, type: string, source: input, description: "FK -> AvoidanceAction.id; the action this deposit credits" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED" }

  - name: AuctionSale
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset being sold (exactly one asset per sale)" }
      - { name: buyer_name, type: string, source: input, description: "Winning bidder name" }
      - { name: hammer_price_cents, type: integer, source: input, description: "Gross winning bid" }
      - { name: sale_costs_cents, type: integer, source: input, description: "Auctioneer/carrier costs chargeable to the sale" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "hammer_price_cents - sale_costs_cents; must be >= 0" }
      - { name: sale_approved_on, type: datetime, source: system, description: "Date court approved the sale", constraints: "nullable" }
      - { name: effective_on, type: datetime, source: computed, description: "sale_approved_on + case.objection_window_days days; proceeds post only on/after this date", constraints: "nullable" }
      - { name: proceeds_status, type: enum, source: system, description: "PENDING | POSTED | VOIDED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | CONSUMMATED | CANCELLED" }

  - name: DistributionPlan
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: plan_sequence, type: integer, source: system, description: "1-based plan number within the case" }
      - { name: reserve_for_objected_cents, type: integer, source: computed, description: "Sum of filed_amount_cents over claims with status OBJECTED at plan proposal time, by class (see PlanClassAllocation)" }
      - { name: distributable_cents, type: integer, source: computed, description: "estate_cash_on_hand_cents - reserve_for_objected_cents - unpaid approved fee disbursements at proposal time; must be > 0 to propose" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | EXECUTING | FULLY_DISTRIBUTED | VACATED" }
      - { name: proposed_at, type: datetime, source: system, description: "Timestamp of proposal" }

  - name: PlanClassAllocation
    parent: DistributionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> DistributionPlan.id" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id (denormalized for reporting)" }
      - { name: priority_class, type: enum, source: input, description: "SECURED | PRIORITY_TAX | PRIORITY_WAGE | PRIORITY_CONSUMER | GENERAL_UNSECURED" }
      - { name: allocated_cents, type: integer, source: computed, description: "Waterfall share assigned to this class at proposal" }
      - { name: paid_total_cents, type: integer, source: computed, default: 0, description: "Sum of POSTED dividends against this allocation" }

  - name: Dividend
    parent: DistributionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> DistributionPlan.id" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the ALLOWED claim being paid" }
      - { name: amount_cents, type: integer, source: computed, description: "Pro-rata dividend computed by the waterfall; server-computed at plan confirmation, not client-supplied" }
      - { name: status, type: enum, source: system, description: "COMPUTED | POSTED | VOIDED" }

  - name: FeeApplication
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: applicant_role, type: enum, source: input, description: "TRUSTEE | AUCTIONEER | COUNSEL" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested; for TRUSTEE must equal the §326 commission computed on the DISBURSED basis at filing time" }
      - { name: commission_basis, type: enum, source: input, description: "DISBURSED (on moneys actually disbursed) | PROPOSED (on amounts proposed to be disbursed by the pending plan); required iff applicant_role == TRUSTEE" }
      - { name: computed_commission_cents, type: integer, source: computed, description: "Server-computed §326(a) tiered commission on the chosen basis" }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED | DENIED | PAID" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Court-approved amount (<= requested)", constraints: "nullable" }
      - { name: effective_on, type: datetime, source: computed, description: "Approval date + objection_window_days; may not be paid before", constraints: "nullable" }

  - name: FinalReport
    parent: Case
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: total_receipts_cents, type: integer, source: computed, description: "Sum of POSTED sale net proceeds + POSTED recovery deposits" }
      - { name: total_dividends_cents, type: integer, source: computed, description: "Sum of POSTED dividends" }
      - { name: total_fees_cents, type: integer, source: computed, description: "Sum of PAID fee applications" }
      - { name: unclaimed_funds_cents, type: integer, source: computed, description: "estate_cash_on_hand_cents at report time; remitted to court registry" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | APPROVED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: OPEN
    terminal_states: [CLOSED, CONVERTED_DISMISSED]
    transitions:
      - from: OPEN
        to: ASSET_INVESTIGATION
        trigger: "POST /trustee/cases/{caseId}/begin_investigation"
        actor: Trustee
        preconditions:
          - "case.trustee_user_id == X-User-ID (ERR_NOT_ASSIGNED_TRUSTEE)"
          - "at least one Asset row exists for the case (ERR_NO_ASSETS_SCHEDULED) unless no_asset_report will be filed instead"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /trustee/cases/{caseId}/file_no_asset_report"
        actor: Trustee
        preconditions:
          - "no Asset rows exist for the case"
          - "no Claim rows with status in {FILED, UNDER_REVIEW, OBJECTED, ALLOWED}"
          - "estate_cash_on_hand_cents == 0"
        side_effects:
          - "no_asset_report_filed = true"
          - "status -> CLOSED"

      - from: ASSET_INVESTIGATION
        to: CLAIMS_ADMINISTRATION
        trigger: "POST /trustee/cases/{caseId}/set_bar_date (Clerk) — bar date set transitions posture"
        actor: Clerk
        preconditions:
          - "claim_bar_date input > case.filed_on (ERR_INVALID_BAR_DATE)"
        side_effects:
          - "claim_bar_date = input.bar_date"
          - "bar_date_noticed = true"
          - "status -> CLAIMS_ADMINISTRATION"
          - "every Asset with status SCHEDULED -> UNDER_INVESTIGATION"

      - from: CLAIMS_ADMINISTRATION
        to: LIQUIDATION
        trigger: "POST /trustee/cases/{caseId}/begin_liquidation"
        actor: Trustee
        preconditions:
          - "current logical time > claim_bar_date (ERR_BAR_DATE_NOT_PASSED)"
          - "no Claim with status FILED (ERR_CLAIMS_UNREVIEWED — every timely/late claim must be at least UNDER_REVIEW)"
        side_effects: []

      - from: LIQUIDATION
        to: DISTRIBUTION
        trigger: "POST /trustee/cases/{caseId}/begin_distribution"
        actor: Trustee
        preconditions:
          - "no Asset with status in {MARKED_FOR_SALE, IN_AUCTION} (ERR_ASSETS_PENDING_SALE)"
          - "no Claim with status OBJECTED (ERR_OBJECTIONS_PENDING)"
          - "estate_cash_on_hand_cents > 0 (ERR_NO_FUNDS_TO_DISTRIBUTE)"
        side_effects: []

      - from: DISTRIBUTION
        to: FINAL_REPORT
        trigger: "system (automatic when every DistributionPlan of the case reaches FULLY_DISTRIBUTED; any estate cash remaining is unclaimed funds)"
        actor: system
        preconditions:
          - "all DistributionPlan rows status == FULLY_DISTRIBUTED"
        side_effects:
          - "a FinalReport row is created in DRAFT status with computed totals"

      - from: FINAL_REPORT
        to: CLOSED
        trigger: "POST /trustee/cases/{caseId}/final_report/approve"
        actor: Court
        preconditions:
          - "FinalReport.status == FILED"
          - "all FeeApplication rows status in {PAID, DENIED}"
        side_effects:
          - "Case.status -> CLOSED"

      - from: ANY
        to: CONVERTED_DISMISSED
        trigger: "POST /trustee/cases/{caseId}/convert_or_dismiss"
        actor: Court
        preconditions:
          - "no DistributionPlan in status EXECUTING (ERR_PLAN_EXECUTING)"
        side_effects:
          - "all Claims with status in {FILED, UNDER_REVIEW, OBJECTED} -> WITHDRAWN"
          - "all Assets with status in {SCHEDULED, UNDER_INVESTIGATION, MARKED_FOR_SALE, IN_AUCTION} -> ABANDONED"
          - "all AvoidanceActions not in {RESCINDED, ABANDONED, SETTLED, JUDGMENT} -> ABANDONED"

  - entity: Claim
    initial_state: FILED
    terminal_states: [ALLOWED, DISALLOWED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /trustee/claims/{claimId}/review"
        actor: Trustee
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: OBJECTED
        trigger: "POST /trustee/claims/{claimId}/objections (creates ClaimObjection PENDING)"
        actor: Trustee
        preconditions:
          - "claim.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "no other ClaimObjection with status PENDING exists for this claim (ERR_OBJECTION_ALREADY_PENDING)"
        side_effects:
          - "claim.objection_id = new ClaimObjection.id"
          - "if claim was previously allowed-and-reopened: subtract prior allowed_amount_cents from case.allowed_claims_total_cents before entering OBJECTED"

      - from: UNDER_REVIEW
        to: ALLOWED
        trigger: "POST /trustee/claims/{claimId}/allow"
        actor: Trustee
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "allowed_amount_cents = filed_amount_cents"
          - "case.allowed_claims_total_cents += allowed_amount_cents"

      - from: OBJECTED
        to: ALLOWED
        trigger: "POST /trustee/objections/{objectionId}/overrule (Court) or /settle with outcome ALLOW"
        actor: Court | Trustee
        preconditions:
          - "objection.status == PENDING"
        side_effects:
          - "claim.allowed_amount_cents = filed_amount_cents (overrule) or settled amount (settle)"
          - "claim.priority_class unchanged (overrule) or settled class (settle)"
          - "case.allowed_claims_total_cents += claim.allowed_amount_cents"
          - "claim.objection_id = null"

      - from: OBJECTED
        to: DISALLOWED
        trigger: "POST /trustee/objections/{objectionId}/sustain (Court) or /settle with outcome DISALLOW"
        actor: Court | Trustee
        preconditions:
          - "objection.status == PENDING"
        side_effects:
          - "claim.allowed_amount_cents = 0 (sustain in full) or proposed_allowed_amount_cents if partially sustained via settle"
          - "on partial sustain via settle: status ALLOWED with reduced amount/class, else DISALLOWED"
          - "claim.objection_id = null"

      - from: ALLOWED
        to: UNDER_REVIEW
        trigger: "POST /trustee/claims/{claimId}/reopen"
        actor: Trustee
        preconditions:
          - "case.status in {CLAIMS_ADMINISTRATION, LIQUIDATION} (ERR_CASE_BEYOND_REOPEN — once in DISTRIBUTION the register is fixed)"
          - "no POSTED Dividend references this claim (ERR_DIVIDEND_POSTED)"
        side_effects:
          - "case.allowed_claims_total_cents -= claim.allowed_amount_cents"
          - "claim.allowed_amount_cents = 0"
        note: "This is the cycle ALLOWED -> UNDER_REVIEW -> OBJECTED -> ALLOWED that drives reconsideration rounds."

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /trustee/claims/{claimId}/withdraw"
        actor: Creditor
        preconditions:
          - "X-User-ID == claim.creditor_id"
          - "no POSTED Dividend references this claim"
        side_effects: []

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /trustee/claims/{claimId}/withdraw"
        actor: Creditor
        preconditions:
          - "X-User-ID == claim.creditor_id"
        side_effects: []

  - entity: ClaimObjection
    initial_state: PENDING
    terminal_states: [SUSTAINED, OVERRULED, SETTLED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: SUSTAINED
        trigger: "POST /trustee/objections/{objectionId}/sustain"
        actor: Court
        preconditions:
          - "objection.status == PENDING"
          - "claim.status == OBJECTED and claim.objection_id == objection.id"
        side_effects:
          - "claim -> DISALLOWED (full) — see Claim machine"

      - from: PENDING
        to: OVERRULED
        trigger: "POST /trustee/objections/{objectionId}/overrule"
        actor: Court
        preconditions:
          - "objection.status == PENDING"
        side_effects:
          - "claim -> ALLOWED as filed — see Claim machine"

      - from: PENDING
        to: SETTLED
        trigger: "POST /trustee/objections/{objectionId}/settle"
        actor: Trustee
        preconditions:
          - "objection.status == PENDING"
          - "input.outcome in {ALLOW, DISALLOW, PARTIAL}"
          - "if PARTIAL: input.settled_amount_cents < claim.filed_amount_cents (ERR_SETTLEMENT_NOT_PARTIAL)"
        side_effects:
          - "claim resolved per settle outcome (ALLOW -> ALLOWED as filed; DISALLOW -> DISALLOWED; PARTIAL -> ALLOWED at settled_amount_cents and settled_priority_class)"
          - "if class changed and old claim had been counted under old class, case.allowed_claims_total_cents reflects new amount only"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /trustee/objections/{objectionId}/withdraw"
        actor: Trustee
        preconditions:
          - "objection.status == PENDING"
        side_effects:
          - "claim -> UNDER_REVIEW (objection withdrawn; review restarts)"
          - "claim.objection_id = null"

  - entity: Asset
    initial_state: SCHEDULED
    terminal_states: [SOLD, ABANDONED, EXEMPT_RELEASED]
    transitions:
      - from: SCHEDULED
        to: UNDER_INVESTIGATION
        trigger: "system (on set_bar_date) or POST /trustee/assets/{assetId}/investigate"
        actor: system | Trustee
        preconditions: []
        side_effects: []

      - from: UNDER_INVESTIGATION
        to: MARKED_FOR_SALE
        trigger: "POST /trustee/assets/{assetId}/mark_for_sale"
        actor: Trustee
        preconditions:
          - "asset.exempt == false (ERR_ASSET_EXEMPT)"
          - "case.status in {CLAIMS_ADMINISTRATION, LIQUIDATION}"
        side_effects: []

      - from: MARKED_FOR_SALE
        to: IN_AUCTION
        trigger: "POST /trustee/cases/{caseId}/sales (create AuctionSale PROPOSED)"
        actor: Trustee
        preconditions:
          - "asset.status == MARKED_FOR_SALE"
          - "no other AuctionSale for this asset with status in {PROPOSED, APPROVED} (ERR_SALE_ALREADY_PENDING)"
        side_effects:
          - "asset.status -> IN_AUCTION"

      - from: IN_AUCTION
        to: SOLD
        trigger: "system (when AuctionSale.status -> CONSUMMATED and proceeds POSTED)"
        actor: system
        preconditions: []
        side_effects:
          - "asset.realized_proceeds_cents = sale.net_proceeds_cents"

      - from: IN_AUCTION
        to: MARKED_FOR_SALE
        trigger: "system (when AuctionSale.status -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_INVESTIGATION
        to: ABANDONED
        trigger: "POST /trustee/assets/{assetId}/abandon"
        actor: Trustee
        preconditions:
          - "no POSTED dividends may ever reference proceeds of this asset (trivially true pre-sale)"
        side_effects: []

      - from: MARKED_FOR_SALE
        to: ABANDONED
        trigger: "POST /trustee/assets/{assetId}/abandon"
        actor: Trustee
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: EXEMPT_RELEASED
        trigger: "POST /trustee/assets/{assetId}/release_exemption"
        actor: Court
        preconditions:
          - "asset.exempt == true"
        side_effects: []

      - from: UNDER_INVESTIGATION
        to: EXEMPT_RELEASED
        trigger: "POST /trustee/assets/{assetId}/release_exemption"
        actor: Court
        preconditions:
          - "asset.exempt == true"
        side_effects: []

  - entity: AuctionSale
    initial_state: PROPOSED
    terminal_states: [CONSUMMATED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /trustee/sales/{saleId}/approve"
        actor: Court
        preconditions:
          - "hammer_price_cents >= max( sale_costs_cents, floor(asset.scheduled_value_cents * 0.50) ) (ERR_BELOW_MINIMUM_PRICE) — net may not be negative and gross may not be less than half scheduled value"
          - "sale.status == PROPOSED"
        side_effects:
          - "sale_approved_on = current logical date"
          - "effective_on = sale_approved_on + case.objection_window_days days"

      - from: APPROVED
        to: CONSUMMATED
        trigger: "POST /trustee/sales/{saleId}/consummate"
        actor: Trustee
        preconditions:
          - "current logical date >= sale.effective_on (ERR_OBJECTION_WINDOW_OPEN)"
          - "sale.status == APPROVED"
        side_effects:
          - "proceeds_status = POSTED"
          - "case.estate_cash_on_hand_cents += sale.net_proceeds_cents"
          - "asset -> SOLD with realized_proceeds_cents = net_proceeds_cents"
          - "if asset.encumbered_claim_id is set and that claim is ALLOWED: mark secured carve-out for waterfall (see waterfall_allocation calc)"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /trustee/sales/{saleId}/cancel"
        actor: Trustee | Court
        preconditions: []
        side_effects:
          - "asset IN_AUCTION -> MARKED_FOR_SALE"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /trustee/sales/{saleId}/cancel"
        actor: Court
        preconditions:
          - "current logical date < sale.effective_on (ERR_OBJECTION_WINDOW_CLOSED — after effective date the sale may no longer be cancelled)"
        side_effects:
          - "asset IN_AUCTION -> MARKED_FOR_SALE"

  - entity: AvoidanceAction
    initial_state: IDENTIFIED
    terminal_states: [SETTLED, JUDGMENT, RESCINDED, ABANDONED]
    transitions:
      - from: IDENTIFIED
        to: ANALYZED
        trigger: "POST /trustee/avoidance_actions/{actionId}/analyze"
        actor: Trustee
        preconditions:
          - "action.avoidable == true (ERR_TRANSFER_NOT_AVOIDABLE) — outside lookback window transfers may not advance"
        side_effects: []

      - from: ANALYZED
        to: DEMANDED
        trigger: "POST /trustee/avoidance_actions/{actionId}/demand"
        actor: Trustee
        preconditions:
          - "demand_amount_cents set, 0 < demand_amount_cents <= transfer_amount_cents (ERR_INVALID_DEMAND_AMOUNT)"
        side_effects: []

      - from: DEMANDED
        to: SETTLED
        trigger: "POST /trustee/avoidance_actions/{actionId}/settle"
        actor: Trustee
        preconditions:
          - "input.settled_amount_cents <= demand_amount_cents"
          - "a RecoveryDeposit of amount settled_amount_cents POSTS atomically with the settle"
        side_effects:
          - "recovered_amount_cents = settled_amount_cents"
          - "case.estate_cash_on_hand_cents += settled_amount_cents"
          - "a compensating Claim of priority_class GENERAL_UNSECURED for (transfer_amount_cents - settled_amount_cents) is created for the transferee_creditor if positive, received_at = current logical time (the 'claim-swap': recovered dollars reduce the estate's liability to the preference recipient)"

      - from: DEMANDED
        to: JUDGMENT
        trigger: "POST /trustee/avoidance_actions/{actionId}/enter_judgment"
        actor: Court
        preconditions:
          - "action.status == DEMANDED"
        side_effects:
          - "a RecoveryDeposit of full demand_amount_cents POSTS atomically"
          - "recovered_amount_cents = demand_amount_cents"
          - "case.estate_cash_on_hand_cents += demand_amount_cents"

      - from: JUDGMENT
        to: RESCINDED
        trigger: "POST /trustee/avoidance_actions/{actionId}/rescind"
        actor: Court
        preconditions:
          - "case.status != DISTRIBUTION and no DistributionPlan for the case is CONFIRMED or EXECUTING (ERR_PLAN_RELIES_ON_RECOVERY)"
        side_effects:
          - "the linked RecoveryDeposit -> VOIDED"
          - "recovered_amount_cents = 0"
          - "case.estate_cash_on_hand_cents -= demand_amount_cents (compensating entry; invariant: cash always equals receipts minus disbursements)"

      - from: IDENTIFIED
        to: ABANDONED
        trigger: "POST /trustee/avoidance_actions/{actionId}/abandon"
        actor: Trustee
        preconditions: []
        side_effects: []

      - from: ANALYZED
        to: ABANDONED
        trigger: "POST /trustee/avoidance_actions/{actionId}/abandon"
        actor: Trustee
        preconditions: []
        side_effects: []

  - entity: DistributionPlan
    initial_state: PROPOSED
    terminal_states: [FULLY_DISTRIBUTED, VACATED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /trustee/plans/{planId}/confirm"
        actor: Court
        preconditions:
          - "case.status == DISTRIBUTION (ERR_CASE_NOT_IN_DISTRIBUTION)"
          - "no other plan for this case in status CONFIRMED or EXECUTING (ERR_PLAN_ALREADY_ACTIVE)"
          - "OCC: expected_case_version matches case.version (ERR_STALE_CASE_VERSION)"
        side_effects:
          - "case.version += 1"
          - "plan status -> CONFIRMED"
          - "Dividend rows are computed per waterfall_allocation and created with status COMPUTED"

      - from: CONFIRMED
        to: EXECUTING
        trigger: "system (automatic when the first Dividend of the plan is POSTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXECUTING
        to: FULLY_DISTRIBUTED
        trigger: "system (automatic when every Dividend of the plan is POSTED or VOIDED and paid_total_cents == allocated_cents - voided remainder)"
        actor: system
        preconditions:
          - "every Dividend in {POSTED, VOIDED}"
        side_effects:
          - "if this was the case's last active plan (no other plan in {PROPOSED, CONFIRMED, EXECUTING}): case -> FINAL_REPORT posture triggers; any remaining estate cash is definitionally unclaimed funds"

      - from: CONFIRMED
        to: VACATED
        trigger: "POST /trustee/plans/{planId}/vacate"
        actor: Court
        preconditions:
          - "no Dividend of the plan is POSTED (ERR_DIVIDEND_POSTED)"
        side_effects:
          - "all plan Dividends -> VOIDED"
          - "case.version += 1"

  - entity: FeeApplication
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /trustee/fee_applications/{feeId}/approve"
        actor: Court
        preconditions:
          - "approved_amount_cents <= requested_amount_cents (ERR_APPROVAL_EXCEEDS_REQUEST)"
          - "segregation of duties: X-User-ID != case.trustee_user_id is automatic since Court role only"
        side_effects:
          - "effective_on = approval date + case.objection_window_days"

      - from: APPROVED
        to: PAID
        trigger: "POST /trustee/fee_applications/{feeId}/pay"
        actor: Trustee
        preconditions:
          - "current logical date >= fee.effective_on (ERR_FEE_NOT_YET_EFFECTIVE)"
          - "case.estate_cash_on_hand_cents >= approved_amount_cents (ERR_INSUFFICIENT_ESTATE_FUNDS)"
        side_effects:
          - "case.estate_cash_on_hand_cents -= approved_amount_cents"

      - from: FILED
        to: DENIED
        trigger: "POST /trustee/fee_applications/{feeId}/deny"
        actor: Court
        preconditions: []
        side_effects: []

  - entity: FinalReport
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /trustee/cases/{caseId}/final_report/file"
        actor: Trustee
        preconditions:
          - "case.status == FINAL_REPORT"
          - "all FeeApplication rows in {PAID, DENIED} (ERR_FINAL_REPORT_NOT_READY)"
          - "all Dividend rows in {POSTED, VOIDED} (ERR_FINAL_REPORT_NOT_READY)"
        side_effects: []

      - from: FILED
        to: APPROVED
        trigger: "POST /trustee/cases/{caseId}/final_report/approve"
        actor: Court
        preconditions: []
        side_effects:
          - "case -> CLOSED"
          - "unclaimed_funds_cents remitted (estate_cash_on_hand_cents -> 0)"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, resolved via OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: plan-confirm-stale-case
    parent_entity: Case
    write_endpoint: "POST /trustee/plans/{planId}/confirm"
    occ_field: "expected_case_version"
    description: |
      Confirming a DistributionPlan against a Case whose version has advanced
      since the client last observed it is rejected. The waterfall snapshot
      (estate cash, allowed claims, objection reserve) was computed against
      the older case state; any intervening mutation (a new recovery, a claim
      allowance, a fee payment) makes the client's basis stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: fee-file-stale-case
    parent_entity: Case
    write_endpoint: "POST /trustee/cases/{caseId}/fee_applications"
    occ_field: "expected_case_version"
    description: |
      Filing a FeeApplication against a Case whose version has advanced since
      the client last observed it is rejected. A trustee commission is computed
      on the disbursement basis visible at filing; an intervening plan
      confirmation or dividend posting changes that basis.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_late_determination
    trigger: "claim filing (POST /trustee/cases/{caseId}/claims)"
    algorithm: threshold
    formula: |
      if case.claim_bar_date is null:
        late = false   # no bar date yet — everything timely
      else:
        late = (received_at > claim_bar_date)
      # Boundary: received_at == claim_bar_date exactly is TIMELY (strictly-greater comparison).
    input_set: "the filing Claim and its parent Case"
    constants:
      COMPARATOR: "strictly_greater"
    precision: "ISO 8601 timestamp comparison, second granularity"

  - name: avoidance_lookback_window
    trigger: "AvoidanceAction creation and analyze"
    algorithm: threshold
    formula: |
      if action_type == PREFERENCE_547:
        window_days = 365 if transferee_creditor.insider else 90
      elif action_type == FRAUDULENT_548:
        window_days = 730
      earliest_avoidable = case.filed_on - window_days days
      avoidable = (transfer_date >= earliest_avoidable) AND (transfer_date < case.filed_on)
      # Boundary: transfer_date exactly == earliest_avoidable is avoidable (>=);
      # transfer_date exactly == case.filed_on is post-petition and NOT avoidable (<).
    input_set: "the AvoidanceAction, its transferee Creditor, and parent Case"
    constants:
      PREFERENCE_NON_INSIDER_DAYS: 90
      PREFERENCE_INSIDER_DAYS: 365
      FRAUDULENT_TRANSFER_DAYS: 730
    precision: "whole-day granularity on calendar dates"

  - name: sale_minimum_price
    trigger: "POST /trustee/sales/{saleId}/approve"
    algorithm: threshold
    formula: |
      min_gross = max(sale_costs_cents, floor(asset.scheduled_value_cents * 0.50))
      valid = (hammer_price_cents >= min_gross)
      # Boundary: hammer exactly == min_gross is acceptable.
    constants:
      MIN_FRACTION_OF_SCHEDULED: 0.50
    precision: "integer cents, floor on the half-value computation"

  - name: trustee_commission_326
    trigger: "FeeApplication filing with applicant_role == TRUSTEE"
    algorithm: tiered_pricing
    formula: |
      # 11 U.S.C. 326(a)-style tiers on the disbursement basis B (in cents):
      #   25% of first        $5,000          (      500_000)
      #   10% of next        $45,000          (    4_500_000)   -> cumulative  $50,000
      #    5% of next       $950,000          (   95_000_000)   -> cumulative $1,000,000
      #    3% of remainder above $1,000,000
      tier1 = min(B, 500_000)            * 25 // 100
      tier2 = min(max(B - 500_000, 0), 4_500_000)   * 10 // 100
      tier3 = min(max(B - 5_000_000, 0), 95_000_000) * 5 // 100
      tier4 = max(B - 100_000_000, 0)     * 3 // 100
      commission_cents = tier1 + tier2 + tier3 + tier4
      # Integer division per tier (round DOWN each tier, THEN sum) — order pinned.
    input_set: |
      Basis B depends on commission_basis variant:
      - DISBURSED: sum of POSTED dividends' amount_cents + PAID non-trustee fee
        approved amounts at filing instant (i.e., moneys actually disbursed to
        parties in interest, excluding the trustee's own compensation).
      - PROPOSED: sum of CONFIRMED plan PlanClassAllocation.allocated_cents
        (amounts proposed to be disbursed under the pending plan).
    constants:
      T1_CAP_CENTS: 500000        # $5,000
      T2_CAP_CENTS: 4500000       # $45,000
      T3_CAP_CENTS: 95000000      # $950,000
      T1_RATE: 0.25
      T2_RATE: 0.10
      T3_RATE: 0.05
      T4_RATE: 0.03
    precision: "integer cents; each tier floored via integer division before summation"
    variants:
      - name: disbursed_basis
        when: "commission_basis == DISBURSED"
        difference: "B = actual posted dividends + paid professional fees; excludes everything merely proposed"
      - name: proposed_basis
        when: "commission_basis == PROPOSED"
        difference: "B = allocated cents under the CONFIRMED (not yet fully disbursed) plan; yields a HIGHER commission earlier in the case than DISBURSED when dividends are not yet posted"

  - name: waterfall_allocation
    trigger: "DistributionPlan proposal (POST /trustee/cases/{caseId}/plans) computes allocations; plan confirm materializes Dividends"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — reserve:
      #   For each priority class c, reserve[c] = sum of filed_amount_cents over
      #   claims with status == OBJECTED and priority_class == c.
      # Step 2 — distributable pool:
      #   pool = case.estate_cash_on_hand_cents
      #          - sum(reserve[c] for c in classes)
      #          - sum of APPROVED-unpaid fee approved_amount_cents
      #   pool must be > 0 else ERR_NO_FUNDS_TO_DISTRIBUTE.
      # Step 3 — waterfall across classes in fixed order
      #   SECURED -> PRIORITY_TAX -> PRIORITY_WAGE -> PRIORITY_CONSUMER -> GENERAL_UNSECURED:
      #   need[c] = sum of allowed_amount_cents over ALLOWED claims in class c
      #             (for SECURED claims, need is capped at the realized_proceeds_cents
      #              of the securing asset; any unsecured deficiency spills into
      #              GENERAL_UNSECURED as a deficiency claim share on the SAME claim —
      #              i.e., the claim participates in both classes with split amounts).
      #   grant[c] = min(need[c], remaining_pool); remaining_pool -= grant[c].
      # Step 4 — per-class pro-rata dividend per claim:
      #   if grant[c] == need[c]: each claim gets its full allowed_amount_cents.
      #   else: dividend_i = floor(allowed_i * grant[c] / need[c]) for all but the
      #   LAST claim in the class ordering; the last claim receives
      #   grant[c] - sum(previous dividends) so the class total matches grant[c]
      #   exactly (remainder-to-last rule; order pinned by claim_number ASC —
      #   never by id).
    input_set: |
      Claims with status ALLOWED at plan-confirm time (a claim ALLOWED after
      proposal but before confirm DOES enter the computation — the waterfall is
      computed at CONFIRM, not at proposal; proposal only records the reserve
      snapshot). OBJECTED claims are excluded from dividends but drive the reserve.
    constants:
      CLASS_ORDER: ["SECURED", "PRIORITY_TAX", "PRIORITY_WAGE", "PRIORITY_CONSUMER", "GENERAL_UNSECURED"]
    precision: "integer cents; floor per claim; remainder-to-last-claim per class"

  - name: estate_cash_reconciliation
    trigger: "every mutation that posts or voids sale proceeds, recovery deposits, dividends, or fee payments"
    algorithm: aggregation
    formula: |
      estate_cash_on_hand_cents
        = sum(AuctionSale.net_proceeds_cents where proceeds_status == POSTED)
        + sum(RecoveryDeposit.amount_cents where status == POSTED)
        - sum(Dividend.amount_cents where status == POSTED)
        - sum(FeeApplication.approved_amount_cents where status == PAID)
      # Invariant: always >= 0; a pay/void operation that would drive it negative
      # is rejected (ERR_INSUFFICIENT_ESTATE_FUNDS).
    input_set: "all four ledger entity types of the case, filtered to POSTED/PAID"
    precision: "integer cents"

  - name: final_report_totals
    trigger: "FinalReport creation (system, on entering FINAL_REPORT posture)"
    algorithm: aggregation
    formula: |
      total_receipts_cents   = sum(POSTED sale net_proceeds) + sum(POSTED recovery deposits)
      total_dividends_cents  = sum(POSTED dividends)
      total_fees_cents       = sum(PAID fee applications' approved_amount_cents)
      unclaimed_funds_cents  = total_receipts_cents - total_dividends_cents - total_fees_cents
      # Invariant: unclaimed_funds_cents == case.estate_cash_on_hand_cents at report time.
    input_set: "case ledger entities (all time, terminal statuses only)"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist (case, claim, objection, asset, sale, action, plan, fee) validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Case terminal-state guard: no mutation endpoint operates on a CLOSED or CONVERTED_DISMISSED case"
    error_id: ERR_CASE_CLOSED
    http_status: 409
    applies_to: "all case-scoped mutation endpoints"

  - priority: 5
    category: state
    check: "Target entity in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties / role-binding: Trustee endpoints require X-User-ID == case.trustee_user_id; Creditor self-service requires X-User-ID == claim.creditor_id"
    error_id: ERR_NOT_ASSIGNED_TRUSTEE
    http_status: 403
    applies_to: "trustee-bound mutations, creditor claim withdrawal"

  - priority: 7
    category: business_temporal
    check: "Bar-date and objection-window temporal gates: begin_liquidation requires clock > claim_bar_date; sale consummate requires clock >= effective_on; fee pay requires clock >= effective_on"
    error_id: ERR_BAR_DATE_NOT_PASSED
    http_status: 409
    applies_to: "begin_liquidation, sale consummate, fee pay"

  - priority: 8
    category: business_referential
    check: "Referential integrity: SECURED claim must name an existing Asset of the same case; objection must name claim of the case; sale must name asset of the case; recovery deposit must name action of the case"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "claim filing, objection create, sale create, recovery deposit"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: case_number unique; creditor_ref unique; at most one PENDING objection per claim; at most one {PROPOSED, APPROVED} sale per asset"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "case create, creditor create, objection create, sale create"

  - priority: 10
    category: business_constraint
    check: "Shape/constraint: demanded amount within (0, transfer_amount_cents]; settle partial must be strictly less than filed amount; approved fee <= requested; hammer price passes sale_minimum_price"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "demand, settle, fee approve, sale approve"

  - priority: 13
    category: business_constraint
    check: "Request body well-formed: all required input fields present, types correct, amounts non-negative, enum members valid, conditionally-required fields present (SECURED claim must carry secured_by_asset_id)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 11
    category: business_fiscal
    check: "Fiscal sufficiency: estate cash never negative; plan pool > 0; fee pay covered; begin_distribution requires positive cash"
    error_id: ERR_INSUFFICIENT_ESTATE_FUNDS
    http_status: 409
    applies_to: "fee pay, plan propose, begin_distribution"

  - priority: 12
    category: business_fiscal
    check: "Register integrity: no plan proposal while OBJECTED claims exist (they only size the reserve, they don't block) — EXCEPT begin_distribution, which requires zero OBJECTED claims"
    error_id: ERR_OBJECTIONS_PENDING
    http_status: 409
    applies_to: "begin_distribution"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving clock (mandatory default 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/trustee/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default logical time is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. All temporal gates (bar date, effective_on windows, lookback windows) read this clock."
    roles: [Court]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets logical clock"]

  # --- Case ---
  - method: POST
    path: "/trustee/cases"
    description: "Create a bankruptcy case and assign the panel trustee"
    roles: [Clerk]
    code: 201
    input: [case_number, debtor_name, filed_on, district, trustee_user_id, "scheduled_unsecured_total_cents?", "objection_window_days?"]
    output: Case
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/trustee/cases/{id}"
    description: "Get a case"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/trustee/cases"
    description: "List cases"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: ["status?", "trustee_user_id?"]
    output: "Case[]"
    side_effects: []

  - method: POST
    path: "/trustee/cases/{id}/begin_investigation"
    description: "OPEN -> ASSET_INVESTIGATION"
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects: ["case.version += 1"]

  - method: POST
    path: "/trustee/cases/{id}/set_bar_date"
    description: "Set claims bar date; transitions case to CLAIMS_ADMINISTRATION and sweeps SCHEDULED assets to UNDER_INVESTIGATION"
    roles: [Clerk]
    code: 200
    input: [bar_date]
    output: Case
    side_effects:
      - "claim_bar_date = bar_date; bar_date_noticed = true"
      - "assets SCHEDULED -> UNDER_INVESTIGATION"
      - "case.version += 1"

  - method: POST
    path: "/trustee/cases/{id}/begin_liquidation"
    description: "CLAIMS_ADMINISTRATION -> LIQUIDATION (requires clock past bar date and no FILED claims)"
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects: ["case.version += 1"]

  - method: POST
    path: "/trustee/cases/{id}/begin_distribution"
    description: "LIQUIDATION -> DISTRIBUTION (requires no pending sales, no OBJECTED claims, positive cash)"
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects: ["case.version += 1"]

  - method: POST
    path: "/trustee/cases/{id}/file_no_asset_report"
    description: "File no-asset report; OPEN -> CLOSED"
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects: ["no_asset_report_filed = true", "case.version += 1"]

  - method: POST
    path: "/trustee/cases/{id}/convert_or_dismiss"
    description: "Court converts or dismisses the case from any non-terminal state"
    roles: [Court]
    code: 200
    input: []
    output: Case
    side_effects: ["cascade: claims -> WITHDRAWN, assets -> ABANDONED, actions -> ABANDONED", "case.version += 1"]

  # --- Creditor ---
  - method: POST
    path: "/trustee/creditors"
