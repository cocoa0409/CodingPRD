scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: program_roi_provisional_vs_final
        grounds:
          - calculations.program_roi
          - calculations.program_roi.variants.provisional
          - calculations.program_roi.variants.final
        distinguishing_aspect: |
          Same program data yields two different ROI percentages: the provisional
          variant (computed at first run PRODUCED) uses only committed production
          cost, while the final variant (computed at CLOSE) adds fulfilled damage
          replacement costs — different entity domain from the per-run cost calc.
        test_recipe:
          setup:
            - "Client exists; program (store_count=200, revenue=12000000 cents) in FULFILLMENT"
            - "One design APPROVED; one run PRODUCED (qty=216, unit_cost=2200, total=475200)"
            - "200 kits DELIVERED; 1 damage claim FULFILLED with replacement_cost_cents=4400"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 8, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/programs/${program_id}/start-fulfillment"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "GET /pop/production-runs/${run_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "ProductionRun.${run_id}.total_cost_cents == 475200"
            - "roi_pct_provisional would use committed cost 475200 only (no damage claims yet)"
      - name: unit_cost_tiered_vs_marginal_interpretation
        grounds:
          - calculations.unit_cost_tiered
          - calculations.unit_cost_tiered.variants.average_rate_on_whole_quantity
        distinguishing_aspect: |
          Same quantity (216) billed as average-rate-on-whole-quantity (216*2200
          = 475200 cents) versus a marginal tier-split interpretation (99*2500 +
          117*2200 = 504900 cents) — different entity domain (per-run production
          cost) from the program-level ROI.
        test_recipe:
          setup:
            - "Program in PRODUCTION; design APPROVED; run PLANNED with overage_pct=8 (qty -> 216)"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 8, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
          assert:
            - "ProductionRun.${run_id}.production_quantity == 216"
            - "ProductionRun.${run_id}.unit_cost_cents == 2200"
            - "ProductionRun.${run_id}.total_cost_cents == 475200"
            - "total_cost_cents != 504900 (which a marginal tier-split would produce)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: production_quantity_ceiling_with_overage
        grounds:
          - calculations.production_quantity_rule
        distinguishing_aspect: |
          Mode (a): a formula with 2 inputs and a non-linear ceiling interaction —
          ceil(store_count * (1 + overage_pct/100)); store_count=200 & overage=8
          yields exactly 216, while overage=7.5 yields 215, exercising the ceil
          boundary at an integer product.
        test_recipe:
          setup:
            - "Program (store_count=200) in PRODUCTION; design APPROVED; run PLANNED overage=8"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
