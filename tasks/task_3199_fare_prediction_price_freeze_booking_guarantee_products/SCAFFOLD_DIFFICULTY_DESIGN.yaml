            - "the claim against F1 is rejected with ERR_NO_OVERSHOOT because market_price_cents 8900 equals the active base fare and the overshoot rule is left-closed at 0"
            - "PriceFreeze.${f2_id}.overshoot_cents == 12460, exactly the cap, so the absorption has saturated"
            - "PriceFreeze.${f2_id}.capped_impact_cents == 14952.00 and GuaranteeClaim.${c2_id}.capped_impact_cents == 14952.00"
            - "the claim boundary is exact: market 21360 gives overshoot 12460 and capped impact 14952.00, while market 21359 gives overshoot 12459 and capped impact 14950.80"

      - name: boundary_watch_cooldown_half_open_at_exactly_six_hours
        grounds:
          - calculations.cost_of_waiting_evaluation
          - entities.WatchSubscription.fields.cooldown_until
          - entities.WatchSubscription.fields.cooldown_suppressed
          - validations[priority=10]
        distinguishing_aspect: |
          The notification window is half-open on a temporal metric rather than a numeric one: a clock
          reading exactly equal to cooldown_until is suppressed while one second later is delivered, so
          the same endpoint returns a suppression and then a notification with no other state change.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with curve day-0 price 8200 and itinerary I1 observed at 10000, so fare_tier_ceiling_cents 30000 exceeds the fare and every pass reads WAIT; an ARMED watch W1 on I1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
              captures: { curve_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "POST /fare/itineraries/${i1_id}/watch-subscription"
              payload: { expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { w1_id: $.data.id }
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { at_boundary: $.data.cooldown_suppressed }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-01T06:00:01Z" }
              as: PlatformAdmin
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { after_boundary: $.data.cooldown_suppressed }
          assert:
            - "WatchSubscription.${w1_id}.cooldown_until == 2026-09-01T06:00:00Z, stamped as last_notified_at + 6 hours"
            - "cooldown_suppressed == true at exactly 06:00:00Z and == false at 06:00:01Z"
            - "WatchSubscription.${w1_id}.notification_status == WAIT in both cases and notification_attempt_count == 4"
            - "an ARMED watch evaluated at 00:00:00Z with a null cooldown_until is never suppressed, so the first notification of a fresh watch always delivers"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_entity_freeze_activation_depends_on_route_posture
        grounds:
          - state_machines.PriceFreeze.DRAFT_to_HELD
          - state_machines.Route.ACTIVE_to_SURGE
          - validations[priority=13]
          - errors.ERR_ROUTE_RESTRICTED
        distinguishing_aspect: |
          The freeze's DRAFT -> HELD transition is legal only while the Route it hangs off is ACTIVE or
          SURGE, and the same request that fails at RESTRICTED succeeds at SURGE — a cross-entity
          dependency over the Itinerary -> Route pair, distinct from the claim's dependency over the
          Freeze -> Claim pair.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 parked in RESTRICTED with a DRAFT freeze F1 on itinerary I1, and a regional pool already open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/risk-pools"
              payload: { region: "WEST", pool_code: "WEST-RP-1" }
              as: RiskAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "RESTRICTED", posture_reason_code: "REGIONAL_POOL_BREACH", expected_route_version: "${r1_version}" }
              as: PlatformAdmin
              captures: { r1_v2: $.data.version }
          trigger:
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { blocked_err: $.data.error_id, blocked_message: $.data.message }
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "SURGE", posture_reason_code: "DEMAND_PEAK", expected_route_version: "${r1_v2}" }
              as: PlatformAdmin
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "the first activation is rejected with ERR_ROUTE_RESTRICTED at priority 13"
            - "PriceFreeze.${f1_id}.status == HELD after the route returns to SURGE, proving the dependency is on the route's posture and not on the freeze"
            - "Route.${r1_id}.posture == SURGE at that moment and the freeze's manifest_fare_cents re-pinned from $8936 x peak_day_demand_multiplier"

      - name: cross_entity_freeze_claim_depends_on_approved_claim
        grounds:
          - state_machines.PriceFreeze.CLAIM_PENDING_to_CLAIMED
          - state_machines.GuaranteeClaim.UNDER_REVIEW_to_APPROVED
          - validations[priority=8]
          - errors.ERR_SOD_VIOLATION
        distinguishing_aspect: |
          The freeze's CLAIM_PENDING -> CLAIMED transition is legal only while the GuaranteeClaim that
          holds it is APPROVED, so the same settlement request fails at FILED and succeeds once the
          claim has been approved by an adjuster other than the one who reviewed it — a cross-entity
          dependency over the PriceFreeze -> GuaranteeClaim pair, not the Itinerary -> Route pair the
          other instance uses.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1, itinerary I1, a FROZEN freeze F1 with a 14000 observation, and a FILED claim C1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 14000, seats_left: 4 }
              as: OpsAgent
            - call: "POST /fare/claims"
              payload: { freeze_id: "${f1_id}", market_price_cents: 16500 }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { c1_id: $.data.id, c1_version: $.data.version }
          trigger:
            - call: "POST /fare/claims/${c1_id}/settlements"
              payload: { expected_claim_version: "${c1_version}" }
              as: ClaimsAdjuster
              as_user_id: "ca-ingrid"
              captures: { early_err: $.data.error_id, early_message: $.data.message }
            - call: "POST /fare/claims/${c1_id}/reviews"
              payload: { review_note: "first-pass review" }
              as: ClaimsAdjuster
              as_user_id: "ca-ingrid"
              captures: { c1_v2: $.data.version }
            - call: "POST /fare/claims/${c1_id}/approvals"
              payload: { approval_note: "self-approval attempt" }
              as: ClaimsAdjuster
              as_user_id: "ca-ingrid"
              captures: { sod_err: $.data.error_id, sod_message: $.data.message }
            - call: "POST /fare/claims/${c1_id}/approvals"
              payload: { approval_note: "second adjuster" }
              as: ClaimsAdjuster
              as_user_id: "ca-pavel"
              captures: { c1_v3: $.data.version }
            - call: "POST /fare/claims/${c1_id}/settlements"
              payload: { expected_claim_version: "${c1_v3}" }
              as: ClaimsAdjuster
              as_user_id: "ca-rosa"
          assert:
            - "the settlement attempted while the claim was FILED is refused with ERR_INVALID_STATE at priority 8, so the freeze cannot be closed ahead of its claim"
            - "the approval attempted by the reviewing adjuster is refused with ERR_SOD_VIOLATION at priority 7"
            - "GuaranteeClaim.${c1_id}.claim_status == APPROVED after the second adjuster acts, with approver_user_id ca-pavel"
            - "the settlement by a third adjuster succeeds and PriceFreeze.${f1_id}.status == CLAIMED only at that point, never earlier"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: overlap_hedge_coverage_occupancy_is_a_half_open_day
        grounds:
          - validations[priority=16]
          - entities.HedgingPosition.fields.coverage_date
          - state_machines.HedgingPosition.OPEN_to_HEDGED
          - errors.ERR_HEDGE_DUPLICATE_COVERAGE
        distinguishing_aspect: |
          A coverage date is an atomic occupancy with merge semantics rather than an interval-overlap
          test: two positions that start at the same instant on the same route and fare collide even
          though their nominal coverage is identical, so the second is refused and the route's hedged
          capacity is never double-booked.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with hedge_price_cents 9000 for the coverage date 2026-09-15T00:00:00Z already OPEN, and a second route R2 that deliberately covers a different date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "BOS", flight_number: "HA102", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id, r2_version: $.data.version }
            - call: "POST /fare/hedging-positions"
              payload: { route_id: "${r1_id}", coverage_date: "2026-09-15T00:00:00Z", hedge_price_cents: 9000, contract_quantity_cents: 500000, expected_route_version: "${r1_version}" }
              as: RiskAnalyst
              captures: { hp1_id: $.data.id }
          trigger:
            - call: "POST /fare/hedging-positions"
              payload: { route_id: "${r1_id}", coverage_date: "2026-09-15T00:00:00Z", hedge_price_cents: 9000, contract_quantity_cents: 400000, expected_route_version: "${r1_version}" }
              as: RiskAnalyst
              captures: { dup_err: $.data.error_id, dup_message: $.data.message }
            - call: "POST /fare/hedging-positions"
              payload: { route_id: "${r2_id}", coverage_date: "2026-09-15T00:00:00Z", hedge_price_cents: 9000, contract_quantity_cents: 400000, expected_route_version: "${r2_version}" }
              as: RiskAnalyst
              captures: { hp2_id: $.data.id }
          assert:
            - "the duplicate on R1 is rejected with ERR_HEDGE_DUPLICATE_COVERAGE at priority 16 and no position is created"
            - "HedgingPosition.${hp1_id}.contract_quantity_cents is still 500000 and no amendment is applied, so the collision is a refusal rather than a merge"
            - "the identical payload on R2 succeeds as HedgingPosition.${hp2_id}, so the occupancy key is the whole triple (route, coverage date, price)"
            - "a position on R1 for 2026-09-16T00:00:00Z would succeed, so adjacent dates do not overlap"

      - name: overlap_option_hold_occupies_a_resource_window
        grounds:
          - validations[priority=10]
          - state_machines.RebookingOption.HELD_to_EXPIRED
          - state_machines.ChangeEvent.HELD_to_OPTION_SELECTED
          - errors.ERR_NOTIFICATION_SUPPRESSED
        distinguishing_aspect: |
          A rebooking hold occupies a resource window with revert semantics instead of merge semantics:
          accepting a second option inside an existing hold's 24-hour window is refused, and when the
          window closes the held option is reverted rather than merged.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R2 with CHANGE protection P3 on itinerary I3, change event CE1 with new date 2026-12-05T00:00:00Z, and two options OPT1 (2026-12-05, 12300) and OPT2 (2026-12-07, 13200)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "ORD", destination_airport: "LHR", flight_number: "HA707", region: "MIDWEST", base_fare_cents: 13200, fare_band_cents: [9000, 12000, 15000, 17000, 19000], peak_price_day_index: 0, seats_left: 6, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r2_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [9000, 9000, 9000, 9000, 9000], seats_left_at_each_day: [6, 6, 6, 6, 6] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r2_id}", departure_date: "2026-12-01T00:00:00Z", traveler_user_id: "tv-otis" }
              as: Traveler
              captures: { i3_id: $.data.id }
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i3_id}", product_type: "CHANGE", cancellation_disruption_probability: 0.70, disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { p3_id: $.data.id , p_v: $.data.version }
            - call: "POST /fare/protections/${p3_id}/activations"
              payload: { expected_protection_version: "${p_v}" }
              as: Traveler
              as_user_id: "tv-otis"
            - call: "POST /fare/change-events"
              payload: { protection_id: "${p3_id}", new_departure_date: "2026-12-05T00:00:00Z", gap_direction: "ORIGIN_DIRECTION" }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { ce1_id: $.data.id }
            - call: "POST /fare/rebooking-options"
              payload: { change_event_id: "${ce1_id}", departure_date: "2026-12-05T00:00:00Z", option_fare_cents: 12300 }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { opt1_id: $.data.id }
            - call: "POST /fare/rebooking-options"
              payload: { change_event_id: "${ce1_id}", departure_date: "2026-12-07T00:00:00Z", option_fare_cents: 13200 }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { opt2_id: $.data.id }
            - call: "POST /fare/change-events/${ce1_id}/selections"
              payload: { option_id: "${opt1_id}" }
              as: Traveler
              as_user_id: "tv-otis"
            - call: "POST /fare/rebooking-options/${opt1_id}/acceptances"
              payload: {}
              as: Traveler
              as_user_id: "tv-otis"
          trigger:
            - call: "POST /fare/rebooking-options/${opt2_id}/acceptances"
              payload: {}
              as: Traveler
              as_user_id: "tv-otis"
              captures: { busy_err: $.data.error_id, busy_message: $.data.message }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
          assert:
            - "accepting OPT2 while OPT1's hold is live is rejected with ERR_OPTION_HOLD_LAPSED or ERR_INVALID_STATE, and OPT2.status remains OFFERED"
            - "RebookingOption.${opt1_id}.hold_expires_at == 2026-09-02T00:00:00Z and the hold is a closed 24-hour window"
            - "after the window closes RebookingOption.${opt1_id}.status == EXPIRED and the window is reverted, not extended or merged"
            - "ChangeEvent.${ce1_id}.status == OPTION_SELECTED again with option_hold_expires_at cleared to null"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_deposit_and_custody_conserved_across_expiry
        grounds:
          - state_machines.PriceFreeze.FROZEN_to_EXPIRED
          - entities.PriceFreeze.fields.custody_held_cents
          - entities.PriceFreeze.fields.custody_return_pending_cents
          - calculations.deposit_attribution_accrual
        distinguishing_aspect: |
          A conserved money quantity rather than a conserved exposure: for a freeze with no forfeiture,
          custody_held_cents + custody_return_pending_cents + deposit_attributed_cents must equal
          deposit_cents at every point of the lifecycle, and the expiry action moves value between the
          buckets without changing the total.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 base 8900 with itinerary I1 and freeze F1 carrying a 7500-cent deposit, activated and frozen, with no membership payment attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 7500, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/payments"
              payload: { itinerary_id: "${i1_id}", freeze_id: "${f1_id}", payment_kind: "DEPOSIT", amount_cents: 7500, capture: true }
              as: OpsAgent
              captures: { pay_id: $.data.id }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/price-freezes/${f1_id}/expirations"
              payload: {}
              as: SystemOperator
          assert:
            - "at 2026-09-06T00:00:00Z, custody_held_cents + custody_return_pending_cents + deposit_attributed_cents == 7500, the deposit intact"
            - "PriceFreeze.${f1_id}.membership_days_elapsed == 5 and deposit_attributed_cents == 2678.57, i.e. round_half_up(7500 x 5 / 14)"
            - "after expiry PriceFreeze.${f1_id}.status == EXPIRED with custody_held_cents == 0 and custody_return_pending_cents == 4821.43"
            - "the invariant holds at both instants: 2678.57 + 4821.43 == 7500 before and after the expiry"

      - name: invariant_reserved_exposure_released_on_conversion
        grounds:
          - state_machines.PriceFreeze.HELD_to_CONVERTED
          - entities.Route.fields.reserved_exposure_cents
          - calculations.guarantee_hedge_rebalance
          - state_machines.Route.SURGE_to_ACTIVE
        distinguishing_aspect: |
          A conserved aggregate quantity rather than a conserved money amount:
          route.reserved_exposure_cents must equal the sum of capped_impact_cents over the route's
          in-service freezes both before and after a conversion, and the conversion is the action that
          drives the aggregate to zero without leaving drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with two frozen freezes F1 and F2 on itineraries I1 and I2, the route in SURGE, both freezes carrying a manifest of 8900 and a cap of 12460."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i2_id: $.data.id, i2_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/itineraries/${i2_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i2_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f2_id: $.data.id, f2_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-freezes/${f2_id}/activations"
              payload: { expected_freeze_version: "${f2_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f2_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f2_id}/activations"
              payload: { expected_freeze_version: "${f2_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i2_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
          trigger:
            - call: "POST /fare/price-freezes/${f1_id}/conversions"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "before the conversion Route.${r1_id}.reserved_exposure_cents == 2640.00, the sum of both freezes' capped impact of 1100.00 x 1.2"
            - "after the conversion Route.${r1_id}.reserved_exposure_cents == 1320.00, exactly the remaining freeze's capped impact, with zero drift"
            - "PriceFreeze.${f1_id}.status == CONVERTED and its 1320.00 slice is released rather than reassigned"
            - "Route.${r1_id}.pooled_exposure_cents == 0 once every freeze has left service, which is the quantity that releases the posture"