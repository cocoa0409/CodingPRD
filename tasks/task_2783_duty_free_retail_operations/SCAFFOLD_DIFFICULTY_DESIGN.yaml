          setup:
            - "Terminal SIN in SG with sealed_bag_regime NONE"
            - "One ELECTRONICS product priced 20000 cents at 700 bps combined levy, LISTED"
            - "20 units received into bonded stock, giving duty_suspended_value_cents 28000"
