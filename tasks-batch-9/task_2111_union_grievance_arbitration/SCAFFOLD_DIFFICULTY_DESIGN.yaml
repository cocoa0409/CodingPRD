          assert:
            - "ArbitrationDemand.${d_id}.estimated_cost_cents == 863250"
            - "ArbitrationDemand.${d_id}.actual_cost_cents == 400000"
            - "ArbitrationDemand.${d_id}.estimated_cost_cents != ArbitrationDemand.${d_id}.actual_cost_cents"
            - "WitnessAssignment.${w1_id}.release_cost_cents == 15000 and WitnessAssignment.${w2_id}.release_cost_cents == 8250, and both are still status INVITED, proving the estimate prices witnesses who have not been confirmed"
            - "The COUNSEL entry of 900000 cents is excluded from actual_cost_cents even though it is POSTED, because COUNSEL is not one of the four arbitration categories"
            - "ArbitrationDemand.${d_id}.status == HEARING_SCHEDULED and brief_due_at == 2026-11-05T17:00:00Z"

