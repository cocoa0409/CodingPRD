# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3232_licensed_merchandise_hot_market_production_event_fulfillment
#
# Nine Difficulty Rules from SKILL.md §0.5, each with two instances.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# All setup_api_calls / trigger chains are structured calls against §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: hot_market_commitment_first_run_vs_later_run
        grounds:
          - calculations.hot_market_capacity_commitment
          - entities.ProductionOrder.fields.capacity_commitment_units
          - endpoints.POST_/production-orders
        distinguishing_aspect: "The same hot-market inputs (Y=1000, Z=0.25, H=2, LOCAL) written by the first-created run for a (team_code, trigger_type) pair commit 375 units through the provisional variant, while the second-created run commits 275 through the superseding variant — the two variants disagree by 100 units on identical inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC1 with royalty_rate_pct 0.125 and minimum_guarantee_cents 2000000. Team ATL design DSG1 on a TRACTOR garment, APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "National Basketball League", league_code: "NBL", royalty_rate_pct: 0.125, minimum_guarantee_cents: 2000000 }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic_id}", team_code: "ATL", garment_sku: "TRACTOR", design_name: "ATL Champs Tractor" }
              as: DesignOps
              captures: { dsg_id: $.data.id }
            - call: "PUT /designs/${dsg_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg_v}" }
              as: LicensingOps
              as_user_id: "${lic_id}"
          trigger:
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic_id}", design_id: "${dsg_id}", team_code: "ATL", trigger_type: "CHAMPIONSHIP_WIN", event_outcome: "WIN_FAVORED_TEAM", expected_demand_qty: 1000, unit_cost_cents: 900, win_probability_pct: 0.25, outcome_at: "2026-09-01T02:00:00Z" }
              as: ProductionPlanner
              captures: { po1_id: $.data.id, po1_units: $.data.capacity_commitment_units }
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic_id}", design_id: "${dsg_id}", team_code: "ATL", trigger_type: "CHAMPIONSHIP_WIN", event_outcome: "WIN_UNDERDOG_TEAM", expected_demand_qty: 1000, unit_cost_cents: 900, win_probability_pct: 0.25, outcome_at: "2026-09-01T02:00:00Z" }
              as: ProductionPlanner
              captures: { po2_id: $.data.id, po2_units: $.data.capacity_commitment_units }
          assert:
            - "ProductionOrder.${po1_id}.capacity_commitment_units == 375"
            - "ProductionOrder.${po2_id}.capacity_commitment_units == 275"
            - "ProductionOrder.${po1_id}.status == PARALLEL_HOLD and ProductionOrder.${po2_id}.status == PARALLEL_HOLD"

      - name: royalty_accrual_per_row_then_sum
        grounds:
          - calculations.licensor_royalty_accrual
          - entities.Licensor.fields.accrued_royalty_cents
          - endpoints.POST_/fulfillment-orders/{fulfillment_order_id}/deliver
        distinguishing_aspect: "Two delivered ECOM orders of 1250 cents each on a CAP design accrue 168.76 under the per-row-then-sum variant and 168.75 under the sum-then-round variant — the two readings differ by one cent on identical data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC2. CAP design DSG2, APPROVED. Production run PO2 committed with a BASE layer. No delivery has happened yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Properties", league_code: "NBL", royalty_rate_pct: 0.125, minimum_guarantee_cents: 200000 }
              as: PlatformAdmin
              captures: { lic2_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic2_id}", team_code: "BOS", garment_sku: "CAP", design_name: "BOS Champs Cap" }
              as: DesignOps
              captures: { dsg2_id: $.data.id }
            - call: "PUT /designs/${dsg2_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg2_v}" }
              as: LicensingOps
              as_user_id: "${lic2_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic2_id}", design_id: "${dsg2_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po2_id: $.data.id, po2_v: $.data.version }
            - call: "POST /production-orders/${po2_id}/layers"
              payload: { expected_production_order_version: "${po2_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { po2_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po2_id}", channel: "ECOM", destination_code: "ECOM-BOS-1", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fo2a_id: $.data.id }
            - call: "POST /fulfillment-orders/${fo2a_id}/pick"
              payload: { expected_production_order_version: "${po2_v2}", quantity: 250, pick_remark: "pick-a" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo2a_id}/ship"
              payload: { quantity: 250, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo2a_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po2_id}", channel: "ECOM", destination_code: "ECOM-BOS-2", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fo2b_id: $.data.id }
            - call: "GET /production-orders/${po2_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po2_v3: $.data.version }
            - call: "POST /fulfillment-orders/${fo2b_id}/pick"
              payload: { expected_production_order_version: "${po2_v3}", quantity: 250, pick_remark: "pick-b" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo2b_id}/ship"
              payload: { quantity: 250, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fo2b_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
          trigger:
            - call: "GET /licensors/${lic2_id}"
              payload: {}
              as: LicensingOps
              as_user_id: "${lic2_id}"
              captures: { acc_two_orders: $.data.accrued_royalty_cents }
          assert:
            - "Licensor.${lic2_id}.accrued_royalty_cents == 168.76"
            - "Licensor.${lic2_id}.accrued_royalty_cents != 168.75"
            - "ProductionOrder.${po2_id}.status == PRINTING"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: hot_market_hour_band_and_tier_residual
        grounds:
          - calculations.hot_market_capacity_commitment
          - validations[priority=12]
          - entities.ProductionOrder.fields.expected_demand_qty
        distinguishing_aspect: "The tier boundary is inclusive at >= 25000 demand units and the hour band is strict at > 1 hour, so (24999, H=2) falls in LOCAL and multiplies by 1.5 while (25000, H=1) falls in REGIONAL and adds the 50-unit residual — adjacent inputs land in different tiers, different hour bands and different residual buckets."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC3 with a MILESTONE-eligible design DSG3, APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Legends", league_code: "NBLM", royalty_rate_pct: 0.1, minimum_guarantee_cents: 500000 }
              as: PlatformAdmin
              captures: { lic3_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic3_id}", team_code: "ATL", player_code: "ATL-23", garment_sku: "JERSEY", design_name: "ATL Milestone Jersey" }
              as: DesignOps
              captures: { dsg3_id: $.data.id }
            - call: "PUT /designs/${dsg3_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg3_v}" }
              as: LicensingOps
              as_user_id: "${lic3_id}"
          trigger:
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic3_id}", design_id: "${dsg3_id}", team_code: "ATL", trigger_type: "MILESTONE", event_outcome: "NO_OUTCOME", expected_demand_qty: 24999, unit_cost_cents: 900, win_probability_pct: 0.5, outcome_at: "2026-09-01T02:00:00Z" }
              as: ProductionPlanner
              captures: { po_local_units_id: $.data.id, po_local_units: $.data.capacity_commitment_units }
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic3_id}", design_id: "${dsg3_id}", team_code: "ATL", trigger_type: "MILESTONE", event_outcome: "NO_OUTCOME", expected_demand_qty: 25000, unit_cost_cents: 900, win_probability_pct: 0.5, outcome_at: "2026-09-01T01:00:00Z" }
              as: ProductionPlanner
              captures: { po_regional_units_id: $.data.id, po_regional_units: $.data.capacity_commitment_units }
          assert:
            - "ProductionOrder.${po_local_units_id}.capacity_commitment_units == 18750"
            - "ProductionOrder.${po_regional_units_id}.capacity_commitment_units == 12550"
            - "the two totals differ by 6200 units on demand quantities that are one unit apart"
            - "neither run is rejected with ERR_UNBALANCED_ALLOCATION"

      - name: wholesale_summation_order_pin
        grounds:
          - calculations.wholesale_fulfillment_total
          - entities.FulfillmentOrder.fields.requested_wholesale_cents
          - endpoints.POST_/fulfillment-orders
        distinguishing_aspect: "The total is assembled from three conditional branches — channel rate, rush surcharge and donation flat — and the post-event rail later replaces rather than adjusts that total, so two orders differing only in the donation code write 3500 and 3600 while an otherwise identical distressed order writes 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC4, TRACTOR design DSG4 APPROVED, run PO4 committed with a BASE layer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Retail", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic4_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic4_id}", team_code: "PHI", garment_sku: "TRACTOR", design_name: "PHI Champs Tractor" }
              as: DesignOps
              captures: { dsg4_id: $.data.id }
            - call: "PUT /designs/${dsg4_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg4_v}" }
              as: LicensingOps
              as_user_id: "${lic4_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic4_id}", design_id: "${dsg4_id}", team_code: "PHI", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po4_id: $.data.id, po4_v: $.data.version }
            - call: "POST /production-orders/${po4_id}/layers"
              payload: { expected_production_order_version: "${po4_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
          trigger:
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po4_id}", channel: "VENUE_RETAIL", destination_code: "PHI_TEAMSTORE", quantity: 250, rush_flag: true }
              as: FulfillmentCoordinator
              captures: { fo4_plain_id: $.data.id, fo4_plain_total: $.data.requested_wholesale_cents }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po4_id}", channel: "VENUE_RETAIL", destination_code: "PHI_TEAMSTORE", quantity: 250, rush_flag: true, donation_recipient_code: "RECIPIENT_FREEBIE" }
              as: FulfillmentCoordinator
              captures: { fo4_don_id: $.data.id, fo4_don_total: $.data.requested_wholesale_cents }
          assert:
            - "FulfillmentOrder.${fo4_plain_id}.requested_wholesale_cents == 3500"
            - "FulfillmentOrder.${fo4_don_id}.requested_wholesale_cents == 3600"
            - "FulfillmentOrder.${fo4_don_id}.channel == VENUE_RETAIL and quantity == 250"
            - "the donation branch adds exactly one flat charge of 100 cents on top of the identical channel and rush terms"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: production_order_printing_revert_reopen_window
        grounds:
          - state_machines.ProductionOrder.PRINTING_to_COMMITTED
          - state_machines.PrintLayer.PRINTED_to_PRINT_FAILED
          - entities.ProductionOrder.fields.committed_at
        distinguishing_aspect: "A print-failure whose reducer leaves committed_qty at zero drives the run PRINTING back to COMMITTED inside the reopen window and re-stamps committed_at, so the run can be layered and printed again — the machine cycles rather than marching forward, and the cycle is bounded by the logical clock rather than by transition shape."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC5, TRACTOR design DSG5 APPROVED, run PO5 committed with a single BASE layer of 20 units and printed once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Apparel", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic5_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic5_id}", team_code: "BOS", garment_sku: "TRACTOR", design_name: "BOS Champs Tractor" }
              as: DesignOps
              captures: { dsg5_id: $.data.id }
            - call: "PUT /designs/${dsg5_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg5_v}" }
              as: LicensingOps
              as_user_id: "${lic5_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic5_id}", design_id: "${dsg5_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po5_id: $.data.id, po5_v: $.data.version }
            - call: "POST /production-orders/${po5_id}/layers"
              payload: { expected_production_order_version: "${po5_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { po5_v2: $.data.version, lay5_id: "$.data.layer_ids[0]" }
            - call: "POST /print-layers/${lay5_id}/print"
              payload: { printed_qty: 20 }
              as: PrintOperator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /print-layers/${lay5_id}/print-failure"
              payload: { failed_qty: 40 }
              as: PrintOperator
            - call: "GET /production-orders/${po5_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po5_status: $.data.status, po5_committed_at: $.data.committed_at, po5_base_units: $.data.base_units_printed }
          assert:
            - "ProductionOrder.${po5_id}.status == COMMITTED"
            - "ProductionOrder.${po5_id}.committed_at is strictly later than 2026-09-01T00:00:00Z"
            - "ProductionOrder.${po5_id}.base_units_printed == 0"
            - "PrintLayer ${lay5_id}.layer_state == PRINT_FAILED"
            - "PrintLayer ${lay5_id}.printed_qty == 20 and committed_qty == 0"

      - name: design_rejection_resubmission_cycle
        grounds:
          - state_machines.Design.APPROVAL_REJECTED_to_PENDING_LICENSOR_APPROVAL
          - state_machines.Design.PENDING_LICENSOR_APPROVAL_to_APPROVAL_REJECTED
          - endpoints.PUT_/designs/{design_id}/submit
        distinguishing_aspect: "APPROVAL_REJECTED returns to PENDING_LICENSOR_APPROVAL on resubmission and can then be approved, so the design machine is a cycle with an explicit revert rather than a linear pending-approve-or-rejected pipeline."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC6 and design DSG6 in APPROVAL_REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Marks", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic6_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic6_id}", team_code: "NYC", garment_sku: "MINI", design_name: "NYC Champs Mini" }
              as: DesignOps
              captures: { dsg6_id: $.data.id, dsg6_v: $.data.version }
            - call: "PUT /designs/${dsg6_id}/licensor-decision"
              payload: { decision: "REJECT", expected_design_version: "${dsg6_v}", rejection_reason: "Mark placement off brand" }
              as: LicensingOps
              as_user_id: "${lic6_id}"
              captures: { dsg6_v1: $.data.version }
          trigger:
            - call: "PUT /designs/${dsg6_id}/submit"
              payload: { expected_design_version: "${dsg6_v1}" }
              as: DesignOps
              captures: { dsg6_v2: $.data.version, dsg6_state_after_submit: $.data.approval_state }
            - call: "PUT /designs/${dsg6_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg6_v2}" }
              as: LicensingOps
              as_user_id: "${lic6_id}"
              captures: { dsg6_v3: $.data.version, dsg6_approved: $.data.approved_version }
          assert:
            - "Design.${dsg6_id}.rejection_reason == null after the resubmission"
            - "Design.${dsg6_id}.approval_state == APPROVED after the second decision"
            - "Design.${dsg6_id}.approved_version == ${dsg6_v3}"
            - "the resubmission response reports approval_state == PENDING_LICENSOR_APPROVAL"
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: design_rejection_three_hop_cascade
        grounds:
          - state_machines.Design.PENDING_LICENSOR_APPROVAL_to_APPROVAL_REJECTED
          - state_machines.PrintLayer.PRINTED_to_PRINT_FAILED
          - state_machines.FulfillmentOrder.PICKED_to_DISTRESSED
          - entities.FulfillmentOrder.fields.requested_wholesale_cents
        distinguishing_aspect: "Rejecting a design retires its run, which moves that run's layers to PRINT_FAILED, which then rescales the run's picked order to DISTRESSED — three hops, each caused by the previous one, and the third hop's value (0) is not derivable from the first action on its own."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC7, design DSG7 APPROVED, run PO7 committed with a BASE layer of 20, printed once at 20 units. Two orders foX and foY planned at 250 units each; the run committed_inventory_cents supports both halves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Cascade", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 1000000 }
              as: PlatformAdmin
              captures: { lic7_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic7_id}", team_code: "ATL", garment_sku: "TRACTOR", design_name: "ATL Cascade Tractor" }
              as: DesignOps
              captures: { dsg7_id: $.data.id, dsg7_v: $.data.version }
            - call: "PUT /designs/${dsg7_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg7_v}" }
              as: LicensingOps
              as_user_id: "${lic7_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic7_id}", design_id: "${dsg7_id}", team_code: "ATL", trigger_type: "CHAMPIONSHIP_WIN", event_outcome: "WIN_FAVORED_TEAM", expected_demand_qty: 20000, unit_cost_cents: 900, win_probability_pct: 0.5, outcome_at: "2026-09-01T01:00:00Z" }
              as: ProductionPlanner
              captures: { po7_id: $.data.id, po7_v: $.data.version }
            - call: "POST /production-orders/${po7_id}/layers"
              payload: { expected_production_order_version: "${po7_v}", layers: [{ print_type: "BASE", quantity: 20000 }] }
              as: ProductionPlanner
              captures: { po7_v2: $.data.version, lay7_id: "$.data.layer_ids[0]" }
            - call: "POST /print-layers/${lay7_id}/print"
              payload: { printed_qty: 20000 }
              as: PrintOperator
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po7_id}", channel: "ECOM", destination_code: "ECOM-ATL-1", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fo7x_id: $.data.id }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po7_id}", channel: "ECOM", destination_code: "ECOM-ATL-2", quantity: 250 }
              as: FulfillmentCoordinator
              captures: { fo7y_id: $.data.id }
            - call: "POST /fulfillment-orders/${fo7x_id}/pick"
              payload: { expected_production_order_version: "${po7_v2}", quantity: 250, pick_remark: "pick-c1" }
              as: FulfillmentCoordinator
            - call: "GET /production-orders/${po7_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po7_v3: $.data.version }
            - call: "POST /fulfillment-orders/${fo7y_id}/pick"
              payload: { expected_production_order_version: "${po7_v3}", quantity: 250, pick_remark: "pick-c2" }
              as: FulfillmentCoordinator
          trigger:
            - call: "PUT /designs/${dsg7_id}/licensor-decision"
              payload: { decision: "REJECT", expected_design_version: "${dsg7_v2}", rejection_reason: "Licensor withdrew the mark" }
              as: LicensingOps
              as_user_id: "${lic7_id}"
            - call: "GET /production-orders/${po7_id}"
              payload: {}
              as: ProductionPlanner
              captures: { hop1_status: $.data.status, hop1_reason: $.data.retire_reason }
            - call: "GET /print-layers?production_order_id=${po7_id}"
              payload: {}
              as: ProductionPlanner
              captures: { hop2_state: "$.data[0].layer_state", hop2_committed: "$.data[0].committed_qty" }
            - call: "GET /fulfillment-orders?production_order_id=${po7_id}"
              payload: {}
              as: FulfillmentCoordinator
              captures: { hop3_state: "$.data[0].status", hop3_total: "$.data[0].requested_wholesale_cents" }
          assert:
            - "ProductionOrder.${po7_id}.status == RETIRED_DESTROYED and retire_reason == ASSORTMENT_CHANGED"
