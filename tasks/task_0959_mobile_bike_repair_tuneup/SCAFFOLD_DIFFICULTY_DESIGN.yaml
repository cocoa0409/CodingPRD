          assert:
            - "First request: 201, covered_by_subscription == true (allowance_remaining was exactly 1, >= 1 holds)"
            - "Second request: ERR_ALLOWANCE_EXHAUSTED (422) when allowance_remaining == 0"

      - name: stock_reserve_exact_on_hand_boundary
        grounds:
