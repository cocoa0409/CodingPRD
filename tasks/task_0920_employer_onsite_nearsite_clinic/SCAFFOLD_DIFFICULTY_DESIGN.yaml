              as: ClinicManager
            - call: "POST /staffing-shifts"
              payload: { site_id: "${site_id}", provider_id: "${clin_id}", shift_start: "2026-06-09T08:00:00Z", shift_end: "2026-06-09T17:00:00Z", coverage_role: "PRIMARY_CARE" }
