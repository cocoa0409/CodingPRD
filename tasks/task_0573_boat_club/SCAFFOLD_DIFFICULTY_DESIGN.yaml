            - { call: "POST /enrollments/${eo1}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb1: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m1}", session_id: "${sb1}" }, as: Member, as_user_id: "${m1}", captures: { eb1: "$.data.id" } }
