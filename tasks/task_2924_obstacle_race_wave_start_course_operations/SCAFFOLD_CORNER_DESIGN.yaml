      - name: the_permit_gate_runs_before_the_design_gates_on_validate
        claim_type: Cascading validation
        grounds:
          - validations[priority 23]
          - validations[priority 25]
          - errors[ERR_PERMIT_NOT_APPROVED]
          - errors[ERR_COURSE_TOO_SHORT]
        distinguishing_aspect: "Validate must answer with the priority-23 permit error while the application is still SUBMITTED, and only after approval reveal the priority-25 station-count error on the identical course — the design checks are downstream of the permit check, not evaluated together."
        test_recipe:
