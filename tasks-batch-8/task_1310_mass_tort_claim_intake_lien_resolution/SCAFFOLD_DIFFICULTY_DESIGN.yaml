              as: LienAnalyst
              captures: { lid2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid1}/notify"
              payload: {}
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid1}/begin-negotiation"
