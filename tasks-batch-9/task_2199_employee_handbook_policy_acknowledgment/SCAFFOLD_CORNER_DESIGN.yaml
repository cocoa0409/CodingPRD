scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_jurisdiction_creation_echoes_all_declared_fields
        claim_type: Creation
        grounds: ["entities.Jurisdiction", "endpoints[POST /jurisdictions]"]
        distinguishing_aspect: "A fresh Jurisdiction is created with every declared input field and the 201 body must echo all of them plus the common fields at version 1."
        test_recipe:
          setup: ["Empty database at the 2026-08-01T00:00:00Z startup clock."]
          setup_api_calls: []
          trigger:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en", "es"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
          assert:
            - "http_status == 201"
            - "response_type == object"
            - "Jurisdiction.${j_ca}.state_code == CA"
            - "Jurisdiction.${j_ca}.min_legal_review_days == 10"
            - "Jurisdiction.${j_ca}.ack_deadline_days == 30"
            - "Jurisdiction.${j_ca}.retention_years == 5"
            - "Jurisdiction.${j_ca}.required_language_codes == [en, es]"
            - "Jurisdiction.${j_ca}.esign_permitted == true"
            - "Jurisdiction.${j_ca}.proxy_ack_permitted == false"
            - "Jurisdiction.${j_ca}.ack_window_buffer_days == 3"
            - "Jurisdiction.${j_ca}.version == 1"
            - "Jurisdiction.${j_ca}.created_at == 2026-08-01T00:00:00.000Z"
      - name: corner_legal_reviewer_single_resource_get_returns_stored_row
        claim_type: Retrieval
        grounds: ["entities.LegalReviewer", "endpoints[GET /legal-reviewers/{legal_reviewer_id}]"]
        distinguishing_aspect: "The single-resource read returns exactly the stored LegalReviewer including the denormalized open_review_count, which is 0 before any review is requested."
        test_recipe:
          setup: ["One Jurisdiction CA and one LegalReviewer in it, with no LegalReview rows anywhere."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 2, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
          trigger:
            - { call: "GET /legal-reviewers/${r_ca}", payload: {}, as: HRComplianceAdmin }
          assert:
            - "http_status == 200"
            - "LegalReviewer.${r_ca}.jurisdiction_id == ${j_ca}"
            - "LegalReviewer.${r_ca}.bar_number == CA-1"
            - "LegalReviewer.${r_ca}.concurrent_review_limit == 2"
            - "LegalReviewer.${r_ca}.open_review_count == 0"
            - "LegalReviewer.${r_ca}.is_active == true"
      - name: corner_jurisdiction_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints[GET /jurisdictions]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "Three jurisdictions exist; a limit of 2 at offset 0 must return exactly 2 rows with total_count 3 and has_more true, proving the count is over the whole filtered set and not the page."
        test_recipe:
          setup: ["Three Jurisdictions CA, TX and NY."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin }
            - { call: "POST /jurisdictions", payload: { state_code: "TX", display_name: "Texas", min_legal_review_days: 5, ack_deadline_days: 45, retention_years: 2, required_language_codes: ["en"] }, as: HRComplianceAdmin }
            - { call: "POST /jurisdictions", payload: { state_code: "NY", display_name: "New York", min_legal_review_days: 20, ack_deadline_days: 14, retention_years: 7, required_language_codes: ["en", "es"] }, as: HRComplianceAdmin }
          trigger:
            - { call: "GET /jurisdictions", payload: { limit: 2, offset: 0 }, as: HRComplianceAdmin }
          assert:
            - "http_status == 200"
            - "response_type == array"
            - "the returned data array has exactly 2 elements"
            - "meta.total_count == 3"
            - "meta.has_more == true"
            - "meta.limit == 2 and meta.offset == 0"
            - "rows are ordered by created_at ASC, so data[0].state_code == CA and data[1].state_code == TX"
      - name: corner_unknown_policy_version_id_returns_resource_not_found
        claim_type: Not Found
        grounds: ["validations[priority=5]", "errors[ERR_RESOURCE_NOT_FOUND]", "endpoints[GET /policy-versions/{policy_version_id}]"]
        distinguishing_aspect: "A syntactically valid but unknown path id resolves to nothing, so the priority-5 existence gate answers 404 before any business rule is consulted."
        test_recipe:
          setup: ["Empty database; no PolicyVersion rows exist."]
          setup_api_calls: []
          trigger:
            - { call: "GET /policy-versions/00000000-0000-0000-0000-000000000000", payload: {}, as: HRComplianceAdmin }
          assert:
            - "http_status == 404"
            - "response_type == error"
            - "error.error_id == ERR_RESOURCE_NOT_FOUND"
      - name: corner_employee_creation_missing_work_email_rejected
        claim_type: Required Fields
        grounds: ["validations[priority=7]", "errors[ERR_VALIDATION]", "endpoints[POST /employees]"]
        distinguishing_aspect: "work_email is a required input with no default, so omitting it must be refused by the priority-7 schema gate with 422 and no Employee row created."
        test_recipe:
          setup: ["One Jurisdiction CA."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
          trigger:
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", full_name: "No Email" }, as: HRComplianceAdmin }
          assert:
            - "http_status == 422"
            - "error.error_id == ERR_VALIDATION"
            - "GET /employees?jurisdiction_id=${j_ca} returns an empty list"
      - name: corner_employee_optional_fields_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds: ["entities.Employee", "entities.LegalReviewer", "endpoints[POST /employees]", "endpoints[POST /legal-reviewers]"]
        distinguishing_aspect: "Omitting every optional input must yield the declared defaults rather than nulls: Employee employment_status ACTIVE, needs_accessible_format false, manager_id null, and LegalReviewer is_active true with open_review_count 0."
        test_recipe:
          setup: ["One Jurisdiction CA."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
          trigger:
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "bare@ex.com", full_name: "Bare Minimum" }, as: HRComplianceAdmin, captures: { e_bare: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Bare Counsel", bar_number: "CA-9" }, as: HRComplianceAdmin, captures: { r_bare: "$.data.id" } }
          assert:
            - "Employee.${e_bare}.employment_status == ACTIVE"
            - "Employee.${e_bare}.needs_accessible_format == false"
            - "Employee.${e_bare}.manager_id == null"
            - "Employee.${e_bare}.open_ack_count == 0"
            - "Employee.${e_bare}.open_escalation_count == 0"
            - "LegalReviewer.${r_bare}.is_active == true"
            - "LegalReviewer.${r_bare}.open_review_count == 0"
      - name: corner_policy_document_latest_version_no_is_computed_not_supplied
        claim_type: Computed Fields
        grounds: ["entities.PolicyDocument.fields.latest_version_no", "entities.PolicyVersion.fields.version_no", "endpoints[POST /policy-documents/{policy_document_id}/versions]"]
        distinguishing_aspect: "version_no and latest_version_no are computed by the server from the document's existing version count; the request body cannot supply them, and creating a second version must advance both to 2 without any client input."
        test_recipe:
          setup: ["One Jurisdiction CA and one PolicyDocument with no versions yet, so latest_version_no starts at 0."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "GET /policy-documents/${d1}", payload: {}, as: PolicyAuthor, captures: { d1v2: "$.data.version" } }
          trigger:
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 rev", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v2}" }, as: PolicyAuthor, captures: { v2: "$.data.id" } }
          assert:
            - "PolicyVersion.${v1}.version_no == 1"
            - "PolicyVersion.${v2}.version_no == 2"
            - "PolicyDocument.${d1}.latest_version_no == 2"
            - "PolicyDocument.${d1}.current_published_version_id == null"
            - "PolicyVersion.${v2}.status == DRAFT"
            - "PolicyVersion.${v2}.revision_round == 0"
      - name: corner_system_fields_are_server_generated_and_client_values_ignored
        claim_type: System Fields
        grounds: ["entities.PolicyDocument", "endpoints[POST /policy-documents]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced: created_at must equal the logical clock at insert time (2026-08-04T00:00:00Z here), not wall-clock time and not any client-provided value, and version must start at 1."
        test_recipe:
          setup: ["Logical clock advanced from the 2026-08-01T00:00:00Z default to 2026-08-04T00:00:00Z before the insert."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: HRComplianceAdmin }
          trigger:
            - { call: "POST /policy-documents", payload: { title: "Data Privacy Handbook 2026", category: "DATA_PRIVACY", max_ack_deadline_days: 10 }, as: PolicyAuthor, captures: { d1: "$.data.id" } }
          assert:
            - "PolicyDocument.${d1}.id is a server-generated identifier that appears nowhere in the request body"
            - "PolicyDocument.${d1}.created_at == 2026-08-04T00:00:00.000Z"
            - "PolicyDocument.${d1}.updated_at == 2026-08-04T00:00:00.000Z"
            - "PolicyDocument.${d1}.version == 1"
            - "PolicyDocument.${d1}.latest_version_no == 0"
      - name: corner_out_of_range_and_invalid_enum_inputs_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "errors[ERR_VALIDATION]", "endpoints[POST /jurisdictions]", "endpoints[POST /employees]"]
        distinguishing_aspect: "Two different shape violations on two different entities must both land on the priority-7 schema gate: a negative min_legal_review_days (integer out of declared bounds) and an employment_status outside the declared enum."
        test_recipe:
          setup: ["One Jurisdiction CA already exists so the second call has a resolvable parent."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
          trigger:
            - { call: "POST /jurisdictions", payload: { state_code: "WA", display_name: "Washington", min_legal_review_days: -1, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "bad@ex.com", full_name: "Bad Enum", employment_status: "FURLOUGHED" }, as: HRComplianceAdmin }
          assert:
            - "the first trigger call returns http_status == 422 with error.error_id == ERR_VALIDATION"
            - "the second trigger call returns http_status == 422 with error.error_id == ERR_VALIDATION"
            - "GET /jurisdictions?state_code=WA returns an empty list"
            - "GET /employees?jurisdiction_id=${j_ca} returns an empty list"
      - name: corner_release_item_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds: ["entities.ReleaseItem", "endpoints[GET /release-items/{release_item_id}]"]
        distinguishing_aspect: "ReleaseItem is declared common_fields: false, so §1.5 exposes no PATCH or DELETE for it and its representation carries created_at but no version and no updated_at; the same holds for Acknowledgment and RetentionRecord."
        test_recipe:
          setup: ["One Jurisdiction CA, one PolicyDocument with a DRAFT version, and a DRAFT ReleasePackage holding one ReleaseItem for that version."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-09-19T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin, captures: { ri1: "$.data.id" } }
          trigger:
            - { call: "GET /release-items/${ri1}", payload: {}, as: HRComplianceAdmin }
          assert:
            - "http_status == 200"
            - "ReleaseItem.${ri1}.release_package_id == ${p1}"
            - "ReleaseItem.${ri1}.policy_version_id == ${v1}"
            - "ReleaseItem.${ri1}.supersedes_version_id == null"
            - "the ReleaseItem representation exposes created_at but no version field and no updated_at field"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose output entity is ReleaseItem, Acknowledgment or RetentionRecord"
      - name: corner_parent_and_body_fk_integrity_use_distinct_error_ids
        claim_type: Parent Relationships
        grounds: ["validations[priority=5]", "validations[priority=6]", "errors[ERR_RESOURCE_NOT_FOUND]", "errors[ERR_REFERENCED_ENTITY_NOT_FOUND]", "endpoints[POST /policy-documents/{policy_document_id}/versions]", "endpoints[POST /employees]"]
        distinguishing_aspect: "An unresolvable PATH parent and an unresolvable BODY foreign key are different failures: the nested version create under an unknown document id must answer ERR_RESOURCE_NOT_FOUND at priority 5, while an Employee create naming an unknown jurisdiction_id must answer ERR_REFERENCED_ENTITY_NOT_FOUND at priority 6."
        test_recipe:
          setup: ["One Jurisdiction CA and one real PolicyDocument, so both failures are caused purely by the bad identifier and not by an empty database."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
          trigger:
            - { call: "POST /policy-documents/00000000-0000-0000-0000-000000000000/versions", payload: { body_text: "S1", section_count: 1, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor }
            - { call: "POST /employees", payload: { jurisdiction_id: "00000000-0000-0000-0000-000000000000", work_email: "orphan@ex.com", full_name: "Orphan Emp" }, as: HRComplianceAdmin }
          assert:
            - "the first trigger call returns http_status == 404 with error.error_id == ERR_RESOURCE_NOT_FOUND"
            - "the second trigger call returns http_status == 404 with error.error_id == ERR_REFERENCED_ENTITY_NOT_FOUND"
            - "PolicyDocument.${d1}.latest_version_no == 0"
            - "PolicyDocument.${d1}.version == ${d1v}"
      - name: corner_graph_topology_junction_and_self_reference
        claim_type: Parent Relationships
        grounds: ["complexity_profile.entity_topology", "entities.ReleaseItem", "entities.Employee.fields.manager_id", "endpoints[POST /release-packages/{release_package_id}/items]", "endpoints[GET /release-items]", "endpoints[GET /employees]"]
        distinguishing_aspect: "The graph topology has two shapes to prove: ReleaseItem is a many-to-many junction, so one PolicyVersion can sit in two packages and one package can hold two versions; and Employee.manager_id is self-referential, so a manager row can be the parent of a subordinate row of the same entity and is filterable by manager_id."
        test_recipe:
          setup: ["One Jurisdiction CA; a manager Employee with manager_id null and two subordinates pointing at it; one PolicyDocument with two DRAFT versions; two DRAFT ReleasePackages."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"] }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "mgr@ex.com", full_name: "Mgr Zero" }, as: HRComplianceAdmin, captures: { e_mgr: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One", manager_id: "${e_mgr}" }, as: HRComplianceAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e2@ex.com", full_name: "Emp Two", manager_id: "${e_mgr}" }, as: HRComplianceAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "GET /policy-documents/${d1}", payload: {}, as: PolicyAuthor, captures: { d1v2: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 rev", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v2}" }, as: PolicyAuthor, captures: { v2: "$.data.id" } }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-09-19T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /release-packages", payload: { name: "P2", effective_date: "2026-09-26T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p2: "$.data.id" } }
          trigger:
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v2}" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p2}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin }
            - { call: "GET /employees", payload: { manager_id: "${e_mgr}" }, as: HRComplianceAdmin }
          assert:
            - "all three item creates return http_status == 201"
            - "GET /release-items?release_package_id=${p1} returns exactly 2 rows, one per version"
            - "GET /release-items?policy_version_id=${v1} returns exactly 2 rows, one per package"
            - "the fourth trigger call returns exactly 2 rows whose ids are ${e1} and ${e2}"
            - "meta.total_count == 2"
            - "Employee.${e_mgr}.manager_id == null"

  - section: state_machines
    instances:
      - name: corner_initial_states_of_the_three_authoring_machines
        claim_type: Initial State
        grounds: ["state_machines[PolicyVersion].initial_state", "state_machines[ReleasePackage].initial_state", "state_machines[Translation].initial_state"]
        distinguishing_aspect: "Three machines start in three differently named initial states that no request may choose: PolicyVersion in DRAFT, ReleasePackage in DRAFT and Translation in PENDING, each with its computed companions still null."
        test_recipe:
          setup: ["One Jurisdiction CA and one PolicyDocument, at the 2026-08-01T00:00:00Z startup clock."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
          trigger:
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-09-01T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
          assert:
            - "PolicyVersion.${v1}.status == DRAFT"
            - "PolicyVersion.${v1}.approved_at == null"
            - "Translation.${t1}.status == PENDING"
            - "Translation.${t1}.a11y_index == null"
            - "Translation.${t1}.conformance_level == null"
            - "ReleasePackage.${p1}.status == DRAFT"
            - "ReleasePackage.${p1}.scheduled_at == null"
            - "ReleasePackage.${p1}.legal_review_deadline == null"
      - name: corner_translation_pending_to_in_translation_is_a_valid_transition
        claim_type: Valid Transition
        grounds: ["state_machines[Translation].transitions[PENDING->IN_TRANSLATION]", "endpoints[POST /translations/{translation_id}/start]"]
        distinguishing_aspect: "The declared happy-path hop of the Translation machine advances status to IN_TRANSLATION and increments version, while leaving the a11y fields untouched because scoring only happens at submit-a11y."
        test_recipe:
          setup: ["One Jurisdiction CA, one PolicyDocument with a DRAFT PolicyVersion, and one PENDING Translation for language en."]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 5, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT" }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2", section_count: 2, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
