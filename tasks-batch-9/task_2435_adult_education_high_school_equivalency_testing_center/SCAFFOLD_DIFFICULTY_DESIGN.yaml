  - rule_id: non_linear_state_machine
    instances:
      - name: exam_registration_parallel_identity_and_registration_dimensions
        shape: parallel
        grounds:
          - state_machines[ExamRegistration].transitions
          - state_machines[ExamRegistration.identity_status].transitions
          - validations[priority=51]
          - errors[ERR_IDENTITY_NOT_VERIFIED]
          - errors[ERR_IDENTITY_ALREADY_VERIFIED]
        distinguishing_aspect: |
          Parallel dimensions on ExamRegistration: identity_status walks
          UNVERIFIED -> ID_REJECTED -> VERIFIED (a re-entry after a rejected document) while
          registration_status stays REGISTERED throughout, and only once the identity axis reaches
          VERIFIED does the registration axis advance REGISTERED -> CHECKED_IN -> SCORED. A second
          VERIFIED decision on the identity axis is refused without disturbing the other axis.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center, ACTIVE room, certified proctor."
            - "Student PLACED at EFL 2 (PRE_TEST 205 scored 2026-08-02)."
            - "MATH session 2026-08-05T09:00-11:00Z, proctor assigned (SCHEDULED), one REGISTERED registration."
            - "Clock advanced to 2026-08-05T08:30:00Z, inside the seating window."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Parallel Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
