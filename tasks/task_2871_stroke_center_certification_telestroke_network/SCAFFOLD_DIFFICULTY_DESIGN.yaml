    - 'state_machines.ThrombolyticChecklist: documentation_status=AMENDED -> documentation_status=DOCUMENTED, determination_status=ELIGIBLE_WITH_RELATIVE_OVERRIDE'
    - 'state_machines.CodeStrokeCase: ELIGIBILITY_DETERMINED -> ELIGIBILITY_DETERMINED (re-determination self-loop)'
    - calculations.eligibility_score (ATTESTED outcome ladder)
    - endpoints.POST /stroke-network/checklists/{id}/amend
    distinguishing_aspect: 'A different entity and a different flavour of non-linearity from the consult loop: ThrombolyticChecklist carries TWO PARALLEL STATE DIMENSIONS on one row and the amendment moves them in OPPOSITE directions — documentation_status advances DOCUMENTED -> AMENDED while determination_status is dragged BACKWARD to PENDING and attested_eligibility_score is nulled. The linked CodeStrokeCase meanwhile takes a SELF-LOOP (ELIGIBILITY_DETERMINED -> ELIGIBILITY_DETERMINED) rather than rewinding, so the parent and child dimensions are provably not ordered relative to each other.'
