              as: VendorAdmin
              as_user_id: "${v_fholv_id}"
              captures: { pir_fh_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_fh_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_fholv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_fh_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_fh_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_fh_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_fh_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_fh_id}", case_number: "CASE-15170", procedure_name: "Fee Hold Case A", scheduled_start_utc: "2026-11-02T08:00:00Z", scheduled_end_utc: "2026-11-02T11:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15170_id: $.data.id, case_15170_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_15170_id}", approved_product_id: "${ap_fh_id}", tray_count: 12, reprocessing_complexity: "IMPLANT_SPECIALTY", expected_case_version: "${case_15170_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_fh_a_id: $.data.id }
            - call: "POST /vendor-access/loaner-sets/${ls_fh_a_id}/receive"
              payload: { delivered_at_utc: "2026-11-03T02:20:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_fh_id}", case_number: "CASE-15171", procedure_name: "Fee Hold Case B", scheduled_start_utc: "2026-11-05T08:00:00Z", scheduled_end_utc: "2026-11-05T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15171_id: $.data.id, case_15171_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_15171_id}", approved_product_id: "${ap_fh_id}", tray_count: 2, reprocessing_complexity: "SIMPLE", expected_case_version: "${case_15171_ver}" }
              as: SterileProcessingTech
