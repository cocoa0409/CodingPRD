              payload: {}
              as: LmsAdmin
              captures: { active_after: $.data.active_enrollment_count, util_after: $.data.seat_utilization_pct, of_after: $.data.overflow_flag }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s7}", role: "STUDENT" }
              as: Registrar
              captures: { err_seventh: $.data.error_id }
          assert:
            - "${cap_at_approve} == 5 and ${active5} == ACTIVE — the shell is exactly full at NORMAL"
            - "${err_normal} == ERR_SEAT_CAP_EXCEEDED at HTTP 422"
            - "${post1} == ELEVATED with ${cap_elevated} == 5  # 5 + floor(5 * 0.10) = 5 + 0 — the recompute ran but granted nothing"
            - "${err_elevated} == ERR_SEAT_CAP_EXCEEDED — the identical request is still refused, proving the check consumed the re-derived cap rather than a hardcoded ratio"
            - "${post2} == CONTINUITY_MODE with ${cap_continuity} == 6  # 5 + floor(5 * 0.20) = 5 + 1"
            - "${e6_state} == ACTIVE — the third identical request now passes"
            - "${active_after} == 6, ${util_after} == 120.00 (6 / base_seat_cap 5) and ${of_after} == true — utilization is measured against the BASE cap, so overflow is visible"
            - "${err_seventh} == ERR_SEAT_CAP_EXCEEDED — the new ceiling is 6, not unlimited"

      - name: two_rules_in_different_priority_bands_resolve_to_the_stronger_one
        claim_type: priority_conflict
        grounds:
          - validations[17]
          - validations[18]
          - validations[23]
          - validations[43]
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_review_dimension_conflict_on_tool_reviews
          rationale: "Both §1.8 priority_pair_validation_conflict instances are precisely this claim, each arranging a single request that violates two rules at once: segregation_of_duties_outranks_review_dimension_conflict_on_tool_reviews expects ERR_SEGREGATION_OF_DUTIES (priority 17) over ERR_REVIEW_DIMENSION_CONFLICT (18), and add_drop_window_closed_outranks_seat_cap_exceeded_on_enrollment_reinstate expects ERR_ADD_DROP_WINDOW_CLOSED (23) over ERR_SEAT_CAP_EXCEEDED (43), each with the reverse-order expectation named as the failure signature."

      - name: validity_that_depends_on_another_entitys_state_is_checked_against_that_entity
        claim_type: cross_entity_validation
        grounds:
          - validations[15]
          - validations[16]
          - validations[29]
        excluded_because:
          difficulty_instance: tool_placement_activation_depends_on_the_tool_integrations_approval_and_version
          rationale: "The two §1.8 cross_entity_state_dependency instances drive exactly these rules from both sides: tool_placement_activation_depends_on_the_tool_integrations_approval_and_version covers priorities 15 and 16 (ERR_TOOL_NOT_APPROVED, then ERR_TOOL_VERSION_DRIFT after a vendor upgrade strands approved_version, then success), and grade_passback_submit_depends_on_the_academic_terms_continuity_posture covers priority 29 (ERR_TERM_POSTURE_FROZEN while the sibling term is in CONTINUITY_MODE, then success once it is not)."

  # ===========================================================================
  # 5. Endpoints  (§1.5 patterns: CRUD, action, bulk, link, computed, conditional)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: content_items_support_the_full_create_read_update_delete_cycle
        claim_type: standard_crud
        grounds:
          - endpoints[POST /content-items]
          - endpoints[GET /content-items]
          - endpoints[GET /content-items/{id}]
          - endpoints[PATCH /content-items/{id}]
          - endpoints[DELETE /content-items/{id}]
        distinguishing_aspect: "ContentItem is the only entity with all five verbs, and DELETE is a HARD delete returning 204 with no envelope — the row must be gone from GET /{id} afterwards, not soft-flagged. All three of the parent shell's derived fields must be re-derived on the update AND on the delete, not only on create."
        test_recipe:
          setup:
            - "Term 2026FA and one FACULTY owner with an OFFICIAL shell; content items may be added while the shell is still REQUESTED."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6120", full_name: "Barbara Liskov", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS500-01", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
          trigger:
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Problem Set 1", due_at: "2026-09-15T23:59:00Z", points_possible: 50.00, storage_mb: 12.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_id: $.data.id, copy_state: $.data.copy_state, stripped: $.data.date_stripped, subs: $.data.submission_count, v1: $.data.version }
            - call: "GET /content-items/${item_id}"
              payload: {}
              as: LmsAdmin
              captures: { read_title: $.data.title, read_due: $.data.due_at, read_points: $.data.points_possible }
            - call: "GET /content-items"
              payload: { shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { first_listed: "$.data[0].id" }
            - call: "PATCH /content-items/${item_id}"
              payload: { title: "Problem Set 1 (revised)", points_possible: 60.00, storage_mb: 20.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { patched_title: $.data.title, patched_points: $.data.points_possible, v2: $.data.version }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { count_before: $.data.content_item_count, points_before: $.data.total_points_possible, storage_before: $.data.storage_mb }
            - call: "DELETE /content-items/${item_id}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "GET /content-items/${item_id}"
              payload: {}
              as: LmsAdmin
              captures: { err_gone: $.data.error_id }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { count_after: $.data.content_item_count, points_after: $.data.total_points_possible, storage_after: $.data.storage_mb }
          assert:
            - "creation returns HTTP 201 with ${copy_state} == SOURCE, ${stripped} == false, ${subs} == 0 and ${v1} == 1"
            - "${read_title} == \"Problem Set 1\", ${read_due} == \"2026-09-15T23:59:00Z\" and ${read_points} == 50.00 — the read echoes the stored row"
            - "${first_listed} == ${item_id} and the list response reports total_count 1 with has_more false"
            - "${patched_title} == \"Problem Set 1 (revised)\", ${patched_points} == 60.00 and ${v2} == 2"
            - "${count_before} == 1, ${points_before} == 60.00 and ${storage_before} == 20.00 — the PATCH re-derived the parent, so the pre-patch 50.00/12.00 figures are gone"
            - "the DELETE returns HTTP 204 with an empty body — no envelope, no data object"
            - "${err_gone} == ERR_CONTENT_ITEM_NOT_FOUND at HTTP 404 — the delete is hard, so no filter reveals the row"
            - "${count_after} == 0, ${points_after} == 0.00 and ${storage_after} == 0.00, and GET /content-items filtered to the shell reports total_count 0"

      - name: publish_and_unpublish_are_action_endpoints_that_recheck_readiness_each_time
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /course-shells/{id}/publish]
          - endpoints[POST /course-shells/{id}/unpublish]
          - state_machines.CourseShell.provisioning_state.PROVISIONED_to_PUBLISHED
          - validations[30]
          - errors[ERR_SHELL_NOT_PUBLISH_READY]
        distinguishing_aspect: "Both endpoints take no state in their path beyond {id} and must re-derive publish_readiness at call time: a merely REQUESTED (not yet blocked, not yet active) tool placement is enough to refuse the publish, and removing it must restore readiness so the identical call succeeds. The PUBLISHED -> PROVISIONED -> PUBLISHED cycle must keep AcademicTerm.published_shell_count exact rather than monotonically climbing."
        test_recipe:
          setup:
