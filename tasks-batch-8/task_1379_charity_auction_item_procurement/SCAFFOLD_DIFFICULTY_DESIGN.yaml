            - { call: "POST /items/${it2}/blackout-windows", payload: { starts_at: "2027-08-05T00:00:00Z", ends_at: "2027-08-12T00:00:00Z", label: "owner use" }, as: CatalogManager }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Condo" }, as: CatalogManager, captures: { bd1: "$.data.id" } }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Cabin" }, as: CatalogManager, captures: { bd2: "$.data.id" } }
            - { call: "POST /bundles/${bd1}/items", payload: { item_id: "${it1}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd2}/items", payload: { item_id: "${it2}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd1}/publish", payload: {}, as: CatalogManager, captures: { bd1_v: "$.data.version" } }
            - { call: "POST /bundles/${bd2}/publish", payload: {}, as: CatalogManager, captures: { bd2_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder One", email: "b1@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder Two", email: "b2@x.org", paddle_no: 2, payment_method_on_file: true }, as: GalaAdmin, captures: { br2: "$.data.id" } }
            - { call: "POST /bundles/${bd1}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd1_v}" }, as: Bidder, as_user_id: "${br1}" }
            - { call: "POST /bundles/${bd2}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd2_v}" }, as: Bidder, as_user_id: "${br2}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd1}" }, as: GalaAdmin, captures: { inv1: "$.data[0].id" } }
            - { call: "GET /invoices", payload: { bundle_id: "${bd2}" }, as: GalaAdmin, captures: { inv2: "$.data[0].id" } }
