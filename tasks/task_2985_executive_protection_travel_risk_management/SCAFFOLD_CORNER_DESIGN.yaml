            shows the PROVISIONAL total at submit and the FINAL total after release diverging
            through the minimum-billable floor, and asserts the ledger delta the switch applies.
            The exposure-score pair is covered by its own §1.8 instance in the same rule.

  - section: consistency_model
    instances:

      - name: every_derived_field_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/exec-protection/trips/{id}/submit-for-approval
          - endpoints.GET_/exec-protection/executives/{id}
        distinguishing_aspect: |
          The declared model is immediate, so nothing in this API may lag: the write that commits a
          cost has to return the committed cost, and the very next read of a different entity has
          to show the ledger the write moved. The submit is the sharpest case because it writes
          three derived numbers on the trip and two on the executive at once, and the executive is
          a peer row rather than a parent, so nothing is recomputed lazily on read.
        test_recipe:
          setup:
            - "an APPROVED assessment, a DRAFT trip with one PT leg and one CONFIRMED ten-hour LEAD_AGENT assignment costing 112500, and a VERIFIED policy; the executive's budget is untouched at 100000000"
