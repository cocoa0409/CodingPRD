              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "err == ERR_INVALID_REQUEST"
      - name: stale_version_on_invoice_generate_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[invoice-generate-stale-account]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Generating a second invoice with a stale expected_account_version (the value read before the first generation bumped the version) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An ACTIVE account; one invoice already generated which bumped account.version."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "92 Oak St", holder_name: "Pp K" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { v_stale: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${v_stale}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${v_stale}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "err == ERR_STALE_VERSION"

  # =====================================================================
  # RBAC
  # =====================================================================
  - section: rbac
    instances:
      - name: account_holder_cannot_create_plan_forbidden
        claim_type: exclusive_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "AccountHolder calling POST /service-plans (a Dispatcher-exclusive op) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["No setup needed."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: AccountHolder
              as_user_id: "00000000-0000-4000-8000-000000000099"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "err == ERR_FORBIDDEN"
      - name: crewlead_cannot_generate_invoice_forbidden
        claim_type: exclusive_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CrewLead calling POST /accounts/{id}/invoices (Dispatcher-exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["An ACTIVE account."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "94 Oak St", holder_name: "Qq L" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${acct_v}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: CrewLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403 (RBAC denial at priority 2 precedes the OCC check at priority 6)"
            - "err == ERR_FORBIDDEN"
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: exclusive_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unrecognized X-User-Role -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["No setup needed."]
          setup_api_calls: []
          trigger:
            - call: "GET /service-plans"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "err == ERR_UNAUTHENTICATED"

  # =====================================================================
  # Cross-Cutting Complexity Layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: soft_deleted_plan_excluded_from_default_list
        claim_type: soft_delete
        grounds: [entities.ServicePlan.fields.archived, endpoints]
        distinguishing_aspect: "An archived plan is absent from GET /service-plans by default but present when include_archived=true."
        test_recipe:
          setup: ["One archived plan and one active plan."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", trash_cart_size_gallons: 35, recycling_cart_size_gallons: 35, monthly_base_cents: 3000, extra_cart_monthly_cents: 1000, extra_pickup_base_cents: 2000, bulk_item_cents: 600 }
              as: Dispatcher
              captures: { arch_plan_id: $.data.id }
            - call: "POST /service-plans/${arch_plan_id}/archive"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
          trigger:
            - call: "GET /service-plans"
              payload: { include_archived: false }
              as: Dispatcher
            - call: "GET /service-plans"
              payload: { include_archived: true }
              as: Dispatcher
          assert:
            - "Default list excludes the archived plan ${arch_plan_id}"
            - "include_archived=true list includes the archived plan ${arch_plan_id}"
      - name: invoice_due_date_lapse_transitions_billing_past_due
        claim_type: scheduled_actions
        grounds: [state_machines.ServiceAccount.CURRENT_to_PAST_DUE, entities.Invoice.fields.status, endpoints]
        distinguishing_aspect: "Advancing the clock past an OPEN invoice's due_date flips the invoice to PAST_DUE and the account billing_status to PAST_DUE."
        test_recipe:
          setup: ["An ACTIVE account with one OPEN invoice due 2026-03-10."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-25T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "96 Oak St", holder_name: "Rr M" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { v0: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${v0}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", due_date: "2026-03-10T00:00:00Z" }
              as: Dispatcher
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: Dispatcher
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: Dispatcher
              captures: { inv_status: $.data.status }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { bs: $.data.billing_status }
          assert:
            - "inv_status == PAST_DUE"
            - "bs == PAST_DUE"
      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-out-stale-account]", entities.ServiceAccount.fields.version]
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_gross_provisional_then_void_restore_rebill
          rationale: "Correct-version OCC success and version bump on POST /accounts/{id}/invoices is exercised across the §1.8 invoice instances; the stale-version failure path is covered by the §1.9 errors instance stale_version_on_invoice_generate_returns_412."

