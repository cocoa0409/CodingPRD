# =============================================================================
# PRD-Bench Scaffold — Satellite Broadband Provisioning & Capacity Management
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2500. Satellite Broadband Provisioning & Capacity Management (satellite internet service provider):
  service availability determination by cell with capacity constraints and waitlist management,
  terminal shipment, self-installation guidance and obstruction assessment tools, activation with
  account provisioning, service plan assignment and network authorization, capacity management across
  beams with deprioritization thresholds and fair use policies, portability and roaming features with
  in-motion authorization and jurisdiction restrictions, performance monitoring with weather-related
  degradation and outage credits, terminal return, transfer and warranty replacement logistics,
  regulatory compliance across licensing, spectrum coordination and consumer disclosure requirements

domain_name: satellite-broadband-provisioning
api_prefix: /satellite-broadband

complexity_profile:
  primary_archetype: quota_allocation            # finite cell slots + finite beam Mbps, reserved/committed/released
  secondary_archetype: compliance_audit          # licensing, spectrum coordination, consumer disclosure, SoD
  complexity_layers:
    - optimistic_concurrency                     # OCC on ServiceCell.version and Beam.version
    - cascading_side_effects                     # license -> beam -> subscription -> roaming chains
    - dual_variant_calculation                   # advertised-vs-admission slots; provisional-vs-final credits
    - rate_threshold_triggers                    # fair-use deprioritization + oversubscription bands

  entity_topology: flat
  # Every entity is a peer addressed at `<api_prefix>/<collection>/{id}`; parentage is expressed
  # exclusively through FK fields, never through nested URL paths.

  state_machine_shape: parallel
  # Subscription carries three independent dimensions that evolve on the same row:
  #   service_state x authorization_state x priority_state
  # RoamingAuthorization is cyclic (REQUESTED <-> NEEDS_INFO); Terminal is cyclic + branching;
  # ServiceOrder branches at creation (RESERVED | WAITLISTED).

  relationship_patterns:
    - one_to_many                                # Beam -> ServiceCell -> ServiceOrder / Subscription
    - self_referential                           # Terminal.replaces_terminal_id -> Terminal.id (RMA chain)
    - cross_aggregate                            # OutageCredit spans OutageEvent (beam side) and Subscription

  role_model: segregation_of_duties
  # The operator who submits an outage credit may not be the operator who decides it.

  consistency_model: immediate

  difficulty_level: expert_plus
  structural_targets:
    entities: 13
    endpoints: 55
    error_codes: 48
    calculations: 7
    state_machines: 7

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# Global time semantics
# -----------------------------------------------------------------------------
time_semantics:
  logical_clock: |
    Every server-stamped timestamp (`created_at`, `updated_at`, `scanned_at`, `recorded_at`,
    `activated_at`, `promoted_at`, `reservation_expires_at`, `deprioritized_at`, `terminated_at`,
    `ownership_changed_at`, `last_cycle_closed_at`) is read from the logical clock, never from
    real wall-clock time. The logical clock starts at 2026-08-01T00:00:00Z and only moves when
    `POST /satellite-broadband/_clock/set_current_utc` is called.
  format: "ISO 8601 UTC with exactly three fractional digits (e.g. 2026-08-01T00:00:00.000Z)"

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  # ---------------------------------------------------------------- regulatory
  - name: SpectrumLicense
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: license_code
        type: string
        source: input
        description: "Regulator-issued licence identifier"
        constraints: "1..40 chars; unique across SpectrumLicense"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction this licence authorises service in (e.g. US-CA, US-NV, CA-BC)"
        constraints: "2..8 chars, uppercase letters and single hyphen"
      - name: frequency_band
        type: enum
        source: input
        description: "Band the licence covers"
        constraints: "KA_FORWARD | KU_FORWARD | KA_RETURN"
      - name: max_eirp_dbw
        type: number
        source: input
        description: "Maximum authorised EIRP in dBW"
        constraints: "> 0"
      - name: expires_at
        type: datetime
        source: input
        description: "Licence expiry instant; a billing-cycle-close at/after this instant expires the licence"
      - name: consumer_disclosure_version
        type: string
        source: input
        description: "Version string of the consumer disclosure the jurisdiction mandates; pinned onto Subscription at activation"
        constraints: "1..20 chars"
      - name: in_motion_permitted
        type: boolean
        source: input
        default: false
        description: "Whether the jurisdiction permits in-motion (moving-platform) operation under this licence"
      - name: license_state
        type: enum
        source: system
        default: PENDING_COORDINATION
        description: "Licence lifecycle state"
        constraints: "PENDING_COORDINATION | ACTIVE | SUSPENDED | REFUSED | EXPIRED"
      - name: coordination_state
        type: enum
        source: system
        default: UNCOORDINATED
        description: "Spectrum-coordination outcome with neighbouring operators"
        constraints: "UNCOORDINATED | COORDINATED | REFUSED"
      - name: coordination_note
        type: string
        source: system
        description: "Free text captured from the coordination filing"
        default: null
      - name: enforcement_reason
        type: string
        source: system
        description: "Reason recorded by the most recent SUSPEND or REINSTATE enforcement action"
        default: null

  # --------------------------------------------------------------- space asset
  - name: Beam
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: beam_code
        type: string
        source: input
        description: "Operator beam identifier"
        constraints: "1..40 chars; unique across Beam"
      - name: satellite_code
        type: string
        source: input
        description: "Satellite carrying the beam"
      - name: spectrum_license_id
        type: string
        source: input
        description: "FK -> SpectrumLicense.id; the licence the beam radiates under"
      - name: forward_capacity_mbps
        type: number
        source: input
        description: "Physical forward-link capacity of the beam in Mbps"
        constraints: "> 0"
      - name: oversubscription_limit
        type: number
        source: input
        default: 4.0
        description: "Maximum permitted weighted_sold_mbps / forward_capacity_mbps ratio"
        constraints: "1.0 .. 20.0"
      - name: deprioritization_grace_gb
        type: integer
        source: input
        default: 0
        description: "Beam-level grace volume added to every plan's priority_data_gb before deprioritisation triggers"
        constraints: ">= 0"
      - name: weighted_sold_mbps
        type: number
        source: computed
        default: 0
        description: "Tier- and priority-weighted sum of committed rates sold on this beam (calculations.beam_weighted_oversubscription)"
      - name: oversubscription_ratio
        type: number
        source: computed
        default: 0
        description: "weighted_sold_mbps / forward_capacity_mbps, 4 decimal places"
      - name: capacity_state
        type: enum
        source: computed
        default: NORMAL
        description: "Congestion band derived from oversubscription_ratio"
        constraints: "NORMAL | CONSTRAINED | SATURATED"
      - name: beam_state
        type: enum
        source: system
        default: ACTIVE
        description: "Operational state; SUSPENDED whenever the governing licence is SUSPENDED or EXPIRED"
        constraints: "ACTIVE | SUSPENDED"
      - name: billing_cycle_index
        type: integer
        source: system
        default: 0
        description: "Ops-run epoch; incremented by each billing-cycle-close on this beam"
      - name: last_cycle_closed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent billing-cycle-close"

  # ------------------------------------------------------------ coverage cell
  - name: ServiceCell
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: cell_code
        type: string
        source: input
        description: "Coverage cell identifier; also the deterministic sweep order key inside a beam ops run"
        constraints: "1..40 chars; unique across ServiceCell"
      - name: beam_id
        type: string
        source: input
        description: "FK -> Beam.id; the beam that serves this cell"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction the cell's coverage footprint sits in"
        constraints: "2..8 chars"
      - name: max_active_terminals
        type: integer
        source: input
        description: "Hard slot ceiling for terminals served by this cell"
        constraints: ">= 0"
      - name: committed_terminal_count
        type: integer
        source: computed
        default: 0
        description: "Count of Subscription rows on this cell with service_state IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"
      - name: reserved_slot_count
        type: integer
        source: computed
        default: 0
        description: "Count of ServiceOrder rows on this cell with order_state == RESERVED (expired-but-unswept reservations included)"
      - name: free_slot_count
        type: integer
        source: computed
        default: 0
        description: "Advertised free slots: max(0, max_active_terminals - committed_terminal_count - reserved_slot_count)"
      - name: waitlist_depth
        type: integer
        source: computed
        default: 0
        description: "Count of ServiceOrder rows on this cell with order_state == WAITLISTED"
      - name: availability_state
        type: enum
        source: computed
        default: AVAILABLE
        description: "Advertised availability derived by calculations.cell_slot_availability (advertised_strict variant)"
        constraints: "AVAILABLE | WAITLIST_ONLY | CLOSED"

  # ------------------------------------------------------------- plan catalog
  - name: ServicePlan
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: plan_code
        type: string
        source: input
        description: "Marketing plan identifier"
        constraints: "1..40 chars; unique across ServicePlan"
      - name: committed_rate_mbps
        type: number
        source: input
        description: "Committed forward rate sold with this plan"
        constraints: "> 0"
      - name: priority_tier
        type: enum
        source: input
        description: "Scheduling tier; drives the beam weighting factor"
        constraints: "PRIORITY_1 | PRIORITY_2 | BEST_EFFORT"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring monthly fee in cents; base for outage credits and cycle charges"
        constraints: "> 0"
      - name: priority_data_gb
        type: integer
        source: input
        description: "Fair-use priority volume per billing cycle before deprioritisation"
        constraints: ">= 0"
      - name: deprioritized_rate_mbps
        type: number
        source: input
        description: "Rate the subscriber falls back to once deprioritised"
        constraints: "> 0"
      - name: overage_rate_cents_per_gb
        type: integer
        source: input
        default: 25
        description: "Cents charged per GB beyond the effective fair-use threshold"
        constraints: ">= 0"
      - name: roaming_allowed
        type: boolean
        source: input
        default: false
        description: "Whether PORTABILITY_MOVE and ROAM_TEMPORARY authorisations may be requested on this plan"
      - name: in_motion_allowed
        type: boolean
        source: input
        default: false
        description: "Whether IN_MOTION authorisations may be requested on this plan"

  # ---------------------------------------------------------------- account
  - name: Subscriber
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: email
        type: string
        source: input
        description: "Account contact email"
        constraints: "must contain '@'; unique across Subscriber"
      - name: full_name
        type: string
        source: input
        description: "Account holder name"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction of the service address on file"
        constraints: "2..8 chars"
      - name: account_state
        type: enum
        source: system
        default: PROSPECT
        description: "Account lifecycle; PROSPECT on creation, WAITLISTED while an order sits on a waitlist, ACTIVE once a subscription is created, SUSPENDED when every subscription is SUSPENDED, CLOSED when none remain non-terminal"
        constraints: "PROSPECT | WAITLISTED | ACTIVE | SUSPENDED | CLOSED"
      - name: credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of OutageCredit.final_credit_cents over this subscriber's credits with credit_state == APPROVED"
      - name: pending_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of OutageCredit.provisional_credit_cents over this subscriber's credits with credit_state IN {DRAFT, SUBMITTED}"
      - name: pending_charge_cents
        type: integer
        source: computed
        default: 0
        description: "Accumulated unbilled charges: cycle charges booked by billing-cycle-close plus terminal damage fees"

  # -------------------------------------------------- availability / waitlist
  - name: ServiceOrder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; who asked for service"
      - name: service_cell_id
        type: string
        source: input
        description: "FK -> ServiceCell.id; the cell the service address falls in"
      - name: requested_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; plan requested at order time; becomes the subscription's plan at activation"
      - name: order_state
        type: enum
        source: system
        default: PENDING_DETERMINATION
        description: "Order lifecycle; the creation call immediately runs availability determination and lands on RESERVED or WAITLISTED"
        constraints: "PENDING_DETERMINATION | RESERVED | WAITLISTED | ACTIVATED | EXPIRED | CANCELLED"
      - name: reservation_expires_at
        type: datetime
        source: computed
        default: null
        description: "Set to logical-now + RESERVATION_HOLD_HOURS whenever the order enters RESERVED (at determination or at promotion); null otherwise"
      - name: waitlist_priority_score
        type: integer
        source: computed
        default: null
        description: "Promotion ranking key from calculations.waitlist_priority_score; recomputed when the order enters WAITLISTED and at every promotion evaluation on its cell"
      - name: promoted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the order was promoted from WAITLISTED to RESERVED"
      - name: cancel_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on cancellation"

  # ------------------------------------------------------------------ hardware
  - name: Terminal
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: serial_number
        type: string
        source: input
        description: "User terminal serial"
        constraints: "1..40 chars; unique across Terminal"
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; current custodian of the terminal (changes on transfer)"
      - name: replaces_terminal_id
        type: string
        source: system
        default: null
        description: "FK -> Terminal.id; set on a warranty replacement unit and points at the terminal it replaces (self-referential RMA chain)"
      - name: warranty_expires_at
        type: datetime
        source: input
        description: "Warranty expiry; warranty replacement is refused at/after this instant"
      - name: terminal_state
        type: enum
        source: system
        default: SHIPPED
        description: "Logistics/installation state"
        constraints: "SHIPPED | DELIVERED | INSTALLED | TRANSFER_PENDING | RMA_PENDING | RETURN_INITIATED | RETURNED | REPLACED"
      - name: installed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent successful install"
      - name: ownership_changed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent transfer; obstruction scans older than this instant no longer satisfy the install precondition"
      - name: last_scan_verdict
        type: enum
        source: computed
        default: null
        description: "Verdict of the newest ObstructionScan whose scanned_at >= max(created_at, ownership_changed_at); null when no such scan exists"
        constraints: "PASS | MARGINAL | FAIL | null"
      - name: return_condition
        type: enum
        source: system
        default: null
        description: "Condition recorded when the returned unit is received"
        constraints: "GOOD | DAMAGED | null"

  # ------------------------------------------------- self-install assessment
  - name: ObstructionScan
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; the terminal the sky scan was taken on"
      - name: obstructed_sample_count
        type: integer
        source: input
        description: "Sky samples blocked by obstruction"
        constraints: ">= 0; <= total_sample_count"
      - name: total_sample_count
        type: integer
        source: input
        description: "Total sky samples taken"
        constraints: "> 0"
      - name: obstruction_pct
        type: number
        source: computed
        description: "100 * obstructed_sample_count / total_sample_count, 2 decimal places, round_half_up"
      - name: scan_verdict
        type: enum
        source: computed
        description: "PASS when obstruction_pct <= 2.00, MARGINAL when 2.00 < pct <= 8.00, FAIL when pct > 8.00"
        constraints: "PASS | MARGINAL | FAIL"
      - name: scanned_at
        type: datetime
        source: system
        description: "Logical-clock instant of the scan"

  # -------------------------------------------------------------- the service
  - name: Subscription
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: subscriber_id
        type: string
        source: computed
        description: "FK -> Subscriber.id; copied from the activating ServiceOrder.subscriber_id"
      - name: service_order_id
        type: string
        source: input
        description: "FK -> ServiceOrder.id; the RESERVED order this activation consumes"
      - name: service_cell_id
        type: string
        source: computed
        description: "FK -> ServiceCell.id; copied from the order at activation, changed by an approved PORTABILITY_MOVE"
      - name: service_plan_id
        type: string
        source: computed
        description: "FK -> ServicePlan.id; copied from ServiceOrder.requested_plan_id at activation, changed by plan-change"
      - name: terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; the installed terminal bound to the service, re-pointed when a warranty replacement is installed"
      - name: deauthorized_by_license_id
        type: string
        source: system
        default: null
        description: "FK -> SpectrumLicense.id; stamped when a licence suspension/expiry cascade deauthorised this subscription; cleared on reinstatement"
      - name: service_state
        type: enum
        source: system
        default: PENDING_ACTIVATION
        description: "Provisioning dimension (independent of authorization_state and priority_state)"
        constraints: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | TERMINATED"
      - name: authorization_state
        type: enum
        source: system
        default: UNAUTHORIZED
        description: "Network-authorisation dimension (independent of service_state)"
        constraints: "UNAUTHORIZED | AUTHORIZED_FIXED | AUTHORIZED_IN_MOTION | DEAUTHORIZED"
      - name: priority_state
        type: enum
        source: system
        default: PRIORITY
        description: "Fair-use dimension (independent of the other two); flips on threshold crossing and is restored by billing-cycle-close"
        constraints: "PRIORITY | DEPRIORITIZED"
      - name: disclosure_ack_state
        type: enum
        source: system
        default: PENDING_ACK
        description: "Consumer-disclosure acknowledgement dimension"
        constraints: "PENDING_ACK | ACKNOWLEDGED | EXPIRED"
      - name: disclosure_version_issued
        type: string
        source: computed
        description: "SpectrumLicense.consumer_disclosure_version of the governing licence, pinned at activation and never re-read afterwards"
      - name: disclosure_ack_deadline_at
        type: datetime
        source: computed
        description: "activation instant + DISCLOSURE_ACK_WINDOW_DAYS (14 days); a billing-cycle-close at/after this instant expires an unacknowledged disclosure"
      - name: cycle_priority_gb_used
        type: number
        source: computed
        default: 0
        description: "Counted priority volume in the current billing cycle, 3 decimal places; reset to 0 by billing-cycle-close"
      - name: cycle_billing_index
        type: integer
        source: computed
        description: "Beam.billing_cycle_index this subscription's usage counter belongs to; UsageRecord rows carrying a different index are stored with counted=false"
      - name: cycle_charge_cents
        type: integer
        source: computed
        default: 0
        description: "Charge computed for the most recently closed cycle by calculations.cycle_charge_with_overage_discount"
      - name: effective_rate_mbps
        type: number
        source: computed
        description: "ServicePlan.committed_rate_mbps when priority_state == PRIORITY, ServicePlan.deprioritized_rate_mbps when DEPRIORITIZED"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the Subscription row was created"
      - name: deprioritized_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the current deprioritisation; cleared on restoration"
      - name: terminated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of termination"
      - name: suspension_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the most recent suspension"

  # ------------------------------------------------------------ metering log
  - name: UsageRecord
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the metered service"
      - name: billing_cycle_index
        type: integer
        source: input
        description: "Cycle the meter reading belongs to; compared against Subscription.cycle_billing_index"
        constraints: ">= 0"
      - name: gb_used
        type: number
        source: input
        description: "Priority volume consumed in this reading, GB"
        constraints: ">= 0"
      - name: counted
        type: boolean
        source: computed
        description: "true when billing_cycle_index == Subscription.cycle_billing_index at ingest; false rows never advance cycle_priority_gb_used"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant of ingest"

  # ------------------------------------------------- portability and roaming
  - name: RoamingAuthorization
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the service being made portable / mobile"
      - name: mode
        type: enum
        source: input
        description: "PORTABILITY_MOVE relocates the service to target_service_cell_id on approval; ROAM_TEMPORARY grants out-of-cell use for the window; IN_MOTION grants moving-platform use"
        constraints: "PORTABILITY_MOVE | ROAM_TEMPORARY | IN_MOTION"
      - name: target_jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction the subscriber intends to operate in"
        constraints: "2..8 chars"
      - name: target_service_cell_id
        type: string
        source: input
        default: null
        description: "FK -> ServiceCell.id; required when mode == PORTABILITY_MOVE, must be null otherwise"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the requested authorisation window"
      - name: effective_until
        type: datetime
        source: input
        description: "Inclusive end of the requested authorisation window; must be > effective_from"
      - name: auth_state
        type: enum
        source: system
        default: REQUESTED
        description: "Review lifecycle; REQUESTED <-> NEEDS_INFO is a bounded revision cycle"
        constraints: "REQUESTED | NEEDS_INFO | APPROVED | DENIED | REVOKED"
      - name: info_round_count
        type: integer
        source: system
        default: 0
        description: "Number of completed request-info rounds; capped by ROAMING_MAX_INFO_ROUNDS"
      - name: governing_license_id
        type: string
        source: computed
        default: null
        description: "FK -> SpectrumLicense.id; licence selected at approval by calculations.governing_license_selection"
      - name: decision_note
        type: string
        source: system
        default: null
        description: "Reviewer note captured on request-info or decide"
      - name: revoked_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when the authorisation was revoked by a cascade"

  # --------------------------------------------------- performance monitoring
  - name: OutageEvent
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: beam_id
        type: string
        source: input
        description: "FK -> Beam.id; the beam whose performance degraded"
      - name: cause
        type: enum
        source: input
        description: "Root cause; drives the credit multiplier"
        constraints: "WEATHER_RAIN_FADE | EQUIPMENT_FAILURE | SPECTRUM_INTERFERENCE | PLANNED_MAINTENANCE"
      - name: severity
        type: enum
        source: input
        description: "FULL_OUTAGE counts at full weight, DEGRADATION at half"
        constraints: "FULL_OUTAGE | DEGRADATION"
      - name: started_at
        type: datetime
        source: input
        description: "Inclusive start of the impairment window"
      - name: ended_at
        type: datetime
        source: system
        default: null
        description: "Exclusive end of the impairment window, supplied at resolve; while null the window is treated as [started_at, +inf)"
      - name: event_state
        type: enum
        source: system
        default: OPEN
        description: "Event lifecycle"
        constraints: "OPEN | RESOLVED"
      - name: outage_minutes
        type: integer
        source: computed
        default: null
        description: "floor((ended_at - started_at) / 60s), computed at resolve"
      - name: credit_eligible
        type: boolean
        source: computed
        default: null
        description: "cause != PLANNED_MAINTENANCE AND outage_minutes >= SLA_MIN_OUTAGE_MINUTES, computed at resolve"
      - name: generated_credit_count
        type: integer
        source: computed
        default: 0
        description: "Number of OutageCredit rows the resolve cascade created (gated on outage_minutes >= SLA_MIN_OUTAGE_MINUTES, not on credit_eligible)"

  - name: OutageCredit
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: subscription_id
        type: string
        source: computed
        description: "FK -> Subscription.id; the impaired service the credit belongs to"
      - name: outage_event_id
        type: string
        source: computed
        description: "FK -> OutageEvent.id; the event that generated the credit"
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "Event-level estimate written at resolve (calculations.outage_credit_amount, variant provisional_event_level)"
      - name: final_credit_cents
        type: integer
        source: computed
        default: null
        description: "Per-day measured amount written at approval (calculations.outage_credit_amount, variant final_daily_prorated)"
      - name: credit_state
        type: enum
        source: system
        default: DRAFT
        description: "Credit review lifecycle"
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator that submitted the credit for review"
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator that decided the credit; must differ from submitted_by_user_id"
      - name: decision_reason
        type: string
        source: system
        default: null
        description: "Reason recorded with the decision"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # -------------------------------------------------------- SpectrumLicense
  - entity: SpectrumLicense
    initial_state: PENDING_COORDINATION           # field: license_state
    terminal_states: [REFUSED, EXPIRED]
    transitions:
      - from: PENDING_COORDINATION
        to: ACTIVE
        trigger: "POST /satellite-broadband/spectrum-licenses/{id}/coordination with outcome=GRANTED"
        actor: ComplianceOfficer
        preconditions:
          - "license_state == PENDING_COORDINATION"
        side_effects:
          - "coordination_state = COORDINATED"
          - "coordination_note = body.coordination_note"
          - "increments SpectrumLicense.version by 1"
      - from: PENDING_COORDINATION
        to: REFUSED
        trigger: "POST /satellite-broadband/spectrum-licenses/{id}/coordination with outcome=REFUSED"
        actor: ComplianceOfficer
        preconditions:
          - "license_state == PENDING_COORDINATION"
        side_effects:
          - "coordination_state = REFUSED"
          - "every Beam with spectrum_license_id == this licence: beam_state = SUSPENDED"
          - "increments SpectrumLicense.version by 1"
        note: "Branch B of the coordination fork; divergent side-effect set versus the GRANTED branch."
      - from: PENDING_COORDINATION
        to: ACTIVE
        trigger: "POST /satellite-broadband/spectrum-licenses/{id}/coordination with outcome=GRANTED_PROVISIONAL"
        actor: ComplianceOfficer
        preconditions:
          - "license_state == PENDING_COORDINATION"
        side_effects:
          - "coordination_state stays UNCOORDINATED (the regulator authorises operation while inter-operator spectrum coordination is still open)"
          - "coordination_note = body.coordination_note"
          - "increments SpectrumLicense.version by 1"
        note: "Branch C of the coordination fork: the licence radiates but is not yet coordinated, so network authorisation is still refused by validations[priority=20]."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /satellite-broadband/spectrum-licenses/{id}/coordination with outcome=GRANTED"
        actor: ComplianceOfficer
        preconditions:
          - "license_state == ACTIVE"
          - "coordination_state == UNCOORDINATED"
        side_effects:
          - "coordination_state = COORDINATED"
          - "coordination_note = body.coordination_note"
          - "increments SpectrumLicense.version by 1"
        note: "Closes a provisional grant. The coordination dimension therefore advances independently of license_state."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /satellite-broadband/spectrum-licenses/{id}/enforcement-action with action=SUSPEND"
        actor: ComplianceOfficer
        preconditions:
          - "license_state == ACTIVE"
        side_effects:
          - "enforcement_reason = body.reason"
          - "CASCADE HOP 1: every Beam B with B.spectrum_license_id == this licence and B.beam_state == ACTIVE -> B.beam_state = SUSPENDED"
          - "CASCADE HOP 2 (caused by hop 1): for every such suspended Beam, every Subscription S on a ServiceCell of that beam with S.authorization_state IN {AUTHORIZED_FIXED, AUTHORIZED_IN_MOTION} -> S.authorization_state = DEAUTHORIZED and S.deauthorized_by_license_id = this licence id"
          - "CASCADE HOP 3 (caused by hop 2): for every Subscription deauthorised in hop 2, every RoamingAuthorization R with R.subscription_id == S.id and R.auth_state == APPROVED -> R.auth_state = REVOKED, R.revoked_reason = 'LICENSE_SUSPENDED'"
          - "CASCADE HOP 4 (caused by hop 1): every ServiceCell of every suspended Beam recomputes availability_state -> CLOSED"
          - "increments SpectrumLicense.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /satellite-broadband/spectrum-licenses/{id}/enforcement-action with action=REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "license_state == SUSPENDED"
        side_effects:
          - "enforcement_reason = body.reason"
          - "every Beam with spectrum_license_id == this licence and beam_state == SUSPENDED -> beam_state = ACTIVE"
          - "every Subscription with deauthorized_by_license_id == this licence id and service_state != TERMINATED -> authorization_state = AUTHORIZED_FIXED, deauthorized_by_license_id = null"
          - "RoamingAuthorization rows revoked by the suspension are NOT restored; they must be re-requested"
          - "affected ServiceCell rows recompute availability_state"
          - "increments SpectrumLicense.version by 1"
        note: "Compensating transition for the SUSPEND cascade; restores network authorisation but not roaming grants."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /satellite-broadband/beams/{id}/billing-cycle-close step 2 when expires_at <= logical_now"
        actor: system
        preconditions:
          - "license_state == ACTIVE"
          - "expires_at <= logical clock now"
        side_effects:
          - "same cascade hops 1-4 as the SUSPEND transition (beam SUSPENDED -> subscriptions DEAUTHORIZED -> approved roaming REVOKED -> cells CLOSED)"
          - "increments SpectrumLicense.version by 1"

  # -------------------------------------------------------------- ServiceOrder
  - entity: ServiceOrder
    initial_state: PENDING_DETERMINATION          # field: order_state
    terminal_states: [ACTIVATED, EXPIRED, CANCELLED]
    transitions:
      - from: PENDING_DETERMINATION
        to: RESERVED
        trigger: "POST /satellite-broadband/service-orders (availability determination, branch A)"
        actor: ProvisioningAgent
        preconditions:
          - "lazy expiry has run first: every ServiceOrder on the cell with order_state == RESERVED and reservation_expires_at <= logical_now moved to EXPIRED in created_at ASC order"
          - "calculations.cell_slot_availability admission_expiry_aware variant yields admission_free >= 1"
          - "cell.beam.beam_state == ACTIVE"
        side_effects:
          - "reservation_expires_at = logical_now + RESERVATION_HOLD_HOURS"
          - "cell.reserved_slot_count +1, cell.free_slot_count and availability_state recomputed"
          - "increments ServiceCell.version by 1"
        note: "Fork branch A. No waitlist promotion runs here — lazy expiry never promotes."
      - from: PENDING_DETERMINATION
        to: WAITLISTED
        trigger: "POST /satellite-broadband/service-orders (availability determination, branch B)"
        actor: ProvisioningAgent
        preconditions:
          - "admission_free == 0 after lazy expiry"
          - "cell.waitlist_depth < WAITLIST_CAP_PER_CELL"
        side_effects:
          - "waitlist_priority_score = calculations.waitlist_priority_score"
          - "subscriber.account_state PROSPECT -> WAITLISTED"
          - "cell.waitlist_depth +1, availability_state recomputed"
          - "increments ServiceCell.version by 1"
        note: "Fork branch B; divergent side-effect set versus branch A (no slot consumed, subscriber state moves instead)."
      - from: WAITLISTED
        to: RESERVED
        trigger: "system: promotion routine (billing-cycle-close step 8, order cancel, subscription terminate, approved PORTABILITY_MOVE move-out)"
        actor: system
        preconditions:
          - "cell.free_slot_count >= 1"
          - "this order ranks first among the cell's WAITLISTED orders by waitlist_priority_score DESC, created_at ASC"
        side_effects:
          - "reservation_expires_at = logical_now + RESERVATION_HOLD_HOURS, promoted_at = logical_now"
          - "subscriber.account_state WAITLISTED -> PROSPECT"
          - "cell counters and availability_state recomputed"
      - from: RESERVED
        to: ACTIVATED
        trigger: "POST /satellite-broadband/subscriptions"
        actor: ProvisioningAgent
        preconditions:
          - "order_state == RESERVED"
          - "reservation_expires_at > logical_now"
        side_effects:
          - "a Subscription row is created (see Subscription initial transition)"
          - "cell.reserved_slot_count -1 and committed_terminal_count +1"
      - from: RESERVED
        to: EXPIRED
        trigger: "system: lazy expiry inside POST /satellite-broadband/service-orders, or billing-cycle-close step 4"
        actor: system
        preconditions:
          - "order_state == RESERVED"
          - "reservation_expires_at <= logical_now"
        side_effects:
          - "reservation_expires_at retained for audit"
          - "cell.reserved_slot_count -1, availability_state recomputed"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /satellite-broadband/service-orders/{id}/cancel"
        actor: ProvisioningAgent | Subscriber
        preconditions:
          - "order_state == RESERVED"
        side_effects:
          - "cancel_reason = body.cancel_reason, reservation_expires_at = null"
          - "cell.reserved_slot_count -1 (slot released)"
          - "CASCADE: promotion routine runs on the cell (top WAITLISTED order -> RESERVED, its subscriber WAITLISTED -> PROSPECT)"
          - "cell counters and availability_state recomputed; increments ServiceCell.version by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /satellite-broadband/service-orders/{id}/cancel"
        actor: ProvisioningAgent | Subscriber
        preconditions:
          - "order_state == WAITLISTED"
        side_effects:
          - "cancel_reason = body.cancel_reason"
          - "subscriber.account_state WAITLISTED -> PROSPECT when the subscriber has no other WAITLISTED order"
          - "cell.waitlist_depth -1, availability_state recomputed; increments ServiceCell.version by 1"
        note: "No promotion runs: no slot was freed."

  # ------------------------------------------------------------------ Terminal
  - entity: Terminal
    initial_state: SHIPPED                        # field: terminal_state
    terminal_states: [RETURNED, REPLACED]
    transitions:
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /satellite-broadband/terminals/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "terminal_state == SHIPPED"
        side_effects:
          - "increments Terminal.version by 1"
      - from: DELIVERED
        to: INSTALLED
        trigger: "POST /satellite-broadband/terminals/{id}/install"
        actor: Subscriber | ProvisioningAgent
        preconditions:
          - "terminal_state IN {DELIVERED, TRANSFER_PENDING}"
          - "last_scan_verdict is not null (an ObstructionScan exists with scanned_at >= max(created_at, ownership_changed_at))"
          - "last_scan_verdict IN {PASS, MARGINAL}"
        side_effects:
          - "installed_at = logical_now"
          - "CASCADE HOP 1 (only when replaces_terminal_id is not null and that terminal is RMA_PENDING): replaced Terminal.terminal_state = REPLACED"
          - "CASCADE HOP 2 (caused by hop 1): the Subscription whose terminal_id == replaced terminal id and service_state == SUSPENDED -> terminal_id = this terminal, service_state = ACTIVE, suspension_reason = null"
          - "CASCADE HOP 3 (caused by hop 2): that subscription's Beam recomputes weighted_sold_mbps, oversubscription_ratio and capacity_state"
          - "CASCADE HOP 4 (caused by hop 3): every ServiceCell of that beam recomputes availability_state"
      - from: TRANSFER_PENDING
        to: INSTALLED
        trigger: "POST /satellite-broadband/terminals/{id}/install"
        actor: Subscriber | ProvisioningAgent
        preconditions:
          - "terminal_state == TRANSFER_PENDING"
          - "last_scan_verdict is not null and IN {PASS, MARGINAL} — the scan must be newer than ownership_changed_at"
        side_effects:
          - "installed_at = logical_now"
        note: "Closes the transfer cycle INSTALLED -> TRANSFER_PENDING -> INSTALLED."
      - from: INSTALLED
        to: TRANSFER_PENDING
        trigger: "POST /satellite-broadband/terminals/{id}/transfer"
        actor: ProvisioningAgent
        preconditions:
          - "terminal_state == INSTALLED"
          - "no Subscription with terminal_id == this terminal has service_state IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "subscriber_id = body.new_subscriber_id, ownership_changed_at = logical_now"
          - "last_scan_verdict = null (pre-transfer scans no longer qualify)"
      - from: INSTALLED
        to: RMA_PENDING
        trigger: "POST /satellite-broadband/terminals/{id}/warranty-replacement"
        actor: LogisticsCoordinator
        preconditions:
          - "terminal_state IN {DELIVERED, INSTALLED}"
          - "warranty_expires_at > logical_now"
          - "body.replacement_serial_number is unique across Terminal"
        side_effects:
          - "a new Terminal row is created: terminal_state = SHIPPED, subscriber_id = this terminal's subscriber_id, replaces_terminal_id = this terminal id, warranty_expires_at = body.replacement_warranty_expires_at"
          - "CASCADE HOP 1: the Subscription with terminal_id == this terminal and service_state IN {PENDING_ACTIVATION, ACTIVE} -> service_state = SUSPENDED, suspension_reason = 'RMA_IN_FLIGHT'"
          - "CASCADE HOP 2 (caused by hop 1): that subscription's Beam recomputes weighted_sold_mbps / oversubscription_ratio / capacity_state (a SUSPENDED subscription leaves weighted_sold_mbps)"
          - "CASCADE HOP 3 (caused by hop 2): every ServiceCell of that beam recomputes availability_state (the cell keeps the committed slot — SUSPENDED still counts in committed_terminal_count)"
        note: "Fork branch: RMA keeps the account provisioned; the return branch below tears it down."
      - from: DELIVERED
        to: RMA_PENDING
        trigger: "POST /satellite-broadband/terminals/{id}/warranty-replacement"
        actor: LogisticsCoordinator
        preconditions:
          - "terminal_state == DELIVERED"
          - "warranty_expires_at > logical_now"
        side_effects:
          - "a replacement Terminal row is created as above; no Subscription cascade fires because no subscription is bound yet"
      - from: INSTALLED
        to: RETURN_INITIATED
        trigger: "POST /satellite-broadband/terminals/{id}/return with event=INITIATE"
        actor: LogisticsCoordinator
        preconditions:
          - "terminal_state IN {DELIVERED, INSTALLED, RMA_PENDING}"
        side_effects:
          - "no charge is booked yet"
      - from: RMA_PENDING
        to: RETURN_INITIATED
        trigger: "POST /satellite-broadband/terminals/{id}/return with event=INITIATE"
        actor: LogisticsCoordinator
        preconditions:
          - "terminal_state == RMA_PENDING"
        side_effects: []
      - from: RETURN_INITIATED
        to: RETURNED
        trigger: "POST /satellite-broadband/terminals/{id}/return with event=RECEIVE"
        actor: LogisticsCoordinator
        preconditions:
          - "terminal_state == RETURN_INITIATED"
          - "body.condition IN {GOOD, DAMAGED}"
        side_effects:
          - "return_condition = body.condition"
          - "when condition == DAMAGED: subscriber.pending_charge_cents += TERMINAL_DAMAGE_FEE_CENTS"
          - "when condition == GOOD: no charge is booked"
        note: "Branch with divergent side-effect sets keyed on body.condition."
      - from: RMA_PENDING
        to: REPLACED
        trigger: "system: install of the replacement terminal (see Terminal DELIVERED -> INSTALLED cascade hop 1)"
        actor: system
        preconditions:
          - "terminal_state == RMA_PENDING"
          - "a Terminal with replaces_terminal_id == this terminal id reached INSTALLED"
        side_effects:
          - "the bound Subscription is re-pointed at the replacement terminal and resumed (hop 2 of that cascade)"

  # -------------------------------------------------------------- Subscription
  # Parallel dimensions on one row: service_state x authorization_state x priority_state
  # x disclosure_ack_state. Transitions below are labelled by the dimension they move.
  - entity: Subscription
    initial_state: PENDING_ACTIVATION             # field: service_state (authorization_state starts UNAUTHORIZED, priority_state PRIORITY, disclosure_ack_state PENDING_ACK)
    terminal_states: [TERMINATED]
    transitions:
      - from: "(none)"
        to: PENDING_ACTIVATION
        trigger: "POST /satellite-broadband/subscriptions"
        actor: ProvisioningAgent
        preconditions:
          - "order.order_state == RESERVED and order.reservation_expires_at > logical_now"
          - "terminal.terminal_state == INSTALLED"
          - "terminal.subscriber_id == order.subscriber_id"
          - "subscriber.jurisdiction_code == cell.jurisdiction_code"
          - "cell.beam.beam_state == ACTIVE"
          - "expected_service_cell_version == cell.version (OCC)"
          - "admission_expiry_aware admission_free >= 1 on the cell"
          - "projected beam oversubscription_ratio <= beam.oversubscription_limit"
        side_effects:
          - "service_state = PENDING_ACTIVATION, authorization_state = UNAUTHORIZED, priority_state = PRIORITY, disclosure_ack_state = PENDING_ACK"
          - "subscriber_id / service_cell_id / service_plan_id copied from the order; terminal_id = body.terminal_id"
          - "disclosure_version_issued = governing licence consumer_disclosure_version (version pinning), disclosure_ack_deadline_at = logical_now + DISCLOSURE_ACK_WINDOW_DAYS (14 days)"
          - "cycle_billing_index = beam.billing_cycle_index, cycle_priority_gb_used = 0, activated_at = logical_now"
          - "order.order_state = RESERVED -> ACTIVATED"
          - "subscriber.account_state -> ACTIVE"
          - "cell.reserved_slot_count -1, committed_terminal_count +1, free_slot_count / availability_state recomputed; increments ServiceCell.version by 1"
          - "beam.weighted_sold_mbps / oversubscription_ratio / capacity_state recomputed; increments Beam.version by 1"
      - from: PENDING_ACK
        to: ACKNOWLEDGED
        trigger: "POST /satellite-broadband/subscriptions/{id}/disclosure-acknowledgement"
        actor: Subscriber
        preconditions:
          - "disclosure_ack_state == PENDING_ACK"
          - "body.acknowledged_version == disclosure_version_issued"
          - "service_state != TERMINATED"
        side_effects:
          - "disclosure_ack_state = ACKNOWLEDGED"
        note: "disclosure dimension"
      - from: PENDING_ACK
        to: EXPIRED
        trigger: "system: billing-cycle-close step 3 when disclosure_ack_deadline_at <= logical_now"
        actor: system
        preconditions:
          - "disclosure_ack_state == PENDING_ACK"
          - "disclosure_ack_deadline_at <= logical_now"
        side_effects:
          - "disclosure_ack_state = EXPIRED"
          - "CASCADE (caused by the expiry): authorization_state IN {AUTHORIZED_FIXED, AUTHORIZED_IN_MOTION} -> DEAUTHORIZED"
        note: "disclosure dimension; consumer-disclosure enforcement"
      - from: UNAUTHORIZED
        to: AUTHORIZED_FIXED
        trigger: "POST /satellite-broadband/subscriptions/{id}/authorize with authorization_mode=FIXED"
        actor: ProvisioningAgent
        preconditions:
          - "service_state IN {PENDING_ACTIVATION, ACTIVE}"
          - "disclosure_ack_state == ACKNOWLEDGED"
          - "governing licence license_state == ACTIVE"
          - "governing licence coordination_state == COORDINATED"
          - "beam.beam_state == ACTIVE"
        side_effects:
          - "authorization_state = AUTHORIZED_FIXED"
          - "service_state PENDING_ACTIVATION -> ACTIVE (provisioning dimension advances on first authorisation)"
          - "beam.weighted_sold_mbps unchanged (PENDING_ACTIVATION and ACTIVE both count)"
        note: "authorization dimension"
      - from: UNAUTHORIZED
        to: AUTHORIZED_IN_MOTION
        trigger: "POST /satellite-broadband/subscriptions/{id}/authorize with authorization_mode=IN_MOTION"
        actor: ProvisioningAgent
        preconditions:
          - "all FIXED preconditions"
          - "service_plan.in_motion_allowed == true"
          - "governing licence in_motion_permitted == true"
        side_effects:
          - "authorization_state = AUTHORIZED_IN_MOTION"
          - "service_state PENDING_ACTIVATION -> ACTIVE"
      - from: AUTHORIZED_FIXED
        to: AUTHORIZED_IN_MOTION
        trigger: "system: POST /satellite-broadband/roaming-authorizations/{id}/decide with decision=APPROVE on a mode=IN_MOTION request"
        actor: system
        preconditions:
          - "authorization_state == AUTHORIZED_FIXED"
          - "roaming authorisation approved with mode == IN_MOTION"
        side_effects:
          - "authorization_state = AUTHORIZED_IN_MOTION"
      - from: DEAUTHORIZED
        to: AUTHORIZED_FIXED
        trigger: "system: licence REINSTATE cascade"
        actor: system
        preconditions:
          - "authorization_state == DEAUTHORIZED"
          - "deauthorized_by_license_id == the reinstated licence id"
          - "service_state != TERMINATED"
        side_effects:
          - "deauthorized_by_license_id = null"
        note: "authorization dimension cycle AUTHORIZED_FIXED -> DEAUTHORIZED -> AUTHORIZED_FIXED"
      - from: PRIORITY
        to: DEPRIORITIZED
        trigger: "POST /satellite-broadband/subscriptions/{id}/usage-records (threshold crossing) or plan-change onto a smaller allowance"
        actor: NetworkOpsEngineer | ProvisioningAgent
        preconditions:
          - "priority_state == PRIORITY"
          - "cycle_priority_gb_used >= service_plan.priority_data_gb + beam.deprioritization_grace_gb"
        side_effects:
          - "deprioritized_at = logical_now, effective_rate_mbps = service_plan.deprioritized_rate_mbps"
          - "CASCADE HOP 1 (caused by the flip): beam.weighted_sold_mbps recomputed with DEPRIORITIZED_WEIGHT for this subscription"
          - "CASCADE HOP 2 (caused by hop 1): beam.oversubscription_ratio and capacity_state recomputed"
          - "CASCADE HOP 3 (caused by hop 2): every ServiceCell of that beam recomputes availability_state"
          - "increments Beam.version by 1"
        note: "fair-use dimension"
      - from: DEPRIORITIZED
        to: PRIORITY
        trigger: "system: billing-cycle-close step 6 (fair-use reset)"
        actor: system
        preconditions:
          - "priority_state == DEPRIORITIZED"
          - "service_state == ACTIVE"
        side_effects:
          - "cycle_priority_gb_used = 0, deprioritized_at = null, cycle_billing_index = beam.billing_cycle_index (post-increment value)"
          - "beam recompute follows in step 7"
        note: "fair-use dimension; compensating transition for the deprioritisation flip"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /satellite-broadband/subscriptions/{id}/suspend, or the warranty-replacement cascade"
        actor: ProvisioningAgent | system
        preconditions:
          - "service_state IN {PENDING_ACTIVATION, ACTIVE}"
        side_effects:
          - "suspension_reason recorded, service_state = SUSPENDED"
          - "CASCADE HOP 1: beam.weighted_sold_mbps drops by this subscription's weighted contribution (SUSPENDED is excluded from the sold set) -> ratio and capacity_state recomputed; increments Beam.version by 1"
          - "CASCADE HOP 2 (caused by hop 1): every ServiceCell of that beam recomputes availability_state"
          - "cell.committed_terminal_count unchanged — a suspended subscription keeps its slot"
          - "subscriber.account_state -> SUSPENDED when every non-terminal subscription of that subscriber is SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: install of a warranty replacement terminal (Terminal cascade hop 2)"
        actor: system
        preconditions:
          - "service_state == SUSPENDED"
          - "suspension_reason == 'RMA_IN_FLIGHT'"
        side_effects:
          - "terminal_id = the replacement terminal id, suspension_reason = null"
          - "beam recompute (the subscription re-enters weighted_sold_mbps)"
          - "subscriber.account_state SUSPENDED -> ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /satellite-broadband/subscriptions/{id}/terminate"
        actor: ProvisioningAgent
        preconditions:
          - "service_state IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "terminated_at = logical_now, authorization_state = DEAUTHORIZED, terminated subscriptions leave every counter"
          - "CASCADE HOP 1: cell.committed_terminal_count -1 -> free_slot_count and availability_state recomputed; increments ServiceCell.version by 1"
          - "CASCADE HOP 2 (caused by hop 1): promotion routine runs on that cell — the top WAITLISTED order by waitlist_priority_score DESC, created_at ASC -> RESERVED with reservation_expires_at = logical_now + RESERVATION_HOLD_HOURS"
          - "CASCADE HOP 3 (caused by hop 2): that promoted order's subscriber.account_state WAITLISTED -> PROSPECT"
          - "beam.weighted_sold_mbps / oversubscription_ratio / capacity_state recomputed; increments Beam.version by 1"
          - "terminal_state INSTALLED -> RETURN_INITIATED on the bound terminal"
          - "every RoamingAuthorization on this subscription with auth_state IN {REQUESTED, NEEDS_INFO, APPROVED} -> REVOKED with revoked_reason = 'SUBSCRIPTION_TERMINATED'"
          - "subscriber.account_state -> CLOSED when the subscriber has no remaining subscription with service_state IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /satellite-broadband/subscriptions/{id}/plan-change"
        actor: ProvisioningAgent
        preconditions:
          - "service_state IN {PENDING_ACTIVATION, ACTIVE}"
          - "expected_beam_version == beam.version (OCC)"
          - "projected beam oversubscription_ratio with the new plan <= beam.oversubscription_limit"
        side_effects:
          - "service_plan_id = body.new_service_plan_id"
          - "priority_state re-evaluated against the new plan's priority_data_gb + beam.deprioritization_grace_gb (may flip PRIORITY -> DEPRIORITIZED immediately)"
          - "effective_rate_mbps recomputed"
          - "beam.weighted_sold_mbps / ratio / capacity_state recomputed; increments Beam.version by 1"
          - "affected ServiceCell rows recompute availability_state"

  # ------------------------------------------------------ RoamingAuthorization
  - entity: RoamingAuthorization
    initial_state: REQUESTED                      # field: auth_state
    terminal_states: [APPROVED, DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: NEEDS_INFO
        trigger: "POST /satellite-broadband/roaming-authorizations/{id}/request-info"
        actor: ComplianceOfficer
        preconditions:
          - "auth_state == REQUESTED"
          - "info_round_count < ROAMING_MAX_INFO_ROUNDS"
        side_effects:
          - "info_round_count += 1, decision_note = body.info_request_note"
      - from: NEEDS_INFO
        to: REQUESTED
        trigger: "POST /satellite-broadband/roaming-authorizations/{id}/resubmit"
        actor: Subscriber | ProvisioningAgent
        preconditions:
          - "auth_state == NEEDS_INFO"
          - "body.effective_until > body.effective_from"
          - "the resubmitted window passes the same overlap/cooldown check as creation"
        side_effects:
          - "effective_from / effective_until replaced by the body values"
        note: "Closes the bounded revision cycle REQUESTED -> NEEDS_INFO -> REQUESTED (at most ROAMING_MAX_INFO_ROUNDS rounds)."
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /satellite-broadband/roaming-authorizations/{id}/decide with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "auth_state == REQUESTED"
          - "subscription.service_state IN {PENDING_ACTIVATION, ACTIVE}"
          - "a governing licence exists for target_jurisdiction_code per calculations.governing_license_selection"
          - "for mode == IN_MOTION: governing licence in_motion_permitted == true and plan.in_motion_allowed == true"
          - "for mode == PORTABILITY_MOVE: target cell admission_free >= 1 (admission_expiry_aware variant)"
        side_effects:
          - "governing_license_id = the selected licence, decision_note = body.decision_note"
          - "for mode == IN_MOTION: subscription.authorization_state -> AUTHORIZED_IN_MOTION"
          - "for mode == PORTABILITY_MOVE: subscription.service_cell_id = target_service_cell_id; the OLD cell committed_terminal_count -1 then its promotion routine runs (top WAITLISTED order -> RESERVED, subscriber WAITLISTED -> PROSPECT); the NEW cell committed_terminal_count +1; both cells recompute availability_state; both beams recompute weighted_sold_mbps / ratio / capacity_state"
          - "for mode == ROAM_TEMPORARY: no state change beyond the authorisation row"
        note: "Branch A of the decide fork; side-effect set diverges by mode."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /satellite-broadband/roaming-authorizations/{id}/decide with decision=DENY"
        actor: ComplianceOfficer
        preconditions:
          - "auth_state == REQUESTED"
        side_effects:
          - "decision_note = body.decision_note; no subscription or cell state changes"
        note: "Branch B of the decide fork."
      - from: APPROVED
        to: REVOKED
        trigger: "system: licence SUSPEND/EXPIRED cascade hop 3, or subscription terminate"
        actor: system
        preconditions:
          - "auth_state == APPROVED"
        side_effects:
          - "revoked_reason set to 'LICENSE_SUSPENDED' or 'SUBSCRIPTION_TERMINATED'"
          - "subscription.authorization_state is NOT restored to AUTHORIZED_FIXED by this hop"
      - from: REQUESTED
        to: REVOKED
        trigger: "system: subscription terminate"
        actor: system
        preconditions:
          - "auth_state IN {REQUESTED, NEEDS_INFO}"
        side_effects:
          - "revoked_reason = 'SUBSCRIPTION_TERMINATED'"

  # ---------------------------------------------------------------- OutageEvent
  - entity: OutageEvent
    initial_state: OPEN                           # field: event_state
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /satellite-broadband/outage-events/{id}/resolve"
        actor: NetworkOpsEngineer
        preconditions:
          - "event_state == OPEN"
          - "body.ended_at > started_at"
          - "body.ended_at <= logical_now"
        side_effects:
          - "ended_at = body.ended_at, outage_minutes = floor((ended_at - started_at)/60s)"
          - "credit_eligible = (cause != PLANNED_MAINTENANCE AND outage_minutes >= SLA_MIN_OUTAGE_MINUTES)"
          - "when outage_minutes >= SLA_MIN_OUTAGE_MINUTES: one OutageCredit row (credit_state = DRAFT) is created per affected Subscription — affected = service_state == ACTIVE AND authorization_state IN {AUTHORIZED_FIXED, AUTHORIZED_IN_MOTION} AND its cell's beam_id == event.beam_id AND activated_at <= started_at, processed in Subscription.created_at ASC order"
          - "each created credit sets provisional_credit_cents = calculations.outage_credit_amount variant provisional_event_level (a PLANNED_MAINTENANCE event therefore drafts 0-cent rows because CAUSE_MULTIPLIER is 0.0)"
          - "generated_credit_count = number of credits created"
          - "each affected subscriber.pending_credit_cents += that credit's provisional_credit_cents"
          - "when outage_minutes < SLA_MIN_OUTAGE_MINUTES: generated_credit_count = 0 and no credit rows are created"
          - "note: row creation is gated on the duration threshold only; credit_eligible additionally excludes PLANNED_MAINTENANCE and is re-checked at submit time by validations[priority=37], so a long planned-maintenance window drafts rows that can never be submitted"

  # --------------------------------------------------------------- OutageCredit
  - entity: OutageCredit
    initial_state: DRAFT                          # field: credit_state
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /satellite-broadband/outage-credits/{id}/submit"
        actor: ProvisioningAgent
        preconditions:
          - "credit_state == DRAFT"
          - "the credit's OutageEvent.event_state == RESOLVED"
        side_effects:
          - "submitted_by_user_id = the caller's X-User-ID"
          - "subscriber.pending_credit_cents unchanged (DRAFT and SUBMITTED both count as pending)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /satellite-broadband/outage-credits/{id}/decide with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "credit_state == SUBMITTED"
          - "the caller's X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "decided_by_user_id = caller X-User-ID, decision_reason = body.decision_reason"
          - "final_credit_cents = calculations.outage_credit_amount variant final_daily_prorated"
          - "subscriber.pending_credit_cents -= provisional_credit_cents"
          - "subscriber.credit_balance_cents += final_credit_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /satellite-broadband/outage-credits/{id}/decide with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "credit_state == SUBMITTED"
          - "the caller's X-User-ID != submitted_by_user_id"
        side_effects:
          - "decided_by_user_id = caller X-User-ID, decision_reason = body.decision_reason"
          - "final_credit_cents stays null"
          - "subscriber.pending_credit_cents -= provisional_credit_cents; credit_balance_cents unchanged"
        note: "Compensating branch: the provisional amount leaves the pending ledger without ever reaching the balance."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: activation-stale-service-cell
    parent_entity: ServiceCell
    write_endpoint: "POST /satellite-broadband/subscriptions"
    occ_field: "expected_service_cell_version"
    description: |
      Activating a Subscription against a ServiceCell whose version has advanced since the client
      last read the cell is rejected. The activation admits against the cell's slot ledger, and that
      ledger is mutated by every reservation, lazy expiry, promotion, activation and termination on
      the cell; a writer holding a stale cell version has therefore admitted against a slot count
      the server no longer reports, even though a fresh read would show free capacity and the same
      request would legitimately succeed.
    error_id: ERR_STALE_SERVICE_CELL_VERSION
    http_status: 412

  - rule_id: plan-change-stale-beam
    parent_entity: Beam
    write_endpoint: "POST /satellite-broadband/subscriptions/{id}/plan-change"
    occ_field: "expected_beam_version"
    description: |
      Re-assigning a service plan while holding a stale Beam version is rejected. A plan change
      legitimately supersedes the previous plan assignment, so the second write is not blocked by
      any state precondition; the beam's weighted_sold_mbps that the oversubscription admission
      test consumes has simply moved on (another plan change, activation, termination or fair-use
      flip advanced Beam.version), and the client's headroom calculation is stale.
    error_id: ERR_STALE_BEAM_VERSION
    http_status: 412

  - rule_id: capacity-policy-stale-beam
    parent_entity: Beam
    write_endpoint: "POST /satellite-broadband/beams/{id}/capacity-policy"
    occ_field: "expected_beam_version"
    description: |
      Writing a capacity policy (oversubscription limit and deprioritisation grace) against a stale
      Beam version is rejected. A policy write legitimately supersedes the previous policy, so the
      write has no state precondition to fail; OCC is the only thing that stops a policy computed
      from an out-of-date congestion picture from overwriting a newer one.
    error_id: ERR_STALE_BEAM_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: cell_slot_availability
    trigger: "GET /satellite-broadband/service-cells/{id}/availability (read), and admission inside POST /satellite-broadband/service-orders, POST /satellite-broadband/subscriptions and roaming PORTABILITY_MOVE approval (write)"
    algorithm: aggregation
    formula: |
      committed = count(Subscription s WHERE s.service_cell_id == cell.id
                        AND s.service_state IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED})
      reserved  = count(ServiceOrder o WHERE o.service_cell_id == cell.id
                        AND o.order_state == RESERVED)
      expired_reserved = count(ServiceOrder o WHERE o.service_cell_id == cell.id
                        AND o.order_state == RESERVED
                        AND o.reservation_expires_at <= logical_now)
      waitlist  = count(ServiceOrder o WHERE o.service_cell_id == cell.id
                        AND o.order_state == WAITLISTED)

      # --- variant advertised_strict (persisted on ServiceCell, returned by the availability read)
      free_slot_count = max(0, cell.max_active_terminals - committed - reserved)
      availability_state =
        CLOSED        if cell.beam.beam_state == SUSPENDED
                      or cell.beam.capacity_state == SATURATED
                      or cell.max_active_terminals == 0
        AVAILABLE     if free_slot_count >= 1
        WAITLIST_ONLY if free_slot_count == 0 AND waitlist < WAITLIST_CAP_PER_CELL
        CLOSED        if free_slot_count == 0 AND waitlist >= WAITLIST_CAP_PER_CELL

      # --- variant admission_expiry_aware (write path only)
      self_reservation = 1 on POST /satellite-broadband/subscriptions (the activating order's own
                         RESERVED row is being converted into the commitment, so it must not be
                         counted twice), else 0
      admission_free = max(0, cell.max_active_terminals - committed
                              - (reserved - expired_reserved - self_reservation))
    input_set: |
      Subscription rows in {PENDING_ACTIVATION, ACTIVE, SUSPENDED} occupy a slot; TERMINATED rows do
      not. ServiceOrder rows in RESERVED occupy a slot; WAITLISTED / EXPIRED / CANCELLED / ACTIVATED
      do not. `expired_reserved` is the subset of RESERVED whose reservation_expires_at <= logical_now.
      On POST /subscriptions the activating order's own RESERVED row is excluded via
      `self_reservation`; on POST /service-orders and PORTABILITY_MOVE approval there is no such
      row and `self_reservation` is 0.
    constants:
      WAITLIST_CAP_PER_CELL: 3
      RESERVATION_HOLD_HOURS: 72
    precision: "integer counts; no rounding"
    variants:
      - name: advertised_strict
        when: "GET /satellite-broadband/service-cells/{id}/availability and the persisted ServiceCell.free_slot_count / availability_state fields"
        difference: "Counts every RESERVED order, including reservations whose reservation_expires_at has already passed but which no sweep has expired yet. The read is a pure projection and never mutates."
      - name: admission_expiry_aware
        when: "POST /satellite-broadband/service-orders, POST /satellite-broadband/subscriptions, roaming PORTABILITY_MOVE approval"
        difference: |
          Subtracts expired_reserved (and, on POST /subscriptions, the activating order's own
          reservation via self_reservation) before testing capacity, and (only on POST /service-orders)
          performs lazy expiry first: every RESERVED order on the cell with
          reservation_expires_at <= logical_now is moved to EXPIRED in created_at ASC order.
          Lazy expiry NEVER promotes from the waitlist. Consequence: identical stored data yields
          availability_state == WAITLIST_ONLY from the read while the write path admits.

  - name: beam_weighted_oversubscription
    trigger: "recomputed on subscription activation, authorize, suspend, resume, terminate, plan-change, fair-use flip and restore, capacity-policy write, and billing-cycle-close step 7"
    algorithm: threshold
    formula: |
      weight(s) = DEPRIORITIZED_WEIGHT                      if s.priority_state == DEPRIORITIZED
                  else TIER_WEIGHT[plan(s).priority_tier]
      sold_set  = { Subscription s : cell(s).beam_id == beam.id
                    AND s.service_state IN {PENDING_ACTIVATION, ACTIVE} }
      weighted_sold_mbps    = round_half_up(SUM over sold_set of
                              plan(s).committed_rate_mbps * weight(s), 3)
      oversubscription_ratio = round_half_up(weighted_sold_mbps / beam.forward_capacity_mbps, 4)
      capacity_state =
        NORMAL      if oversubscription_ratio <= CONSTRAINED_FRACTION * beam.oversubscription_limit
        CONSTRAINED if CONSTRAINED_FRACTION * limit < ratio <= beam.oversubscription_limit
        SATURATED   if oversubscription_ratio > beam.oversubscription_limit

      # admission test (POST /subscriptions and plan-change)
      delta = plan_being_added.committed_rate_mbps * weight_of_the_added_or_changed_subscription
              - (plan_being_replaced.committed_rate_mbps * its_current_weight, or 0 on activation)
      projected_ratio = round_half_up((weighted_sold_mbps + delta) / beam.forward_capacity_mbps, 4)
      REJECT ERR_BEAM_OVERSUBSCRIBED when projected_ratio > beam.oversubscription_limit
      # exactly == limit is admitted
    input_set: |
      Only subscriptions whose service_state IN {PENDING_ACTIVATION, ACTIVE} contribute. SUSPENDED
      and TERMINATED contribute 0 (a suspended subscription keeps its cell slot but frees beam Mbps).
      Weight is taken from priority_state first (DEPRIORITIZED overrides the tier weight), otherwise
      from the plan's priority_tier.
    constants:
      TIER_WEIGHT: { PRIORITY_1: 1.0, PRIORITY_2: 0.7, BEST_EFFORT: 0.4 }
      DEPRIORITIZED_WEIGHT: 0.25
      CONSTRAINED_FRACTION: 0.75
    precision: "weighted_sold_mbps 3 decimal places round_half_up; oversubscription_ratio 4 decimal places round_half_up"

  - name: fair_use_priority_threshold
    trigger: "POST /satellite-broadband/subscriptions/{id}/usage-records, and re-evaluated by POST /satellite-broadband/subscriptions/{id}/plan-change and POST /satellite-broadband/beams/{id}/capacity-policy"
    algorithm: threshold
    formula: |
      counted = (body.billing_cycle_index == subscription.cycle_billing_index)
      if counted:
          cycle_priority_gb_used = round_half_up(cycle_priority_gb_used + body.gb_used, 3)
      effective_threshold_gb = service_plan.priority_data_gb + beam.deprioritization_grace_gb
      if subscription.priority_state == PRIORITY
         AND cycle_priority_gb_used >= effective_threshold_gb:
             priority_state = DEPRIORITIZED            # boundary: >= , exact equality triggers
      overage_gb = max(0, round_half_up(cycle_priority_gb_used - effective_threshold_gb, 3))
    input_set: |
      Only UsageRecord rows whose billing_cycle_index equals the subscription's cycle_billing_index
      at ingest time advance the counter; rows for any other cycle are persisted with counted=false
      and are invisible to the threshold and to the overage calculation. Deprioritisation is not
      reversed by a later negative or zero reading — only billing-cycle-close restores PRIORITY.
    constants: {}
    precision: "cycle_priority_gb_used and overage_gb 3 decimal places, round_half_up"

  - name: outage_credit_amount
    trigger: "POST /satellite-broadband/outage-events/{id}/resolve (provisional) and POST /satellite-broadband/outage-credits/{id}/decide with decision=APPROVE (final)"
    algorithm: tiered_pricing
    formula: |
      multiplier = CAUSE_MULTIPLIER[event.cause] * SEVERITY_FACTOR[event.severity]
      cap_cents  = round_half_up(plan.monthly_fee_cents * CREDIT_CAP_FRACTION)

      # --- variant provisional_event_level (written at resolve)
      raw = plan.monthly_fee_cents * (event.outage_minutes / MINUTES_PER_BILLING_MONTH) * multiplier
      provisional_credit_cents = min(round_half_up(raw), cap_cents)

      # --- variant final_daily_prorated (written at approval)
      # Split [event.started_at, event.ended_at) into UTC calendar days, half-open per day.
      # PINNED EVALUATION ORDER: round each day's amount to whole cents FIRST, then sum.
      for each UTC day d that overlaps the window, in chronological order:
          day_minutes = floor(overlap_seconds(window, day d) / 60)
          day_credit  = round_half_up(plan.monthly_fee_cents
                                      * (day_minutes / MINUTES_PER_BILLING_MONTH) * multiplier)
      final_credit_cents = min(SUM of day_credit, cap_cents)
      # "sum the minutes then round once" is explicitly NOT the rule and yields a different value.
    input_set: |
      Affected subscriptions at resolve: service_state == ACTIVE AND authorization_state IN
      {AUTHORIZED_FIXED, AUTHORIZED_IN_MOTION} AND their ServiceCell.beam_id == event.beam_id AND
      activated_at <= event.started_at. Processed in Subscription.created_at ASC order. Both variants
      read the plan the subscription holds at the moment the variant runs (a plan change between
      resolve and approval therefore changes the final amount but never the provisional one).
    constants:
      MINUTES_PER_BILLING_MONTH: 43200
      SLA_MIN_OUTAGE_MINUTES: 30
      CAUSE_MULTIPLIER: { WEATHER_RAIN_FADE: 0.5, EQUIPMENT_FAILURE: 1.0, SPECTRUM_INTERFERENCE: 1.0, PLANNED_MAINTENANCE: 0.0 }
      SEVERITY_FACTOR: { FULL_OUTAGE: 1.0, DEGRADATION: 0.5 }
      CREDIT_CAP_FRACTION: 0.5
    precision: "whole cents, round_half_up at every step named above"
    variants:
      - name: provisional_event_level
        when: "resolve cascade; stored in provisional_credit_cents and added to Subscriber.pending_credit_cents"
        difference: "One rounding over the whole event duration."
      - name: final_daily_prorated
        when: "approval; stored in final_credit_cents and added to Subscriber.credit_balance_cents"
        difference: "One rounding per UTC calendar day, then summed. For a 300-minute window split 150/150 across midnight on a 9900-cent plan the provisional value is 69 and the final value is 68."

  - name: cycle_charge_with_overage_discount
    trigger: "POST /satellite-broadband/beams/{id}/billing-cycle-close step 5, for every Subscription on the beam's cells with service_state == ACTIVE"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER — the discount band is keyed on the gross total, which itself
      # contains the overage fee, so the order below is the only well-defined reading.
      # 1. overage volume and fee
      effective_threshold_gb = service_plan.priority_data_gb + beam.deprioritization_grace_gb
      overage_gb        = max(0, round_half_up(cycle_priority_gb_used - effective_threshold_gb, 3))
      overage_fee_cents = round_half_up(overage_gb * service_plan.overage_rate_cents_per_gb)
      # 2. gross total
      gross_total_cents = service_plan.monthly_fee_cents + overage_fee_cents
      # 3. discount band selected from the GROSS total (never from monthly_fee_cents alone)
      discount_pct = 0.00  if gross_total_cents < DISCOUNT_BAND_1_CENTS
                     0.05  if DISCOUNT_BAND_1_CENTS <= gross_total_cents < DISCOUNT_BAND_2_CENTS
                     0.10  if gross_total_cents >= DISCOUNT_BAND_2_CENTS
      # 4. net charge
      cycle_charge_cents = round_half_up(gross_total_cents * (1 - discount_pct))
      subscriber.pending_charge_cents += cycle_charge_cents
    input_set: |
      Only subscriptions with service_state == ACTIVE at step 5 of the ops run are charged;
      PENDING_ACTIVATION, SUSPENDED and TERMINATED rows are skipped and keep their previous
      cycle_charge_cents. Step 5 runs BEFORE the fair-use reset in step 6, so the charge sees the
      cycle's accumulated cycle_priority_gb_used.
    constants:
      DISCOUNT_BAND_1_CENTS: 10000
      DISCOUNT_BAND_2_CENTS: 25000
    precision: "whole cents, round_half_up; the multiplication in step 4 is rounded once, after the discount is applied"

  - name: waitlist_priority_score
    trigger: "computed when a ServiceOrder enters WAITLISTED, and recomputed for every WAITLISTED order on a cell at each promotion evaluation on that cell"
    algorithm: chronological
    formula: |
      waiting_days = floor((logical_now - order.created_at) / 86400 seconds)
      waitlist_priority_score = PLAN_TIER_RANK[requested_plan.priority_tier] * 1000
                                + min(waiting_days, WAIT_DAY_CAP)

      # promotion selector (used by cancel, terminate, PORTABILITY_MOVE move-out, cycle-close step 8)
      eligibility  : order_state == WAITLISTED AND order.service_cell_id == cell.id
      ranking      : waitlist_priority_score DESC
      tie_break    : order.created_at ASC        # never order.id
      loop         : while cell.free_slot_count >= 1 and an eligible order exists, promote the
                     top-ranked order, then recompute cell counters and repeat
      empty_fallback: no promotion occurs, no error is raised, the freed slot stays free
    input_set: "WAITLISTED orders on the cell being evaluated; cells inside an ops run are swept in ServiceCell.cell_code ASC order"
    constants:
      PLAN_TIER_RANK: { PRIORITY_1: 3, PRIORITY_2: 2, BEST_EFFORT: 1 }
      WAIT_DAY_CAP: 365
    precision: "integer score; waiting_days floored"

  - name: governing_license_selection
    trigger: "subscription authorize, subscription activation (disclosure version pinning), and roaming decide=APPROVE"
    algorithm: aggregation
    formula: |
      # For a subscription: jurisdiction = its ServiceCell.jurisdiction_code and the licence must be
      # the one its Beam radiates under (beam.spectrum_license_id).
      # For a roaming approval: jurisdiction = target_jurisdiction_code and any licence may serve.
      candidates = { SpectrumLicense l : l.jurisdiction_code == jurisdiction
                     AND l.license_state == ACTIVE AND l.coordination_state == COORDINATED }
      ranking    = expires_at DESC
      tie_break  = created_at ASC              # never l.id
      selected   = first candidate after ranking
      empty_fallback = reject with ERR_JURISDICTION_NOT_PERMITTED (roaming approval) or with
                       ERR_LICENSE_NOT_ACTIVE / ERR_SPECTRUM_NOT_COORDINATED (subscription
                       authorize, which inspects the beam's own licence instead of searching)
    input_set: "SpectrumLicense rows only; PENDING_COORDINATION, SUSPENDED, REFUSED and EXPIRED licences are never candidates"
    constants: {}
    precision: "n/a"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present, and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when X-User-Role == Subscriber, X-User-ID must equal the Subscriber id that owns the target resource (Terminal.subscriber_id, ServiceOrder.subscriber_id, Subscription.subscriber_id, RoamingAuthorization -> Subscription.subscriber_id, OutageCredit -> Subscription.subscriber_id, Subscriber.id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles include Subscriber"

  - priority: 4
    category: business_constraint
    check: "request schema: required body fields present, enum members valid, numeric ranges honoured (limit 1..100, offset >= 0, total_sample_count > 0, obstructed_sample_count <= total_sample_count, gb_used >= 0, effective_until > effective_from, ended_at > started_at, target_service_cell_id present iff mode == PORTABILITY_MOVE)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "path ids resolve, validated left-to-right"
    error_id: "ERR_SPECTRUM_LICENSE_NOT_FOUND | ERR_BEAM_NOT_FOUND | ERR_SERVICE_CELL_NOT_FOUND | ERR_SUBSCRIBER_NOT_FOUND | ERR_SERVICE_ORDER_NOT_FOUND | ERR_TERMINAL_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_ROAMING_AUTHORIZATION_NOT_FOUND | ERR_OUTAGE_EVENT_NOT_FOUND | ERR_OUTAGE_CREDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "body foreign keys resolve (spectrum_license_id, beam_id, subscriber_id, service_cell_id, requested_plan_id, service_order_id, terminal_id, subscription_id, new_service_plan_id, new_subscriber_id, target_service_cell_id)"
    error_id: "ERR_SPECTRUM_LICENSE_NOT_FOUND | ERR_BEAM_NOT_FOUND | ERR_SERVICE_CELL_NOT_FOUND | ERR_SERVICE_PLAN_NOT_FOUND | ERR_SUBSCRIBER_NOT_FOUND | ERR_SERVICE_ORDER_NOT_FOUND | ERR_TERMINAL_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK body fields"

  - priority: 7
    category: state
    check: "expected_service_cell_version / expected_beam_version must equal the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_SERVICE_CELL_VERSION | ERR_STALE_BEAM_VERSION"
    http_status: 412
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/plan-change, POST /beams/{id}/capacity-policy"

  - priority: 8
    category: state
    check: "SpectrumLicense.license_state permits the requested coordination or enforcement action"
    error_id: ERR_LICENSE_STATE_INVALID
    http_status: 409
    applies_to: "POST /spectrum-licenses/{id}/coordination, POST /spectrum-licenses/{id}/enforcement-action"

  - priority: 9
    category: state
    check: "Terminal.terminal_state permits the requested logistics transition"
    error_id: ERR_TERMINAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /terminals/{id}/deliver, /install, /return, /warranty-replacement, /transfer, POST /terminals/{id}/obstruction-scans"

  - priority: 10
    category: state
    check: "ServiceOrder.order_state permits the requested action (cancel needs RESERVED or WAITLISTED; activation needs RESERVED)"
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /service-orders/{id}/cancel, POST /subscriptions"

  - priority: 11
    category: state
    check: "Subscription service_state / authorization_state / disclosure_ack_state permit the requested transition (terminate needs non-terminal, authorize needs UNAUTHORIZED, acknowledgement needs PENDING_ACK, usage ingest and plan-change need service_state != TERMINATED)"
    error_id: ERR_SUBSCRIPTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /subscriptions/{id}/authorize, /suspend, /terminate, /plan-change, /disclosure-acknowledgement, /usage-records"

  - priority: 12
    category: state
    check: "RoamingAuthorization.auth_state permits the requested review action"
    error_id: ERR_ROAMING_STATE_INVALID
    http_status: 409
    applies_to: "POST /roaming-authorizations/{id}/request-info, /resubmit, /decide"

  - priority: 13
    category: state
    check: "OutageCredit.credit_state permits the requested action (submit needs DRAFT, decide needs SUBMITTED)"
    error_id: ERR_CREDIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /outage-credits/{id}/submit, POST /outage-credits/{id}/decide"

  - priority: 14
    category: state
    check: "OutageEvent.event_state == OPEN when resolving"
    error_id: ERR_OUTAGE_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /outage-events/{id}/resolve"

  - priority: 15
    category: state
    check: "the terminal named in an activation must be INSTALLED"
    error_id: ERR_TERMINAL_NOT_INSTALLED
    http_status: 409
    applies_to: "POST /subscriptions"

  - priority: 16
    category: business_referential
    check: "terminal.subscriber_id == order.subscriber_id at activation; new_subscriber_id != terminal.subscriber_id at transfer"
    error_id: ERR_TERMINAL_SUBSCRIBER_MISMATCH
    http_status: 422
    applies_to: "POST /subscriptions, POST /terminals/{id}/transfer"

  - priority: 17
    category: business_referential
    check: "the target cell of a PORTABILITY_MOVE must differ from the subscription's current service_cell_id, and the roaming authorisation's subscription must not be TERMINATED"
    error_id: ERR_PORTABILITY_TARGET_INVALID
    http_status: 422
    applies_to: "POST /roaming-authorizations, POST /roaming-authorizations/{id}/decide"

  - priority: 18
    category: business_safety
    check: "the operator deciding an outage credit must not be the operator that submitted it (X-User-ID comparison)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /outage-credits/{id}/decide"

  - priority: 19
    category: business_safety
    check: "the governing SpectrumLicense.license_state == ACTIVE"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /subscriptions/{id}/authorize, POST /roaming-authorizations/{id}/decide"

  - priority: 20
    category: business_safety
    check: "the governing SpectrumLicense.coordination_state == COORDINATED"
    error_id: ERR_SPECTRUM_NOT_COORDINATED
    http_status: 422
    applies_to: "POST /subscriptions/{id}/authorize, POST /roaming-authorizations/{id}/decide"

  - priority: 21
    category: business_safety
    check: "Subscription.disclosure_ack_state == ACKNOWLEDGED before network authorisation is granted"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /subscriptions/{id}/authorize"

  - priority: 22
    category: business_safety
    check: "acknowledged_version equals the pinned Subscription.disclosure_version_issued"
    error_id: ERR_DISCLOSURE_VERSION_MISMATCH
    http_status: 422
    applies_to: "POST /subscriptions/{id}/disclosure-acknowledgement"

  - priority: 23
    category: business_safety
    check: "the subscriber's jurisdiction_code equals the activating cell's jurisdiction_code (activation), and a governing licence exists for target_jurisdiction_code (roaming approval)"
    error_id: ERR_JURISDICTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /subscriptions, POST /roaming-authorizations/{id}/decide"

  - priority: 24
    category: business_safety
    check: "mode == IN_MOTION requires service_plan.in_motion_allowed == true at request time and governing licence in_motion_permitted == true at approval; authorization_mode == IN_MOTION requires both as well"
    error_id: ERR_IN_MOTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /roaming-authorizations, POST /roaming-authorizations/{id}/decide, POST /subscriptions/{id}/authorize"

  - priority: 25
    category: business_safety
    check: "mode IN {PORTABILITY_MOVE, ROAM_TEMPORARY} requires service_plan.roaming_allowed == true"
    error_id: ERR_ROAMING_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /roaming-authorizations"

  - priority: 26
    category: business_temporal
    check: "the activating order's reservation_expires_at > logical_now"
    error_id: ERR_RESERVATION_EXPIRED
    http_status: 409
    applies_to: "POST /subscriptions"

  - priority: 27
    category: business_temporal
    check: "half-open interval rule: no other OutageEvent on the same beam with the same cause covers the new started_at. A RESOLVED event covers [started_at, ended_at) — an event starting exactly at another's ended_at is accepted; an OPEN event covers [started_at, +inf)."
    error_id: ERR_OUTAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /outage-events"

  - priority: 28
    category: business_temporal
    check: "closed interval + buffer rule on the subscription: reject when the requested [effective_from, effective_until] overlaps an APPROVED authorisation's closed window on the same subscription, or when effective_from < that window's effective_until + ROAMING_COOLDOWN_HOURS (24h). effective_from exactly at the end of the cooldown is accepted."
    error_id: ERR_ROAMING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /roaming-authorizations, POST /roaming-authorizations/{id}/resubmit"

  - priority: 29
    category: business_temporal
    check: "terminal.warranty_expires_at > logical_now when a warranty replacement is requested"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /terminals/{id}/warranty-replacement"

  - priority: 30
    category: business_constraint
    check: "uniqueness: license_code, beam_code, cell_code, plan_code, Subscriber.email, Terminal.serial_number (including replacement_serial_number). A Terminal serial collision returns ERR_DUPLICATE_TERMINAL_SERIAL (409); every other unique-code collision returns ERR_INVALID_REQUEST (400)"
    error_id: "ERR_DUPLICATE_TERMINAL_SERIAL | ERR_INVALID_REQUEST"
    http_status: "409 for ERR_DUPLICATE_TERMINAL_SERIAL, 400 for ERR_INVALID_REQUEST"
    applies_to: "POST /spectrum-licenses, /beams, /service-cells, /service-plans, /subscribers, /terminals, /terminals/{id}/warranty-replacement"

  - priority: 31
    category: business_constraint
    check: "an ObstructionScan exists for the terminal with scanned_at >= max(terminal.created_at, terminal.ownership_changed_at)"
    error_id: ERR_OBSTRUCTION_SCAN_REQUIRED
    http_status: 422
    applies_to: "POST /terminals/{id}/install"

  - priority: 32
    category: business_constraint
    check: "the qualifying newest ObstructionScan.scan_verdict is not FAIL"
    error_id: ERR_OBSTRUCTION_VERDICT_FAIL
    http_status: 422
    applies_to: "POST /terminals/{id}/install"

  - priority: 33
    category: business_constraint
    check: "info_round_count < ROAMING_MAX_INFO_ROUNDS (3) when a further request-info round is opened"
    error_id: ERR_ROAMING_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /roaming-authorizations/{id}/request-info"

  - priority: 34
    category: business_fiscal
    check: "cell slot capacity via the admission_expiry_aware variant: admission_free >= 1"
    error_id: ERR_CELL_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /subscriptions, POST /roaming-authorizations/{id}/decide (PORTABILITY_MOVE approval)"

  - priority: 35
    category: business_fiscal
    check: "waitlist admission: cell.waitlist_depth < WAITLIST_CAP_PER_CELL (3) when an order would be waitlisted"
    error_id: ERR_WAITLIST_CLOSED
    http_status: 409
    applies_to: "POST /service-orders"

  - priority: 36
    category: business_fiscal
    check: "projected beam oversubscription_ratio <= beam.oversubscription_limit (equality admitted)"
    error_id: ERR_BEAM_OVERSUBSCRIBED
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/plan-change"

  - priority: 37
    category: business_fiscal
    check: "the credit's OutageEvent.credit_eligible == true when a credit is submitted"
    error_id: ERR_CREDIT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /outage-credits/{id}/submit"

  - priority: 38
    category: business_safety
    check: "the governing Beam.beam_state == ACTIVE (last-resort catch for the beam-suspension precondition that the licence checks at priorities 19-20 normally pre-empt)"
    error_id: ERR_BEAM_SUSPENDED
    http_status: 409
    applies_to: "POST /service-orders, POST /subscriptions, POST /subscriptions/{id}/authorize, POST /roaming-authorizations/{id}/decide"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # ------------------------------------------------------- SpectrumLicense
  - method: POST
    path: "/satellite-broadband/spectrum-licenses"
    description: "File a spectrum licence; lands in PENDING_COORDINATION / UNCOORDINATED"
    roles: [ComplianceOfficer]
    code: 201
    input: [license_code, jurisdiction_code, frequency_band, max_eirp_dbw, expires_at, consumer_disclosure_version, "in_motion_permitted?"]
    output: SpectrumLicense
    side_effects: ["license_state=PENDING_COORDINATION", "coordination_state=UNCOORDINATED"]

  - method: GET
    path: "/satellite-broadband/spectrum-licenses/{id}"
    description: "Read a spectrum licence"
    roles: [ComplianceOfficer, NetworkOpsEngineer, ProvisioningAgent]
    code: 200
    input: []
    output: SpectrumLicense
    side_effects: []

  - method: POST
    path: "/satellite-broadband/spectrum-licenses/{id}/coordination"
    description: "Record a spectrum-coordination outcome (GRANTED | GRANTED_PROVISIONAL | REFUSED); GRANTED_PROVISIONAL activates the licence while leaving it UNCOORDINATED, a later GRANTED closes the coordination"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "coordination_note?"]
    output: SpectrumLicense
    side_effects:
      - "outcome=GRANTED on a PENDING_COORDINATION licence: license_state -> ACTIVE, coordination_state=COORDINATED"
      - "outcome=GRANTED_PROVISIONAL on a PENDING_COORDINATION licence: license_state -> ACTIVE, coordination_state stays UNCOORDINATED"
      - "outcome=GRANTED on an ACTIVE licence whose coordination_state is UNCOORDINATED: coordination_state -> COORDINATED, license_state unchanged"
      - "outcome=REFUSED: license_state -> REFUSED, coordination_state=REFUSED, every beam under the licence -> beam_state=SUSPENDED"
      - "increments SpectrumLicense.version by 1"

  - method: POST
    path: "/satellite-broadband/spectrum-licenses/{id}/enforcement-action"
    description: "Suspend or reinstate a licence; SUSPEND runs the 4-hop regulatory cascade, REINSTATE compensates it"
    roles: [ComplianceOfficer]
    code: 200
    input: [action, reason]
    output: SpectrumLicense
    side_effects:
      - "SUSPEND: license_state ACTIVE -> SUSPENDED; beams -> SUSPENDED; their subscriptions AUTHORIZED_* -> DEAUTHORIZED with deauthorized_by_license_id; those subscriptions' APPROVED roaming -> REVOKED; cells -> availability_state CLOSED"
      - "REINSTATE: license_state SUSPENDED -> ACTIVE; beams -> ACTIVE; subscriptions with deauthorized_by_license_id == this licence -> AUTHORIZED_FIXED and the marker cleared; roaming stays REVOKED; cells recompute"
      - "increments SpectrumLicense.version by 1"

  # ------------------------------------------------------------------- Beam
  - method: POST
    path: "/satellite-broadband/beams"
    description: "Create a beam under a spectrum licence"
    roles: [NetworkOpsEngineer]
    code: 201
    input: [beam_code, satellite_code, spectrum_license_id, forward_capacity_mbps, "oversubscription_limit?"]
    output: Beam
    side_effects: ["weighted_sold_mbps=0, oversubscription_ratio=0, capacity_state=NORMAL, billing_cycle_index=0", "beam_state=SUSPENDED when the licence is not ACTIVE, else ACTIVE"]

  - method: GET
    path: "/satellite-broadband/beams/{id}"
    description: "Read a beam including its live congestion figures"
    roles: [NetworkOpsEngineer, ProvisioningAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Beam
    side_effects: []

  - method: GET
    path: "/satellite-broadband/beams"
    description: "List beams, filterable by licence and congestion band"
    roles: [NetworkOpsEngineer, ProvisioningAgent, ComplianceOfficer]
    code: 200
    input: ["spectrum_license_id?", "capacity_state?", "beam_state?", "limit?", "offset?"]
    output: Beam[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/beams/{id}/capacity-policy"
    description: "Write the beam's oversubscription limit and fair-use grace volume (OCC on Beam.version)"
    roles: [NetworkOpsEngineer]
    code: 200
    input: [oversubscription_limit, deprioritization_grace_gb, expected_beam_version]
    output: Beam
    side_effects:
      - "oversubscription_ratio and capacity_state recomputed against the new limit"
      - "every subscription on the beam re-evaluated against the new effective fair-use threshold (a raised grace does NOT restore an already deprioritised subscription; only billing-cycle-close does)"
      - "every ServiceCell of the beam recomputes availability_state"
      - "increments Beam.version by 1"

  - method: POST
    path: "/satellite-broadband/beams/{id}/billing-cycle-close"
    description: "Ops run for one beam. Ordered steps: (1) billing_cycle_index += 1 and last_cycle_closed_at = now; (2) licence expiry cascade when the beam's licence expires_at <= now; (3) disclosure-deadline enforcement; (4) reservation expiry sweep; (5) cycle charges; (6) fair-use reset and PRIORITY restoration; (7) beam recompute; (8) waitlist promotion per cell in cell_code ASC order; (9) cell recompute"
    roles: [NetworkOpsEngineer]
    code: 200
    input: []
    output: { beam_id: string, billing_cycle_index: integer, license_expired: boolean, disclosure_expired_count: integer, expired_order_count: integer, charged_subscription_count: integer, restored_subscription_count: integer, promoted_order_count: integer, capacity_state: string }
    side_effects:
      - "see the ordered step list in the description; step 5 runs before the step 6 reset so charges see the closing cycle's usage"
      - "increments Beam.version by 1"

  # ------------------------------------------------------------ ServiceCell
  - method: POST
    path: "/satellite-broadband/service-cells"
    description: "Create a coverage cell on a beam"
    roles: [NetworkOpsEngineer]
    code: 201
    input: [cell_code, beam_id, jurisdiction_code, max_active_terminals]
    output: ServiceCell
    side_effects: ["counters zeroed; availability_state computed (CLOSED when max_active_terminals == 0 or the beam is SUSPENDED/SATURATED)"]

  - method: GET
    path: "/satellite-broadband/service-cells/{id}"
    description: "Read a cell including its persisted slot ledger and version (the OCC token for activation)"
    roles: [NetworkOpsEngineer, ProvisioningAgent, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: ServiceCell
    side_effects: []

  - method: GET
    path: "/satellite-broadband/service-cells"
    description: "List cells, filterable by beam, jurisdiction and advertised availability"
    roles: [NetworkOpsEngineer, ProvisioningAgent, ComplianceOfficer, Subscriber]
    code: 200
    input: ["beam_id?", "jurisdiction_code?", "availability_state?", "limit?", "offset?"]
    output: ServiceCell[]
    side_effects: []

  - method: GET
    path: "/satellite-broadband/service-cells/{id}/availability"
    description: "Service availability determination for a cell — pure projection using the advertised_strict variant; never mutates and never lazily expires reservations"
    roles: [NetworkOpsEngineer, ProvisioningAgent, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: { service_cell_id: string, availability_state: string, advertised_free_slot_count: integer, committed_terminal_count: integer, reserved_slot_count: integer, waitlist_depth: integer, waitlist_cap: integer, beam_capacity_state: string, beam_state: string }
    side_effects: []

  # ------------------------------------------------------------ ServicePlan
  - method: POST
    path: "/satellite-broadband/service-plans"
    description: "Create a service plan"
    roles: [ProvisioningAgent]
    code: 201
    input: [plan_code, committed_rate_mbps, priority_tier, monthly_fee_cents, priority_data_gb, deprioritized_rate_mbps, "overage_rate_cents_per_gb?", "roaming_allowed?", "in_motion_allowed?"]
    output: ServicePlan
    side_effects: []

  # ------------------------------------------------------------- Subscriber
  - method: POST
    path: "/satellite-broadband/subscribers"
    description: "Open a prospect account"
    roles: [ProvisioningAgent]
    code: 201
    input: [email, full_name, jurisdiction_code]
    output: Subscriber
    side_effects: ["account_state=PROSPECT; credit_balance_cents=0, pending_credit_cents=0, pending_charge_cents=0"]

  - method: GET
    path: "/satellite-broadband/subscribers/{id}"
    description: "Read an account including its credit and charge ledgers"
    roles: [ProvisioningAgent, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: Subscriber
    side_effects: []

  # ----------------------------------------------------------- ServiceOrder
  - method: POST
    path: "/satellite-broadband/service-orders"
    description: "Request service in a cell. Runs lazy reservation expiry, then availability determination: RESERVED when admission_free >= 1, otherwise WAITLISTED (or rejected when the waitlist is at cap)"
    roles: [ProvisioningAgent]
    code: 201
    input: [subscriber_id, service_cell_id, requested_plan_id]
    output: ServiceOrder
    side_effects:
      - "lazy expiry: RESERVED orders on the cell past reservation_expires_at -> EXPIRED in created_at ASC order, with no waitlist promotion"
      - "branch RESERVED: reservation_expires_at = now + 72h, cell.reserved_slot_count +1"
      - "branch WAITLISTED: waitlist_priority_score computed, subscriber.account_state -> WAITLISTED, cell.waitlist_depth +1"
      - "cell counters and availability_state recomputed; increments ServiceCell.version by 1"

  - method: GET
    path: "/satellite-broadband/service-orders/{id}"
    description: "Read a service order"
    roles: [ProvisioningAgent, Subscriber]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: GET
    path: "/satellite-broadband/service-orders"
    description: "List service orders, filterable by subscriber, cell, requested plan and state; the reverse-reachability channel for orders created or promoted by a cascade"
    roles: [ProvisioningAgent, NetworkOpsEngineer, Subscriber]
    code: 200
    input: ["subscriber_id?", "service_cell_id?", "requested_plan_id?", "order_state?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/service-orders/{id}/cancel"
    description: "Cancel a reserved or waitlisted order; cancelling a reservation frees the slot and runs the promotion routine"
    roles: [ProvisioningAgent, Subscriber]
    code: 200
    input: [cancel_reason]
    output: ServiceOrder
    side_effects:
      - "from RESERVED: reserved_slot_count -1 then promotion routine on the cell (top WAITLISTED -> RESERVED, its subscriber WAITLISTED -> PROSPECT)"
      - "from WAITLISTED: waitlist_depth -1, subscriber.account_state -> PROSPECT when no other WAITLISTED order remains; no promotion"
      - "cell counters and availability_state recomputed; increments ServiceCell.version by 1"

  # --------------------------------------------------------------- Terminal
  - method: POST
    path: "/satellite-broadband/terminals"
    description: "Ship a user terminal to a subscriber"
    roles: [LogisticsCoordinator]
    code: 201
    input: [serial_number, subscriber_id, warranty_expires_at]
    output: Terminal
    side_effects: ["terminal_state=SHIPPED; replaces_terminal_id=null; last_scan_verdict=null"]

  - method: GET
    path: "/satellite-broadband/terminals/{id}"
    description: "Read a terminal"
    roles: [LogisticsCoordinator, ProvisioningAgent, NetworkOpsEngineer, Subscriber]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: GET
    path: "/satellite-broadband/terminals"
    description: "List terminals, filterable by custodian, replaced unit and logistics state; the reverse-reachability channel for cascade-created replacement units"
    roles: [LogisticsCoordinator, ProvisioningAgent, NetworkOpsEngineer, Subscriber]
    code: 200
    input: ["subscriber_id?", "replaces_terminal_id?", "terminal_state?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/terminals/{id}/deliver"
    description: "Mark a shipped terminal as delivered"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Terminal
    side_effects: ["terminal_state SHIPPED -> DELIVERED"]

  - method: POST
    path: "/satellite-broadband/terminals/{id}/obstruction-scans"
    description: "Self-installation obstruction assessment; computes obstruction_pct and the PASS/MARGINAL/FAIL verdict and refreshes Terminal.last_scan_verdict"
    roles: [Subscriber, ProvisioningAgent]
    code: 201
    input: [obstructed_sample_count, total_sample_count]
    output: ObstructionScan
    side_effects:
      - "obstruction_pct = round_half_up(100 * obstructed/total, 2); scan_verdict from the 2.00 / 8.00 breakpoints; scanned_at = logical_now"
      - "terminal.last_scan_verdict = this verdict (the scan is newer than created_at and ownership_changed_at by construction)"
      - "rejected with ERR_TERMINAL_STATE_INVALID when terminal_state IN {RETURNED, REPLACED}"

  - method: GET
    path: "/satellite-broadband/terminals/{id}/obstruction-scans"
    description: "List the obstruction scans taken on a terminal, newest first (scanned_at DESC, then created_at DESC)"
    roles: [Subscriber, ProvisioningAgent, LogisticsCoordinator, NetworkOpsEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: ObstructionScan[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/terminals/{id}/install"
    description: "Self-install the terminal; requires a qualifying non-FAIL obstruction scan. Installing a warranty replacement closes the RMA chain and resumes the suspended subscription"
    roles: [Subscriber, ProvisioningAgent]
    code: 200
    input: []
    output: Terminal
    side_effects:
      - "terminal_state {DELIVERED, TRANSFER_PENDING} -> INSTALLED, installed_at = logical_now"
      - "RMA close-out chain: replaced terminal -> REPLACED; its SUSPENDED subscription re-pointed at this terminal and resumed to ACTIVE; beam recompute; cells recompute"

  - method: POST
    path: "/satellite-broadband/terminals/{id}/return"
    description: "Two-stage return: event=INITIATE moves the unit to RETURN_INITIATED, event=RECEIVE completes it and books a damage fee when condition=DAMAGED"
    roles: [LogisticsCoordinator]
    code: 200
    input: [event, "condition?"]
    output: Terminal
    side_effects:
      - "INITIATE: terminal_state {DELIVERED, INSTALLED, RMA_PENDING} -> RETURN_INITIATED"
      - "RECEIVE: RETURN_INITIATED -> RETURNED, return_condition = condition; DAMAGED adds TERMINAL_DAMAGE_FEE_CENTS (15000) to subscriber.pending_charge_cents, GOOD adds nothing"

  - method: POST
    path: "/satellite-broadband/terminals/{id}/warranty-replacement"
    description: "Raise a warranty RMA: the faulty unit goes RMA_PENDING, a replacement unit is created in SHIPPED with replaces_terminal_id set, and the bound subscription is suspended"
    roles: [LogisticsCoordinator]
    code: 201
    input: [replacement_serial_number, replacement_warranty_expires_at]
    output: Terminal
    side_effects:
      - "the RESPONSE is the newly created replacement Terminal (terminal_state=SHIPPED, replaces_terminal_id = the faulty unit)"
      - "faulty terminal_state {DELIVERED, INSTALLED} -> RMA_PENDING"
      - "bound Subscription (service_state IN {PENDING_ACTIVATION, ACTIVE}) -> SUSPENDED with suspension_reason='RMA_IN_FLIGHT'; beam recompute; cells recompute; cell slot retained"

  - method: POST
    path: "/satellite-broadband/terminals/{id}/transfer"
    description: "Transfer custody of an installed terminal to another subscriber; the unit must be re-scanned and re-installed afterwards"
    roles: [ProvisioningAgent]
    code: 200
    input: [new_subscriber_id]
    output: Terminal
    side_effects:
      - "terminal_state INSTALLED -> TRANSFER_PENDING, subscriber_id = new_subscriber_id, ownership_changed_at = logical_now, last_scan_verdict = null"
      - "rejected when any subscription bound to the terminal is still PENDING_ACTIVATION / ACTIVE / SUSPENDED"

  # ----------------------------------------------------------- Subscription
  - method: POST
    path: "/satellite-broadband/subscriptions"
    description: "Activation with account provisioning: consumes a RESERVED order, binds the installed terminal, pins the consumer-disclosure version, and admits against cell slots then beam Mbps (OCC on ServiceCell.version)"
    roles: [ProvisioningAgent]
    code: 201
    input: [service_order_id, terminal_id, expected_service_cell_version]
    output: Subscription
    side_effects:
      - "order RESERVED -> ACTIVATED; subscriber.account_state -> ACTIVE"
      - "service_state=PENDING_ACTIVATION, authorization_state=UNAUTHORIZED, priority_state=PRIORITY, disclosure_ack_state=PENDING_ACK"
      - "disclosure_version_issued pinned from the governing licence; disclosure_ack_deadline_at = now + 14 days; cycle_billing_index = beam.billing_cycle_index"
      - "cell reserved_slot_count -1 / committed_terminal_count +1, availability_state recomputed; increments ServiceCell.version by 1"
      - "beam weighted_sold_mbps / oversubscription_ratio / capacity_state recomputed; increments Beam.version by 1"

  - method: GET
    path: "/satellite-broadband/subscriptions/{id}"
    description: "Read a subscription with all four state dimensions and its usage counters"
    roles: [ProvisioningAgent, NetworkOpsEngineer, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/satellite-broadband/subscriptions"
    description: "List subscriptions, filterable by every foreign key plus the state dimensions"
    roles: [ProvisioningAgent, NetworkOpsEngineer, ComplianceOfficer, Subscriber]
    code: 200
    input: ["subscriber_id?", "service_order_id?", "service_cell_id?", "service_plan_id?", "terminal_id?", "deauthorized_by_license_id?", "service_state?", "authorization_state?", "priority_state?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/subscriptions/{id}/disclosure-acknowledgement"
    description: "Subscriber acknowledges the pinned consumer disclosure version"
    roles: [Subscriber]
    code: 200
    input: [acknowledged_version]
    output: Subscription
    side_effects: ["disclosure_ack_state PENDING_ACK -> ACKNOWLEDGED"]

  - method: POST
    path: "/satellite-broadband/subscriptions/{id}/authorize"
    description: "Grant network authorisation (FIXED or IN_MOTION) after the regulatory gates pass; advances service_state PENDING_ACTIVATION -> ACTIVE"
    roles: [ProvisioningAgent]
    code: 200
    input: [authorization_mode]
    output: Subscription
    side_effects:
      - "authorization_state UNAUTHORIZED -> AUTHORIZED_FIXED | AUTHORIZED_IN_MOTION"
      - "service_state PENDING_ACTIVATION -> ACTIVE"

  - method: POST
    path: "/satellite-broadband/subscriptions/{id}/plan-change"
    description: "Re-assign the service plan (OCC on Beam.version); re-admits against beam headroom and re-evaluates the fair-use threshold"
    roles: [ProvisioningAgent]
    code: 200
    input: [new_service_plan_id, expected_beam_version]
    output: Subscription
    side_effects:
      - "service_plan_id replaced; effective_rate_mbps recomputed"
      - "priority_state re-evaluated against the new plan's priority_data_gb + beam grace (may flip to DEPRIORITIZED immediately)"
      - "beam weighted_sold_mbps / ratio / capacity_state recomputed; increments Beam.version by 1; cells recompute"

  - method: POST
    path: "/satellite-broadband/subscriptions/{id}/suspend"
    description: "Suspend service; the cell slot is retained but the beam Mbps are released"
    roles: [ProvisioningAgent]
    code: 200
    input: [suspend_reason]
    output: Subscription
    side_effects:
      - "service_state {PENDING_ACTIVATION, ACTIVE} -> SUSPENDED"
      - "beam weighted_sold_mbps drops by this subscription's weighted contribution; ratio / capacity_state recomputed; increments Beam.version by 1; cells recompute"
      - "cell.committed_terminal_count unchanged; subscriber.account_state -> SUSPENDED when every non-terminal subscription is SUSPENDED"

  - method: POST
    path: "/satellite-broadband/subscriptions/{id}/terminate"
    description: "Terminate service; frees the cell slot, runs waitlist promotion, releases beam Mbps, initiates the terminal return and revokes roaming"
    roles: [ProvisioningAgent]
    code: 200
    input: [termination_reason]
    output: Subscription
    side_effects:
      - "service_state -> TERMINATED, authorization_state -> DEAUTHORIZED, terminated_at = logical_now"
      - "cell committed_terminal_count -1 -> promotion routine -> promoted order's subscriber WAITLISTED -> PROSPECT; increments ServiceCell.version by 1"
      - "beam recompute; increments Beam.version by 1"
      - "bound terminal INSTALLED -> RETURN_INITIATED; roaming rows in {REQUESTED, NEEDS_INFO, APPROVED} -> REVOKED"
      - "subscriber.account_state -> CLOSED when no non-terminal subscription remains"

  - method: POST
    path: "/satellite-broadband/subscriptions/{id}/usage-records"
    description: "Ingest a metered priority-volume reading; crossing the effective fair-use threshold deprioritises the subscription and cascades into the beam and its cells"
    roles: [NetworkOpsEngineer]
    code: 201
    input: [gb_used, billing_cycle_index]
    output: UsageRecord
    side_effects:
      - "counted = (billing_cycle_index == subscription.cycle_billing_index); counted rows advance cycle_priority_gb_used"
      - "threshold crossing: priority_state PRIORITY -> DEPRIORITIZED, deprioritized_at = now, effective_rate_mbps -> plan.deprioritized_rate_mbps"
      - "cascade: beam weighted_sold_mbps -> ratio -> capacity_state -> every cell's availability_state; increments Beam.version by 1"

  - method: GET
    path: "/satellite-broadband/subscriptions/{id}/usage-records"
    description: "List the metered readings ingested for a subscription in recorded_at ASC order"
    roles: [NetworkOpsEngineer, ProvisioningAgent, ComplianceOfficer, Subscriber]
    code: 200
    input: ["limit?", "offset?"]
    output: UsageRecord[]
    side_effects: []

  # -------------------------------------------------- RoamingAuthorization
  - method: POST
    path: "/satellite-broadband/roaming-authorizations"
    description: "Request portability, temporary roaming or in-motion authorisation for a subscription"
    roles: [Subscriber, ProvisioningAgent]
    code: 201
    input: [subscription_id, mode, target_jurisdiction_code, effective_from, effective_until, "target_service_cell_id?"]
    output: RoamingAuthorization
    side_effects: ["auth_state=REQUESTED, info_round_count=0"]

  - method: GET
    path: "/satellite-broadband/roaming-authorizations/{id}"
    description: "Read a roaming authorisation"
    roles: [Subscriber, ProvisioningAgent, ComplianceOfficer]
    code: 200
    input: []
    output: RoamingAuthorization
    side_effects: []

  - method: GET
    path: "/satellite-broadband/roaming-authorizations"
    description: "List roaming authorisations, filterable by subscription, review state, portability target cell and governing licence"
    roles: [Subscriber, ProvisioningAgent, ComplianceOfficer]
    code: 200
    input: ["subscription_id?", "auth_state?", "mode?", "target_service_cell_id?", "governing_license_id?", "limit?", "offset?"]
    output: RoamingAuthorization[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/roaming-authorizations/{id}/request-info"
    description: "Send the request back for more information (bounded revision cycle, at most 3 rounds)"
    roles: [ComplianceOfficer]
    code: 200
    input: [info_request_note]
    output: RoamingAuthorization
    side_effects: ["auth_state REQUESTED -> NEEDS_INFO, info_round_count += 1"]

  - method: POST
    path: "/satellite-broadband/roaming-authorizations/{id}/resubmit"
    description: "Resubmit a NEEDS_INFO request with a corrected window; re-runs the overlap and cooldown checks"
    roles: [Subscriber, ProvisioningAgent]
    code: 200
    input: [effective_from, effective_until]
    output: RoamingAuthorization
    side_effects: ["auth_state NEEDS_INFO -> REQUESTED, window replaced"]

  - method: POST
    path: "/satellite-broadband/roaming-authorizations/{id}/decide"
    description: "Approve or deny a roaming request; approval selects the governing licence and, for PORTABILITY_MOVE, relocates the subscription and re-runs promotion on the vacated cell"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: RoamingAuthorization
    side_effects:
      - "APPROVE: auth_state -> APPROVED, governing_license_id set; IN_MOTION lifts subscription.authorization_state to AUTHORIZED_IN_MOTION; PORTABILITY_MOVE moves service_cell_id, frees the old cell slot, runs promotion there, consumes a slot on the target cell and recomputes both beams"
      - "DENY: auth_state -> DENIED with no downstream effect"

  # ------------------------------------------------------------ OutageEvent
  - method: POST
    path: "/satellite-broadband/outage-events"
    description: "Open a performance-impairment event on a beam; rejected when it collides with another event of the same cause on that beam under the half-open interval rule"
    roles: [NetworkOpsEngineer]
    code: 201
    input: [beam_id, cause, severity, started_at]
    output: OutageEvent
    side_effects: ["event_state=OPEN, ended_at=null, generated_credit_count=0"]

  - method: GET
    path: "/satellite-broadband/outage-events/{id}"
    description: "Read an outage event"
    roles: [NetworkOpsEngineer, ComplianceOfficer, ProvisioningAgent]
    code: 200
    input: []
    output: OutageEvent
    side_effects: []

  - method: GET
    path: "/satellite-broadband/outage-events"
    description: "List outage events, filterable by beam, state and cause"
    roles: [NetworkOpsEngineer, ComplianceOfficer, ProvisioningAgent]
    code: 200
    input: ["beam_id?", "event_state?", "cause?", "limit?", "offset?"]
    output: OutageEvent[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/outage-events/{id}/resolve"
    description: "Close the event, compute outage_minutes and SLA eligibility, and generate one DRAFT OutageCredit per affected subscription with the provisional amount"
    roles: [NetworkOpsEngineer]
    code: 200
    input: [ended_at]
    output: OutageEvent
    side_effects:
      - "event_state OPEN -> RESOLVED, outage_minutes and credit_eligible computed"
      - "outage_minutes >= SLA_MIN_OUTAGE_MINUTES: one DRAFT OutageCredit per affected subscription in Subscription.created_at ASC order, provisional_credit_cents from the provisional_event_level variant, subscriber.pending_credit_cents increased, generated_credit_count set"
      - "outage_minutes < SLA_MIN_OUTAGE_MINUTES: no credit rows, generated_credit_count = 0"
      - "a PLANNED_MAINTENANCE window past the threshold still drafts rows (0 cents) but leaves credit_eligible false, so submit is refused at validations[priority=37]"

  # ----------------------------------------------------------- OutageCredit
  - method: GET
    path: "/satellite-broadband/outage-credits/{id}"
    description: "Read an outage credit"
    roles: [ProvisioningAgent, ComplianceOfficer, Subscriber]
    code: 200
    input: []
    output: OutageCredit
    side_effects: []

  - method: GET
    path: "/satellite-broadband/outage-credits"
    description: "List outage credits, filterable by subscription, event and review state; the reverse-reachability channel for cascade-created credits"
    roles: [ProvisioningAgent, ComplianceOfficer, Subscriber, NetworkOpsEngineer]
    code: 200
    input: ["subscription_id?", "outage_event_id?", "credit_state?", "limit?", "offset?"]
    output: OutageCredit[]
    side_effects: []

  - method: POST
    path: "/satellite-broadband/outage-credits/{id}/submit"
    description: "Submit a DRAFT credit for compliance review; stamps submitted_by_user_id from X-User-ID"
    roles: [ProvisioningAgent]
    code: 200
    input: []
    output: OutageCredit
    side_effects: ["credit_state DRAFT -> SUBMITTED, submitted_by_user_id = X-User-ID"]

  - method: POST
    path: "/satellite-broadband/outage-credits/{id}/decide"
    description: "Approve or reject a submitted credit. Approval computes the final per-day prorated amount and moves it from the pending ledger to the balance; segregation of duties forbids the submitter from deciding"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_reason?"]
    output: OutageCredit
    side_effects:
      - "APPROVE: final_credit_cents from the final_daily_prorated variant, subscriber.pending_credit_cents -= provisional, credit_balance_cents += final"
      - "REJECT: final_credit_cents stays null, subscriber.pending_credit_cents -= provisional, credit_balance_cents unchanged"

  # ------------------------------------------------------ test-driving clock
  - method: POST
    path: "/satellite-broadband/_clock/set_current_utc"
    description: "Set the logical clock every server timestamp is read from. The clock's startup default is 2026-08-01T00:00:00Z; before the first call it reads exactly that instant and never falls back to real wall-clock time. Moving the clock never runs any sweep by itself"
    roles: [NetworkOpsEngineer, ProvisioningAgent, ComplianceOfficer, LogisticsCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["the logical clock is set; no entity is mutated and no sweep, expiry or promotion runs"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Subscriber caller's X-User-ID is not the Subscriber that owns the target resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, invalid enum member, out-of-range number, bad pagination, effective_until <= effective_from, ended_at <= started_at, obstructed_sample_count > total_sample_count, target_service_cell_id present without mode PORTABILITY_MOVE, or a duplicate license_code / beam_code / cell_code / plan_code / email"
  - id: ERR_SPECTRUM_LICENSE_NOT_FOUND
    http: 404
    condition: "the spectrum licence id in the path or body does not exist"
  - id: ERR_BEAM_NOT_FOUND
    http: 404
    condition: "the beam id in the path or body does not exist"
  - id: ERR_SERVICE_CELL_NOT_FOUND
    http: 404
    condition: "the service cell id in the path or body does not exist"
  - id: ERR_SERVICE_PLAN_NOT_FOUND
    http: 404
    condition: "requested_plan_id or new_service_plan_id does not exist"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "subscriber_id or new_subscriber_id does not exist"
  - id: ERR_SERVICE_ORDER_NOT_FOUND
    http: 404
    condition: "the service order id in the path or body does not exist"
  - id: ERR_TERMINAL_NOT_FOUND
    http: 404
    condition: "the terminal id in the path or body does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "the subscription id in the path or body does not exist"
  - id: ERR_ROAMING_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "the roaming authorisation id in the path does not exist"
  - id: ERR_OUTAGE_EVENT_NOT_FOUND
    http: 404
    condition: "the outage event id in the path does not exist"
  - id: ERR_OUTAGE_CREDIT_NOT_FOUND
    http: 404
    condition: "the outage credit id in the path does not exist"
  - id: ERR_STALE_SERVICE_CELL_VERSION
    http: 412
    condition: "expected_service_cell_version does not equal the ServiceCell's current version"
  - id: ERR_STALE_BEAM_VERSION
    http: 412
    condition: "expected_beam_version does not equal the Beam's current version"
  - id: ERR_LICENSE_STATE_INVALID
    http: 409
    condition: "coordination recorded on a licence that is neither PENDING_COORDINATION nor ACTIVE-and-UNCOORDINATED (and outcome=GRANTED_PROVISIONAL is only legal from PENDING_COORDINATION), SUSPEND on a licence that is not ACTIVE, or REINSTATE on a licence that is not SUSPENDED"
  - id: ERR_TERMINAL_STATE_INVALID
    http: 409
    condition: "the terminal's terminal_state does not permit deliver / install / return / warranty-replacement / transfer / scan"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "cancel on an order that is not RESERVED or WAITLISTED, or activation against an order that is not RESERVED"
  - id: ERR_SUBSCRIPTION_STATE_INVALID
    http: 409
    condition: "the subscription's service_state, authorization_state or disclosure_ack_state does not permit the requested transition"
  - id: ERR_ROAMING_STATE_INVALID
    http: 409
    condition: "request-info on a request that is not REQUESTED, resubmit on one that is not NEEDS_INFO, or decide on one that is not REQUESTED"
  - id: ERR_CREDIT_STATE_INVALID
    http: 409
    condition: "submit on a credit that is not DRAFT, or decide on a credit that is not SUBMITTED"
  - id: ERR_OUTAGE_ALREADY_RESOLVED
    http: 409
    condition: "resolve on an event whose event_state is already RESOLVED"
  - id: ERR_TERMINAL_NOT_INSTALLED
    http: 409
    condition: "activation names a terminal whose terminal_state is not INSTALLED"
  - id: ERR_TERMINAL_SUBSCRIBER_MISMATCH
    http: 422
    condition: "at activation the terminal's subscriber_id differs from the order's subscriber_id, or a transfer targets the current custodian"
  - id: ERR_PORTABILITY_TARGET_INVALID
    http: 422
    condition: "a PORTABILITY_MOVE targets the subscription's current cell, or the request's subscription is TERMINATED at decision time"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID deciding an outage credit equals the X-User-ID that submitted it"
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 422
    condition: "the governing spectrum licence is not ACTIVE at authorisation or roaming approval"
  - id: ERR_SPECTRUM_NOT_COORDINATED
    http: 422
    condition: "the governing spectrum licence's coordination_state is not COORDINATED"
  - id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 422
    condition: "network authorisation attempted while disclosure_ack_state is PENDING_ACK or EXPIRED"
  - id: ERR_DISCLOSURE_VERSION_MISMATCH
    http: 422
    condition: "acknowledged_version differs from the pinned disclosure_version_issued"
  - id: ERR_JURISDICTION_NOT_PERMITTED
    http: 422
    condition: "the subscriber's jurisdiction_code differs from the activating cell's jurisdiction_code, or no ACTIVE+COORDINATED licence exists for a roaming target jurisdiction"
  - id: ERR_IN_MOTION_NOT_PERMITTED
    http: 422
    condition: "in-motion requested while the plan's in_motion_allowed is false or the governing licence's in_motion_permitted is false"
  - id: ERR_ROAMING_NOT_PERMITTED
    http: 422
    condition: "PORTABILITY_MOVE or ROAM_TEMPORARY requested on a plan whose roaming_allowed is false"
  - id: ERR_RESERVATION_EXPIRED
    http: 409
    condition: "activation against a RESERVED order whose reservation_expires_at <= logical now"
  - id: ERR_OUTAGE_WINDOW_OVERLAP
    http: 409
    condition: "a new outage event's started_at falls inside another event of the same cause on the same beam ([started_at, ended_at) for RESOLVED, [started_at, +inf) for OPEN)"
  - id: ERR_ROAMING_WINDOW_CONFLICT
    http: 409
    condition: "the requested window overlaps an APPROVED authorisation's closed window on the same subscription, or starts inside the 24-hour cooldown that follows it"
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "warranty replacement requested at or after the terminal's warranty_expires_at"
  - id: ERR_DUPLICATE_TERMINAL_SERIAL
    http: 409
    condition: "serial_number or replacement_serial_number already exists on another Terminal"
  - id: ERR_OBSTRUCTION_SCAN_REQUIRED
    http: 422
    condition: "install attempted with no ObstructionScan whose scanned_at >= max(terminal.created_at, terminal.ownership_changed_at)"
  - id: ERR_OBSTRUCTION_VERDICT_FAIL
    http: 422
    condition: "install attempted while the qualifying newest scan verdict is FAIL"
  - id: ERR_ROAMING_ROUND_LIMIT
    http: 422
    condition: "a fourth request-info round is opened (info_round_count already equals 3)"
  - id: ERR_CELL_CAPACITY_EXHAUSTED
    http: 409
    condition: "admission_free == 0 on the cell at activation or at PORTABILITY_MOVE approval"
  - id: ERR_WAITLIST_CLOSED
    http: 409
    condition: "an order would be waitlisted but waitlist_depth already equals WAITLIST_CAP_PER_CELL (3)"
  - id: ERR_BEAM_OVERSUBSCRIBED
    http: 409
    condition: "the projected weighted oversubscription ratio would exceed the beam's oversubscription_limit"
  - id: ERR_CREDIT_NOT_ELIGIBLE
    http: 422
    condition: "submit on a credit whose outage event is not credit_eligible"
  - id: ERR_BEAM_SUSPENDED
    http: 409
    condition: "an order, activation, authorisation or roaming approval targets a beam whose beam_state is SUSPENDED"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: ProvisioningAgent
    description: "Sales/provisioning operator: opens accounts and plans, files service orders, activates subscriptions, assigns plans, suspends and terminates service, submits outage credits"
    identity: opaque
    exclusive_operations:
      - "POST /satellite-broadband/service-plans"
      - "POST /satellite-broadband/subscribers"
      - "POST /satellite-broadband/service-orders"
      - "POST /satellite-broadband/subscriptions"
      - "POST /satellite-broadband/subscriptions/{id}/authorize"
      - "POST /satellite-broadband/subscriptions/{id}/plan-change"
      - "POST /satellite-broadband/subscriptions/{id}/suspend"
      - "POST /satellite-broadband/subscriptions/{id}/terminate"
      - "POST /satellite-broadband/terminals/{id}/transfer"
      - "POST /satellite-broadband/outage-credits/{id}/submit"
    shared_operations:
      - "POST /satellite-broadband/terminals/{id}/obstruction-scans (with Subscriber)"
      - "POST /satellite-broadband/terminals/{id}/install (with Subscriber)"
      - "POST /satellite-broadband/service-orders/{id}/cancel (with Subscriber)"
      - "POST /satellite-broadband/roaming-authorizations and /resubmit (with Subscriber)"
      - "POST /satellite-broadband/_clock/set_current_utc (with all operator roles)"
      - "all GET endpoints except the beam list is shared with NetworkOpsEngineer/ComplianceOfficer"

  - name: NetworkOpsEngineer
    description: "Capacity and performance operator: manages beams and cells, writes capacity policy, runs the billing-cycle-close ops run, ingests usage, opens and resolves outage events"
    identity: opaque
    exclusive_operations:
      - "POST /satellite-broadband/beams"
      - "POST /satellite-broadband/beams/{id}/capacity-policy"
      - "POST /satellite-broadband/beams/{id}/billing-cycle-close"
      - "POST /satellite-broadband/service-cells"
      - "POST /satellite-broadband/subscriptions/{id}/usage-records"
      - "POST /satellite-broadband/outage-events"
      - "POST /satellite-broadband/outage-events/{id}/resolve"
    shared_operations:
      - "POST /satellite-broadband/_clock/set_current_utc (with all operator roles)"
      - "GET /satellite-broadband/beams, /service-cells, /subscriptions, /terminals, /service-orders, /outage-events, /outage-credits and their by-id reads"

  - name: ComplianceOfficer
    description: "Regulatory operator: files licences, records spectrum coordination, suspends and reinstates licences, decides roaming authorisations and outage credits"
    identity: opaque
    exclusive_operations:
      - "POST /satellite-broadband/spectrum-licenses"
      - "POST /satellite-broadband/spectrum-licenses/{id}/coordination"
      - "POST /satellite-broadband/spectrum-licenses/{id}/enforcement-action"
      - "POST /satellite-broadband/roaming-authorizations/{id}/request-info"
      - "POST /satellite-broadband/roaming-authorizations/{id}/decide"
      - "POST /satellite-broadband/outage-credits/{id}/decide"
    shared_operations:
      - "POST /satellite-broadband/_clock/set_current_utc (with all operator roles)"
      - "GET reads of licences, beams, cells, subscriptions, roaming authorisations, outage events and credits"
    segregation_of_duties: "May not decide an OutageCredit whose submitted_by_user_id equals this caller's X-User-ID (ERR_SEGREGATION_OF_DUTIES)."

  - name: LogisticsCoordinator
    description: "Hardware operator: ships terminals, marks delivery, handles returns and warranty replacements"
    identity: opaque
    exclusive_operations:
      - "POST /satellite-broadband/terminals"
      - "POST /satellite-broadband/terminals/{id}/deliver"
      - "POST /satellite-broadband/terminals/{id}/return"
      - "POST /satellite-broadband/terminals/{id}/warranty-replacement"
    shared_operations:
      - "POST /satellite-broadband/_clock/set_current_utc (with all operator roles)"
      - "GET /satellite-broadband/terminals, /terminals/{id}, /terminals/{id}/obstruction-scans"

  - name: Subscriber
    description: "End customer acting on their own account: self-installation scans and install, order cancellation, disclosure acknowledgement, roaming requests, own-resource reads"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /satellite-broadband/subscriptions/{id}/disclosure-acknowledgement"
    shared_operations:
      - "POST /satellite-broadband/terminals/{id}/obstruction-scans (with ProvisioningAgent)"
      - "POST /satellite-broadband/terminals/{id}/install (with ProvisioningAgent)"
      - "POST /satellite-broadband/service-orders/{id}/cancel (with ProvisioningAgent)"
      - "POST /satellite-broadband/roaming-authorizations and /resubmit (with ProvisioningAgent)"
      - "GET reads restricted to resources whose subscriber chain equals X-User-ID"
    ownership_rule: "X-User-ID MUST equal the Subscriber.id that owns the target resource; otherwise ERR_NOT_RESOURCE_OWNER (403)."
