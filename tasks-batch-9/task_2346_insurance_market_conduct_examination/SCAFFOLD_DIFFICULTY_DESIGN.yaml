  # =============================================================================
  # RULE 9 - compensating_invariant
  # =============================================================================
  - rule_id: compensating_invariant
    instances:

      - name: abort_restores_the_cycle_examiner_slot_ledger
        grounds:
          - state_machines.MarketAnalysisCycle
          - state_machines.Examination
          - entities.MarketAnalysisCycle.fields.slots_committed
          - entities.MarketAnalysisCycle.fields.slots_available
          - calculations.target_selection
        distinguishing_aspect: |
          The invariant slots_committed + slots_available == target_slot_capacity must hold at EVERY
          observation while two examinations are aborted one at a time, and the compensation is partial:
          selected_target_count stays at 2 forever (history is not rewritten) even though both slots come
          back. The cycle only closes on the second release, so the same ledger write produces a
          different macro outcome depending on what is left outstanding.
        test_recipe:
          setup:
            - "Insurer BOREAL: 50000 policies, 300 complaints, financial_stress_score 80, consumer_trend_score 90, premium 6000000000 -> composite 90.20."
            - "Insurer DELTA: 20000 policies, 100 complaints (ratio 5.00 -> HIGH), financial_stress_score 50, consumer_trend_score 60, premium 2000000000 -> composite 67.00."
            - "One analysis cycle with target_slot_capacity 2 and default fieldwork 2026-09-01 .. 2026-11-30, SCORED then TARGETS_SELECTED -> both carriers selected, two Examinations created, slots_committed 2 / slots_available 0."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Boreal Indemnity Company", naic_code: "10002", annual_premium_written_cents: 6000000000, policy_count_in_force: 50000, confirmed_complaints_12mo: 300, financial_stress_score: 80, consumer_trend_score: 90 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { boreal_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Delta Shield Insurance Company", naic_code: "10004", annual_premium_written_cents: 2000000000, policy_count_in_force: 20000, confirmed_complaints_12mo: 100, financial_stress_score: 50, consumer_trend_score: 60 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { delta_id: "$.data.id" }
            - call: "POST /market-conduct/analysis-cycles"
              payload: { cycle_label: "FY2026 Two Slot Cycle", reference_period_start: "2025-07-01", reference_period_end: "2026-06-30", target_slot_capacity: 2, default_fieldwork_start: "2026-09-01", default_fieldwork_end: "2026-11-30" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { cycle_id: "$.data.id" }
            - call: "POST /market-conduct/analysis-cycles/${cycle_id}/score"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { scored: "$.data.scored_insurer_count" }
            - call: "POST /market-conduct/analysis-cycles/${cycle_id}/select-targets"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { selected: "$.data.selected_target_count", committed0: "$.data.slots_committed", available0: "$.data.slots_available" }
            - call: "GET /market-conduct/examinations"
              payload: { insurer_id: "${boreal_id}" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { boreal_exam_id: "$.data[0].id" }
            - call: "GET /market-conduct/examinations"
              payload: { insurer_id: "${delta_id}" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { delta_exam_id: "$.data[0].id" }
          trigger:
            - call: "POST /market-conduct/examinations/${boreal_exam_id}/abort"
              payload: { abort_reason: "The carrier is in voluntary run-off; the department suspends this examination." }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "GET /market-conduct/analysis-cycles/${cycle_id}"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { committed1: "$.data.slots_committed", available1: "$.data.slots_available", status1: "$.data.status", selected1: "$.data.selected_target_count" }
            - call: "POST /market-conduct/examinations/${delta_exam_id}/abort"
              payload: { abort_reason: "Resource reallocation: the department defers this examination to the next cycle." }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "GET /market-conduct/analysis-cycles/${cycle_id}"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { committed2: "$.data.slots_committed", available2: "$.data.slots_available", status2: "$.data.status", selected2: "$.data.selected_target_count" }
          assert:
            - "At selection: selected_target_count == 2, slots_committed == 2, slots_available == 0; BOREAL ranks 1 with composite 90.20 and DELTA ranks 2 with composite 67.00, both selection_reason SELECTED"
            - "After the first abort: slots_committed == 1, slots_available == 1, status still TARGETS_SELECTED, selected_target_count still 2"
            - "Insurer.${boreal_id}.open_exam_count == 0 while Insurer.${delta_id}.open_exam_count == 1 at that midpoint"
            - "After the second abort: slots_committed == 0, slots_available == 2, status == CLOSED with closed_at set, selected_target_count STILL 2 (the compensation restores capacity, not history)"
            - "slots_committed + slots_available == 2 at all three observation points (invariant never drifts)"
            - "Both examinations have status ABORTED with their abort_reason stored, and neither insurer has any open examination"
            - "The AnalysisScore rows are untouched by the aborts: both still carry selected == true and selection_reason == SELECTED"
            - "A third abort on either examination returns 409 ERR_EXAM_ALREADY_TERMINAL and leaves the ledger at 0 / 2"

      - name: allocation_conserves_every_cent_through_the_remainder_sweep
        grounds:
          - calculations.multistate_restitution_allocation
          - calculations.lead_state_selection
          - state_machines.MultistateCollaboration
          - validations[priority 40 ERR_ENFORCEMENT_RECORD_STATE_INVALID]
        distinguishing_aspect: |
          The conserved quantity is money split across states that cannot be split evenly: 50333 cents
          over three equal-weight participants floors to 16777 each and leaves a 2-cent remainder that
          the deterministic sweep (policy_count DESC, then state_code ASC) must hand to AZ and NV, not to
          NV first - the same ordering rule that made AZ the lead state. Re-running the allocation is
          refused so the invariant cannot be double-applied.
        test_recipe:
          setup:
            - "AURORA carrier; ON_SITE examination 2026-09-01 .. 2026-11-30, CLAIMS area population 4000 / sample 10, harm 25000 / 18000 / 7333 -> tolerance_breached true."
            - "A multistate collaboration was created during fieldwork with three EQUAL-weight participants: NV 1 policy (examiner resources true), AZ 1 policy (true), UT 1 policy (false) -> lead_state_code AZ by the state_code tie-break; it reached ACTIVE when the examination entered CRITICISM."
            - "One MINOR criticism on the breached area -> SAMPLE_ACTUAL exposure 50333, SUSTAINED with penalty_units 3 -> aggregate_restitution_cents 50333, examination NEGOTIATION."
            - "An approved corrective action plan moved the examination to ORDER_PENDING; a PER_VIOLATION consent order was drafted and EXECUTED by the carrier."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
