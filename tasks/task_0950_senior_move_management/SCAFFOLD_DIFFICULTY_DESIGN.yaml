      - name: designate_round_trip_conserves_inventory_volume
        grounds:
          - invariants[INV_INVENTORY_VOLUME_CONSERVATION]
          - state_machines.InventoryItem.disposition.KEEP_to_DONATE
          - state_machines.InventoryItem.disposition.DONATE_to_KEEP
          - calculations.room_load_and_headroom
          - entities.Engagement.fields.total_inventory_volume_cft
        distinguishing_aspect: |
          A third conserved quantity, VOLUME: Engagement.total_inventory_volume_cft
          stays at exactly 75.00 across the whole round trip while keep_volume_cft
          drops from 75.00 to 35.00 and returns to 75.00, and the room's
          keep_load_linear_inches returns to exactly 186.00 with headroom 6.00.
        test_recipe:
          setup:
            - "A LIVING room in a PROVISIONAL residence with capacity 192.00 linear inches."
            - "Two KEEP items of 96 and 90 linear inches and 40 and 35 cubic feet assigned to it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142", email: "ada@example.com" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /destination-residences"
              payload: { engagement_id: "${eng}", name: "Maple Grove 12B", unit_type: "APARTMENT", address_line: "12B Maple Grove Way" }
              as: MOVE_MANAGER
              captures: { res: "$.data.id" }
            - call: "POST /destination-rooms"
              payload: { destination_residence_id: "${res}", room_type: "LIVING", nominal_linear_inches: 240, nominal_volume_cft: 400 }
              as: MOVE_MANAGER
              captures: { room: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Walnut sideboard", category: "FURNITURE", footprint_linear_inches: 96, volume_cft: 40 }
              as: MOVE_MANAGER
              captures: { it1: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Reading chair", category: "FURNITURE", footprint_linear_inches: 90, volume_cft: 35 }
              as: MOVE_MANAGER
              captures: { it2: "$.data.id" }
            - call: "POST /inventory-items/${it1}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
            - call: "POST /inventory-items/${it2}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /inventory-items/${it1}/designate"
              payload: { disposition: "DONATE" }
              as: MOVE_MANAGER
            - call: "POST /inventory-items/${it1}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
          assert:
            - "after the first trigger call, Engagement.${eng}.keep_volume_cft == 35.00 and total_inventory_volume_cft == 75.00"
            - "after the first trigger call, DestinationRoom.${room}.keep_load_linear_inches == 90.00 and headroom_linear_inches == 102.00"
            - "after the first trigger call, InventoryItem.${it1}.assigned_room_id == null"
            - "Engagement.${eng}.total_inventory_volume_cft == 75.00"
            - "Engagement.${eng}.keep_volume_cft == 75.00"
            - "Engagement.${eng}.haul_volume_cft == 0.00"
            - "DestinationRoom.${room}.keep_load_linear_inches == 186.00"
            - "DestinationRoom.${room}.headroom_linear_inches == 6.00"
            - "InventoryItem.${it1}.disposition == KEEP"
            - "InventoryItem.${it1}.redesignation_count == 2"
            - "InventoryItem.${it1}.donation_receipt_cents == 0"

      - name: settled_lot_returned_then_hauled_conserves_credits_while_adding_a_disposal_fee
        grounds:
          - invariants[INV_CONSIGNMENT_CREDIT_CONSERVATION]
          - state_machines.ConsignmentLot.status.SETTLED_to_RETURNED
          - state_machines.ConsignmentLot.status.RETURNED_to_HAULED
          - calculations.disposal_fee
          - calculations.invoice_subtotal
          - entities.Engagement.fields.consignment_credit_cents
        distinguishing_aspect: |
          A fourth conserved quantity reading of the same ledger, and the only instance
          that runs the compensating action's OWN successor leg: after settle and return
          the conserved Invoice.credits_cents is exactly 0 and Engagement
          consignment_credit_cents is exactly 0, yet hauling the returned lot away adds a
          DISPOSAL_FEE of 9500 to subtotal_cents, so the money chain is non-monotone and
          the round trip is provably NOT free even though the conserved quantity
          returned to its starting value.
        test_recipe:
          setup:
            - "An engagement whose invoice is DRAFT with no lines, and three SELL items of 6, 8 and 3 cubic feet consigned as one lot to a CONSIGNMENT vendor."
            - "The lot sold for 250000 gross, so commission_cents is 100000, fees_cents 11100 and net_proceeds_cents 138900."
            - "The lot's 17 cubic feet price out at 2465 by rate, which is below DISPOSAL_MIN_FEE_CENTS, so the disposal floor of 9500 governs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142", email: "ada@example.com" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /vendors"
              payload: { name: "Hollis Estate Gallery", vendor_type: "CONSIGNMENT", coi_expires_on: "2027-01-31", daily_capacity: 3, holdback_pct: 0.10 }
              as: PLATFORM_ADMIN
              captures: { vend: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Silver tea service", category: "MISC", footprint_linear_inches: 24, volume_cft: 6, appraised_value_cents: 90000, appraisal_source: "APPRAISED" }
              as: MOVE_MANAGER
              captures: { s1: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Oil landscape", category: "ARTWORK", footprint_linear_inches: 40, volume_cft: 8, appraised_value_cents: 120000, appraisal_source: "APPRAISED" }
              as: MOVE_MANAGER
              captures: { s2: "$.data.id" }
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Mantel clock", category: "MISC", footprint_linear_inches: 12, volume_cft: 3, appraised_value_cents: 45000, appraisal_source: "APPRAISED" }
              as: MOVE_MANAGER
              captures: { s3: "$.data.id" }
            - call: "POST /inventory-items/${s1}/designate"
              payload: { disposition: "SELL" }
              as: MOVE_MANAGER
            - call: "POST /inventory-items/${s2}/designate"
              payload: { disposition: "SELL" }
              as: MOVE_MANAGER
            - call: "POST /inventory-items/${s3}/designate"
              payload: { disposition: "SELL" }
              as: MOVE_MANAGER
            - call: "POST /consignment-lots"
              payload:
                engagement_id: "${eng}"
                vendor_id: "${vend}"
                list_price_cents: 240000
                listed_on: "2026-05-05"
                item_ids: ["${s1}", "${s2}", "${s3}"]
              as: MOVE_MANAGER
              captures: { lot: "$.data.id" }
            - call: "POST /consignment-lots/${lot}/record-sale"
              payload: { gross_sale_price_cents: 250000, sold_on: "2026-05-20" }
              as: MOVE_MANAGER
            - call: "GET /invoices"
              payload: { engagement_id: "${eng}" }
              as: BILLING_ADMIN
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /consignment-lots/${lot}/settle"
              payload: {}
              as: BILLING_ADMIN
            - call: "POST /consignment-lots/${lot}/return-to-client"
              payload: { reason: "Buyer rescinded, the gallery returned the lot" }
              as: MOVE_MANAGER
            - call: "POST /consignment-lots/${lot}/haul-away"
              payload: {}
              as: MOVE_MANAGER
          assert:
            - "after the first trigger call, Invoice.${inv}.credits_cents == -138900, subtotal_cents == 0 and total_cents == -138900"
            - "after the second trigger call, Invoice.${inv}.credits_cents == 0 and total_cents == 0, so the conserved quantity is back at its pre-settle value"
            - "after the second trigger call, ConsignmentLot.${lot}.status == RETURNED, credited == true and reversed == true"
            - "ConsignmentLot.${lot}.status == HAULED"
            - "ConsignmentLot.${lot}.disposal_fee_cents == 9500"
            - "exactly one InvoiceLine on Invoice.${inv} has line_type DISPOSAL_FEE with amount_cents == 9500"
            - "exactly one InvoiceLine on Invoice.${inv} has line_type CONSIGNMENT_CREDIT with amount_cents == -138900 and exactly one has line_type CONSIGNMENT_REVERSAL with amount_cents == 138900"
            - "Invoice.${inv}.credits_cents == 0"
            - "Engagement.${eng}.consignment_credit_cents == 0"
            - "Invoice.${inv}.subtotal_cents == 9500 and total_cents == 9500, so the conserved credit bucket is unchanged while the charge bucket grew by the disposal fee"
            - "Engagement.${eng}.total_inventory_volume_cft == 17.00"
