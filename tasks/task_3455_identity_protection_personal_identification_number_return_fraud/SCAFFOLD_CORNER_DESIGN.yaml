            - { call: "PUT /identity-protection/taxpayers/${tp}", payload: { expected_taxpayer_version: "${v1}", full_name: "Occ Stale" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured v2 == 2 (first write succeeded and bumped version)"
            - "captured err == ERR_STALE_VERSION (412) on the replayed stale version"
      - name: occ_stale_version_pin_reissue_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[pin-reissue-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /protection-pins with expected_taxpayer_version one behind the current version is rejected 412 ERR_STALE_VERSION; no pin is created and the ACTIVE pin is untouched."
        test_recipe:
          setup: ["Clock 2027-01-25; taxpayer ENROLLED for 2026 (version advanced to 2 by opt-in)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/taxpayers", payload: { tin: "100000171", full_name: "Occ Pin", date_of_birth: "1980-01-01" }, as: SystemAdmin, captures: { tp: $.data.id } }
            - { call: "POST /identity-protection/taxpayers/${tp}/ip-pin-opt-in", payload: { tax_year: 2026 }, as: Taxpayer, as_user_id: "${tp}", captures: { vOptin: $.data.version } }
          trigger:
            - { call: "POST /identity-protection/protection-pins", payload: { taxpayer_id: "${tp}", tax_year: 2026, expected_taxpayer_version: "${vOptin} - 1" }, as: SystemAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /identity-protection/taxpayers/${tp}/protection-pins", payload: {}, as: SystemAdmin, captures: { pins: $.data } }
          assert:
            - "captured err == ERR_STALE_VERSION (412)"
            - "exactly one pin exists, still ACTIVE with its original value (no supersession happened)"
