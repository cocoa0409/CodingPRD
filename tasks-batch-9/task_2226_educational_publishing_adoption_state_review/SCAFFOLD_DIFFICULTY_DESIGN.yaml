      - name: coverage_rounds_to_exact_minimum_while_lower_claim_is_rejected
        grounds:
          - calculations.correlation_coverage
          - validations[priority=53]
          - entities.Submission.fields.self_reported_coverage_pct
          - endpoints[POST /submissions/{id}/file]
        distinguishing_aspect: |
          Metric: the 2-decimal weighted coverage percentage against min_verified_coverage_pct 42.86
          on POST /submissions/{id}/file - a MASTERY citation on the weight-3 standard of a
          denominator of 7 yields 100*3/7 = 42.857142... which must round_half_up to exactly 42.86
          and pass the inclusive gate, while a MENTION citation yields 17.14 and is rejected.
