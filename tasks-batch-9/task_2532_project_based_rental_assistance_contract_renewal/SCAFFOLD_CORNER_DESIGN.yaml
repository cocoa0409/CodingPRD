            - call: "POST /pbra/comparables"
              payload: { study_id: "${s2}", address_label: "88 Alder Court", raw_rent_cents: 128649, adjustment_total_cents: 55, utility_adjustment_cents: 1500, weight: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies/${s2}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies/${s2}/decide"
              payload: { decision: "ACCEPT" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${c3}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case3: $.data.id }
            - call: "POST /pbra/renewal-cases/${case3}/select-option"
              payload: { renewal_option: "OPTION_3_MARK_TO_MARKET" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/renewal-cases/${case3}/elect-adjustment"
              payload: { adjustment_method: "OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "${case3}", appraiser_name: "Hollis Appraisal Group" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { s3: $.data.id }
            - call: "POST /pbra/comparables"
              payload: { study_id: "${s3}", address_label: "88 Alder Court", raw_rent_cents: 128649, adjustment_total_cents: 55, utility_adjustment_cents: 1500, weight: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies/${s3}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
