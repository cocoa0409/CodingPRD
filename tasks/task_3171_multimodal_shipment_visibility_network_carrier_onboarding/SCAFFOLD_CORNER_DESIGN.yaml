      - name: error_shipment_not_found_on_nested_events
        claim_type: violation_to_error
        grounds: [errors.ERR_SHIPMENT_NOT_FOUND]
        distinguishing_aspect: "Existence is validated left-to-right on nested paths: posting an event under a nonexistent shipment id yields 404 ERR_SHIPMENT_NOT_FOUND before any connection-state check runs."
        test_recipe:
          setup: ["Logical clock set; nothing else."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shipments/99999999-8888-4777-8666-555555555555/events"
              payload: { event_time: "2026-09-01T06:00:00Z", event_type: "DEPARTED" }
              as: CarrierRep
              as_user_id: "11111111-2222-4333-8444-555555555555"
              captures: { r1_err: $.data.error_id }
          assert:
            - "response status 404 with error_id ERR_SHIPMENT_NOT_FOUND"

      - name: error_connection_invalid_state_covered_by_difficulty
        claim_type: violation_to_error
        grounds: [errors.ERR_CONNECTION_INVALID_STATE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / connection_testing_timeout_cycle_back_to_draft
          rationale: "State-gate rejection paths (activate/resume/retire) are exercised by the cyclic connection instance and the resume remediation corner."

      - name: error_stale_version_covered_by_difficulty
        claim_type: violation_to_error
        grounds: [errors.ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / window_overlap_beats_stale_facility_version
          rationale: "OCC staleness on the facility path is exercised there; the PO-path staleness is exercised by the optimistic_concurrency corner instance identity_link_create_with_stale_po_version."

