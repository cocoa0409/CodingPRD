      - name: variance_tolerance_exclusive_at_0_0200_and_disputes_at_0_0201
        grounds:
          - calculations.invoice_verified_amount
          - state_machines.TuitionInvoice.SUBMITTED_to_VERIFIED
          - state_machines.TuitionInvoice.SUBMITTED_to_DISPUTED
          - entities.TuitionInvoice.fields.variance_pct
        distinguishing_aspect: |
          variance_pct is round_half_up to 4 decimals FIRST and only then compared with
          VARIANCE_TOLERANCE_PCT 0.02 using a strict >. Three invoices over the same verified
          amount 767182 sit on both sides of that hair: submitted 782526 has a RAW ratio of
          0.0200004692... (above 0.02) yet rounds to 0.0200 and must VERIFY; 782563 is the last
          value that still rounds to 0.0200; 782564 is the first that rounds to 0.0201 and must
          DISPUTE. An implementation comparing the unrounded ratio disputes the first two, and
          one using >= disputes all three.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, advanced to 2026-09-01T08:00:00Z, then 2026-09-29 / 2026-10-27 / 2026-11-24 for the three cycles."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000; Harbor Academy rate schedule day 32000 / residential 51500 / service_hour 11000."
            - "One ACTIVE DAY Placement with 180 contracted instructional days and two ACTIVE addenda: A1 SPEECH 2.0 h/week x 36 weeks, A2 OT 1.5 h/week x 36 weeks."
            - "Three VERIFIED AttendanceRecords over consecutive 28-day cycles, each with days_enrolled 20, days_attended 16, days_absent_unexcused 4, residential_nights 0 and service lines 7.5 h on A1 plus 5.5 h on A2. Under basis ATTENDANCE each verifies at 767182 cents."
