# =============================================================================
# Task 3205 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Two instances per §0.5 rule, each grounded in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: cancel_refund_floor_variant_on_paid_sub
        grounds:
          - calculations.cancellation_refund
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - entities.Subscription.fields.current_term_price_cents
        distinguishing_aspect: |
          Entity domain: Subscription billing. cancellation_refund pins the FLOOR
          variant (floor unused days, floor money division) over the documented
          ceil-days alternative; the two readings diverge whenever elapsed time is
          not a whole number of days.
        test_recipe:
          setup:
            - "clock at 2026-09-01T00:00:00Z; customer C1; GEN2 radio R1 on vehicle V1 (NEW); paid plan P (6000 cents, 30 days, auto_renew_default false)"
            - "paid subscription S created 2026-09-01T00:00:00Z on R1; ACTIVATE signal dispatched and ACKED so S is ACTIVE; disclosure sent (SENT) so disclosure gate passes even though auto_renew false is not gated — sent anyway to isolate the refund assertion"
            - "clock advanced to 2026-09-11T00:00:00Z (exactly 10 days elapsed, 20 unused)"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "c1@x.com", full_name: "C One", household_size: 1 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "SEL", name: "Select", channel_entitlements: ["CH1", "CH2"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PAID30", name: "Paid Monthly", package_tier_id: "${tier_id}", service_mode: "IN_VEHICLE", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 6000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMA", name: "OEM A", feed_contact_email: "f@a.com" }
              as: PlatformAdmin
              captures: { oem_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "1HGCM82633A004352", automaker_id: "${oem_id}", model_year: 2024, owner_customer_id: "${cust_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESN0001", vehicle_id: "${veh_id}", hardware_generation: "GEN2" }
              as: PlatformAdmin
              captures: { radio_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", radio_id: "${radio_id}", auto_renew: false }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /api/v1/radios/${radio_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sig_id: "$.data[0].id" }
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sig_id}/ack"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/subscriptions/${sub_id}/cancel"
              payload: { effective_mode: "IMMEDIATE" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "GET /api/v1/subscriptions/${sub_id}/ledger contains PRORATION_CREDIT with amount_cents == -4000 (floor(6000*20/30)); the ceil-days variant would give -4200 and MUST be rejected"

      - name: transfer_proration_variant_vs_cancel_refund_on_vehicle_transfer
        grounds:
          - calculations.transfer_proration
          - calculations.cancellation_refund
          - state_machines.Subscription.ACTIVE_to_TRANSFERRED_AWAY
          - entities.BillingLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Entity domain: Vehicle ownership transfer ledger — different domain from
          instance 1 (Subscription cancellation billing). transfer_proration posts
          TRANSFER_ADJUSTMENT (not PRORATION_CREDIT) and additionally creates a
          fresh PENDING_ACTIVATION trial for the new owner in the same request;
          an implementation reusing cancellation_refund verbatim fails the
          entry_type assertion.
        test_recipe:
          setup:
            - "clock 2026-09-01T00:00:00Z; customers OLD (household 1) and NEWC; vehicle V2 (USED) with GEN1 radio R2; paid plan P9 (9000 cents, 30 days, auto_renew false); trial plan TP (is_trial true, 90 days, 0 cents)"
            - "paid sub S9 ACTIVE on R2 since 2026-09-01; clock advanced to 2026-09-11T00:00:00Z (10 elapsed, 20 unused)"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "old@x.com", full_name: "Old Owner", household_size: 1 }
              as: Anonymous
              captures: { old_cust: $.data.id }
            - call: "POST /api/v1/customers"
              payload: { email: "new@x.com", full_name: "New Owner", household_size: 1 }
              as: Anonymous
              captures: { new_cust: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "SEL2", name: "Select2", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tier2_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "PAID9K", name: "Paid 9000", package_tier_id: "${tier2_id}", service_mode: "IN_VEHICLE", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 9000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { plan9_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TRIAL90", name: "Trial 90", package_tier_id: "${tier2_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 90, price_cents: 0 }
              as: PlatformAdmin
              captures: { tplan_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMB", name: "OEM B", feed_contact_email: "f@b.com" }
              as: PlatformAdmin
              captures: { oem2_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "2HGCM82633A004353", automaker_id: "${oem2_id}", model_year: 2020, owner_customer_id: "${old_cust}", condition: "USED" }
              as: PlatformAdmin
              captures: { veh2_id: $.data.id, veh2_v: $.data.version }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESN0002", vehicle_id: "${veh2_id}", hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { radio2_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${old_cust}", plan_id: "${plan9_id}", radio_id: "${radio2_id}", auto_renew: false }
              as: Customer
              as_user_id: "${old_cust}"
              captures: { sub9_id: $.data.id }
            - call: "GET /api/v1/radios/${radio2_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sig2_id: "$.data[0].id" }
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sig2_id}/ack"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/v1/vehicles/${veh2_id}"
              as: PlatformAdmin
              captures: { veh2_v2: $.data.version }
          trigger:
            - call: "POST /api/v1/vehicles/${veh2_id}/transfer_ownership"
              payload: { new_owner_customer_id: "${new_cust}", expected_vehicle_version: "${veh2_v2}", trial_plan_id: "${tplan_id}" }
              as: PlatformAdmin
          assert:
            - "Subscription.${sub9_id}.status == TRANSFERRED_AWAY"
            - "ledger of ${sub9_id} contains TRANSFER_ADJUSTMENT amount_cents == -6000 (floor(9000*20/30)) and NOT entry_type PRORATION_CREDIT"
            - "GET /api/v1/radios/${radio2_id}/api/v1/subscriptions includes a new PENDING_ACTIVATION TRIAL subscription with customer_id == ${new_cust} and origin == TRANSFER_IN"
            - "Vehicle.${veh2_id}.owner_customer_id == ${new_cust}"

  - rule_id: combinatorial_formula
    instances:
      - name: term_pricing_offer_then_family_order_pinned
        grounds:
          - calculations.term_pricing
          - calculations.family_discount
          - entities.Customer.fields.household_size
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: family anchor selection depends on
          base plan prices while each sub's term price depends on family
          eligibility; the scaffold pins evaluation order (base -> offer pct ->
          flat -> family) and both rounding directions (floor pct, ceil family),
          so exactly one result (3600) is correct.
        test_recipe:
          setup:
            - "customer C2 household_size 2; tier; paid plan P6 (6000 cents, 30d, auto_renew false); streaming plan P8 (8000 cents, STREAMING_ONLY)"
            - "GEN2 radio R3 for C2; POST_TRIAL campaign CAMP ACTIVE [2026-08-01, 2026-12-01] with step S0 (plan P6, step_up_rank 0, discount_pct_bps 2000, flat 0)"
            - "C2 first buys streaming P8 (becomes anchor, 8000 > 6000); then redeems S0 for radio R3"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "c2@x.com", full_name: "C Two", household_size: 2 }
              as: Anonymous
              captures: { c2_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TS", name: "TierS", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierS_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "P6K", name: "P6000", package_tier_id: "${tierS_id}", service_mode: "IN_VEHICLE", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 6000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { p6_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "P8KS", name: "P8000 streaming", package_tier_id: "${tierS_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 8000, auto_renew_default: false }
              as: PlatformAdmin
              captures: { p8_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMC", name: "OEM C", feed_contact_email: "f@c.com" }
              as: PlatformAdmin
              captures: { oem3_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "3HGCM82633A004354", automaker_id: "${oem3_id}", model_year: 2025, owner_customer_id: "${c2_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { veh3_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESN0003", vehicle_id: "${veh3_id}", hardware_generation: "GEN2" }
              as: PlatformAdmin
              captures: { radio3_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns"
              payload: { code: "CONV1", name: "Conv", lifecycle_phase: "POST_TRIAL", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${camp_id}/steps"
              payload: { step_index: 0, plan_id: "${p6_id}", step_up_rank: 0, discount_pct_bps: 2000, flat_discount_cents: 0 }
              as: PlatformAdmin
              captures: { step0_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${camp_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${c2_id}", plan_id: "${p8_id}", auto_renew: false }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { sub8_id: $.data.id }
          trigger:
            - call: "POST /api/v1/offer-campaigns/${camp_id}/redeem"
              payload: { offer_step_id: "${step0_id}", customer_id: "${c2_id}", radio_id: "${radio3_id}" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { red_id: $.data.id, red_sub_id: $.data.subscription_id }
          assert:
            - "OfferRedemption.${red_id}.redeemed_price_cents == 3600 (floor(6000*2000/10000)=1200 off -> 4800; family ceil(4800*2500/10000)=1200 -> 3600)"
            - "Subscription.${red_sub_id}.current_term_price_cents == 3600"
            - "Subscription.${sub8_id}.is_primary_for_discount == true (8000-base anchor beats 6000-base)"

      - name: offer_step_pricing_per_step_rounding_before_flat
        grounds:
          - calculations.offer_step_pricing
        distinguishing_aspect: |
          Mode (b) nested rounding: pct discount is floored PER STEP before the
          flat discount is subtracted; sum-then-round or flat-before-pct orders
          give different cents and are forbidden. Distinct mode from instance 1
          (mode c).
        test_recipe:
          setup:
            - "customer C3 household 1 (no family discount to isolate step rounding); paid plan P7 price 5999 cents, 30d; POST_TRIAL campaign ACTIVE with step (pct 3333 bps, flat 1000)"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "c3@x.com", full_name: "C Three", household_size: 1 }
              as: Anonymous
              captures: { c3_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TT", name: "TierT", channel_entitlements: ["CH1"], includes_streaming: true, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierT_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "P5999", name: "P5999", package_tier_id: "${tierT_id}", service_mode: "STREAMING_ONLY", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 5999, auto_renew_default: false }
              as: PlatformAdmin
              captures: { p7_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns"
              payload: { code: "CONV2", name: "Conv2", lifecycle_phase: "POST_TRIAL", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { camp2_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${camp2_id}/steps"
              payload: { step_index: 0, plan_id: "${p7_id}", step_up_rank: 0, discount_pct_bps: 3333, flat_discount_cents: 1000 }
              as: PlatformAdmin
              captures: { stepB_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${camp2_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/offer-campaigns/${camp2_id}/redeem"
              payload: { offer_step_id: "${stepB_id}", customer_id: "${c3_id}" }
              as: Customer
              as_user_id: "${c3_id}"
              captures: { red2_id: $.data.id }
          assert:
            - "OfferRedemption.${red2_id}.redeemed_price_cents == 3000 (floor(5999*3333/10000)=1999; 5999-1999-1000=3000); flat-before-pct would give 3332 and round-half-up pct would give 2999 — both forbidden"

  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_save_offer_cycle_reverts_cancel
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCEL_SCHEDULED
          - state_machines.Subscription.CANCEL_SCHEDULED_to_ACTIVE
          - entities.Subscription.fields.save_offers_used_in_term
        distinguishing_aspect: |
          Entity: Subscription — cyclic edge CANCEL_SCHEDULED -> ACTIVE via
          save-offer accept restores auto_renew, nulls cancel_requested_at, flips
          kind to SAVE_OFFER, and increments the per-term save counter.
        test_recipe:
          setup:
            - "customer C4 household 1; GEN2 radio R4; paid plan P4 (4000 cents, 30d, auto_renew true); SAVE campaign SCAMP ACTIVE with save step (plan P4, rank 0, pct 5000 bps)"
            - "paid sub S4 ACTIVE (signal ACKED) with auto_renew true; RENEWAL-not-yet-needed; cancel requested END_OF_TERM so S4 is CANCEL_SCHEDULED"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "c4@x.com", full_name: "C Four", household_size: 1 }
              as: Anonymous
              captures: { c4_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TU", name: "TierU", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierU_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "P4K", name: "P4000", package_tier_id: "${tierU_id}", service_mode: "IN_VEHICLE", is_trial: false, term_kind: "MONTHLY", term_length_days: 30, price_cents: 4000, auto_renew_default: true }
              as: PlatformAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEMD", name: "OEM D", feed_contact_email: "f@d.com" }
              as: PlatformAdmin
              captures: { oem4_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "4HGCM82633A004355", automaker_id: "${oem4_id}", model_year: 2025, owner_customer_id: "${c4_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { veh4_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESN0004", vehicle_id: "${veh4_id}", hardware_generation: "GEN2" }
              as: PlatformAdmin
              captures: { radio4_id: $.data.id }
            - call: "POST /api/v1/subscriptions"
              payload: { customer_id: "${c4_id}", plan_id: "${p4_id}", radio_id: "${radio4_id}" }
              as: Customer
              as_user_id: "${c4_id}"
              captures: { sub4_id: $.data.id }
            - call: "GET /api/v1/radios/${radio4_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sig4_id: "$.data[0].id" }
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sig4_id}/ack"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/subscriptions/${sub4_id}/cancel"
              payload: { effective_mode: "END_OF_TERM" }
              as: Customer
              as_user_id: "${c4_id}"
            - call: "POST /api/v1/offer-campaigns"
              payload: { code: "SAVE1", name: "Save", lifecycle_phase: "SAVE", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { scamp_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${scamp_id}/steps"
              payload: { step_index: 0, plan_id: "${p4_id}", step_up_rank: 0, discount_pct_bps: 5000, flat_discount_cents: 0 }
              as: PlatformAdmin
              captures: { sstep_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${scamp_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/subscriptions/${sub4_id}/save-offers/accept"
              payload: { offer_step_id: "${sstep_id}" }
              as: Customer
              as_user_id: "${c4_id}"
          assert:
            - "Subscription.${sub4_id}.status == ACTIVE"
            - "Subscription.${sub4_id}.kind == SAVE_OFFER"
            - "Subscription.${sub4_id}.cancel_requested_at == null"
            - "Subscription.${sub4_id}.auto_renew == true"
            - "Subscription.${sub4_id}.save_offers_used_in_term == 1"
            - "Subscription.${sub4_id}.current_term_price_cents == 2000 (next-term save rate: 4000 - floor(4000*5000/10000))"
            - "ledger of ${sub4_id} contains SAVE_CREDIT entry"
            - "Subscription.${sub4_id}.disclosure_state == REQUIRED"

      - name: signal_command_retry_cycle_exhausts_at_three
        grounds:
          - state_machines.SignalCommand.SENT_to_FAILED
          - state_machines.SignalCommand.FAILED_to_QUEUED
          - state_machines.SignalCommand.FAILED_to_EXHAUSTED
        distinguishing_aspect: |
          Entity: SignalCommand — cyclic SENT -> FAILED -> QUEUED retry loop with
          linear backoff terminating at EXHAUSTED exactly when attempt_count hits
          3; different entity from instance 1 (Subscription).
        test_recipe:
          setup:
            - "customer C5; GEN2 radio R5; trial plan TP5; trial sub provisioned -> ACTIVATE signal queued"
          setup_api_calls:
            - call: "POST /api/v1/customers"
              payload: { email: "c5@x.com", full_name: "C Five", household_size: 1 }
              as: Anonymous
              captures: { c5_id: $.data.id }
            - call: "POST /api/v1/package-tiers"
              payload: { code: "TV", name: "TierV", channel_entitlements: ["CH1"], includes_streaming: false, min_hardware_generation: "GEN1" }
              as: PlatformAdmin
              captures: { tierV_id: $.data.id }
            - call: "POST /api/v1/subscription-plans"
              payload: { code: "TP5", name: "Trial5", package_tier_id: "${tierV_id}", service_mode: "IN_VEHICLE", is_trial: true, term_kind: "TRIAL", term_length_days: 90, price_cents: 0 }
              as: PlatformAdmin
              captures: { tp5_id: $.data.id }
            - call: "POST /api/v1/automakers"
              payload: { oem_code: "OEME", name: "OEM E", feed_contact_email: "f@e.com" }
              as: PlatformAdmin
              captures: { oem5_id: $.data.id }
            - call: "POST /api/v1/vehicles"
              payload: { vin: "5HGCM82633A004356", automaker_id: "${oem5_id}", model_year: 2025, owner_customer_id: "${c5_id}", condition: "NEW" }
              as: PlatformAdmin
              captures: { veh5_id: $.data.id }
            - call: "POST /api/v1/radios"
              payload: { esn: "ESN0005", vehicle_id: "${veh5_id}", hardware_generation: "GEN2" }
              as: PlatformAdmin
              captures: { radio5_id: $.data.id, radio5_v: $.data.version }
            - call: "POST /api/v1/radios/${radio5_id}/trials"
              payload: { plan_id: "${tp5_id}", customer_id: "${c5_id}", expected_radio_version: "${radio5_v}" }
              as: Customer
              as_user_id: "${c5_id}"
              captures: { sub5_id: $.data.id }
            - call: "GET /api/v1/radios/${radio5_id}/api/v1/signal-commands"
              as: SystemOperator
              captures: { sig5_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/_signals/dispatch"
              payload: {}
              as: SystemOperator
            - call: "POST /api/v1/signal-commands/${sig5_id}/fail"
              payload: {}
              as: SystemOperator
