            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_a: $.data.id, notice_a_status: $.data.status }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r2 stale", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { err_stale: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r2 stale", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { notice_b: $.data.id, notice_b_status: $.data.status }
            - call: "GET /online-services/${svc_id}/parental-notices"
              payload: { limit: 100, offset: 0 }
              as: ComplianceOfficer
              captures: { notice_total: $.meta.total_count }
          assert:
            - "${v_create} == 1, ${v_after_det} == 3 and ${sv1} == 3 (creation, evidence, determination)"
            - "${notice_a_status} == DRAFT (the first create consumed token 3)"
            - "${err_stale} == ERR_STALE_SERVICE_VERSION with HTTP 412 — the client's own successful create invalidated its token"
            - "${sv2} == 4: exactly one increment from the accepted create, none from the refused one"
            - "${notice_b_status} == DRAFT — the identical body succeeds once the token is refreshed"
            - "${notice_total} == 2, so the refused attempt left no ParentalNotice row"

      - name: consent_create_against_a_stale_service_version_is_refused_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consent-create-stale-service]
          - errors[ERR_STALE_SERVICE_VERSION]
          - endpoints["POST /consent-requests"]
        distinguishing_aspect: "The consent create carries its own OCC token because required_tier_at_creation is pinned from the service's approved-integration snapshot: a token that predates the publish or a preceding consent create is refused with 412, no ConsentRequest row appears, and active_consent_count stays 0 because an INITIATED request is not an active consent."
