        grounds: ["concurrency_rules[scope-create-stale-lead]", state_machines.EngineeringScope.ENGINEERED_to_SUPERSEDED, entities.EngineeringScope.fields.status]
        distinguishing_aspect: "Re-reading Lead.version after scope A (=2) and creating scope B with expected_lead_version=2 succeeds and supersedes scope A (scope A.status == SUPERSEDED)."
