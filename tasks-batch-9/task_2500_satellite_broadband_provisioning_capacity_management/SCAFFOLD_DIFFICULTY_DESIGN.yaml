# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2500 — Satellite Broadband Provisioning & Capacity Management
# 9 rule_ids x >= 2 instances = 20 instances. Every `grounds:` entry resolves
# into SCAFFOLD.yaml §1.1-§1.7. Every numeric assert is a pre-computed literal.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: outage_credit_provisional_event_level_vs_final_daily_prorated_diverge
        grounds:
          - calculations.outage_credit_amount
          - entities.OutageCredit.fields.provisional_credit_cents
          - entities.OutageCredit.fields.final_credit_cents
          - state_machines.OutageEvent.OPEN_to_RESOLVED
          - state_machines.OutageCredit.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Domain 1 of 2 — SLA money accounting on the OutageCredit/OutageEvent pair: a single
          300-minute impairment split 150/150 across a UTC midnight yields provisional_credit_cents
          == 69 (one rounding over the whole event) but final_credit_cents == 68 (round per UTC day
          then sum), so the two sanctioned readings of the same stored window differ by exactly 1 cent.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ACTIVE+COORDINATED licence CD-2026.1 in US-CA; beam BEAM-01 with forward_capacity_mbps 100 and oversubscription_limit 4.0; cell CELL-001 with max_active_terminals 1; plan PLAN-P1-200 at monthly_fee_cents 9900."
            - "One subscription is ACTIVE and AUTHORIZED_FIXED with activated_at 2026-08-01T00:00:00Z, so it is an affected subscription for any event starting later."
            - "Clock advanced to 2026-08-11T03:00:00Z; an EQUIPMENT_FAILURE / FULL_OUTAGE event on BEAM-01 started at 2026-08-10T21:30:00Z and was resolved at 2026-08-11T02:30:00Z (outage_minutes 300), producing exactly one DRAFT OutageCredit whose provisional_credit_cents is 69."
          setup_api_calls:
            - call: "POST /satellite-broadband/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkOpsEngineer
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination"
              payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }
              as: ComplianceOfficer
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals/${term1_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans"
              payload: { obstructed_sample_count: 1, total_sample_count: 200 }
              as: Subscriber
              as_user_id: "${sub1_id}"
            - call: "POST /satellite-broadband/terminals/${term1_id}/install"
              payload: {}
              as: Subscriber
              as_user_id: "${sub1_id}"
            - call: "GET /satellite-broadband/service-cells/${cell_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { cell_v1: "$.data.version" }
            - call: "POST /satellite-broadband/subscriptions"
              payload: { service_order_id: "${order1_id}", terminal_id: "${term1_id}", expected_service_cell_version: "${cell_v1}" }
              as: ProvisioningAgent
              captures: { sn1_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscriptions/${sn1_id}/disclosure-acknowledgement"
              payload: { acknowledged_version: "CD-2026.1" }
              as: Subscriber
              as_user_id: "${sub1_id}"
            - call: "POST /satellite-broadband/subscriptions/${sn1_id}/authorize"
              payload: { authorization_mode: "FIXED" }
              as: ProvisioningAgent
            - call: "POST /satellite-broadband/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T03:00:00Z" }
              as: NetworkOpsEngineer
            - call: "POST /satellite-broadband/outage-events"
              payload: { beam_id: "${beam_id}", cause: "EQUIPMENT_FAILURE", severity: "FULL_OUTAGE", started_at: "2026-08-10T21:30:00Z" }
              as: NetworkOpsEngineer
              captures: { ev1_id: "$.data.id" }
            - call: "POST /satellite-broadband/outage-events/${ev1_id}/resolve"
              payload: { ended_at: "2026-08-11T02:30:00Z" }
              as: NetworkOpsEngineer
            - call: "GET /satellite-broadband/outage-credits"
              payload: { outage_event_id: "${ev1_id}" }
              as: ProvisioningAgent
              captures: { credit1_id: "$.data[0].id" }
          trigger:
            - call: "POST /satellite-broadband/outage-credits/${credit1_id}/submit"
              payload: {}
              as: ProvisioningAgent
              as_user_id: "ops-user-1"
            - call: "POST /satellite-broadband/outage-credits/${credit1_id}/decide"
              payload: { decision: "APPROVE", decision_reason: "SLA breach confirmed" }
              as: ComplianceOfficer
              as_user_id: "compliance-user-1"
          assert:
            - "OutageEvent.${ev1_id}.outage_minutes == 300"
            - "OutageEvent.${ev1_id}.credit_eligible == true"
            - "OutageEvent.${ev1_id}.generated_credit_count == 1"
            - "OutageCredit.${credit1_id}.provisional_credit_cents == 69"
            - "OutageCredit.${credit1_id}.final_credit_cents == 68"
            - "OutageCredit.${credit1_id}.final_credit_cents != OutageCredit.${credit1_id}.provisional_credit_cents"
            - "OutageCredit.${credit1_id}.credit_state == APPROVED"
            - "Subscriber.${sub1_id}.credit_balance_cents == 68"
            - "Subscriber.${sub1_id}.pending_credit_cents == 0"

      - name: cell_availability_read_reports_waitlist_only_while_admission_path_reserves
        grounds:
          - calculations.cell_slot_availability
          - entities.ServiceCell.fields.free_slot_count
          - entities.ServiceCell.fields.availability_state
          - state_machines.ServiceOrder.PENDING_DETERMINATION_to_RESERVED
          - state_machines.ServiceOrder.RESERVED_to_EXPIRED
        distinguishing_aspect: |
          Domain 2 of 2 — slot inventory on ServiceCell, a different entity and a different metric
          (integer slot counts, not money): with one RESERVED order whose 72-hour hold has lapsed but
          which no sweep has expired, GET /service-cells/{id}/availability (advertised_strict) reports
          advertised_free_slot_count 0 / WAITLIST_ONLY while POST /service-orders
          (admission_expiry_aware) lazily expires that order and returns a RESERVED order.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; licence/beam/cell/plan as in the base fixture, cell CELL-001 with max_active_terminals 1."
            - "Subscriber A holds the only RESERVED order on CELL-001, reservation_expires_at 2026-08-04T00:00:00Z; committed_terminal_count 0, reserved_slot_count 1, waitlist_depth 0."
            - "Clock advanced to 2026-08-05T00:00:00Z so A's hold has lapsed but no endpoint has swept it; subscriber B exists with no order."
          setup_api_calls:
            - call: "POST /satellite-broadband/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkOpsEngineer
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination"
              payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }
              as: ComplianceOfficer
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "suba@example.com", full_name: "Sub A", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { suba_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${suba_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { ordera_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "subb@example.com", full_name: "Sub B", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { subb_id: "$.data.id" }
            - call: "POST /satellite-broadband/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: NetworkOpsEngineer
          trigger:
            - call: "GET /satellite-broadband/service-cells/${cell_id}/availability"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${subb_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { orderb_id: "$.data.id" }
          assert:
            - "availability read (advertised_strict): data.availability_state == WAITLIST_ONLY"
            - "availability read (advertised_strict): data.advertised_free_slot_count == 0"
            - "availability read (advertised_strict): data.reserved_slot_count == 1"
            - "availability read (advertised_strict): data.committed_terminal_count == 0"
            - "availability read (advertised_strict): data.waitlist_depth == 0"
            - "the availability read leaves ServiceOrder.${ordera_id}.order_state == RESERVED (pure projection, no lazy expiry)"
            - "ServiceOrder.${orderb_id}.order_state == RESERVED"
            - "ServiceOrder.${orderb_id}.reservation_expires_at == 2026-08-08T00:00:00.000Z"
            - "ServiceOrder.${ordera_id}.order_state == EXPIRED"
            - "Subscriber.${subb_id}.account_state == PROSPECT"
            - "ServiceCell.${cell_id}.reserved_slot_count == 1"
            - "ServiceCell.${cell_id}.waitlist_depth == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cycle_charge_discount_band_keyed_on_gross_total_that_contains_the_overage_fee
        grounds:
          - calculations.cycle_charge_with_overage_discount
          - calculations.fair_use_priority_threshold
          - entities.Subscription.fields.cycle_charge_cents
          - entities.Subscriber.fields.pending_charge_cents
          - endpoints["POST /satellite-broadband/beams/{id}/billing-cycle-close"]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the discount band is
          keyed on gross_total_cents, and gross_total_cents itself contains overage_fee_cents, so the
          scaffold pins overage -> gross -> band -> net. With 150 GB against a 100 GB allowance and a
          9900-cent fee, the pinned order gives 11150 gross -> 5% band -> 10593 net, whereas keying the
          band on monthly_fee_cents alone (9900 < 10000) would give 11150.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; base licence/beam/cell/plan fixture with plan PLAN-P1-200 (priority_data_gb 100, monthly_fee_cents 9900, overage_rate_cents_per_gb 25) and beam deprioritization_grace_gb 0; cell max_active_terminals 1."
            - "One subscription is ACTIVE and AUTHORIZED_FIXED with cycle_billing_index 0."
            - "A single counted UsageRecord of 150.0 GB has been ingested for cycle 0, so cycle_priority_gb_used == 150.0 and priority_state has already flipped to DEPRIORITIZED."
          setup_api_calls:
            - call: "POST /satellite-broadband/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkOpsEngineer
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination"
              payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }
              as: ComplianceOfficer
            - call: "POST /satellite-broadband/beams"
