            - call: "POST /route-days"
              payload: { clinician_id: "${techA}", rolling_clinic_id: "${van_id}", service_date: "2026-02-16T00:00:00Z" }
              as: Dispatcher
              captures: { rd1: $.data.id, rd1_v: $.data.version }
            - call: "POST /route-days/${rd1}/stops"
              payload: { appointment_id: "${appt1}", window_start: "2026-02-16T09:00:00Z", window_end: "2026-02-16T10:00:00Z", expected_route_day_version: "${rd1_v}" }
              as: Dispatcher
