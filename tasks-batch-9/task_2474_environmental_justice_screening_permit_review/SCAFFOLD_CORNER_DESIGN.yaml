          - calculations.ej_screen_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / ej_screen_score_basis_divergence_statewide_vs_county
          rationale: "The statewide-versus-county divergence on identical indicator rows (74.03 versus 39.68) is asserted by the named §1.8 instance."

      - name: area_permitted_load_ledger_reconciles_after_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ScreeningArea.fields.permitted_load_tpy
        excluded_because:
          difficulty_instance: compensating_invariant / permitted_load_ledger_restored_after_decision_rescission
          rationale: "The book-then-reverse reconciliation of ScreeningArea.permitted_load_tpy and Facility.existing_load_tpy is asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: screen_response_exposes_its_own_cascade_immediately
        claim_type: immediate
        grounds:
          - endpoints["POST /ej/permit-applications/{id}/screen"]
          - entities.ApplicabilityDetermination.fields.application_version_after
          - calculations.applicability_determination
        distinguishing_aspect: "The single screen call returns the determination with its trigger_codes and snapshots already computed, and a read immediately afterwards shows the application in ENHANCED_REVIEW with the PLANNED participation plan already created - no second call or deferred job is needed."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; AREA_K (no indicators, UNDESIGNATED, baseline_load_tpy 400.00) with FAC_K (MAJOR_SOURCE, 1500 m); APP_K (20.00 tpy) submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-906", county: "Madera", population: 2000, limited_english_pct: 2.0, required_translation_languages: [], baseline_load_tpy: 400.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_k_id: $.data.id }
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "${area_k_id}", name: "Madera Asphalt Plant", facility_type: "MAJOR_SOURCE", distance_to_area_centroid_m: 1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { fac_k_id: $.data.id }
            - call: "POST /ej/permit-applications"
              payload: { facility_id: "${fac_k_id}", permit_type: "NEW_SOURCE", proposed_emissions_tpy: 20.00, proposed_operating_hours_per_year: 4000 }
              as: ApplicantRepresentative
              as_user_id: "${fac_k_id}"
              captures: { app_k_id: $.data.id }
            - call: "POST /ej/permit-applications/${app_k_id}/submit"
              payload: {}
              as: ApplicantRepresentative
              as_user_id: "${fac_k_id}"
          trigger:
            - call: "POST /ej/permit-applications/${app_k_id}/screen"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { app_k_v_screen: $.data.application_version_after }
            - call: "GET /ej/permit-applications/${app_k_id}"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
          assert:
            - "First trigger call: HTTP status == 201 and the response data has result == ENHANCED_REQUIRED, trigger_codes == [FACILITY_TYPE], area_designation_snapshot == UNDESIGNATED, ej_screen_score_snapshot == 0.00, revision_round == 1, determined_by_user_id == analyst-1"
            - "${app_k_v_screen} == 3"
            - "Second trigger call: HTTP status == 200, status == ENHANCED_REVIEW, review_track == ENHANCED, version == 3"
            - "GET /ej/permit-applications/${app_k_id}/participation-plans returns 1 row with total_count == 1, that row's status == PLANNED and required_comment_days == 30"
            - "ScreeningArea.${area_k_id}.open_plan_count == 0"

      - name: rescission_saga_reverses_every_issuance_side_effect
        claim_type: saga
        grounds:
          - endpoints["POST /ej/permit-decisions/{id}/rescind"]
        excluded_because:
          difficulty_instance: compensating_invariant / permitted_load_ledger_restored_after_decision_rescission
          rationale: "The full rescission compensation - both ledgers, the INVALIDATED assessment, the reopened plan and the regressed application - is asserted by the named §1.8 instance."

