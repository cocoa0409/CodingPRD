          - entities.LabelSpec.fields.content_hash
          - endpoints[POST /labeling/label-specs]
        distinguishing_aspect: "The hash is taken over the NORMALIZED canonical string, so two drafts whose fiber and origin text differ only by case and internal whitespace must share a byte-identical content_hash, while a third draft differing only in iron_code - which enters the canonical string verbatim - must not."
