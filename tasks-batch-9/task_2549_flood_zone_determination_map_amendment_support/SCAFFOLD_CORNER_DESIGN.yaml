        distinguishing_aspect: "Each of the eleven collections owns a distinct not-found error_id, so a single unknown UUID probed against every detail read must produce eleven different error_id values rather than one generic 404 - and the matching list reads must answer 200 with an empty page instead of 404."
        test_recipe:
          setup:
