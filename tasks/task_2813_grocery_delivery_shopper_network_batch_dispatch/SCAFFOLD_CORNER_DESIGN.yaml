          difficulty_instance: pick_state_beats_out_of_stock_constraint
          rationale: "That §1.8 instance already violates priority 8 (batch not SHOPPING) and priority 12 (item OUT_OF_STOCK) on the same pick call and pins the priority-8 answer."

      - name: checkout_depends_on_member_order_payment_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13]
          - errors.ERR_ORDER_PAYMENT_HELD
        excluded_because:
          difficulty_instance: batch_checkout_requires_no_held_order_payment
          rationale: "That §1.8 instance makes batch checkout legality depend on a sibling entity's payment_status and asserts both the blocked and the unblocked outcome."

      - name: retailer_cap_counts_the_collective_not_the_individual
        claim_type: aggregate_validation
        grounds:
          - validations[priority=11]
          - calculations.retailer_concurrency_overlap
        excluded_because:
          difficulty_instance: retailer_closed_interval_aggregate_cap
          rationale: "That §1.8 instance adds individually legal batches until the retailer's concurrent_shopper_cap is collectively exceeded, which is the aggregate-validation claim."

      - name: selector_fallback_runs_after_every_cheaper_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=14]
          - errors.ERR_NO_ELIGIBLE_SHOPPER
        excluded_because:
          difficulty_instance: dispatch_empty_candidate_pool_zero_eligible
          rationale: "That §1.8 instance shows the priority-14 ERR_NO_ELIGIBLE_SHOPPER firing only once the cheaper existence, state and emptiness checks have passed, i.e. check A depending on check B's result."

  - section: endpoints
    instances:
      - name: parity_policy_patch_reprices_the_catalog_but_never_placed_lines
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /retailers/{id}/parity-policy]
          - calculations.catalog_price_markup
          - entities.OrderLine.unit_price_cents_snapshot
        distinguishing_aspect: "Raising catalog_markup_pct from 0.15 to 0.25 rewrites every CatalogItem of that retailer (460 -> 500 and 575 -> 625) but leaves the already-placed OrderLine snapshot at 460 and the order's authorization untouched."
        test_recipe:
          setup:
            - "Retailer R1 with catalog_markup_pct 0.15; items I1 (in_store 400 -> 460) and I2 (in_store 500 -> 575)."
            - "Customer C1 with Order O50 carrying one I1 x1 line, already submitted: estimated_subtotal 460, authorization_ceiling 928, line snapshots 460 / 400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15, parity_disclosure_required: true }
              as: DispatchAdmin
              captures: { r1: $.data.id, rv0: $.data.version }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-ALT", name: "Premium Beans", pricing_unit: "EACH", in_store_price_cents: 500, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i2: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { o50: $.data.id }
            - call: "POST /orders/${o50}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 1 }
              as: Customer
              as_user_id: "${c1}"
              captures: { k50: $.data.id }
            - call: "POST /orders/${o50}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "PATCH /retailers/${r1}/parity-policy"
              payload: { catalog_markup_pct: 0.25 }
              as: RetailerManager
              as_user_id: "${r1}"
          assert:
            - "Response status is 200 with Retailer.${r1}.catalog_markup_pct == 0.25 and version == ${rv0} + 1"
            - "parity_disclosure_required is still true and concurrent_shopper_cap is unchanged - an omitted PATCH field is not reset to its default"
            - "CatalogItem.${i1}.catalog_price_cents == 500 and CatalogItem.${i2}.catalog_price_cents == 625; both in_store_price_cents are unchanged at 400 and 500"
            - "OrderLine.${k50}.unit_price_cents_snapshot is still 460 and in_store_price_cents_snapshot is still 400"
            - "Order.${o50}.estimated_subtotal_cents is still 460 and authorization_ceiling_cents is still 928"

      - name: batch_membership_is_readable_from_both_ends
        claim_type: cross_reference_link
