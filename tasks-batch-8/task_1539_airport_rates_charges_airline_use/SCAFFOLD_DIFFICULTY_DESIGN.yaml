            - "RatesSetting.${rs_xed_draft_id}.status remains DRAFT"

      - name: activity_record_requires_agreement_not_suspended
        grounds:
          - state_machines.AirlineAgreement
          - validations[priority=10]
        distinguishing_aspect: |
          Pair: ActivityRecord × AirlineAgreement. Creating an ActivityRecord
