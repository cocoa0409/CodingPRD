              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_x_id: $.data.id, depot_x_v: $.data.version }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_x_id}", requested_capacity_kw: 50, install_window_start: "2026-09-10T00:00:00Z", install_window_end: "2026-09-20T00:00:00Z", crew_count: 3, expected_depot_version: "${depot_x_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "PERMITTING" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "GET /evfleet/depots/${depot_x_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_x_v4: $.data.version }
          trigger:
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_x_id}", requested_capacity_kw: 50, install_window_start: "2026-09-15T00:00:00Z", install_window_end: "2026-09-25T00:00:00Z", crew_count: 2, expected_depot_version: "${depot_x_v4}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err_crew: $.data.error_id }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_x_id}", requested_capacity_kw: 50, install_window_start: "2026-09-15T00:00:00Z", install_window_end: "2026-09-25T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_x_v4}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p3_id: $.data.id }
            - call: "GET /evfleet/depots/${depot_x_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_x_v5: $.data.version }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_x_id}", requested_capacity_kw: 50, install_window_start: "2026-09-20T00:00:00Z", install_window_end: "2026-09-30T00:00:00Z", crew_count: 2, expected_depot_version: "${depot_x_v5}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err_touch: $.data.error_id }
          assert:
            - "err_crew == ERR_INSTALL_WINDOW_CONFLICT (aggregate crew 3 + 2 = 5 > 4 over the Sep 15-20 overlap)"
            - "p3_id is non-null (crew 3 + 1 = 4 <= 4 admitted at the aggregate boundary)"
            - "err_touch == ERR_INSTALL_WINDOW_CONFLICT (closed windows: P1's end 2026-09-20T00:00Z equals the new start, so they overlap and crews 3 + 2 > 4)"
            - "capacity was never the blocker: total 500 kW leaves headroom >= 350 for every attempt"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: parts_reserve_release_conserves_stock_identity
        grounds:
          - entities.PartsStock.fields.reserved_qty
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Conserved quantity is the parts accounting identity: the reserve (booking) + release (cancel) pair leaves received_total_qty == on_hand_qty + consumed_total_qty holding with identical on_hand 10 / reserved 0 / consumed 0 before and after."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Vehicle 1 COMMISSIONED. Center SC with PartsStock BRK-1: received 10, on_hand 10, reserved 0, consumed 0, threshold 2. Visit V booked on vehicle 1 at SC reserving 3 x BRK-1."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - *d_depot
            - *d_sup
            - *d_mod1
            - *d_mod1_qa
            - *d_mod1_pass
            - *d_mod2
            - *d_mod2_qa
            - *d_mod2_pass
            - *d_order
            - *d_order_submit
            - *d_order_confirm
            - *d_veh1
            - *d_order_read_1
            - *d_veh2
            - *d_veh1_prov
            - *d_veh1_act
            - *d_veh1_transit
            - *d_veh1_depot
            - *d_veh1_comm
            - call: "POST /evfleet/service-centers"
              payload: { name: "SC Inv", region_code: "CA-S", state_code: "CA", bay_count: 2 }
              as: PlatformAdmin
              captures: { sc_i_id: $.data.id }
            - call: "POST /evfleet/parts-stocks"
              payload: { service_center_id: "${sc_i_id}", sku: "BRK-1", qty_delta: 10, reorder_threshold: 2 }
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { st0_on: $.data.on_hand_qty, st0_res: $.data.reserved_qty, st0_con: $.data.consumed_total_qty, st0_rec: $.data.received_total_qty }
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh1_id}", service_center_id: "${sc_i_id}", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T10:00:00Z", purpose: "REPAIR", parts_lines: [ { sku: "BRK-1", qty: 3 } ] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { visit_i: $.data.id }
            - call: "GET /evfleet/service-centers/${sc_i_id}/parts-stocks"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { st1_on: "$.data[0].on_hand_qty", st1_res: "$.data[0].reserved_qty", st1_con: "$.data[0].consumed_total_qty", st1_rec: "$.data[0].received_total_qty" }
          trigger:
            - call: "POST /evfleet/service-visits/${visit_i}/transition"
              payload: { to_state: "CANCELLED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - call: "GET /evfleet/service-centers/${sc_i_id}/parts-stocks"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { st2_on: "$.data[0].on_hand_qty", st2_res: "$.data[0].reserved_qty", st2_con: "$.data[0].consumed_total_qty", st2_rec: "$.data[0].received_total_qty" }
          assert:
            - "initially st0_on == 10 and st0_res == 0 and st0_con == 0 and st0_rec == 10"
            - "after booking: st1_on == 10 and st1_res == 3 (forward action) — identity 10 == 10 + 0 holds"
            - "after cancel: st2_on == 10 and st2_res == 0 and st2_con == 0 and st2_rec == 10 (compensating action restores the exact prior tuple — zero drift)"
            - "identity holds at every observation: received_total_qty == on_hand_qty + consumed_total_qty"
            - "ServiceVisit.${visit_i}.status == CANCELLED"

      - name: project_create_cancel_conserves_depot_headroom
        grounds:
          - calculations.depot_capacity_allocation
          - state_machines.ChargingProject.SURVEY_to_CANCELLED
        distinguishing_aspect: "Conserved quantity is depot electrical headroom (kW, a different quantity than parts units): create(200) then cancel returns committed_capacity_kw to exactly 0, and the depot version advanced by exactly 2 (one per accepted write)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer with depot D (total 500 kW), committed 0, version 1. Project P1 (200 kW, window 2026-10-05..2026-10-15, crew 2) created in SURVEY."
          setup_api_calls:
            - *d_clock
            - *d_cust
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Invariant Depot", state_code: "CA", address: "4 Grid Pl", total_capacity_kw: 500 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_h_id: $.data.id, depot_h_v: $.data.version }
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_h_id}", requested_capacity_kw: 200, install_window_start: "2026-10-05T00:00:00Z", install_window_end: "2026-10-15T00:00:00Z", crew_count: 2, expected_depot_version: "${depot_h_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { p1_id: $.data.id }
            - call: "GET /evfleet/depots/${depot_h_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { committed_mid: $.data.committed_capacity_kw, depot_h_v2: $.data.version }
          trigger:
            - call: "POST /evfleet/charging-projects/${p1_id}/transition"
              payload: { to_state: "CANCELLED" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "GET /evfleet/depots/${depot_h_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { committed_end: $.data.committed_capacity_kw, depot_h_v3: $.data.version }
          assert:
            - "committed_mid == 200 (create committed the requested kW)"
            - "committed_end == 0 (cancel released exactly what create committed — no drift in headroom)"
            - "depot_h_v3 == ${depot_h_v} + 2 (exactly two accepted writes bumped the version)"
            - "ChargingProject.${p1_id}.status == CANCELLED and a follow-up transition attempt returns ERR_ALREADY_TERMINAL"
