              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8B", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
