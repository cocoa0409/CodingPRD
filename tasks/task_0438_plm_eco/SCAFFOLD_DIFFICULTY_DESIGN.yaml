              payload: { supplier_id: "${sup_id}", affected_part_id: "${bp_id}", pcn_reference: "PCN-001" }
              as: SupplierManager
              captures: { pcn_id: $.data.id }
            - call: "POST /plm/supplier-change-notices/${pcn_id}/assess"
              payload: {}
              as: SupplierManager
          trigger:
            - call: "POST /plm/supplier-change-notices/${pcn_id}/accept"
              payload: {}
              as: SupplierManager
              captures: { spawned: $.data.spawned_ecr_id, st: $.data.status }
          assert:
            - "accept.data.status == ACCEPTED"
            - "accept.data.spawned_ecr_id != null"
            - "GET /plm/change-requests?source_pcn_id=${pcn_id} returns exactly 1 ECR whose reason_code == SUPPLIER_CHANGE and status == DRAFT"

