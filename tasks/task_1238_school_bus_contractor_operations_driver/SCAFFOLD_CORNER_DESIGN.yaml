            - "${wk_after_double} == 2460"
            - "${err5} == ERR_DRIVER_HOURS_CAP_EXCEEDED (plain confirm at projected 3060 rejected)"
      - name: driver_terminate_cascades_future_assignments
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Driver
        distinguishing_aspect: "TERMINATE from ACTIVE cascades: the driver's future CONFIRMED assignment is CANCELLED (DRIVER_SUSPENDED) and the service day's shortage fields recompute in the same request."
        test_recipe:
          setup: ["full dispatch chain; assignment CONFIRMED for 2026-06-01"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-CC4", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-CC4", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
