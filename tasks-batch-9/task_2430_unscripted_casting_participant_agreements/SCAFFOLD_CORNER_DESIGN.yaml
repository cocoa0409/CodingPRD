              payload: { kind: "INTERVIEW", outcome: "CONDITIONAL", severity_flags: 1, conditional_conditions: "Follow-up interview requested." }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov_after_1: $.data.provisional_risk_score, final_after_1: $.data.final_risk_score }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "CONDITIONAL", severity_flags: 1, conditional_conditions: "Minor traffic matter disclosed." }
