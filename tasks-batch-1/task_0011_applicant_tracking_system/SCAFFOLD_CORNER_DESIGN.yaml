              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == 'ERR_BGC_INDEPENDENCE' (resolver user_x equals requisition submitter)"

      - name: error_segregation_of_duties_on_requisition_approve_already_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: requisition_approve_sod_beats_budget
          rationale: "SoD trigger and rejection are asserted as the winning error in the §1.8 priority-pair instance."

      - name: error_budget_exceeded_already_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_BUDGET_EXCEEDED]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: requisition_approve_sod_beats_budget
          rationale: "Budget-exceeded loses to SoD in the §1.8 priority-pair scenario, exercising the priority-17 rule."

      - name: error_panelist_conflict_already_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PANELIST_CONFLICT]
          - validations[priority=8]
        excluded_because:
          difficulty_instance: interview_create_panelist_conflict_beats_invalid_panel
          rationale: "Panelist-conflict win is asserted in the §1.8 priority-pair instance."

      - name: error_invalid_panel_already_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_PANEL]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: interview_create_panelist_conflict_beats_invalid_panel
          rationale: "Invalid panel (size 6) is the losing leg in the §1.8 priority-pair instance."

      - name: error_offer_expired_already_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_OFFER_EXPIRED]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: offer_accept_exact_expiry_boundary_revoked
          rationale: "Offer-expired boundary is exercised in the §1.8 boundary-precision instance."

      - name: error_invalid_state_already_covered_by_multiple
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_STATE]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: application_screen_blocked_when_requisition_not_approved
          rationale: "Invalid-state classes are exercised in multiple §1.8 cross-entity-state instances and the cancel-when-already-revoked path."

      - name: error_interview_overlap_application_already_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INTERVIEW_OVERLAP_APPLICATION]
          - validations[priority=14.5]
        excluded_because:
          difficulty_instance: interview_overlap_per_application_half_open_adjacency_allowed
          rationale: "Application-level overlap is exercised in the §1.8 temporal-overlap instance."

      - name: error_interview_overlap_panelist_already_covered
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INTERVIEW_OVERLAP_PANELIST]
          - validations[priority=14.6]
        excluded_because:
          difficulty_instance: interview_overlap_per_panelist_15min_buffered_interval
          rationale: "Panelist-level buffered overlap is exercised in the §1.8 temporal-overlap instance."

