            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_2}", scope_description: "other aircraft job", estimated_downtime_days: 5, quoted_labor_hours: 2, bay_code: "BAY-2", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-10T00:00:00Z" }, as: ShopManager, captures: { wo_2: "$.data.id" } }
