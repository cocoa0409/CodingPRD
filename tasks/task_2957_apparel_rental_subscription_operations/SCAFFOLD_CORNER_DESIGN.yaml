      - name: state_shipment_exception_cap_retires_the_unit_and_waitlists_the_reservation
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Shipment.transitions.IN_TRANSIT_to_EXCEPTION"
          - "state_machines.Shipment.transitions.EXCEPTION_to_IN_TRANSIT"
          - "state_machines.Reservation.transitions.SHIPPED_to_WAITLISTED"
          - "calculations.unit_position_conservation_invariant"
          - "entities.Shipment.fields.exception_count"
        distinguishing_aspect: >-
          The first exception is recoverable and the second is not: exception_count 1 leaves the reservation
          SHIPPED and allows a re-dispatch, while exception_count 2 equals SHIPMENT_EXCEPTION_CAP and fires the
          four-hop loss cascade — unit RETIRED with retirement_reason LOSS and condition_state CONDEMNED,
          reservation SHIPPED -> WAITLISTED with allocated_unit_id and matched_at nulled, style depth recomputed
          to active_unit_count 0 and depth_gap_units 3, and explicitly no fee: the member's ledger stays empty
          because a carrier loss is never charged to the member.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z by the PlatformAdmin clock endpoint"
