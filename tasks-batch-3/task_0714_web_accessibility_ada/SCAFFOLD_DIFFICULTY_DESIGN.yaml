scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: conformance_provisional_vs_certified_diverge
        grounds:
          - calculations.conformance_score
          - state_machines.Scan.RUNNING_to_COMPLETED
          - state_machines.VpatReport.DRAFT_to_ISSUED
          - entities.Scan.fields.provisional_conformance_score
          - entities.VpatReport.fields.certified_conformance_score
        distinguishing_aspect: >-
          Same finding set yields provisional=0.00 (frozen at completion, all OPEN, REMEDIATED_SET={RESOLVED})
          but certified=88.24 (frozen at issuance, REMEDIATED_SET={RESOLVED, WONT_FIX_ACCEPTED}); the two
          variants are read off DIFFERENT entities (Scan vs VpatReport).
        test_recipe:
          setup:
            - "Org + ACTIVE subscription + Site exist; clock at default 2026-03-01T00:00:00Z."
            - "A scan COMPLETED with 3 findings CRITICAL(w10), SERIOUS(w5), MODERATE(w2); total weight 17."
            - "After completion: CRITICAL resolved via remediation+PASS retest; SERIOUS accept-risk; MODERATE left OPEN."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme Inc", contact_email: "c@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MONITOR" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://acme.test", audited_page_count: 120 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AA" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" }, { wcag_criterion: "1.1.1", severity: "SERIOUS" }, { wcag_criterion: "2.4.4", severity: "MODERATE" } ] }
              as: AuditEngineer
              captures: { prov_score: "$.data.provisional_conformance_score" }
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f_crit_id: "$.data[0].id", f_ser_id: "$.data[1].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_crit_id}", assigned_vendor_id: "vendor-1", estimated_effort_hours: 4 }
              as: RemediationVendor
              captures: { task_id: "$.data.id" }
            - call: "POST /compliance/remediation-tasks/${task_id}/begin"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/remediation-tasks/${task_id}/submit"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/retest-runs"
              payload: { finding_id: "${f_crit_id}", remediation_task_id: "${task_id}", outcome: "PASS" }
              as: AuditEngineer
            - call: "POST /compliance/findings/${f_ser_id}/accept-risk"
              payload: {}
              as: ComplianceManager
            - call: "POST /compliance/vpat-reports"
              payload: { site_id: "${site_id}", source_scan_id: "${scan_id}" }
              as: ComplianceManager
              captures: { vpat_id: "$.data.id" }
            - call: "GET /compliance/scans/${scan_id}"
              payload: {}
              as: ComplianceManager
              captures: { scan_v: "$.data.version" }
          trigger:
            - call: "POST /compliance/vpat-reports/${vpat_id}/issue"
              payload: { expected_scan_version: "${scan_v}" }
              as: ComplianceManager
              captures: { cert_score: "$.data.certified_conformance_score" }
          assert:
            - "Scan.${scan_id}.provisional_conformance_score == 0.00"
            - "VpatReport.${vpat_id}.certified_conformance_score == 88.24"
            - "VpatReport.${vpat_id}.conformance_level == WCAG_AA_PARTIAL"

      - name: risk_current_vs_projected_diverge
        grounds:
          - calculations.risk_exposure
          - entities.Site.fields.risk_exposure_score
          - endpoints[GET /compliance/sites/{id}/risk-projection]
          - state_machines.AuditFinding.OPEN_to_IN_REMEDIATION
        distinguishing_aspect: >-
          For the same site data the CURRENT risk (counting all non-terminal findings) = 16.00 while the
          PROJECTED variant (excluding findings with an IN_PROGRESS task) = 8.00; risk scoring is on the
          Site entity, a different domain than the Scan/VpatReport conformance score.
        test_recipe:
          setup:
            - "Org + ACTIVE subscription + Site; clock 2026-03-01T00:00:00Z (no overdue)."
            - "Scan COMPLETED with 2 CRITICAL findings, both OPEN; no legal demand."
            - "One CRITICAL finding has an IN_PROGRESS remediation task; the other stays OPEN."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Beta LLC", contact_email: "b@beta.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MONITOR" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://beta.test", audited_page_count: 50 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AA" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" }, { wcag_criterion: "2.1.1", severity: "CRITICAL" } ] }
              as: AuditEngineer
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f1_id: "$.data[0].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f1_id}", assigned_vendor_id: "vendor-1", estimated_effort_hours: 3 }
              as: RemediationVendor
              captures: { task_id: "$.data.id" }
            - call: "POST /compliance/remediation-tasks/${task_id}/begin"
              payload: {}
              as: RemediationVendor
          trigger:
            - call: "GET /compliance/sites/${site_id}/risk-projection"
              payload: {}
              as: ComplianceManager
              captures: { proj: "$.data.projected_risk_exposure_score", curr: "$.data.current_risk_exposure_score" }
          assert:
            - "current_risk_exposure_score == 16.00"
            - "projected_risk_exposure_score == 8.00"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_exposure_nonlinear_three_inputs
        grounds:
          - calculations.risk_exposure
          - entities.Site.fields.risk_exposure_score
          - state_machines.LegalDemand.transitions
        distinguishing_aspect: >-
          MODE (a): risk = min(100, 8*C + 3*S) * (1 + min(1.0, 0.02*D)) + (25 if legal) — nested min/max with
          a conditional legal branch over >=3 inputs (C, S, D, L); with C=1,S=1,D=0,L=1 the result is 36.00.
        test_recipe:
          setup:
            - "Org + ACTIVE subscription + Site; clock 2026-03-01T00:00:00Z."
            - "Scan COMPLETED with CRITICAL + SERIOUS findings, both OPEN (no overdue)."
            - "A LegalDemand against the site is RECEIVED (legal bump active)."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Gamma Co", contact_email: "g@gamma.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MONITOR" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://gamma.test", audited_page_count: 30 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AA" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" }, { wcag_criterion: "1.1.1", severity: "SERIOUS" } ] }
              as: AuditEngineer
          trigger:
            - call: "POST /compliance/legal-demands"
              payload: { site_id: "${site_id}", claimant_name: "Doe", response_due_at: "2026-04-01T00:00:00Z" }
              as: ComplianceManager
            - call: "GET /compliance/sites/${site_id}"
              payload: {}
              as: ComplianceManager
              captures: { risk: "$.data.risk_exposure_score", posture: "$.data.audit_posture" }
          assert:
            - "Site.${site_id}.risk_exposure_score == 36.00"
            - "Site.${site_id}.audit_posture == BLOCKED"

      - name: subscription_invoice_round_per_site_then_sum
        grounds:
          - calculations.subscription_invoice
          - entities.Subscription.fields.monthly_invoice_cents
          - state_machines.Subscription.TRIAL_to_ACTIVE
        distinguishing_aspect: >-
          MODE (b): five MONITOR sites with the multi-site 10% discount; per-site fees rounded to whole cents
          THEN summed = 119229, which differs from sum-then-round (119228) — the scaffold pins round-per-site.
        test_recipe:
          setup:
            - "Org with 5 MONITOR-tier sites pages [120,333,87,1000,55]; subscription TRIAL."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Delta Group", contact_email: "d@delta.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MONITOR" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://d1.delta.test", audited_page_count: 120 }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://d2.delta.test", audited_page_count: 333 }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://d3.delta.test", audited_page_count: 87 }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://d4.delta.test", audited_page_count: 1000 }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://d5.delta.test", audited_page_count: 55 }
              as: OrgAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { invoice: "$.data.monthly_invoice_cents" }
          assert:
            - "Subscription.${sub_id}.monthly_invoice_cents == 119229"
            - "Subscription.${sub_id}.status == ACTIVE"

      - name: vpat_credit_circular_evaluation_order
        grounds:
          - calculations.remediation_credit
          - calculations.conformance_score
          - entities.VpatReport.fields.conformance_level
          - entities.Organization.fields.account_credit_cents
          - state_machines.VpatReport.DRAFT_to_ISSUED
        distinguishing_aspect: >-
          MODE (c): certified_score -> conformance_level -> remediation_credit form a pinned 1->2->3 chain
          (credit never feeds back into score); certified=88.24 yields level WCAG_AA_PARTIAL yields credit 2500.
        test_recipe:
          setup:
            - "Same state as conformance_provisional_vs_certified_diverge through VPAT DRAFT creation."
            - "certified score will be 88.24 -> level WCAG_AA_PARTIAL -> credit 2500."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Epsilon Inc", contact_email: "e@eps.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MONITOR" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://eps.test", audited_page_count: 40 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AA" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" }, { wcag_criterion: "1.1.1", severity: "SERIOUS" }, { wcag_criterion: "2.4.4", severity: "MODERATE" } ] }
              as: AuditEngineer
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f_crit_id: "$.data[0].id", f_ser_id: "$.data[1].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_crit_id}", assigned_vendor_id: "vendor-1", estimated_effort_hours: 4 }
              as: RemediationVendor
              captures: { task_id: "$.data.id" }
            - call: "POST /compliance/remediation-tasks/${task_id}/begin"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/remediation-tasks/${task_id}/submit"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/retest-runs"
              payload: { finding_id: "${f_crit_id}", remediation_task_id: "${task_id}", outcome: "PASS" }
              as: AuditEngineer
            - call: "POST /compliance/findings/${f_ser_id}/accept-risk"
              payload: {}
              as: ComplianceManager
            - call: "POST /compliance/vpat-reports"
              payload: { site_id: "${site_id}", source_scan_id: "${scan_id}" }
              as: ComplianceManager
              captures: { vpat_id: "$.data.id" }
            - call: "GET /compliance/scans/${scan_id}"
              payload: {}
              as: ComplianceManager
              captures: { scan_v: "$.data.version" }
          trigger:
            - call: "POST /compliance/vpat-reports/${vpat_id}/issue"
              payload: { expected_scan_version: "${scan_v}" }
              as: ComplianceManager
            - call: "GET /compliance/organizations/${org_id}"
              payload: {}
              as: ComplianceManager
              captures: { credit: "$.data.account_credit_cents" }
          assert:
            - "VpatReport.${vpat_id}.conformance_level == WCAG_AA_PARTIAL"
            - "Organization.${org_id}.account_credit_cents == 2500"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: finding_remediation_revision_cycle
        grounds:
          - state_machines.AuditFinding.RETEST_PENDING_to_REOPENED
          - state_machines.AuditFinding.REOPENED_to_IN_REMEDIATION
          - entities.RemediationTask.fields.supersedes_task_id
        distinguishing_aspect: >-
          AuditFinding cycles RETEST_PENDING -> REOPENED -> IN_REMEDIATION -> RETEST_PENDING via a FAIL retest
          then a superseding task; this is a true cycle on the AuditFinding entity (not a linear pipeline).
        test_recipe:
          setup:
            - "Org+ACTIVE sub+Site+COMPLETED scan with 1 CRITICAL finding OPEN."
            - "Finding driven to RETEST_PENDING then a FAIL retest puts it REOPENED."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Zeta", contact_email: "z@zeta.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://zeta.test", audited_page_count: 10 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "A" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" } ] }
              as: AuditEngineer
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_id}", assigned_vendor_id: "vendor-1", estimated_effort_hours: 2 }
              as: RemediationVendor
              captures: { t1_id: "$.data.id" }
            - call: "POST /compliance/remediation-tasks/${t1_id}/begin"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/remediation-tasks/${t1_id}/submit"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/retest-runs"
              payload: { finding_id: "${f_id}", remediation_task_id: "${t1_id}", outcome: "FAIL" }
              as: AuditEngineer
          trigger:
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_id}", assigned_vendor_id: "vendor-2", estimated_effort_hours: 5, supersedes_task_id: "${t1_id}" }
              as: RemediationVendor
              captures: { t2_id: "$.data.id" }
            - call: "GET /compliance/findings/${f_id}"
              payload: {}
              as: AuditEngineer
              captures: { fstatus: "$.data.status" }
            - call: "GET /compliance/remediation-tasks/${t1_id}"
              payload: {}
              as: AuditEngineer
              captures: { t1status: "$.data.status" }
          assert:
            - "AuditFinding.${f_id}.status == IN_REMEDIATION"
            - "RemediationTask.${t1_id}.status == SUPERSEDED"
            - "RemediationTask.${t2_id}.supersedes_task_id == ${t1_id}"

      - name: subscription_past_due_active_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: >-
          Subscription cycles ACTIVE -> PAST_DUE -> ACTIVE on a different entity than AuditFinding; the
          PAST_DUE->ACTIVE edge is a genuine back-edge (revision loop), not a forward-only pipeline.
        test_recipe:
          setup:
            - "Org+Site+subscription activated (ACTIVE) then marked PAST_DUE."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Eta", contact_email: "h@eta.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v0: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://eta.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v0}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/subscriptions/${sub_id}/mark-past-due"
              payload: {}
              as: PlatformAdmin
            - call: "GET /compliance/subscriptions/${sub_id}"
              payload: {}
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_v1: "$.data.version" }
          trigger:
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v1}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { fstatus: "$.data.status" }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: scan_complete_cascade_depth3
        grounds:
          - state_machines.Scan.RUNNING_to_COMPLETED
          - entities.AuditFinding.fields.status
          - entities.Site.fields.audit_posture
          - entities.Site.fields.risk_exposure_score
        distinguishing_aspect: >-
          Depth-3: complete scan -> emits AuditFindings -> Site.audit_posture recomputed from those findings
          (UNSCANNED->AT_RISK) -> Site.risk_exposure_score recomputed (0.0 -> 11.00); each hop caused by the prior.
        test_recipe:
          setup:
            - "Org+ACTIVE sub+Site UNSCANNED with risk 0.0; clock 2026-03-01T00:00:00Z; one RUNNING scan."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Theta", contact_email: "t@theta.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MONITOR" }
              as: OrgAdmin
              as_user_id: "${org_id}"
