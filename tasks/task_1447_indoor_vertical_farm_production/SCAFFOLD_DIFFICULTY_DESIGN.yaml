    instances:
      - name: harvest_requires_rack_operating
        grounds:
          - state_machines.GrowBatch.HARVEST_READY_to_HARVESTED
          - state_machines.Rack
          - validations[priority=6]
        distinguishing_aspect: |
          Pair GrowBatch -> Rack: harvest is gated on the OWNING rack's posture. With the rack
          forced into SANITATION_HOLD (sanitation cycle started before the batch became ready,
          since start is forbidden once any loop batch is HARVEST_READY), harvest is rejected
          with ERR_RACK_NOT_OPERATING even though the batch's own state is valid.
        test_recipe:
          setup:
            - "Batch on R-01 (WL-A) towers, GROWING, projected harvest 2026-08-24T06:00:00Z"
            - "Sanitation cycle started 2026-08-21T08:00:00Z (batch still GROWING) -> rack SANITATION_HOLD; batch then marked HARVEST_READY at 2026-08-22T06:00:00Z"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 4 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
            - { call: "POST /farm/batches/${b1}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-21T08:00:00Z", scheduled_end_at: "2026-08-21T10:00:00Z" }, as: SanitationLead, captures: { cy1: "$.data.id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T08:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy1}/start", as: SanitationLead }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/mark-harvest-ready", as: Grower, captures: { b_ready: "$.data.production_status" } }
          trigger:
            - { call: "POST /farm/batches/${b1}/harvest", payload: { grade_a_lb: 40.0, grade_b_lb: 6.0, cull_lb: 3.0 }, as: Grower, as_user_id: "grower-7", captures: { err: "$.data.error_id" } }
          assert:
            - "batch reached HARVEST_READY while the loop sanitation was IN_PROGRESS (mark-harvest-ready has no rack gate)"
            - "harvest -> error_id == ERR_RACK_NOT_OPERATING (409): GrowBatch transition gated by Rack.rack_posture == OPERATING"
            - "batch remains HARVEST_READY (no partial side effects)"

      - name: pack_requires_recent_passed_sanitation
        grounds:
          - calculations.pack_recency_check
          - state_machines.GrowBatch.HARVESTED_to_PACKED
        distinguishing_aspect: |
          Pair GrowBatch -> SanitationCycle: pack requires a PASSED cycle on the batch's water
          loop within 72h. With the only PASS 73 hours old (strictly greater than 72h), pack is
          rejected ERR_SANITATION_RECENCY_MISSING even though the batch state and safety are valid;
          exactly 72h would pass — the strictly-greater comparison is the load-bearing edge.
        test_recipe:
          setup:
            - "Batch harvested 2026-08-24T06:30:00Z, RELEASED; the only PASSED cycle on WL-A completed 2026-08-21T03:30:00Z; pack attempted at 2026-08-24T06:30:00Z puts the gap at exactly 75h00m (strictly over the 72h recency limit)"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 4 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id" } }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-21T01:00:00Z", scheduled_end_at: "2026-08-21T03:00:00Z" }, as: SanitationLead, captures: { cy1: "$.data.id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
