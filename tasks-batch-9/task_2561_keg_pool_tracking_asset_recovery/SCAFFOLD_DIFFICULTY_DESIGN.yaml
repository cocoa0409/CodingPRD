              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 4, per_fill_rate_cents: 2200, replenishment_threshold_pct: 20 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v1: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io1_id: "$.data.id" }
            - call: "POST /issuance-orders/${io1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v1}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v1: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "STOLEN_SUSPECTED", expected_keg_version: "${k1_v1}", assessment_basis: "REPLACEMENT_COST" }
              as: AssetRecoveryAnalyst
