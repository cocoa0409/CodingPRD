scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: member_creation_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /v1/members with email/full_name/plan_id returns 201 with membership_status ACTIVE, wallet_credit_cents 0, version 1."
        test_recipe:
          setup: ["A BRONZE plan exists."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { ep1: "$.data.id" }
          trigger:
            - call: "POST /v1/members"
              payload: { email: "cr1@x.com", full_name: "Cr One", plan_id: "${ep1}" }
              as: Manager
              captures: { crm: "$.data.id" }
          assert:
            - "trigger response HTTP status == 201"
            - "Member.${crm}.membership_status == ACTIVE"
            - "Member.${crm}.wallet_credit_cents == 0"
            - "Member.${crm}.version == 1"

      - name: member_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/members/{unknown uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { enf: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_NOT_FOUND"
            - "trigger response HTTP status == 404"

      - name: plan_missing_required_discount_returns_validation
        claim_type: Required Fields
        grounds: [entities.MembershipPlan.fields.table_discount_pct, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /v1/plans omitting table_discount_pct returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/plans"
              payload: { tier: "GOLD", monthly_fee_cents: 8000 }
              as: Manager
              captures: { epv: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_VALIDATION"

      - name: member_duplicate_email_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.Member.fields.email, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Registering a second member with an already-used email returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["A plan and a member with email dup@x.com exist."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { edp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "dup@x.com", full_name: "Dup A", plan_id: "${edp}" }
              as: Manager
          trigger:
            - call: "POST /v1/members"
              payload: { email: "dup@x.com", full_name: "Dup B", plan_id: "${edp}" }
              as: Manager
              captures: { edup: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_DUPLICATE"

      - name: members_list_limit_out_of_range_returns_pagination
        claim_type: Listing
        grounds: [endpoints, "errors[ERR_PAGINATION]", response_envelope]
        distinguishing_aspect: "GET /v1/members?limit=999 exceeds max 100 and returns ERR_PAGINATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/members?limit=999"
              payload: {}
              as: Manager
              captures: { epag: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_PAGINATION"

      - name: table_system_fields_generated_version_one
        claim_type: System Fields
        grounds: [entities.PoolTable, entities.PoolTable.fields.status]
        distinguishing_aspect: "POST /v1/tables mints id/created_at/version=1 and defaults status ACTIVE regardless of any client-supplied status."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/tables"
              payload: { table_number: 20, table_type: "BILLIARDS", seat_capacity: 4, hourly_rate_cents: 1400 }
              as: Manager
              captures: { syt: "$.data.id" }
          assert:
            - "PoolTable.${syt}.status == ACTIVE"
            - "PoolTable.${syt}.version == 1"

  # =================================================================
  - section: state_machines
    instances:
      - name: confirm_from_cancelled_reservation_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Reservation.PENDING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A reservation cancelled from PENDING cannot then be confirmed — POST /reservations/{id}/confirm returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING reservation, then cancelled."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { sp1: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "sm1@x.com", full_name: "SM One", plan_id: "${sp1}" }
              as: Manager
              captures: { sm1m: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 21, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { sm1t: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${sm1m}", table_id: "${sm1t}", start_at: "2026-07-09T10:00:00Z", end_at: "2026-07-09T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { sm1r: "$.data.id" }
            - call: "POST /v1/reservations/${sm1r}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /v1/reservations/${sm1r}/confirm"
              payload: {}
              as: FrontDesk
              captures: { esm1: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE"
            - "Reservation.${sm1r}.status == CANCELLED"

      - name: open_registration_from_cancelled_tournament_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Tournament.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A tournament cancelled from SCHEDULED is terminal — POST /tournaments/{id}/open returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED tournament, then cancelled."]
          setup_api_calls:
            - call: "POST /v1/tournaments"
              payload: { name: "DeadCup", format: "SINGLE_ELIM", entry_fee_cents: 0, max_entries: 8 }
              as: Manager
              captures: { sm2t: "$.data.id" }
            - call: "POST /v1/tournaments/${sm2t}/cancel"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /v1/tournaments/${sm2t}/open"
              payload: {}
              as: Manager
              captures: { esm2: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE"
            - "Tournament.${sm2t}.status == CANCELLED"

      - name: session_close_bubbles_reservation_to_completed
        claim_type: bubble_up
        grounds: [state_machines.TableSession.OPEN_to_CLOSED, state_machines.Reservation.CHECKED_IN_to_COMPLETED]
        distinguishing_aspect: "Closing the session realizing a CHECKED_IN reservation auto-transitions that reservation to COMPLETED."
        test_recipe:
          setup: ["Member funded; reservation confirmed then checked in at 2026-07-02T13:00; clock 14:00 at close."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { sp3: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "sm3@x.com", full_name: "SM Three", plan_id: "${sp3}" }
              as: Manager
              captures: { sm3m: "$.data.id" }
            - call: "POST /v1/members/${sm3m}/wallet/adjustments"
              payload: { amount_cents: 50000 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 22, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { sm3t: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${sm3m}", table_id: "${sm3t}", start_at: "2026-07-02T13:00:00Z", end_at: "2026-07-02T14:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { sm3r: "$.data.id" }
            - call: "POST /v1/reservations/${sm3r}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T13:00:00Z" }
              as: Manager
            - call: "POST /v1/reservations/${sm3r}/check-in"
              payload: {}
              as: FrontDesk
              captures: { sm3s: "$.data.id" }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T14:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /v1/sessions/${sm3s}/close"
              payload: {}
              as: FrontDesk
          assert:
            - "TableSession.${sm3s}.status == CLOSED"
            - "Reservation.${sm3r}.status == COMPLETED"

  # =================================================================
  - section: calculations
    instances:
      - name: event_quote_three_table_bulk_tier_boundary
        claim_type: Constants Applied
        grounds: [calculations.event_quote, entities.Event.fields.quote_cents, entities.Event.fields.deposit_cents]
        distinguishing_aspect: "A 3-table, 4-hour event hits the >=3 bulk tier (0.05): quote_cents = round(48000*0.95) = 45600, deposit_cents = round(45600*0.25) = 11400."
        test_recipe:
          setup: ["Three ACTIVE tables; host member; INQUIRY event for 3 tables 2026-07-10T10:00-14:00."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "GOLD", monthly_fee_cents: 8000, table_discount_pct: 0.20 }
              as: Manager
              captures: { cqp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "cq1@x.com", full_name: "CQ One", plan_id: "${cqp}" }
              as: Manager
              captures: { cqm: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 30, table_type: "POOL_9FT", seat_capacity: 8, hourly_rate_cents: 1200 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 31, table_type: "POOL_9FT", seat_capacity: 8, hourly_rate_cents: 1200 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 32, table_type: "POOL_9FT", seat_capacity: 8, hourly_rate_cents: 1200 }
              as: Manager
            - call: "POST /v1/events"
              payload: { host_member_id: "${cqm}", table_count: 3, start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T14:00:00Z" }
              as: Member
              as_user_id: "${cqm}"
              captures: { cqe: "$.data.id" }
          trigger:
            - call: "POST /v1/events/${cqe}/quote"
              payload: {}
              as: Manager
          assert:
            - "Event.${cqe}.quote_cents == 45600"
            - "Event.${cqe}.deposit_cents == 11400"

      - name: prize_pool_sums_two_captured_entries
        claim_type: Correct Result
        grounds: [calculations.tournament_prize_pool, entities.Tournament.fields.prize_pool_cents]
        distinguishing_aspect: "Two entries at entry_fee 2500 each raise prize_pool_cents to 5000."
        test_recipe:
          setup: ["Tournament entry_fee 2500 REGISTRATION_OPEN; two funded members entered."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { ppp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "pp1@x.com", full_name: "PP One", plan_id: "${ppp}" }
              as: Manager
              captures: { ppm1: "$.data.id" }
            - call: "POST /v1/members/${ppm1}/wallet/adjustments"
              payload: { amount_cents: 10000 }
              as: Manager
            - call: "POST /v1/members"
              payload: { email: "pp2@x.com", full_name: "PP Two", plan_id: "${ppp}" }
              as: Manager
              captures: { ppm2: "$.data.id" }
            - call: "POST /v1/members/${ppm2}/wallet/adjustments"
              payload: { amount_cents: 10000 }
              as: Manager
            - call: "POST /v1/tournaments"
              payload: { name: "PoolCup", format: "SINGLE_ELIM", entry_fee_cents: 2500, max_entries: 8 }
              as: Manager
              captures: { ppt: "$.data.id" }
            - call: "POST /v1/tournaments/${ppt}/open"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${ppt}", member_id: "${ppm1}" }
              as: Member
              as_user_id: "${ppm1}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${ppt}", member_id: "${ppm2}" }
              as: Member
              as_user_id: "${ppm2}"
          assert:
            - "Tournament.${ppt}.prize_pool_cents == 5000"
            - "Tournament.${ppt}.open_slots == 6"

      - name: membership_renew_debits_monthly_fee
        claim_type: Side Effect Execution
        grounds: [calculations.membership_renewal_charge, state_machines.Member.ACTIVE_to_ACTIVE, entities.Member.fields.wallet_credit_cents]
        distinguishing_aspect: "Renewing an ACTIVE member on a 5000-fee plan debits wallet by 5000 and resets no_show_strikes to 0."
        test_recipe:
          setup: ["Funded member on a 5000/mo plan."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "SILVER", monthly_fee_cents: 5000, table_discount_pct: 0.10 }
              as: Manager
              captures: { rnp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "rn1@x.com", full_name: "RN One", plan_id: "${rnp}" }
              as: Manager
              captures: { rnm: "$.data.id" }
            - call: "POST /v1/members/${rnm}/wallet/adjustments"
              payload: { amount_cents: 20000 }
              as: Manager
          trigger:
            - call: "POST /v1/members/${rnm}/renew"
              payload: {}
              as: Member
              as_user_id: "${rnm}"
          assert:
            - "Member.${rnm}.wallet_credit_cents == 15000"
            - "Member.${rnm}.no_show_strikes == 0"

  # =================================================================
  - section: validations
    instances:
      - name: reservation_start_after_end_returns_invalid_window
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "A reservation with start_at >= end_at returns ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["A member and a table."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { vwp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "vw1@x.com", full_name: "VW One", plan_id: "${vwp}" }
              as: Manager
              captures: { vwm: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 40, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { vwt: "$.data.id" }
          trigger:
            - call: "POST /v1/reservations"
              payload: { member_id: "${vwm}", table_id: "${vwt}", start_at: "2026-07-09T12:00:00Z", end_at: "2026-07-09T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { evw: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_INVALID_WINDOW"

      - name: reservation_party_over_capacity_returns_capacity_exceeded
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_CAPACITY_EXCEEDED]", entities.PoolTable.fields.seat_capacity]
        distinguishing_aspect: "With no overlap present, a reservation whose party_size 6 exceeds seat_capacity 4 returns ERR_CAPACITY_EXCEEDED (422) — isolates the constraint check that loses to overlap in the §1.8 priority pair."
        test_recipe:
          setup: ["A member and a seat_capacity-4 table with no existing reservations."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { cep: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "ce9@x.com", full_name: "CE Nine", plan_id: "${cep}" }
              as: Manager
              captures: { cem: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 41, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { cet: "$.data.id" }
          trigger:
            - call: "POST /v1/reservations"
              payload: { member_id: "${cem}", table_id: "${cet}", start_at: "2026-07-09T10:00:00Z", end_at: "2026-07-09T11:00:00Z", party_size: 6 }
              as: FrontDesk
              captures: { ece: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_CAPACITY_EXCEEDED"

      - name: session_close_insufficient_funds
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_INSUFFICIENT_FUNDS]", state_machines.TableSession.OPEN_to_CLOSED]
        distinguishing_aspect: "Closing a session whose final_charge_cents (600) exceeds the member's wallet (100) returns ERR_INSUFFICIENT_FUNDS (402) and does not close the session."
        test_recipe:
          setup: ["Member funded only 100; rate-1200 table; walk-in session (member attached) [17:30,18:00) → final 600."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { ifp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "if1@x.com", full_name: "IF One", plan_id: "${ifp}" }
              as: Manager
              captures: { ifm: "$.data.id" }
            - call: "POST /v1/members/${ifm}/wallet/adjustments"
              payload: { amount_cents: 100 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 42, table_type: "POOL_9FT", seat_capacity: 6, hourly_rate_cents: 1200 }
              as: Manager
              captures: { ift: "$.data.id" }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T17:30:00Z" }
              as: Manager
            - call: "POST /v1/sessions"
              payload: { table_id: "${ift}", member_id: "${ifm}" }
              as: FrontDesk
              captures: { ifs: "$.data.id" }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T18:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /v1/sessions/${ifs}/close"
              payload: {}
              as: FrontDesk
              captures: { eif: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_INSUFFICIENT_FUNDS"
            - "TableSession.${ifs}.status == OPEN"

      - name: suspended_member_cannot_create_reservation
        claim_type: Conditional validation
        grounds: ["validations[priority=15]", "errors[ERR_MEMBER_SUSPENDED]", state_machines.Member.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "After three no-shows suspend a member, a new POST /v1/reservations for that member returns ERR_MEMBER_SUSPENDED (409)."
        test_recipe:
          setup: ["Member suspended via three no-shows at 10-11,12-13,14-15 on 2026-07-02; clock 14:20."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { msp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "ms1@x.com", full_name: "MS One", plan_id: "${msp}" }
              as: Manager
              captures: { msm: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 43, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { mst: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${msm}", table_id: "${mst}", start_at: "2026-07-02T10:00:00Z", end_at: "2026-07-02T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { msr1: "$.data.id" }
            - call: "POST /v1/reservations/${msr1}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/reservations"
              payload: { member_id: "${msm}", table_id: "${mst}", start_at: "2026-07-02T12:00:00Z", end_at: "2026-07-02T13:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { msr2: "$.data.id" }
            - call: "POST /v1/reservations/${msr2}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/reservations"
              payload: { member_id: "${msm}", table_id: "${mst}", start_at: "2026-07-02T14:00:00Z", end_at: "2026-07-02T15:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { msr3: "$.data.id" }
            - call: "POST /v1/reservations/${msr3}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:20:00Z" }
              as: Manager
            - call: "POST /v1/reservations/${msr1}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T12:20:00Z" }
              as: Manager
            - call: "POST /v1/reservations/${msr2}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T14:20:00Z" }
              as: Manager
            - call: "POST /v1/reservations/${msr3}/no-show"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /v1/reservations"
              payload: { member_id: "${msm}", table_id: "${mst}", start_at: "2026-07-11T10:00:00Z", end_at: "2026-07-11T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { ems: "$.data.error_id" }
          assert:
