              captures: { l1_status: "$.data.status", l1_reason: "$.data.quarantine_reason", l1_res: "$.data.reserved_units" }
            - call: "GET /blends/${b1}/components"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { comp_status: "$.data[0].status", comp_units: "$.data[0].units" }
            - call: "GET /blends/${b1}"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { b1_status_1: "$.data.status", b1_alloc_1: "$.data.allocated_units" }
            - call: "POST /blends/${b1}/certify"
              payload: {}
              as: QualityManager
              as_user_id: "qual-002"
              captures: { err: "$.data.error_id" }
          assert:
            - "${l1_status} == QUARANTINED with ${l1_reason} echoed, and ${l1_res} == 9600 - the reservation is frozen, not released"
            - "${comp_status} == ALLOCATED and ${comp_units} == 9600 - quarantine does NOT cascade to components"
            - "${b1_status_0} == ${b1_status_1} == COMPOSED and ${b1_alloc_0} == ${b1_alloc_1} == 9600 - the blend is untouched"
            - "${err} == ERR_LOT_QUARANTINED with HTTP 409 - the cross-entity state is only enforced at the certify gate"

      - name: cascade_down_from_plant_idle_is_covered_by_the_difficulty_design
        claim_type: cascade_down
        grounds:
          - state_machines.Plant.ACTIVE_to_IDLED
        excluded_because:
          difficulty_instance: plant_idle_cascades_four_hops_to_pit_formulation_run_and_clay_ledger
          rationale: "The four-hop parent-to-children cascade (pits SUSPENDED, formulations de-qualified, SETTING runs SCRAPPED, clay released) plus the 3b/4b kiln branch is asserted hop by hop there, including the rule that only non-terminal children are touched. A second breadth test would restate the same assertions with weaker arithmetic."

      - name: conditional_cascade_on_order_cancel_is_covered_by_the_difficulty_design
        claim_type: conditional_cascade
        grounds:
          - state_machines.Order.fulfillment_status.to_CANCELLED
        excluded_because:
          difficulty_instance: order_cancel_cascades_four_hops_to_blend_components_and_lot_inventory
          rationale: "Cancel voids the blend only when it is non-terminal and returns a lot to AVAILABLE only when its reserved_units reaches 0, which is exactly the state-conditional side effect that instance walks across four hops with two lots at different reservation depths."

      - name: compensation_on_blend_reject_is_covered_by_the_difficulty_design
        claim_type: compensation
        grounds:
          - state_machines.ShippedBlend.COMPOSED_to_DRAFT
        excluded_because:
          difficulty_instance: blend_reject_restores_fired_unit_conservation_across_two_lots
          rationale: "Reject is the undo of compose plus every component add; that instance proves each original side effect is reversed with no drift by reconciling fired_units == available_units + reserved_units + consumed_units on both source lots before and after."

      - name: delivered_order_cannot_be_cancelled
        claim_type: terminal_state_lockdown
        grounds:
