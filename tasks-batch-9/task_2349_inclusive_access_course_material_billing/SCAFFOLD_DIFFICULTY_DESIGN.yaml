  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: temporal_overlap_half_open_access_windows_versus_concurrent_title_capacity
        grounds:
          - validations[priority=87]
          - validations[priority=83]
          - entities.Adoption.fields.access_start_date
          - entities.Adoption.fields.access_end_date
          - errors[ERR_CONCURRENT_TITLE_LIMIT]
          - errors[ERR_ACCESS_WINDOW_INVALID]
        distinguishing_aspect: |
          Access windows are half-open [start, end): two adoptions whose windows merely touch
          (2026-10-01 as one's exclusive end and the other's inclusive start) do NOT overlap and both
          may be APPROVED on a section limited to one concurrent title, while a window that shares a
          single interior day is refused. The same instance pins the window's own legality envelope
          (empty window and past-term-end window both rejected).
        test_recipe:
          setup:
            - "Term FA26 OPEN; PUB-A ACTIVE with three tiered titles T1, T5 and T7."
            - "Section CHEM-105-001 has max_concurrent_titles 1 and an APPROVED adoption A on T1 for the half-open window [2026-08-24, 2026-10-01)."
            - "Adoption B on T5 for [2026-10-01, 2026-12-12) - exactly touching A - is SUBMITTED and awaiting approval. The clock stays at 2026-07-05, inside adoption_deadline_date 2026-07-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
