              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /processing-bays"
              payload: { bay_code: "BAY-G1", bay_type: "GENERAL", buffer_minutes: 30 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { bay_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1006", customer_reference: "CUST-6", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-6", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
            - call: "POST /refurb-work-orders"
              payload: { return_line_id: "${line_id}" }
              as: RefurbTechnician
              as_user_id: "u_tech"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /refurb-work-orders/${wo_id}/start-test"
              payload: { bay_id: "${bay_id}", test_window_start_at: "2026-08-02T08:00:00Z", test_window_end_at: "2026-08-02T10:00:00Z" }
              as: RefurbTechnician
              as_user_id: "u_tech"
            - call: "POST /refurb-work-orders/${wo_id}/record-test-result"
              payload: { result: "FAIL", labor_minutes: 10 }
              as: GradingInspector
              as_user_id: "u_qa"
            - call: "POST /refurb-work-orders/${wo_id}/start-test"
              payload: { bay_id: "${bay_id}", test_window_start_at: "2026-08-02T11:00:00Z", test_window_end_at: "2026-08-02T12:00:00Z" }
              as: RefurbTechnician
              as_user_id: "u_tech"
            - call: "POST /refurb-work-orders/${wo_id}/record-test-result"
              payload: { result: "FAIL", labor_minutes: 10 }
              as: GradingInspector
              as_user_id: "u_qa"
            - call: "POST /refurb-work-orders/${wo_id}/start-test"
              payload: { bay_id: "${bay_id}", test_window_start_at: "2026-08-02T13:00:00Z", test_window_end_at: "2026-08-02T14:00:00Z" }
              as: RefurbTechnician
              as_user_id: "u_tech"
            - call: "POST /refurb-work-orders/${wo_id}/record-test-result"
              payload: { result: "FAIL", labor_minutes: 10 }
              as: GradingInspector
              as_user_id: "u_qa"
            - call: "POST /refurb-work-orders/${wo_id}/start-test"
