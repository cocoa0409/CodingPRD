          With H2S 6.0 ppm (limit 4.0) and CO2 5.0 % (limit 2.0) both failing, the pinned
          H2S -> MOISTURE -> CO2 -> HHV order reports offspec_reason H2S, and the volume
          is still computed (123408.912 scf) while the salable energy is forced to 0.000.
