        excluded_because:
          difficulty_instance: combinatorial_formula / assessment_reforecast_four_input_non_linear_composition
          rationale: "The operating cost, reserve recommendation, subsidy offset and billable lot divisor are varied one at a time in the named §1.8 instance."

      - name: corner_assessment_rounding_order_leaves_a_residual
