scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: kst_classify_nfpa_vs_insurer_conservative_on_dust_sample
        grounds:
          - calculations.kst_classify
          - entities.DustSample.fields.sample_class
        distinguishing_aspect: |
          Variant selection is driven by Site.insurer_id prefix: same DustSample
          with kst_bar_m_per_s=175 yields sample_class=ST1 under the default
          `nfpa_standard` variant but sample_class=ST2 under the
          `insurer_conservative` variant (Site.insurer_id startswith "IC-").
          Entity domain: DustSample.
        test_recipe:
          setup:
            - "Two Sites A and B; A has insurer_id 'FM-001' (non-IC), B has insurer_id 'IC-ACME' (IC-prefix)"
            - "Each Site has one DustSample with kst_bar_m_per_s=175, pmax_bar_g=8.5, mie_mj=10"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "Site A", address: "1 A St", ahj_authority: "FM-1", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { site_a: $.data.id }
            - call: "POST /api/sites"
              payload: { name: "Site B", address: "2 B St", ahj_authority: "FM-1", insurer_id: "IC-ACME" }
              as: PlatformAdmin
              captures: { site_b: $.data.id }
            - call: "POST /api/sites/${site_a}/dust-samples"
              payload: { material_name: "wood", kst_bar_m_per_s: 175, pmax_bar_g: 8.5, mie_mj: 10, lab_report_ref: "L-A" }
              as: ComplianceEngineer
              captures: { samp_a: $.data.id }
            - call: "POST /api/sites/${site_b}/dust-samples"
              payload: { material_name: "wood", kst_bar_m_per_s: 175, pmax_bar_g: 8.5, mie_mj: 10, lab_report_ref: "L-B" }
              as: ComplianceEngineer
              captures: { samp_b: $.data.id }
          trigger:
            - call: "GET /api/sites/${site_a}/dust-samples/${samp_a}"
              as: ComplianceEngineer
            - call: "GET /api/sites/${site_b}/dust-samples/${samp_b}"
              as: ComplianceEngineer
          assert:
            - "DustSample.${samp_a}.sample_class == ST1"
            - "DustSample.${samp_b}.sample_class == ST2"
            - "DustSample.${samp_a}.sample_class != DustSample.${samp_b}.sample_class"

      - name: retrofit_contingency_per_line_then_sum_vs_sum_then_round
        grounds:
          - calculations.retrofit_contingency
          - entities.RetrofitProject.fields.contingency_cents
        distinguishing_aspect: |
          Two rounding-order variants produce different contingency_cents for
          identical line items. With LOW-tier lines of 107 and 144 cents,
          `per_line_then_sum` yields contingency_cents=12 while
          `sum_then_round` (applied when Site.insurer_id startswith "IC-")
          yields contingency_cents=13. Entity domain: RetrofitProject —
          different entity domain from the other Rule-1 instance (DustSample).
        test_recipe:
          setup:
            - "Site A (insurer_id=FM-001) -> per_line_then_sum variant"
            - "Site B (insurer_id=IC-ACME) -> sum_then_round variant"
            - "Each site has an Inspection + a CRITICAL finding + a RetrofitProject with trigger_finding_id, budget 100000, and two LOW line items of 107 and 144 cents"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "A", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s_a: $.data.id }
            - call: "POST /api/sites"
              payload: { name: "B", address: "x", ahj_authority: "j", insurer_id: "IC-ACME" }
              as: PlatformAdmin
              captures: { s_b: $.data.id }
            - call: "POST /api/sites/${s_a}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r1", conducted_at: "2026-05-02T00:00:00Z" }
              as: InspectorUser
              captures: { insp_a: $.data.id }
            - call: "POST /api/sites/${s_a}/inspections/${insp_a}/findings"
              payload: { severity: "CRITICAL", description: "f", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
              captures: { f_a: $.data.id }
            - call: "POST /api/sites/${s_a}/retrofit-projects"
              payload: { name: "P", trigger_finding_id: "${f_a}", scope_budget_cents: 100000 }
              as: ComplianceEngineer
              captures: { rp_a: $.data.id }
            - call: "POST /api/sites/${s_a}/retrofit-projects/${rp_a}/line-items"
              payload: { description: "l1", cost_cents: 107, risk_tier: "LOW" }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s_a}/retrofit-projects/${rp_a}/line-items"
              payload: { description: "l2", cost_cents: 144, risk_tier: "LOW" }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s_b}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r1", conducted_at: "2026-05-02T00:00:00Z" }
              as: InspectorUser
              captures: { insp_b: $.data.id }
            - call: "POST /api/sites/${s_b}/inspections/${insp_b}/findings"
              payload: { severity: "CRITICAL", description: "f", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
              captures: { f_b: $.data.id }
            - call: "POST /api/sites/${s_b}/retrofit-projects"
              payload: { name: "P", trigger_finding_id: "${f_b}", scope_budget_cents: 100000 }
              as: ComplianceEngineer
              captures: { rp_b: $.data.id }
            - call: "POST /api/sites/${s_b}/retrofit-projects/${rp_b}/line-items"
              payload: { description: "l1", cost_cents: 107, risk_tier: "LOW" }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s_b}/retrofit-projects/${rp_b}/line-items"
              payload: { description: "l2", cost_cents: 144, risk_tier: "LOW" }
              as: ComplianceEngineer
          trigger:
            - call: "GET /api/sites/${s_a}/retrofit-projects/${rp_a}"
              as: ComplianceEngineer
            - call: "GET /api/sites/${s_b}/retrofit-projects/${rp_b}"
              as: ComplianceEngineer
          assert:
            - "RetrofitProject.${rp_a}.estimated_cost_cents == 251"
            - "RetrofitProject.${rp_b}.estimated_cost_cents == 251"
            - "RetrofitProject.${rp_a}.contingency_cents == 12"
            - "RetrofitProject.${rp_b}.contingency_cents == 13"
            - "RetrofitProject.${rp_a}.total_projected_cents == 263"
            - "RetrofitProject.${rp_b}.total_projected_cents == 264"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dha_risk_score_per_dust_then_collector_then_aggregate_rounding
        grounds:
          - calculations.dha_risk_score
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. Per-dust
          sub-scores are rounded to 2dp half-up individually BEFORE being
          summed; per-collector sub-scores are also rounded per collector
          BEFORE being summed; final aggregate is not re-rounded. Scaffold
          pins this exact order in the formula prose. Two ST-class dusts
          (ST1 mie=1.5, ST2 mie=2.25) and one IN_SERVICE collector with
          filter_change_due=true, dp_trend=RISING, vent_adequate=false
          yield risk_score=58.25 — not 58 (round-once-at-end) and not 58.26.
        test_recipe:
          setup:
            - "Site with one ST1 dust (kst=100, mie=1.5) and one ST2 dust (kst=250, mie=2.25)"
            - "One Collector in IN_SERVICE status with filter_change_due=true (driven by DP>=6.0), dp_trend=RISING (last 3 readings rising by >=1.5), vent_adequate=false (installed < required)"
            - "DHA linking both dusts"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d1", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 1.5, lab_report_ref: "L1" }
              as: ComplianceEngineer
              captures: { samp1: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d2", kst_bar_m_per_s: 250, pmax_bar_g: 8, mie_mj: 2.25, lab_report_ref: "L2" }
              as: ComplianceEngineer
              captures: { samp2: $.data.id }
            # Collector sized such that required_vent_area_m2 > installed (inadequate).
            # Use kst=100 sample (samp1) and small installed_vent_area -> inadequate.
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "DC-1", dust_sample_id: "${samp1}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 8, installed_vent_area_m2: 10 }
              as: ComplianceEngineer
              captures: { col: $.data.id }
            # commission requires vent_adequate -> pre-patch installed to large value then commission then patch back down
            - call: "PATCH /api/sites/${s}/collectors/${col}"
              payload: { installed_vent_area_m2: 500 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/commission"
              payload: {}
              as: ComplianceEngineer
            - call: "PATCH /api/sites/${s}/collectors/${col}"
              payload: { installed_vent_area_m2: 10 }
              as: ComplianceEngineer
            # push dp readings to set dp_trend=RISING and filter_change_due=true
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 3.0 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 4.0 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 5.5 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 6.5 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/dhas"
              payload: { title: "T", author_id: "eng-1" }
              as: ComplianceEngineer
              captures: { dha: $.data.id }
            - call: "POST /api/sites/${s}/dhas/${dha}/samples/${samp1}"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/dhas/${dha}/samples/${samp2}"
              as: ComplianceEngineer
          trigger:
            - call: "GET /api/sites/${s}/dhas/${dha}"
              as: ComplianceEngineer
          assert:
            - "DHA.${dha}.kst_class_highest == ST2"
            - "DHA.${dha}.risk_score == 58.25"

      - name: explosion_protection_design_min_max_conditional_branch
        grounds:
          - calculations.explosion_protection_design
        distinguishing_aspect: |
          Mode (a) — non-linear interaction with nested min/max and conditional
          variant branching on internal_volume_m3 > 25. Same Kst=200, Pmax=9,
          but V=10 yields required_vent_area_m2=269.776 (prescriptive) while
          V=30 yields required_vent_area_m2=673.388 (performance_based
          variant applies a 1.20 multiplier on top of the prescriptive
          561.157). Different mode from the other Rule-2 instance (which is
          mode (b) nested rounding).
        test_recipe:
          setup:
            - "One Site, one DustSample Kst=200 Pmax=9 mie=10"
            - "Two Collectors: small (V=10) and large (V=30)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "k", kst_bar_m_per_s: 200, pmax_bar_g: 9.0, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "DC-small", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 10, installed_vent_area_m2: 0 }
              as: ComplianceEngineer
              captures: { col_small: $.data.id }
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "DC-large", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 30, installed_vent_area_m2: 0 }
              as: ComplianceEngineer
              captures: { col_large: $.data.id }
          trigger:
            - call: "GET /api/sites/${s}/collectors/${col_small}"
              as: ComplianceEngineer
            - call: "GET /api/sites/${s}/collectors/${col_large}"
              as: ComplianceEngineer
          assert:
            - "Collector.${col_small}.required_vent_area_m2 == 269.776"
            - "Collector.${col_small}.pred_max_bar_g == 1.066"
            - "Collector.${col_large}.required_vent_area_m2 == 673.388"
            - "Collector.${col_large}.pred_max_bar_g == 1.066"
            - "Collector.${col_small}.vent_adequate == false"
            - "Collector.${col_large}.vent_adequate == false"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dha_revision_cycle_draft_to_rejected_and_back
        grounds:
          - state_machines.DHA
        distinguishing_aspect: |
          DHA exhibits a revision cycle DRAFT -> SUBMITTED -> REJECTED ->
          DRAFT -> SUBMITTED -> APPROVED. After one full cycle the entity
          returns to a previously-visited state (DRAFT) and proceeds to
          terminal APPROVED on the second pass — a cycle on the DHA entity.
        test_recipe:
          setup:
            - "Site with a combustible DustSample; one DHA authored by eng-1 linked to the sample"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/dhas"
              payload: { title: "T", author_id: "eng-1" }
              as: ComplianceEngineer
              captures: { dha: $.data.id }
            - call: "POST /api/sites/${s}/dhas/${dha}/samples/${samp}"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/dhas/${dha}/submit"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/dhas/${dha}/reject"
              as: ComplianceManager
            - call: "POST /api/sites/${s}/dhas/${dha}/revise"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/dhas/${dha}/submit"
              as: ComplianceEngineer
            - call: "GET /api/sites/${s}"
              as: ComplianceManager
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /api/sites/${s}/dhas/${dha}/approve"
              payload: { expected_site_version: "${site_v}" }
              as: ComplianceManager
          assert:
            - "DHA.${dha}.status == APPROVED"
            - "DHA.${dha}.approver_id is not null"

      - name: incident_reopen_after_close
        grounds:
          - state_machines.Incident
        distinguishing_aspect: |
          Incident exhibits a reopen cycle CLOSED -> REOPENED ->
          INVESTIGATING. Distinct entity from DHA. After terminal-ish CLOSED
          the incident can be reopened and re-driven through the
          investigation pipeline.
        test_recipe:
          setup:
            - "Site with one Incident that has been fully closed (CAPA closed)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/incidents"
              payload: { occurred_at: "2026-05-01T10:00:00Z", kind: "NEAR_MISS", description: "d", severity: "MINOR", root_cause_code: "HOUSEKEEPING", investigation_lead_id: "inv-1" }
              as: ComplianceManager
              captures: { inc: $.data.id }
            - call: "POST /api/sites/${s}/incidents/${inc}/start_investigation"
              as: IncidentInvestigator
            - call: "POST /api/sites/${s}/incidents/${inc}/capa-actions"
              payload: { description: "a", owner_id: "inv-1", due_at: "2026-06-01T00:00:00Z" }
              as: IncidentInvestigator
              captures: { capa: $.data.id }
            - call: "POST /api/sites/${s}/incidents/${inc}/capa-actions/${capa}/start"
              as: IncidentInvestigator
            - call: "POST /api/sites/${s}/incidents/${inc}/capa-actions/${capa}/close"
              as: IncidentInvestigator
            - call: "POST /api/sites/${s}/incidents/${inc}/define_capa"
              as: IncidentInvestigator
            - call: "POST /api/sites/${s}/incidents/${inc}/close"
              as: ComplianceManager
          trigger:
            - call: "POST /api/sites/${s}/incidents/${inc}/reopen"
              as: ComplianceManager
            - call: "POST /api/sites/${s}/incidents/${inc}/start_investigation"
              as: IncidentInvestigator
          assert:
            - "Incident.${inc}.status == INVESTIGATING"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dp_reading_to_alarm_to_collector_filter_due_to_site_posture
        grounds:
          - state_machines.Collector
          - calculations.dp_trend_derivation
          - calculations.site_posture_derivation
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /dp-readings: (1) DPReading
          appends -> Collector.dp_current_inwc, dp_trend, filter_change_due
          recompute; (2) Collector's updated derived fields feed
          dha_risk_score which mutates DHA.risk_score; (3) Site.posture
          recomputes when Collector state or findings change. Originates
          from a DPReading trigger.
        test_recipe:
          setup:
            - "Site with one combustible sample and one IN_SERVICE collector linked"
            - "DHA linked to the sample"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "DC", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 8, installed_vent_area_m2: 500 }
              as: ComplianceEngineer
              captures: { col: $.data.id }
            - call: "POST /api/sites/${s}/collectors/${col}/commission"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/dhas"
              payload: { title: "T", author_id: "eng-1" }
              as: ComplianceEngineer
              captures: { dha: $.data.id }
            - call: "POST /api/sites/${s}/dhas/${dha}/samples/${samp}"
              as: ComplianceEngineer
            - call: "GET /api/sites/${s}/dhas/${dha}"
              as: ComplianceEngineer
              captures: { risk_before: $.data.risk_score }
          trigger:
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 2.0 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 3.5 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 6.5 }
              as: ComplianceEngineer
          assert:
            - "Collector.${col}.dp_trend == ALARM_HIGH"
            - "Collector.${col}.filter_change_due == true"
            - "DHA.${dha}.risk_score > ${risk_before}"
            - "Site.${s}.updated_at has advanced after each dp-reading"

      - name: overdue_housekeeping_audit_cascades_to_posture_change
        grounds:
          - state_machines.HousekeepingAudit
          - calculations.housekeeping_schedule
          - calculations.site_posture_derivation
          - calculations.overdue_housekeeping_counter
        distinguishing_aspect: |
          Depth-2 cascade triggered by clock advance: (1) clock crosses
          audit's scheduled_for + frequency_hours -> HousekeepingAudit
          auto-transitions SCHEDULED -> OVERDUE and increments
          Site.open_overdue_housekeeping; (2) the incremented counter feeds
          site_posture_derivation -> Site.posture mutates CONDITIONAL ->
          DEFICIENT when penalties accumulate. Different triggering
          transition from the DP cascade (clock vs dp-readings).
        test_recipe:
          setup:
            - "Site with HousekeepingProgram frequency_hours=24; one audit scheduled for T0+1h, never recorded"
            - "Site posture starts CONDITIONAL (100 score minus 0 = CONDITIONAL default; we push it over via pre-existing condition) — instead we validate the open_overdue_housekeeping counter and posture drop via a second mechanism: the audit becoming overdue directly bumps the counter, and we assert the counter then recompute posture explicitly"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/housekeeping-programs"
              payload: { name: "HKP", target_accumulation_g_per_m2: 1.0, frequency_hours: 24 }
              as: ComplianceEngineer
              captures: { prog: $.data.id }
            - call: "POST /api/sites/${s}/housekeeping-programs/${prog}/audits"
              payload: { auditor_id: "aud-1", measured_accumulation_g_per_m2: 0.5, scheduled_for: "2026-05-02T00:00:00Z" }
              as: HousekeepingAuditor
              captures: { aud: $.data.id }
            # Advance clock past scheduled_for + frequency_hours -> OVERDUE
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites/${s}/recompute_posture"
              as: PlatformAdmin
          trigger:
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
            - call: "GET /api/sites/${s}/housekeeping-programs/${prog}/audits/${aud}"
              as: ComplianceEngineer
          assert:
            - "HousekeepingAudit.${aud}.status == OVERDUE"
            - "Site.${s}.open_overdue_housekeeping == 1"
            - "Site.${s}.posture_score == 90"
            - "Site.${s}.posture == COMPLIANT"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_stop_work_state_vs_business_safety_vent_undersized
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair: state (priority 7, ERR_POSTURE_STOP_WORK) vs
          business_safety (priority 8, ERR_VENT_UNDERSIZED). A commission
          call against a Site in STOP_WORK AND with vent_adequate==false
          MUST return ERR_POSTURE_STOP_WORK (the higher-priority state
          category), not ERR_VENT_UNDERSIZED.
        test_recipe:
          setup:
            - "Site with two OPEN CRITICAL findings (drives posture=STOP_WORK)"
            - "Collector with installed_vent_area_m2 < required_vent_area_m2 (vent_adequate=false)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 200, pmax_bar_g: 9, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "DC", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 10, installed_vent_area_m2: 1 }
              as: ComplianceEngineer
              captures: { col: $.data.id }
            - call: "POST /api/sites/${s}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r", conducted_at: "2026-05-01T00:00:00Z" }
              as: InspectorUser
              captures: { insp: $.data.id }
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "CRITICAL", description: "f1", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "CRITICAL", description: "f2", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
            # Site.posture should now be STOP_WORK via derived posture
            - call: "POST /api/sites/${s}/recompute_posture"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/sites/${s}/collectors/${col}/commission"
              as: ComplianceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POSTURE_STOP_WORK"
            - "error_id != ERR_VENT_UNDERSIZED"

      - name: permit_window_inactive_vs_permit_overlap_business_safety_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair: business_safety at priority 10
          (ERR_PERMIT_WINDOW_INACTIVE — permit window not currently active)
          vs business_safety at priority 12 (ERR_PERMIT_OVERLAP — overlapping
          permit already IN_PROGRESS). When both would trigger, the
          window-inactive error wins because it has higher priority within
          the business_safety ordering. Distinct error-category pair from
          the other Rule-5 instance.
        test_recipe:
          setup:
            - "Site with posture != STOP_WORK"
            - "Permit A already IN_PROGRESS with window [T0, T0+4h)"
            - "Permit B with window [T0+2h, T0+6h) (would overlap A) BUT current clock has advanced to T0+7h (B's window is no longer active)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "A", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-01T04:00:00Z", fire_watch_minutes_after: 60 }
              as: SafetyManager
              captures: { perm_a: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "B", issuer_id: "sm-1", performer_id: "hp-2", valid_from: "2026-05-01T02:00:00Z", valid_to: "2026-05-01T06:00:00Z", fire_watch_minutes_after: 60 }
              as: SafetyManager
              captures: { perm_b: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits/${perm_a}/start"
              as: HotWorkPerformer
              as_user_id: "hp-1"
            # Advance clock to 07:00 — past B's valid_to (06:00)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/sites/${s}/hot-work-permits/${perm_b}/start"
              as: HotWorkPerformer
              as_user_id: "hp-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERMIT_WINDOW_INACTIVE"
            - "error_id != ERR_PERMIT_OVERLAP"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: kst_boundary_200_inclusive_lower_band
        grounds:
          - calculations.kst_classify
          - entities.DustSample.fields.sample_class
        distinguishing_aspect: |
          Boundary on numeric Kst metric via POST /dust-samples: kst=200
          MUST be classified ST1 (because the formula uses <= for the lower
          band). kst=201 (just over) MUST be ST2. Same endpoint, same
          metric — but the boundary precision is load-bearing.
        test_recipe:
          setup: ["Empty site"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d200", kst_bar_m_per_s: 200, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L1" }
              as: ComplianceEngineer
              captures: { samp_200: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d201", kst_bar_m_per_s: 201, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L2" }
              as: ComplianceEngineer
              captures: { samp_201: $.data.id }
          assert:
            - "DustSample.${samp_200}.sample_class == ST1"
            - "DustSample.${samp_201}.sample_class == ST2"

      - name: hot_work_permit_empty_collection_zero_count
        grounds:
          - calculations.site_posture_derivation
          - entities.Site.fields.hot_work_in_progress
        distinguishing_aspect: |
          Boundary on a different metric (empty-collection / zero-count
          edge) via a different endpoint family. When no hot-work permits
          exist on a Site (empty set), hot_work_in_progress MUST be exactly
          0 and contribute 0 penalty. After the first permit starts and
          closes, the counter must return to exactly 0 (not negative, not
          stale at 1). Distinct metric (count, not numeric Kst) and
          distinct endpoint (hot-work permit lifecycle, not dust-samples).
        test_recipe:
          setup:
            - "Site, one permit issued and started and closed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "W", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-01T02:00:00Z", fire_watch_minutes_after: 30 }
              as: SafetyManager
              captures: { perm: $.data.id }
          trigger:
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { hw_initial: $.data.hot_work_in_progress }
            - call: "POST /api/sites/${s}/hot-work-permits/${perm}/start"
              as: HotWorkPerformer
              as_user_id: "hp-1"
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { hw_during: $.data.hot_work_in_progress }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T03:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites/${s}/hot-work-permits/${perm}/close"
              as: HotWorkPerformer
              as_user_id: "hp-1"
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { hw_after: $.data.hot_work_in_progress }
          assert:
            - "hot_work_in_progress initial == 0"
            - "hot_work_in_progress during == 1"
            - "hot_work_in_progress after == 0"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: collector_take_out_blocked_by_open_hotwork_permit
        grounds:
          - state_machines.Collector.transitions
          - state_machines.HotWorkPermit
        distinguishing_aspect: |
          Collector -> HotWorkPermit pair: Collector.take_out_of_service
          requires that no HotWorkPermit referencing this collector is in
          ISSUED or IN_PROGRESS state. Distinct entity pair from the other
          Rule-7 instance.
        test_recipe:
          setup:
            - "Site with IN_SERVICE collector"
            - "One HotWorkPermit referencing the collector, status IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "DC", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 8, installed_vent_area_m2: 500 }
              as: ComplianceEngineer
              captures: { col: $.data.id }
            - call: "POST /api/sites/${s}/collectors/${col}/commission"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { collector_id: "${col}", work_description: "W", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-01T04:00:00Z", fire_watch_minutes_after: 60 }
              as: SafetyManager
              captures: { perm: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits/${perm}/start"
              as: HotWorkPerformer
              as_user_id: "hp-1"
          trigger:
            - call: "POST /api/sites/${s}/collectors/${col}/take_out_of_service"
              as: ComplianceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COLLECTOR_BUSY"
            - "Collector.${col}.status == IN_SERVICE"

      - name: retrofit_approve_blocked_by_trigger_finding_state
        grounds:
          - state_machines.RetrofitProject
          - state_machines.InspectionFinding
        distinguishing_aspect: |
          RetrofitProject -> InspectionFinding pair: approve requires
          trigger_finding_id to reference a CRITICAL finding in
          OPEN/IN_PROGRESS/RESOLVED. Distinct entity pair from the other
          Rule-7 instance.
        test_recipe:
          setup:
            - "Site with Inspection + OBSERVATION-severity finding (not CRITICAL) linked as trigger_finding_id"
            - "RetrofitProject with one line item, already finalize_estimate'd (state ESTIMATED)"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r", conducted_at: "2026-05-01T00:00:00Z" }
              as: InspectorUser
              captures: { insp: $.data.id }
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "OBSERVATION", description: "obs", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
              captures: { f: $.data.id }
            - call: "POST /api/sites/${s}/retrofit-projects"
              payload: { name: "P", trigger_finding_id: "${f}", scope_budget_cents: 100000 }
              as: ComplianceEngineer
              captures: { rp: $.data.id }
            - call: "POST /api/sites/${s}/retrofit-projects/${rp}/line-items"
              payload: { description: "l", cost_cents: 1000, risk_tier: "LOW" }
              as: ComplianceEngineer
            - call: "GET /api/sites/${s}/retrofit-projects/${rp}"
              as: ComplianceEngineer
              captures: { rp_v: $.data.version }
            - call: "POST /api/sites/${s}/retrofit-projects/${rp}/finalize_estimate"
              payload: { expected_project_version: "${rp_v}" }
              as: ComplianceEngineer
          trigger:
            - call: "POST /api/sites/${s}/retrofit-projects/${rp}/approve"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRIGGER_FINDING_INVALID"
            - "RetrofitProject.${rp}.status == ESTIMATED"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: hot_work_permit_window_half_open_overlap_rejection
        grounds:
          - validations[priority=12]
          - entities.HotWorkPermit
        distinguishing_aspect: |
          Interval semantics: half-open [valid_from, valid_to). A permit
          starting exactly at the previous permit's valid_to does NOT
          overlap (boundary-exclusive). Overlap is rejected only when
          another permit is IN_PROGRESS AND intervals intersect under
          half-open semantics. Resource: HotWorkPermit on a Site.
        test_recipe:
          setup:
            - "Permit A IN_PROGRESS with window [00:00, 04:00)"
            - "Permit B window [04:00, 08:00) — boundary-adjacent (no overlap under half-open)"
            - "Permit C window [03:00, 07:00) — overlaps A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "A", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-01T04:00:00Z", fire_watch_minutes_after: 30 }
              as: SafetyManager
              captures: { perm_a: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "B", issuer_id: "sm-1", performer_id: "hp-2", valid_from: "2026-05-01T04:00:00Z", valid_to: "2026-05-01T08:00:00Z", fire_watch_minutes_after: 30 }
              as: SafetyManager
              captures: { perm_b: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "C", issuer_id: "sm-1", performer_id: "hp-3", valid_from: "2026-05-01T03:00:00Z", valid_to: "2026-05-01T07:00:00Z", fire_watch_minutes_after: 30 }
              as: SafetyManager
              captures: { perm_c: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits/${perm_a}/start"
              as: HotWorkPerformer
              as_user_id: "hp-1"
          trigger:
            - call: "POST /api/sites/${s}/hot-work-permits/${perm_c}/start"
              as: HotWorkPerformer
              as_user_id: "hp-3"
              captures: { err_c: $.data.error_id }
            # advance clock to 04:00 then start B (A is still IN_PROGRESS but B does not overlap)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites/${s}/hot-work-permits/${perm_b}/start"
              as: HotWorkPerformer
              as_user_id: "hp-2"
          assert:
            - "Permit C start returned error_id == ERR_PERMIT_OVERLAP"
            - "Permit B start succeeded (status == IN_PROGRESS) — half-open adjacency allowed"
            - "HotWorkPermit.${perm_b}.status == IN_PROGRESS"

      - name: housekeeping_audit_scheduling_aggregate_capacity
        grounds:
          - calculations.housekeeping_schedule
          - entities.HousekeepingAudit
        distinguishing_aspect: |
          Different interval semantics from the hot-work instance: this is
          an aggregate-capacity recurrence, not a pairwise overlap. The
          program enforces one audit per `frequency_hours` window — when
          the last_audit_at is set, the next_due_at = last_audit_at +
          frequency_hours, and an audit recorded before its scheduled_for
          is rejected. This is recurrence-window arithmetic, not pairwise
          half-open overlap detection. Resource: HousekeepingProgram
          schedule (different entity from HotWorkPermit).
        test_recipe:
          setup:
            - "HousekeepingProgram frequency_hours=24"
            - "Audit scheduled for future time (relative to clock)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/housekeeping-programs"
              payload: { name: "P", target_accumulation_g_per_m2: 1.0, frequency_hours: 24 }
              as: ComplianceEngineer
              captures: { prog: $.data.id }
            - call: "POST /api/sites/${s}/housekeeping-programs/${prog}/audits"
              payload: { auditor_id: "aud-1", measured_accumulation_g_per_m2: 0.5, scheduled_for: "2026-05-03T00:00:00Z" }
              as: HousekeepingAuditor
              captures: { aud: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/housekeeping-programs/${prog}/audits/${aud}/record"
              as: HousekeepingAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AUDIT_NOT_DUE"
            - "HousekeepingAudit.${aud}.status == SCHEDULED"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hot_work_counter_invariant_under_start_close
        grounds:
          - state_machines.HotWorkPermit
          - entities.Site.fields.hot_work_in_progress
        distinguishing_aspect: |
          Conserved quantity: Site.hot_work_in_progress. For every permit
          that transitions ISSUED->IN_PROGRESS (forward), the matching
          IN_PROGRESS->CLOSED (compensating) decrements the counter by the
          same amount. Invariant: hot_work_in_progress_final ==
          hot_work_in_progress_initial after any matched (start, close)
          pair. Verified across N=3 start/close cycles.
        test_recipe:
          setup:
            - "Site, clock at T0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { hw0: $.data.hot_work_in_progress }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "W1", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-01T01:00:00Z", fire_watch_minutes_after: 30 }
              as: SafetyManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/hot-work-permits/${p1}/start"
              as: HotWorkPerformer
              as_user_id: "hp-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites/${s}/hot-work-permits/${p1}/close"
              as: HotWorkPerformer
              as_user_id: "hp-1"
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { hw1: $.data.hot_work_in_progress }
          assert:
            - "Site.hot_work_in_progress initial == 0"
            - "Site.hot_work_in_progress final == 0"
            - "hot_work_in_progress after close == hot_work_in_progress before start"

      - name: critical_finding_counter_invariant_under_resolve_and_reopen
        grounds:
          - state_machines.InspectionFinding
          - entities.Site.fields.open_critical_findings
        distinguishing_aspect: |
          Different conserved quantity: Site.open_critical_findings. The
          forward action IN_PROGRESS->RESOLVED decrements by 1 when
          severity==CRITICAL; the compensating RESOLVED->REOPENED
          increments by 1. Invariant: counter returns to its pre-pair
          value. Distinct quantity from hot_work_in_progress.
        test_recipe:
          setup:
            - "Site with one CRITICAL finding"
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-001" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r", conducted_at: "2026-05-01T00:00:00Z" }
              as: InspectorUser
              captures: { insp: $.data.id }
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "CRITICAL", description: "f", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
              captures: { f: $.data.id }
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { crit0: $.data.open_critical_findings }
          trigger:
            - call: "POST /api/sites/${s}/inspections/${insp}/findings/${f}/start_work"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/inspections/${insp}/findings/${f}/resolve"
              as: ComplianceEngineer
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { crit_mid: $.data.open_critical_findings }
            - call: "POST /api/sites/${s}/inspections/${insp}/findings/${f}/reopen"
              as: ComplianceManager
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
              captures: { crit_final: $.data.open_critical_findings }
          assert:
            - "open_critical_findings initial == 1"
            - "open_critical_findings after resolve == 0"
