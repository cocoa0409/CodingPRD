            - "data.cube_utilization_pct == 2.30 (round_half_up(11.51 / 500 x 100, 2) == round_half_up(2.302, 2))"
            - "data.package_count == 1 and data.load_status == LOADING"
            - "SortCenter.${center_id}.wip_package_count == 99 and DestinationLane.${lane_id}.sorted_package_count == 1"

      - name: corner_calc_variant_divergence_cost_per_package
        claim_type: Variant Divergence
        grounds:
          - calculations.cost_per_package.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / shift_plan_cost_per_package_provisional_vs_final
          rationale: "Both variants on identical data plus the exact delta are asserted by the named §1.8 instance."

      - name: corner_calc_variant_selection_cost_per_package
        claim_type: Variant Selection
        grounds:
          - calculations.cost_per_package.trigger
        excluded_because:
          difficulty_instance: dual_variant_calc / shift_plan_cost_per_package_provisional_vs_final
          rationale: "PROVISIONAL at approve and FINAL at close is the selection contract the named §1.8 instance drives."

      - name: corner_calc_reconciliation_on_variant_switch
        claim_type: Reconciliation
        grounds:
          - calculations.cost_per_package
        excluded_because:
          difficulty_instance: dual_variant_calc / shift_plan_cost_per_package_provisional_vs_final
          rationale: "The 10.00 cent delta written when the plan closes is exactly the reconciliation asserted there."

      - name: corner_calc_weighted_scoring_attrition
        claim_type: weighted_scoring
        grounds:
          - calculations.attrition_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / worker_attrition_cohort_baseline_vs_individual_observed
          rationale: "Weight composition, the basis flip at the third completion and the flag threshold are all in the named §1.8 instance."

      - name: corner_calc_interval_merge_door_windows
        claim_type: interval_merge
        grounds:
          - calculations.door_interval_conflict
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dock_door_buffered_intervals_treat_adjacency_as_conflict
          rationale: "Adjacent, overlapping and disjoint buffered door intervals are enumerated by the named §1.8 instance."

      - name: corner_calc_interval_merge_chute_concurrency
        claim_type: interval_merge
        grounds:
          - calculations.chute_concurrency_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / chute_half_open_intervals_allow_two_concurrent_destinations
          rationale: "Half-open chute windows, the aggregate cap and touching windows are the named §1.8 instance."

      - name: corner_calc_constraint_propagation_flex_premium
        claim_type: constraint_propagation
        grounds:
          - calculations.planned_labor_cost
        excluded_because:
          difficulty_instance: combinatorial_formula / planned_labor_flex_premium_evaluation_order
          rationale: "The pinned draw-then-ratio-then-premium chain reaching a fixed point is the named §1.8 instance."

      - name: corner_calc_aggregation_running_cube_total
        claim_type: aggregation
        grounds:
          - calculations.cube_consumption
        excluded_because:
          difficulty_instance: combinatorial_formula / cube_consumption_per_line_rounding_then_sum
          rationale: "Per-line rounding, the running total and the ceiling comparison are asserted by the named §1.8 instance."

      - name: corner_calc_forward_looking_provisional_inputs
        claim_type: forward_looking
        grounds:
          - calculations.cost_per_package
        excluded_because:
          difficulty_instance: non_linear_state_machine / shift_plan_branching_fork_and_revision_cycle
          rationale: "Re-evaluation of the forward-looking provisional figure after a revision changes forecast_volume is asserted there."

  # ===================================================================
  # 4. Validations
  # ===================================================================
  - section: validations
    instances:
      - name: non_positive_windows_return_invalid_time_window
        claim_type: Violation → Error
        grounds:
          - validations.11_ERR_INVALID_TIME_WINDOW
          - endpoints.POST_/sortation/trailer-appointments
          - endpoints.POST_/sortation/chute-assignments
        distinguishing_aspect: "window_end must be STRICTLY after window_start: an equal-instant appointment window and an inverted chute-assignment window both fail at priority 11, before any door or concurrency rule is consulted."
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1, chute C1 and lane L-WEST"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id, chute_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_id: $.data.id }
          trigger:
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_id}", trailer_code: "T-ZERO", window_start: "2026-08-03T07:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 100 }
              as: InboundCoordinator
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_id}", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T06:00:00Z", expected_chute_version: "${chute_v}" }
              as: SortSupervisor
          assert:
            - "both calls return HTTP 422 with data.error_id == ERR_INVALID_TIME_WINDOW"
            - "no TrailerAppointment and no ChuteAssignment row is created"
            - "SortChute.${chute_id}.version stays ${chute_v} - a refused assignment does not consume the OCC version"
            - "DestinationLane.${lane_id}.assigned_capacity_pph stays 0"

      - name: duplicate_resource_codes_are_center_scoped
        claim_type: Violation → Error
        grounds:
          - validations.12_ERR_DUPLICATE_FACILITY_RESOURCE
          - entities.SortChute.fields.chute_number
          - entities.ShiftPlan.fields.shift_date
        distinguishing_aspect: "Uniqueness is scoped to the center: chute number C1 collides inside SC1 but is legal in SC2, while a second non-REJECTED plan for the same center and shift_date also collides."
        test_recipe:
          setup:
            - "Center SC1 with chute C1 and a DRAFT plan for 2026-08-03; center SC2 with no chutes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center1_id: $.data.id }
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC2", name: "Nashville Sort 2", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center2_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center1_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center1_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /sortation/sort-centers/${center1_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1800 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center2_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1800 }
              as: FacilityAdmin
              captures: { chute_sc2_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center1_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 5000, planned_core_headcount: 5, planned_seasonal_headcount: 0, labor_budget_cents: 200000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1 Again", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
          assert:
            - "the duplicate C1 inside SC1 returns HTTP 409 with data.error_id == ERR_DUPLICATE_FACILITY_RESOURCE"
            - "C1 inside SC2 returns HTTP 201 with data.throughput_pph == 1800 - chute_number is unique per center only"
            - "the second plan for 2026-08-03 returns HTTP 409 with data.error_id == ERR_DUPLICATE_FACILITY_RESOURCE and ShiftPlan.${plan_id} is untouched in DRAFT"
            - "the duplicate SortCenter.code SC1 returns HTTP 409 with data.error_id == ERR_DUPLICATE_FACILITY_RESOURCE"
            - "GET /sortation/sort-centers/${center1_id}/sort-chutes returns total_count == 1"

      - name: trailer_code_frees_up_once_the_trailer_is_unloaded
        claim_type: Satisfaction → Pass
        grounds:
          - validations.13_ERR_DUPLICATE_TRAILER_CODE
          - state_machines.TrailerAppointment.UNLOADING_to_UNLOADED
        distinguishing_aspect: "The trailer-code lock is state-scoped, not permanent: T-A is refused while the first appointment is live and accepted again once that appointment reaches UNLOADED."
        test_recipe:
          setup:
            - "Center SC1 with inbound doors IN-1 and IN-2 (separate doors so no door-window rule can fire first) and one SCHEDULED appointment T-A on IN-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
