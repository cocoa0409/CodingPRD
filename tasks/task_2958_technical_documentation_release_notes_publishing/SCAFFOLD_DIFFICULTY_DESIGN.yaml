              as: DocsLead
              captures: { pi_a: $.data.id }
            - call: "POST /plan-items/${pi_a}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-second", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_b: $.data.id }
          trigger:
            - call: "POST /plan-items/${pi_b}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-14", window_end_date: "2026-08-26" }
              as: DocsLead
              captures: { err_touch: "$.data.error_id" }
            - call: "POST /plan-items/${pi_b}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-15", window_end_date: "2026-08-26" }
              as: DocsLead
              captures: { err_gap1: "$.data.error_id" }
            - call: "POST /plan-items/${pi_b}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-16", window_end_date: "2026-08-26" }
              as: DocsLead
              captures: { accepted_start: $.data.window_start_date }
          assert:
            - "${err_touch} == ERR_WRITER_WINDOW_OVERLAP with HTTP 409 — touching windows still collide because of the leading buffer"
            - "${err_gap1} == ERR_WRITER_WINDOW_OVERLAP with HTTP 409 — a one-day gap is still inside HANDOFF_BUFFER_DAYS (2)"
            - "${accepted_start} == 2026-08-16 and DocPlanItem.${pi_b}.status == ASSIGNED with load_points 26.00 — a gap of exactly 2 days is admitted"
            - "Writer.${w1_id}.committed_load_points == 52.00 and assignment_count == 2 after the accepted attempt"
            - "after the two rejected attempts and before the accepted one, Writer.${w1_id}.committed_load_points was still 26.00 with assignment_count 1"
            - "DocPlanItem.${pi_a}.window_end_date is still 2026-08-14 (never mutated by the failed attempts)"

