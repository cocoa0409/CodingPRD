          assert:
            - "ProcessingJob.${j2_id}.unique_count == 0"
            - "ProcessingJob.${j2_id}.duplicate_count == 1"

      - name: ack_after_deadline_not_on_time
        claim_type: Constants Applied
        grounds: ["entities.HoldAcknowledgement.fields.on_time", "state_machines.HoldAcknowledgement.PENDING_to_ACKNOWLEDGED"]
        distinguishing_aspect: "Acknowledging one second after ack_deadline (clock 2026-06-10T00:00:01Z) sets on_time=false, the strict complement of the inclusive boundary §1.8 covers."
        test_recipe:
          setup: ["hold ISSUED ack_deadline 2026-06-10T00:00:00Z; clock at 2026-06-10T00:00:01Z"]
          setup_api_calls:
            - call: "POST /matters"
