scenario: |
  Generate task harder than expert level!

  2620. Domain Name Dispute Resolution (domain dispute resolution provider): complaint filing
  with required elements on trademark rights, bad faith and lack of legitimate interest,
  administrative compliance review with deficiency notification and correction period, registrar
  verification and domain lock during proceedings to prevent transfer, respondent notification
  with response deadlines and default handling, panelist appointment with conflict screening and
  single or three-member panel election, decision issuance with transfer, cancellation or
  complaint denial and reverse domain hijacking findings, implementation waiting period allowing
  court challenge before registrar action, case publication and precedent database maintenance

domain_name: domain-name-dispute-resolution
api_prefix: "/udrp"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - optimistic_concurrency
    - selector_policy

  entity_topology: graph
  entity_topology_note: |
    Cases, Panelists and Decisions form a many-to-many graph rather than a tree: PanelistAppointment
    is the junction between Case and Panelist; PanelVote is the junction between Decision and a seat
    on that Case's panel; ComplaintGround.cited_decision_ids points back into earlier Decisions, so
    the Decision set is a citation graph whose in-degree drives PrecedentEntry.citation_count. No URL
    nests deeper than parent -> child, and Panelist / Registrar / Complainant are peer roots reached
    by foreign key rather than by containment.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Case carries two genuine loops (DEFICIENT -> FILED -> DEFICIENT across correction rounds, and
    IMPLEMENTATION_WAITING -> STAYED -> IMPLEMENTATION_WAITING when a court challenge is dismissed)
    and one convergence point ({RESPONSE_RECEIVED, DEFAULT} -> PANEL_APPOINTMENT). Decision carries
    two independent state dimensions on one row (status x publication_status) that advance without
    constraining each other's ordering. PanelistAppointment is a three-way branch out of NOMINATED
    with a different side-effect set on each branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - citation_graph

  role_model: segregation_of_duties
  role_model_note: |
    The CaseManager operator who issued the most recent DeficiencyNotice on a Case may not be the
    operator who clears that Case through administrative compliance review; screening panelists
    disclose conflicts themselves but never grant their own waiver; the registrar that verifies and
    locks a domain is the only actor allowed to execute the decision against it.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Registrar
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Accredited registrar display name.
      - name: iana_id
        type: string
        source: input
        description: IANA registrar identifier; unique across all Registrar rows.
        constraints: unique; 1-16 characters
      - name: contact_email
        type: string
        source: input
        description: Abuse/verification mailbox the provider sends RegistrarVerification requests to.
      - name: verification_response_hours
        type: integer
        source: input
        description: Hours the registrar is given to answer a RegistrarVerification before it is swept to OVERDUE.
        default: 48
        constraints: 1-336
      - name: lock_sla_hours
        type: integer
        source: input
        description: Hours the registrar commits to for applying the transfer lock; recorded for audit, not enforced by any gate.
        default: 24
        constraints: 1-336
      - name: status
        type: enum
        source: system
        description: Operational standing of the registrar.
        default: ACTIVE
        constraints: "status IN {ACTIVE, SUSPENDED}"
      - name: overdue_verification_count
        type: integer
        source: computed
        description: Count of RegistrarVerification rows for this registrar whose status is OVERDUE; maintained by calculations.load_and_population_counters.
        default: 0

  - name: DomainName
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: domain_name
        type: string
        source: input
        description: Fully qualified disputed domain, stored lowercased; unique across all DomainName rows.
        constraints: unique; lowercase; 4-253 characters
      - name: registrar_id
        type: string
        source: input
        description: FK -> Registrar.id; the sponsoring registrar that must verify and later execute against this domain.
      - name: registrant_name_public
        type: string
        source: input
        description: Registrant name as shown in public WHOIS at filing time (often a privacy proxy).
      - name: registrant_email_public
        type: string
        source: input
        description: Registrant contact address as shown in public WHOIS at filing time.
      - name: registration_date
        type: datetime
        source: input
        description: ISO 8601 UTC creation date of the registration.
      - name: expiry_date
        type: datetime
        source: input
        description: ISO 8601 UTC expiry date of the registration.
      - name: lock_status
        type: enum
        source: system
        description: Transfer-lock dimension of the domain, driven by the proceeding lifecycle.
        default: UNLOCKED
        constraints: "lock_status IN {UNLOCKED, LOCKED, TRANSFER_EXECUTED, CANCELLATION_EXECUTED}"
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant at which lock_status last became LOCKED; null while UNLOCKED and never cleared afterwards.
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant at which lock_status became TRANSFER_EXECUTED or CANCELLATION_EXECUTED; null otherwise.
        default: null

  - name: Complainant
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the trademark owner filing complaints.
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the complainant; feeds the panelist nationality exclusion filter.
        constraints: exactly 2 uppercase letters
      - name: email
        type: string
        source: input
        description: Case correspondence address for the complainant.
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of Case rows with complainant_id = this id whose status IN NON_TERMINAL_CASE_STATUSES (see calculations.case_population_counters)."
        default: 0
      - name: adverse_rdnh_findings
        type: integer
        source: computed
        description: "Count of Decision rows with status IN {ISSUED, STAYED, IMPLEMENTED} whose rdnh_finding = true and whose Case.complainant_id = this id."
        default: 0

  - name: Case
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_number
        type: string
        source: system
        description: "Provider docket number minted as D-2026-%06d from a monotonic counter that increments once per accepted Case creation, ordered by created_at ASC."
      - name: complainant_id
        type: string
        source: input
        description: FK -> Complainant.id; the filing party. When X-User-Role is Complainant this must equal X-User-ID.
      - name: domain_id
        type: string
        source: input
        description: FK -> DomainName.id; the single disputed domain this proceeding occupies.
      - name: status
        type: enum
        source: system
        description: Procedural status of the proceeding.
        default: FILED
        constraints: "status IN {FILED, DEFICIENT, VERIFICATION_PENDING, NOTIFICATION_PENDING, COMMENCED, RESPONSE_RECEIVED, DEFAULT, PANEL_APPOINTMENT, PANEL_CONSTITUTED, IMPLEMENTATION_WAITING, STAYED, IMPLEMENTED, ADMIN_CLOSED, WITHDRAWN, TERMINATED_COURT}"
      - name: panel_election
        type: enum
        source: input
        description: Panel size elected by the complainant at filing.
        default: SINGLE
        constraints: "panel_election IN {SINGLE, THREE}"
      - name: respondent_panel_election
        type: enum
        source: system
        description: Panel size elected by the respondent in its Response; set to THREE only by a Response with requests_three_member_panel = true.
        default: NONE
        constraints: "respondent_panel_election IN {NONE, THREE}"
      - name: required_seat_count
        type: integer
        source: computed
        description: "3 when panel_election = THREE OR respondent_panel_election = THREE, else 1."
        default: 1
        constraints: "required_seat_count IN {1, 3}"
      - name: mutual_jurisdiction
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country the complainant submits to for court challenge; also excluded from panelist nationality eligibility.
        constraints: exactly 2 uppercase letters
      - name: remedy_requested
        type: enum
        source: input
        description: Remedy the complaint asks for.
        constraints: "remedy_requested IN {TRANSFER, CANCELLATION}"
      - name: expedited_requested
        type: boolean
        source: input
        description: Whether the complainant bought expedited administrative handling, which adds EXPEDITED_SURCHARGE_PCT of the base fee.
        default: false
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: Total provider fee for the proceeding per calculations.filing_fee_assessment.
        default: 0
      - name: complainant_share_cents
        type: integer
        source: computed
        description: Portion of assessed_fee_cents payable by the complainant per calculations.filing_fee_assessment.
        default: 0
      - name: respondent_share_cents
        type: integer
        source: computed
        description: Portion of assessed_fee_cents payable by the respondent per calculations.filing_fee_assessment; non-zero only when the respondent upgraded the panel.
        default: 0
      - name: fee_variant_applied
        type: enum
        source: system
        description: Which variant of calculations.filing_fee_assessment produced the current fee fields.
        default: PROVISIONAL
        constraints: "fee_variant_applied IN {PROVISIONAL, FINAL}"
      - name: honoraria_pool_cents
        type: integer
        source: computed
        description: "round_half_up(assessed_fee_cents * PANELIST_HONORARIA_SHARE_PCT) - the pool distributed across seats by calculations.panelist_honoraria_allocation."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of FeeTransaction.amount_cents over all FeeTransaction rows with case_id = this id (REFUND rows carry negative amounts)."
        default: 0
      - name: complainant_paid_cents
        type: integer
        source: computed
        description: "Sum of FeeTransaction.amount_cents over FeeTransaction rows with case_id = this id AND payer = COMPLAINANT."
        default: 0
      - name: respondent_paid_cents
        type: integer
        source: computed
        description: "Sum of FeeTransaction.amount_cents over FeeTransaction rows with case_id = this id AND payer = RESPONDENT."
        default: 0
      - name: deficiency_round_count
        type: integer
        source: system
        description: Number of DeficiencyNotice rows ever issued on this Case; capped by MAX_DEFICIENCY_ROUNDS.
        default: 0
      - name: last_deficiency_issuer_user_id
        type: string
        source: system
        description: X-User-ID of the CaseManager who issued the most recent DeficiencyNotice; the segregation-of-duties bar at compliance clearance compares against this value.
        default: null
      - name: compliance_cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the CaseManager who moved this Case FILED -> VERIFICATION_PENDING.
        default: null
      - name: verified_registrant_name
        type: string
        source: system
        description: Registrant name disclosed by the registrar in the RegistrarVerification response; null before verification.
        default: null
      - name: verified_registrant_email
        type: string
        source: system
        description: Registrant address disclosed by the registrar; a Response is accepted only when its respondent_email equals this value.
        default: null
      - name: commenced_at
        type: datetime
        source: system
        description: Logical-clock instant the first RespondentNotification was dispatched; null before commencement.
        default: null
      - name: provisional_response_due_at
        type: datetime
        source: computed
        description: Response deadline projected at dispatch by variant PROVISIONAL_AT_DISPATCH of calculations.response_deadline_projection.
        default: null
      - name: response_due_at
        type: datetime
        source: computed
        description: Operative response deadline; equals provisional_response_due_at until a delivery outcome is recorded, then variant FINAL_AT_DELIVERY replaces it.
        default: null
      - name: deadline_variant_applied
        type: enum
        source: computed
        description: Which variant of calculations.response_deadline_projection produced the current response_due_at.
        default: PROVISIONAL
        constraints: "deadline_variant_applied IN {PROVISIONAL, FINAL}"
      - name: default_recorded
        type: boolean
        source: system
        description: True once the deadline sweep moved this Case COMMENCED -> DEFAULT for want of a Response.
        default: false
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the Case reached a terminal status; null while non-terminal.
        default: null
      - name: refiling_bar_until
        type: datetime
        source: computed
        description: "closed_at + COOLING_OFF_DAYS days; the closed end of this Case's occupation interval on its domain per calculations.domain_occupation_conflict."
        default: null

  - name: ComplaintGround
    parent: Case
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the complaint this asserted element belongs to.
      - name: ground_type
        type: enum
        source: input
        description: Which of the three mandatory complaint elements this row asserts.
        constraints: "ground_type IN {TRADEMARK_RIGHTS, NO_LEGITIMATE_INTEREST, BAD_FAITH}; at most one row per (case_id, ground_type)"
      - name: assertion_text
        type: string
        source: input
        description: Narrative pleading for this element.
        constraints: 10-4000 characters
      - name: evidence_count
        type: integer
        source: input
        description: Number of annexes filed in support of this element; zero is accepted at filing and rejected at compliance clearance.
        constraints: 0-200
      - name: mark_registration_number
        type: string
        source: input
        description: Trademark registration number; required when ground_type = TRADEMARK_RIGHTS, ignored otherwise.
        default: null
      - name: mark_jurisdiction
        type: string
        source: input
        description: ISO 3166-1 alpha-2 registry of the asserted mark; required when ground_type = TRADEMARK_RIGHTS, ignored otherwise.
        default: null
      - name: similarity_claim
        type: enum
        source: input
        description: Confusion theory pleaded; required when ground_type = TRADEMARK_RIGHTS, ignored otherwise.
        default: null
        constraints: "similarity_claim IN {IDENTICAL, CONFUSINGLY_SIMILAR, null}"
      - name: cited_decision_ids
        type: array
        source: input
        description: "Array of Decision.id values cited as precedent by this ground; each cited Decision must have publication_status IN {PUBLISHED, REDACTED}. Drives PrecedentEntry.citation_count."
        default: []
      - name: sufficiency_status
        type: enum
        source: computed
        description: "SUFFICIENT when evidence_count >= MIN_EVIDENCE_PER_GROUND, else DEFICIENT; recomputed on every write to evidence_count."
        constraints: "sufficiency_status IN {SUFFICIENT, DEFICIENT}"

  - name: DeficiencyNotice
    parent: Case
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the complaint found administratively deficient.
      - name: round_number
        type: integer
        source: system
        description: "Case.deficiency_round_count + 1 at issuance; capped at MAX_DEFICIENCY_ROUNDS."
        constraints: 1-2
      - name: deficiency_codes
        type: array
        source: input
        description: "Non-empty array of codes drawn from {MISSING_GROUND, MISSING_MARK_EVIDENCE, MISSING_SIGNATURE, ILLEGIBLE_EVIDENCE_ANNEX, FEE_SHORTFALL, MUTUAL_JURISDICTION_ABSENT, DOMAIN_MISMATCH}."
        constraints: 1-7 distinct members, each drawn from the declared code set
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the issuing CaseManager, copied to Case.last_deficiency_issuer_user_id.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: correction_days
        type: integer
        source: input
        description: Length of the correction period in days; defaults to CORRECTION_PERIOD_DAYS.
        default: 5
        constraints: 1-20
      - name: correction_deadline_at
        type: datetime
        source: computed
        description: "issued_at + correction_days days; the sweep expires the notice strictly after this instant."
      - name: status
        type: enum
        source: system
        description: Lifecycle of the notice.
        default: OPEN
        constraints: "status IN {OPEN, CURED, EXPIRED}"
      - name: cured_at
        type: datetime
        source: system
        description: Logical-clock instant a correction cured this notice; null unless status = CURED.
        default: null

  - name: RegistrarVerification
    parent: Case
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the proceeding whose registrar was asked to verify the registration and lock the domain.
      - name: requested_at
        type: datetime
        source: system
        description: Logical-clock instant the request was raised by compliance clearance.
      - name: due_at
        type: datetime
        source: computed
        description: "requested_at + Registrar.verification_response_hours hours, taken from the registrar sponsoring Case.domain_id."
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant the registrar answered; null while unanswered.
        default: null
      - name: verified_registrant_name
        type: string
        source: input
        description: Underlying registrant name disclosed by the registrar.
        default: null
      - name: verified_registrant_email
        type: string
        source: input
        description: Underlying registrant address disclosed by the registrar.
        default: null
      - name: lock_applied
        type: boolean
        source: input
        description: Registrar's attestation that the transfer lock is in place; a response with false is rejected.
        default: false
      - name: registrar_remarks
        type: string
        source: input
        description: Free-text remarks from the registrar.
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle of the verification request.
        default: REQUESTED
        constraints: "status IN {REQUESTED, RESPONDED, OVERDUE}"
      - name: escalation_count
        type: integer
        source: system
        description: Number of times the deadline sweep has re-escalated this verification after due_at elapsed without a response.
        default: 0

  - name: RespondentNotification
    parent: Case
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the proceeding whose commencement this notification effects.
      - name: attempt_number
        type: integer
        source: system
        description: "1 for the first notification on the Case, then previous highest attempt_number + 1; a new attempt is allowed only after the previous row reached UNDELIVERABLE."
        constraints: 1-5
      - name: channel
        type: enum
        source: input
        description: Transmission channel, which fixes the transmission allowance used by the provisional deadline variant.
        constraints: "channel IN {EMAIL, POSTAL, COURIER}"
      - name: address
        type: string
        source: input
        description: Destination address used for this attempt.
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant the notification left the provider.
      - name: deemed_received_at
        type: datetime
        source: input
        description: Instant the respondent is deemed to have received the notification; supplied with a DELIVERED outcome and null otherwise.
        default: null
      - name: status
        type: enum
        source: system
        description: Delivery lifecycle of this attempt.
        default: SENT
        constraints: "status IN {SENT, DELIVERED, UNDELIVERABLE}"
      - name: failure_reason
        type: string
        source: input
        description: Free-text reason recorded when the delivery outcome is UNDELIVERABLE; null otherwise.
        default: null
      - name: transmission_allowance_days
        type: integer
        source: computed
        description: "TRANSMISSION_ALLOWANCE_DAYS[channel]: 0 for EMAIL, 2 for COURIER, 5 for POSTAL."

  - name: Response
    parent: Case
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the proceeding being answered.
      - name: respondent_email
        type: string
        source: input
        description: Address the responding party writes from; must equal Case.verified_registrant_email.
      - name: content_summary
        type: string
        source: input
        description: Narrative answer to the three complaint elements.
        constraints: 10-4000 characters
      - name: requests_three_member_panel
        type: boolean
        source: input
        description: Respondent's election of a three-member panel, which upgrades Case.required_seat_count and re-splits the fee.
        default: false
      - name: nominated_panelist_ids
        type: array
        source: input
        description: "Advisory array of Panelist.id values the respondent would prefer; recorded for audit and deliberately excluded from the appointment selector's candidate set and ranking."
        default: []
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission.
      - name: timeliness
        type: enum
        source: computed
        description: "ON_TIME when submitted_at <= Case.response_due_at; LATE when Case.response_due_at < submitted_at <= Case.response_due_at + LATE_RESPONSE_GRACE_HOURS hours."
        constraints: "timeliness IN {ON_TIME, LATE}"

  - name: Panelist
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: Roster name of the neutral.
      - name: nationality_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 nationality; excluded from a case when it equals Complainant.country_code or Case.mutual_jurisdiction.
        constraints: exactly 2 uppercase letters
      - name: firm_name
        type: string
        source: input
        default: null
        description: Law firm affiliation, disclosed in conflict screening. Null when the panelist is a sole practitioner.
      - name: specializations
        type: array
        source: input
        description: Array of subject tags recorded for audit; never used as a selector filter or ranking key.
        default: []
      - name: roster_admitted_at
        type: datetime
        source: input
        description: Date of admission to the provider roster; the appointment selector's second ranking key (ASC).
      - name: max_overlapping_engagements
        type: integer
        source: input
        description: Aggregate ceiling on engagement windows that may overlap a candidate window on this panelist.
        default: 5
        constraints: 1-20
      - name: status
        type: enum
        source: system
        description: Roster standing; only AVAILABLE panelists enter the selector's candidate set.
        default: AVAILABLE
        constraints: "status IN {AVAILABLE, UNAVAILABLE, SUSPENDED}"
      - name: unavailable_from
        type: datetime
        source: input
        description: Inclusive start of the declared blackout window; null when no blackout is declared.
        default: null
      - name: unavailable_to
        type: datetime
        source: input
        description: Inclusive end of the declared blackout window; the interval is closed at both ends, so an engagement window that merely touches this instant still conflicts. Null when no blackout is declared.
        default: null
      - name: active_case_load
        type: integer
        source: computed
        description: "Count of PanelistAppointment rows with panelist_id = this id AND status = ACCEPTED; incremented on acceptance and decremented on REPLACED or DISCHARGED."
        default: 0

  - name: PanelistAppointment
    parent: Case
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the proceeding this seat belongs to.
      - name: panelist_id
        type: string
        source: input
        description: FK -> Panelist.id; the neutral nominated to the seat. Omitted by the caller when the provider selector picks the panelist.
      - name: seat
        type: enum
        source: input
        description: Seat this appointment fills; SOLE only when Case.required_seat_count = 1, the other three only when it is 3.
        constraints: "seat IN {SOLE, PRESIDING, CO_PANELIST_1, CO_PANELIST_2}; at most one row per (case_id, seat) with status IN {NOMINATED, WAIVER_PENDING, ACCEPTED}"
      - name: nominated_by
        type: enum
        source: input
        description: Which participant put the name forward; recorded for audit and never used by the selector.
        constraints: "nominated_by IN {COMPLAINANT, RESPONDENT, PROVIDER}"
      - name: selected_by_provider
        type: boolean
        source: system
        description: True when the server chose panelist_id via calculations.panelist_selector rather than the caller supplying it.
        default: false
      - name: disclosed_prior_representation
        type: boolean
        source: input
        description: Screening disclosure - the panelist previously represented one of the parties.
        default: false
      - name: disclosed_same_firm
        type: boolean
        source: input
        description: Screening disclosure - a colleague at firm_name acts for one of the parties.
        default: false
      - name: disclosed_financial_interest
        type: boolean
        source: input
        description: Screening disclosure - the panelist holds a financial interest in a party; this component of the score is never decayed.
        default: false
      - name: prior_appointments_with_complainant
        type: integer
        source: input
        description: Number of earlier appointments involving the same complainant, as disclosed by the panelist.
        default: 0
        constraints: 0-50
      - name: months_since_last_contact
        type: integer
        source: input
        description: Months since the most recent disclosed contact with a party; null means no contact, which applies decay factor 1.0.
        default: null
        constraints: 0-600
      - name: conflict_score
        type: number
        source: computed
        description: Weighted conflict score from calculations.panelist_conflict_score, 2 decimal places.
        default: null
      - name: conflict_factors
        type: array
        source: computed
        description: "Sorted-ascending list of the disclosure weight keys that contributed a non-zero term to conflict_score, drawn from {FINANCIAL_INTEREST, PRIOR_APPOINTMENTS, PRIOR_REPRESENTATION, SAME_FIRM}; empty array when conflict_score is 0.00."
        default: []
      - name: waiver_complainant
        type: boolean
        source: input
        description: Whether the complainant waived the disclosed conflict.
        default: false
      - name: waiver_respondent
        type: boolean
        source: input
        description: Whether the respondent waived the disclosed conflict; not required when the Case has no Response row.
        default: false
      - name: status
        type: enum
        source: system
        description: Seat lifecycle.
        default: NOMINATED
        constraints: "status IN {NOMINATED, WAIVER_PENDING, ACCEPTED, CONFLICTED, DECLINED, REPLACED, DISCHARGED}"
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock instant the panelist filed disclosures; null before screening.
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant the seat became ACCEPTED; inclusive start of the engagement window.
        default: null
      - name: decision_due_at
        type: datetime
        source: computed
        description: "accepted_at + DECISION_PERIOD_DAYS days; exclusive end of the engagement window used by calculations.panelist_window_conflict."
        default: null
      - name: honoraria_cents
        type: integer
        source: computed
        description: Seat's share of Case.honoraria_pool_cents per calculations.panelist_honoraria_allocation; 0 until the panel is constituted.
        default: 0
      - name: replaced_by_appointment_id
        type: string
        source: system
        description: Identifier of the successor PanelistAppointment row minted when this seat was vacated; null unless status = REPLACED. Successor rows are discovered through GET /udrp/appointments filtered by case_id.
        default: null

  - name: Decision
    parent: Case
    common_fields: true
    entity_kind: resource
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the proceeding decided.
      - name: drafted_by_panelist_id
        type: string
        source: input
        description: "Panelist identifier of the drafting neutral: the panelist_id of the PanelistAppointment with status = ACCEPTED holding seat SOLE (single-member) or PRESIDING (three-member) on Decision.case_id."
      - name: draft_summary
        type: string
        source: input
        description: Reasoned narrative of the panel's findings.
        constraints: 10-8000 characters
      - name: status
        type: enum
        source: system
        description: Enforcement dimension of the decision.
        default: DRAFT
        constraints: "status IN {DRAFT, ISSUED, STAYED, IMPLEMENTED, VOIDED}"
      - name: publication_status
        type: enum
        source: system
        description: Publication dimension of the decision, advanced independently of status.
        default: UNPUBLISHED
        constraints: "publication_status IN {UNPUBLISHED, PUBLISHED, REDACTED}"
      - name: outcome
        type: enum
        source: computed
        description: Operative outcome from calculations.panel_outcome_tally; null while status = DRAFT.
        default: null
        constraints: "outcome IN {TRANSFER, CANCELLATION, COMPLAINT_DENIED, null}"
      - name: outcome_basis
        type: enum
        source: computed
        description: Which limb of calculations.panel_outcome_tally produced outcome.
        default: null
        constraints: "outcome_basis IN {STRICT_MAJORITY, PRESIDING_CASTING, null}"
      - name: rdnh_finding
        type: boolean
        source: computed
        description: Reverse domain name hijacking finding against the complainant; only reachable when outcome = COMPLAINT_DENIED.
        default: false
      - name: dissent_present
        type: boolean
        source: computed
        description: True when the PanelVote rows for this decision carry more than one distinct vote value.
        default: false
      - name: transfer_votes
        type: integer
        source: computed
        description: Count of PanelVote rows for this decision with vote = TRANSFER.
        default: 0
      - name: cancellation_votes
        type: integer
        source: computed
        description: Count of PanelVote rows for this decision with vote = CANCELLATION.
        default: 0
      - name: deny_votes
        type: integer
        source: computed
        description: Count of PanelVote rows for this decision with vote = DENY.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant the decision was issued; null while DRAFT.
        default: null
      - name: implementation_deadline_at
        type: datetime
        source: computed
        description: End of the implementation waiting period per calculations.implementation_window; the registrar may act only strictly after it.
        default: null
      - name: implemented_at
        type: datetime
        source: system
        description: Logical-clock instant the registrar executed the decision.
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant the decision was voided by a sustained court challenge or by a vacated seat.
        default: null

  - name: PanelVote
    parent: Decision
    common_fields: false
    entity_kind: event
    fields:
      - name: decision_id
        type: string
        source: input
        description: FK -> Decision.id; the draft this ballot belongs to.
      - name: seat
        type: enum
        source: input
        description: Seat casting the ballot; must match the acting panelist's ACCEPTED appointment on the decision's Case.
        constraints: "seat IN {SOLE, PRESIDING, CO_PANELIST_1, CO_PANELIST_2}; at most one row per (decision_id, seat)"
      - name: voter_panelist_id
        type: string
        source: system
        description: "Panelist identifier derived server-side: the panelist_id of the PanelistAppointment with status = ACCEPTED holding this seat on the decision's Case."
      - name: vote
        type: enum
        source: input
        description: Ballot on the remedy.
        constraints: "vote IN {TRANSFER, CANCELLATION, DENY}"
      - name: rdnh_vote
        type: boolean
        source: input
        description: Ballot on a reverse domain name hijacking finding.
        default: false
      - name: rationale
        type: string
        source: input
        description: Optional per-seat reasoning, retained verbatim for publication.
        default: null
      - name: cast_at
        type: datetime
        source: system
        description: Logical-clock instant the ballot was recorded; ballots are immutable once written.

  - name: CourtChallenge
    parent: Decision
    common_fields: true
    entity_kind: resource
    fields:
      - name: decision_id
        type: string
        source: input
        description: FK -> Decision.id; the issued decision challenged in a court of mutual jurisdiction.
      - name: jurisdiction
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the seized court.
        constraints: exactly 2 uppercase letters
      - name: docket_number
        type: string
        source: input
        description: Court docket reference.
      - name: filed_by
        type: enum
        source: input
        description: Which party commenced the court action.
        constraints: "filed_by IN {COMPLAINANT, RESPONDENT}"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant the challenge was lodged with the provider.
      - name: status
        type: enum
        source: system
        description: Lifecycle of the challenge.
        default: FILED
        constraints: "status IN {FILED, DISMISSED, SUSTAINED, WITHDRAWN}"
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant the challenge left FILED; null while FILED.
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Note recorded with the resolution.
        default: null

  - name: PrecedentEntry
    parent: Decision
    common_fields: true
    entity_kind: resource
    fields:
      - name: decision_id
        type: string
        source: input
        description: FK -> Decision.id; the decision published into the precedent database. At most one row per decision_id.
        constraints: unique per decision_id
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of publication.
      - name: redaction_level
        type: enum
        source: input
        description: Redaction applied before publication; anything other than NONE drives Decision.publication_status to REDACTED.
        constraints: "redaction_level IN {NONE, PARTY_NAMES, FULL}"
      - name: precedent_tags
        type: array
        source: input
        description: Non-empty array of lowercase topic tags used by the precedent search filter.
        constraints: 1-10 members
      - name: digest_text
        type: string
        source: system
        description: "Digest assembled at publication as '<Case.case_number> | <Decision.outcome> | rdnh=<Decision.rdnh_finding>'."
      - name: citation_count
        type: integer
        source: computed
        description: In-degree of this decision in the citation graph per calculations.precedent_citation_metrics.
        default: 0
      - name: precedent_weight
        type: number
        source: computed
        description: Recency-decayed citation weight per calculations.precedent_citation_metrics, 2 decimal places.
        default: 0.0
      - name: citable
        type: boolean
        source: computed
        description: True when the entry may be named in ComplaintGround.cited_decision_ids, i.e. redaction_level != FULL and superseded = false.
        default: true
      - name: superseded
        type: boolean
        source: computed
        description: True once the underlying Decision reached status VOIDED; the entry stays PUBLISHED but stops being citable.
        default: false

  - name: FeeTransaction
    parent: Case
    common_fields: false
    entity_kind: event
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the proceeding this ledger line belongs to.
      - name: kind
        type: enum
        source: input
        description: Ledger line type; REFUND lines are only ever minted by the server as compensation.
        constraints: "kind IN {FILING_FEE, PANEL_SUPPLEMENT, REFUND, WRITE_OFF}"
      - name: payer
        type: enum
        source: input
        description: "Party the line is attributed to; a server-minted REFUND line carries the payer whose contribution it returns, so payer-scoped sums fall back to zero after a full refund. PROVIDER is used only for WRITE_OFF lines."
        constraints: "payer IN {COMPLAINANT, RESPONDENT, PROVIDER}"
      - name: amount_cents
        type: integer
        source: input
        description: Signed amount in cents; inflows positive, REFUND lines negative.
        constraints: "-10000000 to 10000000, not 0"
      - name: reference
        type: string
        source: input
        description: Payment or refund reference recorded for audit.
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the ledger line was written; ledger lines are immutable once written.

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
# NON_TERMINAL_CASE_STATUSES is used verbatim throughout this scaffold and means
# exactly: {FILED, DEFICIENT, VERIFICATION_PENDING, NOTIFICATION_PENDING, COMMENCED,
#           RESPONSE_RECEIVED, DEFAULT, PANEL_APPOINTMENT, PANEL_CONSTITUTED,
#           IMPLEMENTATION_WAITING, STAYED}
state_machines:
  - entity: Case
    state_field: status
    initial_state: FILED
    terminal_states: [IMPLEMENTED, ADMIN_CLOSED, WITHDRAWN, TERMINATED_COURT]
    shape: cyclic
    transitions:
      - from: FILED
        to: DEFICIENT
        trigger: "POST /udrp/cases/{id}/deficiency-notices"
        actor: CaseManager
        preconditions:
          - "Case.status == FILED"
          - "Case.deficiency_round_count < MAX_DEFICIENCY_ROUNDS (else ERR_DEFICIENCY_ROUND_LIMIT)"
          - "no DeficiencyNotice row on this case has status == OPEN (else ERR_INVALID_CASE_STATE)"
        side_effects:
          - "creates DeficiencyNotice with status OPEN, round_number = Case.deficiency_round_count + 1, issued_at = clock, correction_deadline_at = issued_at + correction_days days"
          - "Case.deficiency_round_count += 1"
          - "Case.last_deficiency_issuer_user_id = X-User-ID of the issuing CaseManager"
          - "Case.updated_at = clock; Case.version += 1"

      - from: DEFICIENT
        to: FILED
        trigger: "POST /udrp/cases/{id}/corrections"
        actor: Complainant
        preconditions:
          - "Case.status == DEFICIENT"
          - "X-User-ID == Case.complainant_id (else ERR_NOT_OWNER)"
          - "the DeficiencyNotice identified by notice_id has case_id == Case.id and status == OPEN (else ERR_INVALID_CASE_STATE)"
          - "clock <= that notice's correction_deadline_at (else ERR_CORRECTION_PERIOD_EXPIRED)"
        side_effects:
          - "DeficiencyNotice.status OPEN -> CURED, cured_at = clock"
          - "Case.status DEFICIENT -> FILED (the correction loop may run at most MAX_DEFICIENCY_ROUNDS times)"
          - "Case.updated_at = clock; Case.version += 1"
        note: "This is the revision loop: FILED -> DEFICIENT -> FILED. Nothing about the grounds is re-validated here; sufficiency is re-evaluated at compliance clearance."

      - from: DEFICIENT
        to: ADMIN_CLOSED
        trigger: "POST /udrp/_ops/deadline-sweep (system, per OPEN DeficiencyNotice past its correction deadline)"
        actor: system
        preconditions:
          - "Case.status == DEFICIENT"
          - "a DeficiencyNotice row on this case has status == OPEN AND clock > correction_deadline_at"
        side_effects:
          - "link 1: DeficiencyNotice.status OPEN -> EXPIRED"
          - "link 2 (caused by link 1): Case.status DEFICIENT -> ADMIN_CLOSED, closed_at = clock, refiling_bar_until = clock + COOLING_OFF_DAYS days"
          - "link 3 (caused by link 2): for each distinct payer P in {COMPLAINANT, RESPONDENT} with Case payer-scoped paid sum S_P > 0, a FeeTransaction is minted with kind REFUND, payer P, amount_cents = -S_P, reference 'AUTO-CLOSE-REFUND'"
          - "link 4 (caused by link 3): Case.complainant_paid_cents and Case.respondent_paid_cents are recomputed from the ledger and land on exactly 0, while Case.paid_cents lands on the sum of the PROVIDER-attributed WRITE_OFF lines, which are never refunded - so paid_cents is 0 only on a case that carries no write-off"
          - "also caused by link 2: Complainant.open_case_count -= 1; when DomainName.lock_status == LOCKED it becomes UNLOCKED"
          - "Case.updated_at = clock; Case.version += 1"

      - from: FILED
        to: VERIFICATION_PENDING
        trigger: "POST /udrp/cases/{id}/compliance-clearance"
        actor: CaseManager
        preconditions:
          - "Case.status == FILED"
          - "X-User-ID != Case.last_deficiency_issuer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Case.mutual_jurisdiction is a 2-letter code (else ERR_INVALID_REQUEST)"
          - "Case.complainant_paid_cents >= Case.complainant_share_cents (else ERR_FILING_FEE_SHORTFALL)"
          - "the case has exactly one ComplaintGround row for each of TRADEMARK_RIGHTS, NO_LEGITIMATE_INTEREST and BAD_FAITH (else ERR_MISSING_REQUIRED_GROUND)"
          - "every ComplaintGround row on the case has sufficiency_status == SUFFICIENT (else ERR_GROUND_EVIDENCE_INSUFFICIENT)"
        side_effects:
          - "Case.compliance_cleared_by_user_id = X-User-ID"
          - "creates RegistrarVerification with status REQUESTED, requested_at = clock, due_at = clock + Registrar.verification_response_hours hours (registrar taken from DomainName.registrar_id of Case.domain_id)"
          - "Case.updated_at = clock; Case.version += 1"

      - from: VERIFICATION_PENDING
        to: NOTIFICATION_PENDING
        trigger: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response"
        actor: RegistrarAgent
        preconditions:
          - "Case.status == VERIFICATION_PENDING"
          - "X-User-ID == DomainName.registrar_id of Case.domain_id (else ERR_REGISTRAR_MISMATCH)"
          - "that Registrar.status == ACTIVE (else ERR_REGISTRAR_SUSPENDED)"
          - "RegistrarVerification.status IN {REQUESTED, OVERDUE} (else ERR_INVALID_CASE_STATE)"
          - "lock_applied == true (else ERR_DOMAIN_LOCK_NOT_APPLIED)"
        side_effects:
          - "RegistrarVerification.status -> RESPONDED, responded_at = clock, verified_registrant_* stored"
          - "DomainName.lock_status UNLOCKED -> LOCKED, locked_at = clock, DomainName.version += 1"
          - "Case.verified_registrant_name / verified_registrant_email copied from the response"
          - "Case.updated_at = clock; Case.version += 1"

      - from: NOTIFICATION_PENDING
        to: COMMENCED
        trigger: "POST /udrp/cases/{id}/notifications"
        actor: CaseManager
        preconditions:
          - "Case.status == NOTIFICATION_PENDING"
          - "DomainName.lock_status of Case.domain_id == LOCKED (else ERR_DOMAIN_NOT_LOCKED)"
          - "the case has no RespondentNotification row with status == SENT (else ERR_INVALID_CASE_STATE)"
        side_effects:
          - "creates RespondentNotification with status SENT, attempt_number 1, dispatched_at = clock"
          - "Case.commenced_at = clock"
          - "Case.provisional_response_due_at and Case.response_due_at are both set to variant PROVISIONAL_AT_DISPATCH of calculations.response_deadline_projection"
          - "Case.updated_at = clock; Case.version += 1"

      - from: COMMENCED
        to: COMMENCED
        trigger: "POST /udrp/cases/{id}/notifications (re-attempt after an UNDELIVERABLE outcome)"
        actor: CaseManager
        preconditions:
          - "Case.status == COMMENCED"
          - "the RespondentNotification row with the highest attempt_number on this case has status == UNDELIVERABLE (else ERR_INVALID_CASE_STATE)"
          - "highest attempt_number < 5 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "creates a further RespondentNotification with status SENT, attempt_number = previous highest + 1, dispatched_at = clock"
          - "Case.provisional_response_due_at and Case.response_due_at are recomputed from the new attempt by variant PROVISIONAL_AT_DISPATCH"
          - "Case.updated_at = clock; Case.version += 1"
        note: "Self-loop on COMMENCED: the notification attempt chain cycles while delivery keeps failing."

      - from: COMMENCED
        to: RESPONSE_RECEIVED
        trigger: "POST /udrp/cases/{id}/responses"
        actor: Respondent
        preconditions:
          - "the case has no Response row (else ERR_RESPONSE_ALREADY_FILED, checked at priority 39, ahead of the state gate)"
          - "Case.status == COMMENCED (else ERR_CASE_NOT_IN_RESPONSE_WINDOW)"
          - "respondent_email == Case.verified_registrant_email (else ERR_RESPONDENT_IDENTITY_MISMATCH)"
          - "clock <= Case.response_due_at + LATE_RESPONSE_GRACE_HOURS hours (else ERR_RESPONSE_DEADLINE_PASSED)"
        side_effects:
          - "creates Response with submitted_at = clock and timeliness ON_TIME or LATE per its computed rule"
          - "when requests_three_member_panel == true: Case.respondent_panel_election NONE -> THREE, Case.required_seat_count 1 -> 3, and Case.assessed_fee_cents / complainant_share_cents / respondent_share_cents / honoraria_pool_cents are recomputed by variant FINAL_AT_ELECTION of calculations.filing_fee_assessment with Case.fee_variant_applied -> FINAL"
          - "Case.updated_at = clock; Case.version += 1"

      - from: COMMENCED
        to: DEFAULT
        trigger: "POST /udrp/_ops/deadline-sweep (system, per COMMENCED case past its response deadline and grace)"
        actor: system
        preconditions:
          - "Case.status == COMMENCED"
          - "the case has no Response row"
          - "clock > Case.response_due_at + LATE_RESPONSE_GRACE_HOURS hours"
        side_effects:
          - "Case.default_recorded = true"
          - "Case.updated_at = clock; Case.version += 1"
        note: "Default handling: the panel is still appointed and still decides on the record, but no respondent waiver is required for a disclosed conflict."

      - from: RESPONSE_RECEIVED
        to: PANEL_APPOINTMENT
        trigger: "POST /udrp/cases/{id}/appointments (first appointment on the case)"
        actor: CaseManager
        preconditions:
          - "Case.status IN {RESPONSE_RECEIVED, DEFAULT}"
          - "expected_case_version == Case.version (else ERR_STALE_CASE_VERSION)"
          - "Case.paid_cents >= Case.assessed_fee_cents (else ERR_PANEL_SUPPLEMENT_UNPAID)"
        side_effects:
          - "creates PanelistAppointment with status NOMINATED"
          - "Case.status -> PANEL_APPOINTMENT"
          - "Case.updated_at = clock; Case.version += 1"

      - from: DEFAULT
        to: PANEL_APPOINTMENT
        trigger: "POST /udrp/cases/{id}/appointments (first appointment on the case)"
        actor: CaseManager
        preconditions:
          - "Case.status IN {RESPONSE_RECEIVED, DEFAULT}"
          - "expected_case_version == Case.version (else ERR_STALE_CASE_VERSION)"
          - "Case.paid_cents >= Case.assessed_fee_cents (else ERR_PANEL_SUPPLEMENT_UNPAID)"
        side_effects:
          - "creates PanelistAppointment with status NOMINATED"
          - "Case.status -> PANEL_APPOINTMENT"
          - "Case.updated_at = clock; Case.version += 1"
        note: "Convergence point: the answered branch and the defaulted branch rejoin here with an identical side-effect set."

      - from: PANEL_APPOINTMENT
        to: PANEL_APPOINTMENT
        trigger: "POST /udrp/cases/{id}/appointments (the second and third seat of a three-member panel), and POST /udrp/appointments/{id}/replace"
        actor: CaseManager
        preconditions:
          - "Case.status == PANEL_APPOINTMENT"
          - "expected_case_version == Case.version (else ERR_STALE_CASE_VERSION)"
          - "the requested seat is admitted by Case.required_seat_count (else ERR_SEAT_NOT_APPLICABLE)"
          - "the requested seat is not already held by a NOMINATED, WAIVER_PENDING or ACCEPTED row (else ERR_SEAT_ALREADY_FILLED)"
        side_effects:
          - "creates a further PanelistAppointment NOMINATED for the named seat"
          - "Case.status stays PANEL_APPOINTMENT until every seat is ACCEPTED"
          - "Case.updated_at = clock; Case.version += 1"
        note: "Self-loop on PANEL_APPOINTMENT: a three-member panel is filled one seat at a time, and every nomination requires a freshly read Case.version."

      - from: PANEL_APPOINTMENT
        to: PANEL_CONSTITUTED
        trigger: "system, on the PanelistAppointment transition that makes the count of ACCEPTED seats equal Case.required_seat_count"
        actor: system
        preconditions:
          - "Case.status == PANEL_APPOINTMENT"
          - "count of PanelistAppointment rows on the case with status == ACCEPTED equals Case.required_seat_count"
          - "those ACCEPTED rows hold distinct seats covering exactly {SOLE} when required_seat_count = 1 or {PRESIDING, CO_PANELIST_1, CO_PANELIST_2} when it is 3"
        side_effects:
          - "Case.status -> PANEL_CONSTITUTED"
          - "calculations.panelist_honoraria_allocation runs and writes PanelistAppointment.honoraria_cents on every ACCEPTED seat"
          - "Case.updated_at = clock; Case.version += 1"

      - from: PANEL_CONSTITUTED
        to: PANEL_APPOINTMENT
        trigger: "POST /udrp/appointments/{id}/replace (on a seat whose status is ACCEPTED)"
        actor: CaseManager
        preconditions:
          - "Case.status == PANEL_CONSTITUTED"
          - "the appointment's status == ACCEPTED"
        side_effects:
          - "link 1: PanelistAppointment.status ACCEPTED -> REPLACED, replaced_by_appointment_id set to the successor row, honoraria_cents -> 0"
          - "link 2 (caused by link 1): Panelist.active_case_load -= 1 on the vacated panelist"
          - "link 3 (caused by link 1): Case.status PANEL_CONSTITUTED -> PANEL_APPOINTMENT"
          - "link 4 (caused by link 3): every Decision on the case with status == DRAFT becomes VOIDED with voided_at = clock, and its PanelVote rows stay on the record as immutable history"
          - "a successor PanelistAppointment row is minted for the same seat with status NOMINATED"
          - "Case.updated_at = clock; Case.version += 1"
        note: "Second Case loop: PANEL_APPOINTMENT -> PANEL_CONSTITUTED -> PANEL_APPOINTMENT."

      - from: PANEL_CONSTITUTED
        to: IMPLEMENTATION_WAITING
        trigger: "POST /udrp/decisions/{id}/issue"
        actor: CaseManager
        preconditions:
          - "Case.status == PANEL_CONSTITUTED (else ERR_PANEL_NOT_CONSTITUTED)"
          - "Decision.status == DRAFT (else ERR_INVALID_DECISION_STATE)"
          - "the ACCEPTED PanelistAppointment rows on Decision.case_id cover each required seat exactly once and their count equals Case.required_seat_count, with REPLACED, DECLINED, CONFLICTED and DISCHARGED rows ignored (else ERR_PANEL_NOT_CONSTITUTED)"
          - "count of PanelVote rows on the decision equals Case.required_seat_count (else ERR_VOTES_INCOMPLETE)"
        side_effects:
          - "calculations.panel_outcome_tally writes Decision.outcome, outcome_basis, rdnh_finding, dissent_present, transfer_votes, cancellation_votes, deny_votes"
          - "Decision.status DRAFT -> ISSUED, issued_at = clock"
          - "calculations.implementation_window writes Decision.implementation_deadline_at"
          - "Case.status -> IMPLEMENTATION_WAITING"
          - "when Decision.rdnh_finding == true: Complainant.adverse_rdnh_findings += 1 on Case.complainant_id"
          - "Case.updated_at = clock; Case.version += 1"

      - from: IMPLEMENTATION_WAITING
        to: STAYED
        trigger: "POST /udrp/decisions/{id}/court-challenges"
        actor: Complainant | Respondent
        preconditions:
          - "Case.status == IMPLEMENTATION_WAITING"
          - "Decision.status == ISSUED (else ERR_INVALID_DECISION_STATE)"
          - "clock <= Decision.implementation_deadline_at (else ERR_CHALLENGE_WINDOW_CLOSED)"
        side_effects:
          - "creates CourtChallenge with status FILED, filed_at = clock"
          - "Decision.status ISSUED -> STAYED"
          - "Case.status -> STAYED"
          - "Case.updated_at = clock; Case.version += 1"

      - from: STAYED
        to: IMPLEMENTATION_WAITING
        trigger: "POST /udrp/court-challenges/{id}/resolve with outcome DISMISSED or WITHDRAWN"
        actor: ProviderAdmin
        preconditions:
          - "Case.status == STAYED"
          - "CourtChallenge.status == FILED"
        side_effects:
          - "CourtChallenge.status -> DISMISSED or WITHDRAWN, resolved_at = clock"
          - "Decision.status STAYED -> ISSUED"
          - "Decision.implementation_deadline_at is recomputed by calculations.implementation_window from resolved_at"
          - "Case.status -> IMPLEMENTATION_WAITING"
          - "Case.updated_at = clock; Case.version += 1"
        note: "Third Case loop: IMPLEMENTATION_WAITING -> STAYED -> IMPLEMENTATION_WAITING, with a freshly counted waiting period each time."

      - from: STAYED
        to: TERMINATED_COURT
        trigger: "POST /udrp/court-challenges/{id}/resolve with outcome SUSTAINED"
        actor: ProviderAdmin
        preconditions:
          - "Case.status == STAYED"
          - "CourtChallenge.status == FILED"
        side_effects:
          - "link 1: CourtChallenge.status FILED -> SUSTAINED, resolved_at = clock"
          - "link 2 (caused by link 1): Decision.status STAYED -> VOIDED, voided_at = clock"
          - "link 3 (caused by link 2): Case.status STAYED -> TERMINATED_COURT, closed_at = clock, refiling_bar_until = clock + COOLING_OFF_DAYS days"
          - "link 4 (caused by link 3): every PanelistAppointment row on the case with status == ACCEPTED becomes DISCHARGED"
          - "link 5 (caused by link 4): Panelist.active_case_load -= 1 for each discharged seat"
          - "also caused by link 3: DomainName.lock_status LOCKED -> UNLOCKED and Complainant.open_case_count -= 1"
          - "when Decision.rdnh_finding == true: Complainant.adverse_rdnh_findings -= 1 (the voided finding stops counting)"
          - "Case.updated_at = clock; Case.version += 1"

      - from: IMPLEMENTATION_WAITING
        to: IMPLEMENTED
        trigger: "POST /udrp/decisions/{id}/implement"
        actor: RegistrarAgent
        preconditions:
          - "Case.status == IMPLEMENTATION_WAITING"
          - "Decision.status == ISSUED (else ERR_INVALID_DECISION_STATE)"
          - "X-User-ID == DomainName.registrar_id of Case.domain_id (else ERR_REGISTRAR_MISMATCH)"
          - "clock > Decision.implementation_deadline_at (else ERR_IMPLEMENTATION_PERIOD_ACTIVE)"
          - "DomainName.lock_status == LOCKED (else ERR_DOMAIN_NOT_LOCKED)"
        side_effects:
          - "link 1: Decision.status ISSUED -> IMPLEMENTED, implemented_at = clock"
          - "link 2 (caused by link 1): DomainName.lock_status LOCKED -> TRANSFER_EXECUTED when Decision.outcome == TRANSFER, -> CANCELLATION_EXECUTED when CANCELLATION, -> UNLOCKED when COMPLAINT_DENIED; executed_at = clock for the first two"
          - "link 3 (caused by link 1): Case.status -> IMPLEMENTED, closed_at = clock, refiling_bar_until = clock + COOLING_OFF_DAYS days"
          - "link 4 (caused by link 3): every ACCEPTED PanelistAppointment becomes DISCHARGED"
          - "link 5 (caused by link 4): Panelist.active_case_load -= 1 for each discharged seat"
          - "also caused by link 3: Complainant.open_case_count -= 1"
          - "Case.updated_at = clock; Case.version += 1"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /udrp/cases/{id}/withdraw"
        actor: Complainant
        preconditions:
          - "Case.status IN {FILED, DEFICIENT, VERIFICATION_PENDING, NOTIFICATION_PENDING, COMMENCED, RESPONSE_RECEIVED, DEFAULT} (else ERR_WITHDRAWAL_WINDOW_CLOSED)"
          - "X-User-ID == Case.complainant_id (else ERR_NOT_OWNER)"
        side_effects:
          - "Case.status -> WITHDRAWN, closed_at = clock, refiling_bar_until = clock + COOLING_OFF_DAYS days"
          - "calculations.withdrawal_refund mints one REFUND FeeTransaction per payer with a positive contribution, then Case.paid_cents / complainant_paid_cents / respondent_paid_cents are recomputed from the ledger"
          - "any DeficiencyNotice with status OPEN becomes EXPIRED"
          - "any RegistrarVerification with status IN {REQUESTED, OVERDUE} becomes OVERDUE"
          - "when DomainName.lock_status == LOCKED it becomes UNLOCKED"
          - "Complainant.open_case_count -= 1"
          - "Case.updated_at = clock; Case.version += 1"
        note: "The same transition definition applies from DEFICIENT, VERIFICATION_PENDING, NOTIFICATION_PENDING, COMMENCED, RESPONSE_RECEIVED and DEFAULT; only the refund percentage differs, per calculations.withdrawal_refund."

  - entity: DomainName
    state_field: lock_status
    initial_state: UNLOCKED
    terminal_states: [TRANSFER_EXECUTED, CANCELLATION_EXECUTED]
    shape: cyclic
    transitions:
      - from: UNLOCKED
        to: LOCKED
        trigger: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response with lock_applied true"
        actor: RegistrarAgent
        preconditions:
          - "DomainName.lock_status == UNLOCKED"
          - "the domain is referenced by the case whose verification is being answered"
        side_effects:
          - "DomainName.lock_status -> LOCKED, locked_at = clock, DomainName.version += 1"
        note: "The lock is what prevents transfer during the proceeding; commencement is gated on it."

      - from: LOCKED
        to: UNLOCKED
        trigger: "system, when the case holding the lock reaches ADMIN_CLOSED, WITHDRAWN or TERMINATED_COURT, or reaches IMPLEMENTED with outcome COMPLAINT_DENIED"
        actor: system
        preconditions:
          - "DomainName.lock_status == LOCKED"
        side_effects:
          - "DomainName.lock_status -> UNLOCKED, locked_at -> null, DomainName.version += 1"
        note: "Cycle: a domain released this way can be locked again by a later case once refiling_bar_until has passed."

      - from: LOCKED
        to: TRANSFER_EXECUTED
        trigger: "POST /udrp/decisions/{id}/implement on a decision whose outcome is TRANSFER"
        actor: RegistrarAgent
        preconditions:
          - "DomainName.lock_status == LOCKED (else ERR_DOMAIN_NOT_LOCKED)"
          - "Decision.outcome == TRANSFER"
          - "clock > Decision.implementation_deadline_at (else ERR_IMPLEMENTATION_PERIOD_ACTIVE)"
        side_effects:
          - "DomainName.lock_status -> TRANSFER_EXECUTED, executed_at = clock, DomainName.version += 1"

      - from: LOCKED
        to: CANCELLATION_EXECUTED
        trigger: "POST /udrp/decisions/{id}/implement on a decision whose outcome is CANCELLATION"
        actor: RegistrarAgent
        preconditions:
          - "DomainName.lock_status == LOCKED (else ERR_DOMAIN_NOT_LOCKED)"
          - "Decision.outcome == CANCELLATION"
          - "clock > Decision.implementation_deadline_at (else ERR_IMPLEMENTATION_PERIOD_ACTIVE)"
        side_effects:
          - "DomainName.lock_status -> CANCELLATION_EXECUTED, executed_at = clock, DomainName.version += 1"

  - entity: DeficiencyNotice
    state_field: status
    initial_state: OPEN
    terminal_states: [CURED, EXPIRED]
    shape: branching
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /udrp/cases/{id}/corrections naming this notice"
        actor: Complainant
        preconditions:
          - "DeficiencyNotice.status == OPEN"
          - "clock <= DeficiencyNotice.correction_deadline_at (else ERR_CORRECTION_PERIOD_EXPIRED)"
        side_effects:
          - "DeficiencyNotice.status -> CURED, cured_at = clock"
          - "Case.status DEFICIENT -> FILED"

      - from: OPEN
        to: EXPIRED
        trigger: "POST /udrp/_ops/deadline-sweep, or the withdrawal of the parent case"
        actor: system
        preconditions:
          - "DeficiencyNotice.status == OPEN"
          - "clock > DeficiencyNotice.correction_deadline_at, or the parent case is being withdrawn"
        side_effects:
          - "DeficiencyNotice.status -> EXPIRED"
          - "when the trigger was the sweep: Case.status DEFICIENT -> ADMIN_CLOSED plus the refund cascade described on that Case transition"

  - entity: RegistrarVerification
    state_field: status
    initial_state: REQUESTED
    terminal_states: [RESPONDED]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: OVERDUE
        trigger: "POST /udrp/_ops/deadline-sweep"
        actor: system
        preconditions:
          - "RegistrarVerification.status == REQUESTED"
          - "clock > RegistrarVerification.due_at"
        side_effects:
          - "RegistrarVerification.status -> OVERDUE, escalation_count += 1"
          - "Registrar.overdue_verification_count += 1"

      - from: OVERDUE
        to: REQUESTED
        trigger: "POST /udrp/cases/{id}/registrar-verifications (a re-request on the same case)"
        actor: CaseManager
        preconditions:
          - "RegistrarVerification.status == OVERDUE"
          - "Case.status == VERIFICATION_PENDING"
        side_effects:
          - "RegistrarVerification.status -> REQUESTED, requested_at = clock, due_at = clock + Registrar.verification_response_hours hours"
        note: "Cycle: REQUESTED -> OVERDUE -> REQUESTED, with escalation_count accumulating across laps."

      - from: REQUESTED
        to: RESPONDED
        trigger: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response"
        actor: RegistrarAgent
        preconditions:
          - "RegistrarVerification.status IN {REQUESTED, OVERDUE}"
          - "lock_applied == true (else ERR_DOMAIN_LOCK_NOT_APPLIED)"
        side_effects:
          - "RegistrarVerification.status -> RESPONDED, responded_at = clock"
          - "DomainName.lock_status -> LOCKED; Case.status VERIFICATION_PENDING -> NOTIFICATION_PENDING"

      - from: OVERDUE
        to: RESPONDED
        trigger: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response"
        actor: RegistrarAgent
        preconditions:
          - "RegistrarVerification.status IN {REQUESTED, OVERDUE}"
          - "lock_applied == true (else ERR_DOMAIN_LOCK_NOT_APPLIED)"
        side_effects:
          - "RegistrarVerification.status -> RESPONDED, responded_at = clock; Registrar.overdue_verification_count -= 1"
          - "DomainName.lock_status -> LOCKED; Case.status VERIFICATION_PENDING -> NOTIFICATION_PENDING"

  - entity: RespondentNotification
    state_field: status
    initial_state: SENT
    terminal_states: [DELIVERED, UNDELIVERABLE]
    shape: branching
    transitions:
      - from: SENT
        to: DELIVERED
        trigger: "POST /udrp/cases/{id}/notifications/{notification_id}/delivery with outcome DELIVERED"
        actor: CaseManager
        preconditions:
          - "RespondentNotification.status == SENT"
          - "deemed_received_at, when supplied, is not earlier than dispatched_at (else ERR_INVALID_REQUEST)"
        side_effects:
          - "RespondentNotification.status -> DELIVERED, deemed_received_at = the supplied deemed_received_at, defaulting to the logical clock when omitted"
          - "Case.response_due_at is replaced by variant FINAL_AT_DELIVERY of calculations.response_deadline_projection, which may move the deadline earlier or later than the provisional value"
          - "Case.deadline_variant_applied -> FINAL; Case.version += 1"

      - from: SENT
        to: UNDELIVERABLE
        trigger: "POST /udrp/cases/{id}/notifications/{notification_id}/delivery with outcome UNDELIVERABLE"
        actor: CaseManager
        preconditions:
          - "RespondentNotification.status == SENT"
        side_effects:
          - "RespondentNotification.status -> UNDELIVERABLE, failure_reason stored"
          - "Case.response_due_at keeps the provisional value from this attempt until a further attempt is dispatched"

  - entity: PanelistAppointment
    state_field: status
    initial_state: NOMINATED
    terminal_states: [DECLINED, REPLACED, DISCHARGED]
    shape: branching
    transitions:
      - from: NOMINATED
        to: ACCEPTED
        trigger: "POST /udrp/appointments/{id}/conflict-screening whose computed conflict_score is below CONFLICT_WAIVER_THRESHOLD"
        actor: Panelist
        preconditions:
          - "PanelistAppointment.status == NOMINATED (else ERR_INVALID_APPOINTMENT_STATE)"
          - "X-User-ID == PanelistAppointment.panelist_id (else ERR_NOT_SEAT_HOLDER)"
        side_effects:
          - "PanelistAppointment.conflict_score and conflict_factors are written by calculations.panelist_conflict_score"
          - "PanelistAppointment.status -> ACCEPTED, accepted_at = clock, decision_due_at = clock + DECISION_PERIOD_DAYS days"
          - "Panelist.active_case_load += 1"
          - "when the ACCEPTED count now equals Case.required_seat_count: Case.status PANEL_APPOINTMENT -> PANEL_CONSTITUTED and honoraria are allocated across the seats"

      - from: NOMINATED
        to: WAIVER_PENDING
        trigger: "POST /udrp/appointments/{id}/conflict-screening whose computed conflict_score is at or above CONFLICT_WAIVER_THRESHOLD and below CONFLICT_DISQUALIFY_THRESHOLD"
        actor: Panelist
        preconditions:
          - "PanelistAppointment.status == NOMINATED (else ERR_INVALID_APPOINTMENT_STATE)"
          - "X-User-ID == PanelistAppointment.panelist_id (else ERR_NOT_SEAT_HOLDER)"
        side_effects:
          - "PanelistAppointment.conflict_score and conflict_factors are written; status -> WAIVER_PENDING"
          - "Panelist.active_case_load is NOT incremented yet"

      - from: NOMINATED
        to: CONFLICTED
        trigger: "POST /udrp/appointments/{id}/conflict-screening whose computed conflict_score is at or above CONFLICT_DISQUALIFY_THRESHOLD"
        actor: Panelist
        preconditions:
          - "PanelistAppointment.status == NOMINATED (else ERR_INVALID_APPOINTMENT_STATE)"
          - "X-User-ID == PanelistAppointment.panelist_id (else ERR_NOT_SEAT_HOLDER)"
        side_effects:
          - "PanelistAppointment.conflict_score and conflict_factors are written; status -> CONFLICTED"
          - "no load is taken; the seat stays vacant and must be filled by POST /udrp/appointments/{id}/replace"
        note: "Three-way branch out of NOMINATED, chosen purely by where the computed score falls against the two thresholds."

      - from: WAIVER_PENDING
        to: ACCEPTED
        trigger: "POST /udrp/appointments/{id}/waiver"
        actor: CaseManager
        preconditions:
          - "PanelistAppointment.status == WAIVER_PENDING (else ERR_INVALID_APPOINTMENT_STATE)"
          - "PanelistAppointment.conflict_score < CONFLICT_DISQUALIFY_THRESHOLD (else ERR_CONFLICT_NOT_WAIVABLE)"
          - "waiver_complainant == true, and waiver_respondent == true unless Case.default_recorded == true (else ERR_WAIVER_INCOMPLETE)"
        side_effects:
          - "PanelistAppointment.waiver_complainant and waiver_respondent recorded from the payload, status -> ACCEPTED, accepted_at = clock, decision_due_at = clock + DECISION_PERIOD_DAYS days"
          - "Panelist.active_case_load += 1"
          - "when the ACCEPTED count now equals Case.required_seat_count: Case.status -> PANEL_CONSTITUTED and honoraria are allocated"

      - from: WAIVER_PENDING
        to: DECLINED
        trigger: "POST /udrp/appointments/{id}/replace"
        actor: CaseManager
        preconditions:
          - "PanelistAppointment.status IN {NOMINATED, WAIVER_PENDING}"
        side_effects:
          - "PanelistAppointment.status -> DECLINED"
          - "a successor row is minted for the same seat with status NOMINATED, and the predecessor's replaced_by_appointment_id points at it"

      - from: CONFLICTED
        to: REPLACED
        trigger: "POST /udrp/appointments/{id}/replace"
        actor: CaseManager
        preconditions:
          - "PanelistAppointment.status == CONFLICTED"
        side_effects:
          - "PanelistAppointment.status -> REPLACED, replaced_by_appointment_id set"
          - "a successor row is minted for the same seat with status NOMINATED"
          - "no load adjustment happens, because a CONFLICTED seat never took load"

      - from: ACCEPTED
        to: REPLACED
        trigger: "POST /udrp/appointments/{id}/replace"
        actor: CaseManager
        preconditions:
          - "PanelistAppointment.status == ACCEPTED"
        side_effects:
          - "PanelistAppointment.status -> REPLACED, honoraria_cents -> 0"
          - "Panelist.active_case_load -= 1 on the vacated panelist"
          - "Case.status PANEL_CONSTITUTED -> PANEL_APPOINTMENT, and every DRAFT Decision on the case becomes VOIDED"
          - "a successor row is minted for the same seat with status NOMINATED"

      - from: ACCEPTED
        to: DISCHARGED
        trigger: "system, when the case reaches IMPLEMENTED or TERMINATED_COURT"
        actor: system
        preconditions:
          - "PanelistAppointment.status == ACCEPTED"
          - "the parent case is closing"
        side_effects:
          - "PanelistAppointment.status -> DISCHARGED, discharged_at = clock"
          - "Panelist.active_case_load -= 1; honoraria_cents is preserved as the earned amount"

  - entity: Decision
    state_field: status
    initial_state: DRAFT
    terminal_states: [IMPLEMENTED, VOIDED]
    shape: cyclic
    dimensions_note: |
      Decision carries two independent state dimensions. `status` (DRAFT, ISSUED, STAYED, IMPLEMENTED,
      VOIDED) tracks the adjudication lifecycle. `publication_status` (UNPUBLISHED, PUBLISHED, REDACTED)
      tracks the precedent database and advances on its own trigger. A decision may be PUBLISHED while
      still ISSUED, and it may be VOIDED while already PUBLISHED — publication is never rolled back,
      because the precedent record of a voided decision remains part of the published corpus with
      PrecedentEntry.superseded set. Every combination of the two dimensions that is reachable is
      legitimate; neither dimension constrains the other except that publication requires status != DRAFT.
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /udrp/decisions/{id}/issue"
        actor: CaseManager
        preconditions:
          - "Decision.status == DRAFT (else ERR_INVALID_DECISION_STATE)"
          - "Case.status == PANEL_CONSTITUTED (else ERR_PANEL_NOT_CONSTITUTED)"
          - "count of PanelVote rows equals Case.required_seat_count (else ERR_VOTES_INCOMPLETE)"
        side_effects:
          - "outcome, outcome_basis, rdnh_finding, dissent_present and the three vote counts are written by calculations.panel_outcome_tally"
          - "Decision.status -> ISSUED, issued_at = clock; implementation_deadline_at written by calculations.implementation_window"
          - "Case.status -> IMPLEMENTATION_WAITING"

      - from: ISSUED
        to: STAYED
        trigger: "POST /udrp/decisions/{id}/court-challenges"
        actor: Complainant | Respondent
        preconditions:
          - "Decision.status == ISSUED (else ERR_INVALID_DECISION_STATE)"
          - "clock <= Decision.implementation_deadline_at (else ERR_CHALLENGE_WINDOW_CLOSED)"
        side_effects:
          - "Decision.status -> STAYED; Case.status -> STAYED; a CourtChallenge row is created with status FILED"

      - from: STAYED
        to: ISSUED
        trigger: "POST /udrp/court-challenges/{id}/resolve with outcome DISMISSED or WITHDRAWN"
        actor: ProviderAdmin
        preconditions:
          - "Decision.status == STAYED"
          - "CourtChallenge.status == FILED"
        side_effects:
          - "Decision.status -> ISSUED; implementation_deadline_at recomputed from the resolution instant"
          - "Case.status -> IMPLEMENTATION_WAITING"
        note: "Cycle: ISSUED -> STAYED -> ISSUED. Each lap restarts the business-day waiting period."

      - from: ISSUED
        to: IMPLEMENTED
        trigger: "POST /udrp/decisions/{id}/implement"
        actor: RegistrarAgent
        preconditions:
          - "Decision.status == ISSUED (else ERR_INVALID_DECISION_STATE)"
          - "clock > Decision.implementation_deadline_at (else ERR_IMPLEMENTATION_PERIOD_ACTIVE)"
          - "DomainName.lock_status == LOCKED (else ERR_DOMAIN_NOT_LOCKED)"
        side_effects:
          - "Decision.status -> IMPLEMENTED, implemented_at = clock"
          - "the domain moves to TRANSFER_EXECUTED, CANCELLATION_EXECUTED or UNLOCKED per the outcome; the case closes; seats are discharged"

      - from: STAYED
        to: VOIDED
        trigger: "POST /udrp/court-challenges/{id}/resolve with outcome SUSTAINED"
        actor: ProviderAdmin
        preconditions:
          - "Decision.status == STAYED"
          - "CourtChallenge.status == FILED"
        side_effects:
          - "Decision.status -> VOIDED, voided_at = clock"
          - "Case.status -> TERMINATED_COURT; seats are discharged; the domain unlocks"
          - "when the decision was PUBLISHED, its PrecedentEntry.superseded becomes true; publication_status is left as it was"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /udrp/appointments/{id}/replace on an ACCEPTED seat of the same case"
        actor: CaseManager
        preconditions:
          - "Decision.status == DRAFT"
          - "the case leaves PANEL_CONSTITUTED because a seated panelist is replaced"
        side_effects:
          - "Decision.status -> VOIDED, voided_at = clock; the PanelVote rows already cast on it remain readable"

  - entity: Decision
    state_field: publication_status
    initial_state: UNPUBLISHED
    terminal_states: [PUBLISHED, REDACTED]
    shape: branching
    transitions:
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /udrp/decisions/{id}/publish with redaction_level NONE"
        actor: ProviderAdmin
        preconditions:
          - "Decision.publication_status == UNPUBLISHED (else ERR_ALREADY_PUBLISHED)"
          - "Decision.status != DRAFT (else ERR_INVALID_DECISION_STATE)"
        side_effects:
          - "Decision.publication_status -> PUBLISHED; the PrecedentEntry row carries published_at = clock and redaction_level = NONE"
          - "a PrecedentEntry row is created and calculations.precedent_citation_metrics writes its citation fields"

      - from: UNPUBLISHED
        to: REDACTED
        trigger: "POST /udrp/decisions/{id}/publish with redaction_level PARTY_NAMES or FULL"
        actor: ProviderAdmin
        preconditions:
          - "Decision.publication_status == UNPUBLISHED (else ERR_ALREADY_PUBLISHED)"
          - "Decision.status != DRAFT (else ERR_INVALID_DECISION_STATE)"
        side_effects:
          - "Decision.publication_status -> REDACTED; the PrecedentEntry row carries published_at = clock and the submitted redaction_level"
          - "a PrecedentEntry row is created with citable = true when redaction_level == PARTY_NAMES and false when FULL"
        note: "A REDACTED decision is still in the precedent database; only a FULL redaction removes it from the citable corpus."

  - entity: CourtChallenge
    state_field: status
    initial_state: FILED
    terminal_states: [DISMISSED, SUSTAINED, WITHDRAWN]
    shape: branching
    transitions:
      - from: FILED
        to: DISMISSED
        trigger: "POST /udrp/court-challenges/{id}/resolve with outcome DISMISSED"
        actor: ProviderAdmin
        preconditions:
          - "CourtChallenge.status == FILED (else ERR_INVALID_CASE_STATE)"
        side_effects:
          - "CourtChallenge.status -> DISMISSED, resolved_at = clock"
          - "Decision.status STAYED -> ISSUED with a freshly computed implementation_deadline_at; Case.status -> IMPLEMENTATION_WAITING"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /udrp/court-challenges/{id}/resolve with outcome WITHDRAWN"
        actor: ProviderAdmin
        preconditions:
          - "CourtChallenge.status == FILED (else ERR_INVALID_CASE_STATE)"
        side_effects:
          - "CourtChallenge.status -> WITHDRAWN, resolved_at = clock"
          - "Decision.status STAYED -> ISSUED with a freshly computed implementation_deadline_at; Case.status -> IMPLEMENTATION_WAITING"

      - from: FILED
        to: SUSTAINED
        trigger: "POST /udrp/court-challenges/{id}/resolve with outcome SUSTAINED"
        actor: ProviderAdmin
        preconditions:
          - "CourtChallenge.status == FILED (else ERR_INVALID_CASE_STATE)"
        side_effects:
          - "the five-link cascade described on the Case STAYED -> TERMINATED_COURT transition runs in full"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - name: appointment-nominate-stale-case
    parent_entity: Case
    occ_field: version
    write_endpoint: "POST /udrp/cases/{id}/appointments"
    payload_field: expected_case_version
    required: true
    error_id: ERR_STALE_CASE_VERSION
    status: 412
    priority: 45
    description: |
      Nominating a panelist to a seat reads the case's seat plan, its paid totals and its existing
      appointment rows, then writes a new row and advances the case. The caller must pass the
      Case.version it read. When the stored version differs, the nomination is refused with
      ERR_STALE_CASE_VERSION and nothing is written. Because a respondent's three-member election
      changes required_seat_count and the assessed fee, a nomination computed against a pre-election
      snapshot of the case would place a seat that does not exist in the current plan.
    increments: "Case.version += 1 on success"

  - name: decision-draft-stale-case
    parent_entity: Case
    occ_field: version
    write_endpoint: "POST /udrp/cases/{id}/decisions"
    payload_field: expected_case_version
    required: true
    error_id: ERR_STALE_CASE_VERSION
    status: 412
    priority: 45
    description: |
      Opening a decision draft snapshots the constituted panel and the seat count that the eventual
      vote tally will be measured against. The caller must pass the Case.version it read. When a seat
      has been replaced since that read the stored version has moved and the draft is refused with
      ERR_STALE_CASE_VERSION, so a draft can never be attached to a panel composition that no longer
      holds.
    increments: "Case.version += 1 on success"

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: filing_fee_assessment
    trigger: "On POST /udrp/cases (variant PROVISIONAL_AT_FILING) and again on the POST /udrp/cases/{id}/responses that carries requests_three_member_panel true (variant FINAL_AT_ELECTION)."
    algorithm: tiered_pricing
    formula: |
      seat_count      = Case.required_seat_count            # 1 at filing, 3 after a respondent election
      panel_supplement = THREE_MEMBER_SUPPLEMENT_CENTS if seat_count == 3 else 0
      # The expedited surcharge is charged on the BASE administrative fee only.
      # It is never charged on the three-member supplement, so the surcharge is a
      # constant 18750 whenever expedited_requested is true, at either seat count.
      surcharge       = round_half_up(BASE_ADMIN_FEE_CENTS * EXPEDITED_SURCHARGE_PCT) if Case.expedited_requested else 0
      assessed_fee_cents = BASE_ADMIN_FEE_CENTS + panel_supplement + surcharge

      # Cost sharing. The complainant carries everything except half of the panel
      # supplement, which the electing respondent carries. The respondent's share is a
      # floor of half the raw supplement and is NOT re-scaled by the surcharge.
      respondent_share_cents = floor(THREE_MEMBER_SUPPLEMENT_CENTS / 2) if seat_count == 3 else 0
      complainant_share_cents = assessed_fee_cents - respondent_share_cents

      honoraria_pool_cents  = round_half_up(assessed_fee_cents * PANELIST_HONORARIA_SHARE_PCT)
      provider_retained_cents = assessed_fee_cents - honoraria_pool_cents
    input_set: "The single Case being priced. Case.required_seat_count and Case.expedited_requested are the only inputs; no ledger row participates."
    constants:
      BASE_ADMIN_FEE_CENTS: 150000
      THREE_MEMBER_SUPPLEMENT_CENTS: 250000
      EXPEDITED_SURCHARGE_PCT: 0.125
      PANELIST_HONORARIA_SHARE_PCT: 0.70
      PROVIDER_ADMIN_SHARE_PCT: 0.30
    precision: "Integer cents. round_half_up on the surcharge and on the honoraria pool; floor on the respondent's half-supplement."
    worked_examples:
      - "seat_count 1, expedited false -> assessed 150000, complainant_share 150000, respondent_share 0, honoraria_pool 105000, provider_retained 45000"
      - "seat_count 1, expedited true  -> surcharge 18750, assessed 168750, complainant_share 168750, respondent_share 0, honoraria_pool 118125, provider_retained 50625"
      - "seat_count 3, expedited false -> assessed 400000, respondent_share 125000, complainant_share 275000, honoraria_pool 280000, provider_retained 120000"
      - "seat_count 3, expedited true  -> surcharge is still 18750 (not 50000), assessed 418750, respondent_share 125000, complainant_share 293750, honoraria_pool 293125, provider_retained 125625"
    variants:
      - name: PROVISIONAL_AT_FILING
        when: "Computed on POST /udrp/cases, before the respondent has had any chance to elect a three-member panel. Case.fee_variant_applied is set to PROVISIONAL."
        difference: "seat_count is forced to 1, so panel_supplement is 0 and respondent_share_cents is 0. The complainant is billed the whole provisional amount and compliance clearance is gated on complainant_paid_cents >= complainant_share_cents only."
      - name: FINAL_AT_ELECTION
        when: "Recomputed on POST /udrp/cases/{id}/responses when requests_three_member_panel is true. Case.fee_variant_applied is set to FINAL."
        difference: "seat_count becomes 3, so the supplement enters the assessment and half of the raw supplement is re-attributed to the respondent. The complainant's share therefore RISES (150000 -> 275000, or 168750 -> 293750) even though a share was moved to the respondent, and appointment is additionally gated on Case.paid_cents >= assessed_fee_cents via ERR_PANEL_SUPPLEMENT_UNPAID. For identical Case data the two variants disagree on all five outputs."
    reconciliation: "No delta ledger row is written. The Case's four money fields are overwritten in place and the existing FeeTransaction rows are left untouched, so a case that had fully paid the provisional assessment is instantly short against the final one."

  - name: panelist_honoraria_allocation
    trigger: "Runs on the PanelistAppointment transition into ACCEPTED that makes the ACCEPTED seat count equal Case.required_seat_count (that is, at the moment Case.status becomes PANEL_CONSTITUTED)."
    algorithm: waterfall_allocation
    formula: |
      pool = Case.honoraria_pool_cents

      if Case.required_seat_count == 1:
          honoraria[SOLE] = pool                       # exact, no rounding at all
      else:
          # STEP 1 — floor every seat's raw share independently.
          presiding_floor = floor(pool * SEAT_HONORARIA_PCT[PRESIDING])
          co1_floor       = floor(pool * SEAT_HONORARIA_PCT[CO_PANELIST_1])
          co2_floor       = floor(pool * SEAT_HONORARIA_PCT[CO_PANELIST_2])
          # STEP 2 — the whole undistributed remainder goes to the PRESIDING seat.
          remainder = pool - (presiding_floor + co1_floor + co2_floor)
          honoraria[PRESIDING]     = presiding_floor + remainder
          honoraria[CO_PANELIST_1] = co1_floor
          honoraria[CO_PANELIST_2] = co2_floor

      # Invariant, enforced by construction: sum(honoraria) == pool exactly.
    input_set: "Only PanelistAppointment rows on the case whose status is ACCEPTED. Rows in NOMINATED, WAIVER_PENDING, CONFLICTED, DECLINED, REPLACED or DISCHARGED are excluded; a REPLACED row's honoraria_cents is reset to 0 and a DISCHARGED row keeps the amount it earned."
    constants:
      SEAT_HONORARIA_PCT:
        SOLE: 1.00
        PRESIDING: 0.40
        CO_PANELIST_1: 0.30
        CO_PANELIST_2: 0.30
    precision: "Integer cents. The order is pinned: floor each seat first, then hand the entire remainder to PRESIDING. Rounding each seat independently with round_half_up is WRONG and will overshoot the pool."
    worked_examples:
      - "pool 293125 (three-member expedited) -> PRESIDING 117251, CO_PANELIST_1 87937, CO_PANELIST_2 87937; sum 293125. Independent round_half_up would yield 117250 + 87938 + 87938 = 293126, one cent over pool."
      - "pool 280000 (three-member standard) -> PRESIDING 112000, CO_PANELIST_1 84000, CO_PANELIST_2 84000; sum 280000. Here remainder is 0 and both rounding orders agree, which is why the expedited case is the discriminating one."
      - "pool 105000, seat_count 1 -> SOLE 105000."
      - "pool 118125, seat_count 1 -> SOLE 118125."

  - name: panelist_conflict_score
    trigger: "On POST /udrp/appointments/{id}/conflict-screening. The computed score alone decides whether the appointment lands in ACCEPTED, WAIVER_PENDING or CONFLICTED."
    algorithm: weighted_scoring
    formula: |
      # Disclosed factors arrive in the request body as booleans and one integer.
      raw =   W_PRIOR_REPRESENTATION * (1 if disclosed_prior_representation else 0)
            + W_SAME_FIRM           * (1 if disclosed_same_firm   else 0)
            + W_FINANCIAL_INTEREST  * (1 if disclosed_financial_interest   else 0)
            + min(W_PRIOR_APPOINTMENT_EACH * prior_appointments_with_complainant, PRIOR_APPOINTMENT_CAP)

      # Age decay. months_since_last_contact is null when the relationship is current.
      if months_since_last_contact is null:
          decay = 1.00
      else:
          decay = max(CONFLICT_DECAY_FLOOR, 1 - months_since_last_contact / CONFLICT_DECAY_HORIZON_MONTHS)

      # A declared financial interest is NON-DECAYING: it is carved out before the decay
      # multiplier and added back at full weight afterwards.
      financial_component = W_FINANCIAL_INTEREST if disclosed_financial_interest else 0
      decayable           = raw - financial_component
      conflict_score = min(100.00, round_half_up(decayable * decay, 2) + financial_component)

      # Banding — note the inclusive lower bounds.
      if conflict_score >= CONFLICT_DISQUALIFY_THRESHOLD:   status = CONFLICTED
      elif conflict_score >= CONFLICT_WAIVER_THRESHOLD:      status = WAIVER_PENDING
      else:                                                  status = ACCEPTED
    input_set: "The disclosure payload of the single screening call, plus the appointment's own row. No other appointment or case participates; prior_appointments_with_complainant is supplied by the disclosing panelist rather than counted by the server."
    constants:
      W_PRIOR_REPRESENTATION: 45
      W_SAME_FIRM: 35
      W_FINANCIAL_INTEREST: 60
      W_PRIOR_APPOINTMENT_EACH: 8
      PRIOR_APPOINTMENT_CAP: 24
      CONFLICT_DECAY_HORIZON_MONTHS: 24
      CONFLICT_DECAY_FLOOR: 0.25
      CONFLICT_DISQUALIFY_THRESHOLD: 60
      CONFLICT_WAIVER_THRESHOLD: 30
    precision: "2 decimal places, round_half_up, applied once to the decayed decayable component before the non-decaying financial component is added back. Score is clamped to at most 100.00."
    worked_examples:
      - "disclosed_prior_representation true, same_firm true, months_since_last_contact 6 -> raw 80, decay 0.75, score exactly 60.00 -> CONFLICTED, because the disqualify band is >= not >."
      - "disclosed_prior_representation true, same_firm true, months_since_last_contact 7 -> raw 80, decay 0.7083333..., score 56.67 -> WAIVER_PENDING. One extra month of distance moves the seat from disqualified to waivable."
      - "same_firm true, months_since_last_contact null -> raw 35, decay 1.00, score 35.00 -> WAIVER_PENDING (>= 30)."
      - "disclosed_prior_representation true, months_since_last_contact 12 -> raw 45, decay 0.50, score 22.50 -> ACCEPTED."
      - "prior_appointments_with_complainant 2, months_since_last_contact 3 -> raw 16, decay 0.875, score 14.00 -> ACCEPTED."
      - "prior_appointments_with_complainant 5, months_since_last_contact null -> raw min(40, 24) = 24, score 24.00 -> ACCEPTED; the cap keeps repeat appointments from ever disqualifying on their own."
      - "disclosed_financial_interest true, months_since_last_contact 36 -> decayable 0, decay floor 0.25, score 0.00 + 60 = 60.00 -> CONFLICTED. A financial interest disqualifies no matter how stale."
      - "disclosed_prior_representation true, same_firm true, disclosed_financial_interest true, months_since_last_contact 0 -> raw 140, decayable 80, decay 1.00, 80.00 + 60 = 140.00 clamped to 100.00 -> CONFLICTED."
      - "disclosed_prior_representation true, same_firm true, prior_appointments_with_complainant 3, months_since_last_contact 6 -> raw 45 + 35 + 24 = 104, decay 0.75, score 78.00 -> CONFLICTED."
      - "no factors disclosed, months null -> score 0.00 -> ACCEPTED."

  - name: panel_outcome_tally
    trigger: "On POST /udrp/decisions/{id}/issue, once the PanelVote row count equals Case.required_seat_count."
    algorithm: aggregation
    formula: |
      votes = PanelVote rows on this decision            # exactly required_seat_count rows

      # PanelVote.vote is drawn from {TRANSFER, CANCELLATION, DENY}. Decision.outcome is drawn
      # from {TRANSFER, CANCELLATION, COMPLAINT_DENIED}. The lift is exactly one relabelling:
      #   OUTCOME_OF_VOTE = {TRANSFER: TRANSFER, CANCELLATION: CANCELLATION, DENY: COMPLAINT_DENIED}
      transfer_votes     = count(votes where vote == TRANSFER)
      cancellation_votes = count(votes where vote == CANCELLATION)
      deny_votes         = count(votes where vote == DENY)

      # Variant selection is by seat count, not by configuration:
      #   1 seat  -> STRICT_MAJORITY  (the single vote is trivially a majority)
      #   3 seats -> STRICT_MAJORITY when some vote value holds >= 2 votes,
      #              otherwise PRESIDING_CASTING
      leader_count = max(transfer_votes, cancellation_votes, deny_votes)
      if leader_count * 2 > required_seat_count:
          outcome       = OUTCOME_OF_VOTE[the vote value holding leader_count votes]
          outcome_basis = STRICT_MAJORITY
      else:
          # Three distinct vote values, one vote each: no majority exists.
          outcome       = OUTCOME_OF_VOTE[vote cast by the PRESIDING seat]
          outcome_basis = PRESIDING_CASTING

      dissent_present = (leader_count < required_seat_count)

      # Reverse domain name hijacking. Only assertable when the complaint fails, and it
      # needs a majority of the seats to have flagged it, counted over the whole panel and
      # not merely over the seats that denied the complaint.
      rdnh_flags = count(votes where rdnh_vote == true)
      rdnh_finding = (outcome == COMPLAINT_DENIED) and (rdnh_flags * 2 > required_seat_count)
    input_set: "All PanelVote rows whose decision_id is this decision. Votes are immutable once cast; a vote left on a VOIDED decision is never counted toward a successor decision."
    constants:
      RDNH_MAJORITY_RULE: "strictly more than half of required_seat_count"
      OUTCOME_OF_VOTE: "TRANSFER -> TRANSFER, CANCELLATION -> CANCELLATION, DENY -> COMPLAINT_DENIED"
    precision: "Integer counts, no rounding."
    worked_examples:
      - "3 seats, votes TRANSFER / TRANSFER / DENY -> transfer_votes 2, outcome TRANSFER, basis STRICT_MAJORITY, dissent_present true, rdnh_finding false"
      - "3 seats, votes TRANSFER / CANCELLATION / DENY with PRESIDING voting CANCELLATION -> leader_count 1, outcome CANCELLATION, basis PRESIDING_CASTING, dissent_present true"
      - "3 seats, votes DENY x3 with rdnh_vote true on 2 of them -> outcome COMPLAINT_DENIED, basis STRICT_MAJORITY, dissent_present false, rdnh_flags 2, 2*2 > 3 is true, rdnh_finding true"
      - "3 seats, votes DENY x3 with rdnh_vote true on exactly 1 -> rdnh_flags 1, 1*2 > 3 is false, rdnh_finding false"
      - "3 seats, votes TRANSFER / DENY / DENY with rdnh_vote true on both denying seats -> outcome COMPLAINT_DENIED, rdnh_flags 2, 2*2 > 3 is true, rdnh_finding true"
      - "1 seat, vote DENY with rdnh_vote true -> outcome COMPLAINT_DENIED, basis STRICT_MAJORITY, dissent_present false, rdnh_flags 1, 1*2 > 1 is true, rdnh_finding true"
    variants:
      - name: STRICT_MAJORITY
        when: "Some vote value holds strictly more than half the seats."
        difference: "The outcome is the relabelled vote value with the most votes and the PRESIDING seat carries no special weight."
      - name: PRESIDING_CASTING
        when: "Three seats split across three distinct vote values, so no value clears half."
        difference: "The PRESIDING seat's own vote becomes the outcome and the two co-panelists' votes have no effect on the result. For the identical vote multiset {TRANSFER, CANCELLATION, DENY} the two variants disagree: STRICT_MAJORITY has no answer at all, while PRESIDING_CASTING resolves to whichever value the presiding seat happens to hold, so moving the presiding seat between the three votes changes the decision outcome without changing a single vote."

  - name: response_deadline_projection
    trigger: "Variant PROVISIONAL_AT_DISPATCH runs on every POST /udrp/cases/{id}/notifications. Variant FINAL_AT_DELIVERY runs on POST /udrp/cases/{id}/notifications/{notification_id}/delivery with outcome DELIVERED."
    algorithm: forward_looking
    formula: |
      # PROVISIONAL_AT_DISPATCH — the respondent has not been reached yet, so the provider
      # assumes the worst-case transit time for the channel it used.
      allowance_days = TRANSMISSION_ALLOWANCE_DAYS[notification.channel]
      provisional_response_due_at = notification.dispatched_at
                                    + allowance_days days
                                    + RESPONSE_PERIOD_DAYS days

      # FINAL_AT_DELIVERY — actual receipt is now known, so the assumed transit time is
      # discarded entirely and the clock is re-anchored on the real delivery instant.
      final_response_due_at = notification.deemed_received_at + RESPONSE_PERIOD_DAYS days

      # Both variants write Case.response_due_at. The final value may be EARLIER than the
      # provisional one (fast postal delivery) or LATER (slow email delivery); it is never
      # clamped to the provisional value in either direction.
      # Timeliness of a filed Response, evaluated against whichever value is current:
      timeliness = ON_TIME if submitted_at <= Case.response_due_at
                   else LATE            # admissible while within the grace window
      # Admissibility gate, checked before timeliness is recorded:
      #   submitted_at > Case.response_due_at + LATE_RESPONSE_GRACE_HOURS hours
      #   -> ERR_RESPONSE_DEADLINE_PASSED, nothing is written
    input_set: "The RespondentNotification attempt with the highest attempt_number on the case. Earlier attempts, including UNDELIVERABLE ones, do not contribute; each new attempt fully replaces the projection."
    constants:
      RESPONSE_PERIOD_DAYS: 20
      LATE_RESPONSE_GRACE_HOURS: 24
      TRANSMISSION_ALLOWANCE_DAYS:
        EMAIL: 0
        COURIER: 2
        POSTAL: 5
    precision: "Whole-day arithmetic on the UTC instant; the time-of-day of the anchor is preserved."
    worked_examples:
      - "POSTAL dispatched 2026-08-05T00:00:00Z -> provisional 2026-08-30T00:00:00Z (5 + 20 days)"
      - "the same notification delivered 2026-08-07T00:00:00Z -> final 2026-08-27T00:00:00Z, three days EARLIER than the provisional value"
      - "EMAIL dispatched 2026-08-01T00:00:00Z -> provisional 2026-08-21T00:00:00Z"
      - "the same notification delivered 2026-08-03T00:00:00Z -> final 2026-08-23T00:00:00Z, two days LATER than the provisional value"
      - "with final due 2026-08-23T00:00:00Z, a response at 2026-08-23T00:00:00Z is ON_TIME; at 2026-08-23T12:00:00Z it is LATE but admissible; at 2026-08-24T00:00:00Z it is exactly at the grace edge and still admissible as LATE; at 2026-08-24T00:00:01Z it is refused with ERR_RESPONSE_DEADLINE_PASSED"
    variants:
      - name: PROVISIONAL_AT_DISPATCH
        when: "From dispatch until a DELIVERED outcome is recorded. Case.deadline_variant_applied is PROVISIONAL."
        difference: "Anchored on dispatched_at and inflated by the channel's assumed transit allowance, so the same 20-day period lands on a different date per channel even for identical dispatch instants."
      - name: FINAL_AT_DELIVERY
        when: "As soon as a DELIVERED outcome is recorded. Case.deadline_variant_applied becomes FINAL."
        difference: "Anchored on the observed deemed_received_at with a zero transit allowance. For identical case data the two variants differ by (allowance_days - actual transit days), which is signed: POSTAL delivered next day shortens the window by four days, EMAIL delivered two days late lengthens it by two."
    reconciliation: "Switching to FINAL rewrites Case.response_due_at in place. A response already filed keeps the timeliness value it was stamped with; the deadline move is not retroactively re-applied to it."

  - name: implementation_window
    trigger: "On POST /udrp/decisions/{id}/issue, and again on POST /udrp/court-challenges/{id}/resolve with outcome DISMISSED or WITHDRAWN."
    algorithm: chronological
    formula: |
      anchor = Decision.issued_at on issuance, or CourtChallenge.resolved_at on a lifted stay
      cursor = anchor
      counted = 0
      while counted < IMPLEMENTATION_WAIT_BUSINESS_DAYS:
          cursor = cursor + 1 day
          if weekday(cursor) not in {SATURDAY, SUNDAY} and date(cursor) not in PROVIDER_HOLIDAYS:
              counted = counted + 1
      implementation_deadline_at = cursor          # time-of-day preserved from the anchor

      # Semantics of the boundary:
      #   clock <= implementation_deadline_at  -> a court challenge may still be filed,
      #                                          and POST .../implement fails with
      #                                          ERR_IMPLEMENTATION_PERIOD_ACTIVE
      #   clock >  implementation_deadline_at  -> implementation is allowed and a new
      #                                          challenge fails with ERR_CHALLENGE_WINDOW_CLOSED
    input_set: "Nothing but the anchor instant and the holiday calendar. The anchor day itself is never counted; counting starts on the following day."
    constants:
      IMPLEMENTATION_WAIT_BUSINESS_DAYS: 10
      PROVIDER_HOLIDAYS: ["2026-09-07"]
      WEEKEND_DAYS: [SATURDAY, SUNDAY]
    precision: "Exact instants. Only the calendar date is tested against weekends and holidays; the time-of-day rides along unchanged."
    worked_examples:
      - "issued 2026-08-10T09:00:00Z (Mon) -> deadline 2026-08-24T09:00:00Z"
      - "issued 2026-08-12T14:30:00Z (Wed) -> deadline 2026-08-26T14:30:00Z"
      - "issued 2026-08-20T00:00:00Z (Thu) -> deadline 2026-09-03T00:00:00Z"
      - "issued 2026-09-01T10:00:00Z (Tue) -> deadline 2026-09-16T10:00:00Z; the 2026-09-07 holiday pushes it one day past the 2026-09-15 a weekend-only calculation would give"
      - "issued 2026-08-31T09:00:00Z (Mon) -> deadline 2026-09-15T09:00:00Z, again one day later than a weekend-only calculation's 2026-09-14"
      - "stay lifted 2026-08-25T12:00:00Z -> deadline 2026-09-09T12:00:00Z; the original issuance date is irrelevant once the challenge is resolved, so the full ten business days start over"

  - name: ground_sufficiency_evaluation
    trigger: "On POST /udrp/cases/{id}/grounds, writing ComplaintGround.sufficiency_status."
    algorithm: threshold
    formula: |
      sufficiency_status = SUFFICIENT if evidence_count >= MIN_EVIDENCE_PER_GROUND
                           else DEFICIENT
      # Compliance clearance requires every ground on the case to be SUFFICIENT; a single
      # DEFICIENT ground yields ERR_GROUND_EVIDENCE_INSUFFICIENT at priority 62.
      # Cited precedents are validated at write time: every id in cited_decision_ids must
      # name a Decision whose publication_status is PUBLISHED, or whose publication_status
      # is REDACTED with redaction_level PARTY_NAMES. An UNPUBLISHED decision, or one redacted
      # FULL, yields ERR_CITED_PRECEDENT_NOT_PUBLISHED.
    input_set: "The single ComplaintGround row being written, plus the Decision rows it cites."
    constants:
      MIN_EVIDENCE_PER_GROUND: 1
      MAX_DEFICIENCY_ROUNDS: 2
      CORRECTION_PERIOD_DAYS: 5
    precision: "Integer comparison; the bound is inclusive."
    worked_examples:
      - "evidence_count 0 -> DEFICIENT; the case cannot clear compliance until a further ground write raises it"
      - "evidence_count 1 -> SUFFICIENT (the threshold is >=, not >)"

  - name: precedent_citation_metrics
    trigger: "On POST /udrp/decisions/{id}/publish, and re-evaluated on every read of GET /udrp/precedents and GET /udrp/decisions/{id}/precedent-entry."
    algorithm: decay_function
    formula: |
      # citation_count is the number of ComplaintGround rows anywhere in the system whose
      # cited_decision_ids array contains this decision's id. It counts grounds, not cases,
      # so a case citing the same decision on two grounds contributes 2.
      citation_count = count(ComplaintGround g where this_decision_id in g.cited_decision_ids)

      months_elapsed = whole months from Decision.issued_at to the logical clock
      age_weight = max(PRECEDENT_DECAY_FLOOR,
                       1 - months_elapsed / PRECEDENT_DECAY_HORIZON_MONTHS)
      precedent_weight = round_half_up(citation_count * age_weight, 2)

      superseded = (Decision.status == VOIDED)
      citable = ((Decision.publication_status == PUBLISHED)
                 or (Decision.publication_status == REDACTED and PrecedentEntry.redaction_level == PARTY_NAMES))
                and superseded == false
      # A superseded entry stays in the database and stays readable, but it is excluded from
      # GET /udrp/precedents unless include_superseded is passed true.
    input_set: "Every ComplaintGround row in the system, regardless of its case's status — a withdrawn case's citation still counts, because the citation was really made."
    constants:
      PRECEDENT_DECAY_HORIZON_MONTHS: 60
      PRECEDENT_DECAY_FLOOR: 0.20
    precision: "2 decimal places, round_half_up. months_elapsed is whole months, truncated."
    worked_examples:
      - "citation_count 4, issued 2026-08-01, clock 2026-08-01 -> months_elapsed 0, age_weight 1.00, precedent_weight 4.00"
      - "citation_count 4, issued 2026-08-01, clock 2027-02-01 -> months_elapsed 6, age_weight 0.90, precedent_weight 3.60"
      - "citation_count 3, issued 2026-08-01, clock 2031-08-01 -> months_elapsed 60, age_weight hits the floor 0.20, precedent_weight 0.60"
      - "citation_count 0 -> precedent_weight 0.00 at any age"
      - "published with redaction_level FULL -> citable false, and the entry is omitted from GET /udrp/precedents even before any decay applies"

  - name: withdrawal_refund
    trigger: "On POST /udrp/cases/{id}/withdraw, and on the automatic ADMIN_CLOSED path taken by POST /udrp/_ops/deadline-sweep."
    algorithm: threshold
    formula: |
      # The refund percentage is decided purely by how far the case had progressed.
      if Case.status in {FILED, DEFICIENT}:                          pct = 1.00
      elif Case.status in {VERIFICATION_PENDING, NOTIFICATION_PENDING}: pct = 0.50
      else:                                                          pct = 0.00   # COMMENCED and beyond
      # The sweep's automatic close of an uncured deficiency is always a full refund,
      # because the case never left the pre-clearance stage.
      if trigger == deadline_sweep:                                  pct = 1.00

      for payer P in [COMPLAINANT, RESPONDENT]:                      # fixed order, not id order
          paid_P = sum(FeeTransaction.amount_cents where case_id == Case.id and payer == P)
          refund_P = round_half_up(paid_P * pct)
          if refund_P > 0:
              mint FeeTransaction(kind = REFUND, payer = P,
                                  amount_cents = -refund_P,
                                  reference = 'WITHDRAWAL-REFUND' or 'AUTO-CLOSE-REFUND')
      # Derived money fields are then recomputed from the ledger, never decremented in place:
      Case.complainant_paid_cents = sum(amount_cents where payer == COMPLAINANT)
      Case.respondent_paid_cents  = sum(amount_cents where payer == RESPONDENT)
      Case.paid_cents             = sum(amount_cents over all payers)
    input_set: "Every FeeTransaction row on the case, including WRITE_OFF lines (payer PROVIDER, which is never refunded) and any earlier REFUND lines. Because refunds are negative rows attributed to the original payer, a second withdrawal attempt would find paid_P at 0 and mint nothing."
    constants:
      REFUND_PCT_PRE_CLEARANCE: 1.00
      REFUND_PCT_PRE_COMMENCEMENT: 0.50
      REFUND_PCT_POST_COMMENCEMENT: 0.00
    precision: "Integer cents, round_half_up on each payer's refund independently."
    worked_examples:
      - "FILED case with one 168750 FILING_FEE from COMPLAINANT, withdrawn -> pct 1.00, refund row -168750, paid_cents 0"
      - "VERIFICATION_PENDING case with one 168750 FILING_FEE from COMPLAINANT, withdrawn -> pct 0.50, refund row -84375, paid_cents 84375"
      - "VERIFICATION_PENDING case with 293750 from COMPLAINANT and 125000 from RESPONDENT (418750 total), withdrawn -> two refund rows -146875 and -62500, paid_cents 209375"
      - "COMMENCED case with any payment, withdrawn -> pct 0.00, no refund row is minted at all and paid_cents is unchanged"
      - "DEFICIENT case closed by the sweep after an uncured notice -> pct 1.00, full refund, paid_cents 0"

  - name: case_ledger_reconciliation
    trigger: "After every FeeTransaction write, and after every refund cascade."
    algorithm: aggregation
    formula: |
      Case.complainant_paid_cents = sum(FeeTransaction.amount_cents where case_id == Case.id and payer == COMPLAINANT)
      Case.respondent_paid_cents  = sum(FeeTransaction.amount_cents where case_id == Case.id and payer == RESPONDENT)
      Case.paid_cents             = sum(FeeTransaction.amount_cents where case_id == Case.id)
      # PROVIDER-attributed WRITE_OFF lines are included in paid_cents but in neither
      # party-scoped subtotal, so paid_cents >= complainant_paid_cents + respondent_paid_cents.
    input_set: "All FeeTransaction rows on the case, in every kind: FILING_FEE, PANEL_SUPPLEMENT, REFUND (always negative) and WRITE_OFF."
    constants:
      LEDGER_KINDS: [FILING_FEE, PANEL_SUPPLEMENT, REFUND, WRITE_OFF]
    precision: "Integer cents, exact."
    worked_examples:
      - "FILING_FEE 150000 COMPLAINANT then PANEL_SUPPLEMENT 125000 RESPONDENT -> complainant 150000, respondent 125000, paid 275000"
      - "the same case then written off 20000 by PROVIDER -> complainant 150000, respondent 125000, paid 295000"
      - "FILING_FEE 168750 COMPLAINANT then REFUND -168750 COMPLAINANT -> complainant 0, respondent 0, paid 0"

  - name: domain_occupation_conflict
    trigger: "On POST /udrp/cases, before the case row is written."
    algorithm: interval_merge
    formula: |
      # A domain is OCCUPIED by any case that has not reached a terminal status. That
      # occupation interval is OPEN-ENDED on the right: it has no end until the case closes.
      for each existing Case C where C.domain_id == candidate.domain_id:
          if C.status in NON_TERMINAL_CASE_STATUSES:
              -> ERR_DOMAIN_PROCEEDING_OVERLAP        # priority 56
      # A closed case leaves behind a CLOSED cooling-off interval on the same domain:
      #     [C.closed_at, C.refiling_bar_until]   with refiling_bar_until = closed_at + 30 days
      # Both endpoints are INCLUSIVE. Filing at the exact instant of refiling_bar_until is
      # still barred; the domain frees up one instant later.
      for each existing Case C where C.domain_id == candidate.domain_id
                                and C.status in {IMPLEMENTED, ADMIN_CLOSED, WITHDRAWN, TERMINATED_COURT}:
          if clock <= C.refiling_bar_until:
              -> ERR_REFILING_BAR_ACTIVE              # priority 57
      # Cooling-off intervals are NOT merged across cases; each closed case is tested on its
      # own and the latest refiling_bar_until therefore governs, without any union step.
    input_set: "Every Case row sharing the candidate's domain_id. Cases on other domains are irrelevant, and the complainant's identity does not matter — the bar is domain-scoped, not party-scoped."
    constants:
      COOLING_OFF_DAYS: 30
      OCCUPATION_INTERVAL_SEMANTICS: "closed on both ends: [closed_at, closed_at + 30 days]"
    precision: "Exact instants, inclusive comparison on both ends."
    worked_examples:
      - "an existing case on the domain sitting in COMMENCED -> ERR_DOMAIN_PROCEEDING_OVERLAP regardless of the clock"
      - "an existing case WITHDRAWN at 2026-08-10T00:00:00Z has refiling_bar_until 2026-09-09T00:00:00Z; filing at clock 2026-09-09T00:00:00Z -> ERR_REFILING_BAR_ACTIVE because the closing endpoint is inclusive"
      - "the same domain filed at clock 2026-09-09T00:00:01Z -> accepted"
      - "two closed cases on the domain with bars to 2026-08-20 and 2026-09-09; filing at 2026-08-25 -> ERR_REFILING_BAR_ACTIVE from the later bar even though the earlier one has lapsed"

  - name: panelist_window_conflict
    trigger: "Twice per seat. First on POST /udrp/cases/{id}/appointments, against the PROSPECTIVE window [clock, clock + 14 days) of the named or selected candidate. Then again on the transition into ACCEPTED — POST /udrp/appointments/{id}/conflict-screening whose score lands below the waiver threshold, or POST /udrp/appointments/{id}/waiver — because the logical clock has moved since the nomination and the window has moved with it."
    algorithm: interval_merge
    formula: |
      candidate_window = [clock, clock + DECISION_PERIOD_DAYS days)      # HALF-OPEN on the right
      # At nomination this window is prospective; at acceptance it is the window that will be
      # written onto the row as [accepted_at, decision_due_at). Both evaluations use it identically.

      # (1) Engagement-vs-engagement. Existing ACCEPTED seats held by this panelist occupy
      #     [accepted_at, decision_due_at), also HALF-OPEN. Two half-open intervals overlap
      #     iff a.start < b.end AND b.start < a.end, so ADJACENCY IS ALLOWED: a window that
      #     begins at the exact instant another ends does not conflict.
      for each PanelistAppointment A where A.panelist_id == this panelist
                                      and A.status == ACCEPTED
                                      and A.case_id != this case:
          if candidate_window.start < A.decision_due_at and A.accepted_at < candidate_window.end:
              -> ERR_PANELIST_WINDOW_CONFLICT          # priority 66

      # (2) Blackout-vs-engagement. The panelist's declared unavailability occupies
      #     [unavailable_from, unavailable_to] — CLOSED on BOTH ends, unlike an engagement.
      #     Touching a blackout endpoint therefore DOES conflict.
      if panelist.unavailable_from is not null:
          if candidate_window.start <= panelist.unavailable_to
             and panelist.unavailable_from <= candidate_window.end:
              -> ERR_PANELIST_WINDOW_CONFLICT

      # (3) Aggregate ceiling — a pure count, with no interval arithmetic at all. It counts
      #     every ACCEPTED seat this panelist holds on a case that is still non-terminal,
      #     which is exactly the running Panelist.active_case_load.
      if panelist.active_case_load >= panelist.max_overlapping_engagements:
              -> ERR_PANELIST_CAPACITY_EXCEEDED        # priority 67
    input_set: "Only ACCEPTED PanelistAppointment rows on cases whose status is in NON_TERMINAL_CASE_STATUSES. DISCHARGED, REPLACED, DECLINED, CONFLICTED, WAIVER_PENDING and NOMINATED rows are all invisible to every one of the three checks, so a replaced seat frees both its window and its load slot immediately."
    constants:
      DECISION_PERIOD_DAYS: 14
      DEFAULT_MAX_OVERLAPPING_ENGAGEMENTS: 5
      ENGAGEMENT_INTERVAL_SEMANTICS: "half-open [accepted_at, decision_due_at) — adjacency permitted"
      BLACKOUT_INTERVAL_SEMANTICS: "closed [unavailable_from, unavailable_to] — adjacency rejected"
    precision: "Exact instants. The two interval families deliberately use different endpoint semantics."
    worked_examples:
      - "an ACCEPTED seat with window [2026-08-10T00:00:00Z, 2026-08-24T00:00:00Z); accepting a second seat at clock 2026-08-24T00:00:00Z -> allowed, the windows merely touch"
      - "the same seat; accepting a second seat at clock 2026-08-23T00:00:00Z -> ERR_PANELIST_WINDOW_CONFLICT, the windows overlap by one day"
      - "a blackout of [2026-08-24T00:00:00Z, 2026-08-30T00:00:00Z]; accepting a seat at clock 2026-08-10T00:00:00Z whose window ends at 2026-08-24T00:00:00Z -> ERR_PANELIST_WINDOW_CONFLICT, because the blackout endpoint is inclusive where an engagement endpoint would not have been"
      - "a blackout of [2026-08-25T00:00:00Z, 2026-08-30T00:00:00Z] with the same seat ending 2026-08-24T00:00:00Z -> allowed"
      - "max_overlapping_engagements 1, one ACCEPTED seat with window ending 2026-08-24T00:00:00Z on a still-open case; accepting a second seat at clock 2026-08-24T00:00:00Z -> the window check passes on adjacency but ERR_PANELIST_CAPACITY_EXCEEDED fires from the count"
      - "the same setup after the first seat is replaced -> active_case_load is back to 0 and the second acceptance succeeds"

  - name: panelist_selector
    trigger: "On POST /udrp/cases/{id}/appointments when panelist_id is omitted. When panelist_id is supplied the same eligibility filter is applied to that one candidate and a failure yields ERR_PANELIST_INELIGIBLE."
    algorithm: constraint_propagation
    formula: |
      # ELIGIBILITY FILTER — all clauses must hold.
      eligible = { P in Panelist :
            P.status == AVAILABLE
        and P.nationality_code != Complainant.country_code of Case.complainant_id
        and P.nationality_code != Case.mutual_jurisdiction
        and no ACCEPTED seat of P on another non-terminal case overlaps
            [clock, clock + DECISION_PERIOD_DAYS days) per panelist_window_conflict
        and P's blackout interval does not touch that same window
        and P.active_case_load < P.max_overlapping_engagements
        and P holds no row on THIS case with status in {NOMINATED, WAIVER_PENDING, ACCEPTED}
      }
      if eligible is empty: -> ERR_NO_ELIGIBLE_PANELIST          # priority 92, 422

      # RANKING — strictly ordered, deterministic, no random input anywhere.
      ranked = sort(eligible) by
                 active_case_load        ASC,      # spread the workload first
                 roster_admitted_at      ASC,      # then seniority on the roster
                 created_at              ASC       # final fallback over common fields only
      chosen = ranked[0]
    input_set: "Every Panelist row. Panelists whose status is SUSPENDED or UNAVAILABLE are filtered out by the first clause and never reach the ranking."
    constants:
      DECISION_PERIOD_DAYS: 14
      NATIONALITY_EXCLUSION: "the chosen panelist must share nationality with neither the complainant's country_code nor the case's mutual_jurisdiction"
      RANKING_KEYS: [active_case_load ASC, roster_admitted_at ASC, created_at ASC]
    precision: "Deterministic total order. The `id` field is never a ranking input, at any level, including as a final tie-break."
    worked_examples:
      - "three AVAILABLE panelists with active_case_load 2, 0 and 1 -> the load-0 panelist is chosen"
      - "two AVAILABLE panelists both at load 0, roster_admitted_at 2024-01-15 and 2025-06-01 -> the 2024-01-15 panelist is chosen"
      - "two AVAILABLE panelists both at load 0 with identical roster_admitted_at -> the one with the earlier created_at is chosen, so the outcome is fixed by insertion order and never by id"
      - "the only AVAILABLE panelist shares nationality_code with the complainant's country_code -> ERR_NO_ELIGIBLE_PANELIST"
      - "the only AVAILABLE panelist already holds a NOMINATED row on this very case -> ERR_NO_ELIGIBLE_PANELIST, because one panelist can never occupy two seats of the same panel"

  - name: load_and_population_counters
    trigger: "On every transition that seats, vacates or discharges a panelist, and on every case open or close."
    algorithm: aggregation
    formula: |
      # Panelist.active_case_load is maintained incrementally, +1 on entry to ACCEPTED and
      # -1 on the exits ACCEPTED -> REPLACED and ACCEPTED -> DISCHARGED. It must at all times
      # equal the full recount:
      Panelist.active_case_load == count(PanelistAppointment A where A.panelist_id == P.id
                                                                and A.status == ACCEPTED
                                                                and Case(A.case_id).status in NON_TERMINAL_CASE_STATUSES)
      # Complainant.open_case_count, likewise: +1 on POST /udrp/cases and -1 on every arrival
      # at IMPLEMENTED, ADMIN_CLOSED, WITHDRAWN or TERMINATED_COURT.
      Complainant.open_case_count == count(Case C where C.complainant_id == X.id
                                                   and C.status in NON_TERMINAL_CASE_STATUSES)
      # Complainant.adverse_rdnh_findings is a signed counter: +1 when an issued decision
      # carries rdnh_finding true, and -1 again if that decision is later VOIDED by a
      # sustained court challenge. It therefore equals the count of NON-VOIDED decisions
      # with rdnh_finding true across all of the complainant's cases.
      # Registrar.overdue_verification_count: +1 on REQUESTED -> OVERDUE, -1 on OVERDUE -> RESPONDED.
      Registrar.overdue_verification_count == count(RegistrarVerification V
                                                   where Registrar(V) == R and V.status == OVERDUE)
    input_set: "All PanelistAppointment, Case, Decision and RegistrarVerification rows. NOMINATED and WAIVER_PENDING seats deliberately carry no load, which is what makes a screening that lands in WAIVER_PENDING observably different from one that lands in ACCEPTED."
    constants:
      NON_TERMINAL_CASE_STATUSES: [FILED, DEFICIENT, VERIFICATION_PENDING, NOTIFICATION_PENDING, COMMENCED, RESPONSE_RECEIVED, DEFAULT, PANEL_APPOINTMENT, PANEL_CONSTITUTED, IMPLEMENTATION_WAITING, STAYED]
    precision: "Integer counts, exact. Every counter is an incrementally maintained field that must reconcile against its recount definition after any cascade."
    worked_examples:
      - "a panelist screened into WAIVER_PENDING has active_case_load 0; after the waiver is granted it is 1"
      - "a CONFLICTED seat replaced by a successor leaves active_case_load at 0 on the conflicted panelist, because it never took load"
      - "a case reaching TERMINATED_COURT with three ACCEPTED seats drops all three panelists' active_case_load by 1 and the complainant's open_case_count by 1"
      - "a sustained court challenge against a decision with rdnh_finding true takes adverse_rdnh_findings from 1 back to 0"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: "for a Complainant acting on a case-scoped resource, X-User-ID == Case.complainant_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /udrp/cases/{id}/grounds, POST /udrp/cases/{id}/corrections, POST /udrp/cases/{id}/withdraw, POST /udrp/decisions/{id}/court-challenges (when acting as Complainant)"

  - priority: 26
    category: auth
    check: "for a RegistrarAgent, X-User-ID == DomainName.registrar_id of the case's domain"
    error_id: ERR_REGISTRAR_MISMATCH
    http_status: 403
    applies_to: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response, POST /udrp/decisions/{id}/implement"

  - priority: 27
    category: auth
    check: "for a Respondent filing a response, the payload's respondent_email equals Case.verified_registrant_email"
    error_id: ERR_RESPONDENT_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /udrp/cases/{id}/responses, POST /udrp/decisions/{id}/court-challenges (when acting as Respondent)"

  - priority: 28
    category: auth
    check: "for a Panelist, X-User-ID == PanelistAppointment.panelist_id of the appointment being acted on, or == the seat holder for a vote"
    error_id: ERR_NOT_SEAT_HOLDER
    http_status: 403
    applies_to: "POST /udrp/appointments/{id}/conflict-screening, POST /udrp/decisions/{id}/votes"

  - priority: 30
    category: existence
    check: "the {id} path segment of a case-rooted path names an existing Case"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "every /udrp/cases/{id}/... path"

  - priority: 31
    category: existence
    check: "the {id} path segment of a domain path names an existing DomainName"
    error_id: ERR_DOMAIN_NOT_FOUND
    http_status: 404
    applies_to: "GET /udrp/domains/{id}"

  - priority: 32
    category: existence
    check: "the {id} path segment of a panelist path names an existing Panelist"
    error_id: ERR_PANELIST_NOT_FOUND
    http_status: 404
    applies_to: "GET /udrp/panelists/{id}, POST /udrp/panelists/{id}/availability"

  - priority: 33
    category: existence
    check: "the {id} path segment of an appointment path names an existing PanelistAppointment"
    error_id: ERR_APPOINTMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /udrp/appointments/{id}, POST /udrp/appointments/{id}/conflict-screening, POST /udrp/appointments/{id}/waiver, POST /udrp/appointments/{id}/replace"

  - priority: 34
    category: existence
    check: "the {id} path segment of a decision path names an existing Decision"
    error_id: ERR_DECISION_NOT_FOUND
    http_status: 404
    applies_to: "every /udrp/decisions/{id}/... path"

  - priority: 35
    category: existence
    check: "a nested sub-resource id ({verification_id}, {notification_id}) names an existing row whose parent is the case in the path, and a court-challenge {id} names an existing CourtChallenge"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response, POST /udrp/cases/{id}/notifications/{notification_id}/delivery, POST /udrp/court-challenges/{id}/resolve"

  - priority: 36
    category: existence
    check: "a body-referenced id (panelist_id, notice_id, decision_id, every element of cited_decision_ids) names an existing row of the expected entity"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /udrp/cases, POST /udrp/cases/{id}/grounds, POST /udrp/cases/{id}/corrections, POST /udrp/cases/{id}/appointments"

  - priority: 38
    category: schema
    check: "required fields are present, enums hold declared values, integers are non-negative where the field so requires, and a 2-letter code is exactly two letters"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 39
    category: business_constraint
    check: "a case carries at most one Response row"
    error_id: ERR_RESPONSE_ALREADY_FILED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/responses"
    note: |
      Deliberately ordered ahead of the two state gates at priority 40. Filing a response moves the
      case out of COMMENCED, so a duplicate filing would otherwise always surface as
      ERR_CASE_NOT_IN_RESPONSE_WINDOW and this rule would be unreachable. At priority 39 a second
      response is reported as the duplicate it is, while a response against a case that never
      commenced still falls through to ERR_CASE_NOT_IN_RESPONSE_WINDOW.

  - priority: 40
    category: state
    check: "the target Case is in a status from which this operation is defined"
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "all case-mutating endpoints"
    note: |
      This is the state gate that beats the response-deadline check; see the pairing at priority 71.
      Two endpoints are deliberately admitted from a wider set of case statuses so that their sharper
      rules stay reachable: POST /udrp/cases/{id}/decisions and POST /udrp/decisions/{id}/issue both
      accept a Case in PANEL_APPOINTMENT or PANEL_CONSTITUTED at this priority, and it is the
      panel-completeness rule at priority 91 - not this gate - that rejects issuance while a seat is
      still unfilled.

  - priority: 40
    category: state
    check: "a response may only be filed against a Case whose status is COMMENCED"
    error_id: ERR_CASE_NOT_IN_RESPONSE_WINDOW
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/responses"

  - priority: 41
    category: state
    check: "the target PanelistAppointment is in a status from which this operation is defined"
    error_id: ERR_INVALID_APPOINTMENT_STATE
    http_status: 409
    applies_to: "POST /udrp/appointments/{id}/conflict-screening, POST /udrp/appointments/{id}/waiver, POST /udrp/appointments/{id}/replace"

  - priority: 42
    category: state
    check: "the target Decision is in a status from which this operation is defined"
    error_id: ERR_INVALID_DECISION_STATE
    http_status: 409
    applies_to: "POST /udrp/decisions/{id}/votes, POST /udrp/decisions/{id}/issue, POST /udrp/decisions/{id}/publish, POST /udrp/decisions/{id}/implement, POST /udrp/decisions/{id}/court-challenges"

  - priority: 43
    category: state
    check: "a decision may not be published twice"
    error_id: ERR_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /udrp/decisions/{id}/publish"

  - priority: 44
    category: state
    check: "a case may only be withdrawn from a pre-appointment status"
    error_id: ERR_WITHDRAWAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/withdraw"

  - priority: 45
    category: state
    check: "expected_case_version equals the stored Case.version (see §1.2.1)"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /udrp/cases/{id}/appointments, POST /udrp/cases/{id}/decisions"

  - priority: 50
    category: business_safety
    check: "the CaseManager clearing compliance is not the same user id that issued the case's most recent deficiency notice"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /udrp/cases/{id}/compliance-clearance"
    note: "Deliberately ordered ahead of the fiscal shortfall check at priority 80 — a governance failure is reported even when the case is also unpaid."

  - priority: 51
    category: business_safety
    check: "the registrar answering a verification is not SUSPENDED"
    error_id: ERR_REGISTRAR_SUSPENDED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response"

  - priority: 52
    category: business_safety
    check: "a verification response asserts lock_applied true; the provider refuses to accept a verification that leaves the domain transferable"
    error_id: ERR_DOMAIN_LOCK_NOT_APPLIED
    http_status: 422
    applies_to: "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response"

  - priority: 53
    category: business_safety
    check: "the case's domain is in lock_status LOCKED before the respondent is notified, and still LOCKED at implementation"
    error_id: ERR_DOMAIN_NOT_LOCKED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/notifications, POST /udrp/decisions/{id}/implement"

  - priority: 54
    category: business_safety
    check: "a waiver is only granted when the disclosed conflict is below the disqualifying threshold"
    error_id: ERR_CONFLICT_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /udrp/appointments/{id}/waiver"

  - priority: 55
    category: business_referential
    check: "the domain name is globally unique in the DomainName table"
    error_id: ERR_DUPLICATE_DOMAIN_NAME
    http_status: 409
    applies_to: "POST /udrp/domains"

  - priority: 56
    category: business_referential
    check: "the candidate domain is not occupied by an existing case in a non-terminal status"
    error_id: ERR_DOMAIN_PROCEEDING_OVERLAP
    http_status: 409
    applies_to: "POST /udrp/cases"

  - priority: 57
    category: business_referential
    check: "the candidate domain is not inside a closed case's inclusive cooling-off interval"
    error_id: ERR_REFILING_BAR_ACTIVE
    http_status: 409
    applies_to: "POST /udrp/cases"

  - priority: 58
    category: business_referential
    check: "a case carries at most one ComplaintGround per ground_type"
    error_id: ERR_DUPLICATE_GROUND_TYPE
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/grounds"

  - priority: 59
    category: business_referential
    check: "every id in cited_decision_ids names a decision whose PrecedentEntry.citable is true, meaning publication_status PUBLISHED or REDACTED with redaction_level PARTY_NAMES, and not superseded by a VOIDED decision"
    error_id: ERR_CITED_PRECEDENT_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /udrp/cases/{id}/grounds"

  - priority: 60
    category: business_constraint
    check: "a case may not exceed MAX_DEFICIENCY_ROUNDS deficiency notices"
    error_id: ERR_DEFICIENCY_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/deficiency-notices"

  - priority: 62
    category: business_constraint
    check: "every ComplaintGround on the case has sufficiency_status SUFFICIENT"
    error_id: ERR_GROUND_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /udrp/cases/{id}/compliance-clearance"

  - priority: 63
    category: business_constraint
    check: "the seat named in an appointment request is one the case's required_seat_count admits (SOLE only when the count is 1, the three panel seats only when it is 3)"
    error_id: ERR_SEAT_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /udrp/cases/{id}/appointments"

  - priority: 64
    category: business_constraint
    check: "the seat named in an appointment request is not already held by a row in status NOMINATED, WAIVER_PENDING or ACCEPTED"
    error_id: ERR_SEAT_ALREADY_FILLED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/appointments"

  - priority: 65
    category: business_constraint
    check: "an explicitly named panelist satisfies the selector's NON-TEMPORAL eligibility clauses: status AVAILABLE, nationality distinct from both the complainant's country_code and the case's mutual_jurisdiction, and no live row already held on this case"
    error_id: ERR_PANELIST_INELIGIBLE
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/appointments"
    note: "The temporal and aggregate clauses are split out to priorities 66 and 67 so that each is independently observable on a named nomination."

  - priority: 66
    category: business_temporal
    check: "the candidate engagement window does not overlap another ACCEPTED seat's half-open window, nor touch the panelist's closed blackout interval"
    error_id: ERR_PANELIST_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/appointments, POST /udrp/appointments/{id}/conflict-screening, POST /udrp/appointments/{id}/waiver"

  - priority: 67
    category: business_constraint
    check: "the panelist's active_case_load is strictly below max_overlapping_engagements"
    error_id: ERR_PANELIST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/appointments, POST /udrp/appointments/{id}/conflict-screening, POST /udrp/appointments/{id}/waiver"
    note: "Ordered after the window check on purpose: adjacent-but-legal windows are the only way to reach this error, so the two are independently observable."

  - priority: 68
    category: business_constraint
    check: "a seat casts at most one PanelVote on a decision"
    error_id: ERR_VOTE_ALREADY_CAST
    http_status: 409
    applies_to: "POST /udrp/decisions/{id}/votes"

  - priority: 70
    category: business_temporal
    check: "the correction period on the named deficiency notice has not lapsed"
    error_id: ERR_CORRECTION_PERIOD_EXPIRED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/corrections"

  - priority: 71
    category: business_temporal
    check: "the response arrives no later than Case.response_due_at plus the late grace window"
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /udrp/cases/{id}/responses"
    note: "Deliberately ordered behind ERR_CASE_NOT_IN_RESPONSE_WINDOW at priority 40, so a case that has already defaulted reports its state rather than its lateness."

  - priority: 72
    category: business_temporal
    check: "the implementation waiting period has fully elapsed before a registrar acts"
    error_id: ERR_IMPLEMENTATION_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /udrp/decisions/{id}/implement"

  - priority: 73
    category: business_temporal
    check: "a court challenge is filed no later than the implementation deadline"
    error_id: ERR_CHALLENGE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /udrp/decisions/{id}/court-challenges"

  - priority: 80
    category: business_fiscal
    check: "Case.complainant_paid_cents is at least Case.complainant_share_cents"
    error_id: ERR_FILING_FEE_SHORTFALL
    http_status: 402
    applies_to: "POST /udrp/cases/{id}/compliance-clearance"

  - priority: 81
    category: business_fiscal
    check: "Case.paid_cents is at least Case.assessed_fee_cents, which after a three-member election means the respondent's supplement has actually landed"
    error_id: ERR_PANEL_SUPPLEMENT_UNPAID
    http_status: 402
    applies_to: "POST /udrp/cases/{id}/appointments"

  - priority: 90
    category: business_constraint
    check: "the case carries exactly one ComplaintGround for each of TRADEMARK_RIGHTS, NO_LEGITIMATE_INTEREST and BAD_FAITH"
    error_id: ERR_MISSING_REQUIRED_GROUND
    http_status: 422
    applies_to: "POST /udrp/cases/{id}/compliance-clearance"

  - priority: 91
    category: business_constraint
    check: "the ACCEPTED PanelistAppointment rows on the case cover each required seat exactly once and their count equals Case.required_seat_count"
    note: "REPLACED, DECLINED, CONFLICTED and DISCHARGED rows are ignored by this count, so a case that has been through a replacement cycle can still be constituted. Reachable by drafting from PANEL_APPOINTMENT, which POST /udrp/cases/{id}/decisions permits, and then attempting issuance before the last seat accepts."
    error_id: ERR_PANEL_NOT_CONSTITUTED
    http_status: 409
    applies_to: "POST /udrp/decisions/{id}/issue"

  - priority: 92
    category: business_constraint
    check: "the selector's eligible set is non-empty"
    error_id: ERR_NO_ELIGIBLE_PANELIST
    http_status: 422
    applies_to: "POST /udrp/cases/{id}/appointments"

  - priority: 93
    category: business_constraint
    check: "the PanelVote count on the decision equals Case.required_seat_count"
    error_id: ERR_VOTES_INCOMPLETE
    http_status: 422
    applies_to: "POST /udrp/decisions/{id}/issue"

  - priority: 94
    category: business_constraint
    check: "a waiver carries waiver_complainant true, and waiver_respondent true unless the case has a recorded default"
    error_id: ERR_WAIVER_INCOMPLETE
    http_status: 422
    applies_to: "POST /udrp/appointments/{id}/waiver"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# Every path is rooted at the api_prefix /udrp. Every parent placeholder is literally
# {id}; nested sub-resource ids use their own explicit names ({verification_id},
# {notification_id}). Authentication headers X-User-Role and X-User-ID are required on
# every endpoint including the /_ test-driving ones.
endpoints:
  # --- Registrar ---------------------------------------------------------
  - method: POST
    path: "/udrp/registrars"
    description: "Accredit a registrar. verification_response_hours defaults to 48 when omitted."
    roles: [ProviderAdmin]
    code: 201
    input: [name, iana_id, contact_email, "verification_response_hours?"]
    output: Registrar
    side_effects: ["creates Registrar with status ACTIVE and overdue_verification_count 0"]

  - method: GET
    path: "/udrp/registrars/{id}"
    description: "Read one registrar."
    roles: [ProviderAdmin, CaseManager, RegistrarAgent]
    code: 200
    input: []
    output: Registrar
    side_effects: []

  - method: POST
    path: "/udrp/registrars/{id}/status"
    description: "Move a registrar between ACTIVE and SUSPENDED."
    roles: [ProviderAdmin]
    code: 200
    input: [status]
    output: Registrar
    side_effects: ["Registrar.status updated; a SUSPENDED registrar can no longer answer verifications (ERR_REGISTRAR_SUSPENDED)"]

  # --- DomainName --------------------------------------------------------
  - method: POST
    path: "/udrp/domains"
    description: "Register a disputed domain in the provider's docket. The name is globally unique."
    roles: [ProviderAdmin, CaseManager]
    code: 201
    input: [domain_name, registrar_id, registrant_name_public, registrant_email_public, registration_date, expiry_date]
    output: DomainName
    side_effects: ["creates DomainName with lock_status UNLOCKED"]

  - method: GET
    path: "/udrp/domains/{id}"
    description: "Read one domain, including its current lock_status."
    roles: [ProviderAdmin, CaseManager, RegistrarAgent, Complainant, Respondent, Panelist]
    code: 200
    input: []
    output: DomainName
    side_effects: []

  - method: POST
    path: "/udrp/domains/{id}/lock"
    description: "The registrar of record applies or releases the transfer lock out of band. This is the operator surface behind DomainName's UNLOCKED <-> LOCKED cycle; it refuses to touch a domain that has already been transferred or cancelled."
    roles: [RegistrarAgent, ProviderAdmin]
    code: 200
    input: [lock_status]
    output: DomainName
    side_effects:
      - "DomainName.lock_status moves between UNLOCKED and LOCKED, writing or clearing locked_at; DomainName.version += 1"
      - "ERR_INVALID_REQUEST when lock_status is anything other than UNLOCKED or LOCKED, or when the current lock_status is TRANSFER_EXECUTED or CANCELLATION_EXECUTED"
      - "releasing the lock while a case is mid-proceeding is what makes ERR_DOMAIN_NOT_LOCKED reachable at notification and at implementation"

  - method: GET
    path: "/udrp/domains"
    description: "List domains, filterable by registrar_id (the reverse of DomainName.registrar_id) and by lock_status."
    roles: [ProviderAdmin, CaseManager, RegistrarAgent]
    code: 200
    input: ["registrar_id?", "lock_status?", "limit?", "offset?"]
    output: DomainName[]
    side_effects: []

  # --- Complainant -------------------------------------------------------
  - method: POST
    path: "/udrp/complainants"
    description: "Register a complainant. country_code feeds the panelist nationality exclusion."
    roles: [ProviderAdmin, CaseManager]
    code: 201
    input: [legal_name, country_code, email]
    output: Complainant
    side_effects: ["creates Complainant with open_case_count 0 and adverse_rdnh_findings 0"]

  - method: GET
    path: "/udrp/complainants/{id}"
    description: "Read one complainant, including the running open_case_count and adverse_rdnh_findings counters."
    roles: [ProviderAdmin, CaseManager, Complainant]
    code: 200
    input: []
    output: Complainant
    side_effects: []

  # --- Panelist ----------------------------------------------------------
  - method: POST
    path: "/udrp/panelists"
    description: "Admit a panelist to the roster. max_overlapping_engagements defaults to 5."
    roles: [ProviderAdmin]
    code: 201
    input: [full_name, nationality_code, roster_admitted_at, "firm_name?", "specializations?", "max_overlapping_engagements?"]
    output: Panelist
    side_effects: ["creates Panelist with status AVAILABLE and active_case_load 0"]

  - method: GET
    path: "/udrp/panelists/{id}"
    description: "Read one panelist, including the running active_case_load."
    roles: [ProviderAdmin, CaseManager, Panelist]
    code: 200
    input: []
    output: Panelist
    side_effects: []

  - method: POST
    path: "/udrp/panelists/{id}/availability"
    description: "Set a panelist's roster status, declared blackout interval and overlapping-engagement ceiling in one call. Any omitted field is left as it was; passing unavailable_from null clears the interval."
    roles: [ProviderAdmin, Panelist]
    code: 200
    input: ["status?", "unavailable_from?", "unavailable_to?", "max_overlapping_engagements?"]
    output: Panelist
    side_effects: ["Panelist.status, unavailable_from, unavailable_to and max_overlapping_engagements updated; a SUSPENDED or UNAVAILABLE panelist is dropped from the selector's eligible set"]

  # --- Test-driving endpoints -------------------------------------------
  - method: POST
    path: "/udrp/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, decay and interval rule in this scaffold reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [ProviderAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock moves; no stored row is touched and no deadline is re-evaluated until the next write or sweep"]

  - method: POST
    path: "/udrp/_ops/deadline-sweep"
    description: "Advance every time-driven transition that is due as of the logical clock, in this fixed order: (1) OPEN DeficiencyNotice rows past their correction deadline expire and close their case with a full refund, (2) REQUESTED RegistrarVerification rows past due_at become OVERDUE, (3) COMMENCED cases past their response deadline plus grace record a default."
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: "{ expired_notice_count: integer, overdue_verification_count: integer, defaulted_case_count: integer, closed_case_count: integer }"
    side_effects:
      - "DeficiencyNotice OPEN -> EXPIRED, and its case DEFICIENT -> ADMIN_CLOSED with the four-link refund cascade"
      - "RegistrarVerification REQUESTED -> OVERDUE with escalation_count += 1 and Registrar.overdue_verification_count += 1"
      - "Case.default_recorded = true on cases whose response window and grace have both lapsed with no Response row"
      - "the sweep is idempotent: running it twice at the same clock value changes nothing on the second run and returns all-zero counts"

  # --- Case --------------------------------------------------------------
  - method: POST
    path: "/udrp/cases"
    description: "File a complaint. required_seat_count starts at 1 and the provisional fee variant is assessed immediately."
    roles: [Complainant, CaseManager]
    code: 201
    input: [complainant_id, domain_id, mutual_jurisdiction, remedy_requested, "panel_election?", "expedited_requested?"]
    output: Case
    side_effects:
      - "runs calculations.domain_occupation_conflict (ERR_DOMAIN_PROCEEDING_OVERLAP, ERR_REFILING_BAR_ACTIVE)"
      - "runs calculations.filing_fee_assessment variant PROVISIONAL_AT_FILING, writing assessed_fee_cents, complainant_share_cents, respondent_share_cents and honoraria_pool_cents"
      - "creates Case with status FILED, required_seat_count 1, version 1"
      - "Complainant.open_case_count += 1"

  - method: GET
    path: "/udrp/cases/{id}"
    description: "Read one case. This is the read every optimistic-concurrency caller uses to obtain the current Case.version before a nomination or a decision draft."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent, Panelist, RegistrarAgent]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/udrp/cases"
    description: "List cases, filterable by complainant_id (the reverse of Case.complainant_id) and domain_id (the reverse of Case.domain_id)."
    roles: [ProviderAdmin, CaseManager]
    code: 200
    input: ["complainant_id?", "domain_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/udrp/cases/{id}/withdraw"
    description: "Withdraw a complaint before the panel is appointed. The refund percentage is decided by how far the case had progressed."
    roles: [Complainant, CaseManager]
    code: 200
    input: ["reason?"]
    output: Case
    side_effects:
      - "Case.status -> WITHDRAWN with closed_at and refiling_bar_until set"
      - "runs calculations.withdrawal_refund, minting one negative REFUND FeeTransaction per payer with a positive contribution"
      - "any OPEN DeficiencyNotice expires; a LOCKED domain unlocks; Complainant.open_case_count -= 1"
      - "Case.version += 1"

  # --- ComplaintGround ---------------------------------------------------
  - method: POST
    path: "/udrp/cases/{id}/grounds"
    description: "Assert one of the three required grounds, with an evidence count and optional precedent citations."
    roles: [Complainant, CaseManager]
    code: 201
    input: [ground_type, assertion_text, evidence_count, "mark_registration_number?", "mark_jurisdiction?", "similarity_claim?", "cited_decision_ids?"]
    output: ComplaintGround
    side_effects:
      - "runs calculations.ground_sufficiency_evaluation, writing sufficiency_status"
      - "validates every cited decision is citable (ERR_CITED_PRECEDENT_NOT_PUBLISHED)"
      - "creates ComplaintGround; a second row for the same ground_type is refused with ERR_DUPLICATE_GROUND_TYPE"

  - method: GET
    path: "/udrp/cases/{id}/grounds"
    description: "List the grounds asserted on a case (the reverse of ComplaintGround.case_id)."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent, Panelist]
    code: 200
    input: []
    output: ComplaintGround[]
    side_effects: []

  # --- FeeTransaction ----------------------------------------------------
  - method: POST
    path: "/udrp/cases/{id}/fee-transactions"
    description: "Record a money movement on the case ledger. Ledger lines are immutable once written; REFUND lines are normally minted by the server but may also be recorded here."
    roles: [ProviderAdmin, CaseManager]
    code: 201
    input: [kind, payer, amount_cents, "reference?"]
    output: FeeTransaction
    side_effects:
      - "creates FeeTransaction with recorded_at = clock"
      - "runs calculations.case_ledger_reconciliation, recomputing Case.paid_cents, complainant_paid_cents and respondent_paid_cents from the whole ledger"

  - method: GET
    path: "/udrp/cases/{id}/fee-transactions"
    description: "List the case ledger in recorded_at order (the reverse of FeeTransaction.case_id)."
    roles: [ProviderAdmin, CaseManager, Complainant]
    code: 200
    input: []
    output: FeeTransaction[]
    side_effects: []

  # --- Administrative compliance review ---------------------------------
  - method: POST
    path: "/udrp/cases/{id}/deficiency-notices"
    description: "Issue a deficiency notice against a filed complaint. correction_days defaults to CORRECTION_PERIOD_DAYS (5)."
    roles: [CaseManager]
    code: 201
    input: [deficiency_codes, "correction_days?"]
    output: DeficiencyNotice
    side_effects:
      - "creates DeficiencyNotice OPEN with round_number and correction_deadline_at"
      - "Case.status FILED -> DEFICIENT, deficiency_round_count += 1, last_deficiency_issuer_user_id = X-User-ID"
      - "Case.version += 1"

  - method: GET
    path: "/udrp/cases/{id}/deficiency-notices"
    description: "List the deficiency notices issued on a case (the reverse of DeficiencyNotice.case_id)."
    roles: [ProviderAdmin, CaseManager, Complainant]
    code: 200
    input: []
    output: DeficiencyNotice[]
    side_effects: []

  - method: POST
    path: "/udrp/cases/{id}/corrections"
    description: "Cure an open deficiency inside the correction period, returning the case to FILED."
    roles: [Complainant]
    code: 200
    input: [notice_id, correction_notes]
    output: Case
    side_effects:
      - "DeficiencyNotice OPEN -> CURED with cured_at"
      - "Case.status DEFICIENT -> FILED; Case.version += 1"

  - method: POST
    path: "/udrp/cases/{id}/compliance-clearance"
    description: "Clear administrative compliance and request registrar verification. The clearing case manager may not be the one who issued the last deficiency notice."
    roles: [CaseManager]
    code: 200
    input: ["reviewer_notes?"]
    output: Case
    side_effects:
      - "ERR_SEGREGATION_OF_DUTIES at priority 50 outranks ERR_FILING_FEE_SHORTFALL at priority 80"
      - "creates RegistrarVerification REQUESTED with due_at = clock + Registrar.verification_response_hours hours"
      - "Case.status FILED -> VERIFICATION_PENDING, compliance_cleared_by_user_id set; Case.version += 1"

  # --- Registrar verification and domain lock ---------------------------
  - method: POST
    path: "/udrp/cases/{id}/registrar-verifications"
    description: "Re-request verification from the registrar after the previous request went OVERDUE."
    roles: [CaseManager]
    code: 201
    input: []
    output: RegistrarVerification
    side_effects:
      - "the OVERDUE row returns to REQUESTED with a fresh requested_at and due_at, and Registrar.overdue_verification_count -= 1"

  - method: GET
    path: "/udrp/cases/{id}/registrar-verifications"
    description: "List the verification requests on a case (the reverse of RegistrarVerification.case_id). This is the only channel through which the cascade-created verification row can be discovered."
    roles: [ProviderAdmin, CaseManager, RegistrarAgent]
    code: 200
    input: []
    output: RegistrarVerification[]
    side_effects: []

  - method: POST
    path: "/udrp/cases/{id}/registrar-verifications/{verification_id}/response"
    description: "Registrar answers the verification, discloses the true registrant and confirms the transfer lock."
    roles: [RegistrarAgent]
    code: 200
    input: [lock_applied, verified_registrant_name, verified_registrant_email, "registrar_remarks?"]
    output: RegistrarVerification
    side_effects:
      - "RegistrarVerification -> RESPONDED with responded_at"
      - "DomainName.lock_status UNLOCKED -> LOCKED with locked_at; DomainName.version += 1"
      - "Case.verified_registrant_name and verified_registrant_email written; Case.status -> NOTIFICATION_PENDING; Case.version += 1"

  # --- Respondent notification ------------------------------------------
  - method: POST
    path: "/udrp/cases/{id}/notifications"
    description: "Dispatch (or re-dispatch) the complaint to the respondent. Commencement requires the domain to be locked."
    roles: [CaseManager]
    code: 201
    input: [channel, address]
    output: RespondentNotification
    side_effects:
      - "creates RespondentNotification SENT with attempt_number and dispatched_at"
      - "Case.status NOTIFICATION_PENDING -> COMMENCED with commenced_at on the first attempt"
      - "runs calculations.response_deadline_projection variant PROVISIONAL_AT_DISPATCH, writing provisional_response_due_at and response_due_at"
      - "Case.version += 1"

  - method: GET
    path: "/udrp/cases/{id}/notifications"
    description: "List the notification attempts on a case (the reverse of RespondentNotification.case_id)."
    roles: [ProviderAdmin, CaseManager, Respondent]
    code: 200
    input: []
    output: RespondentNotification[]
    side_effects: []

  - method: POST
    path: "/udrp/cases/{id}/notifications/{notification_id}/delivery"
    description: "Record the delivery outcome of a notification attempt. A DELIVERED outcome re-anchors the response deadline on the observed receipt instant."
    roles: [CaseManager]
    code: 200
    input: [outcome, "deemed_received_at?", "failure_reason?"]
    output: RespondentNotification
    side_effects:
      - "RespondentNotification SENT -> DELIVERED with deemed_received_at, or -> UNDELIVERABLE with failure_reason"
      - "on DELIVERED: runs calculations.response_deadline_projection variant FINAL_AT_DELIVERY, replacing Case.response_due_at and setting Case.deadline_variant_applied to FINAL; Case.version += 1"

  # --- Response ----------------------------------------------------------
  - method: POST
    path: "/udrp/cases/{id}/responses"
    description: "Respondent answers the complaint and may elect a three-member panel, which re-prices the case."
    roles: [Respondent]
    code: 201
    input: [respondent_email, content_summary, "requests_three_member_panel?", "nominated_panelist_ids?"]
    output: Response
    side_effects:
      - "creates Response with timeliness ON_TIME or LATE"
      - "Case.status COMMENCED -> RESPONSE_RECEIVED"
      - "on a three-member election: required_seat_count 1 -> 3, respondent_panel_election -> THREE, and calculations.filing_fee_assessment variant FINAL_AT_ELECTION rewrites all four money fields"
      - "Case.version += 1"

  - method: GET
    path: "/udrp/cases/{id}/responses"
    description: "List the response filed on a case, zero or one row (the reverse of Response.case_id)."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent, Panelist]
    code: 200
    input: []
    output: Response[]
    side_effects: []

  # --- Panelist appointment ---------------------------------------------
  - method: POST
    path: "/udrp/cases/{id}/appointments"
    description: "Nominate a panelist to a seat. Omit panelist_id to let calculations.panelist_selector choose; supply it to nominate a named candidate, who is still put through the whole eligibility filter. expected_case_version is required (§1.2.1)."
    roles: [CaseManager]
    code: 201
    input: [seat, nominated_by, expected_case_version, "panelist_id?"]
    output: PanelistAppointment
    side_effects:
      - "ERR_STALE_CASE_VERSION (412) when expected_case_version does not match the stored Case.version"
      - "runs calculations.panelist_selector; an empty eligible set yields ERR_NO_ELIGIBLE_PANELIST"
      - "for a NAMED panelist_id: the non-temporal clauses yield ERR_PANELIST_INELIGIBLE (65), then calculations.panelist_window_conflict yields ERR_PANELIST_WINDOW_CONFLICT (66) or ERR_PANELIST_CAPACITY_EXCEEDED (67) against the prospective window [clock, clock + 14 days)"
      - "creates PanelistAppointment NOMINATED with created_at = clock"
      - "Case.status RESPONSE_RECEIVED or DEFAULT -> PANEL_APPOINTMENT on the first seat"
      - "Case.version += 1"

  - method: GET
    path: "/udrp/appointments"
    description: "List appointments, filterable by case_id (the reverse of PanelistAppointment.case_id) and panelist_id (the reverse of PanelistAppointment.panelist_id)."
    roles: [ProviderAdmin, CaseManager, Panelist]
    code: 200
    input: ["case_id?", "panelist_id?", "status?", "seat?", "limit?", "offset?"]
    output: PanelistAppointment[]
    side_effects: []

  - method: GET
    path: "/udrp/appointments/{id}"
    description: "Read one appointment, including its computed conflict_score, conflict_factors and honoraria_cents."
    roles: [ProviderAdmin, CaseManager, Panelist]
    code: 200
    input: []
    output: PanelistAppointment
    side_effects: []

  - method: POST
    path: "/udrp/appointments/{id}/conflict-screening"
    description: "The nominated panelist discloses conflicts. The computed score alone routes the seat to ACCEPTED, WAIVER_PENDING or CONFLICTED. months_since_last_contact may be omitted, which means the relationship is current and no decay applies."
    roles: [Panelist]
    code: 200
    input: [disclosed_prior_representation, disclosed_same_firm, disclosed_financial_interest, prior_appointments_with_complainant, "months_since_last_contact?"]
    output: PanelistAppointment
    side_effects:
      - "runs calculations.panelist_conflict_score, writing conflict_score and conflict_factors"
      - "on a score below CONFLICT_WAIVER_THRESHOLD: runs calculations.panelist_window_conflict, then status -> ACCEPTED with accepted_at and decision_due_at, and Panelist.active_case_load += 1"
      - "on a score in [CONFLICT_WAIVER_THRESHOLD, CONFLICT_DISQUALIFY_THRESHOLD): status -> WAIVER_PENDING with no load taken"
      - "on a score at or above CONFLICT_DISQUALIFY_THRESHOLD: status -> CONFLICTED"
      - "when the ACCEPTED count reaches Case.required_seat_count: Case.status -> PANEL_CONSTITUTED and calculations.panelist_honoraria_allocation writes honoraria_cents on every seat; Case.version += 1"

  - method: POST
    path: "/udrp/appointments/{id}/waiver"
    description: "Case manager records the parties' consent to a disclosed but waivable conflict, seating the panelist. waiver_respondent may be omitted only when the case has a recorded default."
    roles: [CaseManager]
    code: 200
    input: [waiver_complainant, "waiver_respondent?"]
    output: PanelistAppointment
    side_effects:
      - "ERR_CONFLICT_NOT_WAIVABLE when conflict_score is at or above CONFLICT_DISQUALIFY_THRESHOLD"
      - "runs calculations.panelist_window_conflict"
      - "waiver_complainant and waiver_respondent stored, status WAIVER_PENDING -> ACCEPTED with accepted_at and decision_due_at; Panelist.active_case_load += 1"
      - "may complete the panel, moving Case.status -> PANEL_CONSTITUTED and allocating honoraria"

  - method: POST
    path: "/udrp/appointments/{id}/replace"
    description: |
      Vacate a seat and mint its successor. The response body is the UPDATED PREDECESSOR row, whose
      replaced_by_appointment_id points at the newly created NOMINATED successor - callers read the
      successor's id out of that field, not out of id. Replacing an ACCEPTED seat un-constitutes the
      panel and voids any draft decision.
    roles: [CaseManager]
    code: 200
    input: ["replacement_panelist_id?", "reason?"]
    output: PanelistAppointment
    side_effects:
      - "the predecessor moves to DECLINED (from NOMINATED or WAIVER_PENDING) or REPLACED (from CONFLICTED or ACCEPTED), with replaced_by_appointment_id set"
      - "from ACCEPTED: honoraria_cents -> 0, Panelist.active_case_load -= 1, Case.status PANEL_CONSTITUTED -> PANEL_APPOINTMENT, and every DRAFT Decision on the case -> VOIDED"
      - "creates the successor PanelistAppointment NOMINATED for the same seat, chosen by the selector when replacement_panelist_id is omitted"
      - "Case.version += 1"

  # --- Decision ----------------------------------------------------------
  - method: POST
    path: "/udrp/cases/{id}/decisions"
    description: "Open a decision draft. Legal from Case.status PANEL_APPOINTMENT or PANEL_CONSTITUTED, so a draft may exist before every seat is filled; issuance is what demands a fully constituted panel. expected_case_version is required (§1.2.1). drafted_by_panelist_id must name a panelist holding an ACCEPTED seat on this case."
    roles: [CaseManager]
    code: 201
    input: [expected_case_version, drafted_by_panelist_id, draft_summary]
    output: Decision
    side_effects:
      - "ERR_STALE_CASE_VERSION (412) when expected_case_version does not match the stored Case.version"
      - "creates Decision with status DRAFT and publication_status UNPUBLISHED"
      - "Case.version += 1"

  - method: GET
    path: "/udrp/cases/{id}/decisions"
    description: "List the decisions drafted on a case, including voided drafts (the reverse of Decision.case_id)."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent, Panelist]
    code: 200
    input: []
    output: Decision[]
    side_effects: []

  - method: GET
    path: "/udrp/decisions/{id}"
    description: "Read one decision, including outcome, outcome_basis, rdnh_finding, the three vote counts and implementation_deadline_at."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent, Panelist, RegistrarAgent]
    code: 200
    input: []
    output: Decision
    side_effects: []

  - method: POST
    path: "/udrp/decisions/{id}/votes"
    description: "A seated panelist casts its vote. The seat is derived from the caller's ACCEPTED appointment on the case, so a caller with no such appointment gets ERR_NOT_SEAT_HOLDER. Votes are immutable."
    roles: [Panelist]
    code: 201
    input: [seat, vote, "rdnh_vote?", "rationale?"]
    output: PanelVote
    side_effects:
      - "creates PanelVote with voter_panelist_id = X-User-ID, seat derived from the caller's appointment, cast_at = clock"
      - "a second vote from the same seat on the same decision yields ERR_VOTE_ALREADY_CAST"

  - method: GET
    path: "/udrp/decisions/{id}/votes"
    description: "List the votes cast on a decision (the reverse of PanelVote.decision_id). Votes on a voided decision remain readable."
    roles: [ProviderAdmin, CaseManager, Panelist]
    code: 200
    input: []
    output: PanelVote[]
    side_effects: []

  - method: POST
    path: "/udrp/decisions/{id}/issue"
    description: "Issue the decision. Tallies the votes, determines transfer, cancellation or complaint denial and any reverse domain name hijacking finding, and opens the implementation waiting period."
    roles: [CaseManager]
    code: 200
    input: []
    output: Decision
    side_effects:
      - "runs calculations.panel_outcome_tally, writing outcome, outcome_basis, rdnh_finding, dissent_present, transfer_votes, cancellation_votes and deny_votes"
      - "runs calculations.implementation_window, writing implementation_deadline_at"
      - "Decision.status DRAFT -> ISSUED with issued_at; Case.status PANEL_CONSTITUTED -> IMPLEMENTATION_WAITING"
      - "on rdnh_finding true: Complainant.adverse_rdnh_findings += 1"
      - "Case.version += 1"

  - method: POST
    path: "/udrp/decisions/{id}/publish"
    description: "Publish the decision to the precedent database, optionally redacted. Returns the created PrecedentEntry."
    roles: [ProviderAdmin]
    code: 201
    input: [redaction_level, precedent_tags, "digest_text?"]
    output: PrecedentEntry
    side_effects:
      - "Decision.publication_status UNPUBLISHED -> PUBLISHED when redaction_level is NONE, or -> REDACTED when PARTY_NAMES or FULL; the PrecedentEntry row is written with published_at = clock"
      - "creates PrecedentEntry with citable true unless redaction_level is FULL"
      - "runs calculations.precedent_citation_metrics, writing citation_count and precedent_weight"

  - method: GET
    path: "/udrp/decisions/{id}/precedent-entry"
    description: "The precedent entry for a decision, zero or one row (the reverse of PrecedentEntry.decision_id). citation_count and precedent_weight are re-evaluated on every read against the logical clock."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent, Panelist]
    code: 200
    input: []
    output: PrecedentEntry[]
    side_effects: ["runs calculations.precedent_citation_metrics on read"]

  - method: GET
    path: "/udrp/precedents"
    description: "Search the precedent database. Superseded entries (whose decision was voided by a court) are excluded unless include_superseded is true; entries whose decision was FULL-redacted are never citable and never listed."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent, Panelist]
    code: 200
    input: ["outcome?", "citable?", "include_superseded?", "limit?", "offset?"]
    output: PrecedentEntry[]
    side_effects: ["runs calculations.precedent_citation_metrics on read"]

  # --- Court challenge and implementation --------------------------------
  - method: POST
    path: "/udrp/decisions/{id}/court-challenges"
    description: "Either party files a court action inside the implementation waiting period, staying the decision. A Respondent caller must supply respondent_email matching the case's verified registrant email."
    roles: [Complainant, Respondent]
    code: 201
    input: [jurisdiction, docket_number, filed_by, "respondent_email?"]
    output: CourtChallenge
    side_effects:
      - "ERR_CHALLENGE_WINDOW_CLOSED once the clock is past Decision.implementation_deadline_at"
      - "creates CourtChallenge FILED with filed_at = clock"
      - "Decision.status ISSUED -> STAYED; Case.status IMPLEMENTATION_WAITING -> STAYED; Case.version += 1"

  - method: GET
    path: "/udrp/decisions/{id}/court-challenges"
    description: "List the court challenges filed against a decision (the reverse of CourtChallenge.decision_id)."
    roles: [ProviderAdmin, CaseManager, Complainant, Respondent]
    code: 200
    input: []
    output: CourtChallenge[]
    side_effects: []

  - method: POST
    path: "/udrp/court-challenges/{id}/resolve"
    description: "Record how the court disposed of the challenge. DISMISSED or WITHDRAWN lifts the stay and restarts the full ten-business-day waiting period; SUSTAINED voids the decision and terminates the case."
    roles: [ProviderAdmin]
    code: 200
    input: [outcome, "resolution_note?"]
    output: CourtChallenge
    side_effects:
      - "on DISMISSED or WITHDRAWN: Decision.status STAYED -> ISSUED with implementation_deadline_at recomputed from resolved_at; Case.status -> IMPLEMENTATION_WAITING"
      - "on SUSTAINED: the five-link cascade runs — challenge SUSTAINED, Decision VOIDED, Case TERMINATED_COURT with closed_at and refiling_bar_until, every ACCEPTED appointment DISCHARGED, every affected Panelist.active_case_load -= 1"
      - "on SUSTAINED: the domain unlocks, Complainant.open_case_count -= 1, and an rdnh_finding is un-counted from adverse_rdnh_findings"
      - "on SUSTAINED against a published decision: PrecedentEntry.superseded -> true, publication_status untouched"
      - "Case.version += 1"

  - method: POST
    path: "/udrp/decisions/{id}/implement"
    description: "The registrar carries out the decision once the waiting period has fully elapsed. A COMPLAINT_DENIED outcome simply releases the lock."
    roles: [RegistrarAgent]
    code: 200
    input: ["registrar_action_reference?"]
    output: Decision
    side_effects:
      - "ERR_IMPLEMENTATION_PERIOD_ACTIVE while the clock is at or before Decision.implementation_deadline_at"
      - "Decision.status ISSUED -> IMPLEMENTED with implemented_at"
      - "DomainName.lock_status -> TRANSFER_EXECUTED, CANCELLATION_EXECUTED or UNLOCKED per the outcome; DomainName.version += 1"
      - "Case.status -> IMPLEMENTED with closed_at and refiling_bar_until; every ACCEPTED appointment -> DISCHARGED; every affected Panelist.active_case_load -= 1; Complainant.open_case_count -= 1"
      - "Case.version += 1"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role names no declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "a Complainant acts on a case that is not its own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the case manager clearing compliance is the same user id that issued the case's most recent deficiency notice"
  - id: ERR_REGISTRAR_MISMATCH
    http: 403
    condition: "a RegistrarAgent acts on a case whose domain belongs to a different registrar"
  - id: ERR_RESPONDENT_IDENTITY_MISMATCH
    http: 403
    condition: "the supplied respondent_email does not equal Case.verified_registrant_email"
  - id: ERR_NOT_SEAT_HOLDER
    http: 403
    condition: "a Panelist screens an appointment it does not hold, or votes without an ACCEPTED seat on the case"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum value is not declared, a count is negative, or a country code is not exactly two letters"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "the {id} of a case-rooted path names no Case"
  - id: ERR_DOMAIN_NOT_FOUND
    http: 404
    condition: "the {id} of a domain path names no DomainName"
  - id: ERR_PANELIST_NOT_FOUND
    http: 404
    condition: "the {id} of a panelist path names no Panelist"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "the {id} of an appointment path names no PanelistAppointment"
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "the {id} of a decision path names no Decision"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a nested sub-resource id, a court-challenge id, or a body-referenced id names no row of the expected entity"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "the case's status does not admit this operation"
  - id: ERR_INVALID_APPOINTMENT_STATE
    http: 409
    condition: "the appointment's status does not admit this operation"
  - id: ERR_INVALID_DECISION_STATE
    http: 409
    condition: "the decision's status does not admit this operation"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the stored Case.version"
  - id: ERR_ALREADY_PUBLISHED
    http: 409
    condition: "the decision's publication_status is already PUBLISHED or REDACTED"
  - id: ERR_WITHDRAWAL_WINDOW_CLOSED
    http: 409
    condition: "withdrawal attempted from PANEL_APPOINTMENT or any later status"
  - id: ERR_DUPLICATE_DOMAIN_NAME
    http: 409
    condition: "a DomainName row already carries this domain_name"
  - id: ERR_DOMAIN_PROCEEDING_OVERLAP
    http: 409
    condition: "the domain is already occupied by a case in a non-terminal status"
  - id: ERR_REFILING_BAR_ACTIVE
    http: 409
    condition: "the clock is at or before a closed case's refiling_bar_until on the same domain"
  - id: ERR_DUPLICATE_GROUND_TYPE
    http: 409
    condition: "the case already carries a ComplaintGround of this ground_type"
  - id: ERR_MISSING_REQUIRED_GROUND
    http: 422
    condition: "compliance clearance attempted without all three of TRADEMARK_RIGHTS, NO_LEGITIMATE_INTEREST and BAD_FAITH"
  - id: ERR_GROUND_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "some ComplaintGround on the case has sufficiency_status DEFICIENT"
  - id: ERR_CITED_PRECEDENT_NOT_PUBLISHED
    http: 422
    condition: "a cited decision is UNPUBLISHED, or is REDACTED with redaction_level FULL"
  - id: ERR_FILING_FEE_SHORTFALL
    http: 402
    condition: "Case.complainant_paid_cents is below Case.complainant_share_cents at compliance clearance"
  - id: ERR_PANEL_SUPPLEMENT_UNPAID
    http: 402
    condition: "Case.paid_cents is below Case.assessed_fee_cents at nomination, typically because the elected three-member supplement has not landed"
  - id: ERR_DEFICIENCY_ROUND_LIMIT
    http: 409
    condition: "a third deficiency notice is attempted on the same case"
  - id: ERR_CORRECTION_PERIOD_EXPIRED
    http: 409
    condition: "the clock is past the named notice's correction_deadline_at"
  - id: ERR_REGISTRAR_SUSPENDED
    http: 409
    condition: "a SUSPENDED registrar attempts to answer a verification"
  - id: ERR_DOMAIN_LOCK_NOT_APPLIED
    http: 422
    condition: "a verification response arrives with lock_applied false"
  - id: ERR_DOMAIN_NOT_LOCKED
    http: 409
    condition: "notification or implementation attempted while the domain's lock_status is not LOCKED"
  - id: ERR_CASE_NOT_IN_RESPONSE_WINDOW
    http: 409
    condition: "a response is filed against a case whose status is not COMMENCED"
  - id: ERR_RESPONSE_DEADLINE_PASSED
    http: 409
    condition: "a response arrives after Case.response_due_at plus the late grace window"
  - id: ERR_RESPONSE_ALREADY_FILED
    http: 409
    condition: "the case already carries a Response row"
  - id: ERR_SEAT_NOT_APPLICABLE
    http: 422
    condition: "the requested seat does not exist at the case's required_seat_count"
  - id: ERR_SEAT_ALREADY_FILLED
    http: 409
    condition: "the requested seat is already held by a NOMINATED, WAIVER_PENDING or ACCEPTED row"
  - id: ERR_PANELIST_INELIGIBLE
    http: 409
    condition: "a named panelist fails the selector's eligibility filter, for instance on the nationality exclusion or because it already holds a seat on this case"
  - id: ERR_PANELIST_WINDOW_CONFLICT
    http: 409
    condition: "the candidate engagement window overlaps another ACCEPTED seat's half-open window, or touches the panelist's closed blackout interval"
  - id: ERR_PANELIST_CAPACITY_EXCEEDED
    http: 409
    condition: "the panelist's active_case_load has reached max_overlapping_engagements"
  - id: ERR_NO_ELIGIBLE_PANELIST
    http: 422
    condition: "the selector's eligible set is empty"
  - id: ERR_CONFLICT_NOT_WAIVABLE
    http: 409
    condition: "a waiver is attempted on an appointment whose conflict_score is at or above CONFLICT_DISQUALIFY_THRESHOLD"
  - id: ERR_WAIVER_INCOMPLETE
    http: 422
    condition: "waiver_complainant is false, or waiver_respondent is missing or false on a case with no recorded default"
  - id: ERR_PANEL_NOT_CONSTITUTED
    http: 409
    condition: "issuance attempted while some seat is not ACCEPTED or the ACCEPTED count differs from Case.required_seat_count"
  - id: ERR_VOTE_ALREADY_CAST
    http: 409
    condition: "the same seat votes twice on one decision"
  - id: ERR_VOTES_INCOMPLETE
    http: 422
    condition: "issuance attempted with fewer PanelVote rows than Case.required_seat_count"
  - id: ERR_IMPLEMENTATION_PERIOD_ACTIVE
    http: 409
    condition: "implementation attempted at or before Decision.implementation_deadline_at"
  - id: ERR_CHALLENGE_WINDOW_CLOSED
    http: 409
    condition: "a court challenge is filed after Decision.implementation_deadline_at"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProviderAdmin
    description: "Runs the dispute resolution provider: accredits registrars, admits panelists, publishes decisions, records court dispositions and drives the logical clock and the deadline sweep."
    identity: opaque
    exclusive_operations:
      - "POST /udrp/registrars"
      - "POST /udrp/registrars/{id}/status"
      - "POST /udrp/panelists"
      - "POST /udrp/decisions/{id}/publish"
      - "POST /udrp/court-challenges/{id}/resolve"
      - "POST /udrp/_clock/set_current_utc"
      - "POST /udrp/_ops/deadline-sweep"
    shared_operations:
      - "POST /udrp/domains"
      - "POST /udrp/domains/{id}/lock"
      - "POST /udrp/complainants"
      - "POST /udrp/panelists/{id}/availability"
      - "POST /udrp/cases/{id}/fee-transactions"
      - "every GET"

  - name: CaseManager
    description: "The provider's case administrator: runs the compliance review, requests registrar verification, notifies the respondent, nominates panelists, grants conflict waivers, opens and issues decisions. Segregation of duties is enforced on the pinned X-User-ID, so the manager who issued a deficiency notice cannot be the one who clears compliance."
    identity: opaque
    exclusive_operations:
      - "POST /udrp/cases/{id}/deficiency-notices"
      - "POST /udrp/cases/{id}/compliance-clearance"
      - "POST /udrp/cases/{id}/registrar-verifications"
      - "POST /udrp/cases/{id}/notifications"
      - "POST /udrp/cases/{id}/notifications/{notification_id}/delivery"
      - "POST /udrp/cases/{id}/appointments"
      - "POST /udrp/appointments/{id}/waiver"
      - "POST /udrp/appointments/{id}/replace"
      - "POST /udrp/cases/{id}/decisions"
      - "POST /udrp/decisions/{id}/issue"
    shared_operations:
      - "POST /udrp/domains"
      - "POST /udrp/complainants"
      - "POST /udrp/cases"
      - "POST /udrp/cases/{id}/grounds"
      - "POST /udrp/cases/{id}/fee-transactions"
      - "POST /udrp/cases/{id}/withdraw"
      - "every GET"
    identity_note: "Case managers are addressed by pinned opaque operator ids such as cm-001 and cm-002. Nothing requires an X-User-ID to equal any persisted row's id."

  - name: Complainant
    description: "The trademark owner who filed the complaint. Acts only on its own cases."
    identity: "entity_backed:Complainant"
    exclusive_operations:
      - "POST /udrp/cases/{id}/corrections"
    shared_operations:
      - "POST /udrp/cases"
      - "POST /udrp/cases/{id}/grounds"
      - "POST /udrp/cases/{id}/withdraw"
      - "POST /udrp/decisions/{id}/court-challenges"
      - "GET /udrp/cases/{id} and the case's sub-resource GETs"
    ownership_rule: "X-User-ID must equal Case.complainant_id, else ERR_NOT_OWNER at priority 25."

  - name: Respondent
    description: "The domain registrant answering the complaint. There is no Respondent entity: the registrant is only known once the registrar discloses it, so identity is proven per request by the payload's respondent_email."
    identity: opaque
    exclusive_operations:
      - "POST /udrp/cases/{id}/responses"
    shared_operations:
      - "POST /udrp/decisions/{id}/court-challenges"
      - "GET /udrp/cases/{id} and the case's sub-resource GETs"
    ownership_rule: "the request's respondent_email must equal Case.verified_registrant_email, else ERR_RESPONDENT_IDENTITY_MISMATCH at priority 27. X-User-ID is an opaque operator id and is never compared to any row's id."

  - name: Panelist
    description: "A roster panelist. Discloses conflicts on its own nominations and votes from its own seat."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /udrp/appointments/{id}/conflict-screening"
      - "POST /udrp/decisions/{id}/votes"
    shared_operations:
      - "POST /udrp/panelists/{id}/availability"
      - "GET /udrp/appointments, GET /udrp/appointments/{id}, GET /udrp/decisions/{id}, GET /udrp/precedents"
    ownership_rule: "X-User-ID must equal PanelistAppointment.panelist_id for screening, and must hold an ACCEPTED seat on the decision's case to vote, else ERR_NOT_SEAT_HOLDER at priority 28."

  - name: RegistrarAgent
    description: "The registrar of record. Answers verification requests, applies the transfer lock and carries out the decision once the waiting period has elapsed."
    identity: "entity_backed:Registrar"
    exclusive_operations:
      - "POST /udrp/cases/{id}/registrar-verifications/{verification_id}/response"
      - "POST /udrp/decisions/{id}/implement"
    shared_operations:
      - "POST /udrp/domains/{id}/lock"
      - "GET /udrp/registrars/{id}, GET /udrp/domains, GET /udrp/domains/{id}, GET /udrp/cases/{id}"
    ownership_rule: "X-User-ID must equal DomainName.registrar_id of the case's domain, else ERR_REGISTRAR_MISMATCH at priority 26."

role_model_note: |
  segregation_of_duties. The provider-side work is split between ProviderAdmin and CaseManager so
  that roster admission, publication and court disposition never sit with the person running the
  case, and a second constraint operates INSIDE the CaseManager role: the user who issued a case's
  most recent deficiency notice may not clear that case's compliance. The three party roles
  (Complainant, Respondent, Panelist) are peer roles over disjoint resources, each with its own
  distinct identity mechanism — foreign key for Complainant and Panelist, per-request payload proof
  for Respondent, because the respondent's identity is not known to the provider until the registrar
  discloses it during verification.
