      - name: cascading_side_effects_layer_reactive_serology_recall_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines[Donor].transitions[SCREENING->PERMANENTLY_DEFERRED]
        excluded_because:
          difficulty_instance: transitive_cascade / reactive_serology_five_hop_recall
          rationale: "The cascading_side_effects layer asks for an N-level chain verified end-to-end with ordering sensitivity; §1.8 already drives the full five-hop DeferralEvent -> Donation -> PoolComponent -> MilkLot -> Dispense recall from one reactive serology panel and asserts every hop plus the money reversal, so a second corner test would duplicate it exactly."
      - name: dual_variant_calculation_layer_provisional_versus_final_reimbursement
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations[shipment_reimbursement].variants
        excluded_because:
          difficulty_instance: dual_variant_calc / shipment_reimbursement_provisional_vs_final_divergence
          rationale: "The dual_variant_calculation layer asks that both variants produce their expected results and that the delta on the switch is correct; §1.8 already pins PROVISIONAL_AT_DISPATCH against FINAL_AT_RECEIPT on the same cooler, computes the excursion-driven delta and reconciles it into Donor.reimbursement_balance_cents."
      - name: selector_policy_fefo_tie_is_broken_by_smaller_available_volume_before_lot_code
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers
          - calculations[allocation_cycle_waterfall]
          - endpoints[POST /milk-bank/allocation-cycles]
        distinguishing_aspect: "Two lots bottled from the same run share one expiration_date, so FEFO cannot separate them and the declared supply order falls through to available_ml ASC before lot_code ASC: the first tier-1 order is filled from the 600 ml lot -02 rather than the 1200 ml lot -01, and the next order takes lot -02 down to zero before touching lot -01 - a lot_code-first selector would have drawn -01 first and produced a different Dispense set."
