      - name: primary_allocation_clamp_versus_unclamped_cooling
        excluded_because:
          difficulty_instance: circuit_allocation_clamped_while_cooling_load_is_not
          rationale: "The `min(derated_kw, cabinet.rated_power_kw)` clamp on allocated_kw alongside the unclamped cooling_contribution_kw, and the REDUNDANT 25 percent cooling branch, are asserted numerically by that §1.8 instance."
      - name: power_billing_variant_divergence_metered_versus_deemed
        excluded_because:
          difficulty_instance: power_billing_metered_final_versus_deemed_capacity
          rationale: "Variant divergence, variant selection by billing_mode and the fact that identical meter intervals produce a different overage under COMMITTED_ONLY are all asserted there on one shared fixture."
      - name: stranded_capacity_variant_divergence_nameplate_versus_measured
        excluded_because:
          difficulty_instance: row_stranded_capacity_nameplate_versus_measured
          rationale: "The nameplate_view / measured_view divergence on the same row (and the reconciliation when the measured peak moves) is the subject of that §1.8 instance."
      - name: remote_hands_rounding_order_ceiling_then_sum
        excluded_because:
          difficulty_instance: remote_hands_per_segment_ceiling_then_per_segment_rounding
          rationale: "The pinned rounding order (ceil per segment then sum, round money per segment then sum — 168.76 rather than 168.75) is asserted there."
      - name: cross_connect_volume_tier_and_surcharge_step_order
        excluded_because:
          difficulty_instance: cross_connect_close_pinned_six_step_order
          rationale: "The six-step waterfall — allowance waiver, tier keyed on the post-allowance subtotal, discount, surcharge keyed on the discounted subtotal, and the decommission credit — is asserted numerically there (900.00 → 600.00 → 570.00 + 114.00)."
      - name: cooling_gate_equality_is_admitted
        excluded_because:
          difficulty_instance: cooling_load_at_exact_capacity_is_admitted_one_step_beyond_is_refused
          rationale: "Threshold equality for the cooling gate (21.120 admitted at capacity, the next step refused) is asserted there, together with the COOLING_ALERT_RATIO posture flip."
      - name: zero_length_segment_bills_nothing
        excluded_because:
          difficulty_instance: zero_length_work_segment_bills_nothing_and_consumes_no_bundle
          rationale: "The `raw_minutes == 0 → 0 increments` branch, the suppressed InvoiceLine and the untouched bundled-minute balance are asserted there."
      - name: rollup_reconciliation_after_source_change
        excluded_because:
          difficulty_instance: de_energize_then_re_energize_restores_every_rollup_without_drift
          rationale: "contract_provisioning_rollup and row_capacity_and_posture reconciliation after the source circuit changes state (add, remove, re-add) is asserted end to end there."
      - name: cabinet_window_interval_semantics
        excluded_because:
          difficulty_instance: cabinet_visit_windows_are_half_open_so_touching_windows_coexist
          rationale: "Gate A's half-open [window_start, window_end) semantics — touching windows coexist, a one-second overlap collides — is asserted there."
      - name: row_escort_interval_semantics
        excluded_because:
          difficulty_instance: row_escort_capacity_is_closed_interval_so_touching_windows_collide
          rationale: "Gate B's closed-interval aggregate over escort-requiring visits in the same row, contrasted with Gate A on the same timestamps, is asserted there."

