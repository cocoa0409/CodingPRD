            - "trigger call 1: HTTP 409 with error_id ERR_STRATEGY_BUDGET_EXCEEDED — 4000000 does not fit in 3500000"
            - "trigger call 2: HTTP 200, ResourceCommitment.${com}.status == RELEASED, released_at non-null, release_reason stored"
