            - "r_post_status == SAMPLE_DISTRIBUTION"
            - "lot_m_reserved == 2 (sample reservation consumed inventory)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: traceability_link_booking_half_open_overlap
        grounds:
          - validations[priority=10.5]
          - state_machines.CalibrationOrder.RECEIVED_to_SCHEDULED
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) occupation on the
          TraceabilityLink resource — order B starting exactly at order A's end
          (11:00 == 11:00) is legal adjacency, while order C [10:30, 11:30)
          colliding on both sides is rejected with ERR_RESOURCE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "program P (capacity 480); service S with one valid link L (due 2027-01-01); customer C; orders A, B, C"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-15", name: "RM Program 15", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog15: $.data.id }
            - call: "POST /metrology/calibration-services"
              payload: { service_code: "DCV-3", measurand: "DC voltage", base_fee_cents: 20000, per_point_fee_cents: 1500, standard_turnaround_days: 5 }
              as: ProgramAdmin
              captures: { svc15: $.data.id }
            - call: "POST /metrology/traceability-links"
              payload: { service_id: "${svc15}", standard_description: "Std-15", calibrated_by_lab: "NIST-EE", calibrated_date: "2026-06-01T00:00:00Z", calibration_due_date: "2027-01-01T00:00:00Z", uncertainty_contribution: 0.1 }
              as: Metrologist
            - call: "POST /metrology/customers"
              payload: { name: "C15", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_15: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc15}", artifact_description: "artifact A", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_15}"
              captures: { o15a: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc15}", artifact_description: "artifact B", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_15}"
              captures: { o15b: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc15}", artifact_description: "artifact C", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_15}"
              captures: { o15c: $.data.id }
          trigger:
            - call: "POST /metrology/calibration-orders/${o15a}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T09:00:00Z", scheduled_end: "2026-10-05T11:00:00Z" }
              as: CalibrationCoordinator
              captures: { o15a_status: $.data.status }
            - call: "POST /metrology/calibration-orders/${o15b}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T11:00:00Z", scheduled_end: "2026-10-05T12:00:00Z" }
              as: CalibrationCoordinator
              captures: { o15b_status: $.data.status }
            - call: "POST /metrology/calibration-orders/${o15c}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T10:30:00Z", scheduled_end: "2026-10-05T11:30:00Z" }
              as: CalibrationCoordinator
              captures: { o15c_err: $.data.error_id }
          assert:
            - "o15a_status == SCHEDULED"
            - "o15b_status == SCHEDULED (adjacency at exactly 11:00 is legal under half-open semantics)"
            - "o15c_err == ERR_RESOURCE_WINDOW_CONFLICT"

      - name: program_daily_capacity_aggregate
        grounds:
          - validations[priority=10.6]
          - entities.ReferenceMaterialProgram.fields.daily_lab_capacity_minutes
        distinguishing_aspect: |
          Aggregate-capacity semantics on a different resource entity
          (ReferenceMaterialProgram, not a TraceabilityLink): bookings on two
          DIFFERENT links never overlap, yet the second is rejected because the
          day's summed durations 480 + 30 > 480; exactly 480 is allowed (<=).
        test_recipe:
          setup:
            - "program P (daily_lab_capacity_minutes 480); services S1 and S2 each with a valid link (distinct standards); customer C; order A on S1, order B on S2"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-16", name: "RM Program 16", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog16: $.data.id }
            - call: "POST /metrology/calibration-services"
              payload: { service_code: "DCV-4A", measurand: "DC voltage", base_fee_cents: 20000, per_point_fee_cents: 1500, standard_turnaround_days: 5 }
              as: ProgramAdmin
              captures: { svc16a: $.data.id }
            - call: "POST /metrology/calibration-services"
              payload: { service_code: "RES-4B", measurand: "resistance", base_fee_cents: 10000, per_point_fee_cents: 800, standard_turnaround_days: 5 }
              as: ProgramAdmin
              captures: { svc16b: $.data.id }
            - call: "POST /metrology/traceability-links"
              payload: { service_id: "${svc16a}", standard_description: "Std-16A", calibrated_by_lab: "NIST-EE", calibrated_date: "2026-06-01T00:00:00Z", calibration_due_date: "2027-01-01T00:00:00Z", uncertainty_contribution: 0.1 }
              as: Metrologist
            - call: "POST /metrology/traceability-links"
              payload: { service_id: "${svc16b}", standard_description: "Std-16B", calibrated_by_lab: "NIST-EE", calibrated_date: "2026-06-01T00:00:00Z", calibration_due_date: "2027-01-01T00:00:00Z", uncertainty_contribution: 0.1 }
              as: Metrologist
            - call: "POST /metrology/customers"
              payload: { name: "C16", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_16: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc16a}", artifact_description: "artifact A", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_16}"
              captures: { o16a: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc16b}", artifact_description: "artifact B", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_16}"
              captures: { o16b: $.data.id }
          trigger:
            - call: "POST /metrology/calibration-orders/${o16a}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T09:00:00Z", scheduled_end: "2026-10-05T17:00:00Z" }
              as: CalibrationCoordinator
              captures: { o16a_status: $.data.status }
            - call: "POST /metrology/calibration-orders/${o16b}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T17:00:00Z", scheduled_end: "2026-10-05T17:30:00Z" }
              as: CalibrationCoordinator
              captures: { o16b_err: $.data.error_id }
          assert:
            - "o16a_status == SCHEDULED (duration 480 == capacity is allowed: <=)"
            - "o16b_err == ERR_CAPACITY_EXCEEDED (480 + 30 > 480 even though the two links never overlap)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lot_unit_conservation_reserve_release
        grounds:
          - calculations.shortage_allocation
          - state_machines.SalesOrder.ALLOCATED_to_BACKORDERED
          - entities.MaterialLot.fields.units_available
        distinguishing_aspect: |
          Conserved quantity: lot unit ledger — total_units_produced ==
          units_available + units_reserved + units_shipped + qc_units_consumed
          holds after a reserve (12 == 5+3+0+4) and after its compensating
          release (12 == 8+0+0+4); the release sweep excludes the released order
          itself so no re-allocation masks the invariant.
        test_recipe:
          setup:
            - "program P; lot L total 12 (qc 4 -> usable 8) in IN_DISTRIBUTION; customer C"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-17", name: "RM Program 17", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog17: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "C17", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_17: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog17}", material_code: "SRM-N", matrix_description: "mN", total_units_produced: 12 }
              as: ProgramAdmin
              captures: { lot_n: $.data.id }
            - call: "POST /metrology/material-lots/${lot_n}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_n_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_n}", method_code: "ID-ICP-MS", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_n1: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_n}", method_code: "GRAV", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_n2: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_n1}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_n2}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_n}", certificate_code: "CERT-N", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_n_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_n: $.data.id }
            - call: "POST /metrology/certificates/${cert_n}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_n}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_n}", quantity: 3 }
              as: Customer
              as_user_id: "${c_17}"
              captures: { o_n: $.data.id }
            - call: "GET /metrology/material-lots/${lot_n}"
              as: InventoryManager
              captures: { n_avail_1: $.data.units_available, n_res_1: $.data.units_reserved }
          trigger:
            - call: "POST /metrology/sales-orders/${o_n}/transitions"
              payload: { to: BACKORDERED }
              as: Customer
              as_user_id: "${c_17}"
            - call: "GET /metrology/material-lots/${lot_n}"
              as: InventoryManager
              captures: { n_avail_2: $.data.units_available, n_res_2: $.data.units_reserved, n_ship_2: $.data.units_shipped, n_qc_2: $.data.qc_units_consumed }
          assert:
            - "n_avail_1 == 5 and n_res_1 == 3 (12 == 5 + 3 + 0 + 4 after reserve)"
            - "n_avail_2 == 8 and n_res_2 == 0 and n_ship_2 == 0 and n_qc_2 == 4 (12 == 8 + 0 + 0 + 4 after release)"
            - "GET /sales-orders/${o_n}: status == BACKORDERED and allocated_quantity == 0"

      - name: daily_capacity_conserved_schedule_cancel
        grounds:
          - state_machines.CalibrationOrder.SCHEDULED_to_CANCELLED
          - validations[priority=10.6]
        distinguishing_aspect: |
          Conserved quantity: per-day schedule minutes on the program — order B
          rejected at 480+30 > 480 succeeds after the compensating cancel of
          order A restores the day's free capacity, a different conserved
          quantity than material units.
        test_recipe:
          setup:
            - "program P (capacity 480); service S with valid link; customer C; order A scheduled [09:00,17:00) 2026-10-05; order B unscheduled"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-18", name: "RM Program 18", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog18: $.data.id }
            - call: "POST /metrology/calibration-services"
              payload: { service_code: "DCV-5", measurand: "DC voltage", base_fee_cents: 20000, per_point_fee_cents: 1500, standard_turnaround_days: 5 }
              as: ProgramAdmin
              captures: { svc18: $.data.id }
            - call: "POST /metrology/traceability-links"
              payload: { service_id: "${svc18}", standard_description: "Std-18", calibrated_by_lab: "NIST-EE", calibrated_date: "2026-06-01T00:00:00Z", calibration_due_date: "2027-01-01T00:00:00Z", uncertainty_contribution: 0.1 }
              as: Metrologist
            - call: "POST /metrology/customers"
              payload: { name: "C18", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_18: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc18}", artifact_description: "artifact A", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_18}"
              captures: { o18a: $.data.id }
            - call: "POST /metrology/calibration-orders/${o18a}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T09:00:00Z", scheduled_end: "2026-10-05T17:00:00Z" }
              as: CalibrationCoordinator
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc18}", artifact_description: "artifact B", measurement_points: 1 }
              as: Customer
              as_user_id: "${c_18}"
              captures: { o18b: $.data.id }
            - call: "POST /metrology/calibration-orders/${o18b}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T17:00:00Z", scheduled_end: "2026-10-05T17:30:00Z" }
              as: CalibrationCoordinator
              captures: { o18b_err: $.data.error_id }
          trigger:
            - call: "POST /metrology/calibration-orders/${o18a}/transitions"
              payload: { to: CANCELLED }
              as: CalibrationCoordinator
            - call: "POST /metrology/calibration-orders/${o18b}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T17:00:00Z", scheduled_end: "2026-10-05T17:30:00Z" }
              as: CalibrationCoordinator
              captures: { o18b_status: $.data.status }
          assert:
            - "o18b_err == ERR_CAPACITY_EXCEEDED (480 + 30 > 480 before cancel)"
            - "o18b_status == SCHEDULED (cancel restored the day's capacity: conserved)"
