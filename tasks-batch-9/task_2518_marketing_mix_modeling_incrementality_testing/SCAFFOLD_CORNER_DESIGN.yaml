            - call: "POST /mmm/experiments/${exp1}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/experiments/${exp1}/read-out"
              payload: { treatment_conversions: 4704, control_conversions: 4900, pre_treatment_conversions: 4655, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "GET /mmm/model-runs/${run1}"
              as: Modeler
              as_user_id: "md-1"
              captures: { rv0: "$.data.version" }
          trigger:
            - call: "POST /mmm/calibration-records"
              payload: { model_run_id: "${run1}", channel_id: "${cha}", experiment_id: "${exp1}", expected_model_run_version: "${rv0}" }
              as: Modeler
              as_user_id: "md-1"
          assert:
            - "HTTP 422 with data.error_id == ERR_CALIBRATION_MULTIPLIER_OUT_OF_RANGE - not a 412 (the token was current) and not a clamped 201."
            - "GET /mmm/calibration-records?model_run_id=${run1} returns total_count == 0 - the record was not created."
            - "GET /mmm/model-runs/${run1} shows calibration_status == NOT_REQUIRED and version == ${rv0}, unchanged."
            - "GET /mmm/channel-contributions?model_run_id=${run1} still shows contribution_units 3653.3333 for A_SEARCH and baseline_sales_units 17332.3810 on the run - nothing was recalibrated."
            - "GET /mmm/markets/${mkt} still shows data_posture == OPEN: a rejected record leaves the posture inputs untouched."
      - name: fit_before_seal_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_DATA_WINDOW_NOT_SEALED (409) - validations priority 45, applies_to POST /mmm/model-runs/{id}/fit"
        excluded_because:
          difficulty_instance: model_run_fit_requires_sealed_data_window
          rationale: >-
            That instance triggers the id from all three non-SEALED postures (OPEN, REOPENED after a restatement, and OPEN again) and asserts the run keeps fit_status PENDING each time, which is the whole violation-to-error claim for this id.
      - name: optimize_under_frozen_posture_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_MARKET_POSTURE_BLOCKED (409) - validations priority 50, applies_to lock-design, publish and optimize"
        excluded_because:
          difficulty_instance: budget_scenario_optimize_requires_open_market_posture
          rationale: >-
            That instance drives the posture through OPEN, RESTRICTED and FROZEN on one market and shows the id firing only for FROZEN on optimize while RESTRICTED passes, which covers this error more sharply than a standalone trigger could.
      - name: budget_scenario_create_without_published_run_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_MODEL_RUN_NOT_PUBLISHED (409) - validations priority 45, applies_to POST /mmm/budget-scenarios, optimize and approve"
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_budget_scenario_create
          rationale: >-
            That instance triggers this id on scenario creation while the fiscal ceiling is ALSO violated, so it proves both the id and its precedence over priority 72 in a single call.
      - name: budget_scenario_over_annual_ceiling_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_BUDGET_CEILING_EXCEEDED (422) - validations priority 72, applies_to POST /mmm/budget-scenarios"
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_budget_scenario_create
          rationale: >-
            The same instance isolates the fiscal error by publishing the run first and re-sending the identical over-ceiling body, so the id is triggered there with the state gate satisfied.
      - name: lock_design_underpowered_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_EXPERIMENT_UNDERPOWERED (422) - validations priority 52, applies_to POST /mmm/experiments/{id}/lock-design"
        excluded_because:
          difficulty_instance: power_index_exact_boundary_on_lock_design
          rationale: >-
            That instance walks the power-index step table across the 0.80 floor - one arm below, one arm exactly at the boundary and one above - so it triggers the id and pins the boundary direction at the same time.
      - name: holdout_share_ceiling_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_HOLDOUT_SHARE_EXCEEDED (422) - validations priority 60, applies_to lock-design and assign-cells"
        excluded_because:
          difficulty_instance: holdout_share_exact_integer_ceiling_on_assign_cells
          rationale: >-
            That instance triggers the id at the exact integer ceiling on assign-cells and also at lock-design, with the aggregate across two live experiments, which subsumes a single-call trigger.
      - name: release_cells_beyond_redesign_limit_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_REDESIGN_LIMIT_REACHED (422) - validations priority 62, applies_to POST /mmm/experiments/{id}/release-cells"
        excluded_because:
          difficulty_instance: experiment_reject_redesign_cycle_bounded_by_max_redesigns
          rationale: >-
            That instance loops the reject / release / re-lock cycle to the MAX_EXPERIMENT_REDESIGNS bound and asserts the id on the loop iteration that exceeds it, which is the only way to reach this error at all.
      - name: lock_design_window_conflict_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_EXPERIMENT_WINDOW_CONFLICT (409) - validations priority 65, applies_to POST /mmm/experiments/{id}/lock-design"
        excluded_because:
          difficulty_instance: experiment_channel_window_half_open_with_incumbent_washout_buffer
          rationale: >-
            That instance triggers the id on the touching boundary inside the washout buffer and shows the adjacent non-conflicting case one day later, so both the error and its interval convention are covered there.
  - section: rbac
    note: >-
      Six roles, role_model segregation_of_duties. Five roles hold disjoint exclusive_operations and Auditor holds none at all; every role shares every GET under /mmm and only the five mutating roles share POST /_clock/set_current_utc. The identity is opaque, so the priority-22 segregation rule is decided on X-User-ID alone and is therefore independent of the priority-2 role check - both halves of that rule (experiment designer vs decider, scenario creator vs approver) are exercised below.
    instances:
      - name: each_role_performs_its_own_exclusive_operations
        claim_type: role_capability
        grounds:
          - "roles DataEngineer exclusive_operations - markets, media-channels, geo-cells, data-windows, seal, reopen, spend-observations, sales-observations"
          - "roles Modeler exclusive_operations - model-runs, fit, validate, recalibrate, calibration-records"
          - "roles ExperimentDesigner exclusive_operations - experiments, lock-design, assign-cells, start, read-out, release-cells, washout-sweep"
          - "roles AnalyticsLead exclusive_operations - publish, accept, reject, approve, reconciliation-reports"
          - "roles BrandPlanner exclusive_operations - budget-scenarios, budget-allocations, optimize, revert-optimization"
          - "roles Auditor shared_operations - every GET under /mmm, and nothing else"
        distinguishing_aspect: |
          The happy path is a five-role relay: no single role can carry a model from raw spend to an
          approved budget, and the system records WHICH user did each step in a different system field
          (fitted_by_user_id, published_by_user_id, designed_by_user_id, created_by_user_id,
          approved_by_user_id), so a permissive implementation that lets one role do everything is caught
          by the recorded attribution and not just by the status codes.
          
        test_recipe:
          setup:
            - "Fixture F1 up to the seal, all nine data-collection writes performed by DataEngineer de-1."
            - "The clock is at 2026-08-31T00:00:00Z, set by DataEngineer - a shared operation."
            - "No role has been used out of its lane in the setup."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
