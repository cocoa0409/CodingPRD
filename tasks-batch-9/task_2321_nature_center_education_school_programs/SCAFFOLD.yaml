scenario: "2321. Nature Center Education & School Programs (environmental education center): program catalog aligned to science standards by grade band with pre- and post-visit materials, field trip booking with group size limits, chaperone ratios and rain plan alternatives, naturalist staffing and seasonal educator hiring with training on curriculum and live animal handling, live animal ambassador care with permits, handling protocols and public contact rules, trail and habitat management for program use with safety and resource protection, scholarship and transportation subsidy programs for under-resourced schools, outreach programs delivered at schools with equipment transport, program evaluation, teacher feedback and funder outcome reporting"
domain_name: "nature-center-education"
api_prefix: "/nature-center"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "beyond Expert — 14 entities, 56 endpoints, 52 error codes, 12 state machines (one with two parallel dimensions), 10 calculations with two dual-variant pairs, 39 priority-ordered validations"

entities:
  - name: SchoolPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "School name as printed on the booking confirmation"
      - name: district_code
        type: string
        source: input
        description: "Local education agency code used on funder outcome reports"
      - name: title_i_pct
        type: number
        source: input
        description: "Share of enrolled students qualifying for Title I support, 0.00-1.00; drives equity_tier"
        constraints: "0 <= title_i_pct <= 1"
      - name: distance_miles
        type: number
        source: input
        description: "One-way road distance from the nature center, used for transportation subsidy and outreach travel fees"
        constraints: "0 < distance_miles <= 400"
      - name: contact_email
        type: string
        source: input
        description: "Teacher contact address; optional"
      - name: status
        type: enum
        source: computed
        description: "Standing of the partnership; derived from no_show_strikes by calculations.school_standing"
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: equity_tier
        type: enum
        source: computed
        description: "Aid eligibility tier derived from title_i_pct by calculations.aid_award_allocation thresholds"
        constraints: "TIER_1 | TIER_2 | TIER_3 | NONE"
      - name: no_show_strikes
        type: integer
        source: computed
        description: "Count of Booking rows for this school whose delivery_status is NO_SHOW"
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of Booking.net_due_cents - Booking.paid_cents over this school's Bookings whose funding_status IN {INVOICED}"
        default: 0

  - name: ProgramOffering
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Catalog title of the program"
      - name: grade_band
        type: enum
        source: input
        description: "Science-standards grade band this program is written for"
        constraints: "K_2 | G3_5 | G6_8 | G9_12"
      - name: delivery_mode
        type: enum
        source: input
        description: "Where the program is delivered"
        constraints: "ONSITE_FIELD_TRIP | OUTREACH_AT_SCHOOL | VIRTUAL"
      - name: duration_minutes
        type: integer
        source: input
        description: "Scheduled contact duration; feeds educator weekly load and animal exposure projections"
        constraints: "30 <= duration_minutes <= 480"
      - name: max_group_size
        type: integer
        source: input
        description: "Maximum students + chaperones the program can host"
        constraints: "1 <= max_group_size <= 500"
      - name: min_chaperone_ratio_students_per_adult
        type: integer
        source: input
        description: "Students per adult chaperone required; required_chaperones = ceil(student_count / this)"
        constraints: "1 <= min_chaperone_ratio_students_per_adult <= 30"
      - name: base_fee_cents_per_student
        type: integer
        source: input
        description: "List price per student before volume discount, in cents"
        constraints: "0 <= base_fee_cents_per_student <= 100000"
      - name: requires_live_animal
        type: boolean
        source: input
        description: "When true a Booking must have animal_id set before confirm"
        default: false
      - name: requires_trail_segment
        type: boolean
        source: input
        description: "When true a Booking must have trail_segment_id set before confirm"
        default: false
      - name: public_contact_required
        type: boolean
        source: input
        description: "When true the program includes supervised touch of the animal ambassador"
        default: false
      - name: rain_alternate_for_offering_id
        type: string
        source: input
        description: "FK -> ProgramOffering.id; self-referential — when set, this offering is a declared rain-plan alternate for the named offering"
      - name: status
        type: enum
        source: computed
        description: "Catalog lifecycle state"
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | PUBLISHED | RETIRED"
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CurriculumSpecialist who created the offering; used by the segregation-of-duties review check"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who last decided the review"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of completed REQUEST_REVISION decisions on this offering"
        default: 0
      - name: standard_alignment_count
        type: integer
        source: computed
        description: "Count of StandardAlignment rows whose offering_id is this offering"
        default: 0
      - name: materials_ready
        type: boolean
        source: computed
        description: "True when this offering has at least one CurriculumMaterial with phase PRE_VISIT and status PUBLISHED and at least one with phase POST_VISIT and status PUBLISHED"
        default: false
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into PUBLISHED"

  - name: StandardAlignment
    parent: ProgramOffering
    common_fields: false
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> ProgramOffering.id; the offering this alignment claim belongs to"
      - name: standard_code
        type: string
        source: input
        description: "Science standard code, e.g. 3-LS4-3"
      - name: dimension
        type: enum
        source: input
        description: "Which dimension of the standard the program addresses"
        constraints: "DISCIPLINARY_CORE_IDEA | SCIENCE_PRACTICE | CROSSCUTTING_CONCEPT"
      - name: grade_band
        type: enum
        source: input
        description: "Grade band the cited standard belongs to; optional, defaults to the offering's grade_band"
        constraints: "K_2 | G3_5 | G6_8 | G9_12"

  - name: CurriculumMaterial
    parent: ProgramOffering
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> ProgramOffering.id; the offering this material supports"
      - name: phase
        type: enum
        source: input
        description: "Whether teachers use the material before or after the visit"
        constraints: "PRE_VISIT | POST_VISIT"
      - name: url_slug
        type: string
        source: input
        description: "Slug of the downloadable packet"
      - name: status
        type: enum
        source: computed
        description: "Publication state of the material"
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | ARCHIVED"

  - name: Educator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Educator name"
      - name: employment_type
        type: enum
        source: input
        description: "Staff naturalists carry a higher weekly delivery cap than seasonal educators"
        constraints: "STAFF_NATURALIST | SEASONAL_EDUCATOR"
      - name: season_end_date
        type: datetime
        source: input
        description: "Last instant a SEASONAL_EDUCATOR may be assigned to a Booking; optional for STAFF_NATURALIST"
      - name: status
        type: enum
        source: computed
        description: "Hiring pipeline state"
        default: APPLICANT
        constraints: "APPLICANT | ONBOARDING | CLEARED | INACTIVE"
      - name: background_check_started_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into ONBOARDING"
      - name: curriculum_certified_grade_bands
        type: array
        source: computed
        description: "Grade bands for which this educator holds a TrainingRecord with track CURRICULUM and status ASSESSED_PASS"
        default: []
      - name: animal_handling_tier
        type: enum
        source: computed
        description: "Highest handling_tier from this educator's TrainingRecord rows with track LIVE_ANIMAL_HANDLING and status ASSESSED_PASS; NONE when there are none"
        default: NONE
        constraints: "NONE | TIER_1 | TIER_2"
      - name: delivery_load_minutes_this_week
        type: integer
        source: computed
        description: "Sum of ProgramOffering.duration_minutes over Bookings where lead_educator_id is this educator, delivery_status IN {REQUESTED, CONFIRMED, RAIN_DIVERTED, DELIVERED} and start_utc falls in the ISO week containing the logical clock"
        default: 0

  - name: TrainingRecord
    parent: Educator
    common_fields: true
    fields:
      - name: educator_id
        type: string
        source: input
        description: "FK -> Educator.id; the educator enrolled in this training"
      - name: track
        type: enum
        source: input
        description: "Training track"
        constraints: "CURRICULUM | LIVE_ANIMAL_HANDLING"
      - name: grade_band
        type: enum
        source: input
        description: "Grade band certified by a CURRICULUM track record; required for CURRICULUM, forbidden for LIVE_ANIMAL_HANDLING"
        constraints: "K_2 | G3_5 | G6_8 | G9_12"
      - name: handling_tier
        type: enum
        source: input
        description: "Tier certified by a LIVE_ANIMAL_HANDLING record; required for that track, forbidden for CURRICULUM"
        constraints: "TIER_1 | TIER_2"
      - name: status
        type: enum
        source: computed
        description: "Assessment state of this training record"
        default: ENROLLED
        constraints: "ENROLLED | ASSESSED_PASS | ASSESSED_FAIL | EXPIRED"
      - name: score
        type: integer
        source: input
        description: "Assessment score recorded at assessment time, 0-100"
        constraints: "0 <= score <= 100"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of assessments recorded against this record"
        default: 0
      - name: enrolled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who enrolled the educator; used by the segregation-of-duties assessment check"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who recorded the last assessment"
      - name: passed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into ASSESSED_PASS"
      - name: expires_on
        type: datetime
        source: computed
        description: "passed_at plus TRAINING_VALIDITY_DAYS; null until the record passes"

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: agency
        type: enum
        source: input
        description: "Issuing wildlife agency"
        constraints: "USFWS | STATE_DNR | USDA"
      - name: permit_number
        type: string
        source: input
        description: "Permit number as issued"
      - name: valid_from
        type: datetime
        source: input
        description: "First instant the permit authorizes exhibition"
      - name: valid_to
        type: datetime
        source: input
        description: "Last instant the permit authorizes exhibition; must be after valid_from"
      - name: status
        type: enum
        source: computed
        description: "Permit standing; gates every animal ambassador it covers"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | LAPSED | REVOKED"

  - name: AnimalAmbassador
    parent: Permit
    common_fields: true
    fields:
      - name: common_name
        type: string
        source: input
        description: "Program name of the animal, e.g. Eastern Screech Owl"
      - name: species_code
        type: string
        source: input
        description: "Species code recorded on the permit"
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit authorizing this animal's program use"
      - name: handling_tier_required
        type: enum
        source: input
        description: "Minimum Educator.animal_handling_tier needed to lead a program with this animal"
        constraints: "TIER_1 | TIER_2"
      - name: contact_rule
        type: enum
        source: input
        description: "Baseline public-contact protocol for this animal"
        constraints: "NO_PUBLIC_CONTACT | VIEW_ONLY | SUPERVISED_TOUCH"
      - name: weekly_exposure_cap_minutes
        type: integer
        source: input
        description: "Welfare ceiling on program contact minutes per ISO week"
        constraints: "0 < weekly_exposure_cap_minutes <= 1200"
      - name: status
        type: enum
        source: computed
        description: "Care status of the animal"
        default: AVAILABLE
        constraints: "AVAILABLE | RESTING | VET_HOLD | RETIRED"
      - name: projected_exposure_minutes_7d
        type: integer
        source: computed
        description: "Forward-looking exposure: sum of ProgramOffering.duration_minutes over Bookings referencing this animal with delivery_status IN {CONFIRMED, RAIN_DIVERTED} in the ISO week containing the logical clock"
        default: 0
      - name: realized_exposure_minutes_7d
        type: integer
        source: computed
        description: "Retrospective exposure: sum of Booking.actual_contact_minutes over Bookings referencing this animal with delivery_status DELIVERED in the ISO week containing the logical clock"
        default: 0
      - name: welfare_posture
        type: enum
        source: computed
        description: "Gate derived by calculations.animal_exposure_and_welfare_posture from projected exposure, permit status and care status"
        default: OPEN
        constraints: "OPEN | RESTRICTED | BLOCKED"
      - name: effective_contact_rule
        type: enum
        source: computed
        description: "contact_rule downgraded by welfare_posture; RESTRICTED downgrades SUPERVISED_TOUCH to VIEW_ONLY, BLOCKED forces NO_PUBLIC_CONTACT"
        constraints: "NO_PUBLIC_CONTACT | VIEW_ONLY | SUPERVISED_TOUCH"

  - name: TrailSegment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Trail segment name"
      - name: capacity_persons
        type: integer
        source: input
        description: "Maximum persons occupying the segment at any instant"
        constraints: "1 <= capacity_persons <= 400"
      - name: habitat_sensitivity
        type: enum
        source: input
        description: "Resource-protection classification of the habitat"
        constraints: "LOW | MODERATE | HIGH"
      - name: weekly_visitor_budget_persons
        type: integer
        source: input
        description: "Resource-protection ceiling on total persons routed onto the segment per ISO week"
        constraints: "1 <= weekly_visitor_budget_persons <= 5000"
      - name: recovery_buffer_minutes
        type: integer
        source: input
        description: "Trailing recovery window appended to each occupancy interval"
        default: 30
        constraints: "0 <= recovery_buffer_minutes <= 240"
      - name: status
        type: enum
        source: computed
        description: "Availability of the segment for program use"
        default: OPEN
        constraints: "OPEN | RESTORATION_REST | CLOSED"
      - name: visitors_this_week
        type: integer
        source: computed
        description: "Sum of (student_count + chaperone_count) over Bookings referencing this segment with delivery_status IN {CONFIRMED, RAIN_DIVERTED, DELIVERED} whose start_utc falls in the ISO week containing the logical clock"
        default: 0

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> SchoolPartner.id; the school visiting or hosting"
      - name: offering_id
        type: string
        source: input
        description: "FK -> ProgramOffering.id; the program booked"
      - name: trail_segment_id
        type: string
        source: input
        description: "FK -> TrailSegment.id; assigned trail segment, null until assign-resources"
      - name: lead_educator_id
        type: string
        source: input
        description: "FK -> Educator.id; assigned lead educator, null until assign-resources"
      - name: animal_id
        type: string
        source: input
        description: "FK -> AnimalAmbassador.id; assigned animal ambassador, null until assign-resources"
      - name: rain_diverted_to_offering_id
        type: string
        source: computed
        description: "FK -> ProgramOffering.id; alternate offering selected by the rain-plan selector policy, null unless delivery_status is RAIN_DIVERTED or DELIVERED after a divert"
      - name: start_utc
        type: datetime
        source: input
        description: "Scheduled program start instant"
      - name: end_utc
        type: datetime
        source: input
        description: "Scheduled program end instant; must be after start_utc"
      - name: student_count
        type: integer
        source: input
        description: "Planned student headcount"
        constraints: "1 <= student_count <= 500"
      - name: chaperone_count
        type: integer
        source: input
        description: "Planned adult chaperone headcount"
        constraints: "0 <= chaperone_count <= 200"
      - name: required_chaperones
        type: integer
        source: computed
        description: "ceil(student_count / ProgramOffering.min_chaperone_ratio_students_per_adult) per calculations.chaperone_requirement"
        default: 0
      - name: actual_student_count
        type: integer
        source: input
        description: "Student headcount recorded at delivery"
      - name: actual_chaperone_count
        type: integer
        source: input
        description: "Chaperone headcount recorded at delivery"
      - name: actual_contact_minutes
        type: integer
        source: input
        description: "Minutes of animal contact recorded at delivery; drives realized exposure"
      - name: delivery_status
        type: enum
        source: computed
        description: "First parallel state dimension — operational lifecycle of the visit"
        default: REQUESTED
        constraints: "REQUESTED | CONFIRMED | RAIN_DIVERTED | DELIVERED | NO_SHOW | CANCELLED"
      - name: funding_status
        type: enum
        source: computed
        description: "Second parallel state dimension — money lifecycle of the visit, evolves independently of delivery_status"
        default: UNFUNDED
        constraints: "UNFUNDED | AID_PENDING | AID_APPROVED | INVOICED | SETTLED | WRITTEN_OFF"
      - name: provisional_gross_fee_cents
        type: integer
        source: computed
        description: "Provisional variant of calculations.booking_fee_assessment, computed from planned headcounts at creation"
        default: 0
      - name: final_gross_fee_cents
        type: integer
        source: computed
        description: "Final variant of calculations.booking_fee_assessment, computed from actual headcounts at delivery"
        default: 0
      - name: aid_amount_cents
        type: integer
        source: computed
        description: "Sum of awarded_scholarship_cents over this booking's AidApplication rows with status IN {APPROVED, PARTIALLY_APPROVED, DISBURSED}; the program-fee credit only, since transportation subsidy is paid to the carrier and never reduces what the school owes"
        default: 0
      - name: transport_subsidy_cents
        type: integer
        source: computed
        description: "Sum of awarded_transport_cents over this booking's AidApplication rows with status IN {APPROVED, PARTIALLY_APPROVED, DISBURSED}; paid to the carrier, excluded from net_due_cents"
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: "max(0, final_gross_fee_cents - aid_amount_cents) once delivered, otherwise max(0, provisional_gross_fee_cents - aid_amount_cents)"
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of amounts recorded through POST /nature-center/bookings/{id}/record-payment"
        default: 0
      - name: resource_release_reason
        type: enum
        source: computed
        description: "Why assigned resources were released back, null when none were released"
        constraints: "PERMIT_LAPSE | SCHOOL_SUSPENSION | CANCELLED_BY_SCHOOL | NO_SHOW"

  - name: ScholarshipFund
    parent: null
    common_fields: true
    fields:
      - name: funder_name
        type: string
        source: input
        description: "Funder underwriting the scholarship and transportation subsidy pool"
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year the pool belongs to"
        constraints: "2020 <= fiscal_year <= 2100"
      - name: total_cents
        type: integer
        source: input
        description: "Total pool size in cents"
        constraints: "0 < total_cents <= 100000000"
      - name: transport_sublimit_pct
        type: number
        source: input
        description: "Share of total_cents that may be spent on transportation subsidy"
        default: 0.25
        constraints: "0 <= transport_sublimit_pct <= 1"
      - name: pending_cents
        type: integer
        source: computed
        description: "Sum of requested_scholarship_cents + requested_transport_cents over this fund's AidApplication rows with status SUBMITTED"
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of awarded_scholarship_cents + awarded_transport_cents over this fund's AidApplication rows with status IN {APPROVED, PARTIALLY_APPROVED}"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Sum of awarded_scholarship_cents + awarded_transport_cents over this fund's AidApplication rows with status DISBURSED"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "total_cents - pending_cents - committed_cents - disbursed_cents"
        default: 0
      - name: transport_awarded_cents
        type: integer
        source: computed
        description: "Sum of awarded_transport_cents over this fund's AidApplication rows with status IN {APPROVED, PARTIALLY_APPROVED, DISBURSED}"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Whether the pool accepts new applications"
        default: OPEN
        constraints: "OPEN | FROZEN | CLOSED"

  - name: AidApplication
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking the aid would fund"
      - name: fund_id
        type: string
        source: input
        description: "FK -> ScholarshipFund.id; the pool applied against"
      - name: requested_scholarship_cents
        type: integer
        source: input
        description: "Program-fee subsidy requested, in cents"
        constraints: "0 <= requested_scholarship_cents <= 10000000"
      - name: requested_transport_cents
        type: integer
        source: input
        description: "Transportation subsidy requested, in cents"
        constraints: "0 <= requested_transport_cents <= 10000000"
      - name: awarded_scholarship_cents
        type: integer
        source: computed
        description: "Program-fee subsidy granted by calculations.aid_award_allocation"
        default: 0
      - name: awarded_transport_cents
        type: integer
        source: computed
        description: "Transportation subsidy granted by calculations.aid_award_allocation"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Review state of the application"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | PARTIALLY_APPROVED | DISBURSED | DENIED | REVOKED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who submitted the application"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the GrantsOfficer who decided the application"
      - name: decision_note
        type: string
        source: input
        description: "Reviewer note recorded with the decision"

  - name: EquipmentManifest
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the outreach booking whose kit is being transported"
      - name: kit_codes
        type: array
        source: input
        description: "Kit codes loaded for the outreach program"
      - name: total_weight_kg
        type: number
        source: input
        description: "Total kit weight in kilograms; drives vehicle_class"
        constraints: "0 < total_weight_kg <= 4000"
      - name: vehicle_class
        type: enum
        source: computed
        description: "Vehicle required per calculations.manifest_vehicle_class"
        constraints: "VAN | BOX_TRUCK"
      - name: status
        type: enum
        source: computed
        description: "Transport state of the manifest"
        default: DRAFT
        constraints: "DRAFT | LOADED | RETURNED | SHORTAGE_REPORTED"
      - name: shortage_kit_codes
        type: array
        source: input
        description: "Kit codes missing on return; recorded when the manifest is returned with a shortage"
        default: []

  - name: EvaluationReport
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the delivered booking being evaluated"
      - name: teacher_score_standards_alignment
        type: integer
        source: input
        description: "Teacher rating of standards alignment, 1-5"
        constraints: "1 <= teacher_score_standards_alignment <= 5"
      - name: teacher_score_logistics
        type: integer
        source: input
        description: "Teacher rating of logistics, 1-5"
        constraints: "1 <= teacher_score_logistics <= 5"
      - name: teacher_score_engagement
        type: integer
        source: input
        description: "Teacher rating of student engagement, 1-5"
        constraints: "1 <= teacher_score_engagement <= 5"
      - name: student_pre_score_avg
        type: number
        source: input
        description: "Class average on the pre-visit assessment, 0-20"
        constraints: "0 <= student_pre_score_avg <= 20"
      - name: student_post_score_avg
        type: number
        source: input
        description: "Class average on the post-visit assessment, 0-20"
        constraints: "0 <= student_post_score_avg <= 20"
      - name: teacher_comment
        type: string
        source: input
        description: "Free-text teacher feedback; optional"
      - name: learning_gain_index
        type: number
        source: computed
        description: "Composite outcome index from calculations.learning_gain_index, 0.00-1.00 at 2 decimals"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Review state of the evaluation"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED | ACCEPTED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who submitted the evaluation"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who accepted or returned the evaluation"

state_machines:
  - entity: SchoolPartner
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system, inside POST /nature-center/bookings/{id}/no-show — recomputed by calculations.school_standing"
        actor: system
        preconditions: ["no_show_strikes reaches SCHOOL_PROBATION_STRIKES (1) after the increment", "no_show_strikes < SCHOOL_SUSPENSION_STRIKES (2)"]
        side_effects: ["SchoolPartner.status = PROBATION", "SchoolPartner.updated_at refreshed"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "system, inside POST /nature-center/bookings/{id}/no-show — recomputed by calculations.school_standing"
        actor: system
        preconditions: ["no_show_strikes reaches SCHOOL_SUSPENSION_STRIKES (2) after the increment"]
        side_effects:
          - "SchoolPartner.status = SUSPENDED"
          - "cascade link 3: because the school is now SUSPENDED, every other Booking of this school with delivery_status REQUESTED transitions REQUESTED -> CANCELLED with resource_release_reason = SCHOOL_SUSPENSION"
        note: "Cascade B link 2 -> link 3; see Booking.REQUESTED_to_CANCELLED"

  - entity: ProgramOffering
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /nature-center/program-offerings/{id}/submit-for-review"
        actor: CurriculumSpecialist
        preconditions: ["standard_alignment_count >= 1", "status == DRAFT"]
        side_effects: ["ProgramOffering.status = UNDER_REVIEW"]
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /nature-center/program-offerings/{id}/submit-for-review"
        actor: CurriculumSpecialist
        preconditions: ["standard_alignment_count >= 1", "status == REVISION_REQUESTED"]
        side_effects: ["ProgramOffering.status = UNDER_REVIEW"]
        note: "Revision loop: REVISION_REQUESTED -> UNDER_REVIEW -> REVISION_REQUESTED is a cycle"
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /nature-center/program-offerings/{id}/review with decision PUBLISH"
        actor: EducationDirector
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != authored_by_user_id (segregation of duties)"
          - "standard_alignment_count >= 2"
          - "materials_ready == true"
        side_effects: ["ProgramOffering.status = PUBLISHED", "ProgramOffering.published_at = logical clock", "ProgramOffering.reviewed_by_user_id = X-User-ID"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /nature-center/program-offerings/{id}/review with decision REQUEST_REVISION"
        actor: EducationDirector
        preconditions: ["status == UNDER_REVIEW", "X-User-ID != authored_by_user_id (segregation of duties)"]
        side_effects:
          - "ProgramOffering.status = REVISION_REQUESTED"
          - "ProgramOffering.revision_round incremented by 1"
          - "ProgramOffering.reviewed_by_user_id = X-User-ID"
          - "every CurriculumMaterial with offering_id = this offering and status PUBLISHED transitions PUBLISHED -> DRAFT"
          - "ProgramOffering.materials_ready recomputed (becomes false once any material reverts)"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /nature-center/program-offerings/{id}/retire"
        actor: EducationDirector
        preconditions: ["status == PUBLISHED", "no Booking references this offering with delivery_status IN {REQUESTED, CONFIRMED, RAIN_DIVERTED}"]
        side_effects: ["ProgramOffering.status = RETIRED", "every CurriculumMaterial with offering_id = this offering and status IN {DRAFT, PUBLISHED} transitions to ARCHIVED"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /nature-center/program-offerings/{id}/retire"
        actor: EducationDirector
        preconditions: ["status == DRAFT"]
        side_effects: ["ProgramOffering.status = RETIRED", "every CurriculumMaterial with offering_id = this offering and status IN {DRAFT, PUBLISHED} transitions to ARCHIVED"]

  - entity: CurriculumMaterial
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /nature-center/curriculum-materials/{id}/publish"
        actor: CurriculumSpecialist
        preconditions: ["status == DRAFT", "parent ProgramOffering.status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, PUBLISHED}"]
        side_effects: ["CurriculumMaterial.status = PUBLISHED", "parent ProgramOffering.materials_ready recomputed"]
      - from: PUBLISHED
        to: DRAFT
        trigger: "system, inside POST /nature-center/program-offerings/{id}/review with decision REQUEST_REVISION"
        actor: system
        preconditions: ["status == PUBLISHED"]
        side_effects: ["CurriculumMaterial.status = DRAFT", "parent ProgramOffering.materials_ready recomputed to false"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "system, inside POST /nature-center/program-offerings/{id}/retire"
        actor: system
        preconditions: ["status == PUBLISHED"]
        side_effects: ["CurriculumMaterial.status = ARCHIVED", "parent ProgramOffering.materials_ready recomputed to false"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "system, inside POST /nature-center/program-offerings/{id}/retire"
        actor: system
        preconditions: ["status == DRAFT"]
        side_effects: ["CurriculumMaterial.status = ARCHIVED"]

  - entity: Educator
    initial_state: APPLICANT
    terminal_states: [INACTIVE]
    transitions:
      - from: APPLICANT
        to: ONBOARDING
        trigger: "POST /nature-center/educators/{id}/advance-hiring with action START_ONBOARDING"
        actor: EducationDirector
        preconditions: ["status == APPLICANT"]
        side_effects: ["Educator.status = ONBOARDING", "Educator.background_check_started_at = logical clock"]
      - from: ONBOARDING
        to: CLEARED
        trigger: "POST /nature-center/educators/{id}/advance-hiring with action CLEAR"
        actor: EducationDirector
        preconditions: ["status == ONBOARDING", "at least one TrainingRecord with educator_id = this educator, track CURRICULUM and status ASSESSED_PASS"]
        side_effects: ["Educator.status = CLEARED"]
      - from: CLEARED
        to: INACTIVE
        trigger: "POST /nature-center/educators/{id}/advance-hiring with action DEACTIVATE"
        actor: EducationDirector
        preconditions: ["status == CLEARED"]
        side_effects:
          - "Educator.status = INACTIVE"
          - "every Booking with lead_educator_id = this educator and delivery_status IN {REQUESTED, CONFIRMED} has lead_educator_id cleared; a CONFIRMED booking transitions CONFIRMED -> REQUESTED"
          - "Educator.delivery_load_minutes_this_week recomputed to 0"
      - from: ONBOARDING
        to: INACTIVE
        trigger: "POST /nature-center/educators/{id}/advance-hiring with action DEACTIVATE"
        actor: EducationDirector
        preconditions: ["status == ONBOARDING"]
        side_effects: ["Educator.status = INACTIVE"]

  - entity: TrainingRecord
    initial_state: ENROLLED
    terminal_states: [EXPIRED]
    transitions:
      - from: ENROLLED
        to: ASSESSED_PASS
        trigger: "POST /nature-center/training-records/{id}/assess with outcome PASS"
        actor: CurriculumSpecialist
        preconditions: ["status == ENROLLED", "X-User-ID != enrolled_by_user_id (segregation of duties)", "score >= 70"]
        side_effects:
          - "TrainingRecord.status = ASSESSED_PASS"
          - "TrainingRecord.attempt_count incremented by 1"
          - "TrainingRecord.passed_at = logical clock"
          - "TrainingRecord.expires_on = passed_at + TRAINING_VALIDITY_DAYS"
          - "Educator.curriculum_certified_grade_bands recomputed when track == CURRICULUM"
          - "Educator.animal_handling_tier recomputed when track == LIVE_ANIMAL_HANDLING"
      - from: ENROLLED
        to: ASSESSED_FAIL
        trigger: "POST /nature-center/training-records/{id}/assess with outcome FAIL"
        actor: CurriculumSpecialist
        preconditions: ["status == ENROLLED", "X-User-ID != enrolled_by_user_id (segregation of duties)"]
        side_effects: ["TrainingRecord.status = ASSESSED_FAIL", "TrainingRecord.attempt_count incremented by 1"]
      - from: ASSESSED_FAIL
        to: ENROLLED
        trigger: "POST /nature-center/training-records/{id}/reenroll"
        actor: EducationDirector
        preconditions: ["status == ASSESSED_FAIL", "attempt_count < 3"]
        side_effects: ["TrainingRecord.status = ENROLLED", "TrainingRecord.score cleared"]
        note: "Cycle ENROLLED -> ASSESSED_FAIL -> ENROLLED, bounded by attempt_count < 3"
      - from: ASSESSED_PASS
        to: EXPIRED
        trigger: "system, lazily evaluated inside POST /nature-center/bookings/{id}/assign-resources"
        actor: system
        preconditions: ["status == ASSESSED_PASS", "logical clock >= expires_on"]
        side_effects:
          - "TrainingRecord.status = EXPIRED"
          - "Educator.curriculum_certified_grade_bands recomputed (band dropped) when track == CURRICULUM"
          - "Educator.animal_handling_tier recomputed (downgraded) when track == LIVE_ANIMAL_HANDLING"

  - entity: Permit
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /nature-center/permits/{id}/set-status with status SUSPENDED"
        actor: StewardshipManager
        preconditions: ["status == ACTIVE"]
        side_effects: ["Permit.status = SUSPENDED", "every AnimalAmbassador with permit_id = this permit recomputes welfare_posture to BLOCKED and effective_contact_rule to NO_PUBLIC_CONTACT"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /nature-center/permits/{id}/set-status with status ACTIVE"
        actor: StewardshipManager
        preconditions: ["status == SUSPENDED"]
        side_effects: ["Permit.status = ACTIVE", "every AnimalAmbassador with permit_id = this permit recomputes welfare_posture and effective_contact_rule"]
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /nature-center/permits/{id}/set-status with status LAPSED"
        actor: StewardshipManager
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "Permit.status = LAPSED"
          - "cascade link 2: every AnimalAmbassador with permit_id = this permit recomputes welfare_posture to BLOCKED and effective_contact_rule to NO_PUBLIC_CONTACT"
        note: "Cascade A link 1 -> link 2; link 3 fires from AnimalAmbassador's BLOCKED posture, see AnimalAmbassador transitions"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /nature-center/permits/{id}/set-status with status ACTIVE"
        actor: StewardshipManager
        preconditions: ["status == LAPSED"]
        side_effects: ["Permit.status = ACTIVE", "every AnimalAmbassador with permit_id = this permit recomputes welfare_posture and effective_contact_rule"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /nature-center/permits/{id}/set-status with status REVOKED"
        actor: StewardshipManager
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "Permit.status = REVOKED"
          - "every AnimalAmbassador with permit_id = this permit transitions to RETIRED"
          - "every Booking with animal_id in those animals and delivery_status CONFIRMED transitions CONFIRMED -> REQUESTED with animal_id and trail_segment_id cleared and resource_release_reason = PERMIT_LAPSE"

  - entity: AnimalAmbassador
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESTING
        trigger: "POST /nature-center/animals/{id}/set-care-status with status RESTING"
        actor: StewardshipManager
        preconditions: ["status == AVAILABLE"]
        side_effects: ["AnimalAmbassador.status = RESTING", "welfare_posture and effective_contact_rule recomputed"]
      - from: RESTING
        to: AVAILABLE
        trigger: "POST /nature-center/animals/{id}/set-care-status with status AVAILABLE"
        actor: StewardshipManager
        preconditions: ["status == RESTING"]
        side_effects: ["AnimalAmbassador.status = AVAILABLE", "welfare_posture and effective_contact_rule recomputed"]
      - from: AVAILABLE
        to: VET_HOLD
        trigger: "POST /nature-center/animals/{id}/set-care-status with status VET_HOLD"
        actor: StewardshipManager
        preconditions: ["status == AVAILABLE"]
        side_effects:
          - "AnimalAmbassador.status = VET_HOLD"
          - "welfare_posture = BLOCKED and effective_contact_rule = NO_PUBLIC_CONTACT"
          - "every Booking with animal_id = this animal and delivery_status CONFIRMED transitions CONFIRMED -> REQUESTED with animal_id and trail_segment_id cleared and resource_release_reason = PERMIT_LAPSE"
      - from: VET_HOLD
        to: AVAILABLE
        trigger: "POST /nature-center/animals/{id}/set-care-status with status AVAILABLE"
        actor: StewardshipManager
        preconditions: ["status == VET_HOLD"]
        side_effects: ["AnimalAmbassador.status = AVAILABLE", "welfare_posture and effective_contact_rule recomputed"]
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /nature-center/animals/{id}/set-care-status with status RETIRED, or system inside a Permit ACTIVE -> REVOKED transition"
        actor: StewardshipManager
        preconditions: ["status IN {AVAILABLE, RESTING, VET_HOLD}"]
        side_effects: ["AnimalAmbassador.status = RETIRED", "welfare_posture = BLOCKED and effective_contact_rule = NO_PUBLIC_CONTACT"]
      - from: OPEN
        to: BLOCKED
        trigger: "system, welfare_posture recomputation inside a Permit ACTIVE -> LAPSED or ACTIVE -> SUSPENDED transition"
        actor: system
        preconditions: ["covering Permit.status != ACTIVE"]
        side_effects:
          - "AnimalAmbassador.welfare_posture = BLOCKED and effective_contact_rule = NO_PUBLIC_CONTACT"
          - "cascade link 3: because this animal's welfare_posture became BLOCKED, every Booking with animal_id = this animal and delivery_status CONFIRMED transitions CONFIRMED -> REQUESTED with animal_id and trail_segment_id cleared and resource_release_reason = PERMIT_LAPSE"
        note: "welfare_posture dimension, not the care-status dimension; Cascade A link 2 -> link 3"

  - entity: TrailSegment
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTORATION_REST
        trigger: "POST /nature-center/trail-segments/{id}/set-status with status RESTORATION_REST"
        actor: StewardshipManager
        preconditions: ["status == OPEN"]
        side_effects: ["TrailSegment.status = RESTORATION_REST"]
      - from: RESTORATION_REST
        to: OPEN
        trigger: "POST /nature-center/trail-segments/{id}/set-status with status OPEN"
        actor: StewardshipManager
        preconditions: ["status == RESTORATION_REST"]
        side_effects: ["TrailSegment.status = OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /nature-center/trail-segments/{id}/set-status with status CLOSED"
        actor: StewardshipManager
        preconditions: ["status == OPEN"]
        side_effects: ["TrailSegment.status = CLOSED", "every Booking with trail_segment_id = this segment and delivery_status CONFIRMED transitions CONFIRMED -> REQUESTED with trail_segment_id cleared and resource_release_reason = PERMIT_LAPSE", "TrailSegment.visitors_this_week recomputed"]
      - from: CLOSED
        to: OPEN
        trigger: "POST /nature-center/trail-segments/{id}/set-status with status OPEN"
        actor: StewardshipManager
        preconditions: ["status == CLOSED"]
        side_effects: ["TrailSegment.status = OPEN"]

  - entity: Booking
    dimension: delivery_status
    initial_state: REQUESTED
    terminal_states: [DELIVERED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /nature-center/bookings/{id}/confirm"
        actor: BookingCoordinator
        preconditions:
          - "delivery_status == REQUESTED"
          - "ProgramOffering.status == PUBLISHED"
          - "SchoolPartner.status != SUSPENDED"
          - "chaperone_count >= required_chaperones"
          - "when ProgramOffering.requires_trail_segment, trail_segment_id is set and TrailSegment.status == OPEN"
          - "when ProgramOffering.requires_live_animal, animal_id is set and AnimalAmbassador.status == AVAILABLE"
          - "lead_educator_id is set and Educator.status == CLEARED"
          - "animal welfare gate per calculations.animal_exposure_and_welfare_posture"
          - "public contact gate: when ProgramOffering.public_contact_required, AnimalAmbassador.effective_contact_rule == SUPERVISED_TOUCH"
          - "trail occupancy, trail weekly budget and educator weekly load gates per §1.4 priorities 34-36"
        side_effects:
          - "Booking.delivery_status = CONFIRMED"
          - "TrailSegment.visitors_this_week increased by student_count + chaperone_count when trail_segment_id is set"
          - "AnimalAmbassador.projected_exposure_minutes_7d increased by ProgramOffering.duration_minutes when animal_id is set"
          - "AnimalAmbassador.welfare_posture and effective_contact_rule recomputed"
      - from: CONFIRMED
        to: REQUESTED
        trigger: "system, inside a cascade that releases assigned resources (Permit lapse/suspension, AnimalAmbassador VET_HOLD/RETIRED, TrailSegment CLOSED, Educator DEACTIVATE)"
        actor: system
        preconditions: ["delivery_status == CONFIRMED"]
        side_effects:
          - "Booking.delivery_status = REQUESTED"
          - "Booking.animal_id and/or Booking.trail_segment_id and/or Booking.lead_educator_id cleared depending on which resource was withdrawn"
          - "Booking.resource_release_reason = PERMIT_LAPSE"
          - "cascade link 4: because the booking left CONFIRMED, TrailSegment.visitors_this_week is decreased by student_count + chaperone_count and AnimalAmbassador.projected_exposure_minutes_7d is decreased by ProgramOffering.duration_minutes"
        note: "Revert edge — makes the delivery dimension cyclic; Cascade A link 3 -> link 4"
      - from: CONFIRMED
        to: RAIN_DIVERTED
        trigger: "POST /nature-center/bookings/{id}/rain-divert"
        actor: BookingCoordinator
        preconditions: ["delivery_status == CONFIRMED", "the rain-plan selector policy yields a non-empty candidate pool when alternate_offering_id is omitted"]
        side_effects:
          - "Booking.delivery_status = RAIN_DIVERTED"
          - "Booking.rain_diverted_to_offering_id = the selected alternate offering"
          - "Booking.trail_segment_id cleared and TrailSegment.visitors_this_week decreased by student_count + chaperone_count"
          - "Booking.provisional_gross_fee_cents recomputed with RAIN_DIVERT_CREDIT_PCT applied"
          - "Booking.net_due_cents recomputed"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /nature-center/bookings/{id}/deliver"
        actor: BookingCoordinator
        preconditions: ["delivery_status == CONFIRMED", "actual_chaperone_count >= ceil(actual_student_count / ProgramOffering.min_chaperone_ratio_students_per_adult)"]
        side_effects:
          - "Booking.delivery_status = DELIVERED"
          - "Booking.final_gross_fee_cents computed by the final variant of calculations.booking_fee_assessment"
          - "Booking.net_due_cents recomputed from final_gross_fee_cents"
          - "Booking.funding_status advances to INVOICED"
          - "every AidApplication of this booking with status IN {APPROVED, PARTIALLY_APPROVED} transitions to DISBURSED"
          - "AnimalAmbassador.realized_exposure_minutes_7d increased by actual_contact_minutes and projected_exposure_minutes_7d decreased by ProgramOffering.duration_minutes when animal_id is set"
      - from: RAIN_DIVERTED
        to: DELIVERED
        trigger: "POST /nature-center/bookings/{id}/deliver"
        actor: BookingCoordinator
        preconditions: ["delivery_status == RAIN_DIVERTED", "actual_chaperone_count >= ceil(actual_student_count / ProgramOffering.min_chaperone_ratio_students_per_adult)"]
        side_effects:
          - "Booking.delivery_status = DELIVERED"
          - "Booking.final_gross_fee_cents computed by the final variant of calculations.booking_fee_assessment with RAIN_DIVERT_CREDIT_PCT applied"
          - "Booking.net_due_cents recomputed"
          - "Booking.funding_status advances to INVOICED"
          - "every AidApplication of this booking with status IN {APPROVED, PARTIALLY_APPROVED} transitions to DISBURSED"
        note: "Fork-join: CONFIRMED forks into {DELIVERED, RAIN_DIVERTED} and RAIN_DIVERTED rejoins at DELIVERED with a different fee side-effect set"
      - from: REQUESTED
        to: NO_SHOW
        trigger: "POST /nature-center/bookings/{id}/no-show"
        actor: BookingCoordinator
        preconditions: ["delivery_status IN {REQUESTED, CONFIRMED}"]
        side_effects:
          - "Booking.delivery_status = NO_SHOW"
          - "Booking.final_gross_fee_cents = NO_SHOW_FEE_CENTS"
          - "Booking.net_due_cents = NO_SHOW_FEE_CENTS"
          - "Booking.funding_status = WRITTEN_OFF"
          - "Booking.resource_release_reason = NO_SHOW"
          - "cascade link 2: SchoolPartner.no_show_strikes incremented and SchoolPartner.status recomputed by calculations.school_standing"
        note: "Cascade B link 1 -> link 2"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /nature-center/bookings/{id}/no-show"
        actor: BookingCoordinator
        preconditions: ["delivery_status == CONFIRMED"]
        side_effects:
          - "Booking.delivery_status = NO_SHOW"
          - "Booking.final_gross_fee_cents = NO_SHOW_FEE_CENTS"
          - "Booking.funding_status = WRITTEN_OFF"
          - "TrailSegment.visitors_this_week decreased by student_count + chaperone_count when trail_segment_id is set"
          - "AnimalAmbassador.projected_exposure_minutes_7d decreased by ProgramOffering.duration_minutes when animal_id is set"
          - "SchoolPartner.no_show_strikes incremented and SchoolPartner.status recomputed"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /nature-center/bookings/{id}/cancel, or system inside a SchoolPartner PROBATION -> SUSPENDED transition"
        actor: BookingCoordinator
        preconditions: ["delivery_status == REQUESTED"]
        side_effects:
          - "Booking.delivery_status = CANCELLED"
          - "Booking.resource_release_reason = CANCELLED_BY_SCHOOL, or SCHOOL_SUSPENSION when driven by the suspension cascade"
          - "cascade link 4: because the booking is now CANCELLED, every AidApplication of this booking with status IN {APPROVED, PARTIALLY_APPROVED} transitions to REVOKED and ScholarshipFund.committed_cents and available_cents are recomputed"
          - "Booking.aid_amount_cents and net_due_cents recomputed to 0"
        note: "Cascade B link 3 -> link 4"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /nature-center/bookings/{id}/cancel"
        actor: BookingCoordinator
        preconditions: ["delivery_status == CONFIRMED"]
        side_effects:
          - "Booking.delivery_status = CANCELLED"
          - "Booking.resource_release_reason = CANCELLED_BY_SCHOOL"
          - "TrailSegment.visitors_this_week decreased by student_count + chaperone_count when trail_segment_id is set"
          - "AnimalAmbassador.projected_exposure_minutes_7d decreased by ProgramOffering.duration_minutes when animal_id is set"
          - "every AidApplication of this booking with status IN {APPROVED, PARTIALLY_APPROVED} transitions to REVOKED and ScholarshipFund.committed_cents and available_cents are recomputed"

  - entity: Booking
    dimension: funding_status
    initial_state: UNFUNDED
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: UNFUNDED
        to: AID_PENDING
        trigger: "POST /nature-center/aid-applications"
        actor: TeacherContact
        preconditions: ["funding_status == UNFUNDED", "delivery_status IN {REQUESTED, CONFIRMED}"]
        side_effects: ["Booking.funding_status = AID_PENDING", "ScholarshipFund.pending_cents and available_cents recomputed", "increments ScholarshipFund.version by 1"]
      - from: AID_PENDING
        to: AID_APPROVED
        trigger: "POST /nature-center/aid-applications/{id}/review with decision APPROVE"
        actor: GrantsOfficer
        preconditions: ["funding_status == AID_PENDING", "AidApplication.status == SUBMITTED"]
        side_effects: ["Booking.funding_status = AID_APPROVED", "Booking.aid_amount_cents recomputed", "Booking.net_due_cents recomputed", "ScholarshipFund.pending_cents, committed_cents, transport_awarded_cents and available_cents recomputed"]
      - from: AID_PENDING
        to: UNFUNDED
        trigger: "POST /nature-center/aid-applications/{id}/review with decision DENY"
        actor: GrantsOfficer
        preconditions: ["funding_status == AID_PENDING", "AidApplication.status == SUBMITTED"]
        side_effects: ["Booking.funding_status = UNFUNDED", "ScholarshipFund.pending_cents and available_cents recomputed"]
      - from: AID_APPROVED
        to: UNFUNDED
        trigger: "system, inside a Booking delivery_status transition to CANCELLED that revokes the awarded AidApplication"
        actor: system
        preconditions: ["funding_status == AID_APPROVED"]
        side_effects: ["Booking.funding_status = UNFUNDED", "Booking.aid_amount_cents = 0", "ScholarshipFund.committed_cents and available_cents recomputed"]
      - from: UNFUNDED
        to: INVOICED
        trigger: "system, inside POST /nature-center/bookings/{id}/deliver"
        actor: system
        preconditions: ["funding_status == UNFUNDED"]
        side_effects: ["Booking.funding_status = INVOICED", "Booking.net_due_cents = final_gross_fee_cents", "SchoolPartner.outstanding_balance_cents recomputed"]
      - from: AID_APPROVED
        to: INVOICED
        trigger: "system, inside POST /nature-center/bookings/{id}/deliver"
        actor: system
        preconditions: ["funding_status == AID_APPROVED"]
        side_effects: ["Booking.funding_status = INVOICED", "every AidApplication of this booking with status IN {APPROVED, PARTIALLY_APPROVED} transitions to DISBURSED", "ScholarshipFund.committed_cents decreased and disbursed_cents increased by the awarded totals", "SchoolPartner.outstanding_balance_cents recomputed"]
      - from: INVOICED
        to: SETTLED
        trigger: "POST /nature-center/bookings/{id}/record-payment"
        actor: BookingCoordinator
        preconditions: ["funding_status == INVOICED", "paid_cents after the payment >= net_due_cents"]
        side_effects: ["Booking.funding_status = SETTLED", "Booking.paid_cents increased by amount_cents", "SchoolPartner.outstanding_balance_cents recomputed"]
      - from: UNFUNDED
        to: WRITTEN_OFF
        trigger: "system, inside POST /nature-center/bookings/{id}/no-show"
        actor: system
        preconditions: ["funding_status == UNFUNDED"]
        side_effects: ["Booking.funding_status = WRITTEN_OFF", "Booking.net_due_cents = NO_SHOW_FEE_CENTS"]
      - from: AID_APPROVED
        to: WRITTEN_OFF
        trigger: "system, inside POST /nature-center/bookings/{id}/no-show"
        actor: system
        preconditions: ["funding_status == AID_APPROVED"]
        side_effects: ["Booking.funding_status = WRITTEN_OFF", "every AidApplication of this booking with status IN {APPROVED, PARTIALLY_APPROVED} transitions to REVOKED", "ScholarshipFund.committed_cents and available_cents recomputed"]
        note: "The two Booking dimensions are independent: delivery_status may sit at CONFIRMED while funding_status walks UNFUNDED -> AID_PENDING -> AID_APPROVED, and no funding transition changes delivery_status"

  - entity: ScholarshipFund
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /nature-center/scholarship-funds/{id}/set-status with status FROZEN"
        actor: GrantsOfficer
        preconditions: ["status == OPEN"]
        side_effects: ["ScholarshipFund.status = FROZEN"]
      - from: FROZEN
        to: OPEN
        trigger: "POST /nature-center/scholarship-funds/{id}/set-status with status OPEN"
        actor: GrantsOfficer
        preconditions: ["status == FROZEN"]
        side_effects: ["ScholarshipFund.status = OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /nature-center/scholarship-funds/{id}/set-status with status CLOSED"
        actor: GrantsOfficer
        preconditions: ["status == OPEN", "pending_cents == 0"]
        side_effects: ["ScholarshipFund.status = CLOSED"]

  - entity: AidApplication
    initial_state: SUBMITTED
    terminal_states: [DISBURSED, DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /nature-center/aid-applications/{id}/review with decision APPROVE"
        actor: GrantsOfficer
        preconditions: ["status == SUBMITTED", "ScholarshipFund.status == OPEN", "calculations.aid_award_allocation awards the full requested amounts"]
        side_effects: ["AidApplication.status = APPROVED", "awarded_scholarship_cents and awarded_transport_cents set by calculations.aid_award_allocation", "reviewer_user_id = X-User-ID", "Booking.funding_status = AID_APPROVED", "ScholarshipFund counters recomputed"]
      - from: SUBMITTED
        to: PARTIALLY_APPROVED
        trigger: "POST /nature-center/aid-applications/{id}/review with decision APPROVE"
        actor: GrantsOfficer
        preconditions: ["status == SUBMITTED", "ScholarshipFund.status == OPEN", "calculations.aid_award_allocation awards less than the requested total but more than zero"]
        side_effects: ["AidApplication.status = PARTIALLY_APPROVED", "awarded amounts set by calculations.aid_award_allocation", "Booking.funding_status = AID_APPROVED", "ScholarshipFund counters recomputed"]
        note: "Branching: one trigger, two target states chosen by the award outcome"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /nature-center/aid-applications/{id}/review with decision DENY"
        actor: GrantsOfficer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["AidApplication.status = DENIED", "awarded amounts remain 0", "Booking.funding_status = UNFUNDED", "ScholarshipFund.pending_cents and available_cents recomputed"]
      - from: APPROVED
        to: DISBURSED
        trigger: "system, inside POST /nature-center/bookings/{id}/deliver"
        actor: system
        preconditions: ["status IN {APPROVED, PARTIALLY_APPROVED}", "Booking.delivery_status transitions to DELIVERED"]
        side_effects: ["AidApplication.status = DISBURSED", "ScholarshipFund.committed_cents decreased and disbursed_cents increased by the awarded totals"]
      - from: PARTIALLY_APPROVED
        to: DISBURSED
        trigger: "system, inside POST /nature-center/bookings/{id}/deliver"
        actor: system
        preconditions: ["status == PARTIALLY_APPROVED", "Booking.delivery_status transitions to DELIVERED"]
        side_effects: ["AidApplication.status = DISBURSED", "ScholarshipFund.committed_cents decreased and disbursed_cents increased by the awarded totals"]
      - from: APPROVED
        to: REVOKED
        trigger: "system, inside a Booking transition to CANCELLED or NO_SHOW"
        actor: system
        preconditions: ["status IN {APPROVED, PARTIALLY_APPROVED}"]
        side_effects: ["AidApplication.status = REVOKED", "awarded_scholarship_cents and awarded_transport_cents reset to 0", "ScholarshipFund.committed_cents, transport_awarded_cents and available_cents recomputed", "Booking.aid_amount_cents and net_due_cents recomputed"]
        note: "Compensation: reverses every ledger effect of the APPROVE transition with no drift"
      - from: PARTIALLY_APPROVED
        to: REVOKED
        trigger: "system, inside a Booking transition to CANCELLED or NO_SHOW"
        actor: system
        preconditions: ["status == PARTIALLY_APPROVED"]
        side_effects: ["AidApplication.status = REVOKED", "awarded amounts reset to 0", "ScholarshipFund counters recomputed", "Booking.aid_amount_cents and net_due_cents recomputed"]

  - entity: EquipmentManifest
    initial_state: DRAFT
    terminal_states: [RETURNED, SHORTAGE_REPORTED]
    transitions:
      - from: DRAFT
        to: LOADED
        trigger: "POST /nature-center/equipment-manifests/{id}/advance with action LOAD"
        actor: BookingCoordinator
        preconditions: ["status == DRAFT", "Booking.delivery_status == CONFIRMED"]
        side_effects: ["EquipmentManifest.status = LOADED", "EquipmentManifest.vehicle_class computed by calculations.manifest_vehicle_class", "Booking.provisional_gross_fee_cents recomputed because the vehicle class changes the outreach travel fee"]
      - from: LOADED
        to: RETURNED
        trigger: "POST /nature-center/equipment-manifests/{id}/advance with action RETURN and no shortage_kit_codes"
        actor: BookingCoordinator
        preconditions: ["status == LOADED", "shortage_kit_codes omitted or empty"]
        side_effects: ["EquipmentManifest.status = RETURNED"]
      - from: LOADED
        to: SHORTAGE_REPORTED
        trigger: "POST /nature-center/equipment-manifests/{id}/advance with action RETURN and non-empty shortage_kit_codes"
        actor: BookingCoordinator
        preconditions: ["status == LOADED", "every code in shortage_kit_codes appears in kit_codes"]
        side_effects: ["EquipmentManifest.status = SHORTAGE_REPORTED", "EquipmentManifest.shortage_kit_codes recorded"]

  - entity: EvaluationReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /nature-center/evaluation-reports/{id}/submit"
        actor: TeacherContact
        preconditions: ["status == DRAFT", "Booking.delivery_status == DELIVERED"]
        side_effects: ["EvaluationReport.status = SUBMITTED", "EvaluationReport.learning_gain_index computed by calculations.learning_gain_index", "submitted_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /nature-center/evaluation-reports/{id}/review with decision RETURN"
        actor: EducationDirector
        preconditions: ["status == SUBMITTED"]
        side_effects: ["EvaluationReport.status = RETURNED", "reviewed_by_user_id = X-User-ID"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /nature-center/evaluation-reports/{id}/submit"
        actor: TeacherContact
        preconditions: ["status == RETURNED"]
        side_effects: ["EvaluationReport.status = SUBMITTED", "EvaluationReport.learning_gain_index recomputed"]
        note: "Cycle SUBMITTED -> RETURNED -> SUBMITTED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /nature-center/evaluation-reports/{id}/review with decision ACCEPT"
        actor: EducationDirector
        preconditions: ["status == SUBMITTED", "X-User-ID != submitted_by_user_id"]
        side_effects: ["EvaluationReport.status = ACCEPTED", "reviewed_by_user_id = X-User-ID", "the report becomes eligible for the funder outcome rollup at GET /nature-center/scholarship-funds/{id}/outcome-report"]

concurrency_rules:
  - rule_id: booking-assign-resources-stale
    parent_entity: Booking
    write_endpoint: "POST /nature-center/bookings/{id}/assign-resources"
    occ_field: "expected_booking_version"
    description: |
      Assigning an educator, trail segment or animal to a Booking whose version has
      advanced since the client last read it is rejected. A later assignment call
      legitimately supersedes an earlier one under the product rules — a coordinator
      may reassign a lead educator freely while the booking is still REQUESTED — so
      the operation cannot be rejected by any state precondition. OCC on
      Booking.version is what makes the stale view detectable: the client's
      expected_booking_version no longer matches the stored version.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: aid-application-create-stale-fund
    parent_entity: ScholarshipFund
    write_endpoint: "POST /nature-center/aid-applications"
    occ_field: "expected_fund_version"
    description: |
      Creating an AidApplication against a ScholarshipFund whose version has advanced
      since the client last read it is rejected. A second application against the same
      open fund is legitimate product behaviour, so no state precondition rejects it;
      what must be rejected is a submission computed against a stale view of the fund's
      pending_cents and available_cents, which OCC on ScholarshipFund.version detects.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

calculations:
  - name: chaperone_requirement
    trigger: "on POST /nature-center/bookings (create) and on POST /nature-center/bookings/{id}/deliver"
    algorithm: threshold
    formula: |
      required_chaperones = ceil(student_count / ProgramOffering.min_chaperone_ratio_students_per_adult)
      # at delivery the same expression is evaluated over actual_student_count and compared with actual_chaperone_count
    input_set: "The Booking's own student_count and the referenced ProgramOffering.min_chaperone_ratio_students_per_adult"
    constants: {}
    precision: "integer, ceiling"

  - name: booking_fee_assessment
    trigger: "provisional variant on POST /nature-center/bookings (create), on POST /nature-center/bookings/{id}/rain-divert and on POST /nature-center/equipment-manifests/{id}/advance with action LOAD; final variant on POST /nature-center/bookings/{id}/deliver"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER — steps run 1..6 in this exact sequence.
      # 1. headcount used for pricing
      billable_students = max(MIN_BILLABLE_STUDENTS, headcount)
      #    headcount = Booking.student_count           (provisional variant)
      #    headcount = Booking.actual_student_count    (final variant)
      # 2. volume discount tier selected from billable_students
      discount_pct = VOLUME_TIERS[billable_students]
      # 3. ROUNDING ORDER IS PINNED: round the per-student discounted price to whole
      #    cents FIRST, then multiply by billable_students. The alternative order
      #    (multiply first, round the product) is explicitly NOT used.
      per_student_cents = round_half_up(ProgramOffering.base_fee_cents_per_student * (1 - discount_pct))
      program_fee_cents = per_student_cents * billable_students
      # 4. travel fee applies only to outreach delivery
      if ProgramOffering.delivery_mode == OUTREACH_AT_SCHOOL:
          vehicle_multiplier = BOX_TRUCK_TRAVEL_MULTIPLIER
                               if an EquipmentManifest of this Booking with status IN {LOADED, RETURNED, SHORTAGE_REPORTED}
                                  has vehicle_class == BOX_TRUCK
                               else 1.0
          travel_fee_cents = round_half_up(TRAVEL_BASE_CENTS
                                           + TRAVEL_PER_MILE_CENTS * SchoolPartner.distance_miles * vehicle_multiplier)
      else:
          travel_fee_cents = 0
      # 5. gross before the rain credit
      gross_cents = program_fee_cents + travel_fee_cents
      # 6. rain credit applies when the booking was diverted to its rain alternate
      if Booking.rain_diverted_to_offering_id is not null:
          gross_cents = round_half_up(gross_cents * (1 - RAIN_DIVERT_CREDIT_PCT))
      result = gross_cents
    input_set: "The Booking itself, its ProgramOffering, its SchoolPartner, and its EquipmentManifest rows with status IN {LOADED, RETURNED, SHORTAGE_REPORTED}. EquipmentManifest rows with status DRAFT are excluded."
    constants:
      MIN_BILLABLE_STUDENTS: 10
      VOLUME_TIERS: "{1-14: 0.00, 15-29: 0.05, 30-59: 0.10, 60+: 0.15}"
      TRAVEL_BASE_CENTS: 4000
      TRAVEL_PER_MILE_CENTS: 175
      BOX_TRUCK_TRAVEL_MULTIPLIER: 2.0
      RAIN_DIVERT_CREDIT_PCT: 0.20
    precision: "whole cents, round_half_up, applied at step 3 (per student) and step 4 (travel) and step 6 (rain credit) only"
    variants:
      - name: provisional
        when: "Booking creation, rain divert and manifest LOAD — before the visit happens"
        difference: "headcount = Booking.student_count (planned); result stored in Booking.provisional_gross_fee_cents"
      - name: final
        when: "POST /nature-center/bookings/{id}/deliver — after the visit happens"
        difference: "headcount = Booking.actual_student_count (recorded on site), which can select a different VOLUME_TIERS band and therefore a different per_student_cents; result stored in Booking.final_gross_fee_cents"

  - name: aid_award_allocation
    trigger: "on POST /nature-center/aid-applications/{id}/review with decision APPROVE"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER — the contribution floor is applied BEFORE the
      # waterfall, and the scholarship bucket fills before the transport bucket.
      # 1. fee basis
      gross_cents = Booking.final_gross_fee_cents if Booking.delivery_status == DELIVERED
                    else Booking.provisional_gross_fee_cents
      # 2. equity tier of the school
      tier_cap_pct = TIER_CAP_PCT[SchoolPartner.equity_tier]
      # 3. the school always pays a floor contribution out of pocket
      contribution_floor_cents = MIN_SCHOOL_CONTRIBUTION_CENTS_PER_STUDENT * Booking.student_count
      # 4. scholarship ceiling — three-way min
      max_scholarship_cents = min(AidApplication.requested_scholarship_cents,
                                  round_half_up(gross_cents * tier_cap_pct),
                                  max(0, gross_cents - contribution_floor_cents))
      # 5. transport entitlement on round-trip mileage
      transport_entitlement_cents = round_half_up(TRANSPORT_PER_MILE_CENTS * SchoolPartner.distance_miles * 2)
      remaining_sublimit_cents = max(0, round_half_up(ScholarshipFund.total_cents * ScholarshipFund.transport_sublimit_pct)
                                        - ScholarshipFund.transport_awarded_cents)
      max_transport_cents = min(AidApplication.requested_transport_cents,
                                transport_entitlement_cents,
                                remaining_sublimit_cents)
      # 6. waterfall budget — this application's own SUBMITTED hold is released first
      budget_cents = ScholarshipFund.available_cents
                     + AidApplication.requested_scholarship_cents
                     + AidApplication.requested_transport_cents
      # 7. bucket 1: scholarship fills first
      awarded_scholarship_cents = min(max_scholarship_cents, budget_cents)
      budget_cents = budget_cents - awarded_scholarship_cents
      # 8. bucket 2: transport takes the remainder
      awarded_transport_cents = min(max_transport_cents, budget_cents)
      # 9. outcome status
      status = APPROVED if (awarded_scholarship_cents == AidApplication.requested_scholarship_cents
                            and awarded_transport_cents == AidApplication.requested_transport_cents)
               else PARTIALLY_APPROVED
      # zero total award is rejected by §1.4 priority 38 rather than stored
    input_set: "The AidApplication under review, its Booking, that Booking's SchoolPartner, and the ScholarshipFund's counters computed over its AidApplication rows (pending_cents from status SUBMITTED, committed_cents from status IN {APPROVED, PARTIALLY_APPROVED}, disbursed_cents from status DISBURSED)"
    constants:
      TIER_CAP_PCT: "{TIER_1: 1.00, TIER_2: 0.70, TIER_3: 0.40, NONE: 0.00}"
      EQUITY_TIER_1_MIN_TITLE_I_PCT: 0.75
      EQUITY_TIER_2_MIN_TITLE_I_PCT: 0.50
      EQUITY_TIER_3_MIN_TITLE_I_PCT: 0.25
      MIN_SCHOOL_CONTRIBUTION_CENTS_PER_STUDENT: 150
      TRANSPORT_PER_MILE_CENTS: 260
    precision: "whole cents, round_half_up at steps 4, 5 and 6 only"
    variants: []
    note: |
      SchoolPartner.equity_tier is derived from title_i_pct with the same constants:
      TIER_1 when title_i_pct >= 0.75, TIER_2 when >= 0.50, TIER_3 when >= 0.25, NONE otherwise.

  - name: animal_exposure_and_welfare_posture
    trigger: "on POST /nature-center/bookings/{id}/confirm, /cancel, /no-show, /deliver, on POST /nature-center/animals/{id}/set-care-status, and on every Permit set-status transition"
    algorithm: forward_looking
    formula: |
      iso_week = the Monday 00:00:00Z through the following Monday 00:00:00Z half-open
                 window [week_start, week_start + 7 days) containing the logical clock
      # projected variant (forward-looking)
      projected_exposure_minutes_7d = sum(ProgramOffering.duration_minutes)
        over Bookings where animal_id == this animal
             and delivery_status IN {CONFIRMED, RAIN_DIVERTED}
             and start_utc in iso_week
      # realized variant (retrospective)
      realized_exposure_minutes_7d = sum(Booking.actual_contact_minutes)
        over Bookings where animal_id == this animal
             and delivery_status == DELIVERED
             and start_utc in iso_week
      # posture is derived from the PROJECTED variant, never the realized one
      if Permit.status != ACTIVE or AnimalAmbassador.status IN {VET_HOLD, RETIRED}:
          welfare_posture = BLOCKED
      elif projected_exposure_minutes_7d >= weekly_exposure_cap_minutes:
          welfare_posture = BLOCKED
      elif projected_exposure_minutes_7d >= round_half_up(weekly_exposure_cap_minutes * WELFARE_RESTRICTED_PCT):
          welfare_posture = RESTRICTED
      else:
          welfare_posture = OPEN
      effective_contact_rule =
          NO_PUBLIC_CONTACT                                     if welfare_posture == BLOCKED
          VIEW_ONLY                                             if welfare_posture == RESTRICTED and contact_rule == SUPERVISED_TOUCH
          contact_rule                                          otherwise
      # confirm-time gate (§1.4 priority 22) uses >= , not >
      confirm_rejected if projected_exposure_minutes_7d + ProgramOffering.duration_minutes
                          >= weekly_exposure_cap_minutes
    input_set: "Bookings referencing this animal whose start_utc falls in the ISO week containing the logical clock; delivery_status IN {CONFIRMED, RAIN_DIVERTED} for the projected variant, DELIVERED for the realized variant. REQUESTED, NO_SHOW and CANCELLED bookings are excluded from both."
    constants:
      WELFARE_RESTRICTED_PCT: 0.60
    precision: "integer minutes; round_half_up on the RESTRICTED threshold product"
    variants:
      - name: projected
        when: "welfare gating and the confirm-time cap check"
        difference: "sums scheduled ProgramOffering.duration_minutes over not-yet-delivered bookings; stored in projected_exposure_minutes_7d"
      - name: realized
        when: "welfare reporting after delivery"
        difference: "sums Booking.actual_contact_minutes over DELIVERED bookings only, which diverges from projected whenever on-site contact ran shorter or longer than the scheduled duration; stored in realized_exposure_minutes_7d and never used to gate confirm"

  - name: trail_utilization_and_occupancy
    trigger: "on POST /nature-center/bookings/{id}/confirm, and recomputed on rain-divert, cancel, no-show and TrailSegment OPEN -> CLOSED"
    algorithm: interval_merge
    formula: |
      # occupancy interval is HALF-OPEN with a TRAILING recovery buffer only
      occupancy(b) = [ b.start_utc , b.end_utc + TrailSegment.recovery_buffer_minutes )
      persons(b)   = b.student_count + b.chaperone_count
      # (a) instantaneous aggregate capacity
      overlapping = { b' : b'.trail_segment_id == candidate.trail_segment_id
                           and b'.delivery_status IN {CONFIRMED, RAIN_DIVERTED, DELIVERED}
                           and occupancy(b') intersects occupancy(candidate) }
      concurrent_persons = persons(candidate) + sum(persons(b') for b' in overlapping)
      capacity_violated  = concurrent_persons > TrailSegment.capacity_persons
      # (b) weekly resource-protection budget over the ISO week of the logical clock
      visitors_this_week = sum(persons(b')) over Bookings on this segment with
                           delivery_status IN {CONFIRMED, RAIN_DIVERTED, DELIVERED}
                           and start_utc in iso_week
      budget_violated    = visitors_this_week + persons(candidate) > TrailSegment.weekly_visitor_budget_persons
      # (c) habitat protection ceiling per single booking
      habitat_violated   = TrailSegment.habitat_sensitivity == HIGH
                           and persons(candidate) > HIGH_SENSITIVITY_MAX_PERSONS
    input_set: "Bookings on the same TrailSegment with delivery_status IN {CONFIRMED, RAIN_DIVERTED, DELIVERED}. REQUESTED, CANCELLED and NO_SHOW bookings occupy nothing."
    constants:
      HIGH_SENSITIVITY_MAX_PERSONS: 25
    precision: "integer persons; interval arithmetic at whole-minute resolution"
    note: "Because the interval is half-open, a booking starting exactly at another booking's end_utc + recovery_buffer_minutes does NOT overlap it."

  - name: educator_conflict_and_weekly_load
    trigger: "on POST /nature-center/bookings/{id}/assign-resources and on POST /nature-center/bookings/{id}/confirm"
    algorithm: interval_merge
    formula: |
      # blocked interval is CLOSED and SYMMETRIC — travel buffer on BOTH sides
      buffer(b) = EDUCATOR_TRAVEL_BUFFER_ONSITE_MINUTES
                  if b.ProgramOffering.delivery_mode IN {ONSITE_FIELD_TRIP, VIRTUAL}
                  else EDUCATOR_TRAVEL_BUFFER_OUTREACH_MINUTES
      blocked(b) = [ b.start_utc - buffer(b) , b.end_utc + buffer(b) ]
      conflict = exists b' with b'.lead_educator_id == candidate_educator
                 and b'.id != candidate.id
                 and b'.delivery_status IN {REQUESTED, CONFIRMED, RAIN_DIVERTED, DELIVERED}
                 and blocked(b') intersects blocked(candidate)      # closed intervals: touching endpoints DO intersect
      # weekly load, strict greater-than
      cap = EDUCATOR_WEEKLY_CAP_MINUTES[Educator.employment_type]
      load_violated = Educator.delivery_load_minutes_this_week + ProgramOffering.duration_minutes > cap
    input_set: "Bookings whose lead_educator_id is the candidate educator and delivery_status IN {REQUESTED, CONFIRMED, RAIN_DIVERTED, DELIVERED}; the weekly load restricts that same set to bookings whose start_utc falls in the ISO week containing the logical clock. CANCELLED and NO_SHOW bookings are excluded."
    constants:
      EDUCATOR_TRAVEL_BUFFER_ONSITE_MINUTES: 45
      EDUCATOR_TRAVEL_BUFFER_OUTREACH_MINUTES: 60
      EDUCATOR_WEEKLY_CAP_MINUTES: "{SEASONAL_EDUCATOR: 360, STAFF_NATURALIST: 600}"
      TRAINING_VALIDITY_DAYS: 365
    precision: "integer minutes; interval arithmetic at whole-minute resolution"
    note: "Contrast with trail_utilization_and_occupancy: the educator interval is closed and buffered on both sides (touching endpoints collide) while the trail interval is half-open and buffered only on the trailing side (touching endpoints do not collide), and the trail additionally aggregates persons across all overlappers instead of rejecting on the first overlap."

  - name: learning_gain_index
    trigger: "on POST /nature-center/evaluation-reports/{id}/submit (both the first submit and every resubmit after RETURNED)"
    algorithm: weighted_scoring
    formula: |
      # PINNED EVALUATION ORDER 1..5
      # 1. normalized student gain against the headroom left below the maximum score
      if MAX_ASSESSMENT_SCORE - student_pre_score_avg <= 0:
          normalized_gain = 0
      else:
          normalized_gain = (student_post_score_avg - student_pre_score_avg)
                            / (MAX_ASSESSMENT_SCORE - student_pre_score_avg)
      normalized_gain = clamp(normalized_gain, 0, 1)
      # 2. teacher composite, weights sum to 1.00, normalized by the 1-5 scale
      teacher_composite = (TEACHER_WEIGHT_STANDARDS * teacher_score_standards_alignment
                           + TEACHER_WEIGHT_ENGAGEMENT * teacher_score_engagement
                           + TEACHER_WEIGHT_LOGISTICS * teacher_score_logistics) / 5
      # 3. delivery fidelity factor
      fidelity = FIDELITY_FULL      if Booking.delivery_status == DELIVERED and Booking.rain_diverted_to_offering_id is null
                 FIDELITY_DIVERTED  if Booking.delivery_status == DELIVERED and Booking.rain_diverted_to_offering_id is not null
                 FIDELITY_NONE      otherwise
      # 4. thin-alignment penalty keyed on the offering's standards coverage
      alignment_factor = THIN_ALIGNMENT_PENALTY if ProgramOffering.standard_alignment_count < THIN_ALIGNMENT_THRESHOLD
                         else 1.00
      # 5. combine, clamp, then round
      learning_gain_index = round_half_up(clamp((GAIN_WEIGHT * normalized_gain
                                                 + TEACHER_WEIGHT * teacher_composite)
                                                * fidelity * alignment_factor, 0, 1), 2)
    input_set: "The EvaluationReport's own teacher and student scores, its Booking's delivery_status and rain_diverted_to_offering_id, and the Booking's ProgramOffering.standard_alignment_count as it stands at submit time"
    constants:
      MAX_ASSESSMENT_SCORE: 20
      TEACHER_WEIGHT_STANDARDS: 0.50
      TEACHER_WEIGHT_ENGAGEMENT: 0.30
      TEACHER_WEIGHT_LOGISTICS: 0.20
      GAIN_WEIGHT: 0.60
      TEACHER_WEIGHT: 0.40
      FIDELITY_FULL: 1.00
      FIDELITY_DIVERTED: 0.80
      FIDELITY_NONE: 0.00
      THIN_ALIGNMENT_PENALTY: 0.90
      THIN_ALIGNMENT_THRESHOLD: 3
    precision: "2 decimal places, round_half_up, applied once at step 5 after clamping"
    variants: []

  - name: funder_outcome_rollup
    trigger: "on GET /nature-center/scholarship-funds/{id}/outcome-report"
    algorithm: aggregation
    formula: |
      reports = EvaluationReport rows with status == ACCEPTED whose Booking has
                delivery_status == DELIVERED and at least one AidApplication with
                fund_id == this fund and status == DISBURSED
      awarded_application_count = count of AidApplication rows with fund_id == this fund
                                  and status IN {APPROVED, PARTIALLY_APPROVED, DISBURSED}
      students_served_count = sum(Booking.actual_student_count) over the Bookings of `reports`
      if students_served_count == 0:
          weighted_learning_gain_index = 0.000
      else:
          weighted_learning_gain_index = round_half_up(
              sum(report.learning_gain_index * report.Booking.actual_student_count for report in reports)
              / students_served_count, 3)
      if students_served_count == 0:
          tier_1_student_share_pct = 0.000
      else:
          tier_1_student_share_pct = round_half_up(
              sum(Booking.actual_student_count for report in reports
                  where report.Booking.SchoolPartner.equity_tier == TIER_1)
              / students_served_count, 3)
    input_set: "EvaluationReport rows with status ACCEPTED only; DRAFT, SUBMITTED and RETURNED reports are excluded. Bookings enter only through a DISBURSED AidApplication on this fund, so APPROVED-but-not-yet-delivered aid contributes to awarded_application_count but not to the index."
    constants: {}
    precision: "3 decimal places, round_half_up; 0.000 when the student denominator is zero"
    variants: []

  - name: school_standing
    trigger: "on POST /nature-center/bookings/{id}/no-show"
    algorithm: threshold
    formula: |
      no_show_strikes = count of Bookings with school_id == this school and delivery_status == NO_SHOW
      status = SUSPENDED if no_show_strikes >= SCHOOL_SUSPENSION_STRIKES
               PROBATION if no_show_strikes >= SCHOOL_PROBATION_STRIKES
               ACTIVE    otherwise
    input_set: "Bookings of this school with delivery_status == NO_SHOW; all other statuses are excluded"
    constants:
      SCHOOL_PROBATION_STRIKES: 1
      SCHOOL_SUSPENSION_STRIKES: 2
      NO_SHOW_FEE_CENTS: 7500
    precision: "integer counts"
    variants: []

  - name: manifest_vehicle_class
    trigger: "on POST /nature-center/equipment-manifests/{id}/advance with action LOAD"
    algorithm: threshold
    formula: |
      vehicle_class = BOX_TRUCK if total_weight_kg > VEHICLE_CLASS_WEIGHT_THRESHOLD_KG else VAN
    input_set: "The EquipmentManifest's own total_weight_kg"
    constants:
      VEHICLE_CLASS_WEIGHT_THRESHOLD_KG: 250
    precision: "exact comparison, strictly greater-than"
    variants: []

selector_policies:
  - name: rain_plan_alternate_selector
    used_by: "POST /nature-center/bookings/{id}/rain-divert when alternate_offering_id is omitted"
    eligibility_filter: |
      ProgramOffering rows where
        rain_alternate_for_offering_id == Booking.offering_id
        AND status == PUBLISHED
        AND grade_band == the original ProgramOffering.grade_band
        AND requires_trail_segment == false
        AND max_group_size >= Booking.student_count + Booking.chaperone_count
    ranking_expression: "standard_alignment_count DESC, then base_fee_cents_per_student ASC"
    tie_break: "created_at ASC"
    empty_pool_fallback: "ERR_NO_RAIN_ALTERNATE (409); the booking stays CONFIRMED and nothing is mutated"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role names a role declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: every required field present, types correct, enum values inside the declared set, numbers inside the declared range, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: business_temporal
    check: "Interval fields are ordered: Booking.end_utc > Booking.start_utc and Permit.valid_to > Permit.valid_from"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /nature-center/bookings, POST /nature-center/permits"
  - priority: 6
    category: existence
    check: "Every id in the request path exists, validated left to right; the first missing id determines the error (ERR_OFFERING_NOT_FOUND, ERR_MATERIAL_NOT_FOUND, ERR_SCHOOL_NOT_FOUND, ERR_EDUCATOR_NOT_FOUND, ERR_TRAINING_RECORD_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_ANIMAL_NOT_FOUND, ERR_TRAIL_SEGMENT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_FUND_NOT_FOUND, ERR_AID_APPLICATION_NOT_FOUND, ERR_MANIFEST_NOT_FOUND, ERR_EVALUATION_REPORT_NOT_FOUND)"
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 7
    category: existence
    check: "Every foreign key in the request body references an existing row, validated in the order the fields are listed in the endpoint's input (school_id, offering_id, then trail_segment_id, lead_educator_id, animal_id, then fund_id, booking_id)"
    error_id: ERR_SCHOOL_NOT_FOUND
    http_status: 404
    applies_to: "POST /nature-center/bookings, POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/animals, POST /nature-center/aid-applications, POST /nature-center/program-offerings"
  - priority: 8
    category: auth
    check: "When X-User-Role is TeacherContact, X-User-ID equals the SchoolPartner.id the target resource belongs to (Booking.school_id, or the Booking behind an AidApplication or EvaluationReport)"
    error_id: ERR_SCHOOL_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /nature-center/bookings, POST /nature-center/bookings/{id}/cancel, POST /nature-center/bookings/{id}/evaluation-reports, POST /nature-center/evaluation-reports/{id}/submit, POST /nature-center/aid-applications, GET /nature-center/bookings/{id}, GET /nature-center/bookings/{id}/evaluation-reports, GET /nature-center/aid-applications/{id}, GET /nature-center/program-offerings, GET /nature-center/program-offerings/{id}, GET /nature-center/program-offerings/{id}/materials"
  - priority: 9
    category: auth
    check: "When X-User-Role is Naturalist, X-User-ID equals Booking.lead_educator_id of the target booking (or the Educator.id in the path)"
    error_id: ERR_NOT_ASSIGNED_EDUCATOR
    http_status: 403
    applies_to: "POST /nature-center/bookings/{id}/deliver, GET /nature-center/bookings/{id}, GET /nature-center/educators/{id}, GET /nature-center/educators/{id}/training-records, GET /nature-center/animals, GET /nature-center/animals/{id}"
  - priority: 10
    category: auth
    check: "Segregation of duties on catalog review: X-User-ID != ProgramOffering.authored_by_user_id"
    error_id: ERR_SOD_REVIEW_SAME_ACTOR
    http_status: 403
    applies_to: "POST /nature-center/program-offerings/{id}/review"
  - priority: 11
    category: auth
    check: "Segregation of duties on training assessment: X-User-ID != TrainingRecord.enrolled_by_user_id"
    error_id: ERR_SOD_ASSESS_SAME_ACTOR
    http_status: 403
    applies_to: "POST /nature-center/training-records/{id}/assess"
  - priority: 12
    category: auth
    check: "Segregation of duties on evaluation acceptance: X-User-ID != EvaluationReport.submitted_by_user_id"
    error_id: ERR_SOD_EVALUATION_SAME_ACTOR
    http_status: 403
    applies_to: "POST /nature-center/evaluation-reports/{id}/review"
  - priority: 13
    category: business_constraint
    check: "Track-dependent fields agree with the track: grade_band required and handling_tier absent when track == CURRICULUM; handling_tier required and grade_band absent when track == LIVE_ANIMAL_HANDLING; score required when outcome == PASS"
    error_id: ERR_TRACK_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /nature-center/educators/{id}/training-records, POST /nature-center/training-records/{id}/assess"
  - priority: 14
    category: state
    check: "The target resource's own current state permits the requested transition per §1.2 (ERR_INVALID_OFFERING_STATE, ERR_INVALID_MATERIAL_STATE, ERR_INVALID_EDUCATOR_STATE, ERR_INVALID_TRAINING_STATE, ERR_INVALID_PERMIT_STATE, ERR_INVALID_ANIMAL_STATE, ERR_INVALID_TRAIL_STATE, ERR_INVALID_BOOKING_STATE, ERR_INVALID_FUNDING_STATE, ERR_INVALID_AID_STATE, ERR_INVALID_MANIFEST_STATE, ERR_INVALID_EVALUATION_STATE, ERR_INVALID_FUND_STATE)"
    error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    applies_to: "every POST that drives a §1.2 transition"
  - priority: 15
    category: state
    check: "OCC: expected_booking_version equals Booking.version; expected_fund_version equals ScholarshipFund.version"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/aid-applications"
  - priority: 16
    category: state
    check: "The referenced ProgramOffering.status == PUBLISHED"
    error_id: ERR_OFFERING_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /nature-center/bookings, POST /nature-center/bookings/{id}/confirm"
  - priority: 17
    category: state
    check: "The referenced SchoolPartner.status != SUSPENDED"
    error_id: ERR_SCHOOL_SUSPENDED
    http_status: 409
    applies_to: "POST /nature-center/bookings, POST /nature-center/bookings/{id}/confirm"
  - priority: 18
    category: state
    check: "The referenced ScholarshipFund.status == OPEN"
    error_id: ERR_FUND_NOT_OPEN
    http_status: 409
    applies_to: "POST /nature-center/aid-applications, POST /nature-center/aid-applications/{id}/review"
  - priority: 19
    category: state
    check: "The Permit covering the referenced AnimalAmbassador has status == ACTIVE"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/bookings/{id}/confirm"
  - priority: 20
    category: state
    check: "The referenced AnimalAmbassador.status == AVAILABLE"
    error_id: ERR_ANIMAL_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/bookings/{id}/confirm"
  - priority: 21
    category: state
    check: "The referenced TrailSegment.status == OPEN"
    error_id: ERR_TRAIL_NOT_OPEN
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/bookings/{id}/confirm"
  - priority: 22
    category: business_safety
    check: "The referenced Educator.status == CLEARED"
    error_id: ERR_EDUCATOR_NOT_CLEARED
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/bookings/{id}/confirm"
  - priority: 23
    category: business_safety
    check: "The referenced Educator.curriculum_certified_grade_bands contains the ProgramOffering.grade_band of the booking, evaluated after lazy TrainingRecord expiry"
    error_id: ERR_EDUCATOR_NOT_CERTIFIED_FOR_GRADE_BAND
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/bookings/{id}/confirm"
  - priority: 24
    category: business_safety
    check: "Educator.animal_handling_tier is at least AnimalAmbassador.handling_tier_required (ordering NONE < TIER_1 < TIER_2) when both an educator and an animal are assigned"
    error_id: ERR_HANDLING_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/bookings/{id}/confirm"
  - priority: 25
    category: business_safety
    check: "When TrailSegment.habitat_sensitivity == HIGH, student_count + chaperone_count <= HIGH_SENSITIVITY_MAX_PERSONS (25)"
    error_id: ERR_HABITAT_SENSITIVITY_LIMIT
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/assign-resources, POST /nature-center/bookings/{id}/confirm"
  - priority: 26
    category: business_safety
    check: "chaperone_count >= required_chaperones at confirm; actual_chaperone_count >= ceil(actual_student_count / min_chaperone_ratio_students_per_adult) at deliver"
    error_id: ERR_CHAPERONE_RATIO_UNMET
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/confirm, POST /nature-center/bookings/{id}/deliver"
  - priority: 27
    category: business_safety
    check: "AnimalAmbassador.projected_exposure_minutes_7d + ProgramOffering.duration_minutes < weekly_exposure_cap_minutes (rejected at exactly the cap)"
    error_id: ERR_ANIMAL_WELFARE_CAP_REACHED
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/confirm"
  - priority: 28
    category: business_safety
    check: "When ProgramOffering.public_contact_required, AnimalAmbassador.effective_contact_rule == SUPERVISED_TOUCH"
    error_id: ERR_PUBLIC_CONTACT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/confirm"
  - priority: 29
    category: business_temporal
    check: "Booking.start_utc > the logical clock at creation"
    error_id: ERR_BOOKING_START_IN_PAST
    http_status: 409
    applies_to: "POST /nature-center/bookings"
  - priority: 30
    category: business_temporal
    check: "When Educator.employment_type == SEASONAL_EDUCATOR, Booking.end_utc <= Educator.season_end_date"
    error_id: ERR_EDUCATOR_SEASON_ENDED
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/assign-resources"
  - priority: 31
    category: business_temporal
    check: "The candidate booking's closed buffered interval does not intersect the closed buffered interval of any other booking led by the same educator per calculations.educator_conflict_and_weekly_load"
    error_id: ERR_EDUCATOR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/assign-resources"
  - priority: 32
    category: business_temporal
    check: "The candidate booking's [start_utc, end_utc) window does not intersect the [start_utc, end_utc) window of another booking with delivery_status IN {CONFIRMED, RAIN_DIVERTED, DELIVERED} referencing the same AnimalAmbassador"
    error_id: ERR_ANIMAL_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/assign-resources"
  - priority: 33
    category: business_referential
    check: "No existing StandardAlignment for this offering has the same (standard_code, dimension) pair"
    error_id: ERR_DUPLICATE_STANDARD_ALIGNMENT
    http_status: 422
    applies_to: "POST /nature-center/program-offerings/{id}/standard-alignments"
  - priority: 34
    category: business_referential
    check: "standard_alignment_count >= 1 to submit for review; standard_alignment_count >= 2 to publish"
    error_id: ERR_INSUFFICIENT_STANDARD_ALIGNMENT
    http_status: 422
    applies_to: "POST /nature-center/program-offerings/{id}/submit-for-review, POST /nature-center/program-offerings/{id}/review"
  - priority: 35
    category: business_referential
    check: "materials_ready == true to publish (a PUBLISHED PRE_VISIT material and a PUBLISHED POST_VISIT material both exist)"
    error_id: ERR_MATERIALS_NOT_READY
    http_status: 422
    applies_to: "POST /nature-center/program-offerings/{id}/review"
  - priority: 36
    category: business_referential
    check: "lead_educator_id is set; trail_segment_id is set when ProgramOffering.requires_trail_segment; animal_id is set when ProgramOffering.requires_live_animal"
    error_id: ERR_REQUIRED_RESOURCE_MISSING
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/confirm"
  - priority: 37
    category: business_referential
    check: "An explicitly supplied alternate_offering_id satisfies the rain_plan_alternate_selector eligibility filter"
    error_id: ERR_RAIN_ALTERNATE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/rain-divert"
  - priority: 38
    category: business_referential
    check: "When alternate_offering_id is omitted, the rain_plan_alternate_selector candidate pool is non-empty"
    error_id: ERR_NO_RAIN_ALTERNATE
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/rain-divert"
  - priority: 39
    category: business_referential
    check: "The booking has no AidApplication with status IN {SUBMITTED, APPROVED, PARTIALLY_APPROVED, DISBURSED}"
    error_id: ERR_DUPLICATE_AID_APPLICATION
    http_status: 409
    applies_to: "POST /nature-center/aid-applications"
  - priority: 40
    category: business_referential
    check: "The booking has no EvaluationReport with status IN {DRAFT, SUBMITTED, RETURNED, ACCEPTED}"
    error_id: ERR_DUPLICATE_EVALUATION
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/evaluation-reports"
  - priority: 41
    category: business_referential
    check: "Every code in shortage_kit_codes appears in EquipmentManifest.kit_codes"
    error_id: ERR_SHORTAGE_CODE_UNKNOWN
    http_status: 422
    applies_to: "POST /nature-center/equipment-manifests/{id}/advance"
  - priority: 42
    category: business_referential
    check: "No Booking references the offering with delivery_status IN {REQUESTED, CONFIRMED, RAIN_DIVERTED}"
    error_id: ERR_OFFERING_HAS_ACTIVE_BOOKINGS
    http_status: 409
    applies_to: "POST /nature-center/program-offerings/{id}/retire"
  - priority: 43
    category: business_referential
    check: "ScholarshipFund.pending_cents == 0 when closing the fund"
    error_id: ERR_FUND_HAS_PENDING_APPLICATIONS
    http_status: 409
    applies_to: "POST /nature-center/scholarship-funds/{id}/set-status"
  - priority: 44
    category: business_referential
    check: "TrainingRecord.attempt_count < 3 when re-enrolling"
    error_id: ERR_TRAINING_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /nature-center/training-records/{id}/reenroll"
  - priority: 45
    category: business_constraint
    check: "student_count + chaperone_count <= ProgramOffering.max_group_size"
    error_id: ERR_GROUP_SIZE_EXCEEDED
    http_status: 409
    applies_to: "POST /nature-center/bookings, POST /nature-center/bookings/{id}/confirm"
  - priority: 46
    category: business_constraint
    check: "Aggregate concurrent persons over the half-open trail occupancy interval <= TrailSegment.capacity_persons per calculations.trail_utilization_and_occupancy"
    error_id: ERR_TRAIL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/confirm"
  - priority: 47
    category: business_constraint
    check: "TrailSegment.visitors_this_week + student_count + chaperone_count <= TrailSegment.weekly_visitor_budget_persons"
    error_id: ERR_TRAIL_WEEKLY_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/confirm"
  - priority: 48
    category: business_constraint
    check: "Educator.delivery_load_minutes_this_week + ProgramOffering.duration_minutes <= the educator's weekly cap (strictly greater-than rejects)"
    error_id: ERR_EDUCATOR_WEEKLY_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /nature-center/bookings/{id}/assign-resources"
  - priority: 49
    category: business_fiscal
    check: "SchoolPartner.equity_tier != NONE"
    error_id: ERR_NOT_AID_ELIGIBLE
    http_status: 422
    applies_to: "POST /nature-center/aid-applications"
  - priority: 50
    category: business_fiscal
    check: "At create: requested_scholarship_cents + requested_transport_cents <= ScholarshipFund.available_cents. At review with decision APPROVE: calculations.aid_award_allocation yields awarded_scholarship_cents + awarded_transport_cents > 0"
    error_id: ERR_FUND_INSUFFICIENT
    http_status: 402
    applies_to: "POST /nature-center/aid-applications, POST /nature-center/aid-applications/{id}/review"
  - priority: 51
    category: business_fiscal
    check: "requested_transport_cents > 0 requires a non-zero remaining transport sublimit: round_half_up(total_cents * transport_sublimit_pct) - transport_awarded_cents > 0"
    error_id: ERR_TRANSPORT_SUBLIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /nature-center/aid-applications, POST /nature-center/aid-applications/{id}/review"
  - priority: 52
    category: business_fiscal
    check: "amount_cents <= Booking.net_due_cents - Booking.paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /nature-center/bookings/{id}/record-payment"

endpoints:
  - method: POST
    path: "/nature-center/program-offerings"
    description: "Create a catalog program offering in DRAFT"
    roles: [CurriculumSpecialist]
    code: 201
    input: [title, grade_band, delivery_mode, duration_minutes, max_group_size, min_chaperone_ratio_students_per_adult, base_fee_cents_per_student, "requires_live_animal?", "requires_trail_segment?", "public_contact_required?", "rain_alternate_for_offering_id?"]
    output: ProgramOffering
    side_effects: ["ProgramOffering created with status DRAFT, revision_round 0, standard_alignment_count 0, materials_ready false", "authored_by_user_id = X-User-ID"]
  - method: GET
    path: "/nature-center/program-offerings"
    description: "List program offerings with filters and pagination"
