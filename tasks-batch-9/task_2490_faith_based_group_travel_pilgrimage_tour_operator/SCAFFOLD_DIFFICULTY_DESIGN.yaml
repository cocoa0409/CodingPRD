              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler X", date_of_birth: "1948-06-20", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_x_id: $.data.id }
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler Y", date_of_birth: "1948-06-20", room_type_requested: "DOUBLE" }
              as: ProgramManager
