            - call: "POST /land-bank/properties/${p_id}/list"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { custody_after: $.data.custody_status, listed_after: $.data.listed_at }
          assert:
            - "${custody_after} == LISTED and Property.${p_id}.custody_status == LISTED  # second entry into LISTED, reached from REVERTED"
            - "Property.${p_id}.listed_at == 2026-12-01T00:00:00Z  # re-stamped, not the first listing instant"
            - "Property.${p_id}.title_status == CLEAR and ${ta2_round} == 2 and ${ta1_round} == 1"
            - "Property.${p_id}.owner_of_record_applicant_id == null and Property.${p_id}.acquisition_channel == DONATION"
            - "DevelopmentAgreement.${ag_id}.status == REVERTED and DevelopmentAgreement.${ag_id}.cure_deadline == 2026-11-30T00:00:00Z"
            - "${cure_count} == 1 and ${reverted_count} == 1 and ${restored_sqft} == 8500"
            - "Applicant.${appl_id}.reverter_count == 1 and Applicant.${appl_id}.eligibility_status == BARRED"
            - "DispositionApplication.${app_id}.status == AWARDED  # terminal, untouched by the re-listing"

      - name: application_info_requested_and_suspended_title_cycles
        grounds:
          - state_machines.DispositionApplication.status
          - entities.DispositionApplication.fields.suspended_from_status
          - entities.DispositionApplication.fields.revision_round
          - state_machines.Property.title_status
        distinguishing_aspect: |
          A second, independent non-linear machine on a different entity: DispositionApplication
          traverses two distinct cycles in one fixture - the officer revision loop
          SUBMITTED -> INFO_REQUESTED -> SUBMITTED (revision_round 0 -> 1) and the title
          suspension loop SCREENED -> SUSPENDED_TITLE -> SCREENED, where the return edge is driven
          by another entity's transition (a title action CLEARED) and must restore exactly the
          status recorded in suspended_from_status rather than any fixed state.
        test_recipe:
          setup:
            - "The same 8500 sqft parcel is acquired, quiet-titled and LISTED."
            - "Applicant B's DEVELOPER_RFP application is submitted, returned for information, resubmitted (revision_round 1) and screened PASS, so it rests in SCREENED."
