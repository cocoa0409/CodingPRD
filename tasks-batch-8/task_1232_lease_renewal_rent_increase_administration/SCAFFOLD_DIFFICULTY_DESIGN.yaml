  # ---------------------------------------------------------------------------
  # Rule 9: compensating-action invariants over different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: countersign_then_rescind_restores_lease_economics
        grounds:
          - state_machines.RenewalDocument.COUNTERSIGNED_to_RESCINDED
          - state_machines.RenewalOffer.EXECUTED_to_VOIDED
          - entities.RenewalDocument.fields.prior_monthly_rent_cents
        distinguishing_aspect: |
          Conserved quantity: the lease's ECONOMIC TERMS. Formula over fields: after countersign
          then rescind within 3 days, (monthly_rent_cents, term_start_date, term_months,
          term_end_date) == (200000, 2026-06-01, 12, 2027-06-01) — exactly the pre-execution
          values, with zero drift in cents or dates.
        test_recipe:
          setup:
            - "Policy CA-OAK (unchanged through the test, so executed rent == proposed 203000); property band [12,12]; unit market 210000"
            - "Lease rent 200000, 2026-06-01 + 12mo; offer CONSERVATIVE proposed 203000 (150 bps, low tier, latest_issue 2027-04-02); issued, accepted, signed, countersigned at 2026-05-01 -> lease rent 203000, term 2027-06-01..2028-06-01, status ACTIVE"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Restore Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "1201", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
