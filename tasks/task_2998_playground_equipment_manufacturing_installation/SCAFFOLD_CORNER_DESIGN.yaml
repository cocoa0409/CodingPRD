            - call: "POST /playground/installation-jobs"
              payload: { order_id: "${order_id}", installer_id: "${inst_id}", scheduled_start_date: "2026-08-06", scheduled_end_date: "2026-08-08", crew_size: 4 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /playground/installers/${inst_id}/status"
              payload: { status: "SUSPENDED" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "GET /playground/installers/${inst_id}"
              payload: {}
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "POST /playground/installers/${inst_id}/status"
              payload: { status: "REVOKED" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "POST /playground/installers/${inst_id}/status"
              payload: { status: "ACTIVE" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { err_reinstate: $.data.error_id }
          assert:
            - "after the ADMINISTRATIVE suspension: CertifiedInstaller.${inst_id}.status == SUSPENDED, committed_crew_days == 12 and InstallationJob.${job_id}.status == SCHEDULED - an administrative suspension cancels nothing"
            - "after REVOKED: CertifiedInstaller.${inst_id}.status == REVOKED and committed_crew_days == 0"
            - "after REVOKED: InstallationJob.${job_id}.status == CANCELLED"
            - "the reinstatement attempt returns HTTP 409 with ${err_reinstate} == ERR_INSTALLER_INVALID_STATE (REVOKED is terminal)"
            - "InstallationJob.${job_id}.status is still CANCELLED after the rejected reinstatement - cancelled jobs are never resurrected"
            - "DesignProject.${proj_id}.design_status == ORDERED throughout (revoking an installer does not touch the project)"

      - name: design_project_revision_cycle_is_covered_by_the_difficulty_design
        claim_type: cyclic
        grounds:
          - state_machines.DesignProject.design_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The RENDERED -> COMMUNITY_REVIEW -> REVISION_REQUESTED -> RENDERED loop re-enters RENDERED with round_number 2 while the withdrawn round-1 rendering stays WITHDRAWN and revision_rounds reaches 1."
        excluded_because:
          difficulty_instance: design_project_revision_cycle_reenters_rendered
          rationale: "That non_linear_state_machine instance already drives the full loop and asserts the second rendering's round_number, the first rendering's WITHDRAWN status, revision_rounds == 1 and the expiry of the round-1 quote; a second recipe would duplicate it exactly."

      - name: installation_job_rework_cycle_is_covered_by_the_difficulty_design
        claim_type: cyclic
        grounds:
          - state_machines.InstallationJob.status
          - validations[priority=58]
        distinguishing_aspect: "The INSPECTION_PENDING -> INSPECTION_FAILED -> REWORK_IN_PROGRESS -> INSPECTION_PENDING loop increments rework_cycles per completed cycle and is bounded by MAX_REWORK_CYCLES == 2, after which rework START returns ERR_REWORK_LIMIT_EXCEEDED."
        excluded_because:
          difficulty_instance: installation_job_rework_cycle_returns_to_inspection_pending
          rationale: "That non_linear_state_machine instance already walks two full rework cycles, asserts rework_cycles after each COMPLETE, shows the conditional target selection via last_failed_inspection_kind, and drives the third START to ERR_REWORK_LIMIT_EXCEEDED."

      - name: standard_supersede_conditional_cascade_is_covered_by_the_difficulty_design
        claim_type: conditional_cascade
        grounds:
          - state_machines.PlaygroundStandard.transitions[ACTIVE->SUPERSEDED]
          - endpoints[POST /playground/standards/{id}/supersede]
        distinguishing_aspect: "Hop 3 reverts design_status only for projects in {RENDERED, COMMUNITY_REVIEW, CERTIFIED}, so a DESIGN_APPROVED project keeps its ISSUED rendering and its ISSUED quote while a CERTIFIED sibling loses both - the cascade is conditional on the child's state, not blanket."
        excluded_because:
          difficulty_instance: standard_supersede_cascades_to_decert_models_placements_project_and_quote
          rationale: "That transitive_cascade instance already runs the supersede with both a CERTIFIED and a DESIGN_APPROVED project in play and asserts, per project, which renderings are SUPERSEDED, which quotes are EXPIRED and which are left untouched."

