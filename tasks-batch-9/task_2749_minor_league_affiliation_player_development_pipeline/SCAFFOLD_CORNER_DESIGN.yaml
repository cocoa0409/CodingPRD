              as_user_id: "u-farm-1"
              captures: { pl_p: $.data.id }
            - call: "GET /players/${pl_p}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { pl_pv: $.data.version }
          trigger:
            - call: "GET /affiliates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pl_e_notfound: $.data.error_id }
            - call: "POST /medical-clearances/00000000-0000-4000-8000-000000000000/disposition"
              payload: { action: "ISSUE", cleared_workload_ceiling_index: 20.00, expires_on: "2026-12-31" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { pl_e_role: $.data.error_id }
            - call: "POST /assignments"
              payload: { player_id: "00000000-0000-4000-8000-000000000000", affiliate_id: "${pl_aff}", assignment_type: "SHORT_TERM", movement_reason: "INITIAL", effective_date: "2026-04-01", end_date: "2026-06-30", expected_player_version: "${pl_pv}" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { pl_e_shape: $.data.error_id }
            - call: "POST /assignments"
              payload: { player_id: "00000000-0000-4000-8000-000000000000", affiliate_id: "${pl_aff}", assignment_type: "LEVEL", movement_reason: "INITIAL", effective_date: "2026-04-01", end_date: "2026-06-30", expected_player_version: "${pl_pv}" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { pl_e_fk: $.data.error_id }
          assert:
            - "A request with X-User-Role omitted entirely returns 401 ERR_MISSING_AUTH_HEADERS even when the path id is also unknown (priority 1 before priority 10)"
            - "A request with X-User-Role 'GeneralManager' returns 401 ERR_INVALID_ROLE, again before any existence check (priority 2 before 10)"
            - "FarmDirector on POST /medical-clearances/{id}/disposition returns 403 ERR_ROLE_NOT_PERMITTED even though the clearance id does not exist (priority 3 before 10)"
            - "The body with assignment_type 'SHORT_TERM' and an unknown player_id returns 400 ERR_INVALID_REQUEST (priority 20 before 30)"
            - "Correcting only the enum, the same unknown player_id then returns 404 ERR_PLAYER_NOT_FOUND (priority 30 reached once the shape is valid)"

