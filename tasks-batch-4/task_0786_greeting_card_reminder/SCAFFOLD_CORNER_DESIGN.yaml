              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CONTACT_NOT_FOUND"
            - "HTTP status == 404"

  # ---------------- RBAC ----------------
  - section: rbac
    instances:
      - name: studio_operator_cannot_submit_order_returns_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.StudioOperator
          - roles.AccountHolder
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /orders/{id}/submit is AccountHolder-exclusive; a StudioOperator call returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Account with 1 credit, VERIFIED contact, card, draft order."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "rb1@x.com", display_name: "RB1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/credit-adjustments"
              payload: { delta: 1, reason: "MANUAL_ADJUST" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Rb", address_line1: "1 R", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CRB", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: StudioOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: account_holder_cannot_verify_address_returns_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.AccountHolder
          - roles.StudioOperator
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /contacts/{id}/verify-address is StudioOperator-exclusive; an AccountHolder call returns ERR_UNAUTHORIZED (403)."
        test_recipe:
