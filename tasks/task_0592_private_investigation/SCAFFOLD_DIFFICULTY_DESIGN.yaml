        distinguishing_aspect: |
          Depth-3 chain triggered by POST /expense-entries/{id}/decision (a different trigger from the
          close cascade): the approval appends a DRAW ledger entry (link 1), the resulting balance
          recompute itself suspends the Case (link 2), and the suspension itself denies every REQUESTED
          SkipTraceSearch with denial_reason RETAINER_SUSPENDED (link 3).
        test_recipe:
          setup:
            - "ACTIVE CA case whose only deposit is 100000 cents (low-water 25000)."
            - "LEAD-assigned CA-licensed investigator; one REQUESTED TLO skip-trace search; one SUBMITTED expense of 80000 cents."
