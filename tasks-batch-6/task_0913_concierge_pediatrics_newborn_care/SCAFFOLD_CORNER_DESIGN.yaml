  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_request_without_x_user_role_header_returns_unauthenticated
        claim_type: role denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Rung 1 fires before everything else: the SAME POST /peds/families body that succeeds with headers returns ERR_UNAUTHENTICATED 401 when the X-User-Role header is omitted entirely. The test must send the trigger request with NO X-User-Role header."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /peds/families"
              payload: { household_name: "Headerless", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "with the X-User-Role header omitted the response error_id == ERR_UNAUTHENTICATED and HTTP status == 401"
            - "with an X-User-Role value of Janitor, a role not in the RBAC matrix, the response is also ERR_UNAUTHENTICATED 401"
            - "no Family row is created in either case"
            - "the identical request carrying X-User-Role PracticeAdmin and an X-User-ID returns HTTP 201"

      - name: corner_parent_cannot_enroll_a_membership_returns_forbidden_role
        claim_type: role denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.Parent
          - endpoints.POST_/peds/memberships
        distinguishing_aspect: "Enrollment is exclusive to PracticeAdmin and CareCoordinator; a Parent acting on their own family is still refused with ERR_FORBIDDEN_ROLE 403 at rung 2, before the ownership rung at priority 19 is reached."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, one PLUS plan, one physician, one family, one child"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Yamada", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Haru", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
          trigger:
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_FORBIDDEN_ROLE"
            - "the response HTTP status == 403"
            - "the response error_id != ERR_NOT_RESOURCE_OWNER"
            - "GET /peds/memberships filtered by family_id ${fam_id} returns 0 rows"

      - name: corner_care_coordinator_cannot_submit_billing_returns_forbidden_role
        claim_type: role denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.CareCoordinator
          - roles.BillingSpecialist
        distinguishing_aspect: "The peer split is real: CareCoordinator may create the encounter but submit-billing is exclusive to BillingSpecialist and PracticeAdmin, so the same actor is refused with ERR_FORBIDDEN_ROLE 403 and no ServiceLine is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T20:00:00Z after the setup chain"
            - "One PLUS plan, one physician licensed in CA, one family, one child, an ACTIVE membership with the June invoice of 40000 cents PAID"
            - "One SICK_VISIT encounter created by the CareCoordinator, billing_status BILLING_PENDING"
