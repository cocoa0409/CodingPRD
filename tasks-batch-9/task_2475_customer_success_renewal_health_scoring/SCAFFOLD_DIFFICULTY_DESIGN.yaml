  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sponsor_calendar_uses_half_open_minutes_with_a_thirty_minute_buffer
        grounds:
          - calculations.engagement_window_conflict
          - validations[priority=19]
          - entities.ExecutiveEngagement.fields.start_at
          - errors.ERR_ENGAGEMENT_WINDOW_CONFLICT
        distinguishing_aspect: |
          Resource entity SponsorContact, interval semantics HALF-OPEN minutes
          plus a symmetric 30-minute buffer applied to the existing row: a new
          engagement at 15:15 conflicts with a 14:00-15:00 booking because
          15:15 < 15:30, while one starting exactly at 15:30 does not, since the
          comparison is strict.
        test_recipe:
          setup:
            - "ENTERPRISE Account with one CXO ACTIVE SponsorContact."
            - "One SCHEDULED ExecutiveEngagement for that sponsor from 2026-08-10T14:00:00Z to 2026-08-10T15:00:00Z."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
