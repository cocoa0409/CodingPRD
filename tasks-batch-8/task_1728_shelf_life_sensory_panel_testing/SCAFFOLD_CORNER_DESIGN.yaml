  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: create_client_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-ID/X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (401) before any role check; the trigger omits auth headers by design."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/clients", payload: { name: "NoAuth Co", contact_email: "noauth@acme.com" }, as: LabDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 401) — priority 1 auth precedes everything"
            - "GET /sensory-lab/clients total_count == 0"

      - name: activate_insufficient_retainer
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_RETAINER_HOURS]"]
        distinguishing_aspect: "SCHEDULED study whose client balance (10.0) is below reserve (16.0 = 10 + 2*1 + 4*1) fails activation with ERR_INSUFFICIENT_RETAINER_HOURS (402); balance and status unchanged."
        test_recipe:
          setup: ["client topped up 10.0 hours; study with 1 control arm + tp0 fully approved to SCHEDULED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Low Co", contact_email: "low@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 10 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Broth", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_RETAINER_HOURS (http 402): 10.0 < 16.0"
            - "Study.${study_id}.status == SCHEDULED; ClientAccount.${client_id}.retainer_hours_balance == 10.0"

      - name: pull_window_violation_too_early_then_ok
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PULL_WINDOW_VIOLATION]"]
        distinguishing_aspect: "Pull at study day 0 for a day_index 7 time point fails (7 <= 0 false); advancing the clock to day 7 makes the same pull succeed (7 <= 7 <= 9)."
        test_recipe:
          setup: ["study IN_PROGRESS (activated 2026-08-01); tp day 7; chambers CH-20A (20C)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Win Co", contact_email: "win@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Stock", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 7 }, as: SensoryScientist, captures: { tp7: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-20A", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
          trigger:
            - { call: "POST /sensory-lab/sampling-time-points/${tp7}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/sampling-time-points/${tp7}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist, captures: { tp_status: $.data.status } }
          assert:
            - "day 0 pull rejected: error_id == ERR_PULL_WINDOW_VIOLATION (http 409)"
            - "after clock reaches study day 7: pull succeeds, SamplingTimePoint.${tp7}.status == PULLED, chamber reserved_units == 1"

      - name: session_open_outside_window_then_inside
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_OUTSIDE_SESSION_WINDOW]"]
        distinguishing_aspect: "Open at 09:00 for a 10:00-11:00 session fails (more than 30 min early); at 09:45 it succeeds (inside [start - 30min, end])."
        test_recipe:
          setup: ["study IN_PROGRESS; tp0 pulled (1 EVALUATION unit); session S (tp0, arm, 10:00-11:00) PLANNED; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Win2 Co", contact_email: "win2@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Chowder", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-W2", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp0}", arm_id: "${arm_id}", scheduled_start_utc: "2026-08-01T10:00:00Z", scheduled_end_utc: "2026-08-01T11:00:00Z" }, as: PanelCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/evaluation-sessions/${s1}/open", payload: {}, as: PanelCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:45:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions/${s1}/open", payload: {}, as: PanelCoordinator, captures: { st: $.data.status } }
          assert:
            - "09:00 open rejected: error_id == ERR_OUTSIDE_SESSION_WINDOW (09:00 < 10:00 - 30min)"
            - "09:45 open succeeds: status == OPEN (09:45 >= 09:30)"

      - name: chamber_temp_mismatch_on_pull
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CHAMBER_TEMP_MISMATCH]"]
        distinguishing_aspect: "Pull into a 4C chamber for a study stored at 20C fails with ERR_CHAMBER_TEMP_MISMATCH (422); the same pull into a 20C chamber succeeds."
        test_recipe:
          setup: ["study IN_PROGRESS (storage 20C); tp0; chambers CH-COLD (4C) and CH-AMB (20C)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Temp Co", contact_email: "temp@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Deli Meat", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-COLD", temp_c: 4, capacity_units: 10 }, as: LabDirector, captures: { ch_cold: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-AMB", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { ch_amb: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
          trigger:
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${ch_cold}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist, captures: { err: $.data.error_id } }
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/pull", payload: { chamber_id: "${ch_amb}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist, captures: { st: $.data.status } }
