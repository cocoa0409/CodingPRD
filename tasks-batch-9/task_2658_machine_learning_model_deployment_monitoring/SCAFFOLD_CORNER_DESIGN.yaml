              captures: { both_err: $.data.error_id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "00000000-0000-4000-8000-000000000002", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_err: $.data.error_id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200 }
