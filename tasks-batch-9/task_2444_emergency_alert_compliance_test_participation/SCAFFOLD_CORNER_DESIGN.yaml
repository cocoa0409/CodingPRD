              as_user_id: adm-1
              payload: { state_plan_id: "${plan_a}", call_sign: "KWEA", service_type: "FM", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { e_dup_same_plan: "$.data.error_id" }
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_b}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { e_dup_other_plan: "$.data.error_id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_a}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 1 }
              captures: { e_dup_priority: "$.data.error_id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_a}", event_code: "SVR", fips_codes: [], relay_class: "OPTIONAL", priority: 1 }
              captures: { rule_other_code: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_b}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 1 }
              captures: { rule_other_plan: "$.data.id" }
            - call: "POST /relay-rules/${rule_a}/retire"
