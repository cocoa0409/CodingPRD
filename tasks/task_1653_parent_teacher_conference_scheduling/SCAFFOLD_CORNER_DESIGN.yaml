  - section: complexity_layers
    instances:
      - name: occ_stale_window_patch_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[window-config-update-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the pre-generate version (2) after generate-slots advanced the window to 3 is rejected 412 ERR_STALE_VERSION; the fresh version succeeds."
        test_recipe:
          setup: ["window PUBLISHED (v2), then generate-slots -> v3"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin, captures: { w_v3: $.data.version } }
          trigger:
            - { call: "PATCH /conf/windows/${w}", payload: { expected_window_version: "${w_v2}", teacher_daily_conf_cap: 4 }, as: SchoolAdmin, captures: { err: $.data.error_id } }
            - { call: "PATCH /conf/windows/${w}", payload: { expected_window_version: "${w_v3}", teacher_daily_conf_cap: 4 }, as: SchoolAdmin, captures: { cap: $.data.teacher_daily_conf_cap, v: $.data.version } }
          assert:
            - "stale PATCH: HTTP 412, error_id == ERR_STALE_VERSION"
            - "fresh PATCH: 200, teacher_daily_conf_cap == 4, version == 4 (increments by 1 on success)"

      - name: occ_stale_regeneration_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[window-slot-generation-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second generate-slots carrying the pre-first-generation version is rejected 412; with the current version the regeneration succeeds and retires the old grid (8 RETIRED + 8 fresh OPEN)."
        test_recipe:
          setup: ["window PUBLISHED (v2); first generation done (-> v3)"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin, captures: { w_v3: $.data.version } }
          trigger:
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v3}" }, as: SchoolAdmin, captures: { total: $.data.slots_total_count, v: $.data.version } }
          assert:
            - "stale regeneration: HTTP 412, error_id == ERR_STALE_VERSION"
            - "fresh regeneration: 200, slots_total_count == 8 (old grid RETIRED, not double-counted), version == 4"

      - name: occ_stale_reschedule_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-reschedule-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful reschedule advanced the old booking's version, a second reschedule attempt carrying the originally observed version is rejected 412 — OCC fires before the entity-state check (the old booking is also RESCHEDULED), proving priority 6 ordering."
        test_recipe:
          setup: ["window BOOKING_OPEN; booking b1 on slot 0 (version 1); slots 3 and 4 OPEN"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
