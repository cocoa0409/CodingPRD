              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_s12v: $.data.id }
          assert:
            - "EmergencyEvaluation.${e_s6}.acuity_score == 6 and acuity_tier == \"LOW\" (threshold-1 for TIER_MODERATE_MIN)"
            - "EmergencyEvaluation.${e_s7}.acuity_score == 7 and acuity_tier == \"MODERATE\" (exactly TIER_MODERATE_MIN)"
            - "EmergencyEvaluation.${e_s11}.acuity_score == 11 and acuity_tier == \"MODERATE\" (threshold-1 for TIER_HIGH_MIN)"
            - "EmergencyEvaluation.${e_s12}.acuity_score == 12 and acuity_tier == \"HIGH\" (exactly TIER_HIGH_MIN)"
            - "EmergencyEvaluation.${e_s12v}.acuity_score == 12 and acuity_tier == \"HIGH\" and recommended_status == \"VOLUNTARY\" (tier and recommendation are independent outputs)"
            - "EmergencyEvaluation.${e_s6}.recommended_status == \"INVOLUNTARY_HOLD\" and EmergencyEvaluation.${e_s12}.recommended_status == \"INVOLUNTARY_HOLD\""
            - "all five evaluations report prior_admission_count_30d == 0 and status == \"DRAFT\""

