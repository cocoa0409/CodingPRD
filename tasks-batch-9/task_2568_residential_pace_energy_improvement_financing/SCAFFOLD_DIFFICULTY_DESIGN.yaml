              payload: { decision: "PROCEED", valuation_basis: "ASSESSED" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
          assert:
            - "Baseline at submit (before the retirement): Application.${a1}.requested_principal_cents == 4200000, portfolio_sir_bps == 12396, min_measure_sir_bps == 11461, weighted_useful_life_years == 23, screening_cltv_bps == 7300"
            - "Preview after the retirement: the eligibility report returns approved_principal_cents == 3000000, proposed_principal_cents == 4200000, portfolio_sir_bps == 12770, cltv_bps_assessed == 7000, ptv_bps == 750, blocking_error_id == null and measure_sir_report contains '${m_hvac}:11461'"
            - "After underwrite: ProjectMeasure.${m_hvac}.status == INELIGIBLE with sir_bps still 11461 — the measure's own SIR clears the 10000 floor, so only the RETIRED product can explain the classification"
            - "After underwrite: ProjectMeasure.${m_solar}.status == APPROVED and Application.${a1}.requested_principal_cents == 3000000, portfolio_sir_bps == 12770, underwriting_cltv_bps == 7000, status == CONSENT_PENDING"
            - "EligibleProduct.${prod_hvac}.status == RETIRED and is still readable via GET /pace/products/${prod_hvac}; the retired product id remains stored on ProjectMeasure.${m_hvac}.product_id"
            - "Property.${p1}.committed_pace_principal_cents == 0 at this point: nothing is committed until the agreement is signed, so the re-priced principal has not leaked into the parcel ledger"

      - name: certificate_verify_blocked_while_application_funding_held
        grounds:
          - validations[priority=13]
          - errors[ERR_APPLICATION_STATE_INVALID]
          - state_machines.CompletionCertificate.HOMEOWNER_SIGNED_to_VERIFIED
          - state_machines.Application.FUNDING_PENDING_to_FUNDING_HELD
          - state_machines.Contractor.PROBATION_to_ENROLLED
          - validations[priority=55]
        distinguishing_aspect: |
          Entity pair = CompletionCertificate x Application, and the Application's blocking state was
          itself imposed by a THIRD entity (a complaint against a different parcel's application put
          the shared Contractor on probation). The certificate is HOMEOWNER_SIGNED and therefore
          locally verifiable; only the sibling application's FUNDING_HELD state stops it, and the
          block lifts exactly when the contractor is reinstated — a state dependency that is
          invisible from either row involved in the call.
        test_recipe:
          setup:
            - "Clock 2026-08-12, then 2026-08-18, then 2026-08-20. Products SOLAR_PV (25y) and HVAC (18y); one contractor serving 06073 shared by both parcels."
