              payload: { name: "Rex", species: "DOG", size_class: "LARGE", weight_lb: 65.0, date_of_birth: "2018-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /rescue/animals/${animal_id}/intake-records"
              payload: { intake_type: "OWNER_SURRENDER", intake_datetime: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
            - call: "POST /rescue/animals/${animal_id}/medical-records"
              payload: { procedure_type: "SPAY_NEUTER", expense_category: "SPAY_NEUTER", cost_cents: 0, scheduled_at: "2026-05-01T00:00:00Z", funding_required: false }
              as: Veterinarian
              captures: { med_id: $.data.id }
            - call: "POST /rescue/medical-records/${med_id}/complete"
              payload: {}
              as: Veterinarian
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 20000, donor_reference: "SPON-IM", designated_animal_id: "${animal_id}", designated_program: "NONE", restriction_category: "UNRESTRICTED" }
              as: FinanceOfficer
              captures: { contrib_id: $.data.id }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/adoption-applications"
              payload: { animal_id: "${animal_id}", applicant_person_id: "${adopter_id}" }
              as: AdoptionCounselor
              as_user_id: "counselor-1"
              captures: { app_id: $.data.id }
            - call: "POST /rescue/adoption-applications/${app_id}/screen"
              payload: { decision: "APPROVE" }
              as: AdoptionCounselor
              as_user_id: "counselor-1"
            - call: "GET /rescue/animals/${animal_id}"
              payload: {}
              as: PlatformAdmin
              captures: { av: $.data.version }
          trigger:
            - call: "POST /rescue/adoptions"
              payload: { adoption_application_id: "${app_id}", expected_animal_version: "${av}", credit_application_order: "CREDIT_FIRST", refund_basis: "FEE_PAID", deposit_basis: "FLAT" }
              as: AdoptionCounselor
              as_user_id: "counselor-2"
              captures: { base: $.data.base_fee_cents, kind: $.data.waiver_kind, spon: $.data.sponsorship_applied_cents, waived: $.data.waiver_applied_cents, charged: $.data.adopter_charged_cents, residual: $.data.residual_credit_cents, fee_status: $.data.fee_status, adoption_status: $.data.status }
          assert:
            - "base == 25000"
            - "kind == SENIOR"
            - "spon == 20000"
            - "waived == 3000"
            - "charged == 2000"
            - "residual == 0"
            - "fee_status == UNPAID"
            - "adoption_status == FINALIZED"
            - "the response meta carries api_request_id and api_request_timestamp and response_type == object"

