scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: invoice_provisional_vs_final_money_divergence
        grounds:
          - calculations.invoice_assembly
          - calculations.vendor_cost_markup
          - calculations.invoice_total
          - entities.Invoice.fields.billing_mode
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          This dual-variant lives in the Invoice money domain: PROVISIONAL and FINAL read the
          SAME TimeEntry and VendorCost rows over the same period but apply different status
          filters and different money columns, so total_cents is 327025 vs 164800 on identical data.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; Acme client; rate card SENIOR=20000 c/h; SOW countersigned with markup_pct 0.175 and labor_cap 4000000; campaign IN_FLIGHT."
            - "TimeEntry A: Dana (SENIOR) 2026-06-02 09:00-17:00 = 480 min, billable, APPROVED (billable_amount_cents 160000, estimated_amount_cents 160000)."
            - "TimeEntry B: Dana 2026-06-02 17:00-19:00 = 120 min, billable, still SUBMITTED (estimated_amount_cents 40000)."
            - "VendorCost V: estimated_amount_cents 100000, incurred 2026-06-03, still SUBMITTED (actual_amount_cents null)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Lee", grade: "SENIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st_dana: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /retainers"
              payload: { client_id: "${cli}", initial_funding_cents: 5000000, period_start: "2026-06-01", period_end: "2026-09-01" }
              as: AgencyAdmin
              captures: { ret: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-02T09:00:00Z", ended_at: "2026-06-02T17:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te_a: $.data.id }
            - call: "POST /time-entries/${te_a}/approve"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-02T17:00:00Z", ended_at: "2026-06-02T19:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te_b: $.data.id }
            - call: "POST /vendor-costs"
              payload: { campaign_id: "${camp}", vendor_name: "Freelance Editor", vendor_type: "FREELANCER", estimated_amount_cents: 100000, incurred_on: "2026-06-03" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { vc: $.data.id }
          trigger:
            - call: "POST /invoices"
              payload: { client_id: "${cli}", campaign_id: "${camp}", retainer_id: "${ret}", billing_mode: "PROVISIONAL", period_start: "2026-06-01", period_end: "2026-07-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { inv_prov: $.data.id }
            - call: "POST /invoices"
              payload: { client_id: "${cli}", campaign_id: "${camp}", retainer_id: "${ret}", billing_mode: "FINAL", period_start: "2026-06-01", period_end: "2026-07-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { inv_fin: $.data.id }
          assert:
            - "Invoice.${inv_prov}.line_count == 3"
            - "Invoice.${inv_prov}.labor_cents == 200000"
            - "Invoice.${inv_prov}.vendor_base_cents == 100000"
            - "Invoice.${inv_prov}.vendor_marked_up_cents == 117500"
            - "Invoice.${inv_prov}.subtotal_cents == 317500"
            - "Invoice.${inv_prov}.admin_fee_cents == 9525"
            - "Invoice.${inv_prov}.total_cents == 327025"
            - "Invoice.${inv_fin}.line_count == 1"
            - "Invoice.${inv_fin}.labor_cents == 160000"
            - "Invoice.${inv_fin}.vendor_base_cents == 0"
            - "Invoice.${inv_fin}.vendor_marked_up_cents == 0"
            - "Invoice.${inv_fin}.subtotal_cents == 160000"
            - "Invoice.${inv_fin}.admin_fee_cents == 4800"
            - "Invoice.${inv_fin}.total_cents == 164800"
            - "TimeEntry.${te_b}.status == SUBMITTED"
            - "VendorCost.${vc}.status == SUBMITTED"

      - name: staff_utilization_capacity_vs_logged_divergence
        grounds:
          - calculations.staff_utilization
          - entities.StaffMember.fields.standard_daily_capacity_minutes
          - entities.TimeEntry.fields.billable
          - entities.TimeEntry.fields.status
        distinguishing_aspect: |
          This dual-variant lives in the StaffMember productivity-rate domain, not the money
          domain: the identical five TimeEntry facts yield utilization_pct_capacity_based 20.0
          (denominator = 2400 contracted weekday minutes) and utilization_pct_logged_based 61.5
          (denominator = 780 actually-logged minutes).
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme client; SENIOR rate 20000 c/h; SOW countersigned; campaign IN_FLIGHT."
            - "Dana has standard_daily_capacity_minutes 480. Window 2026-06-01..2026-06-08 contains 5 weekdays -> capacity 2400 minutes."
            - "TimeEntry A: 2026-06-02 09:00-17:00, 480 min, billable, APPROVED (billable_amount_cents 160000)."
            - "TimeEntry B: 2026-06-03 09:00-12:00, 180 min, billable=false, SUBMITTED."
            - "TimeEntry C: 2026-06-04 09:00-11:00, 120 min, billable, SUBMITTED (never approved)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Lee", grade: "SENIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st_dana: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-02T09:00:00Z", ended_at: "2026-06-02T17:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te_a: $.data.id }
            - call: "POST /time-entries/${te_a}/approve"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-03T09:00:00Z", ended_at: "2026-06-03T12:00:00Z", billable: false }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te_b: $.data.id }
            - call: "POST /time-entries"
              payload: { campaign_id: "${camp}", staff_id: "${st_dana}", started_at: "2026-06-04T09:00:00Z", ended_at: "2026-06-04T11:00:00Z", billable: true }
              as: CreativeLead
              as_user_id: "${st_dana}"
              captures: { te_c: $.data.id }
          trigger:
            - call: "GET /staff-members/${st_dana}/utilization"
              payload: { period_start: "2026-06-01", period_end: "2026-06-08" }
              as: AgencyAdmin
          assert:
            - "response.data.capacity_minutes == 2400"
            - "response.data.billable_minutes == 480"
            - "response.data.logged_minutes == 780"
            - "response.data.billed_amount_cents == 160000"
            - "response.data.utilization_pct_capacity_based == 20.0"
            - "response.data.utilization_pct_logged_based == 61.5"
            - "response.data.effective_billable_rate_cents_per_hour == 20000"
            - "TimeEntry.${te_b}.estimated_amount_cents == 0"
            - "TimeEntry.${te_b}.pinned_rate_cents_per_hour == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: vendor_markup_rounded_per_line_then_summed
        grounds:
          - calculations.vendor_cost_markup
          - entities.SOW.fields.markup_pct
          - entities.Invoice.fields.vendor_marked_up_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER decides the cents. Two APPROVED vendor lines
          of 1000002 at markup 0.175 give 2350004 when each line is rounded first and then summed,
          but 2350005 when the bases are summed and rounded once; the scaffold pins per-line-first,
          so vendor_marked_up_cents MUST be 2350004.
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme; SOW countersigned with markup_pct 0.175; campaign IN_FLIGHT."
            - "VendorCost V1 and V2 both APPROVED with actual_amount_cents 1000002, incurred 2026-06-03."
            - "No time entries and no media on this campaign, so the invoice is pure pass-through."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /retainers"
              payload: { client_id: "${cli}", initial_funding_cents: 5000000, period_start: "2026-06-01", period_end: "2026-09-01" }
              as: AgencyAdmin
              captures: { ret: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /vendor-costs"
              payload: { campaign_id: "${camp}", vendor_name: "Reel Post House", vendor_type: "PRODUCTION", estimated_amount_cents: 900000, incurred_on: "2026-06-03" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { vc1: $.data.id }
            - call: "POST /vendor-costs/${vc1}/approve"
              payload: { actual_amount_cents: 1000002 }
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /vendor-costs"
              payload: { campaign_id: "${camp}", vendor_name: "Grade Suite", vendor_type: "PRODUCTION", estimated_amount_cents: 900000, incurred_on: "2026-06-03" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { vc2: $.data.id }
            - call: "POST /vendor-costs/${vc2}/approve"
              payload: { actual_amount_cents: 1000002 }
              as: AccountManager
              as_user_id: "${st_ravi}"
          trigger:
            - call: "POST /invoices"
              payload: { client_id: "${cli}", campaign_id: "${camp}", retainer_id: "${ret}", billing_mode: "FINAL", period_start: "2026-06-01", period_end: "2026-07-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { inv: $.data.id }
          assert:
            - "Invoice.${inv}.line_count == 2"
            - "Invoice.${inv}.vendor_base_cents == 2000004"
            - "Invoice.${inv}.vendor_marked_up_cents == 2350004"
            - "Invoice.${inv}.vendor_marked_up_cents != 2350005"
            - "Invoice.${inv}.subtotal_cents == 2350004"
            - "Invoice.${inv}.admin_fee_cents == 70500"
            - "Invoice.${inv}.total_cents == 2420504"

      - name: invoice_discount_tier_keyed_on_subtotal_not_on_total
        grounds:
          - calculations.invoice_total
          - calculations.media_commission
          - entities.Invoice.fields.discount_pct
          - entities.Invoice.fields.admin_fee_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency resolved by a pinned evaluation order. The
          subtotal is 9800000, which sits below DISCOUNT_TIER1_CENTS (10000000) so discount_pct is
          0.00 and total_cents is 10094000; keying the tier on the total (10094000, which is over
          the tier) would wrongly grant 5% — so the correct answer is only reachable by evaluating
          discount BEFORE the admin fee.
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme; SOW countersigned, markup_pct 0.175; campaign IN_FLIGHT."
            - "MediaPlan: approved_budget_cents 10000000, allowed_channels [VIDEO], APPROVED."
            - "MediaPlacement P: channel VIDEO, min_dark_days 0."
            - "InsertionOrder IO: gross_cents 5000000 (exactly TIER1), flight 2026-06-05..2026-06-20, PLACED."
            - "VendorCost V: APPROVED with actual_amount_cents 7829787, incurred 2026-06-03."
            - "No time entries, so labor_cents is 0 and the subtotal is 9200000 vendor + 600000 commission = 9800000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Mia Chen", grade: "SENIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 6000 }
              as: AgencyAdmin
              captures: { st_mia: $.data.id }
            - call: "POST /retainers"
              payload: { client_id: "${cli}", initial_funding_cents: 5000000, period_start: "2026-06-01", period_end: "2026-09-01" }
              as: AgencyAdmin
              captures: { ret: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Q3 Retainer SOW", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-06-01", effective_end: "2026-09-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow: $.data.id }
            - call: "POST /sows/${sow}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /campaigns"
              payload: { client_id: "${cli}", sow_id: "${sow}", name: "Summer Push", brief_summary: "Drive summer awareness", objective: "AWARENESS" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/launch"
              payload: {}
              as: AccountManager
              as_user_id: "${st_ravi}"
            - call: "POST /media-placements"
              payload: { publisher_name: "StreamCo", channel: "VIDEO", min_dark_days: 0 }
              as: AgencyAdmin
              captures: { pl: $.data.id }
            - call: "POST /media-plans"
              payload: { campaign_id: "${camp}", approved_budget_cents: 10000000, allowed_channels: ["VIDEO"] }
              as: MediaBuyer
              as_user_id: "${st_mia}"
              captures: { mp: $.data.id }
            - call: "POST /media-plans/${mp}/approve"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
              captures: { mp_v2: $.data.version }
            - call: "POST /insertion-orders"
              payload: { media_plan_id: "${mp}", placement_id: "${pl}", flight_start: "2026-06-05", flight_end: "2026-06-20", gross_cents: 5000000, expected_media_plan_version: "${mp_v2}" }
              as: MediaBuyer
              as_user_id: "${st_mia}"
              captures: { io: $.data.id }
            - call: "POST /insertion-orders/${io}/place"
              payload: {}
              as: MediaBuyer
              as_user_id: "${st_mia}"
            - call: "POST /vendor-costs"
              payload: { campaign_id: "${camp}", vendor_name: "Reel Post House", vendor_type: "PRODUCTION", estimated_amount_cents: 7000000, incurred_on: "2026-06-03" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { vc: $.data.id }
            - call: "POST /vendor-costs/${vc}/approve"
              payload: { actual_amount_cents: 7829787 }
              as: AccountManager
              as_user_id: "${st_ravi}"
          trigger:
            - call: "POST /invoices"
              payload: { client_id: "${cli}", campaign_id: "${camp}", retainer_id: "${ret}", billing_mode: "FINAL", period_start: "2026-06-01", period_end: "2026-07-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { inv: $.data.id }
          assert:
            - "Invoice.${inv}.labor_cents == 0"
            - "Invoice.${inv}.vendor_base_cents == 7829787"
            - "Invoice.${inv}.vendor_marked_up_cents == 9200000"
            - "Invoice.${inv}.media_gross_cents == 5000000"
            - "Invoice.${inv}.media_commission_cents == 600000"
            - "Invoice.${inv}.subtotal_cents == 9800000"
            - "Invoice.${inv}.discount_pct == 0"
            - "Invoice.${inv}.discount_cents == 0"
            - "Invoice.${inv}.admin_fee_cents == 294000"
            - "Invoice.${inv}.total_cents == 10094000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: deliverable_revision_loop_cycles_back_to_submitted
        grounds:
          - state_machines.Deliverable.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.Deliverable.CHANGES_REQUESTED_to_SUBMITTED
          - entities.Deliverable.fields.current_asset_version
          - entities.Deliverable.fields.revision_round
        distinguishing_aspect: |
          Non-linearity on Deliverable is a genuine CYCLE: SUBMITTED -> CHANGES_REQUESTED ->
          SUBMITTED is traversed twice, so the same row visits SUBMITTED three times, ending at
          current_asset_version 3 and revision_round 2 — impossible in any acyclic pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-01; Acme; SOW countersigned; campaign IN_FLIGHT; one Deliverable in DRAFT with current_asset_version 0 and revision_round 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { name: "Acme Retail", industry: "RETAIL", billing_email: "ap@acme.test" }
              as: AgencyAdmin
              captures: { cli: $.data.id }
            - call: "POST /rate-cards"
              payload: { name: "Standard 2026", rate_junior_cents_per_hour: 12000, rate_senior_cents_per_hour: 20000, rate_director_cents_per_hour: 32000 }
              as: AgencyAdmin
              captures: { rc: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
