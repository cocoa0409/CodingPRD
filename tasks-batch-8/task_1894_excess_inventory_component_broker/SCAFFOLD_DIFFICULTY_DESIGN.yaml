            - "Seller.${s7_id}.account_balance_cents == 97911 (cascade from SELLER_PAYOUT entry creation, parallel chain link 2)"
            - "Customer.${c7_id}.open_order_exposure_cents == 0 (exposure release cascade)"

      - name: snapshot_cascade_to_lot_and_listing
        grounds:
          - calculations.lot_carrying_value
          - calculations.recommended_listing_price
        distinguishing_aspect: |
          Trigger POST /market-price-snapshots: snapshot creation mutates every Lot of
