            - "ForwardShipment.${ship_id}.excluded_item_count == 0"
            - "ForwardShipment.${ship_id}.base_price_cents == 7614"
            - "ForwardShipment.${ship_id}.consolidation_discount_cents == 1142"
            - "ForwardShipment.${ship_id}.total_price_cents == 6472"
