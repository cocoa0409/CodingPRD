        distinguishing_aspect: "On a DELIVERED order the returnable check runs before the reel-identity check, so returning against a CUT line yields ERR_CUT_ITEM_NON_RETURNABLE (409), never ERR_REEL_NOT_ON_ORDER_LINE."
