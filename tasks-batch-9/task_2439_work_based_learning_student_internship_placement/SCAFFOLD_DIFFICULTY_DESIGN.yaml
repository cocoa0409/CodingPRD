  - rule_id: compensating_invariant
    instances:
      - name: voiding_a_timesheet_entry_restores_the_verified_hour_ledger
        grounds:
          - endpoints["POST /wbl/timesheet-entries/{entryId}/void"]
          - entities.Placement.fields.total_verified_hours
          - entities.Student.fields.ytd_wbl_hours
          - calculations.wage_settlement
        distinguishing_aspect: |
          Conserved quantity: verified hours. The invariant Placement.total_verified_hours ==
          sum(hours_worked of that placement's LOGGED entries) and Student.ytd_wbl_hours ==
          the same sum across the student's placements must hold after the compensating void, so
