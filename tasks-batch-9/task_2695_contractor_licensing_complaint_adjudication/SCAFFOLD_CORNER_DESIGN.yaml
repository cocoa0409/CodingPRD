# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task 2695
# Contractor Licensing & Complaint Adjudication (state contractors licensing board)
#
# Walked from references/claim-extraction-guide.md row-by-row against this
# scaffold's §1.1–§1.7. `section:` values are the guide's nine sections;
# `claim_type:` values are the guide's per-section rows. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:`
# stub and no test_recipe.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_create_trade_classification_returns_declared_fields_in_the_success_envelope
        claim_type: Creation
        grounds:
          - entities.TradeClassification
          - endpoints[POST /licensing/trade-classifications]
          - response_envelope.success
        distinguishing_aspect: "POST with every required field returns 201, a meta block carrying api_request_id and api_request_timestamp, response_type = object, and a data object echoing all nine inputs plus the four common fields."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id, cls_ver: $.data.version }
          assert:
            - "response http status == 201"
            - "response response_type == object"
            - "response meta.api_request_id is present and non-empty"
            - "response meta.api_request_timestamp is present and non-empty"
            - "TradeClassification.${cls_id}.code == C-10"
            - "TradeClassification.${cls_id}.hazard_tier == 3"
            - "TradeClassification.${cls_id}.min_experience_months == 48"
            - "TradeClassification.${cls_id}.required_bond_amount_cents == 1500000"
            - "TradeClassification.${cls_id}.renewal_base_fee_cents == 45000"
            - "TradeClassification.${cls_id}.mediation_required == true"
            - "${cls_ver} == 1"

      - name: corner_get_license_by_id_returns_the_stored_snapshot
        claim_type: Retrieval
        grounds:
          - endpoints[GET /licensing/licenses/{id}]
          - entities.License
          - state_machines.LicenseApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: "GET /licensing/licenses/{id} returns exactly the row the approval cascade minted: status ACTIVE, issued_on 2026-08-01, expires_on 2028-08-01, renewal_count 0 and compliance_posture NON_COMPLIANT."
        test_recipe:
          setup:
            - "clock at 2026-08-01, a C-10 classification, and one licence minted by an approved ORIGINAL application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Read Electric LLC", entity_type: "LLC", contact_email: "read@x.test" }
              as: LicensingAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Reed Reader", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 88, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 84, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic_id}", classification_id: "${cls_id}", qualifying_individual_id: "${qi_id}", application_type: "ORIGINAL", declared_net_worth_cents: 400000 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/license-applications/${app_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /licensing/license-applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "GET /licensing/licenses?application_id=${app_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc_id: "$.data[0].id" }
          trigger:
            - call: "GET /licensing/licenses/${lc_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { got_status: $.data.status, got_issued: $.data.issued_on, got_expires: $.data.expires_on }
          assert:
            - "response http status == 200"
            - "${got_status} == ACTIVE"
            - "${got_issued} == 2026-08-01"
            - "${got_expires} == 2028-08-01"
            - "License.${lc_id}.application_id == ${app_id}"
            - "License.${lc_id}.licensee_id == ${lic_id}"
            - "License.${lc_id}.classification_id == ${cls_id}"
            - "License.${lc_id}.renewal_count == 0"
            - "License.${lc_id}.compliance_posture == NON_COMPLIANT"

      - name: corner_list_complaints_paginates_and_filters_by_consumer
        claim_type: Listing
        grounds:
          - endpoints[GET /licensing/complaints]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three complaints from one consumer and one from another: limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns 1 row with has_more false, and the consumer_id filter never leaks the fourth complaint."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and two consumers"
            - "consumer LISTER files three unlicensed-subject complaints; consumer OTHER files one"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Lee Lister", contact_email: "lee@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_l_id: $.data.id }
            - call: "POST /licensing/consumers"
              payload: { full_name: "Otto Other", contact_email: "otto@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_o_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_l_id}", subject_business_name: "Cash Only Contracting", alleged_loss_cents: 300000, contract_date: "2026-07-01", description: "Deposit taken for a re-roof, no work performed" }
              as: Consumer
              as_user_id: "${con_l_id}"
              captures: { cmp_l1_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_l_id}", subject_business_name: "Cash Only Contracting", alleged_loss_cents: 400000, contract_date: "2026-07-02", description: "Second deposit taken for gutters" }
              as: Consumer
              as_user_id: "${con_l_id}"
              captures: { cmp_l2_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_l_id}", subject_business_name: "Handy Andy", alleged_loss_cents: 500000, contract_date: "2026-07-03", description: "Bathroom left unusable" }
              as: Consumer
              as_user_id: "${con_l_id}"
              captures: { cmp_l3_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_o_id}", subject_business_name: "Handy Andy", alleged_loss_cents: 600000, contract_date: "2026-07-04", description: "Deck collapsed" }
              as: Consumer
              as_user_id: "${con_o_id}"
              captures: { cmp_o1_id: $.data.id }
          trigger:
            - call: "GET /licensing/complaints?consumer_id=${con_l_id}&limit=2&offset=0"
              payload: {}
              as: LicensingAnalyst
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /licensing/complaints?consumer_id=${con_l_id}&limit=2&offset=2"
              payload: {}
              as: LicensingAnalyst
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "trigger call 1 response response_type == array"
            - "trigger call 1 response data length == 2"
            - "trigger call 1 response total_count == 3"
            - "trigger call 1 response has_more == true"
            - "trigger call 2 response data length == 1"
            - "trigger call 2 response total_count == 3"
            - "trigger call 2 response has_more == false"
            - "${page1_first} == ${cmp_l1_id}"
            - "${page2_first} == ${cmp_l3_id}"
            - "neither page contains ${cmp_o1_id}"

      - name: corner_get_unknown_license_id_returns_license_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_LICENSE_NOT_FOUND]
          - endpoints[GET /licensing/licenses/{id}]
        distinguishing_aspect: "A syntactically valid but unissued UUID on GET /licensing/licenses/{id} returns ERR_LICENSE_NOT_FOUND with http 404 and the error envelope's response_type = error."
        test_recipe:
          setup:
            - "empty database with the clock pinned to 2026-08-01 — no License row has ever been minted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "GET /licensing/licenses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LicensingAnalyst
          assert:
            - "response http status == 404"
            - "response response_type == error"
            - "response error_id == ERR_LICENSE_NOT_FOUND"
            - "response message is present and non-empty"

      - name: corner_complaint_creation_without_description_is_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /licensing/complaints]
          - entities.Complaint.fields.description
        distinguishing_aspect: "description is declared source: input with no default, so omitting it returns ERR_INVALID_REQUEST (400) and no Complaint row is created."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one registered consumer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Mia Missing", contact_email: "mia@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_m_id: $.data.id }
          trigger:
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_m_id}", subject_business_name: "Vague Ventures", alleged_loss_cents: 300000, contract_date: "2026-07-01" }
              as: Consumer
              as_user_id: "${con_m_id}"
          assert:
            - "response http status == 400"
            - "response error_id == ERR_INVALID_REQUEST"
            - "GET /licensing/complaints?consumer_id=${con_m_id} returns total_count == 0"

      - name: corner_coverage_record_defaults_to_pending_verification
        claim_type: Defaults
        grounds:
          - entities.CoverageRecord.fields.status
          - entities.CoverageRecord.fields.verified_on
          - entities.CoverageRecord.fields.cancellation_date
          - state_machines.CoverageRecord
        distinguishing_aspect: "A freshly filed bond carries the declared default status PENDING_VERIFICATION with verified_on and cancellation_date both null, and it does not yet lift the licence's NON_COMPLIANT posture."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one C-10 licence minted that day with no coverage on file"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Default Electric LLC", entity_type: "LLC", contact_email: "def@x.test" }
              as: LicensingAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Dee Fault", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 88, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 84, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic_id}", classification_id: "${cls_id}", qualifying_individual_id: "${qi_id}", application_type: "ORIGINAL", declared_net_worth_cents: 400000 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/license-applications/${app_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /licensing/license-applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "GET /licensing/licenses?application_id=${app_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc_id: "$.data[0].id" }
          trigger:
            - call: "POST /licensing/coverage-records"
              payload: { license_id: "${lc_id}", coverage_type: "BOND", carrier_name: "Surety One", policy_number: "BND-DEF", amount_cents: 1500000, effective_date: "2026-08-01", expiration_date: "2027-08-01" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { cov_id: $.data.id, cov_status: $.data.status }
          assert:
            - "response http status == 201"
            - "${cov_status} == PENDING_VERIFICATION"
            - "CoverageRecord.${cov_id}.verified_on == null"
            - "CoverageRecord.${cov_id}.cancellation_date == null"
            - "License.${lc_id}.compliance_posture == NON_COMPLIANT"

      - name: corner_active_qualification_count_is_computed_with_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.QualifyingIndividual.fields.active_qualification_count
          - endpoints[POST /licensing/qualifying-individuals]
        distinguishing_aspect: "active_qualification_count is source: computed = COUNT(ACTIVE QualifierAssignment), so a freshly registered qualifier reads 0 even though the create payload asserted 7."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and an empty QualifyingIndividual table"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Cal Computed", verified_experience_months: 60, active_qualification_count: 7 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id, qi_count: $.data.active_qualification_count }
          assert:
            - "response http status == 201"
            - "${qi_count} == 0"
            - "QualifyingIndividual.${qi_id}.active_qualification_count == 0"
            - "QualifyingIndividual.${qi_id}.verified_experience_months == 60"

      - name: corner_exam_result_system_fields_stamped_with_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ExamResult.fields.id
          - entities.ExamResult.fields.created_at
          - endpoints[POST /licensing/qualifying-individuals/{id}/exam-results]
        distinguishing_aspect: "id and created_at are source: system: the server mints its own id and stamps created_at from the logical clock 2026-08-01T00:00:00Z, discarding both values supplied in the payload."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one registered qualifier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Sy Stem", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
          trigger:
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 88, taken_on: "2025-03-01", id: "11111111-1111-4111-8111-111111111111", created_at: "1999-01-01T00:00:00Z" }
              as: LicensingAnalyst
              captures: { ex_id: $.data.id, ex_created: $.data.created_at }
          assert:
            - "response http status == 201"
            - "${ex_id} != 11111111-1111-4111-8111-111111111111"
            - "${ex_created} == 2026-08-01T00:00:00Z"
            - "ExamResult.${ex_id}.qualifying_individual_id == ${qi_id}"
            - "ExamResult.${ex_id}.taken_on == 2025-03-01"

      - name: corner_money_fields_supplied_as_json_strings_are_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /licensing/recovery-fund-accounts]
        distinguishing_aspect: "priority 3 demands integer money fields as JSON integers: initial_balance_cents sent as the string \"5000000\" returns ERR_INVALID_REQUEST (400) rather than being coerced."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and no fund account on file"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/recovery-fund-accounts"
              payload: { fiscal_year: 2027, initial_balance_cents: "5000000", per_claim_cap_cents: 1500000, per_license_aggregate_cap_cents: 2000000 }
              as: BoardAdmin
          assert:
            - "response http status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: corner_hearing_end_not_after_start_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.DisciplinaryHearing.fields.scheduled_end_utc
        distinguishing_aspect: "priority 3 requires scheduled_end_utc > scheduled_start_utc, so an equal-timestamp slot is a schema rejection (400) and never reaches the priority 64 calendar check."
        test_recipe:
          setup:
            - "clock at 2026-09-01 with a C-20 licence, a SUBSTANTIATED SERIOUS investigation and an APPEAL_REQUESTED citation on it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-20", name: "HVAC", hazard_tier: 2, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1000000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: false }
              as: BoardAdmin
              captures: { cls20_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Interval Air LLC", entity_type: "LLC", contact_email: "int@x.test" }
              as: LicensingAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Ivy Interval", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 90, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-20", score: 85, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic_id}", classification_id: "${cls20_id}", qualifying_individual_id: "${qi_id}", application_type: "ORIGINAL", declared_net_worth_cents: 400000 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/license-applications/${app_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /licensing/license-applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "GET /licensing/licenses?application_id=${app_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc_id: "$.data[0].id" }
            - call: "POST /licensing/consumers"
              payload: { full_name: "Ivan Interval", contact_email: "ivan@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_id}", license_id: "${lc_id}", alleged_loss_cents: 500000, contract_date: "2026-08-05", work_completed_on: "2026-08-20", description: "Condensate line drained into the wall" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
            - call: "POST /licensing/investigations"
              payload: { origin: "COMPLAINT", complaint_id: "${cmp_id}", subject_license_id: "${lc_id}" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { inv_id: $.data.id }
            - call: "POST /licensing/investigations/${inv_id}/close"
              payload: { finding: "SUBSTANTIATED", finding_severity: "SERIOUS", evidence_summary: "Condensate damage confirmed" }
              as: Investigator
              as_user_id: "inv-11"
            - call: "POST /licensing/citations"
              payload: { investigation_id: "${inv_id}", classification_id: "${cls20_id}", violation_code: "B-7109", correction_due_date: "2026-10-15" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { cit_id: $.data.id }
            - call: "POST /licensing/citations/${cit_id}/appeal"
              payload: { appeal_grounds: "Drain was installed per plan" }
              as: Licensee
              as_user_id: "${lic_id}"
          trigger:
            - call: "POST /licensing/disciplinary-hearings"
              payload: { citation_id: "${cit_id}", presiding_officer_user_id: "ho-77", scheduled_start_utc: "2026-09-10T14:00:00Z", scheduled_end_utc: "2026-09-10T14:00:00Z" }
              as: BoardAdmin
          assert:
            - "response http status == 400"
            - "response error_id == ERR_INVALID_REQUEST"
            - "Citation.${cit_id}.status == APPEAL_REQUESTED"
            - "GET /licensing/disciplinary-hearings?citation_id=${cit_id} returns total_count == 0"

      - name: corner_exam_result_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
