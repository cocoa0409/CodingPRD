  - section: errors
    instances:
      - name: request_creation_without_identity_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1] ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 outranks every other rule, so a call with a well-formed body and a valid target id still fails on the missing headers alone - and it fails with 401, never with the 403 that a wrong role would produce."
        test_recipe:
          setup:
            - "One decision exists so the body's roadmap_decision_id resolves"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Header check", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "Who owns the weekly report?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: "<both X-User-ID and X-User-Role omitted>"
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "Who owns the weekly report?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: "<X-User-Role present, X-User-ID empty string>"
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "Who owns the weekly report?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
          assert:
            - "Both header-less variants return HTTP 401 with error.code == ERR_UNAUTHENTICATED"
            - "An empty X-User-ID counts as absent - the rule requires both headers present AND non-empty"
            - "No ResearchRequest row is created by either refusal; the third, fully identified call returns HTTP 201"
            - "The 401 responses carry the declared error envelope with code and message, not a bare framework error"
      - name: resubmit_by_a_non_owner_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OWNERSHIP_REQUIRED]
          - validations[priority 3] ERR_OWNERSHIP_REQUIRED
        distinguishing_aspect: "The caller holds a role that the endpoint accepts, so the RBAC rule at priority 2 passes and only the identity comparison against requester_user_id refuses - role authority and record ownership are separate gates."
        test_recipe:
          setup:
            - "Request raised by u_stake_1 and triaged to NEEDS_REFRAMING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Ownership", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_id}", question: "Is onboarding too long?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_id: $.data.id }
            - call: "POST /research-requests/${req_id}/triage"
              payload: { outcome: "NEEDS_REFRAMING", reason: "Two questions in one" }
              as: ResearchLead
              as_user_id: "u_lead_1"
          trigger:
            - call: "POST /research-requests/${req_id}/resubmit"
              payload: { question: "Which onboarding step takes longest?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_2"
            - call: "POST /research-requests/${req_id}/resubmit"
              payload: { question: "Which onboarding step takes longest?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /research-requests/${req_id}/resubmit"
              payload: { question: "Which onboarding step takes longest?", question_type: "DISCOVERY", evidence_gap: "PARTIAL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
            - call: "GET /research-requests/${req_id}"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
          assert:
            - "u_stake_2 - same accepted role, different user - returns HTTP 403 ERR_OWNERSHIP_REQUIRED"
            - "u_res_1 also returns HTTP 403 ERR_OWNERSHIP_REQUIRED: Researcher is in the endpoint's roles, so the RBAC rule at priority 2 is satisfied and ownership is the only failing clause"
            - "The requester u_stake_1 succeeds with HTTP 200"
            - "The read shows status == SUBMITTED, revision_round == 1, question == 'Which onboarding step takes longest?' and priority_score == null"
            - "Both refusals left revision_round at 0 - a rejected resubmit must not consume a revision round"
