      - name: training_stays_current_for_seven_quarters_and_lapses_on_the_eighth
        claim_type: Precision
        grounds:
          - calculations.fiduciary_training_status
          - state_machines.FiduciaryTrainingRecord.COMPLETED_to_EXPIRED
          - validations.priority_50_ERR_TRAINING_NOT_CURRENT
        distinguishing_aspect: "validity_quarters is 8, and the currency test is a strict less-than on the quarter gap: at gap 7 the chair convenes a meeting normally, and the single advance-quarter that makes the gap exactly 8 expires all three members' records at once, turning the same chair into someone who can neither vote nor convene nor approve minutes. Re-completing the modules at the new quarter index restarts the eight-quarter window from zero, which is the only way back."
        test_recipe:
          setup:
            - "chain_l3 is replayed verbatim at fiscal_quarter_index 0: the chair holds a COMPLETED FIDUCIARY_DUTIES record and WAIVED IPS_MECHANICS and PROHIBITED_TRANSACTIONS records, all stamped completed_quarter_index 0 with the default validity_quarters 8."
            - "Seven advance-quarter calls take the plan to fiscal_quarter_index 7, a gap of exactly 7 — still current because 7 < 8."
            - "An eighth advance-quarter makes the gap 8, which the expiry precondition (completed_quarter_index + validity_quarters <= fiscal_quarter_index) satisfies with equality."
          setup_api_calls:
            - *chain_l3
            - call: "GET /governance/training-records?member_id=${mem_chair_id}&limit=10&offset=0"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
