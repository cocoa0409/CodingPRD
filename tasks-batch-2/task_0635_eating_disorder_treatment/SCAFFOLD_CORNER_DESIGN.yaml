  # ===========================================================================
  - section: rbac
    instances:
      - name: dietitian_cannot_create_assessment
        claim_type: exclusive_operation_denied
        grounds:
          - roles.Dietitian
          - roles.Clinician
          - endpoints
        distinguishing_aspect: "POST /edt/assessments as Dietitian -> ERR_UNAUTHORIZED (403); assessment creation is Clinician-exclusive."
        test_recipe:
          setup: ["A facility and patient exist."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat JJ", age_band: "ADULT", bmi: 17.0 }
              as: Intake
