      - name: referral_not_due_beats_attempt_cap_and_suppresses_the_abandon_write
        grounds:
          - validations[priority=33]
          - validations[priority=34]
          - state_machines.Referral.NO_RESPONSE_to_ABANDONED
          - errors[ERR_REFERRAL_NOT_DUE]
          - errors[ERR_REFERRAL_CAP_REACHED]
        distinguishing_aspect: |
          A different error-category pair — `business_temporal` (priority 33) versus
          `business_constraint` (priority 34). A fourth send attempted before next_eligible_send_at
          returns ERR_REFERRAL_NOT_DUE and leaves the referral in NO_RESPONSE with abandoned_at null,
          proving the mutate-then-reject abandon write at priority 34 never executed; advancing the
