              payload: { operating_day_id: "${d1_id}", hauler_ref: "H-3", waste_stream: "INDUSTRIAL_SPECIAL", manifest_tons: 7.00, load_check_result: "PASS", special_waste_approval_id: "${swa_id}" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { l3_id: $.data.id }
            - call: "POST /waste-loads/${l3_id}/clear-screening"
