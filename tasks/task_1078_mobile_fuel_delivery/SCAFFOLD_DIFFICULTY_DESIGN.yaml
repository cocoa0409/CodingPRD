# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_1078_mobile_fuel_delivery — Expert
# 9 rule_ids x 2 instances = 18 instances
# All monetary literals precomputed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: order_fuel_cost_estimated_vs_final_diverge
        grounds:
          - calculations.order_fuel_cost
          - entities.DeliveryOrder.fields.estimated_fuel_cost_cents
          - entities.DeliveryOrder.fields.final_fuel_cost_cents
        distinguishing_aspect: |
          On the DeliveryOrder domain, estimated_fuel_cost (requested_gallons * creation-price)
          and final_fuel_cost (dispensed_gallons * price-lock-aware price) produce different
          cents for the same order: 12.0*419=5028 vs 10.0*419=4190.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "REGULAR/ZONE_A price 419 effective 2026-04-01; a later 439 price effective 2026-05-15."
            - "Individual customer with an ACTIVE membership (included_deliveries=5, price_lock_enabled=true) and a REGULAR vehicle, tank 40gal, level 0."
            - "Truck with a REGULAR compartment (onboard 100) on a PLANNING ZONE_A route."
            - "Member order requested_gallons=12; taken through route to ARRIVED; clock advanced to 2026-05-20; delivered with dispensed_gallons=10."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 439, effective_date: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Ada Member", email: "ada@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "PLUS", monthly_fee_cents: 3999, included_deliveries: 5, price_lock_enabled: true }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Civic", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /trucks"
              payload: { plate: "TRK-1", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/compartments"
              payload: { fuel_type: "REGULAR", gallons_capacity: 200, gallons_onboard: 100 }
              as: PlatformAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-1", zone: "ZONE_A", window_start: "2026-05-02T06:00:00Z", window_end: "2026-05-02T20:00:00Z", max_stops: 4 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", membership_id: "${mem_id}", zone: "ZONE_A", delivery_address: "1 Main St", requested_gallons: 12, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/assign-route"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /orders/${ord_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "driver-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${ord_id}/deliver"
              payload: { dispensed_gallons: 10 }
              as: Driver
              as_user_id: "driver-1"
              captures: { est: $.data.estimated_fuel_cost_cents, fin: $.data.final_fuel_cost_cents }
          assert:
            - "DeliveryOrder.${ord_id}.estimated_fuel_cost_cents == 5028"
            - "DeliveryOrder.${ord_id}.final_fuel_cost_cents == 4190"
            - "DeliveryOrder.${ord_id}.estimated_fuel_cost_cents != DeliveryOrder.${ord_id}.final_fuel_cost_cents"
            - "DeliveryOrder.${ord_id}.status == DELIVERED"

      - name: membership_period_charge_provisional_vs_final_diverge
        grounds:
          - calculations.membership_period_charge
          - entities.Membership.fields.estimated_next_charge_cents
          - entities.Membership.fields.final_settlement_charge_cents
        distinguishing_aspect: |
          On the Membership domain (different entity from order_fuel_cost), the provisional charge
          is the full fee (3999) while the final settlement subtracts unused-delivery credit
          (3999 - 5*400 = 1999) for the same membership inputs.
        test_recipe:
          setup:
            - "Clock default 2026-05-01T00:00:00Z."
            - "Individual customer with ACTIVE membership: monthly_fee_cents=3999, included_deliveries=5, deliveries_used_this_period=0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ben Member", email: "ben@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "PLUS", monthly_fee_cents: 3999, included_deliveries: 5 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id, prov: $.data.estimated_next_charge_cents }
          trigger:
            - call: "POST /memberships/${mem_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${cust_id}"
              captures: { fin: $.data.final_settlement_charge_cents }
          assert:
            - "Membership.${mem_id}.estimated_next_charge_cents == 3999"
            - "Membership.${mem_id}.final_settlement_charge_cents == 1999"
            - "Membership.${mem_id}.status == CANCELLED"

  - rule_id: combinatorial_formula
    instances:
      - name: service_fee_tiered_conditional_member_overage_priority
        grounds:
          - calculations.service_fee
          - entities.DeliveryOrder.fields.service_fee_cents
          - entities.Membership.fields.included_deliveries
        distinguishing_aspect: |
          Mode (a): service_fee is a >=3-input non-linear branch (membership presence x usage-vs-included
          x is_priority). With included_deliveries=0 the member is over quota (base=600) and is_priority
          adds 500 -> service_fee_cents == 1100.
        test_recipe:
          setup:
            - "REGULAR/ZONE_A price 419 effective 2026-04-01; clock default."
            - "Member with included_deliveries=0 (every delivery is overage), REGULAR vehicle tank 40 level 0."
            - "Truck REGULAR compartment onboard 100 on PLANNING ZONE_A route; priority member order taken to ARRIVED then delivered."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Cara Member", email: "cara@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "BASIC", monthly_fee_cents: 1999, included_deliveries: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Leaf", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /trucks"
              payload: { plate: "TRK-2", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/compartments"
              payload: { fuel_type: "REGULAR", gallons_capacity: 200, gallons_onboard: 100 }
              as: PlatformAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-2", zone: "ZONE_A", window_start: "2026-05-02T06:00:00Z", window_end: "2026-05-02T20:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", membership_id: "${mem_id}", zone: "ZONE_A", delivery_address: "2 Oak St", requested_gallons: 5, is_priority: true, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/assign-route"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /orders/${ord_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "driver-2"
          trigger:
            - call: "POST /orders/${ord_id}/deliver"
              payload: { dispensed_gallons: 5 }
              as: Driver
              as_user_id: "driver-2"
              captures: { fee: $.data.service_fee_cents }
          assert:
            - "DeliveryOrder.${ord_id}.service_fee_cents == 1100"
            - "DeliveryOrder.${ord_id}.status == DELIVERED"

      - name: addon_total_round_per_line_not_round_once
        grounds:
          - calculations.addon_charged_price
          - calculations.order_total
          - entities.DeliveryOrder.fields.addon_total_cents
          - entities.AddOnService.fields.charged_price_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order. Member add-ons rounded per line
          (round(1595*0.9)=1436, round(6495*0.9)=5846) sum to 7282, NOT round((1595+6495)*0.9)=7281.
        test_recipe:
          setup:
            - "REGULAR/ZONE_A price 419 effective 2026-04-01; clock default."
            - "Member (any included) with a REGULAR vehicle; one SCHEDULED member order with a CAR_WASH and an OIL_CHANGE add-on attached."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Dee Member", email: "dee@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "PLUS", monthly_fee_cents: 3999, included_deliveries: 5 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Prius", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", membership_id: "${mem_id}", zone: "ZONE_A", delivery_address: "3 Elm St", requested_gallons: 8, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/addons"
              payload: { addon_type: "CAR_WASH" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { cw_id: $.data.id, cw_price: $.data.charged_price_cents }
          trigger:
            - call: "POST /orders/${ord_id}/addons"
              payload: { addon_type: "OIL_CHANGE" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { oil_id: $.data.id, oil_price: $.data.charged_price_cents }
          assert:
            - "AddOnService.${cw_id}.charged_price_cents == 1436"
            - "AddOnService.${oil_id}.charged_price_cents == 5846"
            - "DeliveryOrder.${ord_id}.addon_total_cents == 7282"

  - rule_id: non_linear_state_machine
    instances:
      - name: delivery_order_reschedule_cycle_returns_to_scheduled
        grounds:
          - state_machines.DeliveryOrder.ARRIVED_to_UNABLE_TO_ACCESS
          - state_machines.DeliveryOrder.UNABLE_TO_ACCESS_to_SCHEDULED
          - entities.DeliveryOrder.fields.status
        distinguishing_aspect: |
          DeliveryOrder is cyclic: ARRIVED -> UNABLE_TO_ACCESS -> (reschedule) -> SCHEDULED,
          re-entering a state it already left. Proves a non-linear loop on the order entity.
        test_recipe:
          setup:
            - "REGULAR/ZONE_A price 419 effective 2026-04-01; clock default."
            - "Individual customer, REGULAR vehicle tank 40 level 0; truck REGULAR compartment onboard 100 on a PLANNING ZONE_A route."
            - "Per-fill order driven to ARRIVED then reported unable-to-access."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Eve Ind", email: "eve@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "Golf", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /trucks"
              payload: { plate: "TRK-3", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/compartments"
              payload: { fuel_type: "REGULAR", gallons_capacity: 200, gallons_onboard: 100 }
              as: PlatformAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-3", zone: "ZONE_A", window_start: "2026-05-02T06:00:00Z", window_end: "2026-05-02T20:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "5 Cyc St", requested_gallons: 8, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/assign-route"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /orders/${ord_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "driver-3"
            - call: "POST /orders/${ord_id}/report-unable-access"
              payload: {}
              as: Driver
              as_user_id: "driver-3"
          trigger:
            - call: "POST /orders/${ord_id}/reschedule"
              payload: { delivery_window_start: "2026-05-03T09:00:00Z", delivery_window_end: "2026-05-03T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "DeliveryOrder.${ord_id}.status == SCHEDULED"
            - "DeliveryOrder.${ord_id}.route_id == null"

      - name: membership_pause_resume_cycle_returns_to_active
        grounds:
          - state_machines.Membership.ACTIVE_to_PAUSED
          - state_machines.Membership.PAUSED_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: |
          Membership (a different entity from DeliveryOrder) is cyclic: ACTIVE -> PAUSED -> ACTIVE,
          returning to a state already occupied. Second non-linear machine on a distinct entity.
        test_recipe:
          setup:
            - "Individual customer with an ACTIVE membership; clock default."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Finn Ind", email: "finn@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "BASIC", monthly_fee_cents: 1999, included_deliveries: 2 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /memberships/${mem_id}/pause"
              payload: {}
              as: Member
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /memberships/${mem_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "Membership.${mem_id}.status == ACTIVE"

  - rule_id: transitive_cascade
    instances:
      - name: deliver_settles_suspends_vehicle_then_suspends_fleet
        grounds:
          - state_machines.DeliveryOrder.ARRIVED_to_DELIVERED
          - state_machines.Vehicle.ACTIVE_to_SUSPENDED
          - state_machines.FleetAccount.ACTIVE_to_SUSPENDED
          - entities.Vehicle.fields.settled_spend_cents
          - entities.FleetAccount.fields.suspended_vehicle_count
        distinguishing_aspect: |
          Depth-3 chain from the deliver trigger: deliver -> Vehicle.settled_spend hits cap ->
          Vehicle SUSPENDED -> FleetAccount.active_vehicle_count reaches 0 -> FleetAccount SUSPENDED.
          Each hop is caused by the prior hop, not by the deliver call directly.
        test_recipe:
          setup:
            - "DIESEL/ZONE_A price 459 effective 2026-04-01; clock default."
            - "FLEET customer + FleetAccount (budget 100000, allowed_fuel_types [DIESEL]) with a SINGLE DIESEL vehicle, monthly_spend_cap_cents=5790, tank 100 level 0."
            - "Truck DIESEL compartment onboard 100 on PLANNING ZONE_A route; one fleet order (10 gal, est_total 5790) driven to ARRIVED."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "DIESEL", zone: "ZONE_A", price_per_gallon_cents: 459, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "GreenFleet", email: "ops@greenfleet.com", customer_type: "FLEET" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { customer_id: "${cust_id}", monthly_budget_cap_cents: 100000, allowed_fuel_types: ["DIESEL"], allowed_addons: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", fleet_account_id: "${fa_id}", make_model: "F250", fuel_type: "DIESEL", tank_capacity_gallons: 100, current_fuel_level_gallons: 0, monthly_spend_cap_cents: 5790 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /trucks"
              payload: { plate: "TRK-4", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/compartments"
              payload: { fuel_type: "DIESEL", gallons_capacity: 200, gallons_onboard: 100 }
              as: PlatformAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-4", zone: "ZONE_A", window_start: "2026-05-02T06:00:00Z", window_end: "2026-05-02T20:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", fleet_account_id: "${fa_id}", zone: "ZONE_A", delivery_address: "9 Depot Rd", requested_gallons: 10, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/assign-route"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /orders/${ord_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "driver-4"
          trigger:
            - call: "POST /orders/${ord_id}/deliver"
              payload: { dispensed_gallons: 10 }
              as: Driver
              as_user_id: "driver-4"
          assert:
            - "DeliveryOrder.${ord_id}.total_cost_cents == 5790"
            - "Vehicle.${veh_id}.settled_spend_cents == 5790"
            - "Vehicle.${veh_id}.status == SUSPENDED"
            - "FleetAccount.${fa_id}.suspended_vehicle_count == 1"
            - "FleetAccount.${fa_id}.active_vehicle_count == 0"
            - "FleetAccount.${fa_id}.status == SUSPENDED"

      - name: membership_cancel_cascades_order_cancel_releases_reservation
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - state_machines.DeliveryOrder.SCHEDULED_to_CANCELLED
          - entities.TruckCompartment.fields.gallons_reserved
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (membership cancel): cancel membership ->
          its ROUTED order CANCELLED -> that order's cancel releases the compartment reservation.
          The reservation release is caused by the order cancel, which is caused by the membership cancel.
        test_recipe:
          setup:
            - "REGULAR/ZONE_A price 419 effective 2026-04-01; clock default."
            - "Individual customer + ACTIVE membership (included 5); REGULAR vehicle tank 40 level 0."
            - "Truck REGULAR compartment onboard 100 on PLANNING ZONE_A route; member order (8 gal) assigned to the route (ROUTED), reserving 8 gal (available 92)."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Gil Ind", email: "gil@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /memberships"
              payload: { customer_id: "${cust_id}", tier: "PLUS", monthly_fee_cents: 3999, included_deliveries: 5 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /vehicles"
