      - name: corner_layer_safety_suspension_freezes_the_stop_and_the_thaw_is_two_steps
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TourStop.safety_state
          - state_machines.TourStop.sales_state
          - calculations.stop_readiness_posture
          - errors.ERR_STOP_FROZEN
          - endpoints[POST /tour-stops/{id}/safety-suspend]
          - endpoints[POST /tour-stops/{id}/safety-reinstate]
          - endpoints[POST /tour-stops/{id}/resume-sales]
        distinguishing_aspect: "One suspend call fans out across three levels and two state dimensions — safety_state, then readiness_posture, then sales_state, then the order and seat ledgers — and it is order-sensitive: PENDING orders void only because sales_state left ON_SALE, while PAID orders are untouched. The reverse path is deliberately NOT symmetric: reinstate restores safety and thaws the posture but leaves sales_state at SALES_HALTED, so a second explicit call is required before the stop can sell again."
        test_recipe:
          setup:
            - "An ON_SALE ATL stop with tier GA (allotment 500), one PAID order of 10 and two PENDING orders of 4 and 6"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Feature", run_order_position: 1, duration_minutes: 40 }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/ticket-tiers"
              payload: { tier_code: "GA", price_cents: 3200, allotment: 500, on_sale_start_utc: "2026-08-01T00:00:00Z", on_sale_end_utc: "2026-11-14T18:00:00Z" }
              as: TicketingManager
              captures: { tier_ga: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/safety-plan"
              payload: { barrier_linear_feet: 1200, catch_fence_height_ft: 6, medical_als_staff_count: 1, medical_bls_staff_count: 2, ambulance_count: 1, emergency_access_lanes: 1 }
              as: SafetyOfficial
              as_user_id: "so-a"
              captures: { plan_atl: "$.data.id" }
            - call: "POST /safety-plans/${plan_atl}/submit"
              payload: {}
              as: SafetyOfficial
              as_user_id: "so-a"
            - call: "POST /safety-plans/${plan_atl}/certify"
              payload: { note: "certified" }
              as: SafetyOfficial
              as_user_id: "so-b"
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { season_v1: "$.data.version" }
            - call: "POST /tour-stops/${stop_atl}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 500000, expected_season_version: "${season_v1}" }
              as: SeriesPromoter
            - call: "POST /tour-stops/${stop_atl}/on-sale"
              payload: {}
              as: TicketingManager
            - call: "GET /ticket-tiers/${tier_ga}"
              payload: {}
              as: TicketingManager
              captures: { gv1: "$.data.version" }
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_ga}", purchaser_name: "Paid Buyer", purchaser_email: "paid@example.com", qty: 10, expected_ticket_tier_version: "${gv1}" }
              as: TicketingManager
              captures: { order_paid: "$.data.id" }
            - call: "POST /ticket-orders/${order_paid}/pay"
              payload: {}
              as: TicketingManager
            - call: "GET /ticket-tiers/${tier_ga}"
              payload: {}
              as: TicketingManager
              captures: { gv2: "$.data.version" }
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_ga}", purchaser_name: "Pending One", purchaser_email: "p1@example.com", qty: 4, expected_ticket_tier_version: "${gv2}" }
              as: TicketingManager
              captures: { order_p1: "$.data.id" }
            - call: "GET /ticket-tiers/${tier_ga}"
              payload: {}
              as: TicketingManager
              captures: { gv3: "$.data.version" }
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_ga}", purchaser_name: "Pending Two", purchaser_email: "p2@example.com", qty: 6, expected_ticket_tier_version: "${gv3}" }
              as: TicketingManager
              captures: { order_p2: "$.data.id" }
            - call: "GET /ticket-tiers/${tier_ga}"
              payload: {}
              as: TicketingManager
              captures: { gv4: "$.data.version" }
          trigger:
            - call: "POST /tour-stops/${stop_atl}/safety-suspend"
              payload: { reason: "catch fencing damaged during load-in" }
              as: SafetyOfficial
              as_user_id: "so-b"
            - call: "GET /ticket-tiers/${tier_ga}"
              payload: {}
              as: TicketingManager
              captures: { gv_after_suspend: "$.data.version" }
            - call: "GET /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", status: "VOID" }
              as: TicketingManager
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_ga}", purchaser_name: "Frozen Buyer", purchaser_email: "frozen@example.com", qty: 2, expected_ticket_tier_version: "${gv_after_suspend}" }
              as: TicketingManager
              captures: { e_frozen_order: "$.data.error_id" }
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "INTERMISSION", title: "Freestyle", run_order_position: 2, duration_minutes: 15 }
              as: SeriesPromoter
              captures: { e_frozen_segment: "$.data.error_id" }
            - call: "POST /tour-stops/${stop_atl}/resume-sales"
              payload: {}
              as: TicketingManager
              captures: { e_resume_while_frozen: "$.data.error_id" }
            - call: "POST /tour-stops/${stop_atl}/safety-reinstate"
              payload: { note: "fencing repaired and re-measured" }
              as: SafetyOfficial
              as_user_id: "so-b"
            - call: "GET /tour-stops/${stop_atl}"
              payload: {}
              as: TicketingManager
            - call: "POST /tour-stops/${stop_atl}/resume-sales"
              payload: {}
              as: TicketingManager
            - call: "GET /ticket-tiers/${tier_ga}"
              payload: {}
              as: TicketingManager
              captures: { gv_final: "$.data.version" }
          assert:
            - "before the suspension the tier reads sold_seat_count 10, reserved_seat_count 10 and available_seat_count 480"
            - "trigger call 1 returns HTTP 200 and the response shows all four cascade levels at once: safety_state == SAFETY_SUSPENDED, readiness_posture == FROZEN, sales_state == SALES_HALTED"
            - "trigger call 2 shows the seat ledger after the fan-out: reserved_seat_count 0, sold_seat_count 10, available_seat_count 490 — the two PENDING holds were released and the PAID 10 were not"
            - "trigger call 3 lists exactly ${order_p1} and ${order_p2} with status VOID and void_reason SALES_HALTED, while GET /ticket-orders/${order_paid} is still PAID with its paid_at intact"
            - "trigger call 4 returns HTTP 409 with ${e_frozen_order} == ERR_STOP_FROZEN, not ERR_SALES_NOT_OPEN: the frozen posture is checked ahead of the sales window"
            - "trigger call 5 returns HTTP 409 with ${e_frozen_segment} == ERR_STOP_FROZEN, showing the freeze reaches writes on a child entity that has nothing to do with ticketing"
            - "trigger call 6 returns HTTP 409 with ${e_resume_while_frozen} == ERR_INVALID_TRANSITION or ERR_STOP_NOT_READY: sales cannot resume while readiness_posture is FROZEN"
            - "trigger call 7 returns HTTP 200 and the reverse path is asymmetric: safety_state == SAFETY_CERTIFIED and readiness_posture == OPEN, but sales_state is still SALES_HALTED and the voided orders are NOT resurrected"
            - "trigger call 8 confirms the same three fields on a fresh read of the aggregate"
            - "trigger call 9 returns HTTP 200 with sales_state == ON_SALE, so the thaw took two explicit calls"
            - "trigger call 10 shows ${gv_final} equals the version after the suspension plus zero further bumps from reinstate and resume-sales, because neither of those touches the seat pool"

      - name: corner_layer_cascade_a_booking_withdrawal_unwind
        claim_type: cascading_side_effects
        grounds:
          - state_machines.VenueBooking
          - state_machines.TourStop.sales_state
        excluded_because:
          difficulty_instance: "multi_level_cascade / withdrawing_a_confirmed_booking_unwinds_stop_orders_tiers_and_season_budget"
          rationale: "CASCADE A is walked there at full depth — booking WITHDRAWN, stop CANCELLED, PENDING orders VOID with seats released, marketing allocations RELEASED and the season pool restored — including the ordering assertion that the season ledger is restored only after the allocations flip."

      - name: corner_layer_cascade_b_tier_creation_decertifies_the_plan
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TourStop.safety_state
