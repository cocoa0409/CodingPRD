# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Home Elevator & Residential Lift Installation
# 26 instances across the nine Difficulty Rules (§0.5).
# Canonical fixture: default logical clock 2026-08-01T00:00:00Z; homeowner user
# id "u-own-1"; money in dollars, 2dp round_half_up.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: project_quote_vs_final_invoice
        grounds:
          - calculations.installation_price_quote
          - calculations.final_invoice_settlement
          - state_machines.Project.REGISTERED_to_CLOSED
        distinguishing_aspect: |
          Project-domain dual variant: the provisional quote (forward-looking, survey
          estimates) and the final invoice (chronological actuals + change-order markup)
          are computed from the same project and MUST differ (33000.00 vs 41300.00).
        test_recipe:
          setup:
            - "Project for property of u-own-1, QUOTED on HYD-100 at contract_price 33000.00 (pit 12/12, overhead 96/96, 2 floors, no structural)"
            - "Change order CO1 5000.00 APPROVED first (no markup), CO2 3000.00 APPROVED second (+10% -> 3300.00)"
            - "Project driven to REGISTERED (permit approved, install complete, acceptance PASSED, certificate issued)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Quinn Inspector", certification: "QEI", home_region: "north" }, as: DealerAdmin, captures: { t_insp: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "Add hall call station", amount: 5000.00 }, as: ProjectCoordinator, captures: { co1: $.data.id } }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "Upgrade cab finish", amount: 3000.00 }, as: ProjectCoordinator, captures: { co2: $.data.id } }
            - { call: "POST /api/change-orders/${co1}/approve", payload: {}, as: Homeowner, as_user_id: "u-own-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /api/change-orders/${co2}/approve", payload: {}, as: Homeowner, as_user_id: "u-own-1" }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", ahj_name: "Springfield AHJ" }, as: ProjectCoordinator, captures: { perm: $.data.id } }
            - { call: "POST /api/permits/${perm}/approve", payload: {}, as: Regulator }
            - { call: "POST /api/projects/${proj}/schedule-installation", payload: { install_start_date: "2026-08-10T08:00:00Z", install_end_date: "2026-08-20T17:00:00Z" }, as: ProjectCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /api/projects/${proj}/complete-installation", payload: { serial_number: "SN-100" }, as: Installer, as_user_id: "${t_inst}" }
            - { call: "GET /api/units?project_id=${proj}", payload: {}, as: ProjectCoordinator, captures: { unit: "$.data[0].id" } }
            - { call: "POST /api/inspections", payload: { unit_id: "${unit}", project_id: "${proj}", inspection_type: "ACCEPTANCE", inspector_technician_id: "${t_insp}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }, as: ProjectCoordinator, captures: { insp: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:05:00Z" }, as: DealerAdmin }
            - { call: "POST /api/inspections/${insp}/record-result", payload: { result: "PASSED" }, as: Inspector, as_user_id: "${t_insp}" }
            - { call: "POST /api/registration-certificates", payload: { unit_id: "${unit}" }, as: ProjectCoordinator, captures: { cert: $.data.id } }
            - { call: "POST /api/registration-certificates/${cert}/issue", payload: {}, as: Regulator }
          trigger:
            - { call: "POST /api/projects/${proj}/close", payload: {}, as: ProjectCoordinator }
          assert:
            - "Project.${proj}.contract_price == 33000.00 (provisional quote)"
            - "Project.${proj}.final_invoice == 41300.00 (33000.00 + 5000.00 + 3300.00)"
            - "Project.${proj}.final_invoice != Project.${proj}.contract_price"
            - "ChangeOrder.${co1}.effective_amount == 5000.00 (first approved: markup waived)"
            - "ChangeOrder.${co2}.effective_amount == 3300.00 (second approved: +10%)"
            - "Project.${proj}.disbursed_grants == 0 and Project.${proj}.homeowner_balance == 41300.00"
            - "Project.${proj}.status == CLOSED"

      - name: grant_provisional_vs_final_award
        grounds:
          - calculations.grant_provisional_award
          - calculations.grant_final_award
          - state_machines.GrantApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          GrantApplication-domain dual variant (different entity domain than the project
          price pair): the provisional award anchors to the contract value at submission
          (8000.00), the final award re-anchors to the value at approval after an approved
          change order (10000.00) — same application, two valid numbers.
        test_recipe:
          setup:
            - "Project QUOTED at contract_price 20000.00 (HYD-050: base 12000.00 + labor 8000.00; survey 10/92/2 fits)"
            - "Grant program: max_award 10000.00, income_cap 60000.00, coverage 0.40, pool 50000.00, window 2026-07-01..2026-12-31"
            - "Application SUBMITTED with household_income 42000.00 -> provisional_award 8000.00"
            - "Change order 5000.00 APPROVED, raising current contract value to 25000.00"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "2 Oak Ave", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-050", drive_type: "HYDRAULIC", min_pit_depth_inches: 8, min_overhead_clearance_inches: 90, capacity_lbs: 500, base_price: 12000.00, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 10, measured_overhead_clearance_inches: 92, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
            - { call: "POST /api/grant-programs", payload: { program_name: "AccessGrant", funder_name: "State ADA Fund", max_award: 10000.00, income_cap: 60000.00, coverage_percent: 0.40, total_pool: 50000.00, application_open_date: "2026-07-01T00:00:00Z", application_close_date: "2026-12-31T23:59:59Z", eligible_project_types: ["NEW_INSTALLATION", "MODERNIZATION"] }, as: DealerAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/grant-applications", payload: { project_id: "${proj}", program_id: "${prog}", household_income: 42000.00 }, as: Homeowner, as_user_id: "u-own-1", captures: { app: $.data.id } }
            - { call: "POST /api/change-orders", payload: { project_id: "${proj}", description: "Widen doorway", amount: 5000.00 }, as: ProjectCoordinator, captures: { co1: $.data.id } }
            - { call: "POST /api/change-orders/${co1}/approve", payload: {}, as: Homeowner, as_user_id: "u-own-1" }
          trigger:
            - { call: "POST /api/grant-applications/${app}/approve", payload: { verified_income: 42000.00 }, as: GrantOfficer }
          assert:
            - "GrantApplication.${app}.provisional_award == 8000.00 (0.40 x 20000.00 at submission)"
            - "GrantApplication.${app}.final_award == 10000.00 (min(0.40 x 25000.00, 10000.00, pool))"
            - "GrantApplication.${app}.final_award != GrantApplication.${app}.provisional_award"
            - "GrantProgram.${prog}.remaining_pool == 40000.00"
            - "GrantApplication.${app}.status == APPROVED"

      - name: entrapment_estimate_vs_final_bill
        grounds:
          - calculations.entrapment_billing
          - state_machines.ServiceCall.ON_SITE_to_RESOLVED
        distinguishing_aspect: |
          ServiceCall-domain dual variant (third entity domain): the dispatch-time
          provisional estimate is a flat tier constant (150.00 STANDARD), while the final
          billable is computed from actual timestamps (half-hour rounding x after-hours
          1.5 x tier 0.5): 197.50 — same call, two valid numbers.
        test_recipe:
          setup:
            - "Unit IN_SERVICE/REGISTERED under STANDARD contract (sla 120 min, 50% discount) on property of u-own-1"
            - "ENTRAPMENT call reported 2026-09-10T17:30:00Z, dispatched to CET installer; arrival 19:00 (90 min, no breach); resolved 20:15 with parts 125.00"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Quinn Inspector", certification: "QEI", home_region: "north" }, as: DealerAdmin, captures: { t_insp: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", ahj_name: "Springfield AHJ" }, as: ProjectCoordinator, captures: { perm: $.data.id } }
            - { call: "POST /api/permits/${perm}/approve", payload: {}, as: Regulator }
            - { call: "POST /api/projects/${proj}/schedule-installation", payload: { install_start_date: "2026-08-10T08:00:00Z", install_end_date: "2026-08-20T17:00:00Z" }, as: ProjectCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /api/projects/${proj}/complete-installation", payload: { serial_number: "SN-100" }, as: Installer, as_user_id: "${t_inst}" }
            - { call: "GET /api/units?project_id=${proj}", payload: {}, as: ProjectCoordinator, captures: { unit: "$.data[0].id" } }
            - { call: "POST /api/inspections", payload: { unit_id: "${unit}", project_id: "${proj}", inspection_type: "ACCEPTANCE", inspector_technician_id: "${t_insp}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }, as: ProjectCoordinator, captures: { insp: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:05:00Z" }, as: DealerAdmin }
            - { call: "POST /api/inspections/${insp}/record-result", payload: { result: "PASSED" }, as: Inspector, as_user_id: "${t_insp}" }
            - { call: "POST /api/registration-certificates", payload: { unit_id: "${unit}" }, as: ProjectCoordinator, captures: { cert: $.data.id } }
            - { call: "POST /api/registration-certificates/${cert}/issue", payload: {}, as: Regulator }
            - { call: "POST /api/service-contracts", payload: { unit_id: "${unit}", tier: "STANDARD", contract_year_start: "2026-09-01T00:00:00Z" }, as: ProjectCoordinator, captures: { ctr: $.data.id } }
            - { call: "POST /api/service-contracts/${ctr}/activate", payload: {}, as: ProjectCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T17:30:00Z" }, as: DealerAdmin }
            - { call: "POST /api/service-calls", payload: { unit_id: "${unit}", call_type: "ENTRAPMENT", description: "Passenger trapped" }, as: Homeowner, as_user_id: "u-own-1", captures: { call: $.data.id } }
            - { call: "POST /api/service-calls/${call}/dispatch", payload: { technician_id: "${t_inst}" }, as: ProjectCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T19:00:00Z" }, as: DealerAdmin }
            - { call: "POST /api/service-calls/${call}/arrive", payload: {}, as: Installer, as_user_id: "${t_inst}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T20:15:00Z" }, as: DealerAdmin }
          trigger:
            - { call: "POST /api/service-calls/${call}/resolve", payload: { resolution_notes: "Freed passenger, reset brake", parts_cost: 125.00 }, as: Installer, as_user_id: "${t_inst}" }
          assert:
            - "ServiceCall.${call}.provisional_estimate == 150.00 (STANDARD dispatch estimate)"
            - "ServiceCall.${call}.final_billable == 197.50 (ceil(75/30)=3 x 60.00 = 180.00 x1.5 after-hours = 270.00 + 125.00 parts = 395.00 x 0.50 STANDARD)"
            - "ServiceCall.${call}.final_billable != ServiceCall.${call}.provisional_estimate"
            - "ServiceCall.${call}.sla_breached == false (90 min <= 120)"
            - "ServiceCall.${call}.status == RESOLVED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_structural_tiers_and_floors
        grounds:
          - calculations.installation_price_quote
          - entities.Project.fields.requires_structural
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction — pit shortfall
          (4) x tiered per-inch rate, overhead shortfall (4) x its own rate, a conditional
          STRUCTURAL_BASE_FEE keyed on requires_structural, and a per-floor increment for
          floors beyond 2: 30000.00 + 9500.00 + (1500.00 + 1000.00 + 600.00) + 1500.00 = 44100.00.
        test_recipe:
          setup:
            - "Property with survey: pit 12, overhead 96, floors 4; catalog model HYD-200 requires pit 16 / overhead 100 (shortfalls 4 and 4, both correctable)"
            - "Contractor BuildCo ACTIVE (required because requires_structural)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "7 Hill Ct", state_code: "WA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/contractors", payload: { company_name: "BuildCo", license_number: "LIC-100", license_state_code: "WA" }, as: DealerAdmin, captures: { gc: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-200", drive_type: "HYDRAULIC", min_pit_depth_inches: 16, min_overhead_clearance_inches: 100, capacity_lbs: 950, base_price: 30000.00, install_labor_price: 9500.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 4 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
          trigger:
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", contractor_id: "${gc}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
          assert:
            - "Project.${proj}.requires_structural == true"
            - "Project.${proj}.structural_estimate == 3100.00 (1500.00 base + 4 x 250.00 pit + 4 x 150.00 overhead)"
            - "Project.${proj}.contract_price == 44100.00 (30000.00 + 9500.00 + 3100.00 + (4-2) x 750.00)"
            - "Project.${proj}.status == QUOTED"

      - name: permit_fee_per_component_rounding
        grounds:
          - calculations.permit_fee
          - entities.PermitApplication.fields.fee
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-component-then-sum. At
          contract_price 16666.67 the percentage components are 250.00005 -> 250.00,
          66.66668 -> 66.67, 116.66669 -> 116.67; pinned total 783.34, whereas the
          rejected sum-then-round order yields 783.33 — a one-cent divergence.
        test_recipe:
          setup:
            - "Project QUOTED at contract_price 16666.67 (HYD-300 base 8666.67 + labor 8000.00; survey 10/92/2 floors)"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "9 Fern Way", state_code: "OR" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "south" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "south" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-300", drive_type: "TRACTION", min_pit_depth_inches: 8, min_overhead_clearance_inches: 90, capacity_lbs: 700, base_price: 8666.67, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 10, measured_overhead_clearance_inches: 92, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
          trigger:
            - { call: "POST /api/permits", payload: { project_id: "${proj}", ahj_name: "Portland AHJ" }, as: ProjectCoordinator, captures: { perm: $.data.id } }
          assert:
            - "PermitApplication.${perm}.fee == 783.34 (250.00 base + 100.00 floors + 250.00 + 66.67 + 116.67, per-component round_half_up)"
            - "PermitApplication.${perm}.fee != 783.33 (the sum-then-round alternative is rejected)"
            - "Project.${proj}.status == PERMIT_IN_PROGRESS"

      - name: grant_waterfall_circular_balance
        grounds:
          - calculations.grant_disbursement_waterfall
          - state_machines.GrantApplication.APPROVED_to_DISBURSED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: homeowner_balance depends on disbursements
          while each disbursement is capped by the remaining balance — pinned evaluation
          order approved_at ASC makes it well-defined: three awards 10000/6000/25000
          against a 33000.00 invoice disburse 10000/6000/17000 (third is partial).
        test_recipe:
          setup:
            - "Project (HYD-100, contract_price 33000.00) driven to REGISTERED"
            - "Three programs, one APPROVED application each: A1 award 10000.00 (cov 0.40), A2 award 6000.00 (cov 0.30), A3 award 25000.00 (cov 0.80), approved on successive days"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
