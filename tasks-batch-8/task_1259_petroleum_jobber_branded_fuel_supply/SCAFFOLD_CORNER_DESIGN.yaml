              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STORAGE_TANK_NOT_FOUND (404)"

      - name: safe_fill_equality_allowed
        claim_type: satisfaction_pass
        grounds: ["validations[priority=7]", "errors[ERR_SAFE_FILL_EXCEEDED]"]
        distinguishing_aspect: "Safe-fill boundary: planned 8000 + physical 11000 == capacity 20000 * 0.95 == 19000 exactly — equality is ALLOWED (rejection requires strict >)."
