  - section: endpoints
    instances:
      - name: clock_endpoint_defaults_and_sets_logical_time
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.Port.fields.created_at
        distinguishing_aspect: "Before any clock call the logical clock reads exactly 2026-08-01T00:00:00Z and must not fall back to wall-clock time, so a row created first carries created_at 2026-08-01T00:00:00Z; after POST /_clock/set_current_utc the next row carries the new instant, proving every timestamp is drawn from the logical clock rather than from the host."
        test_recipe:
          setup:
            - "A completely fresh store with no clock call issued yet"
            - "One Port created before the clock is ever set"
          setup_api_calls:
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2 }
              as: OpsCoordinator
              captures: { port_a: $.data.id }
          trigger:
            - call: "GET /ports/${port_a}"
              payload: {}
              as: OpsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:15:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "SGSIN", name: "Singapore", eca_zone: false, notice_lead_hours: 12, concurrent_ops_capacity: 4 }
              as: OpsCoordinator
              captures: { port_b: $.data.id }
            - call: "GET /ports/${port_b}"
              payload: {}
              as: OpsCoordinator
          assert:
            - "Trigger 1 returns HTTP 200 with Port.${port_a}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "Trigger 2 returns HTTP 200"
            - "Trigger 4 returns HTTP 200 with Port.${port_b}.created_at == 2026-08-05T09:15:00Z"
            - "Port.${port_a}.created_at is unchanged at 2026-08-01T00:00:00Z (moving the clock does not rewrite existing rows)"

