        and the same 2500 miles used
      - 'monthly_prorated on the FULL_SERVICE car: blocks == ceil(60 / 30) == 2, included_miles == 2000,
        overage 500, so CarReturn.mileage_overage_cents == ${over_a} == 6000'
      - 'term_trailing on the NET car: its term 2026-09-04..2026-10-04 is 30 days, shorter than the 60-day
        placement, so included_miles == mileage_allowance 1000 once and overage 1500, giving ${over_b}
        == 18000'
      - The divergence is exactly 12000 cents == 18000 - 6000, equal to the 1000 extra overage miles times
        the 12-cent rate
      - 'The trigger is the contract pair (lease_type NET and term shorter than the placement), not the
        car or the mileage: the two cars and their mileage figures are identical'
      - A NET contract whose term outlasts the placement would fall back to monthly_prorated, so the term-length
        comparison is part of the selection rule
