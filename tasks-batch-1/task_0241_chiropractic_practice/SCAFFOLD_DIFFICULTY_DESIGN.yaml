            # fifth visit (ordinal 5 -> overage)
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-04-10T15:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { a5: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${a5}/check-in"
