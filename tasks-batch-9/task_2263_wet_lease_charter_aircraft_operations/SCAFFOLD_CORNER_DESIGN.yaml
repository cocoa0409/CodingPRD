          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI, rate 480000 cents/block hour, mgh 5, shortfall_credit_pct 0.60, term 2026-09-01..2026-12-31 so the guarantee is not prorated."
            - "One REVENUE leg 2026-09-08T06:00:00Z-08:35:30Z, dispatched at 06:10:00Z and still DISPATCHED."
