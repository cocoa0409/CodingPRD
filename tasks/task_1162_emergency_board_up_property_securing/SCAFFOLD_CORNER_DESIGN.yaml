# =============================================================================
# Task 1162 — Emergency Board-Up & Property Securing — §1.9 Corner Design
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Every recipe is self-contained from an empty DB.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: market_creation_echo_and_system_fields
        claim_type: creation
        grounds: [entities.Market, "endpoints.POST /markets"]
        distinguishing_aspect: "POST /markets returns 201 with all 17 config fields echoed, a UUID id, version 1, and created_at stamped from the unset logical clock 2026-05-01T00:00:00Z."
        test_recipe:
          setup: ["Empty database; clock never set"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id, m1_v: $.data.version, m1_ct: $.data.created_at }
          trigger:
            - call: "GET /markets/${m1}"
              as: Dispatcher
              captures: { m1_code: $.data.code }
          assert:
            - "Market[${m1}].version == 1 and created_at == 2026-05-01T00:00:00Z (unset clock default)"
            - "GET read-back: code == SEA, generator_pool_units == 2, removal_flat_fee_cents == 25000"

      - name: job_customer_id_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Job.fields.customer_id]
        distinguishing_aspect: "Job.customer_id is derived from the property's customer; a client-supplied customer_id on POST /jobs is ignored, not stored."
        test_recipe:
          setup: ["Market m1; customer cu; property pr owned by cu"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "FIRE", priority: "P2", customer_id: "00000000-0000-0000-0000-000000000000" }
              as: Dispatcher
              captures: { j: $.data.id, j_cust: $.data.customer_id }
          assert:
            - "Job[${j}].customer_id == ${cu} (derived from Property.customer_id; injected UUID ignored)"
            - "Job[${j}].sla_minutes == 480 (P2 snapshot from market)"

      - name: create_job_missing_required_property_id
        claim_type: required_fields
        grounds: [entities.Job.fields.property_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required property_id on POST /jobs fails schema validation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /jobs"
              payload: { incident_type: "FIRE", priority: "P2" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400); no job persisted"

      - name: create_job_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Job.fields.incident_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "incident_type outside {FIRE, STORM, VANDALISM} is rejected with ERR_INVALID_ENUM (400) before any state change."
        test_recipe:
          setup: ["Market m1; customer cu; property pr"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "HAIL", priority: "P2" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_ENUM (400); no job persisted"

      - name: get_job_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET /jobs/{id}"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /jobs/00000000-0000-0000-0000-000000000000"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (404)"

      - name: list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, "endpoints.GET /jobs"]
        distinguishing_aspect: "GET /jobs honors limit/offset with the fixed envelope fields total_count and has_more: page 1 of 2 jobs has has_more true, page 2 has has_more false."
        test_recipe:
          setup: ["Market m1; customer cu; property pr; two jobs j1, j2 on pr"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "FIRE", priority: "P3" }
              as: Dispatcher
              captures: { j1: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { j2: $.data.id }
          trigger:
            - call: "GET /jobs"
              payload: { limit: 1, offset: 0 }
              as: Dispatcher
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /jobs"
              payload: { limit: 1, offset: 1 }
              as: Dispatcher
          assert:
            - "Page 1: exactly 1 row, total_count == 2, has_more == true"
            - "Page 2: exactly 1 row, total_count == 2, has_more == false"
            - "page1_first != Job[${j2}] ordering note: rows are returned in created_at ASC order, so page1_first == ${j1}"

      - name: scope_item_door_count_default_zero
        claim_type: defaults
        grounds: [entities.ScopeItem.fields.door_count, calculations.scope_planned_quantity]
        distinguishing_aspect: "Omitting door_count on a BOARD scope item applies the default 0 — planned_qty 2 for 4 openings of 48x36in (no framing sheet added)."
        test_recipe:
          setup: ["Market m1; customer cu; property pr (LOW wind); job j in INTAKE"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { j: $.data.id, jv1: $.data.version }
          trigger:
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "BOARD", opening_count: 4, width_in: 48, height_in: 36, expected_job_version: "${jv1}" }
              as: Dispatcher
              captures: { si: $.data.id, qty: $.data.planned_qty }
          assert:
            - "ScopeItem[${si}].door_count == 0 (default applied)"
            - "ScopeItem[${si}].planned_qty == 2 (ceil(48/32); no door framing)"

      - name: subcontractor_computed_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Subcontractor.fields.status, entities.Subcontractor.fields.completed_job_count]
        distinguishing_aspect: "Injecting status SUSPENDED or completed_job_count 99 into POST /subcontractors is ignored: the new subcontractor starts ACTIVE with zeroed counters and reliability 1.0."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /subcontractors"
              payload: { legal_name: "Gamed Crew", status: "SUSPENDED", completed_job_count: 99, reliability_score_lenient: 0.1 }
              as: PlatformAdmin
              captures: { s: $.data.id }
          assert:
            - "Subcontractor[${s}].status == ACTIVE (injected SUSPENDED ignored)"
            - "Subcontractor[${s}].completed_job_count == 0 and reliability_score_lenient == 1.0 (zero-denominator default)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdraw_completed_assignment_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Assignment.terminal_states, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Withdrawing a COMPLETED assignment hits the terminal lockdown: ERR_ALREADY_TERMINAL, no state change, no capacity drift."
        test_recipe:
          setup: ["Job P3 SECURED in SEA; its assignment COMPLETED via complete-securing"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Alpha Board" }
              as: PlatformAdmin
              captures: { sa: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Beta Inspect" }
              as: PlatformAdmin
              captures: { sb: $.data.id }
            - call: "POST /coverages"
              payload: { subcontractor_id: "${sa}", market_id: "${m1}", max_concurrent_jobs: 2, rank: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "FIRE", priority: "P3" }
              as: Dispatcher
              captures: { j: $.data.id }
            - call: "POST /jobs/${j}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { as1: $.data.id }
            - call: "POST /assignments/${as1}/respond"
              payload: { outcome: "ACCEPT" }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/check-in"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/safety-assessments"
              payload: { hazards: ["WATER"] }
              as: Subcontractor
              as_user_id: "${sb}"
            - call: "GET /jobs/${j}"
              as: Dispatcher
              captures: { jv1: $.data.version }
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "BOARD", opening_count: 1, width_in: 48, height_in: 36, door_count: 0, expected_job_version: "${jv1}" }
              as: Dispatcher
              captures: { si: $.data.id }
            - call: "POST /scope-items/${si}/install"
              payload: { opening_count: 1, width_in: 48, height_in: 36, door_count: 0 }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/complete-securing"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "GET /assignments/${as1}"
              as: Dispatcher
              captures: { st_before: $.data.status }
          trigger:
            - call: "POST /assignments/${as1}/withdraw"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "GET /assignments/${as1}"
              as: Dispatcher
              captures: { st_after: $.data.status }
          assert:
            - "st_before == COMPLETED"
            - "err == ERR_ALREADY_TERMINAL (409)"
            - "st_after == COMPLETED (no transition fired)"

      - name: closed_job_terminal_lockdown_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Job.terminal_states, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A CLOSED job rejects every action endpoint — dispatch returns ERR_ALREADY_TERMINAL; the full happy path (secure -> bill -> pay -> verify -> remove -> final bill -> pay -> close) is exercised to reach CLOSED."
        test_recipe:
          setup: ["PDX market (no permit/notification); job P3 fully processed to CLOSED"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Portland", code: "PDX", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: false, notification_required: false, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4000, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Alpha Board" }
              as: PlatformAdmin
              captures: { sa: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Beta Inspect" }
              as: PlatformAdmin
              captures: { sb: $.data.id }
            - call: "POST /coverages"
              payload: { subcontractor_id: "${sa}", market_id: "${m2}", max_concurrent_jobs: 2, rank: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m2}", address_line: "7 Ash Ave", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "FIRE", priority: "P3" }
              as: Dispatcher
              captures: { j: $.data.id }
            - call: "POST /jobs/${j}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { as1: $.data.id }
            - call: "POST /assignments/${as1}/respond"
              payload: { outcome: "ACCEPT" }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/check-in"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/safety-assessments"
              payload: { hazards: ["WATER"] }
              as: Subcontractor
              as_user_id: "${sb}"
            - call: "GET /jobs/${j}"
              as: Dispatcher
              captures: { jv1: $.data.version }
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "BOARD", opening_count: 1, width_in: 48, height_in: 36, door_count: 0, expected_job_version: "${jv1}" }
              as: Dispatcher
              captures: { si: $.data.id }
            - call: "POST /scope-items/${si}/install"
              payload: { opening_count: 1, width_in: 48, height_in: 36, door_count: 0 }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/complete-securing"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/document-packages"
              payload: {}
              as: Dispatcher
              captures: { pkg: $.data.id, pv1: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv1}" }
              as: Dispatcher
              captures: { pv2: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv2}" }
              as: Dispatcher
              captures: { pv3: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "AUTHORIZATION", expected_package_version: "${pv3}" }
              as: Dispatcher
              captures: { pv4: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "MEASUREMENT_SHEET", expected_package_version: "${pv4}" }
              as: Dispatcher
            - call: "POST /jobs/${j}/invoices"
              payload: { variant: "PROVISIONAL" }
              as: Dispatcher
              captures: { invp: $.data.id }
            - call: "POST /invoices/${invp}/submit"
              payload: {}
              as: Dispatcher
            - call: "POST /invoices/${invp}/record-payment"
              payload: {}
              as: Dispatcher
            - call: "POST /jobs/${j}/verify-repair"
              payload: { outcome: "VERIFIED" }
              as: Customer
              as_user_id: "${cu}"
            - call: "POST /jobs/${j}/record-removal"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/invoices"
              payload: { variant: "FINAL" }
              as: Dispatcher
              captures: { invf: $.data.id }
            - call: "POST /invoices/${invf}/submit"
              payload: {}
              as: Dispatcher
            - call: "POST /invoices/${invf}/record-payment"
              payload: {}
              as: Dispatcher
            - call: "POST /jobs/${j}/close"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /jobs/${j}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Job reached CLOSED via REMOVED -> CLOSED (final invoice paid)"
            - "Invoice final total_cents == 29000 (work 4000 + removal 25000)"
            - "err == ERR_ALREADY_TERMINAL (terminal state lockdown)"

      - name: job_initial_state_intake
        claim_type: initial_state
        grounds: [state_machines.Job.initial_state]
        distinguishing_aspect: "A newly created job starts INTAKE with safety_cleared false, compliance_breach false, version 1 and derived sla_minutes snapshotted from the market."
        test_recipe:
          setup: ["Market m1; customer cu; property pr"]
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { j: $.data.id }
          assert:
            - "Job[${j}].work_status == INTAKE"
            - "Job[${j}].safety_cleared == false and compliance_breach == false"
            - "Job[${j}].version == 1 and sla_minutes == 1440 (P3)"
            - "Job[${j}].reported_at == 2026-05-01T00:00:00Z (unset clock default)"

      - name: offer_expired_respond_triggers_reoffer
        claim_type: side_effect_execution
        grounds: [state_machines.Assignment.OFFERED_to_EXPIRED, "errors[ERR_OFFER_EXPIRED]", calculations.dispatch_selection]
        distinguishing_aspect: "Answering 31 minutes after the offer expires fails with ERR_OFFER_EXPIRED, flips the offer to EXPIRED, and immediately re-offers to the next-ranked covered subcontractor with offer_seq 2 while the job stays DISPATCHED."
        test_recipe:
          setup: ["Subs sg (rank 1) and sh (rank 2) both covered in SEA; job dispatched (offer to sg); clock advanced 31 minutes"]
          setup_api_calls:
            - call: "POST /markets"
