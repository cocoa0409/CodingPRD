  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_entry_charge
        claim_type: immediate_visibility
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: the entry-create response already carries fee_cents, and the very next reads show the debited club balance and the incremented section count — no eventual lag."
        test_recipe:
          setup: ["Season ACTIVE; club A funded 5000; tournament REGISTRATION_OPEN fee 1035 early-bird 10% (932)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 5000, memo: "fund", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments", payload: { season_id: "${sid}", name: "T", start_date: "2026-10-02", end_date: "2026-10-03", entry_fee_cents: 1035, early_bird_deadline: "2026-09-15T00:00:00Z", early_bird_discount_pct: 0.10, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/tournaments/${t_id}/open-registration", payload: {}, as: FederationAdmin }
            - { call: "POST /api/tournaments/${t_id}/sections", payload: { name: "Open", min_rating: 0, max_rating: 2900, allow_provisional: true, max_entries: 10 }, as: FederationAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /api/sections/${sec}/entries", payload: { player_id: "${p1}" }, as: ClubCoach, as_user_id: "${coach_a}", captures: { fee: $.data.fee_cents, est: $.data.status } }
            - { call: "GET /api/clubs/${club_a}", as: FederationAdmin, captures: { bal: $.data.account_balance_cents } }
            - { call: "GET /api/sections/${sec}", as: FederationAdmin, captures: { cnt: $.data.current_entries } }
          assert:
            - "Create response: fee_cents == 932, status == REGISTERED (${fee}, ${est})"
            - "Immediate read: club balance == 4068 (5000 - 932) and section current_entries == 1 (${bal}, ${cnt})"

  # =====================================================================
  # Section: state_machines (excluded stubs — covered by §1.8)
  # =====================================================================
  - section: state_machines
    instances:
      - name: meet_cycle_covered
        claim_type: valid_transition
        grounds:
          - "state_machines.Meet"
        excluded_because: { difficulty_instance: meet_postpone_reschedule_cycle, rationale: "Cyclic postpone/reschedule laps asserted in §1.8." }
      - name: tournament_reopen_cycle_covered
        claim_type: valid_transition
        grounds:
          - "state_machines.Tournament"
        excluded_because: { difficulty_instance: tournament_registration_reopen_cycle, rationale: "Registration close/reopen lap asserted in §1.8." }
      - name: dispute_fork_covered
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Dispute"
        excluded_because: { difficulty_instance: dispute_fork_divergent_side_effects, rationale: "UPHELD vs OVERTURNED divergent side effects asserted in §1.8." }
  # =====================================================================
  # Section: cross_cutting_layers (excluded stubs)
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: cascade_chains_covered
        claim_type: cascade_chain
        grounds:
          - "state_machines.Tournament"
          - "state_machines.Dispute"
        excluded_because: { difficulty_instance: dispute_overturn_rating_rebase_cascade, rationale: "Depth-4 and depth-2 cascades asserted in §1.8 rule 4 instances." }
      - name: dual_variant_layer_covered
        claim_type: dual_variant
        grounds:
          - "calculations.rating_update"
          - "calculations.travel_stipend"
        excluded_because: { difficulty_instance: provisional_vs_established_rating_divergence, rationale: "Both dual-variant calcs asserted in §1.8 rule 1 instances." }
      - name: threshold_layer_covered
        claim_type: rate_threshold
        grounds:
          - "calculations.entry_fee"
          - "calculations.membership_fee"
        excluded_because: { difficulty_instance: section_rating_band_inclusive_max, rationale: "Boundary-precision threshold behavior asserted in §1.8 rule 6 instances and §1.9 deadline boundary instances." }
