  instances:
  - name: carrier_verify_authority_from_pending_is_the_only_first_step
    claim_type: Valid Transition
    grounds:
    - state_machines.Carrier.PENDING_to_AUTHORITY_VERIFIED
    - endpoints.POST_/v1/carriers/{id}/verify-authority
    distinguishing_aspect: A freshly onboarded carrier is PENDING with operating_authority_status NONE; the authority endpoint
      moves it to AUTHORITY_VERIFIED and flips operating_authority_status to ACTIVE with authority_verified_at stamped, and
      a second call from AUTHORITY_VERIFIED is not a declared transition.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One carrier onboarded, no equipment.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/carriers
        payload:
          legal_name: Okafor Freight Systems Inc
          mc_number: '100001'
          dot_number: DOT-100001
          insurance_expires_at: '2027-06-01T00:00:00Z'
          insurance_liability_limit_cents: 100000000
          cargo_coverage_limit_cents: 175000000
          safety_score: 72.0
          equipment_types:
          - DRY_VAN
