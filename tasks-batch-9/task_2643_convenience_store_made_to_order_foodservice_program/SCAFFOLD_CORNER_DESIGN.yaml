              captures: { b1_lead: "$.data[0].lead_seconds", b2_lead: "$.data[1].lead_seconds", b2_prom: "$.data[1].promised_ready_at" }
            - call: "GET /stores/${store_id}/kitchen-queue"
              payload: {}
              as: ShiftLead
