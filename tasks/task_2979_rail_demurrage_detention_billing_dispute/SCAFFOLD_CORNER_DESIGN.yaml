        distinguishing_aspect: |
          limit must be an integer in 1..100, so limit=0 is 400
          ERR_INVALID_PAGINATION rather than an empty 200 page — and the
          pagination band sits below role and existence, so the caller must
          already be authorised for the list before it sees this code.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
