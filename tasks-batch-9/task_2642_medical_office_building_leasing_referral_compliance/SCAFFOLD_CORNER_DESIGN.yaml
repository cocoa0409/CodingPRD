      - name: qualified_appraisal_expires_on_close_and_marks_the_lease_stale
        claim_type: valid_transition
        grounds:
          - state_machines[Appraisal].transitions[QUALIFIED -> EXPIRED]
          - entities.Appraisal.fields.expires_on
          - calculations.effective_base_rent_annual.variants
        distinguishing_aspect: "A QUALIFIED appraisal auto-expires 365 days after its appraisal_date on the first close past that date, and because it was the controlling row the lease's fmv_certification_status flips CERTIFIED -> STALE, which switches the rent calculation back to the PROVISIONAL_PUBLISHED variant."
