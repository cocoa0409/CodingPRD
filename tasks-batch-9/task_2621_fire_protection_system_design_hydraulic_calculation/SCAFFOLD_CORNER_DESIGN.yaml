              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 1, pipe_size_in: "2", length_ft: 150.0, fitting_equivalent_ft: 40.0, flow_gpm: 110.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 2, pipe_size_in: "4", length_ft: 90.0, fitting_equivalent_ft: 5.0, flow_gpm: 420.0, elevation_change_ft: 0.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-14", static_psi: 80.0, residual_psi: 64.0, flow_gpm: 2250.0, tested_at: "2026-05-14T15:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft1: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft1}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_prelim: $.data.id }
            - call: "POST /hydraulic-calculations/${hc1}/iterations"
              payload: { iteration_index: 3, pipe_size_in: "6", length_ft: 60.0, fitting_equivalent_ft: 5.0, flow_gpm: 880.0, elevation_change_ft: 8.0, is_supply_connection: true }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-22", static_psi: 50.0, residual_psi: 30.0, flow_gpm: 4000.0, tested_at: "2026-06-20T10:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ft2: $.data.id }
            - call: "POST /water-supply-evaluations"
              payload: { project_id: "${p1}", flow_test_id: "${ft2}", governing_hydraulic_calculation_id: "${hc1}", evaluation_basis: "RAW_TEST" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_bad: $.data.id, wse_v: $.data.version }
          trigger:
            - call: "POST /fire-pumps"
              payload: { project_id: "${p1}", water_supply_evaluation_id: "${wse_bad}", model_tag: "PUMP-A", expected_water_supply_evaluation_version: "${wse_v}" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { fp1: $.data.id }
            - call: "POST /fire-pumps"
              payload: { project_id: "${p1}", water_supply_evaluation_id: "${wse_bad}", model_tag: "PUMP-B", expected_water_supply_evaluation_version: "${wse_v}" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err: $.data.error_id }
            - call: "GET /water-supply-evaluations/${wse_bad}"
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { wse_v2: $.data.version }
            - call: "POST /fire-pumps"
              payload: { project_id: "${p1}", water_supply_evaluation_id: "${wse_bad}", model_tag: "PUMP-C", expected_water_supply_evaluation_version: "${wse_v2}" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err2: $.data.error_id }
          assert:
            - "trigger 1: HTTP 201 with FirePump.${fp1}.rated_flow_gpm == 2500, sizing_verdict == ACCEPTABLE, state == SIZED"
            - "after trigger 1: WaterSupplyEvaluation.${wse_bad}.pump_sized == true and version == ${wse_v} + 1"
            - "trigger 2: HTTP 412 with error_id == ERR_STALE_SUPPLY_EVALUATION_VERSION"
            - "after trigger 2: exactly one FirePump row exists for the project"
            - "trigger 4: HTTP 409 with error_id == ERR_PUMP_ALREADY_SIZED - the version is current, the state is not"
            - "${wse_v2} == ${wse_v} + 1 - one write, one increment"

      - name: auxiliary_ledger_field_reconciles_after_create_after_commission_and_after_withdrawal
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
          - calculations.project_demand_ledger
          - entities.Project.fields.auxiliary_demand_gpm
          - state_machines.AuxiliarySystem.PROPOSED_to_COMMISSIONED
          - state_machines.AuxiliarySystem.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          The derived field is checked after all three kinds of source mutation, including the one that
          must NOT move it: three creates take it from 0.0 to 750.0 to 910.0 to 1010.0, commissioning
          the hose station leaves it at exactly 1010.0 because the roll-up spans every status except
          WITHDRAWN, and withdrawing the 160.0 gpm cooking line takes it to 850.0 - the arithmetic
          inverse, with no accumulated drift and with the withdrawn row's own demand_gpm still readable.
        test_recipe:
          setup:
            - "Project FP-2601 with no hydraulic calculation, so governing_demand_gpm stays 0.0 and the total equals the auxiliary roll-up"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "COOKING", label: "Kitchen hood line", appliance_count: 4, water_wash_enabled: true, agent_type: "WET_CHEMICAL" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux_cook: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_II", label: "Hose station", riser_count: 1 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux_hose: $.data.id }
            - call: "POST /auxiliary-systems/${aux_hose}/commission"
              payload: { outage_start_at: "2026-09-05T08:00:00Z", outage_end_at: "2026-09-05T12:00:00Z" }
              as: Contractor
            - call: "POST /auxiliary-systems/${aux_cook}/withdraw"
              payload: { withdraw_note: "Kitchen deleted from the tenant fit out" }
              as: DesignEngineer
              as_user_id: "${e1}"
          assert:
            - "after trigger 1: Project.${p1}.auxiliary_demand_gpm == 750.0 and total_system_demand_gpm == 750.0"
            - "after trigger 2: auxiliary_demand_gpm == 910.0"
            - "after trigger 3: auxiliary_demand_gpm == 1010.0 and total_system_demand_gpm == 1010.0"
            - "after trigger 4: auxiliary_demand_gpm == 1010.0 - unchanged; COMMISSIONED rows stay in the roll-up"
            - "after trigger 5: AuxiliarySystem.${aux_cook}.status == WITHDRAWN with demand_gpm still 160.0 on the row"
            - "after trigger 5: Project.${p1}.auxiliary_demand_gpm == 850.0 and total_system_demand_gpm == 850.0"
            - "Project.${p1}.governing_demand_gpm == 0.0 at every step"

      - name: submittal_creation_pins_the_project_version_it_was_built_against
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.submittal-create-stale-project
          - validations[priority=11]
          - errors.ERR_STALE_PROJECT_VERSION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / body_fk_existence_outranks_stale_project_version_on_submittal_create
          rationale: "That instance stales the project version deliberately and asserts the 412 once the higher-priority existence checks are satisfied."

      - name: a_major_comment_propagates_four_levels_down_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST_/submittals/{id}/complete-review
        excluded_because:
          difficulty_instance: transitive_cascade / major_comment_cascade_a_depth_four_invalidates_seal_sheet_and_clearances
          rationale: "Cascade A is verified end to end there - comment to calculation to sheet to clearance - including the sealed counter."

      - name: a_failed_witness_propagates_only_to_the_systems_that_qualify
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST_/acceptance-tests/{id}/record-witness
        excluded_because:
          difficulty_instance: transitive_cascade / witness_failure_cascade_b_freezes_project_and_decommissions_only_commissioned_systems
          rationale: "Cascade B's conditional second link is asserted there against a project holding one PROPOSED and one COMMISSIONED system."

      - name: the_same_flow_test_yields_two_different_supply_verdicts
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.water_supply_availability.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / supply_basis_raw_versus_seasonal_flips_margin_verdict
          rationale: "Both bases are computed from one FlowTest row there and the ADEQUATE / INADEQUATE_PUMP_REQUIRED flip is asserted with the full derated triple."

  - section: consistency model
    instances:
      - name: every_derived_field_is_already_correct_in_the_writing_requests_own_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.fire_pump_sizing
          - calculations.project_demand_ledger
          - entities.WaterSupplyEvaluation.fields.pump_sized
          - entities.Project.fields.total_system_demand_gpm
        distinguishing_aspect: |
          No re-read, retry or settling delay is permitted anywhere. Three different write responses are
          inspected in place: the evaluation creation already carries its four derived supply figures, the
          pump creation already carries all nine sizing figures computed off them, and the auxiliary
          creation already carries demand_gpm 480.0. Between them, the reads taken IMMEDIATELY afterwards
          show the collateral writes have already landed too - the evaluation the pump consumed already
          reports pump_sized true with an advanced version, and the project ledger has already absorbed
          the new 480.0 gpm line as 1230.0 / 2610.0. An implementation that recomputes denormalised
          fields in a background pass, or that returns a pre-write snapshot of the row it just changed,
          fails on every read here.
        test_recipe:
          setup:
            - "Project FP-2601 with HC-1 CONVERGED at 1380.0 gpm and the 750.0 gpm Class I standpipe, ledger total 2130.0 gpm"
            - "Flow test H-22 (50 psi static / 30 psi residual / 4000 gpm) on file, plus the preliminary evaluation that let the chain converge"
