      - name: bulk_image_capture_is_all_or_nothing_and_preserves_array_order
        claim_type: bulk_action
        grounds:
          - endpoints.POST./submission-lots/{id}/items
          - validations.priority_27.ERR_IMAGE_REQUIRED
          - validations.priority_28.ERR_POS_REF_REQUIRED
        distinguishing_aspect: |
          One invalid element poisons the whole batch: neither the two valid
          siblings nor a partial captured_item_count survives, and the endpoint
          is retried clean afterwards. The successful batch then proves the
          declared ordering contract — element k gets created_at plus k
          milliseconds, so $.data[0] is the first element supplied and the
          newest-first list returns them in the reverse of the request order.
        test_recipe:
          setup:
            - "an ELECTRONIC submission (so pos_transaction_ref is mandatory) verified at 3 with one lot counted 3, nothing captured yet"
          setup_api_calls:
            - call: "POST /manufacturers"
