            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Vase", ask_estimate_cents: 30000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
          trigger:
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Early", description: "x", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { err_id: "$.data.error_id" } }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "On time", description: "x", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id" } }
            - { call: "GET /solicitations/${so}", payload: {}, as: ProcurementOfficer, captures: { so_st: "$.data.status" } }
          assert:
            - "receipt while SENT -> error_id == ERR_SOLICITATION_NOT_PLEDGED"
            - "after PLEDGED: receipt succeeds, item created status RECEIVED"
            - "Solicitation.${so}.status == FULFILLED (receipt cascades)"

      - name: attach_already_bundled_item_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.Item.VALUED_to_BUNDLED"
          - "errors[ERR_ITEM_ALREADY_BUNDLED]"
        distinguishing_aspect: "An item attached to bundle bd1 cannot be attached to bundle bd2 (ERR_ITEM_ALREADY_BUNDLED); after detaching from bd1 the attach to bd2 succeeds."
        test_recipe:
          setup:
            - "Event CATALOGING; item VALUED (FMV 30000); bundles bd1 and bd2 both DRAFT"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala AB", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "DH", email: "dh@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Vase", ask_estimate_cents: 30000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Vase", description: "Ming", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 30000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "B1" }, as: CatalogManager, captures: { bd1: "$.data.id" } }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "B2" }, as: CatalogManager, captures: { bd2: "$.data.id" } }
