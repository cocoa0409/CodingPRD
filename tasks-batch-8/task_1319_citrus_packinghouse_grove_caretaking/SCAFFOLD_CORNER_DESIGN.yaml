            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${er8_gr}", service_type: MOW, service_date: "2026-08-01", acres_treated: 11.111 }, as: FieldSupervisor, captures: { er8_o1: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders/${er8_o1}/schedule", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders/${er8_o1}/complete", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${er8_gr}", service_type: MOW, service_date: "2026-08-05", acres_treated: 2 }, as: FieldSupervisor, captures: { er8_o2: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders/${er8_o2}/schedule", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-invoices", payload: { grower_id: "${er8_g}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PoolAccountant, captures: { er8_inv: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${er8_inv}/issue", payload: {}, as: PoolAccountant }
          trigger:
            - { call: "POST /packinghouse/growers/${er8_g}/terminate", payload: {}, as: PoolAccountant, captures: { er8_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${er8_inv}/payments", payload: { amount_cents: 20000 }, as: PoolAccountant }
            - { call: "POST /packinghouse/growers/${er8_g}/terminate", payload: {}, as: PoolAccountant }
          assert:
            - "Terminate with balance 20000: ${er8_err} == ERR_GROWER_NOT_ACTIVE"
            - "After full payment: terminate succeeds; Grower.${er8_g}.status == TERMINATED"
            - "Side effect: CaretakingServiceOrder.${er8_o2} (was SCHEDULED) == CANCELLED"

