              payload: { advertiser_id: "${adv_id}", budget_plan_id: "${plan_id}", name: "Managed Burst", channel_mix: "ONSITE_ONLY", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", allocated_budget_cents: 10000000, pacing_mode: "EVEN", daily_cap_cents: 6000000, attribution_model: "LAST_TOUCH", attribution_window_days: 14 }
              as: AccountManager
