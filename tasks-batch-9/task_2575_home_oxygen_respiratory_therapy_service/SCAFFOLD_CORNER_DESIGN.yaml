              payload: { branch_id: "${br_id}", serial_number: "SC-1004", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, next_pm_due_date: "2027-06-01", replaces_unit_id: "${u_far}" }
              as: BranchManager
              captures: { e_far: $.data.error_id }
            - call: "POST /home-oxygen/equipment-units"
