      - name: notary_cannot_route_apostille
        claim_type: unauthorized_operation
        grounds:
          - roles.Notary
          - roles.ApostilleClerk
          - endpoints.POST_/notary/apostille-orders/{id}/route
        distinguishing_aspect: "Peer-role isolation: Notary calling an ApostilleClerk-exclusive route op returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "A SUBMITTED apostille order exists; a notary exists to attempt the forbidden call."
          setup_api_calls:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: CoordinatorOps
              captures: { acct_id: $.data.id }
            - call: "POST /notary/notaries"
              payload: { account_id: "${acct_id}", full_name: "Nora", commission_state: "CA", commission_expires_at: "2027-01-01T00:00:00Z", ron_authorized: true, nsa_certified: true }
              as: CoordinatorOps
              captures: { not_id: $.data.id }
            - call: "POST /notary/signers"
              payload: { account_id: "${acct_id}", full_name: "Sam", email: "s@x.com", id_doc_type: "PASSPORT" }
              as: CoordinatorOps
              captures: { signer_id: $.data.id }
            - call: "POST /notary/requests"
              payload: { account_id: "${acct_id}", signer_id: "${signer_id}", state_code: "CA", doc_category: "APOSTILLE_BOUND", delivery_mode: "MOBILE", expected_stamp_count: 1 }
              as: CoordinatorOps
              captures: { req_id: $.data.id }
            - call: "POST /notary/documents"
              payload: { request_id: "${req_id}", title: "Cert", doc_type: "BIRTH_CERT", requires_apostille: true, signing_fee_cents: 1000 }
              as: CoordinatorOps
              captures: { doc_id: $.data.id }
            - call: "POST /notary/apostille-orders"
              payload: { document_id: "${doc_id}", destination_country: "FR", sos_office_state: "CA" }
              as: ApostilleClerk
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /notary/apostille-orders/${ord_id}/route"
              payload: {}
              as: Notary
              as_user_id: "${not_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_role_header_unauthenticated
        claim_type: unauthorized_operation
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no/unknown X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /notary/accounts"
              payload: { org_name: "Acme", default_state_code: "CA" }
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_assign_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assign-stale-request]
          - entities.SigningRequest.fields.version
        distinguishing_aspect: "Assign with expected_request_version equal to the current request version succeeds and bumps version by 1 (the OCC happy path counterpart to the stale-version rejection)."
        test_recipe:
          setup:
            - "QUOTED request whose current version is captured; ACTIVE eligible notary."
          setup_api_calls:
            - call: "POST /notary/fee-schedules"
              payload: { state_code: "CA", per_stamp_cents: 1500, travel_base_cents: 4000, travel_per_mile_cents: 100, ron_surcharge_cents: 2500, state_cap_cents: 20000 }
              as: CoordinatorOps
