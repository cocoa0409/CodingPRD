            - "MaintenanceDispatch on that outage with one RESERVED PartReservation of qty 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-14T08:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-PD-1", host_org_name: "Lakeshore Commons LP", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-PD-1", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-PD-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /spare-parts"
              payload: { part_number: "SP-PD-1", part_class: "DISPENSER", lead_time_days: 3 }
              as: NetworkOperator
              captures: { sp_id: $.data.id }
            - call: "POST /spare-parts/${sp_id}/restock"
              payload: { qty: 5 }
              as: NetworkOperator
              captures: { sp_ver: $.data.version }
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-CRIT-02", fault_class: "CRITICAL", detected_at: "2026-06-14T08:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "CRITICAL" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-14T09:00:00Z", window_end_at: "2026-06-14T19:00:00Z" }
              as: NetworkOperator
              captures: { d_id: $.data.id }
            - call: "POST /part-reservations"
              payload: { dispatch_id: "${d_id}", spare_part_id: "${sp_id}", qty: 2, expected_spare_part_version: "${sp_ver}" }
              as: NetworkOperator
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
