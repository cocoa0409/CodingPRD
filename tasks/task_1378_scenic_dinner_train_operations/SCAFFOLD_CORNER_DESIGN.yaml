            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_a: "$.data.id" } }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-16", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_b: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run A", slot_id: "${slot_a}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_a: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run B", slot_id: "${slot_b}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_b: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_a}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_a}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
