  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_terms_touching_on_one_day_collide_across_program_years
        grounds:
          - validations[priority=29]
          - errors.ERR_OVERLAPPING_ENROLLMENT_PERIOD
          - entities.ProgramYear.fields.term_start_date
          - entities.ProgramYear.fields.term_end_date
          - endpoints["POST /esa/applications"]
        distinguishing_aspect: |
          The scarce resource is the student's enrollment term, and the interval is CLOSED on both
          ends: a next-year term starting on 2027-06-30, the exact last day of the held term, still
          intersects and must be refused 409, while a term starting one day later at 2027-07-01 is
          accepted 201. Nothing about either request is otherwise invalid, so only interval
          arithmetic separates the two outcomes.
