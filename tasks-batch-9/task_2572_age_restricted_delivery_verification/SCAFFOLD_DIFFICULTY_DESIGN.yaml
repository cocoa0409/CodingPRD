        distinguishing_aspect: |
          A DIFFERENT category pair from the dry-hours conflict: state (priority 40,
          ERR_INVALID_ORDER_STATE, http 409) versus business_fiscal (priority 70,
          ERR_ORDER_UNIT_LIMIT_EXCEEDED, http 422). The order was legitimately submitted in
          August under a policy whose max_units_per_order was 6.97; in September the
          effective policy caps orders at 5.00 units, so the same 6.97-unit basket now
