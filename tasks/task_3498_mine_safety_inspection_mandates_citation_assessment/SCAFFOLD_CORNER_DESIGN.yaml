  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_plan_approve_stale_mine_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-approve-stale-mine]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two strictly sequential approvals against the same mine: the client approving plan R with the mine version captured BEFORE plan V was approved is rejected 412 ERR_STALE_VERSION — the version advanced under it, so its view of which plan is current is stale."
        test_recipe:
          setup:
            - "Mine with two SUBMITTED plans (VENTILATION and ROOF_CONTROL); mine version captured before the first approval."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "VENTILATION", document_ref: "doc-vent-r1" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_v: $.data.id }
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "ROOF_CONTROL", document_ref: "doc-roof-r1" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_r: $.data.id }
            - call: "GET /msha/mines/${m_id}"
              payload: {}
              as: DistrictManager
              captures: { mv_stale: $.data.version }
            - call: "POST /msha/mine-plans/${plan_v}/approve"
              payload: { expected_mine_version: "${mv_stale}" }
              as: DistrictManager
          trigger:
            - call: "POST /msha/mine-plans/${plan_r}/approve"
              payload: { expected_mine_version: "${mv_stale}" }
              as: DistrictManager
              captures: { err: $.data.error_id }
          assert:
            - "the first approval succeeds (mine version was current at that moment)"
            - "the second approval with the same captured version answers 412 ERR_STALE_VERSION"
            - "MinePlan.${plan_r}.status remains SUBMITTED and no supersession occurred"

      - name: occ_contest_file_stale_citation_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contest-file-stale-citation]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "A contest carrying the citation version captured at issuance is rejected 412 after an abatement extension has advanced the citation's version — the contest must reference the instrument as it currently stands, filed well inside the 30-day window so no other rule can explain the rejection."
        test_recipe:
          setup:
            - "Citation issued 2026-02-10T09:00:00Z (version captured at issuance); abatement extension granted 2026-02-12 (version advances); contest filed 2026-02-13 with the stale captured version."
          setup_api_calls:
            - *clk_feb10_0800
