      - name: missing_auth_headers_returns_unauthenticated
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /course-packages"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_student_version_on_schedule_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lesson-schedule-stale-student]", "errors[ERR_STALE_STUDENT_VERSION]"]
        distinguishing_aspect: "POST /lessons carrying a stale expected_student_version (one less than live, after a permit bump) -> ERR_STALE_STUDENT_VERSION (412)."
        test_recipe:
          setup: ["PERMITTED student whose version advanced by record-permit; the scheduling client still holds the pre-permit version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
