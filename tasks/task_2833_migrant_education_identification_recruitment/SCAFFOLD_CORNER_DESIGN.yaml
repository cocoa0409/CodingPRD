          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "one ENROLLED Student born 2007-05-20, so the 22nd birthday 2029-05-20 lands inside the 36-month window"
            - "one VERIFIED AGRICULTURAL move dated 2026-06-15 with a supporting INITIAL interview"
            - "one DRAFT certificate with residency_date 2026-07-01 and qc_hold_exempt true"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
