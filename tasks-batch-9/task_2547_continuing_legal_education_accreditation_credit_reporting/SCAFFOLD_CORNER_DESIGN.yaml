            - "After ISSUE_FINDINGS: status == 'FINDINGS_ISSUED', findings_count == 0, version == 3, Provider.${prov_id}.audit_findings_count == 0"
            - "After CLOSE_CLEARED: status == 'CLEARED', sanction_type == 'NONE', closed_at == '2026-08-01T00:00:00Z', version == 4"
            - "Provider.${prov_id}.last_audit_closed_at == '2026-08-01T00:00:00Z' and risk_score == 0.10 with risk_score_variant == 'REVIEWED_WEIGHTING' (still PROBATIONARY)"
            - "Provider.${prov_id}.accreditation_status is STILL 'PROBATIONARY' — clearing an audit unlocks the GRANT_FULL gate but does not itself promote the provider"
            - "Complaint.${cmp_id}.escalated == true"
            - "GET /cle/fee-assessments?provider_id=${prov_id} returns total_count == 1 and that row's fee_type == 'PROVIDER_ANNUAL' — no AUDIT_SANCTION assessment exists"

      - name: the_sanctioned_probation_branch_bills_the_sanction_fee_and_reverts_the_provider
