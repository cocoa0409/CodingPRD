        claim_type: cyclic
        grounds:
          - state_machines.RenewalDecision.status.transitions.SAP_CERTIFIED_to_DRAFT
          - endpoints[PATCH /students/{id}/academic-progress]
        excluded_because:
          difficulty_instance: non_linear_state_machine / renewal_certification_revoked_cycle_increments_revision_count
          rationale: "The SAP_CERTIFIED -> DRAFT revocation cycle and its revision_count increment are the subject of that §1.8 instance."

