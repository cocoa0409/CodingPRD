            - call: "POST /ei/referrals"
              payload: { child_id: "${child2_id}", primary_referral_source: "CHILD_CARE", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Gross motor delay reported by the child care centre.", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref2_id: $.data.id }
          trigger:
            - call: "POST /ei/referrals/${ref2_id}/assign-coordinator"
              payload: {}
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/${alpha_id}/caseload-summary"
              as: ProgramAdmin
            - call: "GET /ei/service-coordinators/${bravo_id}/caseload-summary"
              as: ProgramAdmin
          assert:
            - "Trigger 1: HTTP 200 with response.data.coordinator_id == \"${bravo_id}\" — projected 0.1250 beats ALPHA's projected 0.7500"
            - "Trigger 1: response.data.status == \"EVALUATION_PENDING\" and case_weight_points == 1.50"
            - "Trigger 2: ALPHA reports weighted_caseload_points == 1.50, active_case_count == 1, utilization_ratio == 0.3750 and caseload_posture == \"OPEN\""
            - "Trigger 3: BRAVO reports weighted_caseload_points == 1.50, active_case_count == 1, utilization_ratio == 0.1250 and headroom_points == 10.50"

      - name: interpreter_language_filter_removes_every_candidate
        claim_type: input_set_filtering
        grounds:
          - calculations.coordinator_auto_selection
          - validations[priority 48 -> ERR_NO_ELIGIBLE_COORDINATOR]
          - validations[priority 47 -> ERR_COORDINATOR_NOT_ELIGIBLE]
        distinguishing_aspect: |
          The language term of the candidate filter only binds when interpreter_required is true: the
          only ACTIVE coordinator in the county speaks EN, so a Somali-speaking case that needs an
          interpreter empties the candidate set (ERR_NO_ELIGIBLE_COORDINATOR on auto-selection) and
          the same coordinator named explicitly is rejected by the identical filter with
          ERR_COORDINATOR_NOT_ELIGIBLE. Nothing is written by either refusal.
        test_recipe:
          setup:
            - "One ACTIVE coordinator in CNT_A with language_codes [\"EN\"] and a 12.00-point ceiling."
            - "One child whose primary_language is SO and a referral with interpreter_required true."
