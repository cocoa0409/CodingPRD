              as: ShopAdmin
              captures: { qc1_id: $.data.id }
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8910", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2029-01-01" }
              as: ShopAdmin
