              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_STAFF_ROLE_MISMATCH"
            - "GET /cath-lab/cases/${case_id}/staff-assignments returns total_count == 0"

      - name: performing_physician_must_be_cardiologist_returns_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_STAFF_ROLE_MISMATCH]", "entities.CathCase.fields.performing_physician_id"]
        distinguishing_aspect: "Case posting with performing_physician_id referencing a SCRUB_TECHNOLOGIST is rejected ERR_STAFF_ROLE_MISMATCH."
