            - "RouteStop.${stop_v2}.labor_cost_provisional_cents == 17600"

      - name: housing_pads_exhausted_is_an_aggregate_violation
        claim_type: aggregate_validation
        grounds:
          - validations[priority=92]
          - errors[ERR_HOUSING_PADS_EXHAUSTED]
          - entities.Venue.fields.housing_pads_available
          - entities.CrewAssignment.fields.housing_pad_assigned
        distinguishing_aspect: |
          Each shift is individually legal — inside the stop window, no worker overlap (different workers, and
          the intervals are back-to-back anyway) — yet the collective pad demand of 2 exceeds
          housing_pads_available = 1, so the second booking fails on the aggregate rule at priority 92, not on
          the per-row window rule at 75 or the overlap rule at 71.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1 with housing_pads_available 1, Route R1 with PLANNED stop A."
            - "Workers Bunk One and Bunk Two: SEASONAL, hourly_rate_cents 1800, housing_required true."
