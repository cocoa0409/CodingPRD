      - name: the_error_envelope_is_byte_shaped_the_same_for_every_status_class_including_unauthenticated
        claim_type: Errors
        grounds:
          - errors
          - api_conventions.error_envelope
        distinguishing_aspect: "Six status classes (400, 401, 403, 404, 409, 422) are provoked in one instance and every body is asserted to carry the identical envelope keys with a non-empty human message — the 401 case matters most because a rejected request never reaches the handler that would normally build the envelope."
        test_recipe:
          setup:
            - "One CONVENED session is the only fixture; each probe targets a different validation priority band."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /sessions/${s_id}/committees"
              payload: { chamber: "TRIBUNAL", name: "Not a chamber" }
              as: Clerk
            - call: "GET /sessions/${s_id}"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: FiscalOfficer
            - call: "GET /sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Clerk
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59Z" }
              as: PlatformAdmin
          assert:
            - "Chamber TRIBUNAL -> 400 ERR_INVALID_REQUEST; missing role header -> 401 ERR_UNAUTHENTICATED; FiscalOfficer convene -> 403 ERR_UNAUTHORIZED; nil session id -> 404 ERR_SESSION_NOT_FOUND; second convene -> 409 ERR_INVALID_SESSION_STATE; backwards clock -> 422 ERR_CLOCK_NOT_MONOTONIC"
            - "Every one of the six bodies is exactly { meta: { api_request_id, api_request_timestamp }, response_type: \"object\", data: { error_id, message } } with no extra top-level keys"
            - "data.error_id equals the code named above and data.message is a non-empty string in each case"
            - "meta.api_request_id differs between the six responses and meta.api_request_timestamp is present on all of them, including the 401"
            - "The 412 class carries the same envelope; it is asserted in the optimistic-concurrency instances where a stale expected_*_version is the only way to reach it"

  # ===========================================================================
  # RBAC — seven roles, three of them entity-backed against three different
  # tables, plus a segregation-of-duties rule that separates two identities
  # inside the SAME table. Every instance pairs the positive (the owning role
  # succeeds) with the negative (another declared role is refused at priority
  # 20, or at priority 30 when the refusal is about seniority rather than the
  # role name).
  # ===========================================================================
  - section: rbac
    instances:
      - name: platform_admin_registry_writes_are_forbidden_to_all_six_other_roles
        claim_type: RBAC
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - validations[priority 20].ERR_UNAUTHORIZED
        distinguishing_aspect: "PlatformAdmin is the only role that may mint the reference tables and the only role that may move the logical clock; the five refusals below are issued by five DIFFERENT roles, including the two that share every GET with it, so the boundary is per-operation and not per-role-tier."
        test_recipe:
          setup:
            - "PlatformAdmin creates one of each registry row, which is itself the positive half of the claim: session, committee (shared with Clerk), member, drafter and agency."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/committees"
              payload: { chamber: "HOUSE", name: "House Appropriations", is_fiscal_committee: true, max_concurrent_referrals: 2 }
              as: PlatformAdmin
              captures: { cH_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Rep Sponsor", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Department of Revenue", agency_code: "DOR", status: "ACTIVE", max_open_requests: 3 }
