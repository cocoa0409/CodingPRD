  - section: endpoints
    instances:

      - name: utilization_ingest_is_computed_read_via_service_group_get
        claim_type: Computed read
        grounds:
          - endpoints.GET_/service-groups/{id}
          - endpoints.POST_/service-groups/{id}/utilization-samples
        distinguishing_aspect: "GET /service-groups/{id} is the computed read that surfaces downstream_capacity_mbps 304, current_load_mbps, current_utilization_pct, posture and provisioned_downstream_mbps in one resource."
        test_recipe:
          setup:
            - "SG-RD on node with one 48-MHz DATA block; no samples"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-RD", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-RD", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
          trigger:
            - call: "GET /service-groups/${sg}"
              as: Any
          assert:
            - "ServiceGroup.${sg}.downstream_capacity_mbps == 304 and upstream_capacity_mbps == 27"
            - "ServiceGroup.${sg}.current_load_mbps == 0 and current_utilization_pct == 0.0 and posture == NORMAL"
            - "ServiceGroup.${sg}.provisioned_downstream_mbps == 0"

      - name: capacity_action_create_supersedes_existing_proposed_action
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/service-groups/{id}/capacity-actions
          - entities.CapacityAction.fields.superseded_by_id
        distinguishing_aspect: "Creating a second MANUAL action while a PROPOSED action exists cancels the first with superseded_by_id pointing at the new action's id."
        test_recipe:
          setup:
            - "SG-SUP with one PROPOSED NODE_SPLIT action"
