        distinguishing_aspect: |
          Three catalog codes that no other test reaches, each on its own endpoint: completing an
          already-COMPLETED assessment, a PARTIAL consent that declines the plan's only line, and
          both halves of the supersede rule — an ANNUAL plan with no supersedes_ifsp_id, and a second
          ANNUAL plan aimed at a target that another non-WITHDRAWN plan already supersedes. The
