        distinguishing_aspect: "The closing director must not be the patient's primary_practitioner_id: closing as the patient's own director returns 403 ERR_SEGREGATION_OF_DUTIES, and a second, unrelated director closes the same review successfully."
        test_recipe:
          setup:
            - "Two ClinicalDirectors; the patient's primary practitioner IS the first of them"
            - "A scope review is open on that patient"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Ines Park", credential: "CLINICAL_DIRECTOR", licensed_state_codes: ["OR"], npi: "1987654327" }
              as: PracticeAdmin
              captures: { cd_own: $.data.id }
            - call: "POST /practitioners"
              payload: { full_name: "Dr Omar Vega", credential: "CLINICAL_DIRECTOR", licensed_state_codes: ["OR"], npi: "1555666773" }
              as: PracticeAdmin
              captures: { cd_other: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${cd_own}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/scope-reviews"
              payload: { reason: "supervision query" }
              as: ClinicalDirector
              as_user_id: "${cd_own}"
          trigger:
            - call: "POST /patients/${pt_id}/scope-reviews/close"
              payload: { outcome: "CLEARED" }
              as: ClinicalDirector
              as_user_id: "${cd_own}"
              captures: { err_id: $.data.error_id }
            - call: "POST /patients/${pt_id}/scope-reviews/close"
              payload: { outcome: "CLEARED", notes: "scope confirmed appropriate" }
              as: ClinicalDirector
              as_user_id: "${cd_other}"
          assert:
            - "The self-close returned 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "After the refusal, Patient.${pt_id}.scope_review_status was still UNDER_REVIEW"
            - "Patient.${pt_id}.scope_review_status == CLEARED"
            - "Patient.${pt_id}.clinical_write_gate == OPEN"

