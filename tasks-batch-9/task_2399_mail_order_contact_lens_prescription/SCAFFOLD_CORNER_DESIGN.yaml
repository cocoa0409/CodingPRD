          - errors[ERR_DUPLICATE_LICENSE]
        distinguishing_aspect: "Uniqueness is scoped to the pair license_number plus license_state, so UT-40921 in UT is refused with 409 ERR_DUPLICATE_LICENSE while the same number in NV is accepted."
        test_recipe:
          setup:
            - One prescriber holds licence UT-40921 in state UT.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /prescribers
              payload: { full_name: "Dr. Mira Okonjo", license_number: "UT-40921", license_state: "UT", contact_channel: "PORTAL", directory_verified: true }
