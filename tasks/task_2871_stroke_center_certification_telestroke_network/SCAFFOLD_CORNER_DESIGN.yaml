  - name: a_destination_that_is_not_thrombectomy_capable_is_refused_ahead_of_the_self_referral_check
    claim_type: priority_ordering
    grounds:
    - validations priority 59 -> ERR_DESTINATION_NOT_THROMBECTOMY_CAPABLE (422)
    - validations priority 61 -> ERR_SELF_REFERRAL_TRANSFER (409)
    distinguishing_aspect: Pointing a transfer at the case's OWN spoke violates priority 59 (a SPOKE is not thrombectomy-capable) AND priority 61 (destination equals origin). 59 must win, so the answer is 422 ERR_DESTINATION_NOT_THROMBECTOMY_CAPABLE; the HUB destination isolates 59 on its own, and a case sitting AT the thrombectomy centre isolates 61 on its own.
