            - "${status_3} == DENIED (MAX_REVISION_ROUNDS is 2, so the third request leaves the cycle)"
            - "IncentiveClaim.${claim_id}.revision_note == Third strike: certificate still missing."
            - "IncentiveClaim.${claim_id}.net_credits_mt == 0.573 (recomputed on every resubmit and preserved on denial)"
            - "IncentiveClaim.${claim_id}.certified_by_user_id is null"
            - "Station.${st_id}.credits_issued_total_mt == 0.000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: critical_leak_freezes_station_then_aborts_fill_then_voids_billing_depth_4
        grounds:
          - state_machines.Station.OPEN_to_FROZEN
          - state_machines.DispenseSession.FUELING_to_ABORTED
          - calculations.station_safety_posture
          - entities.Station.fields.leak_detection_status
          - entities.Station.fields.reserved_kg
          - endpoints.POST_/safety-events
        distinguishing_aspect: |
          Depth-4 chain, each link strictly caused by the previous one:
          hop 1 opening a LEAK_DETECTED event sets Station.leak_detection_status = ALARM;
          hop 2 BECAUSE leak_detection_status is ALARM the posture recomputes to FROZEN;
          hop 3 BECAUSE the posture became FROZEN the in-flight session moves fill_status
          FUELING -> ABORTED with abort_reason STATION_FROZEN;
          hop 4 BECAUSE that session left {PRECOOLING, FUELING} its billing_status PENDING -> VOIDED
          and Station.reserved_kg / available_kg / projected_available_kg are recomputed.
          This is a chain, not fan-out: removing hop 2 removes hops 3 and 4.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Station STN-G, nozzle_count 4, storage_capacity_kg 900.000, reserve_floor_kg 100.000, max_pressure_class H70; vessels HIGH 600 L at 950.00 bar, MEDIUM 1000 L at 700.00 bar, LOW 5000 L at 300.00 bar; onsite_inventory_kg 221.600."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "One H35 session planned 20.000 kg fuelled to fill_status FUELING, so reserved_kg is 20.000, available_kg 201.600, supply_alert false and safety_posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-G-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-G", name: "Cascade Yard G", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "MEDIUM", water_volume_l: 1000.0, mawp_bar: 1000.00, min_residual_bar: 150.00, initial_pressure_bar: 700.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_med: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-G-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-G-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v: "$.data.version", posture_before: "$.data.safety_posture", leak_before: "$.data.leak_detection_status", reserved_before: "$.data.reserved_kg" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 20.000, ambient_temp_c: 0.0, expected_station_version: "${st_v}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { sess_id: "$.data.id" }
            - call: "POST /dispense-sessions/${sess_id}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { fs_before: "$.data.fill_status", bs_before: "$.data.billing_status" }
          trigger:
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "LEAK_DETECTED", severity: "CRITICAL", affected_nozzle_count: 4, detected_by: "SENSOR" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { ev_id: "$.data.id" }
          assert:
            - "${posture_before} == OPEN and ${leak_before} == NORMAL and ${reserved_before} == 0.000"
            - "${fs_before} == FUELING and ${bs_before} == PENDING"
            - "SafetyEvent.${ev_id}.status == OPEN and opened_by_user_id == SO-1"
            - "Station.${st_id}.leak_detection_status == ALARM (hop 1)"
            - "Station.${st_id}.safety_posture == FROZEN (hop 2)"
            - "DispenseSession.${sess_id}.fill_status == ABORTED and abort_reason == STATION_FROZEN (hop 3)"
            - "DispenseSession.${sess_id}.billing_status == VOIDED (hop 4)"
            - "Station.${st_id}.reserved_kg == 0.000 (hop 4)"
            - "Station.${st_id}.available_kg == 221.600 and projected_available_kg == 221.600 and supply_alert == false"
            - "Station.${st_id}.onsite_inventory_kg == 221.600 (an aborted fill draws no mass)"
            - "DispenseSession.${sess_id}.metered_kg is null and corrected_kg is null"

      - name: vessel_condemnation_vents_inventory_then_restricts_station_depth_3
        grounds:
          - state_machines.PressureVessel.DUE_to_CONDEMNED
          - state_machines.Station.OPEN_to_RESTRICTED
          - calculations.station_safety_posture
          - entities.Station.fields.total_deliverable_kg
          - entities.InventoryLedgerEntry.fields.reason
          - endpoints.POST_/pressure-vessels/{id}/inspections
        distinguishing_aspect: |
          Different triggering transition (an inspection outcome on PressureVessel, not a safety-event
          creation) and a shorter depth-3 chain that runs the other way across the FK — child vessel
          to parent station:
          hop 1 the CONDEMN outcome sets inspection_status = CONDEMNED and vents the vessel to 0.00 bar
          via an INSPECTION_VENT ledger entry of -120.000 kg;
          hop 2 BECAUSE the ledger and the vessel pressure changed, Station.onsite_inventory_kg falls
          221.600 -> 101.600 and total_deliverable_kg falls 160.000 -> 80.000;
          hop 3 BECAUSE a CONDEMNED vessel now exists, safety_posture recomputes OPEN -> RESTRICTED.
          high_bank_deliverable_kg is deliberately untouched at 36.000 so the posture flip can only be
          attributed to the CONDEMNED condition and not to the low-high-bank condition.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-15T00:00:00Z."
            - "Station STN-H, nozzle_count 4, storage_capacity_kg 900.000, reserve_floor_kg 100.000, max_pressure_class H70."
            - "Vessels HIGH 600 L at 950.00 bar (due 2027-06-30) and MEDIUM 1000 L at 700.00 bar (due 2027-06-30) stay CURRENT; LOW 5000 L at 300.00 bar carries next_inspection_due_date 2026-08-15."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "Advancing the clock to 2026-08-15 makes only the LOW vessel DUE (inside the 30-day grace), which does not restrict the station, so safety_posture is still OPEN with total_deliverable_kg 160.000 and high_bank_deliverable_kg 36.000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-H-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-H", name: "Inspection Yard H", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "MEDIUM", water_volume_l: 1000.0, mawp_bar: 1000.00, min_residual_bar: 150.00, initial_pressure_bar: 700.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_med: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2026-08-15" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-H-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-H-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { vessels_recomputed: "$.data.vessels_recomputed" }
            - call: "GET /pressure-vessels/${v_low}"
              payload: {}
              as: SafetyOfficer
              captures: { low_status_before: "$.data.inspection_status", low_mass_before: "$.data.stored_mass_kg" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { posture_before: "$.data.safety_posture", onsite_before: "$.data.onsite_inventory_kg", deliverable_before: "$.data.total_deliverable_kg", hbd_before: "$.data.high_bank_deliverable_kg" }
          trigger:
            - call: "POST /pressure-vessels/${v_low}/inspections"
              payload: { outcome: "CONDEMN" }
              as: SafetyOfficer
              as_user_id: "SO-1"
          assert:
            - "${vessels_recomputed} == 1 and ${low_status_before} == DUE and ${low_mass_before} == 120.000"
            - "${posture_before} == OPEN and ${onsite_before} == 221.600 and ${deliverable_before} == 160.000 and ${hbd_before} == 36.000"
            - "PressureVessel.${v_low}.inspection_status == CONDEMNED and current_pressure_bar == 0.00 and stored_mass_kg == 0.000 (hop 1)"
            - "PressureVessel.${v_low}.inspection_count == 1"
            - "an InventoryLedgerEntry exists for the station with reason INSPECTION_VENT and delta_kg == -120.000 (hop 1)"
            - "Station.${st_id}.onsite_inventory_kg == 101.600 (hop 2)"
            - "Station.${st_id}.total_deliverable_kg == 80.000 (hop 2)"
            - "Station.${st_id}.high_bank_deliverable_kg == 36.000 (unchanged, isolating the cause)"
            - "Station.${st_id}.safety_posture == RESTRICTED (hop 3)"
            - "Station.${st_id}.supply_alert == false (projected_available_kg 101.600 is still above reserve_floor_kg 100.000)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_posture_state_error_outranks_insufficient_inventory_fiscal_error
        grounds:
          - validations.priority_90_ERR_STATION_FROZEN
          - validations.priority_265_ERR_INSUFFICIENT_AVAILABLE_INVENTORY
          - errors.ERR_STATION_FROZEN
          - errors.ERR_INSUFFICIENT_AVAILABLE_INVENTORY
          - endpoints.POST_/dispense-sessions
        distinguishing_aspect: |
          Error-category pair is state (priority 90) versus business_fiscal (priority 265) on
          POST /dispense-sessions. Both conditions are violated by the same request — the station is
          FROZEN and planned_kg 100.000 exceeds available_kg 45.600 — and the lower-priority number
          must win, so the response is ERR_STATION_FROZEN (409), never ERR_INSUFFICIENT_AVAILABLE_INVENTORY (422).
          The expected_station_version is re-read AFTER the freezing event precisely so that the
          priority-70 OCC check cannot preempt the pair under test.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Station STN-I, nozzle_count 4, storage_capacity_kg 900.000, reserve_floor_kg 100.000, max_pressure_class H70, with a SINGLE HIGH vessel 600 L at 950.00 bar so onsite_inventory_kg and available_kg are both 45.600 and high_bank_deliverable_kg is 36.000."
            - "Two current EMERGENCY_RESPONSE responder certifications, so priority 110 cannot fire."
            - "A CRITICAL LEAK_DETECTED SafetyEvent is opened, driving leak_detection_status ALARM and safety_posture FROZEN."
            - "Station.version is re-read after the event so the OCC check at priority 70 passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-I-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-I", name: "Priority Yard I", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-I-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-I-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "LEAK_DETECTED", severity: "CRITICAL", affected_nozzle_count: 4, detected_by: "SENSOR" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { ev_id: "$.data.id" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v: "$.data.version", posture_now: "$.data.safety_posture", avail_now: "$.data.available_kg" }
          trigger:
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "HEAVY_TRUCK", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 100.000, ambient_temp_c: 0.0, expected_station_version: "${st_v}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${posture_now} == FROZEN and ${avail_now} == 45.600"
            - "HTTP status == 409"
            - "${err} == ERR_STATION_FROZEN"
            - "${err} != ERR_INSUFFICIENT_AVAILABLE_INVENTORY (priority 90 outranks priority 265)"
            - "no DispenseSession row was created for Station ${st_id}"
            - "Station.${st_id}.reserved_kg == 0.000 and available_kg == 45.600"

