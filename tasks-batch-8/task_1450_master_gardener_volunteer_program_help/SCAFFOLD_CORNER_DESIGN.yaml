          setup: ["cycle 2026 OPEN; volunteers V1, V2 ACTIVE; assignment A (V1, BED-1, week 2026-09-07) and assignment B (V1, BED-2, week 2026-09-07); clock at 2026-09-02 (mid-week, swap allowed)"]
