            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "RENTAL", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 5.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 5.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /stops/${s_id}/deliveries"
              payload: { category_id: "${cat_id}", pieces_promised: 10 }
              as: RouteDriver
              captures: { del_id: $.data.id }
            - call: "GET /customers/${c_id}"
              as: RouteDriver
              captures: { cust_ver: $.data.version }
          trigger:
            - call: "POST /deliveries/${del_id}/mark-delivered"
              payload: { pieces_delivered: 10, expected_customer_version: "${cust_ver} - 1" }
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: customer_version_increments_on_balance_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.Customer.fields.version, "concurrency_rules[invoice-issue-stale-customer]"]
        distinguishing_aspect: "Customer.version increments by exactly 1 on invoice issue (balance mutation), making the previously observed version stale."
        test_recipe:
          setup: ["COG customer with DRAFT invoice"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /customers/${c_id}/invoices/generate"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "GET /customers/${c_id}"
              as: BillingClerk
              captures: { ver_pre: $.data.version }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: { expected_customer_version: "${ver_pre}" }
              as: BillingClerk
            - call: "GET /customers/${c_id}"
              as: BillingClerk
              captures: { ver_post: $.data.version }
          assert:
            - "ver_post == ver_pre + 1"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Under immediate consistency, the response of POST .../sort-batches/{id}/lock already contains the recomputed reject_rate_pct and alert_raised — no re-read needed to observe the derived values."
        test_recipe:
          setup: ["Batch with 3 ACCEPTED + 1 REJECTED"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 2.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 2.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 3, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 1, disposition: "REJECTED", reject_reason: "STAIN" }
              as: PlantOperator
          trigger:
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
              captures: { status: $.data.status, rate: $.data.reject_rate_pct, alert: $.data.alert_raised }
          assert:
            - "status == LOCKED"
            - "rate == 25.0"
            - "alert == true"
