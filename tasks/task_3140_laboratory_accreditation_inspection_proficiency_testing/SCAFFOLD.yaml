# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic: referenced resource id does not exist" }
  - { id: ERR_LABORATORY_NOT_FOUND, http: 404, condition: "laboratory_id does not exist" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "inspector_id / affiliated_laboratory_id / replacement_inspector_id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollment_id does not exist" }
  - { id: ERR_SECTION_NOT_FOUND, http: 404, condition: "section_id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription_id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment_id does not exist" }
  - { id: ERR_RESULT_NOT_FOUND, http: 404, condition: "result_id does not exist" }
  - { id: ERR_INVESTIGATION_NOT_FOUND, http: 404, condition: "investigation_id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "inspection_cycle_id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment_id does not exist" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "finding_id does not exist" }
  - { id: ERR_PERSONNEL_NOT_FOUND, http: 404, condition: "personnel_id does not exist" }
  - { id: ERR_METHOD_VALIDATION_NOT_FOUND, http: 404, condition: "method-validation id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, wrong type, enum value unknown, empty analytes, no critical analyte, element_scores not exactly 6 values in 0..100, scheduled_end <= scheduled_start, corrective_action_notes empty, analyte names not exactly covering subscription analytes" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation: transition not admitted from the resource's current state, or terminal-state lockdown" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version does not match the enrollment's current version on first-checklist assignment while WAITING" }
  - { id: ERR_DUPLICATE_CLIA, http: 409, condition: "clia_number already registered" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Laboratory already has an enrollment in this discipline" }
  - { id: ERR_CHECKLIST_ALREADY_ASSIGNED, http: 409, condition: "assign-checklist on a section whose checklist_status == ASSIGNED" }
  - { id: ERR_CHECKLIST_UNKNOWN, http: 409, condition: "checklist_code/checklist_version not a registered edition, or a retired edition" }
  - { id: ERR_ENROLLMENT_INACTIVE, http: 409, condition: "Parent enrollment is SUSPENDED or CEASED where ACTIVE is required (PT subscription, PT result, checklist assignment on CEASED, method-validation approve)" }
  - { id: ERR_SHIPMENT_CLOSED, http: 409, condition: "Operation requires shipment status == OPEN" }
  - { id: ERR_SUBMISSION_DEADLINE_PASSED, http: 409, condition: "PT result submitted when current logical time > shipment.due_at" }
  - { id: ERR_PT_COLLECTION_WINDOW, http: 409, condition: "collected_at outside [shipment.shipped_at, shipment.shipped_at + 5 days]" }
  - { id: ERR_RESULT_ALREADY_GRADED, http: 409, condition: "void attempted on a GRADED result" }
  - { id: ERR_INVALID_INVESTIGATION_STATE, http: 409, condition: "Investigation action not admitted from current investigation status" }
  - { id: ERR_CESSATION_REQUIRES_ROLLING_UNSATISFACTORY, http: 409, condition: "cease-testing requires enrollment.standing_rolling == UNSATISFACTORY" }
  - { id: ERR_OPEN_INVESTIGATION_EXISTS, http: 409, condition: "reinstate blocked: a non-terminal PTInvestigation exists for a laboratory enrollment" }
  - { id: ERR_REVOKE_TOO_EARLY, http: 409, condition: "revoke attempted before 180 days after the most recent DENIED decision" }
  - { id: ERR_SELF_INSPECTION, http: 409, condition: "Inspector's affiliated laboratory is the cycle's laboratory" }
  - { id: ERR_RECIPROCAL_CONFLICT, http: 409, condition: "Inspector's affiliated laboratory had a team member on a cycle of this laboratory within the trailing 365 days before scheduled_start" }
  - { id: ERR_INSPECTOR_SUSPENDED, http: 409, condition: "TeamAssignment clear attempted on a SUSPENDED inspector" }
  - { id: ERR_SPECIALTY_MISMATCH, http: 409, condition: "Inspector specialties do not include any discipline in which the cycle's laboratory holds a WAITING or ACTIVE enrollment" }
  - { id: ERR_TEAM_INCOMPLETE, http: 409, condition: "screen-team without a CLEARED LEAD, or with a lingering PENDING assignment" }
  - { id: ERR_CONFLICTED_INSPECTOR, http: 409, condition: "screen-team while any assignment on the cycle is CONFLICTED (must be replaced first)" }
  - { id: ERR_CYCLE_NOT_READY, http: 409, condition: "conduct attempted while posture_ready == false" }
  - { id: ERR_INSPECTION_WINDOW_NOT_OPEN, http: 409, condition: "conduct attempted outside [scheduled_start, scheduled_end)" }
  - { id: ERR_NO_FINDINGS, http: 409, condition: "issue-findings on a cycle with no finding in CITED/RESPONSE_SUBMITTED/ACCEPTED" }
  - { id: ERR_FINDING_NOT_RESPONDABLE, http: 409, condition: "respond attempted while parent cycle is not FINDINGS_ISSUED" }
  - { id: ERR_RESPONSE_DEADLINE_PASSED, http: 409, condition: "respond attempted when current logical time > response_due_at" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "The citing inspector attempted to accept the response to their own citation" }
  - { id: ERR_DECISION_BLOCKED_BY_BURDEN, http: 409, condition: "decide/re-decide with a non-DENIED decision while deficiency_burden_score > 0" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "appeal attempted more than 30 days after the (re-)decision" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "appeal attempted when appeal_count >= 2" }
  - { id: ERR_SECTION_NOT_IN_LABORATORY, http: 409, condition: "finding.section_id belongs to an enrollment of a different laboratory than the cycle" }
  - { id: ERR_VALIDATION_STUDY_INADEQUATE, http: 409, condition: "approve attempted with correlation_r_squared < 0.95 or precision_cv_pct > 10.0" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "POST /inspection-cycles window [scheduled_start, scheduled_end) intersects an existing cycle of the same laboratory in status TEAM_ASSEMBLY | SCREENED | CONDUCTED | FINDINGS_ISSUED (half-open: touching boundaries allowed)" }
  - { id: ERR_ASSESSMENT_OVERLAP, http: 409, condition: "competency assessment assessed_at <= the assessed_at of the personnel's latest prior assessment (chronology must be strictly increasing)" }
  - { id: ERR_SHIPMENT_WINDOW_OVERLAP, http: 409, condition: "POST /pt-shipments event window [shipped_at, due_at] (CLOSED both ends) intersects another OPEN shipment of the same subscription; a new shipment whose shipped_at equals an open shipment's due_at IS an overlap" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator role for test-driving endpoints and read access"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["All GET endpoints"]
  - name: AccreditationOfficer
    description: "Accreditation program staff: enrollment governance, checklists, investigations, cycle orchestration, decisions"
    identity: opaque
    exclusive_operations:
      - "POST /laboratories, POST /laboratories/{id}/reinstate, POST /laboratories/{id}/revoke"
      - "POST /inspector-profiles"
      - "POST /sections/{id}/assign-checklist, POST /checklist-editions"
      - "All /pt-investigations action endpoints (begin-review, require-corrective-action, resolve, cease-testing)"
      - "POST /inspection-cycles and cycle actions (screen-team, conduct, issue-findings, decide, re-decide)"
      - "POST /team-assignments and team actions (clear, flag-conflict, replace)"
      - "POST /personnel-records/{id}/verify-qualification"
      - "POST /method-validations/{id}/approve, POST /method-validations/{id}/reject"
    shared_operations: ["All GET endpoints"]
  - name: LaboratoryDirector
    description: "Director of a laboratory under accreditation; X-User-ID equals the Laboratory id the director acts for"
    identity: "entity_backed:Laboratory"
    exclusive_operations:
      - "POST /enrollments, POST /sections, POST /pt-subscriptions, POST /pt-results"
      - "POST /inspection-cycles/{id}/appeal, POST /inspection-cycles/{id}/self-inspect"
      - "POST /inspection-findings/{id}/respond"
      - "POST /personnel-records, POST /competency-assessments"
      - "POST /method-validations, POST /method-validations/{id}/submit"
    shared_operations: ["All GET endpoints"]
  - name: PTCoordinator
    description: "Proficiency testing program coordinator (shipment logistics)"
    identity: opaque
    exclusive_operations: ["POST /pt-shipments, POST /pt-shipments/{id}/close, POST /pt-results/{id}/void"]
    shared_operations: ["All GET endpoints"]
  - name: Inspector
    description: "Peer inspector; X-User-ID equals the InspectorProfile id the inspector acts as"
    identity: "entity_backed:InspectorProfile"
    exclusive_operations: ["POST /inspection-findings, POST /inspection-findings/{id}/accept, POST /inspection-findings/{id}/withdraw"]
    shared_operations: ["All GET endpoints"]
