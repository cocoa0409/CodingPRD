            - "${published_status} == PUBLISHED"
            - "${published_statement} == \"Atlantic Cod | WILD CAUGHT | Wild caught in US (WILD_LONGLINE) | FRESH - NEVER FROZEN\""
            - "AdvertisedItem.${item_one}.status == CLOSED after trigger call 3, with retract_reason == null"
            - "AdvertisedItem.${item_two}.status == RETRACTED with retract_reason == MANUAL"
            - "CaseLabel.${label_id}.status == PUBLISHED throughout (retracting an ad never touches the case label)"
            - "Counter.${counter_id}.violation_points == 0 (a MANUAL retraction raises no COOL_MISSING violation)"

      - name: case_label_links_lot_and_certification_in_one_call
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /seafood-ops/case-labels]
          - validations[priority=41]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_label_claim_requires_active_certification
          rationale: "The named §1.8 instance already exercises the lot/certification link, including the PENDING_REVIEW refusal and the ACTIVE success that copies claim_text onto the label."

