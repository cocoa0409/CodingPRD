            - "AT the boundary — ReliefClaim.${rc_ok_id}.status == NOTIFIED, notified_at == '2027-02-21T00:00:00Z', granted_relief_days is null"
            - "ONE DAY PAST — the second claim returns ERR_RELIEF_NOTIFICATION_LATE with HTTP 422: 2027-04-01 to 2027-04-22 is 21 calendar days"
