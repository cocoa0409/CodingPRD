              payload: {}
              as: Coordinator
              captures: { on_hand: "$.data.on_hand_qty", below: "$.data.below_par", sl4_v: "$.data.version" }
          assert:
            - "first submit: HTTP status == 409 and data.error_id == ERR_INSUFFICIENT_ON_HAND"
            - "after the refused submit, ChecklistTask.${ck_restock}.status == PENDING"
            - "second submit: HTTP status == 200, ${ck_status} == SUBMITTED, ${ck_lines} == 1"
            - "${ck_charge} == 968 (round_half_up(900 * 1 * 1.075))"
            - "${on_hand} == 0 and ${below} == true"
