# =============================================================================
# Task 1242 — Revenue Recognition (ASC 606) Contract Review
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances; every chain replays against SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Contract estimate vs POB progress)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: vc_estimate_expected_value_vs_most_likely
        grounds:
          - calculations.variable_consideration_estimate
          - calculations.variable_consideration_constraint
          - entities.VariableConsiderationEstimate.fields.constrained_amount_cents
        distinguishing_aspect: |
          On the Contract/estimate domain (transaction-price determination), the same
          scenario set yields unconstrained 64000 under EXPECTED_VALUE but 60000 under
          MOST_LIKELY, and after the STANDARD 0.85 cap, constrained 54400 vs 51000 —
          the two methods are two valid readings of ASC 606 with different numbers.
        test_recipe:
          setup:
            - "clock at 2026-06-15; one customer; one DRAFT contract fixed_consideration_cents=1000000, risk_tier STANDARD, signed 2026-05-20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Acme Corp", external_ref: "ACME-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-VC-1", signed_date: "2026-05-20", fixed_consideration_cents: 1000000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/vc-estimates"
              payload: { method: "EXPECTED_VALUE", scenarios: [ { probability_bps: 3000, amount_cents: 100000 }, { probability_bps: 5000, amount_cents: 60000 }, { probability_bps: 2000, amount_cents: 20000 } ] }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { ev_unconstrained: $.data.unconstrained_amount_cents, ev_constrained: $.data.constrained_amount_cents }
            - call: "POST /revrec/contracts/${c_id}/vc-estimates"
              payload: { method: "MOST_LIKELY", scenarios: [ { probability_bps: 3000, amount_cents: 100000 }, { probability_bps: 5000, amount_cents: 60000 }, { probability_bps: 2000, amount_cents: 20000 } ] }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { ml_unconstrained: $.data.unconstrained_amount_cents, ml_constrained: $.data.constrained_amount_cents }
          assert:
            - "EV estimate unconstrained_amount_cents == 64000"
            - "EV estimate constrained_amount_cents == 54400"
            - "ML estimate unconstrained_amount_cents == 60000"
            - "ML estimate constrained_amount_cents == 51000"
            - "constrained delta 54400 != 51000 for identical scenario input"

      - name: progress_input_cost_vs_straight_line
        grounds:
          - calculations.over_time_progress
          - entities.PerformanceObligation.fields.recognized_revenue_cents
        distinguishing_aspect: |
          On the PerformanceObligation domain (timing of recognition), two POBs with
          identical allocated_amount_cents == 100000 and identical elapsed wall time
          recognize 25000 under INPUT_COST (20000/80000 costs) but 46667 under
          STRAIGHT_LINE (14/30 days) — different measures, different numbers.
        test_recipe:
          setup:
            - "clock 2026-06-15; OPEN June period [2026-06-01, 2026-07-01)"
            - "SSP WIDGET/US 100000 and SVC/US 100000, both covering [2026-01-01, 2026-12-31]"
            - "contract A (fixed 100000, signed 2026-05-20) ACTIVE with one OVER_TIME_INPUT_COST POB (est cost 80000)"
            - "contract B (fixed 100000, signed 2026-05-20) ACTIVE with one OVER_TIME_STRAIGHT_LINE POB (2026-06-01 to 2026-07-01)"
            - "cost entry 20000 posted on A's POB at 2026-06-10 -> A recognized 25000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "SVC", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Beta LLC", external_ref: "BETA-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-IC", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_a: $.data.id }
            - call: "POST /revrec/contracts/${c_a}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "OVER_TIME_INPUT_COST", estimated_total_cost_cents: 80000 }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_a: $.data.id }
            - call: "POST /revrec/contracts/${c_a}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_a}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_a}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-SL", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_b: $.data.id }
            - call: "POST /revrec/contracts/${c_b}/pobs"
              payload: { pob_ref: "P1", product_code: "SVC", region: "US", recognition_pattern: "OVER_TIME_STRAIGHT_LINE", service_start_date: "2026-06-01", service_end_date: "2026-07-01" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_b: $.data.id }
            - call: "POST /revrec/contracts/${c_b}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_b}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_b}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/pobs/${pob_a}/cost-entries"
              payload: { amount_cents: 20000, incurred_date: "2026-06-10" }
              as: RevenueAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /revrec/pobs/${pob_b}/recognize"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/pobs/${pob_a}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { rec_a: $.data.recognized_revenue_cents, alloc_a: $.data.allocated_amount_cents }
            - call: "GET /revrec/pobs/${pob_b}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { rec_b: $.data.recognized_revenue_cents, alloc_b: $.data.allocated_amount_cents }
          assert:
            - "POB ${pob_a} allocated_amount_cents == 100000 and recognized_revenue_cents == 25000 (INPUT_COST 20000/80000)"
            - "POB ${pob_b} allocated_amount_cents == 100000 and recognized_revenue_cents == 46667 (STRAIGHT_LINE 14/30, round_half_up)"
            - "25000 != 46667 — identical allocated amounts diverge by recognition pattern"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes: a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: vc_constraint_tiered_caps
        grounds:
          - calculations.variable_consideration_constraint
        distinguishing_aspect: |
          Mode (a): constrained = min(unconstrained, floor(unconstrained * cap)) with
          cap branched on contract.risk_tier — three inputs (unconstrained, tier, cap
          table) with non-linear tiered selection; the same 100000 constrains to
          85000 / 70000 / 50000 across STANDARD / ELEVATED / HIGH.
        test_recipe:
          setup:
            - "clock 2026-06-15; one customer; three DRAFT contracts (fixed 0, signed 2026-05-20) with risk_tier STANDARD, ELEVATED, HIGH respectively"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Tier Co", external_ref: "TIER-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-STD", signed_date: "2026-05-20", fixed_consideration_cents: 0, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_std: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-ELE", signed_date: "2026-05-20", fixed_consideration_cents: 0, risk_tier: "ELEVATED" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_ele: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-HI", signed_date: "2026-05-20", fixed_consideration_cents: 0, risk_tier: "HIGH" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_hi: $.data.id }
          trigger:
            - call: "POST /revrec/contracts/${c_std}/vc-estimates"
              payload: { method: "MOST_LIKELY", scenarios: [ { probability_bps: 10000, amount_cents: 100000 } ] }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { k_std: $.data.constrained_amount_cents }
            - call: "POST /revrec/contracts/${c_ele}/vc-estimates"
              payload: { method: "MOST_LIKELY", scenarios: [ { probability_bps: 10000, amount_cents: 100000 } ] }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { k_ele: $.data.constrained_amount_cents }
            - call: "POST /revrec/contracts/${c_hi}/vc-estimates"
              payload: { method: "MOST_LIKELY", scenarios: [ { probability_bps: 10000, amount_cents: 100000 } ] }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { k_hi: $.data.constrained_amount_cents }
          assert:
            - "STANDARD constrained_amount_cents == 85000"
            - "ELEVATED constrained_amount_cents == 70000"
            - "HIGH constrained_amount_cents == 50000"

      - name: ssp_allocation_rounding_residual
        grounds:
          - calculations.ssp_allocation
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — round_half_up per POB first,
          then assign the residual to the greatest-SSP POB. tx 1000000 over SSPs
          100000/200000/333333 rounds to 157895/315790/526316 (sum 1000001), so the
          residual -1 lands on the greatest-SSP POB: final 157895/315790/526315.
          'sum then round' would misstate POB C by one cent.
        test_recipe:
          setup:
            - "clock 2026-06-15; SSPs PA=100000, PB=200000, PC=333333 (region US, window [2026-01-01, 2026-12-31])"
            - "customer; DRAFT contract fixed 1000000 signed 2026-05-20 with three POBs created in order PA, PB, PC (all POINT_IN_TIME)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "PA", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "PB", region: "US", ssp_cents: 200000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "PC", region: "US", ssp_cents: 333333, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Round Co", external_ref: "RND-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-ALLOC", signed_date: "2026-05-20", fixed_consideration_cents: 1000000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PA", product_code: "PA", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_a: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PB", product_code: "PB", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_b: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PC", product_code: "PC", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_c: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "GET /revrec/pobs/${pob_a}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { al_a: $.data.allocated_amount_cents }
            - call: "GET /revrec/pobs/${pob_b}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { al_b: $.data.allocated_amount_cents }
            - call: "GET /revrec/pobs/${pob_c}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { al_c: $.data.allocated_amount_cents }
            - call: "GET /revrec/contracts/${c_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { alloc_total: $.data.allocated_total_cents }
          assert:
            - "POB ${pob_a} allocated_amount_cents == 157895"
            - "POB ${pob_b} allocated_amount_cents == 315790"
            - "POB ${pob_c} allocated_amount_cents == 526315 (greatest-SSP POB absorbed residual -1)"
            - "Contract.${c_id}.allocated_total_cents == 1000000 == transaction_price_cents"

      - name: catch_up_pinned_evaluation_order
        grounds:
          - calculations.catch_up_adjustment
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — allocated depends on transaction
          price, recognition target depends on allocated and ratio, catch-up depends
          on already-posted recognition. The pinned 7-step order yields exactly one
          +30000 entry; any other order (e.g. posting target without subtracting
          posted recognition) double-counts.
        test_recipe:
          setup:
            - "clock 2026-06-15; OPEN June period; SSP WIDGET/US 100000; customer"
            - "contract fixed 100000 ACTIVE with one OVER_TIME_INPUT_COST POB (est cost 40000); allocated 100000"
            - "cost entry 20000 at 2026-06-10 -> recognized 50000 (50%)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_id: $.data.id }
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "CatchUp Co", external_ref: "CU-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-CU", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "OVER_TIME_INPUT_COST", estimated_total_cost_cents: 40000 }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/pobs/${pob_id}/cost-entries"
              payload: { amount_cents: 20000, incurred_date: "2026-06-10" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/contracts/${c_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_v: $.data.version }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/modifications"
              payload: { mod_type: "CUMULATIVE_CATCH_UP", delta_fixed_consideration_cents: 60000, effective_date: "2026-06-15", expected_contract_version: "${c_v}" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { mod_id: $.data.id }
            - call: "POST /revrec/modifications/${mod_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "GET /revrec/pobs/${pob_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_alloc: $.data.allocated_amount_cents, pob_rec: $.data.recognized_revenue_cents }
            - call: "GET /revrec/revenue-entries"
              payload: { pob_id: "${pob_id}", entry_type: "CATCH_UP_ADJUSTMENT" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { catch_amt: "$.data[0].amount_cents" }
            - call: "GET /revrec/accounting-periods/${per_id}"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_total: $.data.recognized_total_cents }
          assert:
            - "Contract.${c_id} transaction_price_cents == 160000"
            - "POB allocated_amount_cents == 160000 (reallocated before target computation)"
            - "POB recognized_revenue_cents == 80000 (50000 posted + 30000 catch-up)"
            - "the single CATCH_UP_ADJUSTMENT entry amount_cents == 30000 (signed delta, not a re-posted 80000)"
            - "AccountingPeriod.${per_id} recognized_total_cents == 80000"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cyclic machines on different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_review_revision_cycle
        grounds:
          - state_machines.Contract.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Contract.CHANGES_REQUESTED_to_IN_REVIEW
        distinguishing_aspect: |
          Contract has a revision cycle (IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW)
          rather than a linear pipeline; the machine must traverse the loop and still
          reach APPROVED then ACTIVE.
        test_recipe:
          setup:
            - "clock 2026-06-15; SSP WIDGET/US 100000; customer; DRAFT contract fixed 100000 with one POINT_IN_TIME POB; no clauses"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Cycle Co", external_ref: "CYC-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-CYCLE", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/return"
              payload: { reason: "pricing questions" }
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { st_returned: $.data.status }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { st_resubmitted: $.data.status }
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { st_approved: $.data.status }
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { st_active: $.data.status }
          assert:
            - "after return: status == CHANGES_REQUESTED"
            - "after resubmit: status == IN_REVIEW (loop traversed)"
            - "after approve: status == APPROVED"
            - "after activate: status == ACTIVE"

      - name: review_task_rework_cycle
        grounds:
          - state_machines.ReviewTask.RECOMMENDED_to_IN_REVIEW
          - state_machines.ReviewTask.RECOMMENDED_to_DECIDED
        distinguishing_aspect: |
          ReviewTask (different entity than Contract) has a rework cycle
          RECOMMENDED -> IN_REVIEW via decision RETURN; a second recommend/decide
          round then reaches DECIDED and flips the clause to APPROVED.
        test_recipe:
          setup:
            - "clock 2026-06-15; customer; SSP WIDGET/US; DRAFT contract fixed 100000 with one POINT_IN_TIME POB and one non-standard clause; submitted -> one ReviewTask ASSIGNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Clause Co", external_ref: "CLZ-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-RT", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/clauses"
              payload: { clause_code: "NS-1", clause_type: "TERMINATION_FOR_CONVENIENCE", is_non_standard: true, clause_text: "customer may terminate for convenience" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { clause_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/review-tasks"
              payload: { contract_id: "${c_id}" }
              as: ContractReviewer
              as_user_id: "rev-1"
              captures: { task_id: "$.data[0].id" }
          trigger:
            - call: "POST /revrec/review-tasks/${task_id}/start"
              payload: {}
              as: ContractReviewer
              as_user_id: "rev-1"
            - call: "POST /revrec/review-tasks/${task_id}/recommend"
              payload: { recommendation: "APPROVE", note: "looks fine" }
              as: ContractReviewer
              as_user_id: "rev-1"
            - call: "POST /revrec/review-tasks/${task_id}/decide"
              payload: { decision: "RETURN", note: "need legal wording check" }
              as: ContractReviewer
              as_user_id: "rev-2"
              captures: { st_loop: $.data.status }
            - call: "POST /revrec/review-tasks/${task_id}/recommend"
              payload: { recommendation: "APPROVE", note: "wording confirmed" }
              as: ContractReviewer
              as_user_id: "rev-1"
            - call: "POST /revrec/review-tasks/${task_id}/decide"
              payload: { decision: "APPROVED" }
              as: ContractReviewer
              as_user_id: "rev-2"
              captures: { st_final: $.data.status }
            - call: "GET /revrec/contracts/${c_id}/clauses"
              payload: {}
              as: ContractReviewer
              as_user_id: "rev-2"
              captures: { clause_status: "$.data[0].status" }
          assert:
            - "after RETURN decision: task status == IN_REVIEW (rework loop, recommendation cleared)"
            - "after second decide APPROVED: task status == DECIDED"
            - "ContractClause.${clause_id} status == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_modification_catchup_to_period_totals
        grounds:
          - state_machines.ContractModification.PROPOSED_to_APPROVED
          - calculations.catch_up_adjustment
          - calculations.contract_balance_rollforward
        distinguishing_aspect: |
          Depth-4 chain from modification approval: fixed_consideration += delta ->
          ssp reallocation mutates POB.allocated_amount_cents -> moved targets post
          CATCH_UP_ADJUSTMENT RevenueEntries -> AccountingPeriod.recognized_total_cents
          mutates -> Contract.recognized_to_date_cents and balance fields mutate.
          Each hop is caused by the previous hop, not by the endpoint directly.
        test_recipe:
          setup:
            - "clock 2026-06-15; OPEN June period; SSPs PX=100000 (input-cost, est 50000), PY=300000 (straight-line 06-01..07-01)"
            - "contract fixed 200000 ACTIVE; allocation PX=50000, PY=150000"
            - "cost entry 25000 on PX at 2026-06-10 -> PX recognized 25000; recognize PY at clock 06-15 -> PY recognized 70000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_id: $.data.id }
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "PX", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "PY", region: "US", ssp_cents: 300000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Cascade Co", external_ref: "CASC-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-CASC", signed_date: "2026-05-20", fixed_consideration_cents: 200000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PX", product_code: "PX", region: "US", recognition_pattern: "OVER_TIME_INPUT_COST", estimated_total_cost_cents: 50000 }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_x: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PY", product_code: "PY", region: "US", recognition_pattern: "OVER_TIME_STRAIGHT_LINE", service_start_date: "2026-06-01", service_end_date: "2026-07-01" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_y: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/pobs/${pob_x}/cost-entries"
              payload: { amount_cents: 25000, incurred_date: "2026-06-10" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/pobs/${pob_y}/recognize"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/contracts/${c_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_v: $.data.version }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/modifications"
              payload: { mod_type: "CUMULATIVE_CATCH_UP", delta_fixed_consideration_cents: 200000, effective_date: "2026-06-15", expected_contract_version: "${c_v}" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { mod_id: $.data.id }
            - call: "POST /revrec/modifications/${mod_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "GET /revrec/pobs/${pob_x}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { x_alloc: $.data.allocated_amount_cents, x_rec: $.data.recognized_revenue_cents }
            - call: "GET /revrec/pobs/${pob_y}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { y_alloc: $.data.allocated_amount_cents, y_rec: $.data.recognized_revenue_cents }
            - call: "GET /revrec/revenue-entries"
              payload: { pob_id: "${pob_x}", entry_type: "CATCH_UP_ADJUSTMENT" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { x_catch: "$.data[0].amount_cents" }
            - call: "GET /revrec/revenue-entries"
              payload: { pob_id: "${pob_y}", entry_type: "CATCH_UP_ADJUSTMENT" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { y_catch: "$.data[0].amount_cents" }
            - call: "GET /revrec/accounting-periods/${per_id}"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_total: $.data.recognized_total_cents }
            - call: "GET /revrec/contracts/${c_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_rec: $.data.recognized_to_date_cents, c_asset: $.data.contract_asset_balance_cents }
          assert:
            - "hop 1: Contract.fixed_consideration_cents == 400000, transaction_price_cents == 400000"
            - "hop 2: POB ${pob_x} allocated 50000 -> 100000; POB ${pob_y} allocated 150000 -> 300000"
            - "hop 3: catch-up entries +25000 (PX target 50000) and +70000 (PY target 140000) exist"
            - "hop 4: AccountingPeriod.recognized_total_cents == 190000 (25000 + 70000 + 25000 + 70000)"
            - "hop 5: Contract.recognized_to_date_cents == 190000 and contract_asset_balance_cents == 190000 (nothing billed)"

      - name: cascade_period_reopen_supersedes_pack
        grounds:
          - state_machines.AccountingPeriod.CLOSED_to_REOPENED
          - state_machines.DisclosurePack.FINALIZED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-2 chain from period reopen (different trigger than instance
          cascade_modification_catchup_to_period_totals): reopen mutates the pack
          FINALIZED -> SUPERSEDED, and that supersession itself auto-creates a fresh
          DRAFT pack for the same period.
        test_recipe:
          setup:
            - "clock 2026-06-15; period June created; a DRAFT pack assembled by acct-1; period CLOSED; pack FINALIZED by ctrl-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_id: $.data.id }
            - call: "POST /revrec/accounting-periods/${per_id}/disclosure-packs"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pack_id: $.data.id }
            - call: "POST /revrec/disclosure-packs/${pack_id}/assemble"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/accounting-periods/${per_id}/close"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /revrec/disclosure-packs/${pack_id}/finalize"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
          trigger:
            - call: "POST /revrec/accounting-periods/${per_id}/reopen"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_status: $.data.status, per_reopened: $.data.reopened_once }
            - call: "GET /revrec/accounting-periods/${per_id}/disclosure-packs"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
              captures: { pack0_status: "$.data[0].status" }
          assert:
            - "AccountingPeriod.status == REOPENED and reopened_once == true"
            - "original pack ${pack_id} status == SUPERSEDED (mutation caused by reopen)"
            - "a second DisclosurePack exists for the period with status == DRAFT (auto-created by the supersession)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_state_vs_fiscal_on_modification_approve
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_OVER_RECOGNITION]
        distinguishing_aspect: |
          Pair state(p5) vs business_fiscal(p10): the modification approve request
          violates BOTH the state gate (owning contract ON_HOLD) and the fiscal
          guard (reallocation would push the POB's allocated below its recognized
          50000). The state error ERR_CONTRACT_NOT_ACTIVE must win over
          ERR_OVER_RECOGNITION.
        test_recipe:
          setup:
            - "clock 2026-06-15; OPEN June period; SSP WIDGET/US 100000; customer"
            - "contract fixed 100000 ACTIVE, one INPUT_COST POB est 40000; cost entry 20000 -> recognized 50000"
            - "PROPOSED modification CATCH_UP -90000 (would realloc allocated to 10000 < recognized 50000)"
            - "contract then placed ON_HOLD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Prio Co", external_ref: "PRIO-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-PRIO", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "OVER_TIME_INPUT_COST", estimated_total_cost_cents: 40000 }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/pobs/${pob_id}/cost-entries"
              payload: { amount_cents: 20000, incurred_date: "2026-06-10" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/contracts/${c_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_v: $.data.version }
            - call: "POST /revrec/contracts/${c_id}/modifications"
              payload: { mod_type: "CUMULATIVE_CATCH_UP", delta_fixed_consideration_cents: -90000, effective_date: "2026-06-15", expected_contract_version: "${c_v}" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { mod_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/hold"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /revrec/modifications/${mod_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTRACT_NOT_ACTIVE (state priority 5 beats business_fiscal priority 10)"
            - "error_id != ERR_OVER_RECOGNITION even though the -90000 delta would breach the fiscal guard"
            - "ContractModification.${mod_id} remains PROPOSED"

      - name: conflict_safety_vs_temporal_on_modification_approve
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_PERIOD_CLOSED]
        distinguishing_aspect: |
          Pair business_safety(p6) vs business_temporal(p7) — a different category
          pair than state-vs-fiscal: the approver equals the proposer (SoD) AND the
          clock date sits in a CLOSED period (catch-up could not post). The SoD
          error ERR_SOD_VIOLATION must win over ERR_PERIOD_CLOSED.
        test_recipe:
          setup:
            - "clock 2026-06-15; OPEN June period; SSP WIDGET/US 100000; customer"
            - "contract fixed 100000 ACTIVE, one INPUT_COST POB est 40000; cost entry 20000 -> recognized 50000"
            - "PROPOSED modification CATCH_UP +60000 created by X-User-ID user-7"
            - "June period CLOSED (clock still 2026-06-15, inside the closed period)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_id: $.data.id }
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "SoD Co", external_ref: "SOD-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-SOD", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "OVER_TIME_INPUT_COST", estimated_total_cost_cents: 40000 }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/pobs/${pob_id}/cost-entries"
              payload: { amount_cents: 20000, incurred_date: "2026-06-10" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/contracts/${c_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_v: $.data.version }
            - call: "POST /revrec/contracts/${c_id}/modifications"
              payload: { mod_type: "CUMULATIVE_CATCH_UP", delta_fixed_consideration_cents: 60000, effective_date: "2026-06-15", expected_contract_version: "${c_v}" }
              as: RevenueAccountant
              as_user_id: "user-7"
              captures: { mod_id: $.data.id }
            - call: "POST /revrec/accounting-periods/${per_id}/close"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
          trigger:
            - call: "POST /revrec/modifications/${mod_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "user-7"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SOD_VIOLATION (business_safety priority 6 beats business_temporal priority 7)"
            - "error_id != ERR_PERIOD_CLOSED even though the clock date 2026-06-15 sits in the CLOSED June period"
            - "ContractModification.${mod_id} remains PROPOSED"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics on different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_vc_scenario_weights_exactly_10000
        grounds:
          - calculations.variable_consideration_estimate
          - errors[ERR_SCENARIO_WEIGHTS]
        distinguishing_aspect: |
          Metric: probability-mass sum in basis points, gated exactly at == 10000.
          9999 is rejected with ERR_SCENARIO_WEIGHTS; exactly 10000 is accepted and
          the estimate is created — the boundary is inclusive-equality.
        test_recipe:
          setup:
            - "clock 2026-06-15; customer; DRAFT contract fixed 0, risk_tier STANDARD, signed 2026-05-20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
