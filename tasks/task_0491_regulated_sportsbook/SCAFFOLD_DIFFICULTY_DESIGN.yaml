# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — task_0491_regulated_sportsbook (§1.8)
# Test Targeting Index: 9 Difficulty Rules × ≥2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.6. Every setup_api_calls /
# trigger call resolves to a §1.5 endpoint; every ${var} is captured earlier;
# OCC expected_account_version always references a captured ${var}.
#
# Standard bootstrap notes:
#  - Logical clock default is 2026-01-01T00:00:00Z. Events use starts_at in the
#    future (e.g. 2026-02-01T18:00:00Z) so markets stay OPEN/SCHEDULED.
#  - Deposit/withdrawal/bonus-claim return a LedgerEntry/BonusGrant (no version
#    field), so the account version is re-read via GET /accounts/{id} before any
#    subsequent OCC write.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cashout_value_diverges_from_settlement_payout
        grounds:
          - calculations.cash_out_value
          - calculations.bet_settlement_payout
          - state_machines.Bet.PLACED_to_CASHED_OUT
          - entities.Bet.fields.actual_payout_cents
        distinguishing_aspect: |
          Same SINGLE bet (stake 5000, leg placed @+200): cash-out at a CURRENT
          line of +150 with 0.92 retention yields actual_payout_cents == 11500,
          whereas final settlement of the SAME bet WON at the LOCKED +200 line
          yields 15000 — two valid valuations of one Bet diverge by 3500.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z (default). Event SCHEDULED starts_at 2026-02-01T18:00:00Z."
            - "Market MONEYLINE OPEN cap 9_000_000; Selection AWAY @+200 (decimal 3.0)."
            - "Bettor account VERIFIED/ACTIVE, eligible geo, cash_balance 100000 after deposit."
            - "SINGLE bet stake 5000 on AWAY @+200 placed (potential_payout 15000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "co1@x.com", full_name: "Cash Out", date_of_birth: "1990-05-05", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "Home", away_team: "Away", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 9000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel: $.data.id }
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "SINGLE", stake_cents: 5000, legs: [{ selection_id: "${sel}" }], expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { bet: $.data.id }
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v3: $.data.version }
            - call: "PATCH /selections/${sel}"
              payload: { american_odds: 150 }
              as: TradingOps
          trigger:
            - call: "POST /bets/${bet}/cash-out"
              payload: { expected_account_version: "${v3}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { payout: $.data.actual_payout_cents, st: $.data.status }
          assert:
            - "Bet.${bet}.actual_payout_cents == 11500"
            - "Bet.${bet}.status == CASHED_OUT"
            - "cash-out used CURRENT line +150 (decimal 2.5) * 0.92, NOT the locked +200 line; settlement of the same ticket WON would have paid 15000"

      - name: net_loss_limit_diverges_from_gross_wager_limit
        grounds:
          - calculations.net_loss_limit_check
          - calculations.deposit_limit_check
          - validations[priority=14]
          - validations[priority=13]
        distinguishing_aspect: |
          On the SAME settled-bet history (one prior bet stake 6000 that WON
          paying 9000), a NET_LOSS_LIMIT of 10000 computes running loss as
          (6000-9000) = -3000 so a new 5000 stake is ACCEPTED, whereas a
          WAGER_LIMIT of 10000 computes gross stake 6000 so the same new 5000
          stake would be REJECTED — two algorithms on the Account loss domain
          diverge in outcome.
        test_recipe:
          setup:
            - "Verified/active Bettor, eligible geo, cash 100000."
            - "Event/market/selection AWAY @+200 OPEN."
            - "ACTIVE NET_LOSS_LIMIT DAILY 10000 control on the account."
            - "Prior SINGLE stake 6000 on AWAY @+200 placed then settled WON (payout 18000) — net loss is negative."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "nl1@x.com", full_name: "Net Loss", date_of_birth: "1985-03-03", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/rg-controls"
              payload: { control_type: "NET_LOSS_LIMIT", period: "DAILY", limit_cents: 10000, expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { v3: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel: $.data.id }
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "SINGLE", stake_cents: 6000, legs: [{ selection_id: "${sel}" }], expected_account_version: "${v3}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { bet1: $.data.id }
            - call: "POST /events/${ev}/status"
              payload: { to: "LIVE" }
              as: TradingOps
            - call: "POST /events/${ev}/result"
              payload: { home_score: 90, away_score: 110 }
              as: SettlementAgent
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v4: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H2", away_team: "A2", starts_at: "2026-02-02T18:00:00Z" }
              as: TradingOps
              captures: { ev2: $.data.id }
            - call: "POST /events/${ev2}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt2: $.data.id }
            - call: "POST /markets/${mkt2}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel2: $.data.id }
          trigger:
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "SINGLE", stake_cents: 5000, legs: [{ selection_id: "${sel2}" }], expected_account_version: "${v4}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { bet2: $.data.id, st: $.data.status }
          assert:
            - "Bet.${bet2}.status == PLACED"
            - "New 5000 stake ACCEPTED under NET_LOSS_LIMIT because prior settled bet WON (net loss = 6000-18000 = -12000 + 5000 = -7000 <= 10000); the SAME history under a WAGER_LIMIT(10000) gross test (6000+5000=11000) would have returned ERR_WAGER_LIMIT_EXCEEDED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: parlay_combined_odds_round_once_not_per_partial_product
        claim_type: combinatorial
        grounds:
          - calculations.combined_decimal_odds
          - calculations.potential_payout
          - entities.Bet.fields.combined_decimal_odds
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: a 2-leg PARLAY of -150 (decimal 1.6667)
          and +200 (decimal 3.0) yields combined_decimal_odds == 5.0001 only when
          the product is rounded ONCE at the end (1.6667*3.0=5.0001); rounding
          each partial product or truncating intermediates produces 5.0000.
          potential_payout for stake 2000 is floor(2000*5.0001)=10000.
        test_recipe:
          setup:
            - "Verified/active Bettor, eligible geo, cash 100000."
            - "Two events, each one MONEYLINE market with one selection: -150 and +200."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "cf1@x.com", full_name: "Combo Odds", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NFL", home_team: "H1", away_team: "A1", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev1: $.data.id }
            - call: "POST /events/${ev1}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt1: $.data.id }
            - call: "POST /markets/${mkt1}/selections"
              payload: { name: "HOME", american_odds: -150 }
              as: TradingOps
              captures: { sel1: $.data.id }
            - call: "POST /events"
              payload: { sport: "NFL", home_team: "H2", away_team: "A2", starts_at: "2026-02-01T20:00:00Z" }
              as: TradingOps
              captures: { ev2: $.data.id }
            - call: "POST /events/${ev2}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt2: $.data.id }
            - call: "POST /markets/${mkt2}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel2: $.data.id }
          trigger:
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "PARLAY", stake_cents: 2000, legs: [{ selection_id: "${sel1}" }, { selection_id: "${sel2}" }], expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { bet: $.data.id, combined: $.data.combined_decimal_odds, pot: $.data.potential_payout_cents }
          assert:
            - "Bet.${bet}.combined_decimal_odds == 5.0001"
            - "Bet.${bet}.potential_payout_cents == 10000"

      - name: settlement_effective_odds_drop_push_legs_then_apply
        claim_type: combinatorial
        grounds:
          - calculations.bet_settlement_payout
          - state_machines.Bet.PLACED_to_WON
          - state_machines.Event.LIVE_to_SETTLED
        distinguishing_aspect: |
          Mode (c) pinned-evaluation-order: settlement first grades each leg,
          THEN drops PUSH/VOID legs (decimal factor 1.0) before multiplying. A
          2-leg PARLAY (-150 WON, +200 PUSH on a TOTAL that landed exactly on the
          line) pays floor(stake * 1.6667) — the +200 leg is removed, not graded
          LOST — giving 3333 on stake 2000, not 0 and not 10000.
        test_recipe:
          setup:
            - "Verified/active Bettor, cash 100000, eligible geo."
            - "Event1 MONEYLINE selection HOME @-150; Event2 TOTAL line 50.0 selection OVER @+200."
            - "PARLAY stake 2000 on (HOME, OVER) placed."
            - "Event1 settled so HOME WON; Event2 settled with combined score exactly 50 so OVER is PUSH."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "cf2@x.com", full_name: "Push Drop", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H1", away_team: "A1", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev1: $.data.id }
            - call: "POST /events/${ev1}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt1: $.data.id }
            - call: "POST /markets/${mkt1}/selections"
              payload: { name: "HOME", american_odds: -150 }
              as: TradingOps
              captures: { sel1: $.data.id }
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H2", away_team: "A2", starts_at: "2026-02-01T20:00:00Z" }
              as: TradingOps
              captures: { ev2: $.data.id }
            - call: "POST /events/${ev2}/markets"
              payload: { market_type: "TOTAL", line: 50.0, liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt2: $.data.id }
            - call: "POST /markets/${mkt2}/selections"
              payload: { name: "OVER", american_odds: 200 }
              as: TradingOps
              captures: { sel2: $.data.id }
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "PARLAY", stake_cents: 2000, legs: [{ selection_id: "${sel1}" }, { selection_id: "${sel2}" }], expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { bet: $.data.id }
            - call: "POST /events/${ev1}/status"
              payload: { to: "LIVE" }
              as: TradingOps
            - call: "POST /events/${ev1}/result"
              payload: { home_score: 100, away_score: 90 }
              as: SettlementAgent
            - call: "POST /events/${ev2}/status"
              payload: { to: "LIVE" }
              as: TradingOps
            - call: "POST /events/${ev2}/result"
              payload: { home_score: 25, away_score: 25 }
              as: SettlementAgent
          trigger:
            - call: "GET /bets/${bet}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { st: $.data.status, payout: $.data.actual_payout_cents }
          assert:
            - "Bet.${bet}.status == WON"
            - "Bet.${bet}.actual_payout_cents == 3333"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_kyc_and_rg_dimensions_evolve_independently
        grounds:
          - state_machines.Account.PENDING_to_VERIFIED
          - state_machines.Account.ACTIVE_to_COOLING_OFF
          - entities.Account.fields.kyc_status
          - entities.Account.fields.rg_status
        distinguishing_aspect: |
          Parallel dimensions on ONE Account row: a VERIFY moves kyc_status
          PENDING→VERIFIED while leaving rg_status ACTIVE; a later COOLING_OFF
          moves rg_status ACTIVE→COOLING_OFF while leaving kyc_status VERIFIED —
          the two axes are independent and the combined state is (VERIFIED,
          COOLING_OFF).
        test_recipe:
          setup:
            - "Account registered (PENDING, ACTIVE)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "nlsm1@x.com", full_name: "Two Axes", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version, kyc1: $.data.kyc_status, rg1: $.data.rg_status }
          trigger:
            - call: "POST /accounts/${acct}/rg-controls"
              payload: { control_type: "COOLING_OFF", duration_days: 7, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { rg2: $.data.status }
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { kyc2: $.data.kyc_status, rg_final: $.data.rg_status }
          assert:
            - "Account.${acct}.kyc_status == VERIFIED"
            - "Account.${acct}.rg_status == COOLING_OFF"
            - "kyc1 == VERIFIED while rg1 == ACTIVE after VERIFY (rg axis untouched)"

      - name: market_open_suspend_reopen_cycle
        grounds:
          - state_machines.Market.OPEN_to_SUSPENDED
          - state_machines.Market.SUSPENDED_to_OPEN
          - entities.Market.fields.status
        distinguishing_aspect: |
          Cyclic shape on the Market entity (distinct from the Account parallel
          machine): OPEN→SUSPENDED→OPEN returns to a previously-visited state,
          which a linear pipeline forbids. After the round trip Market.status is
          OPEN again and accepts new bets.
        test_recipe:
          setup:
            - "Event SCHEDULED; one MONEYLINE market OPEN with current_liability 0."
          setup_api_calls:
            - call: "POST /events"
              payload: { sport: "MLB", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 9000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/status"
              payload: { to: "SUSPENDED" }
              as: TradingOps
              captures: { s1: $.data.status }
          trigger:
            - call: "POST /markets/${mkt}/status"
              payload: { to: "OPEN" }
              as: TradingOps
              captures: { s2: $.data.status }
          assert:
            - "Market.${mkt}.status == OPEN"
            - "s1 == SUSPENDED (intermediate) before the reopen completed the cycle"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_settle_grades_selection_then_leg_then_bet_then_wr
        grounds:
          - state_machines.Event.LIVE_to_SETTLED
          - state_machines.Bet.PLACED_to_LOST
          - state_machines.BonusGrant.ACTIVE_to_COMPLETED
          - calculations.wr_qualifying_contribution
        distinguishing_aspect: |
          Depth-4 cascade from ONE trigger (POST /events/{id}/result): Event
          SETTLED → Selection graded LOST → BetLeg.leg_result LOST → Bet LOST →
          the lost-but-settled qualifying stake advances its BonusGrant
          wagering_progress; each hop is caused by the prior hop, not by the
          original call directly.
        test_recipe:
          setup:
            - "Verified/active Bettor, eligible geo, cash 100000, bonus 2000 (claimed BET10, multiplier 5 → target 10000)."
            - "PARLAY-qualifying SINGLE stake 10000 @+200 on a MONEYLINE bound to the grant (bonus_grant_id set)."
            - "Event settled so HOME loses → AWAY selection LOST."
          setup_api_calls:
            - call: "POST /promotions"
              payload: { code: "BET10", bonus_cents: 2000, wagering_multiplier: 5, min_odds_american: -200, max_claims: 10 }
              as: TradingOps
              captures: { promo: $.data.id }
            - call: "POST /accounts"
              payload: { email: "casc1@x.com", full_name: "Cascade", date_of_birth: "1980-01-01", residence_state: "NJ" }
              as: Anonymous
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFY", expected_account_version: "${v0}" }
              as: ComplianceOfficer
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct}/deposits"
              payload: { amount_cents: 100000, expected_account_version: "${v1}" }
              as: Bettor
              as_user_id: "${acct}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct}/bonus-claims"
              payload: { promotion_id: "${promo}", expected_account_version: "${v2}" }
              as: Bettor
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v3: $.data.version }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
