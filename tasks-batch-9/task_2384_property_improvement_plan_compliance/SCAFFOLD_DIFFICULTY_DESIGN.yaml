          setup:
            - "One property with a plan holding a single GUEST_FACING item of 4000000 cents, issued and acknowledged."
            - "funding_requirement_cents is 4730000 at contingency 0.10, and the owner has authorised only 4000000 cents, so funding_gap_cents is 730000."
            - "The capital budget is still DRAFT, so both the state check and the fiscal check would fail."
