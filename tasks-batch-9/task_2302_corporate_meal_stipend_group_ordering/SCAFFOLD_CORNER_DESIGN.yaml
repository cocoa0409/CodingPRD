      - name: corner_order_two_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Order.fulfillment_status
          - state_machines.Order.settlement_status
        excluded_because:
          difficulty_instance: order_parallel_dimensions_delivered_stays_while_settlement_partially_refunds
          rationale: "The §1.8 instance already walks the parallel region end to end, holding fulfillment_status at DELIVERED while settlement_status advances CAPTURED -> PARTIALLY_REFUNDED -> REFUNDED, so a separate corner test would duplicate it."

      - name: corner_group_order_cycle_between_collecting_and_locked
        claim_type: cyclic
        grounds:
          - state_machines.GroupOrder.COLLECTING_to_LOCKED
          - state_machines.GroupOrder.LOCKED_to_COLLECTING
        excluded_because:
          difficulty_instance: group_order_cycles_lock_reopen_twice_then_third_reopen_rejected
          rationale: "The §1.8 instance traverses the lock/reopen cycle twice and asserts the counter-guarded exit on the third attempt, which is the strongest form of the cyclic-shape claim."

      - name: corner_credit_claim_fork_and_join
        claim_type: compound
        grounds:
          - state_machines.CreditClaim.SUBMITTED_to_ROUTED_EMPLOYEE_FIRST
          - state_machines.CreditClaim.SUBMITTED_to_ROUTED_PROPORTIONAL
          - state_machines.CreditClaim.ROUTED_PROPORTIONAL_to_SETTLED
        excluded_because:
          difficulty_instance: credit_claim_forks_two_routing_states_then_joins_at_settled
          rationale: "The fork into two routing states and the re-join at SETTLED is exactly what the §1.8 instance drives, including the DENIED branch that never joins."

      - name: corner_deliver_cascades_down_the_aggregate
        claim_type: cascade_down
        grounds:
          - state_machines.Order.fulfillment_status.CONFIRMED_to_DELIVERED
          - entities.BenefitPeriod.fields.spent_cents
        excluded_because:
          difficulty_instance: deliver_cascades_period_program_imputed_record_and_flips_employee_flag
          rationale: "The §1.8 instance asserts the whole four-hop fan-out of a single deliver call, which strictly contains the cascade-down claim."

      - name: corner_locked_tax_month_reaches_across_aggregates
        claim_type: cross_entity
        grounds:
          - state_machines.ImputedIncomeRecord.ACCRUING_to_LOCKED
          - state_machines.Order.fulfillment_status.CONFIRMED_to_DELIVERED
        excluded_because:
          difficulty_instance: locked_tax_month_record_blocks_deliver_of_a_backdated_order_from_a_later_period
          rationale: "A cascade from one aggregate root (BenefitPeriod close) blocking a transition on another (Order deliver) is the §1.8 instance's whole subject."

      - name: corner_settlement_keeps_the_refund_ledger_in_sync
        claim_type: ledger_sync
        grounds:
          - state_machines.Order.settlement_status.CAPTURED_to_PARTIALLY_REFUNDED
          - entities.RefundLedgerEntry
        excluded_because:
          difficulty_instance: settle_cascades_ledger_order_period_program_record_and_employee
          rationale: "The §1.8 instance asserts the ledger rows and every derived total they must agree with after one settle call, which is the ledger-sync claim in full."

      - name: corner_refund_compensates_the_original_capture
        claim_type: compensation
        grounds:
          - state_machines.Order.settlement_status.CAPTURED_to_PARTIALLY_REFUNDED
          - calculations.refund_routing_waterfall
        excluded_because:
          difficulty_instance: order_cash_conservation_holds_after_proportional_partial_refund
          rationale: "Compensation is asserted there as a conservation identity over the original capture and the reversing ledger rows, which is stronger than a status-only compensation test."

      - name: corner_group_cancel_cascades_only_to_open_member_orders
        claim_type: conditional_cascade
        grounds:
          - state_machines.GroupOrder.LOCKED_to_CANCELLED
          - state_machines.Order.fulfillment_status.PLACED_to_CANCELLED
        excluded_because:
          difficulty_instance: group_cancel_fans_out_to_member_orders_and_their_distinct_periods
          rationale: "The §1.8 instance already varies member state so that only DRAFT and PLACED members are cascaded, which is the conditional part of the cascade."

