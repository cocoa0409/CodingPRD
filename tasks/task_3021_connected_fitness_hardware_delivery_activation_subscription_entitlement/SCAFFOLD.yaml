    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["source_device_id?", "sold_device_id?", "status?", "limit?", "offset?"]
    output: RefurbBatch[]
    side_effects: []

  - method: GET
    path: "/fitness/refurb-batches/{batchId}"
    description: "Get one refurbishment batch"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: RefurbBatch
    side_effects: []

  - method: POST
    path: "/fitness/refurb-batches/{batchId}/certify"
    description: "Certify an inspected batch and price the refurbished unit by grade"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: RefurbBatch
    side_effects:
      - "status=CERTIFIED; resale_price_cents by grade (0.60 / 0.50 / 0.40 of list)"
      - "performance_resale_enabled forced false for grades B and C"
      - "ERR_CERTIFICATION_CHAIN_EXCEEDED when certification_chain_depth exceeds 3"
      - "ERR_CERTIFICATION_CYCLE when the source lineage self-loops"

  - method: POST
    path: "/fitness/refurb-batches/{batchId}/list"
    description: "List a certified batch for resale"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RefurbBatch
    side_effects: ["status=LISTED"]

  - method: POST
    path: "/fitness/refurb-batches/{batchId}/sell"
    description: "Sell a listed batch, minting the refurbished device with a reset warranty"
    roles: [PlatformAdmin]
    code: 200
    input: [buying_membership_id]
    output: RefurbBatch
    side_effects:
      - "status=SOLD; sold_device_id minted"
      - "the minted Device is REFURBISHED, provenance_source=RESALE, certifying_device_id=source_device_id, activation_status=ACTIVE, resale_cycle_count=1"
      - "minted Device.warranty_expires_at = current logical clock + 90 days"
      - "ERR_POSTURE_RESTRICTED when the buying membership posture is RESTRICTED or FROZEN"

  # --- test-driving endpoints -------------------------------------------------
  - method: POST
    path: "/fitness/_clock/set_current_utc"
    description: "Set the logical clock. DEFAULT startup value when never called is exactly 2026-09-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time."
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock is set to the supplied instant for all subsequent calls"]

  - method: POST
    path: "/fitness/_run_ops"
    description: "Advance the operations sweep: archive elapsed sessions, expire open enrollments, promote waitlists, terminate stale cancelled memberships"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ archived_sessions: integer, expired_enrollments: integer, promoted_waitlisters: integer, terminated_memberships: integer, decommissioned_devices: integer }"
    side_effects:
      - "runs run_ops_sweep; recomputes every affected live_enrollment_count and Membership.posture"

