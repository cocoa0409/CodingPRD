    roles: [FacilityOperator, ComplianceOfficer]
    input: ["name", "outlet_type", "gate_fee_per_wet_ton", "haul_rate_per_mile_per_wet_ton", "min_load_wet_tons", "max_annual_wet_tons", "min_percent_solids?"]
    output: AlternativeOutlet
