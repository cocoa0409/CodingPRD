              payload: { removal_type: "EMERGENCY_REMOVAL", removal_reason: "credible imminent concern" }
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /re-entry-plans"
              payload: { case_id: "${case_id}", conditions: ["counseling intake completed"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { rep_id: $.data.id }
            - call: "POST /re-entry-plans/${rep_id}/deny"
              payload: { denial_reason: "conditions insufficient" }
              as: TeamLead
              as_user_id: tl_1
          trigger:
            - call: "POST /re-entry-plans/${rep_id}/approve"
