# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Roofing & Storm-Restoration Contractor — Expert
# Nine Difficulty Rules (§0.5), >= 2 instances each (>= 18 total).
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.6.
# All formula-derived asserts are literals computed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_aerial_vs_field_diverge
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.source_kind
          - entities.Estimate.fields.final_total_cents
          - entities.Estimate.fields.aerial_contingency_pct
        distinguishing_aspect: "Same three line items on two estimates of the SAME job produce final_total_cents 567432 (AERIAL, +8% contingency) vs 525400 (FIELD, no contingency) — a 42032-cent divergence on the Estimate domain."
        test_recipe:
          setup:
            - "One estimator and one job (status irrelevant; estimates can be created from creation)."
            - "Two DRAFT estimates for the job: one AERIAL (aerial_contingency_pct=0.08), one FIELD; each carrying identical line items SHINGLE 20sq@18000 waste0.15, UNDERLAYMENT 20sq@4200 waste0.10, RIDGE_VENT 2sq@9500 waste0."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "AERIAL", aerial_contingency_pct: 0.08 }
              as: Estimator
              captures: { aerial_est_id: $.data.id }
            - call: "POST /estimates/${aerial_est_id}/line-items"
              payload: { trade: "SHINGLE", squares: 20, unit_price_cents: 18000, waste_factor_pct: 0.15 }
              as: Estimator
            - call: "POST /estimates/${aerial_est_id}/line-items"
              payload: { trade: "UNDERLAYMENT", squares: 20, unit_price_cents: 4200, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${aerial_est_id}/line-items"
              payload: { trade: "RIDGE_VENT", squares: 2, unit_price_cents: 9500, waste_factor_pct: 0 }
              as: Estimator
            - call: "POST /estimates/${aerial_est_id}/finalize"
              payload: {}
              as: Estimator
              captures: { aerial_total: $.data.final_total_cents }
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { field_est_id: $.data.id }
            - call: "POST /estimates/${field_est_id}/line-items"
              payload: { trade: "SHINGLE", squares: 20, unit_price_cents: 18000, waste_factor_pct: 0.15 }
              as: Estimator
            - call: "POST /estimates/${field_est_id}/line-items"
              payload: { trade: "UNDERLAYMENT", squares: 20, unit_price_cents: 4200, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${field_est_id}/line-items"
              payload: { trade: "RIDGE_VENT", squares: 2, unit_price_cents: 9500, waste_factor_pct: 0 }
              as: Estimator
          trigger:
            - call: "POST /estimates/${field_est_id}/finalize"
              payload: {}
              as: Estimator
              captures: { field_total: $.data.final_total_cents }
          assert:
            - "Estimate.${aerial_est_id}.line_subtotal_cents == 525400"
            - "Estimate.${aerial_est_id}.final_total_cents == 567432"
            - "Estimate.${field_est_id}.final_total_cents == 525400"
            - "Estimate.${aerial_est_id}.final_total_cents - Estimate.${field_est_id}.final_total_cents == 42032"

      - name: warranty_prorated_vs_short_rate_diverge
        grounds:
          - calculations.warranty_refund
          - entities.Warranty.fields.cancel_basis
          - entities.Warranty.fields.refund_cents
        distinguishing_aspect: "On the Warranty domain (different entity than Estimate), cancelling the same ACTIVE warranty (premium 120000, term 120mo, 18mo elapsed) yields refund_cents 102000 under PRORATED vs 91800 under SHORT_RATE — a 10200-cent divergence."
        test_recipe:
          setup:
            - "A COMPLETED job with an ACTIVE warranty (premium_cents=120000, term_months=120) whose start_at is 2026-01-01; clock advanced to 2026-07-01 (18 months elapsed) before cancel."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ProductionManager
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-01-02T08:00:00Z", scheduled_end: "2026-01-02T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
            - call: "POST /material-orders"
              payload: { job_id: "${job_id}" }
              as: ProductionManager
              captures: { mo_id: $.data.id }
            - call: "POST /material-orders/${mo_id}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /permits"
              payload: { job_id: "${job_id}", municipality: "Dallas" }
              as: ProductionManager
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: { permit_number: "P-9001" }
              as: ProductionManager
            - call: "POST /jobs/${job_id}/start-production"
              payload: {}
              as: ProductionManager
              captures: { jv_prod: $.data.version }
            - call: "POST /draws"
              payload: { job_id: "${job_id}", cumulative_pct: 1.0, expected_job_version: "${jv_prod}" }
              as: ProductionManager
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "PERMIT_FINAL", permit_id: "${permit_id}", scheduled_start: "2026-01-20T08:00:00Z", scheduled_end: "2026-01-20T10:00:00Z" }
              as: FieldAdjuster
              captures: { pf_id: $.data.id }
            - call: "POST /inspections/${pf_id}/complete"
              payload: { outcome: "PASS" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: ProductionManager
            - call: "POST /warranties"
              payload: { job_id: "${job_id}", premium_cents: 120000, term_months: 120 }
              as: ProductionManager
              captures: { war_id: $.data.id }
            - call: "POST /warranties/${war_id}/activate"
              payload: {}
              as: ProductionManager
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProductionManager
          trigger:
            - call: "POST /warranties/${war_id}/cancel"
              payload: { cancel_basis: "SHORT_RATE" }
              as: ProductionManager
              captures: { refund: $.data.refund_cents }
          assert:
            - "Warranty.${war_id}.status == CANCELLED"
            - "Warranty.${war_id}.refund_cents == 91800"
            - "the PRORATED variant on the same inputs would be 102000 (delta 10200)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_round_per_line_then_sum_order
        grounds:
          - calculations.estimate_total
          - entities.EstimateLineItem.fields.line_cost_cents
          - entities.Estimate.fields.line_subtotal_cents
        distinguishing_aspect: "Mode (b) nested rounding where order matters: three FIELD lines (10/10.25/10.5 squares, waste0.10, unit1850) give round-per-line-then-sum=62577 but sum-then-round=62576; the scaffold pins round-per-line-then-sum, so line_subtotal_cents MUST be 62577."
        test_recipe:
          setup:
            - "One DRAFT FIELD estimate carrying three line items whose per-line raw cents have fractional parts straddling a rounding boundary."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "WIND", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 1850, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "UNDERLAYMENT", squares: 10.25, unit_price_cents: 1850, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "DECKING", squares: 10.5, unit_price_cents: 1850, waste_factor_pct: 0.10 }
              as: Estimator
          trigger:
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
              captures: { subtotal: $.data.line_subtotal_cents }
          assert:
            - "Estimate.${est_doc_id}.line_subtotal_cents == 62577"
            - "Estimate.${est_doc_id}.final_total_cents == 62577"

      - name: material_sizing_nonlinear_min_ceil_tier
        grounds:
          - calculations.material_order_sizing
          - entities.MaterialOrder.fields.bundles
          - entities.MaterialOrder.fields.freight_cents
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: bundles=max(MIN_BUNDLES=12, ceil(squares*1.15*3)) then tiered freight selection on total_weight_lbs; SHINGLE=20 -> bundles=69, weight=5520, freight=21500 (tier-3 with ceil overflow)."
        test_recipe:
          setup:
            - "A CONTRACTED job whose bound estimate has a single SHINGLE line of 20 squares; a material order is then placed."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-02-01T08:00:00Z", scheduled_end: "2026-02-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 20, unit_price_cents: 18000, waste_factor_pct: 0.15 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
          trigger:
            - call: "POST /material-orders"
              payload: { job_id: "${job_id}" }
              as: ProductionManager
              captures: { mo_id: $.data.id }
          assert:
            - "MaterialOrder.${mo_id}.bundles == 69"
            - "MaterialOrder.${mo_id}.total_weight_lbs == 5520"
            - "MaterialOrder.${mo_id}.freight_cents == 21500"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: job_branch_completed_vs_lost
        grounds:
          - state_machines.Job.ESTIMATED_to_CONTRACTED
          - state_machines.Job.ESTIMATED_to_LOST
          - state_machines.Job.IN_PRODUCTION_to_COMPLETED
        distinguishing_aspect: "Job is a branching fork-join: from ESTIMATED it forks to CONTRACTED (continues toward COMPLETED, sets contract_value) or LOST (terminal, sets lost_reason, no ledger) — divergent side-effect sets per branch on the Job entity."
        test_recipe:
          setup:
            - "Two jobs both advanced to ESTIMATED with a finalized FIELD estimate (single SHINGLE line 10sq@10000)."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "A Lose", property_address: "2 Pine St", peril: "WIND", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_lost_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_lost_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MINOR" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_lost_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_lost_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_lost_id}/mark-estimated"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /jobs/${job_lost_id}/lose"
              payload: { lost_reason: "homeowner went with another bidder" }
              as: FieldAdjuster
              captures: { final_status: $.data.status }
          assert:
            - "Job.${job_lost_id}.status == LOST"
            - "Job.${job_lost_id}.lost_reason == 'homeowner went with another bidder'"
            - "Job.${job_lost_id}.contract_value_cents == 0"
            - "Job.${job_lost_id}.bound_estimate_id == null"

      - name: change_order_branch_applied_vs_voided
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - state_machines.ChangeOrder.APPROVED_to_VOIDED
          - state_machines.ChangeOrder.PROPOSED_to_VOIDED
        distinguishing_aspect: "On a DIFFERENT entity (ChangeOrder), APPROVED forks to APPLIED (mutates Job.contract_value_cents) or VOIDED (no ledger mutation) — branching with divergent side effects, distinct from Job's branch."
        test_recipe:
          setup:
            - "A CONTRACTED job (contract 110000) with one APPROVED change order delta_cents=50000."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
            - call: "POST /change-orders"
              payload: { job_id: "${job_id}", reason: "decking rot", delta_cents: 50000 }
              as: ProductionManager
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/approve"
              payload: {}
              as: ProductionManager
          trigger:
            - call: "POST /change-orders/${co_id}/void"
              payload: {}
              as: ProductionManager
              captures: { co_status: $.data.status }
          assert:
            - "ChangeOrder.${co_id}.status == VOIDED"
            - "Job.${job_id}.contract_value_cents == 110000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: change_order_apply_cascade_depth3
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - entities.Job.fields.contract_value_cents
          - entities.Job.fields.remaining_billable_cents
          - calculations.material_order_sizing
          - entities.MaterialOrder.fields.bundles
        distinguishing_aspect: "Depth-3 cascade from ChangeOrder.apply: (1) Job.contract_value_cents += delta_cents; (2) that new contract_value re-derives Job.remaining_billable_cents; (3) because extra_shingle_squares>0, the ORDERED MaterialOrder is re-sized (bundles 35 -> 104). Each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "A CONTRACTED job (contract 110000, bound estimate single SHINGLE 10sq) with an ORDERED MaterialOrder (bundles=35) and an APPROVED change order delta_cents=60000, extra_shingle_squares=20."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
              payload: { job_id: "${job_id}", kind: "DAMAGE_ASSESSMENT", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: FieldAdjuster
              captures: { da_id: $.data.id }
            - call: "POST /inspections/${da_id}/complete"
              payload: { outcome: "PASS", damage_severity: "MODERATE" }
              as: FieldAdjuster
            - call: "POST /jobs/${job_id}/mark-inspected"
              payload: {}
              as: FieldAdjuster
            - call: "POST /estimates"
              payload: { job_id: "${job_id}", source_kind: "FIELD" }
              as: Estimator
              captures: { est_doc_id: $.data.id }
            - call: "POST /estimates/${est_doc_id}/line-items"
              payload: { trade: "SHINGLE", squares: 10, unit_price_cents: 10000, waste_factor_pct: 0.10 }
              as: Estimator
            - call: "POST /estimates/${est_doc_id}/finalize"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/mark-estimated"
              payload: {}
              as: Estimator
            - call: "POST /jobs/${job_id}/contract"
              payload: { estimate_id: "${est_doc_id}" }
              as: Estimator
              captures: { jv_contract: $.data.version }
            - call: "POST /material-orders"
              payload: { job_id: "${job_id}" }
              as: ProductionManager
              captures: { mo_id: $.data.id }
            - call: "POST /change-orders"
              payload: { job_id: "${job_id}", reason: "expand scope", delta_cents: 60000, extra_shingle_squares: 20 }
              as: ProductionManager
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/approve"
              payload: {}
              as: ProductionManager
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ProductionManager
              captures: { jv_now: $.data.version }
          trigger:
            - call: "POST /change-orders/${co_id}/apply"
              payload: { expected_job_version: "${jv_now}" }
              as: ProductionManager
          assert:
            - "ChangeOrder.${co_id}.status == APPLIED"
            - "Job.${job_id}.contract_value_cents == 170000"
            - "Job.${job_id}.remaining_billable_cents == 170000"
            - "MaterialOrder.${mo_id}.bundles == 104"
            - "MaterialOrder.${mo_id}.total_weight_lbs == 8320"

      - name: warranty_activate_cascade_depth2
        grounds:
          - state_machines.Warranty.PENDING_to_ACTIVE
          - entities.Job.fields.retainage_held_cents
          - entities.Job.fields.disbursed_net_cents
        distinguishing_aspect: "Depth-2 cascade from a DIFFERENT trigger (Warranty.activate): (1) Warranty -> ACTIVE; (2) that activation releases the job's retainage so Job.retainage_held_cents -> 0 and the released amount adds to Job.disbursed_net_cents. The second hop is caused by the first."
        test_recipe:
          setup:
            - "A COMPLETED job that was billed to 100% via one progress draw (50% then final 100%); retainage_held_cents=5500 from the 50% draw; a PENDING warranty exists."
          setup_api_calls:
            - call: "POST /estimators"
              payload: { name: "Ann Est", license_no: "TX-1001" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "POST /jobs"
              payload: { customer_name: "Homer R", property_address: "1 Oak St", peril: "HAIL", assigned_estimator_id: "${est_id}" }
              as: FieldAdjuster
              captures: { job_id: $.data.id }
            - call: "POST /inspections"
