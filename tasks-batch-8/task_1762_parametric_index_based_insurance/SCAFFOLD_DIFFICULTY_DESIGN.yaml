  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_bind_gated_on_invoice_paid_state
        grounds:
          - state_machines.ParametricPolicy.QUOTED_to_BOUND
          - state_machines.PremiumInvoice
        distinguishing_aspect: |
          ParametricPolicy.QUOTED->BOUND is gated on the state of a different
          entity pair: the child PremiumInvoice must be PAID. A policy whose
          invoice is only PARTIALLY_PAID rejects bind with ERR_PREMIUM_NOT_PAID;
          after the final installment flips the invoice to PAID, the identical
          bind request succeeds — the dependency crosses Policy->Invoice.
        test_recipe:
          setup:
            - "Program ACTIVE ADMITTED, index ACTIVE freq 0.20 elr 0.60, holder ACTIVE"
            - "Policy si 2,000,000 quoted (invoice 306,000); first payment of 200,000 applied -> PARTIALLY_PAID"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-XD1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-X1", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-X1", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-X1", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-X1", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
