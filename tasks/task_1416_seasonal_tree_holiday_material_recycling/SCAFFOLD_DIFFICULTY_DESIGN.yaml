              as_user_id: "${vid}"
              captures: { e: $.data.error_id }
          assert:
            - "VolunteerShift.${sh1}.status == SIGNED_UP and VolunteerShift.${sh2}.status == SIGNED_UP (adjacent half-open intervals admitted)"
            - "Overlap: error_id == ERR_SHIFT_OVERLAP (409)"

      - name: chipping_run_buffer_gap
        grounds:
