            - call: "GET /districts/${d_id}/schools/${s_id}/interventionists/${i_id}"
              payload: {}
              as: TeamLead
              captures: { committed: $.data.committed_minutes_per_week }
          assert:
            - "Plan creation SUCCEEDED (capacity boundary is inclusive: 90 <= 90 accepts)"
            - "Interventionist.committed_minutes_per_week == 90 (== weekly_minute_capacity)"
            - "Any subsequent plan create on the same interventionist with weekly_minute_cost > 0 would exceed capacity (90+1 > 90) and return ERR_CAPACITY_EXCEEDED"

      - name: sped_referral_min_weeks_boundary
        grounds:
          - validations[priority=10]
          - calculations.slope_decision
        distinguishing_aspect: |
          Empty/zero-style boundary on a different metric: sped referral precondition uses
          weeks_at_tier3_unresponsive >= sped_referral_min_weeks. With min=4, a student at
          exactly 4 unresponsive weeks is ELIGIBLE; at 3 they are NOT. Metric: integer week
          counter (different metric from minutes). Endpoint: POST sped-referrals (distinct
          from POST plans).
        test_recipe:
          setup:
            - "District D with sped_referral_min_weeks=4"
            - "Student A2 at TIER_3 with ACTIVE TIER_3 plan, weeks_at_tier3_unresponsive==3"
          setup_api_calls:
            - call: "POST /districts"
