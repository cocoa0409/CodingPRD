scaffold_corner_design:
  # =========================================================================
  # From Table 1 — Entities
  # =========================================================================
  - section: entities
    instances:
      - name: application_get_not_found
        claim_type: not_found
        grounds:
          - "endpoints.\"GET /applications/{id}\""
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but non-existent application id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              as: FilmOfficeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 404 and error_id == ERR_NOT_FOUND"

      - name: application_create_missing_required_field
        claim_type: required_fields
        grounds:
          - "endpoints.\"POST /applications\""
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /applications without the required synopsis field returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A company exists; clock at default."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "C1", contact_email: "c1@x.test", primary_contact: "Z" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "NoSyn", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 400 and error_id == ERR_INVALID_REQUEST (synopsis missing)"

      - name: department_create_invalid_enum
        claim_type: type_constraints
        grounds:
          - "entities.Department.fields.code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /departments with code outside {POLICE,PARKING,FIRE,PUBLIC_WORKS} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /departments"
              payload: { code: "MAYOR", name: "Mayor", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: production_company_system_fields_minted
        claim_type: system_fields
        grounds:
          - "entities.ProductionCompany.fields.compliance_score"
        distinguishing_aspect: "Server mints id/created_at/version and initializes compliance_score to 100 on creation; client cannot set them."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /production-companies"
              payload: { legal_name: "Sys Co", contact_email: "s@x.test", primary_contact: "Q" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id, ver: $.data.version }
          assert:
            - "response HTTP 201; ProductionCompany.${pc_id}.version == 1"
            - "ProductionCompany.${pc_id}.compliance_score == 100"

      - name: application_list_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.\"GET /applications\""
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "GET /applications?production_company_id=... returns an array envelope with total_count and has_more."
        test_recipe:
          setup: ["One company with two DRAFT applications."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "List Co", contact_email: "l@x.test", primary_contact: "R" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "L1", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "L2", synopsis: "x", shoot_start_at: "2026-06-02T08:00:00Z", shoot_end_at: "2026-06-02T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "GET /applications?production_company_id=${pc_id}"
              as: FilmOfficeCoordinator
          assert:
            - "response_type == array; meta.total_count == 2; has_more == false"

      - name: application_initial_state_is_draft
        claim_type: creation
        grounds:
          - "state_machines.PermitApplication"
          - "entities.PermitApplication.fields.status"
        distinguishing_aspect: "A newly created application starts in DRAFT with version 1."
        test_recipe:
          setup: ["A company exists."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Init Co", contact_email: "i@x.test", primary_contact: "S" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Init", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id, st: $.data.status }
          assert:
            - "PermitApplication.${app_id}.status == DRAFT; version == 1"

      - name: shoot_days_computed_field
        claim_type: computed_fields
        grounds:
          - "entities.PermitApplication.fields.shoot_days"
        excluded_because:
          difficulty_instance: combinatorial_formula / permit_fee_nonlinear_crew_and_flags
          rationale: "That instance asserts shoot_days == 2 on the same computed formula."

  # =========================================================================
  # From Table 2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: issue_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.PermitApplication"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Issuing an application still in DRAFT (no submit) is an undefined transition and returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT application exists; capture its version for the OCC token."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Inv Co", contact_email: "iv@x.test", primary_contact: "T" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Inv", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "GET /applications/${app_id}"
              as: FilmOfficeCoordinator
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/issue"
              payload: { expected_application_version: "${v1}" }
              as: FilmOfficeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 and error_id == ERR_INVALID_STATE"

      - name: review_decision_on_approved_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.DepartmentReview"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "APPROVED is terminal for DepartmentReview; a second decision on it returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Company + POLICE(ALL) dept; application UNDER_REVIEW; its review APPROVED."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Term Co", contact_email: "t@x.test", primary_contact: "U" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Term", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 T", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /department-reviews?application_id=${app_id}&department_id=${dept_pol_id}"
              as: FilmOfficeCoordinator
              captures: { rev_id: "$.data[0].id" }
            - call: "POST /department-reviews/${rev_id}/decision"
              payload: { decision: "APPROVE" }
              as: DepartmentReviewer
              as_user_id: "${dept_pol_id}"
          trigger:
            - call: "POST /department-reviews/${rev_id}/decision"
              payload: { decision: "REJECT" }
              as: DepartmentReviewer
              as_user_id: "${dept_pol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 and error_id == ERR_INVALID_STATE (review already APPROVED)"

      - name: coi_verify_valid_transition
        claim_type: valid_transition
        grounds:
          - "state_machines.InsuranceCertificate.SUBMITTED_to_VERIFIED"
          - "entities.InsuranceCertificate.fields.status"
        distinguishing_aspect: "Verifying a SUBMITTED COI moves it to VERIFIED."
        test_recipe:
          setup: ["Company + DRAFT application + one SUBMITTED COI."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Coi Co", contact_email: "co@x.test", primary_contact: "V" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Coi", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "GET /applications/${app_id}"
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { v1: $.data.version }
            - call: "POST /applications/${app_id}/insurance-certificates"
              payload: { policy_number: "POL-C", coverage_amount_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", expected_application_version: "${v1}" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { coi_id: $.data.id }
          trigger:
            - call: "POST /insurance-certificates/${coi_id}/verify"
              payload: { decision: "VERIFY" }
              as: FilmOfficeCoordinator
              captures: { st: $.data.status }
          assert:
            - "InsuranceCertificate.${coi_id}.status == VERIFIED"

      - name: submit_side_effect_creates_matching_reviews
        claim_type: side_effect_execution
        grounds:
          - "state_machines.PermitApplication.DRAFT_to_UNDER_REVIEW"
          - "entities.DepartmentReview"
        distinguishing_aspect: "Submit fans out one DepartmentReview per matching department: with POLICE(ALL) and FIRE(ALL), two PENDING reviews are created."
        test_recipe:
          setup: ["Company + two ALL_APPLICATIONS depts; a DRAFT application with one location."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Fan Co", contact_email: "f@x.test", primary_contact: "W" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "FIRE", name: "Fire", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_fire_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Fan", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 F", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /department-reviews?application_id=${app_id}"
              as: FilmOfficeCoordinator
          assert:
            - "GET /department-reviews?application_id=${app_id} returns meta.total_count == 2, both status PENDING"

      - name: resubmit_from_under_review_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.PermitApplication"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting an application that is already UNDER_REVIEW is not a defined transition and returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Company + POLICE(ALL) dept; application submitted (UNDER_REVIEW)."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Idem Co", contact_email: "id@x.test", primary_contact: "X" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Idem", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 I", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 and error_id == ERR_INVALID_STATE"

      - name: issue_cascade_confirm_and_block
        claim_type: side_effect_execution
        grounds:
          - "state_machines.RoadClosureBooking.PENDING_to_BLOCKED"
        excluded_because:
          difficulty_instance: transitive_cascade / issue_cascade_depth3
          rationale: "Booking CONFIRMED/BLOCKED and the assignment-cancel hop are asserted by the depth-3 cascade instance."

  # =========================================================================
  # From Table 3 — Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: officer_assignment_cost_correct_result
        claim_type: correct_result
        grounds:
          - "calculations.officer_assignment_cost"
          - "entities.OfficerAssignment.fields.billed_cost_cents"
        distinguishing_aspect: "billed_cost_cents = hourly_rate_cents * ceil(hours): 8000/hr over a 4-hour shift == 32000."
        test_recipe:
          setup: ["Company + POLICE(ALL) dept + officer (8000/hr); application UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Cost Co", contact_email: "cost@x.test", primary_contact: "Y" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /officers"
              payload: { full_name: "Ofc Cost", badge_number: "B-C", rank: "OFFICER", hourly_rate_cents: 8000 }
              as: FilmOfficeCoordinator
              captures: { officer_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Cost", synopsis: "x", shoot_start_at: "2026-06-01T06:00:00Z", shoot_end_at: "2026-06-01T20:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 Cost", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T06:00:00Z", requested_end_at: "2026-06-01T20:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /officer-assignments"
              payload: { application_id: "${app_id}", officer_id: "${officer_id}", shift_start_at: "2026-06-01T08:00:00Z", shift_end_at: "2026-06-01T12:00:00Z" }
              as: FilmOfficeCoordinator
              captures: { cost: $.data.billed_cost_cents }
          assert:
            - "OfficerAssignment.billed_cost_cents == 32000 (8000 * 4h)"

      - name: deposit_amount_correct
        claim_type: correct_result
        grounds:
          - "calculations.deposit_amount"
          - "entities.PermitApplication.fields.deposit_cents"
        excluded_because:
          difficulty_instance: dual_variant_calc / permit_fee_estimate_vs_final
          rationale: "That instance asserts deposit_cents == 89900 (20% of total + one bond)."

      - name: final_fee_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - "calculations.permit_fee"
        excluded_because:
          difficulty_instance: dual_variant_calc / permit_fee_estimate_vs_final
          rationale: "FINAL excludes the DENIED still-photo rider; asserted there."

  # =========================================================================
  # From Table 4 — Validations
  # =========================================================================
  - section: validations
    instances:
      - name: application_invalid_time_range
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_INVALID_TIME_RANGE]"
        distinguishing_aspect: "shoot_end_at not after shoot_start_at returns 422 ERR_INVALID_TIME_RANGE."
        test_recipe:
          setup: ["A company exists."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Time Co", contact_email: "tm@x.test", primary_contact: "AA" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Bad", synopsis: "x", shoot_start_at: "2026-06-01T18:00:00Z", shoot_end_at: "2026-06-01T08:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 422 and error_id == ERR_INVALID_TIME_RANGE"

      - name: deposit_payment_before_issue_not_allowed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=30]"
          - "errors[ERR_PAYMENT_NOT_ALLOWED]"
        distinguishing_aspect: "A DEPOSIT payment while the application is UNDER_REVIEW (not ISSUED) returns 409 ERR_PAYMENT_NOT_ALLOWED."
        test_recipe:
          setup: ["Company + POLICE(ALL) dept; application UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Pay Co", contact_email: "pay@x.test", primary_contact: "BB" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Pay", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 Pay", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /applications/${app_id}/payments"
              payload: { entry_type: "DEPOSIT", amount_cents: 5000 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 and error_id == ERR_PAYMENT_NOT_ALLOWED"

      - name: issue_fee_unpaid_only
        claim_type: violation_to_error
        grounds:
          - "validations[priority=60]"
          - "errors[ERR_FEE_UNPAID]"
        distinguishing_aspect: "With all reviews APPROVED and a VERIFIED COI but no permit fee paid, issue returns 402 ERR_FEE_UNPAID (fiscal check reached because higher-priority checks pass)."
        test_recipe:
          setup: ["Company + POLICE(ALL) dept; application UNDER_REVIEW, review APPROVED, COI VERIFIED, permit fee NOT paid."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Fee Co", contact_email: "fee@x.test", primary_contact: "CC" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Fee", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 Fee", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /applications/${app_id}"
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { v1: $.data.version }
