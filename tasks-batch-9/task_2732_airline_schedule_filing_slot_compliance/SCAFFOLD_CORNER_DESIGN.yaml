          setup:
            - "Home carrier HX; MUC and TXL LEVEL_2_FACILITATED; Season W26 OPEN; ScheduleVersion W26-D2 with one MUC->TXL leg on 2026-11-03 08:00Z->09:00Z carrying booked_economy 10."
