      - name: consent_solicitation_decline_records_reason_and_moves_counters
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /neighborhood-safety/consent-solicitations/{id}/decline]
          - state_machines.ConsentSolicitation.status.SOLICITED_to_DECLINED
