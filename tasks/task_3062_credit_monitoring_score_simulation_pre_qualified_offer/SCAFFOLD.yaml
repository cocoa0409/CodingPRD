    description: "List the dispute referrals of one consumer"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DisputeReferral[]
    side_effects: []

  - method: GET
    path: "/credit/bureau-snapshots/{id}/dispute-referrals"
    description: "List the dispute referrals observed on one bureau snapshot"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DisputeReferral[]
    side_effects: []

  - method: GET
    path: "/credit/referrals/{id}/dispute-referrals"
    description: "List the dispute referrals routed through one referral consent"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DisputeReferral[]
    side_effects: []

  - method: GET
    path: "/credit/bureau-snapshots/{id}/pre-qualification-decisions"
    description: "List the pre-qualification decisions pinned to one bureau snapshot"
    roles: [LenderOps, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PreQualificationDecision[]
    side_effects: []

  - method: GET
    path: "/credit/dispute-referrals/{id}"
    description: "Get one dispute referral"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DisputeReferral
    side_effects: []

  - method: GET
    path: "/credit/revenue-recognition-entries/{id}"
    description: "Get one revenue recognition entry"
    roles: [LenderOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RevenueRecognitionEntry
    side_effects: []

  # --- Referrals ---
  - method: POST
    path: "/credit/referrals"
    description: "Route a consent-carrying decision to a lender and open a referral"
    roles: [LenderOps]
    code: 201
    input: [external_referral_ref, channel, offer_id]
    output: Referral
    side_effects:
      - "create Referral(status = SENT); revenue_share_bps and clawback_days copied from the sponsoring program"
      - "the linked decision transitions CONSENTED → CONSUMED"
      - "the linked ConsentRecord transitions PENDING → SEALED; consumer_pii_ciphertext minted; lender_routing_netloc stamped"
      - "increments Consumer.version by 1"

  - method: GET
    path: "/credit/referrals"
    description: "List referrals"
    roles: [Consumer, LenderOps, Referee, ComplianceOfficer, PlatformAdmin, DataProtectionOfficer]
    code: 200
    input: ["consumer_id?", "decision_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/credit/referrals/{id}"
    description: "Get one referral"
    roles: [Consumer, LenderOps, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/credit/referrals/{id}/fund"
    description: "Record that the lender funded the referral and recognize platform revenue"
    roles: [LenderOps]
    code: 200
    input: [funded_amount_cents]
    output: Referral
    side_effects:
      - "status = FUNDED; funded_at = logical clock"
      - "consume the consent: the linked decision transitions CONSENTED → CONSUMED and the ConsentRecord transitions PENDING → SEALED"
      - "compute_revenue_recognition_amount gross_then_net → create RevenueRecognitionEntry(entry_kind = REVENUE)"
      - "compute_calibration_index recomputed for the catalog item"
      - "increments Consumer.version by 1"

  - method: POST
    path: "/credit/referrals/{id}/decline"
    description: "Record that the lender declined the referral"
    roles: [LenderOps]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "status = DECLINED"
      - "release the consent: the linked ConsentRecord transitions PENDING → NOT_SEALED"
      - "compute_calibration_index recomputed for the catalog item"

  - method: POST
    path: "/credit/referrals/{id}/reverse"
    description: "Reverse a funded referral inside the clawback window"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [reason_code]
    output: Referral
    side_effects:
      - "status = REVERSED; reversed_at = logical clock"
      - "compute_revenue_recognition_amount → create RevenueRecognitionEntry(entry_kind = CLAWBACK)"
      - "compute_calibration_index recomputed for the catalog item"
      - "increments Consumer.version by 1"

  - method: GET
    path: "/credit/revenue-recognition-entries"
    description: "List revenue recognition entries"
    roles: [LenderOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["referral_id?", "consumer_id?", "entry_kind?", "limit?", "offset?"]
    output: RevenueRecognitionEntry[]
    side_effects: []

  # --- Dispute referrals and accuracy education ---
  - method: POST
    path: "/credit/dispute-referrals"
    description: "Draft a credit-report inaccuracy referral against a bureau snapshot"
    roles: [Consumer, Referee]
    code: 201
    input: [consumer_id, snapshot_id, inaccuracy_type, narrative]
    output: DisputeReferral
    side_effects:
      - "status = DRAFT"
      - "education_code is computed on read from inaccuracy_type"
      - "referral_id left null until a consent-carrying referral exists"

  - method: GET
    path: "/credit/dispute-referrals"
    description: "List dispute referrals"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin, DataProtectionOfficer]
    code: 200
    input: ["consumer_id?", "snapshot_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: DisputeReferral[]
    side_effects: []

  - method: POST
    path: "/credit/dispute-referrals/{id}/submit"
    description: "Submit a drafted dispute referral to the bureau route"
    roles: [Referee]
    code: 200
    input: [referral_id]
    output: DisputeReferral
    side_effects:
      - "status = SUBMITTED_OFFLINE; referral_count = 1"
      - "consumer.open_dispute_count += 1"

  - method: POST
    path: "/credit/dispute-referrals/{id}/acknowledge"
    description: "Record the bureau's acknowledgement and case reference"
    roles: [Referee]
    code: 200
    input: [bureau_case_ref]
    output: DisputeReferral
    side_effects: ["status = ACKNOWLEDGED_BY_BUREAU; bureau_case_ref stored"]

  - method: POST
    path: "/credit/dispute-referrals/{id}/withdraw"
    description: "Withdraw a submitted dispute referral"
    roles: [Referee]
    code: 200
    input: []
    output: DisputeReferral
    side_effects: ["status = WITHDRAWN; consumer.open_dispute_count -= 1"]

  - method: GET
    path: "/credit/consumers/{id}/content-quality-facets"
    description: "List the content quality facets of one consumer"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ContentQualityFacet[]
    side_effects: []

  # --- Score tiers ---
  - method: POST
    path: "/credit/score-tiers"
    description: "Create a score tier threshold"
    roles: [PlatformAdmin]
    code: 201
    input: [tier_code, min_score, max_score, factor_catalog]
    output: ScoreTierThreshold
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/credit/score-tiers"
    description: "List score tier thresholds"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScoreTierThreshold[]
    side_effects: []

  - method: POST
    path: "/credit/score-tiers/{id}/activate"
    description: "Activate a score tier threshold"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ScoreTierThreshold
    side_effects: ["status = ACTIVE"]

  - method: POST
    path: "/credit/score-tiers/{id}/retire"
    description: "Retire a score tier threshold"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ScoreTierThreshold
    side_effects: ["status = RETIRED"]

  # --- Render policy, content quality and presentation caps ---
  - method: PUT
    path: "/credit/consumers/{id}/render-policy"
    description: "Set the render policy overrides for one consumer"
    roles: [Referee, PlatformAdmin]
    code: 200
    input: ["blanket_presentation_override?", "content_quality_override?"]
    output: RenderPolicy
    side_effects: ["upsert the consumer's RenderPolicy; render_posture recomputed"]

  - method: GET
    path: "/credit/render-policies"
    description: "List consumer render policies"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["consumer_id?", "render_posture?", "limit?", "offset?"]
    output: RenderPolicy[]
    side_effects: []

  - method: POST
    path: "/credit/consumers/{id}/content-quality-facets"
    description: "Create a content quality facet for one consumer"
    roles: [Referee, PlatformAdmin]
    code: 201
    input: [topic, score_bps]
    output: ContentQualityFacet
    side_effects: ["status = COMPLETE when score_bps >= CONTENT_QUALITY_MIN, else INCOMPLETE"]

  - method: GET
    path: "/credit/content-quality-facets"
    description: "List content quality facets"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["consumer_id?", "topic?", "status?", "limit?", "offset?"]
    output: ContentQualityFacet[]
    side_effects: []

  - method: POST
    path: "/credit/content-quality-facets/{id}/score"
    description: "Set the authored completeness score of a content quality facet"
    roles: [Referee, PlatformAdmin]
    code: 200
    input: [score_bps]
    output: ContentQualityFacet
    side_effects: ["score_bps updated; status recomputed against CONTENT_QUALITY_MIN"]

  - method: GET
    path: "/credit/offer-presentation-caps"
    description: "List offer presentation caps"
    roles: [Consumer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["consumer_id?", "product_kind?", "limit?", "offset?"]
    output: OfferPresentationCap[]
    side_effects: []

  # --- Operations run and logical clock ---
  - method: POST
    path: "/credit/_ops/runs"
    description: "Execute one daily operations run. The logical clock defaults to 2026-09-01T00:00:00Z at server start and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 201
    input: [run_key]
    output: OpsRun
    side_effects:
      - "daily mobility run: snapshot staleness sweep, referral UNFUNDED sweep, decision EXPIRY_ELIGIBLE, program expiry"
      - "settlement run: revenue recognition for FUNDED referrals; clawback for REVERSED referrals inside the window"
      - "adverse-selection run: ELIGIBLE decisions with a stale snapshot return to NEEDS_SNAPSHOT"
      - "consent-sealing run: seal at most CONSENT_SEAL_MAX_PER_RUN PENDING consents in created_at ASC, id ASC order"
      - "retention run: archive ConsentRecords past RETENTION_DAYS"
      - "cap-window run: reset presented_count; stale-offer run: RENDERED offers to STALE"
      - "calibration run: recompute every catalog item's approval_odds_calibration_index"
      - "posture rollup: recompute Consumer.monitoring_posture and RenderPolicy.render_posture; OpsRun to COMPLETED or PARTIAL"

  - method: POST
    path: "/credit/_clock/set_current_utc"
    description: "Set the logical clock used by every deadline, staleness, window and TTL rule. Before any call the clock reads exactly 2026-09-01T00:00:00Z."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock is set; no entity state changes"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing or malformed X-User-ID / X-User-Role headers, a malformed body, a negative amount, an actions array outside 1..5 entries, or a referral funding amount that is not a positive integer" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "The caller's role is declared in §1.7 but not permitted for this endpoint" }
  - { id: ERR_CONSUMER_NOT_FOUND, http: 404, condition: "A path-segment id does not resolve to an existing resource of the type the segment names" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The target resource is in a status from which the requested transition is not declared, including any transition attempted from PULL_REQUESTED, CANCELLED, FUNDED, REVERSED, DECLINED, UNFUNDED, SEALED, NOT_SEALED, ACKNOWLEDGED_BY_BUREAU, WITHDRAWN, CONSUMED, EXPIRED, COMPLETED, PARTIAL, RETIRED or OFFBOARDED" }
  - { id: ERR_PRIOR_BUREAU_SNAPSHOT_EXISTS, http: 409, condition: "Monitoring consent is granted for a consumer whose score_version is greater than 0" }
  - { id: ERR_MONITORING_CONSENT_ALREADY_GRANTED, http: 409, condition: "monitoring_consent_at is already non-null on the consumer" }
  - { id: ERR_MONITORING_NOT_CONSENTED, http: 409, condition: "A bureau pull is requested for a consumer whose monitoring_consent_at is null" }
  - { id: ERR_PULL_COOLDOWN_ACTIVE, http: 409, condition: "A bureau pull or a snapshot replay is requested within PULL_COOLDOWN_HOURS of the most recent pull" }
  - { id: ERR_PULL_RESULT_EMPTY, http: 409, condition: "The submitted factor_codes census carries no entry, so the pull is cancelled and the snapshot row is written as CANCELLED" }
  - { id: ERR_SNAPSHOT_MOVED, http: 409, condition: "The pinned snapshot attached to a decision is no longer ACTIVE" }
  - { id: ERR_SHARED_CRITERION_NO_SNAPSHOT, http: 409, condition: "A shared criterion is evaluated against a snapshot that no longer exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "The payload's expected_consumer_version does not equal the consumer's current version" }
  - { id: ERR_SIMULATION_NEEDS_SNAPSHOT, http: 409, condition: "A score simulation is requested for a consumer whose score_version is 0" }
  - { id: ERR_QUALIFY_OVER_REPRESENTED, http: 409, condition: "is_over_presentation is true for the (consumer, product) pair, so the decision may not be promoted to PREQUALIFIED" }
  - { id: ERR_OFFER_PRESENTATION_CAP_EXCEEDED, http: 409, condition: "The consumer's presented_count for the offer's product_kind has reached floor(presentation_cap_bps * total_offer_count / 10000)" }
  - { id: ERR_PRESENTATION_INELIGIBLE, http: 409, condition: "presentation_policy_eligible is false for the pinned snapshot and program — the program's min_modeled_score or max_eligible_utilization_pct is exceeded, or the sponsor is not ACTIVE" }
  - { id: ERR_CONSUMER_STATE_EXCLUDED, http: 409, condition: "The consumer's state_code is outside the sponsor's states_served" }
  - { id: ERR_LENDER_SERVES_STATE_REQUIRED, http: 409, condition: "A decision is created for a program whose sponsor does not serve the consumer's state_code" }
  - { id: ERR_COLLATERAL_ELIGIBILITY_CHANGED, http: 409, condition: "A hard TargetingCriterion that matched when the decision was created no longer matches at presentation time" }
  - { id: ERR_RENDER_COMPLETENESS_INCOMPLETE, http: 409, condition: "whole_render_completeness is false for the pinned snapshot and program, and the consumer's blanket_presentation_override is false" }
  - { id: ERR_CONSENT_NOT_PENDING, http: 409, condition: "No ConsentRecord exists for the (consumer, decision) pair, or the existing one is not in status PENDING" }
  - { id: ERR_CONSENT_ALREADY_CONSUMED, http: 409, condition: "The decision's ConsentRecord is no longer PENDING, so the one-time consent cannot be reused" }
  - { id: ERR_CONSENT_DECISION_NOT_PREQUALIFIED, http: 409, condition: "Consent is recorded for a decision whose status is not PREQUALIFIED" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "The decision's fresh_until has passed, so the offer is unpresentable" }
  - { id: ERR_OFFER_NOT_RENDERED, http: 409, condition: "A referral is opened for an offer that has not reached status RENDERED" }
  - { id: ERR_REFERRAL_NOT_FUNDED, http: 409, condition: "A reversal or clawback is requested for a referral that has never been funded" }
  - { id: ERR_CLAWBACK_WINDOW_CLOSED, http: 409, condition: "The reversal instant falls after funded_at + clawback_days days" }
  - { id: ERR_REFERRAL_ALREADY_FUNDED, http: 409, condition: "A funding is recorded for a referral that is already in a terminal status" }
  - { id: ERR_CLAWBACK_ALREADY_APPLIED, http: 409, condition: "A second clawback entry is posted for a referral that already carries one" }
  - { id: ERR_DUPLICATE_REFERRAL_REF, http: 409, condition: "external_referral_ref is not unique across Referrals" }
  - { id: ERR_DISPUTE_CAP_EXCEEDED, http: 409, condition: "More than PENDING_DISPUTE_CAP dispute referrals are held in status SUBMITTED_OFFLINE at any one time for one consumer" }
  - { id: ERR_DISPUTE_SNAPSHOT_REQUIRED, http: 409, condition: "A dispute referral is created without an ACTIVE or SUPERSEDED bureau snapshot for the consumer" }
  - { id: ERR_PROGRAM_NOT_DELIVERABLE, http: 409, condition: "The logical clock is outside the program's [go_live_at, expiry_at] interval" }
  - { id: ERR_PROGRAM_PAUSED, http: 409, condition: "The sponsoring program is in status PAUSED or EXPIRED" }
  - { id: ERR_PROGRAM_CODE_DUPLICATE, http: 409, condition: "program_code is not unique across LenderPrograms" }
  - { id: ERR_LENDER_NOT_ACTIVE, http: 409, condition: "A program is activated or resumed while its sponsoring lender is not ACTIVE" }
  - { id: ERR_LENDER_NOT_COMPLIANT, http: 409, condition: "A lender is activated while compliance_status is not APPROVED" }
  - { id: ERR_LENDER_HAS_ACTIVE_PROGRAM, http: 409, condition: "A lender is offboarded while it still sponsors a program in status ACTIVE" }
  - { id: ERR_ITEM_HAS_ACTIVE_PROGRAM, http: 409, condition: "A catalog item is retired while an ACTIVE program references it" }
  - { id: ERR_ITEM_NO_SCORE_TIER, http: 409, condition: "A catalog item is activated while no ACTIVE score tier intersects its score band" }
  - { id: ERR_TIER_CODE_DUPLICATE, http: 409, condition: "tier_code is already held by an ACTIVE score tier" }
  - { id: ERR_TIER_BAND_OVERLAP, http: 409, condition: "The tier's [min_score, max_score] band overlaps another ACTIVE tier's band" }
  - { id: ERR_FACET_SCORE_BELOW_MINIMUM, http: 409, condition: "A content quality facet is scored below CONTENT_QUALITY_MIN, so it cannot reach COMPLETE" }
  - { id: ERR_CONSUMER_HAS_OPEN_REFERRAL, http: 409, condition: "A consumer is closed while at least one referral is still SENT" }
  - { id: ERR_CONSUMER_HAS_OPEN_DECISION, http: 409, condition: "A consumer is closed while at least one decision is ELIGIBLE or PREQUALIFIED" }
  - { id: ERR_OPS_RUN_KEY_DUPLICATE, http: 409, condition: "run_key is not unique across OpsRuns" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 409, condition: "The logical clock is set to an instant strictly earlier than its current value; equal values are accepted as a no-op" }

# =============================================================================
# Table 7: RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Consumer
    description: "The monitored individual: grants consent, pulls monitoring views, simulates actions, generates and renders offers, and refers inaccuracies"
    identity: entity_backed:Consumer
    exclusive_operations:
      - "POST /credit/consumers — self-enroll"
      - "POST /credit/consumers/{consumer_id}/monitoring-consent"
      - "POST /credit/consumers/{consumer_id}/simulations"
      - "POST /credit/consumers/{consumer_id}/pre-qualifications"
      - "POST /credit/pre-qualification-decisions/{decision_id}/present"
      - "POST /credit/offers/{offer_id}/render"
      - "POST /credit/score-alerts/{alert_id}/acknowledge"
      - "PUT /credit/consumers/{consumer_id}/score-alert-threshold"
    shared_operations:
      - "POST /credit/consumers/{consumer_id}/consents/{decision_id}/complete — with Referee"
      - "POST /credit/dispute-referrals — with Referee"

  - name: Referee
    description: "Operations referee: qualifies decisions, drives dispute submission, authors content quality and render policy"
    identity: opaque
    exclusive_operations:
      - "POST /credit/pre-qualification-decisions/{decision_id}/qualify"
      - "POST /credit/dispute-referrals/{dispute_id}/submit"
      - "POST /credit/dispute-referrals/{dispute_id}/acknowledge"
      - "POST /credit/dispute-referrals/{dispute_id}/withdraw"
      - "POST /credit/content-quality-facets/{facet_id}/score"
      - "POST /credit/score-alerts/{alert_id}/suppress"
      - "POST /credit/score-simulations/{simulation_id}/settle"
    shared_operations:
      - "PUT /credit/consumers/{consumer_id}/render-policy — with PlatformAdmin"
      - "POST /credit/consumers/{consumer_id}/content-quality-facets — with PlatformAdmin"

  - name: BureauConnector
    description: "Bureau data connector: performs scheduled pulls and replays cancelled pulls; never reads consumer identity data"
    identity: opaque
    exclusive_operations:
      - "POST /credit/consumers/{consumer_id}/bureau-snapshots"
      - "POST /credit/bureau-snapshots/{snapshot_id}/replay"
    shared_operations: []

  - name: LenderOps
    description: "Lender operations: authors targeting criteria and records funding, declines and referrals"
    identity: opaque
    exclusive_operations:
      - "POST /credit/referrals"
      - "POST /credit/referrals/{referral_id}/fund"
      - "POST /credit/referrals/{referral_id}/decline"
    shared_operations:
      - "POST /credit/lender-programs/{program_id}/targeting-criteria — with PlatformAdmin"

  - name: ComplianceOfficer
    description: "Compliance and audit: reversals, compliance determinations, offer withdrawal, program pause, lender state changes"
    identity: opaque
    exclusive_operations:
      - "POST /credit/referrals/{referral_id}/reverse"
    shared_operations:
      - "POST /credit/lenders/{lender_id}/compliance-status — with PlatformAdmin"
      - "POST /credit/lender-programs/{program_id}/pause — with PlatformAdmin"
      - "POST /credit/lender-programs/{program_id}/resume — with PlatformAdmin"
      - "POST /credit/offers/{offer_id}/withdraw — with PlatformAdmin"
      - "PUT /credit/consumers/{consumer_id}/render-policy — with Referee"

  - name: PlatformAdmin
    description: "Platform operator: catalog, lenders, programs, score tiers, operations runs and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /credit/lenders, POST /credit/lenders/{lender_id}/activate, POST /credit/lenders/{lender_id}/offboard"
      - "POST /credit/lender-programs, POST /credit/lender-programs/{program_id}/activate"
      - "POST /credit/catalog/items, POST /credit/catalog/items/{item_id}/activate, POST /credit/catalog/items/{item_id}/retire"
      - "POST /credit/score-tiers, POST /credit/score-tiers/{tier_id}/activate, POST /credit/score-tiers/{tier_id}/retire"
      - "POST /credit/_ops/runs, POST /credit/_clock/set_current_utc"
    shared_operations:
      - "POST /credit/consumers/{consumer_id}/consents/{decision_id}/complete — with Consumer"

  - name: DataProtectionOfficer
    description: "Data protection officer: closes consumers and exercises retention over consent archives"
    identity: opaque
    exclusive_operations:
      - "POST /credit/consumers/{consumer_id}/close"
    shared_operations: []