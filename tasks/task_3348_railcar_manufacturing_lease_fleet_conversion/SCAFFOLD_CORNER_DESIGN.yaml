    distinguishing_aspect: A return whose projected mileage charge is 40008 against a lessee already carrying
      a settled balance of 60000 and a credit ceiling of 99996 (sum 100008, exactly 12 cents over) is
      rejected with ERR_CREDIT_LIMIT_EXCEEDED and HTTP 402, while the same car returned one mile earlier
      at 3333 miles would land exactly on the ceiling.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CR-100 (BOXCAR, build_hours 1, regulatory_life_years 15, line_count_family CR_LINE) with
        one WS-CR-1 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 100.
      - A RETAINED order of quantity 2 (planned_shop_days 2, order_date 2026-09-01, required_delivery_date
        2026-09-20, horizon 19 >= ceil(5 / 1) = 5) is reserved, released, changed over on CR-L1 for [2026-09-02,
        2026-09-04) and completed on 2026-09-04, producing two HELD cars. No lessee_id is set on the order,
        so the RETAINED credit term of §1.3 lessee_balance_reconciliation cannot offset the balance.
      - Lessee "Credit Ceiling Rail Co" has credit_tier A, utilization_threshold_pct 60 and credit_ceiling_cents
        99996; a NET contract (per_diem_rate_cents 2000, liability_bearer LESSEE, term 2026-09-01..2027-09-01,
        fleet_car_cap 10) is ACTIVE for it.
      - 'Both cars are placed 2026-09-05..2026-10-05 with mileage_allowance 0, so blocks = ceil(30 / 30)
        = 1 and included_miles = 1 * 0 = 0: every mile run is overage at 12 cents.'
      - Car A is returned first at 5000 miles, giving overage 5000 * 12 = 60000; that return is settled,
        so Lessee.outstanding_balance_cents becomes 60000 and car A is UNDER_REPAIR.
