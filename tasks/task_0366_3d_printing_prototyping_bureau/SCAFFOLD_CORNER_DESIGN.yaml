            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "occ2@x.com", display_name: "OCC2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
