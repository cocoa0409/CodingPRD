      - name: corner_stale_facility_version_rejects_staging_request
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[staging-window-create-stale-facility]
          - validations[priority=7]
          - errors[ERR_STALE_FACILITY_VERSION]
          - endpoints[POST /jda/staging-windows]
        distinguishing_aspect: |
          Two different write paths bump SharedFacility.version — another developer request (which does not
          change capacity) and an approval (which does) — so a developer holding a pre-request version and a
          developer holding a pre-approval version both get 412 ERR_STALE_FACILITY_VERSION, and the version
          advances by exactly 1 per write.
        test_recipe:
