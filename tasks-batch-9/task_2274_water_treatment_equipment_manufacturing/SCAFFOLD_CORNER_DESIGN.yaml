            - '${package_404_id} == ERR_EQUIPMENT_PACKAGE_NOT_FOUND'
      - name: cancel_on_an_unknown_fat_run_is_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=8]
          - errors[ERR_FAT_RUN_NOT_FOUND]
        distinguishing_aspect: |
          Existence at priority 8 outranks the SCHEDULED guard at priority 28: an unknown {run_id}
