      - name: segment_retirement_invalidates_pending_application_approval
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_SEGMENT_NOT_ACTIVE]", state_machines.CharterAmendmentApplication.APPROVED_to_EFFECTIVE]
        distinguishing_aspect: "A segment ACTIVE at application creation but RETIRED by the time of approval fails the re-validation: ERR_SEGMENT_NOT_ACTIVE, and no Member is created."
