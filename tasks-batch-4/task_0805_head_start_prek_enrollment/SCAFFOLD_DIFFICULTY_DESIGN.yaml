scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: priority_points_provisional_vs_verified
        grounds:
          - calculations.priority_points
          - entities.Application.fields.priority_points
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_ELIGIBLE
        distinguishing_aspect: |
          The provisional priority_points at submit (65) and the verified priority_points at
          verify-eligibility (58) diverge on the SAME Application because the tiered income band
          shifts when verified income (1,600,000) replaces declared income (800,000).
        test_recipe:
          setup:
            - "HEAD_START program; PRESCHOOL_4 cohort [48,60]mo; Family TANF hh3 declared income 800000; DRAFT application, child dob 2022-01-10 (55mo)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160, ada_chronic_threshold_pct: 0.10 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF", homeless_status: false }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
              captures: { prio_prov: "$.data.priority_points" }
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 1600000 }
              as: EnrollmentSpecialist
              captures: { prio_ver: "$.data.priority_points" }
          assert:
            - "${prio_prov} == 65"
            - "${prio_ver} == 58"
            - "Application.${app_id}.status == \"ELIGIBLE\""

      - name: ada_period_to_date_vs_annualized
        grounds:
          - calculations.ada_rate
          - entities.Enrollment.fields.ada_rate
          - entities.Enrollment.fields.annualized_ada_rate
        distinguishing_aspect: |
          For identical attendance (9 present of 10 instructional days), the period-to-date variant
          (9/10 = 0.9) and the annualized variant (9/160 = 0.0563) produce different ada figures on
          the SAME Enrollment because they use different denominators.
        test_recipe:
          setup:
            - "Enrollment ACTIVE for AB in a program with total_instructional_days=160; 10 instructional attendance days recorded, 9 PRESENT and 1 ABSENT_UNEXCUSED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160, ada_chronic_threshold_pct: 0.10 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /enrollments?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-02", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-03", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-04", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-05", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-06", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-09", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-10", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-11", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-12", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr_id}", attendance_date: "2026-03-13", status: "ABSENT_UNEXCUSED", instructional_day: true }
              as: FamilyServicesWorker
          trigger:
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { ada: "$.data.ada_rate", ann: "$.data.annualized_ada_rate" }
          assert:
            - "${ada} == 0.9"
            - "${ann} == 0.0563"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_points_max_and_tiered_and_cap
        grounds:
          - calculations.priority_points
          - entities.Application.fields.priority_points
          - entities.Family.fields.homeless_status
          - entities.Family.fields.categorical_eligibility
        distinguishing_aspect: |
          Mode (a): priority_points combines >=3 inputs non-linearly — categorical_points is a MAX
          (max(homeless 40, FOSTER 35) = 40, NOT a sum), income is a tiered step (0.2738 -> 25),
          plus conditional disability (15) and age (10), all clamped by min(90, raw); raw=90 -> 90.
        test_recipe:
          setup:
            - "HEAD_START program; PRESCHOOL_4 cohort; Family homeless + FOSTER, hh5 income 1000000; DRAFT application child_has_iep true, dob 2022-03-05 (53mo)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "C", household_size: 5, annual_income_cents: 1000000, categorical_eligibility: "FOSTER", homeless_status: true }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Ci", child_last_name: "C", child_dob: "2022-03-05", child_has_iep: true }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
              captures: { prio: "$.data.priority_points", elig: "$.data.eligibility_category" }
          assert:
            - "${prio} == 90"
            - "${elig} == \"HOMELESS\""

      - name: pir_avg_ada_round_then_average_order
        grounds:
          - calculations.pir_aggregates
          - entities.PIRReport.fields.avg_ada_rate
          - entities.Enrollment.fields.ada_rate
        distinguishing_aspect: |
          Mode (b): avg_ada_rate rounds each enrollment's ada_rate to 4dp FIRST then averages
          (0.9 + 0.8)/2 = 0.85, which differs from the sum-then-divide order
          (9+4)/(10+5) = 0.8667. The scaffold pins the per-enrollment-round-then-average order.
        test_recipe:
          setup:
            - "Program with two ACTIVE enrollments: enr1 has 9 present of 10 instructional days (ada 0.9); enr2 has 4 present of 5 instructional days (ada 0.8)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam1: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "A", household_size: 4, annual_income_cents: 1400000, categorical_eligibility: "SNAP" }
              as: EnrollmentSpecialist
              captures: { fam2: "$.data.id" }
            - call: "POST /applications"
