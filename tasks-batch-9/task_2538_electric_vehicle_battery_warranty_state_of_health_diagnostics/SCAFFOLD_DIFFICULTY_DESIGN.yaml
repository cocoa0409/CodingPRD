  - rule_id: combinatorial_formula
    instances:
      - name: remedy_cost_per_line_rounding_before_summation
        mode: "b - rounding order pinned"
        grounds:
          - calculations.remedy_cost_estimate
          - calculations.remedy_decision
          - entities.WarrantyClaim.fields.remedy_cost_cents
          - entities.WarrantyProgram.fields.labor_hours_module
          - entities.BatteryPack.fields.gross_weight_kg
        distinguishing_aspect: |
          Two of the four line items are fractional - labor 3.25 h * 18333 c/h = 59582.25 and hazmat
          2500 c per 100 kg * 90.618 kg = 2265.45 - and each rounds DOWN on its own while their
          fractional parts sum to 0.75; the pinned per-line-then-sum order therefore yields exactly
          508847, one cent below the 508848 a sum-then-round implementation produces.
        test_recipe:
          setup:
            - "Reference price book: module_unit_price_cents 145000, diagnostic_fee_cents 12000, labor_hours_module 3.25, surcharge_un3481_cents 2500, module_replacement_cap 3."
            - "Center labor rate 18333 cents/hour; pack gross_weight_kg 483.296 over 16 modules."
            - "Vehicle in service 2020-03-10 with retention 70.00 % and THREE faulted modules (positions 3, 7, 11), so remedy_decision returns MODULE_REPLACEMENT (F = 3 is exactly at MIN(allowance 3, module_cap 4), so the ladder does not escalate to a pack)."
            - "Expected line items: parts 3 * 145000 = 435000 (exact), labor ROUND_HALF_UP(59582.25) = 59582, hazmat shipped_kg ROUND_HALF_UP(483.296 * 3 / 16, 3) = 90.618 then ROUND_HALF_UP(2265.45) = 2265, diagnostic 12000."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center", hv_certification_level: "L3", has_pack_lift: true, labor_rate_cents_per_hour: 18333 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000001", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0001", nominal_capacity_kwh: 80.000, module_count: 16, gross_weight_kg: 483.296, installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 55.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-22T00:00:00Z", odometer_miles: 71200, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-24T00:00:00Z", odometer_miles: 71400, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-26T00:00:00Z", odometer_miles: 71600, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-28T00:00:00Z", odometer_miles: 71800, reported_capacity_kwh: 57.000 }
              as: TelematicsGateway
            - call: "GET /battery-warranty/vehicles/${veh_id}"
