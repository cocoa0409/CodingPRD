              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "TRUST", account_channel: "DIRECT", state_code: "CA", tax_id: "555-66-7777", primary_owner_name: "Borderline Trust", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_b: $.data.id }
            - call: "POST /shareholder-accounts/${acc_b}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_b}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 51000.00 }
              as: TransferAgentOperator
              captures: { t_b: $.data.id }
            - call: "POST /trades/${t_b}/price"
              payload: {}
              as: TransferAgentOperator
          assert:
            - "Trade.${t_b}.roa_qualifying_amount == 51000.00"
            - "Trade.${t_b}.sales_load_pct == 0.045"
            - "Trade.${t_b}.sales_load_amount == 2295.00"
            - "Trade.${t_b}.net_invested_amount == 48705.00"
            - "Trade.${t_b}.shares_transacted == 4870.500"
            - "Trade.${t_b}.shares_transacted != 4806.750 (the net-derived tier answer is explicitly wrong)"
            - "Trade.${t_b}.nav_per_share_applied == 10.0000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trade_execution_and_settlement_dimensions_advance_independently
        grounds:
