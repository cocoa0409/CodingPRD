      - name: the_exposure_summary_is_a_pure_computed_read
        claim_type: computed_read
        grounds:
          - endpoints[GET /market-conduct/examinations/{id}/exposure-summary]
          - calculations.penalty_determination
        distinguishing_aspect: |
          The summary is the only endpoint that returns an inline object rather than an entity, and it
          computes both penalty variants without committing either - so calling it repeatedly is
          idempotent, leaves the examination version untouched and creates no ConsentOrder. That
          distinction matters because the identical arithmetic becomes persistent state the moment an
          order is drafted, and the summary must keep agreeing with the drafted variant afterwards.
        test_recipe:
          setup:
            - "One examination in NEGOTIATION with a single sustained criticism worth 20 penalty units."
