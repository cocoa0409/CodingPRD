# =============================================================================
# Task 1801: Apprenticeship & Training Trust Fund Administration (JATC)
# PRD Benchmark Scaffold — §1.0–§1.7
# =============================================================================

scenario: |
  1801. Apprenticeship & Training Trust Fund Administration (joint apprenticeship
  training committee): employer training contribution & hours reporting, apprentice
  registration & indenture record, on-the-job hours & related instruction credit
  tracking, wage progression step verification, class scheduling & instructor
  payroll, journeyman upgrade certification, funding allocation & equipment
  purchase approval, state/federal registration compliance

domain_name: apprenticeship-training-trust-fund
api_prefix: "/"

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # registration compliance, SoD on approvals, delinquency posture gating
  secondary_archetype: ledger_reconciliation # trust-fund inflows vs allocations vs disbursements
  complexity_layers:
    - optimistic_concurrency      # OCC on TrustFund.version for allocation approval
    - dual_variant_calculation    # contribution provisional-vs-final; instructor pay SCHEDULED-vs-ACTUAL
    - rate_threshold_triggers     # wage progression steps; delinquency due-date sweep
    - cascading_side_effects      # remit->employer->fund cure chain; class-complete credit chain
  entity_topology: flat                      # peer collections joined by foreign keys; no nested URLs
  state_machine_shape: parallel              # Apprentice carries program_status x registration_status; cycles on report + employer
  relationship_patterns:
    - one_to_many                 # Employer -> reports/apprentices; Fund -> everything
    - many_to_many                # ClassEnrollment joins TrainingClass x Apprentice
    - cross_aggregate             # purchases -> allocations; claims -> classes
  role_model: segregation_of_duties          # proposer/requester may not approve their own allocation/purchase
  consistency_model: immediate               # every mutation + cascade is atomic in-request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TrustFund
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fund name" }
      - { name: posture, type: enum, source: computed, description: "OPERATING | COMPLIANCE_HOLD — derived from delinquent employer count; gates all new financial commitments" }
      - { name: contributions_received_cents, type: integer, source: computed, description: "Sum of contribution_due_cents over PAID ContributionReports of all employers" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of payable_cents over PAID InstructorPayClaims plus amount_cents over PURCHASED EquipmentPurchases" }
      - { name: allocated_remaining_cents, type: integer, source: computed, description: "Sum of remaining_cents over ACTIVE FundingAllocations" }
      - { name: available_cents, type: integer, source: computed, description: "= contributions_received_cents - disbursed_cents - allocated_remaining_cents" }
      - { name: delinquent_employer_count, type: integer, source: computed, description: "Count of Employers with status DELINQUENT" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: trust_fund_id, type: string, source: input, description: "FK -> TrustFund.id; fund this employer is signatory to" }
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: agreement_rate_cents_per_hour, type: integer, source: input, description: "Hourly training contribution rate in cents, mutable via PATCH" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT — driven by delinquency sweep and remission cure" }
      - { name: outstanding_cents, type: integer, source: computed, description: "Sum of contribution_due_cents over this employer's reports in SUBMITTED, FLAGGED, or DELINQUENT" }

  - name: Apprentice
    parent: null
    common_fields: true
    fields:
      - { name: trust_fund_id, type: string, source: input, description: "FK -> TrustFund.id" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; employing sponsor for hour reporting" }
      - { name: full_name, type: string, source: input, description: "Apprentice full name" }
      - { name: trade, type: string, source: input, description: "Trade code, e.g. INSIDE_WIREMAN" }
      - { name: journeyman_base_rate_cents, type: integer, source: input, description: "Full journeyman hourly wage in cents; step wages derive from it" }
      - { name: program_status, type: enum, source: system, description: "APPLICANT | INDENTURED | SUSPENDED | COMPLETED | CANCELLED" }
      - { name: registration_status, type: enum, source: system, description: "UNFILED | SUBMITTED | REGISTERED | REJECTED | REVOKED | DEREGISTERED — independent registration dimension" }
      - { name: registration_agency, type: enum, source: system, description: "STATE | FEDERAL; set by submit-registration, null until first submission" }
      - { name: ojt_hours_accumulated, type: number, source: computed, description: "Sum of credited on-the-job hours from submitted report lines" }
      - { name: rti_credits_accumulated, type: integer, source: computed, description: "Sum of rti_credit_value over CREDITED enrollments" }
      - { name: current_wage_step, type: integer, source: computed, description: "1..5 from wage_step_determination" }
      - { name: current_wage_rate_cents, type: integer, source: computed, description: "= round_half_up(journeyman_base_rate_cents x step percentage)" }

  - name: ContributionReport
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; reporting employer" }
      - { name: period_year, type: integer, source: input, description: "Reporting period year" }
      - { name: period_month, type: integer, source: input, description: "Reporting period month, 1..12" }
      - { name: lines, type: array, source: input, description: "Array of { apprentice_id, ojt_hours }; at least one line; one line per apprentice" }
      - { name: due_date, type: datetime, source: computed, description: "= first day of the month after the period plus 14 days, i.e. the 15th, 00:00:00Z" }
      - { name: provisional_due_cents, type: integer, source: computed, description: "Estimated due computed at creation from reported lines and the employer rate at that moment" }
      - { name: contribution_due_cents, type: integer, source: computed, description: "Authoritative due computed at submit/resubmit; null while DRAFT" }
      - { name: flag_reason, type: string, source: system, description: "Audit note recorded by flag; null unless FLAGGED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FLAGGED | DELINQUENT | PAID" }
      - { name: remitted_at, type: datetime, source: system, description: "Timestamp of payment; null until PAID" }

  - name: TrainingClass
    parent: null
    common_fields: true
    fields:
      - { name: trust_fund_id, type: string, source: input, description: "FK -> TrustFund.id" }
      - { name: course_code, type: string, source: input, description: "Course code, e.g. CN-101" }
      - { name: instructor_user_id, type: string, source: input, description: "Opaque user id of the instructor (matches X-User-ID for pay claims); not an entity reference" }
      - { name: instructor_name, type: string, source: input, description: "Instructor display name" }
      - { name: instructor_rate_cents_per_hour, type: integer, source: input, description: "Instructor hourly pay rate snapshot for this class" }
      - { name: facility, type: string, source: input, description: "Facility/room identifier, e.g. SHOP-A" }
      - { name: rti_credit_value, type: integer, source: input, description: "Related-instruction credits awarded per attended completion, >= 1" }
      - { name: capacity, type: integer, source: input, description: "Maximum ENROLLED enrollments, >= 1" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of enrollments in ENROLLED status" }
      - { name: start_minute, type: integer, source: input, description: "Class window start, integer minutes on a logical timeline, >= 0" }
      - { name: end_minute, type: integer, source: input, description: "Class window end, integer minutes; must be strictly greater than start_minute" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: ClassEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: class_id, type: string, source: input, description: "FK -> TrainingClass.id" }
      - { name: apprentice_id, type: string, source: input, description: "FK -> Apprentice.id" }
      - { name: status, type: enum, source: system, description: "ENROLLED | CREDITED | NO_SHOW | DROPPED" }

  - name: InstructorPayClaim
    parent: null
    common_fields: true
    fields:
      - { name: class_id, type: string, source: input, description: "FK -> TrainingClass.id; the completed class being claimed" }
      - { name: instructor_user_id, type: string, source: system, description: "Copied from TrainingClass.instructor_user_id at claim creation" }
      - { name: pay_basis, type: enum, source: input, description: "SCHEDULED | ACTUAL — selects the payable variant" }
      - { name: actual_minutes, type: integer, source: input, description: "Required iff pay_basis == ACTUAL; must be <= round_half_up(scheduled minutes x 1.25)" }
      - { name: payable_cents, type: integer, source: computed, description: "Computed at creation per instructor_payable_cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | PAID" }
      - { name: approved_by_user_id, type: string, source: system, description: "Committee approver user id; null until APPROVED" }
      - { name: paid_at, type: datetime, source: system, description: "Payment timestamp; null until PAID" }

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - { name: trust_fund_id, type: string, source: input, description: "FK -> TrustFund.id" }
      - { name: category, type: enum, source: input, description: "INSTRUCTION | EQUIPMENT | ADMIN" }
      - { name: fiscal_year, type: integer, source: input, description: "Budget year" }
      - { name: amount_cents, type: integer, source: input, description: "Allocated amount, >= 1" }
      - { name: encumbered_cents, type: integer, source: computed, description: "Sum of amount_cents over APPROVED (not yet purchased/cancelled) EquipmentPurchases" }
      - { name: spent_cents, type: integer, source: computed, description: "Sum of amount_cents over PURCHASED EquipmentPurchases" }
      - { name: remaining_cents, type: integer, source: computed, description: "= amount_cents - encumbered_cents - spent_cents" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties anchor)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until ACTIVE" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | REJECTED | CLOSED" }

  - name: EquipmentPurchase
    parent: null
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: input, description: "FK -> FundingAllocation.id" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: amount_cents, type: integer, source: input, description: "Purchase amount, >= 1" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requester (segregation of duties anchor)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approver/denier; null until decided" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | CANCELLED | PURCHASED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrustFund
    field: posture
    initial_state: OPERATING
    terminal_states: []
    note: "Posture is derived, never set directly; it gates all new financial commitments (allocation approve, purchase approve, pay-claim approve) but never contributions or fulfillment of existing commitments."
    transitions:
      - from: OPERATING
        to: COMPLIANCE_HOLD
        trigger: "system (delinquent_employer_count rises from 0 to >= 1, via ops-run sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Approval endpoints for FundingAllocation, EquipmentPurchase, InstructorPayClaim reject with ERR_FUND_ON_COMPLIANCE_HOLD while posture holds"

      - from: COMPLIANCE_HOLD
        to: OPERATING
        trigger: "system (delinquent_employer_count returns to 0, via remit cure or ops-run sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Employer
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (POST /trust-funds/{id}/run-ops finds >= 1 of the employer's reports in DELINQUENT)"
        actor: system
        preconditions: []
        side_effects:
          - "TrustFund.delinquent_employer_count recomputed; if it rose 0 -> 1, TrustFund.posture -> COMPLIANCE_HOLD"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "system (employer's last DELINQUENT report is remitted to PAID, or ops-run sweep finds none)"
        actor: system
        preconditions: []
        side_effects:
          - "TrustFund.delinquent_employer_count recomputed; if it fell to 0, TrustFund.posture -> OPERATING"

  - entity: Apprentice
    field: program_status
    initial_state: APPLICANT
    terminal_states: [COMPLETED, CANCELLED]
    note: "Independent of and interacting with registration_status (see the registration machine below): a registration REVOKED auto-suspends an INDENTURED apprentice, and a later REGISTERED auto-reinstates."
    transitions:
      - from: APPLICANT
        to: INDENTURED
        trigger: "POST /apprentices/{id}/indenture"
        actor: TrustAdmin
        preconditions:
          - "registration_status == REGISTERED (else ERR_REGISTRATION_REQUIRED)"
        side_effects: []

      - from: INDENTURED
        to: SUSPENDED
        trigger: "system (registration_status -> REVOKED while INDENTURED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: INDENTURED
        trigger: "system (registration_status -> REGISTERED while SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INDENTURED
        to: COMPLETED
        trigger: "POST /apprentices/{id}/certify-journeyman"
        actor: TrustAdmin
        preconditions:
          - "ojt_hours_accumulated >= 8000 AND rti_credits_accumulated >= 576 (else ERR_CERTIFICATION_REQUIREMENTS_NOT_MET)"
          - "registration_status == REGISTERED (else ERR_CERTIFICATION_REQUIREMENTS_NOT_MET)"
        side_effects:
          - "registration_status -> DEREGISTERED (program completion reported to the agency)"

      - from: [APPLICANT, INDENTURED, SUSPENDED]
        to: CANCELLED
        trigger: "POST /apprentices/{id}/cancel"
        actor: TrustAdmin
        preconditions: []
        side_effects:
          - "If registration_status in {SUBMITTED, REGISTERED}: registration_status -> DEREGISTERED"
          - "ENROLLED ClassEnrollments of this apprentice -> DROPPED; owning classes' enrolled_count recomputed"

  - entity: Apprentice
    field: registration_status
    initial_state: UNFILED
    terminal_states: [DEREGISTERED]
    transitions:
      - from: [UNFILED, REJECTED, REVOKED]
        to: SUBMITTED
        trigger: "POST /apprentices/{id}/submit-registration"
        actor: TrustAdmin
        preconditions:
          - "program_status not in {COMPLETED, CANCELLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "registration_agency set from payload"

      - from: SUBMITTED
        to: REGISTERED
        trigger: "POST /apprentices/{id}/record-registration-decision with outcome=REGISTERED"
        actor: TrustAdmin
        preconditions: []
        side_effects:
          - "If program_status == SUSPENDED: program_status -> INDENTURED (reinstatement)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /apprentices/{id}/record-registration-decision with outcome=REJECTED"
        actor: TrustAdmin
        preconditions: []
        side_effects: []

      - from: REGISTERED
        to: REVOKED
        trigger: "POST /apprentices/{id}/record-registration-decision with outcome=REVOKED"
        actor: TrustAdmin
        preconditions: []
        side_effects:
          - "If program_status == INDENTURED: program_status -> SUSPENDED"

      - from: [SUBMITTED, REGISTERED]
        to: DEREGISTERED
        trigger: "system (apprentice CANCELLED or COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ContributionReport
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /contribution-reports/{id}/submit"
        actor: EmployerRep
        preconditions:
          - "Caller owns the report (X-User-ID == employer_id, else ERR_NOT_RESOURCE_OWNER)"
          - "lines is non-empty (else ERR_INVALID_REQUEST)"
          - "Every line's apprentice belongs to this employer (else ERR_LINE_APPRENTICE_NOT_INDENTURED... see ERR_APPRENTICE_NOT_HOUR_ELIGIBLE)"
          - "Every line's apprentice has program_status in {INDENTURED, SUSPENDED} (else ERR_APPRENTICE_NOT_HOUR_ELIGIBLE)"
        side_effects:
          - "contribution_due_cents computed (per-line rounding, employer's current agreement rate)"
          - "Each line: apprentice.ojt_hours_accumulated += ojt_hours; current_wage_step and current_wage_rate_cents recomputed"
          - "Employer.outstanding_cents recomputed"

      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /contribution-reports/{id}/flag"
        actor: TrustAdmin
        preconditions: []
        side_effects:
          - "flag_reason recorded; payment blocked while FLAGGED"

      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /contribution-reports/{id}/resubmit"
        actor: EmployerRep
        preconditions:
          - "Caller owns the report (else ERR_NOT_RESOURCE_OWNER)"
          - "Replacement lines satisfy the same line rules as submit"
        side_effects:
          - "Each old line's hours are debited from its apprentice, each new line's hours credited; wage steps recomputed (both directions)"
          - "contribution_due_cents recomputed at the employer's current agreement rate"
          - "Employer.outstanding_cents recomputed; flag_reason cleared"

      - from: [SUBMITTED, DELINQUENT]
        to: PAID
        trigger: "POST /contribution-reports/{id}/remit"
        actor: EmployerRep
        preconditions:
          - "Caller owns the report (else ERR_NOT_RESOURCE_OWNER)"
          - "amount_tendered_cents == contribution_due_cents exactly (else ERR_REMITTANCE_AMOUNT_MISMATCH)"
        side_effects:
          - "remitted_at stamped"
          - "Employer.outstanding_cents recomputed (drops by contribution_due_cents)"
          - "TrustFund.contributions_received_cents += contribution_due_cents; available_cents recomputed; TrustFund.version increments"
          - "If the employer has no remaining DELINQUENT reports: Employer.status DELINQUENT -> ACTIVE"
          - "If that employer cure drops TrustFund.delinquent_employer_count to 0: TrustFund.posture COMPLIANCE_HOLD -> OPERATING"

      - from: [DRAFT, SUBMITTED, FLAGGED]
        to: DELINQUENT
        trigger: "system (POST /trust-funds/{id}/run-ops: current logical time is strictly greater than due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Employer.status ACTIVE -> DELINQUENT"
          - "TrustFund.delinquent_employer_count recomputed; posture -> COMPLIANCE_HOLD when count rises from 0"

  - entity: TrainingClass
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /classes/{id}/complete"
        actor: TrustAdmin
        preconditions:
          - "Every id in attended_enrollment_ids references an ENROLLED enrollment of this class (else ERR_INVALID_ATTENDEE_LIST)"
        side_effects:
          - "Attended enrollments ENROLLED -> CREDITED: each apprentice.rti_credits_accumulated += rti_credit_value, then current_wage_step/current_wage_rate_cents recomputed"
          - "Unlisted ENROLLED enrollments -> NO_SHOW"
          - "enrolled_count recomputed (0 afterwards)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /classes/{id}/cancel"
        actor: TrustAdmin
        preconditions:
          - "No InstructorPayClaim for this class in SUBMITTED or APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "ENROLLED enrollments -> DROPPED; enrolled_count recomputed"

  - entity: ClassEnrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [CREDITED, NO_SHOW, DROPPED]
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /enrollments/{id}/drop, or system (owning class cancelled, or apprentice cancelled)"
        actor: "TrustAdmin or system"
        preconditions: []
        side_effects:
          - "TrainingClass.enrolled_count recomputed"

      - from: ENROLLED
        to: CREDITED
        trigger: "system (owning class completed with this enrollment attended)"
        actor: system
        preconditions: []
        side_effects:
          - "Apprentice.rti_credits_accumulated += class rti_credit_value; wage step recomputed"

      - from: ENROLLED
        to: NO_SHOW
        trigger: "system (owning class completed without this enrollment attended)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InstructorPayClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pay-claims/{id}/approve"
        actor: CommitteeMember
        preconditions:
          - "TrustFund.posture == OPERATING (else ERR_FUND_ON_COMPLIANCE_HOLD)"
        side_effects:
          - "approved_by_user_id stamped"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pay-claims/{id}/reject"
        actor: CommitteeMember
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "POST /pay-claims/{id}/pay"
        actor: TrustAdmin
        preconditions: []
        side_effects:
          - "TrustFund.disbursed_cents += payable_cents; available_cents recomputed; TrustFund.version increments"
          - "paid_at stamped"

  - entity: FundingAllocation
    field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /funding-allocations/{id}/approve"
        actor: CommitteeMember
        preconditions:
          - "TrustFund.posture == OPERATING (else ERR_FUND_ON_COMPLIANCE_HOLD)"
          - "approved user id != proposed_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "amount_cents <= TrustFund.available_cents (else ERR_INSUFFICIENT_FUND_AVAILABLE)"
          - "expected_trust_fund_version == TrustFund.version (else ERR_STALE_VERSION)"
        side_effects:
          - "TrustFund.allocated_remaining_cents += amount_cents; available_cents recomputed; TrustFund.version increments by 1"
          - "approved_by_user_id stamped"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /funding-allocations/{id}/reject"
        actor: CommitteeMember
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /funding-allocations/{id}/close"
        actor: TrustAdmin
        preconditions:
          - "No EquipmentPurchase on this allocation in REQUESTED or APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "TrustFund.allocated_remaining_cents -= remaining_cents; available_cents recomputed; TrustFund.version increments"

  - entity: EquipmentPurchase
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED, PURCHASED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /equipment-purchases/{id}/approve"
        actor: CommitteeMember
        preconditions:
          - "TrustFund.posture == OPERATING (else ERR_FUND_ON_COMPLIANCE_HOLD)"
          - "deciding user id != requested_by_user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "FundingAllocation.status == ACTIVE (else ERR_INVALID_STATE)"
          - "amount_cents <= allocation.remaining_cents (else ERR_INSUFFICIENT_ALLOCATION_REMAINING)"
        side_effects:
          - "decided_by_user_id stamped"
          - "FundingAllocation.encumbered_cents += amount_cents; remaining_cents recomputed"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /equipment-purchases/{id}/deny"
        actor: CommitteeMember
        preconditions: []
        side_effects:
          - "decided_by_user_id stamped"

      - from: [REQUESTED, APPROVED]
        to: CANCELLED
        trigger: "POST /equipment-purchases/{id}/cancel"
        actor: TrustAdmin
        preconditions: []
        side_effects:
          - "If was APPROVED: FundingAllocation.encumbered_cents -= amount_cents; remaining_cents recomputed (compensation)"

      - from: APPROVED
        to: PURCHASED
        trigger: "POST /equipment-purchases/{id}/mark-purchased"
        actor: TrustAdmin
        preconditions: []
        side_effects:
          - "FundingAllocation.encumbered_cents -= amount_cents; spent_cents += amount_cents; remaining_cents recomputed"
          - "TrustFund.disbursed_cents += amount_cents; available_cents recomputed; TrustFund.version increments"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-approve-stale-fund
    parent_entity: TrustFund
    write_endpoint: "POST /funding-allocations/{id}/approve"
    occ_field: "expected_trust_fund_version"
    description: |
      Approving a FundingAllocation against a TrustFund whose version has advanced
      since the client last read it is rejected. Approving an allocation debits the
      fund's shared available pool, so an approval grounded in a superseded
      available_cents reading must not proceed; the client re-reads the fund and
      retries with the observed version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: wage_step_determination
    trigger: "apprentice creation; contribution report submit/resubmit; class completion credit; enrollment drop does NOT trigger"
    algorithm: threshold
    formula: |
      step 1: always (base)
      step 2: ojt_hours_accumulated >= 2000 AND rti_credits_accumulated >= 144
      step 3: ojt_hours_accumulated >= 4000 AND rti_credits_accumulated >= 288
      step 4: ojt_hours_accumulated >= 6000 AND rti_credits_accumulated >= 432
      step 5: ojt_hours_accumulated >= 8000 AND rti_credits_accumulated >= 576
      current_wage_step = highest step whose BOTH gates hold.
      current_wage_rate_cents = round_half_up(journeyman_base_rate_cents * STEP_PCT[current_wage_step])
      Recompute is bidirectional: a resubmit that lowers hours can lower the step.
    constants:
      STEP_PCT: { 1: 0.50, 2: 0.60, 3: 0.70, 4: 0.80, 5: 0.90 }
      STEP_HOURS: { 2: 2000, 3: 4000, 4: 6000, 5: 8000 }
      STEP_RTI: { 2: 144, 3: 288, 4: 432, 5: 576 }
    precision: "wage in whole cents, round_half_up"
    input_set: "The single apprentice's own accumulated fields; no other apprentices included"

  - name: contribution_due_cents
    trigger: "report creation (provisional), submit, resubmit (final)"
    algorithm: tiered_pricing
    formula: |
      ROUNDING ORDER IS PINNED: round each line first, then sum.
      line_cents = round_half_up(line.ojt_hours * rate_cents_per_hour)
      total = sum(line_cents over all lines)
      The rejected alternative (sum all hours, then multiply, then round) yields
      different cents for fractional hours and MUST NOT be used.
    constants: {}
    precision: "whole cents per line, round_half_up"
    input_set: "The report's own lines only"
    variants:
      - name: provisional
        when: "computed at report creation"
        difference: "uses the employer's agreement_rate_cents_per_hour at creation time; stored in provisional_due_cents"
      - name: final
        when: "computed at submit and resubmit"
        difference: "uses the employer's agreement_rate_cents_per_hour at submit/resubmit time; stored in contribution_due_cents — a rate change between creation and submission makes the two diverge for identical lines"

  - name: contribution_due_date
    trigger: "report creation"
    algorithm: threshold
    formula: |
      due_date = (period_year, period_month + 1, day 15) at 00:00:00Z, rolling into
      January of period_year + 1 when period_month == 12.
      A report is overdue iff current logical time is STRICTLY greater than due_date
      (at exactly due_date it is still timely).
    constants: {}
    precision: "whole seconds"
    input_set: "The report's own period fields"

  - name: instructor_payable_cents
    trigger: "pay claim creation"
    algorithm: tiered_pricing
    formula: |
      scheduled_minutes = class.end_minute - class.start_minute
      SCHEDULED basis: payable_cents = round_half_up(instructor_rate_cents_per_hour * scheduled_minutes / 60)
      ACTUAL basis: payable_cents = round_half_up(instructor_rate_cents_per_hour * actual_minutes / 60)
        where actual_minutes <= round_half_up(scheduled_minutes * 1.25) (else ERR_OVERTIME_CAP_EXCEEDED)
    constants:
      OVERTIME_CAP_NUM: 1.25
    precision: "whole cents, round_half_up"
    input_set: "The claimed class and the claim's own fields"
    variants:
      - name: scheduled
        when: "pay_basis == SCHEDULED"
        difference: "pays the published class window regardless of time actually taught"
      - name: actual
        when: "pay_basis == ACTUAL"
        difference: "pays instructor-declared minutes within the overtime cap; diverges from scheduled whenever actual_minutes != scheduled_minutes"

  - name: rti_credit_award
    trigger: "class completion"
    algorithm: aggregation
    formula: |
      For each enrollment of the class listed in attended_enrollment_ids (must be ENROLLED):
        enrollment -> CREDITED
        apprentice.rti_credits_accumulated += class.rti_credit_value
        recompute apprentice.current_wage_step / current_wage_rate_cents
      ENROLLED enrollments not listed -> NO_SHOW (no credits).
    constants: {}
    precision: "integer credits"
    input_set: "Enrollments of this class in ENROLLED status only"

  - name: employer_outstanding_cents
    trigger: "report submit, resubmit, remit, ops-run delinquency flip"
    algorithm: aggregation
    formula: |
      outstanding_cents = sum(contribution_due_cents over the employer's reports
        with status in {SUBMITTED, FLAGGED, DELINQUENT})
      DRAFT reports contribute 0 (contribution_due_cents is null); PAID reports are excluded.
    constants: {}
    precision: "whole cents"
    input_set: "ContributionReports of this employer in SUBMITTED | FLAGGED | DELINQUENT"

  - name: fund_available_cents
    trigger: "remit, allocation approve/close, pay-claim pay, purchase mark-purchased"
    algorithm: aggregation
    formula: |
      contributions_received_cents = sum(contribution_due_cents over PAID reports fund-wide)
      disbursed_cents = sum(payable_cents over PAID claims) + sum(amount_cents over PURCHASED purchases)
      allocated_remaining_cents = sum(remaining_cents over ACTIVE allocations)
      available_cents = contributions_received_cents - disbursed_cents - allocated_remaining_cents
    constants: {}
    precision: "whole cents"
    input_set: "Fund-wide PAID reports, PAID claims, PURCHASED purchases, ACTIVE allocations"

  - name: allocation_remaining_cents
    trigger: "purchase approve, cancel of APPROVED, mark-purchased, allocation approve"
    algorithm: aggregation
    formula: |
      encumbered_cents = sum(amount_cents over APPROVED purchases on this allocation)
      spent_cents = sum(amount_cents over PURCHASED purchases on this allocation)
      remaining_cents = amount_cents - encumbered_cents - spent_cents
    constants: {}
    precision: "whole cents"
    input_set: "EquipmentPurchases of this allocation in APPROVED or PURCHASED"

  - name: delinquency_sweep
    trigger: "POST /trust-funds/{id}/run-ops"
    algorithm: chronological
    formula: |
      For each ContributionReport of the fund with status in {DRAFT, SUBMITTED, FLAGGED},
      processed in ascending due_date order (tie-break: created_at ASC):
        if current logical time > report.due_date: report -> DELINQUENT
      Then per employer: status = DELINQUENT iff it has >= 1 DELINQUENT report else ACTIVE.
      Then fund: delinquent_employer_count recomputed; posture = COMPLIANCE_HOLD iff count >= 1.
    constants: {}
    precision: "whole seconds"
    input_set: "Non-terminal reports of the fund"

  - name: instructor_overlap_check
    trigger: "class creation"
    algorithm: interval_merge
    formula: |
      BUFFERED semantics. Two classes of the SAME instructor_user_id conflict unless
      separated by a turnover buffer: conflict iff
        new.start_minute < existing.end_minute + TURNOVER_MINUTES
        AND existing.start_minute < new.end_minute + TURNOVER_MINUTES
      Equivalently a gap of exactly TURNOVER_MINUTES is allowed (gap >= 30 passes).
      Only classes in SCHEDULED status are considered (COMPLETED/CANCELLED do not block).
    constants:
      TURNOVER_MINUTES: 30
    precision: "integer minutes"
    input_set: "SCHEDULED classes with the same instructor_user_id in the same fund"

  - name: facility_overlap_check
    trigger: "class creation"
    algorithm: interval_merge
    formula: |
      HALF-OPEN semantics [start, end). Two classes in the SAME facility conflict iff
        new.start_minute < existing.end_minute AND existing.start_minute < new.end_minute
      Adjacency is allowed: existing.end_minute == new.start_minute does NOT conflict.
      Only classes in SCHEDULED status are considered.
    constants: {}
    precision: "integer minutes"
    input_set: "SCHEDULED classes with the same facility in the same fund"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership: EmployerRep's X-User-ID equals the report's employer_id; Instructor's X-User-ID equals the class's instructor_user_id on pay-claim creation"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "contribution-report submit/resubmit/remit; pay-claim create"

  - priority: 4
    category: existence
    check: "Path and body resource ids exist, validated left-to-right"
    error_id: "ERR_FUND_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_APPRENTICE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_CLASS_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_PURCHASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present with correct types; period_month in 1..12 and period start not after the current logical time; class end_minute > start_minute; registration decision outcome in {REGISTERED, REJECTED, REVOKED}"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_PERIOD | ERR_INVALID_CLASS_WINDOW | ERR_INVALID_REGISTRATION_OUTCOME"
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2 preconditions); for allocation approve, expected_trust_fund_version must equal TrustFund.version"
    error_id: "ERR_INVALID_STATE | ERR_APPRENTICE_NOT_INDENTURED | ERR_REGISTRATION_REQUIRED | ERR_REGISTRATION_NOT_SUBMITTED | ERR_REPORT_NOT_FLAGGABLE | ERR_REPORT_NOT_RESUBMITTABLE | ERR_REPORT_NOT_PAYABLE | ERR_CLASS_NOT_SCHEDULED | ERR_ENROLLMENT_NOT_OPEN | ERR_CLAIM_NOT_APPROVABLE | ERR_CLAIM_NOT_PAYABLE | ERR_ALLOCATION_NOT_ACTIVABLE | ERR_ALLOCATION_NOT_ACTIVE | ERR_PURCHASE_NOT_REQUESTED | ERR_PURCHASE_NOT_APPROVED | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "state transition endpoints"
    note: "ERR_STALE_VERSION returns HTTP 412; all others in this row return 409"

  - priority: 7
    category: business_safety
    check: "Compliance gates: registration REGISTERED where required; fund posture OPERATING for new financial commitments; segregation of duties (approver != proposer/requester); journeyman certification prerequisites"
    error_id: "ERR_REGISTRATION_REQUIRED | ERR_FUND_ON_COMPLIANCE_HOLD | ERR_SELF_APPROVAL_FORBIDDEN | ERR_CERTIFICATION_REQUIREMENTS_NOT_MET"
    http_status: 409
    applies_to: "indenture, enrollment create, allocation/purchase/pay-claim approve, certify-journeyman"
    note: "ERR_SELF_APPROVAL_FORBIDDEN returns HTTP 403; all others in this row return 409"

  - priority: 8
    category: business_constraint
    check: "Uniqueness, capacity, and scheduling: one report per employer per period; one open enrollment per apprentice per class; one open pay claim per class; class capacity; instructor buffered overlap; facility half-open overlap; attendee list integrity; overtime cap; hour-eligible line apprentices"
    error_id: "ERR_DUPLICATE_REPORT_PERIOD | ERR_DUPLICATE_ENROLLMENT | ERR_DUPLICATE_CLAIM | ERR_CLASS_FULL | ERR_INSTRUCTOR_SCHEDULE_CONFLICT | ERR_FACILITY_SCHEDULE_CONFLICT | ERR_INVALID_ATTENDEE_LIST | ERR_OVERTIME_CAP_EXCEEDED | ERR_APPRENTICE_NOT_HOUR_ELIGIBLE | ERR_LINE_EMPLOYER_MISMATCH"
    http_status: 409
    applies_to: "report create/submit/resubmit, class create/complete, enrollment create, pay-claim create"
    note: "ERR_INVALID_ATTENDEE_LIST and ERR_APPRENTICE_NOT_HOUR_ELIGIBLE and ERR_LINE_EMPLOYER_MISMATCH return 400; ERR_OVERTIME_CAP_EXCEEDED returns 422"

  - priority: 9
    category: business_fiscal
    check: "Money: tender equals due; allocation amount fits fund available; purchase amount fits allocation remaining"
    error_id: "ERR_REMITTANCE_AMOUNT_MISMATCH | ERR_INSUFFICIENT_FUND_AVAILABLE | ERR_INSUFFICIENT_ALLOCATION_REMAINING"
    http_status: 402
    applies_to: "report remit; allocation approve; purchase approve"
    note: "ERR_REMITTANCE_AMOUNT_MISMATCH returns HTTP 400; the two insufficiency errors return 402"

