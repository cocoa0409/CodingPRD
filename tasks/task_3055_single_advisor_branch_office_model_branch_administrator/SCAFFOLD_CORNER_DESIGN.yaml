scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_advisor_missing_email_returns_invalid_request
        claim_type: required_field
        grounds:
          - entities.Advisor.fields.email
          - validations[priority=18]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST advisor without email -> ERR_INVALID_REQUEST (400); email has no default."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "No Email", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"
      - name: create_advisor_duplicate_email_rejected
        claim_type: type_constraint
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Second advisor with identical email -> ERR_DUPLICATE (409); uniqueness is global across advisors."
        test_recipe:
          setup: ["Advisor with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Dup One", email: "dup@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Dup Two", email: "dup@x.com", hire_date: "2026-01-06T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE and http status 409"
      - name: advisor_computed_cumulative_commissions
        claim_type: computed_field
        grounds:
          - entities.Advisor.fields.cumulative_commissions_cents
        distinguishing_aspect: "After posting records 100 and 250 (payout 1.0) then reversing the 100 record, cumulative_commissions_cents == 250."
        test_recipe:
          setup: ["Advisor exists with two POSTED production records (100, 250)."]
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Comp A", email: "compa@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 100, payout_rate: 1.0, posted_at: "2026-02-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { pr1: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 250, payout_rate: 1.0, posted_at: "2026-02-02T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/production-records/${pr1}/reverse"
              payload: {}
              as: HomeOfficeAdmin
            - call: "GET /branch-office/advisors/${adv_id}"
              payload: {}
              as: HomeOfficeAdmin
              captures: { cum: $.data.cumulative_commissions_cents }
          assert:
            - "Advisor.${adv_id}.cumulative_commissions_cents == 250"
      - name: get_advisor_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET advisor with random UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /branch-office/advisors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"
      - name: list_advisors_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "List advisors with limit=1 after creating 2 returns exactly 1 record, total_count == 2, has_more == true."
        test_recipe:
          setup: ["Two advisors exist."]
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Pg A", email: "pga@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Pg B", email: "pgb@x.com", hire_date: "2026-01-06T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "GET /branch-office/advisors"
              payload: {}
              as: HomeOfficeAdmin
          assert:
            - "Response envelope carries pagination fields limit/offset/total_count/has_more with defaults limit=10, offset=0"
            - "total_count == 2"
      - name: contact_immutable_entity_shape
        claim_type: immutability
        grounds:
          - entities.DoorKnockContact
        distinguishing_aspect: "DoorKnockContact has common_fields:false — response carries id and created_at but no version field."
        test_recipe:
          setup: ["Territory assigned to advisor covering 2026."]
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Knock A", email: "knocka@x.com", hire_date: "2026-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/territories"
              payload: { community_name: "Knock Town", household_capacity: 10 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/territories/${ter_id}/assign"
              payload: { advisor_id: "${adv_id}", assignment_start: "2026-01-01T00:00:00Z", assignment_end: "2027-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/territories/${ter_id}/contacts"
              payload: { household_address: "1 Elm", contact_outcome: "PITCHED", contacted_at: "2026-03-01T10:00:00Z" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { ct_id: $.data.id }
          assert:
            - "DoorKnockContact response has id and created_at; no version field present"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: advisor_invalid_transition_declare_retirement_from_candidate
        claim_type: invalid_transition
        grounds:
          - state_machines.Advisor
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANDIDATE advisor declaring retirement -> ERR_INVALID_STATE; no branch side effects."
        test_recipe:
          setup: ["Advisor in CANDIDATE."]
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Cand A", email: "canda@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /branch-office/advisors/${adv_id}/declare-retirement"
              payload: {}
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and Advisor.${adv_id}.status remains CANDIDATE"
      - name: branch_terminal_close_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Branch
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED branch rejects suspend/reinstate/open — all -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Branch fully staffed, OPEN, period FINALIZED, then suspended and closed"
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Close A", email: "closea@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/advisors/${adv_id}/enroll-training"
              payload: { goal_cents: 100, start_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2026-01-06T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_id}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_id}"
            - call: "POST /branch-office/training-programs/${tp_id}/evaluate"
              payload: { window_end: "2026-04-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Close Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Close Town", site_address: "20 Lock St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2026-08-01T00:00:00Z", term_end: "2027-07-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_id}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/administrators"
              payload: { full_name: "Boa L", email: "boal@x.com", monthly_salary_cents: 300000 }
              as: HomeOfficeAdmin
              captures: { boa_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/assign-administrator"
              payload: { administrator_id: "${boa_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches/${br_id}/open"
              payload: {}
              as: HomeOfficeAdmin
            - call: "GET /branch-office/branches/${br_id}/financial-periods"
              payload: {}
              as: HomeOfficeAdmin
              captures: { auto_per: "$.data[0].id" }
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${auto_per}/close"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${auto_per}/finalize"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches/${br_id}/suspend"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_id}/terminate"
              payload: {}
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches/${br_id}/close"
              payload: {}
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/branches/${br_id}/reinstate"
              payload: {}
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and Branch.${br_id}.operating_status remains CLOSED"
      - name: period_close_before_period_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=20]
          - errors[ERR_PERIOD_NOT_CLOSABLE]
        distinguishing_aspect: "Closing an OPEN period while clock < period_end -> ERR_PERIOD_NOT_CLOSABLE (422)."
        test_recipe:
          setup:
            - "Branch (PROPOSED suffices) with OPEN period 2026-09-01..2026-10-01; clock at 2026-09-15 (default-adjacent, before end)"
          setup_api_calls:
            - call: "POST /branch-office/territories"
              payload: { community_name: "Early Town", household_capacity: 100 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Early Town", site_address: "1 Early St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/financial-periods"
              payload: { branch_id: "${br_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { per_id: $.data.id }
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/financial-periods/${per_id}/close"
              payload: {}
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERIOD_NOT_CLOSABLE and period remains OPEN"
      - name: period_reopen_not_latest_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BranchFinancialPeriod.CLOSED_to_OPEN
          - errors[ERR_PERIOD_NOT_LATEST]
        distinguishing_aspect: "Reopening an earlier CLOSED period when a later period exists -> ERR_PERIOD_NOT_LATEST (409)."
        test_recipe:
          setup:
            - "Branch with two periods: P1 (Sep, CLOSED) and P2 (Oct, OPEN)"
          setup_api_calls:
            - call: "POST /branch-office/territories"
              payload: { community_name: "Reopen Town", household_capacity: 100 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Reopen Town", site_address: "2 Reopen St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/financial-periods"
              payload: { branch_id: "${br_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /branch-office/financial-periods"
              payload: { branch_id: "${br_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/financial-periods/${p1_id}/close"
              payload: {}
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/financial-periods/${p1_id}/reopen"
              payload: {}
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERIOD_NOT_LATEST and P1 remains CLOSED"
      - name: branch_open_requires_fully_staffed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Branch.SITE_APPROVED_to_OPEN
          - errors[ERR_BRANCH_NOT_FULLY_STAFFED]
        distinguishing_aspect: "Open on SITE_APPROVED branch with advisor but no ACTIVE BOA -> ERR_BRANCH_NOT_FULLY_STAFFED (409)."
        test_recipe:
          setup: ["SITE_APPROVED branch with VALIDATED advisor assigned; no BOA."]
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Staff A", email: "staffa@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/advisors/${adv_id}/enroll-training"
              payload: { goal_cents: 100, start_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2026-01-06T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_id}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_id}"
            - call: "POST /branch-office/training-programs/${tp_id}/evaluate"
              payload: { window_end: "2026-04-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Staff Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Staff Town", site_address: "7 Staff St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2026-08-01T00:00:00Z", term_end: "2027-07-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_id}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/branches/${br_id}/open"
              payload: {}
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BRANCH_NOT_FULLY_STAFFED and Branch.operating_status remains SITE_APPROVED"
      - name: assign_branch_requires_validated_advisor
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Advisor.VALIDATED_to_PRACTICING
          - errors[ERR_ADVISOR_NOT_VALIDATED]
        distinguishing_aspect: "Assigning a TRAINEE advisor to a branch -> ERR_ADVISOR_NOT_VALIDATED (409)."
        test_recipe:
          setup: ["TRAINEE advisor; SITE_APPROVED branch."]
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Tr A", email: "tra@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/advisors/${adv_id}/enroll-training"
              payload: { goal_cents: 100, start_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Tr Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Tr Town", site_address: "9 Tr St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2026-08-01T00:00:00Z", term_end: "2027-07-31T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/advisors/${adv_id}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ADVISOR_NOT_VALIDATED and Advisor.status remains TRAINEE"
      - name: transfer_expiry_via_clock
        claim_type: valid_transition
        grounds:
          - state_machines.GoodwillTransfer.OFFERED_to_EXPIRED
        distinguishing_aspect: "System auto-transition: clock advanced 31 days past creation expires an OFFERED transfer and refunds escrow."
        test_recipe:
          setup:
            - "OFFERED transfer created at 2026-09-05 with escrow 200000; retiring advisor on branch with trailing revenue"
          setup_api_calls:
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Ret X", email: "retx@x.com", hire_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_r: $.data.id }
            - call: "POST /branch-office/advisors/${adv_r}/enroll-training"
              payload: { goal_cents: 100, start_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_r: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_r}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2020-01-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_r}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_r}"
            - call: "POST /branch-office/training-programs/${tp_r}/evaluate"
              payload: { window_end: "2020-04-01T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Exp Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Exp Town", site_address: "15 Exp St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2020-01-01T00:00:00Z", term_end: "2030-12-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_r}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_r}/declare-retirement"
              payload: {}
              as: Advisor
              as_user_id: "${adv_r}"
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Succ X", email: "succx2@x.com", hire_date: "2024-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_s: $.data.id }
            - call: "POST /branch-office/goodwill-transfers"
              payload: { branch_id: "${br_id}", retiring_advisor_id: "${adv_r}", successor_advisor_id: "${adv_s}", valuation_mode: "INTERNAL_SUCCESSION", escrow_deposit_cents: 200000 }
              as: HomeOfficeAdmin
              captures: { gt_id: $.data.id }
          trigger:
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "GET /branch-office/goodwill-transfers/${gt_id}"
              payload: {}
              as: HomeOfficeAdmin
              captures: { gt_status: $.data.status }
          assert:
            - "GoodwillTransfer.${gt_id}.status == EXPIRED after clock advances past created_at + 30 days"
      - name: deficit_carryover_charge_created_on_finalize
        claim_type: side_effect_execution
        grounds:
          - state_machines.BranchFinancialPeriod.CLOSED_to_FINALIZED
          - calculations.branch_net_profit
        distinguishing_aspect: "Finalizing a period with net -100000 creates a DEFICIT_CARRYOVER charge of 100000 on the next OPEN period; advisor_share == 0 for the negative period."
        test_recipe:
          setup:
            - "OPEN branch; period P1 (Sep) with revenue 300000 and charges 400000 (net -100000); P2 (Oct) OPEN"
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Def A", email: "defa@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /branch-office/advisors/${adv_id}/enroll-training"
              payload: { goal_cents: 100, start_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /branch-office/production-records"
