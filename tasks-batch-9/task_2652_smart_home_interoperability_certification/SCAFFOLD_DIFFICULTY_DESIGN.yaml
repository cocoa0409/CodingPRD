        grounds:
          - calculations.laboratory_reserved_bench_minutes
          - state_machines[TestSession#state].transitions[SCHEDULED->CANCELLED]
          - state_machines[TestSession#state].transitions[IN_PROGRESS->COMPLETE]
          - endpoints[POST /test-sessions/{test_session_id}/cancel]
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 - a DIFFERENT quantity, BENCH MINUTES. The invariant is
          reserved_bench_minutes == SUM(reserved_minutes of the laboratory's SCHEDULED and IN_PROGRESS
          sessions), and it must survive a create/cancel pair (restoring the pre-create value bit for
          bit), a start (which moves state but must NOT move minutes), and a completion (which releases
          exactly the session's own minutes). The falsifier is capacity: once every session has left the
          live set the laboratory must be able to book its entire 1200-minute ceiling in one go, which is
          impossible if any cancelled or completed session leaked even one minute.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification with LIGHTING feature sets CORE_ONOFF (MANDATORY 20) and CORE_DIM (MANDATORY 10)."
            - "One Member in good standing with 1000000 cents and an IN_REVIEW submission whose TestPlan is ISSUED."
            - "One AUTHORIZED TestLaboratory with bench_capacity 2, so the ceiling is 1200 minutes and reserved_bench_minutes starts at 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
              captures: { fs_core_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
              captures: { fs_dim_id: $.data.id }
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 3, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF", "CORE_DIM"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:BB:CC:DD" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /submissions/${sub_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "rev-conf-1"
              captures: { sub_v: $.data.version }
            - call: "POST /test-plans"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${sub_v}" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /test-plans/${plan_id}/issue"
              payload: {}
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Northbridge Lab", bench_capacity: 2, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /test-laboratories/${lab_id}/accreditation-decision"
              payload: { decision: "AUTHORIZE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T11:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 2, window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T14:00:00Z", session_type: "SECURITY" }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /test-sessions/${s1_id}/cancel"
              payload: { reason: "Sample not ready" }
              as: ProgramAdmin
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T11:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${s3_id}/start"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s3_id}/results"
              payload: { result_lines: [{ feature_set_id: "${fs_core_id}", outcome: "PASS", evidence_hash: "h1" }, { feature_set_id: "${fs_dim_id}", outcome: "PASS", evidence_hash: "h2" }] }
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s3_id}/complete"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /test-sessions/${s2_id}/cancel"
              payload: { reason: "Rescheduled" }
              as: ProgramAdmin
            - call: "POST /test-sessions"
              payload: { test_plan_id: "${plan_id}", laboratory_id: "${lab_id}", bench_index: 1, window_start: "2026-09-04T03:00:00Z", window_end: "2026-09-04T23:00:00Z", session_type: "INTEROP" }
              as: ProgramAdmin
              captures: { s4_id: $.data.id }
          assert:
            - "BASELINE: TestLaboratory.${lab_id}.reserved_bench_minutes == 0 before any booking"
            - "TWO BOOKINGS: TestSession.${s1_id}.reserved_minutes == 120 and TestSession.${s2_id}.reserved_minutes == 300, and reserved_bench_minutes == 420 - the sum, with no changeover buffer added"
            - "CANCEL COMPENSATES EXACTLY: after cancelling S1, TestSession.${s1_id}.state == CANCELLED and TestLaboratory.${lab_id}.reserved_bench_minutes == 300 - back to precisely S2's contribution, the pre-S1 value"
            - "THE WINDOW IS FREE AGAIN: re-booking the identical bench-1 window 09:00..11:00 succeeds (a cancelled session is not an occupancy conflict) and reserved_bench_minutes == 420 again"
            - "START MOVES NO MINUTES: after S3 starts, TestSession.${s3_id}.state == IN_PROGRESS and reserved_bench_minutes is still 420 - IN_PROGRESS is inside the live set exactly like SCHEDULED"
            - "COMPLETE RELEASES EXACTLY ITS OWN MINUTES: after S3 completes, TestSession.${s3_id}.state == COMPLETE with completed_late == false and reserved_bench_minutes == 300"
            - "BACK TO THE ORIGIN: after cancelling S2, TestLaboratory.${lab_id}.reserved_bench_minutes == 0, even though 840 minutes were booked in total across three sessions"
            - "THE CEILING PROVES IT: a single 1200-minute booking (2026-09-04T03:00..23:00) is then ACCEPTED at exactly bench_capacity * 600 - TestSession.${s4_id}.reserved_minutes == 1200 and reserved_bench_minutes == 1200 - which is only possible if every cancelled and completed session released its minutes to the cent"
            - "GET /test-sessions?laboratory_id=${lab_id} still returns 4 rows: S1 CANCELLED, S2 CANCELLED, S3 COMPLETE and S4 SCHEDULED - compensation removes minutes, never rows"
