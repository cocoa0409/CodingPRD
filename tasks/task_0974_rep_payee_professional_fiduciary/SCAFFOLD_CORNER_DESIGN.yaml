            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Tier One", category: "HOUSING", amount_cents: 90000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w1_id: $.data.id } }
