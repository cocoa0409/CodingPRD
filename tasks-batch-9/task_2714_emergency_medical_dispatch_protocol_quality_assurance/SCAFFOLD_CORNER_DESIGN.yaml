  - section: endpoints
    instances:
      - name: protocol_version_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/audit-programs/{id}/protocol-versions
          - endpoints.GET_/protocol-versions/{id}
          - endpoints.GET_/audit-programs/{id}/protocol-versions
        distinguishing_aspect: "The three CRUD surfaces must agree on one row: the created DRAFT version reads back identically by id and appears in the parent listing under a status filter, with effective_to null surviving the round trip as null rather than being coerced to a date."
        test_recipe:
          setup:
            - "One program with no protocol versions."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "GET /protocol-versions/${pv_id}"
              payload: {}
              as: QaReviewer
              as_user_id: "rev-1"
            - call: "GET /audit-programs/${prog_id}/protocol-versions"
              payload: { status: "DRAFT", protocol_family: "MPDS_CARDSET", limit: 10, offset: 0 }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "The create returns 201 with data.status == DRAFT, data.program_id == ${prog_id}, data.approved_by_user_id == null and data.activated_at == null"
            - "The single read returns 200 with the identical field values, including case_entry_weight 0.2000, key_questions_weight 0.3500, pre_arrival_weight 0.3000, final_coding_weight 0.1500 and effective_to == null"
            - "The list returns response_type array with total_count 1, has_more false and data[0].id == ${pv_id}"
            - "The same list filtered with status APPROVED returns total_count 0"

      - name: approve_stamps_the_director_and_moves_the_version_to_approved
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/protocol-versions/{id}/approve
          - state_machines.ProtocolVersion.DRAFT_to_APPROVED
          - errors.ERR_VERSION_NOT_APPROVABLE
        distinguishing_aspect: "The action must both transition the row and record who acted: status APPROVED with approved_by_user_id equal to the calling director's X-User-ID and version incremented, and a second approval of the same row must fail with ERR_VERSION_NOT_APPROVABLE."
        test_recipe:
          setup:
            - "One program with one DRAFT protocol version whose weights are normalized."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id, pv_v: $.data.version }
          trigger:
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted by medical control" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "second attempt" }
              as: MedicalDirector
              as_user_id: "dir-1"
          assert:
            - "The first approve returns 200 with data.status == APPROVED and data.approved_by_user_id == dir-1"
            - "data.version == 2 (exactly one increment over the created version ${pv_v}) and data.activated_at is still null — approval does not activate"
            - "The second approve returns 409 with data.error_id == ERR_VERSION_NOT_APPROVABLE and approved_by_user_id is unchanged"

      - name: the_random_draw_is_capped_by_the_remaining_quota
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/sampling-periods/{id}/draw-random-sample
          - calculations.systematic_sample_selection
