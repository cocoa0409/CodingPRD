scaffold_corner_design:
  # ===================================================================
  # Entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_lead_status
        claim_type: Creation
        grounds:
          - entities.Project.fields.status
          - endpoints
        distinguishing_aspect: "POST /projects with customer_id+address_line returns 201; Project.status == LEAD, version == 1."
        test_recipe:
          setup:
            - "A Customer exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_e1@x.com", full_name: "C E1", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ce1: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${ce1}", address_line: "E1 Way" }
              as: SalesRep
              captures: { pe1: $.data.id, pe1status: $.data.status, pe1ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Project.${pe1}.status == LEAD"
            - "Project.${pe1}.version == 1"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /projects/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB except clock default."
          setup_api_calls: []
          trigger:
            - call: "GET /projects/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: SalesRep
              captures: { erre2: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_customer_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Customer.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /customers omitting required email -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "No Email", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { erre3: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_addon_invalid_enum_kind_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.AddOn.fields.kind
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /quotes/{id}/addons with kind not in {HARDWARE,COUNTERTOP} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "A DRAFT Quote exists on a COMPLETED measure."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_e4@x.com", full_name: "C E4", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ce4: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${ce4}", address_line: "E4 Way" }
              as: SalesRep
              captures: { pe4: $.data.id }
            - call: "POST /projects/${pe4}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { me4: $.data.id }
            - call: "POST /projects/${pe4}/measures/${me4}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${pe4}/quotes"
              payload: { measure_id: "${me4}", scope: "REFACE" }
              as: SalesRep
              captures: { qe4: $.data.id }
          trigger:
            - call: "POST /quotes/${qe4}/addons"
              payload: { kind: "PLUMBING", unit_price_cents: 100, quantity: 2 }
              as: SalesRep
              captures: { erre4: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: project_computed_dimensions_set_on_measure_complete
        claim_type: Computed Fields
        grounds:
          - entities.Project.fields.linear_feet
          - entities.Project.fields.door_count
          - state_machines.Measure.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Completing a Measure copies linear_feet=25 and door_count=18 onto the parent Project (computed, not client-set)."
        test_recipe:
          setup:
            - "A Project in LEAD with a SCHEDULED Measure."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_e5@x.com", full_name: "C E5", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ce5: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${ce5}", address_line: "E5 Way" }
              as: SalesRep
              captures: { pe5: $.data.id }
            - call: "POST /projects/${pe5}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { me5: $.data.id }
          trigger:
            - call: "POST /projects/${pe5}/measures/${me5}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "GET /projects/${pe5}"
              payload: {}
              as: SalesRep
              captures: { lf5: $.data.linear_feet, dc5: $.data.door_count, st5: $.data.status }
          assert:
            - "Project.${pe5}.linear_feet == 25"
            - "Project.${pe5}.door_count == 18"
            - "Project.${pe5}.status == MEASURED"

      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /projects returns a paginated array envelope with total_count and has_more fields."
        test_recipe:
          setup:
            - "At least one Project exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_e6@x.com", full_name: "C E6", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ce6: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${ce6}", address_line: "E6 Way" }
              as: SalesRep
              captures: { pe6: $.data.id }
          trigger:
            - call: "GET /projects"
              payload: { limit: 10, offset: 0 }
              as: SalesRep
          assert:
            - "response.response_type == array"
            - "response.meta.total_count >= 1"

      - name: customer_id_is_system_minted_uuid
        claim_type: System Fields
        grounds:
          - entities.Customer
        distinguishing_aspect: "POST /customers mints id, created_at, updated_at, version server-side; client cannot set them."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "c_e7@x.com", full_name: "C E7", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ce7: $.data.id, ce7ver: $.data.version }
          assert:
            - "Customer.${ce7}.version == 1"
            - "response.data.id is a UUID without a type prefix"

  # ===================================================================
  # State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: cancel_measure_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Measure.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-COMPLETED Measure -> ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup:
            - "A COMPLETED Measure exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_s1@x.com", full_name: "C S1", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cs1: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cs1}", address_line: "S1 Way" }
              as: SalesRep
              captures: { ps1: $.data.id }
            - call: "POST /projects/${ps1}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { ms1: $.data.id }
            - call: "POST /projects/${ps1}/measures/${ms1}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
          trigger:
            - call: "POST /projects/${ps1}/measures/${ms1}/cancel"
              payload: {}
              as: SalesRep
              captures: { errs1: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: approve_quote_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Quote.QUOTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an already-APPROVED quote a second time -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "An APPROVED quote exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_s2@x.com", full_name: "C S2", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cs2: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cs2}", address_line: "S2 Way" }
              as: SalesRep
              captures: { ps2: $.data.id }
            - call: "POST /projects/${ps2}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { ms2: $.data.id }
            - call: "POST /projects/${ps2}/measures/${ms2}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${ps2}/quotes"
              payload: { measure_id: "${ms2}", scope: "REFACE" }
              as: SalesRep
              captures: { qs2: $.data.id }
            - call: "POST /quotes/${qs2}/issue"
              payload: {}
              as: SalesRep
              captures: { qs2v: $.data.version }
            - call: "POST /quotes/${qs2}/approve"
              payload: { expected_quote_version: "${qs2v}" }
              as: Customer
              as_user_id: "${cs2}"
              captures: { qs2v2: $.data.version }
          trigger:
            - call: "POST /quotes/${qs2}/approve"
              payload: { expected_quote_version: "${qs2v2}" }
              as: Customer
              as_user_id: "${cs2}"
              captures: { errs2: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: close_project_blocked_by_open_warranty_claim
        claim_type: guarded transitions
        grounds:
          - state_machines.Project.INSTALLED_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing an INSTALLED project with a SUBMITTED warranty claim is blocked; the close precondition (no SUBMITTED/APPROVED claim) fails -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "An INSTALLED project with one SUBMITTED, covered warranty claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c_s3@x.com", full_name: "C S3", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cs3: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cs3}", address_line: "S3 Way" }
              as: SalesRep
              captures: { ps3: $.data.id }
            - call: "POST /projects/${ps3}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { ms3: $.data.id }
            - call: "POST /projects/${ps3}/measures/${ms3}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${ps3}/quotes"
              payload: { measure_id: "${ms3}", scope: "REFACE" }
              as: SalesRep
              captures: { qs3: $.data.id }
            - call: "POST /quotes/${qs3}/issue"
              payload: {}
              as: SalesRep
              captures: { qs3v: $.data.version }
            - call: "POST /quotes/${qs3}/approve"
              payload: { expected_quote_version: "${qs3v}" }
              as: Customer
              as_user_id: "${cs3}"
            - call: "POST /projects/${ps3}/material-orders"
              payload: { quote_id: "${qs3}" }
              as: Scheduler
              captures: { mos3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-orders/${mos3}/mark-ready"
              payload: {}
              as: Scheduler
            - call: "POST /crews"
              payload: { name: "Crew S3", daily_job_capacity: 2, skill_finishes: ["WOOD_VENEER"] }
              as: Scheduler
              captures: { crs3: $.data.id }
            - call: "POST /projects/${ps3}/install-jobs"
              payload: { material_order_id: "${mos3}", crew_id: "${crs3}", window_start: "2026-05-06T08:00:00Z", window_end: "2026-05-06T17:00:00Z" }
              as: Scheduler
              captures: { ijs3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${ijs3}/start"
              payload: {}
              as: InstallCrew
            - call: "POST /install-jobs/${ijs3}/complete"
              payload: {}
              as: InstallCrew
            - call: "POST /projects/${ps3}/warranty-claims"
              payload: { description: "drawer misaligned" }
              as: Customer
              as_user_id: "${cs3}"
              captures: { wcs3: $.data.id }
          trigger:
            - call: "POST /projects/${ps3}/close"
              payload: {}
              as: Scheduler
              captures: { errs3: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: material_order_mark_ready_before_lead_elapsed_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MaterialOrder.PLACED_to_READY
          - validations[priority=10]
          - errors[ERR_LEAD_TIME_NOT_ELAPSED]
        distinguishing_aspect: "Marking a PLACED order READY while clock_now < ready_at -> ERR_LEAD_TIME_NOT_ELAPSED (409)."
        test_recipe:
          setup:
            - "Project IN_PRODUCTION, MaterialOrder PLACED with ready_at 2026-05-04; clock still at placement date 2026-04-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c_s4@x.com", full_name: "C S4", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cs4: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cs4}", address_line: "S4 Way" }
              as: SalesRep
              captures: { ps4: $.data.id }
            - call: "POST /projects/${ps4}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { ms4: $.data.id }
            - call: "POST /projects/${ps4}/measures/${ms4}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${ps4}/quotes"
              payload: { measure_id: "${ms4}", scope: "REFACE" }
              as: SalesRep
              captures: { qs4: $.data.id }
            - call: "POST /quotes/${qs4}/issue"
              payload: {}
              as: SalesRep
              captures: { qs4v: $.data.version }
            - call: "POST /quotes/${qs4}/approve"
              payload: { expected_quote_version: "${qs4v}" }
              as: Customer
              as_user_id: "${cs4}"
            - call: "POST /projects/${ps4}/material-orders"
              payload: { quote_id: "${qs4}" }
              as: Scheduler
              captures: { mos4: $.data.id }
          trigger:
            - call: "POST /material-orders/${mos4}/mark-ready"
              payload: {}
              as: Scheduler
              captures: { errs4: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LEAD_TIME_NOT_ELAPSED"

      - name: quote_lazily_expires_after_validity_window
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Quote.QUOTED_to_EXPIRED
          - entities.Quote.fields.expires_at
          - errors[ERR_QUOTE_EXPIRED]
        distinguishing_aspect: "After the clock passes expires_at (issuance + QUOTE_VALID_DAYS), approving the QUOTED quote -> ERR_QUOTE_EXPIRED (409) and quote is EXPIRED on read."
        test_recipe:
          setup:
            - "A QUOTED quote issued at 2026-04-01; clock advanced past its expires_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c_s5@x.com", full_name: "C S5", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cs5: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cs5}", address_line: "S5 Way" }
              as: SalesRep
              captures: { ps5: $.data.id }
            - call: "POST /projects/${ps5}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { ms5: $.data.id }
            - call: "POST /projects/${ps5}/measures/${ms5}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${ps5}/quotes"
              payload: { measure_id: "${ms5}", scope: "REFACE" }
              as: SalesRep
              captures: { qs5: $.data.id }
            - call: "POST /quotes/${qs5}/issue"
              payload: {}
              as: SalesRep
              captures: { qs5v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /quotes/${qs5}/approve"
              payload: { expected_quote_version: "${qs5v}" }
              as: Customer
              as_user_id: "${cs5}"
              captures: { errs5: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_EXPIRED"

      - name: terminal_quote_superseded_locked_against_reopen
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Quote.QUOTED_to_SUPERSEDED
          - state_machines.Quote.QUOTED_to_REVISING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Re-issuing a quote supersedes the prior is_active quote; reopening that SUPERSEDED quote -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Two quotes issued on one project; the first is SUPERSEDED by the second's issuance."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_s6@x.com", full_name: "C S6", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cs6: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cs6}", address_line: "S6 Way" }
              as: SalesRep
              captures: { ps6: $.data.id }
            - call: "POST /projects/${ps6}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { ms6: $.data.id }
            - call: "POST /projects/${ps6}/measures/${ms6}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${ps6}/quotes"
              payload: { measure_id: "${ms6}", scope: "REFACE" }
              as: SalesRep
              captures: { qs6a: $.data.id }
            - call: "POST /quotes/${qs6a}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /projects/${ps6}/quotes"
              payload: { measure_id: "${ms6}", scope: "REDOOR" }
              as: SalesRep
              captures: { qs6b: $.data.id }
            - call: "POST /quotes/${qs6b}/issue"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes/${qs6a}/reopen"
              payload: {}
              as: SalesRep
              captures: { errs6: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_sold_project_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Project.LEAD_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a SOLD project via POST /projects/{id}/cancel -> ERR_INVALID_STATE (409); cancel is only defined from {LEAD,MEASURED,QUOTED}."
        test_recipe:
          setup:
            - "A SOLD project (quote approved)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_s7@x.com", full_name: "C S7", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cs7: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cs7}", address_line: "S7 Way" }
              as: SalesRep
              captures: { ps7: $.data.id }
            - call: "POST /projects/${ps7}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { ms7: $.data.id }
            - call: "POST /projects/${ps7}/measures/${ms7}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${ps7}/quotes"
              payload: { measure_id: "${ms7}", scope: "REFACE" }
              as: SalesRep
              captures: { qs7: $.data.id }
            - call: "POST /quotes/${qs7}/issue"
              payload: {}
              as: SalesRep
              captures: { qs7v: $.data.version }
            - call: "POST /quotes/${qs7}/approve"
              payload: { expected_quote_version: "${qs7v}" }
              as: Customer
              as_user_id: "${cs7}"
          trigger:
            - call: "POST /projects/${ps7}/cancel"
              payload: {}
              as: SalesRep
              captures: { errs7: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: change_order_accept_cascade_install_cancel_excluded
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChangeOrder.PENDING_to_ACCEPTED
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_accept_cascade_depth3_to_install_cancel
          rationale: "The full ChangeOrder-accept cascade (re-price -> lead extend -> install cancel -> project revert) is the depth-3 §1.8 instance."

  # ===================================================================
  # Calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: base_lead_time_volume_step_at_30_feet_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.base_lead_time
          - entities.MaterialOrder.fields.base_lead_time_days
        distinguishing_aspect: "base_lead_time adds VOLUME_LEAD_STEP_DAYS at linear_feet >= 30: REFACE/WOOD_VENEER/30lf gives base_lead_time_days 40 (28+5+7); 29lf would give 33."
        test_recipe:
          setup:
            - "Project SOLD with APPROVED REFACE/WOOD_VENEER quote, Measure linear_feet=30; clock at 2026-04-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "c_k1@x.com", full_name: "C K1", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ck1: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${ck1}", address_line: "K1 Way" }
              as: SalesRep
              captures: { pk1: $.data.id }
            - call: "POST /projects/${pk1}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { mk1: $.data.id }
            - call: "POST /projects/${pk1}/measures/${mk1}/complete"
              payload: { linear_feet: 30, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${pk1}/quotes"
              payload: { measure_id: "${mk1}", scope: "REFACE" }
              as: SalesRep
              captures: { qk1: $.data.id }
            - call: "POST /quotes/${qk1}/issue"
              payload: {}
              as: SalesRep
              captures: { qk1v: $.data.version }
            - call: "POST /quotes/${qk1}/approve"
              payload: { expected_quote_version: "${qk1v}" }
              as: Customer
              as_user_id: "${ck1}"
          trigger:
            - call: "POST /projects/${pk1}/material-orders"
              payload: { quote_id: "${qk1}" }
              as: Scheduler
              captures: { mok1: $.data.id, bld1: $.data.base_lead_time_days, ra1: $.data.ready_at }
          assert:
            - "MaterialOrder.${mok1}.base_lead_time_days == 40"
            - "MaterialOrder.${mok1}.ready_at == 2026-05-11T00:00:00Z"

      - name: financing_monthly_payment_amortization_correct
        claim_type: Correct Result
        grounds:
          - calculations.financing_monthly_payment
          - entities.FinancingApplication.fields.monthly_payment_cents
          - entities.FinancingApplication.fields.dti_ratio
        distinguishing_aspect: "amount 2000000, term 36 (APR 0.0799), income 3800000 -> monthly_payment_cents 62664, dti_ratio 0.1979."
        test_recipe:
          setup:
            - "A Customer with annual_income_cents 3800000 and a project."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_k2@x.com", full_name: "C K2", state_code: "CA", annual_income_cents: 3800000 }
              as: SalesRep
              captures: { ck2: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${ck2}", address_line: "K2 Way" }
              as: SalesRep
              captures: { pk2: $.data.id }
          trigger:
            - call: "POST /projects/${pk2}/financing-applications"
              payload: { customer_id: "${ck2}", amount_cents: 2000000, term_months: 36 }
              as: Customer
              as_user_id: "${ck2}"
              captures: { fak2: $.data.id, mp2: $.data.monthly_payment_cents, dti2: $.data.dti_ratio }
          assert:
            - "FinancingApplication.${fak2}.monthly_payment_cents == 62664"
            - "FinancingApplication.${fak2}.dti_ratio == 0.1979"

      - name: provisional_estimate_excludes_doors_and_finish
        claim_type: Input Set Filtering
        grounds:
          - calculations.provisional_estimate
          - entities.Quote.fields.estimate_total_cents
        distinguishing_aspect: "estimate_total_cents for REDOOR/32lf is 1440000 (45000*32) regardless of door_count=24 or finish SOLID_WOOD — door/finish are excluded from the estimate input set."
        test_recipe:
          setup:
            - "A COMPLETED Measure linear_feet=32, door_count=24, finish SOLID_WOOD."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_k3@x.com", full_name: "C K3", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ck3: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${ck3}", address_line: "K3 Way" }
              as: SalesRep
              captures: { pk3: $.data.id }
            - call: "POST /projects/${pk3}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { mk3: $.data.id }
            - call: "POST /projects/${pk3}/measures/${mk3}/complete"
              payload: { linear_feet: 32, door_count: 24, door_style: "RAISED", finish_code: "SOLID_WOOD" }
              as: SalesRep
          trigger:
            - call: "POST /projects/${pk3}/quotes"
              payload: { measure_id: "${mk3}", scope: "REDOOR" }
              as: SalesRep
              captures: { qk3: $.data.id, estk3: $.data.estimate_total_cents }
          assert:
            - "Quote.${qk3}.estimate_total_cents == 1440000"

      - name: addon_price_cents_round_half_up
        claim_type: Precision
        grounds:
          - calculations.firm_quote_total
          - entities.AddOn.fields.price_cents
        distinguishing_aspect: "A single COUNTERTOP add-on 6533 x 30.5 = 199256.5 rounds half-up to price_cents 199257."
        test_recipe:
          setup:
            - "A DRAFT Quote on a COMPLETED measure."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_k4@x.com", full_name: "C K4", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { ck4: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${ck4}", address_line: "K4 Way" }
              as: SalesRep
              captures: { pk4: $.data.id }
            - call: "POST /projects/${pk4}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { mk4: $.data.id }
            - call: "POST /projects/${pk4}/measures/${mk4}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${pk4}/quotes"
              payload: { measure_id: "${mk4}", scope: "REFACE" }
              as: SalesRep
              captures: { qk4: $.data.id }
          trigger:
            - call: "POST /quotes/${qk4}/addons"
              payload: { kind: "COUNTERTOP", unit_price_cents: 6533, quantity: 30.5 }
              as: SalesRep
              captures: { adk4: $.data.id, pk4price: $.data.price_cents }
          assert:
            - "AddOn.${adk4}.price_cents == 199257"

      - name: firm_total_provisional_divergence_excluded
        claim_type: Variant Divergence
        grounds:
          - calculations.provisional_estimate
          - calculations.firm_quote_total
        excluded_because:
          difficulty_instance: dual_variant_calc / quote_provisional_estimate_vs_firm_total_diverge
          rationale: "Estimate-vs-firm divergence on identical Measure data is the primary §1.8 dual-variant instance."

  # ===================================================================
  # Validations
  # ===================================================================
  - section: validations
    instances:
      - name: issue_quote_with_scheduled_measure_returns_measure_not_completed
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_MEASURE_NOT_COMPLETED]
        distinguishing_aspect: "Issuing a quote whose linked Measure is still SCHEDULED -> ERR_MEASURE_NOT_COMPLETED (409). Quote create is allowed only on COMPLETED, so use a second SCHEDULED measure on same project mismatch... instead create draft against completed then test issue blocked by reverting measure: not possible; use distinct path."
        test_recipe:
          setup:
            - "A Project with a COMPLETED Measure (so a DRAFT quote can be created), but the quote will be tested against a state where the issue precondition is checked. We create the DRAFT on the completed measure, then to provoke ERR_MEASURE_NOT_COMPLETED we rely on the issue-time recheck: a DRAFT quote references a measure that is COMPLETED — so instead we trigger via a separate freshly-scheduled measure quote."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_v1@x.com", full_name: "C V1", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cv1: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cv1}", address_line: "V1 Way" }
              as: SalesRep
              captures: { pv1: $.data.id }
            - call: "POST /projects/${pv1}/measures"
              payload: { scheduled_for: "2026-04-02T15:00:00Z" }
              as: SalesRep
              captures: { mv1c: $.data.id }
            - call: "POST /projects/${pv1}/measures/${mv1c}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${pv1}/quotes"
              payload: { measure_id: "${mv1c}", scope: "REFACE" }
              as: SalesRep
              captures: { qv1: $.data.id }
            - call: "POST /projects/${pv1}/measures/${mv1c}/cancel"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes/${qv1}/issue"
              payload: {}
              as: SalesRep
              captures: { errv1: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MEASURE_NOT_COMPLETED"

      - name: quote_create_measure_belongs_to_other_project_mismatch
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=5]
          - errors[ERR_MEASURE_PROJECT_MISMATCH]
        distinguishing_aspect: "Creating a Quote on project A referencing a Measure that belongs to project B -> ERR_MEASURE_PROJECT_MISMATCH (422)."
        test_recipe:
          setup:
            - "Project A and project B each with a COMPLETED measure."
          setup_api_calls:
