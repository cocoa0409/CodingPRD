            - { call: "POST /packinghouse/groves", payload: { grower_id: "${v9_g}", block_code: "N1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: false }, as: PackinghouseAdmin, captures: { v9_gn: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${v9_g}", block_code: "Y1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: true }, as: PackinghouseAdmin, captures: { v9_gy: "$.data.id" } }
