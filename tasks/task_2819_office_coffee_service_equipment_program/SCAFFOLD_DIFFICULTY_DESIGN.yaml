          Depth-3 cascade from a DIFFERENT trigger (POST /ocs/accounts/{account_id}/cancel): the
          cancellation schedules retrieval on the ACTIVE placement (hop 1), that retrieval scheduling
          suspends the placement's Site (hop 2), and the SUSPENDED site cancels its own SCHEDULED
          visit and releases its 45 booked route minutes (hop 3) - propagation runs placement -> site
