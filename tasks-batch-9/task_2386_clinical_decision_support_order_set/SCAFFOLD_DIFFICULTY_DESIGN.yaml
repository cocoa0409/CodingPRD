  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_burden_window_half_open_allows_touching_but_rejects_intersection
        interval_semantics: "half-open [window_start, window_end): equal endpoints are adjacent and permitted"
        grounds:
          - validations[priority=19]
          - errors.ERR_BURDEN_WINDOW_OVERLAP
          - entities.AlertBurdenWindow.fields.window_start
          - validations[priority=11]
        distinguishing_aspect: |
          The contended resource is an Alert's monitoring timeline, and the interval
          semantics are half-open: a window whose window_start equals an existing
          window's window_end is adjacent, not overlapping, and must be accepted. A
          genuinely intersecting window straddling two closed windows must be refused.
          The instance also proves the two rules are independent: the intersecting
          attempt is rejected by the overlap rule (priority 19) and not by the
          one-window-open rule (priority 11), because no window is OPEN at that moment.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and one specialty approver exist."
