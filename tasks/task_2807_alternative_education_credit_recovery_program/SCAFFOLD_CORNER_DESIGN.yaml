      - name: clock_set_backward_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLOCK_BACKWARD
          - validations.priority_20_ERR_CLOCK_BACKWARD
          - endpoints.POST__clock_set_current_utc
        distinguishing_aspect: "The logical clock is monotonic: a forward move to 2026-08-03T00:00:00Z succeeds, an attempt to step back one second is refused with ERR_CLOCK_BACKWARD, and a later forward move still succeeds from the retained value."
        test_recipe:
          setup: ["an empty database with the logical clock at its default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T23:59:59Z" }
              as: DistrictAdmin
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-01"
          assert:
            - "the first call returns HTTP 200 with current_utc == '2026-08-03T00:00:00Z'"
            - "the second call returns HTTP 409 with error id ERR_CLOCK_BACKWARD"
            - "the third call returns HTTP 200 with current_utc == '2026-08-04T00:00:00Z', proving the clock retained 2026-08-03T00:00:00Z after the refusal"

