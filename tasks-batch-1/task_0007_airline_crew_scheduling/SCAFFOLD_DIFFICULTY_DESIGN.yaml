  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_confirm_requires_pairing_awarded_pair_assignment_pairing
        grounds:
          - state_machines.Assignment.transitions.SCHEDULED_to_CONFIRMED
          - state_machines.Pairing
          - validations[priority=6]
          - errors[ERR_CROSS_ENTITY_STATE]
        distinguishing_aspect: |
          Assignment SCHEDULED->CONFIRMED's preconditions include 'Pairing.state
          == AWARDED'. If the parent Pairing was cancelled (state=CANCELLED)
          between award and confirm via a race in the operator path... ACTUALLY
          since pairings cancel only from DRAFT|BID_OPEN, this case is
          unreachable — instead test the BUBBLE: Pairing in IN_PROGRESS — its
          Assignment's state has cascaded to ACTIVE, and confirm of that
          assignment should yield ERR_INVALID_STATE (different from the cross-
          entity case). Refined test: keep the assignment SCHEDULED and trigger
          parent Pairing transition to a state where Assignment.confirm rejects.
          We pin: with Pairing in DRAFT (assignment would not exist yet) is
          impossible — so use a parallel scenario where confirm is called
          twice; second one is state error. Effective cross-entity case: confirm
          on an assignment whose Pairing has been bumped IN_PROGRESS (cascade
          moved it to ACTIVE). Entity pair: Assignment ↔ Pairing.
        test_recipe:
          setup:
            - "Pairing P in IN_PROGRESS after clock-set crosses scheduled_start_utc"
            - "The contained Assignment A is cascaded to ACTIVE"
            - "Operator/CM attempts confirm on A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0120", full_name: "C", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 120, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_id: "$.data.id "}
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-120", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_id: "$.data.id "}
