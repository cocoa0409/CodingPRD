              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000078", equipment_type: "DRY40", customer_account_id: "${acct_f}", service_contract_id: "${ctr_f}", terminal_id: "${term_oak}", discharge_ts: "2026-09-08T12:00:00Z", available_ts: "2026-09-09T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_f: $.data.id }
