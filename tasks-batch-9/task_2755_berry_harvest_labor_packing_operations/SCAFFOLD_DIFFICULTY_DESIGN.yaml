            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T05:00:00Z", end_at: "2026-08-03T18:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-RT2", slot_capacity: 3, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tun_v1: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 60, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot1: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 40, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot2: $.data.id }
            - call: "POST /berry-ops/fruit-lots/${lot1}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T09:00:00Z", planned_cool_end_at: "2026-08-03T13:00:00Z", entry_pulp_temp_f: 56.0, pallet_slots: 3, expected_cooling_tunnel_version: "${tun_v1}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "GET /berry-ops/cooling-tunnels/${tun}"
              payload: {}
