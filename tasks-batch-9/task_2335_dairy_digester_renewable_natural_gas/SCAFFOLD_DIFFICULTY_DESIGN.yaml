# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2335_dairy_digester_renewable_natural_gas
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Every numeric literal in
# `assert:` was produced by executing the named §1.3 formula with its declared
# constants against the pinned setup (Decimal, ROUND_HALF_UP / ROUND_FLOOR as the
# `precision:` field states). The logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_credit_quantity_provisional_vs_final_diverge_after_material_finding
        grounds:
          - calculations.credit_quantity
          - calculations.pathway_ci_score
          - entities.CreditBatch.fields.credit_quantity_provisional
          - entities.CreditBatch.fields.credit_quantity_final
          - entities.CreditBatch.fields.credit_value_cents
          - state_machines.CreditPathway.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Variant divergence lives on the CreditBatch entity in the environmental-credit
          domain: identical delivered_mmbtu (120.280) yields credit_quantity_provisional
          36.111 from the CERTIFIED carbon intensity and credit_quantity_final 35.004 from
          the auditor's VERIFIED carbon intensity, a 1.107-credit delta on the same row.
        test_recipe:
          setup:
            - "One mesophilic 6000 m3 facility, two contracted dairies with different manure_management_baseline values (LAGOON and SOLID_STORAGE) and different haul distances."
            - "One CLOSED operations day 2026-08-03 carrying two ACCEPTED deliveries, conditioned to PIPELINE_SPEC and then INJECTED through a DELIVERED nomination of 120.280 MMBtu."
            - "An LCFS CreditPathway CERTIFIED at certified_ci_score -236.67, and one CreditBatch for 2026-08-01..2026-08-31 already CLAIMED, VERIFIED and ISSUED at the certified score."
            - "A VerificationAudit in FIELDWORK whose recorded actuals produce reported_ci_score -226.98, i.e. ci_delta +9.69."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3000, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 18000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /dairies"
              payload: { name: "Kings River Dairy", county: "Kings", herd_size: 2200, manure_management_baseline: "SOLID_STORAGE", haul_distance_km: 30.0, annual_nitrogen_budget_kg: 12000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy2_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 8.0, term_start_date: "2026-01-01", term_end_date: "2026-12-31", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "August 2026 term sheet" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/sign"
              payload: { signatory_name: "R. Alvarez" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy2_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 120.000, minimum_total_solids_pct: 6.5, term_start_date: "2026-01-01", term_end_date: "2026-12-31", revenue_share_pct: 0.1500, revenue_share_basis: "GROSS", curtailable: false }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr2_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr2_id}/offer"
              payload: { cover_note: "August 2026 term sheet" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr2_id}/sign"
              payload: { signatory_name: "D. Okafor" }
              as: DairyPartner
              as_user_id: "${dairy2_id}"
            - call: "POST /interconnect-agreements"
              payload: { facility_id: "${facility_id}", pipeline_operator_name: "Central Valley Gas Transmission", max_h2s_ppm: 4.0, max_moisture_lb_per_mmscf: 7.0, max_co2_pct: 2.0, min_hhv_btu_per_scf: 967.00, max_hourly_injection_mmbtu: 12.000, ramp_buffer_minutes: 30, nomination_lead_hours: 24 }
              as: PipelineScheduler
              as_user_id: "u-sched"
              captures: { ic_id: "$.data.id" }
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-03" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day1_id: "$.data.id" }
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "${agr1_id}", ops_day_id: "${day1_id}", gross_tonnes: 150.000, tare_tonnes: 0.000, total_solids_pct: 8.0, volatile_solids_pct_of_ts: 82.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { del1_id: "$.data.id" }
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "${agr2_id}", ops_day_id: "${day1_id}", gross_tonnes: 100.000, tare_tonnes: 0.000, total_solids_pct: 7.2, volatile_solids_pct_of_ts: 80.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { del2_id: "$.data.id" }
            - call: "POST /ops-days/${day1_id}/close"
              payload: { avg_digester_temp_c: 38.4, temp_excursion_minutes: 15, vfa_mg_per_l: 2400.0, alkalinity_mg_per_l: 8000.0, raw_biogas_scf: 196000.000, raw_ch4_pct: 62.0, raw_co2_pct: 36.5, raw_h2s_ppm: 1800.0, raw_moisture_lb_per_mmscf: 120.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /ops-days/${day1_id}/condition-gas"
              payload: { disposition: "RECONDITION", treated_ch4_pct: 96.5, treated_co2_pct: 1.5, treated_h2s_ppm: 3.5, treated_moisture_lb_per_mmscf: 5.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /injection-nominations"
              payload: { interconnect_id: "${ic_id}", ops_day_id: "${day1_id}", window_start_utc: "2026-08-04T06:00:00Z", window_end_utc: "2026-08-04T18:00:00Z", nominated_mmbtu: 120.280 }
              as: PipelineScheduler
              as_user_id: "u-sched"
              captures: { nom1_id: "$.data.id" }
            - call: "POST /injection-nominations/${nom1_id}/schedule-decision"
              payload: { decision: "CONFIRM" }
              as: PipelineScheduler
              as_user_id: "u-sched"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T19:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /injection-nominations/${nom1_id}/deliver"
              payload: { delivered_mmbtu: 120.280 }
              as: PipelineScheduler
              as_user_id: "u-sched"
            - call: "POST /credit-pathways"
              payload: { facility_id: "${facility_id}", program: "LCFS", pathway_code: "CA-LCFS-DDRNG-2026-01" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { pathway_id: "$.data.id" }
            - call: "POST /credit-pathways/${pathway_id}/certification-decision"
              payload: { decision: "CERTIFY", reference_start_date: "2026-08-01", reference_end_date: "2026-08-31" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { pathway_v: "$.data.version" }
            - call: "POST /credit-batches"
              payload: { pathway_id: "${pathway_id}", facility_id: "${facility_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_pathway_version: "${pathway_v}" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { batch_id: "$.data.id" }
            - call: "POST /credit-batches/${batch_id}/claim"
              payload: { claim_note: "August 2026 LCFS claim" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { prov_qty: "$.data.credit_quantity_provisional" }
            - call: "POST /credit-batches/${batch_id}/verify"
              payload: { verifier_note: "Volumes traced to interconnect statements" }
              as: CreditVerifier
              as_user_id: "u-verifier"
            - call: "POST /credit-batches/${batch_id}/issue"
              payload: { issuance_reference: "LRT-2026-08-0001" }
              as: ProgramAdministrator
              as_user_id: "u-program"
            - call: "POST /verification-audits"
              payload: { pathway_id: "${pathway_id}", audit_year: 2026, verifier_body_name: "Verdant Registry Services" }
              as: CreditVerifier
              as_user_id: "u-verifier"
              captures: { audit_id: "$.data.id" }
            - call: "POST /verification-audits/${audit_id}/fieldwork"
              payload: { actual_pipeline_mmbtu: 120.500, actual_vs_tonnes_lagoon: 9.500, actual_vs_tonnes_solid_storage: 5.600, actual_vs_tonnes_daily_spread: 0.000, actual_haul_tonne_km: 5040.00, actual_process_g_per_mj: 15.95 }
              as: CreditVerifier
              as_user_id: "u-verifier"
          trigger:
            - call: "POST /verification-audits/${audit_id}/findings"
              payload: { narrative: "Metered volume and haul distance restated" }
              as: CreditVerifier
              as_user_id: "u-verifier"
            - call: "GET /credit-batches/${batch_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "u-program"
          assert:
            - "VerificationAudit.${audit_id}.reported_ci_score == -226.98"
            - "VerificationAudit.${audit_id}.ci_delta == 9.69"
            - "VerificationAudit.${audit_id}.finding_severity == MATERIAL"
            - "CreditPathway.${pathway_id}.certified_ci_score == -236.67"
            - "CreditPathway.${pathway_id}.verified_ci_score == -226.98"
            - "CreditPathway.${pathway_id}.ci_adjustment == 9.69"
            - "CreditBatch.${batch_id}.delivered_mmbtu == 120.280"
            - "CreditBatch.${batch_id}.credit_quantity_provisional == 36.111"
            - "CreditBatch.${batch_id}.credit_quantity_final == 35.004"
            - "CreditBatch.${batch_id}.credit_value_cents == 260780"
            - "CreditBatch.${batch_id}.credit_quantity_provisional != CreditBatch.${batch_id}.credit_quantity_final"
            - "CreditPathway.${pathway_id}.credit_control_residual == 0.000"

      - name: dv_plant_available_nitrogen_lab_vs_agronomic_on_identical_digestate
        grounds:
          - calculations.plant_available_nitrogen
          - entities.NutrientApplication.fields.pan_basis
          - entities.NutrientApplication.fields.plant_available_nitrogen_kg
          - entities.OperationsDay.fields.lab_total_nitrogen_mg_per_l
        distinguishing_aspect: |
          Variant divergence lives on the NutrientApplication entity in the agronomic
          nutrient-management domain, not on a credit or money field: the same 20.000 t of
          cake and 100.000 t of liquid charge 99.650 kg PAN on the LAB basis and 105.170 kg
          on the AGRONOMIC basis, because only the liquid availability factor changes
          (0.5500 vs the derived 0.5980) while the solids term stays 36.400 kg.
        test_recipe:
          setup:
            - "One facility with a single CLOSED operations day 2026-08-03 carrying one ACCEPTED 150.000 t delivery at 8.0 percent total solids."
            - "Separation recorded on that day at 65.0 percent solids capture and 70.0 percent bedding recovery with a laboratory liquid nitrogen result of 1150.0 mg/L, leaving 26.000 t cake and 124.000 t liquid on hand."
            - "Two distinct land units LU-101 and LU-102 on the same dairy so the 21-day reapplication setback cannot interfere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3000, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 18000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 8.0, term_start_date: "2026-01-01", term_end_date: "2026-12-31", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "August 2026 term sheet" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/sign"
              payload: { signatory_name: "R. Alvarez" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-03" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day1_id: "$.data.id" }
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "${agr1_id}", ops_day_id: "${day1_id}", gross_tonnes: 150.000, tare_tonnes: 0.000, total_solids_pct: 8.0, volatile_solids_pct_of_ts: 82.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /ops-days/${day1_id}/close"
              payload: { avg_digester_temp_c: 38.4, temp_excursion_minutes: 15, vfa_mg_per_l: 2400.0, alkalinity_mg_per_l: 8000.0, raw_biogas_scf: 196000.000, raw_ch4_pct: 62.0, raw_co2_pct: 36.5, raw_h2s_ppm: 1800.0, raw_moisture_lb_per_mmscf: 120.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /ops-days/${day1_id}/record-separation"
              payload: { solids_capture_pct: 65.0, bedding_recovery_pct: 70.0, lab_total_nitrogen_mg_per_l: 1150.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
          trigger:
            - call: "POST /nutrient-applications"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", ops_day_id: "${day1_id}", land_unit_code: "LU-101", application_start_date: "2026-08-10", application_end_date: "2026-08-11", solids_tonnes_applied: 20.000, liquid_tonnes_applied: 100.000, pan_basis: "LAB" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { app_lab_id: "$.data.id", pan_lab: "$.data.plant_available_nitrogen_kg" }
            - call: "POST /nutrient-applications"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", ops_day_id: "${day1_id}", land_unit_code: "LU-102", application_start_date: "2026-08-10", application_end_date: "2026-08-11", solids_tonnes_applied: 20.000, liquid_tonnes_applied: 100.000, pan_basis: "AGRONOMIC" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { app_agro_id: "$.data.id", pan_agro: "$.data.plant_available_nitrogen_kg" }
          assert:
            - "OperationsDay.${day1_id}.digestate_solids_tonnes == 26.000"
            - "OperationsDay.${day1_id}.digestate_liquid_tonnes == 124.000"
            - "NutrientApplication.${app_lab_id}.liquid_total_nitrogen_kg == 115.000"
            - "NutrientApplication.${app_lab_id}.solids_total_nitrogen_kg == 104.000"
            - "NutrientApplication.${app_lab_id}.plant_available_nitrogen_kg == 99.650"
            - "NutrientApplication.${app_agro_id}.liquid_total_nitrogen_kg == 115.000"
            - "NutrientApplication.${app_agro_id}.solids_total_nitrogen_kg == 104.000"
            - "NutrientApplication.${app_agro_id}.plant_available_nitrogen_kg == 105.170"
            - "NutrientApplication.${app_agro_id}.plant_available_nitrogen_kg - NutrientApplication.${app_lab_id}.plant_available_nitrogen_kg == 5.520"
            - "Dairy.${dairy1_id}.pan_applied_ytd_kg == 0.000"

      - name: dv_pathway_ci_certified_variant_uses_design_constant_verified_uses_measured_process
        grounds:
          - calculations.pathway_ci_score
          - calculations.audit_finding_severity
          - entities.CreditPathway.fields.certified_ci_score
          - entities.VerificationAudit.fields.reported_ci_score
          - state_machines.VerificationAudit.FIELDWORK_to_FIELDWORK
        distinguishing_aspect: |
          Variant divergence lives on the CreditPathway/VerificationAudit pair in the
          pathway-certification domain: with every gas, mass and haul input held at the
          certified value, replacing only PROCESS_G_PER_MJ (15.40) with the auditor's
          measured actual_process_g_per_mj (17.55) moves the score from -236.67 to -234.52,
          proving the VERIFIED variant reads no design constant at all.
        test_recipe:
          setup:
            - "One facility with a CLOSED operations day 2026-08-03 conditioned to PIPELINE_SPEC at 120.280 MMBtu from two ACCEPTED deliveries (9.840 t VS from a LAGOON dairy, 5.760 t VS from a SOLID_STORAGE dairy, 4800.00 tonne-km of haul)."
            - "An LCFS CreditPathway CERTIFIED over 2026-08-01..2026-08-31 at certified_ci_score -236.67."
            - "A VerificationAudit for 2026 open in FIELDWORK on that pathway."
          setup_api_calls:
