            - "ProductTest.${t_wear_fail}.verdict == FAIL"
            - "ProductTest.${t_stain_pass}.verdict == PASS"
            - "ProductTest.${t_flam_pass}.verdict == PASS"
            - "ProductTest.${t_flam_fail}.verdict == FAIL"
            - "the FAIL-filtered list returns meta.total_count == 2"
            - "RollGood.${rg}.qa_status == PENDING (recording tests does not disposition the roll)"

      - name: style_backorder_alert_is_inclusive_at_two_hundred_fifty_yards
        claim_type: input_set_filtering
        grounds:
          - calculations.style_backorder_posture
          - entities.CarpetStyle.fields.replenishment_flag
          - state_machines.CutOrder.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          249.9 open yards leaves replenishment_flag NONE and 250.0 raises REPLENISH_REQUIRED
          (STYLE_BACKORDER_ALERT_YARDS is compared with >=); cancelling the first order removes its
          yards from the sweep entirely, proving the input set is filtered to SUBMITTED/BACKORDERED
          rather than accumulating over history.
        test_recipe:
          setup:
            - "ACTIVE solution-dyed style ST-SD-01 at 4275 cents/yard with no roll goods at all, and Account AC-01 with a 100000000-cent limit."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 249.9, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co1: $.data.id }
            - call: "GET /mill/styles/${st}"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/cut-orders/${co1}/cancel"
              payload: { reason: "reduced" }
              as: MillPlanner
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-02", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 250.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co2: $.data.id }
            - call: "GET /mill/styles/${st}"
              payload: {}
              as: MillPlanner
          assert:
            - "after CO-01, CarpetStyle.${st}.open_backorder_yards == 249.9 and CarpetStyle.${st}.replenishment_flag == NONE"
