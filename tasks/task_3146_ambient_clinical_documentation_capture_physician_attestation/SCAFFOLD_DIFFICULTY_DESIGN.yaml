  # ===========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: segment_half_open_intervals_on_capture
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGMENT_OVERLAP]
          - entities.SpeakerSegment.fields.start_offset_ms
        distinguishing_aspect: |
          Resource: SpeakerSegment intervals on an AudioCapture; semantics:
          half-open [start, end) — adjacency (start == prior end) is allowed,
          a 1ms overlap is rejected. No buffer requirement.
        test_recipe:
          setup:
            - "CAPTURED audio on an IN_PROGRESS encounter (segments may be appended while the encounter is in progress)"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-TO1-1", full_name: "Pat To1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-TO1-1", full_name: "Doc To1", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/segments"
              payload: { start_offset_ms: 0, end_offset_ms: 5000, speaker_role: "PHYSICIAN", base_confidence: 0.95 }
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/segments"
              payload: { start_offset_ms: 5000, end_offset_ms: 9000, speaker_role: "PATIENT", base_confidence: 0.9 }
              as: Physician
              as_user_id: "${phy}"
              captures: { seg2: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/segments"
              payload: { start_offset_ms: 8999, end_offset_ms: 12000, speaker_role: "CAREGIVER", base_confidence: 0.8 }
              as: Physician
              as_user_id: "${phy}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Segment [5000,9000) is accepted: adjacency (start == 5000 == prior end) is allowed under half-open semantics"
            - "err == ERR_SEGMENT_OVERLAP for [8999,12000): a 1ms overlap with [5000,9000) is rejected"
      - name: capture_buffer_gap_on_encounter
        grounds:
          - validations[priority=8]
          - errors[ERR_CAPTURE_GAP_VIOLATION]
        distinguishing_aspect: |
          Resource: AudioCapture intervals on an Encounter; semantics: mandatory
          60-second buffer BETWEEN captures — even perfectly non-overlapping
          (disjoint) capture intervals are rejected when the gap is under 60s,
          and accepted at exactly 60s. Different resource and different interval
          arithmetic from the segment half-open rule.
        test_recipe:
          setup:
            - "Encounter IN_PROGRESS, consent GRANTED, capture1 stopped at 2026-09-01T10:02:00Z"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-TO2-1", full_name: "Pat To2" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-TO2-1", full_name: "Doc To2", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
