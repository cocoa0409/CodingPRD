      - call: POST /storage-placements
        payload:
          segment_id: ${seg_id}
          car_mark: STGX9801
          placed_date: '2026-08-01'
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          pl_id: $.data.id
      - call: POST /_clock/set_current_utc
