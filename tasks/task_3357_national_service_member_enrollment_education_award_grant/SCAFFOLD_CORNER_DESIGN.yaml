# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3357_national_service_member_enrollment_education_award_grant
# Breadth probe over §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Shared setup chains are YAML anchors defined at first use in THIS file.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: organization_create_returns_declared_fields_and_starts_active
        claim_type: Creation
        grounds: ["entities.GranteeOrganization", "endpoints.POST_/organizations"]
        distinguishing_aspect: "An organization created with legal_name/ein/org_type returns 201 with status ACTIVE, version 1, and system-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup: ["Logical clock at the default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CNCSProgramOfficer
          trigger:
            - &k_org
              call: "POST /organizations"
              payload: { legal_name: "River City Service Corps", ein: "12-3456789", org_type: "NONPROFIT" }
              as: CNCSProgramOfficer
              captures: { org_id: $.data.id }
          assert:
            - "status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "GranteeOrganization.${org_id}.status == ACTIVE and version == 1"
            - "id is a prefix-less UUID; created_at and updated_at are non-null ISO8601 with three fractional digits"

      - name: competition_create_starts_open_and_window_is_stored
        claim_type: Creation
        grounds: ["entities.GrantCompetition", "endpoints.POST_/competitions", "state_machines.GrantCompetition"]
        distinguishing_aspect: "A competition starts in OPEN with the exact application window round-tripped; fiscal_year stored as integer."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - &k_comp
              call: "POST /competitions"
              payload: { title: "FY2026 Service Corps", fiscal_year: 2026, application_open_at: "2026-09-01T00:00:00Z", application_close_at: "2026-10-01T00:00:00Z" }
              as: CNCSProgramOfficer
              captures: { comp_id: $.data.id }
          assert:
            - "status 201; GrantCompetition.${comp_id}.status == OPEN"
            - "application_open_at == 2026-09-01T00:00:00Z and application_close_at == 2026-10-01T00:00:00Z"

      - name: application_create_missing_slot_requests_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.GrantApplication.fields.slot_requests", "validations[priority=7]", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "slot_requests is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the request-shape check, not a 404 and not a business error."
        test_recipe:
          setup: ["Clock set; org and competition exist."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
          trigger:
            - call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 4000000, match_lines: [{ category: "CASH", amount_cents: 1000000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /applications?organization_id=${org_id} returns 0 rows"

      - name: application_create_computes_msy_and_cost_fields
        claim_type: Computed Fields
        grounds: ["entities.GrantApplication.fields.msy_requested", "entities.GrantApplication.fields.total_term_minutes", "calculations.term_table_lookup", "calculations.cost_per_msy"]
        distinguishing_aspect: "A DRAFT application for 2 FULL_TIME slots computes total_term_minutes 204000, msy_requested 2.0, cost_per_msy_federal_cents 2000000.0 — computed fields are derived, never client-set."
        test_recipe:
          setup: ["Clock set; org and competition exist."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
          trigger:
            - &k_app_draft
              call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 4000000, slot_requests: [{ term_category: "FULL_TIME", count: 2 }], match_lines: [{ category: "CASH", amount_cents: 1000000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
          assert:
            - "status 201; GrantApplication.${app_id}.status == DRAFT (initial state) and version == 1"
            - "total_term_minutes == 204000 and msy_requested == 2.0"
            - "allowable_match_commitment_cents == 1000000 (CASH rate 1.00)"
            - "clarification_question and clarification_response are null"

      - name: applications_list_paginates_and_filters
        claim_type: Listing
        grounds: ["endpoints.GET_/applications", "response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "With three DRAFT applications, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status=DRAFT filter returns all 3; the unfiltered default applies limit 10."
        test_recipe:
          setup: ["Clock set; org, competition, and three applications exist."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 2300000, slot_requests: [{ term_category: "FULL_TIME", count: 1 }], match_lines: [{ category: "CASH", amount_cents: 560000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 1150000, slot_requests: [{ term_category: "HALF_TIME", count: 1 }], match_lines: [{ category: "CASH", amount_cents: 276000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /applications"
              payload: { organization_id: "${org_id}", limit: 2, offset: 0 }
              as: CNCSProgramOfficer
            - call: "GET /applications"
              payload: { organization_id: "${org_id}", limit: 2, offset: 2 }
              as: CNCSProgramOfficer
            - call: "GET /applications"
              payload: { status: "DRAFT" }
              as: CNCSProgramOfficer
          assert:
            - "page 1: response_type array, exactly 2 rows, total_count == 3, has_more == true"
            - "page 2: exactly 1 row, total_count == 3, has_more == false"
            - "status=DRAFT filter returns 3 rows; an unfiltered GET returns 3 rows under the default limit 10"

      - name: award_get_returns_stored_ledger_and_competition_finalizes
        claim_type: Retrieval
        grounds: ["entities.GrantAward", "endpoints.GET_/awards/{awardId}", "state_machines.GrantCompetition.CLOSED_to_AWARDS_FINALIZED"]
        distinguishing_aspect: "The award round-trips federal_share_awarded_cents 4000000, allowable_match_cents 0, awarded_slot_count 2, cost_per_msy_awarded_cents 2000000.0, status ACTIVE, version 1; awarding the competition's only application bubbles the competition to AWARDS_FINALIZED."
        test_recipe:
          setup: ["Application submitted; window closed."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - &k_submit
              call: "POST /applications/${app_id}/submit"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - &k_clock2
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: CNCSProgramOfficer
            - &k_close
              call: "POST /competitions/${comp_id}/close"
              payload: {}
              as: CNCSProgramOfficer
          trigger:
            - &k_award
              call: "POST /applications/${app_id}/award"
              payload: { federal_share_awarded_cents: 4000000 }
              as: CNCSProgramOfficer
              captures: { award_id: $.data.id, award_v1: $.data.version }
            - call: "GET /awards/${award_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /competitions/${comp_id}"
              payload: {}
              as: CNCSProgramOfficer
            - &k_slots_list
              call: "GET /awards/${award_id}/slots"
              payload: {}
              as: CNCSProgramOfficer
              captures: { slot_1: "$.data[0].id" }
          assert:
            - "GrantAward.${award_id}: federal_share_awarded_cents == 4000000, allowable_match_cents == 0, awarded_slot_count == 2, cost_per_msy_awarded_cents == 2000000.0, status == ACTIVE, version == 1"
            - "GrantCompetition.${comp_id}.status == AWARDS_FINALIZED (compound bubble-up: all applications terminal)"
            - "GET slots returns 2 rows with slot_index 1 and 2, both status OPEN, term_category FULL_TIME, fill_count 0 (indices assigned sequentially in slot_requests order)"

      - name: member_register_client_status_input_ignored
        claim_type: System Fields
        grounds: ["entities.Member.fields.status", "endpoints.POST_/members/register"]
        distinguishing_aspect: "A smuggled status field in the register payload is ignored — the member starts ACTIVE with for_cause_release_count 0."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /members/register"
              payload: { full_name: "Alex Rivera", date_of_birth: "2000-01-01", citizenship_status: "US_CITIZEN", status: "DEBARRED" }
              as: Anonymous
              captures: { m_a: $.data.id }
          assert:
            - "status 201; Member.${m_a}.status == ACTIVE (client-supplied status ignored)"
            - "Member.${m_a}.for_cause_release_count == 0 and version == 1"

      - name: enrollment_create_computes_term_and_zero_ledgers
        claim_type: Computed Fields
        grounds: ["entities.MemberEnrollment.fields.term_minutes", "entities.MemberEnrollment.fields.certified_minutes", "calculations.term_table_lookup"]
        distinguishing_aspect: "A FULL_TIME enrollment is created with term_minutes 102000 (from the category table), certified_minutes 0, fundraising_certified_minutes 0, allowance_paid_cents 0, suspension_origin NONE — all computed/system fields."
        test_recipe:
          setup: ["Award ACTIVE with 2 FULL_TIME slots; member registered with a CLEARED check."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - &k_mem
              call: "POST /members/register"
              payload: { full_name: "Alex Rivera", date_of_birth: "2000-01-01", citizenship_status: "US_CITIZEN" }
              as: Anonymous
              captures: { m_a: $.data.id }
            - &k_chk
              call: "POST /members/${m_a}/criminal-history-checks"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { chk_a: $.data.id }
            - &k_clr1
              call: "POST /criminal-history-checks/${chk_a}/component-results"
              payload: { component: "NSOPR", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &k_clr2
              call: "POST /criminal-history-checks/${chk_a}/component-results"
              payload: { component: "STATE_REPOSITORY", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &k_clr3
              call: "POST /criminal-history-checks/${chk_a}/component-results"
              payload: { component: "FBI_FINGERPRINT", result: "CLEAR" }
              as: CNCSProgramOfficer
          trigger:
            - &k_enr
              call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_a}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v1}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_a: $.data.id, slot_a: $.data.slot_id }
          assert:
            - "status 201; MemberEnrollment.${enr_a}.term_minutes == 102000 and term_category == FULL_TIME"
            - "certified_minutes == 0, fundraising_certified_minutes == 0, allowance_paid_cents == 0"
            - "status == ACTIVE (check already CLEARED), suspension_origin == NONE, exit_reason null, exit_overpayment_cents null"
            - "slot_id is non-null (assigned by the selector); GrantAward.${award_id}.version == 2 after creation"

      - name: hour_entry_defaults_reject_reason_null
        claim_type: Defaults
        grounds: ["entities.ServiceHourEntry.fields.reject_reason", "entities.ServiceHourEntry.fields.status"]
        distinguishing_aspect: "A new hour entry starts PENDING with reject_reason null; the client cannot set either."
        test_recipe:
          setup: ["Member A enrolled and ACTIVE."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_enr
          trigger:
            - &k_ent480
              call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 480, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a: $.data.id }
          assert:
            - "status 201; ServiceHourEntry.${ent_a}.status == PENDING and reject_reason is null"
            - "MemberEnrollment.${enr_a}.certified_minutes still == 0 (nothing accumulates before certification)"

      - name: hour_entry_invalid_activity_code_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.ServiceHourEntry.fields.activity_code", "validations[priority=7]", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "An activity_code outside the six-value enum is a 400 ERR_INVALID_REQUEST at the request-shape check — it never reaches the prohibited-activity safety check."
        test_recipe:
          setup: ["Member A enrolled and ACTIVE."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_enr
          trigger:
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 480, activity_code: "LOBBYING" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /enrollments/${enr_a}/hour-entries returns 0 rows"

      - name: enrollment_unknown_member_returns_member_not_found
        claim_type: Parent Relationships
        grounds: ["entities.MemberEnrollment.fields.member_id", "validations[priority=6]", "errors.ERR_MEMBER_NOT_FOUND"]
        distinguishing_aspect: "A syntactically valid but unallocated member_id in the enrollment body is a 404 ERR_MEMBER_NOT_FOUND from the body-FK existence check — before any safety or slot logic runs."
        test_recipe:
          setup: ["Award ACTIVE with 2 FULL_TIME slots."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
          trigger:
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "00000000-0000-4000-8000-000000000000", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v1}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_MEMBER_NOT_FOUND"
            - "GET /awards/${award_id}/slots still shows 2 OPEN slots (no reservation happened)"

      - name: enrollment_get_unknown_id_returns_enrollment_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/enrollments/{enrollmentId}", "errors.ERR_ENROLLMENT_NOT_FOUND", "validations[priority=5]"]
        distinguishing_aspect: "An unallocated enrollmentId produces the entity-specific 404 ERR_ENROLLMENT_NOT_FOUND with the standard error envelope."
        test_recipe:
          setup: ["Clock set; nothing else required."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CNCSProgramOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_ENROLLMENT_NOT_FOUND"
            - "response_type == error and data carries error_id and message"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: enrollment_initial_state_pending_checks
        claim_type: Initial State
        grounds: ["state_machines.MemberEnrollment"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / enrollment_activation_gated_on_check"
          rationale: "That instance asserts the PENDING_CHECKS status of a fresh enrollment (check still PENDING) as its first assert."

      - name: submit_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.GrantApplication.DRAFT_to_UNDER_REVIEW", "errors.ERR_INVALID_STATE"]
        distinguishing_aspect: "Submitting an already-UNDER_REVIEW application is a 409 ERR_INVALID_STATE — the DRAFT from-state guard rejects the repeat."
        test_recipe:
          setup: ["Application submitted once."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "GrantApplication.${app_id}.status still == UNDER_REVIEW"

      - name: award_on_rejected_application_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.GrantApplication", "errors.ERR_INVALID_STATE"]
        distinguishing_aspect: "A REJECTED (terminal) application rejects a later award call with 409 ERR_INVALID_STATE; no GrantAward is created."
        test_recipe:
          setup: ["Application UNDER_REVIEW after the window closed, then rejected."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - call: "POST /applications/${app_id}/reject"
              payload: { reason: "Insufficient community need" }
              as: CNCSProgramOfficer
          trigger:
            - call: "POST /applications/${app_id}/award"
              payload: { federal_share_awarded_cents: 4000000 }
              as: CNCSProgramOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "GET /awards?application_id=${app_id} returns 0 rows"
            - "GrantCompetition.${comp_id}.status == AWARDS_FINALIZED (rejection also bubbles up)"

      - name: certify_certified_entry_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.ServiceHourEntry.PENDING_to_CERTIFIED", "errors.ERR_INVALID_STATE"]
        distinguishing_aspect: "CERTIFIED is terminal: a second certify is 409 ERR_INVALID_STATE and certified_minutes does not double-count."
        test_recipe:
          setup: ["Member A enrolled ACTIVE with one CERTIFIED 480-minute entry."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_enr
            - *k_ent480
            - &k_cert480
              call: "POST /hour-entries/${ent_a}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /hour-entries/${ent_a}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "MemberEnrollment.${enr_a}.certified_minutes == 480 (no double-count)"

      - name: resolve_filed_grievance_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Grievance.ESCALATED_to_RESOLVED", "errors.ERR_INVALID_STATE"]
        distinguishing_aspect: "Resolve requires ESCALATED; resolving a FILED grievance (never escalated) is 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Member A enrolled ACTIVE; grievance filed (FILED), not escalated."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_enr
            - &k_grv
              call: "POST /enrollments/${enr_a}/grievances"
              payload: { description: "Disputed conduct finding" }
              as: Member
              as_user_id: "${m_a}"
              captures: { grv_a: $.data.id }
          trigger:
            - call: "POST /grievances/${grv_a}/resolve"
              payload: { outcome: "DISMISSED" }
              as: CNCSProgramOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "Grievance.${grv_a}.status == FILED and outcome is null"

      - name: conduct_conducted_visit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.ComplianceVisit.SCHEDULED_to_CONDUCTED", "errors.ERR_INVALID_STATE"]
        distinguishing_aspect: "Conducting an already-CONDUCTED visit is 409 ERR_INVALID_STATE and conducted_at is not overwritten."
        test_recipe:
          setup: ["Award ACTIVE; visit scheduled 2026-11-02 and conducted."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - &k_visit
              call: "POST /awards/${award_id}/compliance-visits"
              payload: { visit_type: "SITE_VISIT", scheduled_date: "2026-11-02" }
              as: ComplianceOfficer
              as_user_id: "co-one"
              captures: { visit_1: $.data.id }
            - &k_conduct
              call: "POST /compliance-visits/${visit_1}/conduct"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-one"
          trigger:
            - call: "POST /compliance-visits/${visit_1}/conduct"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-one"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "ComplianceVisit.${visit_1}.status == CONDUCTED with conducted_at == 2026-10-02T00:00:00Z (unchanged)"

      - name: visit_closes_when_all_findings_resolved
        claim_type: Bubble Up
        grounds: ["state_machines.ComplianceVisit.CONDUCTED_to_CLOSED", "state_machines.Finding.EVIDENCE_SUBMITTED_to_RESOLVED"]
        distinguishing_aspect: "The visit auto-transitions CONDUCTED -> CLOSED exactly when its last open finding is RESOLVED — a compound parent state derived from children."
        test_recipe:
          setup: ["Conducted visit with one finding; corrective action assigned; evidence submitted by the grantee."]
