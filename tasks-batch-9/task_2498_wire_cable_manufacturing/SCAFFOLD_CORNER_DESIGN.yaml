  # ===========================================================================
  # Section 4 - Validations (1.4)
  # ===========================================================================
  - section: validations
    instances:

      - name: auth_and_shape_checks_are_evaluated_before_existence_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - validations[priority=25]
          - validations[priority=30]
        distinguishing_aspect: "The same non-existent lot id yields three different answers depending on who asks - 401 with no headers, 403 for a role outside the endpoint's list, 404 only for an authorised caller - and a malformed body is rejected at priority 25 before any of its foreign keys is looked up."
        test_recipe:
          setup:
            - "One real rod lot (so a valid expected_rod_lot_version exists); no production lot with the id 00000000-0000-4000-8000-000000000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
          trigger:
            - call: "GET /production-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { e_401: $.data.error_id }
            - call: "GET /production-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Customer
              captures: { e_403: $.data.error_id }
            - call: "POST /production-lots"
              payload: { product_id: "00000000-0000-4000-8000-000000000000", rod_lot_id: "${rod_id}", lot_code: "LOT-BAD", planned_length_ft: -5, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { e_400: $.data.error_id }
            - call: "GET /production-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcessEngineer
              captures: { e_404: $.data.error_id }
          assert:
