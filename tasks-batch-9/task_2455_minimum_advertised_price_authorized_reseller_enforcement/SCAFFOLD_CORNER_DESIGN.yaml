            - "TestPurchase.${tp}.status == CONFIRMED_UNAUTHORIZED"
            - "TestPurchase.${tp}.outcome_reason == 'Seller has no agreement on file'"
            - "SerialUnit.${su1}.status == TRACED_UNAUTHORIZED"
            - "SerialUnit.${su1}.traced_at == '2026-08-20T00:00:00.000Z'"
            - "PriceObservation.${obsg}.unauthorized_seller_confirmed == true"

      - name: test_purchase_serial_captured_to_cleared_leaves_unit_and_observation_alone
        claim_type: valid_transition
        grounds: ["state_machines.TestPurchase.transitions.SERIAL_CAPTURED_to_CLEARED"]
        distinguishing_aspect: "The AUTHORIZED outcome reaches the other terminal state with an explicitly empty side-effect set: the serial unit stays SHIPPED_TO_DISTRIBUTOR and unauthorized_seller_confirmed stays false."
        test_recipe:
          setup: ["Test purchase SERIAL_CAPTURED against SN-0001."]
          setup_api_calls:
