            - call: "POST /refund-requests/${rr_es2_id}/decision"
              payload: { decision: "APPROVED", approver_tier: 3 }
              as: RefundApprover
              as_user_id: "appr-1"
            - call: "POST /refund-batches"
              payload: { batch_number: "B-ESC", bank_account_code: "OPERATING", cutoff_at: "2026-08-18T00:00:00Z", scheduled_run_at: "2026-08-20T00:00:00Z" }
              as: DisbursementOfficer
