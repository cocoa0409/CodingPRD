# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3026_pick_brick_wall_build_minifigure_bulk_retail
#
# Cross-references §1.1–§1.7 against the nine Difficulty Rules of §0.5.
# Every chain below is replayable against §1.5 from empty-DB and every assert
# literal was produced by executing the §1.3 formula as code.
#
# Fixture conventions:
#   - logical clock default 2026-09-01T00:00:00Z
#   - fixture stores use wall_bin_capacity_grams 2000, so the wall edges are
#     RESTRICTED at 200 g and EMPTY-bins-only at 0 g
#   - EMPTY_BACKFILL_PCT is 0.10, so a 2000 g bin auto-backfills by 200 g
#   - fixture stores set checklist_required: true; recipes that do not create
#     an ExitInspection use JUMBO or SMALL cups whose declared_mass_grams is
#     under the 340 g / 120 g cup ceilings, and Member in RESTRICTED
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: same_cup_priced_from_scale_mass_and_tunnel_volume
        grounds:
          - calculations.cup_fill_inferred_pieces
          - calculations.cup_fill_overage_band
          - state_machines.FusionOrder.PENDING_to_SETTLED
        distinguishing_aspect: "One cup with declared_mass_grams 440 and measured_volume_ml 480 is priced twice on the same row: the default MASS variant infers 132 pieces and charges 116 cents while the VOLUME variant infers 115 pieces and charges 108 cents, so the two valid readings of one physical cup produce different money."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0001 with wall_bin_capacity_grams 2000, one element 3001, one STANDARD member, one bin holding 2000 g."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0001", display_name: "Brick Yard Flagship", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3001", element_name: "Brick 2x4", theme: "Town", unit_mass_grams: 2.5, cost_basis_cents: 6, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3001: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_mass@example.com", display_name: "Mass Member", home_store_id: "${store1_id}" }
              as: PlatformAdmin
              captures: { mem_1: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store1_id}", element_id: "${elem_3001}", bin_label: "A12", bin_capacity_grams: 2000, bin_mass_grams: 2000 }
              as: StoreAssociate
              captures: { bin_a12: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store1_id}", member_id: "${mem_1}", cup_size: "LARGE", pricing_model: "CUP_FILL", declared_mass_grams: 440, measured_volume_ml: 480 }
              as: StoreAssociate
              captures: { ord_mass: $.data.id }
            - call: "POST /stores/fusion-orders/{id}/allocations"
              payload: { wall_bin_id: "${bin_a12}", allocation_grams: 440 }
              as: StoreAssociate
              captures: { ord_mass_v: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_mass_v}" }
              as: Member
              as_user_id: "${mem_1}"
              captures: { mass_pieces: $.data.priced_piece_count, mass_final: $.data.final_price_cents }
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store1_id}", member_id: "${mem_1}", cup_size: "LARGE", pricing_model: "CUP_FILL", declared_mass_grams: 440, measured_volume_ml: 480 }
              as: StoreAssociate
              captures: { ord_vol: $.data.id }
            - call: "POST /stores/fusion-orders/{id}/allocations"
              payload: { wall_bin_id: "${bin_a12}", allocation_grams: 440 }
              as: StoreAssociate
              captures: { ord_vol_v: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_vol_v}", pricing_variant: "VOLUME" }
              as: Member
              as_user_id: "${mem_1}"
              captures: { vol_pieces: $.data.priced_piece_count, vol_final: $.data.final_price_cents }
          assert:
            - "FusionOrder.${ord_mass}.priced_piece_count == 132"
            - "FusionOrder.${ord_mass}.base_price_cents == 129 and FusionOrder.${ord_mass}.final_price_cents == 116"
            - "FusionOrder.${ord_vol}.priced_piece_count == 115"
            - "FusionOrder.${ord_vol}.base_price_cents == 120 and FusionOrder.${ord_vol}.final_price_cents == 108"
            - "FusionOrder.${ord_mass}.final_price_cents != FusionOrder.${ord_vol}.final_price_cents"

      - name: per_piece_element_valued_by_count_while_cup_fill_is_valued_by_mass
        grounds:
          - calculations.cup_fill_inferred_pieces
          - calculations.per_piece_price
          - entities.FusionOrder.fields.pricing_model
        distinguishing_aspect: "Identical 440 g of the same element cost 116 cents as a cup-fill cup but 1584 cents as a per-piece cup at 132 declared pieces, so the variant choice changes the money by an order of magnitude on the same physical quantity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0002 with wall_bin_capacity_grams 2000, element 3002, one STANDARD member, one bin holding 2000 g."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0002", display_name: "Brick Yard Annex", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3002", element_name: "Brick 2x2", theme: "Icons", unit_mass_grams: 1.8, cost_basis_cents: 5, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3002: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_two@example.com", display_name: "Two Member", home_store_id: "${store2_id}" }
              as: PlatformAdmin
              captures: { mem_2: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store2_id}", element_id: "${elem_3002}", bin_label: "B01", bin_capacity_grams: 2000, bin_mass_grams: 2000 }
              as: StoreAssociate
              captures: { bin_b01: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store2_id}", member_id: "${mem_2}", cup_size: "LARGE", pricing_model: "CUP_FILL", declared_mass_grams: 440 }
              as: StoreAssociate
              captures: { ord_cup: $.data.id }
            - call: "POST /stores/fusion-orders/{id}/allocations"
              payload: { wall_bin_id: "${bin_b01}", allocation_grams: 440 }
              as: StoreAssociate
              captures: { ord_cup_v: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_cup_v}" }
              as: Member
              as_user_id: "${mem_2}"
              captures: { cup_final: $.data.final_price_cents }
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store2_id}", member_id: "${mem_2}", cup_size: "LARGE", pricing_model: "PER_PIECE", declared_mass_grams: 440, pieced_element_id: "${elem_3002}", declared_piece_count: 132 }
              as: StoreAssociate
              captures: { ord_pc: $.data.id, ord_pc_v: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_pc_v}" }
              as: Member
              as_user_id: "${mem_2}"
              captures: { pc_final: $.data.final_price_cents }
          assert:
            - "FusionOrder.${ord_cup}.final_price_cents == 116"
            - "FusionOrder.${ord_pc}.base_price_cents == 1584 and FusionOrder.${ord_pc}.final_price_cents == 1426"
            - "FusionOrder.${ord_pc}.declared_piece_count == 132"
            - "WallBin.${bin_b01}.bin_mass_grams == 1560"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: replacement_claim_and_completion_award_different_points
        grounds:
          - calculations.replacement_points_award
          - calculations.replacement_request_budget
          - state_machines.ReplacementRequest.PROSPECT_to_CLAIMED
          - state_machines.ReplacementRequest.OPEN_to_COMPLETED
        distinguishing_aspect: "Two requests of five pieces on the same 6-cent element diverge by two orders of magnitude: the CLAIMED path awards 3 points from the element cost basis while the COMPLETED path awards 125 points from the flat good-will credit."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0003 with wall_bin_capacity_grams 2000, element 3010, one ACTIVE member, one bin holding 2000 g, and two PROSPECT requests."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0003", display_name: "Brick Yard South", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store3_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3010", element_name: "Plate 1x2", theme: "Town", unit_mass_grams: 0.8, cost_basis_cents: 6, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3010: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_rep@example.com", display_name: "Rep Member", home_store_id: "${store3_id}" }
              as: PlatformAdmin
              captures: { mem_rep: $.data.id, mem_rep_v1: $.data.version }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store3_id}", element_id: "${elem_3010}", bin_label: "C01", bin_capacity_grams: 2000, bin_mass_grams: 2000 }
              as: StoreAssociate
              captures: { bin_c01: $.data.id }
            - call: "POST /stores/replacement-requests"
              payload: { store_id: "${store3_id}", member_id: "${mem_rep}", element_id: "${elem_3010}", quantity_missing: 5, proof_of_purchase_supplied: false, window_days: 30, expected_member_version: "${mem_rep_v1}" }
              as: StoreAssociate
              captures: { req_claim: $.data.id }
            - call: "POST /stores/members/{id}/reinstate"
              payload: {}
              as: StoreAssociate
              captures: { mem_rep_v2: $.data.version }
          trigger:
            - call: "POST /stores/replacement-requests/{id}/claim"
              payload: {}
              as: Member
              as_user_id: "${mem_rep}"
              captures: { claim_pts: $.data.earned_points }
          assert:
            - "ReplacementRequest.${req_claim}.stage == CLAIMED"
            - "ReplacementRequest.${req_claim}.earned_points == 3"
            - "ReplacementRequest.${req_claim}.window_days == 30"

      - name: overage_band_and_bulk_band_resolve_on_one_checkout_endpoint
        grounds:
          - calculations.cup_fill_overage_band
          - calculations.per_piece_price
          - calculations.member_price_with_launch_surcharge
          - state_machines.FusionOrder.PENDING_to_SETTLED
        distinguishing_aspect: "The same checkout endpoint selects between an overage band that divides before it rounds and a bulk band that multiplies before it sums: a cup-fill cup at 132 pieces yields 129 cents while a per-piece cup at 100 pieces yields 1600 cents before discount."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0004 with wall_bin_capacity_grams 2000, element 3004, one STANDARD member, one bin holding 2000 g, one launch LEGO-X1 allocated 10 units with per_customer_limit 2."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0004", display_name: "Brick Yard East", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store4_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3004", element_name: "Brick 2x6", theme: "Icons", unit_mass_grams: 3.0, cost_basis_cents: 7, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3004: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_pp@example.com", display_name: "Piece Member", home_store_id: "${store4_id}" }
              as: PlatformAdmin
              captures: { mem_pp: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store4_id}", element_id: "${elem_3004}", bin_label: "D01", bin_capacity_grams: 2000, bin_mass_grams: 2000 }
              as: StoreAssociate
              captures: { bin_d01: $.data.id }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Icons", exclusive_set_sku: "LEGO-X1", allocated_exclusive_units: 10, exclusive_set_unit_price_cents: 1500, per_customer_limit: 2, days_from_default_clock: 3, vip_early_days_before_release: 1 }
              as: PlatformAdmin
              captures: { launch_x1: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store4_id}", member_id: "${mem_pp}", cup_size: "LARGE", pricing_model: "PER_PIECE", declared_mass_grams: 300, pieced_element_id: "${elem_3004}", declared_piece_count: 100 }
              as: StoreAssociate
              captures: { ord_pp: $.data.id, ord_pp_v: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_pp_v}", exclusive_launch_id: "${launch_x1}" }
              as: Member
              as_user_id: "${mem_pp}"
              captures: { pp_base: $.data.base_price_cents, pp_final: $.data.final_price_cents }
          assert:
            - "FusionOrder.${ord_pp}.base_price_cents == 1600"
            - "FusionOrder.${ord_pp}.member_discount_cents == 160"
            - "FusionOrder.${ord_pp}.final_price_cents == 1800"
            - "FusionOrder.${ord_pp}.priced_piece_count == 100"

      - name: small_cup_band_and_waitlist_promotion_arithmetic_in_one_wave
        grounds:
          - calculations.cup_fill_overage_band
          - calculations.waitlist_promotion
          - calculations.minifigure_component_availability
        distinguishing_aspect: "One wave evaluates a mass-inferred overage band (78 pieces into a 60-piece bucket yields a 13-cent band) alongside a seat-capacity promotion that accepts equality, so both combinatorial paths are exercised without sharing a formula."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0005 with wall_bin_capacity_grams 2000, element 3011, one STANDARD member, one bin holding 2000 g, event slot on 2026-09-02 with capacity 1, and one WAITLISTED reservation."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0005", display_name: "Brick Yard North", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store5_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3011", element_name: "Tile 1x2", theme: "Technic", unit_mass_grams: 1.2, cost_basis_cents: 9, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3011: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_mix@example.com", display_name: "Mix Member", home_store_id: "${store5_id}" }
              as: PlatformAdmin
              captures: { mem_mix: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store5_id}", element_id: "${elem_3011}", bin_label: "E01", bin_capacity_grams: 2000, bin_mass_grams: 2000 }
              as: StoreAssociate
              captures: { bin_e01: $.data.id }
            - call: "POST /stores/store-events"
              payload: { store_id: "${store5_id}", event_kind: "BUILD_EVENT", title: "Weekend Build", capacity_units: 1, days_from_default_clock: 1, duration_hours: 2 }
              as: StoreAssociate
              captures: { ev_mix: $.data.id }
            - call: "POST /stores/mini-build-reservations"
              payload: { store_event_id: "${ev_mix}", member_id: "${mem_mix}", seats: 1 }
              as: StoreAssociate
              captures: { res_mix: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${store5_id}", member_id: "${mem_mix}", cup_size: "SMALL", pricing_model: "CUP_FILL", declared_mass_grams: 260 }
              as: StoreAssociate
              captures: { ord_mix: $.data.id, ord_mix_v: $.data.version }
            - call: "POST /stores/fusion-orders/{id}/checkout"
              payload: { expected_fusion_order_version: "${ord_mix_v}" }
              as: Member
              as_user_id: "${mem_mix}"
              captures: { mix_base: $.data.base_price_cents }
          assert:
            - "FusionOrder.${ord_mix}.priced_piece_count == 78"
            - "FusionOrder.${ord_mix}.base_price_cents == 117"
            - "FusionOrder.${ord_mix}.final_price_cents == 105"
            - "StoreEvent.${ev_mix}.registered_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: replacement_ceiling_beats_sourcing_rule_on_one_filing
        grounds:
          - validations[priority=7]
          - validations[priority=5]
          - errors[ERR_REPLACEMENT_LIMIT_REACHED]
          - errors[ERR_ELEMENT_NOT_SOURCED]
          - calculations.replacement_request_budget
        distinguishing_aspect: "A filing that trips both the per-member ceiling (business_constraint) and the element-sourcing rule (business_referential) reports ERR_REPLACEMENT_LIMIT_REACHED, pinning the constraint-before-referential pair that this endpoint inverts relative to the table default."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0010 with wall_bin_capacity_grams 2000, element 3050 sourced from surplus, element 3051 retired and therefore on current-production sourcing, one ACTIVE member, and three bins holding 600 g each."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0010", display_name: "Brick Yard Priority", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store10_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3050", element_name: "Brick 1x2", theme: "Town", unit_mass_grams: 0.7, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3050: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3051", element_name: "Brick 1x1 Round", theme: "Town", unit_mass_grams: 0.3, cost_basis_cents: 3, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3051: $.data.id, elem_3051_v1: $.data.version }
            - call: "POST /stores/members"
              payload: { email: "m_pri@example.com", display_name: "Priority Member", home_store_id: "${store10_id}" }
              as: PlatformAdmin
              captures: { mem_pri: $.data.id, mem_pri_v1: $.data.version }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store10_id}", element_id: "${elem_3050}", bin_label: "J01", bin_capacity_grams: 2000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_j01: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store10_id}", element_id: "${elem_3051}", bin_label: "J02", bin_capacity_grams: 2000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_j02: $.data.id }
            - call: "POST /stores/elements/{id}/retire"
              payload: { expected_element_version: "${elem_3051_v1}" }
              as: StoreAssociate
              captures: { elem_3051_status: $.data.status, elem_3051_mode: $.data.sourcing_mode }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store10_id}", element_id: "${elem_3050}", bin_label: "J03", bin_capacity_grams: 2000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_j03: $.data.id }
          trigger:
            - call: "POST /stores/replacement-requests"
              payload: { store_id: "${store10_id}", member_id: "${mem_pri}", element_id: "${elem_3050}", quantity_missing: 1, proof_of_purchase_supplied: false, window_days: 30, expected_member_version: "${mem_pri_v1}" }
              as: StoreAssociate
              captures: { req_pri_ok: $.data.id, mem_pri_v2: $.data.version }
            - call: "POST /stores/replacement-requests"
              payload: { store_id: "${store10_id}", member_id: "${mem_pri}", element_id: "${elem_3051}", quantity_missing: 1, proof_of_purchase_supplied: false, window_days: 30, expected_member_version: "${mem_pri_v2}" }
              as: StoreAssociate
              captures: { pri_err: $.data.error_id }
          assert:
            - "the first filing returns ReplacementRequest.${req_pri_ok}.stage == PROSPECT"
            - "the second filing returns error_id == ERR_REPLACEMENT_LIMIT_REACHED"
            - "ReplacementRequest.${req_pri_ok}.earned_points == 0"

      - name: store_posture_gate_beats_member_ceiling_gate_on_a_join
        grounds:
          - validations[priority=9]
          - validations[priority=7]
          - errors[ERR_STORE_FROZEN]
          - errors[ERR_PURCHASE_LIMIT_EXCEEDED]
        distinguishing_aspect: "A join that trips both the store posture gate (business_safety, priority 9) and the per-customer ceiling (business_constraint, priority 7) reports ERR_STORE_FROZEN, pinning a safety-before-constraint pair that is disjoint from the replacement conflict's pairing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0011 whose only bin is empty so the store reads FROZEN, element 3060, one ACTIVE member, and launch LEGO-P2 allocated 10 units with per_customer_limit 1 releasing on 2026-09-02."
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "LEGO-0011", display_name: "Brick Yard Gate", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { store11_id: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "3060", element_name: "Bracket 1x2", theme: "Technic", unit_mass_grams: 0.9, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { elem_3060: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_gate@example.com", display_name: "Gate Member", home_store_id: "${store11_id}" }
              as: PlatformAdmin
              captures: { mem_gate: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${store11_id}", element_id: "${elem_3060}", bin_label: "K01", bin_capacity_grams: 2000, bin_mass_grams: 0 }
              as: StoreAssociate
              captures: { bin_k01: $.data.id }
            - call: "POST /stores/theme-launches"
              payload: { theme: "Technic", exclusive_set_sku: "LEGO-P2", allocated_exclusive_units: 10, exclusive_set_unit_price_cents: 900, per_customer_limit: 1, days_from_default_clock: 1, vip_early_days_before_release: 0 }
              as: PlatformAdmin
              captures: { launch_p2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/{id}/run_epoch"
              payload: {}
              as: PlatformAdmin
              captures: { launch_p2_stage: $.data.stage }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/launch-queues"
              payload: { member_id: "${mem_gate}", launch_id: "${launch_p2}", priority_class: "GENERAL", requested_units: 2 }
              as: StoreAssociate
              captures: { gate_err: $.data.error_id }
          assert:
            - "Store.${store11_id}.stage == FROZEN"
            - "the join returns error_id == ERR_STORE_FROZEN"
