            # listings in {DRAFT} status get archived, and orders on DRAFT listings ... but no
            # orders exist on DRAFT listings. So the depth-3 cascade cannot ACTUALLY happen under
            # the current constraints. RESHAPE: change the reject transition to allow rejecting
            # an APPROVED design as well (admin recall). Fix scaffold.
