          assert:
            - "Trigger call 1: tenure_months == floor(0 / 2592000) == 0 -> tenure_mult 1.000 -> tenure_amount 2500, bonus 0, ooh 0, gross 2500, penalty 0, period_amount == min(2500, 5000) == 2500; data.incentive_accrued_cents == 2500 and accrual_periods == [{2026-08, 2500, reversed false}]"
            - "Trigger call 2: HTTP 409 with ${e61} == ERR_INCENTIVE_PERIOD_ALREADY_ACCRUED (priority 65) and data.incentive_accrued_cents is still 2500"
            - "Trigger call 4: 2027-01-27 is 179 days after recruited_at, and floor(179 * 86400 / 2592000) == floor(5.9666...) == 5 < 6 -> tenure_mult is still 1.000 -> period_amount 2500; data.incentive_accrued_cents == 5000"
            - "Trigger call 6: 2027-01-28 is exactly 180 days, floor(180 * 86400 / 2592000) == 6 -> tenure_mult 1.075 -> tenure_amount == round_half_up(2500 * 1.075, 0) == round_half_up(2687.5, 0) == 2688 (half UP, not 2687) -> period_amount 2688; data.incentive_accrued_cents == 7688 with three accrual_periods entries [2500, 2500, 2688]"
            - "Trigger call 7: data.incentive_budget_committed_cents == 7688, data.incentive_budget_reserved_cents == round_half_up(2000 * 0.25 * 4, 0) == 2000, and 7688 + 2000 stays well under the 500000 ceiling so priority 13 never fires"

      - name: incentive_period_cap_clamps_after_the_fault_penalty_is_subtracted
        claim_type: constants_applied
        grounds:
          - calculations.incentive_accrual_cents
          - calculations.incentive_accrual_cents.constants.INCENTIVE_PERIOD_CAP_CENTS
          - endpoints[POST /meters/{meter_id}/fault-reports]
        distinguishing_aspect: "Step 9 is min(gross - penalty, CAP), so the SAME household accrues exactly the 5000 cap while healthy and 4097 once a meter is faulted - the penalty is subtracted BEFORE the clamp, which is the opposite of clamping first. The faulted device is a PORTABLE_OOH meter, so the household never leaves ACTIVE and the out-of-home supplement keeps applying on install_status alone."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-662, RANK 162, T 4, B 4200, BUDGET 500000, so the cell is UNDER_TARGET with multiplier 1.25 and cell_base == round_half_up(4200 * 1.25, 0) == 5250."
            - "One household h1 (persons_count 2) holding a TV_TUNER MT-002071 and a PORTABLE_OOH MT-002072, both shipped while it was INSTALL_SCHEDULED, both install-confirmed, then enumerated to ACTIVE at the startup clock 2026-08-01T00:00:00Z (tenure_months 0, multiplier 1.000). It reports no tuning, so compliance_rate_rolling_30 is 0.0000 and no bonus ever applies."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Cap", market_code: "DMA-662", dma_rank: 162, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m62_id: "$.data.id" }
            - call: "POST /markets/${m62_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 4200 }
              as: PanelOperationsManager
              captures: { c62_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m62_id}", quota_cell_id: "${c62_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h62_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h62_id}", meter_type: "TV_TUNER", serial_no: "MT-002071" }
              as: FieldTechnician
              captures: { mt62t_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h62_id}", meter_type: "PORTABLE_OOH", serial_no: "MT-002072" }
              as: FieldTechnician
              captures: { mt62o_id: "$.data.id" }
            - call: "POST /meters/${mt62t_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mt62o_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h62_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
          trigger:
            - call: "POST /households/${h62_id}/accrue-incentive"
              payload: { period_label: "2026-08" }
              as: PanelOperationsManager
            - call: "POST /meters/${mt62o_id}/fault-reports"
              payload: { fault_code: "NO_SIGNAL" }
              as: FieldTechnician
            - call: "GET /households/${h62_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /households/${h62_id}/accrue-incentive"
              payload: { period_label: "2026-09" }
              as: PanelOperationsManager
            - call: "GET /quota-cells/${c62_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 1: tenure_amount 5250, bonus 0, ooh_amount == round_half_up(5250 * 0.0405, 0) == round_half_up(212.625, 0) == 213 (the supplement is owed because an INSTALLED PORTABLE_OOH meter exists), gross == 5463, penalty 0, period_amount == min(5463, 5000) == 5000 - the cap bites and the recorded entry is 5000, not 5463"
            - "Trigger call 2: HTTP 200 with data.health_status == FAULTED, data.fault_count == 1, data.last_fault_code == NO_SIGNAL and data.install_status still INSTALLED"
            - "Trigger call 3: data.status is STILL ACTIVE - the five-link cascade fires only for a TV_TUNER that leaves the household with no HEALTHY installed tuner, and this fault was on the out-of-home device"
            - "Trigger call 4: tenure_amount 5250, ooh_amount 213 again (install_status, not health_status, drives the supplement), gross 5463, penalty == round_half_up(5463 * 0.25, 0) == round_half_up(1365.75, 0) == 1366, period_amount == min(5463 - 1366, 5000) == min(4097, 5000) == 4097; data.incentive_accrued_cents == 5000 + 4097 == 9097"
            - "Trigger call 4: clamping first and then subtracting would have produced min(5463, 5000) - 1366 == 3634, so 4097 is the only value consistent with step 9"
            - "Trigger call 5: data.intab_count == 1 and data.fill_rate == 0.2500 - the out-of-home fault never touched the in-tab head-count"

      - name: billing_volume_bracket_at_exactly_eighty_thousand_gross
        claim_type: tiered_pricing
        grounds:
          - calculations.deliverable_billing
          - calculations.deliverable_billing.constants.VOLUME_BRACKETS
          - validations[priority 49]
        distinguishing_aspect: "A BASIC client with 11 surcharged cells lands on gross_cents EXACTLY 80000, the lower edge of the middle bracket, so both bracket lookups jump together (0.00 -> 0.10 and 0.000 -> 0.015) and the one-day lateness is priced off the gross rather than the discounted figure. It is also the only tier whose custom_analysis_quota is 0."
        test_recipe:
          setup:
            - "CHAIN C complete, with CODE DMA-663, RANK 163, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002073, LABEL RS-C60, opened by stat-opener-63 and published by stat-publisher-63, so a PUBLISHED run exists and the clock reads 2026-08-11T00:00:00Z."
            - "A BASIC client contracted to DMA-663: tier_base_fee_cents 25000, delivery_sla_hours 168, custom_analysis_quota 0."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: ClientServiceRep
              captures: { run63_id: "$.data[0].id", m63_id: "$.data[0].market_id" }
            - call: "POST /clients"
              payload: { name: "Lakeshore Radio Group", tier: "BASIC", contract_market_ids: ["${m63_id}"] }
              as: ClientServiceRep
              captures: { cl63_id: "$.data.id" }
          trigger:
            - call: "POST /clients/${cl63_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run63_id}", requested_cell_count: 11 }
              as: ClientServiceRep
              captures: { d63_id: "$.data.id", d63_due: "$.data.due_at" }
            - call: "POST /client-deliverables"
              payload: { client_id: "${cl63_id}", processing_run_id: "${run63_id}", question: "Can we have a custom cut?", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { e63: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T00:00:00Z" }
              as: ClientServiceRep
            - call: "POST /client-deliverables/${d63_id}/dispatch"
              payload: {}
              as: ClientServiceRep
            - call: "GET /clients/${cl63_id}"
              payload: {}
              as: ClientServiceRep
          assert:
            - "Trigger call 1: HTTP 201 with ${d63_due} == 2026-08-18T00:00:00Z - the pinned run is already PUBLISHED, so due_at is stamped immediately at the 2026-08-11T00:00:00Z clock plus the BASIC tier's 168 SLA hours - and data.kind == SCHEDULED_DATASET, data.state == SCHEDULED, data.question == null, data.gross_cents == 0 and data.total_cents == 0 (a scheduled row starts at zero, not null)"
            - "Trigger call 2: HTTP 409 with ${e63} == ERR_CUSTOM_ANALYSIS_QUOTA_EXCEEDED (priority 49) - custom_analysis_used 0 is NOT strictly less than a quota of 0, so a BASIC client can never file one"
            - "Trigger call 4: gross_cents == 25000 + 11 * 5000 == 80000 EXACTLY, so volume_pct == 0.10 (the >= 80000 edge, not 0.00) and data.discount_cents == 8000"
            - "Trigger call 4: data.days_late == ceil((2026-08-19 - 2026-08-18) / 86400) == 1 and penalty_rate == 0.015 keyed on the GROSS 80000, so data.late_penalty_cents == round_half_up(80000 * 0.015 * 1, 0) == 1200 - keying it on the net 72000 would have landed in the 0.000 bracket and produced 0"
            - "Trigger call 4: data.total_cents == max(0, 80000 - 8000 - 1200) == 70800, data.state == DELIVERED and data.findings_summary == null"
            - "Trigger call 5: data.custom_analysis_used == 0 - the rejected request never incremented the counter"

      - name: impact_tier_boundary_at_five_hundredths_and_the_subscore_cap
        claim_type: weighted_scoring
        grounds:
          - calculations.methodology_impact_delta
          - calculations.methodology_impact_delta.constants.NOTIFICATION_LEAD_HOURS
        distinguishing_aspect: "Three changes against ONE published baseline walk the tier ladder from both sides: an ascription move of 12 minutes lands on impact_delta_pct exactly 0.0500 (MODERATE, the >= edge) while 11 minutes gives 0.0458 (MINOR), and a cap move of 7.5 shows the sub-score being clamped at 1.0 BEFORE weighting, so one dimension can contribute at most its own weight of 0.4000."
        test_recipe:
          setup:
            - "CHAIN C complete, with CODE DMA-664, RANK 164, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002074, LABEL RS-C61, opened by stat-opener-64 and published by stat-publisher-64. RS-C61 is the currently PUBLISHED rule set {ascription 60, invalid_tuning_max_minutes 900, outlier_household_minutes_cap 1200, outlier_weight_ratio_cap 2.5, fault_missing_minutes_threshold 1440} and the PUBLISHED run projected 24306 households. The clock reads 2026-08-11T00:00:00Z."
            - "Three DRAFT proposals, each differing from RS-C61 in exactly ONE dimension: RS-C62 ascription 72, RS-C63 ascription 71, RS-C64 outlier_weight_ratio_cap 10.0."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: GovernanceDirector
              captures: { run64_id: "$.data[0].id", m64_id: "$.data[0].market_id", rs64_id: "$.data[0].edit_rule_set_id" }
