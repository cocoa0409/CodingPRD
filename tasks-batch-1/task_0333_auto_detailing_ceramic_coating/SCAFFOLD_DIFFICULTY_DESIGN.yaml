              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "CERAMIC", vehicle_size: "SEDAN", location_mode: "SHOP", scheduled_start_utc: "2026-06-15T08:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt1: $.data.id, bay_v2: $.data.version }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "CERAMIC", vehicle_size: "SEDAN", location_mode: "SHOP", scheduled_start_utc: "2026-06-16T12:44:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_BAY_TIME_CONFLICT"
            - "response.http_status == 409"

      - name: mobile_unit_travel_buffer_overlap_rejected_gap_below_buffer
        grounds:
          - calculations.mobile_overlap_check
          - validations[priority=12]
          - entities.MobileUnit.fields.travel_buffer_minutes
        distinguishing_aspect: >
          MobileUnit interval semantics expand each interval by a 30-minute TRAVEL BUFFER (DIFFERENT
          arithmetic from the bay's no-buffer half-open rule, on a DIFFERENT resource entity): a FULL
          booking starting 29 minutes after the first's occupancy_end (gap 29 < 30) is rejected
          ERR_MOBILE_BUFFER_CONFLICT, whereas a 30-minute gap would be allowed.
        test_recipe:
          setup:
            - "Mobile unit M5 (buffer 30) holds a FULL appointment 2026-06-16T09:00..11:20 (occupancy 140 min)."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "yas@x.com", full_name: "Yas D" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "M5", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-16T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-16T11:49:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_MOBILE_BUFFER_CONFLICT"
            - "response.http_status == 409"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_preserves_payment_cash_conservation_cents
        grounds:
          - state_machines.Appointment.PAID_to_REFUNDED
          - calculations.payment_ledger
          - entities.Appointment.fields.amount_charged_cents
          - entities.Appointment.fields.amount_refunded_cents
          - entities.Appointment.fields.outstanding_balance_cents
        distinguishing_aspect: >
          Conserved quantity #1 = cents (payment): pay (forward) then refund (compensating) MUST leave
          amount_charged_cents - amount_refunded_cents + outstanding_balance_cents == final_total_cents -
          credit_applied_cents; for a paid FULL/SEDAN (12000) this is 12000 - 12000 + 12000 == 12000, zero drift.
        test_recipe:
          setup:
            - "FULL/SEDAN MOBILE appointment driven to READY then fully PAID (amount_charged 12000)."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "zoe@x.com", full_name: "Zoe E" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "M6", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /detailing/appointments/${appt_id}/check-in"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "BEFORE", image_url: "s3://b.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-prep"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "AFTER", image_url: "s3://a.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/finish-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/pay"
              payload: { amount_cents: 12000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /detailing/appointments/${appt_id}/release"
              payload: {}
              as: Detailer
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/refund"
              payload: {}
              as: ShopManager
          assert:
            - "Appointment.${appt_id}.payment_status == REFUNDED"
            - "Appointment.${appt_id}.amount_charged_cents == 12000"
            - "Appointment.${appt_id}.amount_refunded_cents == 12000"
            - "Appointment.${appt_id}.outstanding_balance_cents == 12000"

      - name: membership_cancel_preserves_credit_count_conservation
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - calculations.membership_credit_ledger
          - entities.Membership.fields.credits_granted_total
          - entities.Membership.fields.credits_expired_total
          - entities.Membership.fields.credits_remaining
        distinguishing_aspect: >
          Conserved quantity #2 = credit COUNT (a DIFFERENT type of conserved quantity from cents):
          activate (forward, grants 1) then cancel (compensating, expires the unused credit) MUST leave
          credits_granted_total == credits_consumed_total + credits_expired_total + credits_remaining,
          i.e. 1 == 0 + 1 + 0 with credits_remaining driven to 0, no drift.
        test_recipe:
          setup:
            - "Customer ACTIVE membership with 1 unconsumed credit (granted 1, remaining 1)."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "WASH", base_price_cents: 4000, prep_minutes: 10, service_minutes: 30, cure_minutes: 0, guarantee_days: 0 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "abe@x.com", full_name: "Abe F" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/memberships"
              payload: { customer_id: "${cust_id}", default_vehicle_size: "SEDAN" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /detailing/memberships/${mem_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mem_v: $.data.version }
          trigger:
            - call: "POST /detailing/memberships/${mem_id}/cancel"
              payload: { expected_membership_version: "${mem_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Membership.${mem_id}.status == CANCELLED"
            - "Membership.${mem_id}.credits_granted_total == 1"
            - "Membership.${mem_id}.credits_expired_total == 1"
            - "Membership.${mem_id}.credits_remaining == 0"
            - "Customer.${cust_id}.membership_id == null"
