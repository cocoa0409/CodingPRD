# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per §1.7" }

  # --- not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path validated left-to-right)" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or enum value not in declared set" }
  - { id: ERR_INCOMPLETE_PACKAGE, http: 422, condition: "submittal_package is empty or missing required document keys" }

  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition is declared" }
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "Parent project must be ACTIVE" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Parent application must be APPROVED" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity already in a terminal state; no further transitions" }

  # --- temporal ---
  - { id: ERR_TEMPORAL_WINDOW_VIOLATION, http: 422, condition: "Generic temporal window violation" }
  - { id: ERR_INSUFFICIENT_NOTICE, http: 422, condition: "hearing_date - notice_posted_date < NOTICE_LEAD_DAYS (20)" }
  - { id: ERR_HEARING_NOT_YET, http: 422, condition: "Cannot mark hearing HELD before hearing_date" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal filed_at >= appeal_deadline" }
  - { id: ERR_REFERENDUM_WINDOW_CLOSED, http: 422, condition: "Petition filed_at >= referendum_deadline" }
  - { id: ERR_DECISION_DEADLINE_PASSED, http: 422, condition: "Decision rendered after decision_due_date (PERMIT_STREAMLINING_DAYS=90)" }
  - { id: ERR_VESTING_LAPSED, http: 422, condition: "Vested schedule requested after vesting_expires_at" }

  # --- referential ---
  - { id: ERR_REFERENTIAL_VIOLATION, http: 422, condition: "Generic cross-entity referential violation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "decided_by equals a StaffReviewer.id who authored a ReviewComment on this application" }
  - { id: ERR_DISCIPLINE_MISMATCH, http: 422, condition: "Reviewer.disciplines does not include comment.discipline" }
  - { id: ERR_REVISION_MISMATCH, http: 422, condition: "revises_comment_id targets a different application or discipline" }
  - { id: ERR_NOT_PROJECT_OWNER, http: 403, condition: "X-User-ID does not match project.applicant_id for an ownership-scoped operation" }

  # --- constraint / aggregate ---
  - { id: ERR_CONSTRAINT_VIOLATION, http: 409, condition: "Generic aggregate/structural constraint violation" }
  - { id: ERR_BLOCKING_COMMENTS_OPEN, http: 409, condition: "One or more BLOCKING ReviewComment still OPEN (or ADDRESSED-not-VERIFIED) at advance/decision" }
  - { id: ERR_HEARING_REQUIRED, http: 409, condition: "opposition_posture == HIGH requires a HELD hearing before decision" }
  - { id: ERR_HEARING_PENDING, http: 409, condition: "A SCHEDULED hearing exists; must be HELD or CANCELLED first" }
  - { id: ERR_SEQUENCE_VIOLATION, http: 409, condition: "Lower sequence_rank permit not yet ISSUED" }
  - { id: ERR_CONDITIONS_PENDING, http: 409, condition: "PERMIT_ISSUANCE condition still PENDING" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 409, condition: "EntitlementDecision not FINAL (appeal pending or window open)" }
  - { id: ERR_PERMIT_ALREADY_ISSUED, http: 409, condition: "Cannot defer fees: a permit has already been issued" }
  - { id: ERR_INSUFFICIENT_SIGNATURES, http: 422, condition: "valid_signature_count < required_signature_count at certify" }

  # --- fiscal ---
  - { id: ERR_FEES_UNPAID, http: 402, condition: "FINAL assessment neither PAID nor DEFERRED at permit issuance (or OCCUPANCY requested while DEFERRED-unpaid)" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 402, condition: "Payment amount > outstanding balance on assessment" }
  - { id: ERR_NO_ADOPTED_FEE_SCHEDULE, http: 422, condition: "No ADOPTED FeeSchedule exists at submit time" }

  # --- concurrency (OCC) ---
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match current project version" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match current application version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; registers reference data (fee schedules, reviewers, authorities, applicants) and drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /entitlement/_clock/set_current_utc"
      - "POST /entitlement/fee-schedules (+adopt)"
      - "POST /entitlement/staff-reviewers"
      - "POST /entitlement/decision-authorities"
      - "POST /entitlement/applicants"
    shared_operations:
      - "GET on all resources"
      - "POST /entitlement/projects (may create on behalf of an applicant)"
      - "POST referendum-petitions / appeals (may file on behalf of any party)"

  - name: Applicant
    description: "Developer entity; owns projects via applicant_id and acts on its own applications"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /entitlement/applications (create application for own project)"
      - "POST submit / withdraw on own applications"
      - "POST review-comments/{id}/address"
      - "POST conditions/{id}/satisfy"
      - "POST assessments/{id}/payments and /defer"
      - "POST permit-sequences (request)"
    shared_operations:
      - "GET on own resources (and reference data)"
      - "POST outreach-events"
      - "POST referendum-petitions / appeals"

  - name: StaffReviewer
    description: "Planning staff; conducts review, schedules hearings, issues permits"
    identity: "entity_backed:StaffReviewer"
    exclusive_operations:
      - "POST open-review / advance-to-decision"
      - "POST review-comments (author)"
      - "POST review-comments/{id}/verify and /waive (own comments only)"
      - "POST hearings create/mark-held/continue/renotice/cancel"
      - "POST permit-sequences/{id}/issue"
    shared_operations:
      - "GET on all resources"
      - "POST outreach-events"

  - name: DecisionAuthority
    description: "Planning commission / city council / staff director; renders decisions, adopts DAs, resolves appeals and referenda"
    identity: "entity_backed:DecisionAuthority"
    exclusive_operations:
      - "POST decisions (render)"
      - "POST development-agreements (+adopt, finalize-vesting)"
      - "POST referendum-petitions/{id}/certify"
      - "POST appeals/{id}/resolve"
      - "POST conditions create and /waive"
    shared_operations:
      - "GET on all resources"
