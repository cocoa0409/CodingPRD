  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: job_start_gated_on_resin_lot_status
        grounds:
          - state_machines.ProductionJob.SCHEDULED_to_RUNNING
          - state_machines.ResinLot.RELEASED_to_HOLD
          - state_machines.ResinLot.HOLD_to_RELEASED
          - errors[ERR_RESIN_LOT_NOT_RELEASED]
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair one: ProductionJob -> ResinLot. The job's SCHEDULED -> RUNNING transition
          is legal or illegal purely because of a sibling ResinLot's status, with no change to
          the job itself: HOLD blocks the start with ERR_RESIN_LOT_NOT_RELEASED, and putting
          the same lot back to RELEASED lets the identical call succeed.
        test_recipe:
          setup:
            - "Mold M-1 PPAP_APPROVED on press P-150; job SCHEDULED for 2026-09-10T08:00Z-16:00Z and STAGED against ResinLot L-77."
            - "L-77 has been moved RELEASED -> HOLD, so the job is materially staged but not startable."
