              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /title-approvals/${ta_id}/decision"
              payload: { action: "APPROVE" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /seasons/${se_id}/advance"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: LeagueAdmin
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Avery Ash", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_a_id: $.data.id, st_a_v0: $.data.version }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Blake Birch", birthdate: "2009-06-15", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_b_id: $.data.id, st_b_v0: $.data.version }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Casey Cedar", birthdate: "2009-07-20", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { st_c_id: $.data.id, st_c_v0: $.data.version }
            - call: "POST /students/${st_a_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 3.100, term_credits: 6, expected_student_version: "${st_a_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /students/${st_b_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 3.100, term_credits: 6, expected_student_version: "${st_b_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /students/${st_c_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 3.100, term_credits: 6, expected_student_version: "${st_c_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
