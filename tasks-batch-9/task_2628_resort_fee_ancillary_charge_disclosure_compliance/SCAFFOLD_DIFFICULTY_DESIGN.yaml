            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY27-Q1-OVERLAP", effective_from: "2026-11-30T23:59:59Z", effective_to: "2027-03-01T00:00:00Z", expected_property_version: "${p1_v2}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp2: $.data.id }
            - call: "POST /fee-programs/${fp2}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 800, disclosure_text: "Resort fee of 8% of the nightly room rate." }
              as: RevenueManager
