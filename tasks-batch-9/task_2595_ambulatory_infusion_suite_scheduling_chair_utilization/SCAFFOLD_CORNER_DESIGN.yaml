        grounds:
          - state_machines[Appointment/schedule_status].initial_state
          - state_machines[Appointment/readiness_status].initial_state
          - state_machines[AuthorizationRequest].initial_state
          - state_machines[DrugPreparation].initial_state
          - state_machines[DrugLot].initial_state
          - state_machines[TreatmentPlan].initial_state
        distinguishing_aspect: |
          A single fixture proves all six declared initial states at once — Appointment
          TENTATIVE + PENDING, AuthorizationRequest DRAFT with submission_count 0,
          DrugPreparation REQUESTED, DrugLot AVAILABLE, TreatmentPlan ACTIVE with
          completed_cycles 0 and first_dose_completed false — and none of them can be
          chosen by the caller because no creation endpoint accepts a status input.
        test_recipe:
          setup:
