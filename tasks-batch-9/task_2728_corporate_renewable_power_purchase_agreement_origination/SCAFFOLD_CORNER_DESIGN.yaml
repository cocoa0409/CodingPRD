          rationale: "The named §1.8 instance asserts CP_CURE_DAYS on the FAIL leg, the re-cure deadline on the way back to PENDING, and the CP_WAIVER_EXTENSION_DAYS extension of commercial_operation_deadline on the WAIVE fork."

  - section: validations
    instances:
      - name: deal_not_found_precedes_state_gate_which_precedes_offtaker_qualification
        claim_type: priority_ordering
        grounds:
          - validations.priority_4_ERR_<ENTITY>_NOT_FOUND
          - validations.priority_8_ERR_INVALID_STATE_TRANSITION
          - validations.priority_11_ERR_OFFTAKER_NOT_QUALIFIED
          - endpoints.POST_/ppa/deals/{id}/execute
        distinguishing_aspect: |
          Three rules are violated by the same endpoint and the ladder must be walked
          top down. An unknown deal id is a 404 even though the caller also fails every
          business rule underneath. A DRAFT deal whose anchor buyer has fallen back to
          UNDER_REVIEW violates both the state gate (priority 8) and the qualification
          gate (priority 11) at once, and must answer 409 ERR_INVALID_STATE_TRANSITION,
          not 422 ERR_OFFTAKER_NOT_QUALIFIED - the buyer's state is only consulted once
          the deal itself is in a signable state.
        test_recipe:
          setup:
            - "A buyer decided CONDITIONAL (credit_score 72.60 STANDARD, sustainability_score 50.00, one stored condition), which is enough to structure a deal but never enough to sign one."
            - "A DRAFT deal on that buyer, after which the buyer is re-submitted for qualification so it sits back in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Midmarket Bottling Co", credit_rating: "BBB", rating_agency: "SP", reported_ebitda_usd: 40000000.00, net_debt_to_ebitda: 3.0, disclosure_framework: "TCFD_ONLY", has_science_based_target: true, re100_member: false }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "CONDITIONAL", conditions: ["parent guarantee delivered before notice to proceed"] }
              as: CreditOfficer
