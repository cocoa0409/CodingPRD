            - call: "POST /funding-programs"
              payload: { fiscal_year: 2051, apportionment_cents: 1000000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_a}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 300000 }
              as: RailSafetyOfficer
              captures: { pj_a: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_b}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 200000 }
              as: RailSafetyOfficer
              captures: { pj_b: $.data.id }
            - call: "POST /upgrade-projects/${pj_a}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${pj_b}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /upgrade-projects/${pj_a}/award"
              payload: { expected_funding_program_version: "${prog_v}" }
              as: ProgramAdministrator
              captures: { a_ok: $.data.awarded_cents }
            - call: "POST /upgrade-projects/${pj_b}/award"
              payload: { expected_funding_program_version: "${prog_v}" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "first award succeeds: awarded_cents == 300000 (program version advanced to ${prog_v} + 1)"
            - "second award with the stale ${prog_v}: error_id == ERR_STALE_VERSION (http 412); project B stays ELIGIBLE"

      - name: cascade_layers_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.IncidentReport.DESK_REVIEW_to_FINDINGS_ISSUED, state_machines.Crossing.CLOSURE_PENDING_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / incident_findings_cascade_to_program_demand
          rationale: "Both cascades (depth 3 each) are asserted link-by-link there and in crossing_closure_cascade_suspends_quiet_zone."

      - name: rate_threshold_layers_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [calculations.exposure_index, calculations.fra_reportable]
        excluded_because:
          difficulty_instance: boundary_precision_check / exposure_threshold_exact_vs_below
          rationale: "Exposure threshold covered there; FRA damage threshold covered by fra_reportability_threshold in this file."

      - name: version_pinning_layer_covered_by_difficulty
        claim_type: derived_field_reconciliation
        grounds: [entities.UpgradeProject.fields.priority_score, entities.UpgradeProject.fields.score_stale]
        excluded_because:
          difficulty_instance: transitive_cascade / incident_findings_cascade_to_program_demand
          rationale: "Pinned priority_score surviving while score_stale flips true is asserted there."

  - section: consistency_model
    instances:
      - name: award_effects_immediately_visible
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: compensating_invariant / award_rescind_restores_pool
          rationale: "The GET reads immediately after award and rescind in that recipe prove same-request visibility of every side effect (immediate consistency)."
