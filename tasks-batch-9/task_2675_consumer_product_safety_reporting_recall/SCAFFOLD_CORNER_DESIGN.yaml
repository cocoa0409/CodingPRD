            - "Incident.${inc_id}.status == CLASSIFIED"
            - "Incident.${inc_id}.classified_at == 2026-03-05T12:00:00Z (the logical clock at classify time, not at intake)"
            - "Incident.${inc_id}.severity_weight == 30.00"
            - "Incident.${inc_id}.version == 2 (was ${inc_v1})"
            - "Incident.${inc_id}.hazard_pattern_id remains null — classification does not cluster"

      - name: adjudicating_confirmed_requires_the_stored_confirmability_flag
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[HazardPattern].transitions[ANALYZED -> CONFIRMED]
          - validations[17]
          - errors.ERR_PATTERN_NOT_CONFIRMABLE
        distinguishing_aspect: |
          The gate is the STORED pattern_confirmed flag computed at analysis time,
          not a fresh count taken during adjudication. The fixture gives the
          pattern only TWO qualifying incidents so MIN_INCIDENT_COUNT 3 fails while
          concentration (1.0000) and risk index both pass — proving the three-part
          conjunction is evaluated in full rather than short-circuited on the
          risk index alone.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel with exactly TWO classified verified BURN incidents inside the analysis window"
          setup_api_calls:
