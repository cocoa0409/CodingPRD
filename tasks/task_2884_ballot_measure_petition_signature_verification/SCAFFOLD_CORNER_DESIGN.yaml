# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design  (breadth probe)
#
# One walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. Nine sections, in the guide's order:
#   entities / state_machines / calculations / validations / endpoints /
#   errors / rbac / complexity_layers / consistency_model
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as
# `excluded_because:` stubs naming the covering instance; they carry no
# test_recipe. Every one of the 67 codes in §1.6 is triggered by at least one
# claim here or in §1.8 - the code -> claim map is the comment block at the
# end of this file.
#
# Fixture conventions shared by every recipe below:
#   * X-User-IDs: SosAdmin "admin-1", ElectionsExaminer "exam-1"/"exam-2",
#     TitleExaminer "title-1", Proponent "prop-1"/"prop-2",
#     Challenger "chal-1"/"chal-2"; CountyClerk carries a County.id and
#     CirculatorAgent carries a Circulator.id, so both are always `${...}`.
#   * The logical clock is set explicitly before any call whose result depends
#     on it; every server-stamped instant in an assert is written at
#     millisecond precision (2026-08-01T00:00:00.000Z).
#   * Negative probes capture `$.data.error_id` so the expected code, not just
#     the status, is the observable.
# ---------------------------------------------------------------------------

scaffold_corner_design:

  # =========================================================================
  # Table 1 - Entities (12 entities; topology `flat`)
  # =========================================================================
  - section: entities
    instances:

      - name: configuration_entities_create_read_round_trip_without_version
        claim_type: creation
        grounds:
          - entities.VerificationStandard
          - entities.County
          - entities.VoterRecord
          - endpoints[POST /verification-standards]
          - endpoints[GET /verification-standards/{standard_id}]
          - endpoints[GET /counties/{county_id}]
          - endpoints[GET /voter-records/{voter_record_id}]
        distinguishing_aspect: |
          Covers claim rows Creation, Retrieval and Immutability for the three
          `common_fields: false` configuration entities at once: every declared input is
          echoed back unchanged by the GET, `id` and `created_at` are server-minted from
          the logical clock, and NO `version` or `updated_at` field appears - these three
          entities have no update endpoint at all except the single narrow
          PUT /voter-records/{id}/registration-status. An implementation that copies the
          common-field block onto every entity is falsified by the version assert.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z so created_at is a literal."
            - "One standard (SOS-A), one county (ALPHA), one voter record (VA1) - no petition, circulator or batch is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-A", gubernatorial_vote_total: 12345, signature_pct_bps: 375, sample_pct_bps: 5000, sample_min_count: 2, sufficiency_upper_bps: 12000, sufficiency_lower_bps: 6000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250, cure_allowed: true, cure_window_days: 30, cure_eligibility_floor_bps: 8000, circulation_window_days: 180 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { vr1_id: $.data.id }
          trigger:
            - call: "GET /verification-standards/${std_id}"
              payload: {}
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { got_vote_total: $.data.gubernatorial_vote_total, got_mode: $.data.stratification_mode }
            - call: "GET /counties/${alpha_id}"
              payload: {}
              as: CountyClerk
              as_user_id: "${alpha_id}"
              captures: { got_rvc: $.data.registered_voter_count }
            - call: "GET /voter-records/${vr1_id}"
              payload: {}
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { got_status: $.data.registration_status, got_created: $.data.created_at }
          assert:
            - "GET /verification-standards/${std_id} returns 200 with ${got_vote_total} == 12345, ${got_mode} == POOLED, signature_pct_bps == 375, sample_min_count == 2, county_surcharge_bps == 250 - every one of the 16 declared inputs echoed unchanged"
            - "${got_rvc} == 20 and County.${alpha_id}.county_code == ALPHA and name == \"Alpha County\""
            - "${got_status} == ACTIVE and VoterRecord.${vr1_id}.voter_id_number == VA1 and county_id == ${alpha_id}"
            - "${got_created} == 2026-08-01T00:00:00.000Z on all three entities - created_at is the logical clock, not wall time"
            - "None of the three GET bodies carries a `version` or an `updated_at` field (common_fields: false)"
            - "response_type == \"object\" and meta.api_request_id is present on every one of the three responses"

      - name: declared_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.VerificationStandard.cure_allowed
          - entities.VerificationStandard.cure_window_days
          - entities.VerificationStandard.cure_eligibility_floor_bps
          - entities.VerificationStandard.circulation_window_days
          - entities.Petition.status
          - entities.Circulator.is_paid
          - entities.Circulator.paid_disclosure_on_file
        distinguishing_aspect: |
          Only the required inputs are sent on all three creates, so every field with a
          declared `default:` must materialise from the scaffold, not from the request:
          the standard's four optional knobs (true / 30 / 8000 / 180), the petition's
          fifteen zero-or-null system and computed fields, and the circulator's
          is_paid false with paid_disclosure_on_file true (an unpaid circulator needs no
          disclosure). An implementation that treats paid_disclosure_on_file as false by
          default would block every unpaid affidavit, which this assert catches at create
          time rather than three calls later.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z."
            - "The standard create omits cure_allowed, cure_window_days, cure_eligibility_floor_bps and circulation_window_days; the circulator create omits is_paid and employer_name."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-D", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id, d_cure: $.data.cure_allowed, d_window: $.data.cure_window_days, d_floor: $.data.cure_eligibility_floor_bps, d_circ: $.data.circulation_window_days }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Default Committee", submitted_title: "Default Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id, p_status: $.data.status, p_chal: $.data.challenge_status, p_round: $.data.format_review_round, p_req: $.data.required_valid_signatures, p_v: $.data.version }
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_id: $.data.id, c_paid: $.data.is_paid, c_disc: $.data.paid_disclosure_on_file, c_reg: $.data.registration_status, c_score: $.data.credibility_score_bps }
          assert:
            - "${d_cure} == true, ${d_window} == 30, ${d_floor} == 8000, ${d_circ} == 180 - the four declared standard defaults"
            - "${p_status} == DRAFT, ${p_chal} == NONE, ${p_round} == 0, ${p_req} == 0, ${p_v} == 1"
            - "Petition.${pet_id}.official_title is null, official_summary is null, cleared_at is null, circulation_deadline is null"
            - "Petition.${pet_id}.raw_signature_count == 0, accepted_raw_total == 0, projected_valid_count == 0, verified_valid_count == 0, qualifying_county_count == 0, verification_cost_accrued_cents == 0, voided_signature_count == 0, cure_period_count == 0"
            - "Petition.${pet_id}.proponent_user_id == prop-1 - taken from X-User-ID, never from the body"
            - "${c_paid} == false, ${c_disc} == true, ${c_reg} == PENDING_TRAINING, ${c_score} == 10000, misconduct_strike_count == 0, employer_name is null, disclosure_document_id is null, training_course_code is null"

      - name: petition_create_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Petition.status
          - entities.Petition.proponent_user_id
          - entities.Petition.required_valid_signatures
          - endpoints[POST /petitions]
        distinguishing_aspect: |
          The create body carries `id`, `created_at`, `version`, `status`,
          `proponent_user_id` and `required_valid_signatures` - six fields whose
          `source:` is system or computed and which POST /petitions does not declare in
          `input:`. Each must be ignored, not honoured and not 400'd into oblivion:
          the server mints its own id, stamps created_at from the clock, starts at DRAFT
          version 1 and leaves required_valid_signatures at 0 until clearance freezes the
          formula. An implementation that spreads the request body over the model returns
          status CERTIFIED and required_valid_signatures 999, which the asserts falsify.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z, one standard SOS-S."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-S", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Spoof Committee", submitted_title: "Spoof Measure", measure_subject_codes: ["HEALTH"], id: "pet-forced", created_at: "1999-01-01T00:00:00Z", version: 9, status: "CERTIFIED", proponent_user_id: "prop-9", required_valid_signatures: 999 }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id, s_status: $.data.status, s_v: $.data.version, s_req: $.data.required_valid_signatures, s_owner: $.data.proponent_user_id, s_created: $.data.created_at }
          assert:
            - "201 - the six unknown/system keys are ignored, not rejected"
            - "${pet_id} != \"pet-forced\" and ${s_created} == 2026-08-01T00:00:00.000Z"
            - "${s_status} == DRAFT, ${s_v} == 1, ${s_req} == 0"
            - "${s_owner} == prop-1 - the acting X-User-ID wins over the body's prop-9"

      - name: petition_listing_paginates_and_filters_with_stable_order
        claim_type: listing
        grounds:
          - endpoints[GET /petitions]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three petitions exist; the list endpoint is walked with limit 2 offset 0 and then
          limit 2 offset 2 and finally with a `status` filter. The distinguishing detail is
          that total_count stays 3 across both pages (it counts the filtered set, not the
          page), has_more flips true -> false, and the two pages partition the three rows
          with no repeat - a cursor computed from the page size rather than the offset
          returns p1/p2 twice.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z, one standard SOS-L."
            - "Three petitions created in order p1, p2, p3, all left in DRAFT; p3 alone is submitted so the status filter has one FORMAT_REVIEW row and two DRAFT rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-L", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "List Committee", submitted_title: "Measure One", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { p1_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "List Committee", submitted_title: "Measure Two", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { p2_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "List Committee", submitted_title: "Measure Three", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { p3_id: $.data.id }
            - call: "POST /petitions/${p3_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
          trigger:
            - call: "GET /petitions"
              payload: { limit: 2, offset: 0 }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { first_id: "$.data[0].id", second_id: "$.data[1].id" }
            - call: "GET /petitions"
              payload: { limit: 2, offset: 2 }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { third_id: "$.data[0].id" }
            - call: "GET /petitions"
              payload: { status: "FORMAT_REVIEW" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { filtered_id: "$.data[0].id", filtered_status: "$.data[0].status" }
          assert:
            - "Page 1: response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "{${first_id}, ${second_id}, ${third_id}} == {${p1_id}, ${p2_id}, ${p3_id}} - the two pages partition the three rows with no repeat"
            - "Filtered call: len(data) == 1, total_count == 1, has_more == false, ${filtered_id} == ${p3_id}, ${filtered_status} == FORMAT_REVIEW"

  # =========================================================================
  # Table 2 - State Machines (10 dimensions over 8 entities; shape `cyclic`)
  # =========================================================================
  - section: state_machines
    instances:

      - name: child_entities_start_in_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.SignatureBatch.initial_state
          - state_machines.SignatureRecord.initial_state
          - state_machines.CirculationAssignment.initial_state
          - endpoints[POST /signature-batches]
          - endpoints[POST /signature-batches/{batch_id}/signatures]
        distinguishing_aspect: |
          A freshly created batch is RECEIVED with raw_count 0 AND accepted_raw_count 0 -
          the two counts only diverge at affidavit verification, so an implementation that
          seeds accepted_raw_count from raw_count is caught on the very first line added
          (raw_count 1, accepted_raw_count still 0 while RECEIVED). The same call proves
          SignatureRecord starts PENDING with in_sample false and validated_in_round_id
          null, and CirculationAssignment starts ACTIVE.
        test_recipe:
          setup:
            - "Standard SOS-I, county ALPHA, petition cleared at 2026-08-01T00:00:00Z, circulator REGISTERED, assignment over ALPHA."
            - "The clock is moved to 2026-08-10T00:00:00Z before the batch is filed so filed_at is a literal distinct from created_at of the petition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-I", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Initial Committee", submitted_title: "Initial Measure", measure_subject_codes: ["ELECTIONS"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_v: $.data.version }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "Initial Elections Act", official_summary: "Sets filing windows.", expected_petition_version: "${pet_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
            - call: "POST /petitions/${pet_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_id: $.data.id }
            - call: "POST /circulators/${circ_id}/training"
              payload: { training_course_code: "SOS-CIRC-101" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators/${circ_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_id}", circulator_id: "${circ_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", assigned_county_codes: ["ALPHA"], expected_circulator_version: "${circ_v}" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { a1_id: $.data.id, a1_status: $.data.status, a1_ack: $.data.paid_disclosure_ack }
            - call: "POST /signature-batches"
              payload: { petition_id: "${pet_id}", circulator_id: "${circ_id}", county_id: "${alpha_id}", affidavit_signed: true }
              as: Proponent
              as_user_id: "prop-1"
              captures: { b1_id: $.data.id, b1_status: $.data.status, b1_raw: $.data.raw_count, b1_acc: $.data.accepted_raw_count, b1_filed: $.data.filed_at, b1_supp: $.data.is_supplemental }
            - call: "POST /signature-batches/${b1_id}/signatures"
              payload: { line_number: 1, signer_name: "Ada Adams", claimed_voter_id_number: "VA1", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VA1" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { l1_id: $.data.id, l1_status: $.data.validation_status, l1_sample: $.data.in_sample }
          assert:
            - "${a1_status} == ACTIVE and ${a1_ack} == false"
            - "${b1_status} == RECEIVED, ${b1_raw} == 0, ${b1_acc} == 0, ${b1_supp} == false, cure_period_id is null, affidavit_notary_id is null, format_defect_count == 0, checked_signature_count == 0, verification_cost_cents == 0"
            - "${b1_filed} == 2026-08-10T00:00:00.000Z - stamped from the logical clock, not from the petition's cleared_at"
            - "${l1_status} == PENDING, ${l1_sample} == false, validated_in_round_id is null, matched_voter_record_id is null, duplicate_of_signature_id is null, manual_match_override_applied == false"
            - "After the line is added SignatureBatch.${b1_id}.raw_count == 1 while accepted_raw_count is still 0 and status is still RECEIVED"
            - "Petition.${pet_id}.raw_signature_count == 1 and accepted_raw_total == 0 - a RECEIVED batch feeds the raw leg only"

      - name: signature_validation_produces_each_declared_invalid_reason
        claim_type: valid_transition
        grounds:
          - state_machines.SignatureRecord.PENDING_to_VALID
          - state_machines.SignatureRecord.PENDING_to_INVALID_NOT_REGISTERED
          - state_machines.SignatureRecord.PENDING_to_INVALID_WRONG_COUNTY
          - state_machines.SignatureRecord.PENDING_to_INVALID_SIGNATURE_MISMATCH
          - calculations.circulator_credibility_score
          - endpoints[POST /signature-records/{signature_record_id}/validate]
        distinguishing_aspect: |
          One census round examines five lines engineered so that each of the four
          non-duplicate outcomes of the per-line check cascade fires exactly once, plus one
          line that would mismatch but is accepted under manual_match_override. The cascade
          ORDER is what is falsified: line 3 claims a voter who is ACTIVE but registered in
          BRAVO while the batch was filed in ALPHA, so it must report INVALID_WRONG_COUNTY
          and not INVALID_SIGNATURE_MISMATCH even though its hash also matches; line 4
          claims an unknown id and must report INVALID_NOT_REGISTERED with
          matched_voter_record_id left null. The provisional credibility recompute
          (7000 bps) is the aggregate observable of the same five outcomes.
        test_recipe:
          setup:
            - "Standard SOS-V with sample_pct_bps 10000 and sample_min_count 1, so the RANDOM_SAMPLE draw is a census of the five-line pool."
            - "Counties ALPHA (registered_voter_count 20) and BRAVO (40). Voters VA1 / VA2 / VA3 ACTIVE in ALPHA, VB1 ACTIVE in BRAVO; no record exists for VX9."
            - "Batch b1 is filed in ALPHA and carries five lines: VA1 with the matching hash, VA2 with a wrong hash, VB1 with the matching hash, VX9 with any hash, VA3 with a wrong hash."
            - "The petition reaches SAMPLE_VERIFICATION with round r1 selecting all five lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
