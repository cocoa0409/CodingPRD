            - "${err_damage} == ERR_DAMAGE_FEE_EXCEEDS_REPLACEMENT with HTTP 422"
            - "${custody_mid} == RETURN_PREPARED, ${billing_mid} == NO_CHARGE, ${dmg_mid} == 0 and ${proc_mid} == 0 — the refused confirmation wrote nothing, not even the processing fee"
