      - name: republish_count_reset_conserves_month_bucket_invariant
        grounds:
          - calculations.compute_overage_cents
          - entities.Subscription.fields.republish_count_current_month
        distinguishing_aspect: |
          Conserved quantity: republish_count_current_month + historical monthly
          totals = total publication events for the subscription; advancing the
          clock into a new month zeroes the counter but preserves historical sum.
          Conserved quantity differs from instance 1 (credit balance).
        test_recipe:
          setup:
            - "Subscription ACTIVE with quota=2; 2 publications in 2026-05"
            - "Clock advances to 2026-06-01; new article published in June"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P14", display_name: "P14", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T14", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 2, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F14", topic: "SPORTS", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "R", billing_email: "r@r.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A1", body_word_count: 100, slug: "m1" }
              as: Editor
              captures: { a1: $.data.id }
            - call: "POST /wire/articles/${a1}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A2", body_word_count: 100, slug: "m2" }
              as: Editor
              captures: { a2: $.data.id }
            - call: "POST /wire/articles/${a2}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a1}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a2}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A3", body_word_count: 100, slug: "m3" }
              as: Editor
              captures: { a3: $.data.id }
            - call: "POST /wire/articles/${a3}/publish"
              payload: {}
              as: Editor
          trigger:
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a3}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { p3_within: $.data.within_quota, p3_billed: $.data.billed_amount_cents }
          assert:
