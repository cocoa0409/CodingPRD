              captures: { pF_samples: $.data.samples_counted }
          assert:
            - "${bgF1_points} == 6"
            - "${bgF2_points} == 6"
            - "${bgF2_decided} == 2026-08-01T00:00:00Z"
            - "${pF_points} == 12"
            - "${pF_status} == SUSPENDED"
            - "Participant.${pF_id}.suspension_reason == AUTOMATIC_SANCTION_THRESHOLD"
            - "${feedF_status} == SUSPENDED"
            - "${feedF_reason} == PARTICIPANT_SUSPENSION_CASCADE"
            - "${pF_samples} == 0"
            - "${pF_score} == null"
            - "${pF_grade} == UNGRADED"
            - "DataFeed.${feedF_id}.sample_count == 1 (the sample row itself is untouched; only the window membership changed)"
            - "BreakGlassAccess.${bgF2_id}.review_status == UNJUSTIFIED and BreakGlassAccess.${bgF2_id}.session_status == OPEN"
      - name: confirmed_match_link_cascades_cluster_merge_into_directive_supersession
