scenario: |
  Generate task harder than expert level!

  2503. Thesis and Dissertation Format Review & Deposit (university graduate school): committee
  composition approval and defense scheduling with announcement deadlines, format review cycles
  with revision turnaround before the deposit deadline, embargo request and duration approval for
  patentable or publishable content, copyright permission documentation for included third-party
  material, institutional repository deposit and metadata assignment, graduation clearance
  dependency on final acceptance, plagiarism screening and integrity referral, degree conferral
  posting and transcript notation

domain_name: thesis-format-review-deposit
api_prefix: /graduate-school

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # graph: Committee <-> FacultyMember is a many-to-many junction (CommitteeMember); every other
  # entity is a peer that references Thesis / Student / DefenseRoom by foreign key. Mutating URLs
  # are flat collections (`/graduate-school/theses`, `/graduate-school/embargo-requests`, ...);
  # nesting appears only on read-side reverse-reachability GETs.

  state_machine_shape: cyclic
  # Thesis.workflow_state carries a revision loop (UNDER_FORMAT_REVIEW -> FORMAT_REVISIONS_REQUIRED
  # -> UNDER_FORMAT_REVIEW), Thesis also carries a SECOND independent dimension
  # (integrity_state) on the same row, EmbargoRequest carries an information-request loop, and
  # DefenseEvent forks ANNOUNCED -> {HELD_PASS, HELD_PASS_WITH_REVISIONS, HELD_FAIL} with a
  # different side-effect set per branch.

  relationship_patterns:
    - one_to_many          # Thesis -> FormatReview / EmbargoRequest / PermissionRecord / IntegrityScreening
    - many_to_many         # Committee <-> FacultyMember via CommitteeMember
    - cross_aggregate      # RepositoryDeposit reads EmbargoRequest + Term; GraduationClearance reads Thesis

  role_model: segregation_of_duties
  # The analyst who signed the accepting FormatReview may not create the RepositoryDeposit, and
  # the dean who approved the Committee may not decide that thesis's EmbargoRequest.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 47 endpoints / 50 error codes / 15 calculations (2 dual-variant, 4 declared
  # variants) / 40 validations / 12 state machines (Thesis carries two independent dimensions),
  # three of which are non-linear on different entities.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Term
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Graduation term code"
        constraints: "unique across Term; matches ^[0-9]{4}(SP|SU|FA)$"
      - name: announcement_lead_business_days
        type: integer
        source: input
        description: "Minimum business days that must separate the announcement instant from the defense start"
        default: 10
        constraints: ">= 1"
      - name: defense_deadline
        type: datetime
        source: input
        description: "Latest DefenseEvent.scheduled_start allowed for theses in this term (inclusive)"
      - name: format_review_deposit_deadline
        type: datetime
        source: input
        description: "Base deposit deadline; grace business days from calculations.deposit_late_fee_cents are added on top of it"
      - name: degree_conferral_date
        type: datetime
        source: input
        description: "Anchor instant used by the conferral_anchored variant of calculations.embargo_release_date"
      - name: status
        type: enum
        source: system
        description: "Term lifecycle; also selects the GraduationClearance projection variant"
        default: OPEN
        constraints: "one of {OPEN, DEPOSIT_CLOSED, CONFERRED}"
      - name: conferred_count
        type: integer
        source: computed
        description: "Number of GraduationClearance rows reaching CONFERRED during this term's confer-degrees run"
        default: 0

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Degree candidate legal name"
      - name: email
        type: string
        source: input
        description: "Contact address"
        constraints: "unique across Student"
      - name: degree_level
        type: enum
        source: input
        description: "Drives committee composition minimums and embargo caps"
        constraints: "one of {MASTERS, DOCTORAL}"
      - name: program_code
        type: string
        source: input
        description: "Academic program owning the degree"
      - name: graduation_clearance_state
        type: enum
        source: computed
        description: "Mirror of this student's GraduationClearance.status, refreshed on every clearance recompute"
        default: BLOCKED
        constraints: "one of {BLOCKED, PENDING_ITEMS, CLEARED, CONFERRED, WITHHELD}"
      - name: degree_conferred
        type: boolean
        source: computed
        description: "True only after the student's GraduationClearance reaches CONFERRED"
        default: false
      - name: transcript_notation
        type: string
        source: computed
        description: "Notation posted to the transcript by the conferral or the integrity-withhold cascade; null until one of them fires"
        default: null

  - name: FacultyMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Faculty legal name"
      - name: email
        type: string
        source: input
        description: "Contact address"
        constraints: "unique across FacultyMember"
      - name: appointment_type
        type: enum
        source: input
        description: "Appointment class; only TENURED and TENURE_TRACK may chair"
        constraints: "one of {TENURED, TENURE_TRACK, ADJUNCT, EXTERNAL}"
      - name: graduate_faculty_certified
        type: boolean
        source: input
        description: "Graduate faculty certification flag; required to chair"
        default: false
      - name: active_chair_load
        type: integer
        source: computed
        description: "Output of calculations.faculty_active_chair_load; conserved quantity of the chair-load compensating invariant"
        default: 0

  - name: DefenseRoom
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Room code"
        constraints: "unique across DefenseRoom"
      - name: building
        type: string
        source: input
        description: "Building name"
      - name: seat_capacity
        type: integer
        source: input
        description: "Seats available for the public announcement"
        constraints: ">= 1"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: "Minimum clear gap that must separate two occupations of this room"
        default: 30
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: "Bookability of the room"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE}"
      - name: booked_minutes_total
        type: integer
        source: computed
        description: "Output of calculations.room_booked_minutes_total; conserved quantity of the room-minutes compensating invariant"
        default: 0

  - name: Thesis
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the degree candidate who owns this document"
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; supplies every deadline used by this thesis"
      - name: title
        type: string
        source: input
        description: "Document title"
      - name: document_type
        type: enum
        source: input
        description: "THESIS for MASTERS candidates, DISSERTATION for DOCTORAL candidates"
        constraints: "one of {THESIS, DISSERTATION}"
      - name: page_count
        type: integer
        source: input
        description: "Page count; feeds the defect density factor and the long-document revision bonus"
        constraints: ">= 1"
      - name: third_party_item_count
        type: integer
        source: input
        description: "Number of included third-party items the student declares; the permission-completeness check compares it against documented_permission_count"
        default: 0
        constraints: ">= 0"
      - name: workflow_state
        type: enum
        source: system
        description: "Primary lifecycle dimension"
        default: DRAFT
        constraints: "one of {DRAFT, COMMITTEE_PENDING, COMMITTEE_APPROVED, DEFENSE_SCHEDULED, DEFENSE_ANNOUNCED, DEFENSE_PASSED, DEFENSE_PASSED_WITH_REVISIONS, DEFENSE_FAILED, UNDER_FORMAT_REVIEW, FORMAT_REVISIONS_REQUIRED, FORMAT_ACCEPTED, DEPOSITED, CONFERRED, TERMINATED}"
      - name: integrity_state
        type: enum
        source: system
        description: "Second, independent state dimension on the same row; evolves only through IntegrityScreening events"
        default: NOT_SCREENED
        constraints: "one of {NOT_SCREENED, SCREEN_CLEARED, SCREEN_FLAGGED, UNDER_INTEGRITY_REVIEW, INTEGRITY_CLEARED, INTEGRITY_UPHELD}"
      - name: format_cycle_count
        type: integer
        source: computed
        description: "Count of FormatReview rows for this thesis; equals the cycle_number of the newest one"
        default: 0
      - name: documented_permission_count
        type: integer
        source: computed
        description: "Count of PermissionRecord rows for this thesis with status IN {ACCEPTED, WAIVED}"
        default: 0
      - name: analyst_turnaround_bdays_total
        type: integer
        source: computed
        description: "Sum of FormatReview.turnaround_bdays over rows with decided_at != null and status IN {ACCEPTED, REVISIONS_REQUIRED, SUPERSEDED}; drives the late-fee grace tier"
        default: 0
      - name: accepted_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which workflow_state became FORMAT_ACCEPTED; null before that"
        default: null

  - name: Committee
    parent: null
    common_fields: true
    fields:
      - name: thesis_id
        type: string
        source: input
        description: "FK -> Thesis.id; at most one Committee row per thesis"
        constraints: "unique across Committee"
      - name: status
        type: enum
        source: system
        description: "Composition-approval lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, DISSOLVED}"
      - name: member_count
        type: integer
        source: computed
        description: "Output of calculations.committee_composition_counts (CONFIRMED members only)"
        default: 0
      - name: external_member_count
        type: integer
        source: computed
        description: "CONFIRMED members whose role == EXTERNAL_MEMBER"
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the GraduateDean that approved; compared by the embargo segregation-of-duties check"
        default: null
      - name: approved_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the APPROVE decision; cleared when the committee reverts out of APPROVED"
        default: null
      - name: rejection_note
        type: string
        source: system
        description: "Free text supplied with a REJECT decision"
        default: null

  - name: CommitteeMember
    parent: Committee
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: input
        description: "FK -> Committee.id; taken from the path segment"
      - name: faculty_id
        type: string
        source: input
        description: "FK -> FacultyMember.id; the seated faculty member"
      - name: role
        type: enum
        source: input
        description: "Seat kind inside the committee"
        constraints: "one of {CHAIR, CO_CHAIR, MEMBER, EXTERNAL_MEMBER, GRADUATE_REPRESENTATIVE}"
      - name: status
        type: enum
        source: system
        description: "CONFIRMED on creation; WITHDRAWN after the seat is released (soft delete, still queryable)"
        default: CONFIRMED
        constraints: "one of {CONFIRMED, WITHDRAWN}"
      - name: withdrawal_reason
        type: string
        source: system
        description: "Free text captured when the seat is released"
        default: null

  - name: DefenseEvent
    parent: null
    common_fields: true
    fields:
      - name: thesis_id
        type: string
        source: input
        description: "FK -> Thesis.id; the document being defended"
      - name: room_id
        type: string
        source: input
        description: "FK -> DefenseRoom.id; the occupied room"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Occupation start instant (inclusive)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Occupation end instant (exclusive for faculty overlap, inclusive for room buffer arithmetic)"
      - name: status
        type: enum
        source: system
        description: "Scheduling and outcome dimension"
        default: DRAFT
        constraints: "one of {DRAFT, ANNOUNCED, HELD_PASS, HELD_PASS_WITH_REVISIONS, HELD_FAIL, CANCELLED}"
      - name: announced_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the public announcement; null before it"
        default: null
      - name: announcement_lead_bdays
        type: integer
        source: computed
        description: "Output of calculations.defense_announcement_lead; stored at announcement time"
        default: null
      - name: outcome_note
        type: string
        source: system
        description: "Free text supplied with the outcome"
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: "Free text supplied on cancellation, or the fixed string set by a cascade"
        default: null

  - name: FormatReview
    parent: null
    common_fields: true
    fields:
      - name: thesis_id
        type: string
        source: input
        description: "FK -> Thesis.id; the reviewed document"
      - name: cycle_number
        type: integer
        source: computed
        description: "1 for the first submission, incremented by one for each later submission of the same thesis"
        constraints: ">= 1"
      - name: opened_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the cycle was opened by the student's submission"
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the analyst decision; null while PENDING_REVIEW"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the deciding GradSchoolAnalyst; compared by the deposit segregation-of-duties check"
        default: null
      - name: decision
        type: enum
        source: system
        description: "Recorded analyst decision"
        default: null
        constraints: "one of {ACCEPT, RETURN_REVISIONS}"
      - name: critical_defect_count
        type: integer
        source: system
        description: "CRITICAL format defects recorded with the decision"
        default: 0
        constraints: ">= 0"
      - name: major_defect_count
        type: integer
        source: system
        description: "MAJOR format defects recorded with the decision"
        default: 0
        constraints: ">= 0"
      - name: minor_defect_count
        type: integer
        source: system
        description: "MINOR format defects recorded with the decision"
        default: 0
        constraints: ">= 0"
      - name: severity_weighted_defect_score
        type: number
        source: computed
        description: "Output of calculations.severity_weighted_defect_score; 0.00 while PENDING_REVIEW"
        default: 0
      - name: revision_due_at
        type: datetime
        source: computed
        description: "Output of calculations.format_revision_window; null unless the decision was RETURN_REVISIONS"
        default: null
      - name: turnaround_bdays
        type: integer
        source: computed
        description: "business_days_between(opened_at, decided_at); null while PENDING_REVIEW"
        default: null
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle"
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, REVISIONS_REQUIRED, ACCEPTED, SUPERSEDED, VOID}"

  - name: EmbargoRequest
    parent: null
    common_fields: true
    fields:
      - name: thesis_id
        type: string
        source: input
        description: "FK -> Thesis.id; the document to be withheld from open access"
      - name: reason_code
        type: enum
        source: input
        description: "Statutory basis; selects the duration cap"
        constraints: "one of {PATENT_PENDING, PUBLISHER_AGREEMENT, SENSITIVE_DATA, HUMAN_SUBJECTS}"
      - name: requested_months
        type: integer
        source: input
        description: "Requested embargo length in whole months"
        constraints: ">= 1"
      - name: justification
        type: string
        source: input
        description: "Narrative justification, refreshed by each supplement"
      - name: approved_months
        type: integer
        source: computed
        description: "Months granted by the dean's decision; null until decided, 0 on DENIED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Approval lifecycle with an information-request loop"
        default: REQUESTED
        constraints: "one of {REQUESTED, MORE_INFO_REQUIRED, APPROVED, PARTIALLY_APPROVED, DENIED, SUPERSEDED}"
      - name: info_request_count
        type: integer
        source: computed
        description: "Number of times the dean pushed this request back for more information"
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the deciding GraduateDean"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the terminal decision"
        default: null
      - name: release_date
        type: datetime
        source: computed
        description: "Output of calculations.embargo_release_date; written when the RepositoryDeposit is created"
        default: null
      - name: release_anchor
        type: enum
        source: computed
        description: "Which variant of calculations.embargo_release_date produced release_date"
        default: null
        constraints: "one of {DEPOSIT, CONFERRAL}"
      - name: decision_note
        type: string
        source: system
        description: "Free text supplied with any decision"
        default: null

  - name: PermissionRecord
    parent: null
    common_fields: true
    fields:
      - name: thesis_id
        type: string
        source: input
        description: "FK -> Thesis.id; the document embedding the third-party material"
      - name: material_type
        type: enum
        source: input
        description: "Kind of reused material"
        constraints: "one of {FIGURE, TABLE, EXCERPT, PREVIOUSLY_PUBLISHED_CHAPTER, DATASET}"
      - name: rights_basis
        type: enum
        source: input
        description: "Legal basis claimed for the reuse"
        constraints: "one of {WRITTEN_PERMISSION, FAIR_USE_ASSERTION, PUBLIC_DOMAIN, OPEN_LICENSE}"
      - name: page_reference
        type: string
        source: input
        description: "Where the material appears in the document"
      - name: excerpt_word_count
        type: integer
        source: input
        description: "Reused word count; capped for FAIR_USE_ASSERTION"
        default: 0
        constraints: ">= 0"
      - name: document_uri
        type: string
        source: input
        description: "Location of the signed permission letter; mandatory when rights_basis == WRITTEN_PERMISSION"
        default: null
      - name: status
        type: enum
        source: system
        description: "Documentation review lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, DEFICIENT, WAIVED}"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the reviewing GradSchoolAnalyst"
        default: null
      - name: review_note
        type: string
        source: system
        description: "Free text supplied with the review decision"
        default: null

  - name: IntegrityScreening
    parent: null
    common_fields: true
    fields:
      - name: thesis_id
        type: string
        source: input
        description: "FK -> Thesis.id; the screened document"
      - name: similarity_pct
        type: number
        source: input
        description: "Raw similarity percentage reported by the screening tool"
        constraints: ">= 0 and <= 100, two decimal places"
      - name: excluded_quoted_pct
        type: number
        source: input
        description: "Percentage attributable to correctly quoted matter, subtracted from similarity_pct"
        default: 0
        constraints: ">= 0 and <= 100, two decimal places"
      - name: adjusted_similarity_pct
        type: number
        source: computed
        description: "Output of calculations.adjusted_similarity_pct; compared against FLAG_THRESHOLD_PCT"
      - name: status
        type: enum
        source: system
        description: "Screening and referral lifecycle; SCREENED is transient and auto-resolves inside the creating request"
        default: SCREENED
        constraints: "one of {SCREENED, CLEARED, FLAGGED, REFERRED, DISMISSED, UPHELD, SUPERSEDED}"
      - name: screened_at
        type: datetime
        source: computed
        description: "Logical-clock instant the screening was recorded"
      - name: referred_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the integrity referral"
        default: null
      - name: referred_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the referring IntegrityOfficer"
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the IntegrityOfficer that dismissed or upheld the referral"
        default: null
      - name: resolution_note
        type: string
        source: system
        description: "Free text supplied with a REFER, DISMISS or UPHOLD action"
        default: null

  - name: RepositoryDeposit
    parent: null
    common_fields: true
    fields:
      - name: thesis_id
        type: string
        source: input
        description: "FK -> Thesis.id; at most one non-WITHDRAWN deposit per thesis"
        constraints: "unique across RepositoryDeposit"
      - name: handle
        type: string
        source: computed
        description: "Repository handle '<Term.code>/<seq>' where seq is a five-digit zero-padded counter assigned in ascending created_at order over the DEPOSITED rows whose thesis belongs to the same Term (ties broken by version ASC)"
      - name: abstract_word_count
        type: integer
        source: input
        description: "Abstract length; the abstract metadata element counts as present when this is >= 150"
        constraints: ">= 0"
      - name: subject_keywords
        type: array
        source: input
        description: "Subject keyword strings; the keyword metadata element counts as present when length >= 3"
      - name: advisor_name
        type: string
        source: input
        description: "Advisor name recorded in the repository metadata"
        default: null
      - name: department_code
        type: string
        source: input
        description: "Department code recorded in the repository metadata"
        default: null
      - name: metadata_completeness_score
        type: number
        source: computed
        description: "Output of calculations.metadata_completeness_score, four decimal places"
      - name: access_level
        type: enum
        source: computed
        description: "EMBARGOED when an APPROVED or PARTIALLY_APPROVED EmbargoRequest exists for the thesis, otherwise the requested_access_level supplied on creation (OPEN_ACCESS when that optional input is omitted)"
        constraints: "one of {OPEN_ACCESS, CAMPUS_ONLY, EMBARGOED}"
      - name: embargo_release_date
        type: datetime
        source: computed
        description: "Copy of the governing EmbargoRequest.release_date; null when access_level != EMBARGOED"
        default: null
      - name: deposited_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the deposit; anchor of the deposit_anchored embargo variant"
      - name: depositor_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the depositing GradSchoolAnalyst; compared by the deposit segregation-of-duties check"
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.deposit_late_fee_cents at deposit time"
        default: 0
      - name: status
        type: enum
        source: system
        description: "DEPOSITED on creation; WITHDRAWN when an integrity finding terminates the thesis afterwards"
        default: DEPOSITED
        constraints: "one of {DEPOSITED, WITHDRAWN}"

  - name: GraduationClearance
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; at most one clearance row per student"
        constraints: "unique across GraduationClearance"
      - name: status
        type: enum
        source: system
        description: "Clearance posture derived from the thesis and its dependent records"
        default: BLOCKED
        constraints: "one of {BLOCKED, PENDING_ITEMS, CLEARED, CONFERRED, WITHHELD}"
      - name: outstanding_items
        type: array
        source: computed
        description: "Unsatisfied clearance item codes from calculations.graduation_clearance_projection, emitted in the fixed order [COMMITTEE_APPROVAL, DEFENSE_OUTCOME, PERMISSIONS, FORMAT_ACCEPTANCE, EMBARGO_DECISION, INTEGRITY, DEPOSIT]"
        default: []
      - name: projection_variant
        type: enum
        source: computed
        description: "Which variant of calculations.graduation_clearance_projection produced outstanding_items"
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: cleared_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which outstanding_items first became empty; cleared again if an item regresses"
        default: null
      - name: conferral_posted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the degree conferral was posted"
        default: null
      - name: transcript_notation
        type: string
        source: computed
        description: "Notation copied onto Student.transcript_notation by the conferral or withhold cascade"
        default: null
      - name: withheld_reason
        type: string
        source: system
        description: "Fixed reason string written by the integrity-withhold cascade"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- Term
  - entity: Term
    initial_state: OPEN
    terminal_states: [CONFERRED]
    transitions:
      - from: OPEN
        to: DEPOSIT_CLOSED
        trigger: "POST /graduate-school/terms/{id}/close-deposit"
        actor: Registrar
        preconditions:
          - "term.status == OPEN"
        side_effects:
          - "For every GraduationClearance whose student owns a Thesis with term_id == term.id, re-run calculations.graduation_clearance_projection with the FINAL variant, in ascending Thesis.created_at order"
          - "Each such GraduationClearance.projection_variant is set to FINAL and outstanding_items / status are rewritten from the FINAL evaluation"
          - "Each affected Student.graduation_clearance_state is refreshed from its clearance"
        note: "The projection variant is a function of Term.status, so this transition is the reconciliation point of the dual-variant clearance calculation."
      - from: DEPOSIT_CLOSED
        to: CONFERRED
        trigger: "POST /graduate-school/terms/{id}/confer-degrees"
        actor: Registrar
        preconditions:
          - "term.status == DEPOSIT_CLOSED"
        side_effects:
          - "Process every Thesis with term_id == term.id in ascending Thesis.created_at order (ties broken by version ASC)"
          - "Re-run calculations.graduation_clearance_projection (FINAL) for the thesis's student"
          - "When the resulting status is CLEARED: GraduationClearance -> CONFERRED, Thesis.workflow_state DEPOSITED -> CONFERRED, Student.degree_conferred = true, GraduationClearance.conferral_posted_at = clock_now, and the conferral transcript notation is written to GraduationClearance.transcript_notation and mirrored onto Student.transcript_notation"
          - "When Thesis.workflow_state == TERMINATED or Thesis.integrity_state == INTEGRITY_UPHELD: GraduationClearance -> WITHHELD"
          - "term.conferred_count = number of clearances that reached CONFERRED in this run"

  # ---------------------------------------------- Thesis, dimension 1 of 2
  - entity: Thesis
    initial_state: DRAFT
    terminal_states: [CONFERRED, DEFENSE_FAILED, TERMINATED]
    note: "Dimension 1 of 2 on the Thesis row: workflow_state. Non-linear: UNDER_FORMAT_REVIEW <-> FORMAT_REVISIONS_REQUIRED is a revision cycle, and COMMITTEE_APPROVED/DEFENSE_SCHEDULED can revert to COMMITTEE_PENDING."
    transitions:
      - from: DRAFT
        to: COMMITTEE_PENDING
        trigger: "POST /graduate-school/committees/{id}/submit"
        actor: Student
        preconditions:
          - "thesis.workflow_state == DRAFT"
          - "committee.status IN {DRAFT, REJECTED}"
          - "calculations.committee_composition_counts satisfies the minimums for thesis.document_type"
        side_effects:
          - "Committee.status -> SUBMITTED"
          - "For every CONFIRMED CommitteeMember with role IN {CHAIR, CO_CHAIR}, recompute FacultyMember.active_chair_load (the committee now enters the counted status set)"
          - "Recompute the student's GraduationClearance (PROVISIONAL while term.status == OPEN)"
      - from: COMMITTEE_PENDING
        to: DRAFT
        trigger: "POST /graduate-school/committees/{id}/decision with decision == REJECT"
        actor: GraduateDean
        preconditions:
          - "thesis.workflow_state == COMMITTEE_PENDING"
          - "committee.status == SUBMITTED"
        side_effects:
          - "Committee.status -> REJECTED, Committee.rejection_note = request note"
          - "Recompute FacultyMember.active_chair_load for every CONFIRMED chair/co-chair seat (REJECTED leaves the counted set)"
          - "Recompute the student's GraduationClearance"
        note: "Revert edge: the composition can be reworked and resubmitted, so the pair COMMITTEE_PENDING <-> DRAFT is a cycle."
      - from: COMMITTEE_PENDING
        to: COMMITTEE_APPROVED
        trigger: "POST /graduate-school/committees/{id}/decision with decision == APPROVE"
        actor: GraduateDean
        preconditions:
          - "thesis.workflow_state == COMMITTEE_PENDING"
          - "committee.status == SUBMITTED"
          - "calculations.committee_composition_counts still satisfies the minimums for thesis.document_type"
        side_effects:
          - "Committee.status -> APPROVED, approved_by_user_id = X-User-ID, approved_at = clock_now"
          - "Recompute the student's GraduationClearance (COMMITTEE_APPROVAL item becomes satisfied under both variants)"
      - from: COMMITTEE_APPROVED
        to: DEFENSE_SCHEDULED
        trigger: "POST /graduate-school/defense-events"
        actor: Student
        preconditions:
          - "thesis.workflow_state == COMMITTEE_APPROVED"
          - "committee.status == APPROVED"
          - "room.status == AVAILABLE"
          - "no room-buffer collision and no faculty half-open collision (see validations priority 26 and 27)"
        side_effects:
          - "DefenseEvent created in DRAFT"
          - "Recompute DefenseRoom.booked_minutes_total for the booked room"
      - from: DEFENSE_SCHEDULED
        to: DEFENSE_ANNOUNCED
        trigger: "POST /graduate-school/defense-events/{id}/announce"
        actor: GradSchoolAnalyst
        preconditions:
          - "thesis.workflow_state == DEFENSE_SCHEDULED"
          - "defense_event.status == DRAFT"
          - "calculations.defense_announcement_lead >= term.announcement_lead_business_days"
        side_effects:
          - "DefenseEvent.status -> ANNOUNCED, announced_at = clock_now, announcement_lead_bdays = calculations.defense_announcement_lead"
          - "Recompute the student's GraduationClearance (PROVISIONAL now satisfies DEFENSE_OUTCOME, FINAL does not)"
      - from: DEFENSE_SCHEDULED
        to: COMMITTEE_APPROVED
        trigger: "POST /graduate-school/defense-events/{id}/cancel"
        actor: GradSchoolAnalyst
        preconditions:
          - "thesis.workflow_state IN {DEFENSE_SCHEDULED, DEFENSE_ANNOUNCED}"
          - "defense_event.status IN {DRAFT, ANNOUNCED}"
        side_effects:
          - "DefenseEvent.status -> CANCELLED, cancellation_reason = request reason"
          - "Recompute DefenseRoom.booked_minutes_total (the cancelled occupation leaves the counted set)"
          - "Recompute the student's GraduationClearance"
      - from: DEFENSE_ANNOUNCED
        to: COMMITTEE_APPROVED
        trigger: "POST /graduate-school/defense-events/{id}/cancel"
        actor: GradSchoolAnalyst
        preconditions:
          - "defense_event.status == ANNOUNCED"
        side_effects:
          - "Same side-effect set as the DEFENSE_SCHEDULED -> COMMITTEE_APPROVED cancellation"
      - from: DEFENSE_ANNOUNCED
        to: DEFENSE_PASSED
        trigger: "POST /graduate-school/defense-events/{id}/outcome with outcome == PASS"
        actor: FacultyMember
        preconditions:
          - "thesis.workflow_state == DEFENSE_ANNOUNCED"
          - "defense_event.status == ANNOUNCED"
          - "clock_now >= defense_event.scheduled_end"
          - "X-User-ID is the faculty_id of the CONFIRMED CHAIR seat of the thesis's APPROVED committee"
        side_effects:
          - "DefenseEvent.status -> HELD_PASS"
          - "Recompute the student's GraduationClearance (DEFENSE_OUTCOME satisfied under both variants)"
        note: "Branch 1 of the DefenseEvent fork; leaves the committee APPROVED and requires no post-defense revision."
      - from: DEFENSE_ANNOUNCED
        to: DEFENSE_PASSED_WITH_REVISIONS
        trigger: "POST /graduate-school/defense-events/{id}/outcome with outcome == PASS_WITH_REVISIONS"
        actor: FacultyMember
        preconditions:
          - "same as the PASS branch"
        side_effects:
          - "DefenseEvent.status -> HELD_PASS_WITH_REVISIONS"
          - "Recompute the student's GraduationClearance"
        note: "Branch 2 of the fork: identical clearance effect, but the thesis carries a distinct workflow_state, which the FINAL clearance projection and the PRD both surface."
      - from: DEFENSE_ANNOUNCED
        to: DEFENSE_FAILED
        trigger: "POST /graduate-school/defense-events/{id}/outcome with outcome == FAIL"
        actor: FacultyMember
        preconditions:
          - "same as the PASS branch"
        side_effects:
          - "DefenseEvent.status -> HELD_FAIL"
          - "Committee.status -> DISSOLVED (cascade link 1)"
          - "Because the committee left the counted status set, recompute FacultyMember.active_chair_load for every CONFIRMED chair/co-chair seat of that committee (cascade link 2)"
          - "Recompute the student's GraduationClearance; the thesis is terminal so status becomes PENDING_ITEMS with the FORMAT_ACCEPTANCE, INTEGRITY and DEPOSIT items outstanding"
        note: "Branch 3 of the fork: the only branch that dissolves the committee and releases chair load."
      - from: DEFENSE_PASSED
        to: UNDER_FORMAT_REVIEW
        trigger: "POST /graduate-school/theses/{id}/format-submissions"
        actor: Student
        preconditions:
          - "thesis.workflow_state IN {DEFENSE_PASSED, DEFENSE_PASSED_WITH_REVISIONS, FORMAT_REVISIONS_REQUIRED}"
          - "term.status == OPEN"
        side_effects:
          - "FormatReview created in PENDING_REVIEW with cycle_number = thesis.format_cycle_count + 1 and opened_at = clock_now"
          - "Any FormatReview for this thesis with status == REVISIONS_REQUIRED -> SUPERSEDED"
          - "Thesis.format_cycle_count incremented"
          - "Recompute the student's GraduationClearance (PROVISIONAL satisfies FORMAT_ACCEPTANCE from a PENDING_REVIEW cycle; FINAL does not)"
      - from: DEFENSE_PASSED_WITH_REVISIONS
        to: UNDER_FORMAT_REVIEW
        trigger: "POST /graduate-school/theses/{id}/format-submissions"
        actor: Student
        preconditions:
          - "same as the DEFENSE_PASSED entry"
        side_effects:
          - "same as the DEFENSE_PASSED entry"
      - from: UNDER_FORMAT_REVIEW
        to: FORMAT_REVISIONS_REQUIRED
        trigger: "POST /graduate-school/format-reviews/{id}/decision with decision == RETURN_REVISIONS"
        actor: GradSchoolAnalyst
        preconditions:
          - "thesis.workflow_state == UNDER_FORMAT_REVIEW"
          - "format_review.status == PENDING_REVIEW"
        side_effects:
          - "FormatReview.status -> REVISIONS_REQUIRED, decision = RETURN_REVISIONS, decided_at = clock_now, decided_by_user_id = X-User-ID"
          - "FormatReview.severity_weighted_defect_score = calculations.severity_weighted_defect_score"
          - "FormatReview.turnaround_bdays = business_days_between(opened_at, decided_at); Thesis.analyst_turnaround_bdays_total recomputed"
          - "FormatReview.revision_due_at = calculations.format_revision_window"
          - "Recompute the student's GraduationClearance"
      - from: FORMAT_REVISIONS_REQUIRED
        to: UNDER_FORMAT_REVIEW
        trigger: "POST /graduate-school/theses/{id}/format-submissions"
        actor: Student
        preconditions:
          - "thesis.workflow_state == FORMAT_REVISIONS_REQUIRED"
          - "clock_now <= revision_due_at of the FormatReview for this thesis whose status == REVISIONS_REQUIRED"
          - "term.status == OPEN"
        side_effects:
          - "same as the DEFENSE_PASSED entry: a new PENDING_REVIEW cycle is opened and the REVISIONS_REQUIRED row becomes SUPERSEDED"
        note: "Closing edge of the revision cycle; cycle_number strictly increases so the loop is observable and bounded by the revision window."
      - from: UNDER_FORMAT_REVIEW
        to: FORMAT_ACCEPTED
        trigger: "POST /graduate-school/format-reviews/{id}/decision with decision == ACCEPT"
        actor: GradSchoolAnalyst
        preconditions:
          - "thesis.workflow_state == UNDER_FORMAT_REVIEW"
          - "format_review.status == PENDING_REVIEW"
          - "thesis.integrity_state IN {SCREEN_CLEARED, INTEGRITY_CLEARED}"
          - "every PermissionRecord for the thesis has status IN {ACCEPTED, WAIVED} and thesis.documented_permission_count >= thesis.third_party_item_count"
          - "calculations.severity_weighted_defect_score < REVISION_MANDATORY_THRESHOLD"
        side_effects:
          - "FormatReview.status -> ACCEPTED, decision = ACCEPT, decided_at = clock_now, decided_by_user_id = X-User-ID"
          - "FormatReview.severity_weighted_defect_score, turnaround_bdays and Thesis.analyst_turnaround_bdays_total recomputed; revision_due_at stays null"
          - "Thesis.accepted_at = clock_now"
          - "Recompute the student's GraduationClearance (FORMAT_ACCEPTANCE satisfied under both variants)"
      - from: FORMAT_ACCEPTED
        to: DEPOSITED
        trigger: "POST /graduate-school/repository-deposits"
        actor: GradSchoolAnalyst
        preconditions:
          - "thesis.workflow_state == FORMAT_ACCEPTED"
          - "X-User-ID != the decided_by_user_id of the ACCEPTED FormatReview for this thesis"
          - "no EmbargoRequest for the thesis has status IN {REQUESTED, MORE_INFO_REQUIRED}"
          - "calculations.metadata_completeness_score >= METADATA_MIN_SCORE"
          - "request late_fee_paid_cents == calculations.deposit_late_fee_cents"
        side_effects:
          - "RepositoryDeposit created in DEPOSITED with handle, deposited_at = clock_now, late_fee_cents, metadata_completeness_score and access_level"
          - "For the governing EmbargoRequest (status IN {APPROVED, PARTIALLY_APPROVED}, greatest created_at, ties broken by version DESC) write release_date and release_anchor from calculations.embargo_release_date, and copy release_date onto RepositoryDeposit.embargo_release_date"
          - "Recompute the student's GraduationClearance; when no item remains outstanding it becomes CLEARED with cleared_at = clock_now"
      - from: DEPOSITED
        to: CONFERRED
        trigger: "POST /graduate-school/terms/{id}/confer-degrees (system, per thesis)"
        actor: system
        preconditions:
          - "thesis.workflow_state == DEPOSITED"
          - "the student's GraduationClearance evaluates to CLEARED under the FINAL variant"
        side_effects:
          - "GraduationClearance -> CONFERRED with conferral_posted_at = clock_now and the conferral transcript notation"
          - "Student.degree_conferred = true, Student.transcript_notation and Student.graduation_clearance_state refreshed"
      - from: UNDER_FORMAT_REVIEW
        to: TERMINATED
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD"
        actor: IntegrityOfficer
        preconditions:
          - "thesis.workflow_state NOT IN {CONFERRED, DEFENSE_FAILED, TERMINATED}"
          - "screening.status == REFERRED"
        side_effects:
          - "See the Thesis integrity_state machine UPHOLD transition for the full cascade"
      - from: FORMAT_ACCEPTED
        to: TERMINATED
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD"
        actor: IntegrityOfficer
        preconditions:
          - "same as the UNDER_FORMAT_REVIEW -> TERMINATED entry"
        side_effects:
          - "See the Thesis integrity_state machine UPHOLD transition"
      - from: DEPOSITED
        to: TERMINATED
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD"
        actor: IntegrityOfficer
        preconditions:
          - "same as the UNDER_FORMAT_REVIEW -> TERMINATED entry"
        side_effects:
          - "See the Thesis integrity_state machine UPHOLD transition; this is the only entry that also withdraws an existing RepositoryDeposit"

  # ---------------------------------------------- Thesis, dimension 2 of 2
  - entity: Thesis
    initial_state: NOT_SCREENED
    terminal_states: [INTEGRITY_UPHELD]
    note: "Dimension 2 of 2 on the Thesis row: integrity_state. It advances only through IntegrityScreening events and is fully independent of workflow_state — a thesis can be screened while UNDER_FORMAT_REVIEW, FORMAT_REVISIONS_REQUIRED or FORMAT_ACCEPTED, and the two dimensions are asserted separately."
    transitions:
      - from: NOT_SCREENED
        to: SCREEN_CLEARED
        trigger: "POST /graduate-school/integrity-screenings (system auto-resolution when adjusted_similarity_pct < FLAG_THRESHOLD_PCT)"
        actor: GradSchoolAnalyst
        preconditions:
          - "thesis.workflow_state IN {UNDER_FORMAT_REVIEW, FORMAT_REVISIONS_REQUIRED, FORMAT_ACCEPTED, DEPOSITED}"
          - "no IntegrityScreening for the thesis has status IN {REFERRED, UPHELD}"
        side_effects:
          - "IntegrityScreening created, auto-transitioned SCREENED -> CLEARED, screened_at = clock_now"
          - "Any earlier IntegrityScreening for the thesis with status IN {CLEARED, FLAGGED} -> SUPERSEDED"
          - "Recompute the student's GraduationClearance (INTEGRITY satisfied under both variants)"
      - from: NOT_SCREENED
        to: SCREEN_FLAGGED
        trigger: "POST /graduate-school/integrity-screenings (system auto-resolution when adjusted_similarity_pct >= FLAG_THRESHOLD_PCT)"
        actor: GradSchoolAnalyst
        preconditions:
          - "same as the SCREEN_CLEARED entry"
        side_effects:
          - "IntegrityScreening created, auto-transitioned SCREENED -> FLAGGED, screened_at = clock_now"
          - "Any earlier IntegrityScreening with status IN {CLEARED, FLAGGED} -> SUPERSEDED"
          - "Recompute the student's GraduationClearance; INTEGRITY is now unsatisfied under both variants"
      - from: SCREEN_FLAGGED
        to: SCREEN_CLEARED
        trigger: "POST /graduate-school/integrity-screenings (re-screen after revision, adjusted_similarity_pct < FLAG_THRESHOLD_PCT)"
        actor: GradSchoolAnalyst
        preconditions:
          - "same as the SCREEN_CLEARED entry"
        side_effects:
          - "The prior FLAGGED screening -> SUPERSEDED; the new screening is CLEARED"
          - "Recompute the student's GraduationClearance"
        note: "Re-screening edge; combined with SCREEN_CLEARED -> SCREEN_FLAGGED this dimension is itself cyclic."
      - from: SCREEN_CLEARED
        to: SCREEN_FLAGGED
        trigger: "POST /graduate-school/integrity-screenings (later screening crosses the threshold)"
        actor: GradSchoolAnalyst
        preconditions:
          - "same as the SCREEN_CLEARED entry"
        side_effects:
          - "The prior CLEARED screening -> SUPERSEDED; the new screening is FLAGGED"
          - "Recompute the student's GraduationClearance"
      - from: SCREEN_FLAGGED
        to: UNDER_INTEGRITY_REVIEW
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == REFER"
        actor: IntegrityOfficer
        preconditions:
          - "screening.status == FLAGGED"
          - "thesis.integrity_state == SCREEN_FLAGGED"
        side_effects:
          - "IntegrityScreening.status -> REFERRED, referred_at = clock_now, referred_by_user_id = X-User-ID"
          - "Recompute the student's GraduationClearance"
      - from: UNDER_INTEGRITY_REVIEW
        to: INTEGRITY_CLEARED
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == DISMISS"
        actor: IntegrityOfficer
        preconditions:
          - "screening.status == REFERRED"
        side_effects:
          - "IntegrityScreening.status -> DISMISSED, resolved_by_user_id = X-User-ID"
          - "Recompute the student's GraduationClearance (INTEGRITY satisfied again)"
      - from: UNDER_INTEGRITY_REVIEW
        to: INTEGRITY_UPHELD
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD"
        actor: IntegrityOfficer
        preconditions:
          - "screening.status == REFERRED"
          - "thesis.workflow_state NOT IN {CONFERRED, DEFENSE_FAILED, TERMINATED}"
        side_effects:
          - "IntegrityScreening.status -> UPHELD, resolved_by_user_id = X-User-ID (cascade link 1 source)"
          - "Thesis.integrity_state -> INTEGRITY_UPHELD and Thesis.workflow_state -> TERMINATED (cascade link 1)"
          - "Because the thesis is now TERMINATED, every FormatReview for it with status IN {PENDING_REVIEW, REVISIONS_REQUIRED} -> VOID, and any RepositoryDeposit with status == DEPOSITED -> WITHDRAWN (cascade link 2)"
          - "Because the deposit was withdrawn and the thesis terminated, the student's GraduationClearance -> WITHHELD with withheld_reason = 'ACADEMIC_INTEGRITY_FINDING' and transcript_notation = 'Degree withheld pending academic integrity resolution' (cascade link 3)"
          - "Because the clearance changed, Student.graduation_clearance_state = WITHHELD, Student.transcript_notation = the clearance notation and Student.degree_conferred = false (cascade link 4)"

  # ---------------------------------------------------------------- Committee
  - entity: Committee
    initial_state: DRAFT
    terminal_states: [DISSOLVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /graduate-school/committees/{id}/submit"
        actor: Student
        preconditions:
          - "committee.status IN {DRAFT, REJECTED}"
          - "member_count / external_member_count / chair and graduate-representative counts satisfy the document_type minimums"
        side_effects:
          - "Thesis.workflow_state DRAFT -> COMMITTEE_PENDING"
          - "FacultyMember.active_chair_load recomputed for chair/co-chair seats"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /graduate-school/committees/{id}/submit"
        actor: Student
        preconditions:
          - "committee.status == REJECTED"
          - "thesis.workflow_state == DRAFT"
        side_effects:
          - "same as the DRAFT -> SUBMITTED entry; Committee.rejection_note is left in place for audit"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /graduate-school/committees/{id}/decision with decision == APPROVE"
        actor: GraduateDean
        preconditions:
          - "committee.status == SUBMITTED"
        side_effects:
          - "approved_by_user_id and approved_at written; Thesis.workflow_state -> COMMITTEE_APPROVED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /graduate-school/committees/{id}/decision with decision == REJECT"
        actor: GraduateDean
        preconditions:
          - "committee.status == SUBMITTED"
        side_effects:
          - "Thesis.workflow_state -> DRAFT; FacultyMember.active_chair_load recomputed"
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /graduate-school/committees/{id}/members or DELETE /graduate-school/committee-members/{id}"
        actor: Student
        preconditions:
          - "committee.status == APPROVED"
          - "thesis.workflow_state IN {COMMITTEE_APPROVED, DEFENSE_SCHEDULED, DEFENSE_ANNOUNCED}"
        side_effects:
          - "Committee.status -> SUBMITTED, approved_by_user_id = null, approved_at = null (cascade link 1)"
          - "Because the committee is no longer APPROVED, Thesis.workflow_state -> COMMITTEE_PENDING (cascade link 2)"
          - "Because the thesis left DEFENSE_SCHEDULED/DEFENSE_ANNOUNCED, every DefenseEvent for it with status IN {DRAFT, ANNOUNCED} -> CANCELLED with cancellation_reason = 'COMMITTEE_COMPOSITION_CHANGED' (cascade link 3)"
          - "Because those occupations left the counted set, DefenseRoom.booked_minutes_total is recomputed for each affected room (cascade link 4)"
          - "Recompute the student's GraduationClearance and FacultyMember.active_chair_load for chair/co-chair seats"
        note: "Membership changes invalidate a granted approval; this is the deepest cascade in the scaffold."
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /graduate-school/committees/{id}/members or DELETE /graduate-school/committee-members/{id}"
        actor: Student
        preconditions:
          - "committee.status == SUBMITTED"
        side_effects:
          - "member_count / external_member_count recomputed"
          - "FacultyMember.active_chair_load recomputed for every affected chair/co-chair seat"
        note: "Self-loop: the committee is still awaiting a decision, so no revert cascade fires. This is the edge the chair-load compensating invariant uses."
      - from: DRAFT
        to: DRAFT
        trigger: "POST /graduate-school/committees/{id}/members or DELETE /graduate-school/committee-members/{id}"
        actor: Student
        preconditions:
          - "committee.status IN {DRAFT, REJECTED}"
        side_effects:
          - "member_count / external_member_count recomputed; chair load stays 0 because DRAFT is outside the counted status set"
      - from: APPROVED
        to: DISSOLVED
        trigger: "POST /graduate-school/defense-events/{id}/outcome with outcome == FAIL"
        actor: FacultyMember
        preconditions:
          - "committee.status == APPROVED"
        side_effects:
          - "FacultyMember.active_chair_load recomputed for every CONFIRMED chair/co-chair seat"

  # -------------------------------------------------------- CommitteeMember
  - entity: CommitteeMember
    initial_state: CONFIRMED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "DELETE /graduate-school/committee-members/{id}"
        actor: Student
        preconditions:
          - "member.status == CONFIRMED"
          - "committee.status IN {DRAFT, REJECTED, SUBMITTED, APPROVED}"
        side_effects:
          - "withdrawal_reason recorded; Committee.member_count / external_member_count recomputed"
          - "FacultyMember.active_chair_load recomputed for the released faculty when role IN {CHAIR, CO_CHAIR}"
          - "If committee.status == APPROVED, the APPROVED -> SUBMITTED revert cascade fires"

  # ------------------------------------------------------------ DefenseEvent
  - entity: DefenseEvent
    initial_state: DRAFT
    terminal_states: [HELD_PASS, HELD_PASS_WITH_REVISIONS, HELD_FAIL, CANCELLED]
    note: "Fork-join shape: ANNOUNCED branches into three held outcomes whose side-effect sets differ (only HELD_FAIL dissolves the committee and releases chair load)."
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /graduate-school/defense-events/{id}/announce"
        actor: GradSchoolAnalyst
        preconditions:
          - "event.status == DRAFT"
          - "calculations.defense_announcement_lead >= term.announcement_lead_business_days"
        side_effects:
          - "announced_at and announcement_lead_bdays written; Thesis.workflow_state -> DEFENSE_ANNOUNCED"
      - from: ANNOUNCED
        to: HELD_PASS
        trigger: "POST /graduate-school/defense-events/{id}/outcome with outcome == PASS"
        actor: FacultyMember
        preconditions:
          - "event.status == ANNOUNCED"
          - "clock_now >= event.scheduled_end"
        side_effects:
          - "Thesis.workflow_state -> DEFENSE_PASSED; committee stays APPROVED; chair load unchanged"
      - from: ANNOUNCED
        to: HELD_PASS_WITH_REVISIONS
        trigger: "POST /graduate-school/defense-events/{id}/outcome with outcome == PASS_WITH_REVISIONS"
        actor: FacultyMember
        preconditions:
          - "same as HELD_PASS"
        side_effects:
          - "Thesis.workflow_state -> DEFENSE_PASSED_WITH_REVISIONS; committee stays APPROVED; chair load unchanged"
      - from: ANNOUNCED
        to: HELD_FAIL
        trigger: "POST /graduate-school/defense-events/{id}/outcome with outcome == FAIL"
        actor: FacultyMember
        preconditions:
          - "same as HELD_PASS"
        side_effects:
          - "Thesis.workflow_state -> DEFENSE_FAILED (terminal)"
          - "Committee.status -> DISSOLVED and every chair/co-chair FacultyMember.active_chair_load recomputed"
        note: "The divergent branch: two extra entities mutate compared with the PASS branches."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /graduate-school/defense-events/{id}/cancel, or the Committee APPROVED -> SUBMITTED revert cascade"
        actor: GradSchoolAnalyst | system
        preconditions:
          - "event.status == DRAFT"
        side_effects:
          - "DefenseRoom.booked_minutes_total recomputed; Thesis.workflow_state -> COMMITTEE_APPROVED when the trigger was an explicit cancel"
      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /graduate-school/defense-events/{id}/cancel, or the Committee APPROVED -> SUBMITTED revert cascade"
        actor: GradSchoolAnalyst | system
        preconditions:
          - "event.status == ANNOUNCED"
        side_effects:
          - "same as the DRAFT -> CANCELLED entry"

  # ------------------------------------------------------------ FormatReview
  - entity: FormatReview
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, SUPERSEDED, VOID]
    transitions:
      - from: PENDING_REVIEW
        to: REVISIONS_REQUIRED
        trigger: "POST /graduate-school/format-reviews/{id}/decision with decision == RETURN_REVISIONS"
        actor: GradSchoolAnalyst
        preconditions:
          - "review.status == PENDING_REVIEW"
        side_effects:
          - "score, turnaround_bdays, revision_due_at written; Thesis.workflow_state -> FORMAT_REVISIONS_REQUIRED and analyst_turnaround_bdays_total recomputed"
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /graduate-school/format-reviews/{id}/decision with decision == ACCEPT"
        actor: GradSchoolAnalyst
        preconditions:
          - "review.status == PENDING_REVIEW"
          - "calculations.severity_weighted_defect_score < REVISION_MANDATORY_THRESHOLD"
          - "thesis.integrity_state IN {SCREEN_CLEARED, INTEGRITY_CLEARED}"
          - "every PermissionRecord for the thesis is ACCEPTED or WAIVED and documented_permission_count >= third_party_item_count"
        side_effects:
          - "score and turnaround_bdays written; Thesis.workflow_state -> FORMAT_ACCEPTED and accepted_at = clock_now"
      - from: REVISIONS_REQUIRED
        to: SUPERSEDED
        trigger: "POST /graduate-school/theses/{id}/format-submissions (next cycle opens)"
        actor: Student
        preconditions:
          - "review.status == REVISIONS_REQUIRED"
        side_effects:
          - "The superseded row keeps its score and turnaround_bdays so Thesis.analyst_turnaround_bdays_total remains the sum over all decided cycles"
      - from: PENDING_REVIEW
        to: VOID
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD (cascade)"
        actor: system
        preconditions:
          - "the thesis transitioned to TERMINATED in this request"
        side_effects:
          - "decided_at stays null so the voided cycle never contributes to analyst_turnaround_bdays_total"
      - from: REVISIONS_REQUIRED
        to: VOID
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD (cascade)"
        actor: system
        preconditions:
          - "the thesis transitioned to TERMINATED in this request"
        side_effects:
          - "the row retains decided_at and turnaround_bdays already recorded"

  # ---------------------------------------------------------- EmbargoRequest
  - entity: EmbargoRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, PARTIALLY_APPROVED, DENIED, SUPERSEDED]
    note: "Cyclic: REQUESTED -> MORE_INFO_REQUIRED -> REQUESTED can repeat, incrementing info_request_count each round."
    transitions:
      - from: REQUESTED
        to: MORE_INFO_REQUIRED
        trigger: "POST /graduate-school/embargo-requests/{id}/decision with decision == REQUEST_INFO"
        actor: GraduateDean
        preconditions:
          - "request.status == REQUESTED"
          - "X-User-ID != the thesis committee's approved_by_user_id"
        side_effects:
          - "info_request_count incremented; decision_note recorded; decided_at stays null"
          - "Recompute the student's GraduationClearance (EMBARGO_DECISION stays outstanding under both variants)"
      - from: MORE_INFO_REQUIRED
        to: REQUESTED
        trigger: "POST /graduate-school/embargo-requests/{id}/supplement"
        actor: Student
        preconditions:
          - "request.status == MORE_INFO_REQUIRED"
        side_effects:
          - "justification replaced with the supplied text"
        note: "Closing edge of the information-request loop."
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /graduate-school/embargo-requests/{id}/decision with decision == APPROVE"
        actor: GraduateDean
        preconditions:
          - "request.status == REQUESTED"
          - "X-User-ID != the thesis committee's approved_by_user_id"
        side_effects:
          - "approved_months = request.requested_months, decided_at = clock_now, decided_by_user_id = X-User-ID"
          - "Recompute the student's GraduationClearance (EMBARGO_DECISION satisfied)"
      - from: REQUESTED
        to: PARTIALLY_APPROVED
        trigger: "POST /graduate-school/embargo-requests/{id}/decision with decision == PARTIALLY_APPROVE"
        actor: GraduateDean
        preconditions:
          - "request.status == REQUESTED"
          - "request body approved_months is present, >= 1 and < request.requested_months"
          - "X-User-ID != the thesis committee's approved_by_user_id"
        side_effects:
          - "approved_months = body approved_months; decided_at and decided_by_user_id written"
          - "Recompute the student's GraduationClearance"
        note: "Selects the conferral_anchored variant of calculations.embargo_release_date at deposit time."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /graduate-school/embargo-requests/{id}/decision with decision == DENY"
        actor: GraduateDean
        preconditions:
          - "request.status == REQUESTED"
          - "X-User-ID != the thesis committee's approved_by_user_id"
        side_effects:
          - "approved_months = 0; decided_at and decided_by_user_id written"
          - "Recompute the student's GraduationClearance"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "POST /graduate-school/embargo-requests (a later request for the same thesis)"
        actor: Student
        preconditions:
          - "request.status IN {REQUESTED, MORE_INFO_REQUIRED}"
        side_effects:
          - "the superseded row keeps info_request_count for audit; the new row starts at REQUESTED"
      - from: MORE_INFO_REQUIRED
        to: SUPERSEDED
        trigger: "POST /graduate-school/embargo-requests (a later request for the same thesis)"
        actor: Student
        preconditions:
          - "request.status == MORE_INFO_REQUIRED"
        side_effects:
          - "same as the REQUESTED -> SUPERSEDED entry"

  # -------------------------------------------------------- PermissionRecord
  - entity: PermissionRecord
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, WAIVED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /graduate-school/permission-records/{id}/review with decision == ACCEPT"
        actor: GradSchoolAnalyst
        preconditions:
          - "record.status IN {SUBMITTED, DEFICIENT}"
        side_effects:
          - "reviewed_by_user_id and review_note written; Thesis.documented_permission_count recomputed"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /graduate-school/permission-records/{id}/review with decision == DEFICIENT"
        actor: GradSchoolAnalyst
        preconditions:
          - "record.status == SUBMITTED"
        side_effects:
          - "Thesis.documented_permission_count recomputed (the row does not count)"
      - from: SUBMITTED
        to: WAIVED
        trigger: "POST /graduate-school/permission-records/{id}/review with decision == WAIVE"
        actor: GradSchoolAnalyst
        preconditions:
          - "record.status IN {SUBMITTED, DEFICIENT}"
        side_effects:
          - "Thesis.documented_permission_count recomputed (the row counts as documented)"
      - from: DEFICIENT
        to: ACCEPTED
        trigger: "POST /graduate-school/permission-records/{id}/review with decision == ACCEPT"
        actor: GradSchoolAnalyst
        preconditions:
          - "record.status == DEFICIENT"
        side_effects:
          - "Thesis.documented_permission_count recomputed"
      - from: DEFICIENT
        to: WAIVED
        trigger: "POST /graduate-school/permission-records/{id}/review with decision == WAIVE"
        actor: GradSchoolAnalyst
        preconditions:
          - "record.status == DEFICIENT"
        side_effects:
          - "Thesis.documented_permission_count recomputed"

  # ------------------------------------------------------ IntegrityScreening
  - entity: IntegrityScreening
    initial_state: SCREENED
    terminal_states: [DISMISSED, UPHELD, SUPERSEDED]
    transitions:
      - from: SCREENED
        to: CLEARED
        trigger: "POST /graduate-school/integrity-screenings (system auto-resolution, same request)"
        actor: system
        preconditions:
          - "adjusted_similarity_pct < FLAG_THRESHOLD_PCT"
        side_effects:
          - "Thesis.integrity_state -> SCREEN_CLEARED"
      - from: SCREENED
        to: FLAGGED
        trigger: "POST /graduate-school/integrity-screenings (system auto-resolution, same request)"
        actor: system
        preconditions:
          - "adjusted_similarity_pct >= FLAG_THRESHOLD_PCT"
        side_effects:
          - "Thesis.integrity_state -> SCREEN_FLAGGED"
      - from: FLAGGED
        to: REFERRED
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == REFER"
        actor: IntegrityOfficer
        preconditions:
          - "screening.status == FLAGGED"
        side_effects:
          - "Thesis.integrity_state -> UNDER_INTEGRITY_REVIEW"
      - from: REFERRED
        to: DISMISSED
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == DISMISS"
        actor: IntegrityOfficer
        preconditions:
          - "screening.status == REFERRED"
        side_effects:
          - "Thesis.integrity_state -> INTEGRITY_CLEARED"
      - from: REFERRED
        to: UPHELD
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD"
        actor: IntegrityOfficer
        preconditions:
          - "screening.status == REFERRED"
          - "thesis.workflow_state NOT IN {CONFERRED, DEFENSE_FAILED, TERMINATED}"
        side_effects:
          - "the four-link termination cascade documented on the Thesis integrity_state machine"
      - from: CLEARED
        to: SUPERSEDED
        trigger: "POST /graduate-school/integrity-screenings (a later screening for the same thesis)"
        actor: GradSchoolAnalyst
        preconditions:
          - "screening.status IN {CLEARED, FLAGGED}"
        side_effects:
          - "none beyond the status change; the new row carries the governing result"
      - from: FLAGGED
        to: SUPERSEDED
        trigger: "POST /graduate-school/integrity-screenings (a later screening for the same thesis)"
        actor: GradSchoolAnalyst
        preconditions:
          - "screening.status == FLAGGED"
        side_effects:
          - "none beyond the status change"

  # ------------------------------------------------------ RepositoryDeposit
  - entity: RepositoryDeposit
    initial_state: DEPOSITED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DEPOSITED
        to: WITHDRAWN
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD (cascade)"
        actor: system
        preconditions:
          - "the thesis transitioned to TERMINATED in this request"
        side_effects:
          - "handle and embargo_release_date are retained for audit; the row stops satisfying the DEPOSIT clearance item"

  # ---------------------------------------------------- GraduationClearance
  - entity: GraduationClearance
    initial_state: BLOCKED
    terminal_states: [CONFERRED]
    note: "Compound/derived: every transition is a recompute of calculations.graduation_clearance_projection triggered by a change on the Thesis or one of its dependents. status is assigned by the first matching branch of the projection's status ladder."
    transitions:
      - from: BLOCKED
        to: PENDING_ITEMS
        trigger: "any clearance recompute while thesis.workflow_state NOT IN {DRAFT, COMMITTEE_PENDING} and outstanding_items is non-empty"
        actor: system
        preconditions:
          - "the clearance is not WITHHELD or CONFERRED"
        side_effects:
          - "Student.graduation_clearance_state refreshed"
      - from: PENDING_ITEMS
        to: BLOCKED
        trigger: "any clearance recompute after a revert cascade puts thesis.workflow_state back into {DRAFT, COMMITTEE_PENDING}"
        actor: system
        preconditions:
          - "the clearance is not WITHHELD or CONFERRED"
        side_effects:
          - "Student.graduation_clearance_state refreshed; cleared_at reset to null"
      - from: PENDING_ITEMS
        to: CLEARED
        trigger: "any clearance recompute in which outstanding_items becomes empty"
        actor: system
        preconditions:
          - "the clearance is not WITHHELD"
        side_effects:
          - "cleared_at = clock_now; Student.graduation_clearance_state = CLEARED"
      - from: CLEARED
        to: PENDING_ITEMS
        trigger: "any clearance recompute in which a previously satisfied item regresses (e.g. Term.status becomes DEPOSIT_CLOSED and the variant switches to FINAL)"
        actor: system
        preconditions:
          - "the clearance is not WITHHELD"
        side_effects:
          - "cleared_at reset to null; Student.graduation_clearance_state = PENDING_ITEMS"
      - from: CLEARED
        to: CONFERRED
        trigger: "POST /graduate-school/terms/{id}/confer-degrees"
        actor: system
        preconditions:
          - "term.status == DEPOSIT_CLOSED"
          - "the FINAL projection leaves outstanding_items empty"
        side_effects:
          - "conferral_posted_at = clock_now; transcript_notation written and mirrored onto Student"
      - from: PENDING_ITEMS
        to: WITHHELD
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD (cascade), or confer-degrees on a terminated thesis"
        actor: system
        preconditions:
          - "thesis.integrity_state == INTEGRITY_UPHELD or thesis.workflow_state == TERMINATED"
        side_effects:
          - "withheld_reason and the withhold transcript notation written and mirrored onto Student"
      - from: CLEARED
        to: WITHHELD
        trigger: "POST /graduate-school/integrity-screenings/{id}/action with action == UPHOLD (cascade)"
        actor: system
        preconditions:
          - "thesis.workflow_state == TERMINATED"
        side_effects:
          - "same as the PENDING_ITEMS -> WITHHELD entry; cleared_at reset to null"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: embargo-request-create-stale-thesis
    parent_entity: Thesis
    write_endpoint: "POST /graduate-school/embargo-requests"
    occ_field: "expected_thesis_version"
    description: |
      Creating an EmbargoRequest against a Thesis whose version has advanced since the client last
      read it is rejected. A new request legitimately supersedes any undecided request for the same
      thesis, so this create would otherwise succeed on top of a request the client never saw; the
      stale-version check forces the client to re-read the thesis first.
    error_id: ERR_STALE_THESIS_VERSION
    http_status: 412

  - rule_id: permission-record-create-stale-thesis
    parent_entity: Thesis
    write_endpoint: "POST /graduate-school/permission-records"
    occ_field: "expected_thesis_version"
    description: |
      Creating a PermissionRecord against a Thesis whose version has advanced since the client last
      read it is rejected. Multiple permission records per thesis are legitimate, so an additional
      create is never blocked by a state precondition; the stale-version check is the only guard
      that stops a client from documenting third-party material against an outdated view of
      documented_permission_count and third_party_item_count.
    error_id: ERR_STALE_THESIS_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: business_day_helpers
    trigger: "referenced by format_revision_window, defense_announcement_lead, deposit_late_fee_cents and FormatReview.turnaround_bdays"
    algorithm: interval_merge
    formula: |
      is_business_day(d)  =  d.weekday() IN {MON, TUE, WED, THU, FRI} AND d NOT IN HOLIDAYS

      business_days_between(a, b):
        # count of business days strictly after date(a) and up to and including date(b)
        if date(b) <= date(a): return 0
        n = 0
        d = date(a)
        while d < date(b):
          d = d + 1 day
          if is_business_day(d): n = n + 1
        return n

      add_business_days(t, n):
        # advance the calendar date one day at a time, counting business days only,
        # and preserve t's time-of-day in the result
        d = date(t)
        c = 0
        while c < n:
          d = d + 1 day
          if is_business_day(d): c = c + 1
        return datetime(d, time_of_day(t))
    input_set: "UTC calendar dates only; the time-of-day component never affects the business-day count"
    constants:
      HOLIDAYS: ["2026-11-26", "2026-11-27", "2026-12-24", "2026-12-25", "2027-01-01"]
    precision: "integer day counts; add_business_days returns a datetime with the input's time-of-day, whole seconds"

  - name: format_revision_window
    trigger: "POST /graduate-school/format-reviews/{id}/decision with decision == RETURN_REVISIONS — writes FormatReview.revision_due_at"
    algorithm: threshold
    formula: |
      base_window =  CYCLE1_WINDOW_BDAYS      if format_review.cycle_number == 1
                     CYCLE2_WINDOW_BDAYS      if format_review.cycle_number == 2
                     CYCLE3_PLUS_WINDOW_BDAYS if format_review.cycle_number >= 3

      long_doc_bonus = LONG_DOC_BONUS_BDAYS if thesis.page_count >= LONG_DOC_PAGE_THRESHOLD else 0

      raw_due        = add_business_days(format_review.decided_at, base_window + long_doc_bonus)

      revision_due_at = min(raw_due, term.format_review_deposit_deadline)
    input_set: "the FormatReview being decided (cycle_number, decided_at), its Thesis (page_count) and that thesis's Term (format_review_deposit_deadline)"
    constants:
      CYCLE1_WINDOW_BDAYS: 10
      CYCLE2_WINDOW_BDAYS: 7
      CYCLE3_PLUS_WINDOW_BDAYS: 5
      LONG_DOC_BONUS_BDAYS: 2
      LONG_DOC_PAGE_THRESHOLD: 300
    precision: "whole seconds; the min() comparison is on the full instant, so a clamped value carries the term deadline's time-of-day (17:00:00Z) rather than the decision's"

  - name: severity_weighted_defect_score
    trigger: "POST /graduate-school/format-reviews/{id}/decision (both decisions) — writes FormatReview.severity_weighted_defect_score"
    algorithm: weighted_scoring
    formula: |
      # STEP ORDER IS PINNED. Round per severity FIRST, then sum. Summing the three raw
      # products and rounding once at the end is NOT the sanctioned order and yields a
      # different value (e.g. 8.18 instead of 8.17 for page_count=101, counts 1/2/4).
      step 1:  density_factor = round_half_up(max(thesis.page_count, MIN_DENSITY_PAGES) / DENSITY_BASE_PAGES, 4)
      step 2:  term_critical  = round_half_up(critical_defect_count * W_CRITICAL * density_factor, 2)
               term_major     = round_half_up(major_defect_count    * W_MAJOR    * density_factor, 2)
               term_minor     = round_half_up(minor_defect_count    * W_MINOR    * density_factor, 2)
      step 3:  severity_weighted_defect_score = round_half_up(term_critical + term_major + term_minor, 2)

      # gate consumed by validations priority 32:
      ACCEPT is refused when severity_weighted_defect_score >= REVISION_MANDATORY_THRESHOLD
    input_set: "the three defect counts supplied in the decision request plus thesis.page_count; no other FormatReview row participates"
    constants:
      W_CRITICAL: 3.4
      W_MAJOR: 1.65
      W_MINOR: 0.35
      DENSITY_BASE_PAGES: 100
      MIN_DENSITY_PAGES: 50
      REVISION_MANDATORY_THRESHOLD: 12.00
    precision: "density_factor 4 decimal places round_half_up; each severity term and the total 2 decimal places round_half_up"

  - name: defense_announcement_lead
    trigger: "POST /graduate-school/defense-events/{id}/announce — writes DefenseEvent.announcement_lead_bdays"
    algorithm: threshold
    formula: |
      announcement_lead_bdays = business_days_between(clock_now, defense_event.scheduled_start)

      # gate consumed by validations priority 30:
      announcement is refused when announcement_lead_bdays < term.announcement_lead_business_days
      # exact equality passes: a lead of exactly term.announcement_lead_business_days is legal
    input_set: "the logical clock at announcement time, the event's scheduled_start and the thesis's Term"
    constants: {}
    precision: "integer business days; boundary is >= (equality passes)"

  - name: committee_composition_counts
    trigger: "every CommitteeMember create/withdraw and every committee submit or decision — writes Committee.member_count and Committee.external_member_count"
    algorithm: aggregation
    formula: |
      member_count           = count(CommitteeMember where committee_id == committee.id AND status == CONFIRMED)
      external_member_count  = count(CommitteeMember where committee_id == committee.id AND status == CONFIRMED AND role == EXTERNAL_MEMBER)
      chair_count            = count(CommitteeMember where committee_id == committee.id AND status == CONFIRMED AND role == CHAIR)
      grad_rep_count         = count(CommitteeMember where committee_id == committee.id AND status == CONFIRMED AND role == GRADUATE_REPRESENTATIVE)

      # gate consumed by validations priority 24, evaluated on submit and on APPROVE:
      if thesis.document_type == DISSERTATION:
        require member_count >= DOCTORAL_MIN_MEMBERS AND external_member_count >= DOCTORAL_MIN_EXTERNAL
                AND chair_count == 1 AND grad_rep_count == 1
      if thesis.document_type == THESIS:
        require member_count >= MASTERS_MIN_MEMBERS AND chair_count == 1 AND grad_rep_count == 0
    input_set: "CommitteeMember rows of this committee with status == CONFIRMED only; WITHDRAWN rows are excluded from every count"
    constants:
      DOCTORAL_MIN_MEMBERS: 5
      DOCTORAL_MIN_EXTERNAL: 1
      MASTERS_MIN_MEMBERS: 3
    precision: "integer counts; all minimums are >= (exact equality passes)"

  - name: faculty_active_chair_load
    trigger: "every CommitteeMember create/withdraw, every committee submit/decision, and the DISSOLVED cascade — writes FacultyMember.active_chair_load"
    algorithm: aggregation
    formula: |
      active_chair_load(f) = count(
        CommitteeMember cm
        where cm.faculty_id == f.id
          AND cm.status == CONFIRMED
          AND cm.role IN {CHAIR, CO_CHAIR}
          AND committee(cm.committee_id).status IN {SUBMITTED, APPROVED}
      )

      # conserved-quantity invariant (compensating-action pair: add member / withdraw member):
      sum(active_chair_load(f) for every FacultyMember f)
        == count(CommitteeMember where status == CONFIRMED AND role IN {CHAIR, CO_CHAIR}
                 AND committee.status IN {SUBMITTED, APPROVED})

      # gate consumed by validations priority 22:
      seating a CHAIR or CO_CHAIR is refused when active_chair_load would exceed MAX_CHAIR_LOAD
    input_set: "CONFIRMED chair/co-chair seats whose committee is SUBMITTED or APPROVED; DRAFT, REJECTED and DISSOLVED committees are excluded"
    constants:
      MAX_CHAIR_LOAD: 4
    precision: "integer counts"

  - name: room_booked_minutes_total
    trigger: "POST /graduate-school/defense-events, POST .../cancel, POST .../outcome and the committee-revert cascade — writes DefenseRoom.booked_minutes_total"
    algorithm: aggregation
    formula: |
      booked_minutes_total(r) = sum(
        (scheduled_end - scheduled_start) in whole minutes
        for DefenseEvent e where e.room_id == r.id
          AND e.status IN {DRAFT, ANNOUNCED, HELD_PASS, HELD_PASS_WITH_REVISIONS, HELD_FAIL}
      )

      # conserved-quantity invariant (compensating-action pair: schedule defense / cancel defense):
      booked_minutes_total(r) after a schedule-then-cancel pair == booked_minutes_total(r) before the schedule
    input_set: "DefenseEvent rows on the room whose status is in the counted set; CANCELLED occupations are excluded"
    precision: "whole minutes, truncating nothing because both endpoints are whole minutes by input constraint"

  - name: room_overlap_predicate
    trigger: "POST /graduate-school/defense-events — consumed by validations priority 26"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals plus a mandatory clear turnover gap. buffer = room.turnover_buffer_minutes.
      conflicts(new, existing) =
            new.scheduled_start < existing.scheduled_end   + buffer
        AND existing.scheduled_start < new.scheduled_end    + buffer

      # Consequence: a gap of exactly `buffer` minutes is legal; a gap of buffer-1 minutes conflicts.
    input_set: "DefenseEvent rows on the same room_id with status IN {DRAFT, ANNOUNCED, HELD_PASS, HELD_PASS_WITH_REVISIONS, HELD_FAIL}; CANCELLED rows never conflict"
    precision: "minute resolution; buffer is added to both sides of the comparison, so the required clear gap is symmetric"

  - name: faculty_overlap_predicate
    trigger: "POST /graduate-school/defense-events — consumed by validations priority 27"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [start, end) with NO buffer. Exact adjacency is legal.
      conflicts(new, existing) =
            new.scheduled_start < existing.scheduled_end
        AND existing.scheduled_start < new.scheduled_end

      # Consequence: new.scheduled_start == existing.scheduled_end is legal (gap 0 allowed),
      # which is strictly weaker than the room predicate's buffered arithmetic.
    input_set: "for each FacultyMember seated as a CONFIRMED CommitteeMember of the new thesis's committee, all DefenseEvent rows with status IN {DRAFT, ANNOUNCED} whose thesis committee also seats that faculty as CONFIRMED"
    precision: "minute resolution; no buffer term"

  - name: adjusted_similarity_pct
    trigger: "POST /graduate-school/integrity-screenings — writes IntegrityScreening.adjusted_similarity_pct and selects the SCREENED auto-transition"
    algorithm: threshold
    formula: |
      adjusted_similarity_pct = round_half_up(similarity_pct - excluded_quoted_pct, 2)
      if adjusted_similarity_pct < 0: adjusted_similarity_pct = 0.00

      status = FLAGGED if adjusted_similarity_pct >= FLAG_THRESHOLD_PCT else CLEARED
    input_set: "only the two percentages supplied on this screening request"
    constants:
      FLAG_THRESHOLD_PCT: 18.00
    precision: "2 decimal places round_half_up; boundary is >= (exactly 18.00 flags)"

  - name: metadata_completeness_score
    trigger: "POST /graduate-school/repository-deposits — writes RepositoryDeposit.metadata_completeness_score"
    algorithm: weighted_scoring
    formula: |
      present_weight =
          W_ABSTRACT      if abstract_word_count >= ABSTRACT_MIN_WORDS      else 0
        + W_KEYWORDS      if length(subject_keywords) >= KEYWORDS_MIN_COUNT else 0
        + W_ADVISOR       if advisor_name is a non-empty string             else 0
        + W_DEPARTMENT    if department_code is a non-empty string          else 0
        + W_DEGREE_LEVEL  # always present, read from the Student
        + W_DOCUMENT_TYPE # always present, read from the Thesis

      metadata_completeness_score = round_half_up(present_weight / TOTAL_WEIGHT, 4)

      # gate consumed by validations priority 39:
      deposit is refused when metadata_completeness_score < METADATA_MIN_SCORE
    input_set: "the four metadata fields supplied on the deposit request plus Student.degree_level and Thesis.document_type"
    constants:
      W_ABSTRACT: 0.30
      W_KEYWORDS: 0.20
      W_ADVISOR: 0.15
      W_DEPARTMENT: 0.15
      W_DEGREE_LEVEL: 0.10
      W_DOCUMENT_TYPE: 0.10
      TOTAL_WEIGHT: 1.00
      ABSTRACT_MIN_WORDS: 150
      KEYWORDS_MIN_COUNT: 3
      METADATA_MIN_SCORE: 0.85
    precision: "4 decimal places round_half_up; boundary is >= (exactly 0.8500 passes)"

  - name: deposit_late_fee_cents
    trigger: "POST /graduate-school/repository-deposits — writes RepositoryDeposit.late_fee_cents; also projected by GET /graduate-school/theses/{id}/deposit-readiness"
    algorithm: waterfall_allocation
    formula: |
      # The grace allowance looks circular: it is derived from the analysts' own turnaround, it
      # shifts the deadline, and the naive reading also subtracts it from the resulting lateness.
      # THE EVALUATION ORDER BELOW IS PINNED AND GRACE IS APPLIED EXACTLY ONCE (at step 3).
      step 1:  turnaround_total = thesis.analyst_turnaround_bdays_total
                                 # = sum of FormatReview.turnaround_bdays over rows with
                                 #   decided_at != null AND status IN {ACCEPTED, REVISIONS_REQUIRED, SUPERSEDED}
      step 2:  grace_bdays = GRACE_HIGH_BDAYS if turnaround_total >= GRACE_HIGH_TURNAROUND_BDAYS
                             else GRACE_MID_BDAYS if turnaround_total >= GRACE_MID_TURNAROUND_BDAYS
                             else 0
      step 3:  effective_deadline = add_business_days(term.format_review_deposit_deadline, grace_bdays)
      step 4:  days_late = business_days_between(effective_deadline, clock_now) if clock_now > effective_deadline else 0
      step 5:  chargeable_days = days_late          # grace was already consumed at step 3; do NOT subtract it again
      step 6:  late_fee_cents = min(chargeable_days * DAILY_LATE_FEE_CENTS, LATE_FEE_CAP_CENTS)

      # gate consumed by validations priority 40:
      deposit is refused when request late_fee_paid_cents != late_fee_cents
    input_set: "the thesis's decided FormatReview rows (VOID and PENDING_REVIEW rows contribute nothing), its Term's base deadline, and the logical clock at deposit time"
    constants:
      GRACE_HIGH_TURNAROUND_BDAYS: 15
      GRACE_HIGH_BDAYS: 5
      GRACE_MID_TURNAROUND_BDAYS: 10
      GRACE_MID_BDAYS: 3
      DAILY_LATE_FEE_CENTS: 2500
      LATE_FEE_CAP_CENTS: 50000
    precision: "integer cents; both tier comparisons are >= (a turnaround of exactly 15 lands in the high tier)"

  - name: embargo_release_date
    trigger: "POST /graduate-school/repository-deposits — writes EmbargoRequest.release_date, EmbargoRequest.release_anchor and RepositoryDeposit.embargo_release_date"
    algorithm: projection
    formula: |
      add_months(t, m):
        y  = year(t)  + floor((month(t) - 1 + m) / 12)
        mo = ((month(t) - 1 + m) mod 12) + 1
        d  = min(day(t), days_in_month(y, mo))     # clamp to the last day of the target month
        return datetime(y, mo, d, time_of_day(t))

      governing = the EmbargoRequest for this thesis with status IN {APPROVED, PARTIALLY_APPROVED}
                  and the greatest created_at; ties broken by version DESC
      if governing is null:
        RepositoryDeposit.embargo_release_date = null and access_level = requested_access_level
    input_set: "the governing EmbargoRequest, the RepositoryDeposit being created, and the thesis's Term"
    constants: {}
    precision: "whole seconds; the anchor's time-of-day is preserved by add_months"
    variants:
      - name: deposit_anchored
        when: "governing.status == APPROVED (the full requested duration was granted)"
        difference: "release_date = add_months(repository_deposit.deposited_at, governing.approved_months) and release_anchor = DEPOSIT — the clock starts the moment the document lands in the repository"
      - name: conferral_anchored
        when: "governing.status == PARTIALLY_APPROVED (a shortened duration was granted)"
        difference: "release_date = add_months(term.degree_conferral_date, governing.approved_months) and release_anchor = CONFERRAL — a shortened embargo is measured from the public conferral date instead, so identical approved_months and an identical deposit instant produce a different release_date than the deposit_anchored variant"

  - name: graduation_clearance_projection
    trigger: "every clearance recompute listed in §1.2 side effects, POST /graduate-school/terms/{id}/close-deposit and POST /graduate-school/terms/{id}/confer-degrees — writes GraduationClearance.outstanding_items, projection_variant, status and the Student mirrors"
    algorithm: forward_looking
    formula: |
      variant = PROVISIONAL if term.status == OPEN else FINAL

      # Each item is emitted into outstanding_items only when UNSATISFIED. Emission order is the
      # fixed list [COMMITTEE_APPROVAL, DEFENSE_OUTCOME, PERMISSIONS, FORMAT_ACCEPTANCE,
      # EMBARGO_DECISION, INTEGRITY, DEPOSIT] — never sorted by any other key.

      COMMITTEE_APPROVAL satisfied when committee.status == APPROVED
                         (PROVISIONAL also accepts committee.status == SUBMITTED)
      DEFENSE_OUTCOME    satisfied when a DefenseEvent with status IN {HELD_PASS, HELD_PASS_WITH_REVISIONS} exists
                         (PROVISIONAL also accepts a DefenseEvent with status == ANNOUNCED)
      PERMISSIONS        satisfied when thesis.third_party_item_count == 0
                         OR count(PermissionRecord where status IN {ACCEPTED, WAIVED}) >= thesis.third_party_item_count
                         (PROVISIONAL also counts rows with status == SUBMITTED toward that total)
      FORMAT_ACCEPTANCE  satisfied when a FormatReview with status == ACCEPTED exists
                         (PROVISIONAL also accepts a FormatReview with status == PENDING_REVIEW)
      EMBARGO_DECISION   satisfied when no EmbargoRequest for the thesis has status IN {REQUESTED, MORE_INFO_REQUIRED}
                         (identical under both variants)
      INTEGRITY          satisfied when thesis.integrity_state IN {SCREEN_CLEARED, INTEGRITY_CLEARED}
                         (PROVISIONAL also accepts thesis.integrity_state == NOT_SCREENED)
      DEPOSIT            satisfied when a RepositoryDeposit with status == DEPOSITED exists
                         (identical under both variants)

      # status ladder — first matching branch wins:
      status = WITHHELD      if thesis.integrity_state == INTEGRITY_UPHELD or thesis.workflow_state == TERMINATED
               CONFERRED     if thesis.workflow_state == CONFERRED
               CLEARED       if outstanding_items is empty
               BLOCKED       if thesis.workflow_state IN {DRAFT, COMMITTEE_PENDING}
               PENDING_ITEMS otherwise
    input_set: "the student's single Thesis (the row with the greatest created_at when a student has more than one, ties broken by version DESC), that thesis's Committee, DefenseEvent, PermissionRecord, FormatReview, EmbargoRequest, IntegrityScreening and RepositoryDeposit rows"
    constants: {}
    precision: "outstanding_items is an array of item codes in the fixed order above; no numeric rounding"
    variants:
      - name: provisional
        when: "term.status == OPEN — every recompute triggered by a thesis-side mutation while the deposit window is still open"
        difference: "in-flight evidence counts as satisfying its item: a SUBMITTED committee, an ANNOUNCED defense, SUBMITTED permission records, a PENDING_REVIEW format review and a NOT_SCREENED integrity state all clear their items, so outstanding_items is a strict subset of the FINAL list for identical data"
      - name: final
        when: "term.status IN {DEPOSIT_CLOSED, CONFERRED} — the recompute performed by close-deposit and by confer-degrees"
        difference: "only terminal evidence counts: the committee must be APPROVED, the defense HELD_PASS or HELD_PASS_WITH_REVISIONS, permission records ACCEPTED or WAIVED, the format review ACCEPTED and the integrity state SCREEN_CLEARED or INTEGRITY_CLEARED — so the same database yields a longer outstanding_items array and can flip status from CLEARED back to PENDING_ITEMS"

  - name: transcript_notation
    trigger: "POST /graduate-school/terms/{id}/confer-degrees (conferral branch) and the integrity UPHOLD cascade — writes GraduationClearance.transcript_notation and Student.transcript_notation"
    algorithm: projection
    formula: |
      on conferral:
        base = thesis.document_type + " deposited " + date(repository_deposit.deposited_at) as YYYY-MM-DD
        if repository_deposit.embargo_release_date is not null:
          notation = base + "; access restricted until " + date(repository_deposit.embargo_release_date) as YYYY-MM-DD
        else:
          notation = base

      on integrity withhold:
        notation = "Degree withheld pending academic integrity resolution"
    input_set: "the thesis, its RepositoryDeposit and the governing EmbargoRequest release_date"
    constants: {}
    precision: "exact strings; dates rendered as YYYY-MM-DD in UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "all required body fields are present, types match, enum members are legal, integers respect their >= constraints, and pagination limit is within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every path id resolves, validated left to right"
    error_id: "ERR_TERM_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_FACULTY_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_THESIS_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_COMMITTEE_MEMBER_NOT_FOUND | ERR_DEFENSE_NOT_FOUND | ERR_FORMAT_REVIEW_NOT_FOUND | ERR_EMBARGO_REQUEST_NOT_FOUND | ERR_PERMISSION_RECORD_NOT_FOUND | ERR_SCREENING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the body resolves, validated in the order the fields appear in the endpoint's input list"
    error_id: "ERR_STUDENT_NOT_FOUND | ERR_TERM_NOT_FOUND | ERR_THESIS_NOT_FOUND | ERR_FACULTY_NOT_FOUND | ERR_ROOM_NOT_FOUND"
    http_status: 404
    applies_to: "POST /theses, POST /committees, POST /committees/{id}/members, POST /defense-events, POST /permission-records, POST /embargo-requests, POST /integrity-screenings, POST /repository-deposits"

  - priority: 6
    category: auth
    check: "when X-User-Role == Student, X-User-ID equals the student_id of the Thesis the request targets (directly, or through the Committee / FormatReview / EmbargoRequest / CommitteeMember named in the path)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /theses, POST /committees, POST /committees/{id}/members, DELETE /committee-members/{id}, POST /committees/{id}/submit, POST /defense-events, POST /defense-events/{id}/cancel, POST /theses/{id}/format-submissions, POST /permission-records, POST /embargo-requests, POST /embargo-requests/{id}/supplement"

  - priority: 7
    category: auth
    check: "when X-User-Role == FacultyMember, X-User-ID equals the faculty_id of the CONFIRMED CHAIR seat of the APPROVED Committee of the thesis being defended"
    error_id: ERR_NOT_COMMITTEE_CHAIR
    http_status: 403
    applies_to: "POST /defense-events/{id}/outcome"

  - priority: 8
    category: state
    check: "expected_thesis_version equals the current Thesis.version (concurrency_rules embargo-request-create-stale-thesis and permission-record-create-stale-thesis)"
    error_id: ERR_STALE_THESIS_VERSION
    http_status: 412
    applies_to: "POST /embargo-requests, POST /permission-records"

  - priority: 9
    category: state
    check: "the Term governing the targeted Thesis has status == OPEN"
    error_id: ERR_TERM_DEPOSIT_CLOSED
    http_status: 409
    applies_to: "POST /committees, POST /committees/{id}/members, DELETE /committee-members/{id}, POST /committees/{id}/submit, POST /committees/{id}/decision, POST /defense-events, POST /defense-events/{id}/announce, POST /defense-events/{id}/outcome, POST /defense-events/{id}/cancel, POST /theses/{id}/format-submissions, POST /format-reviews/{id}/decision, POST /permission-records, POST /permission-records/{id}/review, POST /embargo-requests, POST /embargo-requests/{id}/decision, POST /embargo-requests/{id}/supplement, POST /integrity-screenings, POST /repository-deposits"

  - priority: 10
    category: state
    check: "Term.status matches the transition being requested (OPEN for close-deposit, DEPOSIT_CLOSED for confer-degrees)"
    error_id: ERR_TERM_STATE_INVALID
    http_status: 409
    applies_to: "POST /terms/{id}/close-deposit, POST /terms/{id}/confer-degrees"

  - priority: 11
    category: state
    check: "Thesis.workflow_state is a legal `from:` state for the requested transition per §1.2. For the three endpoints that do not move workflow_state themselves the admissible sets are: POST /permission-records requires workflow_state NOT IN {DEFENSE_FAILED, DEPOSITED, CONFERRED, TERMINATED}; POST /embargo-requests requires workflow_state IN {DEFENSE_PASSED, DEFENSE_PASSED_WITH_REVISIONS, UNDER_FORMAT_REVIEW, FORMAT_REVISIONS_REQUIRED, FORMAT_ACCEPTED}; POST /integrity-screenings requires workflow_state IN {UNDER_FORMAT_REVIEW, FORMAT_REVISIONS_REQUIRED, FORMAT_ACCEPTED, DEPOSITED}"
    error_id: ERR_THESIS_STATE_INVALID
    http_status: 409
    applies_to: "POST /committees/{id}/submit, POST /defense-events, POST /theses/{id}/format-submissions, POST /permission-records, POST /embargo-requests, POST /integrity-screenings, POST /repository-deposits"

  - priority: 12
    category: state
    check: "Committee.status is a legal `from:` state for the requested transition per §1.2"
    error_id: ERR_COMMITTEE_STATE_INVALID
    http_status: 409
    applies_to: "POST /committees/{id}/members, DELETE /committee-members/{id}, POST /committees/{id}/submit, POST /committees/{id}/decision, POST /defense-events"

  - priority: 13
    category: state
    check: "DefenseEvent.status is a legal `from:` state for the requested transition, and for outcome the logical clock has reached scheduled_end"
    error_id: ERR_DEFENSE_STATE_INVALID
    http_status: 409
    applies_to: "POST /defense-events/{id}/announce, POST /defense-events/{id}/outcome, POST /defense-events/{id}/cancel"

  - priority: 14
    category: state
    check: "FormatReview.status == PENDING_REVIEW"
    error_id: ERR_FORMAT_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /format-reviews/{id}/decision"

  - priority: 15
    category: state
    check: "EmbargoRequest.status is a legal `from:` state (REQUESTED for a decision, MORE_INFO_REQUIRED for a supplement)"
    error_id: ERR_EMBARGO_STATE_INVALID
    http_status: 409
    applies_to: "POST /embargo-requests/{id}/decision, POST /embargo-requests/{id}/supplement"

  - priority: 16
    category: state
    check: "PermissionRecord.status IN {SUBMITTED, DEFICIENT} and the requested decision is legal from it"
    error_id: ERR_PERMISSION_RECORD_STATE_INVALID
    http_status: 409
    applies_to: "POST /permission-records/{id}/review"

  - priority: 17
    category: state
    check: "IntegrityScreening.status is a legal `from:` state for the requested action (FLAGGED for REFER, REFERRED for DISMISS and UPHOLD), and no screening for the thesis is REFERRED or UPHELD when a new screening is recorded"
    error_id: ERR_SCREENING_STATE_INVALID
    http_status: 409
    applies_to: "POST /integrity-screenings, POST /integrity-screenings/{id}/action"

  - priority: 18
    category: business_safety
    check: "Thesis.integrity_state is not NOT_SCREENED when the format review is accepted or the deposit is created — a screening must exist"
    error_id: ERR_SCREENING_REQUIRED
    http_status: 409
    applies_to: "POST /format-reviews/{id}/decision (decision == ACCEPT), POST /repository-deposits"

  - priority: 19
    category: business_safety
    check: "Thesis.integrity_state NOT IN {SCREEN_FLAGGED, UNDER_INTEGRITY_REVIEW, INTEGRITY_UPHELD} when the format review is accepted or the deposit is created"
    error_id: ERR_INTEGRITY_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /format-reviews/{id}/decision (decision == ACCEPT), POST /repository-deposits"

  - priority: 20
    category: business_safety
    check: "the depositing GradSchoolAnalyst's X-User-ID differs from the decided_by_user_id of the ACCEPTED FormatReview of that thesis; and the deciding GraduateDean's X-User-ID differs from the Committee.approved_by_user_id of that thesis"
    error_id: ERR_DUTY_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /repository-deposits, POST /embargo-requests/{id}/decision"

  - priority: 21
    category: business_constraint
    check: "the student has no other Thesis in the same Term whose workflow_state is not in {DEFENSE_FAILED, TERMINATED, CONFERRED}"
    error_id: ERR_DUPLICATE_THESIS_FOR_TERM
    http_status: 409
    applies_to: "POST /theses"

  - priority: 22
    category: business_constraint
    check: "a CHAIR or CO_CHAIR seat requires FacultyMember.appointment_type IN {TENURED, TENURE_TRACK}, graduate_faculty_certified == true, and active_chair_load < MAX_CHAIR_LOAD"
    error_id: ERR_CHAIR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /committees/{id}/members"

  - priority: 23
    category: business_constraint
    check: "the faculty member is not already seated on this committee with status == CONFIRMED, the committee gains at most one CHAIR and at most one GRADUATE_REPRESENTATIVE, and an EXTERNAL_MEMBER seat requires FacultyMember.appointment_type == EXTERNAL"
    error_id: ERR_COMMITTEE_SEAT_CONFLICT
    http_status: 409
    applies_to: "POST /committees/{id}/members"

  - priority: 24
    category: business_constraint
    check: "calculations.committee_composition_counts satisfies the minimums for thesis.document_type"
    error_id: ERR_COMMITTEE_COMPOSITION_INVALID
    http_status: 422
    applies_to: "POST /committees/{id}/submit, POST /committees/{id}/decision (decision == APPROVE)"

  - priority: 25
    category: business_constraint
    check: "DefenseRoom.status == AVAILABLE and scheduled_end - scheduled_start is between 30 and 240 whole minutes"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /defense-events"

  - priority: 26
    category: business_constraint
    check: "calculations.room_overlap_predicate reports no conflict against the room's counted occupations"
    error_id: ERR_ROOM_BOOKING_CONFLICT
    http_status: 409
    applies_to: "POST /defense-events"

  - priority: 27
    category: business_constraint
    check: "calculations.faculty_overlap_predicate reports no conflict for any CONFIRMED member of the thesis's committee"
    error_id: ERR_FACULTY_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /defense-events"

  - priority: 28
    category: business_temporal
    check: "scheduled_start is strictly after the logical clock"
    error_id: ERR_DEFENSE_START_IN_PAST
    http_status: 422
    applies_to: "POST /defense-events"

  - priority: 29
    category: business_temporal
    check: "scheduled_start <= term.defense_deadline"
    error_id: ERR_DEFENSE_AFTER_TERM_DEADLINE
    http_status: 422
    applies_to: "POST /defense-events"

  - priority: 30
    category: business_temporal
    check: "calculations.defense_announcement_lead >= term.announcement_lead_business_days"
    error_id: ERR_ANNOUNCEMENT_LEAD_TOO_SHORT
    http_status: 422
    applies_to: "POST /defense-events/{id}/announce"

  - priority: 31
    category: business_temporal
    check: "the logical clock is at or before the revision_due_at of the thesis's REVISIONS_REQUIRED FormatReview"
    error_id: ERR_REVISION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /theses/{id}/format-submissions (only when thesis.workflow_state == FORMAT_REVISIONS_REQUIRED)"

  - priority: 32
    category: business_constraint
    check: "calculations.severity_weighted_defect_score < REVISION_MANDATORY_THRESHOLD when the decision is ACCEPT"
    error_id: ERR_DEFECT_SCORE_REQUIRES_REVISIONS
    http_status: 422
    applies_to: "POST /format-reviews/{id}/decision"

  - priority: 33
    category: business_constraint
    check: "document_uri is a non-empty string when rights_basis == WRITTEN_PERMISSION"
    error_id: ERR_PERMISSION_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /permission-records"

  - priority: 34
    category: business_constraint
    check: "excerpt_word_count <= FAIR_USE_MAX_WORDS (400) when rights_basis == FAIR_USE_ASSERTION"
    error_id: ERR_FAIR_USE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /permission-records"

  - priority: 35
    category: business_constraint
    check: "requested_months <= the cap for (reason_code, Student.degree_level): PATENT_PENDING 24, PUBLISHER_AGREEMENT 12, SENSITIVE_DATA 36, HUMAN_SUBJECTS 12, each halved and rounded down for MASTERS candidates; and for PARTIALLY_APPROVE the body approved_months is >= 1 and < requested_months"
    error_id: ERR_EMBARGO_DURATION_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /embargo-requests, POST /embargo-requests/{id}/decision"

  - priority: 36
    category: business_referential
    check: "every PermissionRecord for the thesis has status IN {ACCEPTED, WAIVED} and Thesis.documented_permission_count >= Thesis.third_party_item_count"
    error_id: ERR_PERMISSIONS_INCOMPLETE
    http_status: 422
    applies_to: "POST /format-reviews/{id}/decision (decision == ACCEPT), POST /repository-deposits"

  - priority: 37
    category: business_referential
    check: "no EmbargoRequest for the thesis has status IN {REQUESTED, MORE_INFO_REQUIRED}"
    error_id: ERR_EMBARGO_UNDECIDED
    http_status: 409
    applies_to: "POST /repository-deposits"

  - priority: 38
    category: business_constraint
    check: "no RepositoryDeposit with status == DEPOSITED already exists for the thesis"
    error_id: ERR_DEPOSIT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /repository-deposits"

  - priority: 39
    category: business_constraint
    check: "calculations.metadata_completeness_score >= METADATA_MIN_SCORE"
    error_id: ERR_METADATA_INCOMPLETE
    http_status: 422
    applies_to: "POST /repository-deposits"

  - priority: 40
    category: business_fiscal
    check: "request late_fee_paid_cents == calculations.deposit_late_fee_cents"
    error_id: ERR_LATE_FEE_MISMATCH
    http_status: 402
    applies_to: "POST /repository-deposits"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ------------------------------------------------------------------ reads
  - method: GET
    path: "/graduate-school/terms/{id}"
    description: "Read a graduation term with its deadlines and conferral counter"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: Term
    side_effects: []

  - method: GET
    path: "/graduate-school/students/{id}"
    description: "Read a degree candidate with the mirrored clearance state, conferral flag and transcript notation"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/graduate-school/students/{id}/graduation-clearances"
    description: "Reverse-reachability read for GraduationClearance.student_id; returns 0 or 1 rows"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: GraduationClearance[]
    side_effects: []

  - method: GET
    path: "/graduate-school/faculty-members/{id}"
    description: "Read a faculty member with the computed active_chair_load"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: FacultyMember
    side_effects: []

  - method: GET
    path: "/graduate-school/defense-rooms/{id}"
    description: "Read a defense room with its turnover buffer and computed booked_minutes_total"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: DefenseRoom
    side_effects: []

  - method: GET
    path: "/graduate-school/theses"
    description: "Paginated thesis list; also the reverse-reachability read for Thesis.student_id and Thesis.term_id"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: ["student_id?", "term_id?", "workflow_state?", "limit?", "offset?"]
    output: Thesis[]
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}"
    description: "Read a thesis with both state dimensions and every derived counter"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: Thesis
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}/committee"
    description: "Reverse-reachability read for Committee.thesis_id; returns 0 or 1 rows"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: Committee[]
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}/format-reviews"
    description: "Reverse-reachability read for FormatReview.thesis_id; every cycle in ascending cycle_number order"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: FormatReview[]
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}/embargo-requests"
    description: "Reverse-reachability read for EmbargoRequest.thesis_id, in ascending created_at order"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: EmbargoRequest[]
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}/permission-records"
    description: "Reverse-reachability read for PermissionRecord.thesis_id, in ascending created_at order"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: PermissionRecord[]
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}/integrity-screenings"
    description: "Reverse-reachability read for IntegrityScreening.thesis_id, in ascending created_at order"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: IntegrityScreening[]
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}/repository-deposit"
    description: "Reverse-reachability read for RepositoryDeposit.thesis_id; returns 0 or 1 rows including WITHDRAWN ones"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: RepositoryDeposit[]
    side_effects: []

  - method: GET
    path: "/graduate-school/theses/{id}/deposit-readiness"
    description: "Computed read: replays calculations.graduation_clearance_projection and calculations.deposit_late_fee_cents against the logical clock without mutating anything, and names the error_id the next deposit attempt would raise (null when the deposit would succeed)"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: "{ thesis_id: string, workflow_state: string, projection_variant: string, outstanding_items: string[], projected_late_fee_cents: integer, next_blocking_error_id: string }"
    side_effects: []

  - method: GET
    path: "/graduate-school/committee-members/{id}"
    description: "Read a committee seat, including WITHDRAWN ones"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []

  - method: GET
    path: "/graduate-school/committee-members"
    description: "Reverse-reachability read for CommitteeMember.committee_id and CommitteeMember.faculty_id; WITHDRAWN seats are excluded unless status is supplied"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: ["committee_id?", "faculty_id?", "status?", "limit?", "offset?"]
    output: CommitteeMember[]
    side_effects: []

  - method: GET
    path: "/graduate-school/defense-events/{id}"
    description: "Read a defense event with its announcement lead and outcome"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: DefenseEvent
    side_effects: []

  - method: GET
    path: "/graduate-school/defense-events"
    description: "Reverse-reachability read for DefenseEvent.thesis_id and DefenseEvent.room_id, in ascending scheduled_start order (ties broken by created_at ASC)"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: ["thesis_id?", "room_id?", "status?", "limit?", "offset?"]
    output: DefenseEvent[]
    side_effects: []

  - method: GET
    path: "/graduate-school/format-reviews/{id}"
    description: "Read a format review cycle with its score, turnaround and revision deadline"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: FormatReview
    side_effects: []

  - method: GET
    path: "/graduate-school/embargo-requests/{id}"
    description: "Read an embargo request with its approved duration, release date and anchor"
    roles: [Student, FacultyMember, GradSchoolAnalyst, GraduateDean, IntegrityOfficer, Registrar]
    code: 200
    input: []
    output: EmbargoRequest
    side_effects: []

  # ----------------------------------------------------------------- writes
  - method: POST
    path: "/graduate-school/terms"
    description: "Create a graduation term"
    roles: [Registrar]
    code: 201
    input: ["code", "defense_deadline", "format_review_deposit_deadline", "degree_conferral_date", "announcement_lead_business_days?"]
    output: Term
    side_effects: ["Term created in OPEN"]

  - method: POST
    path: "/graduate-school/terms/{id}/close-deposit"
    description: "Close the deposit window; switches every clearance in the term from the PROVISIONAL to the FINAL projection variant"
    roles: [Registrar]
    code: 200
    input: []
    output: Term
    side_effects:
      - "Term.status OPEN -> DEPOSIT_CLOSED"
      - "re-runs calculations.graduation_clearance_projection with the FINAL variant for every clearance in the term, in ascending Thesis.created_at order"
      - "refreshes Student.graduation_clearance_state for each affected student"

  - method: POST
    path: "/graduate-school/terms/{id}/confer-degrees"
    description: "Post degree conferral for every cleared candidate of the term and write transcript notations"
    roles: [Registrar]
    code: 200
    input: []
    output: "{ term_id: string, conferred_count: integer, withheld_count: integer, pending_count: integer }"
    side_effects:
      - "Term.status DEPOSIT_CLOSED -> CONFERRED"
      - "for each Thesis in ascending created_at order: FINAL clearance recompute, then GraduationClearance -> CONFERRED / WITHHELD / unchanged"
      - "Thesis.workflow_state DEPOSITED -> CONFERRED, Student.degree_conferred = true and Student.transcript_notation written for each conferred candidate"
      - "Term.conferred_count set to the number of clearances that reached CONFERRED"

  - method: POST
    path: "/graduate-school/students"
    description: "Register a degree candidate"
    roles: [Registrar]
    code: 201
    input: [full_name, email, degree_level, program_code]
    output: Student
    side_effects: ["Student created with graduation_clearance_state = BLOCKED"]

  - method: POST
    path: "/graduate-school/faculty-members"
    description: "Register a faculty member eligible for committee service"
    roles: [Registrar]
    code: 201
    input: ["full_name", "email", "appointment_type", "graduate_faculty_certified?"]
    output: FacultyMember
    side_effects: ["FacultyMember created with active_chair_load = 0"]

  - method: POST
    path: "/graduate-school/defense-rooms"
    description: "Register a bookable defense room"
    roles: [Registrar]
    code: 201
    input: ["code", "building", "seat_capacity", "turnover_buffer_minutes?", "status?"]
    output: DefenseRoom
    side_effects: ["DefenseRoom created with booked_minutes_total = 0"]

  - method: POST
    path: "/graduate-school/theses"
    description: "Open a thesis or dissertation record for the acting student"
    roles: [Student]
    code: 201
    input: ["student_id", "term_id", "title", "document_type", "page_count", "third_party_item_count?"]
    output: Thesis
    side_effects:
      - "Thesis created in workflow_state DRAFT and integrity_state NOT_SCREENED"
      - "creates the student's GraduationClearance in BLOCKED with projection_variant PROVISIONAL when the student has none yet"

  - method: POST
    path: "/graduate-school/committees"
    description: "Open the committee record for the acting student's thesis"
    roles: [Student]
    code: 201
    input: [thesis_id]
    output: Committee
    side_effects: ["Committee created in DRAFT with member_count 0"]

  - method: POST
    path: "/graduate-school/committees/{id}/members"
    description: "Seat a faculty member on the committee; on an APPROVED committee this revokes the approval and cascades"
    roles: [Student, Registrar]
    code: 201
    input: [faculty_id, role]
    output: CommitteeMember
    side_effects:
      - "CommitteeMember created in CONFIRMED"
      - "recomputes Committee.member_count and Committee.external_member_count"
      - "recomputes FacultyMember.active_chair_load for CHAIR and CO_CHAIR seats"
      - "when the committee was APPROVED: Committee -> SUBMITTED, Thesis -> COMMITTEE_PENDING, every DRAFT/ANNOUNCED DefenseEvent -> CANCELLED, and DefenseRoom.booked_minutes_total recomputed"
      - "recomputes the student's GraduationClearance"

  - method: DELETE
    path: "/graduate-school/committee-members/{id}"
    description: "Release a committee seat (soft delete: the row stays queryable as WITHDRAWN)"
    roles: [Student, Registrar]
    code: 200
    input: ["withdrawal_reason?"]
    output: CommitteeMember
    side_effects:
      - "CommitteeMember.status -> WITHDRAWN"
      - "recomputes Committee.member_count, Committee.external_member_count and FacultyMember.active_chair_load"
      - "when the committee was APPROVED: the same revert cascade as the members endpoint"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/committees/{id}/submit"
    description: "Submit the committee composition for the graduate dean's approval"
    roles: [Student]
    code: 200
    input: []
    output: Committee
    side_effects:
      - "Committee.status {DRAFT, REJECTED} -> SUBMITTED and Thesis.workflow_state DRAFT -> COMMITTEE_PENDING"
      - "recomputes FacultyMember.active_chair_load for CHAIR and CO_CHAIR seats"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/committees/{id}/decision"
    description: "Approve or reject the committee composition"
    roles: [GraduateDean]
    code: 200
    input: ["decision", "rejection_note?"]
    output: Committee
    side_effects:
      - "APPROVE: Committee -> APPROVED with approved_by_user_id and approved_at, Thesis -> COMMITTEE_APPROVED"
      - "REJECT: Committee -> REJECTED with rejection_note, Thesis -> DRAFT, chair loads recomputed"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/defense-events"
    description: "Book a room and schedule the defense; enforces the buffered room predicate and the half-open faculty predicate"
    roles: [Student, GradSchoolAnalyst]
    code: 201
    input: [thesis_id, room_id, scheduled_start, scheduled_end]
    output: DefenseEvent
    side_effects:
      - "DefenseEvent created in DRAFT and Thesis.workflow_state COMMITTEE_APPROVED -> DEFENSE_SCHEDULED"
      - "recomputes DefenseRoom.booked_minutes_total"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/defense-events/{id}/announce"
    description: "Publish the defense announcement; refused when the business-day lead is short"
    roles: [GradSchoolAnalyst]
    code: 200
    input: []
    output: DefenseEvent
    side_effects:
      - "DefenseEvent.status DRAFT -> ANNOUNCED with announced_at and announcement_lead_bdays"
      - "Thesis.workflow_state DEFENSE_SCHEDULED -> DEFENSE_ANNOUNCED"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/defense-events/{id}/outcome"
    description: "Record the committee's defense outcome; the FAIL branch dissolves the committee"
    roles: [FacultyMember]
    code: 200
    input: ["outcome", "outcome_note?"]
    output: DefenseEvent
    side_effects:
      - "PASS: DefenseEvent -> HELD_PASS, Thesis -> DEFENSE_PASSED"
      - "PASS_WITH_REVISIONS: DefenseEvent -> HELD_PASS_WITH_REVISIONS, Thesis -> DEFENSE_PASSED_WITH_REVISIONS"
      - "FAIL: DefenseEvent -> HELD_FAIL, Thesis -> DEFENSE_FAILED, Committee -> DISSOLVED, chair loads recomputed"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/defense-events/{id}/cancel"
    description: "Cancel a scheduled or announced defense and release the room occupation"
    roles: [GradSchoolAnalyst, Student]
    code: 200
    input: [cancellation_reason]
    output: DefenseEvent
    side_effects:
      - "DefenseEvent -> CANCELLED with cancellation_reason"
      - "Thesis.workflow_state {DEFENSE_SCHEDULED, DEFENSE_ANNOUNCED} -> COMMITTEE_APPROVED"
      - "recomputes DefenseRoom.booked_minutes_total and the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/theses/{id}/format-submissions"
    description: "Submit the document for a format review cycle; the same endpoint opens cycle 1 and every revision cycle"
    roles: [Student]
    code: 201
    input: []
    output: FormatReview
    side_effects:
      - "FormatReview created in PENDING_REVIEW with cycle_number = Thesis.format_cycle_count + 1 and opened_at = clock_now"
      - "any REVISIONS_REQUIRED FormatReview for the thesis -> SUPERSEDED"
      - "Thesis.workflow_state -> UNDER_FORMAT_REVIEW and format_cycle_count incremented"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/format-reviews/{id}/decision"
    description: "Record the format analyst's decision with the defect counts that drive the weighted score"
    roles: [GradSchoolAnalyst]
    code: 200
    input: ["decision", "critical_defect_count", "major_defect_count", "minor_defect_count", "review_note?"]
    output: FormatReview
    side_effects:
      - "writes decision, decided_at, decided_by_user_id, the three defect counts, severity_weighted_defect_score and turnaround_bdays"
      - "RETURN_REVISIONS: FormatReview -> REVISIONS_REQUIRED with revision_due_at from calculations.format_revision_window, Thesis -> FORMAT_REVISIONS_REQUIRED"
      - "ACCEPT: FormatReview -> ACCEPTED, Thesis -> FORMAT_ACCEPTED with accepted_at = clock_now"
      - "recomputes Thesis.analyst_turnaround_bdays_total and the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/permission-records"
    description: "Document one third-party item; guarded by optimistic concurrency on the parent thesis"
    roles: [Student]
    code: 201
    input: ["thesis_id", "material_type", "rights_basis", "page_reference", "expected_thesis_version", "excerpt_word_count?", "document_uri?"]
    output: PermissionRecord
    side_effects:
      - "PermissionRecord created in SUBMITTED"
      - "increments Thesis.version by 1 and recomputes Thesis.documented_permission_count"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/permission-records/{id}/review"
    description: "Accept, mark deficient, or waive a copyright permission record"
    roles: [GradSchoolAnalyst]
    code: 200
    input: ["decision", "review_note?"]
    output: PermissionRecord
    side_effects:
      - "PermissionRecord.status -> ACCEPTED | DEFICIENT | WAIVED with reviewed_by_user_id"
      - "recomputes Thesis.documented_permission_count and the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/embargo-requests"
    description: "Request an access embargo; a new request supersedes any undecided one, so it is guarded by optimistic concurrency on the parent thesis"
    roles: [Student]
    code: 201
    input: [thesis_id, reason_code, requested_months, justification, expected_thesis_version]
    output: EmbargoRequest
    side_effects:
      - "EmbargoRequest created in REQUESTED"
      - "every EmbargoRequest for the thesis with status IN {REQUESTED, MORE_INFO_REQUIRED} -> SUPERSEDED"
      - "increments Thesis.version by 1"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/embargo-requests/{id}/decision"
    description: "Dean's embargo ruling: approve in full, approve a shortened duration, deny, or push back for more information"
    roles: [GraduateDean]
    code: 200
    input: ["decision", "approved_months?", "decision_note?"]
    output: EmbargoRequest
    side_effects:
      - "APPROVE: status -> APPROVED with approved_months = requested_months"
      - "PARTIALLY_APPROVE: status -> PARTIALLY_APPROVED with approved_months from the body"
      - "DENY: status -> DENIED with approved_months = 0"
      - "REQUEST_INFO: status -> MORE_INFO_REQUIRED and info_request_count incremented"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/embargo-requests/{id}/supplement"
    description: "Student supplies the additional justification the dean asked for, returning the request to the decision queue"
    roles: [Student]
    code: 200
    input: [justification]
    output: EmbargoRequest
    side_effects: ["EmbargoRequest.status MORE_INFO_REQUIRED -> REQUESTED with the replacement justification"]

  - method: POST
    path: "/graduate-school/integrity-screenings"
    description: "Record a plagiarism screening result; the row auto-resolves to CLEARED or FLAGGED inside this request"
    roles: [GradSchoolAnalyst]
    code: 201
    input: ["thesis_id", "similarity_pct", "excluded_quoted_pct?"]
    output: IntegrityScreening
    side_effects:
      - "IntegrityScreening created, adjusted_similarity_pct computed, auto-transitioned SCREENED -> CLEARED or FLAGGED"
      - "any earlier screening for the thesis with status IN {CLEARED, FLAGGED} -> SUPERSEDED"
      - "Thesis.integrity_state -> SCREEN_CLEARED or SCREEN_FLAGGED"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/integrity-screenings/{id}/action"
    description: "Integrity officer refers a flagged screening, or dismisses / upholds a referral; UPHOLD terminates the thesis and cascades"
    roles: [IntegrityOfficer]
    code: 200
    input: ["action", "resolution_note?"]
    output: IntegrityScreening
    side_effects:
      - "REFER: screening -> REFERRED, Thesis.integrity_state -> UNDER_INTEGRITY_REVIEW"
      - "DISMISS: screening -> DISMISSED, Thesis.integrity_state -> INTEGRITY_CLEARED"
      - "UPHOLD: screening -> UPHELD, Thesis.integrity_state -> INTEGRITY_UPHELD and workflow_state -> TERMINATED, then FormatReview -> VOID and RepositoryDeposit -> WITHDRAWN, then GraduationClearance -> WITHHELD, then the Student mirrors and transcript notation"
      - "recomputes the student's GraduationClearance"

  - method: POST
    path: "/graduate-school/repository-deposits"
    description: "Deposit the accepted document into the institutional repository, assign the handle and metadata, and settle the late fee"
    roles: [GradSchoolAnalyst]
    code: 201
    input: ["thesis_id", "abstract_word_count", "subject_keywords", "late_fee_paid_cents", "requested_access_level?", "advisor_name?", "department_code?"]
    output: RepositoryDeposit
    side_effects:
      - "RepositoryDeposit created in DEPOSITED with handle, deposited_at, metadata_completeness_score, access_level and late_fee_cents"
      - "writes release_date and release_anchor on the governing EmbargoRequest and copies release_date onto RepositoryDeposit.embargo_release_date"
      - "Thesis.workflow_state FORMAT_ACCEPTED -> DEPOSITED"
      - "recomputes the student's GraduationClearance, which becomes CLEARED when no item remains outstanding"

  - method: POST
    path: "/graduate-school/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock every deadline, window and business-day calculation reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [Registrar]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock is set; no entity is mutated and no cascade fires"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the acting role is not listed for the endpoint in §1.5"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong type, illegal enum member, negative count, or pagination limit outside 1..100"
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "the term id in the path or the term_id in the body does not resolve"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "the student id in the path or the student_id in the body does not resolve"
  - id: ERR_FACULTY_NOT_FOUND
    http: 404
    condition: "the faculty id in the path or the faculty_id in the body does not resolve"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "the defense room id in the path or the room_id in the body does not resolve"
  - id: ERR_THESIS_NOT_FOUND
    http: 404
    condition: "the thesis id in the path or the thesis_id in the body does not resolve"
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "the committee id in the path does not resolve"
  - id: ERR_COMMITTEE_MEMBER_NOT_FOUND
    http: 404
    condition: "the committee member id in the path does not resolve"
  - id: ERR_DEFENSE_NOT_FOUND
    http: 404
    condition: "the defense event id in the path does not resolve"
  - id: ERR_FORMAT_REVIEW_NOT_FOUND
    http: 404
    condition: "the format review id in the path does not resolve"
  - id: ERR_EMBARGO_REQUEST_NOT_FOUND
    http: 404
    condition: "the embargo request id in the path does not resolve"
  - id: ERR_PERMISSION_RECORD_NOT_FOUND
    http: 404
    condition: "the permission record id in the path does not resolve"
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "the integrity screening id in the path does not resolve"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an acting Student's X-User-ID is not the student_id of the thesis the request targets"
  - id: ERR_NOT_COMMITTEE_CHAIR
    http: 403
    condition: "an acting FacultyMember is not the CONFIRMED CHAIR of the thesis's APPROVED committee"
  - id: ERR_DUTY_SEGREGATION_VIOLATION
    http: 403
    condition: "the depositing analyst also signed the accepting format review, or the deciding dean also approved the committee"
  - id: ERR_STALE_THESIS_VERSION
    http: 412
    condition: "expected_thesis_version does not equal the current Thesis.version"
  - id: ERR_TERM_DEPOSIT_CLOSED
    http: 409
    condition: "a thesis-side mutation is attempted while the governing Term.status is not OPEN"
  - id: ERR_TERM_STATE_INVALID
    http: 409
    condition: "close-deposit on a term that is not OPEN, or confer-degrees on a term that is not DEPOSIT_CLOSED"
  - id: ERR_THESIS_STATE_INVALID
    http: 409
    condition: "Thesis.workflow_state is not a legal from-state for the requested transition"
  - id: ERR_COMMITTEE_STATE_INVALID
    http: 409
    condition: "Committee.status is not a legal from-state for the requested transition"
  - id: ERR_DEFENSE_STATE_INVALID
    http: 409
    condition: "DefenseEvent.status is not a legal from-state, or an outcome is recorded before the logical clock reaches scheduled_end"
  - id: ERR_FORMAT_REVIEW_STATE_INVALID
    http: 409
    condition: "a decision is recorded on a FormatReview whose status is not PENDING_REVIEW"
  - id: ERR_EMBARGO_STATE_INVALID
    http: 409
    condition: "a decision on an EmbargoRequest that is not REQUESTED, or a supplement on one that is not MORE_INFO_REQUIRED"
  - id: ERR_PERMISSION_RECORD_STATE_INVALID
    http: 409
    condition: "a review decision that is illegal from the record's current status (e.g. DEFICIENT on an already DEFICIENT record, or any review of an ACCEPTED or WAIVED record)"
  - id: ERR_SCREENING_STATE_INVALID
    http: 409
    condition: "an action illegal from the screening's status, or a new screening while a referral for the thesis is REFERRED or UPHELD"
  - id: ERR_SCREENING_REQUIRED
    http: 409
    condition: "format acceptance or deposit attempted while Thesis.integrity_state == NOT_SCREENED"
  - id: ERR_INTEGRITY_HOLD_ACTIVE
    http: 409
    condition: "format acceptance or deposit attempted while Thesis.integrity_state is SCREEN_FLAGGED, UNDER_INTEGRITY_REVIEW or INTEGRITY_UPHELD"
  - id: ERR_DUPLICATE_THESIS_FOR_TERM
    http: 409
    condition: "the student already has a non-terminal thesis in the same term"
  - id: ERR_CHAIR_NOT_ELIGIBLE
    http: 422
    condition: "a CHAIR or CO_CHAIR seat is requested for a faculty member who is not TENURED/TENURE_TRACK, is not graduate-faculty certified, or already carries MAX_CHAIR_LOAD active chair seats"
  - id: ERR_COMMITTEE_SEAT_CONFLICT
    http: 409
    condition: "duplicate CONFIRMED seat for the same faculty member, a second CHAIR or GRADUATE_REPRESENTATIVE seat, or an EXTERNAL_MEMBER seat for a non-EXTERNAL appointment"
  - id: ERR_COMMITTEE_COMPOSITION_INVALID
    http: 422
    condition: "the CONFIRMED composition does not meet the member, external-member, chair or graduate-representative minimums for the document type"
  - id: ERR_ROOM_UNAVAILABLE
    http: 409
    condition: "the room is in MAINTENANCE, or the requested occupation is shorter than 30 or longer than 240 whole minutes"
  - id: ERR_ROOM_BOOKING_CONFLICT
    http: 409
    condition: "the requested occupation is not separated from an existing counted occupation of the same room by at least turnover_buffer_minutes"
  - id: ERR_FACULTY_SCHEDULE_CONFLICT
    http: 409
    condition: "a CONFIRMED committee member is already obligated to a DRAFT or ANNOUNCED defense whose half-open interval overlaps the requested one"
  - id: ERR_DEFENSE_START_IN_PAST
    http: 422
    condition: "scheduled_start is at or before the logical clock"
  - id: ERR_DEFENSE_AFTER_TERM_DEADLINE
    http: 422
    condition: "scheduled_start is after Term.defense_deadline"
  - id: ERR_ANNOUNCEMENT_LEAD_TOO_SHORT
    http: 422
    condition: "business days between the announcement instant and scheduled_start are fewer than Term.announcement_lead_business_days"
  - id: ERR_REVISION_WINDOW_EXPIRED
    http: 409
    condition: "a revision is resubmitted after the REVISIONS_REQUIRED cycle's revision_due_at"
  - id: ERR_DEFECT_SCORE_REQUIRES_REVISIONS
    http: 422
    condition: "ACCEPT is requested while severity_weighted_defect_score >= REVISION_MANDATORY_THRESHOLD (12.00)"
  - id: ERR_PERMISSION_EVIDENCE_MISSING
    http: 422
    condition: "rights_basis == WRITTEN_PERMISSION without a non-empty document_uri"
  - id: ERR_FAIR_USE_LIMIT_EXCEEDED
    http: 422
    condition: "rights_basis == FAIR_USE_ASSERTION with excerpt_word_count above 400"
  - id: ERR_EMBARGO_DURATION_EXCEEDS_CAP
    http: 422
    condition: "requested_months exceeds the (reason_code, degree_level) cap, or a PARTIALLY_APPROVE body approved_months is missing, below 1, or not shorter than requested_months"
  - id: ERR_PERMISSIONS_INCOMPLETE
    http: 422
    condition: "a PermissionRecord for the thesis is still SUBMITTED or DEFICIENT, or documented_permission_count is below third_party_item_count"
  - id: ERR_EMBARGO_UNDECIDED
    http: 409
    condition: "deposit attempted while an EmbargoRequest for the thesis is REQUESTED or MORE_INFO_REQUIRED"
  - id: ERR_DEPOSIT_ALREADY_EXISTS
    http: 409
    condition: "the thesis already has a RepositoryDeposit with status DEPOSITED"
  - id: ERR_METADATA_INCOMPLETE
    http: 422
    condition: "metadata_completeness_score is below 0.85"
  - id: ERR_LATE_FEE_MISMATCH
    http: 402
    condition: "late_fee_paid_cents does not equal the computed deposit_late_fee_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Degree candidate; owns the thesis record, the committee proposal, format submissions, permission documentation and embargo requests"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /graduate-school/theses"
      - "POST /graduate-school/committees"
      - "POST /graduate-school/committees/{id}/submit"
      - "POST /graduate-school/theses/{id}/format-submissions"
      - "POST /graduate-school/permission-records"
      - "POST /graduate-school/embargo-requests"
      - "POST /graduate-school/embargo-requests/{id}/supplement"
    shared_operations:
      - "POST /graduate-school/committees/{id}/members (with Registrar)"
      - "DELETE /graduate-school/committee-members/{id} (with Registrar)"
      - "POST /graduate-school/defense-events (with GradSchoolAnalyst)"
      - "POST /graduate-school/defense-events/{id}/cancel (with GradSchoolAnalyst)"
      - "every GET endpoint"

  - name: FacultyMember
    description: "Committee faculty; the CONFIRMED chair records the defense outcome"
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /graduate-school/defense-events/{id}/outcome"
    shared_operations:
      - "every GET endpoint"

  - name: GradSchoolAnalyst
    description: "Graduate school format analyst; announces defenses, runs format review cycles and plagiarism screenings, reviews permission documentation and performs the repository deposit"
    identity: "opaque"
    exclusive_operations:
      - "POST /graduate-school/defense-events/{id}/announce"
      - "POST /graduate-school/format-reviews/{id}/decision"
      - "POST /graduate-school/permission-records/{id}/review"
      - "POST /graduate-school/integrity-screenings"
      - "POST /graduate-school/repository-deposits"
    shared_operations:
      - "POST /graduate-school/defense-events (with Student)"
      - "POST /graduate-school/defense-events/{id}/cancel (with Student)"
      - "every GET endpoint"

  - name: GraduateDean
    description: "Graduate dean; rules on committee composition and on embargo duration. The dean who approved a committee may not rule on that thesis's embargo."
    identity: "opaque"
    exclusive_operations:
      - "POST /graduate-school/committees/{id}/decision"
      - "POST /graduate-school/embargo-requests/{id}/decision"
    shared_operations:
      - "every GET endpoint"

  - name: IntegrityOfficer
    description: "Research integrity officer; refers flagged screenings and dismisses or upholds referrals"
    identity: "opaque"
    exclusive_operations:
      - "POST /graduate-school/integrity-screenings/{id}/action"
    shared_operations:
      - "every GET endpoint"

  - name: Registrar
    description: "Registrar operations; owns terms, rosters, rooms, the logical clock, the deposit-window close and the conferral posting"
    identity: "opaque"
    exclusive_operations:
      - "POST /graduate-school/terms"
      - "POST /graduate-school/terms/{id}/close-deposit"
      - "POST /graduate-school/terms/{id}/confer-degrees"
      - "POST /graduate-school/students"
      - "POST /graduate-school/faculty-members"
      - "POST /graduate-school/defense-rooms"
      - "POST /graduate-school/_clock/set_current_utc"
    shared_operations:
      - "POST /graduate-school/committees/{id}/members (with Student)"
      - "DELETE /graduate-school/committee-members/{id} (with Student)"
      - "every GET endpoint"
