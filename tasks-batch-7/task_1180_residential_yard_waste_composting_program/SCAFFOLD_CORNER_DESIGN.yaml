            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_b}", season_year: 2026, expected_household_version: "${hh_b_v}" }, as: Resident, as_user_id: "${hh_b}", captures: { sub_b: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_c}", season_year: 2026, expected_household_version: "${hh_c_v}" }, as: Resident, as_user_id: "${hh_c}", captures: { sub_c: $.data.id } }
            - { call: "POST /surge-events", payload: { zone_id: "${zone_u}", event_type: "LEAF_SURGE", service_date: "2026-11-07", capacity_slots: 1, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-11-01T00:00:00Z" }, as: ProgramAdmin, captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: ProgramAdmin }
