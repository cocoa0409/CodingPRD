            - "LOT-B: weighted_complaint_count == 3.00 == MIN_WEIGHTED_COUNT exactly, observed_rate_ppm == 30.00 -> FIRES on the inclusive count boundary"
            - "LOT-D: weighted_complaint_count == 5.00, observed_rate_ppm == 25.00 == THRESHOLD_PPM.LOT exactly -> FIRES on the inclusive rate boundary"
            - "LOT-C: weighted_complaint_count == 2.00, observed_rate_ppm == 50.00 -> does not fire (count below the boundary)"
            - "trigger response: signals_created_count == 2 and memberships_created_count == 7 (3 from LOT-B, 4 from LOT-D)"
            - "no LINE or PLANT signal is emitted: after LOT-B and LOT-D are consumed the remainder is LOT-C alone, weighted 2.00 < 3.00, so the waterfall stops"
            - "GET /trend-signals with scope_level LINE returns total_count 0 and with scope_level PLANT returns total_count 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    rule_summary: "An operation on entity A is permitted or refused purely because of the CURRENT STATE of a different entity B, with both sides of the dependency exercised."
    instances:

      - name: respond_depends_on_production_lot_release_status
        grounds: "§1.2 Complaint TRIAGED -> IN_RESOLUTION precondition 'the linked ProductionLot.release_status is not WITHDRAWN'; §1.4 priority 26 ERR_LOT_WITHDRAWN"
        distinguishing_aspect: "The gating entity is an ANCESTOR reached through the complaint's resolved lot, and the gate is a supply-chain disposition rather than a workflow status. Both sides are shown on two sibling complaints that differ only in which lot they resolved to."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1, SUP1 (TIER_3) and QL1 (QualityLead) exist."
            - "ResponseTemplate T-QUAL is ACTIVE with applies_to_type QUALITY and max_band_allowed S4, and its usage_count is 0."
            - "Two RELEASED lots of the same product exist on line L-01: LOT-W and LOT-R, each with 200000 units_produced."
            - "Two QUALITY Complaints are both TRIAGED at band S4 with responded_at null, one resolved to LOT-W and one resolved to LOT-R; they are otherwise identical."
            - "LOT-W has been moved RELEASED -> HOLD -> WITHDRAWN, while LOT-R is still RELEASED — the only difference between the two sides."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "QL1", full_name: "Quinn Li", role: QUALITY_LEAD, authority_tier: TIER_3 }, captures: { ql1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "LOT-W", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lotw: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "LOT-R", code_date: "2026-07-11T00:00:00Z", units_produced: 200000 }, captures: { lotr: "$.data.id" } }
            - { call: "POST /response-templates", as: CareSupervisor, as_user_id: "${sup1}", payload: { template_code: "T-QUAL", title: "Quality apology", body: "Thanks for letting us know.", applies_to_type: QUALITY, max_band_allowed: S4 }, captures: { tq: "$.data.id" } }
            - { call: "POST /response-templates/${tq}/activate", as: CareSupervisor, as_user_id: "${sup1}", payload: {} }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Two batches tasted stale." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "LOTW" }, captures: { cpw: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "LOTR" }, captures: { cpr: "$.data.id" } }
            - { call: "POST /complaints/${cpw}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Mild." } }
            - { call: "POST /complaints/${cpr}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Mild." } }
            - { call: "POST /production-lots/${lotw}/hold", as: QualityLead, as_user_id: "${ql1}", payload: { reason: "Staling review." } }
            - { call: "POST /production-lots/${lotw}/withdraw", as: QualityLead, as_user_id: "${ql1}", payload: { reason: "Pulled from trade." } }
          trigger:
            - { call: "POST /complaints/${cpw}/respond", as: CareAgent, as_user_id: "${ag1}", payload: { response_template_id: "${tq}" }, captures: { blocked: "$.data.error_id" } }
            - { call: "POST /complaints/${cpr}/respond", as: CareAgent, as_user_id: "${ag1}", payload: { response_template_id: "${tq}" }, captures: { ok_status: "$.data.handling_status", ok_at: "$.data.responded_at" } }
          assert:
            - "both complaints are QUALITY, band \"S4\", TRIAGED, and both use the SAME ACTIVE template whose applies_to_type is QUALITY and max_band_allowed is S4 — the only difference is the lot"
            - "negative side: the LOT-W complaint returns error_id == \"ERR_LOT_WITHDRAWN\" with HTTP 409 and stays TRIAGED with responded_at null"
            - "positive side: the LOT-R complaint (release_status \"RELEASED\") succeeds with handling_status == \"IN_RESOLUTION\" and responded_at == \"2026-08-01T00:00:00Z\""
            - "GET /response-templates/${tq} usage_count == 1 — only the permitted response incremented it"

      - name: remedy_approval_depends_on_sample_kit_status
        grounds: "§1.2 Remedy SUBMITTED -> APPROVED precondition 'the linked SampleKit, if any, is not in REQUESTED, SHIPPED or IN_TRANSIT_INBOUND'; §1.4 priority 31 ERR_SAMPLE_KIT_IN_FLIGHT"
        distinguishing_aspect: "The gating entity is a SIBLING (SampleKit shares the complaint parent, it is not an ancestor of Remedy), and the gate opens by moving the sibling forward rather than by picking a different row — the same remedy is refused and then approved without any change to the remedy itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 and SUP1 (CareSupervisor, TIER_3, high enough for any tier this remedy needs) exist."
            - "Consumer C-1 exists with every goodwill bucket at 0."
            - "One FOREIGN_MATERIAL Complaint with units_claimed 1 on the RELEASED lot A1B-2026-0710 has been triaged and then moved to AWAITING_SAMPLE by the kit request."
            - "SampleKit K-100 on that complaint is in status SHIPPED, i.e. in flight."
            - "One Remedy of remedy_type COUPON with requested_value_cents 2000 on the same complaint is in status SUBMITTED, awaiting a decision."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Something soft in the pack, keeping it for you." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "A1B20260710", foreign_object_class: SOFT, units_claimed: 1 }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Retrieve the sample." } }
            - { call: "POST /sample-kits", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", kit_code: "K-100", seal_id_issued: "SEAL-100" }, captures: { k1: "$.data.id" } }
            - { call: "POST /sample-kits/${k1}/ship", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { k1_status: "$.data.status" } }
            - { call: "GET /complaints/${cp1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { cp1_v: "$.data.version" } }
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: COUPON, requested_value_cents: 2000, expected_complaint_version: "${cp1_v}" }, captures: { rm1: "$.data.id" } }
            - { call: "POST /remedies/${rm1}/submit", as: CareAgent, as_user_id: "${ag1}", payload: { submit_note: "Goodwill coupon while we test the sample." } }
          trigger:
            - { call: "POST /remedies/${rm1}/decide", as: CareSupervisor, as_user_id: "${sup1}", payload: { decision: APPROVE, decision_note: "Approving early." }, captures: { blocked: "$.data.error_id" } }
            - { call: "POST /sample-kits/${k1}/cancel", as: CareSupervisor, as_user_id: "${sup1}", payload: { reason: "Consumer discarded the sample." }, captures: { k_after: "$.data.status" } }
            - { call: "POST /remedies/${rm1}/decide", as: CareSupervisor, as_user_id: "${sup1}", payload: { decision: APPROVE, decision_note: "Kit cancelled, approving now." }, captures: { r_after: "$.data.status" } }
          assert:
            - "the kit is \"SHIPPED\" when the first decision is attempted, so the first decide returns error_id == \"ERR_SAMPLE_KIT_IN_FLIGHT\" with HTTP 409 and the remedy stays \"SUBMITTED\""
            - "after the failed decision GET /consumers/${c1} goodwill_authorized_cents == 0 — no ledger movement from the refusal"
            - "cancel moves the kit to \"CANCELLED\" and the complaint from \"AWAITING_SAMPLE\" to \"IN_RESOLUTION\", with Consumer.open_kit_count back to 0"
            - "the SECOND decide, byte-identical in payload except the note, now succeeds: remedy status == \"APPROVED\", payout_cents == 2200, and GET /consumers/${c1} goodwill_authorized_cents == 2200 with goodwill_outstanding_cents == 2200"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    rule_summary: "Two time intervals compete for the same resource, and the exact endpoint semantics (half-open vs closed) decide whether they collide."
    instances:

      - name: trend_signal_windows_are_half_open_so_adjacency_is_legal
        grounds: "§1.3 trend_signal_evaluation window = [clock - TREND_WINDOW_DAYS, clock) half-open; §1.4 priority 36 ERR_SIGNAL_WINDOW_OVERLAP"
        distinguishing_aspect: "HALF-OPEN interval semantics on an analytical window keyed by scope. The discriminating case is the adjacent pair sharing an instant, which must be ACCEPTED — an implementation using closed intervals rejects it."
        test_recipe:
          setup:
            - "Logical clock is moved to 2026-07-15T00:00:00Z, then 2026-08-05T00:00:00Z, then 2026-08-20T00:00:00Z, so the two complaints land on either side of the 2026-08-01T00:00:00Z instant under test."
            - "Staff AG1 (CareAgent) and QL1 (QualityLead, TIER_3) exist; Consumer C-1 exists."
            - "ProductionLot LOT-T of the non-regulated product SKU-MUG is RELEASED with 100000 units_produced on line L-01 of plant P-CHI."
            - "Complaint A was created at 2026-07-15T00:00:00Z and Complaint B at 2026-08-05T00:00:00Z, both plain FOREIGN_MATERIAL in handling_status INTAKE at band S3 (weight 1) on LOT-T."
            - "No TrendSignal exists yet for any scope, so no prior window can be blamed for a rejection."
