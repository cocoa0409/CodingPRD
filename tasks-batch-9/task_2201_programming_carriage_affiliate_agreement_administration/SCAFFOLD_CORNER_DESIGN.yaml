          - entities.MfnClause.fields.min_peer_subscribers
        excluded_because:
          difficulty_instance: mfn_benchmark_scope_filter_changes_winning_peer
          rationale: >-
            The §1.8 combinatorial_formula instance already holds the peer population
            fixed and flips only mfn_scope and min_peer_subscribers, pinning a
            different winning peer and benchmark_rate_cents for each combination —
            a strictly stronger version of this filtering claim.

      - name: coop_band_threshold_selection
        claim_type: precision
        grounds:
          - calculations.invoice_net_due
          - entities.Invoice.fields.coop_cap_pct
        excluded_because:
          difficulty_instance: coop_band_lower_bound_inclusive_at_five_million_gross
          rationale: >-
            The §1.8 boundary_precision_check instance already pins gross exactly at
            COOP_BAND_1_MAX 5,000,000 and one cent below it, asserting coop_cap_pct
            0.08 versus 0.05 — the inclusive lower bound is the whole content of this
            corner.

