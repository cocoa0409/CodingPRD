# =============================================================================
# §1.9 Scaffold Corner Design — task_3070 Direct Vet Payment
# Breadth probe: every testable claim §1.1–§1.7 declares that §1.8 does not
# already exercise. Corners covered by §1.8 appear as excluded_because stubs.
# Shared setup anchors (&k_*) are defined once under entities and aliased
# throughout; per-instance captures are uniquely named.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: hospital_create_returns_declared_fields_and_applied_state
        claim_type: Creation
        grounds:
          - entities.Hospital
          - endpoints.POST_/vetpay/hospitals
        distinguishing_aspect: "A hospital created with the four required inputs returns 201 with status APPLIED, version 1, running_ledger_balance_cents 0, null training_completed_at, and system-minted id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_hosp
              call: "POST /vetpay/hospitals"
              payload: { legal_name: "Sunset Vet", territory_code: "941", bank_account_ref: "BA-001", checkout_software_version: "1.2.3" }
              as: PlatformAdmin
              captures: { h_id: $.data.id, h_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Hospital.${h_id}.status == APPLIED and version == 1"
            - "Hospital.${h_id}.running_ledger_balance_cents == 0"
            - "Hospital.${h_id}.training_completed_at is null"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: filing_create_defaults_to_draft
        claim_type: Defaults
        grounds:
          - entities.TerritoryRateFiling.fields.status
          - endpoints.POST_/vetpay/rate-filings
        distinguishing_aspect: "A filing created with all required fields starts in DRAFT with null filed_at/effective_at; status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - &k_f1
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "941", state_code: "CA", species: "DOG", base_monthly_premium_cents: 100000, age_band_multipliers: { "0": 1.0, "1": 1.0025 }, filing_effective_date: "2026-09-01", regulator_reference: "CA-2026-001" }
              as: RateFilingAdmin
              captures: { f1_id: $.data.id }
          assert:
            - "TerritoryRateFiling.${f1_id}.status == DRAFT"
            - "TerritoryRateFiling.${f1_id}.filed_at is null and effective_at is null"
            - "TerritoryRateFiling.${f1_id}.version == 1"

      - name: claim_create_zeroes_computed_totals_until_adjudication
        claim_type: Computed Fields
        grounds:
          - entities.Claim.fields.total_invoice_cents
          - entities.Claim.fields.eligible_cents
          - endpoints.POST_/vetpay/claims
        distinguishing_aspect: "At submission the server ignores any client-computed totals and zeroes total_invoice_cents/eligible_cents/deductible_applied_cents/reimbursement_cents/member_responsibility_cents; only adjudication fills them."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; hospital H ACTIVE; policy P past waiting."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - &k_f1_file
              call: "POST /vetpay/rate-filings/${f1_id}/file"
              payload: {}
              as: RateFilingAdmin
            - *k_hosp
            - &k_approve
              call: "POST /vetpay/hospitals/${h_id}/approve"
              payload: { expected_hospital_version: "${h_v}" }
              as: PlatformAdmin
            - &k_train
              call: "POST /vetpay/hospitals/${h_id}/training-complete"
              payload: {}
              as: HospitalStaff
              as_user_id: "${h_id}"
            - &k_pol
              call: "POST /vetpay/policies"
              payload: { owner_name: "Ana Reyes", pet_name: "Miso", species: "DOG", breed: "Shiba", pet_date_of_birth: "2025-09-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { p_id: $.data.id }
            - &k_clock_full
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { c_id: $.data.id, c_v: $.data.version }
          assert:
            - "Claim.${c_id}.status == SUBMITTED and version == 1"
            - "Claim.${c_id}.total_invoice_cents == 0 and eligible_cents == 0 and reimbursement_cents == 0"
            - "Claim.${c_id}.deductible_applied_cents == 0 and member_responsibility_cents == 0"
            - "Claim.${c_id}.payment_id is null and adjudicated_at is null and denial_reason is null"

      - name: policy_create_computes_waiting_windows_and_next_birthday
        claim_type: Computed Fields
        grounds:
          - entities.Policy.fields.injury_waiting_end
          - entities.Policy.fields.illness_waiting_end
          - entities.Policy.fields.next_birthday
        distinguishing_aspect: "Enrollment computes injury_waiting_end = coverage_start + 5d, illness_waiting_end = coverage_start + 14d, next_birthday = the pet's next birthday strictly after coverage_start; none are client-supplied."
        test_recipe:
          setup:
            - "F1 EFFECTIVE for (941, DOG); clock at 2026-09-01."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
          trigger:
            - call: "POST /vetpay/policies"
              payload: { owner_name: "Ana Reyes", pet_name: "Miso", species: "DOG", breed: "Shiba", pet_date_of_birth: "2025-09-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { cp_id: $.data.id }
          assert:
            - "Policy.${cp_id}.injury_waiting_end == 2026-09-06T00:00:00Z"
            - "Policy.${cp_id}.illness_waiting_end == 2026-09-15T00:00:00Z"
            - "Policy.${cp_id}.next_birthday == \"2027-09-01\""
            - "Policy.${cp_id}.enrollment_status == INJURY_WAITING and lifecycle_status == ACTIVE"
            - "Policy.${cp_id}.filed_base_cents == 100000 and current_monthly_premium_cents == 100000"

      - name: hospitals_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/vetpay/hospitals
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two hospitals, limit=1&offset=0 returns 1 row with total_count 2 and has_more true; offset=1 returns the second with has_more false; status=APPLIED filter narrows the set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01; two hospitals registered (both APPLIED), one approved to APPROVED."
          setup_api_calls:
            - *k_clock
            - *k_hosp
            - call: "POST /vetpay/hospitals"
              payload: { legal_name: "North Beach Vet", territory_code: "941", bank_account_ref: "BA-002", checkout_software_version: "1.2.3" }
              as: PlatformAdmin
              captures: { h2_id: $.data.id, h2_v: $.data.version }
            - call: "POST /vetpay/hospitals/${h2_id}/approve"
              payload: { expected_hospital_version: "${h2_v}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /vetpay/hospitals"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "GET /vetpay/hospitals?limit=1&offset=0 returns exactly 1 row with total_count == 2 and has_more == true"
            - "GET /vetpay/hospitals?limit=1&offset=1 returns exactly 1 row with has_more == false"
            - "GET /vetpay/hospitals?status=APPLIED returns exactly 1 row (the unapproved hospital)"
            - "GET /vetpay/hospitals with no parameters returns 2 rows with limit defaulting to 10"

      - name: policy_get_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_POLICY_NOT_FOUND]
          - endpoints.GET_/vetpay/policies/{policyId}
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_POLICY_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /vetpay/policies/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id == ERR_POLICY_NOT_FOUND"

      - name: claim_create_missing_policy_id_rejected
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/vetpay/claims
        distinguishing_aspect: "Omitting required field policy_id returns 400 ERR_INVALID_REQUEST before any existence check runs."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
          trigger:
            - call: "POST /vetpay/claims"
              payload: { hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { mi_err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_INVALID_REQUEST"

      - name: claim_line_invalid_enum_category_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ClaimLine.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A line whose category is not in {TREATMENT, EXAM_FEE, TAX, OTHER_EXCLUDED} fails the whole claim submission with 400 ERR_INVALID_REQUEST; no partial claim is persisted."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
          trigger:
            - call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 50000, category: "SURGERY", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { en_err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /vetpay/claims?policy_id=${p_id} returns 0 rows"

      - name: medical_record_has_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.MedicalRecord
        distinguishing_aspect: "MedicalRecord declares common_fields: false — it carries id and created_at but no version/updated_at and no PUT/PATCH/DELETE endpoint exists for it; the only mutation ever allowed is the server-side appeal_id attachment."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P exists; record MR uploaded."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - &k_rec
              call: "POST /vetpay/policies/${p_id}/medical-records"
              payload: { hospital_id: "${h_id}", record_type: "EXAM", recorded_at: "2026-10-02T09:00:00Z", diagnosis_code: "DXA", notes: "annual" }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { mr0_id: $.data.id }
          trigger:
            - call: "GET /vetpay/policies/${p_id}/medical-records"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "the uploaded record has a non-null id and created_at and NO version or updated_at field"
            - "MedicalRecord.${mr0_id}.appeal_id is null at upload"
            - "the API declares no PUT/PATCH/DELETE route under /vetpay/policies/{id}/medical-records (any attempt returns 404/405)"

      - name: claim_lines_require_existing_claim_parent
        claim_type: Parent Relationships
        grounds:
          - entities.ClaimLine.fields.claim_id
          - endpoints.GET_/vetpay/claims/{claimId}/lines
        distinguishing_aspect: "GET lines for a non-existent claim id returns 404 ERR_CLAIM_NOT_FOUND — the child listing is scoped by a real parent."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /vetpay/claims/11111111-2222-3333-4444-555555555555/lines"
              payload: {}
              as: PlatformAdmin
              captures: { pl_err2: $.data.error_id }
          assert:
            - "the response status is 404 with error_id == ERR_CLAIM_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: hospital_approve_requires_applied_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Hospital.APPLIED_to_APPROVED
          - errors[ERR_HOSPITAL_NOT_APPROVABLE]
        distinguishing_aspect: "Approving an already-APPROVED (or ACTIVE) hospital returns 409 ERR_HOSPITAL_NOT_APPROVABLE — the transition exists only from APPLIED."
        test_recipe:
          setup:
            - "Hospital H created (APPLIED) and approved (APPROVED)."
          setup_api_calls:
            - *k_clock
            - *k_hosp
            - *k_approve
            - &k_hread
              call: "GET /vetpay/hospitals/${h_id}"
              payload: {}
              as: PlatformAdmin
              captures: { h_v2: $.data.version }
          trigger:
            - call: "POST /vetpay/hospitals/${h_id}/approve"
              payload: { expected_hospital_version: "${h_v2}" }
              as: PlatformAdmin
              captures: { ap_err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_HOSPITAL_NOT_APPROVABLE"
            - "Hospital.${h_id}.status remains APPROVED"

      - name: hospital_reinstate_restores_active_from_suspended
        claim_type: valid_transition
        grounds:
          - state_machines.Hospital.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "SUSPENDED -> ACTIVE via reinstate succeeds; claims denied by the suspension stay DENIED (no retroactive reopen)."
        test_recipe:
          setup:
            - "H ACTIVE with one SUBMITTED claim C; H suspended (C auto-DENIED with HOSPITAL_SUSPENDED)."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - &k_suspend
              call: "POST /vetpay/hospitals/${h_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /vetpay/hospitals/${h_id}/reinstate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Hospital.${h_id}.status == ACTIVE after reinstate"
            - "Claim.${c_id}.status remains DENIED with denial_reason == HOSPITAL_SUSPENDED (reinstate does not reopen)"

      - name: claim_deny_from_paid_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Deny exists only from SUBMITTED/PREEXISTING_REVIEW; denying a PAID claim returns 409 ERR_INVALID_STATE and the claim's payment linkage is untouched."
        test_recipe:
          setup:
            - "Full chain to PAID: claim C adjudicated and paid (key KD1)."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - &k_adj
              call: "POST /vetpay/claims/${c_id}/adjudicate"
              payload: { expected_claim_version: "${c_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_pay
              call: "POST /vetpay/claims/${c_id}/checkout-pay"
              payload: { idempotency_key: "KD1" }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { pay1_id: $.data.id }
          trigger:
            - call: "POST /vetpay/claims/${c_id}/deny"
              payload: { denial_reason: "late change of heart" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { dn_err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_INVALID_STATE"
            - "Claim.${c_id}.status remains PAID and payment_id == ${pay1_id}"

      - name: claim_settled_is_terminal_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Claim
        distinguishing_aspect: "From SETTLED every direct claim action (flag-review, clear-review, adjudicate, deny, checkout-pay) is rejected; only the system appeal-overturn reopen path can leave SETTLED."
        test_recipe:
          setup:
            - "Claim C paid (key KD2) then clock advanced 3 days and C read -> SETTLED."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_adj
            - &k_pay2
              call: "POST /vetpay/claims/${c_id}/checkout-pay"
              payload: { idempotency_key: "KD2" }
              as: HospitalStaff
              as_user_id: "${h_id}"
            - &k_clock_settle
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T00:00:00Z" }
              as: PlatformAdmin
            - &k_read_settled
              call: "GET /vetpay/claims/${c_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { c_vs: $.data.version }
          trigger:
            - call: "POST /vetpay/claims/${c_id}/flag-preexisting-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { ts_err: $.data.error_id }
          assert:
            - "Claim.${c_id}.status == SETTLED before the trigger"
            - "flag-preexisting-review returns 409 ERR_INVALID_STATE"
            - "deny, adjudicate (with ${c_vs}), and checkout-pay (new key KD3) each return 409 against the SETTLED claim"

      - name: claim_initial_state_is_submitted
        claim_type: initial_state
        grounds:
          - state_machines.Claim
        distinguishing_aspect: "A freshly created claim is SUBMITTED with version 1 regardless of hospital/policy state."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
          trigger:
            - call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "ILLNESS", lines: [{ description: "labs", amount_cents: 30000, category: "TREATMENT", condition_code: "DXB" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { c2_id: $.data.id }
          assert:
            - "Claim.${c2_id}.status == SUBMITTED and version == 1"

      - name: appeal_upheld_leaves_claim_untouched
        claim_type: valid_transition
        grounds:
          - state_machines.ClaimAppeal
        distinguishing_aspect: "Resolving UPHELD terminates the appeal without touching the underlying claim — a DENIED claim stays DENIED and no payment/reversal rows are created."
        test_recipe:
          setup:
            - "Claim C DENIED by adj-1; appeal A opened by owner."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - &k_deny
              call: "POST /vetpay/claims/${c_id}/deny"
              payload: { denial_reason: "not covered" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_appeal
              call: "POST /vetpay/claims/${c_id}/appeals"
              payload: { reason_code: "COVERAGE_DENIAL" }
              as: PetOwner
              as_user_id: "${p_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /vetpay/appeals/${a_id}/resolve"
              payload: { outcome: "UPHELD", resolution_note: "denial correct" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
          assert:
            - "ClaimAppeal.${a_id}.status == UPHELD"
            - "Claim.${c_id}.status remains DENIED and payment_id is still null"
            - "GET /vetpay/hospitals/${h_id}/payments returns 0 rows"

      - name: appeal_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ClaimAppeal
        distinguishing_aspect: "From UPHELD, request-records, submit-records, and a second resolve are all rejected with 409 ERR_APPEAL_NOT_RESOLVABLE (or ERR_INVALID_STATE) — the appeal is closed."
        test_recipe:
          setup:
            - "Claim C DENIED; appeal A resolved UPHELD."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_deny
            - *k_appeal
            - &k_resolve_up
              call: "POST /vetpay/appeals/${a_id}/resolve"
              payload: { outcome: "UPHELD", resolution_note: "final" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
          trigger:
            - call: "POST /vetpay/appeals/${a_id}/resolve"
              payload: { outcome: "OVERTURNED", resolution_note: "too late" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
              captures: { tl_err: $.data.error_id }
          assert:
            - "the second resolve returns 409 with error_id == ERR_APPEAL_NOT_RESOLVABLE"
            - "ClaimAppeal.${a_id}.status remains UPHELD"

      - name: payment_failure_to_adjudicated_retry_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Claim.ADJUDICATED_to_PAYMENT_FAILED
          - state_machines.Claim.PAYMENT_FAILED_to_ADJUDICATED
        distinguishing_aspect: "A failed checkout (simulate_outcome FAILED) moves the claim to PAYMENT_FAILED with a FAILED/PENDING_POST payment that never touches the ledger; retrying with a new key returns the claim to PAID and marks the failed payment EXCLUDED."
        test_recipe:
          setup:
            - "Claim C adjudicated (reimbursement 27000)."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_adj
          trigger:
            - &k_payfail
              call: "POST /vetpay/claims/${c_id}/checkout-pay"
              payload: { idempotency_key: "KF1", simulate_outcome: "FAILED" }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { pf_id: $.data.id }
            - &k_payretry
              call: "POST /vetpay/claims/${c_id}/checkout-pay"
              payload: { idempotency_key: "KF2" }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { pr_id: $.data.id }
          assert:
            - "after the failed attempt Claim.${c_id}.status == PAYMENT_FAILED and Payment.${pf_id}.status == FAILED with ledger_status == PENDING_POST"
            - "Hospital.${h_id}.running_ledger_balance_cents == 0 after the failure"
            - "after the retry Claim.${c_id}.status == PAID, payment_id == ${pr_id}, and Payment.${pf_id}.ledger_status == EXCLUDED"
            - "Hospital.${h_id}.running_ledger_balance_cents == 27000"

      - name: policy_mark_lapsed_terminal
        claim_type: valid_transition
        grounds:
          - state_machines.Policy
        distinguishing_aspect: "LAPSED is terminal for the lifecycle dimension: cancel and recalculate-premium on a LAPSED policy are rejected, and no clock sweep revives it."
        test_recipe:
          setup:
            - "Policy P ACTIVE, then marked lapsed by PlatformAdmin."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_pol
            - &k_lapse
              call: "POST /vetpay/policies/${p_id}/mark-lapsed"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /vetpay/policies/${p_id}/cancel"
              payload: {}
              as: PetOwner
              as_user_id: "${p_id}"
              captures: { lp_err: $.data.error_id }
          assert:
            - "Policy.${p_id}.lifecycle_status == LAPSED after mark-lapsed"
            - "cancel returns 409 ERR_INVALID_STATE"
            - "recalculate-premium returns 409 ERR_INVALID_STATE"

      - name: filing_file_requires_draft_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TerritoryRateFiling.DRAFT_to_FILED
          - errors[ERR_FILING_NOT_FILABLE]
        distinguishing_aspect: "Filing an already-FILED (or EFFECTIVE) filing returns 409 ERR_FILING_NOT_FILABLE; the transition exists only from DRAFT."
        test_recipe:
          setup:
            - "Filing F created and filed (status FILED)."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
          trigger:
            - call: "POST /vetpay/rate-filings/${f1_id}/file"
              payload: {}
              as: RateFilingAdmin
              captures: { ff_err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_FILING_NOT_FILABLE"
            - "TerritoryRateFiling.${f1_id}.status remains FILED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: adjudication_totals_exclude_exam_and_tax_lines
        claim_type: correct_result
        grounds:
          - calculations.line_categorization_and_eligibility
          - calculations.per_condition_deductible_and_reimbursement
        distinguishing_aspect: "Mixed basket: one EXAM_FEE line (7000) and one TAX line (3000) are excluded from eligibility while two TREATMENT lines on DXA (30000 + 10000, deductible 20000, rate 0.9) reimburse exactly 18000; excluded lines still count toward total_invoice_cents."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P (deductible 20000, rate 0.9) past waiting."
            - "Claim C with lines in order: EXAM_FEE 7000, TREATMENT 30000 DXA, TAX 3000, TREATMENT 10000 DXA."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - &k_mix_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "exam", amount_cents: 7000, category: "EXAM_FEE" }, { description: "surgery", amount_cents: 30000, category: "TREATMENT", condition_code: "DXA" }, { description: "tax", amount_cents: 3000, category: "TAX" }, { description: "meds", amount_cents: 10000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { mc_id: $.data.id, mc_v: $.data.version }
          trigger:
            - call: "POST /vetpay/claims/${mc_id}/adjudicate"
              payload: { expected_claim_version: "${mc_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "Claim.${mc_id}.total_invoice_cents == 50000 (excluded lines included in the invoice total)"
            - "Claim.${mc_id}.eligible_cents == 40000 (only TREATMENT lines)"
            - "Claim.${mc_id}.deductible_applied_cents == 20000 (20000 on line 2, 0 on line 4 — waterfall in seq order)"
            - "Claim.${mc_id}.reimbursement_cents == 18000 (9000 + 9000)"
            - "Claim.${mc_id}.member_responsibility_cents == 32000 (50000 - 18000)"
            - "the EXAM_FEE and TAX lines have eligible_amount_cents == 0 and policy_condition_id null"

      - name: condition_deductive_accumulates_across_claims_lifetime
        claim_type: correct_result
        grounds:
          - entities.PolicyCondition.fields.deductible_accumulated_cents
          - entities.PolicyCondition.fields.lifetime_reimbursed_cents
        distinguishing_aspect: "The per-condition deductible is lifetime, not annual: after claim 1 consumes 20000 of DXA's 20000 target, claim 2 on DXA (in the same chain, any later date) consumes 0 more, and lifetime_reimbursed_cents aggregates across claims with no cap."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P (deductible 20000, rate 0.9) past waiting."
            - "Claim C1: line 50000 DXA adjudicated + paid (KLC1). Claim C2: line 50000 DXA adjudicated + paid (KLC2)."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - &k_lc1
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { lc1_id: $.data.id, lc1_v: $.data.version }
            - &k_lc1_adj
              call: "POST /vetpay/claims/${lc1_id}/adjudicate"
              payload: { expected_claim_version: "${lc1_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_lc1_pay
              call: "POST /vetpay/claims/${lc1_id}/checkout-pay"
              payload: { idempotency_key: "KLC1" }
              as: HospitalStaff
              as_user_id: "${h_id}"
            - &k_lc2
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-09", claim_type: "INJURY", lines: [{ description: "followup", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { lc2_id: $.data.id, lc2_v: $.data.version }
            - &k_lc2_adj
              call: "POST /vetpay/claims/${lc2_id}/adjudicate"
              payload: { expected_claim_version: "${lc2_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_lc2_pay
              call: "POST /vetpay/claims/${lc2_id}/checkout-pay"
              payload: { idempotency_key: "KLC2" }
              as: HospitalStaff
              as_user_id: "${h_id}"
          trigger:
            - call: "GET /vetpay/policies/${p_id}/conditions"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "Claim.${lc1_id}.deductible_applied_cents == 20000 and reimbursement_cents == 27000"
            - "Claim.${lc2_id}.deductible_applied_cents == 0 and reimbursement_cents == 45000 (lifetime deductible already consumed)"
            - "the single PolicyCondition DXA shows deductible_accumulated_cents == 20000 (== target, saturated)"
            - "the single PolicyCondition DXA shows lifetime_reimbursed_cents == 72000 (27000 + 45000, no payout cap)"

      - name: preexisting_boundary_record_on_coverage_start_is_not_preexisting
        claim_type: boundary
        grounds:
          - calculations.preexisting_determination
        distinguishing_aspect: "The pre-existing boundary is strict < coverage_start 00:00:00Z: a record dated exactly 2026-09-01T00:00:00Z does NOT make DXA pre-existing, while the same record at 2026-08-31T23:59:59Z does — tested as two policies differing only in the record timestamp."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; policies P_on (record at exactly coverage_start) and P_before (record one second before), both past waiting, each with an INJURY claim on DXA."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - &k_pol_on
              call: "POST /vetpay/policies"
              payload: { owner_name: "On Boundary", pet_name: "Aki", species: "DOG", breed: "Shiba", pet_date_of_birth: "2024-01-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pon_id: $.data.id }
            - &k_pol_before
              call: "POST /vetpay/policies"
              payload: { owner_name: "Before Boundary", pet_name: "Bo", species: "DOG", breed: "Shiba", pet_date_of_birth: "2024-01-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pbe_id: $.data.id }
            - &k_rec_on
              call: "POST /vetpay/policies/${pon_id}/medical-records"
              payload: { hospital_id: "${h_id}", record_type: "EXAM", recorded_at: "2026-09-01T00:00:00Z", diagnosis_code: "DXA", notes: "exactly at start" }
              as: HospitalStaff
              as_user_id: "${h_id}"
            - &k_rec_before
              call: "POST /vetpay/policies/${pbe_id}/medical-records"
              payload: { hospital_id: "${h_id}", record_type: "EXAM", recorded_at: "2026-08-31T23:59:59Z", diagnosis_code: "DXA", notes: "one second before" }
              as: HospitalStaff
              as_user_id: "${h_id}"
            - *k_clock_full
            - &k_claim_on
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pon_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "tx", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { con_id: $.data.id, con_v: $.data.version }
            - &k_claim_before
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pbe_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "tx", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { cbe_id: $.data.id, cbe_v: $.data.version }
          trigger:
            - &k_adj_on
              call: "POST /vetpay/claims/${con_id}/adjudicate"
              payload: { expected_claim_version: "${con_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_adj_before
              call: "POST /vetpay/claims/${cbe_id}/adjudicate"
              payload: { expected_claim_version: "${cbe_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { pex_err: $.data.error_id }
          assert:
            - "claim on the boundary adjudicates: Claim.${con_id}.status == ADJUDICATED, reimbursement_cents == 27000"
            - "claim one second before the boundary fails: http 422 ERR_PREEXISTING_CONDITION"
            - "Claim.${cbe_id}.status remains SUBMITTED after the rejection"

      - name: dual_variant_and_rounding_instances_stub
        claim_type: variant_divergence
        grounds:
          - calculations.monthly_premium
          - calculations.per_condition_deductible_and_reimbursement
          - calculations.reconciliation_expected_vs_actual
        excluded_because:
          difficulty_instance: dual_variant_calc / premium_enrollment_base_vs_age_band_recalc
          rationale: "Variant divergence, variant selection, and per-line rounding precision are asserted with literals in §1.8 instances premium_enrollment_base_vs_age_band_recalc, reconciliation_expected_vs_actual_ledger, and per_line_rounding_then_sum_diverges."

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected_before_anything
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — priority 1 beats even existence checks on a bogus path id."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /vetpay/policies/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { au_err: $.data.error_id }
          assert:
            - "the same request sent with no X-User-ID/X-User-Role headers returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (NOT 404) — auth precedes existence"

      - name: role_denied_on_exclusive_endpoint
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "ClaimsAdjuster calling the PlatformAdmin-exclusive suspend endpoint returns 403 ERR_UNAUTHORIZED before any state check."
        test_recipe:
          setup:
            - "Hospital H exists (APPLIED)."
          setup_api_calls:
            - *k_clock
            - *k_hosp
          trigger:
            - call: "POST /vetpay/hospitals/${h_id}/suspend"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { ua_err: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_UNAUTHORIZED"
            - "Hospital.${h_id}.status remains APPLIED"

      - name: preexisting_rejection_is_422_after_waiting_passes
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_PREEXISTING_CONDITION]
        distinguishing_aspect: "A claim fully past waiting periods whose TREATMENT line maps to a pre-existing condition fails at priority 7 with 422 ERR_PREEXISTING_CONDITION and stays SUBMITTED — version unchanged so the claim can be denied or re-worked."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P with pre-coverage EXAM record DXA (2026-08-01); clock past waiting; claim C (DXA 50000) submitted."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - &k_rec_pre
              call: "POST /vetpay/policies/${p_id}/medical-records"
              payload: { hospital_id: "${h_id}", record_type: "EXAM", recorded_at: "2026-08-01T09:00:00Z", diagnosis_code: "DXA", notes: "pre-existing signs" }
              as: HospitalStaff
              as_user_id: "${h_id}"
            - *k_clock_full
            - *k_claim
          trigger:
            - call: "POST /vetpay/claims/${c_id}/adjudicate"
              payload: { expected_claim_version: "${c_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { px_err: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_PREEXISTING_CONDITION"
            - "Claim.${c_id}.status remains SUBMITTED and version remains ${c_v}"

      - name: treatment_line_without_condition_code_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONDITION_CODE_REQUIRED]
        distinguishing_aspect: "A TREATMENT line missing condition_code fails the whole submission with 400 ERR_CONDITION_CODE_REQUIRED; no claim row persists."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
          trigger:
            - call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "mystery", amount_cents: 50000, category: "TREATMENT" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { cc_err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id == ERR_CONDITION_CODE_REQUIRED"
            - "GET /vetpay/claims?policy_id=${p_id} returns 0 rows"

      - name: retroactive_rate_filing_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_FILING_RETROACTIVE]
        distinguishing_aspect: "Filing a DRAFT whose filing_effective_date (2026-08-01) precedes the current logical date (2026-09-01) returns 422 ERR_FILING_RETROACTIVE; the filing stays DRAFT."
        test_recipe:
          setup:
            - "Clock at 2026-09-01; filing F_retro created with effective 2026-08-01."
          setup_api_calls:
            - *k_clock
            - &k_fretro
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "100", state_code: "NY", species: "CAT", base_monthly_premium_cents: 80000, age_band_multipliers: { "0": 1.0 }, filing_effective_date: "2026-08-01", regulator_reference: "NY-2026-100" }
              as: RateFilingAdmin
              captures: { fr_id: $.data.id }
          trigger:
            - call: "POST /vetpay/rate-filings/${fr_id}/file"
              payload: {}
              as: RateFilingAdmin
              captures: { fr_err: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_FILING_RETROACTIVE"
            - "TerritoryRateFiling.${fr_id}.status remains DRAFT"

      - name: policy_creation_without_effective_filing_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_RATE_NOT_FILED]
        distinguishing_aspect: "Enrolling in territory 100 / CAT with no EFFECTIVE filing for that key returns 422 ERR_RATE_NOT_FILED — fiscal compliance gate precedes any policy row."
        test_recipe:
          setup:
            - "Clock at 2026-09-01; only a (941, DOG) filing exists."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
          trigger:
            - call: "POST /vetpay/policies"
              payload: { owner_name: "No Rate", pet_name: "Kit", species: "CAT", breed: "Siamese", pet_date_of_birth: "2023-05-01", territory_code: "100", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { nr_err: $.data.error_id }
          assert:
            - "the response status is 422 with error_id == ERR_RATE_NOT_FILED"
            - "GET /vetpay/policies returns 0 rows"

      - name: record_attach_after_window_and_double_attach
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_RECORD_ALREADY_ATTACHED]
        distinguishing_aspect: "A record already attached to appeal A1 cannot be attached to appeal A2: the second submit-records returns 409 ERR_RECORD_ALREADY_ATTACHED and A2 stays RECORDS_REQUESTED."
        test_recipe:
          setup:
            - "Two DENIED claims C1, C2 on the same policy; appeals A1, A2 both RECORDS_REQUESTED; record MR attached to A1."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_deny
            - *k_appeal
            - &k_claim2b
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-03", claim_type: "INJURY", lines: [{ description: "er2", amount_cents: 40000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { c2b_id: $.data.id }
            - &k_deny2
              call: "POST /vetpay/claims/${c2b_id}/deny"
              payload: { denial_reason: "second denial" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_appeal2
              call: "POST /vetpay/claims/${c2b_id}/appeals"
              payload: { reason_code: "CONDITION_DEFINITION" }
              as: PetOwner
              as_user_id: "${p_id}"
              captures: { a2_id: $.data.id }
            - &k_req1
              call: "POST /vetpay/appeals/${a_id}/request-records"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_req2
              call: "POST /vetpay/appeals/${a2_id}/request-records"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - *k_rec
            - &k_sub1
              call: "POST /vetpay/appeals/${a_id}/submit-records"
              payload: { medical_record_ids: ["${mr0_id}"] }
              as: HospitalStaff
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /vetpay/appeals/${a2_id}/submit-records"
              payload: { medical_record_ids: ["${mr0_id}"] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { ra_err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_RECORD_ALREADY_ATTACHED"
            - "ClaimAppeal.${a2_id}.status remains RECORDS_REQUESTED"

      - name: self_resolution_forbidden_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_SELF_RESOLUTION_FORBIDDEN]
        distinguishing_aspect: "The adjuster who denied the claim cannot resolve its appeal: resolve by adj-1 (the denying adjuster) returns 403 ERR_SELF_RESOLUTION_FORBIDDEN while adj-2 succeeds."
        test_recipe:
          setup:
            - "Claim C DENIED by adj-1; appeal A OPEN."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_deny
            - *k_appeal
          trigger:
            - &k_self_resolve
              call: "POST /vetpay/appeals/${a_id}/resolve"
              payload: { outcome: "UPHELD", resolution_note: "i denied it, i confirm it" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { sr_err: $.data.error_id }
            - &k_other_resolve
              call: "POST /vetpay/appeals/${a_id}/resolve"
              payload: { outcome: "UPHELD", resolution_note: "independent review" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
          assert:
            - "the self-resolve returns 403 with error_id == ERR_SELF_RESOLUTION_FORBIDDEN and the appeal stays OPEN"
            - "the independent resolve by adj-2 succeeds: ClaimAppeal.${a_id}.status == UPHELD"

      - name: waiting_period_and_stale_claim_version_stubs
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WAITING_PERIOD_ACTIVE]
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
          - errors[ERR_HOSPITAL_NOT_ACTIVE]
          - errors[ERR_POLICY_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: boundary_precision_check / waiting_period_inclusive_boundary
          rationale: "ERR_WAITING_PERIOD_ACTIVE is asserted (negative side) in the named §1.8 instance; ERR_APPEAL_WINDOW_EXPIRED in appeal_records_window_expiry; ERR_HOSPITAL_NOT_ACTIVE in adjudication_gated_by_hospital_status; ERR_POLICY_NOT_ACTIVE in claim_submission_gated_by_policy_lifecycle."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: occ_adjudicate_stale_version_rejected
        claim_type: action_endpoint
        grounds:
          - concurrency_rules[claim-adjudicate-stale-claim]
          - errors[ERR_STALE_CLAIM_VERSION]
        distinguishing_aspect: "Adjudicate with expected_claim_version one behind the current version (after flag-review bumped it) returns 412 ERR_STALE_CLAIM_VERSION; re-reading and retrying with the fresh version succeeds — the §1.2.1 OCC contract end to end."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting; claim C SUBMITTED at version 1; adjuster flags review (version 2) but holds the stale token 1."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - &k_flag
              call: "POST /vetpay/claims/${c_id}/flag-preexisting-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_read_fresh
              call: "GET /vetpay/claims/${c_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { c_vfresh: $.data.version }
          trigger:
            - &k_occ_stale
              call: "POST /vetpay/claims/${c_id}/adjudicate"
              payload: { expected_claim_version: "${c_vfresh} - 1" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { occ_err: $.data.error_id }
            - &k_occ_clear
              call: "POST /vetpay/claims/${c_id}/clear-preexisting-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_read_fresh2
              call: "GET /vetpay/claims/${c_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { c_vfresh2: $.data.version }
            - &k_occ_ok
              call: "POST /vetpay/claims/${c_id}/adjudicate"
              payload: { expected_claim_version: "${c_vfresh2}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "the stale adjudicate returns 412 with error_id == ERR_STALE_CLAIM_VERSION and the claim stays PREEXISTING_REVIEW"
            - "after clear + re-read, adjudicate with the fresh version succeeds: Claim.${c_id}.status == ADJUDICATED"

      - name: occ_hospital_approve_stale_version_rejected
        claim_type: action_endpoint
        grounds:
          - concurrency_rules[hospital-mutation-stale-hospital]
          - errors[ERR_STALE_HOSPITAL_VERSION]
        distinguishing_aspect: "Two sequential approve attempts where the second carries the pre-approve version: the second gets 412 ERR_STALE_HOSPITAL_VERSION — not a state error — because OCC is evaluated per §1.2.1."
        test_recipe:
          setup:
            - "Hospital H created at version 1; admin reads it (version 1), then approves with version 1 (success, version 2); a second approve replays the stale token 1."
          setup_api_calls:
            - *k_clock
            - *k_hosp
            - *k_approve
          trigger:
            - call: "POST /vetpay/hospitals/${h_id}/approve"
              payload: { expected_hospital_version: "${h_v}" }
              as: PlatformAdmin
              captures: { hoc_err: $.data.error_id }
          assert:
            - "the replayed approve returns 412 with error_id == ERR_STALE_HOSPITAL_VERSION (OCC fires before/instead of the APPLIED-state check)"
            - "Hospital.${h_id}.version == 2 (only the first approve bumped it)"

      - name: claim_list_filters_by_multiple_dimensions
        claim_type: computed_read
        grounds:
          - endpoints.GET_/vetpay/claims
        distinguishing_aspect: "GET /vetpay/claims composes filters: policy_id + status=ADJUDICATED returns exactly the adjudicated claim of that policy; hospital_id + claim_type=ILLNESS returns only illness claims of that hospital."
        test_recipe:
          setup:
            - "Two claims on P: C1 INJURY adjudicated, C2 ILLNESS still SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_adj
            - &k_ill_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-03", claim_type: "ILLNESS", lines: [{ description: "labs", amount_cents: 30000, category: "TREATMENT", condition_code: "DXB" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { ci_id: $.data.id }
          trigger:
            - call: "GET /vetpay/claims"
              payload: { policy_id: "${p_id}", status: "ADJUDICATED" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "GET /vetpay/claims?policy_id=${p_id}&status=ADJUDICATED returns exactly 1 row: ${c_id}"
            - "GET /vetpay/claims?hospital_id=${h_id}&claim_type=ILLNESS returns exactly 1 row: ${ci_id}"
            - "GET /vetpay/claims?status=SUBMITTED returns exactly 1 row"

      - name: appeal_open_requires_denied_or_settled_claim
        claim_type: conditional_action
        grounds:
          - errors[ERR_APPEAL_NOT_OPENABLE]
          - endpoints.POST_/vetpay/claims/{claimId}/appeals
        distinguishing_aspect: "Opening an appeal on a SUBMITTED claim returns 409 ERR_APPEAL_NOT_OPENABLE; the same call succeeds once the claim is DENIED."
        test_recipe:
          setup:
            - "Claim C SUBMITTED (not yet adjudicated or denied)."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
          trigger:
            - call: "POST /vetpay/claims/${c_id}/appeals"
              payload: { reason_code: "COVERAGE_DENIAL" }
              as: PetOwner
              as_user_id: "${p_id}"
              captures: { ao_err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_APPEAL_NOT_OPENABLE"
            - "GET /vetpay/claims/${c_id}/appeals returns 0 rows"

      - name: reconciliation_report_acknowledge_and_dispute_paths
        claim_type: conditional_action
        grounds:
          - entities.ReconciliationReport.fields.status
          - endpoints.POST_/vetpay/reconciliation-reports/{reportId}/acknowledge
        distinguishing_aspect: "A GENERATED report can be acknowledged by PlatformAdmin or disputed by the hospital's staff; both transitions work from GENERATED and the status flips accordingly; acting twice is rejected."
        test_recipe:
          setup:
            - "H ACTIVE with one paid claim; report R generated for the period."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
            - *k_adj
            - *k_pay
            - &k_report
              call: "POST /vetpay/hospitals/${h_id}/reconciliation-reports"
              payload: { period_start: "2026-09-01", period_end: "2026-11-01" }
              as: PlatformAdmin
              captures: { rr_id: $.data.id }
          trigger:
            - &k_ack
              call: "POST /vetpay/reconciliation-reports/${rr_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - &k_dispute_after_ack
              call: "POST /vetpay/reconciliation-reports/${rr_id}/dispute"
              payload: {}
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { rd_err: $.data.error_id }
          assert:
            - "ReconciliationReport.${rr_id}.status == GENERATED before acknowledge"
            - "acknowledge flips status to ACKNOWLEDGED"
            - "dispute on the ACKNOWLEDGED report returns 409 ERR_INVALID_STATE"
            - "ReconciliationReport.${rr_id}.expected_cents == 27000 and actual_cents == 27000"

      - name: claim_lines_seq_order_preserved
        claim_type: computed_read
        grounds:
          - entities.ClaimLine.fields.seq
          - endpoints.GET_/vetpay/claims/{claimId}/lines
        distinguishing_aspect: "Lines come back in submission order with seq 1..N; the deductible waterfall consumes earlier seq first, so line order is observable in deductible_applied_cents."
        test_recipe:
          setup:
            - "Claim with TREATMENT lines 30000 DXA (seq 1) and 10000 DXA (seq 2), deductible 20000."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - &k_seq_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "first", amount_cents: 30000, category: "TREATMENT", condition_code: "DXA" }, { description: "second", amount_cents: 10000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { sq_id: $.data.id, sq_v: $.data.version }
            - &k_seq_adj
              call: "POST /vetpay/claims/${sq_id}/adjudicate"
              payload: { expected_claim_version: "${sq_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "GET /vetpay/claims/${sq_id}/lines"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "the list returns 2 lines with seq 1 and 2 in submission order"
            - "seq 1 line: deductible_applied_cents == 20000, reimbursement_cents == 9000"
            - "seq 2 line: deductible_applied_cents == 0, reimbursement_cents == 9000"

  # ===========================================================================
  - section: errors
    instances:
      - name: stale_version_errors_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_CLAIM_VERSION]
          - errors[ERR_STALE_HOSPITAL_VERSION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_safety_on_adjudicate
          rationale: "412 OCC errors are directly asserted by corner instances occ_adjudicate_stale_version_rejected and occ_hospital_approve_stale_version_rejected in the endpoints section; no §1.8 instance needed."

      - name: error_envelope_shape_on_every_failure
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
        distinguishing_aspect: "Every failure response carries response_type == error and data.error_id/data.message; spot-checked on a 404 (missing claim) and a 403 (wrong role) — the envelope is uniform across http codes."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /vetpay/claims/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { ev_err: $.data.error_id }
          assert:
            - "the 404 response has response_type == \"error\" and non-empty data.error_id == ERR_CLAIM_NOT_FOUND and a non-empty data.message"
            - "meta.api_request_id and meta.api_request_timestamp are present even on error responses"

  # ===========================================================================
  - section: rbac
    instances:
      - name: hospital_staff_cannot_act_for_other_hospital
        claim_type: role_denial
        grounds:
          - roles[HospitalStaff]
          - validations[priority=9]
        distinguishing_aspect: "HospitalStaff identity is entity-backed: staff of H1 submitting a claim naming hospital_id = H2 (or completing training for H2) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "H1 ACTIVE (trained), H2 ACTIVE (trained), P past waiting."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - &k_hosp2
              call: "POST /vetpay/hospitals"
              payload: { legal_name: "North Beach Vet", territory_code: "941", bank_account_ref: "BA-002", checkout_software_version: "1.2.3" }
              as: PlatformAdmin
              captures: { h2b_id: $.data.id, h2b_v: $.data.version }
            - &k_approve2
              call: "POST /vetpay/hospitals/${h2b_id}/approve"
              payload: { expected_hospital_version: "${h2b_v}" }
              as: PlatformAdmin
            - &k_train2
              call: "POST /vetpay/hospitals/${h2b_id}/training-complete"
              payload: {}
              as: HospitalStaff
              as_user_id: "${h2b_id}"
            - *k_pol
            - *k_clock_full
          trigger:
            - call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h2b_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "er", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { xo_err: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_UNAUTHORIZED (staff of ${h_id} may not act for ${h2b_id})"
            - "GET /vetpay/claims?hospital_id=${h2b_id} returns 0 rows"

      - name: pet_owner_cannot_adjudicate_or_touch_other_policy
        claim_type: role_denial
        grounds:
          - roles[PetOwner]
          - roles[ClaimsAdjuster]
        distinguishing_aspect: "PetOwner calling the adjuster-exclusive adjudicate endpoint returns 403; and PetOwner cancelling a policy whose id is not their X-User-ID is likewise 403 — both the role gate and the ownership gate hold."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P1 (owner A) and P2 (owner B) past waiting; claim C on P1 SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - &k_pol_b
              call: "POST /vetpay/policies"
              payload: { owner_name: "Owner B", pet_name: "Zed", species: "DOG", breed: "Beagle", pet_date_of_birth: "2023-01-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pb_id: $.data.id }
            - *k_clock_full
            - *k_claim
          trigger:
            - &k_own_adj
              call: "POST /vetpay/claims/${c_id}/adjudicate"
              payload: { expected_claim_version: "${c_v}" }
              as: PetOwner
              as_user_id: "${p_id}"
              captures: { ro_err: $.data.error_id }
            - &k_cross_cancel
              call: "POST /vetpay/policies/${pb_id}/cancel"
              payload: {}
              as: PetOwner
              as_user_id: "${p_id}"
              captures: { rc_err: $.data.error_id }
          assert:
            - "adjudicate as PetOwner returns 403 ERR_UNAUTHORIZED and Claim.${c_id} stays SUBMITTED"
            - "cancel of ${pb_id} by owner id ${p_id} returns 403 ERR_UNAUTHORIZED and Policy.${pb_id}.lifecycle_status stays ACTIVE"

      - name: rate_filing_admin_cannot_onboard_hospitals
        claim_type: role_denial
        grounds:
          - roles[RateFilingAdmin]
        distinguishing_aspect: "RateFilingAdmin calling POST /vetpay/hospitals (PlatformAdmin-exclusive) returns 403 — peer roles own disjoint resource types."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /vetpay/hospitals"
              payload: { legal_name: "Rogue Vet", territory_code: "941", bank_account_ref: "BA-009", checkout_software_version: "9.9.9" }
              as: RateFilingAdmin
              captures: { rf_err: $.data.error_id }
          assert:
            - "the response status is 403 with error_id == ERR_UNAUTHORIZED"
            - "GET /vetpay/hospitals returns 0 rows"

      - name: self_resolution_segregation_stub
        claim_type: role_denial
        grounds:
          - errors[ERR_SELF_RESOLUTION_FORBIDDEN]
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_overturn_reversal_clawback_ledger_cascade
          rationale: "Segregation-of-duties denial is asserted by validations-section instance self_resolution_forbidden_segregation_of_duties; the §1.8 cascade instance exercises the permitted cross-adjuster path."

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: derived_ledger_reconciles_after_mixed_operations
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Hospital.fields.running_ledger_balance_cents
        distinguishing_aspect: "The derived ledger tracks every mutation path: +27000 (pay), +0 (failed pay), +45000 (second pay), -27000 (appeal clawback) nets 45000, verified by both GET hospital and a fresh reconciliation report."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P (deductible 20000) past waiting."
            - "C1 (50000 DXA): pay KA ok (+27000). C2 (30000 DXB): pay KB fails then retried KC ok (+0 then ... DXB deductible 20000 -> base 10000 -> 9000) (+9000). C3 (50000 DXA): DXA saturated -> 45000 paid KD (+45000). Appeal on C1 OVERTURNED (-27000)."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - &k_dr_c1
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { dr1_id: $.data.id, dr1_v: $.data.version }
            - &k_dr_c1_adj
              call: "POST /vetpay/claims/${dr1_id}/adjudicate"
              payload: { expected_claim_version: "${dr1_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_dr_c1_pay
              call: "POST /vetpay/claims/${dr1_id}/checkout-pay"
              payload: { idempotency_key: "KA" }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { dr1_pay: $.data.id }
            - &k_dr_c2
              call: "POST /vetpay/claims"
              payload: { policy_id: "${p_id}", hospital_id: "${h_id}", visit_date: "2026-10-03", claim_type: "ILLNESS", lines: [{ description: "labs", amount_cents: 30000, category: "TREATMENT", condition_code: "DXB" }] }
              as: HospitalStaff
              as_user_id: "${h_id}"
              captures: { dr2_id: $.data.id, dr2_v: $.data.version }
            - &k_dr_c2_adj
              call: "POST /vetpay/claims/${dr2_id}/adjudicate"
              payload: { expected_claim_version: "${dr2_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &k_dr_c2_fail
