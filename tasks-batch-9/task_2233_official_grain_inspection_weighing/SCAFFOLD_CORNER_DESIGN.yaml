            - "GET /grain-inspection/inspectors/${insp} -> license_status still PROBATIONARY, training_hours_completed 23, performance_score 100 (the 2-point training credit is absorbed by the 100 clamp)"
            - "After a further training record of 1 hour (24 total) the identical activate call -> 200 with license_status ACTIVE"
            - "A second activate call on the now-ACTIVE inspector -> 409 ERR_INVALID_STATE_TRANSITION, not ERR_INSPECTOR_NOT_QUALIFIED: the priority-9 state rule outranks the priority-11 qualification rule"

      - name: certification_expiry_must_be_strictly_in_the_future
