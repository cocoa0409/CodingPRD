          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 3000000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 0
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          ctr: $.data.id
      - call: POST /coe/patients
        payload:
          employer_id: ${emp}
          full_name: Pat U
          dob: '1970-03-03'
          member_id: M-EN6
        as: CareCoordinator
        captures:
          pa: $.data.id
      - call: POST /coe/episodes
        payload:
          patient_id: ${pa}
          contract_id: ${ctr}
          intake_request_id: IR-EN6
        as: CareCoordinator
        captures:
          ep: $.data.id
      - call: POST /coe/episodes/${ep}/screenings
        payload:
          doc_type: LAB
          result: NOT_A_CANDIDATE
        as: CareCoordinator
      trigger:
      - call: GET /coe/episodes/${ep}/screenings
        payload: {}
        as: PhysicianReviewer
      assert:
      - list contains exactly 1 screening with doc_type LAB and result NOT_A_CANDIDATE
      - screening rows expose id and created_at but no version field (append-only)
      - Episode.${ep}.status == CANCELLED (NOT_A_CANDIDATE auto-transition)
  - name: episodes_list_paginates_with_total_count_and_has_more
