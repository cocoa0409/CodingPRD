          - state_machines.EnforcementCase.case_status.NOTICE_ISSUED_to_ADJUDICATED_UPHELD
          - calculations.enforcement_penalty
        distinguishing_aspect: "admin-1 issued the notice, so admin-1's own adjudication is refused with 403 ERR_SEGREGATION_OF_DUTIES and the case stays NOTICE_ISSUED with penalty_cents 0; admin-2 then upholds the same case for exactly 19320 cents (4200 x 4 x 1.00 x 1.15)."
        test_recipe:
          setup:
            - "An UNAUTHORIZED_DISPLAY case with a single IN_STORE line of 4 units is open against a SMALL manufacturer with no prior upheld cases, and admin-1 has issued the notice."
