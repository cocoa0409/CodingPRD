# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, malformed, or unrecognized role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role in X-User-Role is not permitted for this endpoint per §1.5 roles."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource id does not resolve to an existing row."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body-provided FK (station_id, pump_id, plan_id, authorized_entrant_id, etc.) references a non-existent row."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, malformed, enum outside declared set, or violates simple shape constraint."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Action endpoint requested when target entity is not in a permitted source state per §1.2."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version (OCC)."
  - id: ERR_STATION_FROZEN
    http: 409
    condition: "Requested child mutation while parent LiftStation.operational_posture == FROZEN."
  - id: ERR_STATION_EMERGENCY
    http: 409
    condition: "Requested non-critical child mutation while parent LiftStation.operational_posture == EMERGENCY (only SSO lifecycle actions and alarm actions permitted)."
  - id: ERR_FIRM_CAPACITY_VIOLATION
    http: 422
    condition: "Pump transition would leave station with fewer than 1 IN_SERVICE pump."
  - id: ERR_DUPLICATE_STATION_CODE
    http: 422
    condition: "station_code already exists."
  - id: ERR_DUPLICATE_EMPLOYEE_CODE
    http: 422
    condition: "employee_code already exists."
  - id: ERR_DUPLICATE_PLAN_YEAR
    http: 422
    condition: "plan_year already exists."
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 422
    condition: "asset_tag already exists."
  - id: ERR_DUPLICATE_POSITION
    http: 422
    condition: "position_index already used at this station, or out of [1, pump_count]."
  - id: ERR_ZONE_MISMATCH
    http: 422
    condition: "SparePump.compatible_zone != station.service_zone on reserve."
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 422
    condition: "ConfinedSpacePermit roles collide (supervisor == entrant, supervisor == attendant, or entrant == attendant)."
  - id: ERR_INSUFFICIENT_CERTIFICATION
    http: 422
    condition: "Entrant or attendant lacks required CSE_1/CSE_2 certification."
  - id: ERR_GAS_TEST_REQUIRED
    http: 422
    condition: "gas_test_passed == false at ISSUE time."
  - id: ERR_PERMIT_REQUIRED
    http: 422
    condition: "requires_confined_space_entry cleaning lacks ISSUED or ACTIVE permit."
  - id: ERR_PERMIT_EXPIRED
    http: 422
    condition: "Permit activate attempted at or after valid_until."
  - id: ERR_NO_ELIGIBLE_OPERATOR
    http: 422
    condition: "operator_callout_selection returned empty pool (no active, under-capacity, cert-qualified operator)."
  - id: ERR_READING_OUT_OF_ORDER
    http: 422
    condition: "RuntimeReading.recorded_at precedes the prior reading for the pump."
  - id: ERR_TEST_DURATION_TOO_SHORT
    http: 422
    condition: "GeneratorTest duration_minutes below the minimum for test_kind."
  - id: ERR_GREASE_DEPTH_INVALID
    http: 422
    condition: "grease_depth_inches_post >= grease_depth_inches_pre on cleaning completion."
  - id: ERR_REPORT_DEADLINE_MISSED
    http: 422
    condition: "SsoEvent submit attempted after regulator_deadline_at without override_note."
  - id: ERR_SSO_EVENT_OPEN
    http: 422
    condition: "is_sso_related alarm clear attempted while the station has an OPEN SsoEvent."
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "CapitalPlan budget_allocated_usd > budget_total_usd at approve time."
  - id: ERR_PLAN_NOT_SETTLED
    http: 422
    condition: "CapitalPlan lock attempted before 7 days have elapsed since approved_at."
  - id: ERR_PLAN_LOCKED
    http: 409
    condition: "Project reject/cancel attempted while plan.status == LOCKED."
  - id: ERR_NO_PUMPS_TO_ALTERNATE
    http: 422
    condition: "Alternation requested on a station with fewer than 2 IN_SERVICE pumps."
  - id: ERR_VALIDATION_AGGREGATE
    http: 422
    condition: "Aggregate check failed (e.g., plan budget, station capacity)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UtilityAdmin
    description: "Top-level administrator. Can create stations, operators, spare pumps; freeze stations; approve capital plans; drive the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /lift-station-ops/stations"
      - "POST /lift-station-ops/stations/{id}/freeze"
      - "POST /lift-station-ops/stations/{id}/unfreeze"
      - "POST /lift-station-ops/operators"
      - "POST /lift-station-ops/capital-plans/{id}/approve"
      - "POST /lift-station-ops/capital-plans/{id}/lock"
      - "POST /lift-station-ops/spare-pumps/{id}/retire"
      - "POST /lift-station-ops/_clock/set_current_utc"
      - "POST /lift-station-ops/_clock/tick"
    shared_operations:
      - "GET most read endpoints"
      - "POST /lift-station-ops/pumps"
      - "POST /lift-station-ops/stations/{id}/alarm-tickets"
      - "POST /lift-station-ops/stations/{id}/sso-events"
      - "POST /lift-station-ops/spare-pumps"
      - "POST /lift-station-ops/pumps/alternate"
      - "POST /lift-station-ops/pumps/{id}/runtime-readings"

  - name: OperationsSupervisor
    description: "Shift supervisor; can move pumps between IN_SERVICE/STANDBY/OUT_OF_SERVICE, cancel alarm tickets and cleanings/tests, run alternation."
    identity: opaque
    exclusive_operations:
      - "POST /lift-station-ops/pumps/{id}/standby"
      - "POST /lift-station-ops/pumps/{id}/activate"
      - "POST /lift-station-ops/pumps/{id}/mark-out-of-service"
