# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2307_hand_tool_manufacturing
#
# 9 rule_ids x 2 instances = 18 instances. Every numeric literal in an `assert:`
# line was produced by executing the corresponding §1.3 `formula:` with its
# `constants:` in Decimal arithmetic (ROUND_HALF_UP), not estimated.
# The logical clock starts at 2026-08-01T00:00:00Z; every fixture date is at or
# after that instant unless the instance deliberately rewinds the clock.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: lot_hardness_pooled_vs_sample_divergence
        grounds:
          - calculations.lot_hardness_index
          - entities.ProductionLot.fields.hardness_index_sample
          - entities.ProductionLot.fields.hardness_index_pooled
          - state_machines.ProductionLot.cert_status.IN_TEST_to_CERTIFIED
          - validations[priority=513]
        distinguishing_aspect: |
          The two variants of lot_hardness_index diverge on the ProductionLot
          metallurgical domain: SAMPLE_MEAN rounds each run to one decimal and
          averages the runs with equal weight (51.50), while POOLED averages the
          raw readings so a 9-specimen run outweighs a 1-specimen run (52.70).
          The certify gate consumes POOLED only, so the same lot certifies at a
          52.5 threshold under POOLED and would be refused under SAMPLE_MEAN.
        test_recipe:
          setup:
            - "One PROFESSIONAL WRENCH SKU, 17 mm, CR_MO alloy, LIFETIME warranty; its computed proof_torque_required_nm is 128.1."
            - "One furnace qualified for CR_MO and one salt-spray chamber."
            - "One ProductionLot on that SKU with specimen_pool_total 40, heat-treated via a COMPLETED campaign and advanced all the way to ASSEMBLED (cert_status IN_TEST, disposition IN_PROCESS)."
            - "Two PASSED HARDNESS runs on the lot: run A with 1 specimen reading 50.0, run B with 9 specimens each reading 53.0."
            - "PASSED PROOF_TORQUE, DIMENSIONAL and SALT_SPRAY runs so every mandatory WRENCH test is satisfied and no run is FAILED."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-PRO", tool_family: "WRENCH", channel: "PROFESSIONAL", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 4200, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id, req_nm: $.data.proof_torque_required_nm }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_V", "CR_MO", "S2"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/salt-spray-chambers"
              payload: { chamber_code: "SSC-1", coupon_capacity: 24 }
              as: QualityEngineer
              captures: { chamber_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-PRO-A", unit_count: 500, specimen_pool_total: 40 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "ASSEMBLED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 1, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { hard_a_id: $.data.id }
            - call: "POST /toolworks/test-runs/${hard_a_id}/results"
              payload: { readings: [50.0] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 9, window_start: "2026-08-03T09:30:00Z", window_end: "2026-08-03T10:30:00Z" }
              as: QualityEngineer
              captures: { hard_b_id: $.data.id }
            - call: "POST /toolworks/test-runs/${hard_b_id}/results"
              payload: { readings: [53.0, 53.0, 53.0, 53.0, 53.0, 53.0, 53.0, 53.0, 53.0] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "PROOF_TORQUE", specimen_count: 2, window_start: "2026-08-03T11:00:00Z", window_end: "2026-08-03T12:00:00Z" }
              as: QualityEngineer
              captures: { torque_id: $.data.id }
            - call: "POST /toolworks/test-runs/${torque_id}/results"
              payload: { readings: [140.0, 141.0] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "DIMENSIONAL", specimen_count: 3, window_start: "2026-08-03T13:00:00Z", window_end: "2026-08-03T14:00:00Z" }
              as: QualityEngineer
              captures: { dim_id: $.data.id }
            - call: "POST /toolworks/test-runs/${dim_id}/results"
              payload: { readings: [0.04, -0.05, 0.03] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "SALT_SPRAY", specimen_count: 2, chamber_id: "${chamber_id}", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }
              as: QualityEngineer
              captures: { salt_id: $.data.id }
            - call: "POST /toolworks/test-runs/${salt_id}/results"
              payload: { readings: [180.0, 192.0] }
              as: QualityEngineer
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/certify"
              payload: {}
              as: QualityEngineer
              captures: { cert_state: $.data.cert_status }
          assert:
            - "ToolSku.${sku_id}.proof_torque_required_nm == 128.1"
            - "ProductionLot.${lot_id}.hardness_index_sample == 51.50"
            - "ProductionLot.${lot_id}.hardness_index_pooled == 52.70"
            - "ProductionLot.${lot_id}.hardness_index_sample != ProductionLot.${lot_id}.hardness_index_pooled"
            - "ProductionLot.${lot_id}.cert_status == CERTIFIED (POOLED 52.70 >= 50.0 + 2.5 = 52.5; SAMPLE_MEAN 51.50 would have failed the same gate)"
            - "TestRun.${hard_a_id}.status == PASSED and TestRun.${hard_a_id}.result_margin_pct == 0.00"
            - "TestRun.${hard_b_id}.result_margin_pct == 6.00"
            - "TestRun.${torque_id}.result_margin_pct == 9.29"
            - "TestRun.${dim_id}.result_margin_pct == 66.67"
            - "TestRun.${salt_id}.result_margin_pct == 7.14"
            - "ProductionLot.${lot_id}.specimens_consumed == 17 and ProductionLot.${lot_id}.specimens_available == 23"

      - name: claimant_fraud_intake_vs_adjudication_divergence
        grounds:
          - calculations.claimant_fraud_score
          - entities.Claimant.fields.fraud_risk_score_intake
          - entities.Claimant.fields.fraud_risk_score_adjudication
          - entities.WarrantyClaim.fields.fraud_score_at_intake
          - state_machines.WarrantyClaim.SUBMITTED_to_FRAUD_HOLD
        distinguishing_aspect: |
          The two variants of claimant_fraud_score diverge on the Claimant
          anti-fraud domain — a different entity domain from the metallurgical
          lot_hardness_index instance. INTAKE applies a rolling
          CLAIM_WINDOW_DAYS=365 window against the logical clock and drops the
          claim filed 2025-06-01, scoring 18; ADJUDICATION has no window at all
          and counts all three claims, scoring 27.
        test_recipe:
          setup:
            - "One BRANDED PLIER SKU with warranty_tier LIFETIME (no lot or test data is needed because no approval occurs)."
            - "One WarrantyProgram with fraud_score_threshold 60 so that neither 18 nor 27 triggers an intake auto-hold."
            - "One CONSUMER Claimant with three SUBMITTED claims on distinct serial codes, created at 2025-06-01, 2026-03-01 and 2026-08-01 by rewinding and advancing the logical clock."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "PL-10-BR", tool_family: "PLIER", channel: "BRANDED", nominal_size_mm: 10, alloy_grade: "S2", list_price_cents: 2400, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2025-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-A", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_a_id: $.data.id }
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-B", claim_reason: "MECHANISM_FAILURE" }
              as: WarrantyAdministrator
              captures: { claim_b_id: $.data.id }
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-C", claim_reason: "CORROSION" }
              as: WarrantyAdministrator
              captures: { claim_c_id: $.data.id, intake_score: $.data.fraud_score_at_intake }
            - call: "POST /toolworks/warranty-claims/${claim_c_id}/hold"
              payload: { hold_reason: "MANUAL_REVIEW" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
          assert:
            - "WarrantyClaim.${claim_c_id}.fraud_score_at_intake == 18"
            - "Claimant.${claimant_id}.fraud_risk_score_intake == 18 (SN-A at 2025-06-01 falls outside the 365-day window ending 2026-08-01)"
            - "Claimant.${claimant_id}.fraud_risk_score_adjudication == 27 (all three claims counted; no window applied)"
            - "Claimant.${claimant_id}.fraud_risk_score_intake != Claimant.${claimant_id}.fraud_risk_score_adjudication"
            - "Claimant.${claimant_id}.lifetime_claim_count == 3"
            - "WarrantyClaim.${claim_c_id}.status == FRAUD_HOLD and WarrantyClaim.${claim_c_id}.held_by_user_id == 'wa-1'"
            - "WarrantyClaim.${claim_a_id}.status == SUBMITTED and WarrantyClaim.${claim_b_id}.status == SUBMITTED"

  - rule_id: combinatorial_formula
    instances:

      - name: claim_reserve_per_line_rounding_order
        grounds:
          - calculations.claim_reserve_charge
          - entities.ClaimLine.fields.line_reserve_cents
          - entities.WarrantyClaim.fields.reserve_charge_cents
          - entities.WarrantyClaim.fields.replacement_unit_count
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding order. Each of the three
          component lines is rounded to whole cents BEFORE summation:
          681 + 1611 + 1404 = 3696. The forbidden order sums the extended prices
          first (1099 + 2599 + 2265 = 5963) and rounds once
          (5963 * 0.62 * 1.00 = 3697.06 -> 3697), landing exactly one cent high.
          The correct answer is therefore 3696 and never 3697.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with warranty_tier LIFETIME, giving CHANNEL_RESERVE_PCT 0.62 and WARRANTY_TIER_FACTOR 1.00."
            - "One WarrantyProgram with fraud_score_threshold 60 and a fully funded reserve."
            - "One CONSUMER Claimant with one SUBMITTED claim carrying two lines already: HANDLE 1099 x1 and HEAD 2599 x1."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-0001", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
              captures: { line1_id: $.data.id, line1_reserve: $.data.line_reserve_cents }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HEAD", component_list_price_cents: 2599, quantity: 1 }
              as: WarrantyAdministrator
              captures: { line2_id: $.data.id, line2_reserve: $.data.line_reserve_cents }
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "PIN", component_list_price_cents: 755, quantity: 3 }
              as: WarrantyAdministrator
              captures: { line3_id: $.data.id, line3_reserve: $.data.line_reserve_cents }
          assert:
            - "ClaimLine.${line1_id}.line_reserve_cents == 681"
            - "ClaimLine.${line2_id}.line_reserve_cents == 1611"
            - "ClaimLine.${line3_id}.line_reserve_cents == 1404"
            - "WarrantyClaim.${claim_id}.reserve_charge_cents == 3696"
            - "WarrantyClaim.${claim_id}.reserve_charge_cents != 3697 (the sum-then-round order is rejected)"
            - "WarrantyClaim.${claim_id}.replacement_unit_count == 5"
            - "WarrantyClaim.${claim_id}.line_count == 3"

      - name: security_pack_surcharge_tier_keyed_on_presurcharge_subtotal
        grounds:
          - calculations.pack_pricing
          - entities.PackConfiguration.fields.member_subtotal_cents
          - entities.PackConfiguration.fields.security_surcharge_cents
          - entities.PackConfiguration.fields.pack_total_cents
          - state_machines.PackConfiguration.DRAFT_to_APPROVED
          - validations[priority=922]
        distinguishing_aspect: |
          Combinatorial mode (c) — a circular-looking dependency between the
          security surcharge and the pack total, resolved by a pinned evaluation
          order. The tier is keyed on the PRE-surcharge member_subtotal_cents
          19800 (<= 20000 -> flat 700), giving pack_total_cents 20500; keying it
          on pack_total_cents would push 20500 past the 20000 break into the 4%
          band and yield 20620. This is a different combinatorial mode from the
          per-line rounding-order instance.
          Approval additionally requires each member SKU to own a CERTIFIED lot,
          so the pack price is only observable after the full certification chain.
          Only whole certification makes the pack pricing observable.
          Members must all share one channel and the hero SKU must be among them.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO, list_price_cents 3300, with a CERTIFIED ProductionLot behind it and warranty_posture OPEN."
            - "One DRAFT SECURITY PackConfiguration whose primary_sku_id is that SKU and whose single member line is that SKU at quantity 6, giving line_extended_cents 19800."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_V", "CR_MO", "S2"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/salt-spray-chambers"
              payload: { chamber_code: "SSC-1", coupon_capacity: 24 }
              as: QualityEngineer
              captures: { chamber_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 40 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "ASSEMBLED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { hard_id: $.data.id }
            - call: "POST /toolworks/test-runs/${hard_id}/results"
              payload: { readings: [52.0, 53.0] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "PROOF_TORQUE", specimen_count: 2, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }
              as: QualityEngineer
              captures: { torque_id: $.data.id }
            - call: "POST /toolworks/test-runs/${torque_id}/results"
              payload: { readings: [130.0, 128.5] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "DIMENSIONAL", specimen_count: 3, window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T13:00:00Z" }
              as: QualityEngineer
              captures: { dim_id: $.data.id }
            - call: "POST /toolworks/test-runs/${dim_id}/results"
              payload: { readings: [0.04, -0.06, 0.10] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "SALT_SPRAY", specimen_count: 2, chamber_id: "${chamber_id}", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: QualityEngineer
              captures: { salt_id: $.data.id }
            - call: "POST /toolworks/test-runs/${salt_id}/results"
              payload: { readings: [120.0, 144.0] }
              as: QualityEngineer
            - call: "POST /toolworks/production-lots/${lot_id}/certify"
              payload: {}
              as: QualityEngineer
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-SEC-1", pack_type: "SECURITY", primary_sku_id: "${sku_id}" }
              as: ChannelManager
              captures: { pack_id: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack_id}/members"
              payload: { sku_id: "${sku_id}", quantity: 6 }
              as: ChannelManager
              captures: { member1_id: $.data.id, member1_line: $.data.line_extended_cents }
          trigger:
            - call: "POST /toolworks/pack-configurations/${pack_id}/approve"
              payload: {}
              as: ChannelManager
          assert:
            - "PackMember.${member1_id}.line_extended_cents == 19800"
            - "PackConfiguration.${pack_id}.member_subtotal_cents == 19800"
            - "PackConfiguration.${pack_id}.security_surcharge_cents == 700"
            - "PackConfiguration.${pack_id}.pack_total_cents == 20500"
            - "PackConfiguration.${pack_id}.pack_total_cents != 20620 (the tier is not keyed on the post-surcharge total)"
            - "PackConfiguration.${pack_id}.distinct_member_count == 1"
            - "PackConfiguration.${pack_id}.status == APPROVED"
            - "ProductionLot.${lot_id}.cert_status == CERTIFIED and ProductionLot.${lot_id}.hardness_index_pooled == 52.50"

  - rule_id: non_linear_state_machine
    instances:

      - name: lot_parallel_process_and_cert_dimensions_with_rework_cycle
        grounds:
          - state_machines.ProductionLot.cert_status.IN_TEST_to_REJECTED
          - state_machines.ProductionLot.cert_status.REJECTED_to_DRAFT
          - state_machines.ProductionLot.disposition.QUARANTINED_to_IN_PROCESS
          - entities.ProductionLot.fields.process_status
          - entities.ProductionLot.fields.rework_cycle_count
          - validations[priority=520]
        distinguishing_aspect: |
          ProductionLot carries three independent state dimensions that move on
          different triggers, and the rework transition is a genuine cycle that
          moves process_status BACKWARDS from ASSEMBLED to MACHINED while
          cert_status returns REJECTED -> DRAFT and disposition returns
          QUARANTINED -> IN_PROCESS in the same call, clearing the pooled
          hardness index. No linear reading of any single dimension predicts the
          resulting (MACHINED, DRAFT, IN_PROCESS) triple.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO, proof_torque_required_nm 115.8."
            - "One ProductionLot with specimen_pool_total 40, heat-treated and advanced to ASSEMBLED so cert_status is IN_TEST and disposition IN_PROCESS."
            - "One PASSED HARDNESS run (2 specimens at 52.0 / 53.0) that set hardness_index_pooled to 52.50."
            - "A second mandatory HARDNESS run whose readings 40.0 / 41.0 fail the CR_MO minimum of 50.0, driving cert_status to REJECTED and disposition to QUARANTINED while process_status stays ASSEMBLED."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 40 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "ASSEMBLED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { hard_ok_id: $.data.id }
            - call: "POST /toolworks/test-runs/${hard_ok_id}/results"
              payload: { readings: [52.0, 53.0] }
              as: QualityEngineer
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }
              as: QualityEngineer
              captures: { hard_bad_id: $.data.id }
            - call: "POST /toolworks/test-runs/${hard_bad_id}/results"
              payload: { readings: [40.0, 41.0] }
              as: QualityEngineer
              captures: { bad_status: $.data.status, bad_margin: $.data.result_margin_pct }
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/rework"
              payload: { rework_note: "Regrind flats and re-temper the batch" }
              as: ProductionPlanner
          assert:
            - "TestRun.${hard_bad_id}.status == FAILED and TestRun.${hard_bad_id}.result_margin_pct == -19.00"
            - "ProductionLot.${lot_id}.process_status == MACHINED (regressed from ASSEMBLED by the rework cycle)"
            - "ProductionLot.${lot_id}.cert_status == DRAFT"
            - "ProductionLot.${lot_id}.disposition == IN_PROCESS"
            - "ProductionLot.${lot_id}.rework_cycle_count == 1"
            - "ProductionLot.${lot_id}.hardness_index_pooled == null and ProductionLot.${lot_id}.hardness_index_sample == null"
            - "ProductionLot.${lot_id}.specimens_consumed == 4 and ProductionLot.${lot_id}.specimens_available == 36"

      - name: claim_fraud_hold_cycle_back_to_submitted
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_FRAUD_HOLD
          - state_machines.WarrantyClaim.FRAUD_HOLD_to_SUBMITTED
          - state_machines.WarrantyClaim.FRAUD_HOLD_to_DENIED_FRAUD
          - entities.WarrantyClaim.fields.fraud_cleared
          - entities.WarrantyProgram.fields.open_hold_count
        distinguishing_aspect: |
          WarrantyClaim is non-linear on a different entity in a different way:
          SUBMITTED -> FRAUD_HOLD -> SUBMITTED is a re-enterable cycle that can
          be traversed twice, and the exit from FRAUD_HOLD branches into
          DENIED_FRAUD, a terminal state distinct from the DENIED reachable from
          SUBMITTED. The programme's open_hold_count must return to 0 in the
          middle of the cycle and back to 1 on re-entry, so the counter tracks
          the cycle rather than the number of hold events.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with warranty_tier LIFETIME."
            - "One WarrantyProgram with fraud_score_threshold 60 and reserve_funded_cents 5000000, so the intake score of 9 does not auto-hold."
            - "One CONSUMER Claimant with one SUBMITTED claim carrying one line (HANDLE 1099 x1, line_reserve_cents 681)."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-0001", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/hold"
              payload: { hold_reason: "SERIAL_PATTERN_REVIEW" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { held_by_first: $.data.held_by_user_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/clear-hold"
              payload: { clearance_note: "Serial verified against production records" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { cleared_status: $.data.status }
            - call: "POST /toolworks/warranty-claims/${claim_id}/hold"
              payload: { hold_reason: "SECOND_REVIEW" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
            - call: "POST /toolworks/warranty-claims/${claim_id}/deny-fraud"
              payload: { denial_code: "FRAUD_CONFIRMED" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
          assert:
            - "After the first hold: WarrantyClaim.${claim_id}.status == FRAUD_HOLD, held_by_user_id == 'wa-1', WarrantyProgram.${prog_id}.open_hold_count == 1"
            - "After clear-hold: WarrantyClaim.${claim_id}.status == SUBMITTED, fraud_cleared == true, hold_reason == null, held_by_user_id RETAINED as 'wa-1' (segregation of duties still bars wa-1 from approving), WarrantyProgram.${prog_id}.open_hold_count == 0"
            - "After the second hold: WarrantyClaim.${claim_id}.status == FRAUD_HOLD, held_by_user_id == 'bp-1', WarrantyProgram.${prog_id}.open_hold_count == 1"
            - "After deny-fraud: WarrantyClaim.${claim_id}.status == DENIED_FRAUD (not DENIED), WarrantyProgram.${prog_id}.open_hold_count == 0"
            - "WarrantyProgram.${prog_id}.reserve_balance_cents == 5000000 throughout (no approval occurred)"
            - "WarrantyClaim.${claim_id}.reserve_charge_cents == 681"

  - rule_id: transitive_cascade
    instances:

      - name: counterfeit_confirm_cascades_to_claim_fraud_hold
        grounds:
          - state_machines.CounterfeitReport.OPEN_to_CONFIRMED
          - calculations.brand_risk_rollup
          - entities.ToolSku.fields.warranty_posture
          - entities.WarrantyClaim.fields.hold_reason
          - calculations.claimant_fraud_score
          - entities.WarrantyProgram.fields.open_hold_count
        distinguishing_aspect: |
          A five-link chain fired by POST /toolworks/counterfeit-reports/{id}/confirm:
          (1) report OPEN -> CONFIRMED, (2) ToolSku.brand_risk_score recomputed to
          50 and confirmed_counterfeit_count to 1, (3) warranty_posture re-derived
          to RESTRICTED, (4) the SUBMITTED WarrantyClaim on that SKU forced to
          FRAUD_HOLD with hold_reason COUNTERFEIT_POSTURE and the programme's
          open_hold_count incremented, (5) the Claimant's ADJUDICATION fraud score
          recomputed to 34 because the COUNTERFEIT_LINK_PENALTY of 25 now applies.
          The trigger endpoint and the entity families it crosses are entirely
          different from the test-failure cascade instance.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU (CHANNEL_EXPOSURE 1.0) with warranty_posture OPEN and brand_risk_score 0."
            - "One WarrantyProgram with fraud_score_threshold 60 so the intake score of 9 leaves the claim SUBMITTED."
            - "One CONSUMER Claimant with one SUBMITTED claim on that SKU carrying one line."
            - "One OPEN CounterfeitReport on that SKU with evidence_grade STRONG and unit_estimate 600, whose frozen risk_points are 50."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-0001", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "OpenBazaar", seller_handle: "torque_deals_99", evidence_grade: "STRONG", unit_estimate: 600 }
              as: BrandProtectionAnalyst
              captures: { report_id: $.data.id, report_points: $.data.risk_points }
          trigger:
            - call: "POST /toolworks/counterfeit-reports/${report_id}/confirm"
              payload: { confirmation_note: "Laser-etch spacing and hardness both off spec" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
          assert:
            - "CounterfeitReport.${report_id}.risk_points == 50"
            - "CounterfeitReport.${report_id}.status == CONFIRMED"
            - "ToolSku.${sku_id}.brand_risk_score == 50"
            - "ToolSku.${sku_id}.confirmed_counterfeit_count == 1"
            - "ToolSku.${sku_id}.warranty_posture == RESTRICTED"
            - "WarrantyClaim.${claim_id}.status == FRAUD_HOLD"
            - "WarrantyClaim.${claim_id}.hold_reason == 'COUNTERFEIT_POSTURE'"
            - "WarrantyClaim.${claim_id}.held_by_user_id == null (system-driven hold, not attributable to bp-1)"
            - "WarrantyProgram.${prog_id}.open_hold_count == 1"
            - "Claimant.${claimant_id}.fraud_risk_score_adjudication == 34"
            - "WarrantyProgram.${prog_id}.reserve_balance_cents == 5000000 (a hold moves no money)"

      - name: mandatory_test_failure_cascades_to_campaign_release
        grounds:
          - state_machines.TestRun.SCHEDULED_to_FAILED
          - state_machines.TestRun.SCHEDULED_to_VOID
          - state_machines.FurnaceCampaign.SCHEDULED_to_RELEASED
          - state_machines.ProductionLot.disposition.IN_PROCESS_to_QUARANTINED
          - calculations.specimen_ledger
          - entities.TestRun.fields.void_reason
        distinguishing_aspect: |
          A three-link chain fired by a completely different endpoint,
          POST /toolworks/test-runs/{id}/results, and crossing a different set of
          entities: (1) the mandatory PROOF_TORQUE run FAILS, (2) the lot flips to
          cert_status REJECTED and disposition QUARANTINED, (3) the lot's other
          SCHEDULED FurnaceCampaign is RELEASED, freeing its furnace window, and
          its sibling SCHEDULED DIMENSIONAL run is VOIDed with void_reason
          CASCADE_LOT_REJECTED, returning its 3 specimens to the pool.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO, so the lot's pinned proof_torque_required_nm is 115.8."
            - "One ProductionLot with specimen_pool_total 40, heat-treated by campaign C1 (COMPLETED) and advanced to ASSEMBLED."
            - "A second campaign C2 on the same furnace, still SCHEDULED for 2026-08-05T06:00Z-10:00Z."
            - "A SCHEDULED DIMENSIONAL run holding 3 committed specimens."
            - "A SCHEDULED PROOF_TORQUE run holding 2 committed specimens."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 40 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp1_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp1_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "ASSEMBLED" }
              as: ProductionPlanner
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp2_id: $.data.id }
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "DIMENSIONAL", specimen_count: 3, window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T13:00:00Z" }
              as: QualityEngineer
              captures: { dim_id: $.data.id }
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "PROOF_TORQUE", specimen_count: 2, window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T15:00:00Z" }
              as: QualityEngineer
              captures: { torque_id: $.data.id }
          trigger:
            - call: "POST /toolworks/test-runs/${torque_id}/results"
              payload: { readings: [100.0, 110.0] }
              as: QualityEngineer
              captures: { torque_status: $.data.status, torque_margin: $.data.result_margin_pct }
          assert:
            - "TestRun.${torque_id}.status == FAILED, governing_statistic == 100.0, requirement_value == 115.8, result_margin_pct == -13.64"
            - "ProductionLot.${lot_id}.cert_status == REJECTED"
            - "ProductionLot.${lot_id}.disposition == QUARANTINED"
            - "ProductionLot.${lot_id}.process_status == ASSEMBLED (the process dimension is untouched by the cascade)"
            - "FurnaceCampaign.${camp2_id}.status == RELEASED"
            - "FurnaceCampaign.${camp1_id}.status == COMPLETED (already-completed campaigns are not released)"
            - "TestRun.${dim_id}.status == VOID and TestRun.${dim_id}.void_reason == 'CASCADE_LOT_REJECTED'"
            - "ProductionLot.${lot_id}.specimens_available == 38"
            - "ProductionLot.${lot_id}.specimens_committed == 0"
            - "ProductionLot.${lot_id}.specimens_consumed == 2"
            - "ProductionLot.${lot_id}.specimen_pool_total == 38 + 0 + 2 == 40"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: claim_state_beats_reserve_fiscal
        grounds:
          - validations[priority=407]
          - validations[priority=800]
          - errors[ERR_CLAIM_STATE_INVALID]
          - errors[ERR_RESERVE_INSUFFICIENT]
        distinguishing_aspect: |
          Category pair state (priority 407) versus business_fiscal (priority 800)
          on POST /toolworks/warranty-claims/{id}/approve. A claim sitting in
          FRAUD_HOLD whose reserve_charge_cents 681 also exceeds the programme's
          reserve_balance_cents 500 violates both rows; the response is
          ERR_CLAIM_STATE_INVALID (409) and never ERR_RESERVE_INSUFFICIENT (402).
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with warranty_tier LIFETIME."
            - "One WarrantyProgram funded with only 500 cents and fraud_score_threshold 60."
            - "One CONSUMER Claimant with one claim carrying a single line (HANDLE 1099 x1) whose reserve_charge_cents is 681, i.e. above the 500-cent balance."
            - "That claim is in FRAUD_HOLD, placed manually by user wa-1, so program.open_hold_count is 1 and the programme version has been bumped."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-THIN", reserve_funded_cents: 500, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-0001", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
            - call: "POST /toolworks/warranty-claims/${claim_id}/hold"
              payload: { hold_reason: "MANUAL_REVIEW" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_CLAIM_STATE_INVALID'"
            - "error_id != 'ERR_RESERVE_INSUFFICIENT' (the fiscal rule at priority 800 never runs)"
            - "WarrantyClaim.${claim_id}.status == FRAUD_HOLD (unchanged)"
            - "WarrantyClaim.${claim_id}.reserve_charge_cents == 681"
            - "WarrantyProgram.${prog_id}.reserve_balance_cents == 500 (unchanged)"
            - "ToolSku.${sku_id}.units_reserved == 0"

      - name: campaign_alloy_safety_beats_window_temporal
        grounds:
          - validations[priority=500]
          - validations[priority=600]
          - errors[ERR_ALLOY_NOT_SUPPORTED]
          - errors[ERR_FURNACE_WINDOW_CONFLICT]
          - calculations.furnace_window_occupancy
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_safety
          (priority 500) versus business_temporal (priority 600) on
          POST /toolworks/furnace-campaigns. The request both charges an S2 lot
          into a CR_V-only furnace and lands at 10:20Z inside the 10:45Z buffered
          end of an existing campaign; the metallurgical rule wins, returning
          ERR_ALLOY_NOT_SUPPORTED (422) rather than ERR_FURNACE_WINDOW_CONFLICT (409).
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU in CR_V and one PRIVATE_LABEL PLIER SKU in S2."
            - "One furnace FCE-CRV qualified for CR_V only, max_charge_kg 900, status AVAILABLE."
            - "One lot L1 on the CR_V SKU with a SCHEDULED campaign occupying 2026-08-02T06:00Z-10:00Z, whose buffered_end is 2026-08-02T10:45Z."
            - "One lot L2 on the S2 SKU, still FORGED / DRAFT / IN_PROCESS."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-CRV", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_V", list_price_cents: 2900, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_crv_id: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "PL-10-S2", tool_family: "PLIER", channel: "PRIVATE_LABEL", nominal_size_mm: 10, alloy_grade: "S2", list_price_cents: 1800, warranty_tier: "LIMITED_5Y" }
              as: ChannelManager
              captures: { sku_s2_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-CRV", max_charge_kg: 900, alloy_grades_supported: ["CR_V"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_crv_id}", lot_code: "LOT-CRV-1", unit_count: 400, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot1_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot1_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
