# =============================================================================
# SCAFFOLD.yaml — Municipal Marina & Mooring Permit (public)
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# =============================================================================

scenario: |
  848. Municipal Marina & Mooring Permit (public): slip/mooring inventory & waitlist,
  resident vs non-resident fee, seasonal permit & lottery, vessel registration & pump-out
  compliance, liveaboard limit, transfer & derelict-vessel, launch-ramp pass, billing

domain_name: marina-mooring-permit
api_prefix: /marina

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite berth pool competed for via waitlist + lottery
  secondary_archetype: compliance_audit        # registration, pump-out, liveaboard cap, derelict enforcement
  complexity_layers:
    - optimistic_concurrency                   # OCC on Permit.version for berth reassignment (supersede)
    - cascading_side_effects                   # derelict impound → revoke → berth release → waitlist offer
    - selector_policy                          # waitlist promotion + lottery draw (deterministic ranking)
    - rate_threshold_triggers                  # liveaboard cap, pump-out interval boundaries

  entity_topology: flat                        # peer entities linked by FK fields; routes are flat under /marina
  state_machine_shape: branching               # Permit ACTIVE<->SUSPENDED cycle; DerelictReport / LotteryEntry / Invoice branch
  relationship_patterns:
    - one_to_many                              # Boater->Vessel, Marina->Berth, LotteryRound->LotteryEntry
    - cross_aggregate                          # Permit references Marina, Boater, Vessel, Berth across aggregates
    - polymorphic                              # Invoice.reference_id points at Permit | RampPass | DerelictReport
  role_model: peer_roles                       # Harbormaster (operations) vs FinanceClerk (billing) vs Boater (self-service)
  consistency_model: immediate

  difficulty: Expert
  entity_count: 11
  endpoint_count: 42
  state_machine_count: 7
  calculation_count: 8
  error_code_count: 27

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Marina
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Marina display name" }
      - { name: season_start_date, type: datetime, source: input, description: "First day of the operating season (inclusive), ISO date" }
      - { name: season_end_date, type: datetime, source: input, description: "Last day of the operating season (inclusive), ISO date" }
      - { name: liveaboard_cap, type: integer, source: input, description: "Maximum number of ACTIVE liveaboard permits allowed at one time", constraints: ">= 0" }
      - { name: pumpout_interval_days, type: integer, source: input, default: 30, description: "Max days a vessel with a holding tank may go between pump-outs before OVERDUE" }
      - { name: available_slip_count, type: integer, source: computed, description: "Count of Berth rows with berth_type=SLIP and status=AVAILABLE" }
      - { name: occupied_slip_count, type: integer, source: computed, description: "Count of Berth rows with berth_type=SLIP and status=OCCUPIED" }
      - { name: available_mooring_count, type: integer, source: computed, description: "Count of Berth rows with berth_type=MOORING and status=AVAILABLE" }
      - { name: occupied_mooring_count, type: integer, source: computed, description: "Count of Berth rows with berth_type=MOORING and status=OCCUPIED" }
      - { name: liveaboard_count, type: integer, source: computed, description: "Count of Permit rows with status=ACTIVE and is_liveaboard=true for this marina" }
      - { name: waitlist_length, type: integer, source: computed, description: "Count of Permit rows with status=WAITLISTED for this marina" }

  - name: Berth
    parent: null
    common_fields: true
    fields:
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id" }
      - { name: berth_type, type: enum, source: input, description: "SLIP | MOORING", constraints: "one of {SLIP, MOORING}" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE", constraints: "one of {SMALL, MEDIUM, LARGE}" }
      - { name: max_length_ft, type: integer, source: input, description: "Longest vessel length (feet) this berth accepts" }
      - { name: resident_only, type: boolean, source: input, default: false, description: "When true only RESIDENT boaters may be permitted here" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | OCCUPIED | OUT_OF_SERVICE", default: "AVAILABLE", constraints: "one of {AVAILABLE, RESERVED, OCCUPIED, OUT_OF_SERVICE}" }
      - { name: current_permit_id, type: string, source: computed, description: "id of the Permit currently holding this berth (RESERVED or OCCUPIED); null when AVAILABLE/OUT_OF_SERVICE. Not an ownership FK." }

  - name: Boater
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Boater full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: residency_status, type: enum, source: input, description: "RESIDENT | NON_RESIDENT — drives fee_basis and priority_tier", constraints: "one of {RESIDENT, NON_RESIDENT}" }
      - { name: street_address, type: string, source: input, default: null, description: "Mailing address (optional)" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE — the only account state in v1 (set at registration; no suspension path is exposed)", default: "ACTIVE", constraints: "one of {ACTIVE}" }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: boater_id, type: string, source: input, description: "FK -> Boater.id" }
      - { name: name, type: string, source: input, description: "Vessel name" }
      - { name: length_ft, type: integer, source: input, description: "Registered length overall in whole feet" }
      - { name: registration_number, type: string, source: input, description: "State/municipal registration number" }
      - { name: registration_expiry_date, type: datetime, source: input, description: "ISO date; registration_status is EXPIRED once the logical clock is strictly after this date" }
      - { name: has_holding_tank, type: boolean, source: input, description: "Whether the vessel has a marine sanitation holding tank subject to pump-out rules" }
      - { name: last_pumpout_date, type: datetime, source: computed, description: "Date of the most recent PumpOutRecord for this vessel by pumpout_date desc; null if none" }
      - { name: registration_status, type: enum, source: computed, description: "REGISTERED | EXPIRED | REVOKED. REGISTERED while clock <= registration_expiry_date and not revoked; EXPIRED when clock > registration_expiry_date; REVOKED after a derelict impound", constraints: "one of {REGISTERED, EXPIRED, REVOKED}" }
      - { name: pumpout_status, type: enum, source: computed, description: "COMPLIANT | OVERDUE | NA. NA when has_holding_tank=false; else OVERDUE when days_since_last_pumpout > marina.pumpout_interval_days, COMPLIANT otherwise", constraints: "one of {COMPLIANT, OVERDUE, NA}" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id" }
      - { name: boater_id, type: string, source: input, description: "FK -> Boater.id" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: berth_id, type: string, source: system, description: "FK -> Berth.id; null while WAITLISTED, set when OFFERED/ACTIVE/SUSPENDED" }
      - { name: requested_berth_type, type: enum, source: input, description: "SLIP | MOORING requested", constraints: "one of {SLIP, MOORING}" }
      - { name: requested_size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE requested", constraints: "one of {SMALL, MEDIUM, LARGE}" }
      - { name: season_year, type: integer, source: input, description: "Season year the permit is for" }
      - { name: season_start_date, type: datetime, source: system, description: "Copied from marina.season_start_date at creation" }
      - { name: season_end_date, type: datetime, source: system, description: "Copied from marina.season_end_date at creation" }
      - { name: is_liveaboard, type: boolean, source: input, default: false, description: "Whether the boater intends to live aboard; counts against marina.liveaboard_cap" }
      - { name: source, type: enum, source: system, description: "DIRECT | WAITLIST | LOTTERY | TRANSFER — how the permit was created", constraints: "one of {DIRECT, WAITLIST, LOTTERY, TRANSFER}" }
      - { name: fee_basis, type: enum, source: computed, description: "RESIDENT | NON_RESIDENT — copied from the boater's residency_status at creation", constraints: "one of {RESIDENT, NON_RESIDENT}" }
      - { name: priority_tier, type: integer, source: computed, description: "0 when fee_basis=RESIDENT, 1 when NON_RESIDENT — lower wins waitlist/lottery ranking" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Full-season fee computed by permit_fee (provisional variant) at offer time" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Prorated fee computed by permit_fee (final variant) at activation; null until ACTIVE" }
      - { name: activated_on_date, type: datetime, source: system, description: "Logical-clock date when the permit became ACTIVE; null until then" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Deadline for paying an OFFERED permit's invoice before the offer lapses; null unless OFFERED" }
      - { name: invoice_id, type: string, source: computed, description: "id of the current Invoice for this permit; null while WAITLISTED. Not an ownership FK." }
      - { name: status, type: enum, source: system, description: "WAITLISTED | OFFERED | ACTIVE | SUSPENDED | EXPIRED | REVOKED | TRANSFERRED | CANCELLED | DECLINED", default: "WAITLISTED", constraints: "one of {WAITLISTED, OFFERED, ACTIVE, SUSPENDED, EXPIRED, REVOKED, TRANSFERRED, CANCELLED, DECLINED}" }

  - name: PumpOutRecord
    parent: null
    common_fields: false
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: pumpout_date, type: datetime, source: input, description: "ISO date the pump-out was performed" }
      - { name: recorded_by_role, type: string, source: system, description: "Role that logged the record (Boater or Harbormaster)" }

  - name: DerelictReport
    parent: null
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: reason, type: string, source: input, description: "Free-text reason the vessel is reported derelict/abandoned" }
      - { name: status, type: enum, source: system, description: "OPEN | NOTICE_SERVED | RESOLVED | IMPOUNDED", default: "OPEN", constraints: "one of {OPEN, NOTICE_SERVED, RESOLVED, IMPOUNDED}" }
      - { name: notice_served_date, type: datetime, source: system, description: "Logical-clock date the notice was served; null until NOTICE_SERVED" }
      - { name: closed_date, type: datetime, source: system, description: "Logical-clock date the report was closed (RESOLVED or IMPOUNDED); null until closed" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "derelict_cost estimated variant, set at serve-notice" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "derelict_cost actual variant, set at impound; null unless IMPOUNDED" }
      - { name: invoice_id, type: string, source: computed, description: "id of the DERELICT Invoice billed to the vessel's owner; null until NOTICE_SERVED. Not an ownership FK." }

  - name: RampPass
    parent: null
    common_fields: true
    fields:
      - { name: boater_id, type: string, source: input, description: "FK -> Boater.id" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: pass_type, type: enum, source: input, description: "DAY | SEASONAL", constraints: "one of {DAY, SEASONAL}" }
      - { name: valid_from_date, type: datetime, source: input, description: "ISO date the pass becomes valid (inclusive)" }
      - { name: valid_to_date, type: datetime, source: input, description: "ISO date the pass stops being valid (inclusive)" }
      - { name: fee_basis, type: enum, source: computed, description: "RESIDENT | NON_RESIDENT copied from boater at creation", constraints: "one of {RESIDENT, NON_RESIDENT}" }
      - { name: fee_cents, type: integer, source: computed, description: "ramp_pass_fee output" }
      - { name: invoice_id, type: string, source: computed, description: "id of the RAMP_PASS Invoice. Not an ownership FK." }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", default: "ACTIVE", constraints: "one of {ACTIVE, EXPIRED, REVOKED}" }

  - name: LotteryRound
    parent: null
    common_fields: true
    fields:
      - { name: marina_id, type: string, source: input, description: "FK -> Marina.id" }
      - { name: season_year, type: integer, source: input, description: "Season year this round allocates" }
      - { name: berth_type, type: enum, source: input, description: "SLIP | MOORING that this round allocates", constraints: "one of {SLIP, MOORING}" }
      - { name: entry_open_date, type: datetime, source: input, description: "ISO date entries open (inclusive)" }
      - { name: entry_close_date, type: datetime, source: input, description: "ISO date entries close (inclusive); after this, no new entries" }
      - { name: berth_ids, type: array, source: input, description: "Ordered list of Berth ids offered in this round; winners are assigned in this list order" }
      - { name: status, type: enum, source: system, description: "OPEN | DRAWN | CLOSED", default: "OPEN", constraints: "one of {OPEN, DRAWN, CLOSED}" }
      - { name: drawn_on_date, type: datetime, source: system, description: "Logical-clock date of the draw; null until DRAWN" }

  - name: LotteryEntry
    parent: null
    common_fields: true
    fields:
      - { name: round_id, type: string, source: input, description: "FK -> LotteryRound.id" }
      - { name: boater_id, type: string, source: input, description: "FK -> Boater.id" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: draw_number, type: integer, source: system, description: "Sequential 1-based ordinal assigned at entry within the round by created_at ascending; deterministic ordering input, never random" }
      - { name: priority_tier, type: integer, source: computed, description: "0 RESIDENT / 1 NON_RESIDENT copied from boater; lower ranks first" }
      - { name: awarded_berth_id, type: string, source: system, description: "Berth id awarded when WON; null otherwise. Not an ownership FK." }
      - { name: claim_deadline, type: datetime, source: system, description: "Logical-clock date by which a WON entry must be claimed; null unless WON" }
      - { name: permit_id, type: string, source: computed, description: "id of the Permit created when the entry is CLAIMED; null otherwise. Not an ownership FK." }
      - { name: status, type: enum, source: system, description: "ENTERED | WON | LOST | CLAIMED | FORFEITED", default: "ENTERED", constraints: "one of {ENTERED, WON, LOST, CLAIMED, FORFEITED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: boater_id, type: string, source: input, description: "FK -> Boater.id (party billed)" }
      - { name: invoice_type, type: enum, source: system, description: "PERMIT | RAMP_PASS | DERELICT | TRANSFER", constraints: "one of {PERMIT, RAMP_PASS, DERELICT, TRANSFER}" }
      - { name: reference_id, type: string, source: system, description: "Polymorphic id of the Permit | RampPass | DerelictReport this invoice bills for; resolved together with invoice_type. Not a single-target ownership FK." }
      - { name: amount_due_cents, type: integer, source: system, description: "Amount charged when the invoice was issued" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Cumulative cents paid against this invoice" }
      - { name: amount_refunded_cents, type: integer, source: computed, description: "Cumulative cents refunded against this invoice" }
      - { name: due_date, type: datetime, source: system, description: "ISO date payment is due" }
      - { name: status, type: enum, source: system, description: "UNPAID | PAID | PARTIALLY_REFUNDED | REFUNDED | VOID | WAIVED", default: "UNPAID", constraints: "one of {UNPAID, PAID, PARTIALLY_REFUNDED, REFUNDED, VOID, WAIVED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Permit
    field: status
    initial_state: WAITLISTED
    terminal_states: [EXPIRED, REVOKED, TRANSFERRED, CANCELLED, DECLINED]
    note: "ACTIVE<->SUSPENDED is a cycle (pump-out compliance). Offer/waitlist promotion is system-driven off berth release."
    transitions:
      - from: "(none)"
        to: WAITLISTED
        trigger: "POST /marina/permits (no matching AVAILABLE berth free at creation)"
        actor: "Boater or Harbormaster"
        preconditions:
          - "Vessel.registration_status == REGISTERED"
          - "Vessel.length_ft <= requested size_class capacity policy (no immediate berth needed here)"
        side_effects:
          - "fee_basis/priority_tier copied from boater; season dates copied from marina"
          - "marina.waitlist_length recomputed (+1)"
      - from: "(none)"
        to: OFFERED
        trigger: "POST /marina/permits (a matching AVAILABLE berth exists and applicant is immediately assignable)"
        actor: "Boater or Harbormaster"
        preconditions:
          - "Vessel.registration_status == REGISTERED"
          - "Exists Berth with marina_id, berth_type==requested_berth_type, size_class==requested_size_class, status==AVAILABLE, max_length_ft >= Vessel.length_ft, and (resident_only==false OR boater.residency_status==RESIDENT)"
        side_effects:
          - "berth_id set; Berth.status AVAILABLE -> RESERVED; Berth.current_permit_id set"
          - "permit_fee provisional variant computed -> provisional_fee_cents"
          - "PERMIT Invoice issued for provisional_fee_cents (status UNPAID); invoice_id set"
          - "offer_expires_at set (clock + OFFER_TTL_DAYS)"
      - from: WAITLISTED
        to: OFFERED
        trigger: "system (a matching Berth becomes AVAILABLE via revoke/expire/decline/transfer-out and this permit is the ranked winner) OR POST /marina/marinas/{marina_id}/run-maintenance"
        actor: system
        preconditions:
          - "This permit is selected by waitlist_promotion (see §1.3): lowest priority_tier then earliest created_at among eligible WAITLISTED permits whose requested_berth_type/size_class match the freed berth and Vessel.length_ft <= berth.max_length_ft and (berth.resident_only==false OR RESIDENT)"
        side_effects:
          - "berth_id set to freed berth; Berth.status AVAILABLE -> RESERVED; Berth.current_permit_id set"
          - "permit_fee provisional variant computed; PERMIT Invoice issued (UNPAID); offer_expires_at set"
          - "marina.waitlist_length recomputed (-1)"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /marina/permits/{permit_id}/cancel"
        actor: "Boater (owner) or Harbormaster"
        preconditions: []
        side_effects:
          - "marina.waitlist_length recomputed (-1)"
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /marina/invoices/{invoice_id}/pay (the permit's PERMIT invoice reaches PAID)"
        actor: "Boater (owner), FinanceClerk, or Harbormaster"
        preconditions:
          - "Berth.status == RESERVED for this permit"
          - "Vessel.registration_status == REGISTERED (cross-entity: Permit depends on Vessel)"
          - "If is_liveaboard: marina.liveaboard_count < marina.liveaboard_cap (boundary: reject when >=)"
          - "No season overlap: no other ACTIVE/OFFERED/SUSPENDED permit occupies berth_id with an overlapping [season_start,season_end) interval (half-open; adjacency allowed)"
        side_effects:
          - "Berth.status RESERVED -> OCCUPIED"
          - "permit_fee final variant computed at activated_on_date -> final_fee_cents (prorated, per-component rounding)"
          - "Invoice reconciled: amount_refunded_cents += (provisional_fee_cents - final_fee_cents) when positive; status PAID or PARTIALLY_REFUNDED"
          - "activated_on_date set to clock; offer_expires_at cleared"
          - "marina.occupied_slip_count/occupied_mooring_count recomputed (+1); if is_liveaboard marina.liveaboard_count (+1)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /marina/permits/{permit_id}/cancel"
        actor: "Boater (owner) or Harbormaster"
        preconditions: []
        side_effects:
          - "Berth.status RESERVED -> AVAILABLE; Berth.current_permit_id cleared"
          - "PERMIT Invoice status -> VOID"
          - "CASCADE: freed berth triggers waitlist_promotion -> next ranked WAITLISTED permit (if any) WAITLISTED -> OFFERED"
      - from: OFFERED
        to: DECLINED
        trigger: "system (offer_expires_at passed) via POST /marina/marinas/{marina_id}/run-maintenance"
        actor: system
        preconditions:
          - "clock > offer_expires_at"
        side_effects:
          - "Berth.status RESERVED -> AVAILABLE; Berth.current_permit_id cleared; PERMIT Invoice -> VOID"
          - "CASCADE: freed berth triggers waitlist_promotion (next ranked WAITLISTED -> OFFERED)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (Vessel.pumpout_status becomes OVERDUE) via POST /marina/marinas/{marina_id}/run-maintenance"
        actor: system
        preconditions:
          - "Vessel.has_holding_tank == true"
          - "days_since_last_pumpout > marina.pumpout_interval_days"
        side_effects:
          - "Berth remains OCCUPIED (still counts occupancy)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (a PumpOutRecord logged that restores compliance) via POST /marina/vessels/{vessel_id}/pump-out-records"
        actor: system
        preconditions:
          - "After logging, days_since_last_pumpout <= marina.pumpout_interval_days"
        side_effects:
          - "Vessel.last_pumpout_date updated; Vessel.pumpout_status -> COMPLIANT; Permit un-suspended"
      - from: [ACTIVE, SUSPENDED]
        to: EXPIRED
        trigger: "system (clock > season_end_date) via POST /marina/marinas/{marina_id}/run-maintenance"
        actor: system
        preconditions:
          - "clock > season_end_date"
        side_effects:
          - "Berth.status OCCUPIED -> AVAILABLE; Berth.current_permit_id cleared"
          - "marina occupancy recomputed (-1); if is_liveaboard marina.liveaboard_count (-1)"
          - "CASCADE: freed berth triggers waitlist_promotion (next ranked WAITLISTED -> OFFERED)"
      - from: [ACTIVE, SUSPENDED]
        to: REVOKED
        trigger: "POST /marina/permits/{permit_id}/revoke OR system (derelict impound cascade)"
        actor: "Harbormaster or system"
        preconditions: []
        side_effects:
          - "refund_on_revoke computed; Invoice.amount_refunded_cents += refund; status -> PARTIALLY_REFUNDED/REFUNDED"
          - "Berth.status -> AVAILABLE; Berth.current_permit_id cleared; occupancy recomputed (-1); if is_liveaboard liveaboard_count (-1)"
          - "CASCADE: freed berth triggers waitlist_promotion (next ranked WAITLISTED -> OFFERED)"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /marina/permits/{permit_id}/transfer"
        actor: Harbormaster
        preconditions:
          - "to_boater_id exists and is different from the current holder (permit.boater_id); else ERR_TRANSFER_TARGET_INVALID"
        side_effects:
          - "New Permit created (source=TRANSFER, status=ACTIVE) for to_boater on the SAME berth_id, same vessel_id, same season dates"
          - "New TRANSFER Invoice issued to to_boater for TRANSFER_FEE_CENTS"
          - "Berth.current_permit_id repointed to the new permit; occupancy count unchanged (net-zero); liveaboard_count unchanged when is_liveaboard preserved"

  - entity: Berth
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (a Permit is OFFERED this berth)"
        actor: system
        preconditions: ["Berth.status == AVAILABLE"]
        side_effects: ["current_permit_id set to the offered permit"]
      - from: RESERVED
        to: OCCUPIED
        trigger: "system (the offered Permit is activated via invoice pay)"
        actor: system
        preconditions: ["Berth.status == RESERVED"]
        side_effects: ["marina occupancy recomputed"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (offer declined or expired)"
        actor: system
        preconditions: []
        side_effects: ["current_permit_id cleared; waitlist_promotion may re-reserve"]
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system (Permit expired or revoked)"
        actor: system
        preconditions: []
        side_effects: ["current_permit_id cleared; waitlist_promotion may re-reserve"]
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "PUT-less admin close is out of scope; reserved for maintenance (not exercised in v1)"
        actor: Harbormaster
        preconditions: ["Berth.status == AVAILABLE"]
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "admin reopen (not exercised in v1)"
        actor: Harbormaster
        preconditions: []
        side_effects: []

  - entity: DerelictReport
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, IMPOUNDED]
    note: "Branching: NOTICE_SERVED forks to RESOLVED (owner cures) or IMPOUNDED (seizure) with divergent side effects."
    transitions:
      - from: OPEN
        to: NOTICE_SERVED
        trigger: "POST /marina/derelict-reports/{report_id}/serve-notice"
        actor: Harbormaster
        preconditions: []
        side_effects:
          - "notice_served_date set to clock"
          - "derelict_cost estimated variant -> estimated_cost_cents"
          - "DERELICT Invoice issued to the vessel owner for estimated_cost_cents (UNPAID); invoice_id set"
      - from: NOTICE_SERVED
        to: RESOLVED
        trigger: "POST /marina/derelict-reports/{report_id}/close (disposition=RESOLVED)"
        actor: Harbormaster
        preconditions: []
        side_effects:
          - "closed_date set; no impound, no permit/vessel change; DERELICT Invoice remains payable"
      - from: NOTICE_SERVED
        to: IMPOUNDED
        trigger: "POST /marina/derelict-reports/{report_id}/close (disposition=IMPOUNDED)"
        actor: Harbormaster
        preconditions: []
        side_effects:
          - "closed_date set; derelict_cost actual variant -> actual_cost_cents; DERELICT Invoice.amount_due_cents raised to actual_cost_cents"
          - "CASCADE link 1: Vessel.registration_status -> REVOKED"
          - "CASCADE link 2 (caused by link 1): any ACTIVE/SUSPENDED Permit on that vessel -> REVOKED (refund computed)"
          - "CASCADE link 3 (caused by link 2): that permit's Berth OCCUPIED -> AVAILABLE, occupancy recomputed"
          - "CASCADE link 4 (caused by link 3): freed berth triggers waitlist_promotion -> next ranked WAITLISTED permit -> OFFERED"

  - entity: LotteryRound
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DRAWN
        trigger: "POST /marina/lottery-rounds/{round_id}/draw"
        actor: Harbormaster
        preconditions:
          - "clock > entry_close_date"
        side_effects:
          - "lottery_draw ranks eligible ENTERED entries; top-K (K=len(berth_ids)) -> WON with awarded_berth_id (assigned in berth_ids order) and claim_deadline; remaining eligible -> LOST"
          - "Each WON entry: a PERMIT Invoice is NOT issued until claim; drawn_on_date set"
      - from: DRAWN
        to: CLOSED
        trigger: "system (all WON entries CLAIMED or FORFEITED) via POST /marina/marinas/{marina_id}/run-maintenance"
        actor: system
        preconditions: []
        side_effects:
          - "Any WON entry past claim_deadline -> FORFEITED; its awarded_berth returns to AVAILABLE pool"

  - entity: LotteryEntry
    field: status
    initial_state: ENTERED
    terminal_states: [LOST, CLAIMED, FORFEITED]
    note: "Branching: ENTERED forks to WON or LOST; WON forks to CLAIMED or FORFEITED."
    transitions:
      - from: ENTERED
        to: WON
        trigger: "system (lottery_draw ranks entry within top-K)"
        actor: system
        preconditions:
          - "Vessel.registration_status == REGISTERED at draw time (cross-entity: LotteryEntry depends on Vessel)"
        side_effects: ["awarded_berth_id set; claim_deadline set (drawn_on + CLAIM_TTL_DAYS)"]
      - from: ENTERED
        to: LOST
        trigger: "system (lottery_draw: entry ranked beyond top-K or vessel not REGISTERED at draw)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WON
        to: CLAIMED
        trigger: "POST /marina/lottery-entries/{entry_id}/claim"
        actor: "Boater (owner) or Harbormaster"
        preconditions:
          - "clock <= claim_deadline"
          - "awarded Berth.status == AVAILABLE"
        side_effects:
          - "Permit created (source=LOTTERY, status=OFFERED) on awarded_berth; provisional_fee_cents computed; PERMIT Invoice issued; permit_id set; Berth AVAILABLE -> RESERVED"
      - from: WON
        to: FORFEITED
        trigger: "system (clock > claim_deadline) via POST /marina/marinas/{marina_id}/run-maintenance"
        actor: system
        preconditions: ["clock > claim_deadline"]
        side_effects: ["awarded_berth returns to AVAILABLE pool"]

  - entity: RampPass
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: "(none)"
        to: ACTIVE
        trigger: "POST /marina/ramp-passes"
        actor: "Boater or Harbormaster"
        preconditions:
          - "Vessel.registration_status == REGISTERED (business_referential)"
          - "No overlapping SEASONAL RampPass for the same boater: closed-interval overlap on [valid_from_date, valid_to_date] (adjacency counts as overlap)"
        side_effects:
          - "ramp_pass_fee computed -> fee_cents; RAMP_PASS Invoice issued (UNPAID); invoice_id set"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock > valid_to_date) via POST /marina/marinas/{marina_id}/run-maintenance"
        actor: system
        preconditions: ["clock > valid_to_date"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /marina/ramp-passes/{pass_id}/revoke"
        actor: Harbormaster
        preconditions: []
        side_effects: ["RAMP_PASS Invoice -> VOID if still UNPAID"]

  - entity: Invoice
    field: status
    initial_state: UNPAID
    terminal_states: [REFUNDED, VOID, WAIVED]
    note: "Branching + refund: UNPAID forks to PAID/VOID/WAIVED; PAID may move to PARTIALLY_REFUNDED then REFUNDED."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /marina/invoices/{invoice_id}/pay (amount_cents == amount_due_cents)"
        actor: "Boater (owner), FinanceClerk, or Harbormaster"
        preconditions:
          - "amount_cents == amount_due_cents (partial payment rejected)"
        side_effects:
          - "amount_paid_cents = amount_due_cents"
          - "If invoice_type==PERMIT: referenced Permit OFFERED -> ACTIVE (with its own preconditions/side effects)"
      - from: UNPAID
        to: WAIVED
        trigger: "POST /marina/invoices/{invoice_id}/waive"
        actor: FinanceClerk
        preconditions: []
        side_effects:
          - "If invoice_type==PERMIT: referenced Permit OFFERED -> ACTIVE (fee treated as satisfied)"
      - from: UNPAID
        to: VOID
        trigger: "system (offer declined/expired, ramp pass revoked before payment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "system (permit revoke with 0 < refund < amount_paid)"
        actor: system
        preconditions: ["0 < refund_cents < amount_paid_cents"]
        side_effects: ["amount_refunded_cents += refund_cents"]
      - from: PAID
        to: REFUNDED
        trigger: "system (permit revoke/activation reconcile with refund == amount_paid)"
        actor: system
        preconditions: ["refund_cents == amount_paid_cents"]
        side_effects: ["amount_refunded_cents = amount_paid_cents"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC — true CREATE/UPDATE-with-supersede only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: permit-reassign-stale-version
    parent_entity: Permit
    write_endpoint: "POST /marina/permits/{permit_id}/reassign-berth"
    occ_field: "expected_permit_version"
    description: |
      Reassigning an ACTIVE permit to a different AVAILABLE berth against a Permit
      whose version has advanced since the client last observed it is rejected. A
      reassignment is always legitimate on an ACTIVE permit (the permit stays ACTIVE
      and no gating state field changes), so a strictly-later request that still
      carries the previously-observed version is rejected purely on the stale version
      — this captures the case where a prior reassignment already moved the boat and
      the caller's view of which berth the permit holds is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee
    trigger: "provisional at offer (WAITLISTED/DIRECT/LOTTERY -> OFFERED); final at activation (OFFERED -> ACTIVE)"
    algorithm: tiered_pricing
    input_set: "berth_type, ceil(vessel.length_ft), boater.residency_status, is_liveaboard, activated_on_date vs season window"
    formula: |
      # gross (provisional variant, full season):
      rate_per_ft = SLIP_RATE_CENTS_PER_FT if requested_berth_type==SLIP else MOORING_RATE_CENTS_PER_FT
      length_component_cents = rate_per_ft * ceil(vessel.length_ft)
      residency_mult = 1.00 if fee_basis==RESIDENT else NON_RESIDENT_MULT
      length_scaled = round_half_up(length_component_cents * residency_mult)
      liveaboard_component = LIVEABOARD_SURCHARGE_CENTS if is_liveaboard else 0
      gross_cents = length_scaled + liveaboard_component
      provisional_fee_cents = gross_cents

      # final variant (prorate by remaining days), PINNED ORDER = per-component round then sum:
      season_days = (season_end_date - season_start_date).days + 1        # inclusive
      remaining_days = (season_end_date - activated_on_date).days + 1     # inclusive
      length_prorated = round_half_up(length_scaled * remaining_days / season_days)
      live_prorated   = round_half_up(liveaboard_component * remaining_days / season_days)
      final_fee_cents = length_prorated + live_prorated                   # NOT round(gross * r/s)
    constants:
      SLIP_RATE_CENTS_PER_FT: 4000
      MOORING_RATE_CENTS_PER_FT: 2500
      NON_RESIDENT_MULT: 1.75
      LIVEABOARD_SURCHARGE_CENTS: 50000
    precision: "integer cents, round_half_up; proration rounds EACH component to whole cents BEFORE summing"
    variants:
      - name: provisional
        when: "computed at offer time; billed on the PERMIT invoice as amount_due_cents"
        difference: "full-season gross_cents, no proration"
      - name: final
        when: "computed at activation using activated_on_date"
        difference: "prorated by remaining_days/season_days with per-component rounding; the (provisional - final) overpayment is refunded on the invoice"

  - name: derelict_cost
    trigger: "estimated at serve-notice; actual at impound"
    algorithm: aggregation
    input_set: "storage days between notice_served_date and closed_date, flat notice & tow fees"
    formula: |
      estimated_cost_cents = NOTICE_FEE_CENTS                               # at NOTICE_SERVED
      storage_days = (closed_date - notice_served_date).days                # at IMPOUNDED
      actual_cost_cents = NOTICE_FEE_CENTS + TOW_FEE_CENTS + STORAGE_PER_DAY_CENTS * ceil(max(storage_days, 0))
    constants:
      NOTICE_FEE_CENTS: 15000
      TOW_FEE_CENTS: 40000
      STORAGE_PER_DAY_CENTS: 3000
    precision: "integer cents"
    variants:
      - name: estimated
        when: "DerelictReport at NOTICE_SERVED"
        difference: "flat NOTICE_FEE_CENTS only (no tow, no storage)"
      - name: actual
        when: "DerelictReport at IMPOUNDED"
        difference: "adds tow and per-day storage; DERELICT invoice.amount_due is raised from estimated to actual"

  - name: refund_on_revoke
    trigger: "Permit ACTIVE/SUSPENDED -> REVOKED"
    algorithm: chronological
    input_set: "invoice.amount_paid_cents (net of prior refunds), remaining days from revoke date"
    formula: |
      season_days = (season_end_date - season_start_date).days + 1
      remaining_days = max((season_end_date - clock_date).days + 1, 0)
      net_paid = amount_paid_cents - amount_refunded_cents
      refund_cents = round_half_up(net_paid * remaining_days / season_days)
    precision: "integer cents, round_half_up"

  - name: ramp_pass_fee
    trigger: "POST /marina/ramp-passes"
    algorithm: threshold
    input_set: "pass_type, fee_basis"
    formula: |
      if pass_type==SEASONAL and fee_basis==RESIDENT:      fee_cents = RAMP_SEASONAL_RESIDENT_CENTS
      elif pass_type==SEASONAL and fee_basis==NON_RESIDENT: fee_cents = RAMP_SEASONAL_NONRESIDENT_CENTS
      elif pass_type==DAY and fee_basis==RESIDENT:          fee_cents = RAMP_DAY_RESIDENT_CENTS
      else:                                                 fee_cents = RAMP_DAY_NONRESIDENT_CENTS
    constants:
      RAMP_SEASONAL_RESIDENT_CENTS: 8000
      RAMP_SEASONAL_NONRESIDENT_CENTS: 20000
      RAMP_DAY_RESIDENT_CENTS: 1000
      RAMP_DAY_NONRESIDENT_CENTS: 3000
    precision: "integer cents"

  - name: waitlist_promotion
    trigger: "a Berth becomes AVAILABLE (permit decline/expire/revoke/transfer-out) or run-maintenance"
    algorithm: weighted_scoring
    input_set: "Permit rows with status==WAITLISTED, same marina, requested_berth_type==freed.berth_type, requested_size_class==freed.size_class, Vessel.length_ft <= freed.max_length_ft, (freed.resident_only==false OR fee_basis==RESIDENT)"
    formula: |
      candidates = eligible WAITLISTED permits (filter above)
      rank by (priority_tier ASC, created_at ASC)                 # resident first, then earliest applicant
      winner = candidates[0]
      if candidates empty: berth stays AVAILABLE (no promotion)
    precision: "n/a (selection); tie-break created_at ASC, never id"

  - name: lottery_draw
    trigger: "POST /marina/lottery-rounds/{round_id}/draw"
    algorithm: waterfall_allocation
    input_set: "LotteryEntry rows with round_id==round, status==ENTERED, Vessel.registration_status==REGISTERED at clock"
    formula: |
      K = len(round.berth_ids)
      eligible = ENTERED entries whose vessel is REGISTERED at draw
      rank eligible by (priority_tier ASC, draw_number ASC)        # resident first, then entry order
      winners = eligible[0:K]  -> WON, awarded_berth_id = round.berth_ids[i] (i-th winner gets i-th berth id)
      losers  = eligible[K:] and any not-REGISTERED entries -> LOST
      if eligible empty: no winners (all remaining ENTERED -> LOST); berths stay AVAILABLE
    precision: "n/a (allocation); deterministic ordering by draw_number, never random/id"

  - name: pumpout_compliance
    trigger: "read of Vessel.pumpout_status; run-maintenance suspend sweep; pump-out log cure"
    algorithm: threshold
    input_set: "Vessel.has_holding_tank, last_pumpout_date, clock, marina.pumpout_interval_days"
    formula: |
      if not has_holding_tank: pumpout_status = NA
      else:
        base = last_pumpout_date if last_pumpout_date is not null else <permit.activated_on_date or vessel.created_at>
        days_since = (clock_date - base).days
        pumpout_status = OVERDUE if days_since > pumpout_interval_days else COMPLIANT   # boundary: '>' strict
    precision: "day granularity; OVERDUE strictly when days_since > interval"

  - name: marina_occupancy
    trigger: "any Permit activation/expiry/revoke/transfer, any Berth status change"
    algorithm: aggregation
    input_set: "Berth rows and ACTIVE Permit rows for the marina"
    formula: |
      available_slip_count    = count(Berth: berth_type=SLIP, status=AVAILABLE)
      occupied_slip_count     = count(Berth: berth_type=SLIP, status=OCCUPIED)
      available_mooring_count = count(Berth: berth_type=MOORING, status=AVAILABLE)
      occupied_mooring_count  = count(Berth: berth_type=MOORING, status=OCCUPIED)
      liveaboard_count        = count(Permit: status=ACTIVE, is_liveaboard=true)
      waitlist_length         = count(Permit: status=WAITLISTED)
    precision: "integer counts; invariant occupied_slip_count == count(ACTIVE|SUSPENDED permits on SLIP berths)"

# Additional pinned constants shared across transitions
constants:
  OFFER_TTL_DAYS: 7
  CLAIM_TTL_DAYS: 14
  TRANSFER_FEE_CENTS: 5000

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of {Harbormaster, FinanceClerk, Boater}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (validated left-to-right); marina_id/boater_id/vessel_id/berth_id/round_id/invoice_id/permit_id resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource references"
  - priority: 4
    category: auth
    check: "When acting role is Boater, the acting boater (X-User-ID) must own the target resource (permit.boater_id / vessel.boater_id / invoice.boater_id / entry.boater_id / pass.boater_id == X-User-ID)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Boater-initiated mutations on owned resources"
  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (state-machine from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "Vessel.registration_status == REGISTERED where required (permit apply, lottery enter, ramp pass, claim)"
    error_id: ERR_VESSEL_REGISTRATION_EXPIRED
    http_status: 422
    applies_to: "POST /marina/permits, POST /marina/lottery-entries, POST /marina/ramp-passes, POST /marina/lottery-entries/{entry_id}/claim"
  - priority: 7
    category: business_referential
    check: "Requested/awarded berth_type and size_class match an offered berth; vessel type/berth match; resident_only berth requires RESIDENT boater"
    error_id: ERR_BERTH_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /marina/permits, POST /marina/permits/{permit_id}/reassign-berth"
  - priority: 8
    category: business_temporal
    check: "No season overlap on the target berth: half-open [season_start,season_end) intervals must not overlap (adjacency allowed) among ACTIVE/OFFERED/SUSPENDED permits"
    error_id: ERR_BERTH_SEASON_CONFLICT
    http_status: 409
    applies_to: "POST /marina/invoices/{invoice_id}/pay (activation), POST /marina/permits/{permit_id}/reassign-berth"
  - priority: 9
    category: business_temporal
    check: "No overlapping SEASONAL RampPass for the same boater: closed [valid_from,valid_to] intervals overlap (adjacency counts as overlap) is rejected"
    error_id: ERR_RAMP_PASS_OVERLAP
    http_status: 409
    applies_to: "POST /marina/ramp-passes"
  - priority: 10
    category: business_constraint
    check: "Vessel.length_ft <= target berth.max_length_ft"
    error_id: ERR_VESSEL_TOO_LONG
    http_status: 422
    applies_to: "POST /marina/permits (immediate-offer path), POST /marina/permits/{permit_id}/reassign-berth"
  - priority: 11
    category: business_safety
    check: "Activating a liveaboard permit requires marina.liveaboard_count < marina.liveaboard_cap (reject when >=)"
    error_id: ERR_LIVEABOARD_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /marina/invoices/{invoice_id}/pay (liveaboard permit activation)"
  - priority: 12
    category: business_fiscal
    check: "Payment amount_cents must equal invoice.amount_due_cents (no partial payments); invoice must be UNPAID"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /marina/invoices/{invoice_id}/pay"
  - priority: 13
    category: business_fiscal
    check: "Draw requires clock strictly after entry_close_date"
    error_id: ERR_ROUND_NOT_CLOSED_FOR_DRAW
    http_status: 409
    applies_to: "POST /marina/lottery-rounds/{round_id}/draw"
  - priority: 14
    category: business_constraint
    check: "OCC: expected_permit_version must equal the Permit's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /marina/permits/{permit_id}/reassign-berth"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Marina ----
  - method: POST
    path: "/marina/marinas"
    description: "Create a marina (config + season window + liveaboard cap)"
    roles: [Harbormaster]
    code: 201
    input: [name, season_start_date, season_end_date, liveaboard_cap, "pumpout_interval_days?"]
    output: Marina
    side_effects: ["all counters initialized to 0"]
  - method: GET
    path: "/marina/marinas/{marina_id}"
    description: "Get a marina with computed occupancy/liveaboard/waitlist counters"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: Marina
    side_effects: []
  - method: POST
    path: "/marina/marinas/{marina_id}/run-maintenance"
    description: "Ops sweep at the current logical clock: expire permits past season_end (release berths + waitlist promotion), expire OFFERED past offer_expires_at, suspend permits whose vessel pump-out is OVERDUE, forfeit WON lottery entries past claim_deadline, expire ramp passes past valid_to, close fully-resolved lottery rounds"
    roles: [Harbormaster]
    code: 200
    input: []
    output: Marina
    side_effects:
      - "Permit ACTIVE/SUSPENDED -> EXPIRED (clock>season_end); berth freed; waitlist_promotion cascade"
      - "Permit OFFERED -> DECLINED (clock>offer_expires_at); berth freed; waitlist_promotion cascade"
      - "Permit ACTIVE -> SUSPENDED (pump-out OVERDUE)"
      - "LotteryEntry WON -> FORFEITED (clock>claim_deadline); berth returns to pool"
      - "RampPass ACTIVE -> EXPIRED (clock>valid_to_date)"
      - "LotteryRound DRAWN -> CLOSED when no WON entries remain"

  # ---- Berth ----
  - method: POST
    path: "/marina/berths"
    description: "Create a berth (slip or mooring) in a marina"
    roles: [Harbormaster]
    code: 201
    input: [marina_id, berth_type, size_class, max_length_ft, "resident_only?"]
    output: Berth
    side_effects: ["status=AVAILABLE; marina occupancy recomputed"]
  - method: GET
    path: "/marina/berths/{berth_id}"
    description: "Get a berth"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: Berth
    side_effects: []
  - method: GET
    path: "/marina/berths"
    description: "List/filter berths (reverse-reachability for Berth.marina_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["marina_id?", "berth_type?", "status?", "limit?", "offset?"]
    output: Berth[]
    side_effects: []

  # ---- Boater ----
  - method: POST
    path: "/marina/boaters"
    description: "Register a boater account (resident or non-resident)"
    roles: [Harbormaster]
    code: 201
    input: [full_name, email, residency_status, "street_address?"]
    output: Boater
    side_effects: ["account_status=ACTIVE"]
  - method: GET
    path: "/marina/boaters/{boater_id}"
    description: "Get a boater"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: Boater
    side_effects: []

  # ---- Vessel ----
  - method: POST
    path: "/marina/vessels"
    description: "Register a vessel to a boater"
    roles: [Harbormaster, Boater]
    code: 201
    input: [boater_id, name, length_ft, registration_number, registration_expiry_date, has_holding_tank]
    output: Vessel
    side_effects: ["registration_status computed from expiry vs clock; pumpout_status computed"]
  - method: GET
    path: "/marina/vessels/{vessel_id}"
    description: "Get a vessel with computed registration/pump-out status"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: Vessel
    side_effects: []
  - method: GET
    path: "/marina/vessels"
    description: "List/filter vessels (reverse-reachability for Vessel.boater_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["boater_id?", "registration_status?", "limit?", "offset?"]
    output: Vessel[]
    side_effects: []
  - method: POST
    path: "/marina/vessels/{id}/pump-out-records"
    description: "Log a pump-out event for a vessel; may cure a SUSPENDED permit"
    roles: [Harbormaster, Boater]
    code: 201
    input: [pumpout_date]
    output: PumpOutRecord
    side_effects: ["Vessel.last_pumpout_date updated; pumpout_status recomputed; SUSPENDED permit -> ACTIVE if compliant"]
  - method: GET
    path: "/marina/vessels/{id}/pump-out-records"
    description: "List a vessel's pump-out records (reverse-reachability for PumpOutRecord.vessel_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["limit?", "offset?"]
    output: PumpOutRecord[]
    side_effects: []

  # ---- Permit ----
  - method: POST
    path: "/marina/permits"
    description: "Apply for a seasonal permit; immediate OFFER if a matching berth is AVAILABLE, else WAITLISTED"
    roles: [Harbormaster, Boater]
    code: 201
    input: [marina_id, boater_id, vessel_id, requested_berth_type, requested_size_class, season_year, "is_liveaboard?"]
    output: Permit
    side_effects: ["OFFERED (berth reserved + provisional invoice) or WAITLISTED; season dates copied; fee_basis/priority_tier computed"]
  - method: GET
    path: "/marina/permits/{permit_id}"
    description: "Get a permit"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/marina/permits"
    description: "List/filter permits (reverse-reachability for Permit.marina_id/boater_id/vessel_id/berth_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["marina_id?", "boater_id?", "vessel_id?", "berth_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/marina/permits/{permit_id}/cancel"
    description: "Boater withdraws a WAITLISTED permit (-> CANCELLED) or declines an OFFERED permit (-> DECLINED)"
    roles: [Harbormaster, Boater]
    code: 200
    input: []
    output: Permit
    side_effects: ["OFFERED: berth freed + invoice VOID + waitlist_promotion cascade; WAITLISTED: waitlist_length -1"]
  - method: POST
    path: "/marina/permits/{permit_id}/revoke"
    description: "Harbormaster revokes an ACTIVE/SUSPENDED permit (refund + berth release + waitlist promotion)"
    roles: [Harbormaster]
    code: 200
    input: ["reason?"]
    output: Permit
    side_effects: ["refund_on_revoke; berth freed; occupancy/liveaboard -1; waitlist_promotion cascade"]
  - method: POST
    path: "/marina/permits/{permit_id}/transfer"
    description: "Transfer an ACTIVE permit to another boater; issues a TRANSFER invoice and a new ACTIVE permit on the same berth"
    roles: [Harbormaster]
    code: 200
    input: [to_boater_id]
    output: Permit
    side_effects: ["old permit -> TRANSFERRED; new ACTIVE permit created; TRANSFER invoice; berth.current_permit_id repointed"]
  - method: POST
    path: "/marina/permits/{permit_id}/reassign-berth"
    description: "Reassign an ACTIVE permit to a different AVAILABLE berth. OCC-guarded on the permit version. Server startup clock default is 2026-03-01T00:00:00Z."
    roles: [Harbormaster]
    code: 200
    input: [new_berth_id, expected_permit_version]
    output: Permit
    side_effects: ["old berth OCCUPIED->AVAILABLE (waitlist_promotion cascade); new berth AVAILABLE->OCCUPIED; increments Permit.version by 1"]

  # ---- Lottery Round ----
  - method: POST
    path: "/marina/lottery-rounds"
    description: "Open a seasonal lottery round for a set of berths"
    roles: [Harbormaster]
    code: 201
    input: [marina_id, season_year, berth_type, entry_open_date, entry_close_date, berth_ids]
    output: LotteryRound
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/marina/lottery-rounds/{round_id}"
    description: "Get a lottery round"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: LotteryRound
    side_effects: []
  - method: GET
    path: "/marina/lottery-rounds"
    description: "List/filter lottery rounds (reverse-reachability for LotteryRound.marina_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["marina_id?", "status?", "limit?", "offset?"]
    output: LotteryRound[]
    side_effects: []
  - method: POST
    path: "/marina/lottery-rounds/{round_id}/draw"
    description: "Draw winners deterministically (priority_tier then draw_number); assign berths in berth_ids order"
    roles: [Harbormaster]
    code: 200
    input: []
    output: LotteryRound
    side_effects: ["entries -> WON/LOST; WON get awarded_berth_id + claim_deadline; drawn_on_date set"]

  # ---- Lottery Entry ----
  - method: POST
    path: "/marina/lottery-entries"
    description: "Enter a boater+vessel into an OPEN lottery round"
    roles: [Harbormaster, Boater]
    code: 201
    input: [round_id, boater_id, vessel_id]
    output: LotteryEntry
    side_effects: ["draw_number assigned (sequential by created_at); priority_tier computed; status=ENTERED"]
  - method: GET
    path: "/marina/lottery-entries/{entry_id}"
    description: "Get a lottery entry"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: LotteryEntry
    side_effects: []
  - method: GET
    path: "/marina/lottery-entries"
    description: "List/filter lottery entries (reverse-reachability for round_id/boater_id/vessel_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["round_id?", "boater_id?", "vessel_id?", "status?", "limit?", "offset?"]
    output: LotteryEntry[]
    side_effects: []
  - method: POST
    path: "/marina/lottery-entries/{entry_id}/claim"
    description: "Claim a WON lottery entry; creates an OFFERED permit + provisional invoice on the awarded berth"
    roles: [Harbormaster, Boater]
    code: 201
    input: ["is_liveaboard?"]
    output: Permit
    side_effects: ["entry -> CLAIMED; Permit created (source=LOTTERY, OFFERED); berth RESERVED; PERMIT invoice issued; permit_id set"]

  # ---- Derelict Report ----
  - method: POST
    path: "/marina/derelict-reports"
    description: "File a derelict-vessel report against a vessel"
    roles: [Harbormaster]
    code: 201
    input: [vessel_id, reason]
    output: DerelictReport
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/marina/derelict-reports/{report_id}"
    description: "Get a derelict report"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: DerelictReport
    side_effects: []
  - method: GET
    path: "/marina/derelict-reports"
    description: "List/filter derelict reports (reverse-reachability for DerelictReport.vessel_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["vessel_id?", "status?", "limit?", "offset?"]
    output: DerelictReport[]
    side_effects: []
  - method: POST
    path: "/marina/derelict-reports/{report_id}/serve-notice"
    description: "Serve derelict notice; estimated_cost computed; DERELICT invoice issued"
    roles: [Harbormaster]
    code: 200
    input: []
    output: DerelictReport
    side_effects: ["OPEN -> NOTICE_SERVED; estimated_cost_cents; invoice issued"]
  - method: POST
    path: "/marina/derelict-reports/{report_id}/close"
    description: "Close a served report as RESOLVED (owner cured) or IMPOUNDED (seizure -> revoke cascade)"
    roles: [Harbormaster]
    code: 200
    input: [disposition]
    output: DerelictReport
    side_effects: ["RESOLVED: closed only; IMPOUNDED: actual_cost, vessel REVOKED, permit REVOKED, berth freed, waitlist_promotion cascade"]

  # ---- Ramp Pass ----
  - method: POST
    path: "/marina/ramp-passes"
    description: "Buy a launch-ramp pass (day or seasonal); resident/non-resident fee"
    roles: [Harbormaster, Boater]
    code: 201
    input: [boater_id, vessel_id, pass_type, valid_from_date, valid_to_date]
    output: RampPass
    side_effects: ["fee computed; RAMP_PASS invoice issued (UNPAID); status=ACTIVE"]
  - method: GET
    path: "/marina/ramp-passes/{pass_id}"
    description: "Get a ramp pass"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: RampPass
    side_effects: []
  - method: GET
    path: "/marina/ramp-passes"
    description: "List/filter ramp passes (reverse-reachability for boater_id/vessel_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["boater_id?", "vessel_id?", "status?", "limit?", "offset?"]
    output: RampPass[]
    side_effects: []
  - method: POST
    path: "/marina/ramp-passes/{pass_id}/revoke"
    description: "Revoke a ramp pass"
    roles: [Harbormaster]
    code: 200
    input: []
    output: RampPass
    side_effects: ["ACTIVE -> REVOKED; UNPAID invoice -> VOID"]

  # ---- Invoice / Billing ----
  - method: GET
    path: "/marina/invoices/{invoice_id}"
    description: "Get an invoice"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/marina/invoices"
    description: "List/filter invoices (reverse-reachability for Invoice.boater_id)"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: ["boater_id?", "status?", "invoice_type?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/marina/invoices/{invoice_id}/pay"
    description: "Pay an invoice in full; a PERMIT invoice payment activates the permit"
    roles: [Harbormaster, FinanceClerk, Boater]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["UNPAID -> PAID; PERMIT invoice -> permit OFFERED->ACTIVE with final fee reconcile"]
  - method: POST
    path: "/marina/invoices/{invoice_id}/waive"
    description: "Finance waives an unpaid invoice"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["UNPAID -> WAIVED; PERMIT invoice -> permit OFFERED->ACTIVE"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for all date comparisons (registration expiry, season, pump-out, offer/claim deadlines). Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Harbormaster]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances/sets logical clock; does not itself run maintenance sweeps"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Boater acting on a resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_VESSEL_REGISTRATION_EXPIRED, http: 422, condition: "Vessel registration EXPIRED/REVOKED where REGISTERED is required" }
  - { id: ERR_BERTH_TYPE_MISMATCH, http: 422, condition: "Requested/awarded berth type or size class does not match, or resident_only berth requested by NON_RESIDENT" }
  - { id: ERR_BERTH_SEASON_CONFLICT, http: 409, condition: "Berth already occupied for an overlapping season interval (half-open, adjacency allowed)" }
  - { id: ERR_RAMP_PASS_OVERLAP, http: 409, condition: "Overlapping SEASONAL ramp pass for the same boater (closed interval, adjacency conflicts)" }
  - { id: ERR_VESSEL_TOO_LONG, http: 422, condition: "Vessel length exceeds berth max_length_ft" }
  - { id: ERR_LIVEABOARD_LIMIT_REACHED, http: 422, condition: "Activating a liveaboard permit when marina.liveaboard_count >= liveaboard_cap" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents != invoice.amount_due_cents" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice not UNPAID (already PAID/VOID/WAIVED/REFUNDED)" }
  - { id: ERR_ROUND_NOT_CLOSED_FOR_DRAW, http: 409, condition: "Draw attempted before entry_close_date has passed" }
  - { id: ERR_ROUND_ALREADY_DRAWN, http: 409, condition: "Draw attempted on a round not in OPEN status" }
  - { id: ERR_ENTRY_WINDOW_CLOSED, http: 409, condition: "Lottery entry attempted when round is not OPEN or clock outside [entry_open,entry_close]" }
  - { id: ERR_CLAIM_DEADLINE_PASSED, http: 409, condition: "Claim attempted after claim_deadline" }
  - { id: ERR_ENTRY_NOT_WON, http: 409, condition: "Claim attempted on an entry not in WON status" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_permit_version does not match Permit.version (OCC)" }
  - { id: ERR_BERTH_NOT_AVAILABLE, http: 409, condition: "Reassign/claim target berth not AVAILABLE" }
  - { id: ERR_LIVEABOARD_CAP_NEGATIVE, http: 400, condition: "Marina created with negative liveaboard_cap" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "season_end < season_start, valid_to < valid_from, or entry_close < entry_open" }
  - { id: ERR_DUPLICATE_LOTTERY_ENTRY, http: 409, condition: "Same boater+vessel already ENTERED in the round" }
  - { id: ERR_TRANSFER_TARGET_INVALID, http: 422, condition: "Transfer whose to_boater_id equals the current holder (permit.boater_id)" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "revoke/transfer/reassign attempted on a permit not ACTIVE/SUSPENDED as required" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of allowed bounds (limit 1..100, offset >= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Harbormaster
    description: "Marina operations authority: manages marinas, berths, boaters, permits (revoke/transfer/reassign), lottery draws, derelict enforcement, ramp passes, and runs maintenance. Operational identity, not a persisted actor entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /marina/marinas"
      - "POST /marina/marinas/{marina_id}/run-maintenance"
      - "POST /marina/berths"
      - "POST /marina/boaters"
      - "POST /marina/permits/{permit_id}/revoke"
      - "POST /marina/permits/{permit_id}/transfer"
      - "POST /marina/permits/{permit_id}/reassign-berth"
      - "POST /marina/lottery-rounds"
      - "POST /marina/lottery-rounds/{round_id}/draw"
      - "POST /marina/derelict-reports"
      - "POST /marina/derelict-reports/{report_id}/serve-notice"
      - "POST /marina/derelict-reports/{report_id}/close"
      - "POST /marina/ramp-passes/{pass_id}/revoke"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /marina/vessels (any boater)"
      - "POST /marina/permits (any boater)"
      - "POST /marina/permits/{permit_id}/cancel (any permit)"
      - "POST /marina/lottery-entries (any boater)"
      - "POST /marina/lottery-entries/{entry_id}/claim (any entry)"
      - "POST /marina/ramp-passes (any boater)"
      - "POST /marina/vessels/{vessel_id}/pump-out-records"
      - "POST /marina/invoices/{invoice_id}/pay (any invoice)"
      - "all GET reads"

  - name: FinanceClerk
    description: "Billing authority: pays and waives invoices on any boater's behalf. Operational identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /marina/invoices/{invoice_id}/waive"
    shared_operations:
      - "POST /marina/invoices/{invoice_id}/pay (any invoice)"
      - "all GET reads"

  - name: Boater
    description: "Self-service permit holder. X-User-ID equals a Boater.id. May act only on resources they own."
    identity: "entity_backed:Boater"
    exclusive_operations: []
    shared_operations:
      - "POST /marina/vessels (own boater_id)"
      - "POST /marina/vessels/{vessel_id}/pump-out-records (own vessel)"
      - "POST /marina/permits (own boater_id)"
      - "POST /marina/permits/{permit_id}/cancel (own permit)"
      - "POST /marina/lottery-entries (own boater_id)"
      - "POST /marina/lottery-entries/{entry_id}/claim (own entry)"
      - "POST /marina/ramp-passes (own boater_id)"
      - "POST /marina/invoices/{invoice_id}/pay (own invoice)"
      - "GET reads of own resources and public marina/berth catalog"
