              payload: { outing_id: "${o_id}", receipt_kind: "FUNDRAISING_ITEM", fundraising_item_id: "${i1_id}" }
              as: CharityTreasurer
              as_user_id: "ct-seller"
              captures: { e_self: $.data.error_id }
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "FUNDRAISING_ITEM", fundraising_item_id: "${i1_id}" }
