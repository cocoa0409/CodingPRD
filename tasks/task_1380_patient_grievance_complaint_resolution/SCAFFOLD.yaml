    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for endpoint, or entity-backed role's StaffMember lacks the mapped capability" }
  - { id: ERR_IDENTITY_MISMATCH, http: 403, condition: "Caller X-User-ID does not match the required resource-bound identity (advocate on own session, assigned PRIMARY investigator on booking)" }
  # --- Schema ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or format violation (e.g. closure_note < 20 chars, value_cents <= 0, bad period format)" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value outside declared set (channel, category, note_type, decision, review_track, review_branch, outcome, reason, authority_code, trigger_reason, action_type, posture, severity_tier)" }
  - { id: ERR_FOLLOWUP_SCORE_INVALID, http: 422, condition: "Satisfaction score outside 1..5" }
  # --- Existence (404) ---
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "PatientCase id not found" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "HospitalUnit id not found" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "StaffMember id not found" }
  - { id: ERR_CLASSIFICATION_NOT_FOUND, http: 404, condition: "ClassificationDecision id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CaseAssignment id not found" }
  - { id: ERR_INVESTIGATION_NOT_FOUND, http: 404, condition: "Investigation id not found" }
  - { id: ERR_NOTE_NOT_FOUND, http: 404, condition: "InvestigationNote id not found" }
  - { id: ERR_LETTER_NOT_FOUND, http: 404, condition: "ResponseLetter id not found" }
  - { id: ERR_RECOVERY_NOT_FOUND, http: 404, condition: "ServiceRecoveryAction id not found" }
  - { id: ERR_ESCALATION_NOT_FOUND, http: 404, condition: "QualityRiskEscalation id not found" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "ReportableEvent id not found" }
  - { id: ERR_ROUNDING_NOT_FOUND, http: 404, condition: "RoundingSession id not found" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "InterviewRoom id not found" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "InterviewBooking id not found" }
  - { id: ERR_FOLLOWUP_NOT_FOUND, http: 404, condition: "SatisfactionFollowUp id not found" }
  - { id: ERR_SUSPENSION_NOT_FOUND, http: 404, condition: "ClockSuspension id not found" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "TrendSnapshot id not found" }
  - { id: ERR_HOLIDAY_NOT_FOUND, http: 404, condition: "HolidayObservance id not found" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match current PatientCase.version (OCC)" }
  # --- State (409) ---
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "Case lifecycle_status does not allow the operation (incl. closed/withdrawn, or classification-decision on non-INTAKE/CLASSIFIED for GRIEVANCE->COMPLAINT)" }
  - { id: ERR_INVESTIGATION_INVALID_STATE, http: 409, condition: "Investigation status does not allow the operation" }
  - { id: ERR_LETTER_INVALID_STATE, http: 409, condition: "ResponseLetter status does not allow the operation" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "CaseAssignment not ACTIVE for release" }
  - { id: ERR_RECOVERY_INVALID_STATE, http: 409, condition: "ServiceRecoveryAction status does not allow the operation" }
  - { id: ERR_ESCALATION_INVALID_STATE, http: 409, condition: "Escalation status does not allow the operation (incl. adjudicate before REVIEWS_COMPLETE)" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "ReportableEvent status does not allow the operation" }
  - { id: ERR_ROUNDING_INVALID_STATE, http: 409, condition: "RoundingSession not SCHEDULED" }
  - { id: ERR_BOOKING_INVALID_STATE, http: 409, condition: "InterviewBooking not BOOKED" }
  - { id: ERR_ROOM_INACTIVE, http: 409, condition: "InterviewRoom active = false rejects new bookings" }
  - { id: ERR_FOLLOWUP_INVALID_STATE, http: 409, condition: "Follow-up not PENDING, or now > expires_at (expired)" }
  - { id: ERR_SUSPENSION_INVALID_STATE, http: 409, condition: "ClockSuspension not OPEN" }
  - { id: ERR_NO_ACTIVE_PRIMARY_ASSIGNMENT, http: 409, condition: "Investigation open requires an ACTIVE PRIMARY CaseAssignment on the case" }
  # --- Safety (403/409/422) ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same staff member attempted both sides of a segregated step (findings/approve, file/adjudicate, issue/approve recovery)" }
  - { id: ERR_CONTENT_STANDARD_VIOLATION, http: 422, condition: "Letter sections missing required content-standard entries for the case context" }
  - { id: ERR_GRIEVANCE_REQUIRES_WRITTEN_RESPONSE, http: 409, condition: "Grievance cannot use complaint fast-track close; an issued ResponseLetter is mandatory" }
  - { id: ERR_FAST_TRACK_COMPLAINT_ONLY, http: 409, condition: "fast-track requires classification = COMPLAINT" }
  - { id: ERR_ADVOCATE_ON_LEAVE, http: 403, condition: "Staff member on_leave cannot take rounding sessions or new assignments" }
  - { id: ERR_OPEN_ESCALATION_BLOCKS_APPROVAL, http: 409, condition: "An escalation for the case is in FILED/IN_REVIEW/REVIEWS_COMPLETE; letter approval blocked" }
  - { id: ERR_QRO_COSIGN_REQUIRED, http: 403, condition: "case.requires_qro_cosign is true; letter approval must be performed by QualityRiskOfficer" }
  # --- Referential (409) ---
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 409, condition: "Referenced child belongs to a different case, or escalation not ADJUDICATED_SUBSTANTIATED for event linkage" }
  - { id: ERR_UNIT_IN_RESTRICTED_POSTURE, http: 409, condition: "Unit posture RESTRICTED rejects new case intake" }
  - { id: ERR_UNIT_HAS_UNRESOLVED_LATE_EVENTS, http: 409, condition: "Unit posture restore blocked: LATE_FILED events on the unit not yet ACKNOWLEDGED" }
  - { id: ERR_EVENT_TRIGGER_NOT_SUPPORTED, http: 409, condition: "trigger_reason inconsistent with case facts (e.g. ALLEGED_ABUSE without alleged_abuse_flag)" }
  # --- Constraint (409) ---
  - { id: ERR_ACTIVE_LETTER_EXISTS, http: 409, condition: "Case already has a non-terminal ResponseLetter" }
  - { id: ERR_DUPLICATE_OPEN_SUSPENSION, http: 409, condition: "Case already has an OPEN ClockSuspension" }
  - { id: ERR_DUPLICATE_ACTIVE_ASSIGNMENT, http: 409, condition: "Same investigator already has an ACTIVE assignment on this case" }
  - { id: ERR_ROUNDING_OVERLAP, http: 409, condition: "Advocate has another SCHEDULED session whose half-open window overlaps" }
  - { id: ERR_UNIT_ROUNDING_CAPACITY, http: 409, condition: "Unit already at max_concurrent_roundings overlapping sessions in the window" }
  - { id: ERR_BOOKING_BUFFER_VIOLATION, http: 409, condition: "Room booking lacks the required 900-second buffer vs an existing BOOKED booking" }
  - { id: ERR_NO_ELIGIBLE_INVESTIGATOR, http: 409, condition: "Auto-assignment pool empty (capability/on_leave/capacity filters)" }
  - { id: ERR_INVESTIGATOR_AT_CAPACITY, http: 409, condition: "Explicit investigator has open_assignment_count >= max_concurrent_assignments" }
  - { id: ERR_INSUFFICIENT_INVESTIGATION_EVIDENCE, http: 409, condition: "submit-findings requires >= 2 notes total and >= 1 INTERVIEW note" }
  - { id: ERR_ALREADY_ACKNOWLEDGED, http: 409, condition: "Case acknowledgment already recorded" }
  - { id: ERR_SNAPSHOT_EXISTS, http: 409, condition: "TrendSnapshot cell for (unit, category, period) exists; pass force_recompute=true" }
  - { id: ERR_DUPLICATE_HOLIDAY, http: 409, condition: "HolidayObservance with same observance_date exists" }
  # --- Temporal (422) ---
  - { id: ERR_RECEIVED_AT_IN_FUTURE, http: 422, condition: "received_at is after the current logical clock" }
  - { id: ERR_ROUNDING_WINDOW_INVALID, http: 422, condition: "Rounding window end_at <= start_at or start_at before now" }
  - { id: ERR_BOOKING_WINDOW_INVALID, http: 422, condition: "Booking window end_at <= start_at or start_at before now" }
  # --- Fiscal (402) ---
  - { id: ERR_RECOVERY_CASE_CAP_EXCEEDED, http: 402, condition: "Projected cumulative ISSUED recovery value would exceed 50000 cents for the case" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform/operator administrator for org configuration, staff registry, holiday calendar, interview rooms, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/hospital-units"
      - "POST /api/staff-members"
      - "POST /api/holiday-observances + DELETE /api/holiday-observances/{id}"
      - "POST /api/interview-rooms"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /api/hospital-units/{id} (with PatientRelationsDirector)"
      - "PATCH /api/staff-members/{id} (with PatientRelationsDirector)"
      - "All GET endpoints"
  - name: IntakeCoordinator
    description: "Patient-relations intake staff: registers cases, classifies, acknowledges, manages clock suspensions, withdraws/closes cases, issues letters"
    identity: opaque
    exclusive_operations:
      - "POST /api/patient-cases"
      - "POST /api/patient-cases/{id}/classification-decisions"
      - "POST /api/patient-cases/{id}/acknowledge"
      - "POST /api/patient-cases/{id}/withdraw"
      - "POST /api/patient-cases/{id}/fast-track + POST /api/patient-cases/{id}/close"
      - "POST /api/response-letters/{id}/issue"
      - "POST /api/patient-cases/{id}/clock-suspensions + POST /api/clock-suspensions/{id}/close"
    shared_operations:
      - "All GET endpoints"
  - name: PatientAdvocate
    description: "Patient-relations advocate: rounds on units, issues service recovery within personal limit, records satisfaction responses"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /api/rounding-sessions (+ complete/cancel own sessions)"
      - "POST /api/patient-cases/{id}/recovery-actions"
      - "POST /api/follow-ups/{id}/respond"
    shared_operations:
      - "All GET endpoints"
  - name: DepartmentInvestigator
    description: "Department investigator: opens/runs investigations, notes, findings, letter drafting, interview bookings"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /api/patient-cases/{id}/investigations"
      - "POST /api/investigations/{id}/notes + submit-findings + resume"
      - "POST /api/patient-cases/{id}/response-letters + submit-review"
      - "POST /api/interview-bookings (+ cancel own)"
    shared_operations:
      - "All GET endpoints"
  - name: QualityRiskOfficer
    description: "Quality & risk officer: escalation lifecycle, regulatory reportable events, mandatory co-signer for high-severity letters"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /api/patient-cases/{id}/escalations + triage + complete-review + adjudicate"
      - "POST /api/patient-cases/{id}/reportable-events + file"
    shared_operations:
      - "POST /api/response-letters/{id}/approve (with PatientRelationsDirector; mandatory when requires_qro_cosign)"
      - "All GET endpoints"
  - name: PatientRelationsDirector
    description: "Patient relations director: assignments, findings adjudication, letter approval/return, recovery approval/revocation, reopen, unit posture"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /api/patient-cases/{id}/assignments + POST /api/case-assignments/{id}/release"
      - "POST /api/investigations/{id}/accept-findings + return-findings"
      - "POST /api/response-letters/{id}/return"
      - "POST /api/recovery-actions/{id}/approve + reject + revoke"
      - "POST /api/patient-cases/{id}/reopen"
    shared_operations:
      - "POST /api/response-letters/{id}/approve (with QualityRiskOfficer)"
      - "PATCH /api/hospital-units/{id}, PATCH /api/staff-members/{id} (with SystemAdmin)"
      - "POST /api/trend-snapshots/compute (with ComplianceAuditor)"
      - "All GET endpoints"
  - name: ComplianceAuditor
    description: "Compliance auditor: read-only oversight plus authority acknowledgments and trend computation"
    identity: opaque
    exclusive_operations:
      - "POST /api/reportable-events/{id}/acknowledge"
    shared_operations:
      - "POST /api/trend-snapshots/compute (with PatientRelationsDirector)"
      - "All GET endpoints"
