# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Pre-Employment Assessment & Structured Interview
# Enumerative coverage of every testable claim in SCAFFOLD.yaml §1.1–§1.7 that
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already cover.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: vendor_created_with_defaults_and_envelope
        claim_type: creation
        grounds: [entities.AssessmentVendor, response_envelope]
        distinguishing_aspect: "Create with only required fields applies defaults: status ACTIVE, security_clearance_tier TIER_2, content_copies_outstanding 0, version 1; success envelope carries meta.api_request_id, response_type object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
          assert:
            - "response envelope has meta.api_request_id, meta.api_request_timestamp, response_type == \"object\""
            - "Vendor ${v}: status == ACTIVE, security_clearance_tier == TIER_2 (default), content_copies_outstanding == 0, version == 1, terminated_at == null"

      - name: candidate_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Candidate.fields.group_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required group_code is rejected with ERR_INVALID_REQUEST (400); every source:input field without a default is mandatory."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/candidates", payload: { external_ref: "C-X", full_name: "Cand X", email: "cx@x.com" }, as: HiringManager, as_user_id: hm-1, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: instrument_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.AssessmentInstrument.fields.instrument_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "instrument_type outside {COGNITIVE_ABILITY, PERSONALITY, SKILLS_SIMULATION, JOB_KNOWLEDGE} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["vendor v exists ACTIVE"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "MAG-1", instrument_type: "MAGIC", title: "Magic", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: system_generated_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.AssessmentVendor, response_envelope]
        distinguishing_aspect: "Client-supplied id/version/created_at in a create body are ignored: server mints id (UUID), sets version 1, stamps created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments", id: "client-supplied-id", version: 99 }, as: TalentAssessmentAdmin, captures: { v: $.data.id, vv: $.data.version } }
          assert:
            - "Vendor id != \"client-supplied-id\" (server-minted UUID) AND version == 1 (client 99 ignored)"

      - name: cycle_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /talent/cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: TalentAssessmentAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND (http 404)"]

      - name: instruments_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /talent/instruments]"]
        distinguishing_aspect: "Default pagination is limit 10 / offset 0: 11 instruments -> first page 10 items with total_count 11 and has_more true; offset 10 -> 1 item, has_more false."
        test_recipe:
          setup: ["vendor v; eleven instruments created"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-01", instrument_type: "COGNITIVE_ABILITY", title: "I1", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-02", instrument_type: "COGNITIVE_ABILITY", title: "I2", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-03", instrument_type: "COGNITIVE_ABILITY", title: "I3", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-04", instrument_type: "COGNITIVE_ABILITY", title: "I4", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-05", instrument_type: "COGNITIVE_ABILITY", title: "I5", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-06", instrument_type: "COGNITIVE_ABILITY", title: "I6", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-07", instrument_type: "COGNITIVE_ABILITY", title: "I7", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-08", instrument_type: "COGNITIVE_ABILITY", title: "I8", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-09", instrument_type: "COGNITIVE_ABILITY", title: "I9", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-10", instrument_type: "COGNITIVE_ABILITY", title: "I10", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "I-11", instrument_type: "COGNITIVE_ABILITY", title: "I11", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin }
          trigger:
            - { call: "GET /talent/instruments", payload: { vendor_id: "${v}" }, as: TalentAssessmentAdmin }
            - { call: "GET /talent/instruments", payload: { vendor_id: "${v}", offset: 10 }, as: TalentAssessmentAdmin }
          assert:
            - "page 1: response_type == \"array\", data length == 10, total_count == 11, has_more == true (default limit 10)"
            - "page 2 (offset 10): data length == 1, total_count == 11, has_more == false"

      - name: duplicate_invitation_rejected
        claim_type: type_constraints
        grounds: [entities.CandidateAssessment.fields.candidate_id, "errors[ERR_DUPLICATE_INVITATION]"]
        distinguishing_aspect: "(cycle_id, candidate_id) uniqueness: second invitation of the same candidate into the same cycle -> 409 ERR_DUPLICATE_INVITATION."
        test_recipe:
          setup: ["cycle cy in SETUP (invitations allowed in SETUP and ACTIVE); candidate c1 ACTIVE"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 2 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Fall Cycle", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { cy: $.data.id } }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-1", full_name: "Cand One", email: "c1@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { c1: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${c1}" }, as: HiringManager, as_user_id: hm-1, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${c1}" }, as: HiringManager, as_user_id: hm-1, captures: { err: $.data.error_id } }
          assert: ["err == ERR_DUPLICATE_INVITATION (409); cycle ${cy}.active_candidate_count still == 1"]

      - name: guide_rubric_bad_weight_sum_rejected
        claim_type: type_constraints
        grounds: [entities.InterviewGuide.fields.rubric_items, "errors[ERR_RUBRIC_WEIGHT_SUM]"]
        distinguishing_aspect: "Rubric weights 0.5 + 0.4 = 0.9 != 1.0000 -> ERR_RUBRIC_WEIGHT_SUM at create; the 4dp-exact sum rule is enforced before any state transition."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/interview-guides", payload: { title: "Bad Guide", rubric_items: [{ competency_code: "COMM", weight: 0.5, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { err: $.data.error_id } }
          assert: ["err == ERR_RUBRIC_WEIGHT_SUM (400)"]

      - name: fk_reverse_reachability_filtered_lists
        claim_type: parent_relationships
        grounds: [entities.HiringDecision.fields.cycle_id, entities.HiringDecision.fields.candidate_id, "endpoints[GET /talent/decisions]"]
        distinguishing_aspect: "Every multi-FK child is reachable from each parent via filtered list: after one decision, GET /talent/decisions?cycle_id and ?candidate_id each return exactly that decision."
        test_recipe:
          setup: ["full quorum chain: cycle ACTIVE, c1 COMPLETED, sessions s1/s2 SCORED (iv1 COMM4/ANAL5, iv2 COMM5/ANAL3), decision d1 created"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 2 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Fall Cycle", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z", max_sessions_per_day: 8 }, as: HiringManager, as_user_id: hm-1, captures: { cy: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/activate", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/interviewers", payload: { full_name: "Ivy One", email: "ivy1@x.com", department: "Risk" }, as: TalentAssessmentAdmin, captures: { iv1: $.data.id } }
            - { call: "POST /talent/interviewers", payload: { full_name: "Ivy Two", email: "ivy2@x.com", department: "Risk" }, as: TalentAssessmentAdmin, captures: { iv2: $.data.id } }
            - { call: "POST /talent/interviewers/${iv1}/calibrations", payload: { guide_id: "${g}" }, as: TalentAssessmentAdmin, captures: { cal1: $.data.id } }
            - { call: "POST /talent/calibrations/${cal1}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/interviewers/${iv2}/calibrations", payload: { guide_id: "${g}" }, as: TalentAssessmentAdmin, captures: { cal2: $.data.id } }
            - { call: "POST /talent/calibrations/${cal2}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-1", full_name: "Cand One", email: "c1@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { c1: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${c1}" }, as: HiringManager, as_user_id: hm-1, captures: { a1: $.data.id } }
            - { call: "POST /talent/assessments/${a1}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/assessments/${a1}/start", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${a1}/complete", payload: { raw_score: 72 }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/cycles/${cy}/sessions", payload: { candidate_id: "${c1}", interviewer_id: "${iv1}", guide_id: "${g}", scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T10:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s1: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/sessions", payload: { candidate_id: "${c1}", interviewer_id: "${iv2}", guide_id: "${g}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s2: $.data.id } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T11:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/sessions/${s1}/complete", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/sessions/${s2}/complete", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/sessions/${s1}/scorecards", payload: { ratings: [{ competency_code: "COMM", rating: 4 }, { competency_code: "ANAL", rating: 5 }], overall_recommendation: "YES" }, as: Interviewer, as_user_id: "${iv1}", captures: { sc1: $.data.id } }
            - { call: "POST /talent/sessions/${s2}/scorecards", payload: { ratings: [{ competency_code: "COMM", rating: 5 }, { competency_code: "ANAL", rating: 3 }], overall_recommendation: "YES" }, as: Interviewer, as_user_id: "${iv2}", captures: { sc2: $.data.id } }
            - { call: "POST /talent/scorecards/${sc1}/submit", as: Interviewer, as_user_id: "${iv1}" }
            - { call: "POST /talent/scorecards/${sc2}/submit", as: Interviewer, as_user_id: "${iv2}" }
            - { call: "POST /talent/cycles/${cy}/decisions", payload: { candidate_id: "${c1}", decision: "ADVANCE", rationale: "Candidate demonstrated strong structured problem solving and communication across panels." }, as: DecisionOfficer, as_user_id: do-1, captures: { d1: $.data.id } }
          trigger:
            - { call: "GET /talent/decisions", payload: { cycle_id: "${cy}" }, as: ComplianceOfficer }
            - { call: "GET /talent/decisions", payload: { candidate_id: "${c1}" }, as: ComplianceOfficer }
            - { call: "GET /talent/scorecards", payload: { session_id: "${s1}" }, as: ComplianceOfficer }
            - { call: "GET /talent/scorecards", payload: { interviewer_id: "${iv2}", candidate_id: "${c1}" }, as: ComplianceOfficer }
          assert:
            - "GET /talent/decisions?cycle_id=${cy} -> array of length 1 containing ${d1}; same for ?candidate_id=${c1}"
            - "GET /talent/scorecards?session_id=${s1} -> exactly [${sc1}]; ?interviewer_id=${iv2}&candidate_id=${c1} -> exactly [${sc2}]"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminate_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AssessmentVendor, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "TERMINATED is fully terminal: suspend on a terminated vendor -> 409 ERR_ALREADY_TERMINAL; no transition leaves TERMINATED."
        test_recipe:
          setup: ["vendor v TERMINATED (outstanding 0)"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/vendors/${v}/terminate", as: TalentAssessmentAdmin }
          trigger:
            - { call: "POST /talent/vendors/${v}/suspend", as: TalentAssessmentAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /talent/vendors/${v}/reinstate", as: TalentAssessmentAdmin, captures: { err2: $.data.error_id } }
          assert: ["err == ERR_ALREADY_TERMINAL", "err2 == ERR_ALREADY_TERMINAL", "vendor.status remains TERMINATED"]

      - name: guide_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InterviewGuide, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVED is reachable only from PILOT: approve on a DRAFT guide -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["guide g in DRAFT (valid rubric)"]
          setup_api_calls:
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_STATE; guide.status remains DRAFT"]

      - name: scorecard_resubmit_rejected
        claim_type: idempotency
        grounds: [state_machines.Scorecard.DRAFT_to_SUBMITTED, "errors[ERR_SCORECARD_NOT_DRAFT]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED scorecard is rejected (ERR_SCORECARD_NOT_DRAFT) — the transition is not idempotent and no duplicate side effects fire."
        test_recipe:
          setup: ["cycle ACTIVE; c1 COMPLETED; session s1 SCORED (scorecard sc1 SUBMITTED at clock 2026-08-12T11:00)"]
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 2 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
