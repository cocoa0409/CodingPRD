          assert:
            - "the trailer rollup reads loaded_cube_m3 == 1.2345 + 1.2345 == 2.4690 and nested_cube_m3 == 1.2345 + round(1.2345 * 0.5000, 4) == 1.2345 + 0.6173 == 1.8518 — the nest_position 1 line pays its full gross cube and 0.61725 rounds HALF_UP to 0.6173, not down to 0.6172"
            - "cube_utilization_pct == round(1.8518 / 3.0000 * 100, 2) == round(61.726666..., 2) == 61.73 and density_kg_per_m3 == round(60.000 / 1.8518, 3) == 32.401 — both derived from the NESTED cube, never the gross"
            - "the pre-seal freight-summary reports quoted_freight_cents == null and billed_freight_cents == null while already reporting discount_rate_pct == 3.00 and quoted_pre_discount_cents == 13556, so the tier is a pure function of the loaded lines and not of the seal"
            - "quoted per-line: line 1 dim_weight = round(1.2345 * 120.000, 3) == 148.140, chargeable = max(30.000, 148.140) == 148.140, freight = round_half_up(148.140 * 61) == round_half_up(9036.54) == 9037; line 2 dim_weight = round(0.6173 * 120.000, 3) == 74.076, chargeable == 74.076, freight = round_half_up(74.076 * 61) == round_half_up(4518.636) == 4519"
