scenario: |
  2605. Cord Blood Banking & Unit Release (cord blood bank): expectant parent enrollment, consent and
  collection kit dispatch, collection at delivery with volume and time-to-processing limits, processing,
  volume reduction, cell count and viability testing with acceptance thresholds, cryopreservation, storage
  tank inventory and temperature alarm response, maternal infectious disease testing and eligibility
  determination, public bank listing on a registry versus private family storage account billing, unit
  search, reservation and release for transplant with confirmatory testing, storage fee delinquency,
  abandonment and disposition policy

domain_name: cord-blood-banking-unit-release
api_prefix: "/cbb"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection at `/cbb/<collection>`; parentage is expressed only through
  # `FK -> {Entity}.id` body fields, never through nested creation paths. Nested GETs exist purely as
  # reverse-reachability read channels and create nothing.

  state_machine_shape: parallel
  # CordBloodUnit carries three independent state axes (processing_status x availability_status x
  # eligibility_status); Enrollment carries two (lifecycle_status x consent_status, the latter cyclic);
  # Reservation is a branching fork-join (PENDING_CONFIRMATORY -> {CONFIRMED, DECLINED} -> {RELEASED,
  # CANCELLED}) with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Enrollment -> CollectionKit, CordBloodUnit -> QualityTest
    - cross_aggregate      # CordBloodUnit.storage_account_id crosses the billing aggregate boundary
    - self_referential     # Reservation.superseded_by_reservation_id -> Reservation.id

  role_model: segregation_of_duties
  # The MedicalDirector who determines a unit's eligibility MUST NOT be the technologist who ran its
  # POST_PROCESSING quality test, and the MedicalDirector who authorises release MUST NOT be the one
  # who determined eligibility.

  consistency_model: immediate

difficulty_level: expert_plus
# 13 entities / 63 endpoints / 53 error codes / 18 calculations (2 dual-variant) / 15 state-machine
# blocks across 12 entities, three of them multi-axis (CordBloodUnit x3, Enrollment x2).
# Deliberately above the Expert band (10-15 entities / 20-32 endpoints / 18-30 errors / 3+ variants /
# 4+ state machines) on every axis.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: program_type
        type: enum
        source: input
        description: "PRIVATE_FAMILY units are billed to a StorageAccount; PUBLIC_DONATION units are listed on a registry"
        constraints: "one of {PRIVATE_FAMILY, PUBLIC_DONATION}; immutable after creation"
      - name: primary_parent_name
        type: string
        source: input
        description: "Name of the consenting expectant parent"
        constraints: "1..120 chars"
      - name: expected_delivery_date
        type: datetime
        source: input
        description: "Estimated date of delivery; anchors the maternal-screening validity window"
        constraints: "ISO 8601 UTC"
      - name: collection_site_code
        type: string
        source: input
        description: "Code of the hospital that will perform the collection"
        constraints: "1..20 chars"
      - name: research_use_authorized
        type: boolean
        source: input
        description: "Consent flag permitting research use of a unit that fails clinical acceptance"
        default: false
      - name: hla_typing_consent
        type: boolean
        source: input
        description: "Consent flag required before a PUBLIC_DONATION unit may be listed on a registry"
        default: false
      - name: lifecycle_status
        type: enum
        source: system
        description: "Operational progress of the enrollment"
        default: CONSENT_PENDING
        constraints: "one of {CONSENT_PENDING, ACTIVE, KIT_DISPATCHED, COLLECTED, CLOSED, WITHDRAWN}"
      - name: consent_status
        type: enum
        source: system
        description: "Currency of the informed consent document; cyclic axis independent of lifecycle_status"
        default: PENDING
        constraints: "one of {PENDING, CONSENTED, AMENDMENT_PENDING, REVOKED}"
      - name: consent_version
        type: integer
        source: system
        description: "Increments by 1 each time consent_status becomes CONSENTED"
        default: 0
      - name: consent_amendment_count
        type: integer
        source: system
        description: "Number of completed CONSENTED -> AMENDMENT_PENDING transitions; capped by MAX_CONSENT_AMENDMENTS"
        default: 0
      - name: consent_signed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent CONSENTED transition; null while PENDING"
      - name: withdrawal_reason_code
        type: string
        source: system
        description: "Reason recorded when lifecycle_status becomes WITHDRAWN; null otherwise"

  - name: StorageAccount
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; at most one StorageAccount per Enrollment; the Enrollment MUST have program_type == PRIVATE_FAMILY"
      - name: billing_contact_email
        type: string
        source: input
        description: "Billing contact for storage invoices"
        constraints: "must contain '@'"
      - name: plan_term_years
        type: integer
        source: input
        description: "Prepaid storage term; selects the storage_fee_assessment variant (1 -> ANNIVERSARY_ACCRUAL, >=5 -> PRORATED_TERMINATION)"
        constraints: "one of {1, 5, 18}"
      - name: prepaid_through_date
        type: datetime
        source: input
        description: "Date through which storage is prepaid at account creation; seeds paid_through_date"
        constraints: "ISO 8601 UTC"
      - name: paid_through_date
        type: datetime
        source: system
        description: "Latest billing_period_end covered by a PAID invoice, or prepaid_through_date if greater"
      - name: status
        type: enum
        source: system
        description: "Delinquency posture of the billing account"
        default: ACTIVE
        constraints: "one of {ACTIVE, PAST_DUE, DELINQUENT, ABANDONMENT_NOTICE, ABANDONED, CLOSED}"
      - name: balance_cents
        type: integer
        source: computed
        description: "Outstanding balance; see calculations.account_balance_reconciliation"
        default: 0
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Monotonic sum of all accepted payment amounts; never decreases"
        default: 0
      - name: last_settlement_total_cents
        type: integer
        source: computed
        description: "Result of calculations.disposition_settlement for the most recent unit that left inventory (release or disposal) on this account; null before the first settlement"
      - name: delinquency_stage_entered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status last advanced along the delinquency ladder"

  - name: CollectionKit
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the Enrollment MUST have consent_status == CONSENTED at dispatch time"
      - name: kit_lot_code
        type: string
        source: input
        description: "Manufacturing lot of the collection kit"
        constraints: "1..30 chars"
      - name: courier_tracking_code
        type: string
        source: input
        description: "Courier tracking reference for the outbound dispatch"
        constraints: "1..40 chars"
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical-clock instant of dispatch"
      - name: expires_at
        type: datetime
        source: computed
        description: "dispatched_at + KIT_SHELF_LIFE_DAYS days; a Collection may not be recorded on an expired kit"
      - name: status
        type: enum
        source: system
        description: "Kit lifecycle"
        default: DISPATCHED
        constraints: "one of {DISPATCHED, HELD, USED, EXPIRED, RETURNED}"
      - name: hold_reason_code
        type: string
        source: system
        description: "Reason the kit was moved to HELD (e.g. CONSENT_AMENDMENT_PENDING); null otherwise"

  - name: Collection
    parent: null
    common_fields: true
    fields:
      - name: kit_id
        type: string
        source: input
        description: "FK -> CollectionKit.id; the kit MUST be in status DISPATCHED and not past expires_at"
      - name: collected_at
        type: datetime
        source: input
        description: "Instant the cord blood was collected at delivery"
        constraints: "ISO 8601 UTC"
      - name: collection_volume_ml
        type: number
        source: input
        description: "Gross collected volume including anticoagulant"
        constraints: "> 0; 1 decimal place"
      - name: anticoagulant_volume_ml
        type: number
        source: input
        description: "Volume of CPD anticoagulant present in collection_volume_ml"
        constraints: ">= 0; < collection_volume_ml"
      - name: delivery_mode
        type: enum
        source: input
        description: "Mode of delivery, recorded for registry reporting"
        constraints: "one of {VAGINAL, CESAREAN}"
      - name: transport_temp_c
        type: number
        source: input
        description: "Temperature of the shipper on arrival at the processing laboratory"
        constraints: "1 decimal place"
      - name: net_volume_ml
        type: number
        source: computed
        description: "collection_volume_ml - anticoagulant_volume_ml, rounded to 1 decimal place"
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant the laboratory accepted the shipment; null until receive"
      - name: hours_to_receipt
        type: number
        source: computed
        description: "Elapsed hours collected_at -> received_at, rounded to 2 decimals; null until receive"
      - name: status
        type: enum
        source: system
        description: "Collection lifecycle"
        default: COLLECTED
        constraints: "one of {COLLECTED, RECEIVED, REJECTED_LATE, REJECTED_TEMP, REJECTED_VOLUME, DISCARDED}"
      - name: rejection_reason_code
        type: string
        source: system
        description: "Reason recorded by the explicit reject action; null otherwise"

  - name: CordBloodUnit
    parent: null
    common_fields: true
    fields:
      - name: collection_id
        type: string
        source: input
        description: "FK -> Collection.id; exactly one CordBloodUnit per Collection, minted by the receive action"
      - name: tank_id
        type: string
        source: system
        description: "FK -> StorageTank.id; null until cryopreservation assigns a slot"
      - name: storage_account_id
        type: string
        source: computed
        description: "FK -> StorageAccount.id; resolved at unit creation along collection_id -> Collection.kit_id -> CollectionKit.enrollment_id -> the StorageAccount whose enrollment_id equals it; null for PUBLIC_DONATION units and for PRIVATE_FAMILY enrollments that have no StorageAccount yet"
      - name: unit_registry_code
        type: string
        source: system
        description: "Deterministic label 'CBU-' + zero-padded 6-digit creation sequence number (1-based, ordered by created_at ASC); never derived from id"
      - name: program_type
        type: enum
        source: computed
        description: "Copied from the owning Enrollment at creation; selects the acceptance tier"
        constraints: "one of {PRIVATE_FAMILY, PUBLIC_DONATION}"
      - name: processing_status
        type: enum
        source: system
        description: "Laboratory-processing axis; evolves independently of availability_status"
        default: RECEIVED
        constraints: "one of {RECEIVED, PROCESSING, VOLUME_REDUCED, CRYOPRESERVED, DISCARDED}"
      - name: availability_status
        type: enum
        source: system
        description: "Inventory/allocation axis; evolves independently of processing_status"
        default: UNAVAILABLE
        constraints: "one of {UNAVAILABLE, PRIVATE_STORED, LISTED, RESERVED, RELEASED, QUARANTINED, PENDING_ABANDONMENT, DISPOSED}"
      - name: eligibility_status
        type: enum
        source: system
        description: "Clinical-eligibility axis derived from maternal screening plus quality testing"
        default: PENDING
        constraints: "one of {PENDING, ELIGIBLE, INELIGIBLE, INDETERMINATE}"
      - name: eligibility_reason_code
        type: string
        source: system
        description: "Machine code explaining the current eligibility_status; null while PENDING"
      - name: eligibility_determined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MedicalDirector who ran the eligibility determination; segregation-of-duties anchor for release"
      - name: post_processing_volume_ml
        type: number
        source: computed
        description: "post_volume_ml of the COMPLETED ProcessingRun on this unit; null before completion"
      - name: post_processing_tnc_millions
        type: integer
        source: computed
        description: "Total nucleated cells in millions from the single POST_PROCESSING QualityTest; null before it exists"
      - name: post_processing_cd34_thousands
        type: integer
        source: computed
        description: "CD34+ cells in thousands from the single POST_PROCESSING QualityTest; null before it exists"
      - name: post_processing_viability_pct
        type: number
        source: computed
        description: "Viability percentage from the single POST_PROCESSING QualityTest; null before it exists"
      - name: quality_acceptance_score
        type: number
        source: computed
        description: "Tiered acceptance score 0.00..100.00; see calculations.unit_quality_acceptance_score"
      - name: slot_code
        type: string
        source: system
        description: "Physical slot label inside tank_id; null until cryopreserved"
      - name: cryopreserved_at
        type: datetime
        source: system
        description: "freeze_at supplied to the cryopreserve action; null until cryopreserved"
      - name: quarantine_reason_code
        type: string
        source: system
        description: "Reason availability_status became QUARANTINED; null otherwise"
      - name: disposition_reason
        type: enum
        source: system
        description: "Terminal disposition reason; null until availability_status is DISPOSED or RELEASED"
        constraints: "one of {ABANDONED_NONPAYMENT, QUALITY_FAILURE, MATERNAL_INELIGIBLE, CONSENT_REVOKED, EXCURSION_LOSS, TRANSPLANT_RELEASED}"
      - name: disposed_at
        type: datetime
        source: system
        description: "Logical-clock instant the unit left inventory (DISPOSED or RELEASED); null otherwise"

  - name: ProcessingRun
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> CordBloodUnit.id; at most one run in status IN_PROGRESS per unit"
      - name: method
        type: enum
        source: input
        description: "Volume-reduction method"
        constraints: "one of {HES_SEDIMENTATION, AUTOMATED_SEPARATION}"
      - name: pre_tnc_millions
        type: integer
        source: input
        description: "Total nucleated cells in millions measured on the raw collection before volume reduction"
        constraints: "> 0"
      - name: pre_volume_ml
        type: number
        source: computed
        description: "Copied from Collection.net_volume_ml of the unit's collection at run creation"
      - name: post_volume_ml
        type: number
        source: input
        description: "Volume in ml after volume reduction; supplied on the complete action"
        constraints: "> 0; 1 decimal place"
      - name: post_tnc_millions
        type: integer
        source: input
        description: "Total nucleated cells in millions after volume reduction; supplied on the complete action"
        constraints: "> 0"
      - name: tnc_recovery_pct
        type: number
        source: computed
        description: "round_half_up(post_tnc_millions / pre_tnc_millions * 100, 2); null until COMPLETED"
      - name: volume_reduction_pct
        type: number
        source: computed
        description: "round_half_up((pre_volume_ml - post_volume_ml) / pre_volume_ml * 100, 2); null until COMPLETED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the run was created"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the run reached COMPLETED or FAILED"
      - name: operator_user_id
        type: string
        source: system
        description: "X-User-ID of the ProcessingTechnologist who created the run"
      - name: status
        type: enum
        source: system
        description: "Run lifecycle"
        default: IN_PROGRESS
        constraints: "one of {IN_PROGRESS, COMPLETED, FAILED}"

  - name: QualityTest
    parent: null
    common_fields: false
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> CordBloodUnit.id"
      - name: test_kind
        type: enum
        source: input
        description: "POST_PROCESSING is the acceptance test on the reduced unit; CONFIRMATORY is the attached-segment thaw test performed for a reservation"
        constraints: "one of {POST_PROCESSING, CONFIRMATORY}; at most one POST_PROCESSING test per unit"
      - name: tnc_millions
        type: integer
        source: input
        description: "Total nucleated cells in millions measured by this test"
        constraints: "> 0"
      - name: cd34_thousands
        type: integer
        source: input
        description: "CD34+ cells in thousands measured by this test"
        constraints: "> 0"
      - name: viability_pct
        type: number
        source: input
        description: "7-AAD viability percentage measured by this test"
        constraints: "0.0 .. 100.0; 1 decimal place"
      - name: volume_ml
        type: number
        source: input
        description: "Volume in ml of the tested product"
        constraints: "> 0; 1 decimal place"
      - name: sterility_result
        type: enum
        source: input
        description: "Sterility culture outcome"
        constraints: "one of {NEGATIVE, POSITIVE, PENDING}"
      - name: performed_at
        type: datetime
        source: system
        description: "Logical-clock instant the test was recorded"
      - name: performed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProcessingTechnologist who recorded the test; segregation-of-duties anchor for eligibility determination"
      - name: outcome
        type: enum
        source: computed
        description: "PASS when the test clears every threshold of its kind and tier, else FAIL; see calculations.quality_test_outcome"
        constraints: "one of {PASS, FAIL}"
      - name: failure_reason_codes
        type: array
        source: computed
        description: "Sorted-ascending list of threshold codes that failed; empty array when outcome is PASS"

  - name: MaternalScreening
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the latest COMPLETED screening by created_at ASC governs eligibility"
      - name: collected_at
        type: datetime
        source: input
        description: "Instant the maternal blood sample was drawn"
        constraints: "ISO 8601 UTC"
      - name: hiv_result
        type: enum
        source: input
        description: "HIV-1/2 marker result"
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE, PENDING}"
      - name: hbv_result
        type: enum
        source: input
        description: "Hepatitis B marker result"
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE, PENDING}"
      - name: hcv_result
        type: enum
        source: input
        description: "Hepatitis C marker result"
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE, PENDING}"
      - name: htlv_result
        type: enum
        source: input
        description: "HTLV-I/II marker result"
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE, PENDING}"
      - name: syphilis_result
        type: enum
        source: input
        description: "Treponemal marker result"
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE, PENDING}"
      - name: cmv_result
        type: enum
        source: input
        description: "CMV marker result; informational only, never drives overall_result"
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE, PENDING}"
      - name: nat_confirmed
        type: boolean
        source: input
        description: "True when nucleic-acid testing confirmed the serology panel"
        default: false
      - name: overall_result
        type: enum
        source: computed
        description: "REACTIVE if any of the five governing markers is REACTIVE; else INDETERMINATE if any is INDETERMINATE; else NON_REACTIVE; null while status is PENDING or INVALID"
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE}"
      - name: reactive_marker_codes
        type: array
        source: computed
        description: "Sorted-ascending list of governing marker names whose result is REACTIVE; empty array otherwise"
      - name: valid_until
        type: datetime
        source: computed
        description: "collected_at + MATERNAL_SCREEN_VALIDITY_DAYS days; the nightly run expires screenings past this instant"
      - name: status
        type: enum
        source: system
        description: "Screening record lifecycle"
        default: PENDING
        constraints: "one of {PENDING, COMPLETED, INVALID, EXPIRED}"

  - name: StorageTank
    parent: null
    common_fields: true
    fields:
      - name: tank_code
        type: string
        source: input
        description: "Globally unique tank label"
        constraints: "1..20 chars; unique across all tanks"
      - name: tank_class
        type: enum
        source: input
        description: "PREMIUM tanks attract TANK_PREMIUM_SURCHARGE_PCT on every storage invoice line base"
        constraints: "one of {STANDARD, PREMIUM}"
      - name: capacity_slots
        type: integer
        source: input
        description: "Total physical slots in the tank"
        constraints: ">= 1"
      - name: maintenance_window_start
        type: datetime
        source: input
        description: "Inclusive start of the scheduled maintenance window; null when no window is scheduled"
      - name: maintenance_window_end
        type: datetime
        source: input
        description: "Exclusive end of the scheduled maintenance window; null when no window is scheduled; MUST be > maintenance_window_start when both are present"
      - name: occupied_slots
        type: integer
        source: computed
        description: "count(CordBloodUnit WHERE tank_id == this.id AND availability_status NOT IN {RELEASED, DISPOSED}); see calculations.tank_slot_occupancy"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Operational posture; only ONLINE tanks accept new cryopreservation"
        default: ONLINE
        constraints: "one of {ONLINE, ALARM, MAINTENANCE, OFFLINE}"
      - name: last_temperature_c
        type: number
        source: system
        description: "Temperature of the most recent reading by reading_at ASC; null before the first reading"
      - name: last_reading_at
        type: datetime
        source: system
        description: "reading_at of the most recent reading; null before the first reading"
      - name: cumulative_excursion_minutes_30d
        type: integer
        source: computed
        description: "Merged excursion minutes inside the rolling window [clock - EXCURSION_WINDOW_DAYS days, clock]; see calculations.cumulative_excursion_minutes_30d"
        default: 0

  - name: TemperatureExcursion
    parent: null
    common_fields: true
    fields:
      - name: tank_id
        type: string
        source: system
        description: "FK -> StorageTank.id; set from the path of the temperature-reading action that opened the excursion"
      - name: detected_at
        type: datetime
        source: system
        description: "reading_at of the reading that crossed ALARM_THRESHOLD_C"
      - name: peak_temperature_c
        type: number
        source: system
        description: "Warmest reading_c observed while this excursion is not RESOLVED/CLOSED_LOSS"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant a FacilitiesEngineer acknowledged the alarm; null while OPEN"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the acknowledging FacilitiesEngineer; null while OPEN"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the resolve action; null before resolution"
      - name: duration_minutes
        type: integer
        source: computed
        description: "floor((resolved_at - detected_at) in whole minutes); null before resolution"
      - name: disposition
        type: enum
        source: input
        description: "Engineering judgement supplied to the resolve action"
        constraints: "one of {NO_IMPACT, REQUALIFY, TOTAL_LOSS}"
      - name: status
        type: enum
        source: system
        description: "Alarm-response lifecycle"
        default: OPEN
        constraints: "one of {OPEN, ACKNOWLEDGED, ESCALATED, RESOLVED, CLOSED_LOSS}"

  - name: RegistryListing
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> CordBloodUnit.id; at most one listing with listing_status == ACTIVE per unit"
      - name: registry_code
        type: string
        source: input
        description: "Identifier of the public registry the unit is published to"
        constraints: "1..20 chars"
      - name: hla_a
        type: string
        source: input
        description: "HLA-A allele pair string published to the registry"
        constraints: "1..20 chars"
      - name: hla_b
        type: string
        source: input
        description: "HLA-B allele pair string published to the registry"
        constraints: "1..20 chars"
      - name: hla_drb1
        type: string
        source: input
        description: "HLA-DRB1 allele pair string published to the registry"
        constraints: "1..20 chars"
      - name: listed_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication"
      - name: potency_grade
        type: enum
        source: computed
        description: "A / B / C grade from the unit's post-processing counts; see calculations.registry_potency_grade"
        constraints: "one of {A, B, C}"
      - name: listing_status
        type: enum
        source: system
        description: "Registry publication state"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, WITHDRAWN, MATCHED}"
      - name: suspension_reason_code
        type: string
        source: system
        description: "Reason listing_status became SUSPENDED; one of {UNIT_QUARANTINED, CONSENT_AMENDMENT_PENDING, MATERNAL_REACTIVE, SCREENING_EXPIRED, REGISTRY_HOLD}; null otherwise"

  - name: StorageInvoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> StorageAccount.id"
      - name: billing_period_start
        type: datetime
        source: input
        description: "Inclusive start of the billed period"
        constraints: "ISO 8601 UTC"
      - name: billing_period_end
        type: datetime
        source: input
        description: "Exclusive end of the billed period; MUST be > billing_period_start"
        constraints: "ISO 8601 UTC"
      - name: prorated_days
        type: integer
        source: input
        description: "Billable day count driving the base line; the base line is a proration of ANNUAL_STORAGE_FEE_CENTS over DAYS_PER_BILLING_YEAR"
        constraints: "1 .. 365"
      - name: due_date
        type: datetime
        source: computed
        description: "billing_period_start + INVOICE_NET_DAYS days"
      - name: base_line_cents
        type: integer
        source: computed
        description: "round_half_up(ANNUAL_STORAGE_FEE_CENTS * prorated_days / DAYS_PER_BILLING_YEAR)"
      - name: surcharge_line_cents
        type: integer
        source: computed
        description: "round_half_up(base_line_cents * TANK_PREMIUM_SURCHARGE_PCT) when the account's unit sits in a PREMIUM tank, else 0"
      - name: admin_line_cents
        type: integer
        source: computed
        description: "round_half_up(ANNUAL_STORAGE_FEE_CENTS * ADMIN_FEE_PCT)"
      - name: late_fee_line_cents
        type: integer
        source: computed
        description: "Accumulated late fees added by nightly-run delinquency advances; 0 at issue"
        default: 0
      - name: amount_due_cents
        type: integer
        source: computed
        description: "base_line_cents + surcharge_line_cents + admin_line_cents + late_fee_line_cents (per-line rounding, then sum)"
      - name: amount_paid_cents
        type: integer
        source: system
        description: "Sum of accepted payments against this invoice"
        default: 0
      - name: stage_advanced_at
        type: datetime
        source: system
        description: "Logical-clock instant status last advanced along the delinquency ladder; null while ISSUED and never advanced"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle"
        default: ISSUED
        constraints: "one of {ISSUED, PAID, PAST_DUE, DELINQUENT, WRITTEN_OFF, VOID}"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> CordBloodUnit.id"
      - name: superseded_by_reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; set on a DECLINED or CANCELLED reservation when a later reservation on the same unit reaches CONFIRMED; null otherwise"
      - name: confirmatory_test_id
        type: string
        source: system
        description: "FK -> QualityTest.id; set when a CONFIRMATORY QualityTest is recorded against this reservation; null until then"
      - name: requesting_center_user_id
        type: string
        source: system
        description: "X-User-ID of the TransplantCenter that created the reservation; ownership anchor for confirm/decline/cancel"
      - name: requesting_center_name
        type: string
        source: input
        description: "Human-readable transplant centre name"
        constraints: "1..120 chars"
      - name: patient_weight_kg
        type: number
        source: input
        description: "Recipient weight used by both cell-dose variants"
        constraints: "> 0; 1 decimal place"
      - name: patient_hla_match_count
        type: integer
        source: input
        description: "Number of matched HLA loci out of 6 declared by the requesting centre"
        constraints: "0 .. 6"
      - name: hold_from
        type: datetime
        source: input
        description: "Inclusive start of the exclusive hold window on the unit"
        constraints: "ISO 8601 UTC"
      - name: hold_until
        type: datetime
        source: input
        description: "Inclusive end of the exclusive hold window on the unit; MUST be > hold_from"
        constraints: "ISO 8601 UTC"
      - name: intended_transplant_date
        type: datetime
        source: input
        description: "Planned infusion date supplied on the confirm action; null while PENDING_CONFIRMATORY"
      - name: pre_cryo_dose_x1e7_per_kg
        type: number
        source: computed
        description: "PRE_CRYO variant of calculations.nucleated_cell_dose, evaluated at reservation creation"
      - name: post_thaw_dose_x1e7_per_kg
        type: number
        source: computed
        description: "POST_THAW variant of calculations.nucleated_cell_dose, evaluated when a CONFIRMATORY QualityTest is attached; null before that"
      - name: dose_variant_applied
        type: enum
        source: system
        description: "Which variant the most recent gating decision used"
        default: PRE_CRYO
        constraints: "one of {PRE_CRYO, POST_THAW}"
      - name: settlement_total_cents
        type: integer
        source: computed
        description: "Result of calculations.disposition_settlement at release; null before release"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of release authorisation; null otherwise"
      - name: cancellation_reason_code
        type: string
        source: system
        description: "Reason recorded when status becomes CANCELLED, DECLINED or EXPIRED; null otherwise"
      - name: status
        type: enum
        source: system
        description: "Branching reservation lifecycle"
        default: PENDING_CONFIRMATORY
        constraints: "one of {PENDING_CONFIRMATORY, CONFIRMED, DECLINED, RELEASED, CANCELLED, EXPIRED}"

state_machines:
  # ---------------- Enrollment: two independent axes ----------------
  - entity: Enrollment
    state_field: lifecycle_status
    initial_state: CONSENT_PENDING
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: CONSENT_PENDING
        to: ACTIVE
        trigger: "POST /cbb/enrollments/{id}/consent"
        actor: ParentGuardian
        preconditions:
          - "consent_status IN {PENDING, AMENDMENT_PENDING}"
        side_effects:
          - "consent_status := CONSENTED (see the consent_status machine below)"
          - "consent_version := consent_version + 1"
          - "consent_signed_at := logical clock now"
        note: "Only the first consent moves lifecycle_status; later re-consents leave lifecycle_status untouched."
      - from: ACTIVE
        to: KIT_DISPATCHED
        trigger: "POST /cbb/collection-kits (enrollment_id in body)"
        actor: IntakeCoordinator
        preconditions:
          - "consent_status == CONSENTED"
          - "no CollectionKit for this enrollment with status IN {DISPATCHED, HELD}"
        side_effects:
          - "CollectionKit created with status DISPATCHED, dispatched_at := clock, expires_at := clock + KIT_SHELF_LIFE_DAYS days"
      - from: KIT_DISPATCHED
        to: COLLECTED
        trigger: "POST /cbb/collections (kit_id in body)"
        actor: CollectionSite
        preconditions:
          - "consent_status == CONSENTED"
          - "CollectionKit.status == DISPATCHED AND clock <= CollectionKit.expires_at"
        side_effects:
          - "CollectionKit.status := USED"
          - "Collection created with status COLLECTED and net_volume_ml computed"
      - from: COLLECTED
        to: CLOSED
        trigger: "system, cascaded from POST /cbb/units/{id}/dispose or POST /cbb/reservations/{id}/release"
        actor: system
        preconditions:
          - "every CordBloodUnit reachable from this enrollment has availability_status IN {DISPOSED, RELEASED}"
        side_effects:
          - "StorageAccount for this enrollment (if any) status := CLOSED"
      - from: CONSENT_PENDING
        to: WITHDRAWN
        trigger: "POST /cbb/enrollments/{id}/withdraw"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects:
          - "consent_status := REVOKED"
          - "withdrawal_reason_code := supplied reason_code"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /cbb/enrollments/{id}/withdraw"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects:
          - "consent_status := REVOKED"
          - "every CollectionKit of this enrollment with status IN {DISPATCHED, HELD} := RETURNED"
          - "every StorageInvoice of this enrollment's StorageAccount with status IN {ISSUED, PAST_DUE, DELINQUENT} := VOID, then StorageAccount.balance_cents recomputed"
      - from: KIT_DISPATCHED
        to: WITHDRAWN
        trigger: "POST /cbb/enrollments/{id}/withdraw"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects:
          - "consent_status := REVOKED"
          - "every CollectionKit of this enrollment with status IN {DISPATCHED, HELD} := RETURNED"
          - "every StorageInvoice of this enrollment's StorageAccount with status IN {ISSUED, PAST_DUE, DELINQUENT} := VOID, then StorageAccount.balance_cents recomputed"
      - from: COLLECTED
        to: WITHDRAWN
        trigger: "POST /cbb/enrollments/{id}/withdraw"
        actor: ParentGuardian
        preconditions:
          - "lifecycle_status NOT IN {CLOSED, WITHDRAWN}"
          - "no CordBloodUnit of this enrollment has availability_status IN {RESERVED, RELEASED}"
        side_effects:
          - "consent_status := REVOKED"
          - "every CordBloodUnit of this enrollment with availability_status NOT IN {RELEASED, DISPOSED} := DISPOSED with disposition_reason CONSENT_REVOKED, disposed_at := clock, processing_status := DISCARDED"
          - "because those units were disposed, each unit's StorageTank.occupied_slots is recomputed"
          - "every RegistryListing of those units with listing_status IN {ACTIVE, SUSPENDED} := WITHDRAWN"
          - "every StorageInvoice of this enrollment's StorageAccount with status IN {ISSUED, PAST_DUE, DELINQUENT} := VOID, then StorageAccount.balance_cents recomputed"

  - entity: Enrollment
    state_field: consent_status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: CONSENTED
        trigger: "POST /cbb/enrollments/{id}/consent"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects:
          - "consent_version := consent_version + 1"
          - "consent_signed_at := clock"
      - from: CONSENTED
        to: AMENDMENT_PENDING
        trigger: "POST /cbb/enrollments/{id}/consent-amendment"
        actor: ParentGuardian
        preconditions:
          - "lifecycle_status NOT IN {CLOSED, WITHDRAWN}"
          - "consent_amendment_count < MAX_CONSENT_AMENDMENTS"
        side_effects:
          - "consent_amendment_count := consent_amendment_count + 1"
          - "every CollectionKit of this enrollment with status == DISPATCHED := HELD with hold_reason_code 'CONSENT_AMENDMENT_PENDING'"
          - "every RegistryListing of this enrollment's units with listing_status == ACTIVE := SUSPENDED with suspension_reason_code 'CONSENT_AMENDMENT_PENDING'"
        note: "Cycle edge 1 of 2. Public listings require current consent, so publication is suspended for the duration of the amendment."
      - from: AMENDMENT_PENDING
        to: CONSENTED
        trigger: "POST /cbb/enrollments/{id}/consent"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects:
          - "consent_version := consent_version + 1"
          - "consent_signed_at := clock"
          - "every CollectionKit of this enrollment with status == HELD AND clock <= expires_at := DISPATCHED with hold_reason_code := null"
          - "every RegistryListing of this enrollment's units with listing_status == SUSPENDED AND suspension_reason_code == 'CONSENT_AMENDMENT_PENDING' := ACTIVE with suspension_reason_code := null"
        note: "Cycle edge 2 of 2 — closes the CONSENTED -> AMENDMENT_PENDING -> CONSENTED loop. At most MAX_CONSENT_AMENDMENTS traversals."
      - from: PENDING
        to: REVOKED
        trigger: "POST /cbb/enrollments/{id}/withdraw"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects: ["see the lifecycle_status WITHDRAWN edges"]
      - from: CONSENTED
        to: REVOKED
        trigger: "POST /cbb/enrollments/{id}/withdraw"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects: ["see the lifecycle_status WITHDRAWN edges"]
      - from: AMENDMENT_PENDING
        to: REVOKED
        trigger: "POST /cbb/enrollments/{id}/withdraw"
        actor: ParentGuardian
        preconditions: ["lifecycle_status NOT IN {CLOSED, WITHDRAWN}"]
        side_effects: ["see the lifecycle_status WITHDRAWN edges"]

  # ---------------- CollectionKit ----------------
  - entity: CollectionKit
    state_field: status
    initial_state: DISPATCHED
    terminal_states: [USED, EXPIRED, RETURNED]
    transitions:
      - from: DISPATCHED
        to: HELD
        trigger: "system, cascaded from POST /cbb/enrollments/{id}/consent-amendment"
        actor: system
        preconditions: ["Enrollment.consent_status transitions CONSENTED -> AMENDMENT_PENDING"]
        side_effects: ["hold_reason_code := 'CONSENT_AMENDMENT_PENDING'"]
      - from: HELD
        to: DISPATCHED
        trigger: "system, cascaded from POST /cbb/enrollments/{id}/consent (re-consent)"
        actor: system
        preconditions: ["clock <= expires_at"]
        side_effects: ["hold_reason_code := null"]
      - from: DISPATCHED
        to: USED
        trigger: "POST /cbb/collections"
        actor: CollectionSite
        preconditions: ["clock <= expires_at", "Enrollment.consent_status == CONSENTED"]
        side_effects: ["Collection created; Enrollment.lifecycle_status := COLLECTED"]
      - from: DISPATCHED
        to: EXPIRED
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock > expires_at"]
        side_effects: ["none beyond updated_at / version"]
      - from: HELD
        to: EXPIRED
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock > expires_at"]
        side_effects: ["none beyond updated_at / version"]
      - from: DISPATCHED
        to: RETURNED
        trigger: "system, cascaded from POST /cbb/enrollments/{id}/withdraw"
        actor: system
        preconditions: ["Enrollment.lifecycle_status becomes WITHDRAWN"]
        side_effects: ["hold_reason_code := null"]
      - from: HELD
        to: RETURNED
        trigger: "system, cascaded from POST /cbb/enrollments/{id}/withdraw"
        actor: system
        preconditions: ["Enrollment.lifecycle_status becomes WITHDRAWN"]
        side_effects: ["hold_reason_code := null"]

  # ---------------- Collection ----------------
  - entity: Collection
    state_field: status
    initial_state: COLLECTED
    terminal_states: [RECEIVED, REJECTED_LATE, REJECTED_TEMP, REJECTED_VOLUME, DISCARDED]
    transitions:
      - from: COLLECTED
        to: RECEIVED
        trigger: "POST /cbb/collections/{id}/receive"
        actor: ProcessingTechnologist
        preconditions:
          - "CollectionKit.status == USED"
          - "clock <= CollectionKit.expires_at"
          - "unrounded elapsed hours collected_at -> clock <= MAX_HOURS_COLLECTION_TO_RECEIPT"
          - "transport_temp_c BETWEEN MIN_TRANSPORT_TEMP_C AND MAX_TRANSPORT_TEMP_C inclusive"
        side_effects:
          - "received_at := clock; hours_to_receipt := round_half_up(elapsed hours, 2)"
          - "CordBloodUnit created with processing_status RECEIVED, availability_status UNAVAILABLE, eligibility_status PENDING, program_type copied from the Enrollment, storage_account_id resolved per its FK annotation, unit_registry_code minted from the creation sequence"
      - from: COLLECTED
        to: REJECTED_LATE
        trigger: "POST /cbb/collections/{id}/reject with reason_code LATE"
        actor: ProcessingTechnologist
        preconditions: ["status == COLLECTED"]
        side_effects: ["rejection_reason_code := 'LATE'"]
      - from: COLLECTED
        to: REJECTED_TEMP
        trigger: "POST /cbb/collections/{id}/reject with reason_code TEMP"
        actor: ProcessingTechnologist
        preconditions: ["status == COLLECTED"]
        side_effects: ["rejection_reason_code := 'TEMP'"]
      - from: COLLECTED
        to: REJECTED_VOLUME
        trigger: "POST /cbb/collections/{id}/reject with reason_code VOLUME"
        actor: ProcessingTechnologist
        preconditions: ["status == COLLECTED"]
        side_effects: ["rejection_reason_code := 'VOLUME'"]
      - from: COLLECTED
        to: DISCARDED
        trigger: "POST /cbb/collections/{id}/reject with reason_code CONTAMINATION"
        actor: ProcessingTechnologist
        preconditions: ["status == COLLECTED"]
        side_effects: ["rejection_reason_code := 'CONTAMINATION'"]

  # ---------------- CordBloodUnit: three independent axes ----------------
  - entity: CordBloodUnit
    state_field: processing_status
    initial_state: RECEIVED
    terminal_states: [DISCARDED]
    transitions:
      - from: RECEIVED
        to: PROCESSING
        trigger: "POST /cbb/processing-runs"
        actor: ProcessingTechnologist
        preconditions:
          - "no ProcessingRun on this unit with status == IN_PROGRESS"
          - "availability_status NOT IN {DISPOSED, RELEASED, QUARANTINED}"
        side_effects:
          - "ProcessingRun created with status IN_PROGRESS, pre_volume_ml := Collection.net_volume_ml, operator_user_id := X-User-ID"
      - from: PROCESSING
        to: VOLUME_REDUCED
        trigger: "POST /cbb/processing-runs/{id}/complete with outcome COMPLETED"
        actor: ProcessingTechnologist
        preconditions: ["ProcessingRun.status == IN_PROGRESS"]
        side_effects:
          - "ProcessingRun.status := COMPLETED, completed_at := clock, tnc_recovery_pct and volume_reduction_pct computed"
          - "CordBloodUnit.post_processing_volume_ml := ProcessingRun.post_volume_ml"
      - from: PROCESSING
        to: RECEIVED
        trigger: "POST /cbb/processing-runs/{id}/complete with outcome FAILED"
        actor: ProcessingTechnologist
        preconditions: ["ProcessingRun.status == IN_PROGRESS"]
        side_effects:
          - "ProcessingRun.status := FAILED, completed_at := clock, tnc_recovery_pct and volume_reduction_pct computed"
          - "CordBloodUnit.post_processing_volume_ml := null"
        note: "Revert edge — a failed run returns the unit to RECEIVED so a second run may be started."
      - from: VOLUME_REDUCED
        to: CRYOPRESERVED
        trigger: "POST /cbb/units/{id}/cryopreserve"
        actor: ProcessingTechnologist
        preconditions:
          - "exactly one QualityTest with test_kind == POST_PROCESSING exists on this unit and its sterility_result == NEGATIVE"
          - "StorageTank.status == ONLINE"
          - "StorageTank.occupied_slots < StorageTank.capacity_slots"
          - "StorageTank.cumulative_excursion_minutes_30d <= CUMULATIVE_EXCURSION_LIMIT_MINUTES"
          - "freeze_at is NOT inside the half-open tank maintenance window [maintenance_window_start, maintenance_window_end)"
        side_effects:
          - "tank_id := supplied tank_id, slot_code := supplied slot_code, cryopreserved_at := freeze_at"
          - "availability_status := PRIVATE_STORED when program_type == PRIVATE_FAMILY, else UNAVAILABLE (a PUBLIC_DONATION unit only becomes LISTED via POST /cbb/registry-listings)"
          - "because the unit now occupies a slot, StorageTank.occupied_slots is recomputed per calculations.tank_slot_occupancy"
      - from: CRYOPRESERVED
        to: DISCARDED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}"]
        side_effects: ["see the availability_status DISPOSED edges"]
      - from: VOLUME_REDUCED
        to: DISCARDED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}"]
        side_effects: ["see the availability_status DISPOSED edges"]
      - from: RECEIVED
        to: DISCARDED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}"]
        side_effects: ["see the availability_status DISPOSED edges"]

  - entity: CordBloodUnit
    state_field: availability_status
    initial_state: UNAVAILABLE
    terminal_states: [RELEASED, DISPOSED]
    transitions:
      - from: UNAVAILABLE
        to: PRIVATE_STORED
        trigger: "POST /cbb/units/{id}/cryopreserve (program_type == PRIVATE_FAMILY)"
        actor: ProcessingTechnologist
        preconditions: ["see the processing_status VOLUME_REDUCED -> CRYOPRESERVED edge"]
        side_effects: ["StorageTank.occupied_slots recomputed"]
      - from: UNAVAILABLE
        to: LISTED
        trigger: "POST /cbb/registry-listings"
        actor: RegistryOperator
        preconditions:
          - "program_type == PUBLIC_DONATION"
          - "processing_status == CRYOPRESERVED"
          - "eligibility_status == ELIGIBLE"
          - "Enrollment.consent_status == CONSENTED AND Enrollment.hla_typing_consent == true"
          - "post_processing_tnc_millions >= PUBLIC_LISTING_MIN_TNC_MILLIONS AND post_processing_cd34_thousands >= PUBLIC_LISTING_MIN_CD34_THOUSANDS AND post_processing_viability_pct >= PUBLIC_LISTING_MIN_VIABILITY_PCT AND quality_acceptance_score >= PUBLIC_ACCEPT_SCORE_MIN"
          - "no RegistryListing on this unit with listing_status IN {ACTIVE, SUSPENDED}"
          - "expected_unit_version == version"
        side_effects:
          - "RegistryListing created with listing_status ACTIVE, listed_at := clock, potency_grade computed"
          - "version := version + 1"
      - from: LISTED
        to: UNAVAILABLE
        trigger: "POST /cbb/registry-listings/{id}/suspend"
        actor: RegistryOperator
        preconditions: ["the addressed RegistryListing belongs to this unit AND its listing_status == ACTIVE"]
        side_effects:
          - "that RegistryListing := SUSPENDED with suspension_reason_code 'REGISTRY_HOLD'"
          - "every Reservation on this unit with status == PENDING_CONFIRMATORY := CANCELLED with cancellation_reason_code 'LISTING_SUSPENDED'"
          - "version := version + 1"
        note: "Manual registry-desk pull; the unit stays frozen in its slot, so StorageTank.occupied_slots is untouched."
      - from: UNAVAILABLE
        to: LISTED
        trigger: "POST /cbb/registry-listings/{id}/resume"
        actor: RegistryOperator
        preconditions:
          - "the addressed RegistryListing belongs to this unit AND its listing_status == SUSPENDED AND its suspension_reason_code == 'REGISTRY_HOLD'"
          - "eligibility_status == ELIGIBLE"
        side_effects:
          - "that RegistryListing := ACTIVE with suspension_reason_code := null"
          - "version := version + 1"
        note: "Compensating edge for the manual pull; potency_grade is NOT recomputed."
      - from: LISTED
        to: RESERVED
        trigger: "POST /cbb/reservations/{id}/confirm"
        actor: TransplantCenter
        preconditions: ["Reservation.status == PENDING_CONFIRMATORY", "clock <= Reservation.created_at + CONFIRM_WINDOW_HOURS hours"]
        side_effects:
          - "the unit's RegistryListing with listing_status == ACTIVE := MATCHED"
          - "every other Reservation on this unit with status == PENDING_CONFIRMATORY := DECLINED with cancellation_reason_code 'SUPERSEDED_BY_CONFIRMED_HOLD' and superseded_by_reservation_id := the confirmed reservation id"
      - from: PRIVATE_STORED
        to: RESERVED
        trigger: "POST /cbb/reservations/{id}/confirm"
        actor: TransplantCenter
        preconditions: ["Reservation.status == PENDING_CONFIRMATORY", "clock <= Reservation.created_at + CONFIRM_WINDOW_HOURS hours"]
        side_effects:
          - "every other Reservation on this unit with status == PENDING_CONFIRMATORY := DECLINED with cancellation_reason_code 'SUPERSEDED_BY_CONFIRMED_HOLD' and superseded_by_reservation_id := the confirmed reservation id"
      - from: RESERVED
        to: LISTED
        trigger: "POST /cbb/reservations/{id}/cancel (unit program_type == PUBLIC_DONATION)"
        actor: TransplantCenter
        preconditions: ["Reservation.status == CONFIRMED"]
        side_effects:
          - "the unit's RegistryListing with listing_status == MATCHED := ACTIVE"
        note: "Compensating edge — cancel restores exactly the pre-confirm availability and listing state; tank slot occupancy is untouched throughout."
      - from: RESERVED
        to: PRIVATE_STORED
        trigger: "POST /cbb/reservations/{id}/cancel (unit program_type == PRIVATE_FAMILY)"
        actor: TransplantCenter
        preconditions: ["Reservation.status == CONFIRMED"]
        side_effects: ["none beyond updated_at / version"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /cbb/reservations/{id}/release"
        actor: MedicalDirector
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "Reservation.confirmatory_test_id is not null AND that QualityTest.outcome == PASS"
          - "Reservation.post_thaw_dose_x1e7_per_kg >= MIN_RELEASE_DOSE_X1E7"
          - "eligibility_status == ELIGIBLE"
          - "the latest COMPLETED MaternalScreening for the enrollment has overall_result == NON_REACTIVE"
          - "StorageTank.status == ONLINE"
          - "X-User-ID != eligibility_determined_by_user_id"
          - "StorageAccount (when storage_account_id is not null) status NOT IN {DELINQUENT, ABANDONMENT_NOTICE, ABANDONED} AND balance_cents == 0"
        side_effects:
          - "disposition_reason := TRANSPLANT_RELEASED, disposed_at := clock, processing_status unchanged (the unit ships frozen)"
          - "Reservation.status := RELEASED, released_at := clock, settlement_total_cents computed"
          - "because the unit left inventory, StorageTank.occupied_slots is recomputed"
          - "the unit's RegistryListing with listing_status == MATCHED := WITHDRAWN"
          - "Enrollment.lifecycle_status := CLOSED when every unit of the enrollment is now RELEASED or DISPOSED, which in turn sets StorageAccount.status := CLOSED"
      - from: PRIVATE_STORED
        to: PENDING_ABANDONMENT
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["the unit's StorageAccount.status became DELINQUENT or ABANDONMENT_NOTICE during this run"]
        side_effects:
          - "because the unit entered PENDING_ABANDONMENT, every Reservation on it with status == PENDING_CONFIRMATORY := DECLINED with cancellation_reason_code 'ACCOUNT_DELINQUENT'"
      - from: PENDING_ABANDONMENT
        to: PRIVATE_STORED
        trigger: "POST /cbb/storage-invoices/{id}/payments (balance reaches 0)"
        actor: BillingAdministrator
        preconditions: ["StorageAccount.balance_cents becomes 0 as a result of this payment"]
        side_effects:
          - "StorageAccount.status := ACTIVE, delinquency_stage_entered_at := null"
        note: "Cure edge — full payment reverses the delinquency cascade for units not yet disposed."
      - from: PRIVATE_STORED
        to: QUARANTINED
        trigger: "system, cascaded from POST /cbb/storage-tanks/{id}/temperature-readings that opens a TemperatureExcursion"
        actor: system
        preconditions: ["the unit's StorageTank.status became ALARM during this reading"]
        side_effects:
          - "quarantine_reason_code := 'EXCURSION_OPEN'"
          - "because this unit was quarantined, its RegistryListing with listing_status == ACTIVE := SUSPENDED with suspension_reason_code 'UNIT_QUARANTINED'"
        note: "Link 3 of the depth-4 temperature cascade (reading -> tank -> unit -> listing -> reservation)."
      - from: LISTED
        to: QUARANTINED
        trigger: "system, cascaded from POST /cbb/storage-tanks/{id}/temperature-readings that opens a TemperatureExcursion"
        actor: system
        preconditions: ["the unit's StorageTank.status became ALARM during this reading"]
        side_effects:
          - "quarantine_reason_code := 'EXCURSION_OPEN'"
          - "because this unit was quarantined, its RegistryListing with listing_status == ACTIVE := SUSPENDED with suspension_reason_code 'UNIT_QUARANTINED'"
          - "because that listing was suspended, every Reservation on this unit with status == PENDING_CONFIRMATORY := CANCELLED with cancellation_reason_code 'LISTING_SUSPENDED'"
        note: "Link 3 and 4 of the depth-4 temperature cascade; units are processed in created_at ASC order, listings in created_at ASC order, reservations in created_at ASC order."
      - from: QUARANTINED
        to: PRIVATE_STORED
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition NO_IMPACT or REQUALIFY"
        actor: FacilitiesEngineer
        preconditions:
          - "quarantine_reason_code == 'EXCURSION_OPEN'"
          - "program_type == PRIVATE_FAMILY"
          - "the tank returns to ONLINE during this resolve"
        side_effects: ["quarantine_reason_code := null"]
        note: "Compensating edge — restores exactly the pre-alarm availability value."
      - from: QUARANTINED
        to: LISTED
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition NO_IMPACT or REQUALIFY"
        actor: FacilitiesEngineer
        preconditions:
          - "quarantine_reason_code == 'EXCURSION_OPEN'"
          - "program_type == PUBLIC_DONATION AND the unit has a RegistryListing with listing_status == SUSPENDED AND suspension_reason_code == 'UNIT_QUARANTINED'"
          - "the tank returns to ONLINE during this resolve"
        side_effects:
          - "quarantine_reason_code := null"
          - "that RegistryListing := ACTIVE with suspension_reason_code := null"
        note: "Compensating edge — the CANCELLED reservations are NOT revived; only availability and listing state are restored."
      - from: QUARANTINED
        to: DISPOSED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}"]
        side_effects:
          - "processing_status := DISCARDED, disposition_reason := supplied reason, disposed_at := clock"
          - "because the unit left inventory, StorageTank.occupied_slots is recomputed"
          - "every RegistryListing of this unit with listing_status IN {ACTIVE, SUSPENDED} := WITHDRAWN"
          - "every Reservation on this unit with status IN {PENDING_CONFIRMATORY, CONFIRMED} := CANCELLED with cancellation_reason_code 'UNIT_DISPOSED'"
          - "StorageAccount settlement recorded: balance_cents recomputed after applying calculations.disposition_settlement; StorageAccount.status := CLOSED and its remaining ISSUED/PAST_DUE/DELINQUENT invoices := WRITTEN_OFF when disposition_reason == ABANDONED_NONPAYMENT"
      - from: PENDING_ABANDONMENT
        to: DISPOSED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}", "StorageAccount.status == ABANDONMENT_NOTICE or ABANDONED when disposition_reason == ABANDONED_NONPAYMENT"]
        side_effects: ["identical to the QUARANTINED -> DISPOSED edge"]
      - from: PRIVATE_STORED
        to: DISPOSED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}"]
        side_effects: ["identical to the QUARANTINED -> DISPOSED edge"]
      - from: LISTED
        to: DISPOSED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}"]
        side_effects: ["identical to the QUARANTINED -> DISPOSED edge"]
      - from: UNAVAILABLE
        to: DISPOSED
        trigger: "POST /cbb/units/{id}/dispose"
        actor: MedicalDirector
        preconditions: ["availability_status NOT IN {RELEASED, DISPOSED, RESERVED}"]
        side_effects: ["identical to the QUARANTINED -> DISPOSED edge"]

  - entity: CordBloodUnit
    state_field: eligibility_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "POST /cbb/units/{id}/eligibility-determination"
        actor: MedicalDirector
        preconditions:
          - "processing_status IN {VOLUME_REDUCED, CRYOPRESERVED}"
          - "exactly one QualityTest with test_kind == POST_PROCESSING exists on this unit"
          - "that QualityTest.sterility_result == NEGATIVE"
          - "the latest COMPLETED MaternalScreening for the enrollment (by created_at ASC, last wins) exists and its overall_result == NON_REACTIVE"
          - "quality_acceptance_score >= the program tier's accept minimum"
          - "X-User-ID != that QualityTest.performed_by_user_id"
        side_effects:
          - "eligibility_reason_code := 'ACCEPTED', eligibility_determined_by_user_id := X-User-ID"
      - from: PENDING
        to: INELIGIBLE
        trigger: "POST /cbb/units/{id}/eligibility-determination"
        actor: MedicalDirector
        preconditions:
          - "processing_status IN {VOLUME_REDUCED, CRYOPRESERVED}"
          - "the latest COMPLETED MaternalScreening has overall_result == NON_REACTIVE"
          - "quality_acceptance_score < the program tier's accept minimum"
          - "X-User-ID != the POST_PROCESSING QualityTest.performed_by_user_id"
        side_effects:
          - "eligibility_reason_code := 'SCORE_BELOW_TIER_MINIMUM', eligibility_determined_by_user_id := X-User-ID"
      - from: PENDING
        to: INDETERMINATE
        trigger: "POST /cbb/units/{id}/eligibility-determination"
        actor: MedicalDirector
        preconditions:
          - "processing_status IN {VOLUME_REDUCED, CRYOPRESERVED}"
          - "the latest COMPLETED MaternalScreening has overall_result == INDETERMINATE"
          - "X-User-ID != the POST_PROCESSING QualityTest.performed_by_user_id"
        side_effects:
          - "eligibility_reason_code := 'MATERNAL_INDETERMINATE', eligibility_determined_by_user_id := X-User-ID"
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "PATCH /cbb/maternal-screenings/{id} that makes overall_result REACTIVE"
        actor: system
        preconditions: ["the amended screening is the latest COMPLETED screening for the enrollment"]
        side_effects:
          - "eligibility_reason_code := 'MATERNAL_REACTIVE'"
          - "every RegistryListing of this unit with listing_status IN {ACTIVE, MATCHED} := SUSPENDED with suspension_reason_code 'MATERNAL_REACTIVE'"
          - "every Reservation on this unit with status == PENDING_CONFIRMATORY := CANCELLED with cancellation_reason_code 'MATERNAL_REACTIVE'"
        note: "availability_status is deliberately NOT changed here — a CONFIRMED reservation stays CONFIRMED so the release check at §1.4 priority 14 is the gate that rejects it."
      - from: ELIGIBLE
        to: INDETERMINATE
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["the latest COMPLETED MaternalScreening for the enrollment reaches valid_until < clock and is set EXPIRED by this run"]
        side_effects:
          - "eligibility_reason_code := 'SCREENING_EXPIRED'"
          - "every RegistryListing of this unit with listing_status == ACTIVE := SUSPENDED with suspension_reason_code 'SCREENING_EXPIRED'"

  # ---------------- ProcessingRun ----------------
  - entity: ProcessingRun
    state_field: status
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cbb/processing-runs/{id}/complete with outcome COMPLETED"
        actor: ProcessingTechnologist
        preconditions: ["status == IN_PROGRESS", "post_volume_ml > 0", "post_tnc_millions > 0"]
        side_effects:
          - "tnc_recovery_pct and volume_reduction_pct computed; completed_at := clock"
          - "CordBloodUnit.processing_status := VOLUME_REDUCED and CordBloodUnit.post_processing_volume_ml := post_volume_ml"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /cbb/processing-runs/{id}/complete with outcome FAILED"
        actor: ProcessingTechnologist
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "tnc_recovery_pct and volume_reduction_pct computed; completed_at := clock"
          - "CordBloodUnit.processing_status := RECEIVED (revert) and CordBloodUnit.post_processing_volume_ml := null"

  # ---------------- StorageTank ----------------
  - entity: StorageTank
    state_field: status
    initial_state: ONLINE
    terminal_states: [OFFLINE]
    transitions:
      - from: ONLINE
        to: ALARM
        trigger: "POST /cbb/storage-tanks/{id}/temperature-readings with reading_c > ALARM_THRESHOLD_C"
        actor: FacilitiesEngineer
        preconditions: ["no TemperatureExcursion on this tank with status IN {OPEN, ACKNOWLEDGED, ESCALATED}"]
        side_effects:
          - "TemperatureExcursion created with status OPEN, detected_at := reading_at, peak_temperature_c := reading_c"
          - "because the tank entered ALARM, every CordBloodUnit with tank_id == this tank AND availability_status IN {PRIVATE_STORED, LISTED} := QUARANTINED (link 3 of the depth-4 cascade)"
        note: "Link 2 of the depth-4 cascade. A reading of exactly ALARM_THRESHOLD_C does NOT open an excursion (strict > comparison)."
      - from: MAINTENANCE
        to: ALARM
        trigger: "POST /cbb/storage-tanks/{id}/temperature-readings with reading_c > ALARM_THRESHOLD_C"
        actor: FacilitiesEngineer
        preconditions: ["no TemperatureExcursion on this tank with status IN {OPEN, ACKNOWLEDGED, ESCALATED}"]
        side_effects: ["identical to the ONLINE -> ALARM edge"]
      - from: ALARM
        to: ONLINE
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition NO_IMPACT or REQUALIFY"
        actor: FacilitiesEngineer
        preconditions: ["TemperatureExcursion.status IN {ACKNOWLEDGED, ESCALATED}"]
        side_effects:
          - "cumulative_excursion_minutes_30d recomputed"
          - "quarantined units of this tank are restored per the CordBloodUnit QUARANTINED -> PRIVATE_STORED / LISTED edges"
      - from: ALARM
        to: OFFLINE
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition TOTAL_LOSS"
        actor: FacilitiesEngineer
        preconditions: ["TemperatureExcursion.status IN {ACKNOWLEDGED, ESCALATED}"]
        side_effects:
          - "cumulative_excursion_minutes_30d recomputed"
          - "quarantined units of this tank stay QUARANTINED and every RegistryListing of those units with listing_status == SUSPENDED := WITHDRAWN"
      - from: ONLINE
        to: MAINTENANCE
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["maintenance_window_start <= clock < maintenance_window_end"]
        side_effects: ["none beyond updated_at / version"]
      - from: MAINTENANCE
        to: ONLINE
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock < maintenance_window_start OR clock >= maintenance_window_end"]
        side_effects: ["none beyond updated_at / version"]

  # ---------------- TemperatureExcursion ----------------
  - entity: TemperatureExcursion
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED_LOSS]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /cbb/temperature-excursions/{id}/acknowledge"
        actor: FacilitiesEngineer
        preconditions: ["status == OPEN"]
        side_effects: ["acknowledged_at := clock, acknowledged_by_user_id := X-User-ID"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["acknowledged_at is null AND clock > detected_at + MAX_ACK_MINUTES minutes"]
        side_effects: ["none beyond updated_at / version"]
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /cbb/temperature-excursions/{id}/acknowledge"
        actor: FacilitiesEngineer
        preconditions: ["status == ESCALATED"]
        side_effects: ["acknowledged_at := clock, acknowledged_by_user_id := X-User-ID"]
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition NO_IMPACT or REQUALIFY"
        actor: FacilitiesEngineer
        preconditions: ["status IN {ACKNOWLEDGED, ESCALATED}"]
        side_effects:
          - "resolved_at := clock, duration_minutes computed"
          - "StorageTank.status := ONLINE and quarantined units restored"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition NO_IMPACT or REQUALIFY"
        actor: FacilitiesEngineer
        preconditions: ["status IN {ACKNOWLEDGED, ESCALATED}"]
        side_effects: ["identical to the ACKNOWLEDGED -> RESOLVED edge"]
      - from: ACKNOWLEDGED
        to: CLOSED_LOSS
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition TOTAL_LOSS"
        actor: FacilitiesEngineer
        preconditions: ["status IN {ACKNOWLEDGED, ESCALATED}"]
        side_effects:
          - "resolved_at := clock, duration_minutes computed"
          - "StorageTank.status := OFFLINE; units stay QUARANTINED; their SUSPENDED listings := WITHDRAWN"
      - from: ESCALATED
        to: CLOSED_LOSS
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition TOTAL_LOSS"
        actor: FacilitiesEngineer
        preconditions: ["status IN {ACKNOWLEDGED, ESCALATED}"]
        side_effects: ["identical to the ACKNOWLEDGED -> CLOSED_LOSS edge"]

  # ---------------- RegistryListing ----------------
  - entity: RegistryListing
    state_field: listing_status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, cascaded from unit quarantine, consent amendment, maternal reactive amendment, or screening expiry"
        actor: system
        preconditions: ["listing_status == ACTIVE"]
        side_effects: ["suspension_reason_code := one of {UNIT_QUARANTINED, CONSENT_AMENDMENT_PENDING, MATERNAL_REACTIVE, SCREENING_EXPIRED}"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, cascaded from excursion resolve (NO_IMPACT/REQUALIFY) or re-consent"
        actor: system
        preconditions: ["suspension_reason_code IN {UNIT_QUARANTINED, CONSENT_AMENDMENT_PENDING}"]
        side_effects: ["suspension_reason_code := null"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cbb/registry-listings/{id}/suspend"
        actor: RegistryOperator
        preconditions: ["listing_status == ACTIVE"]
        side_effects:
          - "suspension_reason_code := 'REGISTRY_HOLD'"
          - "the listed CordBloodUnit availability_status LISTED -> UNAVAILABLE and its version += 1"
          - "every Reservation on that unit with status == PENDING_CONFIRMATORY := CANCELLED with cancellation_reason_code 'LISTING_SUSPENDED'"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cbb/registry-listings/{id}/resume"
        actor: RegistryOperator
        preconditions: ["listing_status == SUSPENDED", "suspension_reason_code == 'REGISTRY_HOLD'", "the listed CordBloodUnit eligibility_status == ELIGIBLE"]
        side_effects:
          - "suspension_reason_code := null"
          - "the listed CordBloodUnit availability_status UNAVAILABLE -> LISTED and its version += 1"
      - from: ACTIVE
        to: MATCHED
        trigger: "POST /cbb/reservations/{id}/confirm"
        actor: TransplantCenter
        preconditions: ["the confirmed reservation's unit is this listing's unit"]
        side_effects: ["none beyond updated_at / version"]
      - from: MATCHED
        to: ACTIVE
        trigger: "POST /cbb/reservations/{id}/cancel"
        actor: TransplantCenter
        preconditions: ["Reservation.status == CONFIRMED"]
        side_effects: ["none beyond updated_at / version"]
      - from: MATCHED
        to: WITHDRAWN
        trigger: "POST /cbb/reservations/{id}/release"
        actor: MedicalDirector
        preconditions: ["Reservation.status == CONFIRMED"]
        side_effects: ["none beyond updated_at / version"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /cbb/units/{id}/dispose or POST /cbb/enrollments/{id}/withdraw"
        actor: MedicalDirector
        preconditions: ["the unit reaches availability_status DISPOSED"]
        side_effects: ["none beyond updated_at / version"]
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /cbb/temperature-excursions/{id}/resolve with disposition TOTAL_LOSS, POST /cbb/units/{id}/dispose, or POST /cbb/enrollments/{id}/withdraw"
        actor: system
        preconditions: ["listing_status == SUSPENDED"]
        side_effects: ["none beyond updated_at / version"]
      - from: MATCHED
        to: SUSPENDED
        trigger: "PATCH /cbb/maternal-screenings/{id} that makes overall_result REACTIVE"
        actor: system
        preconditions: ["listing_status == MATCHED"]
        side_effects: ["suspension_reason_code := 'MATERNAL_REACTIVE'"]

  # ---------------- Reservation: branching fork-join ----------------
  - entity: Reservation
    state_field: status
    initial_state: PENDING_CONFIRMATORY
    terminal_states: [RELEASED, DECLINED, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING_CONFIRMATORY
        to: CONFIRMED
        trigger: "POST /cbb/reservations/{id}/confirm"
        actor: TransplantCenter
        preconditions:
          - "X-User-ID == requesting_center_user_id"
          - "clock <= created_at + CONFIRM_WINDOW_HOURS hours"
          - "CordBloodUnit.availability_status IN {LISTED, PRIVATE_STORED}"
          - "CordBloodUnit.eligibility_status == ELIGIBLE"
        side_effects:
          - "intended_transplant_date := supplied value"
          - "CordBloodUnit.availability_status := RESERVED"
          - "the unit's ACTIVE RegistryListing := MATCHED"
          - "every sibling Reservation on the unit with status == PENDING_CONFIRMATORY := DECLINED with cancellation_reason_code 'SUPERSEDED_BY_CONFIRMED_HOLD' and superseded_by_reservation_id := this reservation id"
        note: "Fork branch A — the CONFIRMED branch reserves inventory and matches the listing."
      - from: PENDING_CONFIRMATORY
        to: DECLINED
        trigger: "POST /cbb/reservations/{id}/decline"
        actor: TransplantCenter
        preconditions: ["X-User-ID == requesting_center_user_id", "status == PENDING_CONFIRMATORY"]
        side_effects:
          - "cancellation_reason_code := supplied reason_code"
          - "CordBloodUnit.availability_status unchanged; the unit's RegistryListing unchanged"
        note: "Fork branch B — the DECLINED branch touches no inventory state at all; this asymmetry is the divergent side-effect set."
      - from: PENDING_CONFIRMATORY
        to: EXPIRED
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock > created_at + CONFIRM_WINDOW_HOURS hours"]
        side_effects: ["cancellation_reason_code := 'CONFIRM_WINDOW_LAPSED'"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /cbb/reservations/{id}/release"
        actor: MedicalDirector
        preconditions: ["see the CordBloodUnit availability_status RESERVED -> RELEASED edge"]
        side_effects:
          - "released_at := clock, dose_variant_applied := POST_THAW, settlement_total_cents computed"
          - "CordBloodUnit.availability_status := RELEASED with disposition_reason TRANSPLANT_RELEASED"
        note: "Join point — both fork branches converge on a terminal state, but only branch A can reach RELEASED."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /cbb/reservations/{id}/cancel"
        actor: TransplantCenter
        preconditions: ["X-User-ID == requesting_center_user_id", "status == CONFIRMED"]
        side_effects:
          - "cancellation_reason_code := supplied reason_code"
          - "CordBloodUnit.availability_status := LISTED (PUBLIC_DONATION) or PRIVATE_STORED (PRIVATE_FAMILY)"
          - "the unit's MATCHED RegistryListing := ACTIVE"
        note: "Compensating edge — exactly reverses the CONFIRMED branch's side-effect set; StorageTank.occupied_slots is unchanged before and after."
      - from: PENDING_CONFIRMATORY
        to: CANCELLED
        trigger: "system, cascaded from unit quarantine (listing suspension), maternal reactive amendment, or unit disposal"
        actor: system
        preconditions: ["status == PENDING_CONFIRMATORY"]
        side_effects: ["cancellation_reason_code := one of {LISTING_SUSPENDED, MATERNAL_REACTIVE, UNIT_DISPOSED}"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system, cascaded from POST /cbb/units/{id}/dispose"
        actor: system
        preconditions: ["status == CONFIRMED"]
        side_effects: ["cancellation_reason_code := 'UNIT_DISPOSED'"]

  # ---------------- StorageAccount: delinquency ladder ----------------
  - entity: StorageAccount
    state_field: status
    initial_state: ACTIVE
    terminal_states: [ABANDONED, CLOSED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["some StorageInvoice of this account advanced ISSUED -> PAST_DUE during this run"]
        side_effects: ["delinquency_stage_entered_at := clock; balance_cents recomputed"]
      - from: PAST_DUE
        to: DELINQUENT
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["some StorageInvoice of this account advanced PAST_DUE -> DELINQUENT during this run"]
        side_effects:
          - "delinquency_stage_entered_at := clock; balance_cents recomputed"
          - "because the account became DELINQUENT, every CordBloodUnit with storage_account_id == this account AND availability_status == PRIVATE_STORED := PENDING_ABANDONMENT (link 2 of the depth-3 delinquency cascade)"
      - from: DELINQUENT
        to: ABANDONMENT_NOTICE
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock >= the oldest DELINQUENT invoice's due_date + ABANDONMENT_NOTICE_DAYS days"]
        side_effects: ["delinquency_stage_entered_at := clock"]
      - from: ABANDONMENT_NOTICE
        to: ABANDONED
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock >= the oldest DELINQUENT invoice's due_date + ABANDONMENT_DAYS days"]
        side_effects: ["delinquency_stage_entered_at := clock"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /cbb/storage-invoices/{id}/payments"
        actor: BillingAdministrator
        preconditions: ["balance_cents becomes 0 as a result of this payment"]
        side_effects: ["delinquency_stage_entered_at := null"]
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /cbb/storage-invoices/{id}/payments"
        actor: BillingAdministrator
        preconditions: ["balance_cents becomes 0 as a result of this payment"]
        side_effects:
          - "delinquency_stage_entered_at := null"
          - "every CordBloodUnit with storage_account_id == this account AND availability_status == PENDING_ABANDONMENT := PRIVATE_STORED"
        note: "Cure edge — closes the delinquency loop ACTIVE -> PAST_DUE -> DELINQUENT -> ACTIVE."
      - from: ABANDONMENT_NOTICE
        to: ACTIVE
        trigger: "POST /cbb/storage-invoices/{id}/payments"
        actor: BillingAdministrator
        preconditions: ["balance_cents becomes 0 as a result of this payment"]
        side_effects: ["identical to the DELINQUENT -> ACTIVE edge"]
      - from: ACTIVE
        to: CLOSED
        trigger: "system, cascaded from the last unit of the enrollment reaching RELEASED or DISPOSED"
        actor: system
        preconditions: ["every CordBloodUnit with storage_account_id == this account has availability_status IN {RELEASED, DISPOSED}"]
        side_effects: ["remaining ISSUED/PAST_DUE/DELINQUENT invoices := WRITTEN_OFF when the disposition_reason was ABANDONED_NONPAYMENT; balance_cents recomputed"]
      - from: ABANDONED
        to: CLOSED
        trigger: "system, cascaded from POST /cbb/units/{id}/dispose with reason ABANDONED_NONPAYMENT"
        actor: system
        preconditions: ["every CordBloodUnit with storage_account_id == this account has availability_status IN {RELEASED, DISPOSED}"]
        side_effects: ["remaining ISSUED/PAST_DUE/DELINQUENT invoices := WRITTEN_OFF; balance_cents recomputed"]

  # ---------------- StorageInvoice ----------------
  - entity: StorageInvoice
    state_field: status
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    transitions:
      - from: ISSUED
        to: PAST_DUE
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock >= due_date + PAST_DUE_DAYS days", "amount_paid_cents < amount_due_cents"]
        side_effects:
          - "late_fee_line_cents += round_half_up((amount_due_cents - amount_paid_cents) * LATE_FEE_PCT); amount_due_cents recomputed; stage_advanced_at := clock"
          - "because this invoice advanced, StorageAccount.status := PAST_DUE and balance_cents recomputed (link 1 of the depth-3 delinquency cascade)"
      - from: PAST_DUE
        to: DELINQUENT
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock >= due_date + DELINQUENT_DAYS days", "amount_paid_cents < amount_due_cents"]
        side_effects:
          - "late_fee_line_cents += round_half_up((amount_due_cents - amount_paid_cents) * LATE_FEE_PCT); amount_due_cents recomputed; stage_advanced_at := clock"
          - "because this invoice advanced, StorageAccount.status := DELINQUENT and balance_cents recomputed"
      - from: ISSUED
        to: PAID
        trigger: "POST /cbb/storage-invoices/{id}/payments"
        actor: BillingAdministrator
        preconditions: ["amount_paid_cents + payment reaches amount_due_cents exactly"]
        side_effects: ["amount_paid_cents := amount_due_cents; StorageAccount.lifetime_paid_cents += payment; balance_cents recomputed; paid_through_date := max(paid_through_date, billing_period_end)"]
      - from: PAST_DUE
        to: PAID
        trigger: "POST /cbb/storage-invoices/{id}/payments"
        actor: BillingAdministrator
        preconditions: ["amount_paid_cents + payment reaches amount_due_cents exactly"]
        side_effects: ["identical to the ISSUED -> PAID edge, plus the StorageAccount cure edge"]
      - from: DELINQUENT
        to: PAID
        trigger: "POST /cbb/storage-invoices/{id}/payments"
        actor: BillingAdministrator
        preconditions: ["amount_paid_cents + payment reaches amount_due_cents exactly"]
        side_effects: ["identical to the ISSUED -> PAID edge, plus the StorageAccount cure edge"]
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "system, cascaded from POST /cbb/units/{id}/dispose with reason ABANDONED_NONPAYMENT"
        actor: system
        preconditions: ["StorageAccount.status IN {ABANDONMENT_NOTICE, ABANDONED}"]
        side_effects: ["balance_cents recomputed (this invoice leaves the outstanding set)"]
      - from: ISSUED
        to: VOID
        trigger: "system, cascaded from POST /cbb/enrollments/{id}/withdraw"
        actor: system
        preconditions: ["Enrollment.lifecycle_status becomes WITHDRAWN"]
        side_effects: ["balance_cents recomputed"]
      - from: PAST_DUE
        to: VOID
        trigger: "system, cascaded from POST /cbb/enrollments/{id}/withdraw"
        actor: system
        preconditions: ["Enrollment.lifecycle_status becomes WITHDRAWN"]
        side_effects: ["balance_cents recomputed"]
      - from: DELINQUENT
        to: VOID
        trigger: "system, cascaded from POST /cbb/enrollments/{id}/withdraw"
        actor: system
        preconditions: ["Enrollment.lifecycle_status becomes WITHDRAWN"]
        side_effects: ["balance_cents recomputed"]

  # ---------------- MaternalScreening ----------------
  - entity: MaternalScreening
    state_field: status
    initial_state: PENDING
    terminal_states: [INVALID, EXPIRED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /cbb/maternal-screenings or PATCH /cbb/maternal-screenings/{id}"
        actor: ProcessingTechnologist
        preconditions:
          - "none of the five governing markers is PENDING"
          - "collected_at is inside [Enrollment.expected_delivery_date - MATERNAL_SCREEN_WINDOW_DAYS days, Enrollment.expected_delivery_date + MATERNAL_SCREEN_WINDOW_DAYS days] inclusive"
        side_effects: ["overall_result, reactive_marker_codes and valid_until computed"]
      - from: PENDING
        to: INVALID
        trigger: "POST /cbb/maternal-screenings or PATCH /cbb/maternal-screenings/{id}"
        actor: ProcessingTechnologist
        preconditions: ["collected_at is outside the +/- MATERNAL_SCREEN_WINDOW_DAYS window around Enrollment.expected_delivery_date"]
        side_effects: ["overall_result := null; the record can never govern eligibility"]
      - from: COMPLETED
        to: COMPLETED
        trigger: "PATCH /cbb/maternal-screenings/{id}"
        actor: ProcessingTechnologist
        preconditions: ["status == COMPLETED", "the amendment leaves no governing marker PENDING"]
        side_effects:
          - "overall_result and reactive_marker_codes recomputed"
          - "when the recomputed overall_result is REACTIVE and this is the latest COMPLETED screening, CordBloodUnit.eligibility_status := INELIGIBLE with reason MATERNAL_REACTIVE, its ACTIVE/MATCHED listings := SUSPENDED, and its PENDING_CONFIRMATORY reservations := CANCELLED"
        note: "Self-loop — post-donation seroconversion notices amend an already COMPLETED panel in place."
      - from: COMPLETED
        to: EXPIRED
        trigger: "POST /cbb/ops/nightly-run"
        actor: PlatformAdmin
        preconditions: ["clock > valid_until"]
        side_effects:
          - "when this is the latest COMPLETED screening of the enrollment, every ELIGIBLE unit of that enrollment := INDETERMINATE with reason SCREENING_EXPIRED and its ACTIVE listings := SUSPENDED"

concurrency_rules:
  - rule_id: reservation-create-stale-unit
    parent_entity: CordBloodUnit
    write_endpoint: "POST /cbb/reservations"
    occ_field: "expected_unit_version"
    description: |
      Creating a Reservation against a CordBloodUnit whose version has advanced since the client last
      observed it is rejected with a stale-version error. A hold does not itself change the unit's
      availability_status, so two holds with disjoint hold windows both legitimately coexist on the same
      LISTED unit; this rule captures the case where the client's view of the unit is stale because
      another writer has already attached a hold (or a registry listing) that the client never saw.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
  - rule_id: registry-listing-create-stale-unit
    parent_entity: CordBloodUnit
    write_endpoint: "POST /cbb/registry-listings"
    occ_field: "expected_unit_version"
    description: |
      Publishing a RegistryListing against a CordBloodUnit whose version has advanced since the client
      last observed it is rejected with a stale-version error. A relisting after a WITHDRAWN listing
      legitimately supersedes the prior publication record, so the operation is valid on its own terms;
      the OCC check exists so a publication built on a stale read of the unit's counts, tier and
      eligibility never reaches the registry.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

calculations:
  - name: collection_net_volume
    trigger: "POST /cbb/collections (at Collection creation)"
    algorithm: aggregation
    formula: |
      net_volume_ml = round_half_up(collection_volume_ml - anticoagulant_volume_ml, 1)
    input_set: "The two input volumes of the Collection being created; no other rows participate."
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: collection_transit_hours
    trigger: "POST /cbb/collections/{id}/receive"
    algorithm: threshold
    formula: |
      elapsed_hours_exact = (logical_clock_now - collected_at) expressed in hours as an exact rational
      # GATE uses the EXACT value, never the rounded field:
      if elapsed_hours_exact > MAX_HOURS_COLLECTION_TO_RECEIPT: reject ERR_PROCESSING_WINDOW_EXCEEDED
      hours_to_receipt = round_half_up(elapsed_hours_exact, 2)   # persisted display field only
    input_set: "The single Collection addressed by the path; the logical clock supplies received_at."
    constants:
      MAX_HOURS_COLLECTION_TO_RECEIPT: 48.0
      MIN_TRANSPORT_TEMP_C: 2.0
      MAX_TRANSPORT_TEMP_C: 30.0
    precision: "hours_to_receipt is 2 decimal places, round_half_up; the acceptance comparison is on the unrounded value and is inclusive at exactly 48.0"

  - name: volume_reduction_recovery
    trigger: "POST /cbb/processing-runs/{id}/complete (both COMPLETED and FAILED outcomes)"
    algorithm: aggregation
    formula: |
      tnc_recovery_pct      = round_half_up(post_tnc_millions / pre_tnc_millions * 100, 2)
      volume_reduction_pct  = round_half_up((pre_volume_ml - post_volume_ml) / pre_volume_ml * 100, 2)
    input_set: "The single ProcessingRun addressed by the path; pre_volume_ml was frozen from Collection.net_volume_ml at run creation and is NOT re-read."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: quality_test_outcome
    trigger: "POST /cbb/quality-tests (at QualityTest creation)"
    algorithm: threshold
    formula: |
      if test_kind == POST_PROCESSING:
        TIER = PUBLIC_TIER if unit.program_type == PUBLIC_DONATION else PRIVATE_TIER
        codes = []
        if sterility_result != NEGATIVE:                       codes += ["STERILITY"]
        if tnc_millions      <  TIER.tnc_min:                   codes += ["TNC"]
        if cd34_thousands    <  TIER.cd34_min:                  codes += ["CD34"]
        if viability_pct     <  TIER.viability_floor:           codes += ["VIABILITY"]
      else:  # CONFIRMATORY
        recovery_pct = round_half_up(tnc_millions / unit.post_processing_tnc_millions * 100, 2)
        codes = []
        if sterility_result == POSITIVE:                        codes += ["STERILITY"]
        if viability_pct < CONFIRMATORY_MIN_VIABILITY_PCT:      codes += ["VIABILITY"]
        if recovery_pct  < CONFIRMATORY_MIN_RECOVERY_PCT:       codes += ["RECOVERY"]
      failure_reason_codes = sort_ascending(codes)
      outcome = PASS if failure_reason_codes == [] else FAIL
    input_set: "The QualityTest being created plus the owning CordBloodUnit's program_type and post_processing_tnc_millions."
    constants:
      PUBLIC_TIER: { tnc_min: 900, cd34_min: 1500, viability_floor: 85.0 }
      PRIVATE_TIER: { tnc_min: 400, cd34_min: 500, viability_floor: 75.0 }
      CONFIRMATORY_MIN_VIABILITY_PCT: 70.0
      CONFIRMATORY_MIN_RECOVERY_PCT: 60.0
    precision: "recovery_pct 2 decimal places, round_half_up; all comparisons are >= / < as written (inclusive at the floor)"

  - name: unit_quality_acceptance_score
    trigger: "POST /cbb/quality-tests with test_kind == POST_PROCESSING (recomputed on the owning CordBloodUnit)"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): five inputs, nested min/max, a conditional tier branch on
      # CordBloodUnit.program_type, a subtractive penalty and a multiplicative gate.
      TIER = PUBLIC_TIER if program_type == PUBLIC_DONATION else PRIVATE_TIER
      tnc_component       = min(1.0, post_processing_tnc_millions   / TIER.tnc_target)
      cd34_component      = min(1.0, post_processing_cd34_thousands / TIER.cd34_target)
      viability_component = max(0.0, (post_processing_viability_pct - TIER.viability_floor)
                                    / (100.0 - TIER.viability_floor))
      volume_penalty      = VOLUME_PENALTY if (post_processing_volume_ml < TIER.volume_min
                                               or post_processing_volume_ml > TIER.volume_max) else 0.0
      sterility_gate      = 0.0 if POST_PROCESSING_test.sterility_result != NEGATIVE else 1.0
      weighted            = W_TNC*tnc_component + W_CD34*cd34_component + W_VIAB*viability_component
      quality_acceptance_score = round_half_up(sterility_gate * max(0.0, weighted - volume_penalty) * 100, 2)
      # Rounding order is PINNED: the three components and `weighted` are NEVER rounded; only the final
      # score is rounded, once, to 2 decimals.
    input_set: "The unit's single POST_PROCESSING QualityTest plus post_processing_volume_ml from the COMPLETED ProcessingRun. CONFIRMATORY tests never enter this score."
    constants:
      W_TNC: 0.45
      W_CD34: 0.35
      W_VIAB: 0.20
      VOLUME_PENALTY: 0.10
      PUBLIC_TIER: { tnc_target: 1500, cd34_target: 3000, viability_floor: 85.0, volume_min: 24.0, volume_max: 26.0 }
      PRIVATE_TIER: { tnc_target: 900, cd34_target: 1500, viability_floor: 75.0, volume_min: 20.0, volume_max: 30.0 }
      PUBLIC_ACCEPT_SCORE_MIN: 70.00
      PRIVATE_ACCEPT_SCORE_MIN: 55.00
    precision: "2 decimal places, round_half_up, applied exactly once at the end"

  - name: unit_eligibility_determination
    trigger: "POST /cbb/units/{id}/eligibility-determination; also re-evaluated by the PATCH maternal-screening cascade and by POST /cbb/ops/nightly-run screening expiry"
    algorithm: constraint_propagation
    formula: |
      governing = the MaternalScreening rows of this unit's Enrollment with status == COMPLETED,
                  ordered by created_at ASC; governing_latest = last element (null when empty)
      if governing_latest is null:                              reject ERR_MATERNAL_SCREENING_INCOMPLETE
      if count(POST_PROCESSING QualityTest on unit) == 0:       reject ERR_NO_QUALITY_TEST
      if POST_PROCESSING_test.sterility_result != NEGATIVE:     reject ERR_STERILITY_POSITIVE
      if governing_latest.overall_result == REACTIVE:           reject ERR_MATERNAL_SCREENING_REACTIVE
      if governing_latest.overall_result == INDETERMINATE:      eligibility_status = INDETERMINATE
                                                                 reason = MATERNAL_INDETERMINATE
      elif quality_acceptance_score >= ACCEPT_MIN(program_type): eligibility_status = ELIGIBLE
                                                                 reason = ACCEPTED
      else:                                                      eligibility_status = INELIGIBLE
                                                                 reason = SCORE_BELOW_TIER_MINIMUM
    input_set: "COMPLETED MaternalScreening rows only (PENDING / INVALID / EXPIRED rows are excluded); the single POST_PROCESSING QualityTest; the unit's quality_acceptance_score."
    constants:
      PUBLIC_ACCEPT_SCORE_MIN: 70.00
      PRIVATE_ACCEPT_SCORE_MIN: 55.00
    precision: "comparison is >= at exactly the tier minimum"

  - name: maternal_panel_result
    trigger: "POST /cbb/maternal-screenings and PATCH /cbb/maternal-screenings/{id}"
    algorithm: aggregation
    formula: |
      GOVERNING = [hiv_result, hbv_result, hcv_result, htlv_result, syphilis_result]   # cmv_result excluded
      if any(m == PENDING for m in GOVERNING):                       status = PENDING; overall_result = null
      elif collected_at outside [expected_delivery_date - MATERNAL_SCREEN_WINDOW_DAYS days,
                                 expected_delivery_date + MATERNAL_SCREEN_WINDOW_DAYS days]:
                                                                      status = INVALID; overall_result = null
      else:
        status = COMPLETED
        overall_result = REACTIVE      if any(m == REACTIVE for m in GOVERNING)
                    else INDETERMINATE if any(m == INDETERMINATE for m in GOVERNING)
                    else NON_REACTIVE
      reactive_marker_codes = sort_ascending([marker_name for marker_name in GOVERNING if value == REACTIVE])
      valid_until = collected_at + MATERNAL_SCREEN_VALIDITY_DAYS days
    input_set: "The five governing markers of the single screening row plus the Enrollment's expected_delivery_date. cmv_result is informational and never changes overall_result."
    constants:
      MATERNAL_SCREEN_WINDOW_DAYS: 7
      MATERNAL_SCREEN_VALIDITY_DAYS: 180
    precision: "window boundaries are inclusive on both ends"

  - name: nucleated_cell_dose
    trigger: "POST /cbb/reservations (PRE_CRYO variant) and POST /cbb/quality-tests with test_kind == CONFIRMATORY and a reservation_id (POST_THAW variant); the release gate reads the POST_THAW value"
    algorithm: dual_variant_dose
    formula: |
      # Both variants consume the SAME unit counts and the SAME patient_weight_kg and legitimately
      # produce different numbers; which one gates an operation is pinned per operation.
      PRE_CRYO:
        pre_cryo_dose_x1e7_per_kg  = round_half_up(unit.post_processing_tnc_millions
                                                   / (10 * patient_weight_kg), 2)
      POST_THAW:
        recovery_pct  = round_half_up(confirmatory.tnc_millions
                                      / unit.post_processing_tnc_millions * 100, 2)
        effective_tnc = round_half_up(unit.post_processing_tnc_millions
                                      * (confirmatory.viability_pct / 100)
                                      * (recovery_pct / 100), 2)          # rounded BEFORE dividing
        post_thaw_dose_x1e7_per_kg = round_half_up(effective_tnc / (10 * patient_weight_kg), 2)
      # Release gate: post_thaw_dose_x1e7_per_kg >= MIN_RELEASE_DOSE_X1E7 (POST_THAW variant only).
      # Search ranking and GET /cbb/units/search use PRE_CRYO only.
    input_set: "unit.post_processing_tnc_millions (from the single POST_PROCESSING QualityTest), Reservation.patient_weight_kg, and for POST_THAW the CONFIRMATORY QualityTest attached to that reservation."
    constants:
      MIN_RELEASE_DOSE_X1E7: 2.50
    precision: "recovery_pct, effective_tnc and each dose are rounded to 2 decimals, round_half_up, in exactly the order written"
    variants:
      - name: PRE_CRYO
        when: "Evaluated at reservation creation and used by unit search ranking; treats the pre-freeze count as fully recoverable."
        difference: "Ignores post-thaw viability and TNC recovery entirely, so it is always >= the POST_THAW value for the same inputs."
      - name: POST_THAW
        when: "Evaluated when a CONFIRMATORY QualityTest is attached to the reservation and used as the sole release gate."
        difference: "Deflates the count by confirmatory viability_pct and by recovery_pct, so a unit can clear the PRE_CRYO screen at reservation time and still be rejected at release."

  - name: registry_potency_grade
    trigger: "POST /cbb/registry-listings (at RegistryListing creation)"
    algorithm: threshold
    formula: |
      if unit.post_processing_tnc_millions >= 1500 and unit.post_processing_cd34_thousands >= 3000: A
      elif unit.post_processing_tnc_millions >= 1200 and unit.post_processing_cd34_thousands >= 2000: B
      else: C
    input_set: "The owning CordBloodUnit's post-processing counts at the moment of publication; the grade is frozen on the listing row and never recomputed."
    constants:
      GRADE_A_TNC: 1500
      GRADE_A_CD34: 3000
      GRADE_B_TNC: 1200
      GRADE_B_CD34: 2000
    precision: "integer comparisons, inclusive at each boundary"

  - name: storage_invoice_total
    trigger: "POST /cbb/storage-invoices (issue) and each delinquency advance inside POST /cbb/ops/nightly-run"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b): PER-LINE rounding, then sum. This order is PINNED.
      # `round then sum` and `sum then round` differ by one cent for prorated_days = 100 on a PREMIUM
      # tank (5527 vs 5526); the scaffold mandates round-then-sum.
      base_line_cents      = round_half_up(ANNUAL_STORAGE_FEE_CENTS * prorated_days
                                           / DAYS_PER_BILLING_YEAR)                    # -> integer cents
      surcharge_line_cents = round_half_up(base_line_cents * TANK_PREMIUM_SURCHARGE_PCT)
                             if the account's unit tank_class == PREMIUM else 0
                             # NOTE: the surcharge is computed on the ALREADY-ROUNDED base line.
      admin_line_cents     = round_half_up(ANNUAL_STORAGE_FEE_CENTS * ADMIN_FEE_PCT)
      late_fee_line_cents  = 0 at issue; each delinquency advance adds
                             round_half_up((amount_due_cents - amount_paid_cents) * LATE_FEE_PCT)
      amount_due_cents     = base_line_cents + surcharge_line_cents
                             + admin_line_cents + late_fee_line_cents
      due_date             = billing_period_start + INVOICE_NET_DAYS days
    input_set: "The invoice's own prorated_days plus the tank_class of the StorageTank holding the single CordBloodUnit whose storage_account_id == this invoice's account_id (tank_class STANDARD is assumed when no unit is cryopreserved yet)."
    constants:
      ANNUAL_STORAGE_FEE_CENTS: 18000
      DAYS_PER_BILLING_YEAR: 365
      TANK_PREMIUM_SURCHARGE_PCT: 0.075
      ADMIN_FEE_PCT: 0.0125
      LATE_FEE_PCT: 0.015
      INVOICE_NET_DAYS: 30
    precision: "every line is rounded to whole cents with round_half_up BEFORE the sum; the sum is never re-rounded"

  - name: storage_fee_assessment
    trigger: "POST /cbb/reservations/{id}/release and POST /cbb/units/{id}/dispose, on the unit's StorageAccount"
    algorithm: dual_variant_proration
    formula: |
      unused_days = whole days in the half-open interval [date(logical_clock_now), date(paid_through_date))
                    (0 when paid_through_date <= logical_clock_now)
      ANNIVERSARY_ACCRUAL   (plan_term_years == 1): prorated_refund_cents = 0
      PRORATED_TERMINATION  (plan_term_years >= 5): prorated_refund_cents =
                    round_half_up(ANNUAL_STORAGE_FEE_CENTS * unused_days / DAYS_PER_BILLING_YEAR)
    input_set: "The StorageAccount's plan_term_years and paid_through_date plus the logical clock. Invoice rows do NOT participate — only paid_through_date does."
    constants:
      ANNUAL_STORAGE_FEE_CENTS: 18000
      DAYS_PER_BILLING_YEAR: 365
    precision: "whole cents, round_half_up; day counting is calendar-date based and half-open on the right"
    variants:
      - name: ANNIVERSARY_ACCRUAL
        when: "plan_term_years == 1 — the annual period is earned in full on its anniversary."
        difference: "Refunds nothing however early in the period the unit leaves inventory."
      - name: PRORATED_TERMINATION
        when: "plan_term_years >= 5 — long prepaid terms are refundable day by day."
        difference: "Refunds ANNUAL_STORAGE_FEE_CENTS x unused_days / 365, so the same account state yields a different settlement than ANNIVERSARY_ACCRUAL."

  - name: disposition_settlement
    trigger: "POST /cbb/reservations/{id}/release and POST /cbb/units/{id}/dispose (only when the unit has a non-null storage_account_id)"
    algorithm: waterfall_allocation
    formula: |
      # Combinatorial mode (c): the fee LOOKS circular because it is a tier over the settlement, but
      # the evaluation order is PINNED so the value is well defined.
      # STEP 1  balance = account_balance_reconciliation(account)            # outstanding, pre-fee
      # STEP 2  refund  = storage_fee_assessment(account)                    # variant-dependent
      # STEP 3  settlement_subtotal_cents = balance - refund
      # STEP 4  disposition_fee_cents is the tier of settlement_subtotal_cents (NOT of the total):
      #           subtotal <= 0                    -> DISPOSITION_FEE_CREDIT_CENTS
      #           1 <= subtotal <= 9999            -> DISPOSITION_FEE_SMALL_CENTS
      #           subtotal >= 10000                -> DISPOSITION_FEE_LARGE_CENTS
      # STEP 5  settlement_total_cents = settlement_subtotal_cents + disposition_fee_cents
      # Written to StorageAccount.last_settlement_total_cents, and mirrored onto
      # Reservation.settlement_total_cents when the trigger was a release.
    input_set: "The StorageAccount's outstanding invoice set (status IN {ISSUED, PAST_DUE, DELINQUENT}) and its paid_through_date / plan_term_years. Rows in status PAID, VOID and WRITTEN_OFF are excluded."
    constants:
      DISPOSITION_FEE_CREDIT_CENTS: 2500
      DISPOSITION_FEE_SMALL_CENTS: 5000
      DISPOSITION_FEE_LARGE_CENTS: 7500
      SMALL_TIER_UPPER_CENTS: 9999
    precision: "whole cents; tier boundaries are inclusive as written and keyed on the pre-fee subtotal"

  - name: account_balance_reconciliation
    trigger: "Every mutation of a StorageInvoice belonging to the account (issue, payment, delinquency advance, void, write-off) and every settlement"
    algorithm: aggregation
    formula: |
      balance_cents = sum over StorageInvoice rows with account_id == account.id
                          AND status IN {ISSUED, PAST_DUE, DELINQUENT}
                          of (amount_due_cents - amount_paid_cents)
      lifetime_paid_cents = sum of every accepted payment amount ever posted to this account
                            (monotonic; VOID and WRITTEN_OFF never reduce it)
    input_set: "(a) source entity StorageInvoice filtered to status IN {ISSUED, PAST_DUE, DELINQUENT}; (b) no time window — all rows of the account regardless of billing period; (c) the sum is order-insensitive so no tie-break is required."
    constants: {}
    precision: "whole cents; empty outstanding set yields 0"

  - name: tank_slot_occupancy
    trigger: "POST /cbb/units/{id}/cryopreserve, POST /cbb/units/{id}/dispose, POST /cbb/reservations/{id}/release, and the enrollment-withdraw cascade"
    algorithm: aggregation
    formula: |
      occupied_slots = count of CordBloodUnit rows with tank_id == tank.id
                       AND availability_status NOT IN {RELEASED, DISPOSED}
      # Conservation invariant (must hold after every mutation, including compensations):
      #   occupied_slots == count(units in tank not yet RELEASED/DISPOSED)
      #   and capacity_slots - occupied_slots == free slots offered to the next cryopreservation
    input_set: "(a) source entity CordBloodUnit filtered by tank_id and availability_status NOT IN {RELEASED, DISPOSED}; (b) no time window; (c) a count is order-insensitive so no tie-break is required."
    constants: {}
    precision: "integer count; QUARANTINED and PENDING_ABANDONMENT units still occupy their slot"

  - name: cumulative_excursion_minutes_30d
    trigger: "POST /cbb/temperature-excursions/{id}/resolve and POST /cbb/ops/nightly-run"
    algorithm: interval_merge
    formula: |
      window = [logical_clock_now - EXCURSION_WINDOW_DAYS days, logical_clock_now]   # closed on both ends
      rows   = TemperatureExcursion with tank_id == tank.id
               AND status IN {RESOLVED, CLOSED_LOSS}
               AND detected_at inside window
      # A tank can hold at most one excursion in status {OPEN, ACKNOWLEDGED, ESCALATED} at a time, so the
      # intervals [detected_at, resolved_at] of `rows` are pairwise disjoint by construction and the
      # merge degenerates to a plain sum. Rows are visited in detected_at ASC order, created_at ASC as
      # the tie-break.
      cumulative_excursion_minutes_30d = sum(duration_minutes of rows)
      # Gate: cryopreservation is refused when cumulative_excursion_minutes_30d
      #       > CUMULATIVE_EXCURSION_LIMIT_MINUTES (strictly greater; exactly 120 still admits units).
    input_set: "(a) source entity TemperatureExcursion filtered to status IN {RESOLVED, CLOSED_LOSS}; (b) rolling window closed on both ends, anchored on detected_at; (c) tie-break detected_at ASC then created_at ASC."
    constants:
      EXCURSION_WINDOW_DAYS: 30
      CUMULATIVE_EXCURSION_LIMIT_MINUTES: 120
      ALARM_THRESHOLD_C: -150.0
      MAX_ACK_MINUTES: 30
    precision: "duration_minutes is floor((resolved_at - detected_at) in whole minutes); the sum is an integer"

  - name: reservation_hold_conflict
    trigger: "POST /cbb/reservations (before the Reservation row is created)"
    algorithm: interval_merge
    formula: |
      incumbents = Reservation rows with unit_id == this unit
                   AND status IN {PENDING_CONFIRMATORY, CONFIRMED}
      # CLOSED intervals plus a mandatory logistics buffer on BOTH sides.
      for r in incumbents ordered by hold_from ASC, created_at ASC:
        if new.hold_from < r.hold_until + BUFFER  and  r.hold_from < new.hold_until + BUFFER:
            reject ERR_HOLD_WINDOW_CONFLICT
      # BUFFER = RESERVATION_HOLD_BUFFER_HOURS hours. The comparison is STRICT `<` on both buffered
      # edges, so a gap of EXACTLY 24 h touches the buffered edge without crossing it and is ACCEPTED;
      # any gap below 24 h is rejected.
    input_set: "(a) source entity Reservation filtered to status IN {PENDING_CONFIRMATORY, CONFIRMED} on the same unit; (b) closed intervals [hold_from, hold_until] widened by 24 h on each side; (c) evaluation order hold_from ASC then created_at ASC (first conflict wins, but the error is identical either way)."
    constants:
      RESERVATION_HOLD_BUFFER_HOURS: 24
    precision: "instant comparisons at second granularity; a gap of exactly 24:00:00 is legal, 23:59:59 is not"

  - name: unit_search_ranking
    trigger: "GET /cbb/units/search"
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set, expressed as explicit predicates:
      #     eligibility_status == ELIGIBLE
      #     processing_status  == CRYOPRESERVED
      #     tank.status        == ONLINE
      #     program_scope == PUBLIC          -> availability_status == LISTED
      #                                          AND a RegistryListing with listing_status == ACTIVE exists
      #     program_scope == PRIVATE_DIRECTED-> availability_status == PRIVATE_STORED
      #     patient_hla floor  -> required_hla_match_count <= 6 is a request filter only, not a unit field;
      #                            no HLA arithmetic is performed server-side
      #     min_dose filter    -> when min_dose_x1e7_per_kg is supplied,
      #                            pre_cryo_dose(patient_weight_kg) >= min_dose_x1e7_per_kg
      # (b) RANKING EXPRESSION: pre_cryo_dose(patient_weight_kg) DESC
      # (c) TIE-BREAK: post_processing_cd34_thousands DESC, then created_at ASC.
      #     `id` is never consulted.
      # (d) EMPTY CANDIDATE SET: HTTP 200 with data == [] and total_count == 0; never an error.
    input_set: "All CordBloodUnit rows passing the eligibility filter above; pagination is applied after ranking."
    constants: {}
    precision: "pre_cryo_dose is the PRE_CRYO variant of nucleated_cell_dose at 2 decimals; comparisons on the rounded value"

  - name: delinquency_stage_advance
    trigger: "POST /cbb/ops/nightly-run"
    algorithm: chronological
    formula: |
      # Rows are visited in a PINNED order so the cascade is reproducible:
      #   StorageInvoice rows with status IN {ISSUED, PAST_DUE} and amount_paid_cents < amount_due_cents,
      #   ordered by due_date ASC, then created_at ASC.
      for inv in rows:
        days_past_due = whole days from date(inv.due_date) to date(clock)     # 0 when clock <= due_date
        if inv.status == ISSUED  and days_past_due >= PAST_DUE_DAYS:     advance to PAST_DUE
        if inv.status == PAST_DUE and days_past_due >= DELINQUENT_DAYS:  advance to DELINQUENT
        # at most ONE stage advance per invoice per run
        on advance: late_fee_line_cents += round_half_up((amount_due_cents - amount_paid_cents) * LATE_FEE_PCT)
                    amount_due_cents recomputed; stage_advanced_at := clock
      # then, per account, in created_at ASC order:
      #   ACTIVE -> PAST_DUE when an invoice reached PAST_DUE this run
      #   PAST_DUE -> DELINQUENT when an invoice reached DELINQUENT this run
      #   DELINQUENT -> ABANDONMENT_NOTICE when days_past_due of the oldest DELINQUENT invoice >= ABANDONMENT_NOTICE_DAYS
      #   ABANDONMENT_NOTICE -> ABANDONED  when that value >= ABANDONMENT_DAYS
      #   at most ONE account stage advance per run
    input_set: "(a) source entity StorageInvoice filtered to status IN {ISSUED, PAST_DUE} with a positive residual; (b) window anchored on due_date with day counting inclusive of the crossing day; (c) processing order due_date ASC then created_at ASC — never id."
    constants:
      PAST_DUE_DAYS: 30
      DELINQUENT_DAYS: 90
      ABANDONMENT_NOTICE_DAYS: 180
      ABANDONMENT_DAYS: 365
      LATE_FEE_PCT: 0.015
    precision: "whole cents for the late fee; day counts are calendar dates in UTC"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the ten declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's allowed-role set"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "a ParentGuardian caller may only address the Enrollment whose id equals its X-User-ID, and rows reachable from it (StorageAccount, CollectionKit, MaternalScreening, CordBloodUnit, StorageInvoice)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /cbb/enrollments/{id}, GET /cbb/enrollments/{id}/storage-accounts, GET /cbb/enrollments/{id}/collection-kits, GET /cbb/enrollments/{id}/maternal-screenings, POST /cbb/enrollments/{id}/consent, POST /cbb/enrollments/{id}/consent-amendment, POST /cbb/enrollments/{id}/withdraw, GET /cbb/storage-accounts/{id}, GET /cbb/storage-accounts/{id}/storage-invoices, POST /cbb/storage-invoices/{id}/payments"
  - priority: 4
    category: auth
    check: "a TransplantCenter caller may only address a Reservation whose requesting_center_user_id equals its X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /cbb/reservations/{id}, GET /cbb/reservations/{id}/release-summary, POST /cbb/reservations/{id}/confirm, POST /cbb/reservations/{id}/cancel"
  - priority: 5
    category: existence
    check: "request body parses, every required field is present, every enum value is a declared member, numeric fields are within their declared range, and timestamps are RFC3339 UTC"
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 6
    category: existence
    check: "every path id resolves to an existing row, validated left-to-right"
    error_id: "ERR_ENROLLMENT_NOT_FOUND | ERR_STORAGE_ACCOUNT_NOT_FOUND | ERR_KIT_NOT_FOUND | ERR_COLLECTION_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_TANK_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_PROCESSING_RUN_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_EXCURSION_NOT_FOUND | ERR_QUALITY_TEST_NOT_FOUND | ERR_LISTING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 7
    category: existence
    check: "every foreign key supplied in a request body resolves to an existing row (enrollment_id, kit_id, collection_id, unit_id, tank_id, account_id, reservation_id, confirmatory_test_id)"
    error_id: "ERR_ENROLLMENT_NOT_FOUND | ERR_KIT_NOT_FOUND | ERR_COLLECTION_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_TANK_NOT_FOUND | ERR_STORAGE_ACCOUNT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_QUALITY_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /cbb/storage-accounts, POST /cbb/collection-kits, POST /cbb/collections, POST /cbb/maternal-screenings, POST /cbb/processing-runs, POST /cbb/quality-tests, POST /cbb/units/{id}/cryopreserve, POST /cbb/registry-listings, POST /cbb/storage-invoices, POST /cbb/reservations"
  - priority: 8
    category: state
    check: "expected_unit_version equals the addressed CordBloodUnit's current version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /cbb/reservations, POST /cbb/registry-listings"
  - priority: 9
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2 (covers all lifecycle, availability, processing, consent, kit, collection, run, excursion, listing, invoice and reservation axes)"
    error_id: "ERR_INVALID_ENROLLMENT_STATE | ERR_INVALID_UNIT_STATE | ERR_INVALID_RESERVATION_STATE | ERR_INVALID_KIT_STATE | ERR_INVALID_COLLECTION_STATE | ERR_INVALID_EXCURSION_STATE | ERR_INVALID_RUN_STATE | ERR_INVALID_INVOICE_STATE | ERR_INVALID_LISTING_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: business_safety
    check: "segregation of duties: the MedicalDirector performing an eligibility determination must not be the user who performed the unit's POST_PROCESSING QualityTest, and the MedicalDirector performing a release must not be the user recorded in unit.eligibility_determined_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cbb/units/{id}/eligibility-determination, POST /cbb/reservations/{id}/release"
  - priority: 11
    category: business_safety
    check: "the owning Enrollment's consent_status is CONSENTED and consent_version equals the enrollment's current consent_version (an in-flight amendment leaves the enrollment in AMENDMENT_PENDING and blocks downstream work)"
    error_id: ERR_CONSENT_NOT_CURRENT
    http_status: 409
    applies_to: "POST /cbb/collection-kits, POST /cbb/collections, POST /cbb/registry-listings, POST /cbb/units/{id}/cryopreserve"
  - priority: 12
    category: business_constraint
    check: "consent_amendment_count is strictly below MAX_CONSENT_AMENDMENTS (3) before a new amendment is opened"
    error_id: ERR_CONSENT_AMENDMENT_LIMIT
    http_status: 409
    applies_to: "POST /cbb/enrollments/{id}/consent-amendment"
  - priority: 13
    category: business_safety
    check: "the unit's Enrollment has at least one MaternalScreening in status COMPLETED whose valid_until is not in the past"
    error_id: ERR_MATERNAL_SCREENING_INCOMPLETE
    http_status: 409
    applies_to: "POST /cbb/units/{id}/eligibility-determination, POST /cbb/registry-listings, POST /cbb/reservations/{id}/release"
  - priority: 14
    category: business_safety
    check: "the governing COMPLETED MaternalScreening's overall_result is not REACTIVE"
    error_id: ERR_MATERNAL_SCREENING_REACTIVE
    http_status: 422
    applies_to: "POST /cbb/units/{id}/eligibility-determination, POST /cbb/registry-listings, POST /cbb/reservations/{id}/release"
  - priority: 15
    category: business_safety
    check: "the unit's POST_PROCESSING QualityTest recorded sterility_result == NEGATIVE"
    error_id: ERR_STERILITY_POSITIVE
    http_status: 422
    applies_to: "POST /cbb/units/{id}/eligibility-determination, POST /cbb/units/{id}/cryopreserve, POST /cbb/registry-listings"
  - priority: 16
    category: business_safety
    check: "the unit has at least one QualityTest with test_kind == POST_PROCESSING before eligibility or cryopreservation is attempted"
    error_id: ERR_NO_QUALITY_TEST
    http_status: 409
    applies_to: "POST /cbb/units/{id}/eligibility-determination, POST /cbb/units/{id}/cryopreserve"
  - priority: 17
    category: business_referential
    check: "the reservation has a linked CONFIRMATORY QualityTest with outcome PASS (confirmatory_test_id is non-null) before release"
    error_id: ERR_CONFIRMATORY_TEST_REQUIRED
    http_status: 409
    applies_to: "POST /cbb/reservations/{id}/release"
  - priority: 18
    category: business_safety
    check: "the unit's eligibility_status is ELIGIBLE at reservation, listing and release time"
    error_id: ERR_UNIT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /cbb/reservations, POST /cbb/registry-listings, POST /cbb/reservations/{id}/release"
  - priority: 19
    category: business_safety
    check: "post_thaw_dose_x1e7_per_kg is at least MIN_RELEASE_DOSE_X1E7 (2.50)"
    error_id: ERR_DOSE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /cbb/reservations/{id}/release"
  - priority: 20
    category: business_safety
    check: "the unit's post-processing counts clear PUBLIC_LISTING_MIN_TNC_MILLIONS (900), PUBLIC_LISTING_MIN_CD34_THOUSANDS (1500) and PUBLIC_LISTING_MIN_VIABILITY_PCT (85.0)"
    error_id: ERR_QUALITY_BELOW_PUBLIC_THRESHOLD
    http_status: 422
    applies_to: "POST /cbb/registry-listings"
  - priority: 21
    category: business_constraint
    check: "the program_type matches the operation: the unit offered for registry listing MUST be PUBLIC_DONATION, and the Enrollment a StorageAccount is opened on (and therefore every invoice issued against that account) MUST be PRIVATE_FAMILY"
    error_id: ERR_PROGRAM_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /cbb/registry-listings, POST /cbb/storage-accounts, POST /cbb/storage-invoices"
  - priority: 22
    category: business_constraint
    check: "the Enrollment does not already own a StorageAccount"
    error_id: ERR_DUPLICATE_STORAGE_ACCOUNT
    http_status: 409
    applies_to: "POST /cbb/storage-accounts"
  - priority: 23
    category: business_constraint
    check: "the unit has no RegistryListing in status ACTIVE or SUSPENDED"
    error_id: ERR_DUPLICATE_ACTIVE_LISTING
    http_status: 409
    applies_to: "POST /cbb/registry-listings"
  - priority: 24
    category: business_constraint
    check: "the CollectionKit's expires_at is not in the past at collection and at receipt"
    error_id: ERR_KIT_EXPIRED
    http_status: 409
    applies_to: "POST /cbb/collections, POST /cbb/collections/{id}/receive"
  - priority: 25
    category: business_temporal
    check: "the exact elapsed hours from collected_at to the logical clock do not exceed MAX_HOURS_COLLECTION_TO_RECEIPT (48.0)"
    error_id: ERR_PROCESSING_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /cbb/collections/{id}/receive"
  - priority: 26
    category: business_safety
    check: "transport_temp_c is inside the closed range [MIN_TRANSPORT_TEMP_C 2.0, MAX_TRANSPORT_TEMP_C 30.0]"
    error_id: ERR_TRANSPORT_TEMP_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /cbb/collections/{id}/receive"
  - priority: 27
    category: business_constraint
    check: "the target StorageTank's occupied_slots is strictly below capacity_slots"
    error_id: ERR_TANK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cbb/units/{id}/cryopreserve"
  - priority: 28
    category: business_safety
    check: "the target StorageTank's status is ONLINE (ALARM, MAINTENANCE and OFFLINE tanks accept nothing, and release additionally requires the holding tank to be ONLINE, so ALARM, MAINTENANCE and OFFLINE all block it)"
    error_id: ERR_TANK_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /cbb/units/{id}/cryopreserve, POST /cbb/reservations/{id}/release"
  - priority: 29
    category: business_temporal
    check: "freeze_at is not inside the tank's half-open maintenance window [maintenance_window_start, maintenance_window_end)"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cbb/units/{id}/cryopreserve"
  - priority: 30
    category: business_safety
    check: "the tank's cumulative_excursion_minutes_30d does not exceed CUMULATIVE_EXCURSION_LIMIT_MINUTES (120) — the comparison is strictly greater, so exactly 120 is still admissible"
    error_id: ERR_EXCURSION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /cbb/units/{id}/cryopreserve"
  - priority: 31
    category: business_temporal
    check: "the requested hold window, widened by RESERVATION_HOLD_BUFFER_HOURS (24) on each side, does not overlap an incumbent PENDING_CONFIRMATORY or CONFIRMED hold on the same unit"
    error_id: ERR_HOLD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cbb/reservations"
  - priority: 32
    category: business_temporal
    check: "the reservation is confirmed within CONFIRM_WINDOW_HOURS (72) of its creation"
    error_id: ERR_CONFIRMATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /cbb/reservations/{id}/confirm"
  - priority: 33
    category: business_fiscal
    check: "the unit's StorageAccount is not in status DELINQUENT, ABANDONMENT_NOTICE or ABANDONED"
    error_id: ERR_ACCOUNT_DELINQUENT
    http_status: 402
    applies_to: "POST /cbb/reservations, POST /cbb/registry-listings"
  - priority: 34
    category: business_fiscal
    check: "the unit's StorageAccount has balance_cents == 0 at release"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 402
    applies_to: "POST /cbb/reservations/{id}/release"
  - priority: 35
    category: business_fiscal
    check: "a payment's amount_cents does not exceed the invoice's residual (amount_due_cents - amount_paid_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /cbb/storage-invoices/{id}/payments"

endpoints:
  # ---------- single-resource reads (one per entity; also the canonical collection-segment declaration) ----------
  - method: GET
    path: "/cbb/enrollments/{id}"
    description: "Fetch one expectant-parent enrollment with its lifecycle and consent axes."
    roles: [IntakeCoordinator, ParentGuardian, MedicalDirector, BillingAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/cbb/storage-accounts/{id}"
    description: "Fetch one private family storage account with its billing status and reconciled balance."
    roles: [BillingAdministrator, ParentGuardian, PlatformAdmin]
    code: 200
    input: []
    output: StorageAccount
    side_effects: []
  - method: GET
    path: "/cbb/collection-kits/{id}"
    description: "Fetch one dispatched collection kit."
    roles: [IntakeCoordinator, CollectionSite, ParentGuardian, PlatformAdmin]
    code: 200
    input: []
    output: CollectionKit
    side_effects: []
  - method: GET
    path: "/cbb/collections/{id}"
    description: "Fetch one collection event with its volumes and transit metrics."
    roles: [CollectionSite, ProcessingTechnologist, MedicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: Collection
    side_effects: []
  - method: GET
    path: "/cbb/units/{id}"
    description: "Fetch one cord blood unit with its processing, availability and eligibility axes."
    roles: [ProcessingTechnologist, MedicalDirector, RegistryOperator, TransplantCenter, BillingAdministrator, PlatformAdmin]
    code: 200
    input: []
    output: CordBloodUnit
    side_effects: []
  - method: GET
    path: "/cbb/processing-runs/{id}"
    description: "Fetch one volume-reduction processing run with its recovery metrics."
    roles: [ProcessingTechnologist, MedicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: ProcessingRun
    side_effects: []
  - method: GET
    path: "/cbb/quality-tests/{id}"
    description: "Fetch one cell-count / viability test record (immutable)."
    roles: [ProcessingTechnologist, MedicalDirector, TransplantCenter, PlatformAdmin]
    code: 200
    input: []
    output: QualityTest
    side_effects: []
  - method: GET
    path: "/cbb/maternal-screenings/{id}"
    description: "Fetch one maternal infectious-disease screening panel."
    roles: [MedicalDirector, IntakeCoordinator, ParentGuardian, PlatformAdmin]
    code: 200
    input: []
    output: MaternalScreening
    side_effects: []
  - method: GET
    path: "/cbb/storage-tanks/{id}"
    description: "Fetch one cryogenic storage tank with occupancy and rolling excursion minutes."
    roles: [FacilitiesEngineer, ProcessingTechnologist, MedicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: StorageTank
    side_effects: []
  - method: GET
    path: "/cbb/temperature-excursions/{id}"
    description: "Fetch one temperature excursion with its acknowledgement and disposition."
    roles: [FacilitiesEngineer, MedicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: []
  - method: GET
    path: "/cbb/registry-listings/{id}"
    description: "Fetch one public registry listing with its frozen potency grade."
    roles: [RegistryOperator, MedicalDirector, TransplantCenter, PlatformAdmin]
    code: 200
    input: []
    output: RegistryListing
    side_effects: []
  - method: GET
    path: "/cbb/storage-invoices/{id}"
    description: "Fetch one storage invoice with its per-line breakdown."
    roles: [BillingAdministrator, ParentGuardian, PlatformAdmin]
    code: 200
    input: []
    output: StorageInvoice
    side_effects: []
  - method: GET
    path: "/cbb/reservations/{id}"
    description: "Fetch one transplant-centre reservation with both dose variants."
    roles: [TransplantCenter, MedicalDirector, RegistryOperator, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  # ---------- FK reverse-reachability (sub-resource lists; always <Child>[]) ----------
  - method: GET
    path: "/cbb/enrollments/{id}/storage-accounts"
    description: "List the storage accounts of an enrollment (0 or 1 element)."
    roles: [BillingAdministrator, ParentGuardian, PlatformAdmin]
    code: 200
    input: []
    output: StorageAccount[]
    side_effects: []
  - method: GET
    path: "/cbb/enrollments/{id}/collection-kits"
    description: "List the collection kits dispatched for an enrollment, created_at ASC."
    roles: [IntakeCoordinator, CollectionSite, ParentGuardian, PlatformAdmin]
    code: 200
    input: []
    output: CollectionKit[]
    side_effects: []
  - method: GET
    path: "/cbb/enrollments/{id}/maternal-screenings"
    description: "List the maternal screening panels of an enrollment, created_at ASC — the governing panel is the last COMPLETED element."
    roles: [MedicalDirector, IntakeCoordinator, ParentGuardian, PlatformAdmin]
    code: 200
    input: []
    output: MaternalScreening[]
    side_effects: []
  - method: GET
    path: "/cbb/collection-kits/{id}/collections"
    description: "List the collection events recorded against a kit (0 or 1 element)."
