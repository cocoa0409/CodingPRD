            - "its UccDataSet is dsh_eligible with uncompensated_care_cost_cents 36500000 and ucc_payment_cents 7300000"
            - "one ISSUED TENTATIVE Settlement with amount_due_provider_cents 75000000, and a COMPLETED DOUBLE_APPORTIONMENT StepdownRun so allocation_status == CURRENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
