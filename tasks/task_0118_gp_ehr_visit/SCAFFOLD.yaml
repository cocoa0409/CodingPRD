scenario: |
  118. General Practice EHR & Visit: patient record, primary care provider binding,
  consultation/physical/vaccination, CPT billing codes, electronic prescription EPCS,
  referral, patient portal, HEDIS quality metric.

domain_name: gp-ehr-visit
api_prefix: /patients

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: Medical Record Number, unique per clinic
        constraints: "regex ^MRN[0-9]{8}$"
      - name: first_name
        type: string
        source: input
        description: Patient legal first name
      - name: last_name
        type: string
        source: input
        description: Patient legal last name
      - name: date_of_birth
        type: string
        source: input
        description: ISO date (YYYY-MM-DD)
      - name: sex_at_birth
        type: enum
        source: input
        description: Used for HEDIS denominator stratification
        constraints: "one of {MALE, FEMALE, UNKNOWN}"
      - name: pcp_provider_id
        type: string
        source: input
        description: Foreign key to bound Provider (PCP). May be null until binding.
        default: null
      - name: pcp_bound_at
        type: datetime
        source: system
        description: Timestamp when the patient was bound to current PCP
        default: null
      - name: portal_enabled
        type: boolean
        source: input
        description: Whether patient may authenticate to the portal
        default: false
      - name: smoking_status
        type: enum
        source: input
        description: Used by HEDIS Tobacco Cessation measure
        constraints: "one of {NEVER, FORMER, CURRENT, UNKNOWN}"
        default: UNKNOWN
      - name: chronic_conditions
        type: array
        source: input
        description: Array of ICD-10 codes (e.g., ['E11.9','I10']); drives HEDIS denominator membership
        default: []
      - name: status
        type: enum
        source: system
        description: Patient record lifecycle
        constraints: "one of {ACTIVE, INACTIVE}"
        default: ACTIVE

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: 10-digit National Provider Identifier
        constraints: "regex ^[0-9]{10}$"
      - name: full_name
        type: string
        source: input
        description: Provider full name
      - name: role_type
        type: enum
        source: input
        description: Whether the provider may act as PCP, specialist, or both
        constraints: "one of {PCP_ONLY, SPECIALIST_ONLY, BOTH}"
      - name: specialty
        type: string
        source: input
        description: Specialty descriptor; required for SPECIALIST_ONLY and BOTH
      - name: dea_number
        type: string
        source: input
        description: DEA registration number; required to author controlled-substance prescriptions
        default: null
      - name: epcs_enrolled
        type: boolean
        source: input
        description: Whether the provider has completed EPCS identity proofing
        default: false
      - name: panel_size
        type: integer
        source: computed
        description: Count of Patients whose pcp_provider_id == this provider AND status == ACTIVE
        default: 0
      - name: panel_cap
        type: integer
        source: input
        description: Maximum panel size (only enforced if role_type in {PCP_ONLY, BOTH})
        default: 2000
      - name: status
        type: enum
        source: system
        description: Provider record lifecycle
        constraints: "one of {ACTIVE, INACTIVE}"
        default: ACTIVE

  - name: Encounter
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: Foreign key to Patient
      - name: provider_id
        type: string
        source: input
        description: Provider conducting the visit
      - name: encounter_type
        type: enum
        source: input
        description: Type of clinical encounter
        constraints: "one of {CONSULTATION, PHYSICAL, VACCINATION}"
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO8601 start time
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO8601 end time (must be after start, at most 120 minutes after)
      - name: actual_start
        type: datetime
        source: system
        description: Stamped on CHECKED_IN
        default: null
      - name: actual_end
        type: datetime
        source: system
        description: Stamped on COMPLETED
        default: null
      - name: chief_complaint
        type: string
        source: input
        description: Free-text complaint (required for CONSULTATION/PHYSICAL)
        default: null
      - name: vital_signs
        type: object
        source: input
        description: Object with bp_systolic, bp_diastolic, pulse, temp_c, weight_kg, height_cm (required to COMPLETE PHYSICAL)
        default: null
      - name: bmi
        type: number
        source: computed
        description: weight_kg / (height_cm/100)^2, rounded HALF_UP to 1 decimal; computed on PHYSICAL completion
        default: null
      - name: status
        type: enum
        source: system
        description: Encounter lifecycle state
        constraints: "one of {SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}"
        default: SCHEDULED

  - name: CptLineItem
    parent: Encounter
    common_fields: false
    fields:
      - name: encounter_id
        type: string
        source: input
        description: Foreign key to Encounter
      - name: cpt_code
        type: string
        source: input
        description: CPT-4 code (5 digits)
        constraints: "regex ^[0-9]{5}$"
      - name: units
        type: integer
        source: input
        description: Number of units billed (>=1, <=50)
      - name: list_charge_cents
        type: integer
        source: computed
        description: Sum of CptFeeCatalog.list_price_cents * units at time of line creation
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: Adjudicated allowed amount, populated when Encounter COMPLETED
        default: null
      - name: modifier
        type: string
        source: input
        description: Optional CPT modifier (e.g., '25','59')
        default: null
      - name: is_preventive
        type: boolean
        source: computed
        description: True if cpt_code is on the preventive list (drives HEDIS Adult Wellness numerator)
        default: false

  - name: CptFeeCatalog
    parent: null
    common_fields: false
    fields:
      - name: cpt_code
        type: string
        source: input
        description: CPT-4 code; primary key (replaces id)
        constraints: "regex ^[0-9]{5}$; unique"
      - name: description
        type: string
        source: input
        description: Human description of procedure
      - name: list_price_cents
        type: integer
        source: input
        description: Cash price in cents (>=0)
      - name: allowed_price_cents
        type: integer
        source: input
        description: Insurance-allowed price in cents (>=0, <= list_price_cents)
      - name: is_preventive
        type: boolean
        source: input
        description: Whether code qualifies as preventive care for HEDIS
        default: false
      - name: is_telehealth_eligible
        type: boolean
        source: input
        description: Whether code may be billed under telehealth POS
        default: false

  - name: Prescription
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: Foreign key to Patient
      - name: provider_id
        type: string
        source: input
        description: Authoring Provider
      - name: encounter_id
        type: string
        source: input
        description: Encounter context (required; encounter must be COMPLETED or CHECKED_IN)
      - name: drug_name
        type: string
        source: input
        description: Medication name
      - name: rxnorm_code
        type: string
        source: input
        description: RxNorm identifier
      - name: is_controlled
        type: boolean
        source: input
        description: True if a DEA-scheduled controlled substance
        default: false
      - name: dea_schedule
        type: enum
        source: input
        description: DEA schedule when is_controlled
        constraints: "one of {II, III, IV, V, null}; required iff is_controlled=true"
        default: null
      - name: dose_mg
        type: number
        source: input
        description: Dose strength in milligrams
      - name: quantity
        type: integer
        source: input
        description: Dispense quantity in tablets (1..360)
      - name: refills_authorized
        type: integer
        source: input
        description: Authorized refills (0..5; schedule II MUST be 0)
      - name: refills_remaining
        type: integer
        source: computed
        description: Decrements on refill dispense; floor 0
      - name: epcs_two_factor_token
        type: string
        source: input
        description: 6-digit OTP submitted by prescriber for SIGN; required only when is_controlled=true
        default: null
      - name: status
        type: enum
        source: system
        description: Prescription lifecycle
        constraints: "one of {DRAFT, SIGNED, TRANSMITTED, DISPENSED, CANCELLED, EXPIRED}"
        default: DRAFT
      - name: signed_at
        type: datetime
        source: system
        description: Set on SIGN transition
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: signed_at + 365 days for non-controlled; signed_at + 180 days for schedule III–V; signed_at + 30 days for schedule II (which also has 0 refills)
        default: null

  - name: Referral
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: Foreign key to Patient
      - name: referring_provider_id
        type: string
        source: input
        description: Provider issuing the referral (MUST equal Patient.pcp_provider_id at create time)
      - name: referred_to_provider_id
        type: string
        source: input
        description: Specialist Provider receiving the referral (role_type in {SPECIALIST_ONLY,BOTH}; MUST != referring)
      - name: encounter_id
        type: string
        source: input
        description: Originating Encounter (must be COMPLETED)
      - name: reason
        type: string
        source: input
        description: Clinical reason text
      - name: priority
        type: enum
        source: input
        description: URGENT triggers SLA acceptance window
        constraints: "one of {ROUTINE, URGENT}"
        default: ROUTINE
      - name: status
        type: enum
        source: system
        description: Referral lifecycle
        constraints: "one of {PENDING, ACCEPTED, REJECTED, COMPLETED, EXPIRED}"
        default: PENDING
      - name: accepted_at
        type: datetime
        source: system
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: created_at + 72h for URGENT; created_at + 30d for ROUTINE
      - name: response_note
        type: string
        source: input
        description: Note from specialist on accept/reject
        default: null

  - name: PortalMessage
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: Foreign key to Patient
      - name: provider_id
        type: string
        source: input
        description: Provider thread participant (MUST equal Patient.pcp_provider_id)
      - name: sender_role
        type: enum
        source: system
        description: Role that authored the message
        constraints: "one of {PATIENT, PROVIDER}"
      - name: body
        type: string
        source: input
        description: Message body (1..2000 chars)
      - name: status
        type: enum
        source: system
        description: Message lifecycle (parallel dimension; see §1.2)
        constraints: "one of {UNREAD, READ, ARCHIVED}"
        default: UNREAD
      - name: triage_status
        type: enum
        source: system
        description: Independent triage dimension
        constraints: "one of {NEW, TRIAGED, ESCALATED}"
        default: NEW

  - name: HedisMeasurement
    parent: Patient
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: Foreign key to Patient
      - name: measure_id
        type: enum
        source: input
        description: HEDIS measure key
        constraints: "one of {AWV, CBP, TSC, CCS}"
      - name: measurement_year
        type: integer
        source: input
        description: 4-digit calendar year (e.g., 2026)
      - name: in_denominator
        type: boolean
        source: computed
        description: Whether patient is in measure's denominator for the year
      - name: in_numerator
        type: boolean
        source: computed
        description: Whether patient also satisfies numerator criteria
      - name: computed_at
        type: datetime
        source: system
        description: Snapshot timestamp; unique on (patient_id, measure_id, measurement_year)

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: Role of caller (from X-User-Role)
      - name: actor_id
        type: string
        source: system
        description: X-User-ID
      - name: action
        type: string
        source: system
        description: e.g., 'prescription.sign', 'patient.view', 'referral.accept'
      - name: target_entity
        type: string
        source: system
        description: Entity type acted upon
      - name: target_id
        type: string
        source: system
        description: ID of target entity
      - name: epcs_signature_hash
        type: string
        source: system
        description: SHA-256 of (provider_id|prescription_id|otp|signed_at); set only for prescription.sign of controlled substances
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: Timestamp of action (server time, monotonic via /_clock)

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Encounter
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /encounters/{id}/check-in"
        actor: Nurse
        preconditions:
          - "Patient.status == ACTIVE"
          - "Provider.status == ACTIVE"
          - "now() >= scheduled_start - 30 minutes"
        side_effects:
          - "Encounter.actual_start = now()"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /_sweep/run (sweeps encounters where now() > scheduled_end AND status==SCHEDULED)"
        actor: system
        preconditions:
          - "now() > Encounter.scheduled_end"
        side_effects:
          - "Encounter.status set to NO_SHOW"
          - "AuditLog entry written"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /encounters/{id}/cancel"
        actor: Receptionist
        preconditions:
          - "now() < Encounter.scheduled_start"
        side_effects:
          - "Encounter.status = CANCELLED"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /encounters/{id}/complete (branching: side-effect set depends on encounter_type)"
        actor: Provider
        preconditions:
          - "if encounter_type == PHYSICAL: vital_signs object fully populated"
          - "if encounter_type == CONSULTATION: chief_complaint non-empty"
          - "at least one CptLineItem exists on encounter"
        side_effects:
          - "Encounter.actual_end = now()"
          - "if encounter_type == PHYSICAL: BMI computed and stored on encounter"
          - "For each CptLineItem on encounter: allowed_amount_cents recomputed via cpt_billing_allowed (cascade depth 2)"
          - "For each CptLineItem on encounter: is_preventive copied from CptFeeCatalog (snapshot)"
          - "Recompute HedisMeasurement rows for (patient, current_year) for AWV and CBP (cascade depth 3 via hedis_measure_eval)"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /encounters/{id}/cancel"
        actor: Provider
        preconditions: ["never permitted after CHECKED_IN unless no CptLineItem exists"]
        side_effects:
          - "Encounter.status = CANCELLED"
          - "Any DRAFT Prescription whose encounter_id == this encounter is CANCELLED (cascade depth 2)"

  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [DISPENSED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /prescriptions/{id}/sign (branching: controlled path requires EPCS 2FA)"
        actor: Provider
        preconditions:
          - "Provider.id == Prescription.provider_id"
          - "Encounter.status in {CHECKED_IN, COMPLETED}"
          - "if is_controlled=true: Provider.epcs_enrolled == true AND Provider.dea_number is non-null AND epcs_two_factor_token is a 6-digit string"
          - "if dea_schedule == II: refills_authorized == 0"
        side_effects:
          - "Prescription.signed_at = now(); status=SIGNED"
          - "Prescription.expires_at computed: 30d for II; 180d for III–V; 365d otherwise"
          - "Prescription.refills_remaining = refills_authorized"
          - "AuditLog entry; if is_controlled, write epcs_signature_hash = sha256(provider_id|prescription_id|otp|signed_at_iso)"
      - from: SIGNED
        to: TRANSMITTED
        trigger: "POST /prescriptions/{id}/transmit"
        actor: Provider
        preconditions:
          - "now() < expires_at"
        side_effects:
          - "Prescription.status = TRANSMITTED"
      - from: TRANSMITTED
        to: DISPENSED
        trigger: "POST /prescriptions/{id}/dispense"
        actor: Pharmacist
        preconditions:
          - "now() < expires_at"
          - "refills_remaining >= 0"
        side_effects:
          - "If refills_remaining == 0 -> status=DISPENSED (terminal)"
          - "Else: refills_remaining -= 1; status stays TRANSMITTED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /prescriptions/{id}/cancel"
        actor: Provider
        preconditions: []
        side_effects: ["Prescription.status = CANCELLED"]
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /prescriptions/{id}/cancel"
        actor: Provider
        preconditions: []
        side_effects: ["Prescription.status = CANCELLED"]
      - from: TRANSMITTED
        to: CANCELLED
        trigger: "POST /prescriptions/{id}/cancel"
        actor: Provider
        preconditions: []
        side_effects: ["Prescription.status = CANCELLED"]
      - from: TRANSMITTED
        to: EXPIRED
        trigger: "POST /_sweep/run (sweeps now() >= expires_at AND status IN {SIGNED, TRANSMITTED})"
        actor: system
        preconditions:
          - "now() >= Prescription.expires_at"
        side_effects: ["Prescription.status = EXPIRED"]
      - from: SIGNED
        to: EXPIRED
        trigger: "POST /_sweep/run"
        actor: system
        preconditions:
          - "now() >= Prescription.expires_at"
        side_effects: ["Prescription.status = EXPIRED"]

  - entity: Referral
    initial_state: PENDING
    terminal_states: [REJECTED, COMPLETED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /referrals/{id}/accept (branching: URGENT vs ROUTINE drive SLA)"
        actor: Specialist
        preconditions:
          - "Provider.id == referred_to_provider_id AND Provider.role_type IN {SPECIALIST_ONLY, BOTH}"
          - "Patient.status == ACTIVE"
          - "now() < Referral.expires_at"
        side_effects:
          - "Referral.accepted_at = now()"
      - from: PENDING
        to: REJECTED
        trigger: "POST /referrals/{id}/reject"
        actor: Specialist
        preconditions:
          - "Provider.id == referred_to_provider_id"
          - "now() < Referral.expires_at"
        side_effects:
          - "Referral.status = REJECTED"
      - from: ACCEPTED
        to: PENDING
        trigger: "POST /referrals/{id}/return-to-pcp (re-route loop, cyclic)"
        actor: Specialist
        preconditions:
          - "no completed Encounter exists with provider_id == referred_to_provider_id linked to this referral"
        side_effects:
          - "Referral.status = PENDING; expires_at unchanged"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /referrals/{id}/complete"
        actor: Specialist
        preconditions:
          - "at least one Encounter with provider_id == referred_to_provider_id and status==COMPLETED exists for this Patient since accepted_at"
        side_effects:
          - "Referral.status = COMPLETED"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_sweep/run (sweeps now() >= expires_at AND status == PENDING)"
        actor: system
        preconditions: ["now() >= Referral.expires_at"]
        side_effects: ["Referral.status = EXPIRED"]

  - entity: PortalMessage
    initial_state: UNREAD
    terminal_states: [ARCHIVED]
    transitions:
      # Parallel dimensions: status (UNREAD/READ/ARCHIVED) and triage_status (NEW/TRIAGED/ESCALATED) evolve independently on the same row.
      - from: UNREAD
        to: READ
        trigger: "POST /portal-messages/{id}/mark-read (status dimension)"
        actor: PatientPortalUser
        preconditions: ["recipient role matches"]
        side_effects: ["status=READ; triage_status unaffected"]
      - from: READ
        to: ARCHIVED
        trigger: "POST /portal-messages/{id}/archive (status dimension)"
        actor: PatientPortalUser
        preconditions: []
        side_effects: ["status=ARCHIVED"]
      - from: NEW
        to: TRIAGED
        trigger: "POST /portal-messages/{id}/triage (triage_status dimension, independent of status dimension)"
        actor: Nurse
        preconditions: ["sender_role == PATIENT"]
        side_effects: ["triage_status=TRIAGED"]
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /portal-messages/{id}/escalate (triage_status dimension)"
        actor: Nurse
        preconditions: ["triage_status == TRIAGED"]
        side_effects:
          - "triage_status=ESCALATED"
          - "An Encounter row of encounter_type=CONSULTATION auto-scheduled within 24h with provider_id=Patient.pcp_provider_id (cascade depth 2)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two providers attempt to bind the same Patient to themselves as PCP simultaneously"
    guarantee: "At most one binding succeeds; the second is rejected"
    error_id: ERR_PCP_ALREADY_BOUND
    http_status: 409
    serialization: "First-writer-wins on Patient.pcp_provider_id"

  - scenario: "Two clients sign and cancel the same Prescription simultaneously"
    guarantee: "Exactly one operation succeeds; loser sees state conflict"
    error_id: ERR_INVALID_PRESCRIPTION_STATE
    http_status: 409
    serialization: "First-writer-wins on Prescription.status"

  - scenario: "Two pharmacists attempt to dispense the same Prescription refill simultaneously"
    guarantee: "Exactly one dispense succeeds; the second sees stale version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on Prescription.version"

  - scenario: "Two providers attempt to accept the same referral simultaneously"
    guarantee: "Only one accept commits"
    error_id: ERR_REFERRAL_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on Referral.status"

  - scenario: "PCP binding succeeds and then patient is bound to a different PCP simultaneously by panel reassignment"
    guarantee: "Panel counts remain consistent; second binding fails when a binding already exists"
    error_id: ERR_PCP_ALREADY_BOUND
    http_status: 409
    serialization: "Patient.pcp_provider_id is single-writer"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cpt_billing_charge
    trigger: "POST /encounters/{id}/cpt-line-items (line creation) — sets list_charge_cents (provisional)"
    algorithm: aggregation
    formula: |
      list_charge_cents = CptFeeCatalog[cpt_code].list_price_cents * units
      # No modifier multipliers at this stage; provisional cash price only.
    input_set: "Single CptLineItem; reads CptFeeCatalog by cpt_code"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_list_charge
        when: "On line item create (Encounter still CHECKED_IN)"
        difference: "Uses LIST price; ignores modifiers and is_telehealth flag"

  - name: cpt_billing_allowed
    trigger: "Encounter transitions CHECKED_IN -> COMPLETED — recomputes allowed_amount_cents per line"
    algorithm: tiered_pricing
    formula: |
      # Step 1: per-line base
      base_cents = CptFeeCatalog[cpt_code].allowed_price_cents * units
      # Step 2: modifier multiplier (applied per line, then rounded HALF_UP to integer cents)
      if modifier == "25": mult = 1.25
      elif modifier == "59": mult = 1.00
      elif modifier == "TC": mult = 0.65
      elif modifier == "26": mult = 0.35
      else: mult = 1.00
      per_line_pre_round = base_cents * mult
      per_line_cents = round_half_up(per_line_pre_round)   # round PER LINE, then sum
      # Step 3: encounter-level volume discount tier applied to encounter sum
      encounter_total = sum(per_line_cents over all lines)
      if encounter_total <= 50000:        tier_factor = 1.00
      elif encounter_total <= 200000:     tier_factor = 0.95
      else:                                tier_factor = 0.90
      # Step 4: apportion adjusted encounter_total back to lines proportionally,
      #         then ROUND each apportioned share HALF_UP, fixing residual cents on the largest pre-round line.
      adjusted_total = round_half_up(encounter_total * tier_factor)
      for each line: apportion = round_half_up(per_line_cents * tier_factor)
      residual = adjusted_total - sum(apportion across lines)
      assign residual cents to the line with greatest per_line_cents (tie-break: smallest CptLineItem.id lexicographic)
      allowed_amount_cents = apportion + assigned_residual
    input_set: "All CptLineItem rows for the encounter (no filter on is_preventive)"
    constants:
      TIER1_CEILING_CENTS: 50000
      TIER2_CEILING_CENTS: 200000
      TIER1_FACTOR: 1.00
      TIER2_FACTOR: 0.95
      TIER3_FACTOR: 0.90
    precision: "integer cents, round_half_up at the two pinned steps (per-line modifier, per-line apportion); residual assignment guarantees apportion-sum == adjusted_total"
    variants:
      - name: adjudicated_allowed
        when: "On encounter completion"
        difference: |
          Differs from cpt_billing_charge in algorithm (tiered with modifier + apportion residual),
          base price (allowed_price_cents vs list_price_cents), and rounding sequence
          (round per-line BEFORE summing; sum/tier/apportion AFTER). For the same inputs the two
          calculations can produce different totals; both are valid records on the encounter.

  - name: hedis_measure_eval
    trigger: "Encounter completion (cascade from cpt_billing_allowed) AND POST /hedis/recompute"
    algorithm: weighted_scoring
    formula: |
      # For each (Patient, measure_id, measurement_year):
      AWV (Adult Wellness Visit, ages 18+):
        denominator = Patient.date_of_birth implies age >= 18 at year-end AND Patient.status==ACTIVE on Dec 31
        numerator   = denominator AND >=1 COMPLETED Encounter in year with a CptLineItem where is_preventive==true
      CBP (Controlling High Blood Pressure, ages 18..85, must have I10 in chronic_conditions):
        denominator = age in [18,85] AND 'I10' in Patient.chronic_conditions AND >=1 COMPLETED Encounter in year
        numerator   = denominator AND most-recent COMPLETED Encounter in year has vital_signs.bp_systolic < 140 AND bp_diastolic < 90
        # Most-recent tie-break: by actual_end DESC; if equal, by Encounter.id ASC.
      TSC (Tobacco Screening & Cessation, ages 18+):
        denominator = age >= 18 AND >=1 COMPLETED Encounter in year
        numerator   = denominator AND Patient.smoking_status in {NEVER, FORMER, CURRENT}
                      AND if smoking_status==CURRENT then a CONSULTATION Encounter exists in year with cpt 99406 OR 99407
      CCS (Cervical Cancer Screening, FEMALE ages 21..64):
        denominator = sex_at_birth==FEMALE AND age in [21,64]
        numerator   = denominator AND >=1 COMPLETED Encounter in year with cpt 88141 OR 88142
      # 'Age at year-end' = measurement_year - year(date_of_birth) - (1 if (month,day) of dob > (12,31) else 0).
    input_set: "All COMPLETED Encounters for the Patient with actual_end within [Jan 1, Dec 31] of measurement_year"
    constants:
      AWV_MIN_AGE: 18
      CBP_MIN_AGE: 18
      CBP_MAX_AGE: 85
      TSC_MIN_AGE: 18
      CCS_MIN_AGE: 21
      CCS_MAX_AGE: 64
      CBP_SYSTOLIC_CEIL: 140
      CBP_DIASTOLIC_CEIL: 90
    precision: "boolean numerator/denominator; age computed in integer years"
    variants:
      - name: provisional_year_to_date
        when: "GET /hedis/measurements/{patient}/{year}?as_of=YTD — uses encounters completed so far this year"
        difference: |
          Provisional uses encounters where actual_end <= now() (inclusive); denominator does NOT require
          Patient.status==ACTIVE on Dec 31 — instead requires ACTIVE as of now(). For TSC, smoking_status
          is read as of now(). The provisional and final variants can disagree for the same patient when
          the patient becomes INACTIVE in November or smoking_status changes late in the year.
      - name: final_year_end
        when: "POST /hedis/recompute?year=YYYY — official measure freeze"
        difference: |
          Uses ALL COMPLETED encounters within calendar year; denominator status pinned to Dec 31;
          smoking_status pinned to Dec 31. Stored as the immutable HedisMeasurement snapshot.

  - name: provider_panel_count
    trigger: "On Patient PCP binding (POST /patients/{id}/bind-pcp), unbinding, and Patient.status change"
    algorithm: aggregation
    formula: |
      Provider.panel_size = count(Patient where pcp_provider_id == Provider.id AND status == ACTIVE)
    input_set: "Patient rows with status=ACTIVE pointing to this Provider"
    constants: {}
    precision: "integer count"

  - name: prescription_expiry
    trigger: "Prescription.status DRAFT -> SIGNED"
    algorithm: threshold
    formula: |
      if not is_controlled: expires_at = signed_at + 365 days
      elif dea_schedule in {III, IV, V}: expires_at = signed_at + 180 days
      elif dea_schedule == II: expires_at = signed_at + 30 days
    input_set: "Single Prescription"
    constants:
      NON_CONTROLLED_DAYS: 365
      SCHEDULE_III_V_DAYS: 180
      SCHEDULE_II_DAYS: 30
    precision: "datetime, second precision"

# =============================================================================
# §1.4 Validation Rules Table (Ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all except POST /_clock/advance, POST /_sweep/run"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameter resources exist (Patient, Provider, Encounter, Prescription, Referral, PortalMessage)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params"

  - priority: 4
    category: existence
    check: "Body foreign-key references exist (patient_id, provider_id, encounter_id, cpt_code in fee catalog)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST/PATCH endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Target resource is in a state that admits the requested transition (e.g., dispense requires TRANSMITTED)"
    error_id: ERR_INVALID_PRESCRIPTION_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (specific error_id varies per entity: ERR_INVALID_ENCOUNTER_STATE, ERR_REFERRAL_NOT_PENDING, ERR_INVALID_PRESCRIPTION_STATE)"

  - priority: 6
    category: business_safety
    check: "Controlled prescription sign requires Provider.epcs_enrolled=true AND non-null DEA AND 6-digit OTP submitted"
    error_id: ERR_EPCS_NOT_ENROLLED
    http_status: 403
    applies_to: "POST /prescriptions/{id}/sign"

  - priority: 7
    category: business_safety
    check: "Schedule II controlled prescription MUST have refills_authorized == 0"
    error_id: ERR_SCHEDULE_II_NO_REFILLS
    http_status: 422
    applies_to: "POST /patients/{id}/prescriptions, POST /prescriptions/{id}/sign"

  - priority: 8
    category: business_safety
    check: "PCP binding requires Provider.role_type IN {PCP_ONLY, BOTH}"
    error_id: ERR_PROVIDER_NOT_PCP
    http_status: 422
    applies_to: "POST /patients/{id}/bind-pcp"

  - priority: 9
    category: business_safety
    check: "Patient may have only one bound PCP at a time"
    error_id: ERR_PCP_ALREADY_BOUND
    http_status: 409
    applies_to: "POST /patients/{id}/bind-pcp"

  - priority: 10
    category: business_referential
    check: "Referral.referring_provider_id MUST equal Patient.pcp_provider_id at time of create"
    error_id: ERR_REFERRER_NOT_PCP
    http_status: 422
    applies_to: "POST /patients/{id}/referrals"

  - priority: 11
    category: business_referential
    check: "Referral.referred_to_provider_id MUST NOT equal referring_provider_id AND Provider.role_type IN {SPECIALIST_ONLY, BOTH}"
    error_id: ERR_INVALID_SPECIALIST
    http_status: 422
    applies_to: "POST /patients/{id}/referrals"

  - priority: 12
    category: business_constraint
    check: "Encounter scheduled_end > scheduled_start AND (scheduled_end - scheduled_start) <= 120 minutes"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /patients/{id}/encounters"

  - priority: 13
    category: business_temporal
    check: "Encounter at create must not temporally overlap another non-terminal Encounter for the same provider_id (closed-open interval semantics; back-to-back allowed at the boundary)"
    error_id: ERR_PROVIDER_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /patients/{id}/encounters"

  - priority: 14
    category: business_temporal
    check: "Encounter at create must not overlap another non-terminal Encounter for the same patient (CLOSED-CLOSED interval semantics with a 15-minute buffer on each side; back-to-back patient visits forbidden within 15 min)"
    error_id: ERR_PATIENT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /patients/{id}/encounters"

  - priority: 15
    category: business_constraint
    check: "Provider.panel_size + 1 <= Provider.panel_cap when binding (only if role_type IN {PCP_ONLY, BOTH})"
    error_id: ERR_PANEL_FULL
    http_status: 422
    applies_to: "POST /patients/{id}/bind-pcp"

  - priority: 16
    category: business_constraint
    check: "Encounter completion requires at least one CptLineItem"
    error_id: ERR_NO_BILLABLE_LINES
    http_status: 422
    applies_to: "POST /encounters/{id}/complete"

  - priority: 17
    category: business_fiscal
    check: "CptLineItem.units between 1 and 50 inclusive; CptFeeCatalog.allowed_price_cents <= list_price_cents"
    error_id: ERR_INVALID_BILLING_UNITS
    http_status: 422
    applies_to: "POST /encounters/{id}/cpt-line-items, POST /cpt-codes"

  - priority: 18
    category: business_constraint
    check: "Patient portal access requires Patient.portal_enabled == true AND X-User-Role == PatientPortalUser AND X-User-ID == Patient.id"
    error_id: ERR_PORTAL_DISABLED
    http_status: 403
    applies_to: "GET/POST /portal/*"

  - priority: 19
    category: business_safety
    check: "Segregation of duties: the Provider who signed a Prescription MUST NOT also dispense it (Provider may not act as Pharmacist on the same prescription)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prescriptions/{id}/dispense"

  - priority: 20
    category: business_constraint
    check: "Optimistic concurrency: when body includes 'version', it must equal the persisted version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints and all action endpoints when version supplied"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Patients ----------
  - method: POST
    path: "/patients"
    description: "Create patient record"
    roles: [Receptionist, ClinicAdmin]
    code: 201
    input: ["mrn", "first_name", "last_name", "date_of_birth", "sex_at_birth", "portal_enabled?", "smoking_status?", "chronic_conditions?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{id}"
    description: "Retrieve patient record"
    roles: [Receptionist, Nurse, Provider, ClinicAdmin, PatientPortalUser]
    code: 200
    input: []
    output: Patient
    side_effects: ["AuditLog write with action=patient.view"]

  - method: PATCH
    path: "/patients/{id}"
    description: "Update mutable patient fields (smoking_status, chronic_conditions, portal_enabled)"
    roles: [Nurse, Provider, ClinicAdmin]
    code: 200
    input: ["smoking_status?", "chronic_conditions?", "portal_enabled?", "version?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients with filter/sort/paginate"
    roles: [Receptionist, Nurse, Provider, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?", "pcp_provider_id?", "status?", "mrn?"]
    output: "Patient[]"
    side_effects: []

  - method: POST
    path: "/patients/{id}/bind-pcp"
    description: "Bind patient to a primary care provider"
    roles: [Receptionist, ClinicAdmin]
    code: 200
    input: ["provider_id", "version?"]
    output: Patient
    side_effects: ["provider_panel_count recomputed for new PCP"]

  - method: POST
    path: "/patients/{id}/unbind-pcp"
    description: "Remove PCP binding"
    roles: [ClinicAdmin]
    code: 200
    input: ["version?"]
    output: Patient
    side_effects: ["provider_panel_count recomputed for prior PCP"]

  # ---------- Providers ----------
  - method: POST
    path: "/providers"
    description: "Create provider"
    roles: [ClinicAdmin]
    code: 201
    input: ["npi", "full_name", "role_type", "specialty?", "dea_number?", "epcs_enrolled?", "panel_cap?"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers/{id}"
    description: "Retrieve provider"
    roles: [Receptionist, Nurse, Provider, ClinicAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers"
    description: "List providers"
    roles: [Receptionist, Nurse, Provider, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?", "role_type?", "specialty?"]
    output: "Provider[]"
    side_effects: []

  # ---------- Encounters ----------
  - method: POST
    path: "/patients/{patient_id}/encounters"
    description: "Schedule encounter"
    roles: [Receptionist, ClinicAdmin]
    code: 201
    input: ["provider_id", "encounter_type", "scheduled_start", "scheduled_end", "chief_complaint?"]
    output: Encounter
    side_effects: []

  - method: GET
    path: "/encounters/{id}"
    description: "Retrieve encounter"
    roles: [Receptionist, Nurse, Provider, ClinicAdmin, PatientPortalUser]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: PATCH
    path: "/encounters/{id}"
    description: "Update vital_signs / chief_complaint on a CHECKED_IN encounter"
    roles: [Nurse, Provider]
    code: 200
    input: ["vital_signs?", "chief_complaint?", "version?"]
    output: Encounter
    side_effects: []

  - method: POST
    path: "/encounters/{id}/check-in"
    description: "Transition SCHEDULED -> CHECKED_IN"
    roles: [Nurse, Receptionist]
    code: 200
    input: ["version?"]
    output: Encounter
    side_effects: ["actual_start set"]

  - method: POST
    path: "/encounters/{id}/complete"
    description: "Transition CHECKED_IN -> COMPLETED; branching side effects per encounter_type"
    roles: [Provider]
    code: 200
    input: ["version?"]
    output: Encounter
    side_effects:
      - "actual_end set; BMI computed if PHYSICAL"
      - "cpt_billing_allowed runs for every CptLineItem on encounter"
      - "hedis_measure_eval recomputes AWV and CBP for current year"

  - method: POST
    path: "/encounters/{id}/cancel"
    description: "Cancel SCHEDULED or CHECKED_IN encounter (CHECKED_IN only when no CptLineItem)"
    roles: [Receptionist, Provider]
    code: 200
    input: ["version?"]
    output: Encounter
    side_effects: ["DRAFT Prescriptions on this encounter are cascaded to CANCELLED"]

  - method: POST
    path: "/encounters/{id}/cpt-line-items"
    description: "Append CPT line item to a CHECKED_IN encounter"
    roles: [Provider, BillingClerk]
    code: 201
    input: ["cpt_code", "units", "modifier?"]
    output: CptLineItem
    side_effects: ["cpt_billing_charge runs"]

  - method: DELETE
    path: "/cpt-line-items/{id}"
    description: "Remove CPT line item (only when parent encounter is CHECKED_IN)"
    roles: [BillingClerk, Provider]
    code: 204
    input: []
    output: null
    side_effects: []

  # ---------- CPT Fee Catalog ----------
  - method: POST
    path: "/cpt-codes"
    description: "Create CPT code entry in fee catalog"
    roles: [ClinicAdmin]
    code: 201
    input: ["cpt_code", "description", "list_price_cents", "allowed_price_cents", "is_preventive?", "is_telehealth_eligible?"]
    output: CptFeeCatalog
    side_effects: []

  - method: GET
    path: "/cpt-codes/{cpt_code}"
    description: "Retrieve CPT entry"
    roles: [Receptionist, Nurse, Provider, ClinicAdmin, BillingClerk]
    code: 200
    input: []
    output: CptFeeCatalog
    side_effects: []

  # ---------- Prescriptions ----------
  - method: POST
    path: "/patients/{patient_id}/prescriptions"
    description: "Create DRAFT prescription"
    roles: [Provider]
    code: 201
    input: ["provider_id", "encounter_id", "drug_name", "rxnorm_code", "is_controlled", "dea_schedule?", "dose_mg", "quantity", "refills_authorized"]
    output: Prescription
    side_effects: []

  - method: GET
    path: "/prescriptions/{id}"
    description: "Retrieve prescription"
    roles: [Provider, Pharmacist, PatientPortalUser, ClinicAdmin]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: POST
    path: "/prescriptions/{id}/sign"
    description: "Sign prescription (EPCS 2FA required for controlled)"
    roles: [Provider]
    code: 200
    input: ["epcs_two_factor_token?", "version?"]
    output: Prescription
    side_effects: ["expires_at computed; refills_remaining seeded; AuditLog with epcs_signature_hash for controlled"]

  - method: POST
    path: "/prescriptions/{id}/transmit"
    description: "Send prescription to pharmacy"
    roles: [Provider]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects: []

  - method: POST
    path: "/prescriptions/{id}/dispense"
    description: "Pharmacist dispenses one fill"
    roles: [Pharmacist]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects: ["refills_remaining decremented; status=DISPENSED if no refills remain"]

  - method: POST
    path: "/prescriptions/{id}/cancel"
    description: "Cancel non-terminal prescription"
    roles: [Provider]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects: []

  # ---------- Referrals ----------
  - method: POST
    path: "/patients/{patient_id}/referrals"
    description: "Create referral (PCP -> specialist)"
    roles: [Provider]
    code: 201
    input: ["referring_provider_id", "referred_to_provider_id", "encounter_id", "reason", "priority?"]
    output: Referral
    side_effects: ["expires_at computed (72h URGENT / 30d ROUTINE)"]

  - method: GET
    path: "/referrals/{id}"
    description: "Retrieve referral"
    roles: [Provider, ClinicAdmin, PatientPortalUser]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{id}/accept"
    description: "Specialist accepts referral"
    roles: [Provider]
    code: 200
    input: ["response_note?", "version?"]
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{id}/reject"
    description: "Specialist rejects referral"
    roles: [Provider]
    code: 200
    input: ["response_note?", "version?"]
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{id}/return-to-pcp"
    description: "Cycle ACCEPTED -> PENDING when specialist needs more PCP input"
    roles: [Provider]
    code: 200
    input: ["response_note?", "version?"]
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{id}/complete"
    description: "Mark referral COMPLETED after specialist encounter"
    roles: [Provider]
    code: 200
    input: ["version?"]
    output: Referral
    side_effects: []

  # ---------- Patient Portal ----------
  - method: POST
    path: "/portal/messages"
    description: "Patient posts message to bound PCP"
    roles: [PatientPortalUser, Provider]
    code: 201
    input: [patient_id, provider_id, body]
    output: PortalMessage
    side_effects: []

  - method: GET
    path: "/portal/messages/{id}"
    description: "Retrieve portal message"
    roles: [PatientPortalUser, Provider, Nurse]
    code: 200
    input: []
    output: PortalMessage
    side_effects: []

  - method: POST
    path: "/portal-messages/{id}/mark-read"
    description: "Mark message READ (status dimension)"
    roles: [PatientPortalUser, Provider]
    code: 200
    input: ["version?"]
    output: PortalMessage
    side_effects: []

  - method: POST
    path: "/portal-messages/{id}/archive"
    description: "Archive READ message (status dimension)"
    roles: [PatientPortalUser, Provider]
    code: 200
    input: ["version?"]
    output: PortalMessage
    side_effects: []

  - method: POST
    path: "/portal-messages/{id}/triage"
    description: "Nurse marks NEW -> TRIAGED (triage_status dimension)"
    roles: [Nurse]
    code: 200
    input: ["version?"]
    output: PortalMessage
    side_effects: []

  - method: POST
    path: "/portal-messages/{id}/escalate"
    description: "Nurse escalates TRIAGED -> ESCALATED; auto-schedules a consultation encounter"
    roles: [Nurse]
    code: 200
    input: ["version?"]
    output: PortalMessage
    side_effects: ["Encounter auto-created (type=CONSULTATION) within 24h with patient's bound PCP"]

  # ---------- HEDIS ----------
  - method: GET
    path: "/hedis/measurements/{patient_id}/{year}"
    description: "Retrieve HEDIS measure status; ?as_of=YTD returns provisional, default returns final snapshot if present"
    roles: [Provider, ClinicAdmin]
    code: 200
    input: ["as_of?"]
    output: "HedisMeasurement[]"
    side_effects: ["if as_of=YTD: provisional_year_to_date variant runs in-memory (no row written)"]

  - method: POST
    path: "/hedis/recompute"
    description: "Compute final HedisMeasurement snapshots for a given year and patient subset"
    roles: [ClinicAdmin]
    code: 200
    input: ["year", "patient_ids?"]
    output: "HedisMeasurement[]"
    side_effects: ["hedis_measure_eval final_year_end variant writes one HedisMeasurement row per (patient, measure_id, year)"]

  # ---------- Audit ----------
  - method: GET
    path: "/audit-logs"
    description: "List audit log entries filtered by target/actor"
    roles: [ClinicAdmin]
    code: 200
    input: ["limit?", "offset?", "target_entity?", "target_id?", "actor_id?", "action?"]
    output: "AuditLog[]"
    side_effects: []

  # ---------- Test infrastructure (mandatory per §1.5 testability rule) ----------
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance server monotonic clock by the supplied seconds (or to absolute ISO timestamp). Required to reach time-gated states (NO_SHOW, EXPIRED, prescription_expiry)."
    roles: [TestHarness]
    code: 200
    input: ["seconds?", "to?"]
    output: "{ now: ISO8601 }"
    side_effects: ["Server clock advances; downstream now() reads use the new value"]

  - method: POST
    path: "/_sweep/run"
    description: "Test-only: run the automatic sweep (NO_SHOW for past encounters, EXPIRED for past prescriptions/referrals). Required because sweep transitions are otherwise unreachable from the API."
    roles: [TestHarness]
    code: 200
    input: []
    output: "{ no_show_count: int, expired_prescription_count: int, expired_referral_count: int }"
    side_effects: ["Time-gated transitions fire for all eligible entities"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist"

  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body foreign-key (patient_id, provider_id, encounter_id, cpt_code) refers to a missing record"

  - id: ERR_INVALID_ENCOUNTER_STATE
    http: 409
    condition: "Encounter is not in a state that admits the requested transition"

  - id: ERR_INVALID_PRESCRIPTION_STATE
    http: 409
    condition: "Prescription is not in a state that admits the requested transition"

  - id: ERR_REFERRAL_NOT_PENDING
    http: 409
    condition: "Referral is no longer PENDING and cannot be accepted/rejected"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version does not match persisted version"

  - id: ERR_EPCS_NOT_ENROLLED
    http: 403
    condition: "Signing a controlled prescription requires Provider.epcs_enrolled, non-null DEA, and a 6-digit OTP"

  - id: ERR_SCHEDULE_II_NO_REFILLS
    http: 422
    condition: "Schedule II prescriptions must have refills_authorized == 0"

  - id: ERR_PROVIDER_NOT_PCP
    http: 422
    condition: "Provider does not have role_type IN {PCP_ONLY, BOTH}"

  - id: ERR_PCP_ALREADY_BOUND
    http: 409
    condition: "Patient already has a non-null pcp_provider_id"

  - id: ERR_REFERRER_NOT_PCP
    http: 422
    condition: "Referral.referring_provider_id != Patient.pcp_provider_id"

  - id: ERR_INVALID_SPECIALIST
    http: 422
    condition: "Referred-to provider is the referrer, or has role_type=PCP_ONLY"

  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "Encounter scheduled_end <= scheduled_start, or duration > 120 minutes"

  - id: ERR_PROVIDER_TIME_CONFLICT
    http: 409
    condition: "Provider already has a non-terminal encounter overlapping (closed-open) this window"

  - id: ERR_PATIENT_TIME_CONFLICT
    http: 409
    condition: "Patient already has a non-terminal encounter within 15 minutes (closed-closed buffer) of this window"

  - id: ERR_PANEL_FULL
    http: 422
    condition: "Provider.panel_size + 1 > Provider.panel_cap"

  - id: ERR_NO_BILLABLE_LINES
    http: 422
    condition: "Completing an encounter with zero CptLineItem rows"

  - id: ERR_INVALID_BILLING_UNITS
    http: 422
    condition: "Units out of range, or allowed_price_cents > list_price_cents"

  - id: ERR_PORTAL_DISABLED
    http: 403
    condition: "Patient.portal_enabled is false or X-User-ID != Patient.id for portal access"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Signing Provider attempts to also dispense the same prescription"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PatientPortalUser
    description: "Patient acting through the portal"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /portal/messages (sender_role=PATIENT branch)"
    shared_operations:
      - "GET /patients/{id} (self only)"
      - "GET /encounters/{id} (self only)"
      - "GET /prescriptions/{id} (self only)"
      - "GET /referrals/{id} (self only)"
      - "GET /portal/messages/{id} (self only)"
      - "POST /portal-messages/{id}/mark-read"
      - "POST /portal-messages/{id}/archive"

  - name: Provider
    description: "Licensed clinician — may bind as PCP (if role_type allows), conduct encounters, author/sign prescriptions, issue and accept referrals"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /encounters/{id}/complete"
      - "POST /patients/{patient_id}/prescriptions"
      - "POST /prescriptions/{id}/sign"
      - "POST /prescriptions/{id}/transmit"
      - "POST /prescriptions/{id}/cancel"
      - "POST /patients/{patient_id}/referrals"
      - "POST /referrals/{id}/accept"
      - "POST /referrals/{id}/reject"
      - "POST /referrals/{id}/return-to-pcp"
      - "POST /referrals/{id}/complete"
    shared_operations:
      - "PATCH /patients/{id}"
      - "PATCH /encounters/{id}"
      - "POST /encounters/{id}/cpt-line-items"
      - "DELETE /cpt-line-items/{id}"
      - "POST /encounters/{id}/cancel"
      - "GET endpoints"

  - name: Nurse
    description: "Triages portal messages, performs check-in, captures vital signs"
    identity: "opaque"
    exclusive_operations:
      - "POST /portal-messages/{id}/triage"
      - "POST /portal-messages/{id}/escalate"
    shared_operations:
      - "POST /encounters/{id}/check-in"
      - "PATCH /encounters/{id}"
      - "PATCH /patients/{id}"
      - "GET endpoints"

  - name: Receptionist
    description: "Front-desk scheduling and intake"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /patients"
      - "POST /patients/{id}/bind-pcp"
      - "POST /patients/{patient_id}/encounters"
      - "POST /encounters/{id}/check-in"
      - "POST /encounters/{id}/cancel"
      - "GET endpoints"

  - name: BillingClerk
    description: "Maintains CPT line items"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /encounters/{id}/cpt-line-items"
      - "DELETE /cpt-line-items/{id}"
      - "GET endpoints"

  - name: Pharmacist
    description: "Dispenses prescriptions; segregation-of-duties prevents same provider from dispensing what they signed"
    identity: "opaque"
    exclusive_operations:
      - "POST /prescriptions/{id}/dispense"
    shared_operations:
      - "GET /prescriptions/{id}"

  - name: ClinicAdmin
    description: "Platform administrator — onboard providers, run HEDIS recompute, view audit"
    identity: "opaque"
    exclusive_operations:
      - "POST /providers"
      - "POST /cpt-codes"
      - "POST /hedis/recompute"
      - "POST /patients/{id}/unbind-pcp"
      - "GET /audit-logs"
    shared_operations:
      - "POST /patients"
      - "POST /patients/{id}/bind-pcp"
      - "PATCH /patients/{id}"
      - "GET endpoints"

  - name: TestHarness
    description: "Pseudo-role used only by the test harness to drive deterministic time and sweeps. Never used by production clients."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations: []
