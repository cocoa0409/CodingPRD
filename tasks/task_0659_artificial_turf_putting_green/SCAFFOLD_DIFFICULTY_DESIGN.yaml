              payload: { sku: "I-ZEO", name: "Zeolite", material: "ZEOLITE", price_per_sqft_cents: 150, coverage_lbs_per_sqft: 2, antimicrobial: true }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "9 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
