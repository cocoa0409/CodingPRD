          assert:
            - "${e_fac} == ERR_FACILITY_NOT_FOUND with HTTP 404"
            - "${e_item} == ERR_CHARGE_ITEM_NOT_FOUND and ${e_item_w} == ERR_CHARGE_ITEM_NOT_FOUND, both HTTP 404"
            - "${e_cr} == ERR_CHANGE_REQUEST_NOT_FOUND and ${e_cr_w} == ERR_CHANGE_REQUEST_NOT_FOUND, both HTTP 404"
            - "${e_cycle} == ERR_CODE_UPDATE_NOT_FOUND and ${e_cycle_w} == ERR_CODE_UPDATE_NOT_FOUND"
            - "${e_entry} == ERR_CODE_UPDATE_NOT_FOUND and ${e_entry_w} == ERR_CODE_UPDATE_NOT_FOUND (cycles and entries share one code)"
            - "${e_batch} == ERR_CAPTURE_RESOURCE_NOT_FOUND and ${e_finding} == ERR_CAPTURE_RESOURCE_NOT_FOUND and ${e_line} == ERR_CAPTURE_RESOURCE_NOT_FOUND"
            - "${e_file} == ERR_GOVERNANCE_RESOURCE_NOT_FOUND, ${e_an} == ERR_GOVERNANCE_RESOURCE_NOT_FOUND, ${e_rule} == ERR_GOVERNANCE_RESOURCE_NOT_FOUND, ${e_ct} == ERR_GOVERNANCE_RESOURCE_NOT_FOUND, ${e_dept} == ERR_GOVERNANCE_RESOURCE_NOT_FOUND"
            - "every response body carries both error_id and message"
            - "Facility.${fac}.version == 1 (no write attempt mutated anything)"
            - "GET /chargemaster/charge-items with facility_id == ${fac} returns total_count 0"

      - name: item_creation_with_a_past_effective_date_is_rejected_before_the_duplicate_cdm_check
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EFFECTIVE_DATE_IN_PAST]
          - errors[ERR_DUPLICATE_CDM_NUMBER]
          - validations[priority=32]
          - validations[priority=39]
        distinguishing_aspect: "Two creation guards on the same payload with a 7-rank gap: effective_from is compared against the LOGICAL clock (so the same literal that was legal yesterday is illegal today, and effective_from == now is still legal), while cdm_number uniqueness is scoped to the facility — the identical CDM number is accepted in a second facility."
        test_recipe:
          setup:
