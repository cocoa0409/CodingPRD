          - errors.ERR_TEE_SLOT_FULL
        distinguishing_aspect: |
          Priority 42 (marker safety) versus priority 71 (tee-sheet capacity), a 29-step gap where
          both rules read the SAME two request fields. The tournament's tee_group_size is 1 and one
          round already occupies the 13:00 slot for round_number 1, so the slot is full; the request
