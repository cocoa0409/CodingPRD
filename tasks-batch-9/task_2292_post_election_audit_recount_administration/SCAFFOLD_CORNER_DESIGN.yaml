      - name: partial_recount_scope_must_name_batches_of_its_own_contest
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/recounts
          - errors[ERR_BATCH_NOT_IN_CONTEST]
          - calculations.recount_deposit_assessment
        distinguishing_aspect: |
          scope_batch_ids is checked against the recounted contest, not merely against BallotBatch
          existence: a batch of sibling contest C2 in the same election is refused 422, and two batches of C1
          are accepted and priced at 50000 + 2000 x 40 = 130000 cents.
        test_recipe:
          setup:
            - "Election ST-01 with contest C1 (6000 ballots, batches B-001..B-006) canvassed 3150 / 2850 so"
            - "margin_pct is 5.0000, plus sibling contest C2 (2000 ballots, batches B-101 and B-102)"
