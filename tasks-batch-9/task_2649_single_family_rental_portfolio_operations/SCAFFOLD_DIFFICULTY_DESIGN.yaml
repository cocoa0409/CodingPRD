      - name: lease_void_returns_home_occupancy_to_vacant_for_reuse
        grounds:
          - state_machines.Lease.DRAFT_to_VOIDED
          - validations[priority=310]
          - errors.ERR_LEASE_ALREADY_EXISTS
          - entities.Home.fields.occupancy_status
          - calculations.screening_decision
        distinguishing_aspect: |
          Voiding a DRAFT lease must undo the reservation it never consumed: Home.occupancy_status
          returns RESERVED -> VACANT so a second applicant can be screened, and V310 must treat the
          VOIDED lease as absent - an implementation that counts any lease row rejects the second
          lease with ERR_LEASE_ALREADY_EXISTS.
        test_recipe:
          setup:
            - "Chain S has driven Home H1 to STABILIZED / VACANT with leasing_posture OPEN."
            - "Verified prospect P1 (income 560000, tier B, 1 pet) screened CONDITIONAL_APPROVED, moving the home to RESERVED, and lease L1 is DRAFT."
            - "Verified prospect P4 (income 800000, tier A, 0 evictions, 0 pets, fraud 360) is waiting with no application yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
