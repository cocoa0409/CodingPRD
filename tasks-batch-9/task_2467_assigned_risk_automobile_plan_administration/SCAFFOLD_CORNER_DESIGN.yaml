      - name: the_auth_tiers_outrank_scope_which_outranks_state
        claim_type: priority_ordering
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_CARRIER_SCOPE_FORBIDDEN]
          - errors[ERR_ACCEPTANCE_WINDOW_EXPIRED]
          - validations[priority=2]
          - validations[priority=5][error_id=ERR_CARRIER_SCOPE_FORBIDDEN]
        distinguishing_aspect: |
          One request can violate three tiers at once, and the answer must always be the lowest
          priority number. Beacon accepting Atlas's assignment is out of scope (5) AND past the
          acceptance deadline (8) - it gets the scope error. A carrier calling the administrator's
          rescission endpoint is out of role (2) AND out of scope (5) - it gets the role error, and
          the row is never even looked at.
