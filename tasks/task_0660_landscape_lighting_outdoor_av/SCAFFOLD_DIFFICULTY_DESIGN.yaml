            - call: "POST /quotes/${q_i9b}/lines"
              payload: { model_code: "SPOT-80", quantity: 1, unit_price_cents: 9000 }
              as: LightingDesigner
            - call: "POST /quotes/${q_i9b}/send"
              payload: {}
              as: LightingDesigner
