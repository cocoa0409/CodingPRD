scaffold_corner_design:

  # =========================================================================
  # Entities (§1.1) — creation, defaults, computed/system fields, FK integrity
  # =========================================================================
  - section: entities
    instances:

      - name: speaker_creation_returns_roster_defaults_and_derived_counters
        claim_type: creation
        grounds:
          - entities.Speaker
          - endpoints[POST /speakers]
        distinguishing_aspect: |
          A brand-new roster entry must come back with every derived field seeded, not absent:
          roster_status ACTIVE, roster_tier BRONZE, default_commission_pct 0.25 from
          TIER_COMMISSION_PCT[BRONZE], all five counters 0 and both scores null.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id, tier: $.data.roster_tier, pct: $.data.default_commission_pct }
          assert:
            - "201 with roster_status ACTIVE, roster_tier BRONZE and default_commission_pct 0.25"
            - "engagements_delivered_count, lifetime_gross_fees_cents, held_days_count, pending_remittance_cents and feedback_count are all 0"
            - "rolling_score and lifetime_score are both null"
            - "id is a bare UUID with no type prefix, version == 1, and created_at == updated_at"

      - name: speaker_optional_inputs_omitted_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Speaker.fields.travel_buffer_days
          - entities.Speaker.fields.tax_form_status
        distinguishing_aspect: |
          Omitting the two optional inputs must yield travel_buffer_days 1 and tax_form_status
          MISSING — the tax default is deliberately the blocking value, so a server that
          defaults it to ON_FILE would silently unblock payouts.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /speakers"
              payload: { full_name: "Noor Haddad", topics: ["LEADERSHIP"], fee_floor_cents: 800000, fee_ceiling_cents: 1500000, travel_class: "ECONOMY" }
              as: BureauAdmin
              captures: { sp: $.data.id, buf: $.data.travel_buffer_days, tax: $.data.tax_form_status }
          assert:
            - "travel_buffer_days == 1 and tax_form_status == MISSING"
            - "a subsequent GET /speakers/${sp} returns the same two defaults"

      - name: speaker_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /speakers]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The list envelope must report limit, offset, total_count and has_more computed against
          the FULL filtered set, not the returned page: with three speakers and limit 2 the first
          page has has_more true and total_count 3, and the second page has_more false.
        test_recipe:
          setup:
            - "Three roster speakers exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp1: $.data.id }
            - call: "POST /speakers"
              payload: { full_name: "Rafael Cho", topics: ["AI_STRATEGY"], fee_floor_cents: 900000, fee_ceiling_cents: 1800000, travel_class: "ECONOMY", tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp2: $.data.id }
            - call: "POST /speakers"
              payload: { full_name: "Noor Haddad", topics: ["LEADERSHIP"], fee_floor_cents: 800000, fee_ceiling_cents: 1500000, travel_class: "ECONOMY" }
              as: BureauAdmin
              captures: { sp3: $.data.id }
          trigger:
            - call: "GET /speakers?limit=2&offset=0"
              payload: {}
              as: BureauAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /speakers?limit=2&offset=2"
              payload: {}
              as: BureauAdmin
            - call: "GET /speakers?topic=LEADERSHIP"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
          assert:
            - "page one returns 2 rows with total_count 3, limit 2, offset 0 and has_more true"
            - "page two returns 1 row with total_count 3, offset 2 and has_more false"
            - "the topic=LEADERSHIP filter returns exactly 2 rows (Dana and Noor) with total_count 2 and has_more false"
            - "response_type is array on all three reads and meta carries api_request_id and api_request_timestamp"

      - name: speaker_retrieval_returns_the_stored_record_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /speakers/{speakerId}]
        distinguishing_aspect: |
          A read-only GET must not mutate: version and updated_at are identical before and after
          two consecutive reads, and every input field round-trips exactly as posted.
        test_recipe:
          setup:
            - "One roster speaker exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id, v0: $.data.version }
          trigger:
            - call: "GET /speakers/${sp}"
              payload: {}
              as: Speaker
              as_user_id: "${sp}"
              captures: { name: $.data.full_name, v1: $.data.version }
            - call: "GET /speakers/${sp}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { v2: $.data.version }
          assert:
            - "both reads return full_name Dana Reyes, topics [AI_STRATEGY, LEADERSHIP], fee_floor_cents 1000000, fee_ceiling_cents 2000000, travel_class PREMIUM"
            - "version stays 1 across both reads and updated_at is unchanged — GET has no side effects"
            - "response_type is object and data is a single entity, not an array"

      - name: speaker_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SPEAKER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID must produce 404 ERR_SPEAKER_NOT_FOUND from the
          priority-3 existence check, not a 200 with null data and not a 500.
        test_recipe:
          setup:
            - "One unrelated speaker exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
          trigger:
            - call: "GET /speakers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BureauAdmin
              captures: { err: $.data.error_id }
          assert:
            - "404 with response_type error and data.error_id == ERR_SPEAKER_NOT_FOUND"
            - "the existing speaker is untouched: GET /speakers?limit=10 still returns total_count 1"

      - name: client_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Client.fields.industry_code
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          industry_code has source input with no default and is the exclusivity dimension, so it
          cannot be inferred; omitting it must fail at priority 4 with 422 ERR_INVALID_REQUEST
          rather than storing a null industry that would later make every grant unmatchable.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { err: $.data.error_id }
          assert:
            - "422 with data.error_id == ERR_INVALID_REQUEST"
            - "no Client row is created: GET /clients?limit=10 returns total_count 0"

      - name: inquiry_invalid_enum_and_bad_event_window_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.Inquiry.fields.required_topic
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_EVENT_WINDOW_INVALID]
        distinguishing_aspect: |
          Two different type-level guards on the same endpoint at two different priorities: an
          off-taxonomy topic code fails the priority-4 body-shape check with ERR_INVALID_REQUEST,
          while a well-formed body whose event_end_utc is not after event_start_utc fails the
          priority-5 window check with ERR_EVENT_WINDOW_INVALID.
        test_recipe:
          setup:
            - "One client exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "UNDERWATER_BASKETRY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { err1: $.data.error_id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T18:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { err2: $.data.error_id }
          assert:
            - "the off-taxonomy required_topic returns 422 ERR_INVALID_REQUEST"
            - "the zero-length event window returns 422 ERR_EVENT_WINDOW_INVALID"
            - "neither request creates a row: GET /inquiries?client_id=${cl} returns total_count 0"

      - name: feedback_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.Feedback
          - errors[ERR_FEEDBACK_ALREADY_SUBMITTED]
          - validations[priority=11]
        distinguishing_aspect: |
          Feedback is the scaffold's only common_fields:false entity: it exposes id and created_at
          but no updated_at and no version, there is no update endpoint, and a second filing on
          the same engagement is refused rather than overwriting the first score.
        test_recipe:
          setup:
            - "One DELIVERED engagement with one Feedback row already filed (content 5, logistics 4)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
            - call: "POST /proposal-options"
              payload: { proposal_id: "${pr}", speaker_id: "${sp}", quoted_fee_cents: 1275000, rank_no: 1, travel_allowance_cents: 0 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { opt: $.data.id }
            - call: "POST /proposals/${pr}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /proposals/${pr}/select"
              payload: { option_id: "${opt}" }
              as: Client
              as_user_id: "${cl}"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/confirm"
              payload: {}
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /engagements/${eng}/contracts"
              payload: { cancellation_schedule_code: "STANDARD", travel_policy_code: "POLICY_B", recording_rights: "NONE", technical_rider_code: "STANDARD_AV", exclusivity_days: 0 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/send"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "Dana Reyes" }
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "M. Okafor" }
              as: Client
              as_user_id: "${cl}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T20:00:00Z" }
              as: BureauAdmin
            - call: "POST /engagements/${eng}/deliver"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /engagements/${eng}/feedback"
              payload: { content_score: 5, logistics_score: 4, rebook_intent: true, comment: "excellent" }
              as: Client
              as_user_id: "${cl}"
              captures: { fb: $.data.id, comp: $.data.composite_score }
          trigger:
            - call: "POST /engagements/${eng}/feedback"
              payload: { content_score: 1, logistics_score: 1, rebook_intent: false, comment: "changed my mind" }
              as: Client
              as_user_id: "${cl}"
              captures: { err: $.data.error_id }
            - call: "GET /feedback/${fb}"
              payload: {}
              as: BureauAdmin
              captures: { comp2: $.data.composite_score }
          assert:
            - "the second filing returns 409 ERR_FEEDBACK_ALREADY_SUBMITTED"
            - "GET /feedback/${fb} still shows content_score 5, logistics_score 4 and composite_score 4.60"
            - "the Feedback payload has id and created_at but no version and no updated_at field"
            - "speaker.feedback_count is still 1 and speaker.rolling_score is still 4.60 — the refused filing did not re-score"

      - name: proposal_options_count_is_server_computed_from_children
        claim_type: computed_fields
        grounds:
          - entities.Proposal.fields.options_count
          - endpoints[POST /proposal-options]
        distinguishing_aspect: |
          options_count is source computed: it must track the number of child options actually
          created (and bump the parent version each time), not any client-supplied number.
        test_recipe:
          setup:
            - "A DRAFT proposal on a QUALIFIED inquiry with zero options"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
          trigger:
            - call: "GET /proposals/${pr}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { c0: $.data.options_count, pv0: $.data.version }
            - call: "POST /proposal-options"
              payload: { proposal_id: "${pr}", speaker_id: "${sp}", quoted_fee_cents: 1275000, rank_no: 1, travel_allowance_cents: 0 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { o1: $.data.id }
            - call: "GET /proposals/${pr}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { c1: $.data.options_count, pv1: $.data.version }
          assert:
            - "options_count is 0 on the fresh DRAFT proposal and 1 after the child option is created"
            - "the proposal's version increments by exactly 1 per child option created"
            - "the created option starts in status OFFERED with travel_allowance_cents 0"

      - name: proposal_system_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Proposal.fields.created_by_agent_user_id
          - entities.Proposal.fields.round_no
          - entities.Proposal.fields.status
        distinguishing_aspect: |
          Every system-sourced field on a new Proposal comes from the server: status DRAFT,
          round_no 1, revision_count 0, presented_at_utc null and created_by_agent_user_id taken
          from the caller's X-User-ID header rather than from the body.
        test_recipe:
          setup:
            - "A QUALIFIED inquiry owned by agent-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
          trigger:
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id, st: $.data.status, rn: $.data.round_no }
          assert:
            - "201 with status DRAFT, round_no 1, revision_count 0, options_count 0 and presented_at_utc null"
            - "created_by_agent_user_id == agent-01, taken from the X-User-ID header"
            - "version == 1 and id is a bare UUID with no type prefix"
            - "the parent inquiry's version incremented by 1 as declared by the OCC rule proposal-create-stale-inquiry"

      - name: proposal_option_with_unknown_proposal_parent_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ProposalOption.parent
          - errors[ERR_PROPOSAL_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          ProposalOption's parent lives in the body, not the path, so it is the priority-6 body-FK
          check that must reject an unknown proposal_id with 404 ERR_PROPOSAL_NOT_FOUND — before
          any state or fiscal reasoning about the quote.
        test_recipe:
          setup:
            - "A real speaker and a real DRAFT proposal exist, but the request names a different, non-existent proposal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /proposal-options"
