            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r7_id}", depot_id: "${d7b}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 6000, moisture_pct: 2.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
