      - name: cost_share_ledger_conserved_across_funding_and_cancellation
        conserved_quantity: "the tenant receivable ledger (Tenant.outstanding_balance_cents for every beneficiary) together with ModificationProject.allocated_cents"
        forward_action: "the final POST /tower-colo/cost-shares/{id}/accept that funds the project and bills every share"
        compensating_action: "POST /tower-colo/modification-projects/{id}/cancel from FUNDED"
        grounds:
          - state_machines.ModificationProject.FUNDED_to_CANCELLED
          - state_machines.CostShare.BILLED_to_VOIDED
          - calculations.modification_cost_share_allocation
          - calculations.tenant_credit_status
        distinguishing_aspect: |
          A different conserved quantity — a MONETARY ledger split across two tenants by a floor
          allocation with a single remainder cent — and a different compensation mechanism. The
          reversal must undo 9320766 and 12743234 exactly (the remainder cent included), zero
          allocated_cents, and unwind every downstream consequence: both credit statuses, both
          master-lease privileges, the tower freeze and the held application. Any drift in the
          remainder assignment leaves a non-zero balance behind.
