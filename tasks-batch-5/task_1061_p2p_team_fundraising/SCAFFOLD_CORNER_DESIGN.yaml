              captures: { org_b_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_a_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_a_id}"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"
            - "Campaign.${camp_id}.status == DRAFT"

      - name: same_reviewer_cannot_approve_payout_they_reviewed
        claim_type: segregation_of_duties
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.Payout.fields.reviewed_by_user_id"]
        distinguishing_aspect: "fr-reviewer-1 moved the payout into UNDER_REVIEW, so the same X-User-ID approving returns 403 ERR_SEGREGATION_OF_DUTIES while fr-reviewer-2 succeeds."
        test_recipe:
          setup: ["PUBLISHED campaign with one SETTLED 100000-cent gift and a 50000-cent payout in UNDER_REVIEW, reviewed by fr-reviewer-1."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
            - call: "POST /api/campaigns/${camp_id}/payouts"
              payload: { amount_cents: 50000, expected_campaign_version: "${camp_v}", note: "tranche" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { payout_id: $.data.id }
            - call: "POST /api/payouts/${payout_id}/review"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-1"
          trigger:
            - call: "POST /api/payouts/${payout_id}/approve"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/payouts/${payout_id}/approve"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-2"
          assert:
            - "first approve returns HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Payout.${payout_id}.status after the first approve == UNDER_REVIEW"
            - "Payout.${payout_id}.status after the second approve == APPROVED"
            - "Payout.${payout_id}.approved_by_user_id == fr-reviewer-2"
            - "Payout.${payout_id}.reviewed_by_user_id == fr-reviewer-1"

  - section: cross_cutting_layers
    instances:
      - name: stale_expected_campaign_version_on_payout_create_returns_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payout-create-stale-campaign]", "errors[ERR_STALE_CAMPAIGN_VERSION]", "validations[priority=16]"]
        distinguishing_aspect: "A payout create carrying the campaign version observed one mutation earlier (${camp_v} - 1) returns 412 ERR_STALE_CAMPAIGN_VERSION and creates no Payout row."
        test_recipe:
          setup: ["PUBLISHED campaign with one SETTLED 100000-cent gift; the client holds a campaign version that is one behind the current one."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /api/campaigns/${camp_id}/payouts"
              payload: { amount_cents: 50000, expected_campaign_version: "${camp_v} - 1", note: "stale view" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_CAMPAIGN_VERSION"
            - "GET /api/payouts?campaign_id=${camp_id} total_count == 0"
            - "Campaign.${camp_id}.version is unchanged by the rejected call"

      - name: second_payout_create_supersedes_open_request_and_bumps_version
        claim_type: cascading_side_effects
        grounds: ["state_machines.Payout.REQUESTED_to_SUPERSEDED", "concurrency_rules[payout-create-stale-campaign]", "calculations.campaign_available_balance"]
        distinguishing_aspect: "A second payout create with the refreshed version supersedes the first REQUESTED payout, releasing its 50000-cent reservation so reserved_payout_cents ends at 20000, not 70000."
        test_recipe:
          setup: ["PUBLISHED campaign with one SETTLED 100000-cent gift (lifetime_net_cents 92070) and one REQUESTED payout of 50000 cents."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /api/campaigns/${camp_id}/payouts"
              payload: { amount_cents: 50000, expected_campaign_version: "${camp_v1}", note: "first" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { payout_1_id: $.data.id }
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_v2: $.data.version }
          trigger:
            - call: "POST /api/campaigns/${camp_id}/payouts"
              payload: { amount_cents: 20000, expected_campaign_version: "${camp_v2}", note: "replacement" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { payout_2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Payout.${payout_1_id}.status == SUPERSEDED"
            - "Payout.${payout_2_id}.status == REQUESTED with amount_cents == 20000"
            - "Campaign.${camp_id}.reserved_payout_cents == 20000"
            - "Campaign.${camp_id}.available_balance_cents == 72070"
            - "Campaign.${camp_id}.version == ${camp_v2} + 1"

  - section: consistency_model
    instances:
      - name: settle_response_immediately_reflects_credit_and_receipt
        claim_type: immediate
        grounds: ["calculations.participant_credit", "calculations.receipt_issue", "entities.Campaign.fields.raised_credited_cents"]
        distinguishing_aspect: "The consistency model is immediate: the very next read after settle already shows Participant.credited_cents 15000, Campaign.raised_credited_cents 15000 and one ISSUED receipt — no lag, no re-read."
        test_recipe:
          setup: ["PUBLISHED campaign with a 5000-cent pool (ratio 0.5, cap 5000) and one ACTIVE participant with a PENDING 10000-cent PARTICIPANT-designated gift."]
