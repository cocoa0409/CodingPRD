scaffold_corner_design:

  # =================================================================
  # SECTION: entities
  # =================================================================
  - section: entities
    instances:
      - name: create_foia_request_returns_201_and_defaults
        claim_type: Creation
        grounds:
          - entities.FoiaRequest.fields.status
          - entities.FoiaRequest.fields.expedited
        distinguishing_aspect: "POST /requests with required fields returns 201, status SUBMITTED, expedited default false, deadline_status RUNNING-default, version 1."
        test_recipe:
          setup: ["A registered requester exists."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off Crt", badge_id: "CB-1" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit", email: "cit1@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
          trigger:
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "docs", received_at: "2026-01-05T00:00:00.000Z" }
              as: Requester
              as_user_id: "${ru_id}"
              captures: { r_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "FoiaRequest(r_id).status == SUBMITTED"
            - "FoiaRequest(r_id).expedited == false"
            - "FoiaRequest(r_id).version == 1"

      - name: get_request_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.FoiaRequest.fields.status]
        distinguishing_aspect: "GET /requests/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["No request with the given id exists."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off NF", badge_id: "CB-2" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
          trigger:
            - call: "GET /requests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_request_missing_subject_description_returns_422
        claim_type: Required Fields
        grounds: [entities.FoiaRequest.fields.subject_description, "validations[priority=6]"]
        distinguishing_aspect: "POST /requests omitting subject_description returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A requester exists."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off RF", badge_id: "CB-3" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit2", email: "cit2@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
          trigger:
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", received_at: "2026-01-05T00:00:00.000Z" }
              as: Requester
              as_user_id: "${ru_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_request_unknown_requester_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.FoiaRequest.fields.requester_id, "validations[priority=5]"]
        distinguishing_aspect: "POST /requests with a requester_id that does not exist returns 404 ERR_FK_NOT_FOUND."
        test_recipe:
          setup: ["No requester with the given id."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off FK", badge_id: "CB-4" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /requests"
              payload: { requester_id: "11111111-1111-4111-8111-111111111111", subject_description: "x", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: requester_outstanding_balance_computed_field
        claim_type: Computed Fields
        grounds:
          - entities.Requester.fields.outstanding_balance_cents
          - calculations.outstanding_balance_recompute
        distinguishing_aspect: "After a single DUE fee of 500 cents on a NEWS_MEDIA request (150 pages, 50 chargeable), GET /requesters/{id}.outstanding_balance_cents == 500."
        test_recipe:
          setup: ["A NEWS_MEDIA requester with one PROCESSING request, fee assessed at 500 (DUE, sub-threshold)."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off CF", badge_id: "CB-5" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Press", email: "press@x.com", declared_category: "NEWS_MEDIA" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "150 page set", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "NEWS_MEDIA" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
            - call: "POST /requests/${r_id}/fee-estimate"
              payload: { search_hours: 0, review_hours: 0, billable_pages: 150, expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
          trigger:
            - call: "GET /requesters/${ru_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "Requester(ru_id).outstanding_balance_cents == 500"

      - name: list_requests_pagination_envelope
        claim_type: Listing
        grounds: [entities.FoiaRequest.fields.status]
        distinguishing_aspect: "GET /requests returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["At least one request exists."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off LS", badge_id: "CB-6" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit3", email: "cit3@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
          trigger:
            - call: "GET /requests"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
          assert:
            - "response_type == array"
            - "meta + pagination total_count >= 1; has_more is boolean"

  # =================================================================
  # SECTION: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: perfect_from_submitted_starts_clock
        claim_type: Valid Transition
        grounds:
          - state_machines.FoiaRequest.SUBMITTED_to_PERFECTED
          - entities.ProcessingDeadline.fields.base_due_at
        distinguishing_aspect: "POST /requests/{id}/perfect moves SUBMITTED->PERFECTED, creates ProcessingDeadline with base_due_at = received_at + 20 working days = 2026-02-02 (received Mon 2026-01-05)."
        test_recipe:
          setup: ["A SUBMITTED request received 2026-01-05 (Monday)."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off VT", badge_id: "CB-7" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit4", email: "cit4@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { st: $.data.status }
            - call: "GET /requests/${r_id}/deadline"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
          assert:
            - "FoiaRequest(r_id).status == PERFECTED"
            - "ProcessingDeadline(r_id).base_due_at date == 2026-02-02"
            - "FoiaRequest(r_id).deadline_status == RUNNING"

      - name: assign_from_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.FoiaRequest.PERFECTED_to_PROCESSING, "validations[priority=7]"]
        distinguishing_aspect: "POST /requests/{id}/assign on a SUBMITTED (not PERFECTED) request returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SUBMITTED request, not yet perfected."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off IS", badge_id: "CB-8" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit5", email: "cit5@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: extend_twice_rejected
        claim_type: Idempotency
        grounds: [state_machines.FoiaRequest.PROCESSING_to_PROCESSING, "validations[priority=13]"]
        distinguishing_aspect: "A second POST /requests/{id}/extend after the first 10-day extension returns 409 ERR_EXTENSION_ALREADY_USED."
        test_recipe:
          setup: ["A PROCESSING request that has already taken one extension."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off EX", badge_id: "CB-9" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit6", email: "cit6@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/extend"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /requests/${r_id}/extend"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_EXTENSION_ALREADY_USED"

      - name: extend_adds_ten_working_days
        claim_type: Side Effect Execution
        grounds: [state_machines.FoiaRequest.PROCESSING_to_PROCESSING, entities.ProcessingDeadline.fields.effective_due_at]
        distinguishing_aspect: "POST /requests/{id}/extend sets extension_days_added=10 and effective_due_at = base_due_at + 10 working days = 2026-02-16; deadline_status EXTENDED."
        test_recipe:
          setup: ["A PROCESSING request received 2026-01-05 (base_due 2026-02-02)."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off SE", badge_id: "CB-10" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit7", email: "cit7@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /requests/${r_id}/extend"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}/deadline"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
          assert:
            - "ProcessingDeadline(r_id).extension_days_added == 10"
            - "ProcessingDeadline(r_id).effective_due_at date == 2026-02-16"
            - "FoiaRequest(r_id).deadline_status == EXTENDED"

      - name: glomar_requires_authorized_officer
        claim_type: Precondition Enforcement
        grounds: [state_machines.FoiaRequest.PROCESSING_to_GLOMAR_INVOKED, "validations[priority=8]"]
        distinguishing_aspect: "POST /requests/{id}/glomar by an officer with can_invoke_glomar=false returns 403 ERR_GLOMAR_NOT_AUTHORIZED."
        test_recipe:
          setup: ["A PROCESSING request with zero records and one REQUEST-level B1 exemption; the acting officer is NOT cleared for glomar."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off Clear", badge_id: "CB-11", can_invoke_glomar: true }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_clear: $.data.id }
            - call: "POST /officers"
              payload: { full_name: "Off NoGlo", badge_id: "CB-12", can_invoke_glomar: false }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_noglo: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit8", email: "cit8@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_clear}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "sensitive", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_clear}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_clear}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_clear}"
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "REQUEST", exemption_code: "B1", justification: "national security" }
              as: FoiaOfficer
              as_user_id: "${off_clear}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_clear}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/glomar"
              payload: { expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_noglo}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_GLOMAR_NOT_AUTHORIZED"

      - name: glomar_with_records_logged_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.FoiaRequest.PROCESSING_to_GLOMAR_INVOKED, "validations[priority=9]"]
        distinguishing_aspect: "POST /requests/{id}/glomar when >=1 ResponsiveRecord exists returns 409 ERR_GLOMAR_PRECONDITION (existence cannot be neither-confirmed-nor-denied once records are logged)."
        test_recipe:
          setup: ["A PROCESSING request with one logged record and one REQUEST-level B7 exemption; officer cleared for glomar."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off GP", badge_id: "CB-13", can_invoke_glomar: true }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit9", email: "cit9@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "sensitive", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "doc", page_count: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "REQUEST", exemption_code: "B7", justification: "law enforcement existence" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/glomar"
              payload: { expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_GLOMAR_PRECONDITION"

      - name: glomar_happy_path_sets_basis
        claim_type: Valid Transition
        grounds: [state_machines.FoiaRequest.PROCESSING_to_GLOMAR_INVOKED, entities.FoiaRequest.fields.glomar_exemption_basis]
        distinguishing_aspect: "A cleared officer, zero records, one REQUEST-level B1 exemption: glomar moves PROCESSING->GLOMAR_INVOKED and sets glomar_exemption_basis=B1."
        test_recipe:
          setup: ["A PROCESSING request, zero records, one REQUEST-level B1 exemption, cleared officer."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off GH", badge_id: "CB-14", can_invoke_glomar: true }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit10", email: "cit10@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "sensitive", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "REQUEST", exemption_code: "B1", justification: "classified" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/glomar"
              payload: { expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { basis: $.data.glomar_exemption_basis, st: $.data.status }
          assert:
            - "FoiaRequest(r_id).status == GLOMAR_INVOKED"
            - "FoiaRequest(r_id).glomar_exemption_basis == B1"

      - name: withdraw_from_processing_terminal
        claim_type: Valid Transition
        grounds: [state_machines.FoiaRequest.SUBMITTED_to_WITHDRAWN]
        distinguishing_aspect: "POST /requests/{id}/withdraw from PROCESSING moves to WITHDRAWN (terminal) and sets deadline_status MET."
        test_recipe:
          setup: ["A PROCESSING request owned by the requester."]
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Off WD", badge_id: "CB-15" }
              as: FoiaOfficer
              as_user_id: "boot"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Cit11", email: "cit11@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { ru_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${ru_id}", subject_description: "doc", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
