# =============================================================================
# SCAFFOLD — Retail Shopper Data Science & Supplier Insights Subscription
# =============================================================================

scenario: |
  Retail Shopper Data Science & Supplier Insights Subscription (84.51°): loyalty-card-linked
  household transaction panel with privacy-safe aggregation, supplier subscription tiers granting
  category, brand and competitor-blind reporting, audience segment construction for targeted
  coupon and retail-media activation, measurement of promotion incrementality against matched
  control households, data clean-room access controls with query auditing and minimum-cell-size
  suppression, category review deliverables timed to retailer line reviews, new-item forecast
  modeling using analog products, contractual restrictions on redistribution and modeled-data
  derivation. Generate task much harder than expert level.

domain_name: retail-shopper-insights
api_prefix: /shopper-insights

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - bulk_operations
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SupplierAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Supplier organization name" }
      - { name: region, type: string, source: input, description: "Primary operating region code" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OFFBOARDED; always ACTIVE in this benchmark", constraints: "ACTIVE | OFFBOARDED" }

  - name: SubscriptionContract
    parent: SupplierAccount
    common_fields: true
    fields:
      - { name: supplier_account_id, type: string, source: system, description: "FK -> SupplierAccount.id; owning supplier account" }
      - { name: tier, type: enum, source: input, description: "TIER_CATEGORY | TIER_BRAND | TIER_PORTFOLIO; gates report_type access", constraints: "TIER_CATEGORY | TIER_BRAND | TIER_PORTFOLIO" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: report_credit_allowance, type: integer, source: input, description: "Total report credits purchasable in the current period" }
      - { name: report_credits_reserved, type: integer, source: computed, default: 0, description: "Credits reserved by InsightReports in REQUESTED state" }
      - { name: report_credits_consumed, type: integer, source: computed, default: 0, description: "Credits finalized by generated READY reports" }
      - { name: report_credits_available, type: integer, source: computed, description: "Read-only = report_credit_allowance - report_credits_reserved - report_credits_consumed" }
      - { name: activation_budget_cents, type: integer, source: input, description: "Total budget for segment activation fees" }
      - { name: activation_budget_spent_cents, type: integer, source: computed, default: 0, description: "Sum of total_fee_cents of non-CANCELLED SegmentActivations" }
      - { name: compliance_score, type: integer, source: computed, default: 1000, description: "Starts 1000; MISSED deliverable -25, late submission -10; floor 0" }
      - { name: redistribution_allowed, type: boolean, source: input, description: "Contract clause: may reports be exported/redistributed" }
      - { name: modeled_derivation_allowed, type: boolean, source: input, description: "Contract clause: may modeled/derived data products be created and exported" }

  - name: CategoryScope
    parent: SubscriptionContract
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> SubscriptionContract.id; contract this scope belongs to" }
      - { name: category_code, type: string, source: input, description: "Retailer category code granted to the supplier" }
      - { name: brand_codes, type: array, source: input, description: "Supplier's own brand codes within the category (drives BRAND_OWN reports and competitor blinding)" }

  - name: PanelHousehold
    parent: null
    common_fields: false
    fields:
      - { name: household_ref, type: string, source: input, description: "Client-supplied label; NOT unique, never used for identity decisions" }
      - { name: region, type: string, source: input, default: "NA", description: "Household region code" }
      - { name: category_codes, type: array, source: input, default: [], description: "Categories the household transacts in" }
      - { name: recency_days, type: integer, source: input, default: 0, description: "Days since last loyalty-linked transaction" }
      - { name: frequency_12m, type: integer, source: input, default: 0, description: "Transaction count in trailing 12 months" }
      - { name: monetary_12m_cents, type: integer, source: input, default: 0, description: "Spend in trailing 12 months, cents" }
      - { name: exposed_brands, type: array, source: input, default: [], description: "Brand codes the household was exposed to via promotion/coupon" }
      - { name: brand_metrics, type: array, source: input, default: [], description: "Array of {brand_code, baseline_spend_cents, campaign_spend_cents} per brand" }

  - name: InsightReport
    parent: SubscriptionContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SubscriptionContract.id; sponsoring contract" }
      - { name: report_type, type: enum, source: input, description: "CATEGORY | BRAND_OWN | COMPETITOR_BLIND", constraints: "CATEGORY | BRAND_OWN | COMPETITOR_BLIND" }
      - { name: category_code, type: string, source: input, description: "Category reported on; must be in contract scope" }
      - { name: period_start, type: string, source: input, description: "ISO date, reporting window start (metadata; counting uses category membership)" }
      - { name: period_end, type: string, source: input, description: "ISO date, reporting window end" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | GENERATING | READY | SUPPRESSED | DELIVERED | CANCELLED", constraints: "REQUESTED | GENERATING | READY | SUPPRESSED | DELIVERED | CANCELLED" }
      - { name: credit_cost, type: integer, source: computed, description: "CATEGORY=1, BRAND_OWN=2, COMPETITOR_BLIND=3" }
      - { name: household_count, type: integer, source: computed, description: "Households whose category_codes contain category_code; null until generated" }
      - { name: own_brand_households, type: integer, source: computed, description: "Households with any brand_metrics entry whose brand_code is in scope brand_codes; null until generated" }
      - { name: other_supplier_aggregate_households, type: integer, source: computed, description: "COMPETITOR_BLIND only: households with no own-brand purchase; single blinded bucket" }
      - { name: redistribution_class, type: enum, source: computed, description: "CATEGORY->SHAREABLE_AGGREGATE, BRAND_OWN->INTERNAL_ONLY, COMPETITOR_BLIND->MODELED_DERIVED", constraints: "SHAREABLE_AGGREGATE | INTERNAL_ONLY | MODELED_DERIVED" }

  - name: AudienceSegment
    parent: SubscriptionContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SubscriptionContract.id; sponsoring contract" }
      - { name: segment_name, type: string, source: input, description: "Human label" }
      - { name: category_code, type: string, source: input, description: "Category criteria; must be in contract scope at create AND at activation" }
      - { name: min_frequency, type: integer, source: input, description: "Optional criteria: frequency_12m >= min_frequency", constraints: "optional" }
      - { name: min_monetary_cents, type: integer, source: input, description: "Optional criteria: monetary_12m_cents >= min_monetary_cents", constraints: "optional" }
      - { name: region, type: string, source: input, description: "Optional criteria: household region equality", constraints: "optional" }
      - { name: size, type: integer, source: computed, description: "Matched household count; computed at create, recomputed at submit" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED", constraints: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED" }

  - name: SegmentActivation
    parent: AudienceSegment
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: system, description: "FK -> AudienceSegment.id; activated segment" }
      - { name: channels, type: array, source: input, description: "Subset of [COUPON, RETAIL_MEDIA]; one fee line per channel" }
      - { name: channel_lines, type: array, source: computed, description: "Array of {channel, households_reached, line_fee_cents}; reach = floor(size * reach_rate)" }
      - { name: total_fee_cents, type: integer, source: computed, description: "Sum of per-line round_half_up fees (per-line-then-sum pinned)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | LAUNCHED | HALTED | COMPLETED | CANCELLED", constraints: "PENDING | LAUNCHED | HALTED | COMPLETED | CANCELLED" }
      - { name: launched_at, type: datetime, source: system, description: "Logical clock timestamp at launch; null until launched" }

  - name: IncrementalityStudy
    parent: null
    common_fields: true
    fields:
      - { name: brand_code, type: string, source: input, description: "Promoted brand measured" }
      - { name: category_code, type: string, source: input, description: "Category restricting treated/control pools" }
      - { name: window_start, type: string, source: input, description: "ISO date campaign window start" }
      - { name: window_end, type: string, source: input, description: "ISO date campaign window end; RUNNING -> ANALYSIS auto when clock >= window_end" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | RUNNING | ANALYSIS | IN_REVIEW | PUBLISHED", constraints: "DRAFT | RUNNING | ANALYSIS | IN_REVIEW | PUBLISHED" }
      - { name: matched_pairs, type: array, source: computed, description: "Array of {test_household_ref, control_household_ref}; computed at start via deterministic nearest-neighbor matching" }
      - { name: test_avg_spend_cents, type: number, source: computed, description: "Mean campaign_spend_cents over treated households" }
      - { name: control_avg_spend_cents, type: number, source: computed, description: "Mean campaign_spend_cents over matched controls" }
      - { name: provisional_lift_pct, type: number, source: computed, description: "(test_avg - control_avg)/control_avg*100; computed entering ANALYSIS" }
      - { name: final_lift_pct, type: number, source: computed, description: "Bias-corrected lift; computed entering ANALYSIS" }

  - name: CleanRoomGrant
    parent: SupplierAccount
    common_fields: true
    fields:
      - { name: supplier_account_id, type: string, source: input, description: "FK -> SupplierAccount.id; grantee account" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requesting SupplierAnalyst; segregation-of-duties anchor" }
      - { name: valid_from, type: datetime, source: input, description: "Access window start (half-open, inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Access window end (half-open, exclusive)" }
      - { name: query_budget_total, type: integer, source: input, description: "Total query credits granted" }
      - { name: query_budget_consumed, type: integer, source: computed, default: 0, description: "Sum of query_cost of EXECUTED queries" }
      - { name: query_budget_remaining, type: integer, source: computed, description: "Read-only = query_budget_total - query_budget_consumed" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | DENIED | REVOKED | EXPIRED", constraints: "REQUESTED | APPROVED | DENIED | REVOKED | EXPIRED" }
      - { name: denial_reason, type: string, source: input, description: "Recorded when denied", constraints: "optional" }

  - name: CleanRoomQuery
    parent: CleanRoomGrant
    common_fields: false
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> CleanRoomGrant.id; governing grant" }
      - { name: dataset_joins, type: array, source: input, description: "Dataset names joined; join breadth drives cost" }
      - { name: estimated_rows, type: integer, source: input, description: "Expected result rows; deterministic engine returns exactly this many" }
      - { name: query_cost, type: integer, source: computed, description: "Per clean_room_query_cost formula" }
      - { name: result_rows, type: integer, source: computed, description: "Simulated engine output row count == estimated_rows" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> EXECUTED | SUPPRESSED | REJECTED (synchronous)", constraints: "SUBMITTED | EXECUTED | SUPPRESSED | REJECTED" }

  - name: LineReviewCycle
    parent: null
    common_fields: true
    fields:
      - { name: category_code, type: string, source: input, description: "Category under line review" }
      - { name: window_start, type: string, source: input, description: "ISO date review window start (closed interval)" }
      - { name: window_end, type: string, source: input, description: "ISO date review window end (closed interval)" }
      - { name: open_at, type: datetime, source: computed, description: "window_start - 14 days; SCHEDULED -> OPEN auto when clock >= open_at" }
      - { name: planned_open_count, type: integer, source: computed, default: 0, description: "Count of ReviewDeliverables in PLANNED or SUBMITTED for this cycle" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OPEN | LOCKED | COMPLETED", constraints: "SCHEDULED | OPEN | LOCKED | COMPLETED" }

  - name: ReviewDeliverable
    parent: LineReviewCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> LineReviewCycle.id; governing cycle" }
      - { name: contract_id, type: string, source: input, description: "FK -> SubscriptionContract.id; funding contract (compliance penalties land here)" }
      - { name: insight_report_id, type: string, source: input, description: "FK -> InsightReport.id; backing report (cancellation cascades BLOCKED)" }
      - { name: due_at, type: datetime, source: input, description: "Submission deadline; must be < cycle window_start" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "True when submitted after due_at" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | SUBMITTED | ACCEPTED | REJECTED | BLOCKED | MISSED", constraints: "PLANNED | SUBMITTED | ACCEPTED | REJECTED | BLOCKED | MISSED" }

  - name: NewItemForecast
    parent: SubscriptionContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SubscriptionContract.id; sponsoring contract (needs modeled_derivation_allowed)" }
      - { name: product_ref, type: string, source: input, description: "New item identifier; publishing a new forecast for the same product_ref supersedes the old" }
      - { name: analogs, type: array, source: input, description: "Array of {analog_ref, similarity_score, observed_week4_units}" }
      - { name: variant, type: enum, source: input, description: "SIMPLE_AVERAGE | SIMILARITY_WEIGHTED; selects forecast_selected_units", constraints: "SIMPLE_AVERAGE | SIMILARITY_WEIGHTED" }
      - { name: forecast_simple_avg_units, type: number, source: computed, description: "Mean of analog observed_week4_units, 2dp round_half_up" }
      - { name: forecast_weighted_units, type: number, source: computed, description: "sum(similarity*units)/sum(similarity), 2dp round_half_up" }
      - { name: forecast_selected_units, type: number, source: computed, description: "Equals simple or weighted per variant" }
      - { name: status, type: enum, source: system, default: PUBLISHED, description: "PUBLISHED | SUPERSEDED", constraints: "PUBLISHED | SUPERSEDED" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: event_type, type: enum, source: system, description: "REPORT_EXPORTED | QUERY_EXECUTED | QUERY_SUPPRESSED | GRANT_APPROVED | GRANT_DENIED | GRANT_REVOKED | ACTIVATION_LAUNCHED", constraints: "see enum" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor (opaque or entity id)" }
      - { name: subject_type, type: string, source: system, description: "Entity type the event concerns" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject entity" }
      - { name: detail, type: string, source: system, description: "Free-form audit detail" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SubscriptionContract
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shopper-insights/subscription-contracts/{id}/suspend"
        actor: RetailerAdmin
        preconditions:
          - "Contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "status -> SUSPENDED; version += 1"
          - "Cascade B: every InsightReport of this contract in REQUESTED or GENERATING -> CANCELLED; its reserved credits refunded (report_credits_reserved -= credit_cost)"
          - "Cascade C: every ReviewDeliverable whose insight_report_id references a report cancelled by cascade B and whose status == PLANNED -> BLOCKED"
          - "Cascade D: for each deliverable blocked by cascade C, its LineReviewCycle.planned_open_count -= 1 (count tracks PLANNED + SUBMITTED only)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /shopper-insights/subscription-contracts/{id}/terminate"
        actor: RetailerAdmin
        preconditions:
          - "Contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects: ["status -> TERMINATED; version += 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /shopper-insights/subscription-contracts/{id}/terminate"
        actor: RetailerAdmin
        preconditions: []
        side_effects: ["status -> TERMINATED; version += 1"]

  - entity: InsightReport
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: GENERATING
        trigger: "POST /shopper-insights/insight-reports/{id}/generate"
        actor: SupplierAnalyst
        preconditions:
          - "Report status == REQUESTED (ERR_REPORT_NOT_GENERATABLE)"
          - "Contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "Compute household_count, own_brand_households, other_supplier_aggregate_households from PanelHousehold"
          - "If any reported cell < MIN_CELL_SIZE (20): status -> SUPPRESSED and reserved credit_cost refunded (report_credits_reserved -= credit_cost)"
          - "Else: status -> READY and credits finalized (report_credits_reserved -= credit_cost; report_credits_consumed += credit_cost)"
      - from: SUPPRESSED
        to: GENERATING
        trigger: "POST /shopper-insights/insight-reports/{id}/generate"
        actor: SupplierAnalyst
        preconditions:
          - "Report status == SUPPRESSED (ERR_REPORT_NOT_GENERATABLE otherwise)"
          - "Contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Contract report_credits_available >= credit_cost; credit re-reserved on entry (ERR_INSUFFICIENT_REPORT_CREDITS)"
        side_effects:
          - "Re-reserve credit_cost (report_credits_reserved += credit_cost)"
          - "Recompute cell counts; READY if all cells >= MIN_CELL_SIZE else SUPPRESSED again (with refund)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /shopper-insights/insight-reports/{id}/cancel"
        actor: SupplierAnalyst
        preconditions:
          - "Report status == REQUESTED (ERR_REPORT_NOT_CANCELLABLE)"
        side_effects:
          - "Refund reservation: report_credits_reserved -= credit_cost"
      - from: READY
        to: DELIVERED
        trigger: "POST /shopper-insights/insight-reports/{id}/export"
        actor: SupplierAnalyst
        preconditions:
          - "Report status == READY (ERR_INVALID_STATE)"
          - "Contract redistribution_allowed == true (ERR_REDISTRIBUTION_RESTRICTED)"
          - "If redistribution_class == MODELED_DERIVED: contract modeled_derivation_allowed == true (ERR_REDISTRIBUTION_RESTRICTED)"
        side_effects:
          - "status -> DELIVERED"
          - "Write AuditEvent REPORT_EXPORTED (subject = report id)"

  - entity: AudienceSegment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /shopper-insights/audience-segments/{id}/submit"
        actor: SupplierAnalyst
        preconditions:
          - "Segment status == DRAFT or REJECTED (ERR_SEGMENT_NOT_SUBMITTABLE)"
        side_effects:
          - "Recompute size from current PanelHousehold (derived-field reconciliation)"
          - "If size == 0: reject with ERR_SEGMENT_EMPTY (no transition)"
      - from: REJECTED
        to: PENDING_APPROVAL
        trigger: "POST /shopper-insights/audience-segments/{id}/submit"
        actor: SupplierAnalyst
        preconditions:
          - "Segment status == DRAFT or REJECTED (ERR_SEGMENT_NOT_SUBMITTABLE)"
        side_effects: ["Recompute size; ERR_SEGMENT_EMPTY if size == 0"]
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /shopper-insights/audience-segments/{id}/approve"
        actor: DataSteward
        preconditions:
          - "Segment status == PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "size >= MIN_SEGMENT_SIZE (25) (ERR_SEGMENT_BELOW_MINIMUM)"
        side_effects: ["status -> APPROVED; version += 1"]
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /shopper-insights/audience-segments/{id}/reject"
        actor: DataSteward
        preconditions:
          - "Segment status == PENDING_APPROVAL (ERR_INVALID_STATE)"
        side_effects: ["status -> REJECTED; version += 1"]

  - entity: SegmentActivation
    initial_state: PENDING
    terminal_states: [HALTED, COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: LAUNCHED
        trigger: "POST /shopper-insights/segment-activations/{id}/launch"
        actor: SupplierAnalyst
        preconditions:
          - "Activation status == PENDING (ERR_ACTIVATION_NOT_LAUNCHABLE)"
          - "Segment status == APPROVED (ERR_SEGMENT_NOT_APPROVED)"
          - "Segment category_code still in contract scope (ERR_CATEGORY_OUT_OF_SCOPE)"
        side_effects:
          - "status -> LAUNCHED; launched_at = logical clock"
          - "Write AuditEvent ACTIVATION_LAUNCHED"
      - from: LAUNCHED
        to: HALTED
        trigger: "POST /shopper-insights/segment-activations/{id}/halt"
        actor: SupplierAnalyst
        preconditions:
          - "Activation status == LAUNCHED (ERR_INVALID_STATE)"
        side_effects: ["status -> HALTED"]
      - from: LAUNCHED
        to: COMPLETED
        trigger: "system (automatic when logical clock >= launched_at + MEASUREMENT_WINDOW_DAYS (28))"
        actor: system
        preconditions: []
        side_effects: ["status -> COMPLETED"]

  - entity: IncrementalityStudy
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: RUNNING
        trigger: "POST /shopper-insights/incrementality-studies/{id}/start"
        actor: InsightsScientist
        preconditions:
          - "Study status == DRAFT (ERR_STUDY_INVALID_TRANSITION)"
        side_effects:
          - "Run matched_control_selection; store matched_pairs"
      - from: RUNNING
        to: ANALYSIS
        trigger: "system (automatic when logical clock >= window_end; evaluated on study reads and transitions)"
        actor: system
        preconditions: []
        side_effects:
          - "Compute test_avg_spend_cents, control_avg_spend_cents, provisional_lift_pct, final_lift_pct"
      - from: ANALYSIS
        to: IN_REVIEW
        trigger: "POST /shopper-insights/incrementality-studies/{id}/submit-review"
        actor: InsightsScientist
        preconditions:
          - "Study status == ANALYSIS (ERR_STUDY_INVALID_TRANSITION)"
        side_effects: []
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /shopper-insights/incrementality-studies/{id}/publish"
        actor: InsightsScientist
        preconditions:
          - "Study status == IN_REVIEW (ERR_STUDY_INVALID_TRANSITION)"
        side_effects: []
      - from: IN_REVIEW
        to: RUNNING
        trigger: "POST /shopper-insights/incrementality-studies/{id}/revise"
        actor: InsightsScientist
        preconditions:
          - "Study status == IN_REVIEW (ERR_STUDY_INVALID_TRANSITION)"
        side_effects:
          - "Re-run matched_control_selection against current panel; replace matched_pairs"

  - entity: CleanRoomGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /shopper-insights/clean-room-grants/{id}/approve"
        actor: DataSteward
        preconditions:
          - "Grant status == REQUESTED (ERR_GRANT_NOT_APPROVABLE)"
          - "Approver X-User-ID != grant.requested_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects: ["status -> APPROVED; write AuditEvent GRANT_APPROVED"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /shopper-insights/clean-room-grants/{id}/deny"
        actor: DataSteward
        preconditions:
          - "Grant status == REQUESTED (ERR_GRANT_NOT_APPROVABLE)"
        side_effects: ["status -> DENIED; record denial_reason; write AuditEvent GRANT_DENIED"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /shopper-insights/clean-room-grants/{id}/revoke"
        actor: DataSteward
        preconditions:
          - "Grant status == APPROVED (ERR_INVALID_STATE)"
        side_effects: ["status -> REVOKED; write AuditEvent GRANT_REVOKED"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic when logical clock >= valid_until; evaluated on grant read and on query submission)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]

  - entity: CleanRoomQuery
    initial_state: SUBMITTED
    terminal_states: [EXECUTED, SUPPRESSED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: EXECUTED
        trigger: "POST /shopper-insights/clean-room-grants/{id}/queries (synchronous evaluation)"
        actor: SupplierAnalyst
        preconditions:
          - "Grant status == APPROVED and logical clock < valid_until (ERR_GRANT_NOT_QUERYABLE / ERR_GRANT_EXPIRED)"
          - "query_cost <= grant.query_budget_remaining (ERR_INSUFFICIENT_QUERY_BUDGET)"
          - "result_rows >= MIN_CELL_SIZE (20) else SUPPRESSED"
        side_effects:
          - "status -> EXECUTED; result_rows = estimated_rows"
          - "grant.query_budget_consumed += query_cost"
          - "Write AuditEvent QUERY_EXECUTED"
      - from: SUBMITTED
        to: SUPPRESSED
        trigger: "POST /shopper-insights/clean-room-grants/{id}/queries (synchronous evaluation)"
        actor: SupplierAnalyst
        preconditions:
          - "Same grant and budget checks as EXECUTED path"
          - "result_rows < MIN_CELL_SIZE (20)"
        side_effects:
          - "status -> SUPPRESSED"
          - "Cost charged then refunded in full (net zero on query_budget_consumed) — privacy refund policy"
          - "Write AuditEvent QUERY_SUPPRESSED"

  - entity: LineReviewCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (automatic when logical clock >= open_at; evaluated on cycle read, deliverable create/submit)"
        actor: system
        preconditions: []
        side_effects: ["status -> OPEN"]
      - from: OPEN
        to: LOCKED
        trigger: "POST /shopper-insights/line-review-cycles/{id}/lock"
        actor: CategoryManager
        preconditions:
          - "Cycle status == OPEN (ERR_CYCLE_NOT_LOCKABLE)"
        side_effects:
          - "status -> LOCKED"
          - "Cascade B: every ReviewDeliverable of this cycle in PLANNED -> MISSED"
          - "Cascade C: for each deliverable missed by cascade B, its contract compliance_score -= MISSED_DELIVERABLE_PENALTY (25), floor 0"
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /shopper-insights/line-review-cycles/{id}/complete"
        actor: CategoryManager
        preconditions:
          - "Cycle status == LOCKED (ERR_INVALID_STATE)"
        side_effects: ["status -> COMPLETED"]

  - entity: ReviewDeliverable
    initial_state: PLANNED
    terminal_states: [ACCEPTED, MISSED]
    transitions:
      - from: PLANNED
        to: SUBMITTED
        trigger: "POST /shopper-insights/review-deliverables/{id}/submit"
        actor: InsightsScientist
        preconditions:
          - "Deliverable status == PLANNED or REJECTED (ERR_DELIVERABLE_NOT_SUBMITTABLE)"
          - "Cycle status == OPEN (auto-open applies first; otherwise ERR_CYCLE_NOT_OPEN)"
          - "Linked InsightReport status == READY or DELIVERED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> SUBMITTED"
          - "If logical clock > due_at: is_late = true and contract compliance_score -= LATE_SUBMISSION_PENALTY (10), floor 0"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /shopper-insights/review-deliverables/{id}/submit"
        actor: InsightsScientist
        preconditions:
          - "Same as PLANNED -> SUBMITTED"
        side_effects: ["Same as PLANNED -> SUBMITTED"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /shopper-insights/review-deliverables/{id}/accept"
        actor: CategoryManager
        preconditions:
          - "Deliverable status == SUBMITTED (ERR_DELIVERABLE_NOT_REVIEWABLE)"
        side_effects: ["cycle.planned_open_count -= 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /shopper-insights/review-deliverables/{id}/reject"
        actor: CategoryManager
        preconditions:
          - "Deliverable status == SUBMITTED (ERR_DELIVERABLE_NOT_REVIEWABLE)"
        side_effects: []
      - from: PLANNED
        to: BLOCKED
        trigger: "system (cascade from InsightReport cancellation via contract suspension)"
        actor: system
        preconditions: []
        side_effects: ["cycle.planned_open_count -= 1"]
      - from: PLANNED
        to: MISSED
        trigger: "system (cascade from cycle lock)"
        actor: system
        preconditions: []
        side_effects: ["contract compliance_score -= 25 (floor 0)"]

  - entity: NewItemForecast
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a new NewItemForecast with the same product_ref is created)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: contract-amend-stale-version
    parent_entity: SubscriptionContract
    write_endpoint: "POST /shopper-insights/subscription-contracts/{id}/amend"
    occ_field: "expected_contract_version"
    description: |
      Amending a contract whose version has advanced since the client last
      observed it is rejected: the amendment supersedes the current tier/credit
      terms, so acting on a stale view would silently overwrite terms the
      client never saw.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: segment-activation-stale-version
    parent_entity: AudienceSegment
    write_endpoint: "POST /shopper-insights/audience-segments/{id}/activations"
    occ_field: "expected_segment_version"
    description: |
      Creating an activation pins the approved segment's size at creation; a
      request carrying a segment version older than the current one is rejected
      because the fee and reach were computed from a stale size.
    error_id: ERR_STALE_SEGMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: min_cell_suppression
    trigger: "InsightReport generate; CleanRoomQuery submission"
    algorithm: threshold
    formula: |
      For each reported cell: if household_count < MIN_CELL_SIZE the cell is
      suppressed. Boundary is inclusive-pass: count == MIN_CELL_SIZE passes,
      count == MIN_CELL_SIZE - 1 is suppressed.
      InsightReport: suppression of any cell -> whole report SUPPRESSED.
      CleanRoomQuery: result_rows < MIN_CELL_SIZE -> SUPPRESSED with full refund.
    input_set: "PanelHousehold rows whose category_codes contain the target category_code (reports); simulated engine rows (queries)"
    constants:
      MIN_CELL_SIZE: 20
    precision: "integer counts; no rounding"

  - name: report_credit_ledger
    trigger: "report create / generate / cancel / contract amend"
    algorithm: aggregation
    formula: |
      Invariant at all times:
        report_credit_allowance == report_credits_available + report_credits_reserved + report_credits_consumed
      create:  reserved += credit_cost  (requires available >= credit_cost)
      cancel:  reserved -= credit_cost
      generate READY:      reserved -= credit_cost; consumed += credit_cost
      generate SUPPRESSED: reserved -= credit_cost  (privacy refund)
      amend with credit_allowance_delta d: allowance += d; available += d;
        requires consumed + reserved <= allowance + d (ERR_ALLOWANCE_BELOW_CONSUMED)
    input_set: "InsightReport rows of the contract in REQUESTED (reserved) and READY/DELIVERED (consumed)"
    constants:
      CREDIT_COST_CATEGORY: 1
      CREDIT_COST_BRAND_OWN: 2
      CREDIT_COST_COMPETITOR_BLIND: 3
    precision: "integer credits"

  - name: credit_cost
    trigger: "InsightReport create"
    algorithm: threshold
    formula: |
      credit_cost = 1 if report_type == CATEGORY
                    2 if report_type == BRAND_OWN
                    3 if report_type == COMPETITOR_BLIND
    input_set: "the new InsightReport"
    constants:
      CREDIT_COST_CATEGORY: 1
      CREDIT_COST_BRAND_OWN: 2
      CREDIT_COST_COMPETITOR_BLIND: 3
    precision: "integer"

  - name: competitor_blind_aggregation
    trigger: "InsightReport generate when report_type == COMPETITOR_BLIND"
    algorithm: aggregation
    formula: |
      own_brand_households = count of category households having any
        brand_metrics entry whose brand_code is in the contract scope's brand_codes
      other_supplier_aggregate_households = household_count - own_brand_households
      The competitor side is ALWAYS a single blinded bucket; no per-competitor
      breakdown exists. If other_supplier_aggregate_households < MIN_CELL_SIZE
      the whole report is SUPPRESSED (min_cell_suppression applies to the bucket).
    input_set: "PanelHousehold rows matching category_code"
    constants:
      MIN_CELL_SIZE: 20
    precision: "integer counts"

  - name: segment_size
    trigger: "AudienceSegment create and submit"
    algorithm: aggregation
    formula: |
      size = count of PanelHousehold where
        category_code IN household.category_codes
        AND (min_frequency is null OR household.frequency_12m >= min_frequency)
        AND (min_monetary_cents is null OR household.monetary_12m_cents >= min_monetary_cents)
        AND (region is null OR household.region == region)
    input_set: "all PanelHousehold rows"
    constants: {}
    precision: "integer"

  - name: activation_reach_and_fee
    trigger: "SegmentActivation create"
    algorithm: aggregation
    formula: |
      For each channel line i (in the order channels are listed in the request):
        households_reached_i = floor(segment.size * REACH_RATE[channel_i])
        line_fee_cents_i = round_half_up(households_reached_i * RATE_CENTS_PER_HOUSEHOLD * CHANNEL_MULTIPLIER[channel_i])
      total_fee_cents = sum over lines of line_fee_cents_i
      ROUNDING ORDER PINNED: round each line first, then sum. (Summing raw
      values then rounding is a different, forbidden algorithm; e.g. size 37
      with [COUPON, RETAIL_MEDIA] yields 73 + 59 = 132, not round(131.0) = 131
      ... note raw sum 72.5 + 58.5 = 131.0 which rounds to 131 — per-line-then-sum
      gives 132 and is the mandated result.)
    input_set: "the activated AudienceSegment (size snapshot at creation)"
    constants:
      RATE_CENTS_PER_HOUSEHOLD: 2.5
      REACH_RATE_COUPON: 0.8
      REACH_RATE_RETAIL_MEDIA: 0.5
      CHANNEL_MULTIPLIER_COUPON: 1.0
      CHANNEL_MULTIPLIER_RETAIL_MEDIA: 1.3
    precision: "line fees round_half_up to integer cents; total is integer sum"

  - name: matched_control_selection
    trigger: "IncrementalityStudy start and revise"
    algorithm: chronological
    formula: |
      treated = PanelHousehold rows where category_code IN category_codes
                AND brand_code IN exposed_brands
      control pool = PanelHousehold rows where category_code IN category_codes
                AND brand_code NOT IN exposed_brands
      distance(t, c) = abs(t.recency_days - c.recency_days)
                     + abs(t.frequency_12m - c.frequency_12m)
                     + abs(t.monetary_12m_cents - c.monetary_12m_cents) / 1000.0
      Process treated households in created_at ASC order; for each, select the
      unchosen control with minimum distance; tie-break: control created_at ASC.
      Each control is chosen at most once (exclusion on selection).
      If control pool empties before all treated are matched, remaining treated
      households are dropped from matched_pairs.
    input_set: "PanelHousehold rows filtered by category and exposure as above"
    constants:
      CONTROL_RATIO: 1
    precision: "distance as real number; ordering only"

  - name: incrementality_lift
    trigger: "IncrementalityStudy enters ANALYSIS (clock >= window_end)"
    algorithm: aggregation
    formula: |
      test_avg_spend_cents    = mean of brand_metrics[brand].campaign_spend_cents over treated in matched_pairs
      control_avg_spend_cents = mean of brand_metrics[brand].campaign_spend_cents over controls in matched_pairs
      test_base_avg    = mean of brand_metrics[brand].baseline_spend_cents over treated
      control_base_avg = mean of brand_metrics[brand].baseline_spend_cents over controls
      provisional_lift_pct = (test_avg_spend_cents - control_avg_spend_cents) / control_avg_spend_cents * 100
      bias_correction = COVARIATE_WEIGHT * (test_base_avg - control_base_avg)
      final_lift_pct = (test_avg_spend_cents - control_avg_spend_cents - bias_correction) / control_avg_spend_cents * 100
    input_set: "matched_pairs computed at start/revise"
    constants:
      COVARIATE_WEIGHT: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Unadjusted raw lift; stored as provisional_lift_pct"
        difference: "No covariate correction; higher when treated group was already spending more at baseline"
      - name: final
        when: "Regression-style adjusted lift; stored as final_lift_pct"
        difference: "Subtracts bias_correction = 0.5 * baseline gap before dividing; yields strictly smaller lift when baseline gap > 0"

  - name: clean_room_query_cost
    trigger: "CleanRoomQuery submission"
    algorithm: tiered_pricing
    formula: |
      row_units   = ceil(estimated_rows / 1000)
      join_factor = max(1.0, 1.0 + 0.25 * (len(dataset_joins) - 1))
      tier_mult   = 1.0 if contract.tier == TIER_CATEGORY
                    1.25 if TIER_BRAND
                    1.5 if TIER_PORTFOLIO
      raw_cost    = row_units * join_factor * tier_mult
      query_cost  = min(MAX_QUERY_COST, max(1, ceil(raw_cost)))
      Contract resolved via grant.supplier_account_id -> its single ACTIVE contract.
    input_set: "the query's estimated_rows and dataset_joins; the account's ACTIVE contract tier"
    constants:
      MAX_QUERY_COST: 100
    precision: "integer credits; ceil applied once after full multiplication"

  - name: query_budget_ledger
    trigger: "CleanRoomQuery execution / suppression"
    algorithm: aggregation
    formula: |
      Invariant at all times:
        query_budget_total == query_budget_consumed + query_budget_remaining
      EXECUTED:   consumed += query_cost
      SUPPRESSED: consumed += query_cost then immediately -= query_cost (net 0)
    input_set: "CleanRoomQuery rows of the grant"
    constants: {}
    precision: "integer credits"

  - name: new_item_forecast
    trigger: "NewItemForecast create"
    algorithm: weighted_scoring
    formula: |
      forecast_simple_avg_units = mean(analogs[].observed_week4_units), 2dp round_half_up
      forecast_weighted_units   = sum(similarity_score * observed_week4_units) / sum(similarity_score), 2dp round_half_up
      forecast_selected_units   = simple if variant == SIMPLE_AVERAGE else weighted
    input_set: "the request's analogs array (>= 1 entry)"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: simple_average
        when: "variant == SIMPLE_AVERAGE"
        difference: "Unweighted mean; ignores similarity_score"
      - name: similarity_weighted
        when: "variant == SIMILARITY_WEIGHTED"
        difference: "Similarity-weighted mean; shifts forecast toward closer analogs"

  - name: compliance_score_update
    trigger: "deliverable late submission; cycle lock cascade"
    algorithm: aggregation
    formula: |
      Initial 1000.
      Late submission (clock > due_at at submit): compliance_score -= LATE_SUBMISSION_PENALTY
      Missed deliverable (cycle lock cascade):    compliance_score -= MISSED_DELIVERABLE_PENALTY
      Floor: compliance_score >= 0
    input_set: "ReviewDeliverable rows of the contract"
    constants:
      LATE_SUBMISSION_PENALTY: 10
      MISSED_DELIVERABLE_PENALTY: 25
    precision: "integer"

  - name: planned_open_count_sync
    trigger: "deliverable create / accept / block / miss"
    algorithm: aggregation
    formula: |
      planned_open_count = count of the cycle's ReviewDeliverables with
      status IN {PLANNED, SUBMITTED}. Recomputed on every deliverable
      transition into or out of that set.
    input_set: "ReviewDeliverable rows of the cycle"
    constants: {}
    precision: "integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint; for SupplierAnalyst writes, X-User-ID must equal the owning SupplierAccount id of the target resource"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, types correct, arrays non-empty where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: state
    check: "Target resource in a legal state for the operation (contract ACTIVE, grant APPROVED and unexpired, cycle OPEN, report/segment/activation/deliverable/study in required state)"
    error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_GRANT_NOT_QUERYABLE | ERR_GRANT_EXPIRED | ERR_CYCLE_NOT_OPEN | ERR_REPORT_NOT_GENERATABLE | ERR_REPORT_NOT_CANCELLABLE | ERR_SEGMENT_NOT_SUBMITTABLE | ERR_SEGMENT_NOT_APPROVED | ERR_ACTIVATION_NOT_LAUNCHABLE | ERR_STUDY_INVALID_TRANSITION | ERR_DELIVERABLE_NOT_SUBMITTABLE | ERR_DELIVERABLE_NOT_REVIEWABLE | ERR_CYCLE_NOT_LOCKABLE | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Privacy and segregation-of-duties: grant approver != requester (ERR_SELF_APPROVAL_FORBIDDEN); segment size >= MIN_SEGMENT_SIZE at approve (ERR_SEGMENT_BELOW_MINIMUM); segment size > 0 at submit (ERR_SEGMENT_EMPTY)"
    error_id: "ERR_SELF_APPROVAL_FORBIDDEN | ERR_SEGMENT_BELOW_MINIMUM | ERR_SEGMENT_EMPTY"
    http_status: 422
    applies_to: "grant approve, segment approve, segment submit"

  - priority: 7
    category: business_referential
    check: "Category in contract scope (ERR_CATEGORY_OUT_OF_SCOPE) checked before tier; report_type permitted by contract tier (ERR_TIER_INSUFFICIENT); one ACTIVE contract per account (ERR_ACCOUNT_HAS_ACTIVE_CONTRACT); modeled derivation permitted (ERR_MODELED_DERIVATION_FORBIDDEN)"
    error_id: "ERR_CATEGORY_OUT_OF_SCOPE | ERR_TIER_INSUFFICIENT | ERR_ACCOUNT_HAS_ACTIVE_CONTRACT | ERR_MODELED_DERIVATION_FORBIDDEN"
    http_status: 422
    applies_to: "report create, segment create, activation create/launch, contract create, forecast create"

  - priority: 8
    category: business_temporal
    check: "Grant access windows for the same account are half-open [valid_from, valid_until) and must not overlap (adjacency allowed) (ERR_WINDOW_OVERLAP); line review cycles for the same category require >= 7 days gap between closed windows (ERR_CYCLE_GAP_VIOLATION); deliverable due_at < cycle window_start (ERR_INVALID_REQUEST)"
    error_id: "ERR_WINDOW_OVERLAP | ERR_CYCLE_GAP_VIOLATION"
    http_status: 409
    applies_to: "grant create, cycle create, deliverable create"

  - priority: 9
    category: business_fiscal
    check: "Credits and budgets: report reservation <= available (ERR_INSUFFICIENT_REPORT_CREDITS); amendment keeps consumed+reserved <= new allowance (ERR_ALLOWANCE_BELOW_CONSUMED); activation fee <= remaining activation budget (ERR_ACTIVATION_BUDGET_EXCEEDED); query cost <= query_budget_remaining (ERR_INSUFFICIENT_QUERY_BUDGET)"
    error_id: "ERR_INSUFFICIENT_REPORT_CREDITS | ERR_ALLOWANCE_BELOW_CONSUMED | ERR_ACTIVATION_BUDGET_EXCEEDED | ERR_INSUFFICIENT_QUERY_BUDGET"
    http_status: 402
    applies_to: "report create/regenerate, contract amend, activation create, query submit"

  - priority: 10
    category: business_safety
    check: "Redistribution contract clauses: export requires redistribution_allowed; MODELED_DERIVED class additionally requires modeled_derivation_allowed"
    error_id: ERR_REDISTRIBUTION_RESTRICTED
    http_status: 403
    applies_to: "report export"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- SupplierAccount ---
  - method: POST
    path: "/shopper-insights/supplier-accounts"
    description: "Create a supplier account"
    roles: [RetailerAdmin]
    code: 201
    input: [account_name, region]
    output: SupplierAccount
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/shopper-insights/supplier-accounts/{id}"
    description: "Get a supplier account"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: []
    output: SupplierAccount
    side_effects: []

  - method: GET
    path: "/shopper-insights/supplier-accounts/{id}/subscription-contracts"
    description: "List contracts of an account"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "SubscriptionContract[]"
    side_effects: []

  - method: GET
    path: "/shopper-insights/supplier-accounts/{id}/clean-room-grants"
    description: "List clean-room grants of an account"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "CleanRoomGrant[]"
    side_effects: []

  # --- SubscriptionContract ---
  - method: POST
    path: "/shopper-insights/supplier-accounts/{id}/subscription-contracts"
    description: "Create a subscription contract (one ACTIVE contract per account)"
    roles: [RetailerAdmin]
    code: 201
    input: [tier, report_credit_allowance, activation_budget_cents, redistribution_allowed, modeled_derivation_allowed]
    output: SubscriptionContract
    side_effects:
      - "status = ACTIVE; version = 1"
      - "ERR_ACCOUNT_HAS_ACTIVE_CONTRACT if account already has an ACTIVE contract"

  - method: GET
    path: "/shopper-insights/subscription-contracts/{id}"
    description: "Get a contract"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: []
    output: SubscriptionContract
    side_effects: []

  - method: POST
    path: "/shopper-insights/subscription-contracts/{id}/amend"
    description: "Amend tier, credit allowance, and/or category scopes (OCC on contract version)"
    roles: [RetailerAdmin]
    code: 200
    input: [expected_contract_version, "tier?", "credit_allowance_delta?", "add_category_codes?", "remove_category_codes?"]
    output: SubscriptionContract
    side_effects:
      - "increments SubscriptionContract.version by 1"
      - "credit ledger: allowance += delta; available += delta; ERR_ALLOWANCE_BELOW_CONSUMED if consumed + reserved > new allowance"
      - "remove_category_codes deletes matching CategoryScope rows"

  - method: POST
    path: "/shopper-insights/subscription-contracts/{id}/suspend"
    description: "Suspend a contract (cascades: cancel open reports -> block deliverables -> decrement cycle counts)"
    roles: [RetailerAdmin]
    code: 200
    input: []
    output: SubscriptionContract
    side_effects:
      - "increments SubscriptionContract.version by 1"
      - "Cascade per SubscriptionContract ACTIVE->SUSPENDED transition (reports CANCELLED with refund, deliverables BLOCKED, cycle planned_open_count decremented)"

  - method: POST
    path: "/shopper-insights/subscription-contracts/{id}/terminate"
    description: "Terminate a contract"
    roles: [RetailerAdmin]
    code: 200
    input: []
    output: SubscriptionContract
    side_effects: ["status -> TERMINATED; increments SubscriptionContract.version by 1"]

  # --- CategoryScope ---
  - method: POST
    path: "/shopper-insights/subscription-contracts/{id}/category-scopes"
    description: "Add a category scope with the supplier's own brand codes"
    roles: [RetailerAdmin]
    code: 201
    input: [category_code, brand_codes]
    output: CategoryScope
    side_effects: []

  - method: GET
    path: "/shopper-insights/subscription-contracts/{id}/category-scopes"
    description: "List scopes of a contract"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "CategoryScope[]"
    side_effects: []

  - method: GET
    path: "/shopper-insights/subscription-contracts/{id}/insight-reports"
    description: "List reports of a contract"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "InsightReport[]"
    side_effects: []

  - method: GET
    path: "/shopper-insights/subscription-contracts/{id}/audience-segments"
    description: "List segments of a contract"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "AudienceSegment[]"
    side_effects: []

  - method: GET
    path: "/shopper-insights/subscription-contracts/{id}/review-deliverables"
    description: "List deliverables funded by a contract"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReviewDeliverable[]"
    side_effects: []

  - method: GET
    path: "/shopper-insights/subscription-contracts/{id}/new-item-forecasts"
    description: "List forecasts of a contract"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "NewItemForecast[]"
    side_effects: []

  # --- PanelHousehold (bulk ingest) ---
  - method: POST
    path: "/shopper-insights/panel-households"
    description: "Bulk-ingest panel households; best-effort: valid items persist, invalid items reported per-item"
    roles: [RetailerAdmin]
    code: 200
    input: [households]
    output: "{ ingested_count: integer, rejected: array }"
    side_effects: ["Each valid household persisted (append-only); per-item errors returned in rejected[]"]

  # --- InsightReport ---
  - method: POST
    path: "/shopper-insights/insight-reports"
    description: "Request an insight report (reserves credits)"
    roles: [SupplierAnalyst]
    code: 201
    input: [contract_id, report_type, category_code, period_start, period_end]
    output: InsightReport
    side_effects:
      - "credit_cost computed; report_credits_reserved += credit_cost (ERR_INSUFFICIENT_REPORT_CREDITS)"
      - "scope check ERR_CATEGORY_OUT_OF_SCOPE precedes tier check ERR_TIER_INSUFFICIENT"

  - method: GET
    path: "/shopper-insights/insight-reports/{id}"
    description: "Get a report"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: []
    output: InsightReport
    side_effects: []

  - method: GET
    path: "/shopper-insights/insight-reports/{id}/review-deliverables"
    description: "List deliverables backed by a report"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReviewDeliverable[]"
    side_effects: []

  - method: POST
    path: "/shopper-insights/insight-reports/{id}/generate"
    description: "Generate/regenerate report cells from the panel (READY or SUPPRESSED)"
    roles: [SupplierAnalyst]
    code: 200
    input: []
    output: InsightReport
    side_effects: ["Cell computation + suppression per min_cell_suppression; credit finalize or refund per report_credit_ledger"]

  - method: POST
    path: "/shopper-insights/insight-reports/{id}/cancel"
    description: "Cancel a REQUESTED report (refund reservation)"
    roles: [SupplierAnalyst]
    code: 200
    input: []
    output: InsightReport
    side_effects: ["status -> CANCELLED; reserved credits refunded"]

  - method: POST
    path: "/shopper-insights/insight-reports/{id}/export"
    description: "Export a READY report subject to redistribution clauses; writes AuditEvent"
    roles: [SupplierAnalyst]
    code: 200
    input: []
    output: InsightReport
    side_effects: ["status -> DELIVERED; AuditEvent REPORT_EXPORTED written"]

  # --- AudienceSegment ---
  - method: POST
    path: "/shopper-insights/audience-segments"
    description: "Create an audience segment (size computed)"
    roles: [SupplierAnalyst]
    code: 201
    input: [contract_id, segment_name, category_code, "min_frequency?", "min_monetary_cents?", "region?"]
    output: AudienceSegment
    side_effects: ["size computed per segment_size; status = DRAFT"]

  - method: GET
    path: "/shopper-insights/audience-segments/{id}"
    description: "Get a segment"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: []
    output: AudienceSegment
    side_effects: []

  - method: GET
    path: "/shopper-insights/audience-segments/{id}/activations"
    description: "List activations of a segment"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "SegmentActivation[]"
    side_effects: []

  - method: POST
    path: "/shopper-insights/audience-segments/{id}/submit"
    description: "Submit segment for stewardship approval (recomputes size)"
    roles: [SupplierAnalyst]
    code: 200
    input: []
    output: AudienceSegment
    side_effects: ["size recomputed; ERR_SEGMENT_EMPTY when 0; status -> PENDING_APPROVAL; version += 1"]

  - method: POST
    path: "/shopper-insights/audience-segments/{id}/approve"
    description: "Approve a segment (DataSteward; segregation of duties)"
    roles: [DataSteward]
    code: 200
    input: []
    output: AudienceSegment
    side_effects: ["status -> APPROVED; version += 1"]

  - method: POST
    path: "/shopper-insights/audience-segments/{id}/reject"
    description: "Reject a segment"
    roles: [DataSteward]
    code: 200
    input: []
    output: AudienceSegment
    side_effects: ["status -> REJECTED; version += 1"]

  # --- SegmentActivation ---
  - method: POST
    path: "/shopper-insights/audience-segments/{id}/activations"
    description: "Create an activation on an APPROVED segment (OCC on segment version; debits activation budget)"
    roles: [SupplierAnalyst]
    code: 201
    input: [expected_segment_version, channels]
    output: SegmentActivation
    side_effects:
      - "channel_lines and total_fee_cents computed per activation_reach_and_fee"
      - "contract.activation_budget_spent_cents += total_fee_cents (ERR_ACTIVATION_BUDGET_EXCEEDED)"
      - "increments AudienceSegment.version by 1"

  - method: POST
    path: "/shopper-insights/segment-activations/{id}/launch"
    description: "Launch a PENDING activation"
    roles: [SupplierAnalyst]
    code: 200
    input: []
    output: SegmentActivation
    side_effects: ["status -> LAUNCHED; launched_at set; AuditEvent ACTIVATION_LAUNCHED"]

  - method: POST
    path: "/shopper-insights/segment-activations/{id}/halt"
    description: "Halt a LAUNCHED activation"
    roles: [SupplierAnalyst]
    code: 200
    input: []
    output: SegmentActivation
    side_effects: ["status -> HALTED"]

  # --- IncrementalityStudy ---
  - method: POST
    path: "/shopper-insights/incrementality-studies"
    description: "Create an incrementality study for a promoted brand"
    roles: [InsightsScientist]
    code: 201
    input: [brand_code, category_code, window_start, window_end]
    output: IncrementalityStudy
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/shopper-insights/incrementality-studies/{id}"
    description: "Get a study (auto-transitions RUNNING -> ANALYSIS when clock >= window_end)"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: []
    output: IncrementalityStudy
    side_effects: ["Lazy auto-transition RUNNING -> ANALYSIS computes lift metrics"]

  - method: POST
    path: "/shopper-insights/incrementality-studies/{id}/start"
    description: "Start a study (runs matched control selection)"
    roles: [InsightsScientist]
    code: 200
    input: []
    output: IncrementalityStudy
    side_effects: ["status -> RUNNING; matched_pairs computed"]

  - method: POST
    path: "/shopper-insights/incrementality-studies/{id}/submit-review"
    description: "Move study from ANALYSIS to IN_REVIEW"
    roles: [InsightsScientist]
    code: 200
    input: []
    output: IncrementalityStudy
    side_effects: ["status -> IN_REVIEW"]

  - method: POST
    path: "/shopper-insights/incrementality-studies/{id}/publish"
    description: "Publish a reviewed study"
    roles: [InsightsScientist]
    code: 200
    input: []
    output: IncrementalityStudy
    side_effects: ["status -> PUBLISHED"]

  - method: POST
    path: "/shopper-insights/incrementality-studies/{id}/revise"
    description: "Send study back to RUNNING and re-match controls (revision cycle)"
    roles: [InsightsScientist]
    code: 200
    input: []
    output: IncrementalityStudy
    side_effects: ["status -> RUNNING; matched_pairs recomputed"]

  # --- CleanRoomGrant ---
  - method: POST
    path: "/shopper-insights/clean-room-grants"
    description: "Request a clean-room access grant"
    roles: [SupplierAnalyst]
    code: 201
    input: [supplier_account_id, valid_from, valid_until, query_budget_total]
    output: CleanRoomGrant
    side_effects: ["status = REQUESTED; requested_by_user_id = X-User-ID; window overlap check per business_temporal"]

  - method: GET
    path: "/shopper-insights/clean-room-grants/{id}"
    description: "Get a grant (lazy-expires APPROVED grants past valid_until)"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: []
    output: CleanRoomGrant
    side_effects: ["Lazy auto-transition APPROVED -> EXPIRED when clock >= valid_until"]

  - method: POST
    path: "/shopper-insights/clean-room-grants/{id}/approve"
    description: "Approve a grant (DataSteward; approver must differ from requester)"
    roles: [DataSteward]
    code: 200
    input: []
    output: CleanRoomGrant
    side_effects: ["status -> APPROVED; AuditEvent GRANT_APPROVED"]

  - method: POST
    path: "/shopper-insights/clean-room-grants/{id}/deny"
    description: "Deny a grant"
    roles: [DataSteward]
    code: 200
    input: [reason]
    output: CleanRoomGrant
    side_effects: ["status -> DENIED; denial_reason recorded; AuditEvent GRANT_DENIED"]

  - method: POST
    path: "/shopper-insights/clean-room-grants/{id}/revoke"
    description: "Revoke an APPROVED grant"
    roles: [DataSteward]
    code: 200
    input: []
    output: CleanRoomGrant
    side_effects: ["status -> REVOKED; AuditEvent GRANT_REVOKED"]

  # --- CleanRoomQuery ---
  - method: POST
    path: "/shopper-insights/clean-room-grants/{id}/queries"
    description: "Submit an audited clean-room query (synchronous EXECUTED or SUPPRESSED)"
    roles: [SupplierAnalyst]
    code: 201
    input: [dataset_joins, estimated_rows]
    output: CleanRoomQuery
    side_effects: ["query_cost computed; budget ledger updated (net zero on SUPPRESSED); AuditEvent written"]

  - method: GET
    path: "/shopper-insights/clean-room-grants/{id}/queries"
    description: "List queries of a grant (audit trail)"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "CleanRoomQuery[]"
    side_effects: []

  # --- LineReviewCycle ---
  - method: POST
    path: "/shopper-insights/line-review-cycles"
    description: "Schedule a line review cycle for a category"
    roles: [CategoryManager]
    code: 201
    input: [category_code, window_start, window_end]
    output: LineReviewCycle
    side_effects: ["open_at = window_start - 14 days; status = SCHEDULED; gap check ERR_CYCLE_GAP_VIOLATION"]

  - method: GET
    path: "/shopper-insights/line-review-cycles/{id}"
    description: "Get a cycle (lazy auto-open when clock >= open_at)"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: []
    output: LineReviewCycle
    side_effects: ["Lazy auto-transition SCHEDULED -> OPEN when clock >= open_at"]

  - method: POST
    path: "/shopper-insights/line-review-cycles/{id}/lock"
    description: "Lock a cycle (cascades: PLANNED deliverables MISSED -> contract compliance penalty)"
    roles: [CategoryManager]
    code: 200
    input: []
    output: LineReviewCycle
    side_effects: ["Cascade per LineReviewCycle OPEN->LOCKED transition"]

  - method: POST
    path: "/shopper-insights/line-review-cycles/{id}/complete"
    description: "Complete a LOCKED cycle"
    roles: [CategoryManager]
    code: 200
    input: []
    output: LineReviewCycle
    side_effects: ["status -> COMPLETED"]

  # --- ReviewDeliverable ---
  - method: POST
    path: "/shopper-insights/line-review-cycles/{id}/deliverables"
    description: "Plan a category review deliverable timed to a cycle"
    roles: [CategoryManager]
    code: 201
    input: [contract_id, insight_report_id, due_at]
    output: ReviewDeliverable
    side_effects: ["status = PLANNED; cycle.planned_open_count += 1; requires due_at < cycle window_start (ERR_INVALID_REQUEST)"]

  - method: GET
    path: "/shopper-insights/line-review-cycles/{id}/deliverables"
    description: "List deliverables of a cycle"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReviewDeliverable[]"
    side_effects: []

  - method: POST
    path: "/shopper-insights/review-deliverables/{id}/submit"
    description: "Submit a deliverable (requires cycle OPEN and backing report READY/DELIVERED; late flag + penalty past due_at)"
    roles: [InsightsScientist]
    code: 200
    input: []
    output: ReviewDeliverable
    side_effects: ["status -> SUBMITTED; is_late computed; LATE_SUBMISSION_PENALTY applied when late"]

  - method: POST
    path: "/shopper-insights/review-deliverables/{id}/accept"
    description: "Accept a SUBMITTED deliverable"
    roles: [CategoryManager]
    code: 200
    input: []
    output: ReviewDeliverable
    side_effects: ["status -> ACCEPTED; cycle.planned_open_count -= 1"]

  - method: POST
    path: "/shopper-insights/review-deliverables/{id}/reject"
    description: "Reject a SUBMITTED deliverable (resubmission allowed)"
    roles: [CategoryManager]
    code: 200
    input: []
    output: ReviewDeliverable
    side_effects: ["status -> REJECTED"]

  # --- NewItemForecast ---
  - method: POST
    path: "/shopper-insights/new-item-forecasts"
    description: "Create a new-item forecast from analog products (supersedes prior forecast of same product_ref)"
    roles: [InsightsScientist]
    code: 201
    input: [contract_id, product_ref, analogs, variant]
    output: NewItemForecast
    side_effects: ["Both forecast variants computed; selected per variant; prior PUBLISHED forecast with same product_ref -> SUPERSEDED"]

  # --- AuditEvent ---
  - method: GET
    path: "/shopper-insights/audit-events"
    description: "List audit events (append-only compliance log)"
    roles: [RetailerAdmin, CategoryManager, InsightsScientist, SupplierAnalyst, DataSteward]
    code: 200
    input: ["subject_type?", "subject_id?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

  # --- Test-driving logical clock ---
  - method: POST
    path: "/shopper-insights/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any set call is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [RetailerAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; lazy auto-transitions evaluate against this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted, or SupplierAnalyst X-User-ID does not match the owning SupplierAccount id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum member, type error, empty array where disallowed, or due_at >= cycle window_start" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires contract status == ACTIVE" }
  - { id: ERR_ACCOUNT_HAS_ACTIVE_CONTRACT, http: 422, condition: "Account already has an ACTIVE contract" }
  - { id: ERR_TIER_INSUFFICIENT, http: 422, condition: "Contract tier does not permit the requested report_type" }
  - { id: ERR_CATEGORY_OUT_OF_SCOPE, http: 422, condition: "category_code not covered by the contract's CategoryScopes" }
  - { id: ERR_MODELED_DERIVATION_FORBIDDEN, http: 422, condition: "Contract modeled_derivation_allowed == false and the operation creates modeled data" }
  - { id: ERR_SEGMENT_EMPTY, http: 422, condition: "Segment submit with recomputed size == 0" }
  - { id: ERR_SEGMENT_BELOW_MINIMUM, http: 422, condition: "Segment approve with size < MIN_SEGMENT_SIZE (25)" }
  - { id: ERR_SEGMENT_NOT_SUBMITTABLE, http: 409, condition: "Segment submit requires status DRAFT or REJECTED" }
  - { id: ERR_SEGMENT_NOT_APPROVED, http: 409, condition: "Activation create/launch requires segment status == APPROVED" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Grant approver X-User-ID equals the requesting analyst's id (segregation of duties)" }
  - { id: ERR_GRANT_NOT_QUERYABLE, http: 409, condition: "Query submitted against a grant not in APPROVED status" }
  - { id: ERR_GRANT_EXPIRED, http: 409, condition: "Query submitted when logical clock >= grant.valid_until (grant flips to EXPIRED)" }
  - { id: ERR_GRANT_NOT_APPROVABLE, http: 409, condition: "Approve/deny requires grant status == REQUESTED" }
  - { id: ERR_INSUFFICIENT_QUERY_BUDGET, http: 402, condition: "query_cost > grant.query_budget_remaining" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Grant access window overlaps an existing REQUESTED/APPROVED grant window for the same account (half-open; adjacency allowed)" }
  - { id: ERR_CYCLE_GAP_VIOLATION, http: 409, condition: "New cycle window for the same category is < 7 days after an existing non-COMPLETED cycle window (closed intervals with buffer)" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Deliverable submit requires cycle status == OPEN" }
  - { id: ERR_CYCLE_NOT_LOCKABLE, http: 409, condition: "Cycle lock requires status == OPEN" }
  - { id: ERR_DELIVERABLE_NOT_SUBMITTABLE, http: 409, condition: "Deliverable submit requires status PLANNED or REJECTED" }
  - { id: ERR_DELIVERABLE_NOT_REVIEWABLE, http: 409, condition: "Accept/reject requires deliverable status == SUBMITTED" }
  - { id: ERR_REPORT_NOT_GENERATABLE, http: 409, condition: "Generate requires report status == REQUESTED or SUPPRESSED" }
  - { id: ERR_REPORT_NOT_CANCELLABLE, http: 409, condition: "Cancel requires report status == REQUESTED" }
  - { id: ERR_INSUFFICIENT_REPORT_CREDITS, http: 402, condition: "Report reservation exceeds contract report_credits_available" }
  - { id: ERR_ALLOWANCE_BELOW_CONSUMED, http: 402, condition: "Amendment would set allowance below consumed + reserved credits" }
  - { id: ERR_ACTIVATION_BUDGET_EXCEEDED, http: 402, condition: "Activation total_fee_cents exceeds remaining contract activation budget" }
  - { id: ERR_REDISTRIBUTION_RESTRICTED, http: 403, condition: "Export violates redistribution_allowed / modeled_derivation_allowed contract clauses" }
  - { id: ERR_ACTIVATION_NOT_LAUNCHABLE, http: 409, condition: "Launch requires activation status == PENDING" }
  - { id: ERR_STUDY_INVALID_TRANSITION, http: 409, condition: "Study action from a state not permitting it" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (report export, activation halt, cycle complete, grant revoke, segment approve/reject)" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not match current contract version (OCC)" }
  - { id: ERR_STALE_SEGMENT_VERSION, http: 412, condition: "expected_segment_version does not match current segment version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RetailerAdmin
    description: "Retailer platform operator; manages accounts, contracts, scopes, panel ingest, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /shopper-insights/supplier-accounts"
      - "POST /shopper-insights/supplier-accounts/{id}/subscription-contracts"
      - "POST /shopper-insights/subscription-contracts/{id}/amend"
      - "POST /shopper-insights/subscription-contracts/{id}/suspend"
      - "POST /shopper-insights/subscription-contracts/{id}/terminate"
      - "POST /shopper-insights/subscription-contracts/{id}/category-scopes"
      - "POST /shopper-insights/panel-households"
      - "POST /shopper-insights/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]

  - name: CategoryManager
    description: "Retailer category manager; owns line review cycles and deliverable review decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /shopper-insights/line-review-cycles"
      - "POST /shopper-insights/line-review-cycles/{id}/lock"
      - "POST /shopper-insights/line-review-cycles/{id}/complete"
      - "POST /shopper-insights/line-review-cycles/{id}/deliverables"
      - "POST /shopper-insights/review-deliverables/{id}/accept"
      - "POST /shopper-insights/review-deliverables/{id}/reject"
    shared_operations: ["All GET endpoints"]

  - name: InsightsScientist
    description: "Retailer insights scientist; runs incrementality studies, new-item forecasts, and submits deliverables"
    identity: "opaque"
    exclusive_operations:
      - "POST /shopper-insights/incrementality-studies"
      - "POST /shopper-insights/incrementality-studies/{id}/start"
      - "POST /shopper-insights/incrementality-studies/{id}/submit-review"
      - "POST /shopper-insights/incrementality-studies/{id}/publish"
      - "POST /shopper-insights/incrementality-studies/{id}/revise"
      - "POST /shopper-insights/new-item-forecasts"
      - "POST /shopper-insights/review-deliverables/{id}/submit"
    shared_operations: ["All GET endpoints"]

  - name: SupplierAnalyst
    description: "Supplier-side analyst; requests reports, builds segments, activates audiences, requests clean-room grants, and runs queries. X-User-ID equals the SupplierAccount id they act for."
    identity: "entity_backed:SupplierAccount"
    exclusive_operations:
      - "POST /shopper-insights/insight-reports"
      - "POST /shopper-insights/insight-reports/{id}/generate"
      - "POST /shopper-insights/insight-reports/{id}/cancel"
      - "POST /shopper-insights/insight-reports/{id}/export"
      - "POST /shopper-insights/audience-segments"
      - "POST /shopper-insights/audience-segments/{id}/submit"
      - "POST /shopper-insights/audience-segments/{id}/activations"
      - "POST /shopper-insights/segment-activations/{id}/launch"
      - "POST /shopper-insights/segment-activations/{id}/halt"
      - "POST /shopper-insights/clean-room-grants"
      - "POST /shopper-insights/clean-room-grants/{id}/queries"
    shared_operations: ["All GET endpoints"]

  - name: DataSteward
    description: "Privacy steward; approves/rejects segments and clean-room grants. Segregation of duties: never the requester of the artifact under review."
    identity: "opaque"
    exclusive_operations:
      - "POST /shopper-insights/audience-segments/{id}/approve"
      - "POST /shopper-insights/audience-segments/{id}/reject"
      - "POST /shopper-insights/clean-room-grants/{id}/approve"
      - "POST /shopper-insights/clean-room-grants/{id}/deny"
      - "POST /shopper-insights/clean-room-grants/{id}/revoke"
    shared_operations: ["All GET endpoints"]
