# =============================================================================
# Task 1112 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances. Every chain drives empty-DB -> precondition using only
# endpoints declared in SCAFFOLD.yaml §1.5.
# Shared fixture literals:
#   C1: rate 1200c/acre, credit 2000000c ; F1: 100ac CORN buffer 300ft
#   P1 HERBICIDE rei24 wind10 t40-85 buffer100 5000c +10%
#   P2 FUNGICIDE rei48 wind15 t50-90 buffer0 2500c +20%
#   RX1: 2026, window 2026-05-01T00:00:00Z..2026-06-30T23:59:59Z, carrier 12gpa,
#        P1@1.5 + P2@0.4
#   AP1: license L-100 exp 2027-01-01T00:00:00Z, categories [HERBICIDE,FUNGICIDE]
#   EQ1: tank 400gal ; PASS calibration target 20.0 / measured 20.5
#   WO window 2026-05-10T08:00:00Z..11:00:00Z
#   Provisional total 1065000c ; final (P1@1.6 actual) 1120000c ;
#   rinsate 24.0gal ; rei_until = completed_at + 48h (P2 max)
# =============================================================================

scaffold_difficulty_design:
  # ------------------------------------------------------------- rule 1 -----
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_amounts
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.provisional_amount_cents
          - entities.Invoice.fields.final_amount_cents
        distinguishing_aspect: |
          Invoice-domain dual variant: the same work order is priced twice with
          identical acreage — provisional (prescribed rates) == 1065000 while
          final (certified actual rate 1.6 for P1) == 1120000; the variants MUST
          diverge by exactly 55000 cents.
        test_recipe:
          setup:
            - "C1/F1/P1/P2/RX1(APPROVED)/AP1/EQ1(PASS calibration) present; WO1 scheduled 2026-05-10 08:00-11:00Z; clock 2026-05-10T10:30:00Z; fresh passing weather observation posted"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "North 40", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { name: "FungiStop", epa_registration_no: "EPA-200-2", category: "FUNGICIDE", rei_hours: 48, max_wind_mph: 15, min_temp_f: 50, max_temp_f: 90, required_buffer_ft: 0, unit_cost_cents: 2500, markup_pct: 20 }, as: CoopAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 }, { product_id: "${p2}", rate_per_acre: 0.4 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann Applicator", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE", "FUNGICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/weather-observations", payload: { observed_at: "2026-05-10T07:30:00Z", wind_mph: 8, temp_f: 65, inversion_present: false }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: CoopAdmin }
            - { call: "POST /api/work-orders/${wo}/start", as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:30:00Z" }, as: CoopAdmin }
            - { call: "POST /api/work-orders/${wo}/complete", payload: { lines: [ { product_id: "${p1}", actual_rate_per_acre: 1.6 }, { product_id: "${p2}", actual_rate_per_acre: 0.4 } ] }, as: Applicator, as_user_id: "${ap}" }
            - { call: "GET /api/invoices", as: CoopAdmin, captures: { inv: "$.data[0].id", inv_prov: "$.data[0].provisional_amount_cents" } }
            - { call: "GET /api/application-records", as: ComplianceOfficer, captures: { rec: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/application-records/${rec}/certify", as: ComplianceOfficer }
            - { call: "GET /api/invoices/${inv}", as: CoopAdmin, captures: { inv_final: $.data.final_amount_cents } }
            - { call: "GET /api/work-orders/${wo}", as: Dispatcher, captures: { wo_est: $.data.estimated_total_cents } }
          assert:
            - "Invoice.${inv}.provisional_amount_cents == 1065000"
            - "WorkOrder.${wo}.estimated_total_cents == 1065000 (provisional equals the schedule-time estimate)"
            - "Invoice.${inv}.final_amount_cents == 1120000"
            - "Invoice.${inv}.final_amount_cents - Invoice.${inv}.provisional_amount_cents == 55000 (variants diverge on identical acreage)"

      - name: applicator_rolling_vs_lifetime_score
        grounds:
          - calculations.applicator_compliance_score
          - entities.Applicator.fields.rolling_score_365
          - entities.Applicator.fields.penalty_points_lifetime
        distinguishing_aspect: |
          Applicator-domain dual variant (different entity domain than the
          invoice variant): the same two MINOR substantiations inside 90 days
          yield rolling_score_365 == 8 (recency doubler applied) but
          penalty_points_lifetime == 4 (no window, no multiplier).
        test_recipe:
          setup:
            - "Base fixture; WO_A and WO_B both COMPLETED by AP1 (2026-05-10 and 2026-05-13 windows, REI respected); two MINOR complaints filed, investigated, substantiated on the same logical day"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/customers", payload: { name: "Neighbor Ned", billing_email: "n@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 100000 }, as: CoopAdmin, captures: { c2_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "North 40", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { name: "FungiStop", epa_registration_no: "EPA-200-2", category: "FUNGICIDE", rei_hours: 48, max_wind_mph: 15, min_temp_f: 50, max_temp_f: 90, required_buffer_ft: 0, unit_cost_cents: 2500, markup_pct: 20 }, as: CoopAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 }, { product_id: "${p2}", rate_per_acre: 0.4 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann Applicator", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE", "FUNGICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 50 }, as: Grower, as_user_id: "${c_id}", captures: { wo_a: $.data.id } }
            - { call: "POST /api/work-orders/${wo_a}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/weather-observations", payload: { observed_at: "2026-05-10T07:30:00Z", wind_mph: 8, temp_f: 65, inversion_present: false }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: CoopAdmin }
            - { call: "POST /api/work-orders/${wo_a}/start", as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:30:00Z" }, as: CoopAdmin }
            - { call: "POST /api/work-orders/${wo_a}/complete", payload: { lines: [ { product_id: "${p1}", actual_rate_per_acre: 1.5 }, { product_id: "${p2}", actual_rate_per_acre: 0.4 } ] }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 50 }, as: Grower, as_user_id: "${c_id}", captures: { wo_b: $.data.id } }
            - { call: "POST /api/work-orders/${wo_b}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-13T08:00:00Z", scheduled_end: "2026-05-13T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/weather-observations", payload: { observed_at: "2026-05-13T07:30:00Z", wind_mph: 8, temp_f: 65, inversion_present: false }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T08:00:00Z" }, as: CoopAdmin }
            - { call: "POST /api/work-orders/${wo_b}/start", as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T10:30:00Z" }, as: CoopAdmin }
            - { call: "POST /api/work-orders/${wo_b}/complete", payload: { lines: [ { product_id: "${p1}", actual_rate_per_acre: 1.5 }, { product_id: "${p2}", actual_rate_per_acre: 0.4 } ] }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/drift-complaints", payload: { work_order_id: "${wo_a}", description: "Spray drift onto my bees", severity: "MINOR" }, as: Grower, as_user_id: "${c2_id}", captures: { cmp_a: $.data.id } }
            - { call: "POST /api/drift-complaints/${cmp_a}/open-investigation", as: ComplianceOfficer }
            - { call: "POST /api/drift-complaints", payload: { work_order_id: "${wo_b}", description: "Odor and residue on garden", severity: "MINOR" }, as: Grower, as_user_id: "${c2_id}", captures: { cmp_b: $.data.id } }
            - { call: "POST /api/drift-complaints/${cmp_b}/open-investigation", as: ComplianceOfficer }
          trigger:
            - { call: "POST /api/drift-complaints/${cmp_a}/substantiate", payload: { findings_note: "residue confirmed" }, as: ComplianceOfficer }
            - { call: "POST /api/drift-complaints/${cmp_b}/substantiate", payload: { findings_note: "residue confirmed" }, as: ComplianceOfficer }
            - { call: "GET /api/applicators/${ap}", as: CoopAdmin, captures: { ap_roll: $.data.rolling_score_365, ap_life: $.data.penalty_points_lifetime, ap_status: $.data.status } }
          assert:
            - "Applicator.${ap}.rolling_score_365 == 8 ((2+2) * 2 recency doubler: two substantiations within 90 days)"
            - "Applicator.${ap}.penalty_points_lifetime == 4 (2 + 2, no window, no multiplier — variant divergence 8 != 4)"
            - "Applicator.${ap}.status == SUSPENDED (8 < REVOKE_THRESHOLD 10)"

  # ------------------------------------------------------------- rule 2 -----
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_per_line_rounding_order
        grounds:
          - calculations.invoice_amount
          - entities.WorkOrder.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line round_half_up
          THEN sum. With 10 acres, service 1000c/acre, P3 (1001c, 0%) @0.25 and
          P4 (999c, 0%) @0.25 the pinned order yields 10000 + 2503 + 2498 =
          15001, while sum-then-round would yield 15000 — a one-cent divergence.
        test_recipe:
          setup:
            - "Customer rate 1000c/acre; field 10 acres; products P3 (unit_cost 1001, markup 0) and P4 (unit_cost 999, markup 0); prescription lines P3@0.25, P4@0.25 APPROVED; applicator + calibrated equipment; work order for 10 acres"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Round Farm", billing_email: "r@farm.test", rate_per_acre_cents: 1000, credit_limit_cents: 1000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "West 10", crop: "SOY", acres: 10, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "P3", epa_registration_no: "EPA-300-3", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 0, unit_cost_cents: 1001, markup_pct: 0 }, as: CoopAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/products", payload: { name: "P4", epa_registration_no: "EPA-400-4", category: "FUNGICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 0, unit_cost_cents: 999, markup_pct: 0 }, as: CoopAdmin, captures: { p4: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 10, lines: [ { product_id: "${p3}", rate_per_acre: 0.25 }, { product_id: "${p4}", rate_per_acre: 0.25 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE", "FUNGICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 10 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
          trigger:
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher, captures: { est: $.data.estimated_total_cents } }
          assert:
            - "WorkOrder.${wo}.estimated_total_cents == 15001 (per-line round_half_up: 10000 + round(2502.5)=2503 + round(2497.5)=2498)"
            - "WorkOrder.${wo}.estimated_total_cents != 15000 (sum-then-round would give 10000 + round(5000.0); the pinned order must win)"

      - name: mix_envelope_nested_min_max
        grounds:
          - calculations.mix_weather_envelope
          - state_machines.WorkOrder.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: |
          Mode (a) >=3 inputs with nested min/max: effective wind cap is
          min(10,15)=10 and effective low temp is max(40,50)=50 across the
          two-product mix. Wind 12 (legal for P2 alone) and temp 45 (legal for
          P1 alone) must BOTH be rejected, proving the nested min/max picks the
          tightest bound per axis.
        test_recipe:
          setup:
            - "Base fixture with RX1 (P1 wind<=10/temp 40-85, P2 wind<=15/temp 50-90); WO1 SCHEDULED 2026-05-10 08:00-11:00Z; clock 2026-05-10T08:00:00Z"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "North 40", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { name: "FungiStop", epa_registration_no: "EPA-200-2", category: "FUNGICIDE", rei_hours: 48, max_wind_mph: 15, min_temp_f: 50, max_temp_f: 90, required_buffer_ft: 0, unit_cost_cents: 2500, markup_pct: 20 }, as: CoopAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 }, { product_id: "${p2}", rate_per_acre: 0.4 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE", "FUNGICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: CoopAdmin }
          trigger:
            - { call: "POST /api/weather-observations", payload: { observed_at: "2026-05-10T07:30:00Z", wind_mph: 12, temp_f: 65, inversion_present: false }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders/${wo}/start", as: Applicator, as_user_id: "${ap}", captures: { err_wind: $.data.error_id } }
            - { call: "POST /api/weather-observations", payload: { observed_at: "2026-05-10T07:45:00Z", wind_mph: 8, temp_f: 45, inversion_present: false }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders/${wo}/start", as: Applicator, as_user_id: "${ap}", captures: { err_temp: $.data.error_id } }
          assert:
            - "trigger[1] error == ERR_WEATHER_WINDOW_VIOLATION (wind 12 > min(10,15)=10 even though 12 <= 15 is legal for P2 alone)"
            - "trigger[3] error == ERR_WEATHER_WINDOW_VIOLATION (temp 45 < max(40,50)=50 even though 45 >= 40 is legal for P1 alone)"
            - "WorkOrder.${wo}.status == SCHEDULED (both starts rejected)"

  # ------------------------------------------------------------- rule 3 -----
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_weather_hold_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_WEATHER_HOLD
          - state_machines.WorkOrder.WEATHER_HOLD_to_IN_PROGRESS
        distinguishing_aspect: |
          WorkOrder machine is cyclic: IN_PROGRESS -> WEATHER_HOLD (automatic on
          a violating weather observation) -> IN_PROGRESS (resume) — a live
          revert loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Base fixture; WO1 SCHEDULED 2026-05-10 08:00-11:00Z; fresh passing observation; started at 08:00"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
