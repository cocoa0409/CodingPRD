          - errors[ERR_COUNSELOR_INACTIVE]
        distinguishing_aspect: |
          Entity pair CallSession -> Counselor: the session's ASSIGNED->ACTIVE
          transition re-reads the assigned counselor's status at start time;
          suspending the counselor between assignment and start blocks the
          transition with ERR_COUNSELOR_INACTIVE even though the assignment
