  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payable_constraint_vs_fiscal_on_accrual_constraint_wins
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - state_machines.Claim.transitions.APPROVED_to_SUSPENDED
        distinguishing_aspect: |
          A BENEFIT_EXHAUSTED claim (business_constraint, priority 10 ERR_CLAIM_NOT_PAYABLE) whose further
          accrual would also exceed benefit_period_months (business_fiscal, priority 12
          ERR_BENEFIT_PERIOD_WOULD_EXCEED): the higher-priority payable check wins -> ERR_CLAIM_NOT_PAYABLE.
          Pair: business_constraint vs business_fiscal.
        test_recipe:
          setup:
            - "Insurer at month 6; ACTIVE ANY_OCC TOTAL policy, benefit_period_months 1, monthly_benefit_cents 500000, elimination 90d (elim_sat=3, next_proof_due 6 after approval)."
            - "Approved TOTAL claim; ONE BenefitPeriod accrued at coverage_month 3 -> benefit_months_consumed 1.0, which equals the cap and auto-transitions the claim to BENEFIT_EXHAUSTED."
            - "A second accrual at coverage_month 4 violates both checks at once: (a) the payable check (claim is BENEFIT_EXHAUSTED, not APPROVED) and (b) the would-exceed fiscal check (consumed 1.0 + 1.0 = 2.0 > 1)."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "PV1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 6 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
