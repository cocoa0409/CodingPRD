      - name: a_studio_owner_cannot_issue_a_portability_export
        claim_type: RBAC denial
        grounds:
          - roles.PlatformAdmin
          - errors.ERR_UNAUTHORIZED_ROLE
          - endpoints.POST_/wellness/portability-requests/{id}/issue-export
        distinguishing_aspect: "Export issuing is PlatformAdmin-exclusive even though the studio owns the roster, which is exactly the data-ownership tension the scenario describes: the same identity that released the record may not hand it over."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio and one client with a clear balance and a granted portability release."
          setup_api_calls:
            - *g_tier_growth
            - *g_clock_jun
            - *g_studio_ok
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_ok_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CO" }
              as: Client
              captures: { maya_ok_id: $.data.id }
            - call: "POST /wellness/portability-requests"
              payload: { studio_id: "${studio_ok_id}", requesting_client_id: "${maya_ok_id}", dispute_reason: "relocating" }
              as: Client
              as_user_id: "${maya_ok_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /wellness/portability-requests/${pr_id}/resolve-release"
              payload: { include_booking_history: true, include_financial_history: false }
              as: StudioOwner
              as_user_id: "${studio_ok_id}"
              captures: { pr_v: $.data.version }
          trigger:
            - call: "POST /wellness/portability-requests/${pr_id}/issue-export"
              payload: { expected_portability_request_version: "${pr_v}" }
              as: StudioOwner
              as_user_id: "${studio_ok_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED_ROLE"
            - "ClientPortabilityRequest.${pr_id}.status is still RESOLVED_RELEASE with export_manifest populated"
            - "the identical call as PlatformAdmin succeeds and moves the row to EXPORT_ISSUED"

      - name: an_anonymous_reader_cannot_read_a_studio_roster
        claim_type: RBAC denial
        grounds:
          - roles.Anonymous
          - endpoints.GET_/wellness/clients
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Anonymous holds only the tier catalog and the marketplace collection, so the roster read — the very list a studio's ownership is asserted over — is refused to an unauthenticated caller."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with one client."
          setup_api_calls:
            - *g_tier_growth
            - *g_clock_jun
            - *g_studio_ok
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_ok_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CO" }
              as: Client
              captures: { maya_ok_id: $.data.id }
          trigger:
            - call: "GET /wellness/clients"
              payload: { home_studio_id: "${studio_ok_id}" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
            - call: "GET /wellness/subscription-tiers"
              payload: {}
              as: Anonymous
          assert:
            - "the roster read is refused with 403 and error_id == ERR_UNAUTHORIZED_ROLE"
            - "the tier catalog read succeeds for the same identity, returning the GROWTH tier"
            - "GET /wellness/marketplace/classes succeeds for Anonymous, so the marketplace collection is the one list an unauthenticated caller may read"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: class_pack_create_with_a_stale_client_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pack-create-stale-client]
          - errors.ERR_STALE_VERSION
          - entities.Client.fields.version
          - endpoints.POST_/wellness/class-packs
        distinguishing_aspect: "The loser is rejected on a stale expected_client_version rather than on overlapping requests: the client's version is advanced by an intervening legitimate write, so the same create is refused with 412 once and admitted once."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with one client holding a single pack."
          setup_api_calls:
            - &h_tier_growth
              call: "POST /wellness/subscription-tiers"
              payload: { tier: "GROWTH", monthly_fee_cents: 9900, tier_rank: 2, included_staff_seats: 4, seat_overage_fee_cents: 1900, marketplace_listing_enabled: true, staff_payroll_enabled: true, instructor_substitution_enabled: true, waitlist_auto_promotion_enabled: true, crm_client_export_enabled: true, marketplace_commission_bps: 1500 }
              as: PlatformAdmin
            - &h_clock_jun
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: OperatorOnly
            - &h_studio
              call: "POST /wellness/studios"
              payload: { legal_name: "Stillwater Studio", home_state_code: "CO", owner_full_name: "Rue Bennet", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, sub_id: $.data.subscription_id }
            - &h_sub_read
              call: "GET /wellness/subscriptions/${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v: $.data.version }
            - &h_maya
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CO" }
              as: Client
              captures: { maya_id: $.data.id, maya_v: $.data.version }
            - call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", pack_size: 5, purchased_at: "2026-06-01T00:00:00Z", expiry_scheme: "NONE", expected_client_version: "${maya_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pack_1_id: $.data.id, maya_v_after: $.data.version }
          trigger:
            - call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", pack_size: 5, purchased_at: "2026-06-02T00:00:00Z", expiry_scheme: "NONE", expected_client_version: "${maya_v_after}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pack_2_id: $.data.id, maya_v_final: $.data.version }
            - call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", pack_size: 5, purchased_at: "2026-06-03T00:00:00Z", expiry_scheme: "NONE", expected_client_version: "${maya_v_after}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first create succeeds and advances Client.${maya_id}.version past ${maya_v_after}"
            - "the second create, still carrying the pre-write version, is refused with 412 and error_id == ERR_STALE_VERSION"
            - "GET /wellness/class-packs?client_id=${maya_id} returns exactly 2 rows, so the stale write created nothing"
            - "the successful create's response carries the client version the caller must present next time"

      - name: class_session_create_with_a_stale_subscription_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[session-create-stale-subscription]
          - errors.ERR_STALE_VERSION
          - entities.BusinessSubscription.fields.version
          - endpoints.POST_/wellness/class-sessions
        distinguishing_aspect: "The guarded parent is the subscription rather than the client, and the intervening write is a renewal advance, so the session create is refused on the tier snapshot the studio had before the advance."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, template and instructor; the renewal clock is then advanced so the subscription version moves."
          setup_api_calls:
            - *h_tier_growth
            - *h_clock_jun
            - *h_studio
            - call: "GET /wellness/subscriptions/${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v: $.data.version }
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Rai Sorenson", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { rai_id: $.data.id }
          trigger:
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${rai_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id, sub_v_after: $.data.version }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${rai_id}", room_code: "ROOM-B", start_at: "2026-06-21T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
