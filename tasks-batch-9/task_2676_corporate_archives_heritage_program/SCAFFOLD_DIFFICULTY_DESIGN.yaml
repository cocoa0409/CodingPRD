              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "CORR-BOX-2", unit_count: 3, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "CONFIDENTIAL" }
