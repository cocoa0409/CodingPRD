          Pairs a `state` category check (order 12) against a `business_fiscal` check (order 48) —
          the widest gap available in the validation ladder. One request violates both; the lower
          order number must win. The instance also proves the ladder is real rather than incidental by
          firing the fiscal error on its own first (while the stop is still ON_SALE) and only then
          closing sales so the same request flips to the state error.
