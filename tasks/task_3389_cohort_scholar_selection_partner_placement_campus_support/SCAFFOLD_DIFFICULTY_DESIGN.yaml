# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_3389: Cohort Scholar Selection, Partner Placement & Campus Support
# 9 rules x 2 instances = 18 instances. Every call replays against SCAFFOLD.yaml
# §1.5 exactly (method, path, role, input fields). Logical clock boots at
# 2026-09-01T00:00:00Z; the standard fixture window is cycle "2027" with
# nomination window 2026-09-01..2026-11-30 (default clock is inside it).
# Standard passing evaluation block per nominee per round: two assessors
# (assessor-a, assessor-b) each scoring (90,90,90) -> weighted 900 >= every
# cutoff; round scores are therefore 600/700/800-gate clean.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cohort_fill_projection_provisional_vs_final
        grounds:
          - calculations.cohort_fill_projection
          - calculations.cohort_seat_ledger
          - entities.Cohort.fields.projected_fill_provisional
          - entities.Cohort.fields.projected_fill_final
        distinguishing_aspect: |
          Cohort-domain dual variant: one identical ledger state (1 ACCEPTED offer,
          2 OFFERED offers, size 3) yields projected_fill_provisional == 3 (pending
          offers weighted at 7500 bps, round_half_up(2*0.75)=2) while
          projected_fill_final == 1 (pending offers count as zero). The sibling
          dual variant (partner_outcomes_census_vs_rolling_divergence) lives on
          PartnerCollege — different entity domain.
        test_recipe:
          setup:
            - "Cohort size 3 in FORMING; three nominees SELECTED; offers O1,O2,O3 created (outstanding 3, remaining 0); O1 accepted (committed 1, outstanding 2, still FORMING)"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 20 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/partner-colleges", payload: { name: "Elm College" }, as: ProgramAdmin, captures: { coll: $.data.id, collv: $.data.version } }
            - { call: "POST /api/partner-agreements", payload: { partner_college_id: "${coll}", admissions_cycle: "2027", cohort_size: 3, tuition_annual_cents: 6123460, expected_college_version: "${collv}" }, as: ProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /api/partner-agreements/${agr}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/mentors", payload: { partner_college_id: "${coll}", full_name: "Prof Elm" }, as: ProgramAdmin, captures: { men: $.data.id } }
            - { call: "POST /api/cohorts", payload: { agreement_id: "${agr}", city_program_id: "${cp}", mentor_id: "${men}" }, as: ProgramAdmin, captures: { coh: $.data.id } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One", nominator_id: "${np}" }, as: ProgramAdmin, captures: { n1: $.data.id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 3, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
