            - "trigger call 5 returns HTTP 200 with schedule_status == \"IN_ROOM\", checked_in_at == \"2026-09-14T14:00:00.000Z\" and blocking_reason_codes == []"
            - "an implementation that gates check-in only on ScopeAsset.status accepts trigger call 1 and fails it"

      - name: ce_schedule_blocked_by_room_accreditation
        grounds:
          - validations[priority=42]
          - validations[priority=43]
          - entities.ProcedureRoom.fields.accreditation_expires_on
          - entities.Provider.fields.ultrasound_accreditation_expires_on
          - endpoints[PATCH /urology/procedure-rooms/{id}]
          - endpoints[PATCH /urology/providers/{id}]
        distinguishing_aspect: |
          The mutation's legality depends on date state held by TWO other entities,
          and the dependency is ORDERED: with both the room's and the provider's
          accreditation expired the room rule at priority 42 answers first; only
          after the room is renewed does the provider rule at priority 43 surface;
          only after both are renewed does the schedule succeed. The whole rule is
          also conditional on the room's room_type being URODYNAMICS_LAB, so a
          CYSTO_SUITE control case is asserted to prove the gate is type-scoped.
          The other cross-entity instance depends on one entity and a null check.
