      - name: societal_credit_balance_recomputed_from_approved_changes
        claim_type: cross_entity_integrity
        grounds:
          - calculations.sponsoring_society_credit_balance
          - entities.CodeChange.fields.society_id
          - entities.SpecialtySociety.fields.cea_credit_balance
        distinguishing_aspect: |
          A change whose determination is not APPROVED contributes nothing, so
