  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: transmittal_state_beats_electronic_channel_rejected
        grounds:
          - validations[priority=20]
          - validations[priority=43]
          - errors[ERR_TRANSMITTAL_NOT_BUILT]
          - errors[ERR_ELECTRONIC_FILING_REQUIRED]
        distinguishing_aspect: |
          Category pair (state, business_constraint): a second transmit of an already
          TRANSMITTED submission with channel PAPER violates priority 20
          (ERR_TRANSMITTAL_NOT_BUILT) and priority 43 (ERR_ELECTRONIC_FILING_REQUIRED,
          since required_channel is ELECTRONIC) at once, and the state rule wins.
        test_recipe:
          setup:
            - "FilingSeason 2026 OPEN with electronic_filing_threshold 2; ControlledGroup DETERMINED_ALE; GroupMember with measurement_method MONTHLY; one employee with an ORIGINAL Form1095C."
            - "Transmittal T1 holds that one form, so its build produced aggregate_return_count 2 and required_channel ELECTRONIC."
            - "T1 was transmitted ELECTRONIC by agent-1, so its status is TRANSMITTED while required_channel is still ELECTRONIC."
          setup_api_calls:
            - call: "POST /ale-reporting/filing-seasons"
              payload: { tax_year: 2026, furnishing_deadline_date: "2027-03-02", filing_deadline_date: "2027-03-31", tier2_cutoff_date: "2027-08-01", electronic_filing_threshold: 2 }
              as: ComplianceOfficer
              captures: { season_id: $.data.id }
            - call: "POST /ale-reporting/controlled-groups"
              payload: { filing_season_id: "${season_id}", name: "Priority Pair A Group" }
              as: ComplianceOfficer
              captures: { group_id: $.data.id, group_v1: $.data.version }
            - call: "POST /ale-reporting/group-members"
              payload: { controlled_group_id: "${group_id}", ein: "121212121", legal_name: "Priority Pair A Co", ownership_pct: 100, measurement_method: "MONTHLY" }
