              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { po_id: $.data.id, fee: $.data.admin_fee_cents, total: $.data.total_cost_cents }
          assert:
            - "PurchaseOrder.${po_id}.ordered_qty == 21"
            - "PurchaseOrder.${po_id}.line_subtotal_cents == 3675"
            - "PurchaseOrder.${po_id}.admin_fee_cents == 329"
            - "PurchaseOrder.${po_id}.total_cost_cents == 4004"

      - name: purchase_fee_tier_keyed_on_subtotal_not_total_mode_c
        grounds:
          - calculations.purchase_order_costing
          - entities.PurchaseOrder.fields.line_subtotal_cents
          - entities.PurchaseOrder.fields.admin_fee_cents
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency with a pinned evaluation order — the
          fee tier is read off line_subtotal_cents 50000 (exactly at ADMIN_TIER_1_CENTS,
          rate 0.09, fee 4500, total 54500); reading the tier off the resulting total
          54500 would drop to rate 0.07 and produce 3500 and 53500.
        test_recipe:
