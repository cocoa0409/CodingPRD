# =============================================================================
# PRD Benchmark Seed Tables — Wire & Cable Distribution with Cut-to-Length Reel
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#            §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  design task harder than expert level: 2126. Wire & Cable Distribution with Cut-to-Length Reel
  (Anixter/WESCO): reel inventory & remnant management, cut charge & minimum length rules, copper
  price index pass-through & daily quote validity, paralleling/put-up spec, reel deposit & return
  credit, jobsite delivery & reel handling, non-returnable cut item, allocation on shortage

domain_name: wire-cable-distribution
api_prefix: ""    # flat topology: every collection is a peer resource at the root

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections joined by foreign keys (`/reels`, `/quotes`, `/allocations`, …).
  # Only two nested creation paths exist (`/quotes/{id}/lines`, `/customers/{id}/credit-adjustments`);
  # everything else is addressed by its own id, and every read is a filtered peer list.

  state_machine_shape: parallel
  # SalesOrder carries two independent axes (fulfillment_status x billing_status);
  # Reel is cyclic (IN_STOCK -> ALLOCATED_PARTIAL -> IN_STOCK, IN_STOCK -> ON_JOBSITE -> IN_STOCK);
  # Allocation is branching (RESERVED -> COMMITTED by two triggers with disjoint side-effect sets);
  # Quote is cyclic (DRAFT -> ISSUED -> DRAFT via reprice).

  relationship_patterns:
    - one_to_many        # Quote -> QuoteLine, SalesOrder -> OrderLine, OrderLine -> Allocation
    - self_referential   # Reel.parent_reel_id: a remnant points at the reel it was cut from
    - cross_aggregate    # Allocation binds an OrderLine (order aggregate) to a Reel (inventory aggregate)
    - polymorphic: false

  role_model: segregation_of_duties
  # A SalesRep may not issue a quote they authored once its line subtotal reaches
  # SOD_REVIEW_THRESHOLD_CENTS; BranchOps is bound to its own branch; Driver to its own truck.

  consistency_model: immediate

difficulty_level: expert_plus
# The scenario explicitly asks for a design HARDER THAN EXPERT LEVEL. Adjudication:
# entity count (12) sits at the middle of the Expert band, but endpoint count (42),
# error count (47), calculation count (8) and state-machine count (6, of which 4 are
# non-linear) sit above it. The extra surface is spent on coupling density -- reel
# lineage, copper index pass-through, credit posture, and delivery all feed each other --
# not on additional CRUD tables.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Distribution branch display name.
      - name: region_code
        type: string
        source: input
        description: Two-letter region code used for reporting only.
      - name: concurrent_cut_capacity
        type: integer
        source: input
        default: 1
        description: How many buffered cut windows may overlap on this branch's cut floor.
        constraints: ">= 1"
      - name: delivery_surcharge_cents
        type: integer
        source: input
        default: 0
        description: Flat per-run surcharge added to gross freight for runs out of this branch.
        constraints: ">= 0"
      - name: scrap_ft_ytd
        type: number
        source: computed
        default: 0
        description: Running total of footage written off as scrap by cuts executed at this branch.

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Customer (contractor) legal name.
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum open balance the customer may carry.
        constraints: ">= 0"
      - name: open_balance_cents
        type: integer
        source: computed
        default: 0
        description: Invoiced order value plus outstanding reel deposits, net of credits issued.
      - name: deposit_liability_cents
        type: integer
        source: computed
        default: 0
        description: Sum of reel_deposit_cents for every returnable reel currently ON_JOBSITE with this customer.
      - name: available_credit_cents
        type: integer
        source: computed
        description: "Derived: credit_limit_cents - open_balance_cents. May go negative."
      - name: credit_status
        type: enum
        source: computed
        default: ACTIVE
        description: Credit posture gating quote conversion and order allocation.
        constraints: "ACTIVE | CREDIT_HOLD"

  - name: CableProduct
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        description: Catalog part number, unique across the catalog.
      - name: conductor_metal
        type: enum
        source: input
        description: Conductor metal, decides whether the copper index pass-through applies.
        constraints: "COPPER | ALUMINUM"
      - name: copper_lbs_per_1000ft
        type: number
        source: input
        default: 0
        description: Pounds of copper per 1000 ft of conductor. MUST be 0 when conductor_metal is ALUMINUM.
        constraints: ">= 0"
      - name: base_price_cents_per_ft
        type: integer
        source: input
        description: Non-metal component of price, in whole cents per foot.
        constraints: ">= 0"
      - name: min_cut_length_ft
        type: integer
        source: input
        description: Billing minimum for a cut; a shorter request is billed at this length. Also the remnant-viability floor.
        constraints: ">= 25 (ABSOLUTE_MIN_CUT_FT)"
      - name: cut_charge_cents
        type: integer
        source: input
        description: Base cut charge per conductor before tier selection.
        constraints: ">= 0"
      - name: reel_deposit_cents
        type: integer
        source: input
        description: Refundable deposit charged per returnable master reel shipped.
        constraints: ">= 0"
      - name: master_reel_length_ft
        type: integer
        source: input
        description: Standard master put-up length for this part.
        constraints: "> 0"
      - name: reel_weight_lbs
        type: number
        source: input
        description: Gross weight of one full master reel; drives jobsite reel handling.
        constraints: "> 0"
      - name: allowed_put_ups
        type: array
        source: input
        description: Put-up specs that may be quoted for this part.
        constraints: "non-empty subset of [MASTER_REEL, CUT]"

  - name: CopperIndexEntry
    parent: null
    common_fields: false
    fields:
      - name: effective_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD, UTC) this published index price takes effect. Unique across entries.
      - name: price_cents_per_lb
        type: integer
        source: input
        description: Published COMEX copper settlement in whole cents per pound.
        constraints: "> 0"
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlatformAdmin that published this entry.
      - name: voided_quote_count
        type: integer
        source: computed
        default: 0
        description: Number of ISSUED quotes this publication voided for index shock; frozen after publication.

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: FK -> Branch.id; the branch this truck is domiciled at.
      - name: truck_code
        type: string
        source: input
        description: Fleet code shown on the run sheet.
      - name: has_boom_lift
        type: boolean
        source: input
        default: false
        description: Whether the truck carries a boom lift for unassisted heavy-reel offload.
      - name: max_reel_slots
        type: integer
        source: input
        default: 6
        description: Physical reel slots on the deck.
        constraints: ">= 1"

  - name: Reel
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: FK -> CableProduct.id; what is wound on this reel.
      - name: branch_id
        type: string
        source: input
        description: FK -> Branch.id; where this reel physically sits while IN_STOCK.
      - name: parent_reel_id
        type: string
        source: system
        default: null
        description: FK -> Reel.id; set only on REMNANT reels, pointing at the reel the remnant was cut from. Null on received master reels.
      - name: reel_type
        type: enum
        source: system
        default: MASTER
        description: MASTER for reels received into stock, REMNANT for reels spawned by a cut.
        constraints: "MASTER | REMNANT"
      - name: lot_code
        type: string
        source: input
        description: Mill lot identifier. Conductors of one paralleled set must share a lot_code.
      - name: nominal_length_ft
        type: number
        source: input
        description: Footage on the reel when it entered stock. Never mutated.
        constraints: "> 0"
      - name: current_length_ft
        type: number
        source: computed
        description: Footage physically remaining. Initialised to nominal_length_ft.
      - name: allocated_length_ft
        type: number
        source: computed
        default: 0
        description: Footage held by Allocation rows in status RESERVED against this reel.
      - name: available_length_ft
        type: number
        source: computed
        description: "Derived: current_length_ft - allocated_length_ft."
      - name: scrap_ft
        type: number
        source: computed
        default: 0
        description: Footage written off when the post-cut remainder fell below the product's min_cut_length_ft.
      - name: status
        type: enum
        source: computed
        default: IN_STOCK
        description: Inventory lifecycle state.
        constraints: "IN_STOCK | ALLOCATED_PARTIAL | ON_JOBSITE | DEPLETED | SCRAPPED"
      - name: delivered_sales_order_id
        type: string
        source: computed
        default: null
        description: "FK -> SalesOrder.id; set when the reel is picked whole and delivered. It is the permanent shipment record and is NOT cleared on return -- reel.status is what says whether the reel is still out."
      - name: delivered_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the reel left on a delivered run.

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; who the quote is for.
      - name: branch_id
        type: string
        source: input
        description: FK -> Branch.id; the shipping branch, fixing freight surcharge and reel pool.
      - name: copper_index_entry_id
        type: string
        source: computed
        default: null
        description: FK -> CopperIndexEntry.id; the index pinned at issue time. Null while DRAFT.
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the SalesRep that created the quote.
      - name: issued_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the SalesRep that issued the quote.
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Quote lifecycle state.
        constraints: "DRAFT | ISSUED | CONVERTED | EXPIRED | VOIDED"
      - name: issued_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of issue.
      - name: valid_until
        type: datetime
        source: computed
        default: null
        description: "issued_at + QUOTE_VALIDITY_HOURS. Inclusive upper bound."
      - name: void_reason
        type: enum
        source: computed
        default: null
        description: Why the quote was voided.
        constraints: "INDEX_SHOCK | CREDIT_HOLD"
      - name: line_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: Sum of QuoteLine.quoted_extended_cents over this quote's lines.
      - name: physical_reel_count
        type: integer
        source: computed
        default: 0
        description: Sum of QuoteLine.reel_count * QuoteLine.parallel_set_size over this quote's lines.
      - name: gross_freight_cents
        type: integer
        source: computed
        default: 0
        description: Freight before the free-freight waiver test.
      - name: rebate_pct
        type: number
        source: computed
        default: 0
        description: Volume rebate rate selected from the tier table.
      - name: rebate_cents
        type: integer
        source: computed
        default: 0
        description: Volume rebate in whole cents.
      - name: freight_cents
        type: integer
        source: computed
        default: 0
        description: Freight actually billed, after the free-freight waiver test.
      - name: quoted_total_cents
        type: integer
        source: computed
        default: 0
        description: "line_subtotal_cents + freight_cents - rebate_cents."
      - name: deposit_quoted_cents
        type: integer
        source: computed
        default: 0
        description: Sum of QuoteLine.deposit_cents_total; refundable, excluded from quoted_total_cents.

  - name: QuoteLine
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: FK -> Quote.id; the quote this line belongs to.
      - name: product_id
        type: string
        source: input
        description: FK -> CableProduct.id; the part being quoted.
      - name: line_number
        type: integer
        source: computed
        description: 1-based position assigned in creation order within the quote.
      - name: put_up
        type: enum
        source: input
        description: Put-up spec requested for this line.
        constraints: "MASTER_REEL | CUT"
      - name: requested_length_ft
        type: number
        source: input
        description: Footage per conductor the customer asked for.
        constraints: "> 0"
      - name: parallel_set_size
        type: integer
        source: input
        default: 1
        description: Number of paralleled conductors making up this circuit (a NEC paralleled conductor set). Values above 1 force the same-lot, whole-conductor rule.
        constraints: ">= 1 and <= 4"
      - name: billable_length_ft
        type: number
        source: computed
        description: Per-conductor billed footage after the minimum-length and master put-up rounding rules.
      - name: reel_count
        type: integer
        source: computed
        description: Master reels per conductor (MASTER_REEL put-up) or 1 disposable shipping reel (CUT put-up).
      - name: copper_adder_cents_per_ft
        type: number
        source: computed
        description: Copper pass-through per foot at 4 decimal places, unrounded.
      - name: metal_cents
        type: integer
        source: computed
        description: Copper pass-through for the whole line, rounded HALF_UP to whole cents exactly once.
      - name: base_cents
        type: integer
        source: computed
        description: "base_price_cents_per_ft * billable_length_ft * parallel_set_size."
      - name: cut_charge_cents_total
        type: integer
        source: computed
        description: Tiered cut charge times parallel_set_size; 0 for MASTER_REEL put-up.
      - name: deposit_cents_total
        type: integer
        source: computed
        description: "reel_deposit_cents * reel_count * parallel_set_size for MASTER_REEL put-up; 0 for CUT."
      - name: quoted_extended_cents
        type: integer
        source: computed
        description: "base_cents + metal_cents + cut_charge_cents_total. Deposit excluded."

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: FK -> Quote.id; the quote this order was converted from.
      - name: customer_id
        type: string
        source: computed
        description: FK -> Customer.id; copied from the quote at conversion.
      - name: branch_id
        type: string
        source: computed
        description: FK -> Branch.id; copied from the quote at conversion.
      - name: fulfillment_status
        type: enum
        source: computed
        default: PENDING_ALLOCATION
        description: Physical fulfilment axis; evolves independently of billing_status.
        constraints: "PENDING_ALLOCATION | PARTIALLY_ALLOCATED | ALLOCATED | STAGED | DELIVERED | HELD | CANCELLED"
      - name: billing_status
        type: enum
        source: computed
        default: UNBILLED
        description: Money axis; evolves independently of fulfillment_status.
        constraints: "UNBILLED | INVOICED | CREDITED | VOIDED"
      - name: allocation_policy
        type: enum
        source: computed
        default: MINIMIZE_REMNANT
        description: Policy used by the most recent allocation run on this order.
        constraints: "MINIMIZE_REMNANT | FEWEST_REELS"
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: Sum of OrderLine.quoted_extended_cents, copied from the quote at conversion.
      - name: freight_cents
        type: integer
        source: computed
        description: Freight billed, copied from the quote at conversion.
      - name: rebate_cents
        type: integer
        source: computed
        description: Volume rebate, copied from the quote at conversion.
      - name: quoted_total_cents
        type: integer
        source: computed
        description: Quote-time order total, frozen at conversion.
      - name: invoiced_total_cents
        type: integer
        source: computed
        default: null
        description: Order total recomputed under the INVOICED pricing variant at delivery.
      - name: metal_variance_cents
        type: integer
        source: computed
        default: null
        description: "Sum over lines of (invoiced_extended_cents - quoted_extended_cents)."
      - name: deposit_charged_cents
        type: integer
        source: computed
        default: 0
        description: Reel deposits charged when the order was delivered.
      - name: deposit_credited_cents
        type: integer
        source: computed
        default: 0
        description: Reel deposit credits issued back on returns against this order.
      - name: delivered_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the delivery run completed.

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: computed
        description: FK -> SalesOrder.id; the order this line belongs to.
      - name: product_id
        type: string
        source: computed
        description: FK -> CableProduct.id; copied from the quote line.
      - name: line_number
        type: integer
        source: computed
        description: Copied from the quote line; fixes allocation processing order.
      - name: put_up
        type: enum
        source: computed
        description: Copied from the quote line.
        constraints: "MASTER_REEL | CUT"
      - name: requested_length_ft
        type: number
        source: computed
        description: Copied from the quote line.
      - name: parallel_set_size
        type: integer
        source: computed
        description: Copied from the quote line.
      - name: billable_length_ft
        type: number
        source: computed
        description: Copied from the quote line; the per-conductor footage that must be allocated.
      - name: required_length_ft
        type: number
        source: computed
        description: "billable_length_ft * parallel_set_size."
      - name: allocated_length_ft
        type: number
        source: computed
        default: 0
        description: Sum of Allocation.length_ft in status RESERVED or COMMITTED or CONSUMED for this line.
      - name: allocation_status
        type: enum
        source: computed
        default: UNALLOCATED
        description: Whether this line's footage demand is met.
        constraints: "UNALLOCATED | SHORT | FULLY_ALLOCATED"
      - name: lot_code
        type: string
        source: computed
        default: null
        description: Mill lot pinned for a paralleled set; null when parallel_set_size == 1.
      - name: returnable
        type: boolean
        source: computed
        description: "Derived: put_up == MASTER_REEL. CUT lines ship on disposable reels and are non-returnable."
      - name: quoted_extended_cents
        type: integer
        source: computed
        description: Copied from the quote line at conversion.
      - name: invoiced_extended_cents
        type: integer
        source: computed
        default: null
        description: Line value recomputed under the INVOICED pricing variant at delivery.

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: computed
        description: FK -> OrderLine.id; the demand this allocation serves.
      - name: sales_order_id
        type: string
        source: computed
        description: FK -> SalesOrder.id; denormalised for filtering and cascade fan-out.
      - name: reel_id
        type: string
        source: computed
        description: FK -> Reel.id; the reel the footage is held on.
      - name: remnant_reel_id
        type: string
        source: computed
        default: null
        description: FK -> Reel.id; the REMNANT reel this allocation's cut spawned, if any.
      - name: sequence_no
        type: integer
        source: computed
        description: 1-based position of this allocation within its order line, in the order the allocator picked reels.
      - name: length_ft
        type: number
        source: computed
        description: Footage held on the reel by this allocation.
      - name: status
        type: enum
        source: computed
        default: RESERVED
        description: Allocation lifecycle state.
        constraints: "RESERVED | COMMITTED | RELEASED | CONSUMED"
      - name: commit_mode
        type: enum
        source: computed
        default: null
        description: Which commit branch was taken.
        constraints: "CUT | PICK"
      - name: cut_window_start
        type: datetime
        source: computed
        default: null
        description: Start of the cut-floor window this cut occupied.
      - name: cut_window_end
        type: datetime
        source: computed
        default: null
        description: End of the cut-floor window, before the cleanup buffer is appended.
      - name: cut_charge_applied_cents
        type: integer
        source: computed
        default: 0
        description: Per-conductor tiered cut charge confirmed when the cut executed.
      - name: scrap_ft
        type: number
        source: computed
        default: 0
        description: Footage this cut wrote off because the source reel's remainder fell below min_cut_length_ft.

  - name: DeliveryRun
    parent: null
    common_fields: true
    fields:
      - name: sales_order_id
        type: string
        source: input
        description: FK -> SalesOrder.id; the single order this run delivers.
      - name: truck_id
        type: string
        source: input
        description: FK -> Truck.id; the truck reserved for the window.
      - name: branch_id
        type: string
        source: computed
        description: FK -> Branch.id; copied from the order at creation.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the truck's occupation.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the truck's occupation.
      - name: jobsite_address
        type: string
        source: input
        description: Delivery address printed on the run sheet.
      - name: jobsite_has_forklift
        type: boolean
        source: input
        default: false
        description: Whether the jobsite provides its own forklift for offload.
      - name: heaviest_reel_lbs
        type: number
        source: computed
        description: Heaviest returnable reel on this run, from the order's PICK-committed allocations.
      - name: reel_handling
        type: enum
        source: computed
        description: Offload method derived from jobsite_has_forklift and heaviest_reel_lbs.
        constraints: "TAILGATE | BOOM_LIFT | FORKLIFT"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Run lifecycle state.
        constraints: "SCHEDULED | DISPATCHED | DELIVERED"
      - name: dispatched_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the driver dispatched.
      - name: delivered_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the driver completed the run.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Quote ---
  # Shape: cyclic (DRAFT -> ISSUED -> DRAFT via reprice) with three terminals.
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [EXPIRED, VOIDED]
    note: "CONVERTED is a settled state, not a terminal one: an index shock may still void a CONVERTED quote whose order has not yet been physically committed."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /quotes/{quoteId}/issue"
        actor: SalesRep
        preconditions:
          - "quote.status == DRAFT"
          - "the quote has at least one QuoteLine, else ERR_QUOTE_HAS_NO_LINES"
          - "at least one CopperIndexEntry exists with effective_date <= date(current_utc), else ERR_NO_COPPER_INDEX"
          - "if the line subtotal computed BY THIS request (the sum of quoted_extended_cents over the quote's lines under the index pinned in this same request) >= SOD_REVIEW_THRESHOLD_CENTS, then X-User-ID != quote.created_by_user_id, else ERR_SEGREGATION_OF_DUTIES. The stored quote.line_subtotal_cents is 0 while the quote is DRAFT, so the check MUST use the freshly computed value."
        side_effects:
          - "pins quote.copper_index_entry_id to the CopperIndexEntry with the greatest effective_date <= date(current_utc) (effective_date is unique, so no tie-break is needed)"
          - "recomputes every QuoteLine via calculations.quote_line_pricing variant QUOTED against the pinned index"
          - "recomputes quote.line_subtotal_cents, physical_reel_count, gross_freight_cents, rebate_pct, rebate_cents, freight_cents, quoted_total_cents, deposit_quoted_cents via calculations.order_money_rollup"
          - "sets quote.issued_at = current_utc and quote.valid_until = issued_at + QUOTE_VALIDITY_HOURS"
          - "sets quote.issued_by_user_id = X-User-ID"
          - "increments Quote.version by 1"
        note: "SoD only bites at or above the review threshold; below it a rep may self-issue."

      - from: ISSUED
        to: DRAFT
        trigger: "POST /quotes/{quoteId}/reprice"
        actor: SalesRep
        preconditions:
          - "quote.status == ISSUED"
        side_effects:
          - "clears quote.copper_index_entry_id, quote.issued_at, quote.valid_until, quote.issued_by_user_id to null"
          - "zeroes quote.line_subtotal_cents, gross_freight_cents, rebate_pct, rebate_cents, freight_cents, quoted_total_cents, deposit_quoted_cents and every QuoteLine money field"
          - "increments Quote.version by 1"
        note: "The revision cycle: a stale quote is reopened, re-lined if needed, and re-issued against the current index."

      - from: ISSUED
        to: CONVERTED
        trigger: "POST /quotes/{quoteId}/convert"
        actor: SalesRep
        preconditions:
          - "quote.status == ISSUED"
          - "current_utc <= quote.valid_until, else ERR_QUOTE_EXPIRED and the quote moves to EXPIRED"
          - "customer.credit_status == ACTIVE, else ERR_CUSTOMER_CREDIT_HOLD"
          - "customer.available_credit_cents >= quote.quoted_total_cents, else ERR_CREDIT_LIMIT_EXCEEDED"
        side_effects:
          - "creates one SalesOrder in fulfillment_status PENDING_ALLOCATION and billing_status UNBILLED, copying customer_id, branch_id, line_subtotal_cents, freight_cents, rebate_cents, quoted_total_cents"
          - "creates one OrderLine per QuoteLine, copying line_number, put_up, requested_length_ft, parallel_set_size, billable_length_ft, quoted_extended_cents, and setting required_length_ft = billable_length_ft * parallel_set_size and returnable = (put_up == MASTER_REEL)"
          - "increments Quote.version by 1"

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /quotes/{quoteId}/convert when current_utc > quote.valid_until (system, same request)"
        actor: system
        preconditions:
          - "quote.status == ISSUED"
          - "current_utc > quote.valid_until"
        side_effects:
          - "sets quote.status = EXPIRED"
          - "increments Quote.version by 1"
          - "the conversion request itself fails with ERR_QUOTE_EXPIRED (409); no SalesOrder is created"
        note: "Daily quote validity is enforced lazily on conversion, so expiry is observable without a background job."

      - from: ISSUED
        to: VOIDED
        trigger: "POST /copper-index-entries (system cascade, index shock)"
        actor: system
        preconditions:
          - "quote.status IN {ISSUED, CONVERTED}"
          - "when quote.status == CONVERTED, its SalesOrder must still be physically uncommitted, i.e. fulfillment_status IN {PENDING_ALLOCATION, PARTIALLY_ALLOCATED, HELD}; a CONVERTED quote whose order is ALLOCATED, STAGED, DELIVERED or CANCELLED keeps its pricing and is NOT voided"
          - "abs(new_entry.price_cents_per_lb - pinned_entry.price_cents_per_lb) / pinned_entry.price_cents_per_lb > COPPER_VOLATILITY_TOLERANCE_PCT"
          - "new_entry.effective_date > pinned_entry.effective_date"
          - "the quote's branch/customer are irrelevant; every ISSUED and eligible CONVERTED quote in the system is evaluated, in ascending Quote.created_at"
        side_effects:
          - "sets quote.status = VOIDED and quote.void_reason = INDEX_SHOCK"
          - "increments Quote.version by 1"
          - "increments the new CopperIndexEntry.voided_quote_count by 1"
          - "CASCADE LINK 2 -- because this quote became VOIDED, every SalesOrder with sales_order.quote_id == quote.id and fulfillment_status IN {PENDING_ALLOCATION, PARTIALLY_ALLOCATED, HELD} transitions to CANCELLED"
        note: "This is the only transition that fires from CONVERTED; it is what makes the index-shock cascade reach live orders."

      - from: ISSUED
        to: VOIDED
        trigger: "POST /delivery-runs/{runId}/deliver or POST /customers/{customerId}/credit-adjustments (system cascade, credit hold)"
        actor: system
        preconditions:
          - "quote.status == ISSUED"
          - "quote.customer_id == the Customer that just transitioned ACTIVE -> CREDIT_HOLD"
        side_effects:
          - "sets quote.status = VOIDED and quote.void_reason = CREDIT_HOLD"
          - "increments Quote.version by 1"

  # ----------------------------------------------------------- SalesOrder ---
  # Shape: parallel dimensions. fulfillment_status and billing_status are two
  # independent axes on one row; a transition on one axis never implies a
  # transition on the other except where explicitly listed below.
  - entity: SalesOrder
    dimension: fulfillment_status
    initial_state: PENDING_ALLOCATION
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PENDING_ALLOCATION
        to: ALLOCATED
        trigger: "POST /sales-orders/{orderId}/allocate"
        actor: BranchOps
        preconditions:
          - "order.fulfillment_status IN {PENDING_ALLOCATION, PARTIALLY_ALLOCATED}, else ERR_ORDER_NOT_ALLOCATABLE"
          - "customer.credit_status == ACTIVE, else ERR_CUSTOMER_CREDIT_HOLD"
          - "X-User-ID == order.branch_id, else ERR_NOT_RESOURCE_OWNER"
          - "payload.expected_sales_order_version == order.version, else ERR_STALE_ORDER_VERSION"
          - "after the allocation run, every OrderLine has allocation_status == FULLY_ALLOCATED"
        side_effects:
          - "runs calculations.reel_allocation_plan under payload.allocation_policy and creates Allocation rows in status RESERVED"
          - "for each created Allocation, increments Reel.allocated_length_ft by Allocation.length_ft and moves that Reel IN_STOCK -> ALLOCATED_PARTIAL when its allocated_length_ft becomes > 0"
          - "recomputes OrderLine.allocated_length_ft and OrderLine.allocation_status for every line"
          - "sets order.allocation_policy = payload.allocation_policy"
          - "increments SalesOrder.version by 1"

      - from: PENDING_ALLOCATION
        to: PARTIALLY_ALLOCATED
        trigger: "POST /sales-orders/{orderId}/allocate"
        actor: BranchOps
        preconditions:
          - "same preconditions as PENDING_ALLOCATION -> ALLOCATED"
          - "at least one Allocation row was created by this run"
          - "at least one OrderLine ends with allocation_status == SHORT or UNALLOCATED"
        side_effects:
          - "same side effects as PENDING_ALLOCATION -> ALLOCATED"
        note: "Allocation on shortage: the run takes what the branch has and leaves the line SHORT rather than failing."

      - from: PARTIALLY_ALLOCATED
        to: ALLOCATED
        trigger: "POST /sales-orders/{orderId}/allocate (re-run after restock)"
        actor: BranchOps
        preconditions:
          - "order.fulfillment_status == PARTIALLY_ALLOCATED"
          - "payload.expected_sales_order_version == order.version, else ERR_STALE_ORDER_VERSION"
          - "after the run, every OrderLine has allocation_status == FULLY_ALLOCATED"
        side_effects:
          - "allocates only the residual demand (required_length_ft - allocated_length_ft) per line; existing RESERVED allocations are untouched"
          - "increments SalesOrder.version by 1"

      - from: PARTIALLY_ALLOCATED
        to: PENDING_ALLOCATION
        trigger: "POST /sales-orders/{orderId}/release-allocations"
        actor: BranchOps
        preconditions:
          - "order.fulfillment_status IN {PARTIALLY_ALLOCATED, ALLOCATED}"
          - "every Allocation on this order has status == RESERVED, else ERR_ALLOCATION_NOT_RESERVED"
          - "X-User-ID == order.branch_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "moves every RESERVED Allocation on this order to RELEASED"
          - "decrements Reel.allocated_length_ft by Allocation.length_ft for each released row; a Reel whose allocated_length_ft returns to 0 moves ALLOCATED_PARTIAL -> IN_STOCK"
          - "resets every OrderLine.allocated_length_ft to 0 and allocation_status to UNALLOCATED"
          - "increments SalesOrder.version by 1"
        note: "Compensating action for the allocation run; leaves branch_product_available_ft unchanged (see calculations.branch_available_footage)."

      - from: ALLOCATED
        to: PENDING_ALLOCATION
        trigger: "POST /sales-orders/{orderId}/release-allocations"
        actor: BranchOps
        preconditions:
          - "same preconditions as PARTIALLY_ALLOCATED -> PENDING_ALLOCATION"
        side_effects:
          - "same side effects as PARTIALLY_ALLOCATED -> PENDING_ALLOCATION"

      - from: ALLOCATED
        to: STAGED
        trigger: "POST /allocations/{allocationId}/cut or POST /allocations/{allocationId}/pick (system bubble-up on the last commit)"
        actor: system
        preconditions:
          - "order.fulfillment_status == ALLOCATED"
          - "every Allocation on this order has status == COMMITTED"
        side_effects:
          - "sets order.fulfillment_status = STAGED"
          - "increments SalesOrder.version by 1"

      - from: STAGED
        to: DELIVERED
        trigger: "POST /delivery-runs/{runId}/deliver (system cascade link 1)"
        actor: system
        preconditions:
          - "order.fulfillment_status == STAGED"
          - "the run's status was DISPATCHED"
        side_effects:
          - "sets order.delivered_at = current_utc"
          - "CASCADE LINK 2 -- because the order became DELIVERED, every COMMITTED Allocation on it moves to CONSUMED; every PICK-committed Allocation's Reel moves to ON_JOBSITE with delivered_sales_order_id = order.id and delivered_at = current_utc; billing_status moves UNBILLED -> INVOICED and calculations.quote_line_pricing variant INVOICED plus calculations.order_money_rollup are re-run to fill invoiced_extended_cents, invoiced_total_cents, metal_variance_cents and deposit_charged_cents"
          - "increments SalesOrder.version by 1"

      - from: PENDING_ALLOCATION
        to: HELD
        trigger: "POST /delivery-runs/{runId}/deliver or POST /customers/{customerId}/credit-adjustments (system cascade, credit hold)"
        actor: system
        preconditions:
          - "order.customer_id == the Customer that just transitioned ACTIVE -> CREDIT_HOLD"
          - "order.fulfillment_status == PENDING_ALLOCATION"
        side_effects:
          - "sets order.fulfillment_status = HELD"
          - "increments SalesOrder.version by 1"

      - from: HELD
        to: PENDING_ALLOCATION
        trigger: "POST /order-lines/{orderLineId}/return or POST /customers/{customerId}/credit-adjustments (system cascade, credit released)"
        actor: system
        preconditions:
          - "order.customer_id == the Customer that just transitioned CREDIT_HOLD -> ACTIVE"
          - "order.fulfillment_status == HELD"
        side_effects:
          - "sets order.fulfillment_status = PENDING_ALLOCATION"
          - "increments SalesOrder.version by 1"
        note: "Closes the credit cycle: HELD orders become allocatable again once the customer is back under limit."

      - from: PENDING_ALLOCATION
        to: CANCELLED
        trigger: "POST /copper-index-entries (system cascade link 2, index shock)"
        actor: system
        preconditions:
          - "order.quote_id refers to a Quote that this request just moved ISSUED -> VOIDED with void_reason INDEX_SHOCK"
          - "order.fulfillment_status IN {PENDING_ALLOCATION, PARTIALLY_ALLOCATED, HELD}"
        side_effects:
          - "sets order.fulfillment_status = CANCELLED and billing_status = VOIDED"
          - "CASCADE LINK 3 -- because the order became CANCELLED, every Allocation on its lines with status == RESERVED moves to RELEASED, decrementing Reel.allocated_length_ft; a Reel whose allocated_length_ft returns to 0 moves ALLOCATED_PARTIAL -> IN_STOCK"
          - "increments SalesOrder.version by 1"

      - from: PARTIALLY_ALLOCATED
        to: CANCELLED
        trigger: "POST /copper-index-entries (system cascade link 2, index shock)"
        actor: system
        preconditions:
          - "same preconditions as PENDING_ALLOCATION -> CANCELLED"
        side_effects:
          - "same side effects as PENDING_ALLOCATION -> CANCELLED"

      - from: HELD
        to: CANCELLED
        trigger: "POST /copper-index-entries (system cascade link 2, index shock)"
        actor: system
        preconditions:
          - "same preconditions as PENDING_ALLOCATION -> CANCELLED"
        side_effects:
          - "same side effects as PENDING_ALLOCATION -> CANCELLED"

  - entity: SalesOrder
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [CREDITED, VOIDED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /delivery-runs/{runId}/deliver (system cascade link 2)"
        actor: system
        preconditions:
          - "order.billing_status == UNBILLED"
          - "order.fulfillment_status just became DELIVERED in this request"
        side_effects:
          - "re-runs calculations.quote_line_pricing variant INVOICED for every OrderLine and calculations.order_money_rollup, writing invoiced_extended_cents, invoiced_total_cents, metal_variance_cents"
          - "sets order.deposit_charged_cents = sum over PICK-committed Allocations of product.reel_deposit_cents"
          - "CASCADE LINK 3 -- because the order was invoiced, customer.open_balance_cents += invoiced_total_cents + deposit_charged_cents and customer.deposit_liability_cents += deposit_charged_cents"
          - "increments SalesOrder.version by 1"

      - from: INVOICED
        to: CREDITED
        trigger: "POST /order-lines/{orderLineId}/return"
        actor: BranchOps
        preconditions:
          - "order.billing_status == INVOICED"
          - "the returned reel is the last reel of this order still in status ON_JOBSITE"
        side_effects:
          - "sets order.billing_status = CREDITED"
          - "increments SalesOrder.version by 1"
        note: "A partial return leaves the order INVOICED; only the final reel flips the money axis."

      - from: UNBILLED
        to: VOIDED
        trigger: "POST /copper-index-entries (system cascade link 2, index shock)"
        actor: system
        preconditions:
          - "order.fulfillment_status just became CANCELLED in this request"
        side_effects:
          - "sets order.billing_status = VOIDED"

  # ----------------------------------------------------------------- Reel ---
  # Shape: cyclic. IN_STOCK <-> ALLOCATED_PARTIAL and IN_STOCK <-> ON_JOBSITE.
  - entity: Reel
    initial_state: IN_STOCK
    terminal_states: [DEPLETED, SCRAPPED]
    transitions:
      - from: IN_STOCK
        to: ALLOCATED_PARTIAL
        trigger: "POST /sales-orders/{orderId}/allocate (system side effect)"
        actor: system
        preconditions:
          - "reel.status == IN_STOCK"
          - "reel.available_length_ft > 0"
        side_effects:
          - "increments reel.allocated_length_ft by the created Allocation.length_ft"
          - "recomputes reel.available_length_ft"
          - "increments Reel.version by 1"

      - from: ALLOCATED_PARTIAL
        to: IN_STOCK
        trigger: "POST /sales-orders/{orderId}/release-allocations, or POST /copper-index-entries cascade link 3 (system)"
        actor: system
        preconditions:
          - "reel.allocated_length_ft returns to 0 after the releases in this request"
          - "reel.current_length_ft > 0"
        side_effects:
          - "decrements reel.allocated_length_ft; recomputes reel.available_length_ft"
          - "increments Reel.version by 1"
        note: "The reserve/release cycle. Physical footage (current_length_ft) is untouched by either direction."

      - from: ALLOCATED_PARTIAL
        to: DEPLETED
        trigger: "POST /allocations/{allocationId}/cut (system side effect)"
        actor: system
        preconditions:
          - "after the decrement, reel.allocated_length_ft == 0 (this cut was the LAST reservation on the reel)"
          - "AND (remainder == 0) OR (remainder >= product.min_cut_length_ft AND reel.reel_type == MASTER), where remainder = reel.current_length_ft - allocation.length_ft"
        side_effects:
          - "decrements reel.current_length_ft and reel.allocated_length_ft by allocation.length_ft"
          - "when remainder >= product.min_cut_length_ft and reel.reel_type == MASTER, creates a new Reel with reel_type REMNANT, parent_reel_id = reel.id, lot_code and product_id and branch_id inherited, nominal_length_ft = current_length_ft = remainder, status IN_STOCK, and records its id on allocation.remnant_reel_id; then sets reel.current_length_ft = 0"
          - "sets reel.status = DEPLETED"
          - "increments Reel.version by 1"

      - from: IN_STOCK
        to: DEPLETED
        trigger: "POST /allocations/{allocationId}/cut (system side effect on a reel with no other reservations)"
        actor: system
        preconditions:
          - "same preconditions as ALLOCATED_PARTIAL -> DEPLETED"
        side_effects:
          - "same side effects as ALLOCATED_PARTIAL -> DEPLETED"

      - from: ALLOCATED_PARTIAL
        to: SCRAPPED
        trigger: "POST /allocations/{allocationId}/cut (system side effect)"
        actor: system
        preconditions:
          - "after the decrement, reel.allocated_length_ft == 0 (this cut was the LAST reservation on the reel)"
          - "0 < (reel.current_length_ft - allocation.length_ft) < product.min_cut_length_ft"
        side_effects:
          - "sets reel.scrap_ft = reel.current_length_ft - allocation.length_ft, then sets reel.current_length_ft = 0 and reel.allocated_length_ft = 0"
          - "sets reel.status = SCRAPPED"
          - "increments Branch.scrap_ft_ytd by reel.scrap_ft and Branch.version by 1"
          - "sets allocation.scrap_ft to the same value"
          - "increments Reel.version by 1"

      - from: IN_STOCK
        to: SCRAPPED
        trigger: "POST /allocations/{allocationId}/cut (system side effect on a reel with no other reservations)"
        actor: system
        preconditions:
          - "same preconditions as ALLOCATED_PARTIAL -> SCRAPPED"
        side_effects:
          - "same side effects as ALLOCATED_PARTIAL -> SCRAPPED"

      - from: ALLOCATED_PARTIAL
        to: ON_JOBSITE
        trigger: "POST /delivery-runs/{runId}/deliver (system cascade link 2)"
        actor: system
        preconditions:
          - "an Allocation on this reel has commit_mode == PICK and just moved COMMITTED -> CONSUMED"
        side_effects:
          - "sets reel.status = ON_JOBSITE, reel.delivered_sales_order_id = order.id, reel.delivered_at = current_utc"
          - "sets reel.allocated_length_ft = 0"
          - "increments Reel.version by 1"

      - from: ON_JOBSITE
        to: IN_STOCK
        trigger: "POST /order-lines/{orderLineId}/return"
        actor: BranchOps
        preconditions:
          - "checked in this exact order: (1) order.fulfillment_status == DELIVERED, else ERR_ORDER_NOT_DELIVERED; (2) order_line.returnable == true, else ERR_CUT_ITEM_NON_RETURNABLE; (3) reel.delivered_sales_order_id == order_line.sales_order_id, else ERR_REEL_NOT_ON_ORDER_LINE; (4) reel.status == ON_JOBSITE, else ERR_REEL_NOT_ON_JOBSITE"
          - "X-User-ID == reel.branch_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "sets reel.status = IN_STOCK and reel.delivered_at = null; reel.delivered_sales_order_id is deliberately RETAINED so a second return of the same reel is rejected by the ON_JOBSITE check rather than by the referential check"
          - "CASCADE LINK 1 -- computes the deposit credit via calculations.reel_deposit_credit; order.deposit_credited_cents += credit_cents; customer.deposit_liability_cents -= product.reel_deposit_cents; customer.open_balance_cents -= credit_cents"
          - "CASCADE LINK 2 -- because customer.open_balance_cents changed, customer.available_credit_cents is recomputed; when customer.credit_status == CREDIT_HOLD and available_credit_cents >= 0 the customer moves CREDIT_HOLD -> ACTIVE"
          - "CASCADE LINK 3 -- because the customer returned to ACTIVE, every SalesOrder of that customer in fulfillment_status HELD moves to PENDING_ALLOCATION"
          - "when this was the last ON_JOBSITE reel of the order, order.billing_status moves INVOICED -> CREDITED"
          - "increments Reel.version by 1"

  # ----------------------------------------------------------- Allocation ---
  # Shape: branching. RESERVED forks into two COMMITTED paths whose side-effect
  # sets are disjoint, then rejoins at CONSUMED.
  - entity: Allocation
    initial_state: RESERVED
    terminal_states: [RELEASED, CONSUMED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /allocations/{allocationId}/cut"
        actor: BranchOps
        preconditions:
          - "allocation.status == RESERVED, else ERR_ALLOCATION_NOT_RESERVED"
          - "order_line.put_up == CUT, else ERR_PUT_UP_MISMATCH"
          - "reel.status IN {IN_STOCK, ALLOCATED_PARTIAL} -- structurally guaranteed, because a RESERVED Allocation pins its reel out of every terminal and out of ON_JOBSITE"
          - "X-User-ID == reel.branch_id, else ERR_NOT_RESOURCE_OWNER"
          - "payload.cut_window_end > payload.cut_window_start, else ERR_INVALID_CUT_WINDOW"
          - "the branch cut floor has room for this buffered window per calculations.cut_floor_occupancy, else ERR_CUT_BAY_CAPACITY_EXCEEDED"
        side_effects:
          - "sets allocation.commit_mode = CUT, cut_window_start, cut_window_end"
          - "sets allocation.cut_charge_applied_cents = cut_charge_tier(order_line.billable_length_ft, product.cut_charge_cents) per calculations.cut_charge_and_billable_length"
          - "decrements reel.current_length_ft and reel.allocated_length_ft by allocation.length_ft"
          - "runs the reel remainder rule, evaluated in this exact order after the decrement: (1) if reel.current_length_ft == 0 -> reel DEPLETED; (2) elif reel.allocated_length_ft > 0 -> the reel still carries another reservation, so settlement is DEFERRED: the reel keeps its remainder and stays ALLOCATED_PARTIAL, no remnant is spawned and no footage is scrapped; (3) elif reel.current_length_ft < product.min_cut_length_ft -> reel SCRAPPED with scrap_ft = the remainder, current_length_ft set to 0 and Branch.scrap_ft_ytd += remainder; (4) elif reel.reel_type == MASTER -> spawn a REMNANT Reel carrying the remainder, set allocation.remnant_reel_id and parent_reel_id, then reel DEPLETED with current_length_ft = 0; (5) else (a REMNANT reel with a viable remainder) -> reel keeps the remainder and returns to IN_STOCK"
          - "when every Allocation on the order is COMMITTED, bubbles the order ALLOCATED -> STAGED"
          - "increments Allocation.version by 1"
        note: "Cut branch: mutates physical footage, may spawn or scrap inventory, and charges the cut fee."

      - from: RESERVED
        to: COMMITTED
        trigger: "POST /allocations/{allocationId}/pick"
        actor: BranchOps
        preconditions:
          - "allocation.status == RESERVED, else ERR_ALLOCATION_NOT_RESERVED"
          - "order_line.put_up == MASTER_REEL, else ERR_PUT_UP_MISMATCH"
          - "reel.status == ALLOCATED_PARTIAL and reel.allocated_length_ft == reel.current_length_ft -- structurally guaranteed, because the MASTER_REEL branch of calculations.reel_allocation_plan only ever reserves whole untouched master reels"
          - "X-User-ID == reel.branch_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "sets allocation.commit_mode = PICK; cut_window_start, cut_window_end, cut_charge_applied_cents, scrap_ft, remnant_reel_id all stay at their defaults"
          - "reel.current_length_ft, reel.allocated_length_ft and reel.status are left unchanged -- the whole reel travels intact"
          - "when every Allocation on the order is COMMITTED, bubbles the order ALLOCATED -> STAGED"
          - "increments Allocation.version by 1"
        note: "Pick branch: no footage mutation, no remnant, no cut charge, but the reel carries a refundable deposit."

      - from: RESERVED
        to: RELEASED
        trigger: "POST /sales-orders/{orderId}/release-allocations, or POST /copper-index-entries cascade link 3 (system)"
        actor: BranchOps
        preconditions:
          - "allocation.status == RESERVED"
        side_effects:
          - "decrements reel.allocated_length_ft by allocation.length_ft; a reel whose allocated_length_ft returns to 0 moves ALLOCATED_PARTIAL -> IN_STOCK"
          - "recomputes order_line.allocated_length_ft and allocation_status"
          - "increments Allocation.version by 1"

      - from: COMMITTED
        to: CONSUMED
        trigger: "POST /delivery-runs/{runId}/deliver (system cascade link 2)"
        actor: system
        preconditions:
          - "allocation.status == COMMITTED"
          - "the allocation's SalesOrder just moved STAGED -> DELIVERED"
        side_effects:
          - "sets allocation.status = CONSUMED"
          - "when commit_mode == PICK, moves the reel to ON_JOBSITE and contributes product.reel_deposit_cents to order.deposit_charged_cents"
          - "increments Allocation.version by 1"

  # ---------------------------------------------------------- DeliveryRun ---
  - entity: DeliveryRun
    initial_state: SCHEDULED
    terminal_states: [DELIVERED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /delivery-runs/{runId}/dispatch"
        actor: Driver
        preconditions:
          - "run.status == SCHEDULED, else ERR_RUN_INVALID_STATE"
          - "X-User-ID == run.truck_id, else ERR_NOT_RESOURCE_OWNER"
          - "the run's SalesOrder has fulfillment_status == STAGED, else ERR_ORDER_NOT_STAGED"
        side_effects:
          - "sets run.dispatched_at = current_utc"
          - "increments DeliveryRun.version by 1"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /delivery-runs/{runId}/deliver"
        actor: Driver
        preconditions:
          - "run.status == DISPATCHED, else ERR_RUN_INVALID_STATE"
          - "X-User-ID == run.truck_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "sets run.delivered_at = current_utc"
          - "CASCADE LINK 1 -- the run's SalesOrder moves STAGED -> DELIVERED"
          - "increments DeliveryRun.version by 1"

  # -------------------------------------------------------------- Customer ---
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /delivery-runs/{runId}/deliver or POST /customers/{customerId}/credit-adjustments (system)"
        actor: system
        preconditions:
          - "customer.available_credit_cents < 0 after the balance change in this request"
        side_effects:
          - "sets customer.credit_status = CREDIT_HOLD"
          - "CASCADE -- every Quote of this customer with status ISSUED moves to VOIDED with void_reason CREDIT_HOLD; every SalesOrder of this customer with fulfillment_status == PENDING_ALLOCATION moves to HELD. A PARTIALLY_ALLOCATED order keeps its reservations and its status, and is instead blocked at allocate time by ERR_CUSTOMER_CREDIT_HOLD."
          - "increments Customer.version by 1"

      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /order-lines/{orderLineId}/return or POST /customers/{customerId}/credit-adjustments (system)"
        actor: system
        preconditions:
          - "customer.available_credit_cents >= 0 after the balance change in this request"
        side_effects:
          - "sets customer.credit_status = ACTIVE"
          - "CASCADE -- every SalesOrder of this customer with fulfillment_status == HELD moves to PENDING_ALLOCATION. Quotes voided for CREDIT_HOLD are NOT un-voided."
          - "increments Customer.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-line-add-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /quotes/{quoteId}/lines"
    occ_field: "expected_quote_version"
    description: |
      Adding a QuoteLine to a Quote whose version has advanced since the client
      last observed it is rejected. Adding a second line is a legitimate,
      repeatable operation -- the DRAFT quote accepts any number of lines -- so a
      request that carries a stale version is the only signal that the client
      priced its line against a pricing basis (line set, freight reel count,
      rebate tier) that no longer holds.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

  - rule_id: order-allocate-stale-order
    parent_entity: SalesOrder
    write_endpoint: "POST /sales-orders/{orderId}/allocate"
    occ_field: "expected_sales_order_version"
    description: |
      Running the allocator against a SalesOrder whose version has advanced since
      the client last observed it is rejected. Re-running the allocator is a
      legitimate, repeatable operation -- a PARTIALLY_ALLOCATED order is allocated
      again after restock and the new run supersedes the shortage picture -- so a
      stale version is the only signal that the reel reservations the client based
      its policy choice on have already moved.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: cut_charge_and_billable_length
    trigger: "POST /quotes/{quoteId}/lines (line creation) and POST /quotes/{quoteId}/issue (re-run); re-confirmed on POST /allocations/{allocationId}/cut into Allocation.cut_charge_applied_cents"
    algorithm: threshold
    formula: |
      # STEP 1 -- per-conductor billable length, put-up dependent
      if put_up == "CUT":
          billable_length_ft = max(requested_length_ft, product.min_cut_length_ft)
          reel_count         = 1                     # one disposable shipping reel per conductor
      else:  # MASTER_REEL
          reel_count         = ceil(requested_length_ft / product.master_reel_length_ft)
          billable_length_ft = reel_count * product.master_reel_length_ft

      # STEP 2 -- tier selection is keyed on billable_length_ft (ONE conductor),
      #           NEVER on billable_length_ft * parallel_set_size.
      if put_up == "MASTER_REEL":
          cut_charge_per_conductor = 0
      elif billable_length_ft <  SHORT_CUT_TIER_FT:                  # < 100
          cut_charge_per_conductor = 2 * product.cut_charge_cents
      elif billable_length_ft <  FREE_CUT_TIER_FT:                   # 100 <= L < 500
          cut_charge_per_conductor = 1 * product.cut_charge_cents
      else:                                                          # >= 500
          cut_charge_per_conductor = 0

      # STEP 3 -- paralleling multiplies the charge, not the tier
      cut_charge_cents_total = cut_charge_per_conductor * parallel_set_size

      # STEP 4 -- deposit is a separate, refundable amount and never enters
      #           quoted_extended_cents
      deposit_cents_total = (put_up == "MASTER_REEL")
                            ? product.reel_deposit_cents * reel_count * parallel_set_size
                            : 0
    input_set: "One QuoteLine plus its CableProduct. No other lines and no state filtering."
    constants:
      ABSOLUTE_MIN_CUT_FT: 25
      SHORT_CUT_TIER_FT: 100
      FREE_CUT_TIER_FT: 500
    precision: "billable_length_ft in whole feet; all money in whole cents, no rounding needed (integer inputs)"
    variants: []
    note: |
      Combinatorial mode (a): four inputs (put_up, requested_length_ft,
      parallel_set_size, product.min_cut_length_ft) interact through a nested
      max() feeding a three-way tier selector whose result is then multiplied by a
      fourth input. Keying the tier on the paralleled total instead of the
      per-conductor billable length flips a 3-tier selection and is the intended trap.

  - name: quote_line_pricing
    trigger: "POST /quotes/{quoteId}/issue (variant QUOTED); POST /delivery-runs/{runId}/deliver (variant INVOICED)"
    algorithm: tiered_pricing
    formula: |
      # index_entry is chosen by the active variant (see variants below)
      if product.conductor_metal == "ALUMINUM":
          copper_adder_cents_per_ft = 0.0000
      else:
          copper_adder_cents_per_ft = index_entry.price_cents_per_lb
                                      * (product.copper_lbs_per_1000ft / 1000)
          # kept at EXACTLY 4 decimal places, UNROUNDED -- this is the only
          # place fractional cents are allowed to live

      total_billable_ft = billable_length_ft * parallel_set_size

      # PINNED ROUNDING ORDER -- round once PER LINE, then sum lines.
      metal_cents = ROUND_HALF_UP(copper_adder_cents_per_ft * total_billable_ft, 0)
      base_cents  = product.base_price_cents_per_ft * total_billable_ft   # integer, exact

      extended_cents = base_cents + metal_cents + cut_charge_cents_total

      # line_subtotal_cents = SUM over lines of extended_cents
      # It is FORBIDDEN to sum copper_adder_cents_per_ft * total_billable_ft across
      # lines and round the sum once: for two identical 137 ft lines of a part at
      # 5.6250 c/ft that yields 1541 instead of 1542 metal cents.
    input_set: "Every QuoteLine of the quote (variant QUOTED) or every OrderLine of the order (variant INVOICED). Lines are processed in ascending line_number; ties are impossible because line_number is unique per quote."
    constants: {}
    precision: "copper_adder_cents_per_ft: exactly 4 decimal places, unrounded. metal_cents: 0 decimal places, ROUND_HALF_UP, applied once per line."
    variants:
      - name: QUOTED
        when: "Run at POST /quotes/{quoteId}/issue and copied to the SalesOrder at conversion."
        difference: "index_entry = the CopperIndexEntry pinned on quote.copper_index_entry_id (greatest effective_date <= date(issued_at)). Writes QuoteLine.metal_cents / quoted_extended_cents and OrderLine.quoted_extended_cents."
      - name: INVOICED
        when: "Run at POST /delivery-runs/{runId}/deliver, on the order's OrderLines."
        difference: "index_entry = the CopperIndexEntry with the greatest effective_date <= date(order.delivered_at), which may be a different entry from the pinned one. Writes OrderLine.invoiced_extended_cents; the delta rolls up into SalesOrder.metal_variance_cents = SUM(invoiced_extended_cents - quoted_extended_cents). base_cents and cut_charge_cents_total are identical under both variants -- only the metal component moves."

  - name: order_money_rollup
    trigger: "POST /quotes/{quoteId}/lines, POST /quotes/{quoteId}/issue (writes the Quote money fields); POST /delivery-runs/{runId}/deliver (writes SalesOrder.invoiced_total_cents)"
    algorithm: constraint_propagation
    formula: |
      # The free-freight waiver depends on the rebate, and the rebate tier depends
      # on the freight. The dependency is broken by PINNING this evaluation order.
      # Steps MUST be executed exactly 1..6 and NO step is re-run after step 5.

      # 1. line subtotal -- sum of already-rounded per-line values
      line_subtotal_cents = SUM over lines of extended_cents

      # 2. gross freight
      physical_reel_count = SUM over lines of (reel_count * parallel_set_size)
      gross_freight_cents = FREIGHT_BASE_CENTS
                          + FREIGHT_PER_REEL_CENTS * physical_reel_count
                          + branch.delivery_surcharge_cents

      # 3. rebate tier keyed on subtotal PLUS gross freight
      rebate_basis_cents = line_subtotal_cents + gross_freight_cents
      if   rebate_basis_cents <  REBATE_TIER1_CENTS: rebate_pct = 0.000
      elif rebate_basis_cents <  REBATE_TIER2_CENTS: rebate_pct = 0.015
      else:                                          rebate_pct = 0.030

      # 4. rebate is applied to the SUBTOTAL ONLY, never to freight
      rebate_cents = ROUND_HALF_UP(line_subtotal_cents * rebate_pct, 0)

      # 5. free-freight waiver test uses the post-rebate net, INCLUSIVE (>=)
      net_before_waiver_cents = line_subtotal_cents + gross_freight_cents - rebate_cents
      freight_cents = (net_before_waiver_cents >= FREE_FREIGHT_THRESHOLD_CENTS) ? 0
                                                                                : gross_freight_cents

      # 6. total. rebate_pct is NOT recomputed after the waiver zeroes freight,
      #    even though rebate_basis_cents would now be lower.
      total_cents = line_subtotal_cents + freight_cents - rebate_cents
    input_set: "All QuoteLines of the quote (QUOTED roll-up) or all OrderLines of the order (INVOICED roll-up), plus the Branch named by quote.branch_id / order.branch_id. Deposits are excluded from every step."
    constants:
      FREIGHT_BASE_CENTS: 8500
      FREIGHT_PER_REEL_CENTS: 2500
      REBATE_TIER1_CENTS: 200000
      REBATE_TIER2_CENTS: 500000
      FREE_FREIGHT_THRESHOLD_CENTS: 500000
      SOD_REVIEW_THRESHOLD_CENTS: 250000
    precision: "rebate_cents: 0 decimal places, ROUND_HALF_UP. All other quantities are integer cents."
    variants: []
    note: |
      Combinatorial mode (c): a circular-looking dependency (freight -> rebate tier
      -> rebate -> free-freight waiver -> freight) made well-defined by an explicit
      six-step order. Two natural readings -- re-running the tier after the waiver,
      or applying the rebate to subtotal+freight -- both produce different cents.

  - name: quote_validity_and_index_shock
    trigger: "POST /quotes/{quoteId}/issue (writes valid_until); POST /copper-index-entries (evaluates the shock)"
    algorithm: threshold
    formula: |
      # Daily quote validity -- INCLUSIVE upper bound.
      valid_until = issued_at + QUOTE_VALIDITY_HOURS hours
      a conversion is in-validity when current_utc <= valid_until

      # Index shock, evaluated once per publication over every candidate quote
      # in ascending Quote.created_at (created_at is the only ordering used).
      pinned = the CopperIndexEntry on quote.copper_index_entry_id
      deviation = abs(new_entry.price_cents_per_lb - pinned.price_cents_per_lb)
                  / pinned.price_cents_per_lb
      shock = (new_entry.effective_date > pinned.effective_date)
              AND (deviation > COPPER_VOLATILITY_TOLERANCE_PCT)
      # deviation exactly equal to the tolerance is NOT a shock.
    input_set: "Quotes with status ISSUED, plus quotes with status CONVERTED whose SalesOrder is still in PENDING_ALLOCATION, PARTIALLY_ALLOCATED or HELD. DRAFT, EXPIRED and VOIDED quotes and quotes whose order is ALLOCATED or beyond are excluded."
    constants:
      QUOTE_VALIDITY_HOURS: 24
      COPPER_VOLATILITY_TOLERANCE_PCT: 0.03
      SOD_REVIEW_THRESHOLD_CENTS: 250000
    precision: "deviation computed as an exact rational over integer cents; comparison is strictly greater than."
    variants: []

  - name: reel_allocation_plan
    trigger: "POST /sales-orders/{orderId}/allocate"
    algorithm: waterfall_allocation
    formula: |
      # Order lines are processed in ascending order_line.line_number.
      # (line_number is unique within an order, so no tie-break is reachable.)
      for line in order.lines sorted by line_number ASC:
          residual_ft = line.required_length_ft - line.allocated_length_ft
          if residual_ft <= 0: continue

          candidates = Reel rows WHERE reel.product_id == line.product_id
                                   AND reel.branch_id == order.branch_id
                                   AND reel.status IN {IN_STOCK, ALLOCATED_PARTIAL}
                                   AND (reel.current_length_ft - reel.allocated_length_ft) > 0

          if line.parallel_set_size > 1:
              # ------ SAME-LOT, WHOLE-CONDUCTOR RULE (all-or-nothing) ------
              # Each of the N conductors must be one continuous run, so each needs
              # its OWN reel holding at least billable_length_ft available.
              for lot in DISTINCT candidates.lot_code sorted by lot_code ASC:
                  usable = [r in candidates where r.lot_code == lot
                            and (r.current_length_ft - r.allocated_length_ft)
                                >= line.billable_length_ft]
                  if len(usable) >= line.parallel_set_size:
                      chosen_lot = lot; break
              if no chosen_lot: raise ERR_PARALLEL_SET_INCOMPLETE   # no partial fill
              picks = rank(usable of chosen_lot)[0 : line.parallel_set_size]
              create one Allocation of length_ft = line.billable_length_ft per pick
              line.lot_code = chosen_lot
          elif line.put_up == "MASTER_REEL":
              # ------ WHOLE-REEL PICK ------
              usable = [r in candidates where r.reel_type == "MASTER"
                        and r.allocated_length_ft == 0
                        and r.current_length_ft == r.nominal_length_ft
                        and r.nominal_length_ft == product.master_reel_length_ft]
              picks = usable sorted by created_at ASC
              take min(len(picks), line.reel_count) reels; one Allocation each of
              length_ft = reel.current_length_ft
          else:
              # ------ SINGLE-CONDUCTOR WATERFALL (splitting allowed) ------
              remaining = residual_ft
              while remaining > 0 and candidates non-empty:
                  r = rank(candidates)[0]
                  take = min(remaining, r.current_length_ft - r.allocated_length_ft)
                  create Allocation(reel=r, length_ft=take, sequence_no=next)
                  remaining -= take; drop r from candidates

      # ------ FALLBACK ------
      # If the whole run created ZERO Allocation rows, the request fails with
      # ERR_NO_ELIGIBLE_REEL (409) and nothing is persisted. If it created at
      # least one, the run succeeds and short lines are simply left SHORT.

      # ------ RANKING (see variants) ------
      # rank() is the only place the two policies differ. Tie-break in BOTH
      # policies: created_at ASC (never id).

      # ------ LINE STATUS ------
      line.allocated_length_ft = SUM of Allocation.length_ft on this line
                                 with status IN {RESERVED, COMMITTED, CONSUMED}
      line.allocation_status = FULLY_ALLOCATED if allocated == required
                               else SHORT if 0 < allocated < required
                               else UNALLOCATED
    input_set: "Reels at order.branch_id for the line's product in status IN_STOCK or ALLOCATED_PARTIAL with available_length_ft > 0. Reels in ON_JOBSITE, DEPLETED or SCRAPPED are excluded."
    constants: {}
    precision: "Footage in whole feet; no rounding."
    variants:
      - name: MINIMIZE_REMNANT
        when: "payload.allocation_policy omitted or MINIMIZE_REMNANT (the default)."
        difference: "rank() = best fit. Among candidates whose available_length_ft >= the footage still needed for this pick, choose the SMALLEST available_length_ft (tie-break created_at ASC). If no candidate is large enough, fall through to available_length_ft DESC (tie-break created_at ASC) and split."
      - name: FEWEST_REELS
        when: "payload.allocation_policy == FEWEST_REELS."
        difference: "rank() = available_length_ft DESC unconditionally (tie-break created_at ASC), so the largest reel is always broached first. For a 300 ft need against reels of 400 ft, 1000 ft and 250 ft, MINIMIZE_REMNANT broaches the 400 ft reel and FEWEST_REELS broaches the 1000 ft reel -- different Allocation.reel_id, different remnant footage, identical demand."

  - name: branch_available_footage
    trigger: "Read-side aggregate; recomputed implicitly on every allocation, release, cut and return. Observable through GET /reels filtered by branch_id, product_id and status."
    algorithm: aggregation
    formula: |
      branch_product_available_ft(branch_id, product_id) =
          SUM over Reel r WHERE r.branch_id == branch_id
                            AND r.product_id == product_id
                            AND r.status IN {IN_STOCK, ALLOCATED_PARTIAL}
              OF (r.current_length_ft - r.allocated_length_ft)

      # CONSERVED QUANTITY -- reserve/release invariant.
      # POST /sales-orders/{id}/allocate followed by
      # POST /sales-orders/{id}/release-allocations MUST leave
      # branch_product_available_ft byte-identical to its pre-allocate value,
      # and MUST leave every touched Reel.current_length_ft unchanged.

      # LINEAGE INVARIANT -- footage conservation across cuts.
      # For any reel R received into stock (parent_reel_id == null):
      #   R.nominal_length_ft ==
      #        R.current_length_ft
      #      + SUM over descendants d of R (via parent_reel_id) of d.current_length_ft
      #      + SUM over R and its descendants of scrap_ft
      #      + SUM over Allocations a with status IN {COMMITTED, CONSUMED} and
      #            commit_mode == CUT whose reel_id is R or a descendant of R
      #            of a.length_ft
    input_set: "Reels in status IN_STOCK or ALLOCATED_PARTIAL only. ON_JOBSITE, DEPLETED and SCRAPPED reels contribute 0 to availability but still carry their scrap_ft into the lineage invariant."
    constants: {}
    precision: "Whole feet."
    variants: []

  - name: reel_deposit_credit
    trigger: "POST /order-lines/{orderLineId}/return"
    algorithm: threshold
    formula: |
      elapsed_days = floor((current_utc - sales_order.delivered_at) / 86400 seconds)

      if elapsed_days <= DEPOSIT_RETURN_WINDOW_DAYS and condition == "GOOD":
          credit_pct = 1.00
      elif elapsed_days <= DEPOSIT_RETURN_WINDOW_DAYS and condition == "DAMAGED":
          credit_pct = 0.50
      else:                                    # elapsed_days > 60, any condition
          credit_pct = 0.00

      credit_cents = ROUND_HALF_UP(product.reel_deposit_cents * credit_pct, 0)

      # CONSERVED QUANTITY -- deposit liability invariant.
      # The FULL deposit leaves the liability regardless of credit_pct:
      #   customer.deposit_liability_cents -= product.reel_deposit_cents
      #   customer.open_balance_cents      -= credit_cents
      # So for a customer whose reels are all returned,
      #   customer.deposit_liability_cents ==
      #       SUM over Reel r WHERE r.status == ON_JOBSITE
      #                         AND r.delivered_sales_order_id.customer_id == customer.id
      #           OF product(r).reel_deposit_cents
      # returns to exactly its pre-delivery value.
    input_set: "One Reel in status ON_JOBSITE whose delivered_sales_order_id matches the order line's order, plus that reel's CableProduct and the order's delivered_at."
    constants:
      DEPOSIT_RETURN_WINDOW_DAYS: 60
    precision: "credit_cents: 0 decimal places, ROUND_HALF_UP."
    variants: []
    note: "The window boundary is inclusive: a return at exactly 60 elapsed days still earns the full credit; 61 days earns nothing."

  - name: cut_floor_occupancy
    trigger: "POST /allocations/{allocationId}/cut"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a trailing cleanup buffer.
      requested = [cut_window_start, cut_window_end + CUT_BAY_CLEANUP_BUFFER_MIN minutes]

      occupied = Allocation rows WHERE status IN {COMMITTED, CONSUMED}
                                   AND commit_mode == "CUT"
                                   AND reel.branch_id == this reel.branch_id
      overlapping = count of a in occupied where
          requested.start <= (a.cut_window_end + CUT_BAY_CLEANUP_BUFFER_MIN)
          AND (a.cut_window_start) <= requested.end
          # NOTE: both comparisons are <= , i.e. touching endpoints COLLIDE.

      if overlapping >= branch.concurrent_cut_capacity:
          raise ERR_CUT_BAY_CAPACITY_EXCEEDED
    input_set: "Allocations at the same Branch with commit_mode CUT and status COMMITTED or CONSUMED. RESERVED and RELEASED allocations hold no cut window and are excluded."
    constants:
      CUT_BAY_CLEANUP_BUFFER_MIN: 30
    precision: "Minute resolution; comparisons are inclusive on both endpoints."
    variants: []
    note: "Interval semantics A: CLOSED endpoints plus a trailing buffer, evaluated as an AGGREGATE count against branch.concurrent_cut_capacity. A cut starting exactly when the previous cut's buffered window ends is REJECTED."

  - name: truck_window_conflict
    trigger: "POST /delivery-runs"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals, exclusive occupation, no buffer.
      requested = [window_start, window_end)

      occupied = DeliveryRun rows WHERE truck_id == payload.truck_id
                                   AND status IN {SCHEDULED, DISPATCHED, DELIVERED}
      conflict = EXISTS a in occupied where
          requested.start < a.window_end AND a.window_start < requested.end
          # strict <, i.e. touching endpoints DO NOT collide.

      if conflict: raise ERR_TRUCK_WINDOW_CONFLICT
    input_set: "Every DeliveryRun on the same truck, in any status. Runs are never deleted, so a delivered run still blocks its historical window."
    constants: {}
    precision: "Minute resolution; comparisons are strict."
    variants: []
    note: "Interval semantics B: HALF-OPEN endpoints, EXCLUSIVE single occupancy (capacity is implicitly 1, not a branch-configured count). A run starting exactly when the previous run ends is ACCEPTED -- the opposite adjacency verdict from cut_floor_occupancy."

  - name: jobsite_reel_handling
    trigger: "POST /delivery-runs"
    algorithm: threshold
    formula: |
      heaviest_reel_lbs = MAX over Allocation a on the run's SalesOrder
                              WHERE a.status == COMMITTED AND a.commit_mode == "PICK"
                              OF product(a.reel_id).reel_weight_lbs
      # empty set -> heaviest_reel_lbs = 0 (an all-CUT order carries no returnable reel)

      if jobsite_has_forklift:            reel_handling = "FORKLIFT"
      elif heaviest_reel_lbs > MAX_MANUAL_REEL_LBS: reel_handling = "BOOM_LIFT"
      else:                               reel_handling = "TAILGATE"

      if reel_handling == "BOOM_LIFT" and truck.has_boom_lift == false:
          raise ERR_BOOM_LIFT_REQUIRED
    input_set: "COMMITTED, PICK-mode Allocations of the run's SalesOrder. CUT-mode allocations ship on disposable reels and never drive handling."
    constants:
      MAX_MANUAL_REEL_LBS: 250
    precision: "Pounds to one decimal place; comparison is strictly greater than."
    variants: []
    note: "The forklift branch wins outright: a jobsite with its own forklift never demands a boom lift, no matter how heavy the reel."

  - name: customer_credit_posture
    trigger: "POST /delivery-runs/{runId}/deliver, POST /order-lines/{orderLineId}/return, POST /customers/{customerId}/credit-adjustments"
    algorithm: aggregation
    formula: |
      available_credit_cents = credit_limit_cents - open_balance_cents

      if credit_status == "ACTIVE"      and available_credit_cents <  0: -> CREDIT_HOLD
      if credit_status == "CREDIT_HOLD" and available_credit_cents >= 0: -> ACTIVE
      # boundary is INCLUSIVE on release: available_credit_cents == 0 releases the hold.
    input_set: "The single Customer row; open_balance_cents is maintained incrementally by the invoicing and credit cascades, never recomputed from scratch."
    constants: {}
    precision: "Whole cents."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body parses, every required field is present, every enum value is a declared member, every numeric field is inside its declared range, and pagination limit is within [1,100]"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "path ids resolve, left to right, then body foreign keys resolve in declaration order: branch_id, customer_id, product_id, truck_id, reel_id, quote_id, sales_order_id, order_line_id, allocation_id"
    error_id: "ERR_BRANCH_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_TRUCK_NOT_FOUND | ERR_REEL_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_QUOTE_LINE_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_DELIVERY_RUN_NOT_FOUND | ERR_COPPER_INDEX_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: auth
    check: "for entity-backed roles the acting X-User-ID owns the target: BranchOps X-User-ID == the branch of the reel/order being acted on; Driver X-User-ID == run.truck_id; Customer X-User-ID == quote.customer_id or order.customer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /sales-orders/{orderId}/allocate, POST /sales-orders/{orderId}/release-allocations, POST /allocations/{allocationId}/cut, POST /allocations/{allocationId}/pick, POST /delivery-runs, POST /delivery-runs/{runId}/dispatch, POST /delivery-runs/{runId}/deliver, POST /order-lines/{orderLineId}/return, GET /quotes/{quoteId}, GET /sales-orders/{orderId}"

  - priority: 6
    category: business_constraint
    check: "uniqueness: CableProduct.part_number is unique; CopperIndexEntry.effective_date is unique"
    error_id: "ERR_DUPLICATE_PART_NUMBER | ERR_DUPLICATE_INDEX_DATE"
    http_status: 409
    applies_to: "POST /products, POST /copper-index-entries"

  - priority: 7
    category: state
    check: "the target resource is in a state that admits this transition: quote.status == DRAFT for line-add and issue; == ISSUED for reprice and convert; order.fulfillment_status IN {PENDING_ALLOCATION, PARTIALLY_ALLOCATED} for allocate; IN {PARTIALLY_ALLOCATED, ALLOCATED} for release; allocation.status == RESERVED for cut and pick; run.status == SCHEDULED for dispatch and == DISPATCHED for deliver; order.fulfillment_status == DELIVERED for return"
    error_id: "ERR_QUOTE_NOT_DRAFT | ERR_QUOTE_NOT_ISSUED | ERR_ORDER_NOT_ALLOCATABLE | ERR_ALLOCATION_NOT_RESERVED | ERR_RUN_INVALID_STATE | ERR_ORDER_NOT_DELIVERED"
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 8
    category: state
    check: "the quote has at least one line before it can be issued"
    error_id: ERR_QUOTE_HAS_NO_LINES
    http_status: 409
    applies_to: "POST /quotes/{quoteId}/issue"

  - priority: 9
    category: business_constraint
    check: "a cut item is never returnable: order_line.returnable must be true. This runs BEFORE the reel-identity check, because a CUT line never shipped a returnable reel and would otherwise always fail on identity."
    error_id: ERR_CUT_ITEM_NON_RETURNABLE
    http_status: 409
    applies_to: "POST /order-lines/{orderLineId}/return"

  - priority: 10
    category: business_referential
    check: "cross-entity references are mutually consistent: truck.branch_id == order.branch_id on run creation; reel.branch_id == order.branch_id for every allocation; order_line.sales_order_id == reel.delivered_sales_order_id on return; the reel is one the order line actually shipped"
    error_id: "ERR_TRUCK_BRANCH_MISMATCH | ERR_REEL_NOT_ON_ORDER_LINE"
    http_status: 409
    applies_to: "POST /delivery-runs, POST /order-lines/{orderLineId}/return"

  - priority: 11
    category: business_referential
    check: "the commit branch matches the line's put-up: cut requires order_line.put_up == CUT, pick requires order_line.put_up == MASTER_REEL"
    error_id: ERR_PUT_UP_MISMATCH
    http_status: 409
    applies_to: "POST /allocations/{allocationId}/cut, POST /allocations/{allocationId}/pick"

  - priority: 12
    category: business_safety
    check: "requested_length_ft >= ABSOLUTE_MIN_CUT_FT (25) for a CUT put-up; a shorter run cannot be safely terminated"
    error_id: ERR_BELOW_ABSOLUTE_MIN_CUT
    http_status: 422
    applies_to: "POST /quotes/{quoteId}/lines"

  - priority: 13
    category: business_safety
    check: "the requested put_up appears in product.allowed_put_ups"
    error_id: ERR_PUT_UP_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /quotes/{quoteId}/lines"

  - priority: 14
    category: business_safety
    check: "a paralleled set (parallel_set_size > 1) can be filled from parallel_set_size distinct reels sharing one lot_code, each holding at least billable_length_ft available; partial fills are forbidden for paralleled sets"
    error_id: ERR_PARALLEL_SET_INCOMPLETE
    http_status: 409
    applies_to: "POST /sales-orders/{orderId}/allocate"

  - priority: 15
    category: business_safety
    check: "when the derived reel_handling is BOOM_LIFT the assigned truck must carry a boom lift"
    error_id: ERR_BOOM_LIFT_REQUIRED
    http_status: 409
    applies_to: "POST /delivery-runs"

  - priority: 16
    category: business_temporal
    check: "current_utc <= quote.valid_until; a later conversion attempt moves the quote to EXPIRED and fails"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{quoteId}/convert"

  - priority: 17
    category: business_temporal
    check: "cut_window_end > cut_window_start"
    error_id: ERR_INVALID_CUT_WINDOW
    http_status: 422
    applies_to: "POST /allocations/{allocationId}/cut"

  - priority: 18
    category: business_temporal
    check: "the buffered CLOSED cut window collides with fewer than branch.concurrent_cut_capacity existing buffered windows at the same branch (calculations.cut_floor_occupancy)"
    error_id: ERR_CUT_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /allocations/{allocationId}/cut"

  - priority: 19
    category: business_temporal
    check: "the HALF-OPEN delivery window does not overlap any other run on the same truck (calculations.truck_window_conflict)"
    error_id: ERR_TRUCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-runs"

  - priority: 20
    category: business_constraint
    check: "the allocation run produced at least one Allocation row across the whole order"
    error_id: ERR_NO_ELIGIBLE_REEL
    http_status: 409
    applies_to: "POST /sales-orders/{orderId}/allocate"

  - priority: 21
    category: business_constraint
    check: "the reel being returned is currently ON_JOBSITE"
    error_id: ERR_REEL_NOT_ON_JOBSITE
    http_status: 409
    applies_to: "POST /order-lines/{orderLineId}/return"

  - priority: 22
    category: business_constraint
    check: "the order does not already have a DeliveryRun in status SCHEDULED or DISPATCHED"
    error_id: ERR_ORDER_HAS_ACTIVE_RUN
    http_status: 409
    applies_to: "POST /delivery-runs"

  - priority: 23
    category: business_constraint
    check: "the run's SalesOrder is STAGED before the truck may dispatch"
    error_id: ERR_ORDER_NOT_STAGED
    http_status: 409
    applies_to: "POST /delivery-runs/{runId}/dispatch"

  - priority: 24
    category: business_constraint
    check: "at least one CopperIndexEntry exists with effective_date <= date(current_utc) at issue time"
    error_id: ERR_NO_COPPER_INDEX
    http_status: 409
    applies_to: "POST /quotes/{quoteId}/issue"

  - priority: 25
    category: business_constraint
    check: "segregation of duties: when the line subtotal computed by this issue request (not the stale stored value, which is 0 while DRAFT) is >= SOD_REVIEW_THRESHOLD_CENTS (250000), the issuing X-User-ID must differ from quote.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /quotes/{quoteId}/issue"

  - priority: 26
    category: business_fiscal
    check: "customer.credit_status == ACTIVE"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /quotes/{quoteId}/convert, POST /sales-orders/{orderId}/allocate"

  - priority: 27
    category: business_fiscal
    check: "customer.available_credit_cents >= quote.quoted_total_cents at conversion time"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /quotes/{quoteId}/convert"

  - priority: 28
    category: state
    check: "optimistic concurrency: payload.expected_quote_version == quote.version / payload.expected_sales_order_version == order.version"
    error_id: "ERR_STALE_QUOTE_VERSION | ERR_STALE_ORDER_VERSION"
    http_status: 412
    applies_to: "POST /quotes/{quoteId}/lines, POST /sales-orders/{orderId}/allocate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Branch ----
  - method: POST
    path: "/branches"
    description: "Register a distribution branch, its cut-floor capacity and its freight surcharge."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "region_code", "concurrent_cut_capacity?", "delivery_surcharge_cents?"]
    output: Branch
    side_effects: ["scrap_ft_ytd initialised to 0"]

  - method: GET
    path: "/branches/{branchId}"
    description: "Read one branch, including its running scrap total."
    roles: [PlatformAdmin, SalesRep, BranchOps, CreditManager]
    code: 200
    input: []
    output: Branch
    side_effects: []

  # -------------------------------------------------------------- Truck ----
  - method: POST
    path: "/trucks"
    description: "Register a delivery truck at a branch."
    roles: [PlatformAdmin]
    code: 201
    input: ["branch_id", "truck_code", "has_boom_lift?", "max_reel_slots?"]
    output: Truck
    side_effects: []

  - method: GET
    path: "/trucks/{truckId}"
    description: "Read one truck."
    roles: [PlatformAdmin, BranchOps, Driver]
    code: 200
    input: []
    output: Truck
    side_effects: []

  - method: GET
    path: "/trucks"
    description: "List trucks, optionally filtered to one branch. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, BranchOps, Driver]
    code: 200
    input: ["branch_id?", "limit?", "offset?"]
    output: Truck[]
    side_effects: []

  # ----------------------------------------------------------- Customer ----
  - method: POST
    path: "/customers"
    description: "Open a customer account with a credit limit."
    roles: [PlatformAdmin, CreditManager]
    code: 201
    input: ["name", "credit_limit_cents"]
    output: Customer
    side_effects: ["open_balance_cents = 0, deposit_liability_cents = 0, available_credit_cents = credit_limit_cents, credit_status = ACTIVE"]

  - method: GET
    path: "/customers/{customerId}"
    description: "Read one customer including credit posture and deposit liability."
    roles: [PlatformAdmin, CreditManager, SalesRep, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{customerId}/credit-adjustments"
    description: "Operator adjustment to a customer's credit limit and/or open balance (manual invoice, write-off, limit review)."
    roles: [CreditManager]
    code: 200
    input: ["delta_credit_limit_cents?", "delta_open_balance_cents?", "reason"]
    output: Customer
    side_effects:
      - "applies the deltas, recomputes available_credit_cents via calculations.customer_credit_posture"
      - "may fire ACTIVE -> CREDIT_HOLD (voiding the customer's ISSUED quotes and moving their PENDING_ALLOCATION orders to HELD) or CREDIT_HOLD -> ACTIVE (releasing HELD orders back to PENDING_ALLOCATION)"
      - "increments Customer.version by 1"

  # ------------------------------------------------------- CableProduct ----
  - method: POST
    path: "/products"
    description: "Add a part to the cable catalog."
    roles: [PlatformAdmin]
    code: 201
    input: ["part_number", "conductor_metal", "copper_lbs_per_1000ft", "base_price_cents_per_ft", "min_cut_length_ft", "cut_charge_cents", "reel_deposit_cents", "master_reel_length_ft", "reel_weight_lbs", "allowed_put_ups"]
    output: CableProduct
    side_effects: []

  - method: GET
    path: "/products/{productId}"
    description: "Read one catalog part."
    roles: [PlatformAdmin, SalesRep, BranchOps]
    code: 200
    input: []
    output: CableProduct
    side_effects: []

  # --------------------------------------------------- CopperIndexEntry ----
  - method: POST
    path: "/copper-index-entries"
    description: "Publish a daily copper settlement. Publishing re-evaluates every ISSUED quote for index shock."
    roles: [PlatformAdmin]
    code: 201
    input: ["effective_date", "price_cents_per_lb"]
    output: CopperIndexEntry
    side_effects:
      - "CASCADE LINK 1 -- every Quote in status ISSUED whose pinned entry deviates by more than COPPER_VOLATILITY_TOLERANCE_PCT moves to VOIDED with void_reason INDEX_SHOCK; voided_quote_count records how many"
      - "CASCADE LINK 2 -- because those quotes were voided, their SalesOrders in PENDING_ALLOCATION, PARTIALLY_ALLOCATED or HELD move to CANCELLED with billing_status VOIDED"
      - "CASCADE LINK 3 -- because those orders were cancelled, their RESERVED Allocations move to RELEASED, decrementing Reel.allocated_length_ft and returning fully-freed reels to IN_STOCK"

  - method: GET
    path: "/copper-index-entries/{entryId}"
    description: "Read one published index entry."
    roles: [PlatformAdmin, SalesRep, BranchOps, CreditManager]
    code: 200
    input: []
    output: CopperIndexEntry
    side_effects: []

  - method: GET
    path: "/copper-index-entries"
    description: "List published index entries, ordered by effective_date DESC (effective_date is unique, so no tie-break is reachable)."
    roles: [PlatformAdmin, SalesRep, BranchOps, CreditManager]
    code: 200
    input: ["effective_date_from?", "effective_date_to?", "limit?", "offset?"]
    output: CopperIndexEntry[]
    side_effects: []

  # --------------------------------------------------------------- Reel ----
  - method: POST
    path: "/reels"
    description: "Receive a master reel into a branch's stock."
    roles: [BranchOps, PlatformAdmin]
    code: 201
    input: ["product_id", "branch_id", "lot_code", "nominal_length_ft"]
    output: Reel
    side_effects: ["reel_type = MASTER, parent_reel_id = null, current_length_ft = nominal_length_ft, allocated_length_ft = 0, status = IN_STOCK"]

  - method: GET
    path: "/reels/{reelId}"
    description: "Read one reel, including remaining, reserved and scrapped footage."
    roles: [PlatformAdmin, BranchOps, SalesRep]
    code: 200
    input: []
    output: Reel
    side_effects: []

  - method: GET
    path: "/reels"
    description: "List reels. parent_reel_id finds the remnants spawned from a reel; delivered_sales_order_id finds the reels a customer is holding on a jobsite. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, BranchOps, SalesRep]
    code: 200
    input: ["branch_id?", "product_id?", "parent_reel_id?", "delivered_sales_order_id?", "status?", "lot_code?", "reel_type?", "limit?", "offset?"]
    output: Reel[]
    side_effects: []

  # -------------------------------------------------------------- Quote ----
  - method: POST
    path: "/quotes"
    description: "Open a DRAFT quote for a customer out of a branch."
    roles: [SalesRep]
    code: 201
    input: ["customer_id", "branch_id"]
    output: Quote
    side_effects: ["status = DRAFT, created_by_user_id = X-User-ID, all money fields 0, copper_index_entry_id = null"]

  - method: GET
    path: "/quotes/{quoteId}"
    description: "Read one quote, including the pinned copper index, validity window and money roll-up."
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "List quotes; copper_index_entry_id finds every quote pinned to a given published index. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: ["customer_id?", "branch_id?", "copper_index_entry_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/quotes/{quoteId}/lines"
    description: "Add a line to a DRAFT quote. OCC-guarded on the quote's version."
    roles: [SalesRep]
    code: 201
    input: ["product_id", "put_up", "requested_length_ft", "parallel_set_size?", "expected_quote_version"]
    output: QuoteLine
    side_effects:
      - "assigns line_number = (existing line count + 1)"
      - "runs calculations.cut_charge_and_billable_length to set billable_length_ft, reel_count, cut_charge_cents_total, deposit_cents_total"
      - "leaves copper_adder_cents_per_ft, metal_cents, base_cents and quoted_extended_cents at 0 until the quote is issued"
      - "increments Quote.version by 1"

  - method: GET
    path: "/quote-lines/{quoteLineId}"
    description: "Read one quote line and its priced components."
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: []
    output: QuoteLine
    side_effects: []

  - method: GET
    path: "/quote-lines"
    description: "List quote lines, filtered by quote or by part. Results are ordered by line_number ASC within a quote, otherwise by created_at ASC."
    roles: [PlatformAdmin, SalesRep, Customer]
    code: 200
    input: ["quote_id?", "product_id?", "limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []

  - method: POST
    path: "/quotes/{quoteId}/issue"
    description: "Issue a DRAFT quote: pin today's copper index, price every line, and open the validity window."
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "pins copper_index_entry_id, runs calculations.quote_line_pricing variant QUOTED and calculations.order_money_rollup"
      - "sets issued_at = current_utc, valid_until = issued_at + QUOTE_VALIDITY_HOURS, issued_by_user_id = X-User-ID"
      - "enforces segregation of duties at or above SOD_REVIEW_THRESHOLD_CENTS"
      - "increments Quote.version by 1"

  - method: POST
    path: "/quotes/{quoteId}/reprice"
    description: "Reopen an ISSUED quote to DRAFT, discarding the pinned index and all priced money so it can be re-issued against the current index."
    roles: [SalesRep]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "status ISSUED -> DRAFT; copper_index_entry_id, issued_at, valid_until, issued_by_user_id cleared; every money field on the quote and its lines reset to 0"
      - "increments Quote.version by 1"

  - method: POST
    path: "/quotes/{quoteId}/convert"
    description: "Convert an in-validity ISSUED quote into a SalesOrder. Fails and expires the quote when the validity window has passed."
    roles: [SalesRep]
    code: 201
    input: []
    output: SalesOrder
    side_effects:
      - "creates the SalesOrder (PENDING_ALLOCATION / UNBILLED) and one OrderLine per QuoteLine"
      - "moves the quote to CONVERTED, or to EXPIRED when current_utc > valid_until (in which case the call fails with ERR_QUOTE_EXPIRED)"
      - "increments Quote.version by 1"

  # --------------------------------------------------------- SalesOrder ----
  - method: GET
    path: "/sales-orders/{orderId}"
    description: "Read one order: both status axes, the quoted and invoiced money, deposits and metal variance."
    roles: [PlatformAdmin, SalesRep, BranchOps, CreditManager, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []

  - method: GET
    path: "/sales-orders"
    description: "List orders on either status axis. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, SalesRep, BranchOps, CreditManager, Customer]
    code: 200
    input: ["customer_id?", "quote_id?", "branch_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: SalesOrder[]
    side_effects: []

  - method: GET
    path: "/order-lines/{orderLineId}"
    description: "Read one order line, including allocation status and both priced variants."
    roles: [PlatformAdmin, SalesRep, BranchOps, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List order lines, filtered by order, part or allocation status. Results are ordered by line_number ASC within an order, otherwise by created_at ASC."
    roles: [PlatformAdmin, SalesRep, BranchOps, Customer]
    code: 200
    input: ["sales_order_id?", "product_id?", "allocation_status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/sales-orders/{orderId}/allocate"
    description: "Run the reel allocator over the order under the chosen policy. OCC-guarded on the order's version. Allocates what the branch has and leaves short lines SHORT."
    roles: [BranchOps]
    code: 200
    input: ["allocation_policy?", "expected_sales_order_version"]
    output: SalesOrder
    side_effects:
      - "runs calculations.reel_allocation_plan, creating RESERVED Allocation rows and raising Reel.allocated_length_ft"
      - "moves reels IN_STOCK -> ALLOCATED_PARTIAL, order to ALLOCATED or PARTIALLY_ALLOCATED, and recomputes every OrderLine.allocation_status"
      - "increments SalesOrder.version by 1"

  - method: POST
    path: "/sales-orders/{orderId}/release-allocations"
    description: "Compensating action: release every RESERVED allocation on the order and hand the footage back to the branch pool."
    roles: [BranchOps]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "every RESERVED Allocation -> RELEASED; Reel.allocated_length_ft decremented; fully-freed reels ALLOCATED_PARTIAL -> IN_STOCK"
      - "order returns to PENDING_ALLOCATION with every line UNALLOCATED"
      - "leaves branch_product_available_ft and every Reel.current_length_ft unchanged"
      - "increments SalesOrder.version by 1"

  # --------------------------------------------------------- Allocation ----
  - method: GET
    path: "/allocations/{allocationId}"
    description: "Read one allocation, including its commit branch, cut window and any remnant it spawned."
    roles: [PlatformAdmin, BranchOps, SalesRep]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: GET
    path: "/allocations"
    description: "List allocations; remnant_reel_id finds the cut that produced a given remnant. Results are ordered by sequence_no ASC within an order line, otherwise by created_at ASC."
    roles: [PlatformAdmin, BranchOps, SalesRep]
    code: 200
    input: ["order_line_id?", "sales_order_id?", "reel_id?", "remnant_reel_id?", "status?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  - method: POST
    path: "/allocations/{allocationId}/cut"
    description: "Cut branch of the commit fork: occupy a buffered cut-floor window, cut the footage, and settle the reel remainder into a remnant, scrap or depletion."
    roles: [BranchOps]
    code: 200
    input: ["cut_window_start", "cut_window_end"]
    output: Allocation
    side_effects:
      - "checks calculations.cut_floor_occupancy against branch.concurrent_cut_capacity"
      - "sets commit_mode = CUT and cut_charge_applied_cents; decrements Reel.current_length_ft and Reel.allocated_length_ft"
      - "settles the remainder: DEPLETED, SCRAPPED (raising Branch.scrap_ft_ytd) or a new REMNANT Reel linked by parent_reel_id and Allocation.remnant_reel_id"
      - "bubbles the order ALLOCATED -> STAGED once every allocation is COMMITTED"
      - "increments Allocation.version by 1"

  - method: POST
    path: "/allocations/{allocationId}/pick"
    description: "Pick branch of the commit fork: stage a whole master reel intact, with no footage mutation, no remnant and no cut charge."
    roles: [BranchOps]
    code: 200
    input: []
    output: Allocation
    side_effects:
      - "sets commit_mode = PICK; the reel's current_length_ft, allocated_length_ft and status are untouched"
      - "bubbles the order ALLOCATED -> STAGED once every allocation is COMMITTED"
      - "increments Allocation.version by 1"

  # -------------------------------------------------------- DeliveryRun ----
  - method: POST
    path: "/delivery-runs"
    description: "Schedule a jobsite delivery for one staged order on one truck, deriving the reel-handling method."
    roles: [BranchOps]
    code: 201
    input: ["sales_order_id", "truck_id", "window_start", "window_end", "jobsite_address", "jobsite_has_forklift?"]
    output: DeliveryRun
    side_effects:
      - "checks calculations.truck_window_conflict on the half-open window"
      - "derives heaviest_reel_lbs and reel_handling via calculations.jobsite_reel_handling and rejects a BOOM_LIFT run on a truck without one"
      - "copies branch_id from the order"

  - method: GET
    path: "/delivery-runs/{runId}"
    description: "Read one delivery run, including derived reel handling."
    roles: [PlatformAdmin, BranchOps, Driver, Customer]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: []

  - method: GET
    path: "/delivery-runs"
    description: "List delivery runs by order, truck, branch or status. Results are ordered by created_at ASC."
    roles: [PlatformAdmin, BranchOps, Driver, Customer]
    code: 200
    input: ["sales_order_id?", "truck_id?", "branch_id?", "status?", "limit?", "offset?"]
    output: DeliveryRun[]
    side_effects: []

  - method: POST
    path: "/delivery-runs/{runId}/dispatch"
    description: "Driver dispatches their own truck on a scheduled run."
    roles: [Driver]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: ["sets dispatched_at = current_utc", "increments DeliveryRun.version by 1"]

  - method: POST
    path: "/delivery-runs/{runId}/deliver"
    description: "Driver completes the run. Fires the delivery cascade: order delivered, allocations consumed, reels on jobsite, order invoiced at the delivery-day copper index, customer balance and credit posture updated."
    roles: [Driver]
    code: 200
    input: []
    output: DeliveryRun
    side_effects:
      - "CASCADE LINK 1 -- the SalesOrder moves STAGED -> DELIVERED"
      - "CASCADE LINK 2 -- because the order was delivered, COMMITTED Allocations move to CONSUMED, PICK reels move to ON_JOBSITE, and billing_status moves UNBILLED -> INVOICED with calculations.quote_line_pricing variant INVOICED re-run"
      - "CASCADE LINK 3 -- because the order was invoiced, customer.open_balance_cents and customer.deposit_liability_cents rise"
      - "CASCADE LINK 4 -- because the balance rose, customer.available_credit_cents is recomputed and the customer may move ACTIVE -> CREDIT_HOLD"
      - "CASCADE LINK 5 -- because the customer went on credit hold, their ISSUED quotes are VOIDED with void_reason CREDIT_HOLD and their PENDING_ALLOCATION orders move to HELD"

  # ------------------------------------------------------------- Return ----
  - method: POST
    path: "/order-lines/{orderLineId}/return"
    description: "Return one returnable reel delivered under this order line and credit the deposit. Cut lines are non-returnable."
    roles: [BranchOps]
    code: 200
    input: ["reel_id", "condition"]
    output: Reel
    side_effects:
      - "reel ON_JOBSITE -> IN_STOCK; delivered_at cleared, delivered_sales_order_id retained as the shipment record"
      - "CASCADE LINK 1 -- calculations.reel_deposit_credit issues the credit; order.deposit_credited_cents rises; customer.deposit_liability_cents falls by the FULL deposit and open_balance_cents falls by the credit"
      - "CASCADE LINK 2 -- because the balance fell, the customer may move CREDIT_HOLD -> ACTIVE"
      - "CASCADE LINK 3 -- because the customer became ACTIVE, their HELD orders move back to PENDING_ALLOCATION"
      - "when the returned reel was the order's last ON_JOBSITE reel, billing_status moves INVOICED -> CREDITED"

  # ---------------------------------------------------- test-driving ------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every deadline (quote validity, deposit return window) is evaluated against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["no entity state changes; subsequent requests observe the new current_utc"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed for the endpoint in §1.5"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acted on a resource it does not own (BranchOps outside its branch, Driver on another truck's run, Customer on another customer's quote or order)"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body, missing required field, unknown enum member, out-of-range number, or pagination limit outside [1,100]"
  - id: ERR_BRANCH_NOT_FOUND
    http: 404
    condition: "branch id in path or body does not resolve"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer id in path or body does not resolve"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product id in body does not resolve"
  - id: ERR_TRUCK_NOT_FOUND
    http: 404
    condition: "truck id in path or body does not resolve"
  - id: ERR_REEL_NOT_FOUND
    http: 404
    condition: "reel id in path or body does not resolve"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "quote id in path does not resolve"
  - id: ERR_QUOTE_LINE_NOT_FOUND
    http: 404
    condition: "quote line id in path does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "sales order id in path or body does not resolve"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "order line id in path does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocation id in path does not resolve"
  - id: ERR_DELIVERY_RUN_NOT_FOUND
    http: 404
    condition: "delivery run id in path does not resolve"
  - id: ERR_COPPER_INDEX_NOT_FOUND
    http: 404
    condition: "copper index entry id in path does not resolve"
  - id: ERR_DUPLICATE_PART_NUMBER
    http: 409
    condition: "a CableProduct with this part_number already exists"
  - id: ERR_DUPLICATE_INDEX_DATE
    http: 409
    condition: "a CopperIndexEntry with this effective_date already exists"
  - id: ERR_QUOTE_NOT_DRAFT
    http: 409
    condition: "line add or issue attempted on a quote whose status is not DRAFT"
  - id: ERR_QUOTE_NOT_ISSUED
    http: 409
    condition: "reprice or convert attempted on a quote whose status is not ISSUED"
  - id: ERR_QUOTE_HAS_NO_LINES
    http: 409
    condition: "issue attempted on a DRAFT quote with zero lines"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "convert attempted after current_utc passed quote.valid_until; the quote is moved to EXPIRED by the same request"
  - id: ERR_NO_COPPER_INDEX
    http: 409
    condition: "issue attempted with no published CopperIndexEntry whose effective_date is on or before the current logical date"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "a SalesRep tried to issue their own quote whose line_subtotal_cents is at or above SOD_REVIEW_THRESHOLD_CENTS"
  - id: ERR_PUT_UP_NOT_ALLOWED
    http: 422
    condition: "the requested put_up is not in product.allowed_put_ups"
  - id: ERR_BELOW_ABSOLUTE_MIN_CUT
    http: 422
    condition: "a CUT line requested fewer than ABSOLUTE_MIN_CUT_FT (25) feet per conductor"
  - id: ERR_ORDER_NOT_ALLOCATABLE
    http: 409
    condition: "allocate attempted on an order whose fulfillment_status is not PENDING_ALLOCATION or PARTIALLY_ALLOCATED"
  - id: ERR_NO_ELIGIBLE_REEL
    http: 409
    condition: "the allocation run could not create a single Allocation row for the whole order"
  - id: ERR_PARALLEL_SET_INCOMPLETE
    http: 409
    condition: "no single lot_code at the branch offers parallel_set_size distinct reels each holding at least billable_length_ft available"
  - id: ERR_ALLOCATION_NOT_RESERVED
    http: 409
    condition: "cut, pick or release attempted on an allocation whose status is not RESERVED"
  - id: ERR_PUT_UP_MISMATCH
    http: 409
    condition: "cut attempted on a MASTER_REEL line, or pick attempted on a CUT line"
  - id: ERR_INVALID_CUT_WINDOW
    http: 422
    condition: "cut_window_end is not strictly after cut_window_start"
  - id: ERR_CUT_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the buffered closed cut window collides with at least branch.concurrent_cut_capacity existing buffered windows at the branch"
  - id: ERR_TRUCK_BRANCH_MISMATCH
    http: 409
    condition: "the assigned truck is domiciled at a different branch than the order"
  - id: ERR_TRUCK_WINDOW_CONFLICT
    http: 409
    condition: "the half-open delivery window overlaps another run on the same truck"
  - id: ERR_BOOM_LIFT_REQUIRED
    http: 409
    condition: "the derived reel_handling is BOOM_LIFT but the assigned truck has none"
  - id: ERR_ORDER_HAS_ACTIVE_RUN
    http: 409
    condition: "the order already has a DeliveryRun in status SCHEDULED or DISPATCHED"
  - id: ERR_ORDER_NOT_STAGED
    http: 409
    condition: "dispatch attempted while the run's order is not STAGED"
  - id: ERR_RUN_INVALID_STATE
    http: 409
    condition: "dispatch attempted on a run that is not SCHEDULED, or deliver attempted on a run that is not DISPATCHED"
  - id: ERR_CUT_ITEM_NON_RETURNABLE
    http: 409
    condition: "return attempted against an order line whose put_up is CUT"
  - id: ERR_REEL_NOT_ON_JOBSITE
    http: 409
    condition: "return attempted on a reel whose status is not ON_JOBSITE"
  - id: ERR_REEL_NOT_ON_ORDER_LINE
    http: 409
    condition: "the reel being returned was not delivered under the named order line's order"
  - id: ERR_ORDER_NOT_DELIVERED
    http: 409
    condition: "return attempted while the order's fulfillment_status is not DELIVERED"
  - id: ERR_CUSTOMER_CREDIT_HOLD
    http: 402
    condition: "convert or allocate attempted while the customer's credit_status is CREDIT_HOLD"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "convert attempted while customer.available_credit_cents is below quote.quoted_total_cents"
  - id: ERR_STALE_QUOTE_VERSION
    http: 412
    condition: "expected_quote_version does not match the quote's current version"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_sales_order_version does not match the order's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Catalog, network and market-data operator. Owns branches, trucks, products, the published copper index and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /branches"
      - "POST /trucks"
      - "POST /products"
      - "POST /copper-index-entries"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers (with CreditManager)"
      - "POST /reels (with BranchOps)"
      - "every GET read endpoint"

  - name: SalesRep
    description: "Quoting desk. Builds, issues, reprices and converts quotes. Cannot touch inventory or delivery."
    identity: opaque
    exclusive_operations:
      - "POST /quotes"
      - "POST /quotes/{quoteId}/lines"
      - "POST /quotes/{quoteId}/issue"
      - "POST /quotes/{quoteId}/reprice"
      - "POST /quotes/{quoteId}/convert"
    shared_operations:
      - "GET /quotes, GET /quotes/{quoteId}, GET /quote-lines, GET /quote-lines/{quoteLineId}"
      - "GET /sales-orders, GET /sales-orders/{orderId}, GET /order-lines, GET /order-lines/{orderLineId}"
      - "GET /reels, GET /reels/{reelId}, GET /allocations, GET /allocations/{allocationId}, GET /products/{productId}, GET /branches/{branchId}, GET /customers/{customerId}, GET /copper-index-entries"

  - name: BranchOps
    description: "Branch warehouse operator. X-User-ID is the id of the Branch this operator runs; every inventory, allocation, cut, pick, delivery-scheduling and return action is scoped to that branch."
    identity: "entity_backed:Branch"
    exclusive_operations:
      - "POST /sales-orders/{orderId}/allocate"
      - "POST /sales-orders/{orderId}/release-allocations"
      - "POST /allocations/{allocationId}/cut"
      - "POST /allocations/{allocationId}/pick"
      - "POST /delivery-runs"
      - "POST /order-lines/{orderLineId}/return"
    shared_operations:
      - "POST /reels (with PlatformAdmin)"
      - "GET /reels, GET /reels/{reelId}, GET /allocations, GET /allocations/{allocationId}"
      - "GET /sales-orders, GET /sales-orders/{orderId}, GET /order-lines, GET /order-lines/{orderLineId}"
      - "GET /delivery-runs, GET /delivery-runs/{runId}, GET /trucks, GET /trucks/{truckId}, GET /products/{productId}, GET /branches/{branchId}, GET /copper-index-entries"

  - name: Driver
    description: "Delivery driver. X-User-ID is the id of the Truck being driven; a driver may only dispatch and deliver runs assigned to that truck."
    identity: "entity_backed:Truck"
    exclusive_operations:
      - "POST /delivery-runs/{runId}/dispatch"
      - "POST /delivery-runs/{runId}/deliver"
    shared_operations:
      - "GET /delivery-runs, GET /delivery-runs/{runId}, GET /trucks, GET /trucks/{truckId}"

  - name: CreditManager
    description: "Credit control desk. Opens customer accounts and adjusts limits and balances; never quotes, allocates or delivers."
    identity: opaque
    exclusive_operations:
      - "POST /customers/{customerId}/credit-adjustments"
    shared_operations:
      - "POST /customers (with PlatformAdmin)"
      - "GET /customers/{customerId}, GET /sales-orders, GET /sales-orders/{orderId}, GET /branches/{branchId}, GET /copper-index-entries, GET /copper-index-entries/{entryId}"

  - name: Customer
    description: "Contractor buying cable. X-User-ID is the id of the Customer record; may read only its own quotes, orders and delivery runs."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET /quotes, GET /quotes/{quoteId}, GET /quote-lines, GET /quote-lines/{quoteLineId}"
      - "GET /sales-orders, GET /sales-orders/{orderId}, GET /order-lines, GET /order-lines/{orderLineId}"
      - "GET /delivery-runs, GET /delivery-runs/{runId}, GET /customers/{customerId}"
