  - section: errors
    instances:
      - name: auth_headers_missing_or_unknown_role_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_10
          - validations.priority_15
          - errors.ERR_UNAUTHENTICATED
          - endpoints."POST /bonus-plans"
        distinguishing_aspect: |
          Priority 10 and 15 sit above every business rule, so a header problem is
          reported as 401 ERR_UNAUTHENTICATED before the request body is even
          schema-checked: attempt 1 omits X-User-Role entirely while carrying a
          payload that would otherwise be a perfectly legal plan, and attempt 2
          presents a syntactically fine but undeclared role name. Neither attempt
          returns ERR_INVALID_REQUEST and neither creates a row — the plan count
          stays at the single plan the setup created.
        test_recipe:
          setup:
            - "One business unit and one valid bonus plan exist (created with correct headers)."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "K1", name: "Unit K1" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Auth Probe Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Headerless Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: "(no X-User-Role header)"
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Unknown Role Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PayrollClerk
              as_user_id: "pc_1"
            - call: "GET /bonus-plans"
              payload: {}
              as: PlanAdmin
          assert:
            - "Attempt 1 (X-User-Role header absent): HTTP 401, error_id == ERR_UNAUTHENTICATED"
            - "Attempt 2 (X-User-Role: PayrollClerk, not one of the six declared roles): HTTP 401, error_id == ERR_UNAUTHENTICATED"
            - "Neither attempt returns ERR_INVALID_REQUEST or ERR_UNAUTHORIZED"
            - "Attempt 3 (GET /bonus-plans as PlanAdmin): HTTP 200, total_count == 1, has_more == false"
            - "data[0].plan_name == the setup plan name 'FY26 Auth Probe Plan'"

