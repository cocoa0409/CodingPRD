# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Field Service & Warranty Depot Repair. 9 rules x >=2 instances.
# All recipes replay from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Logical clock default: 2026-08-01T00:00:00Z unless set_current_utc is called.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: repair_estimate_provisional_vs_final
        grounds:
          - calculations.repair_cost_estimate
          - entities.ServiceRMA.fields.provisional_estimate_cents
          - entities.ServiceRMA.fields.final_estimate_cents
        distinguishing_aspect: |
          Same RMA, two valid estimate algorithms on the ServiceRMA domain:
          provisional flat book rate (15000) vs final labor+raw-parts estimate
          (30000) — both pinned on different fields and provably different
          numbers for identical model constants.
        test_recipe:
          setup:
            - "Model M1: flat_rate_repair_cents 15000, labor rate 200/min, replacement 100000, threshold 60%"
            - "Part P1 cost 5000, stock 10; failure code FC1; RETAIL unit purchased 2026-01-01 (in warranty at default clock 2026-08-01)"
            - "RMA authorized then received then triaged; provisional estimate already pinned"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "STANDARD" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} , captures: { prov: $.data.provisional_estimate_cents } }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 100, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 2 } ] } }
          assert:
            - "ServiceRMA.${rma}.provisional_estimate_cents == 15000 (flat book rate variant)"
            - "ServiceRMA.${rma}.final_estimate_cents == 30000 (100*200 + 2*5000)"
            - "ServiceRMA.${rma}.provisional_estimate_cents != ServiceRMA.${rma}.final_estimate_cents"
            - "ServiceRMA.${rma}.decision == REPAIR (30000 < 60000 threshold)"
            - "ServiceRMA.${rma}.status == IN_REPAIR (in-warranty REPAIR auto-route)"

      - name: warranty_end_purchase_vs_ship_basis
        grounds:
          - calculations.warranty_eligibility
          - entities.Unit.fields.channel
          - entities.Unit.fields.purchase_date
          - entities.Unit.fields.ship_date
        distinguishing_aspect: |
          Same model constants, two valid warranty bases on the Unit domain:
          RETAIL purchase_date basis yields end 2026-08-05 (IN_WARRANTY at
          2026-08-01) while ENTERPRISE ship_date basis yields 2026-07-01
          (OUT_OF_WARRANTY) — the two variants disagree on identical clock.
        test_recipe:
          setup:
            - "Model M1 standard_warranty_days 365; customer; RETAIL unit purchased 2025-08-05; ENTERPRISE unit shipped 2025-07-01"
            - "Logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-R", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2025-08-05", ship_date: "2025-07-01" }, captures: { unit_r: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-E", model_id: "${mdl}", customer_id: "${cust}", channel: "ENTERPRISE", purchase_date: "2025-08-05", ship_date: "2025-07-01" }, captures: { unit_e: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_r}", reported_issue: "issue R" }, captures: { rma_r: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_e}", reported_issue: "issue E" }, captures: { rma_e: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma_r}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_e}/authorize", as: IntakeAgent, payload: {} }
          assert:
            - "ServiceRMA.${rma_r}.coverage_path == IN_WARRANTY"
            - "ServiceRMA.${rma_r}.warranty_end_date_used == '2026-08-05' (purchase basis)"
            - "ServiceRMA.${rma_e}.coverage_path == OUT_OF_WARRANTY"
            - "ServiceRMA.${rma_e}.warranty_end_date_used == '2026-07-01' (ship basis; purchase_date ignored)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: decision_threshold_nested_inputs
        grounds:
          - calculations.repair_vs_replace_decision
          - calculations.repair_cost_estimate
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — floor() on the
          threshold term, conditional branches on repairability and recurring
          score, nested comparison of final estimate vs threshold; twin RMAs
          straddling the 60000-cent threshold diverge to REPLACE vs REPAIR.
        test_recipe:
          setup:
            - "Model M1: replacement 100000, threshold 60% -> threshold_cents 60000; labor 200/min; part P1 5000"
            - "Two in-warranty units SN-A / SN-B, both triaged with FC1"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-A", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_a: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-B", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_b: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_a}", reported_issue: "dead A" }, captures: { rma_a: $.data.id } }
            - { call: "POST /depot/rmas/${rma_a}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_a}/receive", as: IntakeAgent, payload: { serial_number: "SN-A" } }
            - { call: "POST /depot/rmas/${rma_a}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_b}", reported_issue: "dead B" }, captures: { rma_b: $.data.id } }
            - { call: "POST /depot/rmas/${rma_b}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_b}/receive", as: IntakeAgent, payload: { serial_number: "SN-B" } }
            - { call: "POST /depot/rmas/${rma_b}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
          trigger:
            - { call: "POST /depot/rmas/${rma_a}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 250, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 2 } ] } }
            - { call: "POST /depot/rmas/${rma_b}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 249, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 2 } ] } }
          assert:
            - "ServiceRMA.${rma_a}.final_estimate_cents == 60000 (250*200 + 2*5000)"
            - "ServiceRMA.${rma_a}.decision == REPLACE (60000 >= 60000 threshold)"
            - "ServiceRMA.${rma_a}.status == REPLACEMENT_PENDING"
            - "ServiceRMA.${rma_b}.final_estimate_cents == 59800 (249*200 + 2*5000)"
            - "ServiceRMA.${rma_b}.decision == REPAIR"
            - "ServiceRMA.${rma_b}.status == IN_REPAIR"

      - name: quote_line_rounding_order_pinned
        grounds:
          - calculations.quote_total
          - entities.Quote.fields.parts_subtotal_cents
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — per-line round_half_up THEN sum is
          pinned; sum-then-round would give parts_subtotal 2196 and total 2372,
          but the pinned order yields 2195 and 2371. One-cent divergence is the
          assertion.
        test_recipe:
          setup:
            - "Model M1 labor 200/min; parts PA cost 1045 and PB cost 1046 (chosen so raw line fractions .25 and .30 sum across .50)"
            - "OUT_OF_WARRANTY unit (purchased 2024-01-01, 365-day warranty ended 2025-01-01)"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "PA", name: "Board A", unit_cost_cents: 1045, initial_stock: 10 }, captures: { part_a: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "PB", name: "Board B", unit_cost_cents: 1046, initial_stock: 10 }, captures: { part_b: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 0, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part_a}", quantity: 1 }, { part_id: "${part_b}", quantity: 1 } ] } }
          trigger:
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q_sub: "$.data[0].parts_subtotal_cents", q_tax: "$.data[0].tax_cents", q_total: "$.data[0].total_cents" } }
          assert:
            - "Quote.parts_subtotal_cents == 2195 (round(1045*1.05)=1097 + round(1046*1.05)=1098; per-line first)"
            - "Quote.labor_cents == 0"
            - "Quote.tax_cents == 176 (round_half_up(2195*0.08)=round(175.6))"
            - "Quote.total_cents == 2371 (2195 + 176 + 0)"
            - "Quote.status == SENT and Quote.quote_seq == 1"
            - "ServiceRMA.${rma}.status == AWAITING_QUOTE_APPROVAL"

      - name: settlement_tier_keyed_on_gross
        grounds:
          - calculations.settlement_total
          - calculations.loaner_late_fee
          - entities.ServiceRMA.fields.settlement_total_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — loyalty tier is keyed on gross
          BEFORE credit; gross 51780 earns 10% credit 5178 giving net 46602,
          which is itself below the 50000 tier. Pinned evaluation order
          (gross -> tier -> credit -> net) forbids re-iteration.
        test_recipe:
          setup:
            - "OOW LOANER RMA with approved quote total 44280 (4x P1 lines @5250 + labor 100min=20000, tax 3280)"
            - "Loaner returned 3 days past due_date -> late fee 3*2500 = 7500; gross 44280+7500 = 51780"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5, loaner_grace_days: 10 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 100, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 4 } ] } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q1: "$.data[0].id" } }
            - { call: "POST /depot/loaner-reservations/${res}/ship", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/quotes/${q1}/approve", as: Customer, as_user_id: "${cust}", payload: { payment_reference: "pay-1" } }
            - { call: "GET /depot/rmas/${rma}", as: DepotTechnician, captures: { rma_v: $.data.version } }
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 4, failure_code_id: "${fc}", expected_rma_version: "${rma_v}" } }
            - { call: "POST /depot/rmas/${rma}/repair-complete", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
            - { call: "POST /depot/rmas/${rma}/qa-release", as: DepotTechnician, as_user_id: "tech-2", payload: { outcome: "PASS" } }
            - { call: "POST /depot/rmas/${rma}/ship", as: DepotTechnician, as_user_id: "tech-2", payload: { carrier: "UPS", tracking_number: "1Z" } }
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-14T00:00:00Z" } }
            - { call: "POST /depot/loaner-reservations/${res}/return", as: IntakeAgent, payload: { condition: "OK" } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/close", as: IntakeAgent, payload: {} }
          assert:
            - "LoanerReservation.${res}.due_date == '2026-08-11' (ship 2026-08-01 + 10 grace days)"
            - "LoanerReservation.${res}.late_fee_cents == 7500 (3 days after due date: 08-12..08-14)"
            - "ServiceRMA.${rma}.settlement_gross_cents == 51780 (44280 + 7500)"
            - "ServiceRMA.${rma}.settlement_loyalty_credit_cents == 5178 (tier 10% keyed on gross 51780)"
            - "ServiceRMA.${rma}.settlement_total_cents == 46602 (51780 - 5178; net below tier is NOT re-evaluated)"
            - "ServiceRMA.${rma}.status == CLOSED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: rma_quote_decline_revise_cycle
        grounds:
          - state_machines.ServiceRMA.QUOTE_DECLINED_to_AWAITING_QUOTE_APPROVAL
          - state_machines.Quote.DECLINED_to_SUPERSEDED
          - concurrency_rules[quote-create-supersede-stale-rma]
        distinguishing_aspect: |
          ServiceRMA cycles AWAITING_QUOTE_APPROVAL -> QUOTE_DECLINED ->
          AWAITING_QUOTE_APPROVAL -> IN_REPAIR while Quote runs SENT -> DECLINED
          -> SUPERSEDED in lockstep; quote_seq increments and the SLA pause
          interval opened at diagnose closes exactly once at approve.
        test_recipe:
          setup:
            - "OOW RMA diagnosed REPAIR; auto quote Q1 SENT (total 9990: line 5250 + labor 4000, tax 740)"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 20, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q1: "$.data[0].id" } }
          trigger:
            - { call: "POST /depot/quotes/${q1}/decline", as: Customer, as_user_id: "${cust}", payload: {} }
            - { call: "GET /depot/rmas/${rma}", as: DepotTechnician, captures: { rma_v: $.data.version } }
            - { call: "POST /depot/rmas/${rma}/quotes", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes: 50, parts_lines: [ { part_id: "${part}", quantity: 1 } ], expected_rma_version: "${rma_v}" }, captures: { q2: $.data.id } }
            - { call: "POST /depot/quotes/${q2}/approve", as: Customer, as_user_id: "${cust}", payload: { payment_reference: "pay-2" } }
          assert:
            - "Quote.${q1}.status == SUPERSEDED (DECLINED quote superseded by revision)"
            - "Quote.${q2}.quote_seq == 2"
            - "Quote.${q2}.total_cents == 16470 (line 5250 + labor 10000 = 15250; tax round(15250*0.08)=1220)"
            - "Quote.${q2}.status == APPROVED"
            - "ServiceRMA.${rma}.status == IN_REPAIR after the cycle"
            - "ServiceRMA.${rma}.sla_pause_intervals has exactly 1 closed interval (opened at diagnose, closed at approve)"

      - name: loaner_unit_full_cycle
        grounds:
          - state_machines.LoanerUnit.AVAILABLE_to_RESERVED
          - state_machines.LoanerUnit.INSPECTION_to_AVAILABLE
          - entities.LoanerUnit.fields.completed_loan_cycles
        distinguishing_aspect: |
          LoanerUnit loops AVAILABLE -> RESERVED -> SHIPPED_OUT -> INSPECTION ->
          AVAILABLE (a true cycle on a different entity than ServiceRMA), with
          completed_loan_cycles incrementing only when the loop closes via PASS.
        test_recipe:
          setup:
            - "In-warranty LOANER RMA authorized; pool unit LU-1 grade A deposit 40000; customer credit 100000"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
          trigger:
            - { call: "POST /depot/loaner-reservations/${res}/ship", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/loaner-reservations/${res}/return", as: IntakeAgent, payload: { condition: "OK" } }
            - { call: "POST /depot/loaner-units/${lu}/inspect", as: DepotTechnician, as_user_id: "tech-9", payload: { outcome: "PASS" }, captures: { lu_status: $.data.status, lu_cycles: $.data.completed_loan_cycles } }
          assert:
            - "LoanerReservation.${res}.status == CLOSED_RETURNED"
            - "LoanerReservation.${res}.late_fee_cents == 0 (due_date never set: repaired unit not shipped)"
            - "LoanerUnit.${lu}.status == AVAILABLE after inspect PASS (cycle closed)"
            - "LoanerUnit.${lu}.completed_loan_cycles == 1"
            - "Customer.${cust}.deposit_exposure_cents == 0 (40000 charged then released)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggering transitions)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: parts_consumption_escalation_cascade
        grounds:
          - state_machines.ServiceRMA (POST /depot/rmas/{rmaId}/parts side effects)
          - calculations.recurring_failure_score
          - state_machines.EngineeringEscalation
        distinguishing_aspect: |
          Depth-3 chain from POST .../parts: RepairLine created -> recurring
          score recomputed -> EngineeringEscalation auto-created OPEN ->
          ServiceRMA.engineering_review_pending set -> qa-release PASS blocked
          with ERR_ENGINEERING_REVIEW_PENDING. Each hop is caused by the
          previous one, not by the original request directly.
        test_recipe:
          setup:
            - "Prior RMA1 for the same unit with primary code F-CAP-02 CLOSED at 2026-06-01 (within 90d of 2026-08-01 -> weight 2)"
            - "Current RMA2 triaged with a DIFFERENT code F-PWR-01 (score 2 < 3, no escalation at triage)"
            - "Model recurring_failure_threshold == 3"
          setup_api_calls:
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-06-01T00:00:00Z" } }
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5, recurring_failure_threshold: 3 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc1: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-CAP-02", description: "Capacitor", severity: "MEDIUM" }, captures: { fc2: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "first failure" }, captures: { rma1: $.data.id } }
            - { call: "POST /depot/rmas/${rma1}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma1}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma1}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc2}" } }
            - { call: "POST /depot/rmas/${rma1}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] }, captures: { rma1_v: $.data.version } }
            - { call: "POST /depot/rmas/${rma1}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc2}", expected_rma_version: "${rma1_v}" } }
            - { call: "POST /depot/rmas/${rma1}/repair-complete", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
            - { call: "POST /depot/rmas/${rma1}/qa-release", as: DepotTechnician, as_user_id: "tech-2", payload: { outcome: "PASS" } }
            - { call: "POST /depot/rmas/${rma1}/ship", as: DepotTechnician, as_user_id: "tech-2", payload: { carrier: "UPS", tracking_number: "1Z1" } }
            - { call: "POST /depot/rmas/${rma1}/close", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-01T00:00:00Z" } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "second failure" }, captures: { rma2: $.data.id } }
            - { call: "POST /depot/rmas/${rma2}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma2}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma2}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc1}" } }
            - { call: "POST /depot/rmas/${rma2}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] }, captures: { rma2_v: $.data.version } }
          trigger:
            - { call: "POST /depot/rmas/${rma2}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc2}", expected_rma_version: "${rma2_v}" } }
            - { call: "GET /depot/engineering-escalations?rma_id=${rma2}", as: EngineeringLead, captures: { esc: "$.data[0].id", esc_status: "$.data[0].status", esc_fc: "$.data[0].failure_code_id" } }
            - { call: "POST /depot/rmas/${rma2}/repair-complete", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
            - { call: "POST /depot/rmas/${rma2}/qa-release", as: DepotTechnician, as_user_id: "tech-2", payload: { outcome: "PASS" }, captures: { err: $.data.error_id } }
          assert:
            - "EngineeringEscalation.${esc}.status == OPEN and trigger_source == AUTO_RECURRING"
            - "EngineeringEscalation.${esc}.failure_code_id == ${fc2} (score 2 prior + 2 current = 4 >= 3)"
            - "EngineeringEscalation.${esc}.model_id == ${mdl}"
            - "ServiceRMA.${rma2}.engineering_review_pending == true (cascade end)"
            - "qa-release rejected with error_id == ERR_ENGINEERING_REVIEW_PENDING"
            - "ServiceRMA.${rma2}.status == QA_HOLD (blocked transition leaves state intact)"

      - name: damaged_loaner_return_cascade
        grounds:
          - state_machines.LoanerReservation.SHIPPED_to_CLOSED_DAMAGED
          - state_machines.LoanerUnit.SHIPPED_OUT_to_INSPECTION
          - calculations.loaner_late_fee
        distinguishing_aspect: |
          Depth-2 chain from POST .../return: reservation closes CLOSED_DAMAGED
          with damage fee min(assessment, deposit) (mutation B), which itself
          drives LoanerUnit SHIPPED_OUT -> INSPECTION (mutation C); a follow-up
          inspect FAIL then retires the unit. Trigger differs from the
          parts-consumption cascade.
        test_recipe:
          setup:
            - "LOANER RMA authorized; LU-1 (deposit 40000) reserved and shipped to customer"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
            - { call: "POST /depot/loaner-reservations/${res}/ship", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/loaner-reservations/${res}/return", as: IntakeAgent, payload: { condition: "DAMAGED", damage_assessment_cents: 30000 }, captures: { res_status: $.data.status, dmg: $.data.damage_fee_cents } }
            - { call: "POST /depot/loaner-units/${lu}/inspect", as: DepotTechnician, as_user_id: "tech-9", payload: { outcome: "FAIL" }, captures: { lu_status: $.data.status } }
          assert:
            - "LoanerReservation.${res}.status == CLOSED_DAMAGED"
            - "LoanerReservation.${res}.damage_fee_cents == 30000 (min(30000 assessment, 40000 deposit))"
            - "LoanerReservation.${res}.late_fee_cents == 0 (due_date null)"
            - "LoanerUnit.${lu}.status == RETIRED (INSPECTION then FAIL)"
            - "Customer.${cust}.deposit_exposure_cents == 0"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: quote_approve_declined_state_beats_payment
        grounds:
          - validations[priority=6]
          - validations[priority=23]
          - errors[ERR_INVALID_QUOTE_STATE]
          - errors[ERR_PAYMENT_REQUIRED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: approving a DECLINED quote
          with no payment_reference violates priority-6 (state) and priority-23
          (fiscal); the state error ERR_INVALID_QUOTE_STATE must win.
        test_recipe:
          setup:
            - "OOW RMA in QUOTE_DECLINED; quote Q1 DECLINED"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 20, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q1: "$.data[0].id" } }
            - { call: "POST /depot/quotes/${q1}/decline", as: Customer, as_user_id: "${cust}", payload: {} }
          trigger:
            - { call: "POST /depot/quotes/${q1}/approve", as: Customer, as_user_id: "${cust}", payload: {} , captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_QUOTE_STATE (priority 6 state beats priority 23 business_fiscal ERR_PAYMENT_REQUIRED)"
            - "Quote.${q1}.status == DECLINED (unchanged)"
            - "ServiceRMA.${rma}.status == QUOTE_DECLINED (unchanged)"

      - name: containment_beats_exchange_not_fulfilled
        grounds:
          - validations[priority=7]
          - validations[priority=25]
          - errors[ERR_MODEL_CONTAINMENT]
          - errors[ERR_EXCHANGE_NOT_FULFILLED]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint: shipping a
          replacement while the model is under containment AND no exchange
          reservation has shipped violates priority 7 and priority 25; the
          safety error ERR_MODEL_CONTAINMENT must win.
        test_recipe:
          setup:
            - "Model M1 under containment via manual escalation on RMA-X (contain sets containment_flag)"
            - "ADVANCE_EXCHANGE RMA-Y for same model diagnosed BER -> REPLACE -> REPLACEMENT_PENDING, with NO loaner reservation at all"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-X", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_x: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-Y", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_y: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-BAT-09", description: "Battery swell", severity: "CRITICAL" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_x}", reported_issue: "safety" }, captures: { rma_x: $.data.id } }
            - { call: "POST /depot/engineering-escalations", as: EngineeringLead, payload: { rma_id: "${rma_x}", failure_code_id: "${fc}" }, captures: { esc: $.data.id } }
            - { call: "POST /depot/engineering-escalations/${esc}/contain", as: EngineeringLead, payload: {} }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_y}", reported_issue: "swollen", service_option: "ADVANCE_EXCHANGE" }, captures: { rma_y: $.data.id } }
            - { call: "POST /depot/rmas/${rma_y}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_y}/receive", as: IntakeAgent, payload: { serial_number: "SN-Y" } }
            - { call: "POST /depot/rmas/${rma_y}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma_y}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 30, repairability: "BER", planned_parts: [] } }
          trigger:
            - { call: "POST /depot/rmas/${rma_y}/ship", as: DepotTechnician, as_user_id: "tech-1", payload: { carrier: "UPS", tracking_number: "1Z9" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MODEL_CONTAINMENT (priority 7 business_safety beats priority 25 business_constraint ERR_EXCHANGE_NOT_FULFILLED)"
            - "ServiceRMA.${rma_y}.status == REPLACEMENT_PENDING (unchanged)"
            - "ServiceRMA.${rma_y}.decision == REPLACE (BER forced)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: decision_threshold_exact_equality
        grounds:
          - calculations.repair_vs_replace_decision
          - state_machines.ServiceRMA.DIAGNOSED_to_REPLACEMENT_PENDING
        distinguishing_aspect: |
          Metric: cents. final_estimate exactly equal to floor(100000*60/100)=60000
          hits the inclusive >= boundary and routes REPLACE via
          POST /depot/rmas/{rmaId}/diagnose — one cent below (59800) routes REPAIR.
        test_recipe:
          setup:
            - "Model M1 threshold 60% of 100000 = 60000; in-warranty unit triaged"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 250, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 2 } ] } }
          assert:
            - "ServiceRMA.${rma}.final_estimate_cents == 60000 (exactly threshold)"
            - "ServiceRMA.${rma}.decision == REPLACE (>= inclusive boundary)"
            - "ServiceRMA.${rma}.status == REPLACEMENT_PENDING"

      - name: warranty_last_day_inclusive
        grounds:
          - calculations.warranty_eligibility
          - validations[priority=4]
        distinguishing_aspect: |
          Metric: calendar date. Authorize (POST /depot/rmas/{rmaId}/authorize)
          on the exact warranty end date is IN_WARRANTY (<= inclusive), while a
          unit whose end date is one day earlier is OUT_OF_WARRANTY — a
          different metric and endpoint than the cents threshold.
        test_recipe:
          setup:
            - "Unit A purchased 2025-08-01 (end 2026-08-01 == clock); unit B purchased 2025-07-31 (end 2026-07-31 < clock)"
            - "Logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-A", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2025-08-01", ship_date: "2025-08-01" }, captures: { unit_a: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-B", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2025-07-31", ship_date: "2025-07-31" }, captures: { unit_b: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_a}", reported_issue: "A" }, captures: { rma_a: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_b}", reported_issue: "B" }, captures: { rma_b: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma_a}/authorize", as: IntakeAgent, payload: {}, captures: { cov_a: $.data.coverage_path, end_a: $.data.warranty_end_date_used } }
            - { call: "POST /depot/rmas/${rma_b}/authorize", as: IntakeAgent, payload: {}, captures: { cov_b: $.data.coverage_path, end_b: $.data.warranty_end_date_used } }
          assert:
            - "ServiceRMA.${rma_a}.coverage_path == IN_WARRANTY (as_of == end date, inclusive)"
            - "ServiceRMA.${rma_a}.warranty_end_date_used == '2026-08-01'"
            - "ServiceRMA.${rma_b}.coverage_path == OUT_OF_WARRANTY (end 2026-07-31 one day before clock)"
            - "ServiceRMA.${rma_b}.warranty_end_date_used == '2026-07-31'"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rma_repair_gated_by_quote_approval
        grounds:
          - state_machines.ServiceRMA.AWAITING_QUOTE_APPROVAL_to_IN_REPAIR
          - state_machines.Quote.SENT_to_APPROVED
        distinguishing_aspect: |
          Entity pair ServiceRMA x Quote: while the current quote is SENT (not
          APPROVED), the RMA cannot enter IN_REPAIR (repair-complete rejected);
          only the Quote's SENT->APPROVED transition unlocks the RMA's
          transition.
        test_recipe:
          setup:
            - "OOW RMA diagnosed REPAIR -> AWAITING_QUOTE_APPROVAL with Q1 SENT (total 9990)"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 20, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q1: "$.data[0].id" } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/repair-complete", as: DepotTechnician, as_user_id: "tech-1", payload: {} , captures: { err: $.data.error_id } }
            - { call: "POST /depot/quotes/${q1}/approve", as: Customer, as_user_id: "${cust}", payload: { payment_reference: "pay-1" } }
          assert:
            - "First trigger rejected with error_id == ERR_INVALID_RMA_STATE (quote not yet APPROVED)"
            - "Quote.${q1}.status == APPROVED"
            - "ServiceRMA.${rma}.status == IN_REPAIR (unlocked by the Quote transition)"

      - name: replacement_ship_gated_by_model_containment
        grounds:
          - state_machines.ServiceRMA.REPLACEMENT_PENDING_to_SHIPPED
          - entities.ProductModel.fields.containment_flag
          - state_machines.EngineeringEscalation.CONTAINMENT_ACTIVE_to_RESOLVED
        distinguishing_aspect: |
          Entity pair ServiceRMA x ProductModel: the ship transition reads the
          unit's model containment_flag (set by an EngineeringEscalation on a
          DIFFERENT RMA); ship is rejected while contained and succeeds after
          the escalation resolves — a different pair than ServiceRMA x Quote.
        test_recipe:
          setup:
            - "Manual escalation on RMA-X -> contain -> M1.containment_flag == true"
            - "STANDARD RMA-Y diagnosed BER -> REPLACEMENT_PENDING"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-X", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_x: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-Y", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_y: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-BAT-09", description: "Battery swell", severity: "CRITICAL" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_x}", reported_issue: "safety" }, captures: { rma_x: $.data.id } }
            - { call: "POST /depot/engineering-escalations", as: EngineeringLead, payload: { rma_id: "${rma_x}", failure_code_id: "${fc}" }, captures: { esc: $.data.id } }
            - { call: "POST /depot/engineering-escalations/${esc}/contain", as: EngineeringLead, payload: {} }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_y}", reported_issue: "swollen" }, captures: { rma_y: $.data.id } }
            - { call: "POST /depot/rmas/${rma_y}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_y}/receive", as: IntakeAgent, payload: { serial_number: "SN-Y" } }
            - { call: "POST /depot/rmas/${rma_y}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma_y}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 30, repairability: "BER", planned_parts: [] } }
          trigger:
            - { call: "POST /depot/rmas/${rma_y}/ship", as: DepotTechnician, as_user_id: "tech-1", payload: { carrier: "UPS", tracking_number: "1Z" }, captures: { err: $.data.error_id } }
            - { call: "POST /depot/engineering-escalations/${esc}/resolve", as: EngineeringLead, payload: { resolution_note: "containment lifted after retrofit" } }
            - { call: "POST /depot/rmas/${rma_y}/ship", as: DepotTechnician, as_user_id: "tech-1", payload: { carrier: "UPS", tracking_number: "1Z" } }
          assert:
            - "First ship rejected with error_id == ERR_MODEL_CONTAINMENT"
            - "EngineeringEscalation.${esc}.status == MONITORING after resolve"
            - "ProductModel.${mdl}.containment_flag == false after resolve"
            - "ServiceRMA.${rma_y}.status == SHIPPED and return_reason == REPLACED after containment release"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: loaner_window_half_open_adjacency
        grounds:
          - validations[priority=18]
          - entities.LoanerReservation.fields.start_date
          - entities.LoanerReservation.fields.end_date
        distinguishing_aspect: |
          Resource LoanerUnit, half-open [start, end) semantics: a reservation
          starting exactly at the existing window's end (adjacency) is allowed,
          while one overlapping by a single day is rejected with
          ERR_LOANER_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Two AUTHORIZED LOANER RMAs (units SN-1/SN-2, same model); pool unit LU-1 deposit 10000 (customer credit 100000)"
            - "Reservation A holds LU-1 for [2026-08-10, 2026-08-20)"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_1: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-2", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_2: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 10000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_1}", reported_issue: "d1", service_option: "LOANER" }, captures: { rma_1: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_2}", reported_issue: "d2", service_option: "LOANER" }, captures: { rma_2: $.data.id } }
            - { call: "POST /depot/rmas/${rma_1}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_2}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_1}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-10", end_date: "2026-08-20" }, captures: { res_a: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma_2}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-20", end_date: "2026-08-25" }, captures: { res_b: $.data.id } }
            - { call: "POST /depot/rmas/${rma_2}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-19", end_date: "2026-08-21" }, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent reservation created: LoanerReservation.${res_b}.loaner_unit_id == ${lu} and status == RESERVED (end==start adjacency allowed)"
            - "Overlapping reservation rejected with error_id == ERR_LOANER_WINDOW_OVERLAP (2026-08-19 < 2026-08-20 cuts into A)"
            - "Customer.${cust}.deposit_exposure_cents == 20000 (two live reservations only)"

      - name: bay_booking_closed_interval_buffer
        grounds:
          - validations[priority=16]
          - entities.ServiceRMA.fields.bay_start_date
          - entities.ServiceRMA.fields.bay_end_date
        distinguishing_aspect: |
          Resource DepotBay, closed intervals PLUS a mandatory 1-day turnaround
          buffer: a booking starting the day after an existing [08-10..08-12]
          booking (08-13) conflicts because the buffered interval
          [08-12..08-16] intersects it, while 08-14 succeeds — strictly stricter
          than the loaner's adjacency-allowed half-open rule.
        test_recipe:
          setup:
            - "RMA-A in IN_REPAIR holding bay BAY-1 for closed window 2026-08-10..2026-08-12"
            - "RMA-B in TRIAGED awaiting a bay booking"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-A", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_a: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-B", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit_b: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/depot-bays", as: DepotManager, payload: { bay_code: "BAY-1" }, captures: { bay: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_a}", reported_issue: "A" }, captures: { rma_a: $.data.id } }
            - { call: "POST /depot/rmas/${rma_a}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_a}/receive", as: IntakeAgent, payload: { serial_number: "SN-A" } }
            - { call: "POST /depot/rmas/${rma_a}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma_a}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "POST /depot/rmas/${rma_a}/schedule-bay", as: DepotTechnician, as_user_id: "tech-1", payload: { bay_id: "${bay}", start_date: "2026-08-10", end_date: "2026-08-12" } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit_b}", reported_issue: "B" }, captures: { rma_b: $.data.id } }
            - { call: "POST /depot/rmas/${rma_b}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma_b}/receive", as: IntakeAgent, payload: { serial_number: "SN-B" } }
            - { call: "POST /depot/rmas/${rma_b}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
          trigger:
            - { call: "POST /depot/rmas/${rma_b}/schedule-bay", as: DepotTechnician, as_user_id: "tech-1", payload: { bay_id: "${bay}", start_date: "2026-08-13", end_date: "2026-08-15" }, captures: { err: $.data.error_id } }
            - { call: "POST /depot/rmas/${rma_b}/schedule-bay", as: DepotTechnician, as_user_id: "tech-1", payload: { bay_id: "${bay}", start_date: "2026-08-14", end_date: "2026-08-16" } }
          assert:
            - "First booking rejected with error_id == ERR_BAY_OVERLAP (buffered [08-12..08-16] intersects existing [08-10..08-12])"
            - "Second booking succeeds: ServiceRMA.${rma_b}.bay_start_date == '2026-08-14' and bay_end_date == '2026-08-16'"
            - "ServiceRMA.${rma_b}.bay_id == ${bay}"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: part_stock_consume_reverse_invariant
        grounds:
          - state_machines.RepairLine.CONSUMED_to_REVERSED
          - entities.Part.fields.stock_on_hand
          - validations[priority=21]
        distinguishing_aspect: |
          Conserved quantity: physical part stock. consume(3) followed by the
          compensating reverse() restores Part.stock_on_hand exactly to its
          pre-consumption value (10) and leaves the line REVERSED — no drift.
        test_recipe:
          setup:
            - "In-warranty RMA in IN_REPAIR; part P1 stock 10"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 3 } ] }, captures: { rma_v: $.data.version } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 3, failure_code_id: "${fc}", expected_rma_version: "${rma_v}" }, captures: { line: $.data.id } }
            - { call: "GET /depot/parts/${part}", as: DepotTechnician, captures: { stock_mid: $.data.stock_on_hand } }
            - { call: "POST /depot/repair-lines/${line}/reverse", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
            - { call: "GET /depot/parts/${part}", as: DepotTechnician, captures: { stock_end: $.data.stock_on_hand } }
          assert:
            - "stock after consume == 7 (10 - 3)"
            - "stock after reverse == 10 (invariant restored exactly)"
            - "RepairLine.${line}.status == REVERSED"
            - "RepairLine.${line}.line_total_cents == 15000 (3 * 5000 snapshot preserved for audit)"

      - name: deposit_exposure_reservation_cancel_invariant
        grounds:
          - state_machines.LoanerReservation.RESERVED_to_CANCELLED
          - state_machines.LoanerUnit.RESERVED_to_AVAILABLE
          - entities.Customer.fields.deposit_exposure_cents
        distinguishing_aspect: |
          Conserved quantity: customer deposit exposure in cents (paired with
          pool availability). Reservation create then its compensating cancel
          returns deposit_exposure_cents to 0 and the unit to AVAILABLE — a
          different conserved quantity than physical part stock.
        test_recipe:
          setup:
            - "AUTHORIZED LOANER RMA; LU-1 deposit 40000; customer credit 100000, exposure starts 0"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "Depot model", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
            - { call: "GET /depot/customers/${cust}", as: IntakeAgent, captures: { exp_mid: $.data.deposit_exposure_cents } }
            - { call: "POST /depot/loaner-reservations/${res}/cancel", as: IntakeAgent, payload: {} }
            - { call: "GET /depot/customers/${cust}", as: IntakeAgent, captures: { exp_end: $.data.deposit_exposure_cents } }
          assert:
            - "exposure after create == 40000 (deposit committed)"
            - "exposure after cancel == 0 (invariant restored exactly)"
            - "LoanerReservation.${res}.status == CANCELLED"
            - "LoanerUnit.${lu}.status == AVAILABLE"
