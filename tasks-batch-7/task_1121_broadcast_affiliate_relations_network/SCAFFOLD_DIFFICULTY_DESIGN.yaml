  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusivity_window_half_open_adjacency
        grounds:
          - calculations.syndication_window_overlap
          - validations[priority=10]
          - entities.Territory.fields.protection_window_start_utc
        distinguishing_aspect: |
          Half-open interval semantics on Territory.protection_window: an
          alleged window whose end equals protection_window_start_utc does NOT
          overlap (adjacency with zero intersection); a window that crosses
          start by 1 second DOES. Resource: Territory.
