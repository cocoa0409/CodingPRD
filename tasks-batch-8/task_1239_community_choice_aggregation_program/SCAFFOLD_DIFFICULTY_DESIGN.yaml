scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two calculations on DIFFERENT entity domains,
  # each with two valid interpretations producing different numbers.
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: load_forecast_adopted_vs_actual_trued_gap
        grounds:
          - calculations.load_forecast_snapshot
          - entities.LoadForecast.fields.forecast_variant
          - entities.LoadForecast.fields.coverage_gap_mwh
        distinguishing_aspect: |
          Entity domain: LoadForecast / supply-coverage. For the SAME account set and
          SAME contract portfolio, the ADOPTED_PLAN variant (estimate-only) and the
          ACTUAL_TRUED variant (trailing-actuals for accounts with SETTLED billing
          history) produce different total_energy_mwh and therefore different
          coverage_gap_mwh — the distinction §0.5 Rule 1 requires on this domain.
        test_recipe:
          setup:
            - "Authority ACTIVE with default product STANDARD50 adopted (rate 11.40 c/kWh covering 2026-01-01..2027-01-01)"
            - "Account A1 ENROLLED via wave W1, annual_kwh_estimate = 12000, with one SETTLED billing month of usage 1500 kWh (actual annualized = 1500 * 12 / 1 = 18000 kWh)"
            - "No supply contracts executed, so coverage_gap_mwh == round(total_energy_mwh) for both variants"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "DISCOUNT_TO_INCUMBENT", discount_floor_bps: 100, rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_std: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_std}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-1001", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct_a1: '$.data.account_ids[0]' }
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice_w1: $.data.id }
            - call: "POST /cca/enrollment-notices/${notice_w1}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/enrollment-notices/${notice_w1}/close"
              payload: {}
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/_clock/advance_epoch"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/billing-extracts"
              payload: { billing_month: "2026-05" }
              as: BillingCoordinator
              captures: { ext_may: $.data.id }
            - call: "POST /cca/billing-extracts/${ext_may}/lines"
              payload: { service_account_id: "${acct_a1}", usage_kwh: 1500 }
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext_may}/submit"
              payload: {}
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext_may}/utility-accept"
              payload: {}
              as: UtilityLiaison
              captures: { ext_v_acc: $.data.version }
            - call: "POST /cca/remittance-files"
              payload: { remittance_period: "2026-05", gross_remittance_cents: 17100, utility_fee_bps: 0 }
              as: BillingCoordinator
              captures: { rem_may: $.data.id }
            - call: "POST /cca/remittance-files/${rem_may}/reconcile"
              payload: { expected_extract_version: "${ext_v_acc}" }
              as: BillingCoordinator
            - call: "POST /cca/remittance-files/${rem_may}/settle"
              payload: {}
              as: FinanceController
          trigger:
            - call: "POST /cca/load-forecasts"
              payload: { snapshot_label: "PLAN-2027", forecast_variant: "ADOPTED_PLAN", period_year: 2027 }
              as: PortfolioManager
              captures: { lf_plan_total: $.data.total_energy_mwh, lf_plan_gap: $.data.coverage_gap_mwh }
            - call: "POST /cca/load-forecasts"
              payload: { snapshot_label: "TRUEUP-2027", forecast_variant: "ACTUAL_TRUED", period_year: 2027 }
              as: PortfolioManager
              captures: { lf_true_total: $.data.total_energy_mwh, lf_true_gap: $.data.coverage_gap_mwh }
          assert:
            - "ADOPTED_PLAN snapshot total_energy_mwh == 12.0 (12000 estimate / 1000)"
            - "ACTUAL_TRUED snapshot total_energy_mwh == 18.0 (1500 kWh actual x 12 months / 1 month / 1000)"
            - "ADOPTED_PLAN coverage_gap_mwh == 12"
            - "ACTUAL_TRUED coverage_gap_mwh == 18"
            - "lf_plan_total != lf_true_total and lf_plan_gap != lf_true_gap for identical accounts and contracts"

      - name: pcia_exit_fee_provisional_vs_final_forecast
        grounds:
          - calculations.pcia_exit_fee_passthrough
          - entities.ServiceAccount.fields.vintage_year
          - entities.RateSchedule.fields.pcia_rate_cents_per_kwh
        distinguishing_aspect: |
          Entity domain: exit-fee passthrough on BillingLine / ERRA forecast (distinct
          from the LoadForecast domain of the sibling instance). When the account's
          vintage-year schedule row is not yet ADOPTED at forecast time, the provisional
          variant prices the account at the most recently SUPERSEDED pcia rate; final
          billing prices the same account at the ADOPTED rate — different cents for
          identical usage.
        test_recipe:
          setup:
            - "Authority ACTIVE; default product with 2026 schedule (pcia 1.50 c/kWh) ADOPTED; a 2027 schedule whose pcia is 2.10 c/kWh exists but is only PROPOSED (not ADOPTED) at billing time"
            - "Account B1 ENROLLED with vintage_year 2026"
            - "Latest LoadForecast snapshot exists (any)"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "DISCOUNT_TO_INCUMBENT", discount_floor_bps: 100, rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_2026: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_2026}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_2026}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-2001", service_class: "RESIDENTIAL", annual_kwh_estimate: 9600, annual_peak_kw: 3.5, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct_b1: '$.data.account_ids[0]' }
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice_w1: $.data.id }
            - call: "POST /cca/enrollment-notices/${notice_w1}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/enrollment-notices/${notice_w1}/close"
              payload: {}
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/_clock/advance_epoch"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2027-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.60, pcia_rate_cents_per_kwh: 2.10, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_2027: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_2027}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/load-forecasts"
              payload: { snapshot_label: "PLAN-2027", forecast_variant: "ADOPTED_PLAN", period_year: 2027 }
              as: PortfolioManager
          trigger:
            - call: "POST /cca/billing-extracts"
              payload: { billing_month: "2026-05" }
              as: BillingCoordinator
              captures: { ext_may: $.data.id }
            - call: "POST /cca/billing-extracts/${ext_may}/lines"
              payload: { service_account_id: "${acct_b1}", usage_kwh: 800 }
              as: BillingCoordinator
              captures: { line_gen: $.data.generation_charge_cents, line_pcia: $.data.pcia_charge_cents }
          assert:
            - "BillingLine.generation_charge_cents == 9120 (800 kWh x 11.40 c, round_half_up)"
            - "BillingLine.pcia_charge_cents == 1200 (800 kWh x ADOPTED 1.50 c/kWh — final billing never uses a provisional rate)"
            - "The PROPOSED 2027 row carries pcia 2.10 c/kWh; had the (provisional) PROPOSED row been used the same 800 kWh would price at 1680 c — the 480 c delta between the provisional and final variants for identical usage is the dual-variant distinction this instance pins"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes {(a),(b),(c)}.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: termination_fee_remaining_window_fraction
        grounds:
          - calculations.contract_termination_fee
          - state_machines.SupplyContract.DELIVERING_to_TERMINATED
          - entities.Authority.fields.climate_reserve_balance_cents
        distinguishing_aspect: |
          Mode (a): formula with >= 3 inputs and non-linear interaction — the fee
          multiplies remaining_mwh (itself a fraction of total_mwh gated by clock
          position against the delivery window) x price x 20%, then the reserve debit
          is clamped at the reserve floor (conditional branch on authority state),
          with the deficit discarded as expense.
        test_recipe:
          setup:
            - "Authority ACTIVE, climate_reserve_balance_cents == 0 (never credited)"
            - "Contract C1 EXECUTED: delivery 2027-01-01T00:00:00Z .. 2028-01-01T00:00:00Z (365 days), total_mwh 87600, price 50.0 USD/MWh, then clock advanced into the delivery window (DELIVERING)"
            - "Logical clock at terminate time == 2027-07-02T00:00:00Z -> remaining_days = 183, remaining_fraction = 183/365, remaining_mwh = 43920, fee = 43920 x 50 x 0.20 = 439200 USD = 43920000 cents"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_std: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_std}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/supply-contracts"
              payload: { counterparty: "Solaris Energy LLC", contract_type: "PPA", delivery_start: "2027-01-01T00:00:00Z", delivery_end: "2028-01-01T00:00:00Z", capacity_mw: 20.0, total_mwh: 87600, price_dollars_per_mwh: 50.0, rps_eligible_pct: 1.0, vintage_year: 2026 }
              as: PortfolioManager
              captures: { contract_c1: $.data.id }
            - call: "POST /cca/supply-contracts/${contract_c1}/execute"
              payload: {}
              as: PortfolioManager
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-02T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/_clock/advance_epoch"
              payload: {}
              as: BoardDirector
          trigger:
            - call: "POST /cca/supply-contracts/${contract_c1}/terminate"
              payload: {}
              as: PortfolioManager
              captures: { fee_cents: $.data.termination_fee_cents }
          assert:
            - "SupplyContract.termination_fee_cents == 43920000 (remaining 183/365 x 87600 MWh x 50 USD x 0.20, round_half_up to whole cents)"
            - "Authority.climate_reserve_balance_cents == 0 after termination (debit clamped at the zero reserve floor; the entire fee falls to expense, never negative reserve)"
            - "Authority.version incremented by exactly 1 due to the cascade hop-2 reserve touch"
      - name: billing_line_round_per_line_then_sum
        grounds:
          - calculations.billing_line_charges
          - entities.BillingLine.fields.generation_charge_cents
          - entities.BillingExtract.fields.total_billed_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — the scaffold pins
          round-per-line-then-sum. An extract total computed as sum-of-rounded-lines
          differs from round-of-summed-lines whenever per-line fractional cents do
          not cancel; the pinned order MUST be observable in BillingExtract.total_billed_cents.
        test_recipe:
          setup:
            - "Authority ACTIVE; default product rate 11.40 c/kWh (ADOPTED schedule covering 2026)"
            - "Three ENROLLED accounts each billed 1 kWh -> per-line raw 1 x 11.40 = 11.40 c -> round_half_up per line = 11 c"
            - "Pinned per-line-then-sum total = 3 x 11 = 33 c; the forbidden sum-then-round order would give round_half_up(3 x 11.40) = round_half_up(34.20) = 34 c — a clean 1-cent divergence between the two orders"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_std: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_std}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-3001", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false }, { utility_account_number: "U-3002", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false }, { utility_account_number: "U-3003", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct_1: "$.data.account_ids[0]", acct_2: "$.data.account_ids[1]", acct_3: "$.data.account_ids[2]" }
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice_w1: $.data.id }
            - call: "POST /cca/enrollment-notices/${notice_w1}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/enrollment-notices/${notice_w1}/close"
              payload: {}
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/_clock/advance_epoch"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/billing-extracts"
              payload: { billing_month: "2026-05" }
              as: BillingCoordinator
              captures: { ext_may: $.data.id }
            - call: "POST /cca/billing-extracts/${ext_may}/lines"
              payload: { service_account_id: "${acct_1}", usage_kwh: 1 }
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext_may}/lines"
              payload: { service_account_id: "${acct_2}", usage_kwh: 1 }
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext_may}/lines"
              payload: { service_account_id: "${acct_3}", usage_kwh: 1 }
              as: BillingCoordinator
          trigger:
            - call: "GET /cca/billing-extracts/${ext_may}"
              payload: {}
              as: BillingCoordinator
              captures: { total_cents: $.data.total_billed_cents }
          assert:
            - "Each BillingLine.generation_charge_cents == 11 (round_half_up(1 x 11.40) = 11)"
            - "BillingExtract.total_billed_cents == 33 (3 x 11, per-line-then-sum)"
            - "The forbidden sum-then-round order would yield round_half_up(3 x 11.40) = 34 — the observed 33 proves the pinned order"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine on DIFFERENT entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: compliance_filing_revision_loop
        grounds:
          - state_machines.ComplianceFiling
          - entities.ComplianceFiling.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on ComplianceFiling: FILED -> REJECTED_BY_CPUC -> DRAFT -> PREPARED
          -> REVIEWED -> FILED -> ACCEPTED_BY_CPUC; revision_count accumulates per loop and
          prepared_by/reviewed_by are cleared each cycle so the two-key chain must be
          re-executed by two distinct officers on every pass.
        test_recipe:
          setup:
            - "Authority ACTIVE; an RPS_ANNUAL filing exists with one REC retirement attached"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60, bad_debt_trueup_cap_pct: 0.01 }
              as: BoardDirector
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod_std: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod_std}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs_std: $.data.id }
            - call: "POST /cca/rate-schedules/${rs_std}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod_std}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
