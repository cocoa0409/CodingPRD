          The pair is business_safety (priority 9, ERR_EPISODE_RECORDS_FROZEN)
          against state (priority 10, ERR_INVALID_STATE) - completing an
          already-COMPLETED reconciliation under an ADMIN_CLOSED, FROZEN episode
          violates both rungs and must return the frozen error.
