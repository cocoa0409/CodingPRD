            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 50000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 1000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/invoice", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: rbace_unauthenticated_request_returns_401
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header → 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rack/terminals", payload: {}, as: "", captures: { err: $.data.error_id } }
          assert:
            - "response status == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

  # ==================================================================
  # Section: errors — every error must be triggerable
  # ==================================================================
  - section: errors
    instances:
      - name: error_schedule_not_draft_on_void
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHEDULE_NOT_DRAFT]"]
        distinguishing_aspect: "Void on a non-DRAFT schedule returns ERR_SCHEDULE_NOT_DRAFT."
        test_recipe:
          setup: ["Schedule PUBLISHED"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
          trigger:
            - { call: "POST /rack/price-schedules/${ps}/void", payload: {}, as: RackPriceAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_SCHEDULE_NOT_DRAFT"

      - name: error_stale_version_on_occ_publish
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[price-publish-stale-terminal]"]
        distinguishing_aspect: "Stale expected_terminal_version on publish returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Terminal at version=2 after one publish; second DRAFT created"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v0: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps1: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps1}/publish", payload: { expected_terminal_version: "${t_v0}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-02", posted_rack_cents_per_gal: 285, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps2: $.data.id } }
          trigger:
            - { call: "POST /rack/price-schedules/${ps2}/publish", payload: { expected_terminal_version: "${t_v0} - 1" }, as: RackPriceAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response status == 412"

  # ==================================================================
  # Section: rbac — role model claims
  # ==================================================================
  - section: rbac
    instances:
      - name: rbace_segregation_of_duties_contract_close_vs_credit_hold
        claim_type: role_model
        grounds: [complexity_profile.role_model, roles]
        distinguishing_aspect: "Segregation of duties: ContractAdministrator closes contracts (may trigger automatic hold on DEFAULTED) but cannot manually place/release holds; CreditAnalyst can place/release holds but cannot close contracts."
        test_recipe:
          setup: ["Customer exists with an ACTIVE contract"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
          trigger:
            - { call: "POST /rack/customers/${c_id}/place-hold", payload: { reason: "MANUAL" }, as: CreditAnalyst, captures: { ok_status: $.data.credit_status } }
            - { call: "POST /rack/supply-contracts/${sc_id}/close", payload: {}, as: CreditAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "CreditAnalyst successfully placed hold (credit_status == HOLD)"
            - "CreditAnalyst attempting to close the contract returns ERR_UNAUTHORIZED"

  # ==================================================================
  # Section: cross-cutting complexity layers
  # ==================================================================
  - section: cross_cutting_layers
    instances:
      - name: optimistic_concurrency_terminal_version_increments_on_each_publish
        claim_type: layer_optimistic_concurrency
        grounds: ["concurrency_rules[price-publish-stale-terminal]", entities.Terminal.fields.version]
        distinguishing_aspect: "Terminal.version increments by exactly 1 on each successful price-schedule publish; a second publish with the same stale version fails with 412."
        test_recipe:
          setup: ["Terminal version=1 initially"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v0: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps1: $.data.id } }
          trigger:
            - { call: "POST /rack/price-schedules/${ps1}/publish", payload: { expected_terminal_version: "${t_v0}" }, as: RackPriceAnalyst }
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { t_v1: $.data.version } }
          assert:
            - "Terminal.${t_id}.version == ${t_v0} + 1 after publish"

  # ==================================================================
  # Section: consistency_model — immediate
  # ==================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_post_bol_inventory_visible_in_same_response
        claim_type: consistency_immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Inventory drawdown is visible in the same GET immediately after post-bol returns; no eventual-consistency lag."
        test_recipe:
          setup: ["Ticket RESERVED with 5000 gal; inventory=10000"]
          setup_api_calls:
            - { call: "POST /rack/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals", payload: { terminal_code: "T", legal_name: "T", state_code: "TX", county_code: "48201", city_code: "HOU" }, as: PlatformAdmin, captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /rack/products", payload: { product_code: "ULSD", display_name: "D", product_family: "DIESEL", is_brandable: false }, as: PlatformAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /rack/customers", payload: { customer_code: "C", legal_name: "C", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /rack/supply-contracts", payload: { customer_id: "${c_id}", start_date: "2026-01-01", end_date: "2026-12-31", volume_commitment_gallons: 100000, pricing_tier: "RACK" }, as: ContractAdministrator, captures: { sc_id: $.data.id } }
            - { call: "POST /rack/supply-contracts/${sc_id}/activate", payload: {}, as: ContractAdministrator }
            - { call: "POST /rack/lifting-rights", payload: { customer_id: "${c_id}", terminal_id: "${t_id}", product_id: "${p_id}", contract_id: "${sc_id}", daily_ratable_gallons: 100000 }, as: AllocationManager, captures: { lr: $.data.id } }
            - { call: "POST /rack/tax-rules", payload: { jurisdiction_level: "FEDERAL", jurisdiction_code: "US", product_family: "DIESEL", rate_cents_per_gal: 24, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin }
            - { call: "POST /rack/terminals/${t_id}/inventory/adjust", payload: { delta_gallons: 10000, reason: "init" }, as: TerminalOperator }
            - { call: "POST /rack/price-schedules", payload: { terminal_id: "${t_id}", product_id: "${p_id}", effective_date: "2026-08-01", posted_rack_cents_per_gal: 280, branded_premium_cents_per_gal: 0 }, as: RackPriceAnalyst, captures: { ps: $.data.id } }
            - { call: "POST /rack/price-schedules/${ps}/publish", payload: { expected_terminal_version: "${t_v}" }, as: RackPriceAnalyst }
            - { call: "POST /rack/lifting-tickets", payload: { lifting_right_id: "${lr}", requested_gallons: 5000, branded: false }, as: TerminalOperator, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator }
            - { call: "GET /rack/terminals/${t_id}", payload: {}, as: PlatformAdmin, captures: { inv: $.data.inventory_gallons } }
          assert:
            - "Terminal.${t_id}.inventory_gallons == 5000 immediately (no lag)"
