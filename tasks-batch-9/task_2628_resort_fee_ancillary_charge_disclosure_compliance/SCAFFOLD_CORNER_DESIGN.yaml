          trigger:
            - call: "POST /fee-programs/${fp1}/publish"
              payload: { attestation_note: "Three mandatory fees, all inclusions valued." }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "HTTP 200 and the RESPONSE BODY of the write itself already carries status PUBLISHED, published_at 2026-08-01T00:00:00Z, attested_by_user_id u-comp-1, fee_count 3, mandatory_fee_count 3, total_mandatory_fee_cents_per_night 4388 and inclusion_coverage_ratio 1.0000 — no second read is needed to observe any rollup"
            - "an immediately following GET /properties/${p1} reports published_fee_program_count 1, with no intervening call of any kind"
            - "an immediately following GET /properties/${p1}/disclosure-summary reports the same published_fee_program_count 1 and total_mandatory_fee_cents_per_night 4388, so the computed read and the denormalised row agree at the same instant"
            - "GET /fee-programs with property_id ${p1} and status PUBLISHED returns total_count 1 on the very next call — list projections are not deferred either"
            - "repeating the identical publish is rejected with data.error_id == ERR_INVALID_STATE, which proves the first write was fully committed before the response was returned"
            - "no field of FeeProgram.${fp1} changes value between the publish response and any later read taken without an intervening write — there is no eventual convergence step"
