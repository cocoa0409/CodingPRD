              as: FrontDeskClerk
              captures: { pat: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_REGISTRATION_INCOMPLETE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- 8.1 collector half-open overlap (resource = Provider/collector) ------
      - name: collector_half_open_overlap_rejected
        grounds:
          - calculations.occ_slot_overlap
          - validations[priority=45]
          - entities.OccHealthOrder.fields.collector_id
        distinguishing_aspect: |
          HALF-OPEN interval arithmetic on the COLLECTOR resource: a new order
          10:15-10:45 overlaps an existing 10:00-10:30 (new.start 10:15 < existing.end
          10:30) and is rejected ERR_SLOT_CONFLICT. Interval semantics: half-open, no
          buffer — distinct from the room's buffer-padded closed semantics (8.2).
        test_recipe:
          setup:
            - "One clinic, one collector; clock 2026-06-08T09:00:00Z; an existing DRUG_SCREEN 10:00-10:30 on the collector."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T09:00:00Z" }
              as: Anonymous
            - call: "POST /clinics"
              payload: { name: "ColOverlapClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Col", credential: "NP" }
              as: ClinicManager
              captures: { col: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "c1" }
              as: FrontDeskClerk
              captures: { qe1: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "c2" }
              as: FrontDeskClerk
              captures: { qe2: $.data.id }
            - call: "POST /occ-health-orders"
              payload: { queue_entry_id: "${qe1}", order_type: "DRUG_SCREEN", employer_name: "Globex", scheduled_start: "2026-06-08T10:00:00Z", collector_id: "${col}", duration_minutes: 30 }
              as: FrontDeskClerk
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /occ-health-orders"
              payload: { queue_entry_id: "${qe2}", order_type: "DRUG_SCREEN", employer_name: "Globex", scheduled_start: "2026-06-08T10:15:00Z", collector_id: "${col}", duration_minutes: 30 }
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SLOT_CONFLICT"

      # ---- 8.2 room buffer-padded overlap (resource = ExamRoom) -----------------
      - name: room_buffer_padded_overlap_rejected
        grounds:
          - calculations.room_slot_overlap
          - validations[priority=48]
          - entities.OccHealthOrder.fields.room_id
        distinguishing_aspect: |
          BUFFER-PADDED CLOSED interval arithmetic on the ROOM resource: a PHYSICAL
          10:30-11:00 is rejected against an existing PHYSICAL 10:00-10:30 in the
          same room because back-to-back violates the mandatory CLEAN_BUFFER_MINUTES
          (15) gap (new.start 10:30 < existing.end 10:30 + 15min). The SAME timing the
          collector half-open rule ALLOWS (8.1 adjacency edge) is REJECTED here —
          different interval semantics on a different resource (ExamRoom).
        test_recipe:
          setup:
            - "One clinic, two collectors AND one PROCEDURE room; clock 2026-06-08T09:00:00Z."
            - "Existing PHYSICAL order 10:00-10:30 bound to that room on collector A."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T09:00:00Z" }
              as: Anonymous
            - call: "POST /clinics"
              payload: { name: "RoomOverlapClinic", exam_room_capacity: 3 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "PROC1", room_type: "PROCEDURE" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "ColA", credential: "MD" }
              as: ClinicManager
              captures: { colA: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "ColB", credential: "DO" }
              as: ClinicManager
              captures: { colB: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "r1" }
              as: FrontDeskClerk
              captures: { qe1: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "r2" }
              as: FrontDeskClerk
              captures: { qe2: $.data.id }
            - call: "POST /occ-health-orders"
              payload: { queue_entry_id: "${qe1}", order_type: "PHYSICAL", employer_name: "Initech", scheduled_start: "2026-06-08T10:00:00Z", collector_id: "${colA}", room_id: "${room}", duration_minutes: 30 }
              as: FrontDeskClerk
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /occ-health-orders"
              payload: { queue_entry_id: "${qe2}", order_type: "PHYSICAL", employer_name: "Initech", scheduled_start: "2026-06-08T10:30:00Z", collector_id: "${colB}", room_id: "${room}", duration_minutes: 30 }
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ROOM_SLOT_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- 9.1 charge void: conserved quantity = charges_subtotal_cents ---------
      - name: charge_post_then_void_conserves_subtotal
        grounds:
          - entities.Charge.fields.voided
          - calculations.charge_total
          - entities.Visit.fields.charges_subtotal_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = Visit.charges_subtotal_cents == sum of non-voided
          VISIT charges. Adding a 3000-cent charge then voiding it leaves
          charges_subtotal_cents at its pre-add value 7000 (the surviving 7000
          charge), with zero drift. Conserved quantity is a monetary subtotal,
          distinct from the clinical-status invariant (9.2).
        test_recipe:
          setup:
            - "One roomed SELF_PAY Visit with one surviving 7000-cent charge; a 3000-cent charge is added then voided."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "VoidClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "V1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr V", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "void" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "V Pat", date_of_birth: "1980-12-12", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "KEEP", amount_cents: 7000 }
              as: Provider
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "TEMP", amount_cents: 3000 }
              as: Provider
              captures: { temp_charge: $.data.id }
          trigger:
            - call: "POST /charges/${temp_charge}/void"
              payload: {}
              as: Provider
            - call: "POST /visits/${visit}/post-charges"
              payload: {}
              as: Provider
              captures: { subtotal: $.data.charges_subtotal_cents, resp: $.data.patient_responsibility_cents }
          assert:
            - "Visit.${visit}.charges_subtotal_cents == 7000"
            - "Visit.${visit}.patient_responsibility_cents == 4900"
            - "Charge.${temp_charge}.voided == true"

      # ---- 9.2 transfer then referral-cancel: conserved quantity = clinical_status ---
      - name: transfer_then_referral_cancel_restores_visit
        grounds:
          - state_machines.Visit.IN_EXAM_to_TRANSFERRED
          - state_machines.Referral.INITIATED_to_CANCELLED
          - entities.Visit.fields.disposition
        distinguishing_aspect: |
          CONSERVED QUANTITY = the Visit's clinical lifecycle position and disposition.
          Transfer sets clinical_status TRANSFERRED + disposition ER_TRANSFER; the
          compensating referral-cancel reverts clinical_status to CHARTING and
          disposition back to null — no terminal drift. Conserved quantity is a
          clinical-status/disposition pairing, distinct from the monetary subtotal
          invariant (9.1).
        test_recipe:
          setup:
            - "One roomed Visit transferred to ER (clinical TRANSFERRED, disposition ER_TRANSFER) with an INITIATED Referral; acuity_at_rooming==3 so AMBULANCE not forced."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "XferClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "X1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr X", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "xfer" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "X Pat", date_of_birth: "1975-05-15", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
            - call: "POST /visits/${visit}/transfer"
              payload: { destination_facility: "County ER", transfer_reason: "ACUITY_ESCALATION", mode: "PRIVATE_VEHICLE" }
              as: Provider
            - call: "GET /visits/${visit}/referrals"
              payload: {}
              as: Provider
              captures: { ref_id: "$.data[0].id" }
          trigger:
            - call: "POST /referrals/${ref_id}/cancel"
              payload: {}
              as: ClinicManager
            - call: "GET /visits/${visit}"
              payload: {}
              as: Provider
              captures: { clinical_after: $.data.clinical_status, disp_after: $.data.disposition }
          assert:
            - "Visit.${visit}.clinical_status == CHARTING"
            - "Visit.${visit}.disposition == null"
            - "Referral.${ref_id}.status == CANCELLED"
