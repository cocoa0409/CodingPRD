  # =================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and >=2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: retention_earn_exhausts_campaign
        grounds:
          - state_machines.Referral.HIRED_to_COMPLETED
          - state_machines.Campaign.ACTIVE_to_EXHAUSTED
          - calculations.campaign_settlement
        distinguishing_aspect: |
          Depth-3 chain originating from the ops sweep trigger (distinct from
          the abuse-confirm trigger): sweep earns RETENTION milestone (link 1),
          earning converts the retention uplift share reserved->spent (link 2),
          spent == budget flips the campaign ACTIVE -> EXHAUSTED (link 3).
        test_recipe:
          setup:
            - "Default policy ACTIVE (retention_days 180)"
            - "SENIOR requisition with ACTIVE campaign: multiplier 15000, flat 50000, budget exactly 200000 (= the full uplift)"
            - "Referral submitted (reserved 200000) and hired on 2026-08-01 (HIRE 150000 EARNED; spent 60000; reserved 140000)"
            - "Logical clock advanced to 2027-01-28T00:00:00Z (hire_date + 180 days exactly)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR", hard_to_fill: true }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "exact budget", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2027-06-30T00:00:00Z", budget_cents: 200000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_a}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
              captures: { sweep: $.data }
            - call: "GET /erp/campaigns/${camp_id}"
              as: TalentAdmin
              captures: { spent: $.data.spent_cents, reserved: $.data.reserved_cents, remaining: $.data.remaining_cents, cstatus: $.data.status }
            - call: "GET /erp/referrals/${ref_a}"
              as: Recruiter
              captures: { rstatus: $.data.status }
          assert:
