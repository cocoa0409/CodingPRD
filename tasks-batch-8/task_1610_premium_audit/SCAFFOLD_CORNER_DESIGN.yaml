      - name: record_payment_overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "A payment exceeding the remaining balance (554400 cents) is rejected with ERR_OVERPAYMENT (422); the exact amount succeeds and flips the credit to APPLIED."
        test_recipe:
          setup: ["WC policy WC-V7 -> VOLUNTARY_REPORT ISSUED with RETURN_PREMIUM_CREDIT 554400 (allocation 95000 on 8810, mod 1.20, minimum 10000, estimated premium 600000)"]
