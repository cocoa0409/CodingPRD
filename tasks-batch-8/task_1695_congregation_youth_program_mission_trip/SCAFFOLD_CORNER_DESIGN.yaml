            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "O", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg: $.data.id, prov_pre: $.data.provisional_cost_share_cents} }
          trigger:
            - { call: "POST /youth-ministry/lodging-reservations/${res}/cancel", payload: {}, as: TripLeader, as_user_id: "leader-1" }
            - { call: "GET /youth-ministry/trips/${trip}", as: ProgramDirector, captures: {total: $.data.lodging_cost_total_cents} }
            - { call: "GET /youth-ministry/registrations/${reg}", as: ProgramDirector, captures: {prov_post: $.data.provisional_cost_share_cents, due_post: $.data.amount_due_cents} }
          assert:
            - "prov_pre == 82000 (80000 + round_half_up(60000/30) = 2000)"
            - "total == 0 after cancel (CANCELLED excluded from the rollup)"
            - "prov_post == 80000 and due_post == 80000 — derived fields reconciled on the source mutation"

