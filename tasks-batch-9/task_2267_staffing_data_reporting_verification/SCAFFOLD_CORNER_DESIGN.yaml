            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_vend
            - *k_w_ag
            - *k_batch
          trigger:
            - *k_validate
            - *k_submit
            - *k_accept
            - *k_measure
            - *k_publish
            - *k_appeal
            - call: "POST /rating-appeals/${app}/deny"
