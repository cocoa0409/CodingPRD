      - name: hold_and_blackout_transitions_from_the_wrong_source_state_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_HOLD_STATE_INVALID]
          - errors[ERR_BLACKOUT_STATE_INVALID]
          - state_machines.SpaceHold.CHALLENGED_to_ACTIVE
          - state_machines.MaintenanceBlackout.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Two entities, two source states that look plausible but are not on the edge.
          answer-challenge is legal only from CHALLENGED and the hold is ACTIVE with
          challenge_round 0, and blackout approve is legal only from PROPOSED while this
          blackout is already APPROVED. Both are 409 state errors, and neither may leave
          a partial side effect such as an incremented active_blackout_count.
        test_recipe:
          setup:
            - "the Ballroom B booking carries one ACTIVE, unchallenged hold"
            - "a CAPITAL_PROJECT blackout on Ballroom C running 2027-12-01 through 2027-12-10 has already been approved"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
