      - name: screening_a_withdrawn_candidate_returns_candidate_state_invalid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Candidate.SOURCED_to_WITHDRAWN
          - errors[ERR_CANDIDATE_STATE_INVALID]
          - validations.priority_40
        distinguishing_aspect: |
          WITHDRAWN is a declared terminal state, so every subsequent trigger is refused: opening a screen,
          withdrawing again and reopening screening all return 409 ERR_CANDIDATE_STATE_INVALID.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 and one candidate withdrawn straight from SOURCED."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Wilma Withdrawn", email: "wilma@cand.example", birth_date: "1974-01-01", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Cedar Ridge Capital" }
              as: GovernanceStaff
              captures: { cand_id: $.data.id }
            - call: "POST /governance/candidates/${cand_id}/withdraw"
              payload: {}
              as: GovernanceStaff
          trigger:
