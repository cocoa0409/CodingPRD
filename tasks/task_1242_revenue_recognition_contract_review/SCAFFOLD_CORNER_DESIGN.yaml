# =============================================================================
# Task 1242 — Revenue Recognition (ASC 606) Contract Review
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7; difficulty-rule coverage lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml and is cross-referenced via excluded_because.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_missing_required_field_returns_invalid_request
        claim_type: creation_required_fields
        grounds: [entities.Customer.fields.external_ref, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /revrec/customers without external_ref is rejected 400 ERR_INVALID_REQUEST; no customer is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /revrec/customers"
              payload: { legal_name: "No Ref Co" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: contract_creation_applies_defaults_and_computed_fields
        claim_type: defaults_and_computed
        grounds: [entities.Contract.fields.package_negotiated_flag, entities.Contract.fields.transaction_price_cents, entities.Contract.fields.status]
        distinguishing_aspect: "Omitting package_negotiated_flag yields false; computed fields initialize: vc_estimate_cents 0, transaction_price_cents == fixed_consideration_cents, allocated_total/billed/recognized/balances all 0; status DRAFT; version 1."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - call: "POST /revrec/customers"
              payload: { legal_name: "Defaults Co", external_ref: "DEF-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-DEF", signed_date: "2026-05-20", fixed_consideration_cents: 250000, risk_tier: "ELEVATED" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id, c_status: $.data.status, c_flag: $.data.package_negotiated_flag, c_tx: $.data.transaction_price_cents, c_vc: $.data.vc_estimate_cents, c_alloc: $.data.allocated_total_cents, c_billed: $.data.billed_to_date_cents, c_rec: $.data.recognized_to_date_cents, c_def: $.data.deferred_revenue_balance_cents, c_asset: $.data.contract_asset_balance_cents, c_v: $.data.version }
          assert:
            - "package_negotiated_flag == false (default applied)"
            - "status == DRAFT (initial state)"
            - "vc_estimate_cents == 0 and transaction_price_cents == 250000"
            - "allocated_total_cents == 0, billed_to_date_cents == 0, recognized_to_date_cents == 0, deferred_revenue_balance_cents == 0, contract_asset_balance_cents == 0"
            - "version == 1 and id is a server-minted UUID"

      - name: pob_straight_line_missing_dates_returns_invalid_request
        claim_type: creation_required_fields
        grounds: [entities.PerformanceObligation.fields.service_end_date, "validations[priority=3]"]
        distinguishing_aspect: "Pattern-conditional required fields: OVER_TIME_STRAIGHT_LINE without service_start_date/service_end_date fails 400 even though the fields are optional for other patterns."
        test_recipe:
          setup: ["customer; DRAFT contract signed 2026-05-20; SSP WIDGET/US covering"]
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Cond Co", external_ref: "COND-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-COND", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "OVER_TIME_STRAIGHT_LINE" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400; no POB persisted"

      - name: pob_invalid_enum_pattern_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.PerformanceObligation.fields.recognition_pattern, "validations[priority=3]"]
        distinguishing_aspect: "recognition_pattern outside {POINT_IN_TIME, OVER_TIME_INPUT_COST, OVER_TIME_STRAIGHT_LINE} is rejected 400."
        test_recipe:
          setup: ["customer; DRAFT contract signed 2026-05-20; SSP WIDGET/US covering"]
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Enum Co", external_ref: "ENUM-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-ENUM", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "SOME_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: pob_ssp_pinned_from_covering_window
        claim_type: computed_fields
        grounds: [entities.PerformanceObligation.fields.ssp_cents, entities.SspPrice.fields.effective_from]
        distinguishing_aspect: "ssp_cents is computed from the ACTIVE SspPrice whose CLOSED window covers (product_code, region) at the contract's signed_date — here 42000 — and any client-supplied price is ignored."
        test_recipe:
          setup: ["SSP GADGET/EU 42000 window [2026-01-01, 2026-12-31]; customer; DRAFT contract signed 2026-05-20"]
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "GADGET", region: "EU", ssp_cents: 42000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Pin Co", external_ref: "PIN-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-PIN", signed_date: "2026-05-20", fixed_consideration_cents: 90000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "GADGET", region: "EU", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_ssp: $.data.ssp_cents, pob_status: $.data.status, pob_alloc: $.data.allocated_amount_cents }
          assert:
            - "POB ssp_cents == 42000 (resolved from the covering SSP window at signed_date 2026-05-20)"
            - "status == PENDING, allocated_amount_cents == 0 until contract approve"

      - name: pob_without_covering_ssp_returns_ssp_not_found
        claim_type: creation_referential
        grounds: ["errors[ERR_SSP_NOT_FOUND]", "validations[priority=9]"]
        distinguishing_aspect: "No ACTIVE SSP window covers the contract's signed_date 2026-05-20 (the only window starts 2026-06-01) -> POB creation fails 422 ERR_SSP_NOT_FOUND."
        test_recipe:
          setup: ["SSP WIDGET/US window [2026-06-01, 2026-12-31] only; customer; DRAFT contract signed 2026-05-20"]
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-06-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "NoSSP Co", external_ref: "NOSSP-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-NOSSP", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SSP_NOT_FOUND, http 422; no POB persisted"

      - name: contract_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /revrec/contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: fk_reverse_reachability_lists_children
        claim_type: parent_relationships
        grounds: [entities.PerformanceObligation.fields.contract_id, "endpoints.GET /revrec/contracts/{contract_id}/pobs"]
        distinguishing_aspect: "GET /revrec/contracts/{id}/pobs returns exactly the POBs created under that contract (2), and GET /revrec/contracts?customer_id= returns exactly that customer's contracts (1)."
        test_recipe:
          setup: ["customer; DRAFT contract with two POINT_IN_TIME POBs (PA, PB)"]
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "PA", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "PB", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "FK Co", external_ref: "FK-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-FK", signed_date: "2026-05-20", fixed_consideration_cents: 200000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PA", product_code: "PA", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PB", product_code: "PB", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "GET /revrec/contracts/${c_id}/pobs"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/contracts"
              payload: { customer_id: "${cust_id}" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { first_c: "$.data[0].id" }
          assert:
            - "GET pobs sub-resource returns exactly 2 POBs, both with contract_id == ${c_id}"
            - "GET contracts filtered by customer_id returns exactly 1 contract with id == ${c_id}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_from_approved_returns_invalid_state_transition
        claim_type: invalid_transition
        grounds: [state_machines.Contract, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "APPROVED is not a valid from-state for submit; the second submit is rejected 409 and the contract stays APPROVED."
        test_recipe:
          setup: ["clock 2026-06-15; SSP WIDGET/US; customer; contract with one POINT_IN_TIME POB, APPROVED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Tr Co", external_ref: "TR-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-TR", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION, http 409"
            - "Contract.${c_id} status remains APPROVED"

      - name: cancel_cascades_pobs_and_locks_terminal
        claim_type: terminal_lockdown_and_cascade
        grounds: [state_machines.Contract.DRAFT_to_CANCELLED, state_machines.PerformanceObligation.PENDING_to_CANCELLED]
        distinguishing_aspect: "Cancelling a DRAFT contract cascades its PENDING POB to CANCELLED (conditional cascade), and CANCELLED is terminal — a later submit fails 409."
        test_recipe:
          setup: ["SSP WIDGET/US; customer; DRAFT contract with one POB"]
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Term Co", external_ref: "TERM-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-TERM", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /revrec/contracts/${c_id}/cancel"
              payload: { reason: "deal dead" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_status: $.data.status }
            - call: "GET /revrec/contracts/${c_id}/pobs"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_status: "$.data[0].status" }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "contract status == CANCELLED"
            - "POB status == CANCELLED (cascade down)"
            - "submit from CANCELLED -> error_id == ERR_INVALID_STATE_TRANSITION"

      - name: pob_auto_in_progress_on_first_cost_entry
        claim_type: automatic_transition
        grounds: [state_machines.PerformanceObligation.PENDING_to_IN_PROGRESS]
        distinguishing_aspect: "The first posted RECOGNITION entry (via a partial cost entry) moves the POB PENDING -> IN_PROGRESS without any explicit transition call."
        test_recipe:
          setup: ["clock 2026-06-15; OPEN June period; SSP WIDGET/US 100000; contract fixed 100000 ACTIVE with one INPUT_COST POB est 40000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "ops-1"
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "WIDGET", region: "US", ssp_cents: 100000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Auto Co", external_ref: "AUTO-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-AUTO", signed_date: "2026-05-20", fixed_consideration_cents: 100000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "WIDGET", region: "US", recognition_pattern: "OVER_TIME_INPUT_COST", estimated_total_cost_cents: 40000 }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /revrec/pobs/${pob_id}/cost-entries"
              payload: { amount_cents: 10000, incurred_date: "2026-06-10" }
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "GET /revrec/pobs/${pob_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { st: $.data.status, rec: $.data.recognized_revenue_cents, costs: $.data.costs_incurred_to_date_cents }
          assert:
            - "POB status == IN_PROGRESS (auto-transition from PENDING)"
            - "costs_incurred_to_date_cents == 10000 and recognized_revenue_cents == 25000 (25% of 100000)"

      - name: period_second_reopen_returns_reopen_limit
        claim_type: invalid_transition
        grounds: [state_machines.AccountingPeriod.CLOSED_to_REOPENED, "errors[ERR_PERIOD_REOPEN_LIMIT]"]
        distinguishing_aspect: "A period may be reopened at most once: OPEN -> CLOSED -> REOPENED -> CLOSED succeeds; the second reopen fails 409 ERR_PERIOD_REOPEN_LIMIT."
        test_recipe:
          setup: ["period June exists, closed once, reopened once, closed again"]
          setup_api_calls:
            - call: "POST /revrec/accounting-periods"
              payload: { period_code: "2026-06", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { per_id: $.data.id }
            - call: "POST /revrec/accounting-periods/${per_id}/close"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /revrec/accounting-periods/${per_id}/reopen"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /revrec/accounting-periods/${per_id}/close"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
          trigger:
            - call: "POST /revrec/accounting-periods/${per_id}/reopen"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERIOD_REOPEN_LIMIT (reopened_once already true)"
            - "AccountingPeriod.status remains CLOSED"

      - name: newer_estimate_approval_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.VariableConsiderationEstimate.APPROVED_to_SUPERSEDED, entities.Contract.fields.vc_estimate_cents]
        distinguishing_aspect: "Approving a second estimate supersedes the previously APPROVED one and re-points the contract's vc_estimate_cents (85000 -> 34000) and transaction price (100000 -> 59000 on a 25000-fixed contract)."
        test_recipe:
          setup: ["customer; DRAFT contract fixed 25000 risk STANDARD signed 2026-05-20; estimate E1 ML 100000 APPROVED by mgr-1"]
          setup_api_calls:
            - call: "POST /revrec/customers"
              payload: { legal_name: "Sup Co", external_ref: "SUP-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-SUP", signed_date: "2026-05-20", fixed_consideration_cents: 25000, risk_tier: "STANDARD" }
              as: RevenueAccountant
