scenario: |
  Peer Support Group & Community Program Administration (peer support nonprofit):
  group calendar & facilitator assignment, participant registration & confidentiality
  agreement, attendance tracking & capacity limits, facilitator training/supervision
  & incident escalation, virtual vs in-person modality & hybrid access, referral to
  clinical services when out of scope, program evaluation survey, volunteer
  facilitator recruitment.

domain_name: peer-support-groups
api_prefix: ""

complexity_profile:
  primary_archetype: "Posture-driven gating"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — DO NOT EDIT)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: focus_area, type: enum, source: input, description: "GRIEF | ADDICTION | ANXIETY | PARENTING | CHRONIC_ILLNESS" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CAUTION | LOCKDOWN — derived from active IncidentReport severities", default: OPEN }
      - { name: active_critical_incident_count, type: integer, source: computed, description: "Count of IncidentReport with severity=CRITICAL and status IN {OPEN, ACKNOWLEDGED} under this Program", default: 0 }
      - { name: active_standard_incident_count, type: integer, source: computed, description: "Count of IncidentReport with severity=STANDARD and status IN {OPEN, ACKNOWLEDGED} under this Program", default: 0 }
      - { name: scheduled_session_count, type: integer, source: computed, description: "Count of Sessions under this Program with status SCHEDULED", default: 0 }

  - name: PeerGroup
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Group name (unique within Program)" }
      - { name: modality, type: enum, source: input, description: "IN_PERSON | VIRTUAL | HYBRID" }
      - { name: base_capacity, type: integer, source: input, description: "Maximum concurrent CONFIRMED seats per Session; >= 1" }
      - { name: required_facilitator_level, type: integer, source: input, description: "Minimum facilitator.level required to lead; 1..5" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | RETIRED", default: DRAFT }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Count of Enrollment under this PeerGroup with seat_status IN {RESERVED, CONFIRMED}", default: 0 }

  - name: Session
    parent: PeerGroup
    common_fields: true
    fields:
      - { name: group_id, type: string, source: system, description: "FK -> PeerGroup.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; required when PeerGroup.modality IN {IN_PERSON, HYBRID}; forbidden when modality=VIRTUAL" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 UTC session start" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 UTC session end; must be > start_at" }
      - { name: primary_facilitator_id, type: string, source: input, description: "FK -> Facilitator.id" }
      - { name: cofacilitator_id, type: string, source: input, description: "FK -> Facilitator.id; optional; must differ from primary_facilitator_id", required: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | IN_PROGRESS | COMPLETED | COMPLETED_WITH_INCIDENT | CANCELLED", default: DRAFT }
      - { name: reserved_seats, type: integer, source: computed, description: "Count of Enrollment referencing this session's group with seat_status=RESERVED", default: 0 }
      - { name: confirmed_seats, type: integer, source: computed, description: "Count of Enrollment referencing this session's group with seat_status=CONFIRMED", default: 0 }
      - { name: effective_capacity, type: integer, source: computed, description: "Per session_capacity_formula; modality-aware", default: 0 }
      - { name: virtual_link_token, type: string, source: system, description: "Random opaque token for virtual/hybrid access; populated only when modality permits virtual" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room identifier (unique across system)" }
      - { name: physical_capacity, type: integer, source: input, description: "Hard occupancy cap; >= 1" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OUT_OF_SERVICE", default: AVAILABLE }

  - name: Facilitator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: email, type: string, source: input, description: "Contact email (unique)" }
      - { name: status, type: enum, source: system, description: "APPLIED | SCREENING | IN_TRAINING | SUPERVISED_PRACTICE | CERTIFIED | SUSPENDED | WITHDRAWN | REJECTED", default: APPLIED }
      - { name: level, type: integer, source: computed, description: "Derived 1..5 from completed TrainingCompletion and SupervisionReview; see facilitator_level calculation", default: 1 }
      - { name: supervision_required, type: boolean, source: computed, description: "True when Facilitator must complete a SupervisionReview before next primary assignment", default: false }
      - { name: application_submitted_at, type: datetime, source: system, description: "Set at creation" }
      - { name: certified_at, type: datetime, source: system, description: "Set when status enters CERTIFIED; cleared on SUSPENDED", required: false }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique course code" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: integer, source: input, description: "Credit hours; >= 1" }
      - { name: level_weight, type: integer, source: input, description: "Contribution to facilitator.level; 1..3" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: TrainingCompletion
    parent: Facilitator
    common_fields: true
    fields:
      - { name: facilitator_id, type: string, source: system, description: "FK -> Facilitator.id" }
      - { name: course_id, type: string, source: input, description: "FK -> TrainingCourse.id" }
      - { name: completed_at, type: datetime, source: input, description: "When the course was completed" }
      - { name: score, type: integer, source: input, description: "0..100; passing >= 70" }

  - name: SupervisionReview
    parent: Facilitator
    common_fields: true
    fields:
      - { name: facilitator_id, type: string, source: system, description: "FK -> Facilitator.id" }
      - { name: reviewer_id, type: string, source: input, description: "FK -> Facilitator.id; must have status=CERTIFIED and level>=4" }
      - { name: occurred_at, type: datetime, source: input, description: "When the supervision occurred" }
      - { name: rating, type: integer, source: input, description: "1..5" }
      - { name: clears_supervision_required, type: boolean, source: input, description: "If true, sets Facilitator.supervision_required=false", default: false }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: email, type: string, source: input, description: "Contact email (unique)" }
      - { name: household_size, type: integer, source: input, description: "1..8; used for fee tier" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | SUSPENDED | DEACTIVATED", default: REGISTERED }
      - { name: attendance_streak, type: integer, source: computed, description: "Consecutive attended Sessions without a no-show; reset to 0 on no-show", default: 0 }
      - { name: total_no_shows, type: integer, source: computed, description: "Cumulative no-show count", default: 0 }
      - { name: current_agreement_id, type: string, source: system, description: "FK -> ConfidentialityAgreement.id; latest SIGNED agreement", required: false }

  - name: ConfidentialityAgreement
    parent: Participant
    common_fields: false
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: signed_at, type: datetime, source: input, description: "Timestamp the participant signed" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry; must be > signed_at" }
      - { name: status, type: enum, source: system, description: "SIGNED | EXPIRED | REVOKED", default: SIGNED }
      - { name: agreement_version, type: integer, source: input, description: "Monotonic per participant; later versions supersede" }

  - name: Enrollment
    parent: PeerGroup
    common_fields: true
    fields:
      - { name: group_id, type: string, source: system, description: "FK -> PeerGroup.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: seat_status, type: enum, source: system, description: "RESERVED | CONFIRMED | WAITLISTED | RELEASED | CANCELLED", default: RESERVED }
      - { name: agreement_status, type: enum, source: system, description: "PENDING | SIGNED | EXPIRED | REVOKED — tracks the participant's current agreement at confirmation time", default: PENDING }
      - { name: reserved_at, type: datetime, source: system, description: "When seat entered RESERVED" }
      - { name: confirmed_at, type: datetime, source: system, description: "When seat entered CONFIRMED", required: false }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based position among WAITLISTED, ordered by reserved_at ASC with created_at ASC tiebreak", required: false }

  - name: AttendanceRecord
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: check_in_at, type: datetime, source: system, description: "Server-stamped check-in time" }
      - { name: check_out_at, type: datetime, source: system, description: "Server-stamped check-out time; null until checkout", required: false }
      - { name: access_modality, type: enum, source: input, description: "IN_PERSON | VIRTUAL — must be compatible with Session's group modality" }
      - { name: status, type: enum, source: system, description: "CHECKED_IN | ATTENDED | NO_SHOW | VOIDED", default: CHECKED_IN }

  - name: IncidentReport
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id" }
      - { name: raised_by_facilitator_id, type: string, source: input, description: "FK -> Facilitator.id; must be primary or cofacilitator on the session" }
      - { name: severity, type: enum, source: input, description: "STANDARD | CRITICAL" }
      - { name: category, type: enum, source: input, description: "SAFETY | CONFIDENTIALITY | HARASSMENT | MEDICAL | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text narrative" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | RESOLVED | ESCALATED_TO_CLINICAL", default: OPEN }

  - name: ClinicalReferral
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: source_incident_id, type: string, source: input, description: "FK -> IncidentReport.id; the triggering incident", required: false }
      - { name: reason_code, type: enum, source: input, description: "OUT_OF_SCOPE | CRISIS | MEDICAL | RISK_OF_HARM" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DECLINED | COMPLETED", default: PENDING }
      - { name: clinical_notes, type: string, source: input, description: "Reviewer notes", required: false }

  - name: EvaluationSurvey
    parent: Session
    common_fields: false
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; must have attended the session" }
      - { name: overall_rating, type: integer, source: input, description: "1..5" }
      - { name: facilitator_rating, type: integer, source: input, description: "1..5" }
      - { name: modality_rating, type: integer, source: input, description: "1..5" }
      - { name: free_text, type: string, source: input, description: "Optional comments", required: false }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped submission time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: "*"
        to: LOCKDOWN
        trigger: "system (automatic when active_critical_incident_count > 0)"
        actor: system
        preconditions:
          - "active_critical_incident_count > 0"
        side_effects:
          - "Block all Session scheduling, Enrollment confirmation, AttendanceRecord check-in"
          - "Only IncidentReport resolution and read operations allowed"

      - from: "*"
        to: CAUTION
        trigger: "system (automatic when active_critical_incident_count == 0 AND active_standard_incident_count > 0)"
        actor: system
        preconditions:
          - "active_critical_incident_count == 0"
          - "active_standard_incident_count > 0"
        side_effects:
          - "Block new Enrollment creation; existing CONFIRMED enrollments unaffected"
          - "Sessions may proceed; new Sessions may be scheduled"

      - from: "*"
        to: OPEN
        trigger: "system (automatic when active_critical_incident_count == 0 AND active_standard_incident_count == 0)"
        actor: system
        preconditions:
          - "No active incidents"
        side_effects:
          - "All operations permitted"

  - entity: PeerGroup
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{pid}/groups/{gid}/activate"
        actor: ProgramAdmin
        preconditions:
          - "PeerGroup.status == DRAFT"
          - "base_capacity >= 1"
        side_effects:
          - "Allow Session creation for this group"
          - "Allow Enrollment creation"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /programs/{pid}/groups/{gid}/pause"
        actor: ProgramAdmin
        preconditions:
          - "PeerGroup.status == ACTIVE"
        side_effects:
          - "Block new Enrollment creation"
          - "Block Session transition DRAFT→SCHEDULED (existing SCHEDULED sessions unaffected)"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /programs/{pid}/groups/{gid}/resume"
        actor: ProgramAdmin
        preconditions:
          - "PeerGroup.status == PAUSED"
          - "Program.posture == OPEN"
        side_effects:
          - "Resume normal operations"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /programs/{pid}/groups/{gid}/retire"
        actor: ProgramAdmin
        preconditions:
          - "PeerGroup.status IN {ACTIVE, PAUSED}"
          - "No Session under this group in status SCHEDULED or IN_PROGRESS"
          - "No Enrollment under this group with seat_status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "All remaining DRAFT sessions under group transition to CANCELLED"

      - from: PAUSED
        to: RETIRED
        trigger: "POST /programs/{pid}/groups/{gid}/retire"
        actor: ProgramAdmin
        preconditions:
          - "Same as ACTIVE → RETIRED"
        side_effects:
          - "Same as ACTIVE → RETIRED"

  - entity: Session
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, COMPLETED_WITH_INCIDENT, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/schedule"
        actor: ProgramAdmin
        preconditions:
          - "Session.status == DRAFT"
          - "PeerGroup.status == ACTIVE"
          - "Program.posture != LOCKDOWN"
          - "primary_facilitator.status == CERTIFIED"
          - "primary_facilitator.level >= PeerGroup.required_facilitator_level"
          - "primary_facilitator.supervision_required == false"
          - "If cofacilitator_id set: cofacilitator.status == CERTIFIED AND cofacilitator.level >= 2"
          - "No room-overlap conflict per room_overlap_rule"
          - "No facilitator-buffer conflict per facilitator_buffer_rule"
        side_effects:
          - "Populate virtual_link_token if modality permits"
          - "Program.scheduled_session_count incremented"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (automatic when current_utc >= start_at)"
        actor: system
        preconditions:
          - "Session.status == SCHEDULED"
        side_effects:
          - "Allow check-ins"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/complete"
        actor: ProgramAdmin, Facilitator
        preconditions:
          - "Session.status == IN_PROGRESS"
          - "current_utc >= end_at"
          - "No IncidentReport on this session with status IN {OPEN, ACKNOWLEDGED} and severity=CRITICAL"
          - "All AttendanceRecord on this session are in terminal state (ATTENDED, NO_SHOW, VOIDED)"
        side_effects:
          - "Program.scheduled_session_count decremented"
          - "Trigger attendance reconciliation (mark remaining CHECKED_IN without checkout as ATTENDED if end_at passed)"

      - from: IN_PROGRESS
        to: COMPLETED_WITH_INCIDENT
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/complete"
        actor: ProgramAdmin, Facilitator
        preconditions:
          - "Session.status == IN_PROGRESS"
          - "current_utc >= end_at"
          - "At least one IncidentReport on this session with status IN {OPEN, ACKNOWLEDGED} and severity=CRITICAL"
          - "All AttendanceRecord on this session are in terminal state"
        side_effects:
          - "Program.scheduled_session_count decremented"
          - "primary_facilitator.supervision_required = true"
          - "If cofacilitator_id set: cofacilitator.supervision_required = true"
          - "Increment active critical incident count is already accounted"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "Session.status == SCHEDULED"
        side_effects:
          - "All AttendanceRecord with status=CHECKED_IN transition to VOIDED"
          - "Program.scheduled_session_count decremented"
          - "If Program.posture == LOCKDOWN and this was the last SCHEDULED session, no further cascade"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "Session.status == DRAFT"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (automatic cascade from PeerGroup RETIRED)"
        actor: system
        preconditions:
          - "Session.status == SCHEDULED"
          - "Parent PeerGroup transitioning to RETIRED"
        side_effects:
          - "Same as manual cancel"

  - entity: Facilitator
    field: status
    initial_state: APPLIED
    terminal_states: [WITHDRAWN, REJECTED]
    transitions:
      - from: APPLIED
        to: SCREENING
        trigger: "POST /facilitators/{fid}/advance-to-screening"
        actor: ProgramAdmin
        preconditions:
          - "Facilitator.status == APPLIED"
        side_effects: []

      - from: SCREENING
        to: IN_TRAINING
        trigger: "POST /facilitators/{fid}/advance-to-training"
        actor: ProgramAdmin
        preconditions:
          - "Facilitator.status == SCREENING"
        side_effects: []

      - from: IN_TRAINING
        to: SUPERVISED_PRACTICE
        trigger: "POST /facilitators/{fid}/advance-to-practice"
        actor: ProgramAdmin
        preconditions:
          - "Facilitator.status == IN_TRAINING"
          - "Facilitator has at least one TrainingCompletion with score >= 70"
        side_effects: []

      - from: SUPERVISED_PRACTICE
        to: CERTIFIED
        trigger: "POST /facilitators/{fid}/certify"
        actor: ProgramAdmin
        preconditions:
          - "Facilitator.status == SUPERVISED_PRACTICE"
          - "Facilitator has at least one SupervisionReview with rating >= 3"
          - "Facilitator.level >= 2"
        side_effects:
          - "certified_at set to current_utc"
          - "supervision_required set to false"

      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /facilitators/{fid}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "Facilitator.status == CERTIFIED"
        side_effects:
          - "certified_at cleared"
          - "Block new Session assignments"

      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /facilitators/{fid}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "Facilitator.status == SUSPENDED"
          - "At least one SupervisionReview created after the suspension with rating >= 4"
        side_effects:
          - "certified_at set to current_utc"

      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /facilitators/{fid}/withdraw"
        actor: ProgramAdmin, Facilitator
        preconditions:
          - "Facilitator.status IN {APPLIED, SCREENING, IN_TRAINING, SUPERVISED_PRACTICE}"
        side_effects: []

      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /facilitators/{fid}/withdraw"
        actor: ProgramAdmin, Facilitator
        preconditions: []
        side_effects: []

      - from: IN_TRAINING
        to: WITHDRAWN
        trigger: "POST /facilitators/{fid}/withdraw"
        actor: ProgramAdmin, Facilitator
        preconditions: []
        side_effects: []

      - from: SUPERVISED_PRACTICE
        to: WITHDRAWN
        trigger: "POST /facilitators/{fid}/withdraw"
        actor: ProgramAdmin, Facilitator
        preconditions: []
        side_effects: []

      - from: SCREENING
        to: REJECTED
        trigger: "POST /facilitators/{fid}/reject"
        actor: ProgramAdmin
        preconditions:
          - "Facilitator.status == SCREENING"
        side_effects: []

  - entity: Participant
    field: status
    initial_state: REGISTERED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /participants/{pid}/activate"
        actor: ProgramAdmin
        preconditions:
          - "Participant.status == REGISTERED"
          - "Participant.current_agreement_id is not null"
          - "Referenced ConfidentialityAgreement.status == SIGNED"
          - "Referenced ConfidentialityAgreement.expires_at > current_utc"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /participants/{pid}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "Participant.status == ACTIVE"
        side_effects:
          - "All Enrollment with participant_id==pid and seat_status IN {RESERVED, CONFIRMED} transition to CANCELLED"
          - "Cascade triggers seat release on each affected group's counters"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /participants/{pid}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "Participant.status == SUSPENDED"
          - "Participant has a current SIGNED ConfidentialityAgreement with expires_at > current_utc"
        side_effects: []

      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /participants/{pid}/deactivate"
        actor: ProgramAdmin
        preconditions:
          - "Participant.status IN {ACTIVE, SUSPENDED}"
          - "No Enrollment with seat_status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "Current agreement status set to REVOKED"
          - "current_agreement_id cleared"

      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /participants/{pid}/deactivate"
        actor: ProgramAdmin
        preconditions:
          - "Same as ACTIVE → DEACTIVATED"
        side_effects:
          - "Same as ACTIVE → DEACTIVATED"

  - entity: Enrollment
    field: seat_status
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /programs/{pid}/groups/{gid}/enrollments/{eid}/confirm"
        actor: ProgramAdmin, Participant
        preconditions:
          - "Enrollment.seat_status == RESERVED"
          - "Program.posture != LOCKDOWN"
          - "PeerGroup.status == ACTIVE"
          - "Participant.status == ACTIVE"
          - "Participant.current_agreement_id references ConfidentialityAgreement with status=SIGNED and expires_at > current_utc"
          - "PeerGroup.active_enrollment_count < PeerGroup.base_capacity"
        side_effects:
          - "PeerGroup.active_enrollment_count incremented"
          - "Enrollment.agreement_status set to SIGNED"
          - "confirmed_at set"

      - from: RESERVED
        to: WAITLISTED
        trigger: "system (automatic when confirmation attempted and group at capacity)"
        actor: system
        preconditions:
          - "PeerGroup.active_enrollment_count >= PeerGroup.base_capacity"
        side_effects:
          - "waitlist_position assigned per reserved_at ASC with created_at ASC tiebreak"

      - from: WAITLISTED
        to: RESERVED
        trigger: "system (automatic when a seat opens via RELEASED/CANCELLED)"
        actor: system
        preconditions:
          - "PeerGroup.active_enrollment_count < PeerGroup.base_capacity"
        side_effects:
          - "Lowest waitlist_position promoted"
          - "PeerGroup.active_enrollment_count incremented (RESERVED counts toward occupancy)"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /programs/{pid}/groups/{gid}/enrollments/{eid}/release"
        actor: ProgramAdmin, Participant
        preconditions:
          - "Enrollment.seat_status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "PeerGroup.active_enrollment_count decremented"
          - "Waitlist promotion cascades if any WAITLISTED exists"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /programs/{pid}/groups/{gid}/enrollments/{eid}/release"
        actor: ProgramAdmin, Participant
        preconditions: []
        side_effects:
          - "Same as RESERVED → RELEASED"

      - from: RESERVED
        to: CANCELLED
        trigger: "system (cascade from Participant suspension or group retirement)"
        actor: system
        preconditions: []
        side_effects:
          - "PeerGroup.active_enrollment_count decremented"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (cascade from Participant suspension or group retirement)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as RESERVED → CANCELLED"

  - entity: AttendanceRecord
    field: status
    initial_state: CHECKED_IN
    terminal_states: [ATTENDED, NO_SHOW, VOIDED]
    transitions:
      - from: CHECKED_IN
        to: ATTENDED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/attendance/{aid}/checkout"
        actor: ProgramAdmin, Facilitator, Participant
        preconditions:
          - "AttendanceRecord.status == CHECKED_IN"
          - "current_utc >= Session.start_at"
        side_effects:
          - "check_out_at set"
          - "Participant.attendance_streak incremented"

      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "system (automatic when Session reaches end_at without checkout)"
        actor: system
        preconditions:
          - "AttendanceRecord.status == CHECKED_IN"
          - "current_utc >= Session.end_at + 15 minutes grace"
        side_effects:
          - "Participant.attendance_streak reset to 0"
          - "Participant.total_no_shows incremented"

      - from: CHECKED_IN
        to: VOIDED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/attendance/{aid}/void"
        actor: ProgramAdmin, Facilitator
        preconditions:
          - "AttendanceRecord.status == CHECKED_IN"
        side_effects:
          - "Participant.attendance_streak restored to prior value (compensating invariant)"
          - "Participant.total_no_shows unchanged (record was voided, not completed)"

  - entity: IncidentReport
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED_TO_CLINICAL]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/incidents/{iid}/acknowledge"
        actor: ProgramAdmin
        preconditions:
          - "IncidentReport.status == OPEN"
        side_effects:
          - "Program posture re-evaluated"

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/incidents/{iid}/resolve"
        actor: ProgramAdmin
        preconditions:
          - "IncidentReport.status == ACKNOWLEDGED"
        side_effects:
          - "Program.active_critical_incident_count or active_standard_incident_count decremented by severity"
          - "Program posture re-evaluated"
          - "If all CRITICAL resolved and no STANDARD remain, posture returns to OPEN"

      - from: OPEN
        to: ESCALATED_TO_CLINICAL
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/incidents/{iid}/escalate"
        actor: ProgramAdmin
        preconditions:
          - "IncidentReport.status IN {OPEN, ACKNOWLEDGED}"
          - "IncidentReport.severity == CRITICAL"
        side_effects:
          - "A ClinicalReferral is created in status=PENDING referencing the incident"
          - "Program.active_critical_incident_count decremented (moved out of active set)"
          - "Program posture re-evaluated"

      - from: ACKNOWLEDGED
        to: ESCALATED_TO_CLINICAL
        trigger: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/incidents/{iid}/escalate"
        actor: ProgramAdmin
        preconditions:
          - "Same as OPEN → ESCALATED_TO_CLINICAL"
        side_effects:
          - "Same as OPEN → ESCALATED_TO_CLINICAL"

  - entity: ClinicalReferral
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /participants/{pid}/referrals/{rid}/accept"
        actor: ClinicalCoordinator
        preconditions:
          - "ClinicalReferral.status == PENDING"
        side_effects: []

      - from: PENDING
        to: DECLINED
        trigger: "POST /participants/{pid}/referrals/{rid}/decline"
        actor: ClinicalCoordinator
        preconditions:
          - "ClinicalReferral.status == PENDING"
        side_effects: []

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /participants/{pid}/referrals/{rid}/complete"
        actor: ClinicalCoordinator
        preconditions:
          - "ClinicalReferral.status == ACCEPTED"
        side_effects: []

  - entity: ConfidentialityAgreement
    field: status
    initial_state: SIGNED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: SIGNED
        to: EXPIRED
        trigger: "system (automatic when current_utc > expires_at)"
        actor: system
        preconditions:
          - "ConfidentialityAgreement.status == SIGNED"
        side_effects:
          - "If Participant.current_agreement_id == this agreement: Participant status remains but new Enrollment confirmations blocked"
          - "Participant.current_agreement_id cleared"

      - from: SIGNED
        to: REVOKED
        trigger: "POST /participants/{pid}/agreements/{aid}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "ConfidentialityAgreement.status == SIGNED"
        side_effects:
          - "If Participant.current_agreement_id == this agreement: current_agreement_id cleared"
          - "All Enrollment for this participant with seat_status IN {RESERVED, CONFIRMED} transition to CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-confirm-stale-group
    parent_entity: PeerGroup
    write_endpoint: "POST /programs/{pid}/groups/{gid}/enrollments/{eid}/confirm"
    occ_field: "expected_group_version"
    description: |
      Confirming an Enrollment against a PeerGroup whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just confirmed or released an Enrollment (which advances
      PeerGroup.version and possibly promoted a WAITLISTED entry), so the current
      writer's view of available capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: session-schedule-stale-facilitator
    parent_entity: Facilitator
    write_endpoint: "POST /programs/{pid}/groups/{gid}/sessions/{sid}/schedule"
    occ_field: "expected_facilitator_version"
    description: |
      Scheduling a Session against a primary_facilitator whose version has advanced
      since the client last observed it is rejected. This captures the case where
      a parallel write (e.g., another session being scheduled against the same
      facilitator, or a suspension) has advanced Facilitator.version, so the
      current scheduling decision is made on stale availability state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_capacity_formula
    trigger: "Session creation and PeerGroup.modality or Room.physical_capacity change"
    algorithm: constraint_propagation
    formula: |
      # Mode (a) combinatorial — nested min with state-conditional branch.
      if PeerGroup.modality == VIRTUAL:
        effective_capacity = PeerGroup.base_capacity
      elif PeerGroup.modality == IN_PERSON:
        if room_id is null: reject (validation)
        effective_capacity = min(PeerGroup.base_capacity, Room.physical_capacity)
      else:  # HYBRID
        # in-person seats are a sub-allocation; virtual seats take the remainder
        if room_id is null: reject (validation)
        in_person_seats = min(Room.physical_capacity, ceil(PeerGroup.base_capacity * 0.5))
        virtual_seats = PeerGroup.base_capacity - in_person_seats
        effective_capacity = in_person_seats + virtual_seats
        # note: equals base_capacity, but in-person cap binds separately during check-in
    input_set: "PeerGroup + Room; only when PeerGroup.status == ACTIVE"
    precision: "integer"

  - name: session_attendance_rate
    trigger: "GET /programs/{pid}/groups/{gid}/sessions/{sid}/summary"
    algorithm: aggregation
    formula: |
      # Variant A (provisional): count CHECKED_IN + ATTENDED records at time of call.
      # Variant B (final): count only ATTENDED records (post-checkout reconciliation).
      provisional_rate = count(AttendanceRecord.status IN {CHECKED_IN, ATTENDED}) / max(1, count(Enrollment of this group with seat_status=CONFIRMED))
      final_rate      = count(AttendanceRecord.status == ATTENDED)              / max(1, count(Enrollment of this group with seat_status=CONFIRMED))
      # Final rate is used for reporting; provisional rate is used for live dashboards.
    input_set: "All AttendanceRecord for this Session; Enrollment for this PeerGroup"
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Called while Session.status == IN_PROGRESS or SCHEDULED"
        difference: "Includes CHECKED_IN records"
      - name: final
        when: "Called after Session.status IN {COMPLETED, COMPLETED_WITH_INCIDENT}"
        difference: "Includes only ATTENDED records; excludes CHECKED_IN that never checked out"

  - name: facilitator_level
    trigger: "After each TrainingCompletion creation or SupervisionReview creation"
    algorithm: weighted_scoring
    formula: |
      # Mode (c) combinatorial — circular-looking dependency, pinned evaluation order.
      # Step 1: compute training_points (depends only on TrainingCompletion)
      passing_completions = [c for c in TrainingCompletion if c.facilitator_id == this.id and c.score >= 70 and TrainingCourse(c.course_id).status == ACTIVE]
      training_points = sum(TrainingCourse(c.course_id).level_weight for c in passing_completions)

      # Step 2: compute supervision_bonus (depends on SupervisionReview count, not on level)
      reviews = [r for r in SupervisionReview if r.facilitator_id == this.id]
      recent_reviews = [r for r in reviews if r.rating >= 4]
      supervision_bonus = min(2, len(recent_reviews) // 2)   # 0, 1, or 2

      # Step 3: compute level (depends on training_points and supervision_bonus)
      raw = 1 + training_points + supervision_bonus
      level = min(5, max(1, raw))
      # NOTE: SupervisionReview.eligibility (reviewer.level>=4) depends on facilitator.level
      # but is evaluated when the review is created — before this recompute — so the loop
      # terminates: review creation uses prior level, then this recompute runs once.
    input_set: "TrainingCompletion (passing only, active courses only), SupervisionReview"
    precision: "integer"

  - name: facilitator_capacity_score
    trigger: "GET /facilitators/{fid}/capacity-score (for assignment decision support)"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant on Facilitator domain (Rule 1 pairing with session_attendance_rate).
      # Variant "conservative" weights supervision heavily; "accelerated" weights training.
      training_hours = sum(TrainingCourse(c.course_id).credit_hours for c in TrainingCompletion where c.facilitator_id==fid and c.score>=70)
      supervision_count = count(SupervisionReview where facilitator_id==fid and rating>=3)
      sessions_led = count(Session where primary_facilitator_id==fid and status IN {COMPLETED, COMPLETED_WITH_INCIDENT})

      conservative = round_half_up(0.5*supervision_count + 0.3*training_hours + 0.2*sessions_led, 2)
      accelerated  = round_half_up(0.2*supervision_count + 0.5*training_hours + 0.3*sessions_led, 2)
    input_set: "TrainingCompletion, SupervisionReview, Session"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: conservative
        when: "Facilitator is being considered for primary_facilitator on a CRITICAL-history group"
        difference: "Weights supervision_count 0.5 vs 0.2"
      - name: accelerated
        when: "Facilitator is being considered for cofacilitator or new group launch"
        difference: "Weights training_hours 0.5 vs 0.3"

  - name: training_stipend_award
    trigger: "POST /facilitators/{fid}/stipend-calculation (admin preview)"
    algorithm: aggregation
    formula: |
      # Mode (b) combinatorial — nested rounding, order pinned.
      # Rule: round each course's stipend to cents first, then sum.
      # Stipend per course = credit_hours * STIPEND_RATE_PER_HOUR * level_multiplier(course.level_weight)
      # where level_multiplier(w) = 1.0 if w==1, 1.25 if w==2, 1.50 if w==3
      per_course_stipends = [
        round_half_up(c.credit_hours * 18.50 * (1.0 + 0.25*(c.level_weight-1)), 2)
        for c in passing_courses
      ]
      total_stipend_cents = sum(round_half_up(s * 100, 0) for s in per_course_stipends)
      # Pinning: "round per-course then sum" — NOT "sum then round".
      # For inputs {credit_hours=3, level_weight=1} and {credit_hours=2, level_weight=3}:
      #   per-course: round(3*18.50*1.00, 2)=55.50 → 5550c ; round(2*18.50*1.50, 2)=55.50 → 5550c
      #   total = 11100c = $111.00
      # Counterfactual (sum-then-round) would yield same here but diverges for inputs like
      # {credit_hours=1, lw=1} + {credit_hours=1, lw=2}: per-course = 18.50 + round(23.125,2)=23.13 → 4163c;
      # sum-then-round = round(41.625, 2)=41.63 → 4163c (same), but for {credit_hours=1,lw=2} x3:
      # per-course: 3*23.13 = 69.39; sum-then-round: round(3*23.125,2)=round(69.375,2)=69.38 (half-up) — DIFFERENT.
    input_set: "passing TrainingCompletions of this Facilitator on ACTIVE courses"
    constants:
      STIPEND_RATE_PER_HOUR: 18.50
    precision: "2 decimal places, round_half_up (per-course), then integer cents"

  - name: enrollment_fee_after_subsidy
    trigger: "POST /programs/{pid}/groups/{gid}/enrollments (fee calculation)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a) combinatorial with boundary conditions.
      # Inputs: Participant.household_size, Participant.attendance_streak, PeerGroup.base_capacity.
      base_fee_cents = 2500   # $25.00
      # Tier 1: household_size
      if household_size >= 4: tier1_discount = 0.50
      elif household_size >= 2: tier1_discount = 0.25
      else: tier1_discount = 0.00
      # Tier 2: attendance streak (boundary: streak >= 5 gets discount, 4 does not)
      if attendance_streak >= 5: tier2_discount = 0.10
      else: tier2_discount = 0.00
      # Compose: discounts STACK MULTIPLICATIVELY (not additively) — pinned order: tier1 first, then tier2.
      fee_after_t1 = base_fee_cents * (1 - tier1_discount)
      fee_after_t2 = fee_after_t1 * (1 - tier2_discount)
      final_fee_cents = round_half_up(fee_after_t2, 0)
      # Boundary: household_size==4 hits the 0.50 tier (>=4); household_size==3 stays at 0.25.
      # Boundary: attendance_streak==5 hits tier2; streak==4 does not.
      # Examples: household=1, streak=0 → 2500c. household=4, streak=5 → round(2500*0.5*0.9)=1125c.
    input_set: "Participant"
    constants:
      BASE_FEE_CENTS: 2500
    precision: "integer cents, round_half_up at final step only"

  - name: waitlist_promotion_order
    trigger: "When a seat becomes available (RELEASED or CANCELLED Enrollment)"
    algorithm: chronological
    formula: |
      # Order-sensitive selection. Pin sort key + tiebreak explicitly.
      candidates = [e for e in Enrollment where e.group_id==gid and e.seat_status==WAITLISTED]
      sorted_candidates = sort(candidates, by=(reserved_at ASC, created_at ASC))
      promoted = sorted_candidates[0] if sorted_candidates else None
      if promoted:
        promoted.seat_status = RESERVED
        promoted.waitlist_position = null
        PeerGroup.active_enrollment_count += 1
        # Reassign remaining waitlist positions
        for i, e in enumerate(sorted_candidates[1:]):
          e.waitlist_position = i + 1
    input_set: "Enrollment with seat_status=WAITLISTED for this group"
    precision: "n/a (selection, not arithmetic)"

  - name: program_posture_derivation
    trigger: "On IncidentReport create/acknowledge/resolve/escalate"
    algorithm: threshold
    formula: |
      if active_critical_incident_count > 0: posture = LOCKDOWN
      elif active_standard_incident_count > 0: posture = CAUTION
      else: posture = OPEN
      # Boundary: count == 1 crosses (uses >, not >=, against 0).
    input_set: "IncidentReport under this Program with status IN {OPEN, ACKNOWLEDGED}"
    precision: "n/a"

  - name: room_overlap_rule
    trigger: "Session scheduling validation"
    algorithm: interval_merge
    formula: |
      # Half-open interval: [start_at, end_at). Adjacent sessions (a.end == b.start) do NOT conflict.
      # Conflict iff NOT (a.end_at <= b.start_at OR b.end_at <= a.start_at).
      # Applies to Room resource.
      conflicts = [s for s in Session
                   where s.room_id == new.room_id
                     and s.status IN {SCHEDULED, IN_PROGRESS}
                     and NOT (s.end_at <= new.start_at OR new.end_at <= s.start_at)]
      return len(conflicts) == 0
    input_set: "Sessions in SCHEDULED or IN_PROGRESS on this Room"
    precision: "n/a"

  - name: facilitator_buffer_rule
    trigger: "Session scheduling validation"
    algorithm: interval_merge
    formula: |
      # Different interval semantics from room_overlap_rule: 30-minute buffer on either side.
      # Facilitator interval is [start_at - 30min, end_at + 30min). Adjacent is NOT sufficient.
      BUFFER_MINUTES = 30
      conflicts = [s for s in Session
                   where (s.primary_facilitator_id == new.primary_facilitator_id
                          or s.cofacilitator_id == new.primary_facilitator_id)
                     and s.status IN {SCHEDULED, IN_PROGRESS}
                     and NOT ((s.end_at + 30min) <= new.start_at OR (new.end_at + 30min) <= s.start_at)]
      return len(conflicts) == 0
    input_set: "Sessions in SCHEDULED or IN_PROGRESS involving this facilitator"
    precision: "n/a"

  - name: check_in_modality_compat
    trigger: "AttendanceRecord creation"
    algorithm: constraint_propagation
    formula: |
      if PeerGroup.modality == IN_PERSON and access_modality != IN_PERSON: reject
      if PeerGroup.modality == VIRTUAL and access_modality != VIRTUAL: reject
      if PeerGroup.modality == HYBRID: access_modality may be either
      # Additionally, if access_modality == VIRTUAL, the request must include the Session's
      # virtual_link_token (proves link access); if access_modality == IN_PERSON for HYBRID,
      # the room's in-person sub-capacity is enforced at check-in time.
    input_set: "Session, PeerGroup, Room"
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is authorized to invoke this endpoint (per §1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID must match an existing entity of the backing type and (where endpoint declares ownership) match the resource owner"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "endpoints with ownership constraint (e.g., Facilitator viewing own profile, Participant viewing own enrollments)"

  - priority: 4
    category: existence
    check: "All path-templated resources exist (Program → PeerGroup → Session, left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 5
    category: existence
    check: "All body-referenced FK resources exist (room_id, facilitator ids, participant_id, course_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PUT endpoints with FK body fields"

  - priority: 6
    category: state
    check: "Target entity is in a state that permits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Program.posture must not be LOCKDOWN for non-incident writes"
    error_id: ERR_PROGRAM_LOCKED_DOWN
    http_status: 409
    applies_to: "session schedule, enrollment confirm, attendance check-in"

  - priority: 8
    category: business_safety
    check: "IncidentReport CRITICAL requires a Session in IN_PROGRESS or later state; cannot raise on DRAFT"
    error_id: ERR_INCIDENT_ON_INVALID_SESSION
    http_status: 409
    applies_to: "POST incidents"

  - priority: 9
    category: business_safety
    check: "Facilitator conducting a supervision review must have status=CERTIFIED and level >= 4"
    error_id: ERR_INSUFFICIENT_REVIEWER_LEVEL
    http_status: 409
    applies_to: "POST /facilitators/{fid}/supervision-reviews"

  - priority: 10
    category: business_safety
    check: "Clinical escalation requires severity=CRITICAL"
    error_id: ERR_CLINICAL_REQUIRES_CRITICAL
    http_status: 409
    applies_to: "POST /incidents/{iid}/escalate"

  - priority: 11
    category: business_constraint
    check: "PeerGroup status must be ACTIVE for enrollment or session scheduling"
    error_id: ERR_GROUP_NOT_ACTIVE
    http_status: 409
    applies_to: "enrollment create/confirm, session schedule"

  - priority: 12
    category: business_constraint
    check: "Program.posture must not be CAUTION for enrollment creation"
    error_id: ERR_PROGRAM_CAUTION_BLOCKS_ENROLLMENT
    http_status: 409
    applies_to: "POST enrollments"

  - priority: 13
    category: business_temporal
    check: "Session end_at must be > start_at"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST/PATCH sessions"

  - priority: 14
    category: business_temporal
    check: "Room overlap check (half-open interval) must pass"
    error_id: ERR_ROOM_OVERLAP
    http_status: 409
    applies_to: "session schedule"

  - priority: 15
    category: business_temporal
    check: "Facilitator buffer check (30-minute) must pass"
    error_id: ERR_FACILITATOR_BUFFER_CONFLICT
    http_status: 409
    applies_to: "session schedule"

  - priority: 16
    category: business_temporal
    check: "ConfidentialityAgreement expires_at must be > signed_at AND > current_utc at signing"
    error_id: ERR_AGREEMENT_EXPIRED
    http_status: 422
    applies_to: "POST /participants/{pid}/agreements, POST enrollments confirm"

  - priority: 17
    category: business_referential
    check: "ConfidentialityAgreement agreement_version must be strictly greater than any existing agreement for the same participant"
    error_id: ERR_AGREEMENT_VERSION_REGRESSION
    http_status: 409
    applies_to: "POST /participants/{pid}/agreements"

  - priority: 18
    category: business_referential
    check: "Cofacilitator must differ from primary_facilitator"
    error_id: ERR_COFACILITATOR_SAME_AS_PRIMARY
    http_status: 422
    applies_to: "POST/PATCH sessions"

  - priority: 19
    category: business_constraint
    check: "PeerGroup.base_capacity must be >= 1; Room.physical_capacity >= 1"
    error_id: ERR_INVALID_CAPACITY
    http_status: 422
    applies_to: "POST groups, POST rooms"

  - priority: 20
    category: business_fiscal
    check: "PeerGroup.active_enrollment_count < PeerGroup.base_capacity for confirmation"
    error_id: ERR_GROUP_AT_CAPACITY
    http_status: 409
    applies_to: "POST enrollments/{eid}/confirm"

  - priority: 21
    category: business_constraint
    check: "Facilitator.level >= PeerGroup.required_facilitator_level for primary assignment"
    error_id: ERR_FACILITATOR_LEVEL_TOO_LOW
    http_status: 409
    applies_to: "session schedule"

  - priority: 22
    category: business_constraint
    check: "Facilitator.supervision_required must be false for primary assignment"
    error_id: ERR_SUPERVISION_REQUIRED
    http_status: 409
    applies_to: "session schedule"

  - priority: 23
    category: business_constraint
    check: "Access modality compatible with PeerGroup.modality (virtual requires virtual_link_token match)"
    error_id: ERR_MODALITY_MISMATCH
    http_status: 422
    applies_to: "POST attendance (check-in)"

  - priority: 24
    category: business_constraint
    check: "Evaluation survey overall_rating/facilitator_rating/modality_rating in 1..5; participant attended session"
    error_id: ERR_SURVEY_INVALID
    http_status: 422
    applies_to: "POST evaluation surveys"

  - priority: 25
    category: business_constraint
    check: "Email uniqueness across Participant (and separately across Facilitator)"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /participants, POST /facilitators"

  - priority: 26
    category: state
    check: "OCC expected_<parent>_version must match current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "enrollment confirm, session schedule"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-08-01T00:00:00Z; before any set_current_utc call, the logical clock reads exactly that default and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["May trigger time-based transitions (Session SCHEDULED→IN_PROGRESS, Agreement SIGNED→EXPIRED, AttendanceRecord CHECKED_IN→NO_SHOW)"]

  # --- Program ---
