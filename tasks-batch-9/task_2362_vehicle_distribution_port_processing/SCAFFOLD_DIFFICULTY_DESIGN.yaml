  - rule_id: transitive_cascade
    instances:
      - name: hold_application_cascade_depth_four_cancels_allocation_and_reverses_accruals
        grounds:
          - endpoints.POST_/vpc/processing-centers/{centerId}/hold-orders.side_effects
          - state_machines.ReleaseOrder.ALLOCATED_to_CANCELLED_BY_HOLD
          - state_machines.Vehicle.processing_status.ALLOCATED_to_SHIPPING_READY
          - calculations.carrier_slot_reconciliation
          - entities.Vehicle.fields.stop_ship_blocked
        distinguishing_aspect: |
          Depth-4 chain triggered by hold creation (a recall/stop-ship trigger, distinct from the
          inspection-failure trigger): LINK 1 hold OPEN -> LINK 2 (because the hold exists) the
          in-scope unit is flagged stop_ship_blocked -> LINK 3 (because the unit is flagged) its
          ALLOCATED ReleaseOrder becomes CANCELLED_BY_HOLD -> LINK 4 (because the order was
          cancelled) carrier slots, dealer count, vehicle processing_status and the provisional
          storage accrual all unwind. Each link is caused strictly by the previous one.
        test_recipe:
          setup:
            - "One LX500 unit prepped to SHIPPING_READY and allocated to dealer D-ATL via carrier TC-ROAD (slot_capacity 3)."
            - "Carrier committed_slots 1 / available_slots 2 and dealer open_allocation_count 1 before the trigger."
            - "Vehicle.storage_charge_provisional_cents is non-zero at allocation time (clock 2026-08-14)."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
