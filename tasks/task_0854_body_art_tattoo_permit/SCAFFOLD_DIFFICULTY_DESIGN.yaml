              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/artists"
              payload: { establishment_id: "${est_id}", legal_name: "Bo Tran" }
