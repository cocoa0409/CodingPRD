      - name: transit_deadline_variant_divergence_stub
        claim_type: variant_divergence
        grounds:
          - calculations.transit_allowance_and_deadline.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / transit_deadline_anchor_rebases_on_diversion_but_not_on_extension"
          rationale: "Same movement, two variants, two different deadlines with the delta asserted — exactly that instance."

      - name: mitigation_variant_selection_stub
        claim_type: variant_selection
        grounds:
          - calculations.mitigation_offer_amount.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / mitigation_offer_diverges_between_first_and_supplemental_round"
          rationale: "Round 1 selects CAP_FIRST and the supplement selects CAP_SUPPLEMENTAL on the same claim there."

      - name: mitigation_reconciliation_on_round_switch_stub
        claim_type: reconciliation
        grounds:
          - calculations.mitigation_offer_amount.variants
          - calculations.bond_obligation_ledger_balance
        excluded_because:
          difficulty_instance: "dual_variant_calc / mitigation_offer_diverges_between_first_and_supplemental_round"
          rationale: "The ledger delta produced when the offer switches from the round-1 to the round-2 figure is asserted there."

      - name: exam_window_interval_merge_stub
        claim_type: interval_merge
        grounds:
          - calculations.exam_window_occupancy
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / exam_bay_windows_are_half_open_so_touching_windows_share_no_slot"
          rationale: "Overlapping vs adjacent (gap 0) vs disjoint windows are all asserted at a capacity-1 port there."

      - name: obligation_component_rounding_order_stub
        claim_type: correct_result
        grounds:
          - calculations.movement_bond_obligation
        excluded_because:
          difficulty_instance: "combinatorial_formula / obligation_rounds_each_component_before_summing"
          rationale: "The round-then-sum vs sum-then-round divergence (41.75 vs 41.76) is that instance's whole point."

  # =======================================================================
  - section: validations
    instances:

      - name: role_denial_outranks_not_found_returns_unauthorized
        claim_type: priority_ordering
        grounds:
          - validations[priority=2].ERR_UNAUTHORIZED
          - validations[priority=6].ERR_MOVEMENT_NOT_FOUND
        distinguishing_aspect: "A BondedCarrier posting a claim for a non-existent movement violates the priority-2 role rule and the priority-6 existence rule at once; the response must be ERR_UNAUTHORIZED (403), never ERR_MOVEMENT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; no movement with the probed id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "00000000-0000-0000-0000-000000009999", claim_type: "LATE_ARRIVAL" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"
            - "GET /in-bond/ld-claims returns total_count == 0"

      - name: onward_leg_against_an_unarrived_predecessor_rejected
