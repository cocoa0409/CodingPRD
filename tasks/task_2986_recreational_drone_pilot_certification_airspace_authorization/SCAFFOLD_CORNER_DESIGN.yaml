              as_user_id: "cx-user-1"
              captures: { w1_final: $.data.status }
          assert:
            - "${w1_status} == \"DRAFT\" and ${pv1} > ${pv0} - lodging a waiver advances the pilot's version"
            - "${e_stale1} == \"ERR_STALE_PILOT_VERSION\" at 412 - the BVLOS body is valid on its own terms, only ${pv0} is out of date"
            - "${open1} == ${open0} + 1 - open_waiver_count is what the caller's stale view was missing"
            - "${w2_status} == \"DRAFT\" - the identical BVLOS body is accepted with ${pv1}"
            - "${sc1_sail} == 3 and ${w1_approved} == \"APPROVED\" - the review chain runs to approval, advancing the pilot's version again"
            - "${e_stale2} == \"ERR_STALE_PILOT_VERSION\" at 412 - the supersede path is refused on the pre-approval version, so a replay cannot retire a live approval unnoticed"
            - "${pv2} > ${pv1} and ${w3_status} == \"DRAFT\" with ${w1_final} == \"SUPERSEDED\" - only the refreshed version performs the supersede side effect"
            - "the two 412s left no Waiver rows behind: GET /drone-ops/waivers?pilot_id=${pid} returns total_count 3 (W1, W2, W3)"

      - name: covering_policy_selector_breaks_ties_by_created_at_and_drops_the_expired_candidate
        claim_type: selector_policy
        grounds:
          - calculations.covering_policy_selection
          - entities.Flight.fields.covering_policy_id
          - entities.InsurancePolicy.fields.coverage_status
          - endpoints.POST_/drone-ops/flights
        distinguishing_aspect: |
          Three candidate policies are arranged so that each part of the selector is decided
          separately: one candidate is eliminated by the window (and is moved ACTIVE -> EXPIRED by
          the selector as it goes), and the two survivors are exactly tied on
          remaining_coverage_cents so only the created_at ASC tie-break can choose between them.
          A fourth policy added later then outranks the tie winner, proving the DESC ranking is
          consulted before the tie-break rather than the other way round. The client never names
          a policy on any of these requests.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "Pilot P: COMMERCIAL, CERTIFIED via PART107 at 80. Airframe A: 249 g, max_altitude_ft 900, REGISTERED. Zone Z: class G, uncontrolled."
            - "P_SHORT: limit 1500000, effective 2026-05-01 .. 2026-06-01, verified ACTIVE."
            - "P_OLD: limit 1200000, effective 2026-05-01 .. 2027-05-01, verified ACTIVE, created before P_NEW."
            - "P_NEW: limit 1200000, effective 2026-05-01 .. 2027-05-01, verified ACTIVE."
            - "All deductibles 0 and all indemnification clauses accepted, so nothing but the selector can decide the outcome."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Jon Reike", email: "jon.reike@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-05-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 80 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Sel 1", serial_number: "SN-SEL-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-SEL", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Shortwindow Re", policy_number: "POL-SEL-SHORT", coverage_limit_cents: 1500000, deductible_cents: 0, effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-06-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { pshort: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${pshort}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Elder Mutual", policy_number: "POL-SEL-OLD", coverage_limit_cents: 1200000, deductible_cents: 0, effective_from: "2026-05-01T00:00:00Z", effective_until: "2027-05-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { pold: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${pold}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Latecomer Mutual", policy_number: "POL-SEL-NEW", coverage_limit_cents: 1200000, deductible_cents: 0, effective_from: "2026-05-01T00:00:00Z", effective_until: "2027-05-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { pnew: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${pnew}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-07-01T09:00:00Z", planned_end: "2026-07-01T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 57.7, launch_longitude: 11.97 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f1: $.data.id, f1_cover: $.data.covering_policy_id }
            - call: "GET /drone-ops/insurance-policies/${pshort}"
              payload: {}
              as: ComplianceOfficer
              captures: { short_status: $.data.coverage_status }
            - call: "GET /drone-ops/insurance-policies/${pold}"
              payload: {}
              as: ComplianceOfficer
              captures: { old_status: $.data.coverage_status, old_remaining: $.data.remaining_coverage_cents }
            - call: "GET /drone-ops/insurance-policies/${pnew}"
              payload: {}
              as: ComplianceOfficer
              captures: { new_status: $.data.coverage_status, new_remaining: $.data.remaining_coverage_cents }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Broadcover Re", policy_number: "POL-SEL-BIG", coverage_limit_cents: 1800000, deductible_cents: 0, effective_from: "2026-06-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { pbig: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${pbig}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
              captures: { big_status: $.data.coverage_status }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-07-04T09:00:00Z", planned_end: "2026-07-04T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 57.7, launch_longitude: 11.97 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f2: $.data.id, f2_cover: $.data.covering_policy_id }
          assert:
            - "${f1_cover} == \"${pold}\" - P_OLD and P_NEW are tied at remaining_coverage_cents 1200000, and created_at ASC picks the earlier row"
            - "${f1_cover} != \"${pshort}\" even though P_SHORT has the largest limit of the three: it does not cover [2026-07-01T09:00:00Z, 2026-07-01T10:00:00Z], so it never enters the ranking"
            - "${short_status} == \"EXPIRED\" - the selector performed the declared ACTIVE -> EXPIRED transition on the candidate whose effective_until has passed the clock, as a side effect of the flight write"
            - "${old_status} == ${new_status} == \"ACTIVE\" with ${old_remaining} == ${new_remaining} == 1200000 - the losing tie candidate is untouched, not expired"
            - "${big_status} == \"ACTIVE\" and ${f2_cover} == \"${pbig}\" - 1800000 outranks the tie pair, so the DESC ranking is applied before the created_at tie-break, not after it"
            - "neither flight request named a policy: covering_policy_id is a system field derived by the selector on write"
            - "an empty candidate set is a refusal rather than a null link: with no ACTIVE covering policy the declared answer is ERR_INSURANCE_NOT_ACTIVE at 402, so no COMMERCIAL Flight row can exist with covering_policy_id null"

      - name: suspension_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Pilot
        excluded_because:
          difficulty_instance: pilot_suspension_cascades_through_aircraft_authorization_to_flight
          rationale: |
            That instance walks all four cascade links in order, checks the created_at ASC
            processing order and the released zone slot, and pins the terminal rows, which is the
            end-to-end verification this layer asks for.

      - name: both_calculation_variants_and_the_delta_between_them_are_verified
        claim_type: dual_variant_calculation
        grounds:
          - calculations.pilot_currency_expiry
          - calculations.accident_settlement
        excluded_because:
          difficulty_instance: currency_expiry_recreational_basis_versus_commercial_basis
          rationale: |
            Both variants of pilot_currency_expiry are computed there on identical inputs with the
            delta asserted, and accident_settlement's two variants are covered the same way by
            accident_provisional_reserve_versus_final_settlement.

  - section: consistency_model
    instances:
      - name: every_derived_value_is_readable_on_the_request_that_follows_the_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.coverage_ledger_conservation
          - entities.InsurancePolicy.fields.open_reserved_cents_total
          - entities.Flight.fields.investigation_status
          - endpoints.POST_/drone-ops/accident-reports
        distinguishing_aspect: |
          One write - filing an accident report - lands derived state on three different
          aggregates: the report's own reserve, the policy's ledger and the flight's parallel
          investigation dimension. Under the declared immediate consistency model all three are
          visible on the very next request, the numbers in the write response equal the numbers
          in the subsequent reads, and no test may retry or sleep to see them. The computed
          currency-projection read is included so that a value derived on the fly and a value
          stored on the row are shown to agree at the same instant.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Pilot P: COMMERCIAL, CERTIFIED via PART107 at 90, holding an ACTIVE indemnified policy of 2000000 cents with deductible 0."
            - "Airframe A: 249 g, max_altitude_ft 900, REGISTERED. Zone Z: class G, uncontrolled."
            - "Flight F completed at 2026-06-05T09:50:00Z with incident_occurred true and no report yet."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Hana Brei", email: "hana.brei@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 90 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Imm 1", serial_number: "SN-IMM-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Steadfast Mutual", policy_number: "POL-IMM-01", coverage_limit_cents: 2000000, deductible_cents: 0, effective_from: "2026-06-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${polid}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-IMM", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-06-05T09:00:00Z", planned_end: "2026-06-05T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 52.37, launch_longitude: 4.9 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id, cover: $.data.covering_policy_id }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:50:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/complete"
              payload: { actual_end: "2026-06-05T09:50:00Z", max_altitude_reached_ft: 370, incident_occurred: true, incident_summary: "Rotor arm cracked on a hard landing." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { f_done: $.data.status, f_minutes: $.data.logged_minutes, f_dimension_before: $.data.investigation_status }
          trigger:
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fid}", occurred_at: "2026-06-05T09:48:00Z", injury_level: "NONE", reported_property_damage_cents: 100000, narrative: "Rotor arm cracked on landing; airframe grounded by the operator pending repair." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { rid: $.data.id, r_reserved: $.data.reserved_cents, r_policy: $.data.policy_id, r_status: $.data.status }
            - call: "GET /drone-ops/insurance-policies/${polid}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_open: $.data.open_reserved_cents_total, pol_settled: $.data.settled_cents_total, pol_remaining: $.data.remaining_coverage_cents, pol_status: $.data.coverage_status }
            - call: "GET /drone-ops/flights/${fid}"
              payload: {}
              as: ComplianceOfficer
              captures: { f_dimension_after: $.data.investigation_status, f_status_after: $.data.status }
            - call: "GET /drone-ops/accident-reports?policy_id=${polid}"
              payload: {}
              as: ComplianceOfficer
              captures: { listed_report: "$.data[0].id" }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: ComplianceOfficer
              captures: { p_risk: $.data.risk_score, p_recency: $.data.last_completed_flight_end, p_expiry: $.data.currency_expires_at }
            - call: "GET /drone-ops/pilots/${pid}/currency-projection"
              payload: {}
              as: ComplianceOfficer
              captures: { proj_expiry: $.data.projected_expires_at, proj_basis: $.data.basis_applied }
          assert:
            - "${cover} == \"${polid}\", ${f_done} == \"COMPLETED\", ${f_minutes} == 50 and ${f_dimension_before} == \"NONE\" - the flight's investigation dimension is untouched until a report exists"
            - "the filing response already carries the derived reserve: ${r_status} == \"FILED\", ${r_policy} == \"${polid}\" and ${r_reserved} == 125000 == round_half_up(100000 * 1.25) + INJURY_RESERVE_CENTS[NONE] 0"
            - "the immediately following read of the other aggregate agrees exactly: ${pol_open} == 125000 == ${r_reserved}, ${pol_settled} == 0, ${pol_remaining} == 1875000 and ${pol_status} == \"ACTIVE\" (1875000 is still above MIN_COMMERCIAL_COVERAGE_CENTS, so no coverage cascade fires)"
            - "${f_dimension_after} == \"OPEN\" while ${f_status_after} == \"COMPLETED\" - the parallel dimension moved in the same write and is visible on the next request, with the primary status unchanged"
            - "${listed_report} == \"${rid}\" - the propagated policy_id is queryable immediately, without any indexing delay"
            - "${p_risk} == 55 (W_INCIDENT 25 + W_OPEN_ACCIDENT 30 under the §1.3 weights) and ${p_recency} == \"2026-06-05T09:50:00Z\" - the pilot's derived counters are current on the first read too"
            - "${proj_basis} == \"COMMERCIAL_BASIS\" and ${proj_expiry} == ${p_expiry} == \"2026-09-03T09:50:00Z\" == last_completed_flight_end + COMMERCIAL_RECENCY_DAYS 90 - the computed read and the stored field agree at the same instant"
            - "no assertion in this recipe needs a retry, a sleep or a second attempt: the consistency model is immediate, so a single request per observation is enough"
