  # ---------------------------------------------------------------------------
  # Section 8: Cross-cutting complexity layers (OCC x3, version increment)
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_stockpile_adjustment_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[stockpile-adjustment-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The second adjustment carrying the pre-mutation version is rejected 412; the version-advanced adjustment succeeds."
        test_recipe:
          setup: ["site; spec; stockpile created (version captured)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
          trigger:
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 50.0, reason: "survey credit", expected_stockpile_version: "${pile_v}" }, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 10.0, reason: "stale recount", expected_stockpile_version: "${pile_v}" }, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "first adjustment succeeds: on_hand_tons == 50.0, version advanced to 2"
            - "second adjustment with the stale captured version: error_id == ERR_STALE_VERSION (http 412); on_hand_tons stays 50.0"

      - name: occ_order_reprice_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-reprice-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reprice supersedes the observed quote terms; a second reprice carrying the pre-reprice version is rejected 412 while the order is still QUOTED."
        test_recipe:
          setup: ["site; spec; zone; QUOTED order (version captured)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 500 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /sales-orders/${ord}/reprice", payload: { expected_sales_order_version: "${ord_v}" }, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /sales-orders/${ord}/reprice", payload: { expected_sales_order_version: "${ord_v}" }, as: SalesAgent, as_user_id: "sa-1", captures: { err: $.data.error_id } }
          assert:
            - "first reprice succeeds: version advances to 2, quoted_unit_delivered_per_ton == 19.31 (price book unchanged)"
            - "second reprice with the stale captured version: error_id == ERR_STALE_VERSION (http 412); status stays QUOTED"

      - name: occ_bond_release_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bond-release-occ]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Release from POSTED then a second release carrying the pre-release version: the stale release is rejected 412 even though the bond state (PARTIALLY_RELEASED) would still permit a release."
        test_recipe:
          setup: ["site (no benches, so coverage floor is 0); bond 100000 POSTED (version captured)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk, captures: { bond: $.data.id, bond_v: $.data.version } }
          trigger:
            - { call: "POST /reclamation-bonds/${bond}/release", payload: { release_amount_usd: 10000, expected_reclamation_bond_version: "${bond_v}" }, as: FinanceClerk, as_user_id: "fc-1" }
            - { call: "POST /reclamation-bonds/${bond}/release", payload: { release_amount_usd: 5000, expected_reclamation_bond_version: "${bond_v}" }, as: FinanceClerk, as_user_id: "fc-1", captures: { err: $.data.error_id } }
          assert:
            - "first release succeeds: released_usd == 10000, status PARTIALLY_RELEASED, version 2"
            - "second release with the stale captured version: error_id == ERR_STALE_VERSION (http 412); released_usd stays 10000"

      - name: version_increments_on_each_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.Bench]
        distinguishing_aspect: "version starts at 1 and increments by exactly 1 per mutation: create (1) -> hold (2) -> resume (3)."
        test_recipe:
          setup: ["site OPERATING (bond posted); bench released"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id, v1: $.data.version } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager, captures: { v2: $.data.version } }
            - { call: "POST /benches/${bench}/hold", payload: { reason: "GEOTECH" }, as: SiteManager, as_user_id: "sm-1", captures: { v3: $.data.version } }
          trigger:
            - { call: "POST /benches/${bench}/resume", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { v4: $.data.version } }
          assert:
            - "versions observed: create 1, release 2, hold 3, resume 4 — exactly +1 per mutation"

  # ---------------------------------------------------------------------------
  # Section 9: Consistency model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_confirm_response
        claim_type: immediate_visibility
        grounds: [state_machines.SalesOrder.QUOTED_to_CONFIRMED, entities.SalesOrder.fields.prices_pinned]
        distinguishing_aspect: "The /confirm response body itself carries the post-transition state (status CONFIRMED, prices_pinned true, stockpile_id resolved) — no re-read needed, and the pinned prices equal the quote-time values."
        test_recipe:
          setup: ["site; spec; zone; pile on_hand 200; order qty 30 QUOTED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 30 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1", captures: { st: $.data.status, pin: $.data.prices_pinned, pile_ref: $.data.stockpile_id } }
          assert:
            - "confirm response: status == CONFIRMED, prices_pinned == true, stockpile_id == ${pile} (immediate consistency in the same response)"
            - "quoted_unit_delivered_per_ton unchanged by confirmation (pin == quote value): qty 30 <= 100 -> factor 1.00 -> material 12.50; subtotal 18.50 -> surcharge round_half_up(18.50 x 0.08, 2) == 1.48; unit == 19.98; quoted_total_usd == 599.40"




