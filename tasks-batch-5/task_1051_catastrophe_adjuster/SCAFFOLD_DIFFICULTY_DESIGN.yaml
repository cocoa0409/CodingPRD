        grounds:
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - entities.AdjusterLicense.fields.status
          - errors[ERR_NO_ACTIVE_LICENSE]
        distinguishing_aspect: |
          Entity pair Assignment<-AdjusterLicense: an OFFERED assignment cannot be accepted while
          the adjuster's only FL license is SUSPENDED — accept is gated on a DIFFERENT entity's state.
        test_recipe:
          setup:
            - "Adjuster with an FL license activated then SUSPENDED"
            - "FL/HAIL claim; assignment OFFERED to that adjuster"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A13", email: "a13@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-13", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /licenses/${lic_id}/suspend", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-13", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_NO_ACTIVE_LICENSE (http 422)"
            - "Assignment(${asg_id}).work_status == OFFERED (unchanged)"

      - name: report_submit_requires_inspection_completed
        grounds:
          - state_machines.Report.DRAFT_to_SUBMITTED
          - entities.Inspection.fields.status
          - errors[ERR_INSPECTION_NOT_COMPLETED]
        distinguishing_aspect: |
          Entity pair Report<-Inspection (a different pair): a DRAFT report cannot be submitted while
          its Inspection is only IN_PROGRESS (not COMPLETED), even with photos and an approved estimate.
        test_recipe:
          setup:
            - "Accepted FL/HAIL/ACV assignment; inspection STARTED but not completed (IN_PROGRESS)"
            - "An APPROVED estimate already exists (approved earlier before... ) -> instead: estimate cannot approve without completed inspection, so submit fails first on inspection state"
            - "Report DRAFT with photo_count=3"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A14", email: "a14@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-14", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-14", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s", photo_count: 3 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
          trigger:
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_INSPECTION_NOT_COMPLETED (http 409)"
            - "Report(${rpt_id}).status == DRAFT (unchanged)"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: deployment_window_overlap_on_adjuster
        grounds:
          - validations[priority=9]
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
          - errors[ERR_DEPLOYMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = Adjuster, HALF-OPEN interval overlap: confirming a second deployment whose
          [12:00,14:00) window is strictly inside an existing CONFIRMED [09:00,17:00) window is
          rejected; adjacency (end==start) would be allowed. Capacity is not the binding constraint here.
        test_recipe:
          setup:
            - "CatEvent capacity=5; one adjuster; D1 [07-11T09:00,07-11T17:00) CONFIRMED"
            - "D2 for same adjuster [07-11T12:00,07-11T14:00) REQUESTED"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A15", email: "a15@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /cat-events", payload: { name: "Echo", peril_type: "HURRICANE", affected_states: ["FL","GA"], roster_capacity: 5 }, as: LicensingAdmin, captures: { ce_id: $.data.id } }
            - { call: "POST /deployments", payload: { adjuster_id: "${adj_id}", cat_event_id: "${ce_id}", start_at: "2026-07-11T09:00:00Z", end_at: "2026-07-11T17:00:00Z" }, as: LicensingAdmin, captures: { d1: $.data.id } }
            - { call: "POST /deployments/${d1}/confirm", payload: {}, as: LicensingAdmin }
            - { call: "POST /deployments", payload: { adjuster_id: "${adj_id}", cat_event_id: "${ce_id}", start_at: "2026-07-11T12:00:00Z", end_at: "2026-07-11T14:00:00Z" }, as: LicensingAdmin, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /deployments/${d2}/confirm", payload: {}, as: LicensingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_DEPLOYMENT_WINDOW_OVERLAP (http 409)"
            - "Deployment(${d2}).status == REQUESTED (unchanged)"

      - name: inspection_spacing_buffer_on_claim
        grounds:
          - validations[priority=10]
          - errors[ERR_INSPECTION_SPACING_CONFLICT]
        distinguishing_aspect: |
          Resource = Claim, BUFFER interval semantics (different arithmetic): a second inspection on
          the same claim whose window opens only 30 minutes after the first inspection's window closes
          is rejected because the gap is < INSPECTION_MIN_GAP_MINUTES (240); overlap alone is not the test.
        test_recipe:
          setup:
            - "Accepted FL/HAIL/ACV assignment; Inspection I1 [07-02T09:00,07-02T10:00) SCHEDULED on the claim"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A16", email: "a16@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-16", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-16", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T10:30:00Z", scheduled_end: "2026-07-02T11:30:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_INSPECTION_SPACING_CONFLICT (http 409)"
            - "GET /inspections?claim_id=${claim_id} returns exactly 1 inspection"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: roster_seat_conservation
        grounds:
          - calculations.cat_event_roster_filled
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
          - state_machines.Deployment.CONFIRMED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = roster SEAT COUNT: confirm (+1) then withdraw (-1) leaves
          CatEvent.roster_filled_count back at 0, exactly equal to the count of {CONFIRMED,ACTIVE}
          deployments — no drift.
        test_recipe:
          setup:
            - "CatEvent capacity=2; one adjuster; one deployment"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A17", email: "a17@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /cat-events", payload: { name: "Foxtrot", peril_type: "FLOOD", affected_states: ["FL"], roster_capacity: 2 }, as: LicensingAdmin, captures: { ce_id: $.data.id } }
            - { call: "POST /deployments", payload: { adjuster_id: "${adj_id}", cat_event_id: "${ce_id}", start_at: "2026-07-12T09:00:00Z", end_at: "2026-07-12T17:00:00Z" }, as: LicensingAdmin, captures: { d1: $.data.id } }
            - { call: "POST /deployments/${d1}/confirm", payload: {}, as: LicensingAdmin }
          trigger:
            - { call: "POST /deployments/${d1}/withdraw", payload: {}, as: LicensingAdmin }
            - { call: "GET /cat-events/${ce_id}", payload: {}, as: LicensingAdmin, captures: { filled: $.data.roster_filled_count } }
          assert:
            - "CatEvent(${ce_id}).roster_filled_count == 0  (confirm +1 then withdraw -1; equals count of CONFIRMED/ACTIVE deployments)"
            - "Deployment(${d1}).status == WITHDRAWN"

      - name: reserve_ledger_conservation
        grounds:
          - calculations.claim_reserve_consumed
          - state_machines.FeeBill.DRAFT_to_SUBMITTED
          - state_machines.FeeBill.SUBMITTED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = MONETARY RESERVE (different type): submit debits
          Claim.reserve_consumed_cents by total_cents (155000) and void credits it back, leaving
          reserve_consumed_cents == 0, exactly the sum over {SUBMITTED,APPROVED,PAID} bills.
        test_recipe:
          setup:
            - "Work-complete FL/HAIL/RCV assignment; Claim.rcv_cents=5000000; FeeBill FEE_SCHEDULE SUBMITTED (total 155000)"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A18", email: "a18@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-18", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /fee-schedules", payload: { name: "STD", tier1_max_rcv_cents: 5000000, tier2_max_rcv_cents: 25000000, tier1_flat_fee_cents: 30000, tier2_flat_fee_cents: 60000, tier3_flat_fee_cents: 100000, rcv_pct_bps: 250, pct_cap_cents: 20000000, hourly_rate_cents: 8500, cat_peril_multiplier_bps: 12500 }, as: BillingManager, captures: { fs_id: $.data.id } }
            - { call: "POST /claims", payload: { claim_number: "C-18", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "RCV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "Roof", rcv_cents: 5000000, depreciation_pct: 0 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s", photo_count: 2 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { asg_ver: $.data.version } }
            - { call: "POST /fee-bills", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", fee_schedule_id: "${fs_id}", billing_method: "FEE_SCHEDULE", expected_assignment_version: "${asg_ver}" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { bill_id: $.data.id } }
            - { call: "POST /fee-bills/${bill_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /fee-bills/${bill_id}/void", payload: {}, as: BillingManager }
            - { call: "GET /claims/${claim_id}", payload: {}, as: DeskExaminer, captures: { reserve: $.data.reserve_consumed_cents } }
          assert:
            - "Claim(${claim_id}).reserve_consumed_cents == 0  (submit +155000 then void -155000; equals sum over SUBMITTED/APPROVED/PAID bills)"
            - "Assignment(${asg_id}).billing_status == NOT_BILLED"
            - "FeeBill(${bill_id}).status == VOID"
