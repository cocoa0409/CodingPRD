  - section: endpoints
    instances:
      - name: block_traceability_summary_on_an_empty_block_returns_zeros_not_404
        claim_type: computed_read
        grounds:
          - endpoints["GET /berry-ops/blocks/{block_id}/traceability-summary"]
          - calculations.block_traceability_summary
          - response_envelope
        distinguishing_aspect: |
          The traceability roll-up is a computed read over a possibly empty child
          set, so a block that has never been picked answers 200 with lot_count 0,
          pick_date_count 0, total_packed_lbs 0.00, shipped_lbs 0.00 and NULL
          earliest/latest pick dates - not 404 and not an empty body. It also
          echoes the untouched block state water_status NO_SAMPLES and posture
          RESTRICTED.
        test_recipe:
          setup:
            - "One STRAWBERRY block with no water sample, no window and no lot."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V20", variety: "STRAWBERRY", acres: 4.00, planting_year: 2022, irrigation_source_code: "WELL-V20" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
          trigger:
            - call: "GET /berry-ops/blocks/${blk}/traceability-summary"
              payload: {}
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
          assert:
            - "HTTP status is 200 and response_type == object"
            - "data.block_id == ${blk} and data.block_name == BLK-V20 and data.variety == STRAWBERRY"
            - "data.lot_count == 0 and data.pick_date_count == 0"
            - "data.total_packed_lbs == 0.00 and data.shipped_lbs == 0.00"
            - "data.held_lot_count == 0 and data.rejected_lot_count == 0"
            - "data.earliest_pick_date == null and data.latest_pick_date == null"
            - "data.water_status == NO_SAMPLES and data.food_safety_posture == RESTRICTED"

      - name: lot_allocation_link_requires_both_lot_and_commitment_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /berry-ops/lot-allocations"]
          - validations[priority=19]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
        distinguishing_aspect: |
          The allocation endpoint is the join between a lot and a buyer program,
          and each side reports its own 404: an unknown fruit_lot_id is
          ERR_LOT_NOT_FOUND and an unknown buyer_commitment_id is
          ERR_COMMITMENT_NOT_FOUND. Neither refusal consumes the commitment's OCC
          token, so the same expected_buyer_commitment_version still succeeds on
          the third, well-formed call, and the new line is then reachable from
          BOTH parents by filtered list.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block; one RECRUITING crew; one PLANNED window over 2026-08-03; one PACKED grade-A lot of 50 clamshells at 1.00 lb."
            - "One OPEN STRAWBERRY commitment for 200.00 lb, version captured at creation."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V21", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V21" }
