            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1017", quantity_received: 3, expires_at: "2028-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA400003", ear: "BOTH", price_cents: 250000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp_id: $.data.id, trial_end: $.data.trial_end_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /device-dispenses/${disp_id}/finalize"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /device-dispenses/${disp_id}/finalize"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /device-dispenses/${disp_id}/finalize"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_1"
          assert:
            - "${trial_end} == \"2026-08-31T00:00:00Z\" (dispensed_at 2026-08-01 + device_trial_days 30)"
            - "The finalize at 2026-08-15 returns HTTP 409 with error.id == \"ERR_TRIAL_NOT_COMPLETE\" and DeviceDispense.${disp_id}.fit_status is still \"FITTED\""
            - "The finalize at exactly 2026-08-31T00:00:00Z returns HTTP 200 with fit_status == \"FINALIZED\" and billing_status == \"RETAINED\""
            - "The third finalize returns HTTP 409 with error.id == \"ERR_DISPENSE_STATE_INVALID\" (priority 7 outranks the temporal rule, which is now satisfied)"
