      - name: election_withdraw_restores_station_filed_election_count
        grounds:
          - state_machines.CarriageElection.NEGOTIATING_to_DRAFT
          - endpoints[POST /retrans/elections/{id}/withdraw]
          - entities.Station.fields.filed_election_count
          - entities.Negotiation.fields.status
          - entities.Offer.fields.status
        distinguishing_aspect: |
          A different conserved quantity from the money instance: a COUNT, Station.filed_election_count,
          plus the structural side effects of filing. Withdrawal must undo the whole filing fan-out in
          one step — the election drops back to DRAFT with filed_at_utc cleared, its negotiation is
          CANCELLED and its SUBMITTED offer EXPIRED — while the counter returns to exactly its
          pre-filing value rather than being merely decremented from a possibly drifted total.
        test_recipe:
          setup:
            - "One CBS station with an ACTIVE affiliation and one CABLE distributor"
            - "Station.filed_election_count observed at 0 before filing"
            - "A DRAFT election that is filed, opening a negotiation, with one SUBMITTED station offer"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
