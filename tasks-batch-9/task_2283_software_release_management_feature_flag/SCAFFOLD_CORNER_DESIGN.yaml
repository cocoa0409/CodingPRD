          assert:
            - "ChangeRequest.${cr_m}.state == DEFERRED"
            - "ReleaseNoteDocument.${note_id}.entry_count == 1"
            - "ReleaseNoteDocument.${note_id}.included_change_ids == [${cr_l}]"
            - "ReleaseNoteDocument.${note_id}.excluded_change_count == 0"
            - "${cr_m} does not appear in included_change_ids even though it is customer_facing with a summary"

      - name: rollout_ladder_first_rung_is_capped_at_five_percent
        claim_type: constants_applied
        grounds:
          - calculations.rollout_step_ladder
          - errors[ERR_ROLLOUT_STEP_TOO_LARGE]
          - validations[priority=23]
        distinguishing_aspect: "max_next = min(100, max(5, prev*3)) with prev 0 yields the 5 floor rather than 0, so a first step of 10 is rejected with 422 ERR_ROLLOUT_STEP_TOO_LARGE while a first step of 5 is accepted with step_index 1 and previous_exposure_pct 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FeatureFlag checkout-v2 owned by u-eng-1 with current_exposure_pct 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: $.data.id, flag_v0: $.data.version }
          trigger:
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 10, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step_id: $.data.id, idx: $.data.step_index }
          assert:
            - "The 10 percent attempt returns HTTP 422 with error_id ERR_ROLLOUT_STEP_TOO_LARGE"
            - "No FlagRolloutStep was created by the rejected call (GET /flag-rollout-steps filtered by the flag returns total_count == 1 at the end)"
            - "The 5 percent attempt returns HTTP 201"
            - "FlagRolloutStep.${step_id}.step_index == 1"
            - "FlagRolloutStep.${step_id}.previous_exposure_pct == 0"
            - "FlagRolloutStep.${step_id}.state == PLANNED"
            - "FeatureFlag.${flag_id}.current_exposure_pct == 0 and applied_step_count == 0"

      - name: soak_minutes_band_selected_by_target_pct_rejects_short_soak
        claim_type: threshold
        grounds:
          - calculations.rollout_step_ladder
          - errors[ERR_SOAK_TOO_SHORT]
          - validations[priority=24]
        distinguishing_aspect: "required_soak_minutes is chosen by band, not fixed: at target 5 (<= 10) a 30-minute soak is enough, but once exposure is 5 the next rung 15 falls in the 10..50 band and 30 minutes is rejected with 422 ERR_SOAK_TOO_SHORT while 60 is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FeatureFlag checkout-v2 owned by u-eng-1."
            - "step1 (target 5, soak 30) has been soaked and applied at 2026-08-01T00:30:00Z, so current_exposure_pct is 5 and applied_step_count is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: $.data.id, flag_v0: $.data.version }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step1_id: $.data.id }
            - call: "POST /flag-rollout-steps/${step1_id}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /flag-rollout-steps/${step1_id}/apply"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "GET /feature-flags/${flag_id}"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_v1: $.data.version, exposure: $.data.current_exposure_pct }
          trigger:
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 15, soak_minutes: 30, expected_feature_flag_version: "${flag_v1}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 15, soak_minutes: 60, expected_feature_flag_version: "${flag_v1}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step2_id: $.data.id }
          assert:
            - "FeatureFlag.${flag_id}.current_exposure_pct == 5 and applied_step_count == 1 before the triggers"
            - "The 30-minute attempt returns HTTP 422 with error_id ERR_SOAK_TOO_SHORT"
            - "The 60-minute attempt returns HTTP 201 with FlagRolloutStep.${step2_id}.step_index == 2"
            - "FlagRolloutStep.${step2_id}.previous_exposure_pct == 5 and target_pct == 15 and soak_minutes == 60"
            - "A target of 16 would have been rejected as too large because max_next == min(100, max(5, 15)) == 15"

      - name: flag_stale_debt_thresholds_split_compliant_warning_overdue_enforced
        claim_type: threshold
        grounds:
          - calculations.flag_stale_debt
          - endpoints[POST /flag-cleanup-sweeps]
          - entities.FeatureFlag.fields.cleanup_state
        distinguishing_aspect: "One sweep at 2026-08-01T00:00:00Z sorts four orphaned flags by the debt formula days_past_expiry*3 + 15 orphan penalty into exactly 60/ENFORCED, 30/OVERDUE, 27/WARNING and 0/COMPLIANT, the last because permanent flags short-circuit to zero debt regardless of expiry."
        test_recipe:
