            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_a_id}", visitor_id: "${aq_id}", team_role: "SPECIALIST", travel_block_start_date: "2026-08-01", travel_block_end_date: "2026-08-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_a_id}/schedule"
              as: AccreditationOfficer
              as_user_id: "officer-1"
