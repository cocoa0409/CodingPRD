            - "fin == 2100000 (round(7 x 120000 x 2500 / 1000))"
            - "pct == 0.7 (7 / 10, not 7 / 14)"
            - "due == 0 (D1's auto-credit is REQUESTED; only APPROVED/REDEEMED count)"

