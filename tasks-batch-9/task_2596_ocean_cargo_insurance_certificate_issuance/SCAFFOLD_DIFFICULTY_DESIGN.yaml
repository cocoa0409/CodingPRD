  - rule_id: transitive_cascade
    instances:
      - name: listed_area_war_termination_four_link_cascade
        depth: 5
        grounds:
          - endpoints.POST_/ports/{id}/war-risk-tier
          - state_machines.OpenPolicy.war_cover_status.ATTACHED_to_TERMINATED
          - state_machines.Certificate.war_cover_status.ATTACHED_to_TERMINATED
          - calculations.certificate_return_premium
          - calculations.declaration_premium_reconciliation
        distinguishing_aspect: |
          Trigger: POST /ports/{id}/war-risk-tier. Each link is caused by the
          PREVIOUS link, not by the original request:
            link 1  the Port's war_risk_tier becomes LISTED_AREA;
            link 2  BECAUSE a listed port now sits on an exposed policy, that
                    OpenPolicy's war_cover_status goes ATTACHED -> TERMINATED;
            link 3  BECAUSE the policy axis terminated in this request, each
                    exposed ISSUED certificate's war_cover_status goes
                    ATTACHED -> TERMINATED and returns war + strikes = 987.53;
            link 4  BECAUSE a certificate booked a return, the policy's
                    aggregate_return_premium rises to 987.53;
            link 5  BECAUSE that certificate's premium changed and it is
                    already stamped onto a SUBMITTED declaration, that
                    declaration's computed_premium_total is recomputed from
                    8676.91 to 7689.38, variance 987.53, variance_pct 12.84.
          A fan-out implementation that rewrites the certificate directly from
          the port endpoint gets link 3 right but cannot explain why an
          unexposed certificate on the same policy is untouched, and it misses
          link 5 entirely.
        test_recipe:
          setup:
            - "the canonical ACTIVE OpenPolicy, CommodityClass CC-ELEC, APPROVED vessel VSL-A, GREEN ports SGSIN (loading) and NLRTM (discharge)"
            - "a third GREEN port USNYC used by a control certificate that never touches the listed port"
            - "CERT-A ISSUED via SGSIN -> NLRTM with war cover (war 693.00, strikes 294.53, total 6444.91)"
            - "CERT-CTL ISSUED via SGSIN -> USNYC with war cover, so it shares the policy but not the listed port"
            - "declaration DEC-08 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) SUBMITTED with declared_premium_total 8676.91, exactly the pre-cascade computed total (variance 0.00)"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_load_id: $.data.id }
            - call: "POST /ports"
              payload: { unlocode: "NLRTM", name: "Rotterdam", country_code: "NL", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_disch_id: $.data.id }
            - call: "POST /ports"
              payload: { unlocode: "USNYC", name: "New York", country_code: "US", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
