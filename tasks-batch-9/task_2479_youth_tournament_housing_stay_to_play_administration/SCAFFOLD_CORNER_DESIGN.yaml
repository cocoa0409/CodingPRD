      - name: committed_rooms_counts_only_confirmed_bookings
        claim_type: input_set_filtering
        grounds:
          - calculations.registration_compliance_status
          - calculations.block_rooms_committed
        distinguishing_aspect: |
          The compliance sum is filtered to booking_status IN {CONFIRMED, CHECKED_OUT}. A booking that
          has already had its rooming list accepted is still only ROOMING_LIST_SUBMITTED, so
          committed_rooms must read 0 immediately before confirm and 4 immediately after — the single
          confirm call is what moves it. Counting the pre-confirm booking would have shown 4 in the
          first read.
        test_recipe:
          setup:
            - "One booking of 4 rooms in ROOMING_LIST_SUBMITTED on a registration whose effective_required_rooms is 4."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
          trigger:
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: HousingManager
            - *sc_confirm
          assert:
            - "first response.data.committed_rooms == 0"
            - "first response.data.status == PENDING_HOUSING"
            - "second response.status == 200"
            - "TeamRegistration.${reg_id}.committed_rooms == 4"
            - "TeamRegistration.${reg_id}.status == HOUSING_COMPLIANT"
            - "RoomBlock.${block_id}.rooms_committed == 4"
            - "RoomBlock.${block_id}.rooms_available == 16"

      - name: tiered_rebate_rate_constant_at_lower_edge_of_tier_two
        claim_type: constants_applied
        grounds:
          - calculations.booking_rebate_line
          - calculations.booking_rebate_line.constants
        distinguishing_aspect: |
          contract_total_nights lands on exactly REBATE_TIER_1_MAX_NIGHTS (30). Tier boundaries are
          inclusive at the LOWER edge, so 30 selects REBATE_TIER_2_RATE_CENTS 750 and the line is
          30 * 750 = 22500 — not 15000 from the 500 constant. The second booking on the same contract
          is CONFIRMED but not yet CHECKED_OUT, so its 3 nights are excluded from contract_total_nights
          and cannot push the selection into tier 2 by accident.
        test_recipe:
          setup:
            - "A ten-night tournament (2026-09-10 to 2026-09-20) with one TIERED_PER_ROOM_NIGHT contract and a 5-room block over the whole window."
