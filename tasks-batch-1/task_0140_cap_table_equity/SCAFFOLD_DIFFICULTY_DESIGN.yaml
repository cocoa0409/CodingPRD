            - call: "POST /exercises/${ex}/reverse"
              payload: {}
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ELECTION_BLOCKS_REVERSE (reverse blocked because an ACCEPTED 83b references the exercise)"
            - "Exercise.${ex}.status == SETTLED (unchanged)"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: valuation_window_closed_overlap_adjacency_conflicts
        grounds:
          - validations[priority=15]
          - entities.Valuation.fields.expires_at
          - errors[ERR_VALUATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Valuation safe-harbor windows use CLOSED interval semantics: a new
          window [valuation_date, expires_at] whose start EQUALS an existing
          non-superseded window's end still conflicts (touching endpoints
          conflict). Resource entity = Valuation. Contrast with BlackoutWindow's
          half-open adjacency-allowed semantics below.
        test_recipe:
          setup:
            - "OPEN cap table with one DRAFT valuation window [2024-01-01, 2024-12-31]"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "ValOverlapCo", authorized_shares: 1000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /valuations"
              payload: { cap_table_id: "${ct}", fmv_per_share_cents: 200, valuation_date: "2024-01-01T00:00:00Z", expires_at: "2024-12-31T00:00:00Z" }
              as: Administrator
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /valuations"
              payload: { cap_table_id: "${ct}", fmv_per_share_cents: 300, valuation_date: "2024-12-31T00:00:00Z", expires_at: "2025-12-31T00:00:00Z" }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALUATION_WINDOW_OVERLAP (new start 2024-12-31 touches existing end 2024-12-31; CLOSED semantics reject adjacency)"

      - name: blackout_window_halfopen_adjacency_allowed
        grounds:
          - validations[priority=16]
          - entities.BlackoutWindow.fields.ends_at
          - errors[ERR_BLACKOUT_OVERLAP]
        distinguishing_aspect: |
          BlackoutWindow intervals use HALF-OPEN [starts_at, ends_at) semantics:
          a new window starting EXACTLY when an existing SCHEDULED window ends
          is ACCEPTED (adjacency allowed), but a strictly-overlapping window is
          rejected. Resource entity = BlackoutWindow. Different interval
          geometry (adjacency allowed) than the Valuation CLOSED windows above.
        test_recipe:
          setup:
            - "OPEN cap table with one SCHEDULED blackout window [2025-01-01, 2025-02-01)"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "BlkCo", authorized_shares: 1000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /blackout-windows"
              payload: { cap_table_id: "${ct}", reason: "PRE_EARNINGS", starts_at: "2025-01-01T00:00:00Z", ends_at: "2025-02-01T00:00:00Z" }
              as: Administrator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /blackout-windows"
              payload: { cap_table_id: "${ct}", reason: "ACQUISITION", starts_at: "2025-02-01T00:00:00Z", ends_at: "2025-03-01T00:00:00Z" }
              as: Administrator
              captures: { w2: $.data.id }
            - call: "POST /blackout-windows"
              payload: { cap_table_id: "${ct}", reason: "ACQUISITION", starts_at: "2025-01-15T00:00:00Z", ends_at: "2025-02-15T00:00:00Z" }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "second window [2025-02-01, 2025-03-01) created 201 (adjacency at 2025-02-01 allowed under half-open)"
            - "third window [2025-01-15, 2025-02-15) rejected ERR_BLACKOUT_OVERLAP (strictly overlaps window 1)"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: exercise_reverse_conserves_issued_shares
        grounds:
          - state_machines.Exercise.SETTLED_to_REVERSED
          - entities.CapTable.fields.issued_shares
          - entities.SecurityClass.fields.shares_outstanding
        distinguishing_aspect: |
          Conserved quantity = CapTable.issued_shares (= sum of
          SecurityClass.shares_outstanding). Forward action settle adds N shares;
          compensating reverse removes exactly N. Invariant pinned as
          issued_shares_after_reverse == issued_shares_before_settle (== 0).
          Quantity type = issued share count, distinct from the pool-reserve
          quantity below.
        test_recipe:
          setup:
            - "OPEN cap table; COMMON shares_outstanding=0 before settle; ACTIVE fully-vested grant 1000 strike=100; PENDING exercise of 1000; settle then reverse"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "ConsCo", authorized_shares: 10000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Common", class_type: "COMMON", original_issue_price_cents: 0, liquidation_pref_multiple: 0 }
              as: Administrator
              captures: { common: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Emp", holder_type: "EMPLOYEE", email: "e@cons.com" }
              as: Administrator
              captures: { sh: $.data.id }
            - call: "POST /valuations"
              payload: { cap_table_id: "${ct}", fmv_per_share_cents: 500, valuation_date: "2020-01-01T00:00:00Z", expires_at: "2020-12-31T00:00:00Z" }
              as: Administrator
              captures: { val: $.data.id }
            - call: "POST /valuations/${val}/approve"
              payload: {}
              as: BoardApprover
            - call: "POST /option-pools"
              payload: { cap_table_id: "${ct}", authorized_shares: 100000 }
              as: Administrator
              captures: { pool: $.data.id }
            - call: "POST /option-grants"
              payload: { cap_table_id: "${ct}", option_pool_id: "${pool}", shareholder_id: "${sh}", security_class_id: "${common}", valuation_id: "${val}", share_count: 1000, strike_price_cents: 100, grant_date: "2020-01-01T00:00:00Z", vesting_months: 48, cliff_months: 12 }
              as: Administrator
              captures: { g: $.data.id }
            - call: "POST /option-grants/${g}/approve"
              payload: {}
              as: BoardApprover
              as_user_id: "approver-1"
            - call: "POST /exercises"
              payload: { cap_table_id: "${ct}", option_grant_id: "${g}", share_count: 1000 }
              as: Administrator
              captures: { ex: $.data.id }
            - call: "POST /exercises/${ex}/settle"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /exercises/${ex}/reverse"
              payload: {}
              as: Administrator
            - call: "GET /cap-tables/${ct}"
              payload: {}
              as: Administrator
              captures: { issued_after: $.data.issued_shares }
            - call: "GET /security-classes/${common}"
              payload: {}
              as: Administrator
              captures: { class_after: $.data.shares_outstanding }
          assert:
            - "CapTable.${ct}.issued_shares == 0 after reverse (equals pre-settle value; net drift zero)"
            - "SecurityClass.${common}.shares_outstanding == 0 after reverse"
            - "Exercise.${ex}.status == REVERSED; OptionGrant.${g}.status == ACTIVE (reverted from EXERCISED)"

      - name: grant_cancel_conserves_pool_authorized_shares
        grounds:
          - state_machines.OptionGrant.ACTIVE_to_CANCELLED
          - entities.OptionPool.fields.allocated_shares
          - entities.OptionPool.fields.available_shares
        distinguishing_aspect: |
          Conserved quantity = OptionPool.authorized_shares == allocated_shares +
          available_shares. Forward action approve moves N from available to
          allocated; compensating cancel moves N back. Invariant pinned as
          available_shares_after_cancel == authorized_shares (allocated back to
          0). Quantity type = pool reserve, distinct from issued-share count above.
        test_recipe:
          setup:
            - "OPEN cap table; pool authorized 5000; ACTIVE grant 2000 (allocated 2000, available 3000); cancel the grant"
          setup_api_calls:
            - call: "POST /cap-tables"
              payload: { company_name: "PoolConsCo", authorized_shares: 10000000 }
              as: Administrator
              captures: { ct: $.data.id }
            - call: "POST /security-classes"
              payload: { cap_table_id: "${ct}", name: "Common", class_type: "COMMON", original_issue_price_cents: 0, liquidation_pref_multiple: 0 }
              as: Administrator
              captures: { common: $.data.id }
            - call: "POST /shareholders"
              payload: { cap_table_id: "${ct}", legal_name: "Emp", holder_type: "EMPLOYEE", email: "e@pc.com" }
              as: Administrator
              captures: { sh: $.data.id }
            - call: "POST /valuations"
              payload: { cap_table_id: "${ct}", fmv_per_share_cents: 100, valuation_date: "2025-01-01T00:00:00Z", expires_at: "2025-12-31T00:00:00Z" }
              as: Administrator
              captures: { val: $.data.id }
            - call: "POST /valuations/${val}/approve"
              payload: {}
              as: BoardApprover
            - call: "POST /option-pools"
              payload: { cap_table_id: "${ct}", authorized_shares: 5000 }
              as: Administrator
              captures: { pool: $.data.id }
            - call: "POST /option-grants"
              payload: { cap_table_id: "${ct}", option_pool_id: "${pool}", shareholder_id: "${sh}", security_class_id: "${common}", valuation_id: "${val}", share_count: 2000, strike_price_cents: 100, grant_date: "2025-01-01T00:00:00Z", vesting_months: 48, cliff_months: 12 }
              as: Administrator
              captures: { g: $.data.id }
            - call: "POST /option-grants/${g}/approve"
              payload: {}
              as: BoardApprover
              as_user_id: "approver-1"
          trigger:
            - call: "POST /option-grants/${g}/cancel"
              payload: {}
              as: Administrator
            - call: "GET /option-pools/${pool}"
              payload: {}
              as: Administrator
              captures: { alloc: $.data.allocated_shares, avail: $.data.available_shares }
          assert:
            - "OptionPool.${pool}.allocated_shares == 0 after cancel (returned)"
            - "OptionPool.${pool}.available_shares == 5000 == authorized_shares (conserved; no drift)"
