# =============================================================================
# Task 1946 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over the claim-extraction guide. Shared fixture unless noted:
# contract terms 4000c/1200c per head, fcr 2.60, adg 1.90, mort 5.00, feed 650 lbs,
# splits 100/50/0, window 2026-01-01..2026-12-31; barns 1200 head / 9600 sqft.
# =============================================================================

scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: site_creation_returns_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Site]
        distinguishing_aspect: "POST /sites with all required fields returns 201 with input echo, site_status default ACTIVE, server id and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sites", payload: { name: "Prairie", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id, ver: $.data.version, st: $.data.site_status } }
          assert:
            - "HTTP 201; data.id is a UUID (${site_id}), created_at/updated_at present with 3 fractional digits"
            - "data.site_status == ACTIVE (${st}); data.version == 1 (${ver}); data.total_capacity_head == 0"

      - name: contract_split_defaults_applied
        claim_type: defaults
        grounds: [entities.Contract.fields.structural_owner_pct, entities.Contract.fields.equipment_owner_pct, entities.Contract.fields.routine_owner_pct]
        distinguishing_aspect: "Omitting the three split pcts applies defaults 100/50/0; contract starts DRAFT."
        test_recipe:
          setup: ["site and grower exist"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
          trigger:
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { c_struct: $.data.structural_owner_pct, c_equip: $.data.equipment_owner_pct, c_rout: $.data.routine_owner_pct, c_status: $.data.contract_status } }
          assert:
            - "structural_owner_pct == 100, equipment_owner_pct == 50, routine_owner_pct == 0 (${c_struct}/${c_equip}/${c_rout})"
            - "contract_status == DRAFT (${c_status})"

      - name: barn_get_not_found_returns_404
        claim_type: not_found
        grounds: [ entities.Barn, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /barns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND (${err})"

      - name: site_create_missing_required_returns_400
        claim_type: required_fields
        grounds: [ entities.Site.fields.county, "errors[ERR_MALFORMED_FIELD]"]
        distinguishing_aspect: "Missing required input field county is rejected 400 before any state change."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA" }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_MALFORMED_FIELD (${err}); no Site persisted (GET /sites total_count == 0)"

      - name: truck_wash_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [ entities.TruckWash.fields.wash_type, "errors[ERR_MALFORMED_FIELD]"]
        distinguishing_aspect: "wash_type outside {FULL_DISINFECT, WASH_ONLY} is rejected 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-07-01T08:00:00Z", wash_type: "HOSE_DOWN" }, as: TransportCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_MALFORMED_FIELD (${err})"

      - name: mortality_report_append_only_shape
        claim_type: immutability
        grounds: [entities.MortalityReport]
        distinguishing_aspect: "common_fields:false event: list items expose id + created_at + business fields but NO version/updated_at; no update endpoint exists in §1.5."
        test_recipe:
          setup: ["placed 500-head group"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-03-05", mortality_count: 3, cull_count: 1, reason_code: "INJURY" }, as: Grower, as_user_id: "${grower_id}", captures: { rep_id: $.data.id } }
          trigger:
            - { call: "GET /pig-groups/${group_id}/mortality-reports", payload: {}, as: FieldTech }
          assert:
            - "total_count == 1; item id == ${rep_id}; item has created_at and report_date 2026-03-05"
            - "item has NO version or updated_at keys (append-only event shape)"

      - name: pig_group_create_unknown_barn_returns_404
        claim_type: parent_relationships
        grounds: [ entities.PigGroup.fields.barn_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a body FK (barn_id) that does not resolve is 404, checked before OCC/state/business rules."
        test_recipe:
          setup: ["contract ACTIVE (site+grower)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_v: $.data.version } }
          trigger:
            - { call: "POST /pig-groups", payload: { barn_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", contract_id: "${contract_id}", placement_date: "2026-09-01", target_market_date: "2027-01-12", head_placed: 100, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND (${err}) — existence (priority 4) precedes the OCC check"

  # ============================================================ state machines
  - section: state_machines
    instances:
      - name: pig_group_initial_state
        claim_type: initial_state
        grounds: [state_machines.PigGroup, state_machines.PigGroupPhase]
        distinguishing_aspect: "New group starts SCHEDULED on the lifecycle dimension and STARTER on the phase dimension, head_current == head_placed."
        test_recipe:
          setup: ["contract ACTIVE; barn exists; clock 2026-02-15"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { g_status: $.data.group_status, g_phase: $.data.current_phase, g_head: $.data.head_current } }
          assert:
            - "group_status == SCHEDULED (${g_status}); current_phase == STARTER (${g_phase})"
            - "head_current == 500 (${g_head}); mortality_total == 0; pending_deductions_cents == 0"

      - name: confirm_placement_twice_rejected
        claim_type: invalid_transition
        grounds: [ state_machines.PigGroup, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Second confirm on a PLACED group is not a defined transition: 409 ERR_INVALID_STATE_TRANSITION, and re-running the trigger never re-applies side effects."
        test_recipe:
          setup: ["group PLACED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
          trigger:
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech, captures: { err: $.data.error_id } }
            - { call: "GET /barns/${barn_id}", payload: {}, as: IntegratorAdmin, captures: { b_status: $.data.barn_status } }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE_TRANSITION (${err})"
            - "Barn remains OCCUPIED exactly once (${b_status}); group still PLACED; no double side effects"

      - name: settlement_paid_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [ state_machines.Settlement, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "From terminal PAID every further transition is closed: dispute attempt returns 409 and no field changes."
        test_recipe:
          setup: ["100-head group closed (one load 28000 lbs); settlement approved by adm_1 and paid by adm_2 (total 460000: base 400000 + bonus 60000)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 100, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 200, min_weight_lbs: 240, max_weight_lbs: 300 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 100, expected_slot_version: "${slot1_v}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-12T08:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-07-12T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash1: $.data.id } }
            - { call: "POST /truck-washes/${wash1}/verify", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /market-loads/${load1}/dispatch", payload: { truck_wash_id: "${wash1}" }, as: TransportCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${load1}/deliver", payload: { live_weight_lbs_total: 28000 }, as: TransportCoordinator }
            - { call: "GET /settlements", payload: { group_id: "${group_id}" }, as: IntegratorAdmin, captures: { sett_id: "$.data[0].id" } }
            - { call: "POST /settlements/${sett_id}/approve", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
            - { call: "POST /settlements/${sett_id}/pay", payload: {}, as: IntegratorAdmin, as_user_id: "adm_2" }
          trigger:
            - { call: "POST /settlements/${sett_id}/dispute", payload: { reason: "too late" }, as: Grower, as_user_id: "${grower_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE_TRANSITION (${err})"
            - "Settlement stays PAID with total_pay_cents == 460000 (fcr 0.0 -> tier 1.00, adg 1.73 -> factor 0.5, bonus 60000)"

      - name: contract_activate_suspended_grower_rejected
        claim_type: precondition_enforcement
        grounds: [ state_machines.Contract, "errors[ERR_GROWER_NOT_ACTIVE]"]
        distinguishing_aspect: "Guarded transition: activation requires the GROWER entity ACTIVE; suspending the grower blocks it."
        test_recipe:
          setup: ["site ACTIVE; grower SUSPENDED; contract DRAFT"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /growers/${grower_id}/suspend", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; error_id == ERR_GROWER_NOT_ACTIVE (${err}); contract stays DRAFT"

      - name: advance_phase_cancels_old_phase_orders
        claim_type: side_effect_execution
        grounds: [state_machines.PigGroupPhase, state_machines.FeedOrder]
        distinguishing_aspect: "Phase advance cascade: both REQUESTED and SCHEDULED orders of the outgoing phase flip to CANCELLED in the same request; the phase dimension advances exactly one step."
        test_recipe:
          setup: ["group PLACED 1000 head; STARTER orders O1 REQUESTED (30000 lbs) and O2 SCHEDULED (40000 lbs)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 30000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { o1: $.data.id } }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 40000, requested_delivery_date: "2026-03-06" }, as: FieldTech, captures: { o2: $.data.id } }
            - { call: "POST /feed-orders/${o2}/schedule", payload: { scheduled_delivery_date: "2026-03-06" }, as: FeedMill }
          trigger:
            - { call: "POST /pig-groups/${group_id}/advance-phase", payload: {}, as: FieldTech, captures: { phase: $.data.current_phase } }
            - { call: "GET /feed-orders/${o1}", payload: {}, as: FieldTech, captures: { o1s: $.data.order_status } }
            - { call: "GET /feed-orders/${o2}", payload: {}, as: FieldTech, captures: { o2s: $.data.order_status } }
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "GROWER", diet_code: "GR-1", quantity_lbs: 190000, requested_delivery_date: "2026-03-10" }, as: FieldTech, captures: { o3: $.data.id } }
          assert:
            - "current_phase == GROWER (${phase})"
            - "O1 (was REQUESTED) == CANCELLED (${o1s}); O2 (was SCHEDULED) == CANCELLED (${o2s})"
            - "Cancelled orders leave the committed set: subsequent GROWER order of 190000 lbs accepted (${o3} non-null, hard budget 650000 intact after the 70000 committed lbs were released)"

      - name: manure_plan_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.ManurePlan]
        distinguishing_aspect: "Cyclic shape: DRAFT->SUBMITTED->REJECTED->DRAFT->SUBMITTED is legal; submitted_by is re-stamped on the second submit."
        test_recipe:
          setup: ["site ACTIVE; plan DRAFT"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /manure-plans", payload: { site_id: "${site_id}", plan_year: 2026, lagoon_capacity_gal: 2000000, lagoon_start_gal: 1000000, n_budget_lbs: 50000, p_budget_lbs: 40000 }, as: EnvironmentalManager, as_user_id: "em_1", captures: { plan: $.data.id } }
            - { call: "POST /manure-plans/${plan}/submit", payload: {}, as: EnvironmentalManager, as_user_id: "em_1" }
            - { call: "POST /manure-plans/${plan}/reject", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "POST /manure-plans/${plan}/revise", payload: {}, as: EnvironmentalManager, captures: { st1: $.data.plan_status } }
            - { call: "POST /manure-plans/${plan}/submit", payload: {}, as: EnvironmentalManager, as_user_id: "em_2", captures: { st2: $.data.plan_status, sub_by: $.data.submitted_by } }
          assert:
            - "After revise: plan_status == DRAFT (${st1})"
            - "Second submit succeeds: plan_status == SUBMITTED (${st2}), submitted_by == em_2 (${sub_by})"

      - name: barn_wash_reject_reverts_to_wash_required
        claim_type: side_effect_execution
        grounds: [state_machines.Barn, state_machines.BarnWash]
        distinguishing_aspect: "Compensation loop: a REJECTED barn wash drives the barn WASHING->WASH_REQUIRED, and a fresh wash can be recorded again (WASH_REQUIRED->WASHING) on the same barn."
        test_recipe:
