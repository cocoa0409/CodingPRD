              as: IssuerOperator
            - call: "GET /issuers/${iss_id}/fee-projection"
              payload: {}
              as: IssuerOperator
              captures: { appr: $.data.approved_fee_cents, proj: $.data.projected_fee_cents }
          assert:
            - "appr == proj == 300 — once no PENDING auth remains, both variants converge to floor(20000*150/10000)=300"

      - name: express_feature_flag_gates_express_authorization
        claim_type: conditional_feature_flags
        grounds:
          - entities.PaymentToken.fields.express_transit_enabled
          - validations.priority_16
        distinguishing_aspect: "Token-level flag: an express_mode authorization succeeds only when the token was provisioned with express_transit_enabled true (and card TRANSIT and agreement support); the same operator/amount with a non-express token fails ERR_EXPRESS_TRANSIT_NOT_SUPPORTED."
        test_recipe:
