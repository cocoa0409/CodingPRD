            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-10-02" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ar5}", beneficiary_id: "${br5}", amount_cents: 100000, method: "Fedwire", purpose: "rbac fraud" }, as: WireOperator, as_user_id: "op-1", captures: { wr5: $.data.id } }
            - { call: "POST /wire-ops/wires/${wr5}/submit", payload: { business_date: "2026-10-02" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wr5}", as: WireOperator, captures: { r5_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wr5}/approve", payload: { expected_wire_version: "${r5_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wr5}", as: WireOperator, captures: { r5_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wr5}/approve", payload: { expected_wire_version: "${r5_v2}" }, as: WireApprover, as_user_id: "ap-2" }
          trigger:
            - { call: "POST /wire-ops/wires/${wr5}/fraud-holds", payload: { reason_code: "VELOCITY", note: "operator overreach" }, as: WireOperator, as_user_id: "op-1", captures: { r5_err: $.data.error_id } }
