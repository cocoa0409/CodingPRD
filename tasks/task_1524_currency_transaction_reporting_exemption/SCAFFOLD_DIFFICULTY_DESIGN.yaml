  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cash_transaction_requires_active_customer
        grounds:
          - validations[priority=6]  # ERR_CUSTOMER_NOT_ACTIVE
          - state_machines.Customer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair CashTransaction -> Customer: the valid creation of a
          CashTransaction depends on the Customer's lifecycle state
          (SUSPENDED blocks, reactivation unblocks).
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 78-7878787 ACTIVE; clock 2026-08-01T09:00:00Z"
            - "Customer suspended"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Suspended Sam", tin: "78-7878787", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /customers/${c1}/suspend", as: BranchManager }
          trigger:
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:00:00Z" }
              as: Teller
              captures: { err: $.data.error_id }
            - { call: "POST /customers/${c1}/reactivate", as: BranchManager }
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:05:00Z" }
              as: Teller
              captures: { txn_id: $.data.id, txn_st: $.data.status }
          assert:
            - "err == 'ERR_CUSTOMER_NOT_ACTIVE' (deposit against SUSPENDED customer rejected)"
            - "After reactivate: txn_st == 'POSTED'"

      - name: exam_case_close_requires_all_findings_verified
        grounds:
          - state_machines.ExaminationCase.FINDINGS_ISSUED_to_CLOSED
          - validations[priority=6]  # ERR_EXAMINATION_HAS_OPEN_FINDINGS
        distinguishing_aspect: |
          Entity pair ExaminationCase -> ExaminationFinding (different pair
          than the sibling instances): the case's close transition is gated
          by the aggregate state of its child findings.
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 89-8989898 with one posted cash transaction (finding target); clock 2026-08-01T09:00:00Z"
            - "Case FINCEN CASE-200 through OPEN -> FIELDWORK -> FINDINGS_ISSUED with one OPEN finding"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Case Gate LLC", tin: "89-8989898", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:00:00Z" }
              as: Teller
              captures: { txn1: $.data.id }
            - call: "POST /examination-cases"
              payload: { regulator: "FINCEN", case_number: "CASE-200", scope_start_date: "2025-01-01", scope_end_date: "2026-01-01" }
              as: Examiner
              captures: { case1: $.data.id }
            - { call: "POST /examination-cases/${case1}/begin-fieldwork", as: Examiner }
            - call: "POST /examination-cases/${case1}/findings"
              payload: { severity: "VIOLATION", target_type: "CASH_TRANSACTION", target_id: "${txn1}", description: "missing conductor identification" }
              as: Examiner
              captures: { f1: $.data.id }
            - { call: "POST /examination-cases/${case1}/issue-findings", as: Examiner }
          trigger:
            - call: "POST /examination-cases/${case1}/close"
              as: Examiner
              captures: { err: $.data.error_id }
            - { call: "POST /examination-findings/${f1}/remediate", payload: { remediation_note: "procedure updated" }, as: BSAOfficer, as_user_id: "officer-y" }
            - { call: "POST /examination-findings/${f1}/verify", as: Examiner }
            - call: "POST /examination-cases/${case1}/close"
              as: Examiner
              captures: { case_st: $.data.status }
          assert:
            - "err == 'ERR_EXAMINATION_HAS_OPEN_FINDINGS' (close blocked while finding OPEN)"
            - "case_st == 'CLOSED' after the finding reached VERIFIED"

      - name: exemption_approve_gated_by_structuring_alert_state
        grounds:
          - state_machines.ExemptionDesignation.PENDING_REVIEW_to_ACTIVE
          - validations[priority=7]  # ERR_OPEN_ALERT_BLOCKS_EXEMPTION
        distinguishing_aspect: |
          Entity pair ExemptionDesignation -> StructuringAlert (different
          pair): approval is valid only when no alert is OPEN/UNDER_REVIEW;
          dismissing the alert (OPEN -> UNDER_REVIEW -> DISMISSED) unblocks
          the same approve call.
        test_recipe:
          setup:
            - "Branch BR1; customer GOVERNMENT_AGENCY tin 90-9090909 opened 2020-01-01; clock 2026-08-01T09:00:00Z"
            - "MANUAL structuring alert OPEN on the customer (window 2026-07-27..2026-07-31)"
            - "PHASE_I designation PENDING_REVIEW (requested by officer-a)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Port Authority", tin: "90-9090909", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /structuring-alerts"
              payload: { customer_id: "${c1}", window_start_date: "2026-07-27", window_end_date: "2026-07-31", note: "teller tip: repeated 9k deposits" }
              as: BSAOfficer
              as_user_id: "officer-z"
              captures: { al1: $.data.id }
            - call: "POST /customers/${c1}/exemption-designations"
              payload: { phase: "PHASE_I" }
              as: BSAOfficer
              as_user_id: "officer-a"
              captures: { ex1: $.data.id }
          trigger:
            - call: "POST /exemption-designations/${ex1}/approve"
              as: BSAOfficer
              as_user_id: "officer-b"
              captures: { err: $.data.error_id }
            - { call: "POST /structuring-alerts/${al1}/begin-review", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /structuring-alerts/${al1}/dismiss", payload: { disposition_note: "legitimate payroll pattern" }, as: BSAOfficer, as_user_id: "officer-z" }
            - call: "POST /exemption-designations/${ex1}/approve"
              as: BSAOfficer
              as_user_id: "officer-b"
              captures: { ex_st: $.data.status }
          assert:
            - "err == 'ERR_OPEN_ALERT_BLOCKS_EXEMPTION' (OPEN alert gates approval)"
            - "ex_st == 'ACTIVE' after the alert reached DISMISSED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: manual_alert_window_closed_interval_overlap
        grounds:
          - validations[priority=9]  # ERR_ALERT_WINDOW_OVERLAP
          - entities.StructuringAlert.fields.window_start_date
        distinguishing_aspect: |
          Resource: a customer's live structuring-alert windows. Interval
          semantics: CLOSED date intervals — a new manual window sharing even
          one date (2026-08-05) with a live alert is rejected, while a
          strictly disjoint successor window (starting 2026-08-06) succeeds.
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 01-0101010; one live MANUAL alert with window [2026-08-01, 2026-08-05]"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Overlap Olga", tin: "01-0101010", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - call: "POST /structuring-alerts"
              payload: { customer_id: "${c1}", window_start_date: "2026-08-01", window_end_date: "2026-08-05", note: "tip-1" }
              as: BSAOfficer
              as_user_id: "officer-z"
              captures: { al1: $.data.id }
          trigger:
            - call: "POST /structuring-alerts"
              payload: { customer_id: "${c1}", window_start_date: "2026-08-05", window_end_date: "2026-08-09", note: "tip-2" }
              as: BSAOfficer
              as_user_id: "officer-z"
              captures: { err: $.data.error_id }
            - call: "POST /structuring-alerts"
              payload: { customer_id: "${c1}", window_start_date: "2026-08-06", window_end_date: "2026-08-10", note: "tip-3" }
              as: BSAOfficer
              as_user_id: "officer-z"
              captures: { al3: $.data.id }
            - call: "GET /structuring-alerts"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { total: $.meta.total_count }
          assert:
            - "err == 'ERR_ALERT_WINDOW_OVERLAP' ([2026-08-05, 2026-08-09] shares the date 2026-08-05 with the live alert — closed semantics)"
            - "Second disjoint window created: al3 is non-null; total == 2"

      - name: exam_case_scope_half_open_overlap_per_regulator
        grounds:
          - validations[priority=9]  # ERR_CASE_SCOPE_OVERLAP
          - entities.ExaminationCase.fields.scope_start_date
        distinguishing_aspect: |
          Different resource (regulator examination scopes) and DIFFERENT
          interval semantics than the alert instance: HALF-OPEN
          [scope_start_date, scope_end_date) per regulator — a case starting
          exactly at the other's end date is allowed, a one-day-earlier start
          conflicts, and an overlapping range for a DIFFERENT regulator is
          allowed.
        test_recipe:
          setup:
            - "Existing FINCEN case F-1 with scope [2025-01-01, 2025-06-30)"
          setup_api_calls:
            - call: "POST /examination-cases"
              payload: { regulator: "FINCEN", case_number: "F-1", scope_start_date: "2025-01-01", scope_end_date: "2025-06-30" }
              as: Examiner
              captures: { kase1: $.data.id }
          trigger:
            - call: "POST /examination-cases"
              payload: { regulator: "FINCEN", case_number: "F-2", scope_start_date: "2025-06-30", scope_end_date: "2025-12-31" }
              as: Examiner
              captures: { kase2: $.data.id }
            - call: "POST /examination-cases"
              payload: { regulator: "FINCEN", case_number: "F-3", scope_start_date: "2025-06-29", scope_end_date: "2025-09-30" }
              as: Examiner
              captures: { err: $.data.error_id }
            - call: "POST /examination-cases"
              payload: { regulator: "OCC", case_number: "O-1", scope_start_date: "2025-03-01", scope_end_date: "2025-09-30" }
              as: Examiner
              captures: { kase4: $.data.id }
          assert:
            - "kase2 created (touching boundary 2025-06-30 allowed under half-open semantics)"
            - "err == 'ERR_CASE_SCOPE_OVERLAP' ([2025-06-29, 2025-09-30) overlaps F-1's [2025-01-01, 2025-06-30) by one day)"
            - "kase4 created (same dates, different regulator — overlap is per-regulator)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cash_void_restores_aggregation_totals
        grounds:
          - state_machines.CashTransaction.POSTED_to_VOIDED
          - calculations.daily_cash_aggregation
          - state_machines.CTR.DRAFT_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: monetary sums on DailyCashAggregation. The
          forward action (post 300001 cents, crossing the threshold and
          spawning a DRAFT CTR) paired with its compensating action (void
          that same transaction) restores total_cash_in_cents and
          transaction_count to their pre-forward values AND voids the
          cascade-created CTR — no drift.
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 11-2222222; clock 2026-08-01T09:00:00Z"
            - "txn1 700000 POSTED (aggregation 700000 / count 1); txn2 300001 POSTED (aggregation 1000001 / count 2; DRAFT CTR auto-created)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Invariant Ivy", tin: "11-2222222", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 700000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - call: "POST /cash-transactions"
              payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 300001, occurred_at: "2026-08-01T08:30:00Z" }
              as: Teller
              captures: { txn2: $.data.id }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctr1: "$.data[0].id", ctr_st: "$.data[0].status" }
          trigger:
            - { call: "POST /cash-transactions/${txn2}/void", payload: { void_reason: "duplicate entry" }, as: Teller, as_user_id: "teller-1" }
            - call: "GET /daily-aggregations"
              payload: { customer_id: "${c1}", business_date: "2026-08-01" }
              as: BSAOfficer
              captures: { agg_in: "$.data[0].total_cash_in_cents", agg_cnt: "$.data[0].transaction_count", agg_req: "$.data[0].ctr_required" }
            - call: "GET /ctrs/${ctr1}"
              as: BSAOfficer
              captures: { ctr_after: $.data.status }
          assert:
            - "ctr_st == 'DRAFT' (forward action crossed the threshold)"
            - "agg_in == 700000 (exactly the pre-forward total — monetary sum conserved)"
            - "agg_cnt == 1"
            - "agg_req == false"
            - "ctr_after == 'VOIDED' (compensating cascade removed the threshold-crossing CTR)"

      - name: amendment_lineage_conserves_single_live_ctr
        grounds:
          - state_machines.CTR.FILED_to_SUPERSEDED
          - concurrency_rules[ctr-amend-stale-version]
          - entities.CTR.fields.prior_ctr_id
        distinguishing_aspect: |
          Conserved quantity of a different type — lineage CARDINALITY, not
          money: across successive amendment operations, the count of
          non-SUPERSEDED CTRs per (customer, business_date) stays exactly 1,
          and prior_ctr_id chains each CORRECTION to its immediate
          predecessor.
        test_recipe:
          setup:
            - "Branch BR1; customer INDIVIDUAL tin 22-3333333; clock 2026-08-01T09:00:00Z"
            - "Deposit 1100000 -> CTR1 DRAFT; validate; file EFILE -> FILED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /branches"
              payload: { name: "Main", branch_code: "BR1" }
              as: SystemAdmin
              captures: { br1: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Lineage Len", tin: "22-3333333", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }
              as: BranchManager
              captures: { c1: $.data.id }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { ctr1: "$.data[0].id" }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
            - call: "GET /ctrs/${ctr1}"
              as: BSAOfficer
              captures: { ctr1_v: $.data.version }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: SystemAdmin }
          trigger:
            - call: "POST /ctrs/${ctr1}/amendments"
              payload: { amendment_reason: "correct box 4", expected_ctr_version: "${ctr1_v}" }
              as: BSAOfficer
              as_user_id: "officer-y"
              captures: { ctr2: $.data.id, ctr2_prior: $.data.prior_ctr_id, ctr2_type: $.data.filing_type }
            - { call: "POST /ctrs/${ctr2}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr2}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
            - call: "GET /ctrs/${ctr2}"
              as: BSAOfficer
              captures: { ctr2_v: $.data.version }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /ctrs/${ctr2}/amendments"
              payload: { amendment_reason: "correct box 8", expected_ctr_version: "${ctr2_v}" }
              as: BSAOfficer
              as_user_id: "officer-y"
              captures: { ctr3: $.data.id, ctr3_prior: $.data.prior_ctr_id }
            - call: "GET /ctrs"
              payload: { customer_id: "${c1}" }
              as: BSAOfficer
              captures: { total: $.meta.total_count, s0: "$.data[0].status", s1: "$.data[1].status", s2: "$.data[2].status" }
          assert:
            - "ctr2_type == 'CORRECTION' and ctr2_prior == CTR1 id"
            - "ctr3_prior == CTR2 id (chain links each correction to its immediate predecessor)"
            - "total == 3"
            - "s0 == 'SUPERSEDED' and s1 == 'SUPERSEDED' and s2 == 'DRAFT' (created_at ASC order — clocks advanced between amendments)"
            - "Exactly one non-SUPERSEDED CTR exists for (customer, 2026-08-01) after each amendment — cardinality invariant holds"


