            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Fac One", university_id: "U-FAC-1", role_type: "STAFF", email: "fac1@example.edu" }, as: CaseAdministrator, captures: { fac_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_HARASSMENT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
          trigger:
            - { call: "POST /api/cases/${case_id}/informal-resolutions", payload: { facilitator_id: "${fac_id}" }, as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { err: $.data.error_id } }
          assert:
            - "rejected 422 ERR_INFORMAL_RESOLUTION_PROHIBITED (employee-respondent/student-complainant prohibition fires before any consent collection)"

      - name: informal_resolution_requires_formal_complaint
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_FORMAL_COMPLAINT_REQUIRED]"]
