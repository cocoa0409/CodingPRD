              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, max_quantity: 1, measure_cap_cents: 700000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true, sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Eli Park", email: "eli@example.com", service_address_line1: "5 Elm Row", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Divide Mechanical", license_number: "MC-8080", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { hh_v1: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v1}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /rebate-projects/${proj_id}/stacking-declarations"
              payload: { utility_program_name: "Xcel Clean Heat Plan", utility_rebate_cents: 100000 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { sd_id: $.data.id }
          assert:
            - "StackingDeclaration.${sd_id}.computed_state_incentive_before_cents == 700000 (S0 falls back to provisional_total_incentive_cents)"
            - "StackingDeclaration.${sd_id}.combined_benefit_limit_cents == 800000 (floor(1000000 * 0.80))"
            - "StackingDeclaration.${sd_id}.allowed_state_incentive_cents == 640000 — first-pass F = floor(0.30 * (1000000 - 700000 - 100000)) = 60000, TB = 860000, overage 60000, S1 = 700000 - 60000"
            - "StackingDeclaration.${sd_id}.allowed_federal_credit_cents == 78000 — recomputed EXACTLY ONCE from S1: floor(0.30 * (1000000 - 640000 - 100000)); it is LARGER than the first-pass 60000"
            - "StackingDeclaration.${sd_id}.residual_overage_cents == 18000 (640000 + 100000 + 78000 - 800000); the scaffold does not iterate this away"
