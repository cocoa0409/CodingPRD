      - name: psps_event_two_independent_state_dimensions
        grounds:
          - state_machines.PSPSEvent.scope_status
          - state_machines.PSPSEvent.notification_status
          - entities.PSPSEvent.fields.scope_status
          - entities.PSPSEvent.fields.notification_status
        distinguishing_aspect: |
          One PSPSEvent row carries two state dimensions that advance on disjoint triggers: dispatching the
          advance and imminent batches drives notification_status NOT_STARTED -> ADVANCE_SENT ->
          IMMINENT_SENT while scope_status is still SCOPED, and the subsequent arm moves scope_status to
          ARMED without touching notification_status — so the observable combined state (SCOPED,
          IMMINENT_SENT) then (ARMED, IMMINENT_SENT) is unreachable in any single-dimension machine.
          The 48h and 24h batches both map onto ADVANCE_SENT, so dispatching the 24h batch second must NOT
          skip the dimension forward.
