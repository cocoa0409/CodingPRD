        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly the pinned startup default 2026-08-01T00:00:00Z (never wall clock): a data request created with no clock calls is stamped issued_at == 2026-08-01T00:00:00Z and response_due_at == 2026-08-11T00:00:00Z."
