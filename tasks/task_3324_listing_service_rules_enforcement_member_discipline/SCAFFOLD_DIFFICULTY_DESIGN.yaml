# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 2 instances = 18 instances. Every grounds reference resolves into
# SCAFFOLD.yaml §1.1–§1.7. All setup chains drive empty-DB -> precondition state
# using only §1.5 endpoints. Server default logical clock: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dues_proration_vs_consolidated_variant
        grounds:
          - calculations.dues_invoice_amounts
          - calculations.dues_invoice_amounts.variants.prorated_midyear_join
          - calculations.dues_invoice_amounts.variants.consolidated_member_variant
          - entities.DuesInvoice.fields.base_amount_cents
        distinguishing_aspect: |
          Same dues-billing trigger on the same DuesPeriod produces different
          base_amount_cents for two members depending on which variant context
          applies: a midyear joiner is prorated by remaining-days floor, while a
          consolidation-repointed member with no prior-year invoice is billed the
          full survivor amount — two valid interpretations of the same bill run.
        test_recipe:
          setup:
            - "Association A1 (dues 120000c, late tiers 5000/15000, cap 200000)"
            - "Association A2 (dues 90000c, late tiers 4000/12000, cap 200000)"
            - "Member M1 in A1 created 2026-09-01 (no proration: created before period window)"
            - "Member M2 in A1 created 2027-01-01 (inside period window -> prorated)"
            - "Member M3 in A2 created 2026-09-01; A2 consolidated into A1 effective 2027-01-01"
            - "DuesPeriod P1 on A1: year 2027, period_start 2026-12-01, due 2027-01-31, grace 2027-03-02, amount 120000c"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "A1", name: "Assoc One", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { assoc1_id: $.data.id }
            - call: "POST /mls/associations"
              payload: { association_code: "A2", name: "Assoc Two", membership_dues_cents: 90000, late_fee_tier1_cents: 4000, late_fee_tier2_cents: 12000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { assoc2_id: $.data.id }
            - call: "POST /mls/associations/${assoc1_id}/members"
              payload: { member_nr: "M1", full_name: "Member One" }
              as: AssociationStaff
              captures: { m1_id: $.data.id }
            - call: "POST /mls/associations/${assoc2_id}/members"
              payload: { member_nr: "M3", full_name: "Member Three" }
              as: AssociationStaff
              captures: { m3_id: $.data.id }
            - call: "POST /mls/associations/${assoc1_id}/consolidations"
              payload: { absorbed_association_id: "${assoc2_id}", effective_at: "2027-01-01T00:00:00Z" }
              as: AssociationStaff
              captures: { consol_id: $.data.id }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc1_id}/members"
              payload: { member_nr: "M2", full_name: "Member Two" }
              as: AssociationStaff
              captures: { m2_id: $.data.id }
            - call: "POST /mls/associations/${assoc1_id}/consolidations/${consol_id}/execute"
              payload: {}
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc1_id}/dues-periods"
              payload: { year: 2027, period_start_date: "2026-12-01T00:00:00Z", due_date: "2027-01-31T00:00:00Z", grace_end_date: "2027-03-02T00:00:00Z", amount_cents: 120000 }
              as: AssociationStaff
              captures: { period_id: $.data.id, period_version: $.data.version }
          trigger:
            - call: "POST /mls/associations/${assoc1_id}/dues-periods/${period_id}/bill"
              payload: { expected_dues_period_version: "${period_version}" }
              as: AssociationStaff
            - call: "GET /mls/dues-invoices?dues_period_id=${period_id}"
              payload: {}
              as: AssociationStaff
          assert:
            - "M2 invoice base_amount_cents == floor(120000 * (31/365)) == 10191 (prorated midyear join, 31 remaining days Jan 1..Jan 31 inclusive)"
            - "M3 invoice base_amount_cents == 120000 (consolidated_member_variant: full survivor amount, no prior invoice for 2027 in A2)"
            - "M1 invoice base_amount_cents == 120000 (no variant applies; created before period window)"
            - "M2 invoice base_amount_cents != M3 invoice base_amount_cents despite same period and same bill run"
      - name: arbitration_award_abandonment_override_vs_weighted
        grounds:
          - calculations.procuring_cause_award
          - calculations.procuring_cause_award.variants.abandonment_zero_override
          - state_machines.ArbitrationCase.HEARD_to_AWARDED
        distinguishing_aspect: |
          Two arbitration cases with identical claim amounts and identical factor
          scores except F5_ABANDONMENT: with F5 = 7 the weighted tier yields 60% of
          claim; with F5 = 8 the abandonment override forces the award to 0 — the
          same inputs produce two valid award amounts depending solely on the
          abandonment variant branch.
        test_recipe:
          setup:
            - "Association A; members MB (broker), ML (listing agent/complainant), MR (respondent); three extra ACTIVE members P1,P2,P3 for panel pool"
            - "Office O with broker MB; listing L by ML activated then ACTIVE->PENDING->SOLD with business_effective_at == recorded instant (no lateness)"
            - "Policy revision RV (COMP_DISPLAY_ON) active before listing activation"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "AA", name: "Arb Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB", full_name: "Broker Bee" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "ML", full_name: "Lister Lee" }
              as: AssociationStaff
              captures: { ml_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MR", full_name: "Responder Ray" }
              as: AssociationStaff
              captures: { mr_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P1", full_name: "Panel One" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P2", full_name: "Panel Two" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P3", full_name: "Panel Three" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R1", effective_at: "2026-09-01T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v0}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/advance_day"
              payload: { days: 1 }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${ml_id}", mls_number: "MLS-1", property_address: "1 Main St", list_price_cents: 50000000, offer_comp_cents: 1000000 }
              as: Member
              as_user_id: "${ml_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/status"
              payload: { to_status: "PENDING", business_effective_at: "2026-09-02T00:00:00Z" }
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/status"
              payload: { to_status: "SOLD", business_effective_at: "2026-09-02T01:00:00Z" }
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/arbitration-cases"
              payload: { respondent_member_id: "${mr_id}", listing_id: "${listing_id}", claim_amount_cents: 1000000 }
              as: Member
              as_user_id: "${ml_id}"
              captures: { case_a_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/arbitration-cases/${case_a_id}/mediation-outcome"
              payload: { outcome: "DECLINED" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/hearing-panels"
              payload: { case_type: "ARBITRATION", case_id: "${case_a_id}" }
              as: AssociationStaff
              captures: { panel_a_id: $.data.id, panelist_a1: "$.data.selected_member_ids[0]", panelist_a2: "$.data.selected_member_ids[1]" }
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_a_id}/hold-hearing"
              payload: { factor_scores: { F1_FIRST_CONTACT: 9, F2_CONTINUOUS_EFFORT: 8, F3_AGENCY_DISCLOSURE: 7, F4_CONTRACT_ROLE: 6, F5_ABANDONMENT: 7 } }
              as: HearingPanelist
              as_user_id: "${panelist_a1}"
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_a_id}/rule"
              payload: { decision: "UPHOLD" }
              as: HearingPanelist
              as_user_id: "${panelist_a2}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${ml_id}", mls_number: "MLS-2", property_address: "2 Main St", list_price_cents: 50000000, offer_comp_cents: 1000000 }
              as: Member
              as_user_id: "${ml_id}"
              captures: { listing_b_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_b_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_b_id}/status"
              payload: { to_status: "PENDING", business_effective_at: "2026-09-02T02:00:00Z" }
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_b_id}/status"
              payload: { to_status: "SOLD", business_effective_at: "2026-09-02T03:00:00Z" }
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/arbitration-cases"
              payload: { respondent_member_id: "${mr_id}", listing_id: "${listing_b_id}", claim_amount_cents: 1000000 }
              as: Member
              as_user_id: "${ml_id}"
              captures: { case_b_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/arbitration-cases/${case_b_id}/mediation-outcome"
              payload: { outcome: "DECLINED" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/hearing-panels"
              payload: { case_type: "ARBITRATION", case_id: "${case_b_id}" }
              as: AssociationStaff
              captures: { panel_b_id: $.data.id, panelist_b1: "$.data.selected_member_ids[0]", panelist_b2: "$.data.selected_member_ids[1]" }
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_b_id}/hold-hearing"
              payload: { factor_scores: { F1_FIRST_CONTACT: 9, F2_CONTINUOUS_EFFORT: 8, F3_AGENCY_DISCLOSURE: 7, F4_CONTRACT_ROLE: 6, F5_ABANDONMENT: 8 } }
              as: HearingPanelist
              as_user_id: "${panelist_b1}"
          trigger:
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_b_id}/rule"
              payload: { decision: "UPHOLD" }
              as: HearingPanelist
              as_user_id: "${panelist_b2}"
            - call: "GET /mls/associations/${assoc_id}/arbitration-cases/${case_a_id}"
              payload: {}
              as: AssociationStaff
              captures: { award_a: $.data.award_amount_cents }
            - call: "GET /mls/associations/${assoc_id}/arbitration-cases/${case_b_id}"
              payload: {}
              as: AssociationStaff
              captures: { award_b: $.data.award_amount_cents }
          assert:
            - "Case A award_amount_cents == 600000 (score = 0.30*9+0.25*8+0.15*7+0.20*6+0.10*7 = 7.65 -> tier pct 0.60 -> 1000000*0.60)"
            - "Case B award_amount_cents == 0 (F5_ABANDONMENT == 8 triggers abandonment_zero_override despite identical other factors and identical claim)"
            - "award_a != award_b with claim_amount_cents identical (1000000) on both"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: dues_invoice_tiered_late_fee_with_credit_floor
        grounds:
          - calculations.dues_invoice_amounts
          - entities.Association.fields.late_fee_tier1_cents
          - entities.Association.fields.late_fee_tier2_cents
          - entities.DuesInvoice.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear interaction — late-fee tier selection
          branches on days_overdue_at_issue (0 / 1..30 / 31+ with tier2 REPLACING
          tier1), then credit_applied = min(balance, base+late_fee) clamps against
          a per-member balance, then amount_due = base + late_fee - credit in a
          pinned evaluation order; changing any one of the three inputs changes
          which branch dominates.
        test_recipe:
          setup:
            - "Association A: dues 120000c, tier1 late 5000c (days 1..30), tier2 late 15000c (days >= 31), credit cap 200000"
            - "Members: M1 (credits 0), M2 (credits 4000c via staff adjustment), M3 (credits 20000c)"
            - "DuesPeriod P: year 2027, period_start 2026-12-01, due 2027-01-31, grace 2027-03-02, amount 120000c"
            - "Clock set to 2027-02-10 -> days_overdue_at_issue = 10 (tier1 applies at issue)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "CA", name: "Combo Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "M1", full_name: "One" }
              as: AssociationStaff
              captures: { m1_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "M2", full_name: "Two" }
              as: AssociationStaff
              captures: { m2_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "M3", full_name: "Three" }
              as: AssociationStaff
              captures: { m3_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members/${m2_id}/credit-adjustments"
              payload: { amount_cents: 4000, note: "seed 4000" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/members/${m3_id}/credit-adjustments"
              payload: { amount_cents: 20000, note: "seed 20000" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/dues-periods"
              payload: { year: 2027, period_start_date: "2026-12-01T00:00:00Z", due_date: "2027-01-31T00:00:00Z", grace_end_date: "2027-03-02T00:00:00Z", amount_cents: 120000 }
              as: AssociationStaff
              captures: { period_id: $.data.id, period_version: $.data.version }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${assoc_id}/dues-periods/${period_id}/bill"
              payload: { expected_dues_period_version: "${period_version}" }
              as: AssociationStaff
            - call: "GET /mls/dues-invoices?dues_period_id=${period_id}"
              payload: {}
              as: AssociationStaff
          assert:
            - "M1 invoice: days_overdue_at_issue == 10, late_fee_cents == 5000 (tier1), credit_applied_cents == 0, amount_due_cents == 125000"
            - "M2 invoice: late_fee_cents == 5000, credit_applied_cents == 4000, amount_due_cents == 121000"
            - "M3 invoice: late_fee_cents == 5000, credit_applied_cents == 20000, amount_due_cents == 105000"
            - "M2 sanction_credit_balance_cents == 0 after billing (min() clamp consumed all 4000)"
      - name: procuring_cause_round_score_then_tier_then_round_award
        grounds:
          - calculations.procuring_cause_award
          - calculations.procuring_cause_award.precision
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned and observable — the weighted
          score is rounded to 2 decimals BEFORE tier selection, and the award is
          round_half_up(claim * pct) AFTER tiering; factor set {10, 7, 6, 7, 0}
          scores exactly 6.995 -> rounds UP to 7.00 -> lands on the FULL tier
          (>= 7.00 inclusive), so claim 1000001c pays 1000001c, whereas deferring
          score rounding would select the 0.60 tier and pay 600001c.
        test_recipe:
          setup:
            - "Association A; broker MB, complainant ML, respondent MR, panel pool members P1..P3; office O; COMP_DISPLAY_ON revision active; SOLD listing L; arbitration case with claim_amount_cents = 1000001 routed MEDIATION_OFFERED -> ARBITRATION_SCHEDULED; panel convened"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "CB", name: "Round Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "ML", full_name: "Lister" }
              as: AssociationStaff
              captures: { ml_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MR", full_name: "Responder" }
              as: AssociationStaff
              captures: { mr_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P1", full_name: "Panel One" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P2", full_name: "Panel Two" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P3", full_name: "Panel Three" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R1", effective_at: "2026-09-01T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v0}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/advance_day"
              payload: { days: 1 }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${ml_id}", mls_number: "MLS-R1", property_address: "9 Round Rd", list_price_cents: 40000000 }
              as: Member
              as_user_id: "${ml_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/status"
              payload: { to_status: "PENDING", business_effective_at: "2026-09-02T00:00:00Z" }
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/status"
              payload: { to_status: "SOLD", business_effective_at: "2026-09-02T01:00:00Z" }
              as: Member
              as_user_id: "${ml_id}"
            - call: "POST /mls/associations/${assoc_id}/arbitration-cases"
              payload: { respondent_member_id: "${mr_id}", listing_id: "${listing_id}", claim_amount_cents: 1000001 }
              as: Member
              as_user_id: "${ml_id}"
              captures: { case_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/arbitration-cases/${case_id}/mediation-outcome"
              payload: { outcome: "DECLINED" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/hearing-panels"
              payload: { case_type: "ARBITRATION", case_id: "${case_id}" }
              as: AssociationStaff
              captures: { panel_id: $.data.id, panelist_1: "$.data.selected_member_ids[0]", panelist_2: "$.data.selected_member_ids[1]" }
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_id}/hold-hearing"
              payload: { factor_scores: { F1_FIRST_CONTACT: 10, F2_CONTINUOUS_EFFORT: 7, F3_AGENCY_DISCLOSURE: 6, F4_CONTRACT_ROLE: 7, F5_ABANDONMENT: 0 } }
              as: HearingPanelist
              as_user_id: "${panelist_1}"
          trigger:
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_id}/rule"
              payload: { decision: "UPHOLD" }
              as: HearingPanelist
              as_user_id: "${panelist_2}"
            - call: "GET /mls/associations/${assoc_id}/arbitration-cases/${case_id}"
              payload: {}
              as: AssociationStaff
          assert:
            - "ArbitrationCase.${case_id}.award_amount_cents == 1000001 (raw score 6.995 rounds to 7.00 BEFORE tiering -> FULL tier pct 1.00 -> round_half_up(1000001 * 1.00))"
            - "ArbitrationCase.${case_id}.award_amount_cents != 600001 (the value produced if tiering used the unrounded 6.995)"
      - name: ruleset_version_order_pinned_before_license_audit
        grounds:
          - calculations.association_ruleset_version
          - entities.DataLicense.fields.display_ruleset_version
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          ruleset_version (count of ACTIVE+SUPERSEDED revisions) feeds the license
          compliance check, the audit can mint a FEED_ABUSE citation, citation
          payment changes strikes_12m, and strikes never feed back into
          ruleset_version; a license created at ruleset 1 passes activation, then
          a second revision activation bumps ruleset_version to 2 and the SAME
          license fails the next audit on ruleset drift alone.
