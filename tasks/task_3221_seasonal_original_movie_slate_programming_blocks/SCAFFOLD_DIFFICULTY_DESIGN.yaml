              as: ProductionManager
              captures: { slot_touch: $.data.id }
          assert:
            - "err_overlap == ERR_LOCATION_OVERLAP with http 422 (2027-03-19T23:00:00Z < 2027-03-20T00:00:00Z interior intersection)"
