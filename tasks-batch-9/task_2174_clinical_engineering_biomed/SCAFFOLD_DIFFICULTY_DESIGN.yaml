            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2003", acquisition_date: "2023-01-10", acquisition_cost_cents: 1450000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 4, is_loaner_pool: true }
              as: CEManager
