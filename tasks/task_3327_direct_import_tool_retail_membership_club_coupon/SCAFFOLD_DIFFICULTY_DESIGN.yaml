  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_commit_depends_on_container_state
        grounds:
          - state_machines.StoreAllocation.PLANNED_to_COMMITTED
          - errors[ERR_CONTAINER_NOT_ALLOCATABLE]
        distinguishing_aspect: |
          Pair StoreAllocation -> Container: a PLANNED allocation can commit
          only while its container is BOOKED or DEPARTED; once the container
          reaches AT_PORT the identical commit request is rejected with
          ERR_CONTAINER_NOT_ALLOCATABLE.
        test_recipe:
          setup:
            - "Item ACTIVE; PO issued; container with qty 5; allocation of 2 PLANNED"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "XD1", name: "Welder", brand_tier: "PROFESSIONAL", origin_country: "CN", unit_retail_cents: 30000, member_price_cents: 28500, floor_margin_pct: 0.12, lead_time_days: 55, unit_weight_kg: 12.0 }
