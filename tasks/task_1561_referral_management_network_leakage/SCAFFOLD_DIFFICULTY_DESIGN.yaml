# =============================================================================
# Task 1561: Referral Management & Network Leakage — §1.8 Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: conversion_rate_dual_basis_divergence
        grounds:
          - calculations.conversion_rate
          - entities.ProviderPeriodSnapshot.fields.conversion_rate_intake
          - entities.ProviderPeriodSnapshot.fields.conversion_rate_scheduled
          - entities.Referral.fields.ever_scheduled
        distinguishing_aspect: |
          Entity domain: ReferringProvider analytics. For identical period data,
          intake_basis divides completed visits by ALL non-REJECTED referrals (3)
          while scheduled_basis divides by only referrals with ever_scheduled=true
          (2), yielding 0.3333 vs 0.5000 — the denominator definition, not the data,
          drives the divergence.
        test_recipe:
          setup:
            - "Clock starts 2026-08-01T00:00:00Z; plan PPO-1 (factor 1.0); CARDIOLOGY specialist S1 with ACTIVE PREFERRED participation 2026-01-01..2026-12-31"
            - "Provider PA has 3 referrals created in [2026-08-01, 2026-09-01): R1 fully closed (completed visit), R2 STAT accepted 2026-08-02T11:00:00Z and expired by sweep at sla_due 2026-08-04T11:00:00Z, R3 accepted and scheduled (appointment 2026-08-10) but never completed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /specialty-providers"
              payload: { name: "Dr Cardio", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10, accepts_urgent: true }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r1: $.data.id }
            - call: "POST /referrals/${r1}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r1}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r1_v3: $.data.version }
            - call: "POST /referrals/${r1}/appointments"
              payload: { expected_referral_version: "${r1_v3}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
              captures: { a1: $.data.id }
            - call: "POST /appointments/${a1}/confirm"
              payload: { confirmation_channel: "PHONE" }
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T11:00:00Z" }
              as: NetworkAdmin
            - call: "POST /appointments/${a1}/complete"
              as: SpecialistProvider
              as_user_id: "${s1}"
            - call: "POST /appointments/${a1}/consult-note"
              payload: { findings_summary: "Stable", follow_up_recommended: false }
              as: SpecialistProvider
              as_user_id: "${s1}"
            - call: "GET /referrals/${r1}"
              as: ReferralCoordinator
              captures: { r1_v6: $.data.version }
            - call: "POST /referrals/${r1}/loop-closures"
              payload: { expected_referral_version: "${r1_v6}", outcome: "VERIFIED_CLOSED", verification_note: "Loop closed" }
              as: ComplianceAuditor
              as_user_id: "audit-1"
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I21", urgency: "STAT" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r2: $.data.id }
            - call: "POST /referrals/${r2}/accept"
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T11:00:00Z" }
              as: NetworkAdmin
            - call: "POST /referrals/aging-sweep"
              as: ReferralCoordinator
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I50", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r3: $.data.id }
            - call: "POST /referrals/${r3}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r3}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r3_v3: $.data.version }
            - call: "POST /referrals/${r3}/appointments"
              payload: { expected_referral_version: "${r3_v3}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /analytics/periods/close"
              payload: { period_start: "2026-08-01", period_end: "2026-09-01" }
              as: NetworkAdmin
            - call: "GET /analytics/snapshots?referring_provider_id=${pa}"
              as: NetworkAdmin
          assert:
            - "snapshot list for ${pa} has exactly 1 row"
            - "row.intake_count == 3 (R1, R2, R3; none REJECTED)"
            - "row.completed_count == 1 (only R1 has a COMPLETED appointment)"
            - "row.scheduled_basis_count == 2 (R1 and R3 have ever_scheduled == true; R2 expired before scheduling)"
            - "row.leaked_count == 1 (R2 expired)"
            - "row.conversion_rate_intake == 0.3333"
            - "row.conversion_rate_scheduled == 0.5000"
            - "row.conversion_rate_intake != row.conversion_rate_scheduled"
            - "row.leakage_rate == 0.3333"
            - "row.estimated_leakage_exposure_cents == 42000 (CARDIOLOGY base 42000 x factor 1.0)"

      - name: no_show_risk_confirmed_vs_forward
        grounds:
          - calculations.no_show_risk_score
          - entities.Patient.fields.no_show_risk_confirmed
          - entities.Patient.fields.no_show_risk_forward
        distinguishing_aspect: |
          Entity domain: Patient risk scoring (distinct from provider analytics in
          conversion_rate_dual_basis_divergence). confirmed_only counts only NO_SHOW
          appointments (1 -> score 25); forward_looking adds 0.5 per overdue
          unconfirmed SCHEDULED appointment (2 such -> 25 x (1 + 1.0) = 50), so the
          same patient state yields 25 vs 50.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan PPO-1; CARDIOLOGY specialist S1 (capacity 10) with ACTIVE PREFERRED participation covering 2026"
            - "Patient PT has referrals Ra/Rb/Rc, each accepted, assigned S1, and booked: A1 2026-08-01T10:00-11:00, A2 2026-08-01T12:00-13:00, A3 2026-08-01T14:00-15:00"
            - "A1 marked NO_SHOW at 2026-08-01T10:15:00Z; A2 and A3 left SCHEDULED and never confirmed; clock advances to 2026-08-03T00:00:00Z so both are overdue by >= 24h"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /specialty-providers"
              payload: { name: "Dr Cardio", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { ra: $.data.id }
            - call: "POST /referrals/${ra}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${ra}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { ra_v: $.data.version }
            - call: "POST /referrals/${ra}/appointments"
              payload: { expected_referral_version: "${ra_v}", scheduled_start: "2026-08-01T10:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }
              as: ReferralCoordinator
              captures: { a1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I11", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { rb: $.data.id }
            - call: "POST /referrals/${rb}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${rb}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { rb_v: $.data.version }
            - call: "POST /referrals/${rb}/appointments"
              payload: { expected_referral_version: "${rb_v}", scheduled_start: "2026-08-01T12:00:00Z", scheduled_end: "2026-08-01T13:00:00Z" }
              as: ReferralCoordinator
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I50", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { rc: $.data.id }
            - call: "POST /referrals/${rc}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${rc}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { rc_v: $.data.version }
            - call: "POST /referrals/${rc}/appointments"
              payload: { expected_referral_version: "${rc_v}", scheduled_start: "2026-08-01T14:00:00Z", scheduled_end: "2026-08-01T15:00:00Z" }
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:15:00Z" }
              as: NetworkAdmin
            - call: "POST /appointments/${a1}/mark-no-show"
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /patients/${pt1}"
              as: ReferralCoordinator
          assert:
            - "Patient.${pt1}.no_show_strikes == 1"
            - "Patient.${pt1}.no_show_risk_confirmed == 25"
            - "Patient.${pt1}.no_show_risk_forward == 50"
            - "Patient.${pt1}.no_show_risk_confirmed != Patient.${pt1}.no_show_risk_forward"
            - "Patient.${pt1}.status == \"ACTIVE\" (strikes below limit 3)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: specialty_match_score_weighted
        grounds:
          - calculations.specialty_match_ranking
          - calculations.panel_utilization
          - entities.Referral.fields.match_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — participation tier
          bonus, utilization penalty at >= 0.8, and region bonus combine through
          additive clamps. S1 (PREFERRED but utilization 1.0) scores 50+25-15+0=60;
          S2 (STANDARD, region match, no penalty) scores 50+10+0+5=65 and wins
          despite the lower network tier.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan PPO-1; patient PT region NORTH; provider PA"
            - "S1 CARDIOLOGY region SOUTH capacity 1 with PREFERRED participation; one booked appointment pushes utilization to 1.0"
            - "S2 CARDIOLOGY region NORTH capacity 10 with STANDARD participation; S3 CARDIOLOGY accepts_new_patients=false (ineligible)"
            - "Referral R0 (for the bootstrap booking on S1) and referral R (the match subject), both CARDIOLOGY ROUTINE, accepted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /specialty-providers"
              payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "SOUTH", weekly_capacity: 1 }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /specialty-providers"
              payload: { name: "S2", npi: "1000000002", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }
              as: NetworkAdmin
              captures: { s2: $.data.id }
            - call: "POST /specialty-providers"
              payload: { name: "S3", npi: "1000000003", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10, accepts_new_patients: false }
              as: NetworkAdmin
              captures: { s3: $.data.id }
            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
            - call: "POST /network-participations"
              payload: { specialist_id: "${s2}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
            - call: "POST /network-participations"
              payload: { specialist_id: "${s3}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r0: $.data.id }
            - call: "POST /referrals/${r0}/accept"
              as: ReferralCoordinator
            - call: "POST /referrals/${r0}/assign-specialist"
              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r0_v: $.data.version }
            - call: "POST /referrals/${r0}/appointments"
              payload: { expected_referral_version: "${r0_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ReferralCoordinator
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I20", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r: $.data.id }
            - call: "POST /referrals/${r}/accept"
              as: ReferralCoordinator
          trigger:
            - call: "POST /referrals/${r}/auto-match"
              as: ReferralCoordinator
          assert:
            - "Referral.${r}.target_specialist_id == ${s2}"
            - "Referral.${r}.match_score == 65 (S2: 50 base + 10 STANDARD + 0 utilization + 0 ROUTINE + 5 region)"
            - "S1 score would be 60 (50 + 25 PREFERRED - 15 utilization 1/1 >= 0.8); S3 excluded by accepts_new_patients == false"

      - name: leakage_exposure_per_line_rounding
        grounds:
          - calculations.estimated_leakage_exposure
          - entities.LeakageRecord.fields.estimated_value_cents
          - entities.ProviderPeriodSnapshot.fields.estimated_leakage_exposure_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (distinct from mode (a) in
          specialty_match_score_weighted): plan factor 0.801 x ORTHOPEDICS base 33500
          = 26833.5 per line; the pinned per-line-then-sum order yields
          26834 + 26834 = 53668, while the alternative sum-then-round yields
          round(53667.0) = 53667 — a 1-cent divergence on identical data.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan MIX-1 with payer_mix_factor 0.801; provider PA; patient PT"
            - "Two ORTHOPEDICS referrals of PA, each cancelled with reason PATIENT_WENT_OUT_OF_NETWORK, producing one LeakageRecord each"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "MIX-1", payer_name: "PayerMix", payer_mix_factor: 0.801 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "ORTHOPEDICS", diagnosis_code: "M17", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r1: $.data.id }
            - call: "POST /referrals/${r1}/cancel"
              payload: { reason: "PATIENT_WENT_OUT_OF_NETWORK" }
              as: ReferralCoordinator
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "ORTHOPEDICS", diagnosis_code: "M54", urgency: "URGENT" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r2: $.data.id }
            - call: "POST /referrals/${r2}/cancel"
              payload: { reason: "PATIENT_WENT_OUT_OF_NETWORK" }
              as: ReferralCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /analytics/periods/close"
              payload: { period_start: "2026-08-01", period_end: "2026-09-01" }
              as: NetworkAdmin
            - call: "GET /analytics/snapshots?referring_provider_id=${pa}"
              as: NetworkAdmin
            - call: "GET /referrals/${r1}/leakage-records"
              as: ReferralCoordinator
          assert:
            - "each LeakageRecord.estimated_value_cents == 26834 (round_half_up(33500 x 0.801) = round_half_up(26833.5))"
            - "snapshot.estimated_leakage_exposure_cents == 53668 (per-line rounding then sum; NOT 53667)"
            - "snapshot.leaked_count == 2"
            - "snapshot.leakage_rate == 1.0000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: needs_info_resubmit_cycle
        grounds:
          - state_machines.Referral.PENDING_TRIAGE_to_NEEDS_INFO
          - state_machines.Referral.NEEDS_INFO_to_PENDING_TRIAGE
        distinguishing_aspect: |
          Entity: Referral. Cyclic A->B->A loop (PENDING_TRIAGE <-> NEEDS_INFO) can
          be traversed twice in a row and resubmit applies field updates, ending in
          a successful accept — a non-linear cycle, not a forward-only pipeline.
        test_recipe:
          setup:
            - "Clock default; plan PPO-1; provider PA; patient PT; referral R created PENDING_TRIAGE"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }
              as: NetworkAdmin
              captures: { plan1: $.data.id }
            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r: $.data.id }
          trigger:
            - call: "POST /referrals/${r}/request-info"
              payload: { note: "Need recent labs" }
              as: ReferralCoordinator
            - call: "POST /referrals/${r}/resubmit"
              payload: { diagnosis_code: "I11" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r_v3: $.data.version }
            - call: "POST /referrals/${r}/request-info"
              payload: { note: "Clarify urgency" }
              as: ReferralCoordinator
            - call: "POST /referrals/${r}/resubmit"
              payload: { urgency: "URGENT" }
              as: ReferringProvider
              as_user_id: "${pa}"
            - call: "POST /referrals/${r}/accept"
              as: ReferralCoordinator
          assert:
            - "after first request-info: Referral.${r}.status == NEEDS_INFO"
            - "after first resubmit: status == PENDING_TRIAGE and diagnosis_code == \"I11\""
            - "second loop succeeds identically (status NEEDS_INFO then PENDING_TRIAGE, urgency == \"URGENT\")"
            - "final accept succeeds: status == ACCEPTED, auth_status == NOT_REQUIRED, version == 6"

      - name: appointment_branch_divergence
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CONFIRMED
          - state_machines.Appointment.CONFIRMED_to_COMPLETED
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - state_machines.Appointment.NO_SHOW_to_EXCUSED
        distinguishing_aspect: |
          Entity: Appointment (distinct from Referral in needs_info_resubmit_cycle).
          Diamond fork from SCHEDULED: the CONFIRMED->COMPLETED branch pushes the
          referral to VISIT_COMPLETED, while the NO_SHOW->EXCUSED branch reverts the
          referral to ACCEPTED and nets patient strikes to 0 — divergent side-effect
          sets per branch.
