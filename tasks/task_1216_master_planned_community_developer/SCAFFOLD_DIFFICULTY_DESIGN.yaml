  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: violation_fine_tiered_accrual
        grounds:
          - calculations.violation_fine_accrual
          - entities.DesignViolation.fields.fine_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction (three tiered daily rates, day-band
          boundaries, cap): days_late 45 splits 30 days at 5000c + 15 days at 10000c = 300000c,
          which neither a flat rate (45*10000=450000) nor wrong banding produces.
        test_recipe:
          setup:
            - "Active community; PLATTED lot; resident respondent"
            - "Violation REPORTED, notice sent at default clock 2026-05-01 (cure_deadline 2026-05-15), ESCALATED at 2026-05-16, hearing scheduled, clock advanced to 2026-06-29"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Fine Mesa", total_planned_units: 100 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 10 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "L1" }
              as: DeclarantExecutive
              captures: { lot_id: $.data.id }
            - call: "POST /mpc/residents"
              payload: { community_id: "${c_id}", full_name: "Rowan Homeowner", email: "rowan@x.com" }
              as: LifestyleCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /mpc/violations"
              payload: { community_id: "${c_id}", lot_id: "${lot_id}", violation_type: "NONCONFORMING_MATERIALS", respondent_resident_id: "${res_id}" }
              as: DesignReviewer
              captures: { v_id: $.data.id }
            - call: "POST /mpc/violations/${v_id}/send-notice"
              payload: {}
              as: DesignReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mpc/violations/${v_id}/escalate"
              payload: {}
              as: DesignReviewer
            - call: "POST /mpc/violations/${v_id}/schedule-hearing"
              payload: { hearing_date: "2026-06-01T00:00:00Z" }
              as: AssociationDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-29T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mpc/violations/${v_id}/levy-fine"
              payload: {}
              as: AssociationDirector
              captures: { fine: $.data.fine_cents, dl: $.data.days_late, vstatus: $.data.status }
          assert:
            - "${dl} == 45 (2026-05-15 -> 2026-06-29)"
            - "${fine} == 300000 (30*5000 + 15*10000; tier2 band not capped by tier1 boundary)"
            - "${vstatus} == FINED"

      - name: quarterly_installment_rounding_order
        grounds:
          - calculations.quarterly_installment_rounding
          - entities.AssessmentRate.fields.quarterly_installments_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned (annual rounded to integer cents first, then
          quarters rounded half-up, Q4 absorbing the remainder): gap 24,000,100c over 100 units
          gives annual 240001c and quarters [60000, 60000, 60000, 60001]; rounding per-quarter
          from the gap directly would give [60000, 60000, 60000, 60000] and lose a cent.
        test_recipe:
          setup:
            - "Active community with 100 planned units"
            - "FY2027 budget ADOPTED with line items summing to 26,000,100c and non_assessment_income 2,000,000c (gap 24,000,100c)"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Rounding Ridge", total_planned_units: 100 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/budgets"
              payload: { community_id: "${c_id}", fiscal_year: 2027, non_assessment_income_cents: 2000000 }
              as: DeclarantController
              captures: { bud_id: $.data.id }
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "LANDSCAPE_MAINTENANCE", amount_cents: 12000100 }
              as: DeclarantController
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "AMENITY_OPERATIONS", amount_cents: 6000000 }
              as: DeclarantController
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "MANAGEMENT", amount_cents: 3000000 }
              as: DeclarantController
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "RESERVE_CONTRIBUTION", amount_cents: 4000000, is_reserve: true }
              as: DeclarantController
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "EVENTS_PROGRAMMING", amount_cents: 1000000 }
              as: DeclarantController
            - call: "POST /mpc/budgets/${bud_id}/propose"
              payload: {}
              as: DeclarantController
            - call: "POST /mpc/notices"
              payload: { community_id: "${c_id}", notice_type: "BUDGET_ADOPTION", subject: "FY27 budget", body: "adoption", send_at: "2026-05-02T00:00:00Z", budget_id: "${bud_id}" }
              as: LifestyleCoordinator
              captures: { n_id: $.data.id }
            - call: "POST /mpc/notices/${n_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mpc/budgets/${bud_id}/adopt"
              payload: {}
              as: AssociationDirector
          trigger:
            - call: "POST /mpc/assessment-rates"
              payload: { community_id: "${c_id}", budget_id: "${bud_id}", fiscal_year: 2027 }
              as: DeclarantController
              captures: { pu: $.data.per_unit_annual_cents, quarters: $.data.quarterly_installments_cents }
          assert:
            - "${pu} == 240001 (round_half_up(24000100/100, 0) applied to the annual amount first)"
            - "${quarters} == [60000, 60000, 60000, 60001] (Q1..Q3 = round_half_up(240001/4) = 60000; Q4 absorbs remainder)"
            - "sum(${quarters}) == 240001 (no cent lost or invented by the pinned rounding order)"
  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: design_review_revision_cycle
        grounds:
          - state_machines.DesignReviewApplication.DENIED_to_RESUBMITTED
          - state_machines.DesignReviewApplication.RESUBMITTED_to_UNDER_REVIEW
          - calculations.review_fee_schedule
        distinguishing_aspect: |
          Cyclic machine on DesignReviewApplication (not TakedownTranche): two full
          DENIED -> RESUBMITTED -> UNDER_REVIEW loops with escalating round fees
          (0 -> 25000 -> 75000) and reviewer rotation enforced between rounds.
        test_recipe:
          setup:
            - "Active community; builder applicant; lot L1; application submitted by the builder rep"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Cycle Creek", total_planned_units: 50 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 10 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "L1" }
              as: DeclarantExecutive
              captures: { lot_id: $.data.id }
            - call: "POST /mpc/builders"
              payload: { community_id: "${c_id}", legal_name: "Builder Co", credit_tier: "A" }
              as: DeclarantExecutive
              captures: { b_id: $.data.id }
            - call: "POST /mpc/applications"
              payload: { community_id: "${c_id}", lot_id: "${lot_id}", project_type: "EXTERIOR_MODIFICATION", applicant_builder_id: "${b_id}" }
              as: BuilderRep
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id, fee0: $.data.review_fee_cents }
