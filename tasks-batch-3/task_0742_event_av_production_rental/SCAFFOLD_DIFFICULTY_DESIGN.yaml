            - { call: "POST /rental-orders/${ord_id}/crew-assignments", payload: { crew_member_id: "${crew_id}", assignment_role: "TECH", shift_start: "2026-06-10T17:00:00Z", shift_end: "2026-06-10T21:00:00Z", scheduled_hours: 4 }, as: CrewChief, captures: { ok_ca: "$.data.id" } }
