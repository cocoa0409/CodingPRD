scaffold_corner_design:

  # ===========================================================================
  # §1.9 corner coverage, section 1 of 9
  # ===========================================================================
  - section: entities
    instances:
      - name: create_geologic_model_persists_input_fields_and_returns_201
        claim_type: creation
        grounds:
          - endpoints[POST /ccs/geologic-models]
          - entities.GeologicModel.fields
          - concurrency_rules.model-create-stale-project
        distinguishing_aspect: |
          The create endpoint returns 201 with every submitted characterization field echoed back
          unchanged and the three lifecycle fields initialised (status DRAFT, plume_status NOT_RUN,
          revision_round_count 0), while the parent project's version advances from 1 to 2 because the
          create is OCC-guarded on the project.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT at version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
          trigger:
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id, model_v: $.data.version }
          assert:
            - "the trigger call returns HTTP 201"
            - "${proj_v0} == 1"
            - "${model_v} == 1"
            - "GeologicModel.${model_id}.project_id == ${proj_id}"
            - "GeologicModel.${model_id}.model_label == M1-DET"
            - "GeologicModel.${model_id}.seal_thickness_m == 60"
            - "GeologicModel.${model_id}.p10_capillary_entry_pressure_psi == 700"
            - "GeologicModel.${model_id}.porosity_fraction == 0.20"
            - "GeologicModel.${model_id}.assessment_variant == DETERMINISTIC"
            - "GeologicModel.${model_id}.status == DRAFT"
            - "GeologicModel.${model_id}.plume_status == NOT_RUN"
            - "GeologicModel.${model_id}.revision_round_count == 0"
            - "StorageProject.${proj_id}.version == 2"

      - name: get_storage_project_returns_persisted_and_derived_values
        claim_type: retrieval
        grounds:
          - endpoints[GET /ccs/storage-projects/{id}]
          - entities.StorageProject.fields
        distinguishing_aspect: |
          A single-resource read returns the stored input fields and the derived fields together in one
          envelope: after the model is accepted the same GET shows status PERMITTING,
          governing_geologic_model_id equal to the accepted model and
          required_financial_assurance_usd 12500000.00 without any further write.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with one ACCEPTED GeologicModel and no wellbores, permits or instruments"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { read_status: $.data.status, read_model: $.data.governing_geologic_model_id, read_required: $.data.required_financial_assurance_usd, read_monitoring: $.data.effective_annual_monitoring_cost_usd }
          assert:
            - "the trigger call returns HTTP 200"
            - "${read_status} == PERMITTING"
            - "${read_model} == ${model_id}"
            - "${read_required} == 12500000.00"
            - "${read_monitoring} == 200000.00"
            - "StorageProject.${proj_id}.name == Alpha Storage Hub"
            - "StorageProject.${proj_id}.basin_code == ILB-01"
            - "StorageProject.${proj_id}.aor_radius_km == 0"

      - name: list_legacy_wellbores_paginates_with_limit_offset_and_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /ccs/storage-projects/{id}/legacy-wellbores]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The child collection endpoint returns an array plus the four pagination fields: with three
          wellbores on the project, limit 2 offset 0 returns 2 rows with total_count 3 and has_more
          true, and limit 2 offset 2 returns the remaining 1 row with has_more false.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT with exactly three LegacyWellbore rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00001", distance_from_injector_km: 0.5, total_depth_m: 1900, penetrates_seal: true, plug_condition: "OPEN_HOLE", plug_record_available: false }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w1_id: $.data.id }
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00002", distance_from_injector_km: 1.0, total_depth_m: 1500, penetrates_seal: false, plug_condition: "PARTIALLY_PLUGGED", plug_record_available: false }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w2_id: $.data.id }
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00003", distance_from_injector_km: 2.0, total_depth_m: 800, penetrates_seal: false, plug_condition: "CEMENTED", plug_record_available: true }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w3_id: $.data.id }
          trigger:
            - call: "GET /ccs/storage-projects/${proj_id}/legacy-wellbores"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /ccs/storage-projects/${proj_id}/legacy-wellbores"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
          assert:
            - "both trigger calls return HTTP 200 with response_type array"
            - "the first trigger response's data array has exactly 2 elements"
            - "the first trigger response reports limit 2, offset 0, total_count 3 and has_more true"
            - "the second trigger response's data array has exactly 1 element"
            - "the second trigger response reports limit 2, offset 2, total_count 3 and has_more false"
            - "the three ids ${w1_id}, ${w2_id} and ${w3_id} each appear in exactly one of the two pages"

      - name: get_geologic_model_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /ccs/geologic-models/{id}]
          - validations[priority=41]
          - errors.ERR_GEOLOGIC_MODEL_NOT_FOUND
        distinguishing_aspect: |
          Reading a syntactically valid but unknown GeologicModel id returns HTTP 404 with error_id
          ERR_GEOLOGIC_MODEL_NOT_FOUND rather than the project-level ERR_PROJECT_NOT_FOUND, because
          existence is checked per resource kind at priority 41.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "one project and one GeologicModel exist, so the store is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
          trigger:
            - call: "GET /ccs/geologic-models/00000000-0000-0000-0000-0000000009ff"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "the trigger call returns HTTP 404 with error_id ERR_GEOLOGIC_MODEL_NOT_FOUND"
            - "GeologicModel.${model_id}.status == DRAFT"
            - "StorageProject.${proj_id}.status == DRAFT"

      - name: create_storage_project_missing_required_operator_name_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /ccs/storage-projects]
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Omitting the required operator_name from the project create body is rejected at priority 30
          with HTTP 400 ERR_INVALID_REQUEST and no StorageProject row is created, so the immediately
          following list call still returns total_count 0.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "no StorageProject rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000 }
              as: ProgramAdmin
            - call: "GET /ccs/storage-projects"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the first trigger call returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the second trigger response reports total_count 0 and an empty data array"

      - name: create_storage_project_omitted_optionals_apply_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /ccs/storage-projects]
          - entities.StorageProject.fields.required_consent_pct
          - entities.StorageProject.fields.ca_rig_slots
          - entities.StorageProject.fields.pisc_duration_years
        distinguishing_aspect: |
          Creating a project without required_consent_pct and without ca_rig_slots applies exactly the
          declared defaults 60 and 2, and the create side effects seed
          outstanding_acreage 4000, effective_annual_monitoring_cost_usd 200000.00 and
          pisc_duration_years 50 rather than leaving them at zero.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "no StorageProject rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ccs/storage-projects"
              payload: { name: "Bravo Storage Hub", operator_name: "Bravo CCS LLC", basin_code: "ILB-02", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, consent: $.data.required_consent_pct, slots: $.data.ca_rig_slots, pisc: $.data.pisc_duration_years }
          assert:
            - "the trigger call returns HTTP 201"
            - "${consent} == 60"
            - "${slots} == 2"
            - "${pisc} == 50"
            - "StorageProject.${proj_id}.status == DRAFT"
            - "StorageProject.${proj_id}.operational_posture == OPEN"
            - "StorageProject.${proj_id}.unitization_status == NOT_FILED"
            - "StorageProject.${proj_id}.closure_status == NOT_REQUESTED"
            - "StorageProject.${proj_id}.outstanding_acreage == 4000.0000"
            - "StorageProject.${proj_id}.effective_annual_monitoring_cost_usd == 200000.00"
            - "StorageProject.${proj_id}.corrective_action_completion_pct == 100.00"
            - "StorageProject.${proj_id}.assurance_coverage_status == UNFUNDED"

      - name: create_injection_well_permit_computes_max_injection_pressure_from_model
        claim_type: computed_fields
        grounds:
          - endpoints[POST /ccs/injection-well-permits]
          - entities.InjectionWellPermit.fields.max_injection_pressure_psi
          - entities.InjectionWellPermit.fields.authorized_injection_rate_tpy
        distinguishing_aspect: |
          Permit creation derives max_injection_pressure_psi as 0.90 x the referenced model's
          fracture_pressure_psi, i.e. exactly 4050.00 for a 4500 psi model, while
          authorized_injection_rate_tpy stays 0 until activation, so the computed pressure ceiling is
          server-derived rather than copied from the request.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status PERMITTING with an ACCEPTED model whose fracture_pressure_psi is 4500"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /ccs/injection-well-permits"
              payload: { project_id: "${proj_id}", geologic_model_id: "${model_id}", well_name: "ALPHA-1", casing_program: "LONG_STRING_CEMENTED_TO_SURFACE", corrosion_resistant_material: true, tubing_packer_installed: true, requested_injection_pressure_psi: 4000 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { permit_id: $.data.id, max_psi: $.data.max_injection_pressure_psi, auth_rate: $.data.authorized_injection_rate_tpy }
          assert:
            - "the trigger call returns HTTP 201"
            - "${max_psi} == 4050.00"
            - "${auth_rate} == 0"
            - "InjectionWellPermit.${permit_id}.permit_status == DRAFT"
            - "InjectionWellPermit.${permit_id}.construction_status == NOT_STARTED"
            - "InjectionWellPermit.${permit_id}.geologic_model_id == ${model_id}"

      - name: create_pore_space_tract_initialises_system_fields
        claim_type: system_fields
        grounds:
          - endpoints[POST /ccs/pore-space-tracts]
          - entities.PoreSpaceTract.fields.lease_status
          - entities.PoreSpaceTract.fields.negotiation_round_count
          - entities.PoreSpaceTract.fields.executed_bonus_per_acre_usd
        distinguishing_aspect: |
          Tract creation sets the server-owned fields itself: lease_status UNLEASED,
          negotiation_round_count 0, version 1, and every negotiation-outcome field
          (current_offer_bonus_per_acre_usd, counter_bonus_per_acre_usd, executed_bonus_per_acre_usd,
          lease_term_start) null, with bonus_settlement_usd and net_acreage still 0.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /ccs/pore-space-tracts"
              payload: { project_id: "${proj_id}", tract_label: "T1", acreage: 1000, landowner_user_id: "landowner-1", ownership_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { t1_id: $.data.id, t1_v: $.data.version, t1_status: $.data.lease_status, t1_rounds: $.data.negotiation_round_count }
          assert:
            - "the trigger call returns HTTP 201"
            - "${t1_status} == UNLEASED"
            - "${t1_rounds} == 0"
            - "${t1_v} == 1"
            - "PoreSpaceTract.${t1_id}.current_offer_bonus_per_acre_usd == null"
            - "PoreSpaceTract.${t1_id}.counter_bonus_per_acre_usd == null"
            - "PoreSpaceTract.${t1_id}.executed_bonus_per_acre_usd == null"
            - "PoreSpaceTract.${t1_id}.lease_term_start == null"
            - "PoreSpaceTract.${t1_id}.bonus_settlement_usd == 0"
            - "PoreSpaceTract.${t1_id}.net_acreage == 0"
            - "StorageProject.${proj_id}.secured_acreage == 0"

      - name: create_legacy_wellbore_invalid_enum_plug_condition_invalid_request
        claim_type: type_constraints
        grounds:
          - endpoints[POST /ccs/legacy-wellbores]
          - entities.LegacyWellbore.fields.plug_condition
          - validations[priority=30]
        distinguishing_aspect: |
          plug_condition is constrained to CEMENTED, PARTIALLY_PLUGGED, OPEN_HOLE or UNKNOWN, so the
          out-of-set value GROUTED is rejected at priority 30 with HTTP 400 ERR_INVALID_REQUEST and no
          wellbore row is created, leaving the project's corrective_action_completion_pct at 100.00.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT with no LegacyWellbore rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00009", distance_from_injector_km: 1.0, total_depth_m: 1500, penetrates_seal: false, plug_condition: "GROUTED", plug_record_available: true }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "GET /ccs/storage-projects/${proj_id}/legacy-wellbores"
              payload: { limit: 10, offset: 0 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "the first trigger call returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the second trigger response reports total_count 0"
            - "StorageProject.${proj_id}.corrective_action_completion_pct == 100.00"

      - name: create_legacy_wellbore_ignores_client_supplied_risk_score_input_ignored
        claim_type: immutability
        grounds:
          - endpoints[POST /ccs/legacy-wellbores]
          - entities.LegacyWellbore.fields.risk_score
          - entities.LegacyWellbore.fields.corrective_action_status
          - calculations.legacy_wellbore_risk_score
        distinguishing_aspect: |
          risk_score, ca_cost_estimate_usd and corrective_action_status are server-computed and are not
          part of the create input, so a body that also carries risk_score 99.99 and
          corrective_action_status CA_WAIVED must leave them at the derived values 22.54, 315080.00 and
          OUT_OF_AOR instead of accepting the client's figures.
          risk_score 22.54 = round(100 x 0.85 x 0.85 x 0.60 x (0.40 + 0.60 x 0.20), 2) at aor_radius_km 0.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT with aor_radius_km 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
