      scorecard carrying defect_rate_bps 2000 above the 1500 ceiling and no fallback offer, the eligible pool is
      empty, so routing_destination is RETAILER_DC, routed_vendor_id is null, restock_disposition is forced to RETAILER_RESTOCK
