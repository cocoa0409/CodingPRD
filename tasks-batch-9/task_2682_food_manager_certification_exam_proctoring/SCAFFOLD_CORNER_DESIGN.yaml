      - name: void_refunds_only_the_still_available_codes_of_a_partly_assigned_batch
        claim_type: input_set_filtering
        grounds:
          - calculations.batch_void_refund
          - calculations.access_code_inventory_conservation
          - endpoints[POST /access-code-batches/{id}/void]
        distinguishing_aspect: |
          refundable_units is available_count at void time (2 of 3), never quantity_purchased: gross is
          round_half_up(11286 * 2 / 3) == 7524, the tier is keyed on that GROSS (7524 < 10000 -> 0.15),
          fee == 1129, net == 6395. The ASSIGNED code is left in ASSIGNED and assigned_count stays 1 —
          an implementation refunding all three units would credit 9593 and wrongly void the assigned code.
        test_recipe:
          setup:
            - "Baseline jurisdiction (surcharge 0.045) / provider prepaid 500000 / EN form / candidate."
            - "A 3-unit EXAM_ONLY batch: subtotal 10800, surcharge 486, total_price_cents 11286, so credit_balance_cents is 488714."
            - "One code assigned to the candidate, leaving available_count 2 and assigned_count 1; the batch version is re-read after the assignment so the void is not stale."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], exam_fee_surcharge_pct: 0.045 }
