scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: flat_vs_interchange_plus_fee_on_identical_capture
        grounds:
          - calculations.processing_fee
          - entities.FeePlan.fields.pricing_model
          - entities.Charge.fields.processing_fee_cents
          - state_machines.Charge.AUTHORIZED_PENDING_to_CAPTURED_PENDING
        distinguishing_aspect: "A 10000-cent capture under a FLAT plan (290bps+30) yields processing_fee_cents=320, while the identical capture under an INTERCHANGE_PLUS plan (interchange 165bps+10, markup 30bps+10) yields 215 — two valid fee algorithms on the Charge domain produce different cents from identical input."
        test_recipe:
          setup:
            - "FLAT plan (290bps + 30c) and INTERCHANGE_PLUS plan (markup 30bps + 10c) exist."
            - "Two APPROVED LOW-risk merchants, one on each plan."
            - "Each merchant has one AUTHORIZED charge for 10000 cents."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /fee-plans"
              payload: { name: "IcPlus", pricing_model: "INTERCHANGE_PLUS", markup_pct_bps: 30, markup_fixed_cents: 10, volume_tier_threshold_cents: 1000000, discounted_markup_pct_bps: 20, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { ip_plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_flat_id: $.data.id }
            - call: "GET /merchants/${m_flat_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_flat_id: "$.data[0].id" }
            - call: "POST /merchants/${m_flat_id}/risk-reviews/${rr_flat_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants"
              payload: { legal_name: "Ip Co", mcc: "5812", fee_plan_id: "${ip_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_ip_id: $.data.id }
            - call: "GET /merchants/${m_ip_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_ip_id: "$.data[0].id" }
            - call: "POST /merchants/${m_ip_id}/risk-reviews/${rr_ip_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_flat_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_flat_id}"
              captures: { ch_flat_id: $.data.id }
            - call: "POST /merchants/${m_ip_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_ip_id}"
              captures: { ch_ip_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_flat_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_flat_id}"
            - call: "POST /charges/${ch_ip_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_ip_id}"
          assert:
            - "Charge.${ch_flat_id}.processing_fee_cents == 320"
            - "Charge.${ch_ip_id}.processing_fee_cents == 215"
            - "Charge.${ch_flat_id}.processing_fee_cents != Charge.${ch_ip_id}.processing_fee_cents"

      - name: chargeback_open_debit_vs_won_compensation_on_dispute
        grounds:
          - calculations.chargeback_ledger_impact
          - state_machines.Dispute.null_to_OPEN
          - state_machines.Dispute.REPRESENTED_to_WON
          - entities.Merchant.fields.available_balance_cents
        distinguishing_aspect: "On the Dispute/Merchant-balance domain, OPEN debits disputed+fee (available drops by 11500), but the WON compensation credits back only the disputed amount (10000), leaving available down by exactly the 1500 fee — a different conserved-quantity algorithm than the Charge-domain fee variant above."
        test_recipe:
          setup:
            - "APPROVED LOW-risk FLAT merchant with one SETTLED+FUNDED charge of 10000, fully funded so available_balance_cents is known."
            - "Clock pinned for deterministic dates."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { m_v_after_approve: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v_after_approve}" }
              as: PlatformOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /settlement-batches/${batch_id}/fund"
              payload: {}
              as: PlatformOperator
            - call: "POST /charges/${ch_id}/disputes"
              payload: { disputed_amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { dispute_id: $.data.id }
            - call: "POST /disputes/${dispute_id}/acknowledge"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /disputes/${dispute_id}/represent"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
              captures: { avail_after_open: $.data.available_balance_cents }
            - call: "POST /disputes/${dispute_id}/resolve"
              payload: { outcome: "WON" }
              as: PlatformOperator
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
              captures: { avail_after_won: $.data.available_balance_cents }
          assert:
            - "available_balance_cents after dispute open == 9680 - (10000 + 1500) == -1820"
            - "available_balance_cents after WON resolve == -1820 + 10000 == 8180"
            - "delta from before-open (9680) to after-won (8180) == -1500 (chargeback fee retained, disputed amount restored)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: interchange_plus_fee_nonlinear_three_inputs_with_tier_branch
        grounds:
          - calculations.processing_fee
          - calculations.processing_fee.variants.interchange_plus_fee
          - entities.FeePlan.fields.volume_tier_threshold_cents
        distinguishing_aspect: "Mode (a): the INTERCHANGE_PLUS fee combines >=3 inputs (interchange passthrough, markup_bps OR discounted_markup_bps selected by a conditional branch on prior_month_settled_cents, and the markup fixed) — a 20000 capture yields 410 when prior month volume is 1000000 (markup 30bps) but 390 when prior month volume is 1000001 (markup drops to 20bps)."
        test_recipe:
          setup:
            - "INTERCHANGE_PLUS plan: markup 30bps+10, threshold 1000000, discounted 20bps."
            - "APPROVED merchant on that plan with prior-month SETTLED volume of exactly 1000000 cents (no discount yet)."
            - "A fresh 20000 AUTHORIZED charge in the same calendar month."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "IcPlus", pricing_model: "INTERCHANGE_PLUS", markup_pct_bps: 30, markup_fixed_cents: 10, volume_tier_threshold_cents: 1000000, discounted_markup_pct_bps: 20, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { ip_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Ip Co", mcc: "5812", fee_plan_id: "${ip_plan_id}", requested_monthly_volume_cents: 2000000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 1000000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_prior_id: $.data.id }
            - call: "POST /charges/${ch_prior_id}/capture"
              payload: { amount_cents: 1000000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-03-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 20000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_test_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_test_id}/capture"
              payload: { amount_cents: 20000 }
              as: MerchantUser
              as_user_id: "${m_id}"
          assert:
            - "prior_month_settled_cents == 1000000 (not strictly > threshold) so markup stays 30bps"
            - "Charge.${ch_test_id}.processing_fee_cents == 410 (ic 165bps*20000=330 +10, markup 30bps*20000=60 +10)"

      - name: settlement_reserve_sum_then_round_vs_per_capture_round_then_sum
        grounds:
          - calculations.settlement_summary
          - calculations.processing_fee
          - entities.SettlementBatch.fields.reserve_held_cents
          - entities.SettlementBatch.fields.total_fees_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned and the two calcs pin OPPOSITE orders — processing_fee rounds each per-capture pct component THEN sums (two 333 captures => 40+40=80 in total_fees), while settlement reserve sums gross THEN rounds once (round(666*5%)=33, not round(333*5%)*2=34); the test proves both pinned orders, which differ from the naive alternative."
        test_recipe:
          setup:
            - "FLAT plan 290bps+30. MEDIUM-risk merchant (reserve 500bps)."
            - "Two AUTHORIZED charges of 333 cents each, both captured."
            - "Clock pinned; batch opened and settled."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "MEDIUM" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 333, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch1_id: $.data.id }
            - call: "POST /charges/${ch1_id}/capture"
              payload: { amount_cents: 333 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 333, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch2_id: $.data.id }
            - call: "POST /charges/${ch2_id}/capture"
              payload: { amount_cents: 333 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-02-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
          assert:
            - "SettlementBatch.${batch_id}.gross_captured_cents == 666"
            - "SettlementBatch.${batch_id}.total_fees_cents == 80 (round-then-sum per capture: 40 + 40, NOT 79)"
            - "SettlementBatch.${batch_id}.reserve_held_cents == 33 (sum-then-round: round(666*0.05)=33, NOT 34)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_cyclic_represent_reopen_rounds
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_REPRESENTED
          - state_machines.Dispute.REPRESENTED_to_UNDER_REVIEW
          - entities.Dispute.fields.representment_round
        distinguishing_aspect: "Dispute is cyclic: UNDER_REVIEW->REPRESENTED->UNDER_REVIEW loops, representment_round incrementing 0->1 then 1->2, distinct from any linear pipeline; the loop is bounded by MAX_REPRESENTMENT_ROUNDS=2."
        test_recipe:
          setup:
            - "A SETTLED charge with an OPEN dispute that has been acknowledged (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "POST /charges/${ch_id}/disputes"
              payload: { disputed_amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { dispute_id: $.data.id }
            - call: "POST /disputes/${dispute_id}/acknowledge"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /disputes/${dispute_id}/represent"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /disputes/${dispute_id}/reopen"
              payload: {}
              as: PlatformOperator
            - call: "POST /disputes/${dispute_id}/represent"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { round_after_second: $.data.representment_round }
          assert:
            - "Dispute.${dispute_id}.dispute_status == REPRESENTED after the second represent (looped back through UNDER_REVIEW)"
            - "Dispute.${dispute_id}.representment_round == 2"

      - name: charge_parallel_auth_and_settlement_axes
        grounds:
          - state_machines.Charge.AUTHORIZED_PENDING_to_CAPTURED_PENDING
          - state_machines.Charge.CAPTURED_BATCHED_to_CAPTURED_SETTLED
          - entities.Charge.fields.auth_status
          - entities.Charge.fields.settlement_status
        distinguishing_aspect: "Charge carries two independent state axes on one row: auth_status (AUTHORIZED->CAPTURED) and settlement_status (PENDING->BATCHED->SETTLED) advance on separate triggers — capture moves only the auth axis while settlement stays PENDING, proving parallel (not linear) dimensions on a different entity than Dispute."
        test_recipe:
          setup:
            - "APPROVED LOW merchant with one AUTHORIZED/PENDING charge of 5000."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 5000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 5000 }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { auth_after_capture: $.data.auth_status, settle_after_capture: $.data.settlement_status }
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
          assert:
            - "After capture: Charge.${ch_id}.auth_status == CAPTURED but Charge.${ch_id}.settlement_status == PENDING (axes independent)"
            - "After batch settle: Charge.${ch_id}.auth_status still CAPTURED and Charge.${ch_id}.settlement_status == SETTLED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_charge_reserve_ledger_depth3
        grounds:
          - state_machines.SettlementBatch.OPEN_to_SETTLED
          - state_machines.Charge.CAPTURED_BATCHED_to_CAPTURED_SETTLED
          - state_machines.ReserveEntry.HELD_to_RELEASED
          - entities.ReserveEntry.fields.amount_cents
        distinguishing_aspect: "Depth-3 chain triggered by batch settle: settle flips each batched Charge to SETTLED (hop 1); the SETTLED batch state creates a ReserveEntry HELD (hop 2); the ReserveEntry creation posts a RESERVE_HOLD LedgerEntry that recomputes Merchant.reserved_balance_cents (hop 3) — each hop caused by the previous, not directly by the settle call."
        test_recipe:
          setup:
            - "MEDIUM-risk merchant (reserve 500bps), one captured charge of 10000 in an OPEN batch."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "MEDIUM" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "GET /settlement-batches/${batch_id}/reserve-entries"
              payload: {}
              as: PlatformOperator
              captures: { re_amount: "$.data[0].amount_cents" }
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
              captures: { reserved_after: $.data.reserved_balance_cents }
          assert:
            - "Charge.${ch_id}.settlement_status == SETTLED (hop 1)"
            - "a ReserveEntry exists for the batch with amount_cents == 500 (hop 2: round(10000*0.05))"
            - "Merchant.${m_id}.reserved_balance_cents == 500 (hop 3: RESERVE_HOLD posting recomputed the derived balance)"

