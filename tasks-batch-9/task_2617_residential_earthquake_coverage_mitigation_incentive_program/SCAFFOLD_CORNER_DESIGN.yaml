            - "${mm_err} == \"ERR_DWELLING_OWNER_MISMATCH\" with HTTP 422 - both rows exist, but the dwelling is not this policyholder's"
            - "${ok_id} is created with ${ok_status} == \"PENDING\", ${ok_round} == 1, ${ok_campaign} == \"SHAKEOUT26\""
            - "${ok_offered} == \"2026-08-01T00:00:00Z\" and ${ok_expires} == \"2026-09-30T00:00:00Z\" - offered_at plus OFFER_VALID_DAYS 60"
            - "the filtered list has total_count == 1 with ${list_first} == \"${ok_id}\" - only the accepted triple created a row, and ${ins_offers} == 1 confirms the two rejects wrote nothing"

      - name: insurer_read_returns_derived_counters_from_its_offer_history
        claim_type: computed_read
        grounds:
          - endpoints.GET_/eqp/insurers/{id}
          - entities.ParticipatingInsurer.fields.undocumented_decline_count
          - entities.ParticipatingInsurer.fields.policies_bound_count
          - state_machines.MandatoryOffer.transitions.reoffer
        distinguishing_aspect: "Every counter on the insurer read is derived from the offer and policy history rather than stored by the client, and a reoffer of an undocumented decline decrements undocumented_decline_count - so the read after the reoffer must be lower than the read before it."
        test_recipe:
          setup:
            - "One insurer with three dwellings: one offer accepted and bound, one declined without documentation, one declined with documentation"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Counter Insurance", naic_code: "22016", market_share_pct: 2.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id, c0_offers: $.data.offers_recorded_count, c0_undoc: $.data.undocumented_decline_count, c0_bound: $.data.policies_bound_count, c0_rate: $.data.last_take_up_rate_bp }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Dov Karlsen", email: "dov@example.com", county_code: "06053" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "124 Counter Crest", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 2003, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_1: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "126 Counter Crest", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 2003, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_2: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "128 Counter Crest", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_SLAB", year_built: 2003, dwelling_limit_cents: 20000000 }
              as: ProgramAdmin
              captures: { dw_3: $.data.id }
          trigger:
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_1}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_1: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_1}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_1}", insurer_id: "${ins_id}", accepted_offer_id: "${off_1}", deductible_pct: 10, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 1000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_1: $.data.id }
            - call: "POST /eqp/policies/${pol_1}/bind"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_2}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_2: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_2}/respond"
              payload: { response: "DECLINE" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { o2_doc: $.data.decline_documented }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_3}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_3: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_3}/respond"
              payload: { response: "DECLINE", decline_documented: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "GET /eqp/insurers/${ins_id}"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { c1_offers: $.data.offers_recorded_count, c1_undoc: $.data.undocumented_decline_count, c1_bound: $.data.policies_bound_count }
            - call: "POST /eqp/mandatory-offers/${off_2}/reoffer"
              payload: {}
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { o2_status: $.data.status, o2_round: $.data.offer_round }
            - call: "GET /eqp/insurers/${ins_id}"
              payload: {}
              as: ProgramAdmin
              captures: { c2_undoc: $.data.undocumented_decline_count, c2_bound: $.data.policies_bound_count }
          assert:
            - "${c0_offers} == 0, ${c0_undoc} == 0, ${c0_bound} == 0 and ${c0_rate} == 0 on a freshly created insurer - every counter is server-derived"
            - "${o2_doc} == false - the optional decline_documented defaults to false, which is what makes the decline undocumented"
            - "${c1_offers} == 3, ${c1_undoc} == 1 and ${c1_bound} == 1 - only the bound policy raises policies_bound_count, and only the undocumented decline raises its counter"
            - "${o2_status} == \"PENDING\" with ${o2_round} == 2 after the reoffer"
            - "${c2_undoc} == 0 - the superseded decline is taken back off the counter - while ${c2_bound} == 1 is unaffected"

      - name: renew_is_permitted_only_inside_the_forty_five_day_window
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/eqp/policies/{id}/renew
          - validations.ERR_RENEWAL_WINDOW_NOT_OPEN
          - state_machines.Policy.transitions.renew
        distinguishing_aspect: "Renewal is gated on the half-open window [expires_at - 45 days, expires_at): one day before the window opens the call is refused, and on the opening day exactly it succeeds and rolls the term forward from the old expires_at rather than from the clock."
        test_recipe:
          setup:
