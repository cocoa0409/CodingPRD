# =============================================================================
# Task 1648 — Scaffold Difficulty Design (§1.8 Test Targeting Index)
# 9 rule blocks x 2-3 instances = 24 instances.
# Canonical approvable-application chain used throughout:
#   clock -> policy(DRAFT) -> activate -> vendor -> household -> source(s)
#   -> application(cw-1) -> documents -> submit -> duplication-check(OCC)
#   -> resolve CLEARED -> GET application (fresh version) -> verification(OCC, cw-2)
#   -> complete PASSED (cw-2) -> approve (pm-1)
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Household vs FundingSource)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: household_exposure_vs_committed_variants
        grounds:
          - calculations.household_benefit_usage
          - entities.Household
          - entities.AssistanceAward.fields.awarded_amount_cents
        distinguishing_aspect: |
          On the Household domain, exposure_basis counts the full 35000-cent
          approved award while committed_basis counts only the 20000 cents whose
          payment has CLEARED — identical underlying rows, two different totals.
        test_recipe:
          setup:
            - "Policy ACTIVE: max_annual 100000, rent_cap 50000, utility_cap 40000, income_limit 5000000"
            - "Household income 1000000; one RENT award of 35000 approved; payment of 20000 CLEARED; payment of 15000 still ISSUED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Ana Ruiz", address: "12 Oak St", phone: "555-0101", household_size: 3, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "General Fund", funder_name: "First Church", source_type: "DONOR_UNRESTRICTED", allowed_categories: ["RENT", "UTILITY"], period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 200000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { src: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 35000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
            - { call: "POST /assistance/applications/${app}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/ev-1.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_v: $.data.version }
            - { call: "POST /assistance/applications/${app}/duplication-checks", payload: { agency_name: "County HHS", expected_application_version: "${app_v}" }, as: Caseworker, as_user_id: "cw-1", captures: { dup: $.data.id } }
            - { call: "POST /assistance/duplication-checks/${dup}/resolve", payload: { result: "CLEARED" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "GET /assistance/applications/${app}"
              payload: {}
              as: Caseworker
              captures: { app_v2: $.data.version }
            - { call: "POST /assistance/applications/${app}/verifications", payload: { expected_application_version: "${app_v2}" }, as: Caseworker, as_user_id: "cw-2", captures: { ver: $.data.id } }
            - { call: "POST /assistance/verifications/${ver}/complete", payload: { outcome: "PASSED", confirmed_amount_cents: 35000 }, as: Caseworker, as_user_id: "cw-2" }
            - call: "POST /assistance/applications/${app}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { award: $.data.active_award_id }
            - call: "POST /assistance/awards/${award}/payments"
              payload: { vendor_id: "${ven}", funding_source_id: "${src}", amount_cents: 20000, payment_date: "2026-08-02T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay1: $.data.id }
            - { call: "POST /assistance/awards/${award}/payments", payload: { vendor_id: "${ven}", funding_source_id: "${src}", amount_cents: 15000, payment_date: "2026-08-03T00:00:00Z" }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /assistance/payments/${pay1}/clear", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - call: "GET /assistance/households/${hh}/benefit-summary"
              payload: {}
              as: Auditor
              captures: { ytd_exp: $.data.ytd_exposure_cents, ytd_com: $.data.ytd_committed_cents }
          assert:
            - "benefit-summary.ytd_exposure_cents == 35000"
            - "benefit-summary.ytd_committed_cents == 20000"
            - "ytd_exposure_cents != ytd_committed_cents"
            - "benefit-summary.remaining_annual_cap_cents == 65000"
            - "benefit-summary.remaining_rent_cap_cents == 15000"

      - name: source_cash_vs_encumbrance_utilization
        grounds:
          - calculations.source_utilization_reporting
          - entities.FundingSource.fields.reserved_cents
        distinguishing_aspect: |
          On the FundingSource domain, the same rows yield cash_utilization_pct
          0.0 (committed only) versus encumbrance_utilization_pct 40.0
          (committed + reserved) while a 40000-cent award sits reserved-but-unpaid.
        test_recipe:
          setup:
            - "Policy ACTIVE (same limits as canonical); source B budget 100000; one RENT award of 40000 approved and entirely unpaid"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Ben Osei", address: "8 Elm Ave", phone: "555-0102", household_size: 2, annual_income_cents: 900000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "Grant B", funder_name: "Rotary", source_type: "GRANT_RESTRICTED", allowed_categories: ["RENT", "UTILITY"], period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 100000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { src: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 40000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
            - { call: "POST /assistance/applications/${app}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/ev-2.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_v: $.data.version }
            - { call: "POST /assistance/applications/${app}/duplication-checks", payload: { agency_name: "County HHS", expected_application_version: "${app_v}" }, as: Caseworker, as_user_id: "cw-1", captures: { dup: $.data.id } }
            - { call: "POST /assistance/duplication-checks/${dup}/resolve", payload: { result: "CLEARED" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "GET /assistance/applications/${app}"
              payload: {}
              as: Caseworker
              captures: { app_v2: $.data.version }
            - { call: "POST /assistance/applications/${app}/verifications", payload: { expected_application_version: "${app_v2}" }, as: Caseworker, as_user_id: "cw-2", captures: { ver: $.data.id } }
            - { call: "POST /assistance/verifications/${ver}/complete", payload: { outcome: "PASSED", confirmed_amount_cents: 40000 }, as: Caseworker, as_user_id: "cw-2" }
            - { call: "POST /assistance/applications/${app}/approve", payload: {}, as: ProgramManager, as_user_id: "pm-1" }
          trigger:
            - call: "GET /assistance/funding-sources/${src}/report"
              payload: {}
              as: Auditor
              captures: { cash_pct: $.data.cash_utilization_pct, enc_pct: $.data.encumbrance_utilization_pct }
          assert:
            - "report.cash_utilization_pct == 0.0"
            - "report.encumbrance_utilization_pct == 40.0"
            - "report.committed_cents == 0"
            - "report.reserved_cents == 40000"
            - "report.households_served == 0"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: award_amount_nested_min_category_cap_binds
        grounds:
          - calculations.award_amount_determination
          - calculations.household_benefit_usage
        distinguishing_aspect: |
          Mode (a): a 4-input nested min (requested 80000, confirmed 65000,
          remaining annual 65000, remaining rent-category 15000) where the
          category cap — not the request — binds, yielding exactly 15000.
        test_recipe:
          setup:
            - "Policy ACTIVE: max_annual 100000, rent_cap 50000, utility_cap 40000, income_limit 5000000"
            - "Same household already holds a 35000 RENT award this benefit year, so rem_annual = 65000 and rem_rent = 15000"
            - "Second application: RENT, requested 80000, vendor confirms 65000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 50000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Carla Nguyen", address: "5 Pine Rd", phone: "555-0103", household_size: 4, annual_income_cents: 1200000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "General Fund", funder_name: "First Church", source_type: "DONOR_UNRESTRICTED", allowed_categories: ["RENT", "UTILITY"], period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 200000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { src: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 35000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app1: $.data.id }
            - { call: "POST /assistance/applications/${app1}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/ev-3.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app1}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app1_v: $.data.version }
            - { call: "POST /assistance/applications/${app1}/duplication-checks", payload: { agency_name: "County HHS", expected_application_version: "${app1_v}" }, as: Caseworker, as_user_id: "cw-1", captures: { dup1: $.data.id } }
            - { call: "POST /assistance/duplication-checks/${dup1}/resolve", payload: { result: "CLEARED" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "GET /assistance/applications/${app1}"
              payload: {}
              as: Caseworker
              captures: { app1_v2: $.data.version }
            - { call: "POST /assistance/applications/${app1}/verifications", payload: { expected_application_version: "${app1_v2}" }, as: Caseworker, as_user_id: "cw-2", captures: { ver1: $.data.id } }
            - { call: "POST /assistance/verifications/${ver1}/complete", payload: { outcome: "PASSED", confirmed_amount_cents: 35000 }, as: Caseworker, as_user_id: "cw-2" }
            - { call: "POST /assistance/applications/${app1}/approve", payload: {}, as: ProgramManager, as_user_id: "pm-1" }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 80000, service_month: "2026-09" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app2: $.data.id }
            - { call: "POST /assistance/applications/${app2}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/ev-4.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app2}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app2_v: $.data.version }
            - { call: "POST /assistance/applications/${app2}/duplication-checks", payload: { agency_name: "County HHS", expected_application_version: "${app2_v}" }, as: Caseworker, as_user_id: "cw-1", captures: { dup2: $.data.id } }
            - { call: "POST /assistance/duplication-checks/${dup2}/resolve", payload: { result: "CLEARED" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "GET /assistance/applications/${app2}"
              payload: {}
              as: Caseworker
              captures: { app2_v2: $.data.version }
            - { call: "POST /assistance/applications/${app2}/verifications", payload: { expected_application_version: "${app2_v2}" }, as: Caseworker, as_user_id: "cw-2", captures: { ver2: $.data.id } }
            - { call: "POST /assistance/verifications/${ver2}/complete", payload: { outcome: "PASSED", confirmed_amount_cents: 65000 }, as: Caseworker, as_user_id: "cw-2" }
          trigger:
            - call: "POST /assistance/applications/${app2}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { award2: $.data.active_award_id }
          assert:
            - "Award.${award2}.awarded_amount_cents == 15000"
            - "15000 == min(80000, 65000, 65000, 15000) with the rent-category cap binding"
            - "FundingSource.${src}.reserved_cents == 50000"
            - "Household.${hh} benefit-summary ytd_exposure_cents == 50000"

      - name: award_adjust_proration_remainder_to_last_rank
        grounds:
          - calculations.award_reduction_proration
          - concurrency_rules[award-adjust-stale-award]
        distinguishing_aspect: |
          Mode (b): per-allocation floor rounding with the remainder pinned to the
          LAST-ranked allocation — the two equal 30000-cent allocations release
          2999 each while the 40000-cent last-ranked allocation releases 4001;
          any other rounding order yields different per-source numbers.
        test_recipe:
          setup:
            - "Sources: S1 [RENT] budget 40000 period_end 2026-12-31; S2 [RENT] budget 30000 period_end 2026-06-30; S3 [RENT] budget 30000 period_end 2026-09-30 — waterfall ranks S2 (rank 0), S3 (rank 1), S1 (rank 2) by period_end ASC"
            - "Award 100000 reserved 30000/30000/40000 across S2/S3/S1; no payments exist"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 200000, rent_cap_cents: 150000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Dan Ivers", address: "9 Birch Ln", phone: "555-0104", household_size: 2, annual_income_cents: 800000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "S1", funder_name: "Funder X", source_type: "GRANT_RESTRICTED", allowed_categories: ["RENT"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", total_budget_cents: 40000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { s1: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "S2", funder_name: "Funder Y", source_type: "GRANT_RESTRICTED", allowed_categories: ["RENT"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", total_budget_cents: 30000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { s2: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "S3", funder_name: "Funder Z", source_type: "GRANT_RESTRICTED", allowed_categories: ["RENT"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", total_budget_cents: 30000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { s3: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 100000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app: $.data.id }
            - { call: "POST /assistance/applications/${app}/documents", payload: { doc_type: "EVICTION_NOTICE", file_reference: "s3://docs/ev-5.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_v: $.data.version }
            - { call: "POST /assistance/applications/${app}/duplication-checks", payload: { agency_name: "County HHS", expected_application_version: "${app_v}" }, as: Caseworker, as_user_id: "cw-1", captures: { dup: $.data.id } }
            - { call: "POST /assistance/duplication-checks/${dup}/resolve", payload: { result: "CLEARED" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "GET /assistance/applications/${app}"
              payload: {}
              as: Caseworker
              captures: { app_v2: $.data.version }
            - { call: "POST /assistance/applications/${app}/verifications", payload: { expected_application_version: "${app_v2}" }, as: Caseworker, as_user_id: "cw-2", captures: { ver: $.data.id } }
            - { call: "POST /assistance/verifications/${ver}/complete", payload: { outcome: "PASSED", confirmed_amount_cents: 100000 }, as: Caseworker, as_user_id: "cw-2" }
            - call: "POST /assistance/applications/${app}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { award: $.data.active_award_id }
            - call: "GET /assistance/awards/${award}"
              payload: {}
              as: ProgramManager
              captures: { award_v: $.data.version }
          trigger:
            - call: "POST /assistance/awards/${award}/adjust"
              payload: { new_awarded_amount_cents: 90001, expected_award_version: "${award_v}" }
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "Award.${award}.awarded_amount_cents == 90001"
            - "allocation on ${s2}.allocated_cents == 27001 (floor(30000*9999/100000) = 2999 released)"
            - "allocation on ${s3}.allocated_cents == 27001 (2999 released)"
            - "allocation on ${s1}.allocated_cents == 35999 (remainder 9999-2999-2999 = 4001 released to LAST rank)"
            - "FundingSource.${s2}.reserved_cents == 27001 and FundingSource.${s3}.reserved_cents == 27001 and FundingSource.${s1}.reserved_cents == 35999"
            - "sum of allocated_cents == 90001 == award.awarded_amount_cents"

      - name: promotion_availability_evaluated_before_own_reservation
        grounds:
          - calculations.waitlist_promotion_sweep
          - calculations.allocation_waterfall
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency — a candidate's promotability
          depends on source availability, which itself changes when the candidate
          commits — is resolved by the pinned order: strict waitlisted_at order,
          availability read BEFORE each candidate's own reservation, commit before
          evaluating the next; W1 (50000) promotes even though W2's smaller
          15000-cent request would fit if the run were fit-sorted instead.
        test_recipe:
          setup:
            - "Source C [RENT] budget 10000 (insufficient for both apps); W1 (household H1, requested 50000, waitlisted 2026-08-01) older than W2 (household H2, requested 15000, waitlisted 2026-08-02)"
            - "deposit of 50000 raises available to 60000 before the run"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
            - call: "POST /assistance/policies"
              payload: { name: "P1", max_annual_benefit_cents: 100000, rent_cap_cents: 60000, utility_cap_cents: 40000, income_limit_cents: 5000000 }
              as: ProgramManager
              captures: { pol: $.data.id }
            - { call: "POST /assistance/policies/${pol}/activate", payload: {}, as: ProgramManager }
            - call: "POST /assistance/vendors"
              payload: { name: "Riverside Properties", vendor_type: "LANDLORD" }
              as: Caseworker
              captures: { ven: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Eva Park", address: "1 Cedar Way", phone: "555-0105", household_size: 3, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh1: $.data.id }
            - call: "POST /assistance/households"
              payload: { head_of_household_name: "Fred Lane", address: "2 Cedar Way", phone: "555-0106", household_size: 2, annual_income_cents: 1000000 }
              as: Caseworker
              captures: { hh2: $.data.id }
            - call: "POST /assistance/funding-sources"
              payload: { name: "C", funder_name: "Funder C", source_type: "GRANT_RESTRICTED", allowed_categories: ["RENT"], period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", total_budget_cents: 10000, max_per_household_cents: 1000000 }
              as: ProgramManager
              captures: { src: $.data.id }
            - call: "POST /assistance/applications"
              payload: { household_id: "${hh1}", vendor_id: "${ven}", category: "RENT", requested_amount_cents: 50000, service_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
