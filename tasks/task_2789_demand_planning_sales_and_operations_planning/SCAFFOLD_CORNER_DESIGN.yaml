              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${self_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${self_id}", month: "2026-09", level_units: 2000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: CustomerRep
              as_user_id: "${self_id}"
              captures: { err_create: $.data.error_id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "our own read of the market", expected_demand_forecast_version: "${fc_v0}" }
              as: CustomerRep
              as_user_id: "${self_id}"
              captures: { err_adjust: $.data.error_id }
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: CustomerRep
              as_user_id: "${self_id}"
              captures: { read_units: $.data.baseline_units }
          assert:
            - "${err_create} == \"ERR_UNAUTHORIZED\" at 403 — NOT ERR_DUPLICATE_FORECAST, even though the payload duplicates an existing (cycle, item, customer, month) line"
            - "${err_adjust} == \"ERR_UNAUTHORIZED\" at 403 — NOT ERR_UNAUTHORIZED_PHASE_ACTOR and NOT ERR_CUSTOMER_SCOPE_VIOLATION, because priority 20 precedes 60 and 70"
            - "${read_units} == 1000 — the same identity reads its own forecast successfully, so the denial is about the verb, not the row"
            - "GET /sop/demand-forecasts?cycle_id=${cycle_id} as SopAdmin returns total_count == 1 and GET /sop/consensus-adjustments returns total_count == 0"

      - name: customer_rep_reads_its_own_accuracy_record_and_is_rejected_on_a_foreign_one
