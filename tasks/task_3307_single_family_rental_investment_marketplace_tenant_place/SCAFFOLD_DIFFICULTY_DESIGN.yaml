  - rule_id: boundary_precision_check
    instances:
      - name: payment_late_grace_boundary
        grounds:
          - calculations.late_flag
          - entities.PaymentRecord.fields.late
        distinguishing_aspect: |
          Numeric threshold metric: LATE_GRACE_DAYS=5 with strict > semantics.
          Payment exactly at due_date + 5 days is NOT late; one second past is.
          Reached through POST /marketplace/leases/{id}/payment-records.
        test_recipe:
          setup:
            - "Seller S, listing L, lease LE (ACTIVE) with monthly_rent 100000; due 2026-01-01T00:00:00Z"
