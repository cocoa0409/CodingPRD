scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_account_creation_defaults
        claim_type: defaults
        grounds:
          - entities.CustomerAccount.fields.liability_tier
          - entities.CustomerAccount.fields.credit_hold
          - entities.CustomerAccount.fields.outstanding_liability_exposure_cents
        distinguishing_aspect: "Creating a customer with only a name applies liability_tier STANDARD, credit_hold false, exposure 0, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customer-accounts", payload: { name: "Defaults Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
          assert:
            - "CustomerAccount.${cust_id}.liability_tier == STANDARD"
            - "CustomerAccount.${cust_id}.credit_hold == false"
            - "CustomerAccount.${cust_id}.outstanding_liability_exposure_cents == 0"
            - "CustomerAccount.${cust_id}.version == 1"

      - name: work_order_intake_stamps_logical_clock_and_defaults
        claim_type: system_fields
        grounds:
          - entities.WorkOrder.fields.received_at
          - entities.WorkOrder.fields.promised_due_at
          - entities.WorkOrder.fields.processing_status
          - entities.WorkOrder.fields.quality_status
        distinguishing_aspect: "A RUSH order created without any clock-set gets received_at from the default logical clock 2026-08-01T00:00:00Z and promised_due_at = +48h; a STANDARD order gets promised_due_at null and quoted surcharge 0."
        test_recipe:
          setup: ["customer and APPROVED recipe exist; logical clock untouched at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Clock Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
          trigger:
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 48 }, as: CustomerServiceRep, captures: { wo_rush: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_std: $.data.id } }
          assert:
            - "WorkOrder.${wo_rush}.received_at == 2026-08-01T00:00:00Z (default logical clock, not wall clock)"
            - "WorkOrder.${wo_rush}.promised_due_at == 2026-08-03T00:00:00Z"
            - "WorkOrder.${wo_rush}.processing_status == RECEIVED and quality_status == PENDING_TEST and retreat_count == 0"
            - "WorkOrder.${wo_std}.service_lane == STANDARD, promised_due_at == null, rush_surcharge_quoted_cents == 0"

      - name: computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.CustomerAccount.fields.outstanding_liability_exposure_cents
        distinguishing_aspect: "Client-supplied values for computed fields are ignored: posting outstanding_liability_exposure_cents 999999 still yields 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /customer-accounts"
              payload: { name: "Sneaky Co", liability_tier: "STANDARD", outstanding_liability_exposure_cents: 999999 }
              as: CustomerServiceRep
              captures: { cust_id: $.data.id }
          assert:
            - "CustomerAccount.${cust_id}.outstanding_liability_exposure_cents == 0 (client input for computed field ignored)"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds:
          - entities.FurnaceRecipe.fields.quench_media
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "quench_media BRINE is not in {OIL, WATER, POLYMER, AIR, GAS} and is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /furnace-recipes"
              payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "BRINE", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.WorkOrder.fields.customer_id
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Work order creation without customer_id fails required-field validation."
        test_recipe:
          setup: ["one APPROVED recipe exists"]
          setup_api_calls:
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
          trigger:
            - call: "POST /work-orders"
              payload: { recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }
              as: CustomerServiceRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400 (missing customer_id)"

      - name: work_order_list_filtered_by_customer
        claim_type: parent_relationships
        grounds:
          - entities.WorkOrder.fields.customer_id
        distinguishing_aspect: "GET /work-orders?customer_id=X returns exactly X's orders and no others (FK reverse-reachability via filtered list)."
        test_recipe:
          setup: ["two customers; two orders for A and one for B"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "A Co" }, as: CustomerServiceRep, captures: { cust_a: $.data.id } }
            - { call: "POST /customer-accounts", payload: { name: "B Co" }, as: CustomerServiceRep, captures: { cust_b: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_a}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_a}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_b}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep }
          trigger:
            - { call: "GET /work-orders?customer_id=${cust_a}", payload: {}, as: CustomerServiceRep }
          assert:
            - "response total_count == 2 and every item's customer_id == ${cust_a}"

      - name: pyrometry_record_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.PyrometryRecord
        distinguishing_aspect: "PyrometryRecord has common_fields: false — its read payload carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["one furnace exists"]
          setup_api_calls:
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
          trigger:
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech, captures: { rec_id: $.data.id } }
          assert:
            - "PyrometryRecord.${rec_id} response contains id and created_at and no version or updated_at field"
            - "next_due_at == 2026-10-30T00:00:00Z (CLASS_3 TUS interval 90 days)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: ship_from_received_returns_not_shippable
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder.PROCESSED_to_SHIPPED
          - errors[ERR_WORK_ORDER_NOT_SHIPPABLE]
        distinguishing_aspect: "Ship is only valid from PROCESSED with quality PASSED/WAIVED; a RECEIVED order is rejected."
        test_recipe:
          setup: ["customer, APPROVED recipe, one RECEIVED work order"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Ship Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
          trigger:
            - call: "POST /work-orders/${wo_id}/ship"
              payload: {}
              as: CustomerServiceRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WORK_ORDER_NOT_SHIPPABLE with http 409; processing_status stays RECEIVED"

      - name: load_run_state_guards
        claim_type: invalid_transition
        grounds:
          - state_machines.LoadBatch.RELEASED_to_RUNNING
          - errors[ERR_LOAD_NOT_RELEASED]
          - errors[ERR_LOAD_NOT_RUNNING]
        distinguishing_aspect: "start-run on a BUILDING load fails with ERR_LOAD_NOT_RELEASED; complete-run and thermocouple readings on a BUILDING load fail with ERR_LOAD_NOT_RUNNING."
        test_recipe:
          setup: ["customer, APPROVED recipe, furnace, one BUILDING load"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Guard Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id } }
          trigger:
            - call: "POST /load-batches/${load_id}/start-run"
              payload: {}
              as: FurnaceOperator
              captures: { err_start: $.data.error_id }
            - call: "POST /load-batches/${load_id}/complete-run"
              payload: {}
              as: FurnaceOperator
              captures: { err_complete: $.data.error_id }
            - call: "POST /thermocouple-readings"
              payload: { load_batch_id: "${load_id}", channel: "LOAD_TC_1", recorded_at: "2026-08-02T10:00:00Z", temp_f: 1650 }
              as: FurnaceOperator
              captures: { err_reading: $.data.error_id }
          assert:
            - "start-run: error_id == ERR_LOAD_NOT_RELEASED (409)"
            - "complete-run: error_id == ERR_LOAD_NOT_RUNNING (409)"
            - "thermocouple-readings: error_id == ERR_LOAD_NOT_RUNNING (409); load stays BUILDING"

      - name: inspection_fail_creates_open_disposition_case
        claim_type: side_effect_execution
        grounds:
          - state_machines.InspectionTest
          - entities.DispositionCase.fields.status
        distinguishing_aspect: "A FAIL inspection cascades: quality_status PENDING_TEST -> FAILED and exactly one DispositionCase OPEN linked to that test; no case is created on PASS."
        test_recipe:
          setup:
            - "order processed to PROCESSED in a completed load on a QUALIFIED furnace"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Fail Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
          trigger:
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1", captures: { test_id: $.data.id, test_result: $.data.result } }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_id : "$.data[0].id", case_status : "$.data[0].status", case_test : "$.data[0].inspection_test_id" } }
          assert:
            - "InspectionTest.${test_id}.result == FAIL (avg 50.0 > hardness_max_hrc 44)"
            - "WorkOrder.${wo_id}.quality_status == FAILED"
            - "DispositionCase.${case_id}.status == OPEN and inspection_test_id == ${test_id} and work_order_id == ${wo_id}"

      - name: decide_twice_returns_not_open
        claim_type: idempotency
        grounds:
          - state_machines.DispositionCase.OPEN_to_DECIDED
          - errors[ERR_DISPOSITION_NOT_OPEN]
        distinguishing_aspect: "A second decide on a DECIDED case is rejected; DECIDED is terminal."
        test_recipe:
          setup:
            - "order processed and FAILed; DispositionCase OPEN"
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Twice Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_id : "$.data[0].id" } }
            - { call: "POST /disposition-cases/${case_id}/decide", payload: { decision: "RETURN_AS_IS" }, as: QualityEngineer, as_user_id: "qe-2" }
          trigger:
            - call: "POST /disposition-cases/${case_id}/decide"
              payload: { decision: "SCRAP" }
              as: QualityEngineer
              as_user_id: "qe-2"
              captures: { err: $.data.error_id }
          assert:
            - "First decide: case DECIDED with decision RETURN_AS_IS; WorkOrder.quality_status == WAIVED, processing_status stays PROCESSED"
            - "Second decide: error_id == ERR_DISPOSITION_NOT_OPEN with http 409; no further side effects (no LiabilityClaim created)"

      - name: cancel_scheduled_order_releases_assignment
        claim_type: side_effect_execution
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - state_machines.LoadAssignment.ACTIVE_to_REMOVED
        distinguishing_aspect: "Cancelling a SCHEDULED order compensates the assignment: assignment REMOVED, load total_weight_lb back to 0, LoadBatch.version incremented by the cascade."
        test_recipe:
          setup: ["customer, APPROVED recipe, furnace, BUILDING load with one 400 lb assignment (load version 2)"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Cancel Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 400, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler, captures: { asgmt_id: $.data.id } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/cancel", payload: {}, as: CustomerServiceRep }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_after_v: $.data.version, load_after_w: $.data.total_weight_lb } }
            - { call: "GET /load-assignments/${asgmt_id}", payload: {}, as: ShopScheduler, captures: { asgmt_status: $.data.status } }
          assert:
            - "WorkOrder.${wo_id}.processing_status == CANCELLED"
            - "LoadAssignment.${asgmt_id}.status == REMOVED"
