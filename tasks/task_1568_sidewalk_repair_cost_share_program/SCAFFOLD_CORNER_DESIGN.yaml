            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { cycle_v: "$.data.version", committed: "$.data.committed_cents" } }
          trigger:
            - { call: "POST /program-cycles/${cycle_id}/appropriation-adjustments", payload: { delta_cents: -10000000, expected_program_cycle_version: "${cycle_v}" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /program-cycles/${cycle_id}/appropriation-adjustments", payload: { delta_cents: -9940000, expected_program_cycle_version: "${cycle_v}" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { ap_after: "$.data.appropriation_cents", av_after: "$.data.available_cents" } }
          assert:
            - "committed == 60000"
            - "err == ERR_APPROPRIATION_BELOW_OBLIGATIONS (0 < 60000 committed; failed adjustment leaves version unchanged)"
            - "ap_after == 60000 and av_after == 0 (equality with committed + disbursed is allowed)"

