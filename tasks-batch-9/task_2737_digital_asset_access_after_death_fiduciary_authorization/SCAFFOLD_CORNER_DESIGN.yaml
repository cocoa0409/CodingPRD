      - name: newly_created_rows_start_in_their_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Document.initial_state
          - state_machines.PlatformRequest.initial_state
          - entities.AuthorityDirective.fields.status
          - entities.AuthorityDirective.fields.precedence_rank
          - entities.SubscriptionTerm.fields.state
          - entities.SubscriptionTerm.fields.term_days
        distinguishing_aspect: |
          Every stateful row is born in the state §1.2 declares and never in a later one: Document
          PENDING, PlatformRequest DRAFT with info_cycle_count 0 and a null resolved_scope,
          AuthorityDirective RECORDED with precedence_rank 1 for ONLINE_TOOL and 2 for
          WILL_PROVISION, SubscriptionTerm ACTIVE with term_days 365 computed from the inclusive
          date span, DigitalAsset UNVERIFIED plus PENDING plus ACTIVE billing for a subscription.
        test_recipe:
          setup:
            - "one SUBSCRIPTION platform 'StreamOne' with supports_online_tool true"
            - "one Estate with a Fiduciary and a VERIFIED death certificate plus VERIFIED letters"
            - "one SUBSCRIPTION asset with a 2026-01-01..2026-12-31 term"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "StreamOne", platform_type: "SUBSCRIPTION", form_code: "SO-FORM-4", review_window_days: 14, refund_policy: "PRORATA_DAILY", supports_online_tool: true, supports_transfer: false, supports_memorialization: false, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
