# =============================================================================
# SCAFFOLD.yaml — Municipal Transfer of Development Rights (TDR) Program
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Municipal Transfer of Development Rights (TDR) program: sending and receiving area
  designation with development right allocation formulas, conservation easement recording on
  sending parcels upon severance of rights, certificate issuance, registry maintenance and
  chain-of-title tracking for transferred rights, receiving site density bonus limits and
  design review requirements, private market transactions versus municipal bank purchase and
  resale, pricing, appraisal and equity concerns across neighborhoods, monitoring of easement
  compliance on preserved parcels, program evaluation on preservation acreage and receiving
  area absorption.

domain_name: transfer-of-development-rights-program
api_prefix: "/tdr"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # Certificates form a self-referential split lineage (parent_certificate_id), redemptions
  # are a many-to-many junction between Certificate and ReceivingSiteApplication, and
  # CertificateTransfer is an append-only edge log over (Certificate, Party, MarketTransaction).

  state_machine_shape: cyclic
  # SeveranceApplication and ReceivingSiteApplication both cycle through revision rounds;
  # Certificate and ConservationEasement each carry two independent state dimensions;
  # MarketTransaction branches into settle / cancel with a compensating reversal.

  relationship_patterns:
    - one_to_many          # SendingArea -> SendingParcel -> SeveranceApplication
    - many_to_many         # Certificate <-> ReceivingSiteApplication via CertificateRedemption
    - self_referential     # Certificate.parent_certificate_id (split lineage)
    - cross_aggregate      # CertificateRedemption.source_easement_id gates on easement compliance
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The SeveranceReviewer who records the APPROVE decision may not be the operator who
  # certifies (issues the certificate); Landowner/Developer are entity-backed peers.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Denser than the Expert band on purpose: the coupling is what carries the difficulty —
  # units are conserved across severance -> issuance -> split -> sale -> redemption -> retirement,
  # while cents are conserved across settlement and its compensating reversal.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Party
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: "Which side of the market this party sits on."
        constraints: "one of {LANDOWNER, DEVELOPER, MUNICIPAL_BANK}; exactly one MUNICIPAL_BANK party may exist"
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the landowner, developer, or the municipal TDR bank."
        constraints: "1..120 chars"
      - name: contact_email
        type: string
        source: input
        description: "Contact address of record."
        constraints: "must contain '@'"
      - name: neighborhood_code
        type: string
        source: input
        description: "Home neighborhood of the party, used only in equity reporting."
        default: null
        constraints: "1..24 chars when present"
      - name: cash_balance_cents
        type: integer
        source: system
        description: "Settlement account balance in integer cents; debited/credited by MarketTransaction settlement and reversal, and by administrative cash adjustments."
        default: 0
        constraints: ">= 0 at all times; a settlement that would drive it below 0 is rejected"
      - name: fee_revenue_cents
        type: integer
        source: system
        description: "Program fee and equity surcharge revenue accrued to this party; only the MUNICIPAL_BANK party ever holds a non-zero value."
        default: 0
        constraints: ">= 0"
      - name: units_held
        type: integer
        source: computed
        description: "Sum of Certificate.units_remaining over certificates whose holder_party_id equals this party and whose lifecycle_status IN {ISSUED, PARTIALLY_REDEEMED}."
        default: 0
      - name: certificates_held_count
        type: integer
        source: computed
        description: "Count of certificates whose holder_party_id equals this party and whose lifecycle_status IN {ISSUED, PARTIALLY_REDEEMED}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Party participation status; a SUSPENDED party may not create, settle, or redeem anything."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED is produced by POST /tdr/parties/{id}/account-actions with action=SUSPEND, ACTIVE is restored with action=REINSTATE"

  - name: SendingArea
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short designation code of the sending area."
        constraints: "unique across SendingArea and ReceivingArea; 3..16 chars"
      - name: name
        type: string
        source: input
        description: "Human-readable designation name."
      - name: neighborhood_code
        type: string
        source: input
        description: "Neighborhood this sending area belongs to; joins to AppraisalSchedule.neighborhood_code for pricing."
        constraints: "1..24 chars"
      - name: allocation_formula_version
        type: enum
        source: input
        description: "Which development-right allocation formula the designating ordinance adopted for this area."
        constraints: "one of {V1_NET_ACRE, V2_GROSS_DISCOUNTED}"
      - name: base_rate_units_per_acre
        type: number
        source: input
        description: "Base development rights granted per eligible acre."
        constraints: "> 0 and <= 4; 2 decimal places"
      - name: gross_discount_factor
        type: number
        source: input
        description: "Discount applied to gross acreage under V2_GROSS_DISCOUNTED; ignored under V1_NET_ACRE."
        default: 0.80
        constraints: "> 0 and <= 1; 2 decimal places"
      - name: equity_tier
        type: enum
        source: input
        description: "Neighborhood equity classification that sets the equity surcharge basis points on transactions in rights originating here."
        constraints: "one of {HIGH_VALUE, MODERATE, UNDERSERVED}"
      - name: sending_cap_units
        type: integer
        source: input
        description: "Program cap on total development rights severable from this area."
        constraints: "> 0"
      - name: severed_units_total
        type: integer
        source: computed
        description: "Sum of SeveranceApplication.allocated_units over applications on parcels in this area whose status == CERTIFIED."
        default: 0
      - name: issued_certificate_count
        type: integer
        source: system
        description: "Monotonic counter of root certificates issued from this area; feeds the deterministic serial number sequence."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Designation lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, CLOSED}"

  - name: ReceivingArea
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short designation code of the receiving area."
        constraints: "unique across SendingArea and ReceivingArea; 3..16 chars"
      - name: name
        type: string
        source: input
        description: "Human-readable designation name."
      - name: neighborhood_code
        type: string
        source: input
        description: "Neighborhood this receiving area belongs to; used in equity reporting."
        constraints: "1..24 chars"
      - name: base_density_units_per_acre
        type: number
        source: input
        description: "As-of-right density used to derive a receiving site's base_units."
        constraints: "> 0 and <= 40; 2 decimal places"
      - name: max_bonus_pct
        type: number
        source: input
        description: "Ceiling on density bonus as a fraction of base_units before site-acre tiering."
        constraints: "> 0 and <= 1; 2 decimal places"
      - name: absorption_cap_units
        type: integer
        source: input
        description: "Total bonus units this receiving area may absorb across all receiving sites."
        constraints: "> 0"
      - name: design_review_required
        type: boolean
        source: input
        description: "When true a receiving site application must clear design review before it may be finalized."
        default: true
      - name: eligible_sending_area_codes
        type: array
        source: input
        description: "Whitelist of SendingArea.code values whose certificates may be redeemed here; an empty array means every sending area is eligible."
        default: []
      - name: absorbed_units
        type: integer
        source: computed
        description: "Sum of CertificateRedemption.units over redemptions on this area's applications whose status == CONFIRMED."
        default: 0
      - name: reserved_units
        type: integer
        source: computed
        description: "Sum of CertificateRedemption.units over redemptions on this area's applications whose status IN {ALLOCATED, HELD_PENDING_COMPLIANCE}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Designation lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED}"

  - name: AppraisalSchedule
    parent: null
    common_fields: true
    fields:
      - name: neighborhood_code
        type: string
        source: input
        description: "Neighborhood this per-unit valuation applies to."
        constraints: "1..24 chars"
      - name: per_unit_value_cents
        type: integer
        source: input
        description: "Appraised value of one development right in this neighborhood, in integer cents."
        constraints: "> 0"
      - name: equity_adjustment_bps
        type: integer
        source: input
        description: "Signed basis-point adjustment applied to per_unit_value_cents to correct historic under-appraisal."
        default: 0
        constraints: "-5000 <= value <= 5000"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the effectivity interval (ISO 8601 UTC, three fractional digits)."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the effectivity interval; null means open-ended."
        default: null
      - name: status
        type: enum
        source: system
        description: "Schedule state."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}; SUPERSEDED is set when a new schedule for the same neighborhood_code declares an effective_from equal to this row's effective_from"

  - name: SendingParcel
    parent: null
    common_fields: true
    fields:
      - name: owner_party_id
        type: string
        source: input
        description: "FK -> Party.id; the landowner of record. Party.kind MUST be LANDOWNER."
      - name: sending_area_id
        type: string
        source: input
        description: "FK -> SendingArea.id; the designated sending area containing this parcel."
      - name: apn
        type: string
        source: input
        description: "Assessor parcel number."
        constraints: "unique across SendingParcel; 4..24 chars"
      - name: gross_acres
        type: number
        source: input
        description: "Total parcel acreage."
        constraints: "> 0; 2 decimal places"
      - name: constrained_acres
        type: number
        source: input
        description: "Acreage that is wetland, floodway, or otherwise undevelopable."
        default: 0
        constraints: ">= 0 and <= gross_acres; 2 decimal places"
      - name: soil_class
        type: enum
        source: input
        description: "Agricultural soil classification driving the allocation multiplier."
        constraints: "one of {PRIME, STATEWIDE, LOCAL, NONE}"
      - name: existing_dwelling_units
        type: integer
        source: input
        description: "Dwelling units already built on the parcel; each one consumes one allocated right."
        default: 0
        constraints: ">= 0"
      - name: baseline_allocation_units
        type: integer
        source: computed
        description: "Development rights this parcel is allocated, produced by calculations.parcel_baseline_allocation at creation and never recomputed afterwards."
      - name: severed_units
        type: integer
        source: computed
        description: "Sum of SeveranceApplication.allocated_units over this parcel's applications whose status == CERTIFIED."
        default: 0
      - name: remaining_units
        type: integer
        source: computed
        description: "baseline_allocation_units - severed_units."
      - name: restricted_acres
        type: number
        source: computed
        description: "Acreage currently encumbered by this parcel's conservation easement; 0 until the first certification."
        default: 0
      - name: easement_status
        type: enum
        source: system
        description: "Whether a conservation easement has been recorded against this parcel."
        default: NONE
        constraints: "one of {NONE, RECORDED}"
      - name: parcel_status
        type: enum
        source: system
        description: "Severance progress of the parcel."
        default: UNSEVERED
        constraints: "one of {UNSEVERED, PARTIALLY_SEVERED, FULLY_SEVERED}"

  - name: SeveranceApplication
    parent: SendingParcel
    common_fields: true
    fields:
      - name: sending_parcel_id
        type: string
        source: input
        description: "FK -> SendingParcel.id; the parcel whose rights are to be severed."
      - name: applicant_party_id
        type: string
        source: input
        description: "FK -> Party.id; MUST equal SendingParcel.owner_party_id of the referenced parcel."
      - name: requested_units
        type: integer
        source: input
        description: "Development rights the landowner asks to sever."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle state; see state_machines[entity=SeveranceApplication]."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, CERTIFIED, DENIED, SUSPENDED}"
      - name: revision_round
        type: integer
        source: system
        description: "Number of completed resubmissions; incremented by POST /tdr/severance-applications/{id}/resubmit."
        default: 0
        constraints: "<= 2 (MAX_REVISION_ROUNDS)"
      - name: screened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SeveranceReviewer who moved the application to UNDER_REVIEW."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SeveranceReviewer who recorded the APPROVE or DENY decision."
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramAdministrator who certified the approved application; MUST differ from decided_by_user_id."
        default: null
      - name: allocated_units
        type: integer
        source: computed
        description: "Units granted by calculations.severance_allocation_grant at APPROVE; null before approval."
        default: null
      - name: applied_formula_version
        type: enum
        source: computed
        description: "Copy of SendingArea.allocation_formula_version pinned at APPROVE so a later ordinance change cannot restate a decided grant."
        default: null
        constraints: "one of {V1_NET_ACRE, V2_GROSS_DISCOUNTED}"
      - name: residual_units_retained
        type: integer
        source: computed
        description: "parcel.remaining_units - allocated_units evaluated at APPROVE; the rights the owner keeps."
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Reviewer note captured with a screen/decision/resubmit action."
        default: null
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded when status becomes DENIED or SUSPENDED."
        default: null

  - name: ConservationEasement
    parent: SendingParcel
    common_fields: true
    fields:
      - name: sending_parcel_id
        type: string
        source: input
        description: "FK -> SendingParcel.id; at most one easement exists per parcel."
      - name: severance_application_id
        type: string
        source: input
        description: "FK -> SeveranceApplication.id; the application whose certification first created this easement (not updated by later amendments)."
      - name: recording_reference
        type: string
        source: system
        description: "Deterministic register reference minted at recording as 'EAS-{parcel.apn}-{amendment_count + 1}'."
        constraints: "unique across ConservationEasement"
      - name: restricted_acres
        type: number
        source: computed
        description: "Cumulative acreage encumbered, produced by calculations.easement_restriction_extent; 2 decimal places."
      - name: permitted_residual_units
        type: integer
        source: computed
        description: "parcel.existing_dwelling_units + parcel.remaining_units evaluated at the most recent recording or amendment; the buildable envelope left on the preserved parcel."
      - name: units_issued_total
        type: integer
        source: computed
        description: "Sum of SeveranceApplication.allocated_units over CERTIFIED applications on this parcel; grows on each amendment."
        default: 0
      - name: units_redeemed_confirmed
        type: integer
        source: computed
        description: "Sum of CertificateRedemption.units where source_easement_id == this easement and status == CONFIRMED."
        default: 0
      - name: units_retired
        type: integer
        source: computed
        description: "Sum of CertificateTransfer.units where transfer_type == RETIREMENT over certificates whose conservation_easement_id == this easement."
        default: 0
      - name: units_outstanding
        type: integer
        source: computed
        description: "units_issued_total - units_redeemed_confirmed - units_retired; the conserved rights quantity for this easement."
        default: 0
      - name: amendment_count
        type: integer
        source: system
        description: "Number of amendments recorded after the original recording."
        default: 0
      - name: recording_status
        type: enum
        source: system
        description: "Register dimension of the easement's parallel state; independent of compliance_status."
        default: PENDING_RECORDING
        constraints: "one of {PENDING_RECORDING, RECORDED, AMENDED}"
      - name: compliance_status
        type: enum
        source: system
        description: "Stewardship dimension of the easement's parallel state; independent of recording_status."
        default: COMPLIANT
        constraints: "one of {COMPLIANT, VIOLATION_NOTICED, UNDER_CURE, CURED, ESCALATED}"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant at which recording_status first became RECORDED."
        default: null
      - name: last_inspection_at
        type: datetime
        source: system
        description: "inspection_date of the most recently created MonitoringInspection on this easement."
        default: null
      - name: prior_violation_count
        type: integer
        source: system
        description: "Number of MonitoringInspection rows on this easement whose finding IN {MINOR_VIOLATION, MAJOR_VIOLATION} that already reached status CURED or ESCALATED; feeds the severity history component."
        default: 0
      - name: cure_deadline
        type: datetime
        source: system
        description: "cure_deadline of the open violation inspection, or null when compliance_status IN {COMPLIANT, CURED}."
        default: null

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: conservation_easement_id
        type: string
        source: input
        description: "FK -> ConservationEasement.id; the easement whose severance backs these rights."
      - name: holder_party_id
        type: string
        source: input
        description: "FK -> Party.id; current holder of record in the registry."
      - name: parent_certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; set on certificates minted by a split, null on root certificates issued at certification."
        default: null
      - name: origin_sending_area_id
        type: string
        source: input
        description: "FK -> SendingArea.id; the sending area the rights originate from, copied down the split lineage unchanged."
      - name: serial_number
        type: string
        source: system
        description: "Deterministic registry serial: root certificates get 'TDR-{area.code}-{area.issued_certificate_count after increment, 5 digits zero-padded}'; split children append '-S{parent.split_count after increment}' to the parent serial."
        constraints: "unique across Certificate"
      - name: origin_neighborhood_code
        type: string
        source: system
        description: "Copy of the origin sending area's neighborhood_code at issuance; pins which AppraisalSchedule prices these rights even if the area is later re-coded."
      - name: generation
        type: integer
        source: system
        description: "1 for a root certificate; parent.generation + 1 for a split child."
        default: 1
      - name: split_count
        type: integer
        source: system
        description: "Number of children split off this certificate; feeds the child serial suffix."
        default: 0
      - name: units_face
        type: integer
        source: system
        description: "Units the certificate was minted with (allocated_units at issuance, or the split units for a child)."
      - name: units_remaining
        type: integer
        source: computed
        description: "units_face - units_split_out - units_redeemed - units_retired; the units this certificate can still convey."
      - name: units_split_out
        type: integer
        source: computed
        description: "Sum of units moved to child certificates by splits."
        default: 0
      - name: units_encumbered
        type: integer
        source: computed
        description: "Subset of units_remaining tied to CertificateRedemption rows with status IN {ALLOCATED, HELD_PENDING_COMPLIANCE}; units_remaining - units_encumbered is what a new split or allocation may consume."
        default: 0
      - name: units_redeemed
        type: integer
        source: computed
        description: "Sum of CertificateRedemption.units on this certificate whose status == CONFIRMED."
        default: 0
      - name: units_retired
        type: integer
        source: computed
        description: "Units permanently extinguished by POST /tdr/certificates/{id}/retire."
        default: 0
      - name: lifecycle_status
        type: enum
        source: system
        description: "Rights dimension of the certificate's parallel state; advances only while market_status == HELD."
        default: ISSUED
        constraints: "one of {ISSUED, PARTIALLY_REDEEMED, REDEEMED, RETIRED}"
      - name: market_status
        type: enum
        source: system
        description: "Tradability dimension of the certificate's parallel state; evolves independently of lifecycle_status."
        default: HELD
        constraints: "one of {HELD, UNDER_CONTRACT, FROZEN}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issuance or of the split that minted this certificate."

  - name: CertificateTransfer
    parent: Certificate
    common_fields: false
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; the certificate whose chain of title this row extends."
      - name: from_party_id
        type: string
        source: input
        description: "FK -> Party.id; transferor, null for ISSUANCE and SPLIT_OUT rows."
        default: null
      - name: to_party_id
        type: string
        source: input
        description: "FK -> Party.id; transferee, null for REDEMPTION and RETIREMENT rows."
        default: null
      - name: market_transaction_id
        type: string
        source: input
        description: "FK -> MarketTransaction.id; set on PRIVATE_SALE, BANK_PURCHASE, BANK_RESALE, and REVERSAL rows, null otherwise."
        default: null
      - name: seq_no
        type: integer
        source: system
        description: "Chain-of-title sequence number within one certificate, starting at 1 and incremented by one per appended row."
        constraints: "unique per (certificate_id, seq_no)"
      - name: transfer_type
        type: enum
        source: system
        description: "Registry event kind."
        constraints: "one of {ISSUANCE, PRIVATE_SALE, BANK_PURCHASE, BANK_RESALE, SPLIT_OUT, REDEMPTION, RETIREMENT, REVERSAL}"
      - name: units
        type: integer
        source: system
        description: "Units conveyed, split out, redeemed, retired, or restored by this event."
        constraints: "> 0"
      - name: price_cents
        type: integer
        source: system
        description: "MarketTransaction.gross_price_cents for market events, null for ISSUANCE, SPLIT_OUT, REDEMPTION, and RETIREMENT."
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the row was appended."

  - name: MarketTransaction
    parent: null
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; the certificate being conveyed."
      - name: seller_party_id
        type: string
        source: input
        description: "FK -> Party.id; MUST equal Certificate.holder_party_id at proposal time."
      - name: buyer_party_id
        type: string
        source: input
        description: "FK -> Party.id; the transferee."
      - name: channel
        type: enum
        source: input
        description: "PRIVATE is a landowner-to-developer market deal at an agreed price; BANK_PURCHASE is the municipal bank buying rights at the administered discount; BANK_RESALE is the bank selling rights at the administered markup."
        constraints: "one of {PRIVATE, BANK_PURCHASE, BANK_RESALE}"
      - name: units
        type: integer
        source: input
        description: "Units conveyed; MUST be <= certificate.units_remaining - certificate.units_encumbered."
        constraints: "> 0"
      - name: agreed_price_cents
        type: integer
        source: input
        description: "Negotiated gross price for channel PRIVATE; MUST be omitted for BANK_PURCHASE and BANK_RESALE, which are priced from the appraisal schedule."
        default: null
        constraints: "> 0 when present"
      - name: applied_neighborhood_code
        type: string
        source: computed
        description: "Certificate.origin_neighborhood_code at proposal time; the neighborhood whose AppraisalSchedule priced this deal."
      - name: applied_per_unit_value_cents
        type: integer
        source: computed
        description: "Equity-adjusted per-unit value from calculations.appraisal_reference_value (round_half_up to whole cents per unit)."
      - name: appraised_reference_cents
        type: integer
        source: computed
        description: "applied_per_unit_value_cents * units; the equity-adjusted appraisal benchmark the deal is measured against."
      - name: gross_price_cents
        type: integer
        source: computed
        description: "agreed_price_cents for PRIVATE; calculations.bank_channel_price output for BANK_PURCHASE and BANK_RESALE."
      - name: price_deviation_bps
        type: integer
        source: computed
        description: "round_half_up((gross_price_cents - appraised_reference_cents) / appraised_reference_cents * 10000); signed."
      - name: program_fee_cents
        type: integer
        source: computed
        description: "Program fee from calculations.settlement_split step 3."
      - name: equity_surcharge_cents
        type: integer
        source: computed
        description: "Neighborhood equity surcharge from calculations.settlement_split step 4."
      - name: net_to_seller_cents
        type: integer
        source: computed
        description: "gross_price_cents - program_fee_cents - equity_surcharge_cents."
      - name: status
        type: enum
        source: system
        description: "Deal lifecycle; see state_machines[entity=MarketTransaction]."
        default: PROPOSED
        constraints: "one of {PROPOSED, SETTLED, REVERSED, CANCELLED}"
      - name: conveyance_mode
        type: enum
        source: computed
        description: "WHOLE when units == certificate.units_remaining at settlement (the certificate itself changes hands); PARTIAL when units < units_remaining (settlement splits a child certificate to the buyer). Pinned at settlement, null while PROPOSED."
        default: null
        constraints: "one of {WHOLE, PARTIAL}"
      - name: conveyed_certificate_id
        type: string
        source: computed
        description: "FK -> Certificate.id; the certificate the buyer ends up holding: equal to certificate_id for WHOLE, the newly minted child id for PARTIAL. Null while PROPOSED."
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of settlement."
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical-clock instant of reversal."
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: "Reason recorded on reversal."
        default: null

  - name: ReceivingSiteApplication
    parent: null
    common_fields: true
    fields:
      - name: developer_party_id
        type: string
        source: input
        description: "FK -> Party.id; applicant. Party.kind MUST be DEVELOPER."
      - name: receiving_area_id
        type: string
        source: input
        description: "FK -> ReceivingArea.id; the designated receiving area the site sits in."
      - name: site_acres
        type: number
        source: input
        description: "Receiving site acreage."
        constraints: "> 0; 2 decimal places"
      - name: requested_bonus_units
        type: integer
        source: input
        description: "Density bonus units the developer asks for."
        constraints: "> 0"
      - name: base_units
        type: integer
        source: computed
        description: "floor(site_acres * area.base_density_units_per_acre); the as-of-right yield."
      - name: max_bonus_units
        type: integer
        source: computed
        description: "Ceiling on bonus units from calculations.receiving_bonus_units after site-acre tiering."
      - name: required_backing_units
        type: integer
        source: computed
        description: "min(requested_bonus_units, max_bonus_units); the live certificate backing the application must hold to stay eligible for finalization."
      - name: provisional_bonus_units
        type: integer
        source: computed
        description: "Pre-design-review bonus indication (PROVISIONAL variant of calculations.receiving_bonus_units); recomputed on every design resubmission."
      - name: allocated_bonus_units
        type: integer
        source: computed
        description: "Bonus units actually granted (FINAL variant of calculations.receiving_bonus_units); 0 from intake until FINALIZED, then the computed grant."
        default: 0
      - name: backed_units
        type: integer
        source: computed
        description: "Sum of CertificateRedemption.units on this application whose status == CONFIRMED."
        default: 0
      - name: pending_backed_units
        type: integer
        source: computed
        description: "Sum of CertificateRedemption.units on this application whose status == ALLOCATED (units in HELD_PENDING_COMPLIANCE are excluded — that exclusion is what drives BACKING_DEFICIENT)."
        default: 0
      - name: design_review_round
        type: integer
        source: system
        description: "Completed design resubmissions; incremented by POST /tdr/receiving-site-applications/{id}/resubmit-design."
        default: 0
        constraints: "<= 2 (MAX_DESIGN_ROUNDS)"
      - name: design_reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DesignReviewBoard member who recorded the latest design decision."
        default: null
      - name: status
        type: enum
        source: system
        description: "Entitlement lifecycle; see state_machines[entity=ReceivingSiteApplication]."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, DESIGN_REVIEW, REVISIONS_REQUIRED, DESIGN_APPROVED, BACKING_DEFICIENT, FINALIZED, DENIED}"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant the permit bonus was finalized."
        default: null
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded when status becomes DENIED."
        default: null

  - name: CertificateRedemption
    parent: ReceivingSiteApplication
    common_fields: true
    fields:
      - name: receiving_site_application_id
        type: string
        source: input
        description: "FK -> ReceivingSiteApplication.id; the application these units back."
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; the certificate the units are drawn from. Its holder_party_id MUST equal the application's developer_party_id."
      - name: source_easement_id
        type: string
        source: input
        description: "FK -> ConservationEasement.id; denormalized copy of the certificate's conservation_easement_id, recorded so compliance gating and the rights-conservation invariant can be evaluated without walking the split lineage."
      - name: units
        type: integer
        source: input
        description: "Units allocated from the certificate to this application."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle; see state_machines[entity=CertificateRedemption]."
        default: ALLOCATED
        constraints: "one of {ALLOCATED, HELD_PENDING_COMPLIANCE, CONFIRMED, RELEASED}"
      - name: allocated_at
        type: datetime
        source: system
        description: "Logical-clock instant of allocation."
      - name: confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant the allocation was confirmed at finalization."
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the allocation was released back to the certificate."
        default: null

  - name: MonitoringInspection
    parent: ConservationEasement
    common_fields: true
    fields:
      - name: conservation_easement_id
        type: string
        source: input
        description: "FK -> ConservationEasement.id; the preserved parcel's easement being monitored."
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the EasementMonitor who filed the inspection."
      - name: inspection_date
        type: datetime
        source: input
        description: "Date of the site visit; MUST NOT be after the current logical clock."
      - name: finding
        type: enum
        source: input
        description: "Stewardship finding of the visit."
        constraints: "one of {COMPLIANT, MINOR_VIOLATION, MAJOR_VIOLATION}"
      - name: affected_acres
        type: number
        source: input
        description: "Acreage within the easement area found in violation."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: severity_score
        type: number
        source: computed
        description: "Weighted violation score from calculations.violation_severity_score; 2 decimal places, 0.00..100.00."
      - name: cure_deadline
        type: datetime
        source: computed
        description: "inspection_date + the cure window selected by the severity band; null when finding == COMPLIANT."
        default: null
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle; see state_machines[entity=MonitoringInspection]."
        default: OPEN
        constraints: "one of {OPEN, CURE_PENDING, CURED, ESCALATED, CLOSED}"
      - name: cure_verified_at
        type: datetime
        source: system
        description: "Logical-clock instant a cure verification recorded outcome CURED."
        default: null
      - name: cure_verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the EasementMonitor who verified the cure."
        default: null
      - name: escalated_at
        type: datetime
        source: system
        description: "Logical-clock instant the compliance sweep escalated this inspection."
        default: null
      - name: note
        type: string
        source: input
        description: "Free-text field note."
        default: null

  - name: ProgramEvaluation
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the evaluation window."
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive end of the evaluation window; MUST be after period_start. Both ends are inclusive at date granularity, matching calculations.program_evaluation_metrics."
      - name: equity_weighting
        type: enum
        source: input
        description: "Which weighting the equity_index uses; the two weightings are both valid readings of the same preservation record and produce different indices."
        constraints: "one of {ACREAGE_WEIGHTED, PARCEL_COUNT_WEIGHTED}"
      - name: preserved_acres
        type: number
        source: computed
        description: "Sum of ConservationEasement.restricted_acres over in-scope easements; 2 decimal places."
      - name: easement_count
        type: integer
        source: computed
        description: "Count of in-scope easements."
      - name: issued_units
        type: integer
        source: computed
        description: "Sum of Certificate.units_face over certificates whose issued_at date falls inside the window."
      - name: redeemed_units
        type: integer
        source: computed
        description: "Sum of CertificateRedemption.units with status == CONFIRMED and confirmed_at inside the window."
      - name: retired_units
        type: integer
        source: computed
        description: "Sum of Certificate.units_retired over certificates whose issued_at date falls inside the window."
      - name: absorption_pct
        type: number
        source: computed
        description: "Sum of ReceivingArea.absorbed_units divided by the sum of ReceivingArea.absorption_cap_units over areas with status IN {ACTIVE, SUSPENDED}, times 100; 2 decimal places, 0.00 when the denominator is 0."
      - name: equity_index
        type: number
        source: computed
        description: "Share of preservation attributable to UNDERSERVED sending areas under the selected weighting; 2 decimal places."
      - name: outstanding_units
        type: integer
        source: computed
        description: "Sum of ConservationEasement.units_outstanding over ALL easements regardless of window; the program-wide conserved rights quantity."
      - name: total_cash_cents
        type: integer
        source: computed
        description: "Sum of Party.cash_balance_cents plus Party.fee_revenue_cents over ALL parties regardless of window; the program-wide conserved money quantity."
      - name: status
        type: enum
        source: system
        description: "Report state."
        default: COMPUTED
        constraints: "one of {COMPUTED, SUPERSEDED}; an existing COMPUTED report whose (period_start, period_end) pair equals the new report's is set to SUPERSEDED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: SendingArea
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tdr/sending-areas/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "status == DRAFT, else ERR_AREA_NOT_DRAFT"
        side_effects:
          - "increments SendingArea.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /tdr/sending-areas/{id}/close"
        actor: ProgramAdministrator
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "runs exactly the same sibling-suspension cascade as the system-triggered close below: every SeveranceApplication on a parcel in this area whose status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED} moves to SUSPENDED with denial_reason 'SENDING_AREA_CLOSED'"
          - "increments SendingArea.version by 1 and the version of every suspended SeveranceApplication by 1"
        note: "An APPROVED application is left APPROVED — it simply becomes uncertifiable, because APPROVED -> CERTIFIED requires SendingArea.status == ACTIVE."
      - from: ACTIVE
        to: CLOSED
        trigger: "system: evaluated at the end of POST /tdr/severance-applications/{id}/certify, when the recomputed severed_units_total >= sending_cap_units"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "severed_units_total >= sending_cap_units (recomputed value, inclusive comparison)"
        side_effects:
          - "sets every SeveranceApplication whose sending_parcel_id points at a parcel in this area and whose status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED} to SUSPENDED with denial_reason 'SENDING_AREA_CLOSED' (cascade link 4 of transitive_cascade.certification_closes_area)"
          - "increments SendingArea.version by 1 and the version of every suspended SeveranceApplication by 1"
        note: "Cap exhaustion is inclusive: reaching the cap exactly closes the area."

  - entity: ReceivingArea
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /tdr/receiving-areas/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "status == DRAFT, else ERR_AREA_NOT_DRAFT"
        side_effects:
          - "increments ReceivingArea.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: evaluated at the end of POST /tdr/receiving-site-applications/{id}/finalize, when the recomputed absorbed_units >= absorption_cap_units"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "absorbed_units >= absorption_cap_units (recomputed value, inclusive comparison)"
        side_effects:
          - "increments ReceivingArea.version by 1"
          - "later POST /tdr/receiving-site-applications naming this area are rejected with ERR_RECEIVING_AREA_NOT_ACTIVE; applications already in flight keep their status"

  - entity: SeveranceApplication
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, DENIED, SUSPENDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /tdr/severance-applications/{id}/screen"
        actor: SeveranceReviewer
        preconditions:
          - "status == SUBMITTED"
          - "SendingArea.status == ACTIVE for the parcel's area (cross_entity_state_dependency: SeveranceApplication -> SendingArea)"
          - "SendingParcel.parcel_status != FULLY_SEVERED"
        side_effects:
          - "sets screened_by_user_id to the acting X-User-ID"
          - "increments SeveranceApplication.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /tdr/severance-applications/{id}/review-decision with decision=REQUIRE_REVISION"
        actor: SeveranceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "revision_round < 2 (MAX_REVISION_ROUNDS)"
        side_effects:
          - "stores decision_note"
          - "increments SeveranceApplication.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /tdr/severance-applications/{id}/resubmit"
        actor: Landowner
        preconditions:
          - "status == REVISION_REQUESTED"
          - "acting X-User-ID == applicant_party_id"
          - "revision_round + 1 <= 2 (MAX_REVISION_ROUNDS)"
        side_effects:
          - "increments revision_round by 1"
          - "replaces requested_units with the resubmitted value"
          - "clears screened_by_user_id back to null so the next screening is recorded afresh"
          - "increments SeveranceApplication.version by 1"
        note: "Closes the review cycle SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tdr/severance-applications/{id}/review-decision with decision=APPROVE"
        actor: SeveranceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "SendingArea.status == ACTIVE"
          - "calculations.severance_allocation_grant yields allocated_units >= 1, else ERR_NO_ALLOCABLE_UNITS"
        side_effects:
          - "runs calculations.severance_allocation_grant and writes allocated_units and residual_units_retained"
          - "pins applied_formula_version from the area's allocation_formula_version"
          - "sets decided_by_user_id to the acting X-User-ID"
          - "increments SeveranceApplication.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /tdr/severance-applications/{id}/review-decision with decision=DENY"
        actor: SeveranceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "sets denial_reason from decision_note (or 'DENIED_ON_REVIEW' when omitted)"
          - "sets decided_by_user_id to the acting X-User-ID"
          - "increments SeveranceApplication.version by 1"
      - from: APPROVED
        to: CERTIFIED
        trigger: "POST /tdr/severance-applications/{id}/certify"
        actor: ProgramAdministrator
        preconditions:
          - "status == APPROVED"
          - "acting X-User-ID != decided_by_user_id (segregation of duties), else ERR_SEGREGATION_OF_DUTIES"
          - "SendingArea.status == ACTIVE"
          - "allocated_units >= 1"
        side_effects:
          - "sets certified_by_user_id to the acting X-User-ID"
          - "cascade link 1: when the parcel has no ConservationEasement, creates one with recording_status PENDING_RECORDING and immediately advances it to RECORDED (recorded_at = current logical clock, recording_reference = 'EAS-{apn}-1'); when an easement already exists, that easement's recording_status moves RECORDED -> AMENDED, amendment_count += 1, and recording_reference is re-minted as 'EAS-{apn}-{amendment_count + 1}'"
          - "cascade link 2 (caused by link 1's recording/amendment): recomputes ConservationEasement.restricted_acres and permitted_residual_units via calculations.easement_restriction_extent, sets units_issued_total += allocated_units and units_outstanding accordingly, and sets SendingParcel.easement_status = RECORDED, SendingParcel.restricted_acres, severed_units, remaining_units, and parcel_status (PARTIALLY_SEVERED when remaining_units > 0, FULLY_SEVERED when remaining_units == 0)"
          - "cascade link 3 (caused by link 2's parcel recompute): recomputes SendingArea.severed_units_total"
          - "cascade link 4 (caused by link 3): when severed_units_total >= sending_cap_units the area takes its ACTIVE -> CLOSED transition, which suspends every still-open SeveranceApplication in the area"
          - "mints one root Certificate: units_face = units_remaining = allocated_units, holder_party_id = applicant_party_id, conservation_easement_id = the easement from link 1, origin_sending_area_id = the parcel's sending_area_id, origin_neighborhood_code = that area's neighborhood_code, generation = 1, lifecycle_status = ISSUED, market_status = HELD, serial_number from the area's incremented issued_certificate_count"
          - "appends CertificateTransfer{transfer_type: ISSUANCE, seq_no: 1, from_party_id: null, to_party_id: applicant_party_id, units: allocated_units, price_cents: null}"
          - "recomputes Party.units_held and Party.certificates_held_count for the applicant"
          - "increments SeveranceApplication.version by 1"
      - from: SUBMITTED
        to: SUSPENDED
        trigger: "system: SendingArea ACTIVE -> CLOSED cascade"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "the parcel's SendingArea just transitioned to CLOSED"
        side_effects:
          - "sets denial_reason = 'SENDING_AREA_CLOSED'"
          - "increments SeveranceApplication.version by 1"
      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "system: SendingArea ACTIVE -> CLOSED cascade"
        actor: system
        preconditions:
          - "status == UNDER_REVIEW"
          - "the parcel's SendingArea just transitioned to CLOSED"
        side_effects:
          - "sets denial_reason = 'SENDING_AREA_CLOSED'"
          - "increments SeveranceApplication.version by 1"
      - from: REVISION_REQUESTED
        to: SUSPENDED
        trigger: "system: SendingArea ACTIVE -> CLOSED cascade"
        actor: system
        preconditions:
          - "status == REVISION_REQUESTED"
          - "the parcel's SendingArea just transitioned to CLOSED"
        side_effects:
          - "sets denial_reason = 'SENDING_AREA_CLOSED'"
          - "increments SeveranceApplication.version by 1"

  - entity: ConservationEasement
    initial_state: PENDING_RECORDING
    terminal_states: []
    transitions:
      # ---- dimension 1: recording_status (register) ----
      - from: PENDING_RECORDING
        to: RECORDED
        trigger: "system: POST /tdr/severance-applications/{id}/certify creates the easement and records it in the same request"
        actor: system
        preconditions:
          - "recording_status == PENDING_RECORDING"
        side_effects:
          - "sets recorded_at to the current logical clock and recording_reference to 'EAS-{parcel.apn}-1'"
          - "runs calculations.easement_restriction_extent"
          - "increments ConservationEasement.version by 1"
        note: "Dimension 1 of a parallel state machine; compliance_status evolves independently."
      - from: RECORDED
        to: AMENDED
        trigger: "system: a second (or later) POST /tdr/severance-applications/{id}/certify on the same parcel"
        actor: system
        preconditions:
          - "recording_status IN {RECORDED, AMENDED}"
        side_effects:
          - "increments amendment_count by 1 and re-mints recording_reference as 'EAS-{parcel.apn}-{amendment_count + 1}'"
          - "re-runs calculations.easement_restriction_extent over the cumulative severed units"
          - "increments units_issued_total by the newly certified allocated_units and recomputes units_outstanding"
          - "increments ConservationEasement.version by 1"
        note: "AMENDED is reachable from AMENDED as well (a third severance on the same parcel); recorded_at is never rewritten."
      - from: AMENDED
        to: AMENDED
        trigger: "system: a third or later POST /tdr/severance-applications/{id}/certify on the same parcel"
        actor: system
        preconditions:
          - "recording_status == AMENDED"
        side_effects:
          - "same effects as RECORDED -> AMENDED"
          - "increments ConservationEasement.version by 1"
      # ---- dimension 2: compliance_status (stewardship) ----
      - from: COMPLIANT
        to: VIOLATION_NOTICED
        trigger: "POST /tdr/conservation-easements/{id}/inspections with finding IN {MINOR_VIOLATION, MAJOR_VIOLATION}"
        actor: EasementMonitor
        preconditions:
          - "compliance_status IN {COMPLIANT, CURED}"
          - "recording_status IN {RECORDED, AMENDED}"
        side_effects:
          - "cascade link 1: sets compliance_status = VIOLATION_NOTICED and cure_deadline = the new inspection's cure_deadline"
          - "cascade link 2 (caused by link 1): every Certificate with conservation_easement_id == this easement and market_status IN {HELD, UNDER_CONTRACT} moves to FROZEN; any MarketTransaction on such a certificate with status PROPOSED moves to CANCELLED with reversal_reason 'EASEMENT_NONCOMPLIANT'"
          - "cascade link 3 (caused by link 2): every CertificateRedemption with status == ALLOCATED on a just-frozen certificate moves to HELD_PENDING_COMPLIANCE, which lowers its ReceivingSiteApplication.pending_backed_units"
          - "cascade link 4 (caused by link 3): every ReceivingSiteApplication with status == DESIGN_APPROVED whose recomputed backed_units + pending_backed_units < required_backing_units moves to BACKING_DEFICIENT"
          - "increments the version of this easement and of every certificate, transaction, redemption, and application touched above by 1"
      - from: CURED
        to: VIOLATION_NOTICED
        trigger: "POST /tdr/conservation-easements/{id}/inspections with finding IN {MINOR_VIOLATION, MAJOR_VIOLATION}"
        actor: EasementMonitor
        preconditions:
          - "compliance_status == CURED"
        side_effects:
          - "identical cascade to COMPLIANT -> VIOLATION_NOTICED"
          - "increments ConservationEasement.version by 1"
      - from: VIOLATION_NOTICED
        to: UNDER_CURE
        trigger: "POST /tdr/monitoring-inspections/{id}/cure-verification with outcome=CURE_IN_PROGRESS"
        actor: EasementMonitor
        preconditions:
          - "compliance_status == VIOLATION_NOTICED"
          - "the inspection's status == CURE_PENDING"
        side_effects:
          - "sets compliance_status = UNDER_CURE; cure_deadline is unchanged (a partial cure does not extend the deadline)"
          - "certificates stay FROZEN and redemptions stay HELD_PENDING_COMPLIANCE"
          - "increments ConservationEasement.version by 1"
      - from: VIOLATION_NOTICED
        to: CURED
        trigger: "POST /tdr/monitoring-inspections/{id}/cure-verification with outcome=CURED"
        actor: EasementMonitor
        preconditions:
          - "compliance_status IN {VIOLATION_NOTICED, UNDER_CURE, ESCALATED}"
          - "the inspection's status IN {CURE_PENDING, ESCALATED}"
        side_effects:
          - "compensating cascade link 1: sets compliance_status = CURED, cure_deadline = null, prior_violation_count += 1"
          - "compensating cascade link 2 (caused by link 1): every Certificate with conservation_easement_id == this easement and market_status == FROZEN returns to HELD"
          - "compensating cascade link 3 (caused by link 2): every CertificateRedemption with status == HELD_PENDING_COMPLIANCE on those certificates returns to ALLOCATED, restoring its ReceivingSiteApplication.pending_backed_units"
          - "compensating cascade link 4 (caused by link 3): every ReceivingSiteApplication with status == BACKING_DEFICIENT whose recomputed backed_units + pending_backed_units >= required_backing_units returns to DESIGN_APPROVED"
          - "increments the version of every entity touched above by 1"
      - from: UNDER_CURE
        to: CURED
        trigger: "POST /tdr/monitoring-inspections/{id}/cure-verification with outcome=CURED"
        actor: EasementMonitor
        preconditions:
          - "compliance_status == UNDER_CURE"
        side_effects:
          - "identical compensating cascade to VIOLATION_NOTICED -> CURED"
          - "increments ConservationEasement.version by 1"
      - from: ESCALATED
        to: CURED
        trigger: "POST /tdr/monitoring-inspections/{id}/cure-verification with outcome=CURED"
        actor: EasementMonitor
        preconditions:
          - "compliance_status == ESCALATED"
        side_effects:
          - "identical compensating cascade to VIOLATION_NOTICED -> CURED"
          - "increments ConservationEasement.version by 1"
      - from: VIOLATION_NOTICED
        to: ESCALATED
        trigger: "POST /tdr/_ops/compliance-sweep"
        actor: system
        preconditions:
          - "compliance_status IN {VIOLATION_NOTICED, UNDER_CURE}"
          - "current logical clock > cure_deadline (strict: at exactly cure_deadline the easement is NOT escalated)"
        side_effects:
          - "sets compliance_status = ESCALATED; the open inspection moves CURE_PENDING -> ESCALATED with escalated_at = the current logical clock and prior_violation_count += 1"
          - "certificates remain FROZEN and redemptions remain HELD_PENDING_COMPLIANCE"
          - "increments ConservationEasement.version by 1"
      - from: UNDER_CURE
        to: ESCALATED
        trigger: "POST /tdr/_ops/compliance-sweep"
        actor: system
        preconditions:
          - "compliance_status == UNDER_CURE"
          - "current logical clock > cure_deadline (strict)"
        side_effects:
          - "identical to VIOLATION_NOTICED -> ESCALATED"
          - "increments ConservationEasement.version by 1"
      - from: CURED
        to: COMPLIANT
        trigger: "POST /tdr/conservation-easements/{id}/inspections with finding=COMPLIANT"
        actor: EasementMonitor
        preconditions:
          - "compliance_status == CURED"
        side_effects:
          - "sets compliance_status = COMPLIANT; the new inspection is created directly in status CLOSED"
          - "increments ConservationEasement.version by 1"
        note: "Closes the stewardship cycle COMPLIANT -> VIOLATION_NOTICED -> (UNDER_CURE) -> CURED -> COMPLIANT."

  - entity: MonitoringInspection
    initial_state: OPEN
    terminal_states: [CLOSED, CURED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /tdr/conservation-easements/{id}/inspections with finding=COMPLIANT (applied within the creating request)"
        actor: system
        preconditions:
          - "finding == COMPLIANT"
        side_effects:
          - "severity_score = 0.00, cure_deadline = null"
          - "sets ConservationEasement.last_inspection_at = inspection_date"
      - from: OPEN
        to: CURE_PENDING
        trigger: "POST /tdr/conservation-easements/{id}/inspections with finding IN {MINOR_VIOLATION, MAJOR_VIOLATION} (applied within the creating request)"
        actor: system
        preconditions:
          - "finding IN {MINOR_VIOLATION, MAJOR_VIOLATION}"
        side_effects:
          - "runs calculations.violation_severity_score to write severity_score and cure_deadline"
          - "sets ConservationEasement.last_inspection_at = inspection_date and drives the easement's compliance cascade"
      - from: CURE_PENDING
        to: CURED
        trigger: "POST /tdr/monitoring-inspections/{id}/cure-verification with outcome=CURED"
        actor: EasementMonitor
        preconditions:
          - "status == CURE_PENDING"
        side_effects:
          - "sets cure_verified_at = current logical clock and cure_verified_by_user_id = acting X-User-ID"
          - "drives the easement's compensating compliance cascade"
          - "increments MonitoringInspection.version by 1"
      - from: CURE_PENDING
        to: ESCALATED
        trigger: "POST /tdr/_ops/compliance-sweep"
        actor: system
        preconditions:
          - "status == CURE_PENDING"
          - "current logical clock > cure_deadline (strict)"
        side_effects:
          - "sets escalated_at = current logical clock"
          - "drives the easement's VIOLATION_NOTICED/UNDER_CURE -> ESCALATED transition"
          - "increments MonitoringInspection.version by 1"
      - from: ESCALATED
        to: CURED
        trigger: "POST /tdr/monitoring-inspections/{id}/cure-verification with outcome=CURED"
        actor: EasementMonitor
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "sets cure_verified_at and cure_verified_by_user_id"
          - "drives the easement's ESCALATED -> CURED compensating cascade"
          - "increments MonitoringInspection.version by 1"
      - from: CURE_PENDING
        to: CURE_PENDING
        trigger: "POST /tdr/monitoring-inspections/{id}/cure-verification with outcome=CURE_IN_PROGRESS"
        actor: EasementMonitor
        preconditions:
          - "status == CURE_PENDING"
        side_effects:
          - "the easement moves VIOLATION_NOTICED -> UNDER_CURE; the inspection stays CURE_PENDING and keeps its cure_deadline"
          - "increments MonitoringInspection.version by 1"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [REDEEMED, RETIRED]
    transitions:
      # ---- dimension 1: lifecycle_status (rights) ----
      - from: ISSUED
        to: PARTIALLY_REDEEMED
        trigger: "system: POST /tdr/receiving-site-applications/{id}/finalize confirms a redemption that consumes part of the certificate"
        actor: system
        preconditions:
          - "lifecycle_status == ISSUED"
          - "units_remaining after the confirmation is > 0"
        side_effects:
          - "units_redeemed += confirmed units, units_remaining recomputed, units_encumbered decreased by the same amount"
          - "appends CertificateTransfer{transfer_type: REDEMPTION, to_party_id: null, units: confirmed units, price_cents: null}"
          - "increments Certificate.version by 1"
      - from: ISSUED
        to: REDEEMED
        trigger: "system: POST /tdr/receiving-site-applications/{id}/finalize confirms redemptions consuming all remaining units"
        actor: system
        preconditions:
          - "lifecycle_status == ISSUED"
          - "units_remaining after the confirmation == 0 and units_retired == 0"
        side_effects:
          - "same ledger effects as ISSUED -> PARTIALLY_REDEEMED"
          - "increments Certificate.version by 1"
      - from: PARTIALLY_REDEEMED
        to: REDEEMED
        trigger: "system: a later finalize consumes the last remaining units"
        actor: system
        preconditions:
          - "lifecycle_status == PARTIALLY_REDEEMED"
          - "units_remaining after the confirmation == 0 and units_retired == 0"
        side_effects:
          - "same ledger effects as ISSUED -> PARTIALLY_REDEEMED"
          - "increments Certificate.version by 1"
      - from: ISSUED
        to: RETIRED
        trigger: "POST /tdr/certificates/{id}/retire with units == units_remaining"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "lifecycle_status IN {ISSUED, PARTIALLY_REDEEMED}"
          - "market_status == HELD"
          - "units <= units_remaining - units_encumbered"
          - "acting party is the holder, or the actor is ProgramAdministrator"
        side_effects:
          - "units_retired += units and units_remaining recomputed; when units_remaining reaches 0 lifecycle_status becomes RETIRED (retirement outranks redemption when both reduced the certificate to zero)"
          - "appends CertificateTransfer{transfer_type: RETIREMENT, to_party_id: null, units: units, price_cents: null}"
          - "recomputes ConservationEasement.units_retired and units_outstanding for the backing easement"
          - "recomputes Party.units_held and certificates_held_count for the holder"
          - "increments Certificate.version by 1"
        note: "A partial retirement leaves lifecycle_status unchanged and only moves units into units_retired."
      - from: PARTIALLY_REDEEMED
        to: RETIRED
        trigger: "POST /tdr/certificates/{id}/retire with units == units_remaining"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "lifecycle_status == PARTIALLY_REDEEMED"
          - "market_status == HELD"
          - "units == units_remaining and units_encumbered == 0"
        side_effects:
          - "same effects as ISSUED -> RETIRED"
          - "increments Certificate.version by 1"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /tdr/certificates/{id}/split"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "lifecycle_status IN {ISSUED, PARTIALLY_REDEEMED}"
          - "market_status == HELD"
          - "acting identity is the holder (entity_backed roles) or the actor is ProgramAdministrator"
          - "expected_certificate_version matches this certificate's current version, else ERR_STALE_PARENT_VERSION (concurrency_rules[certificate-split-stale-certificate])"
          - "units < units_remaining - units_encumbered (a split must leave at least one unit on the parent), else ERR_SPLIT_EXCEEDS_AVAILABLE_UNITS"
        side_effects:
          - "mints a child Certificate: parent_certificate_id = this id, conservation_easement_id and origin_sending_area_id and origin_neighborhood_code copied unchanged, holder_party_id = this holder, units_face = units_remaining = units, generation = this generation + 1, split_count = 0, lifecycle_status = ISSUED, market_status = HELD, issued_at = current logical clock"
          - "increments this certificate's split_count by 1 and sets the child serial_number to '{parent.serial_number}-S{parent.split_count after increment}'"
          - "units_split_out += units on the parent and units_remaining is recomputed; lifecycle_status is unchanged"
          - "appends CertificateTransfer{transfer_type: SPLIT_OUT, certificate_id: parent id, from_party_id: null, to_party_id: null, units: units, price_cents: null} and a second CertificateTransfer{transfer_type: ISSUANCE, certificate_id: child id, seq_no: 1, to_party_id: holder, units: units}"
          - "ConservationEasement.units_outstanding is unchanged by a split (invariant compensating_invariant.rights_conserved_across_split_and_retirement)"
          - "increments Certificate.version by 1 on the parent"
        note: "A split is a lineage mutation, not a lifecycle advance: the parent stays in its current lifecycle_status and market_status."
      # ---- dimension 2: market_status (tradability) ----
      - from: HELD
        to: UNDER_CONTRACT
        trigger: "POST /tdr/market-transactions"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "market_status == HELD"
          - "lifecycle_status IN {ISSUED, PARTIALLY_REDEEMED}"
          - "backing ConservationEasement.compliance_status IN {COMPLIANT, CURED} (cross_entity_state_dependency: Certificate -> ConservationEasement)"
        side_effects:
          - "increments Certificate.version by 1"
        note: "Dimension 2 of the parallel machine: lifecycle_status is untouched by a proposal."
      - from: UNDER_CONTRACT
        to: HELD
        trigger: "POST /tdr/market-transactions/{id}/settle"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "market_status == UNDER_CONTRACT"
        side_effects:
          - "for conveyance_mode WHOLE: holder_party_id becomes buyer_party_id and the same certificate returns to HELD"
          - "for conveyance_mode PARTIAL: this certificate keeps its holder and returns to HELD with units_split_out += units, and a child certificate is minted to the buyer in market_status HELD"
          - "increments Certificate.version by 1"
      - from: UNDER_CONTRACT
        to: HELD
        trigger: "POST /tdr/market-transactions/{id}/cancel"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "market_status == UNDER_CONTRACT"
        side_effects:
          - "increments Certificate.version by 1"
      - from: HELD
        to: FROZEN
        trigger: "system: backing ConservationEasement enters VIOLATION_NOTICED (cascade link 2)"
        actor: system
        preconditions:
          - "market_status == HELD"
        side_effects:
          - "increments Certificate.version by 1"
      - from: UNDER_CONTRACT
        to: FROZEN
        trigger: "system: backing ConservationEasement enters VIOLATION_NOTICED (cascade link 2)"
        actor: system
        preconditions:
          - "market_status == UNDER_CONTRACT"
        side_effects:
          - "the open PROPOSED MarketTransaction on this certificate moves to CANCELLED with reversal_reason 'EASEMENT_NONCOMPLIANT'"
          - "increments Certificate.version by 1"
      - from: FROZEN
        to: HELD
        trigger: "system: backing ConservationEasement reaches CURED (compensating cascade link 2)"
        actor: system
        preconditions:
          - "market_status == FROZEN"
        side_effects:
          - "increments Certificate.version by 1"
        note: "A certificate frozen while UNDER_CONTRACT returns to HELD, never to UNDER_CONTRACT: its transaction was cancelled."

  - entity: MarketTransaction
    initial_state: PROPOSED
    terminal_states: [REVERSED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: SETTLED
        trigger: "POST /tdr/market-transactions/{id}/settle"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "status == PROPOSED"
          - "acting identity is the buyer party (entity_backed roles) or the actor is ProgramAdministrator"
          - "buyer Party.status == ACTIVE and seller Party.status == ACTIVE"
          - "certificate.market_status == UNDER_CONTRACT"
          - "backing ConservationEasement.compliance_status IN {COMPLIANT, CURED}"
          - "units <= certificate.units_remaining - certificate.units_encumbered"
          - "buyer.cash_balance_cents >= gross_price_cents, else ERR_INSUFFICIENT_FUNDS"
        side_effects:
          - "sets conveyance_mode = WHOLE when units == certificate.units_remaining, else PARTIAL"
          - "for PARTIAL: mints a child Certificate (parent_certificate_id = certificate_id, units_face = units, generation = parent.generation + 1, serial_number = parent serial + '-S{parent.split_count after increment}', holder_party_id = buyer, market_status HELD, lifecycle_status ISSUED) and appends CertificateTransfer{transfer_type: SPLIT_OUT, from_party_id: null, to_party_id: null, units: units} on the parent; conveyed_certificate_id = the child id"
          - "for WHOLE: holder_party_id of the certificate becomes buyer_party_id; conveyed_certificate_id = certificate_id"
          - "appends CertificateTransfer on conveyed_certificate_id with transfer_type = PRIVATE_SALE | BANK_PURCHASE | BANK_RESALE per channel, from_party_id = seller, to_party_id = buyer, units = units, price_cents = gross_price_cents"
          - "buyer.cash_balance_cents -= gross_price_cents; seller.cash_balance_cents += net_to_seller_cents; the MUNICIPAL_BANK party's fee_revenue_cents += program_fee_cents + equity_surcharge_cents (money invariant: the three deltas sum to zero)"
          - "recomputes units_held and certificates_held_count for buyer and seller"
          - "sets settled_at = current logical clock; increments MarketTransaction.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /tdr/market-transactions/{id}/cancel"
        actor: "Landowner | Developer | ProgramAdministrator"
        preconditions:
          - "status == PROPOSED"
          - "acting identity is the seller party (entity_backed roles) or the actor is ProgramAdministrator"
        side_effects:
          - "certificate returns to market_status HELD"
          - "no cash moves; sets reversal_reason from the request"
          - "increments MarketTransaction.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "system: backing ConservationEasement enters VIOLATION_NOTICED while the certificate is UNDER_CONTRACT"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "sets reversal_reason = 'EASEMENT_NONCOMPLIANT'; the certificate goes to FROZEN rather than HELD"
          - "increments MarketTransaction.version by 1"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /tdr/market-transactions/{id}/reverse"
        actor: ProgramAdministrator
        preconditions:
          - "status == SETTLED"
          - "conveyance_mode == WHOLE, else ERR_REVERSAL_NOT_PERMITTED (a split conveyance cannot be un-split)"
          - "the conveyed certificate has units_redeemed == 0 and units_encumbered == 0 and units_retired == 0, else ERR_REVERSAL_NOT_PERMITTED"
          - "current logical clock <= settled_at + 30 days (REVERSAL_WINDOW_DAYS), else ERR_REVERSAL_WINDOW_EXPIRED"
        side_effects:
          - "compensating money moves, exactly inverse to settlement: buyer.cash_balance_cents += gross_price_cents; seller.cash_balance_cents -= net_to_seller_cents; MUNICIPAL_BANK.fee_revenue_cents -= program_fee_cents + equity_surcharge_cents"
          - "holder_party_id of the conveyed certificate returns to seller_party_id; market_status returns to HELD"
          - "appends CertificateTransfer{transfer_type: REVERSAL, from_party_id: buyer, to_party_id: seller, units: units, price_cents: gross_price_cents}"
          - "recomputes units_held and certificates_held_count for buyer and seller"
          - "sets reversed_at = current logical clock and reversal_reason from the request"
          - "increments MarketTransaction.version by 1"
        note: "Invariant compensating_invariant.cash_conserved_across_settlement_reversal: the program-wide sum of Party.cash_balance_cents + Party.fee_revenue_cents is identical before the settlement and after the reversal."

  - entity: ReceivingSiteApplication
    initial_state: SUBMITTED
    terminal_states: [FINALIZED, DENIED]
    transitions:
      - from: SUBMITTED
        to: DESIGN_REVIEW
        trigger: "system: POST /tdr/receiving-site-applications when the receiving area has design_review_required == true (applied within the creating request)"
        actor: system
        preconditions:
          - "ReceivingArea.status == ACTIVE (cross_entity_state_dependency: ReceivingSiteApplication -> ReceivingArea)"
          - "ReceivingArea.design_review_required == true"
        side_effects:
          - "runs calculations.receiving_bonus_units in its PROVISIONAL variant to write base_units, max_bonus_units, required_backing_units, provisional_bonus_units"
      - from: SUBMITTED
        to: DESIGN_APPROVED
        trigger: "system: POST /tdr/receiving-site-applications when the receiving area has design_review_required == false (applied within the creating request)"
        actor: system
        preconditions:
          - "ReceivingArea.status == ACTIVE"
          - "ReceivingArea.design_review_required == false"
        side_effects:
          - "runs calculations.receiving_bonus_units in its PROVISIONAL variant"
          - "design_review_round stays 0 and design_reviewed_by_user_id stays null"
        note: "Branch point: the same endpoint lands the application in one of two states depending on a configuration flag on the area."
      - from: DESIGN_REVIEW
        to: REVISIONS_REQUIRED
        trigger: "POST /tdr/receiving-site-applications/{id}/design-review-decision with decision=REQUIRE_REVISIONS"
        actor: DesignReviewBoard
        preconditions:
          - "status == DESIGN_REVIEW"
          - "design_review_round < 2 (MAX_DESIGN_ROUNDS)"
        side_effects:
          - "sets design_reviewed_by_user_id to the acting X-User-ID"
          - "increments ReceivingSiteApplication.version by 1"
      - from: REVISIONS_REQUIRED
        to: DESIGN_REVIEW
        trigger: "POST /tdr/receiving-site-applications/{id}/resubmit-design"
        actor: Developer
        preconditions:
          - "status == REVISIONS_REQUIRED"
          - "acting X-User-ID == developer_party_id"
          - "design_review_round + 1 <= 2 (MAX_DESIGN_ROUNDS)"
        side_effects:
          - "increments design_review_round by 1 and replaces requested_bonus_units with the resubmitted value"
          - "re-runs calculations.receiving_bonus_units PROVISIONAL variant, so provisional_bonus_units and required_backing_units are restated"
          - "increments ReceivingSiteApplication.version by 1"
        note: "Closes the design cycle DESIGN_REVIEW -> REVISIONS_REQUIRED -> DESIGN_REVIEW."
      - from: DESIGN_REVIEW
        to: DESIGN_APPROVED
        trigger: "POST /tdr/receiving-site-applications/{id}/design-review-decision with decision=APPROVE"
        actor: DesignReviewBoard
        preconditions:
          - "status == DESIGN_REVIEW"
        side_effects:
          - "sets design_reviewed_by_user_id to the acting X-User-ID"
          - "increments ReceivingSiteApplication.version by 1"
      - from: DESIGN_REVIEW
        to: DENIED
        trigger: "POST /tdr/receiving-site-applications/{id}/design-review-decision with decision=DENY"
        actor: DesignReviewBoard
        preconditions:
          - "status == DESIGN_REVIEW"
        side_effects:
          - "sets denial_reason from review_note (or 'DESIGN_REVIEW_DENIED' when omitted)"
          - "every CertificateRedemption on this application with status IN {ALLOCATED, HELD_PENDING_COMPLIANCE} moves to RELEASED, restoring certificate.units_encumbered and ReceivingArea.reserved_units"
          - "increments ReceivingSiteApplication.version by 1"
      - from: DESIGN_APPROVED
        to: FINALIZED
        trigger: "POST /tdr/receiving-site-applications/{id}/finalize"
        actor: Developer
        preconditions:
          - "status == DESIGN_APPROVED"
          - "acting X-User-ID == developer_party_id"
          - "every source ConservationEasement of the application's redemptions with status IN {ALLOCATED, HELD_PENDING_COMPLIANCE} has compliance_status IN {COMPLIANT, CURED}, else ERR_EASEMENT_NONCOMPLIANT (safety, checked before any constraint)"
          - "backed_units + pending_backed_units >= required_backing_units, else ERR_BACKING_INSUFFICIENT"
          - "ReceivingArea.absorbed_units + the units about to be confirmed <= ReceivingArea.absorption_cap_units (inclusive), else ERR_ABSORPTION_CAP_EXCEEDED"
        side_effects:
          - "every CertificateRedemption on this application with status == ALLOCATED moves to CONFIRMED with confirmed_at = current logical clock, in ascending allocated_at order, ties broken by ascending created_at"
          - "each confirmation advances its certificate's lifecycle_status (ISSUED -> PARTIALLY_REDEEMED or -> REDEEMED) and appends a REDEMPTION chain-of-title row"
          - "recomputes ReceivingArea.absorbed_units and reserved_units, and ConservationEasement.units_redeemed_confirmed and units_outstanding for every source easement"
          - "runs calculations.receiving_bonus_units in its FINAL variant to write allocated_bonus_units"
          - "sets finalized_at = current logical clock"
          - "when the recomputed ReceivingArea.absorbed_units >= absorption_cap_units the area takes its ACTIVE -> SUSPENDED transition"
          - "increments ReceivingSiteApplication.version by 1"
      - from: DESIGN_APPROVED
        to: BACKING_DEFICIENT
        trigger: "system: compliance freeze cascade link 4 (a source easement entered VIOLATION_NOTICED)"
        actor: system
        preconditions:
          - "status == DESIGN_APPROVED"
          - "backed_units + pending_backed_units < required_backing_units after the cascade recompute"
        side_effects:
          - "increments ReceivingSiteApplication.version by 1"
      - from: BACKING_DEFICIENT
        to: DESIGN_APPROVED
        trigger: "system: compensating cascade link 4 (a source easement reached CURED) or a fresh POST /tdr/receiving-site-applications/{id}/redemptions restoring backing"
        actor: system
        preconditions:
          - "status == BACKING_DEFICIENT"
          - "backed_units + pending_backed_units >= required_backing_units after the recompute"
        side_effects:
          - "increments ReceivingSiteApplication.version by 1"
        note: "Closes the backing cycle DESIGN_APPROVED -> BACKING_DEFICIENT -> DESIGN_APPROVED."

  - entity: CertificateRedemption
    initial_state: ALLOCATED
    terminal_states: [CONFIRMED, RELEASED]
    transitions:
      - from: ALLOCATED
        to: CONFIRMED
        trigger: "system: POST /tdr/receiving-site-applications/{id}/finalize"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "source ConservationEasement.compliance_status IN {COMPLIANT, CURED}"
        side_effects:
          - "sets confirmed_at; moves the units out of certificate.units_encumbered into certificate.units_redeemed"
          - "moves the units out of ReceivingArea.reserved_units into ReceivingArea.absorbed_units"
          - "increments CertificateRedemption.version by 1"
      - from: ALLOCATED
        to: HELD_PENDING_COMPLIANCE
        trigger: "system: compliance freeze cascade link 3"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "the certificate was just frozen because its source easement entered VIOLATION_NOTICED"
        side_effects:
          - "the units stay inside certificate.units_encumbered and ReceivingArea.reserved_units, but leave ReceivingSiteApplication.pending_backed_units"
          - "increments CertificateRedemption.version by 1"
      - from: HELD_PENDING_COMPLIANCE
        to: ALLOCATED
        trigger: "system: compensating cascade link 3 (source easement reached CURED)"
        actor: system
        preconditions:
          - "status == HELD_PENDING_COMPLIANCE"
        side_effects:
          - "the units return to ReceivingSiteApplication.pending_backed_units"
          - "increments CertificateRedemption.version by 1"
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /tdr/certificate-redemptions/{id}/release"
        actor: "Developer | ProgramAdministrator"
        preconditions:
          - "status IN {ALLOCATED, HELD_PENDING_COMPLIANCE}"
          - "the parent ReceivingSiteApplication.status != FINALIZED, else ERR_REDEMPTION_NOT_RELEASABLE"
          - "acting X-User-ID == the application's developer_party_id, or the actor is ProgramAdministrator"
        side_effects:
          - "sets released_at = current logical clock"
          - "certificate.units_encumbered -= units and ReceivingArea.reserved_units -= units"
          - "ReceivingSiteApplication.pending_backed_units is recomputed; a DESIGN_APPROVED application whose backing falls below required_backing_units moves to BACKING_DEFICIENT"
          - "ConservationEasement.units_outstanding is unchanged (invariant compensating_invariant.rights_conserved_across_allocate_and_release)"
          - "increments CertificateRedemption.version by 1"
      - from: HELD_PENDING_COMPLIANCE
        to: RELEASED
        trigger: "POST /tdr/certificate-redemptions/{id}/release"
        actor: "Developer | ProgramAdministrator"
        preconditions:
          - "status == HELD_PENDING_COMPLIANCE"
        side_effects:
          - "same effects as ALLOCATED -> RELEASED"
          - "increments CertificateRedemption.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: redemption-allocate-stale-application
    parent_entity: ReceivingSiteApplication
    write_endpoint: "POST /tdr/receiving-site-applications/{id}/redemptions"
    occ_field: "expected_receiving_site_application_version"
    description: |
      Allocating certificate units to a receiving site application whose version has advanced
      since the client last observed it is rejected. Several redemptions may legitimately be
      stacked on one application, so a second allocation carrying the version the client read
      before the first allocation is not caught by any state precondition — it would otherwise
      succeed while sizing its units against a backing total that no longer exists.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
  - rule_id: certificate-split-stale-certificate
    parent_entity: Certificate
    write_endpoint: "POST /tdr/certificates/{id}/split"
    occ_field: "expected_certificate_version"
    description: |
      Splitting a certificate whose version has advanced since the client last observed it is
      rejected. A certificate may legitimately be split repeatedly, so a split request carrying
      a superseded version passes every state precondition while reasoning about a units_remaining
      figure the registry has already changed.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
  - rule_id: account-action-stale-party
    parent_entity: Party
    write_endpoint: "POST /tdr/parties/{id}/account-actions"
    occ_field: "expected_party_version"
    description: |
      An administrative credit, debit, suspension, or reinstatement against a party whose version
      has advanced since the client last observed it is rejected. Repeated account actions are
      legitimate, so a stale-version debit would otherwise apply on top of a balance the operator
      never saw. Party.version is incremented ONLY by this endpoint: a settlement or reversal that
      moves cash, and a cascade that recomputes units_held or certificates_held_count, both leave
      Party.version untouched, so the operator's observed version stays valid across them.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: parcel_baseline_allocation
    trigger: "POST /tdr/sending-parcels — computes SendingParcel.baseline_allocation_units at creation, and is re-read (never recomputed) by every later severance"
    algorithm: threshold
    formula: |
      soil_multiplier =
        PRIME     -> 1.25
        STATEWIDE -> 1.10
        LOCAL     -> 1.00
        NONE      -> 0.75

      # eligible_acres depends on the sending area's adopted formula version
      if sending_area.allocation_formula_version == V1_NET_ACRE:
          eligible_acres = gross_acres - constrained_acres
      else:  # V2_GROSS_DISCOUNTED
          eligible_acres = gross_acres * sending_area.gross_discount_factor

      raw_units      = eligible_acres * sending_area.base_rate_units_per_acre * soil_multiplier
      baseline_units = max(0, floor(raw_units) - existing_dwelling_units)

      # worked example (both variants, identical parcel):
      #   gross 100.00, constrained 22.00, PRIME, base_rate 0.25,
      #   gross_discount_factor 0.80, existing_dwelling_units 2
      #   V1: 78.00 * 0.25 * 1.25 = 24.375 -> floor 24 -> 24 - 2 = 22
      #   V2: 80.00 * 0.25 * 1.25 = 25.000 -> floor 25 -> 25 - 2 = 23
    input_set: "the single SendingParcel being created plus its SendingArea (which must be status ACTIVE); constrained_acres is subtracted only under V1_NET_ACRE and gross_discount_factor is applied only under V2_GROSS_DISCOUNTED"
    constants:
      SOIL_MULTIPLIER_PRIME: 1.25
      SOIL_MULTIPLIER_STATEWIDE: 1.10
      SOIL_MULTIPLIER_LOCAL: 1.00
      SOIL_MULTIPLIER_NONE: 0.75
    precision: "acreage inputs carry 2 decimal places; raw_units is truncated with floor (never rounded) before the dwelling-unit deduction; the result is a non-negative integer"
    variants:
      - name: V1_NET_ACRE
        when: "the parcel's SendingArea has allocation_formula_version == V1_NET_ACRE"
        difference: "eligible acreage is gross_acres minus constrained_acres; gross_discount_factor is ignored entirely"
      - name: V2_GROSS_DISCOUNTED
        when: "the parcel's SendingArea has allocation_formula_version == V2_GROSS_DISCOUNTED"
        difference: "eligible acreage is gross_acres times gross_discount_factor; constrained_acres is ignored entirely, so a parcel whose constrained fraction exceeds (1 - gross_discount_factor) receives MORE rights under V2 than under V1"

  - name: severance_allocation_grant
    trigger: "POST /tdr/severance-applications/{id}/review-decision with decision=APPROVE — sets SeveranceApplication.allocated_units and residual_units_retained"
    algorithm: waterfall_allocation
    formula: |
      parcel_available = sending_parcel.remaining_units
      area_available   = sending_area.sending_cap_units - sending_area.severed_units_total

      if area_available <= 0:  reject ERR_SENDING_CAP_EXHAUSTED
      allocated_units = min(requested_units, parcel_available, area_available)
      if allocated_units <= 0: reject ERR_NO_ALLOCABLE_UNITS

      residual_units_retained = parcel_available - allocated_units
      applied_formula_version = sending_area.allocation_formula_version   # frozen onto the application
    input_set: "the application's SendingParcel (parcel_status must not be FULLY_SEVERED) and its SendingArea (status ACTIVE); the parcel bucket is consumed before the area bucket, so a request that fits the area but not the parcel is trimmed by the parcel"
    constants: {}
    precision: "integer units throughout; no rounding"

  - name: easement_restriction_extent
    trigger: "POST /tdr/severance-applications/{id}/certify — writes ConservationEasement.restricted_acres and permitted_residual_units on the easement recorded against the sending parcel"
    algorithm: aggregation
    formula: |
      restricted_acres = round_half_up(
          sending_parcel.gross_acres * allocated_units / sending_parcel.baseline_allocation_units, 2)

      permitted_residual_units =
          sending_parcel.existing_dwelling_units
          + (sending_parcel.baseline_allocation_units - (sending_parcel.severed_units + allocated_units))

      # worked examples for a 100.00-acre parcel with baseline_allocation_units 22:
      #   allocated 22 -> restricted_acres 100.00
      #   allocated 10 -> 100.00 * 10 / 22 = 45.4545... -> 45.45
    input_set: "the certifying SeveranceApplication, its SendingParcel, and (on an amendment) the parcel's existing ConservationEasement, whose restricted_acres is replaced by the cumulative figure computed from severed_units + allocated_units"
    constants: {}
    precision: "2 decimal places, round_half_up on acreage; permitted_residual_units is an integer"

  - name: receiving_bonus_units
    trigger: "POST /tdr/receiving-site-applications (PROVISIONAL), POST /tdr/receiving-site-applications/{id}/resubmit-design (PROVISIONAL again), POST /tdr/receiving-site-applications/{id}/finalize (FINAL)"
    algorithm: tiered_pricing
    formula: |
      site_tier_factor =
        site_acres >= 10.00 -> 1.00
        site_acres >=  3.00 -> 0.90
        otherwise           -> 0.75

      base_units             = floor(site_acres * receiving_area.base_density_units_per_acre)
      max_bonus_units        = floor(base_units * receiving_area.max_bonus_pct * site_tier_factor)
      required_backing_units = min(requested_bonus_units, max_bonus_units)

      # PROVISIONAL variant (application intake / design resubmission)
      provisional_bonus_units = min(requested_bonus_units, floor(max_bonus_units * PROVISIONAL_RELEASE_FRACTION))

      # FINAL variant (finalization)
      allocated_bonus_units = min(requested_bonus_units, max_bonus_units, backed_units)

      # worked examples with base_density 4.0 and max_bonus_pct 0.35:
      #   12.00 ac, requested 20 -> base 48,  tier 1.00, max 16, provisional 8,  final (backed 16) 16
      #    5.00 ac, requested 20 -> base 20,  tier 0.90, max  6, provisional 3,  final (backed  6)  6
      #    2.50 ac, requested 20 -> base 10,  tier 0.75, max  2, provisional 1,  final (backed  2)  2
      #   40.00 ac, requested 60 -> base 160, tier 1.00, max 56, provisional 28, final (backed 56) 56
    input_set: "the ReceivingSiteApplication being sized plus its ReceivingArea; backed_units in the FINAL variant counts only CertificateRedemption rows with status IN {ALLOCATED, CONFIRMED} (HELD_PENDING_COMPLIANCE and RELEASED rows are excluded)"
    constants:
      SITE_TIER_LARGE_ACRES: 10.00
      SITE_TIER_MID_ACRES: 3.00
      SITE_TIER_FACTOR_LARGE: 1.00
      SITE_TIER_FACTOR_MID: 0.90
      SITE_TIER_FACTOR_SMALL: 0.75
      PROVISIONAL_RELEASE_FRACTION: 0.5
    precision: "each floor() is applied at exactly the point shown — the tier factor multiplies the already-floored base_units, so flooring twice is required and a single combined floor(site_acres * density * pct * tier) is wrong"
    variants:
      - name: PROVISIONAL
        when: "intake and design resubmission, before any redemption has been confirmed"
        difference: "caps the figure at half of max_bonus_units (floored) and ignores backing entirely, so a fully backed application still shows a provisional figure below its final one"
      - name: FINAL
        when: "finalization, after design approval"
        difference: "drops the PROVISIONAL_RELEASE_FRACTION cap and instead takes backed_units into the min, so the same application yields a different number in the two contexts"

  - name: appraisal_reference_value
    trigger: "POST /tdr/market-transactions — resolves the applicable AppraisalSchedule and writes applied_neighborhood_code, applied_per_unit_value_cents, appraised_reference_cents"
    algorithm: chronological
    formula: |
      applicable = { s in AppraisalSchedule :
                       s.neighborhood_code == certificate.origin_neighborhood_code
                       AND s.status == ACTIVE
                       AND s.effective_from <= current_utc < s.effective_to }
      if applicable is empty: reject ERR_NO_ACTIVE_APPRAISAL_SCHEDULE
      schedule = applicable ordered by effective_from DESC, then created_at ASC, take first

      per_unit_base_cents      = round_half_up(schedule.per_unit_value_cents
                                               * (1 + schedule.equity_adjustment_bps / 10000))
      appraised_reference_cents = per_unit_base_cents * units

      # worked example: per_unit_value_cents 1234567, equity_adjustment_bps 250
      #   1234567 * 1.025 = 1265431.175 -> 1265431 per unit
      #   22 units -> 27839482
    input_set: "AppraisalSchedule rows matching the certificate's origin_neighborhood_code — the neighborhood the RIGHTS came from, never the buyer's or the receiving area's neighborhood; SUPERSEDED rows are excluded even when their window still covers the clock"
    constants: {}
    precision: "per-unit value rounded to whole cents with round_half_up BEFORE multiplication by units"

  - name: bank_channel_price
    trigger: "POST /tdr/market-transactions — establishes gross_price_cents for the chosen channel"
    algorithm: tiered_pricing
    formula: |
      per_unit_base_cents = appraisal_reference_value.per_unit_base_cents

      channel == PRIVATE:
          gross_price_cents = agreed_price_cents                       # taken from the request as-is
      channel == BANK_RESALE:
          per_unit = round_half_up(per_unit_base_cents * (1 + BANK_RESALE_MARKUP_BPS / 10000))
          gross_price_cents = per_unit * units
      channel == BANK_PURCHASE:
          per_unit = round_half_up(per_unit_base_cents * (1 - BANK_PURCHASE_DISCOUNT_BPS / 10000))
          gross_price_cents = per_unit * units

      # worked examples from per_unit_base_cents 1265431:
      #   BANK_RESALE,   5 units: 1265431 * 1.05 = 1328702.55 -> 1328703; * 5 = 6643515
      #                  (rounding the total instead would give 6643513 — a 2-cent divergence)
      #   BANK_PURCHASE, 22 units: 1265431 * 0.97 = 1227468.07 -> 1227468; * 22 = 27004296
    input_set: "the single MarketTransaction being proposed plus the AppraisalSchedule selected by appraisal_reference_value"
    constants:
      BANK_RESALE_MARKUP_BPS: 500
      BANK_PURCHASE_DISCOUNT_BPS: 300
    precision: "round to whole cents PER UNIT first, then multiply by units — the reverse order (multiply then round once) produces a different total and is wrong"

  - name: settlement_split
    trigger: "POST /tdr/market-transactions/{id}/settle — writes program_fee_cents, equity_surcharge_cents, net_to_seller_cents and moves cash"
    algorithm: waterfall_allocation
    formula: |
      # step 1 — fee tier is read off the GROSS price, never off the post-surcharge figure
      fee_bps =
        gross_price_cents <=  5000000 -> 350
        gross_price_cents <= 25000000 -> 275
        otherwise                     -> 200

      # step 2 — program fee
      program_fee_cents = round_half_up(gross_price_cents * fee_bps / 10000)

      # step 3 — equity surcharge, from the ORIGIN sending area's equity_tier
      equity_surcharge_bps =
        HIGH_VALUE  -> 150
        MODERATE    ->  75
        UNDERSERVED ->   0
      equity_surcharge_cents = round_half_up(gross_price_cents * equity_surcharge_bps / 10000)

      # step 4 — seller proceeds
      net_to_seller_cents = gross_price_cents - program_fee_cents - equity_surcharge_cents

      # cash movement: buyer.cash_balance_cents -= gross_price_cents
      #                seller.cash_balance_cents += net_to_seller_cents
      #                MUNICIPAL_BANK.fee_revenue_cents += program_fee_cents + equity_surcharge_cents

      # worked examples:
      #   gross 30000000, UNDERSERVED: 200 bps -> fee 600000, surcharge 0,      net 29400000
      #   gross 30000000, HIGH_VALUE:  200 bps -> fee 600000, surcharge 450000, net 28950000
      #   gross  6643515, UNDERSERVED: 275 bps -> fee 182697, surcharge 0,      net  6460818
      #   gross 27004296, UNDERSERVED: 200 bps -> fee 540086, surcharge 0,      net 26464210
      #   boundary: gross 5000000 -> 350 bps fee 175000; gross 5000001 -> 275 bps fee 137500
    input_set: "the settling MarketTransaction, its buyer and seller Party rows, the single MUNICIPAL_BANK party, and the SendingArea named by certificate.origin_sending_area_id (whose equity_tier fixes the surcharge)"
    constants:
      FEE_TIER_1_MAX_CENTS: 5000000
      FEE_TIER_1_BPS: 350
      FEE_TIER_2_MAX_CENTS: 25000000
      FEE_TIER_2_BPS: 275
      FEE_TIER_3_BPS: 200
      EQUITY_SURCHARGE_BPS_HIGH_VALUE: 150
      EQUITY_SURCHARGE_BPS_MODERATE: 75
      EQUITY_SURCHARGE_BPS_UNDERSERVED: 0
    precision: "each cents figure rounded independently with round_half_up; tier boundaries are inclusive on the upper bound (5000000 sits in tier 1)"

  - name: price_deviation_band
    trigger: "POST /tdr/market-transactions — writes price_deviation_bps and gates the proposal"
    algorithm: threshold
    formula: |
      price_deviation_bps = round_half_up(
          (gross_price_cents - appraised_reference_cents) / appraised_reference_cents * 10000)
      if abs(price_deviation_bps) > MAX_DEVIATION_BPS: reject ERR_PRICE_DEVIATION_EXCEEDS_BAND

      # worked examples against appraised_reference_cents 27839482:
      #   gross 30000000 ->  776 bps (accepted)
      #   gross 36191327 -> 3000 bps (accepted — the band rejects strictly above 3000)
      #   gross 40000000 -> 4368 bps (rejected)
    input_set: "the single MarketTransaction being proposed; BANK_PURCHASE and BANK_RESALE prices are derived from the same reference and therefore always land inside the band, so only PRIVATE proposals can trip it"
    constants:
      MAX_DEVIATION_BPS: 3000
    precision: "deviation rounded to whole basis points with round_half_up; the comparison is strictly greater-than, so exactly 3000 bps passes"

  - name: violation_severity_score
    trigger: "POST /tdr/conservation-easements/{id}/inspections — writes MonitoringInspection.severity_score and cure_deadline"
    algorithm: weighted_scoring
    formula: |
      finding_weight =
        COMPLIANT        ->  0
        MINOR_VIOLATION  -> 40
        MAJOR_VIOLATION  -> 90

      acre_ratio      = min(1, affected_acres / conservation_easement.restricted_acres)
      prior_component = min(100, conservation_easement.prior_violation_count * PRIOR_VIOLATION_POINTS)

      severity_score = round_half_up(
            WEIGHT_FINDING * finding_weight
          + WEIGHT_EXTENT  * (acre_ratio * 100)
          + WEIGHT_HISTORY * prior_component, 2)

      cure_days =
        severity_score >= 70.00 -> 30
        severity_score >= 45.00 -> 60
        otherwise               -> 90
      cure_deadline = inspection_date + cure_days days     # COMPLIANT findings get no deadline

      # worked examples on an easement with restricted_acres 100.00:
      #   MAJOR, 12.00 acres, 0 priors -> 45 + 3.60 + 0     = 48.60 -> 60-day band
      #   MAJOR, 60.00 acres, 0 priors -> 45 + 18.00 + 0    = 63.00 -> 60-day band
      #   MAJOR, 50.00 acres, 2 priors -> 45 + 15.00 + 10.00 = 70.00 -> 30-day band (>= is inclusive)
      #   MAJOR, 49.00 acres, 2 priors -> 45 + 14.70 + 10.00 = 69.70 -> 60-day band
      #   MINOR,  5.00 acres, 0 priors -> 20 + 1.50 + 0     = 21.50 -> 90-day band
      #   from inspection_date 2026-08-10: 30d -> 2026-09-09, 60d -> 2026-10-09, 90d -> 2026-11-08
    input_set: "the inspection being recorded plus its ConservationEasement (restricted_acres as the denominator and prior_violation_count as the history term, both read BEFORE this inspection increments the counter)"
    constants:
      WEIGHT_FINDING: 0.5
      WEIGHT_EXTENT: 0.3
      WEIGHT_HISTORY: 0.2
      FINDING_WEIGHT_MINOR: 40
      FINDING_WEIGHT_MAJOR: 90
      PRIOR_VIOLATION_POINTS: 25
      CURE_DAYS_SEVERE: 30
      CURE_DAYS_MODERATE: 60
      CURE_DAYS_LOW: 90
      SEVERE_SCORE_THRESHOLD: 70.00
      MODERATE_SCORE_THRESHOLD: 45.00
    precision: "score to 2 decimal places, round_half_up applied once to the weighted sum (never per term); band comparisons are >= on the rounded score"

  - name: program_evaluation_metrics
    trigger: "POST /tdr/evaluations — populates every metric field on ProgramEvaluation"
    algorithm: aggregation
    formula: |
      window = [period_start, period_end]        # inclusive on both ends, date granularity

      preserved_acres = sum(e.restricted_acres) over ConservationEasement e where
                          e.recording_status IN {RECORDED, AMENDED}
                          AND date(e.recorded_at) within window
      easement_count  = count of those easements
      issued_units    = sum(c.units_face)  over Certificate c where date(c.issued_at) within window
      redeemed_units  = sum(r.units) over CertificateRedemption r where r.status == CONFIRMED
                          AND date(r.confirmed_at) within window
      retired_units   = sum(c.units_retired) over Certificate c where date(c.issued_at) within window
      outstanding_units = issued_units - redeemed_units - retired_units

      absorption_pct = round_half_up(
          sum(a.absorbed_units) / sum(a.absorption_cap_units) * 100, 2)   over ReceivingArea a
          with status IN {ACTIVE, SUSPENDED}; 0.00 when the denominator is 0

      total_cash_cents = sum(Party.cash_balance_cents) + sum(Party.fee_revenue_cents)

      # equity_index — dual variant, same easement set
      underserved = those easements whose sending area equity_tier == UNDERSERVED
      ACREAGE_WEIGHTED:      round_half_up(sum(underserved.restricted_acres) / preserved_acres * 100, 2)
      PARCEL_COUNT_WEIGHTED: round_half_up(count(underserved) / easement_count * 100, 2)
      # equity_index is 0.00 when its denominator is 0 (preserved_acres 0.00 under
      # ACREAGE_WEIGHTED, easement_count 0 under PARCEL_COUNT_WEIGHTED) — an empty window
      # reports zero rather than erroring, exactly as absorption_pct does.

      # worked example: two easements in window — 100.00 restricted acres in an UNDERSERVED area
      # and 20.00 acres in a HIGH_VALUE area (preserved_acres 120.00, easement_count 2)
      #   ACREAGE_WEIGHTED      -> 100.00 / 120.00 * 100 = 83.33
      #   PARCEL_COUNT_WEIGHTED ->      1 /      2 * 100 = 50.00
    input_set: "easements recorded inside the window (PENDING_RECORDING easements are excluded), CONFIRMED redemptions only, and every ACTIVE or SUSPENDED receiving area; DRAFT receiving areas never enter the absorption denominator"
    constants: {}
    precision: "acreage and percentages to 2 decimal places, round_half_up; units and cents are integers"
    variants:
      - name: ACREAGE_WEIGHTED
        when: "the evaluation is requested with equity_weighting == ACREAGE_WEIGHTED"
        difference: "equity_index is the underserved share of preserved ACREAGE, so one large underserved easement dominates"
      - name: PARCEL_COUNT_WEIGHTED
        when: "the evaluation is requested with equity_weighting == PARCEL_COUNT_WEIGHTED"
        difference: "equity_index is the underserved share of easement COUNT, so a small underserved easement carries the same weight as a large one — identical data yields a different index"

  - name: rights_ledger_identity
    trigger: "re-derived after every write that touches certificates, redemptions, splits, retirements, or easements; surfaced through Certificate, ConservationEasement, and Party read models"
    algorithm: aggregation
    formula: |
      # per certificate
      units_remaining = units_face - units_split_out - units_redeemed - units_retired
      units_encumbered <= units_remaining

      # per easement (the conserved quantity: severed rights never appear or vanish)
      units_issued_total = units_redeemed_confirmed + units_retired + units_outstanding
      # equivalently: units_outstanding = sum over the easement's certificate lineage of
      #   (units_face of the root issuance) - units_redeemed - units_retired

      # per party
      units_held = sum(units_remaining) over certificates held with
                     lifecycle_status IN {ISSUED, PARTIALLY_REDEEMED}
    input_set: "the full certificate lineage rooted at each ConservationEasement, including every split child; RELEASED redemptions contribute nothing and HELD_PENDING_COMPLIANCE redemptions contribute to units_encumbered but not to units_redeemed_confirmed"
    constants: {}
    precision: "integer units; splits, allocations, and releases must each leave units_issued_total and units_outstanding unchanged"

  - name: cash_ledger_identity
    trigger: "re-derived after every settlement and every reversal"
    algorithm: aggregation
    formula: |
      sum(Party.cash_balance_cents) + sum(Party.fee_revenue_cents) == constant
      # a settlement moves gross_price_cents out of the buyer, net_to_seller_cents into the
      # seller, and (program_fee_cents + equity_surcharge_cents) into the bank's fee_revenue_cents;
      # gross == net + fee + surcharge, so the system total is unchanged.
      # a reversal applies the exact negation of all three legs.
    input_set: "every Party row; there is no external sink or source of cash in the program"
    constants: {}
    precision: "integer cents; the identity must hold exactly, with no rounding residue left behind by a reversal"

# =============================================================================
# §1.4 Validation Rules (evaluated strictly in ascending priority order)
# =============================================================================
validations:

  # ---- 1. authentication ----------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # ---- 2. authorization ----------------------------------------------------
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  # ---- 3. path existence, left-to-right ------------------------------------
  - priority: 3
    category: existence
    check: "every id in the path resolves, validated left-to-right; the leftmost unresolved id decides the error"
    error_id: "ERR_PARTY_NOT_FOUND | ERR_SENDING_AREA_NOT_FOUND | ERR_RECEIVING_AREA_NOT_FOUND | ERR_APPRAISAL_SCHEDULE_NOT_FOUND | ERR_SENDING_PARCEL_NOT_FOUND | ERR_SEVERANCE_APPLICATION_NOT_FOUND | ERR_CONSERVATION_EASEMENT_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_CERTIFICATE_TRANSFER_NOT_FOUND | ERR_MARKET_TRANSACTION_NOT_FOUND | ERR_RECEIVING_SITE_APPLICATION_NOT_FOUND | ERR_CERTIFICATE_REDEMPTION_NOT_FOUND | ERR_MONITORING_INSPECTION_NOT_FOUND | ERR_PROGRAM_EVALUATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  # ---- 4. request shape ----------------------------------------------------
  - priority: 4
    category: existence
    check: "all required input fields present; types, enum membership, string lengths, decimal places, and numeric ranges honored; period_start <= period_end; effective_from < effective_to; units > 0; every *_cents value a non-negative integer; unknown fields ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body or query parameters"

  # ---- 5. body foreign keys ------------------------------------------------
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "the matching ERR_*_NOT_FOUND from priority 3"
    http_status: 404
    applies_to: "POST /tdr/sending-parcels, POST /tdr/severance-applications, POST /tdr/market-transactions, POST /tdr/receiving-site-applications, POST /tdr/receiving-site-applications/{id}/redemptions"

  # ---- 6. ownership --------------------------------------------------------
  - priority: 6
    category: auth
    check: "for an entity_backed role, X-User-ID equals the resource's owning party FK (SendingParcel.owner_party_id, SeveranceApplication.applicant_party_id, ReceivingSiteApplication.developer_party_id, MarketTransaction.seller_party_id for cancel, Certificate.holder_party_id for split/retire). A redemption additionally requires that the named certificate's holder_party_id equals the acting developer — a developer may only redeem rights it actually holds."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /tdr/severance-applications, POST /tdr/severance-applications/{id}/resubmit, POST /tdr/receiving-site-applications, POST /tdr/receiving-site-applications/{id}/resubmit-design, POST /tdr/receiving-site-applications/{id}/finalize, POST /tdr/receiving-site-applications/{id}/redemptions, POST /tdr/certificate-redemptions/{id}/release, POST /tdr/certificates/{id}/split, POST /tdr/certificates/{id}/retire, POST /tdr/market-transactions/{id}/cancel"
  - priority: 7
    category: business_referential
    check: "each party reference holds the kind the slot requires: SendingParcel.owner_party_id and SeveranceApplication.applicant_party_id must be LANDOWNER; ReceivingSiteApplication.developer_party_id must be DEVELOPER; the counterparty on a BANK_PURCHASE or BANK_RESALE must be the MUNICIPAL_BANK party"
    error_id: ERR_PARTY_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /tdr/sending-parcels, POST /tdr/severance-applications, POST /tdr/receiving-site-applications, POST /tdr/market-transactions"
  - priority: 8
    category: auth
    check: "segregation of duties: the X-User-ID certifying a severance application differs from the decided_by_user_id that recorded its APPROVE decision; the X-User-ID verifying a cure differs from the inspector_user_id that recorded the inspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /tdr/severance-applications/{id}/certify, POST /tdr/monitoring-inspections/{id}/cure-verification"
  - priority: 9
    category: auth
    check: "channel and role agree: a PRIVATE transaction may be proposed by the seller (Landowner or Developer) only; BANK_PURCHASE and BANK_RESALE may be proposed by ProgramAdministrator only"
    error_id: ERR_CHANNEL_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /tdr/market-transactions"
  - priority: 10
    category: business_safety
    check: "no party involved in the request (actor's party, seller, buyer, owner, developer) has status == SUSPENDED"
    error_id: ERR_PARTY_SUSPENDED
    http_status: 409
    applies_to: "POST /tdr/severance-applications, POST /tdr/market-transactions, POST /tdr/market-transactions/{id}/settle, POST /tdr/receiving-site-applications, POST /tdr/receiving-site-applications/{id}/redemptions, POST /tdr/certificates/{id}/split"

  # ---- 11..24 state preconditions -----------------------------------------
  - priority: 11
    category: state
    check: "the severance application is in SUBMITTED before screening"
    error_id: ERR_APPLICATION_NOT_SCREENABLE
    http_status: 409
    applies_to: "POST /tdr/severance-applications/{id}/screen"
  - priority: 12
    category: state
    check: "the severance application is in UNDER_REVIEW before a review decision"
    error_id: ERR_APPLICATION_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /tdr/severance-applications/{id}/review-decision"
  - priority: 13
    category: state
    check: "the severance application is in REVISION_REQUESTED before resubmission"
    error_id: ERR_APPLICATION_NOT_REVISABLE
    http_status: 409
    applies_to: "POST /tdr/severance-applications/{id}/resubmit"
  - priority: 14
    category: state
    check: "the severance application is in APPROVED before certification"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /tdr/severance-applications/{id}/certify"
  - priority: 15
    category: state
    check: "the receiving site application is in DESIGN_REVIEW before a design-review decision, and in REVISIONS_REQUIRED before a design resubmission"
    error_id: ERR_DESIGN_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /tdr/receiving-site-applications/{id}/design-review-decision, POST /tdr/receiving-site-applications/{id}/resubmit-design"
  - priority: 16
    category: state
    check: "the receiving site application is in DESIGN_APPROVED before finalization (a BACKING_DEFICIENT or DESIGN_REVIEW application cannot finalize), and is in a non-terminal state before a redemption is allocated to it"
    error_id: ERR_APPLICATION_NOT_DESIGN_APPROVED
    http_status: 409
    applies_to: "POST /tdr/receiving-site-applications/{id}/finalize, POST /tdr/receiving-site-applications/{id}/redemptions"
  - priority: 17
    category: state
    check: "the redemption is in ALLOCATED or HELD_PENDING_COMPLIANCE and its application is not FINALIZED"
    error_id: ERR_REDEMPTION_NOT_RELEASABLE
    http_status: 409
    applies_to: "POST /tdr/certificate-redemptions/{id}/release"
  - priority: 18
    category: state
    check: "the market transaction is in PROPOSED before settlement or cancellation"
    error_id: ERR_TRANSACTION_NOT_PROPOSED
    http_status: 409
    applies_to: "POST /tdr/market-transactions/{id}/settle, POST /tdr/market-transactions/{id}/cancel"
  - priority: 19
    category: state
    check: "the market transaction is in SETTLED before reversal"
    error_id: ERR_TRANSACTION_NOT_SETTLED
    http_status: 409
    applies_to: "POST /tdr/market-transactions/{id}/reverse"
  - priority: 20
    category: state
    check: "the certificate's lifecycle_status is ISSUED or PARTIALLY_REDEEMED and its market_status is not UNDER_CONTRACT. A FROZEN certificate is deliberately NOT caught here — it falls through to the compliance check at priority 24 so the safety error wins."
    error_id: ERR_CERTIFICATE_NOT_TRANSFERABLE
    http_status: 409
    applies_to: "POST /tdr/market-transactions, POST /tdr/certificates/{id}/split, POST /tdr/certificates/{id}/retire, POST /tdr/receiving-site-applications/{id}/redemptions"
  - priority: 21
    category: state
    check: "the inspection is in CURE_PENDING before a cure verification"
    error_id: ERR_INSPECTION_NOT_CURABLE
    http_status: 409
    applies_to: "POST /tdr/monitoring-inspections/{id}/cure-verification"
  - priority: 22
    category: state
    check: "the sending parcel's parcel_status is not FULLY_SEVERED"
    error_id: ERR_PARCEL_FULLY_SEVERED
    http_status: 409
    applies_to: "POST /tdr/severance-applications"

  # ---- 23. optimistic concurrency -----------------------------------------
  - priority: 23
    category: state
    check: "expected_<parent>_version equals the parent's current version (see §1.2.1 concurrency_rules)"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /tdr/receiving-site-applications/{id}/redemptions, POST /tdr/certificates/{id}/split, POST /tdr/parties/{id}/account-actions"

  # ---- 24..25 safety / compliance (precede every constraint and fiscal) ----
  - priority: 24
    category: business_safety
    check: "the certificate's source ConservationEasement has compliance_status IN {COMPLIANT, CURED} — a VIOLATION_NOTICED, UNDER_CURE, or ESCALATED easement freezes its rights"
    error_id: ERR_CERTIFICATE_FROZEN
    http_status: 409
    applies_to: "POST /tdr/market-transactions, POST /tdr/certificates/{id}/split, POST /tdr/receiving-site-applications/{id}/redemptions"
  - priority: 25
    category: business_safety
    check: "every source ConservationEasement behind the application's redemptions with status IN {ALLOCATED, HELD_PENDING_COMPLIANCE} has compliance_status IN {COMPLIANT, CURED}"
    error_id: ERR_EASEMENT_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /tdr/receiving-site-applications/{id}/finalize"

  # ---- 26..28 referential / configuration ---------------------------------
  - priority: 26
    category: business_referential
    check: "the SendingArea named by the parcel or application has status == ACTIVE (DRAFT and CLOSED areas accept nothing)"
    error_id: ERR_SENDING_AREA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tdr/sending-parcels, POST /tdr/severance-applications, POST /tdr/severance-applications/{id}/certify"
  - priority: 27
    category: business_referential
    check: "the ReceivingArea has status == ACTIVE"
    error_id: ERR_RECEIVING_AREA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tdr/receiving-site-applications, POST /tdr/receiving-site-applications/{id}/redemptions, POST /tdr/receiving-site-applications/{id}/finalize"
  - priority: 28
    category: business_referential
    check: "when ReceivingArea.eligible_sending_area_codes is non-empty, the certificate's origin sending area code appears in it; an empty list means every sending area is eligible"
    error_id: ERR_SENDING_RECEIVING_PAIR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /tdr/receiving-site-applications/{id}/redemptions"

  # ---- 29..32 temporal -----------------------------------------------------
  - priority: 29
    category: business_temporal
    check: "no other ACTIVE AppraisalSchedule for the same neighborhood_code overlaps the half-open interval [effective_from, effective_to); touching endpoints (one window's effective_to equal to another's effective_from) do NOT overlap"
    error_id: ERR_APPRAISAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /tdr/appraisal-schedules"
  - priority: 30
    category: business_temporal
    check: "the new inspection_date is at least INSPECTION_BUFFER_DAYS = 90 days after the easement's last_inspection_at; a gap of exactly 90 days is allowed, 89 is rejected"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /tdr/conservation-easements/{id}/inspections"
  - priority: 31
    category: business_temporal
    check: "no other COMPUTED ProgramEvaluation partially overlaps [period_start, period_end] (both ends inclusive); an exact-match period is allowed and supersedes the earlier evaluation, while any partial overlap is rejected"
    error_id: ERR_EVALUATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /tdr/evaluations"
  - priority: 32
    category: business_temporal
    check: "the current logical clock is within REVERSAL_WINDOW_DAYS = 30 days of MarketTransaction.settled_at; exactly 30 days after settlement is still reversible, 31 is not"
    error_id: ERR_REVERSAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /tdr/market-transactions/{id}/reverse"

  # ---- 33..42 constraints --------------------------------------------------
  - priority: 33
    category: business_constraint
    check: "SendingParcel.apn is unique across all parcels"
    error_id: ERR_DUPLICATE_PARCEL_APN
    http_status: 409
    applies_to: "POST /tdr/sending-parcels"
  - priority: 34
    category: business_constraint
    check: "the area code is unique across SendingArea and ReceivingArea combined"
    error_id: ERR_DUPLICATE_AREA_CODE
    http_status: 409
    applies_to: "POST /tdr/sending-areas, POST /tdr/receiving-areas"
  - priority: 35
    category: business_constraint
    check: "the sending parcel has no SeveranceApplication in a non-terminal status (SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED)"
    error_id: ERR_PARCEL_HAS_OPEN_APPLICATION
    http_status: 409
    applies_to: "POST /tdr/severance-applications"
  - priority: 36
    category: business_constraint
    check: "revision_round < MAX_REVISION_ROUNDS = 2 on a severance application, and design_review_round < MAX_DESIGN_ROUNDS = 2 on a receiving site application"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /tdr/severance-applications/{id}/review-decision, POST /tdr/severance-applications/{id}/resubmit, POST /tdr/receiving-site-applications/{id}/design-review-decision, POST /tdr/receiving-site-applications/{id}/resubmit-design"
  - priority: 37
    category: business_constraint
    check: "requested_bonus_units <= max_bonus_units computed by calculations.receiving_bonus_units"
    error_id: ERR_BONUS_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST /tdr/receiving-site-applications/{id}/resubmit-design"
  - priority: 38
    category: business_constraint
    check: "the split units leave at least one unit on the parent: units < certificate.units_remaining - certificate.units_encumbered"
    error_id: ERR_SPLIT_EXCEEDS_AVAILABLE_UNITS
    http_status: 422
    applies_to: "POST /tdr/certificates/{id}/split"
  - priority: 39
    category: business_constraint
    check: "the requested units are available on the certificate: units <= certificate.units_remaining - certificate.units_encumbered"
    error_id: ERR_INSUFFICIENT_CERTIFICATE_UNITS
    http_status: 422
    applies_to: "POST /tdr/market-transactions, POST /tdr/receiving-site-applications/{id}/redemptions, POST /tdr/certificates/{id}/retire"
  - priority: 40
    category: business_constraint
    check: "backed_units + pending_backed_units >= required_backing_units at finalization"
    error_id: ERR_BACKING_INSUFFICIENT
    http_status: 409
    applies_to: "POST /tdr/receiving-site-applications/{id}/finalize"
  - priority: 41
    category: business_constraint
    check: "ReceivingArea.absorbed_units + the units about to be confirmed <= ReceivingArea.absorption_cap_units; the boundary is inclusive, so landing exactly on the cap succeeds and suspends the area, while one unit more is rejected"
    error_id: ERR_ABSORPTION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /tdr/receiving-site-applications/{id}/finalize"
  - priority: 42
    category: business_constraint
    check: "the transaction has not already been reversed and its certificate lineage has not been redeemed or retired since settlement"
    error_id: ERR_REVERSAL_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /tdr/market-transactions/{id}/reverse"

  # ---- 43..47 fiscal (always last) ----------------------------------------
  - priority: 43
    category: business_fiscal
    check: "an ACTIVE AppraisalSchedule exists for the certificate's origin_neighborhood_code whose half-open window covers the current logical clock"
    error_id: ERR_NO_ACTIVE_APPRAISAL_SCHEDULE
    http_status: 422
    applies_to: "POST /tdr/market-transactions"
  - priority: 44
    category: business_fiscal
    check: "abs(price_deviation_bps) <= MAX_DEVIATION_BPS = 3000 against the appraised reference"
    error_id: ERR_PRICE_DEVIATION_EXCEEDS_BAND
    http_status: 422
    applies_to: "POST /tdr/market-transactions"
  - priority: 45
    category: business_fiscal
    check: "the buyer's cash_balance_cents >= gross_price_cents at settlement, and the seller's cash_balance_cents >= net_to_seller_cents (plus the bank's fee_revenue_cents >= fee + surcharge) at reversal; also a DEBIT account-action may not drive a balance below zero"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /tdr/market-transactions/{id}/settle, POST /tdr/market-transactions/{id}/reverse, POST /tdr/parties/{id}/account-actions"
  - priority: 46
    category: business_fiscal
    check: "min(requested_units, parcel.remaining_units, area.sending_cap_units - area.severed_units_total) > 0"
    error_id: ERR_NO_ALLOCABLE_UNITS
    http_status: 422
    applies_to: "POST /tdr/severance-applications/{id}/review-decision"
  - priority: 47
    category: business_fiscal
    check: "sending_area.sending_cap_units - sending_area.severed_units_total > 0"
    error_id: ERR_SENDING_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /tdr/severance-applications/{id}/review-decision"

  # ---- 48. designation lifecycle ------------------------------------------
  # Numbered last only because the two activation endpoints are the sole endpoints it
  # applies to and no other rule above competes on them; its position therefore cannot
  # change any observable outcome.
  - priority: 48
    category: state
    check: "the area being activated is still in DRAFT; activating an already-ACTIVE, CLOSED, or SUSPENDED area is rejected rather than treated as a no-op"
    error_id: ERR_AREA_NOT_DRAFT
    http_status: 409
    applies_to: "POST /tdr/sending-areas/{id}/activate, POST /tdr/receiving-areas/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- parties -------------------------------------------------------------
  - method: POST
    path: "/tdr/parties"
    description: "Register a landowner, developer, or the single municipal TDR bank."
    roles: [ProgramAdministrator]
    code: 201
    input: [kind, legal_name, contact_email, "neighborhood_code?"]
    output: Party
    side_effects: ["cash_balance_cents and fee_revenue_cents start at 0", "status starts at ACTIVE", "units_held and certificates_held_count start at 0"]
  - method: GET
    path: "/tdr/parties/{id}"
    description: "Read one party, including its reconciled units_held and certificates_held_count."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: Party
    side_effects: []
  - method: GET
    path: "/tdr/parties"
    description: "List parties."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: Party[]
    side_effects: []
  - method: POST
    path: "/tdr/parties/{id}/account-actions"
    description: "Administrative account action against a party: CREDIT or DEBIT the settlement balance, or SUSPEND / REINSTATE participation."
    roles: [ProgramAdministrator]
    code: 200
    input: [action, "amount_cents?", expected_party_version, "note?"]
    output: Party
    side_effects:
      - "action=CREDIT adds amount_cents to cash_balance_cents; action=DEBIT subtracts it and is rejected with ERR_INSUFFICIENT_FUNDS when the balance would go negative"
      - "action=SUSPEND sets status=SUSPENDED; action=REINSTATE sets status=ACTIVE"
      - "amount_cents is required for CREDIT and DEBIT and must be omitted for SUSPEND and REINSTATE"
      - "increments Party.version by 1"

  # ---- sending areas -------------------------------------------------------
  - method: POST
    path: "/tdr/sending-areas"
    description: "Designate a sending area and adopt its development-right allocation formula."
    roles: [ProgramAdministrator]
    code: 201
    input: [code, name, neighborhood_code, allocation_formula_version, base_rate_units_per_acre, "gross_discount_factor?", equity_tier, sending_cap_units]
    output: SendingArea
    side_effects: ["status starts at DRAFT", "severed_units_total and issued_certificate_count start at 0"]
  - method: POST
    path: "/tdr/sending-areas/{id}/activate"
    description: "Activate a designated sending area so parcels and severances may be filed against it."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: SendingArea
    side_effects: ["status DRAFT -> ACTIVE", "increments SendingArea.version by 1"]
  - method: POST
    path: "/tdr/sending-areas/{id}/close"
    description: "Close a sending area to further severance activity."
    roles: [ProgramAdministrator]
    code: 200
    input: ["reason?"]
    output: SendingArea
    side_effects:
      - "status ACTIVE -> CLOSED"
      - "every SeveranceApplication on the area's parcels whose status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED} moves to SUSPENDED with denial_reason 'SENDING_AREA_CLOSED'; an APPROVED application is left APPROVED and simply becomes uncertifiable"
      - "increments SendingArea.version by 1"
  - method: GET
    path: "/tdr/sending-areas/{id}"
    description: "Read one sending area, including severed_units_total and issued_certificate_count."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: SendingArea
    side_effects: []
  - method: GET
    path: "/tdr/sending-areas"
    description: "List sending areas."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["status?", "neighborhood_code?", "equity_tier?", "allocation_formula_version?", "limit?", "offset?"]
    output: SendingArea[]
    side_effects: []

  # ---- receiving areas -----------------------------------------------------
  - method: POST
    path: "/tdr/receiving-areas"
    description: "Designate a receiving area with its density bonus ceiling, absorption cap, and design review posture."
    roles: [ProgramAdministrator]
    code: 201
    input: [code, name, neighborhood_code, base_density_units_per_acre, max_bonus_pct, absorption_cap_units, design_review_required, "eligible_sending_area_codes?"]
    output: ReceivingArea
    side_effects: ["status starts at DRAFT", "absorbed_units and reserved_units start at 0", "eligible_sending_area_codes defaults to the empty list, meaning every sending area is eligible"]
  - method: POST
    path: "/tdr/receiving-areas/{id}/activate"
    description: "Activate a receiving area so site applications may be filed against it."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ReceivingArea
    side_effects: ["status DRAFT -> ACTIVE", "increments ReceivingArea.version by 1"]
  - method: GET
    path: "/tdr/receiving-areas/{id}"
    description: "Read one receiving area, including absorbed_units and reserved_units."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: ReceivingArea
    side_effects: []
  - method: GET
    path: "/tdr/receiving-areas"
    description: "List receiving areas."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["status?", "neighborhood_code?", "design_review_required?", "limit?", "offset?"]
    output: ReceivingArea[]
    side_effects: []

  # ---- appraisal schedules -------------------------------------------------
  - method: POST
    path: "/tdr/appraisal-schedules"
    description: "Publish a per-unit appraisal schedule for a neighborhood over a half-open effective window."
    roles: [ProgramAdministrator]
    code: 201
    input: [neighborhood_code, per_unit_value_cents, equity_adjustment_bps, effective_from, effective_to]
    output: AppraisalSchedule
    side_effects: ["status starts at ACTIVE", "rejected with ERR_APPRAISAL_PERIOD_OVERLAP when it overlaps an existing ACTIVE window for the same neighborhood_code"]
  - method: GET
    path: "/tdr/appraisal-schedules/{id}"
    description: "Read one appraisal schedule."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: AppraisalSchedule
    side_effects: []
  - method: GET
    path: "/tdr/appraisal-schedules"
    description: "List appraisal schedules."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["neighborhood_code?", "status?", "limit?", "offset?"]
    output: AppraisalSchedule[]
    side_effects: []

  # ---- sending parcels -----------------------------------------------------
  - method: POST
    path: "/tdr/sending-parcels"
    description: "Enroll a parcel in a sending area; the baseline development-right allocation is computed at enrollment."
    roles: [ProgramAdministrator]
    code: 201
    input: [owner_party_id, sending_area_id, apn, gross_acres, constrained_acres, soil_class, existing_dwelling_units]
    output: SendingParcel
    side_effects:
      - "runs calculations.parcel_baseline_allocation in the variant named by the area's allocation_formula_version and stores baseline_allocation_units"
      - "remaining_units is set equal to baseline_allocation_units; severed_units and restricted_acres start at 0"
      - "easement_status starts at NONE and parcel_status starts at UNSEVERED"
  - method: GET
    path: "/tdr/sending-parcels/{id}"
    description: "Read one parcel with its baseline, severed, and remaining unit counts."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: SendingParcel
    side_effects: []
  - method: GET
    path: "/tdr/sending-parcels"
    description: "List parcels, filterable by owner or sending area."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["owner_party_id?", "sending_area_id?", "parcel_status?", "easement_status?", "limit?", "offset?"]
    output: SendingParcel[]
    side_effects: []

  # ---- severance applications ---------------------------------------------
  - method: POST
    path: "/tdr/severance-applications"
    description: "Apply to sever development rights from a sending parcel."
    roles: [Landowner]
    code: 201
    input: [sending_parcel_id, applicant_party_id, requested_units, "note?"]
    output: SeveranceApplication
    side_effects: ["status starts at SUBMITTED", "revision_round starts at 0", "allocated_units and residual_units_retained start at 0"]
  - method: GET
    path: "/tdr/severance-applications/{id}"
    description: "Read one severance application."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: SeveranceApplication
    side_effects: []
  - method: GET
    path: "/tdr/severance-applications"
    description: "List severance applications, filterable by parcel or applicant."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["sending_parcel_id?", "applicant_party_id?", "status?", "limit?", "offset?"]
    output: SeveranceApplication[]
    side_effects: []
  - method: POST
    path: "/tdr/severance-applications/{id}/screen"
    description: "Take a submitted application into review."
    roles: [SeveranceReviewer]
    code: 200
    input: ["screening_note?"]
    output: SeveranceApplication
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "sets screened_by_user_id to the acting X-User-ID", "increments SeveranceApplication.version by 1"]
  - method: POST
    path: "/tdr/severance-applications/{id}/review-decision"
    description: "Record the reviewer's decision: APPROVE, REQUIRE_REVISION, or DENY."
    roles: [SeveranceReviewer]
    code: 200
    input: [decision, "decision_note?", "denial_reason?"]
    output: SeveranceApplication
    side_effects:
      - "decision=APPROVE moves UNDER_REVIEW -> APPROVED and runs calculations.severance_allocation_grant to write allocated_units, residual_units_retained, and applied_formula_version"
      - "decision=REQUIRE_REVISION moves UNDER_REVIEW -> REVISION_REQUESTED"
      - "decision=DENY moves UNDER_REVIEW -> DENIED and sets denial_reason"
      - "sets decided_by_user_id to the acting X-User-ID"
      - "increments SeveranceApplication.version by 1"
  - method: POST
    path: "/tdr/severance-applications/{id}/resubmit"
    description: "Resubmit a revision-requested application with a restated unit request."
    roles: [Landowner]
    code: 200
    input: [requested_units, "note?"]
    output: SeveranceApplication
    side_effects: ["status REVISION_REQUESTED -> SUBMITTED", "increments revision_round by 1", "clears screened_by_user_id and decided_by_user_id", "increments SeveranceApplication.version by 1"]
  - method: POST
    path: "/tdr/severance-applications/{id}/certify"
    description: "Certify an approved severance: record the conservation easement on the sending parcel and issue the TDR certificate. The certifying operator may not be the reviewer who approved it."
    roles: [ProgramAdministrator]
    code: 201
    input: ["recording_note?"]
    output: Certificate
    side_effects:
      - "status APPROVED -> CERTIFIED and sets certified_by_user_id to the acting X-User-ID"
      - "creates or amends the parcel's ConservationEasement with recording_status RECORDED (first) or AMENDED (subsequent), recorded_at = current logical clock, and restricted_acres / permitted_residual_units from calculations.easement_restriction_extent"
      - "issues a Certificate with units_face = allocated_units, lifecycle_status ISSUED, market_status HELD, generation 1, holder_party_id = the applicant, and serial_number 'TDR-{area.code}-{issued_certificate_count:05d}'"
      - "appends an ISSUANCE row to CertificateTransfer with seq_no 1"
      - "cascade link 1: parcel severed_units += allocated_units, remaining_units -= allocated_units, restricted_acres and easement_status RECORDED, parcel_status PARTIALLY_SEVERED or FULLY_SEVERED"
      - "cascade link 2: sending area severed_units_total += allocated_units and issued_certificate_count += 1"
      - "cascade link 3: when the area's severed_units_total reaches sending_cap_units the area moves ACTIVE -> CLOSED"
      - "cascade link 4: the area's close cascade suspends every other open SeveranceApplication on its parcels"
      - "increments SeveranceApplication.version by 1"

  # ---- conservation easements ---------------------------------------------
  - method: GET
    path: "/tdr/conservation-easements/{id}"
    description: "Read one recorded conservation easement with its unit ledger and compliance posture."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: ConservationEasement
    side_effects: []
  - method: GET
    path: "/tdr/conservation-easements"
    description: "List conservation easements, filterable by parcel or originating severance application."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["sending_parcel_id?", "severance_application_id?", "recording_status?", "compliance_status?", "limit?", "offset?"]
    output: ConservationEasement[]
    side_effects: []
  - method: POST
    path: "/tdr/conservation-easements/{id}/inspections"
    description: "Record a monitoring inspection against a preserved parcel's easement."
    roles: [EasementMonitor]
    code: 201
    input: [inspection_date, finding, affected_acres, "note?"]
    output: MonitoringInspection
    side_effects:
      - "runs calculations.violation_severity_score to write severity_score and (for violations) cure_deadline"
      - "sets inspector_user_id to the acting X-User-ID and updates easement.last_inspection_at"
      - "finding=COMPLIANT closes immediately (status CLOSED) and leaves the easement COMPLIANT"
      - "a violation opens with status CURE_PENDING, increments easement.prior_violation_count, and drives the easement COMPLIANT -> VIOLATION_NOTICED with its cure_deadline"
      - "freeze cascade: the easement's certificates take market_status -> FROZEN, their ALLOCATED redemptions move to HELD_PENDING_COMPLIANCE, their PROPOSED market transactions are CANCELLED, and any DESIGN_APPROVED receiving site application whose backing falls short moves to BACKING_DEFICIENT"
      - "increments ConservationEasement.version by 1"
  - method: GET
    path: "/tdr/conservation-easements/{id}/inspections"
    description: "List the monitoring inspections recorded against one easement."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["status?", "finding?", "limit?", "offset?"]
    output: MonitoringInspection[]
    side_effects: []

  # ---- monitoring inspections ---------------------------------------------
  - method: GET
    path: "/tdr/monitoring-inspections/{id}"
    description: "Read one monitoring inspection with its severity score and cure deadline."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: MonitoringInspection
    side_effects: []
  - method: POST
    path: "/tdr/monitoring-inspections/{id}/cure-verification"
    description: "Verify the landowner's cure of a noticed violation. The verifying operator may not be the inspector who recorded the finding."
    roles: [EasementMonitor, ProgramAdministrator]
    code: 200
    input: [outcome, "verification_note?"]
    output: MonitoringInspection
    side_effects:
      - "outcome=CURE_IN_PROGRESS keeps status CURE_PENDING, drives the easement VIOLATION_NOTICED -> UNDER_CURE, and leaves the freeze in place"
      - "outcome=CURED moves status CURE_PENDING -> CURED and sets cure_verified_at and cure_verified_by_user_id"
      - "compensating cascade on CURED: the easement moves to CURED, its FROZEN certificates return to market_status HELD, their HELD_PENDING_COMPLIANCE redemptions return to ALLOCATED, and a BACKING_DEFICIENT receiving site application whose backing is restored returns to DESIGN_APPROVED"
      - "increments MonitoringInspection.version by 1"

  # ---- certificates and the registry chain of title -----------------------
  - method: GET
    path: "/tdr/certificates/{id}"
    description: "Read one TDR certificate with its unit ledger, lineage, and market posture."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/tdr/certificates"
    description: "Registry listing, filterable by holder, source easement, split parent, or originating sending area."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["holder_party_id?", "conservation_easement_id?", "parent_certificate_id?", "origin_sending_area_id?", "lifecycle_status?", "market_status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/tdr/certificates/{id}/split"
    description: "Split units off a certificate into a new child certificate, preserving the chain of title."
    roles: [Landowner, Developer, ProgramAdministrator]
    code: 201
    input: [units, expected_certificate_version]
    output: Certificate
    side_effects:
      - "mints a child Certificate with parent_certificate_id set, generation = parent.generation + 1, units_face = units, and serial_number '{parent.serial_number}-S{parent.split_count after increment}'"
      - "parent units_split_out += units and units_remaining -= units; parent split_count += 1"
      - "appends a SPLIT_OUT row on the parent and an ISSUANCE row on the child to CertificateTransfer"
      - "the source easement's units_issued_total and units_outstanding are unchanged"
      - "increments Certificate.version by 1 on the parent"
  - method: POST
    path: "/tdr/certificates/{id}/retire"
    description: "Permanently retire unencumbered units from a certificate."
    roles: [Landowner, Developer, ProgramAdministrator]
    code: 200
    input: [units, "reason?"]
    output: Certificate
    side_effects:
      - "units_retired += units and units_remaining -= units; lifecycle_status becomes RETIRED when units_remaining reaches 0"
      - "the source easement's units_retired += units and units_outstanding -= units, leaving units_issued_total unchanged"
      - "appends a RETIREMENT row to CertificateTransfer"
      - "increments Certificate.version by 1"
  - method: GET
    path: "/tdr/certificate-transfers/{id}"
    description: "Read one immutable chain-of-title row."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: CertificateTransfer
    side_effects: []
  - method: GET
    path: "/tdr/certificate-transfers"
    description: "Chain-of-title log, filterable by certificate, either party, or the settling market transaction."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["certificate_id?", "from_party_id?", "to_party_id?", "market_transaction_id?", "transfer_type?", "limit?", "offset?"]
    output: CertificateTransfer[]
    side_effects: []

  # ---- market transactions -------------------------------------------------
  - method: POST
    path: "/tdr/market-transactions"
    description: "Propose a transaction in certificate units: a private sale, a municipal bank purchase, or a bank resale. Pricing, the appraised reference, and the deviation band are all resolved here."
    roles: [Landowner, Developer, ProgramAdministrator]
    code: 201
    input: [certificate_id, seller_party_id, buyer_party_id, channel, units, conveyance_mode, "agreed_price_cents?"]
    output: MarketTransaction
    side_effects:
      - "status starts at PROPOSED"
      - "runs calculations.appraisal_reference_value to write applied_neighborhood_code, applied_per_unit_value_cents, and appraised_reference_cents"
      - "runs calculations.bank_channel_price to write gross_price_cents; agreed_price_cents is required for channel=PRIVATE and ignored for the two bank channels"
      - "runs calculations.price_deviation_band to write price_deviation_bps and rejects a proposal outside the band"
      - "sets the certificate's market_status HELD -> UNDER_CONTRACT and units_encumbered += units"
      - "program_fee_cents, equity_surcharge_cents, and net_to_seller_cents stay 0 until settlement"
      - "increments Certificate.version by 1"
  - method: GET
    path: "/tdr/market-transactions/{id}"
    description: "Read one market transaction with its pricing breakdown."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: MarketTransaction
    side_effects: []
  - method: GET
    path: "/tdr/market-transactions"
    description: "List market transactions, filterable by the traded certificate, either counterparty, or the certificate the buyer ended up holding."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["certificate_id?", "seller_party_id?", "buyer_party_id?", "conveyed_certificate_id?", "channel?", "status?", "limit?", "offset?"]
    output: MarketTransaction[]
    side_effects: []
  - method: POST
    path: "/tdr/market-transactions/{id}/settle"
    description: "Settle a proposed transaction: split the price into program fee, equity surcharge, and seller proceeds, move cash, and convey title."
    roles: [ProgramAdministrator]
    code: 200
    input: ["settlement_note?"]
    output: MarketTransaction
    side_effects:
      - "status PROPOSED -> SETTLED and settled_at = current logical clock"
      - "runs calculations.settlement_split to write program_fee_cents, equity_surcharge_cents, and net_to_seller_cents"
      - "buyer.cash_balance_cents -= gross_price_cents; seller.cash_balance_cents += net_to_seller_cents; the MUNICIPAL_BANK party's fee_revenue_cents += program_fee_cents + equity_surcharge_cents"
      - "conveyance_mode=WHOLE moves holder_party_id on the traded certificate and sets conveyed_certificate_id = certificate_id"
      - "conveyance_mode=PARTIAL mints a child certificate for the traded units, assigns it to the buyer, and sets conveyed_certificate_id to the child id"
      - "certificate units_encumbered -= units and market_status UNDER_CONTRACT -> HELD"
      - "appends a PRIVATE_SALE, BANK_PURCHASE, or BANK_RESALE row to CertificateTransfer with price_cents = gross_price_cents"
      - "recomputes units_held and certificates_held_count on both parties"
      - "increments MarketTransaction.version by 1"
  - method: POST
    path: "/tdr/market-transactions/{id}/cancel"
    description: "Cancel a proposed transaction before settlement."
    roles: [Landowner, Developer, ProgramAdministrator]
    code: 200
    input: ["reason?"]
    output: MarketTransaction
    side_effects: ["status PROPOSED -> CANCELLED", "certificate units_encumbered -= units and market_status returns to HELD (or stays FROZEN when the cancellation came from a compliance freeze)", "increments MarketTransaction.version by 1"]
  - method: POST
    path: "/tdr/market-transactions/{id}/reverse"
    description: "Reverse a settled transaction inside the 30-day reversal window, undoing every cash and title effect exactly."
    roles: [ProgramAdministrator]
    code: 200
    input: [reversal_reason]
    output: MarketTransaction
    side_effects:
      - "status SETTLED -> REVERSED, reversed_at = current logical clock, reversal_reason recorded"
      - "buyer.cash_balance_cents += gross_price_cents; seller.cash_balance_cents -= net_to_seller_cents; the bank's fee_revenue_cents -= program_fee_cents + equity_surcharge_cents"
      - "title returns to the seller: a WHOLE conveyance moves holder_party_id back; a PARTIAL conveyance folds the child certificate's units back into the parent and marks the child RETIRED with units_face 0"
      - "appends a REVERSAL row to CertificateTransfer with price_cents equal to the negated gross_price_cents"
      - "rejected with ERR_REVERSAL_NOT_PERMITTED when the conveyed certificate has since been redeemed or retired"
      - "increments MarketTransaction.version by 1"

  # ---- receiving site applications ----------------------------------------
  - method: POST
    path: "/tdr/receiving-site-applications"
    description: "File a receiving-site application for a density bonus; the provisional bonus sizing runs at intake and design review is entered when the area requires it."
    roles: [Developer]
    code: 201
    input: [developer_party_id, receiving_area_id, site_acres, requested_bonus_units]
    output: ReceivingSiteApplication
    side_effects:
      - "runs calculations.receiving_bonus_units PROVISIONAL variant to write base_units, max_bonus_units, required_backing_units, and provisional_bonus_units"
      - "status starts at DESIGN_REVIEW when the area has design_review_required=true, otherwise at DESIGN_APPROVED"
      - "design_review_round starts at 0; backed_units, pending_backed_units, and allocated_bonus_units start at 0"
  - method: GET
    path: "/tdr/receiving-site-applications/{id}"
    description: "Read one receiving-site application with its bonus sizing and backing totals."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: []
    output: ReceivingSiteApplication
    side_effects: []
  - method: GET
    path: "/tdr/receiving-site-applications"
    description: "List receiving-site applications, filterable by developer or receiving area."
    roles: [ProgramAdministrator, SeveranceReviewer, DesignReviewBoard, EasementMonitor, Landowner, Developer]
    code: 200
    input: ["developer_party_id?", "receiving_area_id?", "status?", "limit?", "offset?"]
    output: ReceivingSiteApplication[]
    side_effects: []
  - method: POST
    path: "/tdr/receiving-site-applications/{id}/redemptions"
    description: "Allocate certificate units to back a receiving-site application's requested bonus."
    roles: [Developer]
    code: 201
    input: [certificate_id, units, expected_receiving_site_application_version]
    output: CertificateRedemption
    side_effects:
      - "creates a CertificateRedemption with status ALLOCATED, allocated_at = current logical clock, and source_easement_id copied from the certificate's conservation_easement_id"
      - "certificate units_encumbered += units and ReceivingArea.reserved_units += units"
      - "recomputes pending_backed_units; a BACKING_DEFICIENT application whose backing is restored returns to DESIGN_APPROVED"
      - "increments ReceivingSiteApplication.version by 1"
  - method: POST
    path: "/tdr/receiving-site-applications/{id}/design-review-decision"
    description: "Record the design review board's decision: APPROVE, REQUIRE_REVISIONS, or DENY."
    roles: [DesignReviewBoard]
    code: 200
    input: [decision, "review_note?"]
    output: ReceivingSiteApplication
    side_effects:
      - "decision=APPROVE moves DESIGN_REVIEW -> DESIGN_APPROVED"
      - "decision=REQUIRE_REVISIONS moves DESIGN_REVIEW -> REVISIONS_REQUIRED"
      - "decision=DENY moves DESIGN_REVIEW -> DENIED, sets denial_reason, and releases every ALLOCATED or HELD_PENDING_COMPLIANCE redemption"
      - "sets design_reviewed_by_user_id to the acting X-User-ID"
      - "increments ReceivingSiteApplication.version by 1"
  - method: POST
    path: "/tdr/receiving-site-applications/{id}/resubmit-design"
    description: "Resubmit a revised design with a restated bonus request."
    roles: [Developer]
    code: 200
    input: [requested_bonus_units, "revision_note?"]
    output: ReceivingSiteApplication
    side_effects:
      - "status REVISIONS_REQUIRED -> DESIGN_REVIEW and design_review_round += 1"
      - "re-runs calculations.receiving_bonus_units PROVISIONAL variant, restating required_backing_units and provisional_bonus_units"
      - "increments ReceivingSiteApplication.version by 1"
  - method: POST
    path: "/tdr/receiving-site-applications/{id}/finalize"
    description: "Finalize an approved receiving-site application: confirm its redemptions, absorb the units into the receiving area, and fix the granted bonus."
    roles: [Developer]
    code: 200
    input: ["finalization_note?"]
    output: ReceivingSiteApplication
    side_effects:
      - "status DESIGN_APPROVED -> FINALIZED and finalized_at = current logical clock"
      - "every ALLOCATED redemption moves to CONFIRMED in ascending allocated_at order, ties broken by ascending created_at"
      - "each confirmation advances its certificate to PARTIALLY_REDEEMED or REDEEMED and appends a REDEMPTION row to CertificateTransfer"
      - "ReceivingArea.reserved_units -= confirmed units and absorbed_units += confirmed units; each source easement's units_redeemed_confirmed += units and units_outstanding -= units"
      - "runs calculations.receiving_bonus_units FINAL variant to write allocated_bonus_units"
      - "the receiving area moves ACTIVE -> SUSPENDED when absorbed_units reaches absorption_cap_units"
      - "increments ReceivingSiteApplication.version by 1"

