          assert:
            - "the activation returns 403 and err_role == ERR_UNAUTHORIZED"
            - "Seat.${seat_id}.status == PROVISIONED and activated_at is null"
            - "ClientAccount.${acct_id}.active_seat_count == 0"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_document_version_on_the_second_inclusion
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[inclusion-create-stale-document]
          - errors.ERR_STALE_VERSION
          - entities.ResearchDocument.fields.version
        distinguishing_aspect: "Two strictly sequential inclusion creates: the first advances ResearchDocument.version, so the second replaying the originally observed version is rejected 412 while a fresh read of the version succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst, two ACTIVE vendors and one DRAFT document."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_ven1
            - *c_ven2
            - *c_doc
          trigger:
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc1_id: $.data.id }
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven2_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 3.00, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.00, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 3.00, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.00, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 3.00, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /research/documents/${doc_id}"
              payload: {}
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { doc_v_fresh: $.data.version }
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven2_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 3.00, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.00, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 3.00, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.00, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 3.00, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v_fresh}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc2_id: $.data.id }
          assert:
            - "the stale second create returns 412 and err_stale == ERR_STALE_VERSION"
            - "ResearchDocument.${doc_id}.version == 2 after the first inclusion"
            - "the retry with the freshly read version returns 201 and VendorInclusion.${inc2_id}.inclusion_status == UNDER_EVALUATION"
            - "GET /research/vendor-inclusions?document_id=${doc_id} returns exactly 2 rows"

      - name: occ_stale_analyst_version_on_the_second_sales_relationship
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[relationship-create-stale-analyst]
          - errors.ERR_STALE_VERSION
          - entities.Analyst.fields.version
        distinguishing_aspect: "An analyst may legitimately hold two commercial ties to one vendor, so the second create is not a state violation — it is the stale expected_analyst_version that fails with 412, and the same payload with a fresh version succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst and one ACTIVE vendor."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_ven1
          trigger:
            - call: "POST /research/sales-relationships"
              payload: { analyst_id: "${an1_id}", vendor_id: "${ven1_id}", relationship_type: "SPONSORSHIP", annual_value_cents: 3000000, expected_analyst_version: "${an1_v}" }
              as: SalesRep
              captures: { sr1_id: $.data.id }
            - call: "POST /research/sales-relationships"
              payload: { analyst_id: "${an1_id}", vendor_id: "${ven1_id}", relationship_type: "SPEAKING_FEE", annual_value_cents: 250000, expected_analyst_version: "${an1_v}" }
              as: SalesRep
              captures: { err_stale: $.data.error_id }
            - call: "GET /research/analysts/${an1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { an1_v_fresh: $.data.version }
            - call: "POST /research/sales-relationships"
              payload: { analyst_id: "${an1_id}", vendor_id: "${ven1_id}", relationship_type: "SPEAKING_FEE", annual_value_cents: 250000, expected_analyst_version: "${an1_v_fresh}" }
              as: SalesRep
              captures: { sr2_id: $.data.id }
          assert:
            - "the stale second create returns 412 and err_stale == ERR_STALE_VERSION"
            - "the retry with the fresh analyst version returns 201"
            - "GET /research/sales-relationships?analyst_id=${an1_id} returns exactly 2 rows"
            - "Vendor.${ven1_id}.active_sales_relationship_count == 2"

      - name: version_pinning_blocks_a_second_finalize_after_publication
        claim_type: version_pinning_on_approval
        grounds:
          - entities.VendorInclusion.fields.placement_locked
          - entities.VendorInclusion.fields.weighted_total_score
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once the document is published the placement snapshot is pinned: a second finalize on the INCLUDED inclusion is refused with 409 ERR_INVALID_STATE and the frozen weighted_total_score is unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Published document with one INCLUDED inclusion."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - *c_an2
            - *c_ven1
            - *c_doc
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /research/vendor-inclusions/${inc_id}/finalize"
              payload: { outcome: "INCLUDE" }
              as: ResearchDirector
            - call: "POST /research/documents/${doc_id}/submit-for-review"
              payload: { peer_reviewer_analyst_id: "${an2_id}" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/documents/${doc_id}/peer-verdicts"
              payload: { verdict: "APPROVE" }
              as: Analyst
              as_user_id: "${an2_id}"
            - call: "POST /research/vendor-inclusions/${inc_id}/fact-check-responses"
              payload: { response_summary: "Revenue restated.", correction_offered: true }
              as: VendorRep
              as_user_id: "${ven1_id}"
            - call: "POST /research/vendor-inclusions/${inc_id}/fact-check-decisions"
              payload: { outcome: "ACCEPT" }
              as: ResearchDirector
            - call: "POST /research/documents/${doc_id}/publish"
              payload: {}
              as: ResearchDirector
          trigger:
            - call: "POST /research/vendor-inclusions/${inc_id}/finalize"
              payload: { outcome: "EXCLUDE" }
              as: ResearchDirector
              captures: { err_pinned: $.data.error_id }
          assert:
            - "VendorInclusion.${inc_id}.placement_locked == true"
            - "the second finalize returns 409 and err_pinned == ERR_INVALID_STATE"
            - "VendorInclusion.${inc_id}.inclusion_status == INCLUDED"
            - "VendorInclusion.${inc_id}.weighted_total_score == 3.86 and has not changed"

      - name: immediate_consistency_reservation_is_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.inquiry_allowance_ledger
          - endpoints.GET_/research/clients/{id}
        distinguishing_aspect: "The consistency model is immediate: the reservation written by the schedule request is already visible to the very next read, with no reconciliation window."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with allowance 10, one ACTIVE seat and one analyst."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - *c_an1
            - *c_seat
            - *c_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Immediate visibility", requested_start_utc: "2026-09-20T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_id: $.data.id }
          trigger:
            - call: "GET /research/clients/${acct_id}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/inquiry-requests/${inq_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-20T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "GET /research/clients/${acct_id}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the read before scheduling shows reserved_inquiry_units == 0 and remaining_reserved_units == 10"
            - "the schedule response itself reports InquiryRequest.${inq_id}.status == SCHEDULED"
            - "the immediately following read shows reserved_inquiry_units == 1 and remaining_reserved_units == 9"
            - "consumed_inquiry_units is still 0 and remaining_consumed_units is still 10"

