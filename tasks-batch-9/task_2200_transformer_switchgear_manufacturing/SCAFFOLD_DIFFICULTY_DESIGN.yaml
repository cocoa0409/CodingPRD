              payload: { reason: "lifetime quality index below 60.00" }
              as: PlantAdmin
          assert:
            - "Supplier.${sup_id}.receipt_event_count == 2"
            - "Supplier.${sup_id}.attributed_failure_count == 3"
            - "Supplier.${sup_id}.quality_index_trailing == 62.50"
            - "Supplier.${sup_id}.quality_index_lifetime == 0.00"
            - "Supplier.${sup_id}.quality_index_trailing != Supplier.${sup_id}.quality_index_lifetime"
            - "the APPROVED -> PROBATION transition fired on the third publish because quality_index_trailing 62.50 < 70.00, so Supplier.${sup_id}.probation_entered_at is non-null"
            - "POST /suppliers/${sup_id}/suspend returns HTTP 200 and Supplier.${sup_id}.status == SUSPENDED, authorised solely because quality_index_lifetime 0.00 < 60.00 while quality_index_trailing 62.50 >= 60.00"
            - "WarrantyClaim.${wc3_id}.status == WARRANTABLE"
            - "LongLeadComponent.${comp_id}.status == ACTIVE (quarantine_recommended false on all three reports)"

  - rule_id: combinatorial_formula
    instances:

      - name: arc_flash_kv_factor_tier_15_vs_15_5_flips_ppe_category_on_identical_readings
        grounds:
          - calculations.arc_flash_label_values
          - entities.EngineeredOrder.fields.rated_kv
          - entities.ComplianceLabel.fields.incident_energy_cal_cm2
          - entities.ComplianceLabel.fields.ppe_category
          - entities.ComplianceLabel.fields.arc_flash_boundary_mm
          - state_machines.ComplianceLabel.DRAFT_to_GENERATED
        distinguishing_aspect: |
          Two orders whose TestReports carry byte-identical readings (short_circuit_current_ka 20,
          arc_duration_ms 150, working_distance_mm 455) diverge purely on the kv_factor mode:
          rated_kv 15 selects 1.00 and yields incident_energy_cal_cm2 7.5 / ppe_category 2 /
          arc_flash_boundary_mm 1132, while rated_kv 15.5 selects 1.25 and yields 9.3 / 3 / 1265.
        test_recipe:
          setup:
            - "Two independent EngineeredOrders driven to IN_PRODUCTION with DESIGN_RELEASED, contract_value_cents 4000000 each (below the 5000000 escalation-clause threshold so no clause is needed)."
            - "Order LOW is rated_kv 15 (kv_factor tier boundary, inclusive upper bound of the 1.00 band); order HIGH is rated_kv 15.5 (first value in the 1.25 band)."
            - "Each order carries one PASSED FactoryAcceptanceTest with an ISSUED, passing TestReport whose readings are short_circuit_current_ka 20, arc_duration_ms 150, working_distance_mm 455, winding_temp_rise_c 55, temp_rise_limit_c 65, requires_impulse false."
            - "One shared TestBay BAY-CF1 (max_kv 145, changeover_buffer_hours 4) with the two test windows non-overlapping: LOW at 2026-02-10T08:00:00Z (occupies through 20:00) and HIGH at 2026-02-11T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /test-bays"
              payload: { bay_code: "BAY-CF1", max_kv: 145, changeover_buffer_hours: 4, supports_impulse: true }
              as: PlantAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CF1", legal_name: "Aurora Magnetics", region: "NA" }
              as: PlantAdmin
