  # ===========================================================================
  - section: endpoints
    instances:

      - name: create_policy_is_an_action_endpoint_with_nested_children
        claim_type: Standard CRUD
        grounds: ['endpoints.POST_/wc/policies']
        distinguishing_aspect: "Policy creation is nested creation: a single POST materializes Policy plus its PolicyClassCode children, returning 201 with the parent."
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispute_review_rework_cycle_then_approval
          rationale: "That instance's setup creates a policy with class codes and lists them via GET class-codes, exercising the nested-creation claim."

      - name: invoice_payment_endpoint_is_conditional_action
        claim_type: Conditional action
        grounds: ['endpoints.POST_/wc/invoices/{id}/payments', 'state_machines.PremiumInvoice']
        distinguishing_aspect: "Payments are allowed only from ISSUED; paying a PAID invoice fails ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Bound policy with one invoice already PAID."]
          setup_api_calls:
