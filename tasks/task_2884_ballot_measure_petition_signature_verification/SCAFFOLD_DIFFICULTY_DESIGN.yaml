  - rule_id: non_linear_state_machine
    instances:

      - name: petition_format_review_revision_cycle_exhausts_rounds
        grounds:
          - state_machines.Petition.DRAFT_to_FORMAT_REVIEW
          - state_machines.Petition.FORMAT_REVIEW_to_FORMAT_REJECTED
          - state_machines.Petition.FORMAT_REJECTED_to_FORMAT_REVIEW
          - entities.Petition.fields.format_review_round
          - errors[ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          The non-linearity here is a CYCLE on Petition: FORMAT_REVIEW -> FORMAT_REJECTED ->
          FORMAT_REVIEW is re-entrant, and the loop is bounded not by the state but by the counter
          format_review_round, so the second re-submit succeeds at counter 1 and the third is refused
          at counter 2 with ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED while the petition sits in the very
          state the transition list otherwise admits.
        test_recipe:
          setup:
            - "Standard SOS-FULL exists; clock at 2026-08-01."
            - "Petition pet_f created by prop-1 with a single subject code, submitted, rejected on format, re-submitted, and rejected a second time."
            - "After the second rejection pet_f.status == FORMAT_REJECTED and pet_f.format_review_round == 2 == MAX_FORMAT_REVIEW_ROUNDS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-FULL", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 15000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250, cure_allowed: true, cure_window_days: 30, cure_eligibility_floor_bps: 5000, circulation_window_days: 180 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Format Committee", submitted_title: "Format Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { round_after_first_submit: $.data.format_review_round, status_after_first_submit: $.data.status }
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "REJECT", reviewer_note: "Title exceeds the statutory length." }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { round_after_first_reject: $.data.format_review_round }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { status_after_resubmit: $.data.status }
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "REJECT", reviewer_note: "Summary still omits the fiscal note." }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { round_after_second_reject: $.data.format_review_round }
          trigger:
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${round_after_first_submit} == 0 and ${status_after_first_submit} == FORMAT_REVIEW"
            - "${round_after_first_reject} == 1"
            - "${status_after_resubmit} == FORMAT_REVIEW — the cycle re-enters the same state from FORMAT_REJECTED"
            - "${round_after_second_reject} == 2"
            - "${err_id} == ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED with HTTP 409"
            - "Petition.${pet_id}.status == FORMAT_REJECTED — the refused submit left the state untouched"
            - "Petition.${pet_id}.format_review_round == 2 — the counter did not advance on the refusal"

      - name: signature_batch_fork_join_diamond_with_delta_cost
        grounds:
          - state_machines.SignatureBatch.AFFIDAVIT_VERIFIED_to_SAMPLED
          - state_machines.SignatureBatch.SAMPLED_to_FULLY_CHECKED
          - state_machines.Petition.SAMPLE_VERIFICATION_to_FULL_CHECK
          - calculations.batch_verification_cost
          - calculations.sample_projection
        distinguishing_aspect: |
          The non-linearity here is a DIAMOND on SignatureBatch, a different entity from the Petition
          cycle: AFFIDAVIT_VERIFIED forks to SAMPLED (a RANDOM_SAMPLE round touched some lines) and
          both arms join at FULLY_CHECKED, and the join is not idempotent — the second round adds a
          DELTA of 9 cents (19 minus the 10 already stored) rather than a second full 19, so the
          petition ledger reads 19 and not 29.
