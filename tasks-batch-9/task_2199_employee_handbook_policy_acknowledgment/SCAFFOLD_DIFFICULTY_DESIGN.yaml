scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: coverage_snapshot_vs_live_roster_denominator
        grounds:
          - calculations.distribution_coverage_rate
          - entities.ReleasePackage.fields.coverage_snapshot_pct
          - entities.ReleasePackage.fields.coverage_live_pct
          - entities.ReleasePackage.fields.roster_snapshot_size
          - endpoints[GET /release-packages/{release_package_id}/coverage]
        distinguishing_aspect: |
          Subject is the ReleasePackage distribution ledger: with an identical numerator of 1
          acknowledged assignment, the frozen snapshot denominator (3) yields 33.33 while the
          live denominator (2, excluding the TERMINATED assignee) yields 50.00 on the same read.
        test_recipe:
          setup:
            - "Jurisdiction CA with ack_deadline_days 30, min_legal_review_days 10, required_language_codes ['en'], retention_years 5, ack_window_buffer_days 3."
            - "Three ACTIVE CA employees; PolicyDocument CODE_OF_CONDUCT with max_ack_deadline_days 5; version v1 APPROVED with an APPROVED CA addendum and an APPROVED CA legal review; 'en' Translation PUBLISHED at a11y_index 96.00."
            - "ReleasePackage P1 (effective_date 2026-08-15T00:00:00Z, scope [CA]) RELEASED at logical clock 2026-08-15T00:00:00Z, minting 3 assignments with due_date 2026-08-20T00:00:00Z and roster_snapshot_size 3."
            - "Employee 1 acknowledged; Employee 3 subsequently PATCHed to TERMINATED; Employee 2 left PENDING."
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One", preferred_language_code: "en", needs_accessible_format: false, employment_status: "ACTIVE" }, as: HRComplianceAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e2@ex.com", full_name: "Emp Two", preferred_language_code: "en", needs_accessible_format: false, employment_status: "ACTIVE" }, as: HRComplianceAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e3@ex.com", full_name: "Emp Three", preferred_language_code: "en", needs_accessible_format: false, employment_status: "ACTIVE" }, as: HRComplianceAdmin, captures: { e3: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT", max_ack_deadline_days: 5 }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 S3 S4", section_count: 4, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r_ca}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /legal-reviews/${lr1}/decision", payload: { verdict: "APPROVE" }, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/approve", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
            - { call: "POST /translations/${t1}/start", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/submit-a11y", payload: { section_scores: [0.96, 0.96, 0.96, 0.96] }, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/publish", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-08-15T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/schedule", payload: {}, as: HRComplianceAdmin, captures: { p1v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/release", payload: { expected_release_package_version: "${p1v}" }, as: HRComplianceAdmin }
            - { call: "GET /assignments", payload: { employee_id: "${e1}", release_package_id: "${p1}" }, as: HRComplianceAdmin, captures: { asg1: "$.data[0].id" } }
            - { call: "POST /assignments/${asg1}/deliver", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /acknowledgments", payload: { assignment_id: "${asg1}", method: "ESIGN", language_code: "en", signature_text: "Emp One" }, as: Employee, as_user_id: "${e1}" }
            - { call: "PATCH /employees/${e3}", payload: { employment_status: "TERMINATED" }, as: HRComplianceAdmin }
          trigger:
            - { call: "GET /release-packages/${p1}/coverage", payload: {}, as: HRComplianceAdmin }
          assert:
            - "ReleasePackage.${p1}.roster_snapshot_size == 3"
            - "ReleasePackage.${p1}.coverage_snapshot_pct == 33.33"
            - "ReleasePackage.${p1}.coverage_live_pct == 50.00"
            - "ReleasePackage.${p1}.coverage_snapshot_pct != ReleasePackage.${p1}.coverage_live_pct"
            - "ReleasePackage.${p1}.status == RELEASED"
      - name: exception_risk_aggregate_vs_conservative_ceiling
        grounds:
          - calculations.exception_risk_score
          - entities.PolicyException.fields.risk_score_aggregate
          - entities.PolicyException.fields.risk_score_conservative
          - endpoints[POST /policy-exceptions]
        distinguishing_aspect: |
          Subject is the PolicyException risk dossier (not a coverage ledger): the same four
          factors are combined by a weighted blend (28.50) and by a peak-dominant conservative
          ceiling (41.40), so the aggregate variant would clear GRANT_RISK_CEILING while the
          conservative variant is the one the grant gate reads.
        test_recipe:
          setup:
            - "Jurisdiction CA (min_legal_review_days 10, ack_deadline_days 30, retention_years 5, ack_window_buffer_days 3, esign_permitted true)."
            - "Manager employee plus Employee e1 whose manager_id is the manager; PolicyDocument CODE_OF_CONDUCT with max_ack_deadline_days 5."
            - "Version v1 APPROVED (APPROVED CA addendum, APPROVED CA legal review), 'en' Translation PUBLISHED, ReleasePackage P1 RELEASED at 2026-08-15T00:00:00Z so e1 holds a delivered PENDING assignment."
            - "Employee row re-read after release so the OCC token reflects the open_ack_count bump."
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "mgr@ex.com", full_name: "Mgr Zero", preferred_language_code: "en", needs_accessible_format: false, employment_status: "ACTIVE" }, as: HRComplianceAdmin, captures: { e_mgr: "$.data.id" } }
            - { call: "POST /employees", payload: { jurisdiction_id: "${j_ca}", work_email: "e1@ex.com", full_name: "Emp One", preferred_language_code: "en", needs_accessible_format: false, employment_status: "ACTIVE", manager_id: "${e_mgr}" }, as: HRComplianceAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT", max_ack_deadline_days: 5 }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 S3 S4", section_count: 4, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r_ca}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /legal-reviews/${lr1}/decision", payload: { verdict: "APPROVE" }, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/approve", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
            - { call: "POST /translations/${t1}/start", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/submit-a11y", payload: { section_scores: [0.96, 0.96, 0.96, 0.96] }, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/publish", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-08-15T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/schedule", payload: {}, as: HRComplianceAdmin, captures: { p1v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: HRComplianceAdmin }
            - { call: "POST /release-packages/${p1}/release", payload: { expected_release_package_version: "${p1v}" }, as: HRComplianceAdmin }
            - { call: "GET /assignments", payload: { employee_id: "${e1}", release_package_id: "${p1}" }, as: HRComplianceAdmin, captures: { asg1: "$.data[0].id" } }
            - { call: "POST /assignments/${asg1}/deliver", payload: {}, as: HRComplianceAdmin }
            - { call: "GET /employees/${e1}", payload: {}, as: HRComplianceAdmin, captures: { e1v: "$.data.version" } }
          trigger:
            - { call: "POST /policy-exceptions", payload: { policy_version_id: "${v1}", reason_code: "MEDICAL", justification: "Recovering from surgery; cannot complete e-sign flow yet.", requested_days: 90, expected_employee_version: "${e1v}" }, as: Employee, as_user_id: "${e1}", captures: { x1: "$.data.id" } }
          assert:
            - "PolicyException.${x1}.prior_exception_count == 0"
            - "PolicyException.${x1}.risk_score_aggregate == 28.50"
            - "PolicyException.${x1}.risk_score_conservative == 41.40"
            - "PolicyException.${x1}.status == SUBMITTED"
            - "PolicyException.${x1}.risk_score_conservative > PolicyException.${x1}.risk_score_aggregate"
  - rule_id: combinatorial_formula
    instances:
      - name: a11y_index_round_per_section_before_summing
        combinatorial_mode: b
        grounds:
          - calculations.translation_accessibility_index
          - entities.Translation.fields.a11y_index
          - entities.Translation.fields.conformance_level
          - endpoints[POST /translations/{translation_id}/submit-a11y]
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity inside a single arithmetic expression: the pinned
          order (percent-scale each section, round to 2 dp, then sum, then divide, then round
          once) yields 90.51 whereas summing the raw scores first yields 90.50. The divergence
          is real, not decorative, and it is the number the AA gate is measured against.
        test_recipe:
          setup:
            - "Jurisdiction CA (min_legal_review_days 10, ack_deadline_days 30, retention_years 5, required_language_codes ['en'], ack_window_buffer_days 3)."
            - "PolicyDocument CODE_OF_CONDUCT; PolicyVersion v1 with section_count 4, required_jurisdiction_ids [CA], driven to APPROVED through an APPROVED CA addendum and an APPROVED CA legal review."
            - "An 'en' Translation created and moved to IN_TRANSLATION, with no prior section_scores submitted."
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT", max_ack_deadline_days: 5 }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 S3 S4", section_count: 4, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r_ca}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /legal-reviews/${lr1}/decision", payload: { verdict: "APPROVE" }, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/approve", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
            - { call: "POST /translations/${t1}/start", payload: {}, as: LocalizationSpecialist }
          trigger:
            - { call: "POST /translations/${t1}/submit-a11y", payload: { section_scores: [0.90125, 0.90375, 0.90625, 0.90875] }, as: LocalizationSpecialist }
          assert:
            - "Translation.${t1}.a11y_index == 90.51"
            - "Translation.${t1}.a11y_index != 90.50"
            - "Translation.${t1}.conformance_level == AA"
            - "Translation.${t1}.status == A11Y_REVIEW"
            - "Translation.${t1}.a11y_round_no == 1"
      - name: legal_review_deadline_three_step_order_no_rederivation
        combinatorial_mode: c
        grounds:
          - calculations.legal_review_deadline
          - entities.ReleasePackage.fields.legal_review_deadline
          - entities.Jurisdiction.fields.min_legal_review_days
          - endpoints[POST /release-packages/{release_package_id}/schedule]
        distinguishing_aspect: |
          Mode (c) multi-step pipeline whose intermediate slack_days must be derived from
          base_days only: base_days 20 comes from TX, a scope jurisdiction that is NOT in the
          version's required_jurisdiction_ids, and lead_days 40 puts slack_days at 20 so the
          buffer is 1 day and the deadline is 2026-08-29. Re-deriving slack from the resulting
          deadline flips the buffer to 7 and yields 2026-08-23, which is wrong.
        test_recipe:
          setup:
            - "Jurisdiction CA with min_legal_review_days 10 and Jurisdiction TX with min_legal_review_days 20; both list required_language_codes ['en']."
            - "PolicyVersion v1 has required_jurisdiction_ids [CA] only, so TX contributes to base_days through the package scope but not to the per-jurisdiction lead-time check."
            - "v1 APPROVED with an APPROVED CA addendum and an APPROVED CA legal review decided at the 2026-08-01T00:00:00Z startup clock; 'en' Translation PUBLISHED at 96.00."
            - "ReleasePackage P1 created with effective_date 2026-09-19T00:00:00Z and scope [CA, TX], one ReleaseItem for v1, then the logical clock advanced to 2026-08-10T00:00:00Z so lead_days is exactly 40."
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /jurisdictions", payload: { state_code: "TX", display_name: "Texas", min_legal_review_days: 20, ack_deadline_days: 45, retention_years: 2, required_language_codes: ["en"], esign_permitted: false, proxy_ack_permitted: true, ack_window_buffer_days: 10 }, as: HRComplianceAdmin, captures: { j_tx: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT", max_ack_deadline_days: 5 }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 S3 S4", section_count: 4, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/addenda", payload: { jurisdiction_id: "${j_ca}", body_text: "CA addendum" }, as: PolicyAuthor, captures: { a1: "$.data.id" } }
            - { call: "POST /policy-versions/${v1}/legal-reviews", payload: { jurisdiction_id: "${j_ca}", reviewer_id: "${r_ca}", due_at: "2026-08-20T00:00:00Z" }, as: PolicyAuthor, captures: { lr1: "$.data.id" } }
            - { call: "POST /addenda/${a1}/approve", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/submit-for-review", payload: {}, as: PolicyAuthor }
            - { call: "POST /legal-reviews/${lr1}/start", payload: {}, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /legal-reviews/${lr1}/decision", payload: { verdict: "APPROVE" }, as: LegalCounsel, as_user_id: "${r_ca}" }
            - { call: "POST /policy-versions/${v1}/approve", payload: {}, as: HRComplianceAdmin }
            - { call: "POST /policy-versions/${v1}/translations", payload: { language_code: "en" }, as: LocalizationSpecialist, captures: { t1: "$.data.id" } }
            - { call: "POST /translations/${t1}/start", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/submit-a11y", payload: { section_scores: [0.96, 0.96, 0.96, 0.96] }, as: LocalizationSpecialist }
            - { call: "POST /translations/${t1}/publish", payload: {}, as: LocalizationSpecialist }
            - { call: "POST /release-packages", payload: { name: "P1", effective_date: "2026-09-19T00:00:00Z", scope_jurisdiction_ids: ["${j_ca}", "${j_tx}"] }, as: HRComplianceAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /release-packages/${p1}/items", payload: { policy_version_id: "${v1}" }, as: HRComplianceAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: HRComplianceAdmin }
          trigger:
            - { call: "POST /release-packages/${p1}/schedule", payload: {}, as: HRComplianceAdmin }
          assert:
            - "ReleasePackage.${p1}.status == SCHEDULED"
            - "ReleasePackage.${p1}.legal_review_deadline == 2026-08-29T00:00:00.000Z"
            - "ReleasePackage.${p1}.legal_review_deadline != 2026-08-23T00:00:00.000Z"
            - "ReleasePackage.${p1}.scheduled_at == 2026-08-10T00:00:00.000Z"
  - rule_id: non_linear_state_machine
    instances:
      - name: legal_review_revisits_requested_with_monotonic_round_no
        grounds:
          - state_machines.LegalReview
          - entities.LegalReview.fields.round_no
          - entities.LegalReview.fields.decided_at
          - endpoints[POST /legal-reviews/{legal_review_id}/re-request]
        distinguishing_aspect: |
          Cycle on the LegalReview machine itself: REQUESTED -> IN_PROGRESS ->
          CHANGES_REQUESTED -> REQUESTED returns the row to a state it already occupied, so
          status alone cannot identify how far the review has travelled; round_no is the
          monotonic discriminator and decided_at must be cleared on the revisit.
        test_recipe:
          setup:
            - "Jurisdiction CA (min_legal_review_days 10); one active CA LegalReviewer with concurrent_review_limit 3."
            - "PolicyDocument CODE_OF_CONDUCT, PolicyVersion v1 with required_jurisdiction_ids [CA], one CA addendum APPROVED, one CA LegalReview requested, version submitted for review, review started."
            - "The reviewer returns verdict REQUEST_CHANGES, driving the review to CHANGES_REQUESTED and the version back to DRAFT."
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { state_code: "CA", display_name: "California", min_legal_review_days: 10, ack_deadline_days: 30, retention_years: 5, required_language_codes: ["en"], esign_permitted: true, proxy_ack_permitted: false, ack_window_buffer_days: 3 }, as: HRComplianceAdmin, captures: { j_ca: "$.data.id" } }
            - { call: "POST /legal-reviewers", payload: { jurisdiction_id: "${j_ca}", full_name: "Ada Counsel", bar_number: "CA-1", concurrent_review_limit: 3, is_active: true }, as: HRComplianceAdmin, captures: { r_ca: "$.data.id" } }
            - { call: "POST /policy-documents", payload: { title: "Code of Conduct 2026", category: "CODE_OF_CONDUCT", max_ack_deadline_days: 5 }, as: PolicyAuthor, captures: { d1: "$.data.id", d1v: "$.data.version" } }
            - { call: "POST /policy-documents/${d1}/versions", payload: { body_text: "S1 S2 S3 S4", section_count: 4, required_jurisdiction_ids: ["${j_ca}"], expected_policy_document_version: "${d1v}" }, as: PolicyAuthor, captures: { v1: "$.data.id" } }
