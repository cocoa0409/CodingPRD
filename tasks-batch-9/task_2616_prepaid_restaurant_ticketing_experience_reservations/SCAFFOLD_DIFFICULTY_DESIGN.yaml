  - rule_id: transitive_cascade
    instances:

      - name: release_run_cascade_to_double_promotion_and_sold_out
        grounds:
          - calculations.release_run_allocation
          - endpoints.POST_/services/{id}/release-run.side_effects
          - state_machines.TicketClass.status
          - state_machines.WaitlistEntry.status
          - entities.Service.fields.last_release_promoted_count
        distinguishing_aspect: |
          One release-run request propagates four hops: seat pool move on the
          TicketClass -> class status OPEN -> RELEASED -> two WaitlistEntries
          WAITING -> OFFERED -> two release-priced PENDING hold Reservations
          minted -> class RELEASED -> SOLD_OUT inside the same request. The
          drawing pool here is seats_released, so both minted holds are
          release-priced, and the second hold is quoted 16524 rather than 15300
          because the first promotion inside the same cascade already crossed
          the 5000 bp scarcity step. Depth 4 chain.
        test_recipe:
          setup:
            - "one restaurant, one package with release_discount_bp 1500 and base_price_cents 12000"
            - "one PUBLISHED Saturday HIGH service seating 2026-09-12T22:00:00Z with unsold_release_bp 10000 and release_lead_minutes 180"
            - "one 6-seat ticket class with one CONFIRMED party-of-2 reservation, so seats_sold 2 and seats_available 4"
            - "two waiting guests each with a party-of-2 WAITING entry, guest WA created before guest WB, both scoring 1100 under YIELD_WEIGHTED"
            - "logical clock advanced to 2026-09-12T20:00:00Z, inside the 180-minute release window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
