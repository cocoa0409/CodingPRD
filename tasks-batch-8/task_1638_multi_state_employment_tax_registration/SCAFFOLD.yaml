# =============================================================================
# PRD Benchmark Seed Tables — Multi-State Employment Tax Registration & Compliance
# =============================================================================

scenario: |
  Multi-State Employment Tax Registration & Compliance (employment tax team): nexus determination from employee work location, state/local registration & account setup, reciprocity & courtesy withholding elections, local tax jurisdiction assignment by address, unemployment insurance rate maintenance & voluntary contribution decision, remote worker location change tracking, filing calendar & deposit schedules, notice resolution & penalty abatement

domain_name: multi-state-employment-tax
api_prefix: /etax

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: fein, type: string, source: input, description: "Federal EIN, 9 digits, globally unique", constraints: "exactly 9 digits; unique" }
      - { name: home_state_code, type: string, source: input, description: "HQ state, 2-letter code" }
      - { name: compliance_posture, type: enum, source: computed, description: "GOOD_STANDING | WATCH | DELINQUENT — derived from open notices, LATE obligations, unconfirmed THRESHOLD_MET nexus cases (see calc compliance_posture)" }
      - { name: open_notice_count, type: integer, source: computed, description: "Count of AgencyNotice with status IN {RECEIVED, TRIAGED, RESPONSE_IN_PROGRESS, ESCALATED}" }
      - { name: outstanding_penalty_cents, type: integer, source: computed, description: "Sum of (penalty_amount_cents - abated_amount_cents) over AgencyNotice with status IN {RECEIVED, TRIAGED, RESPONSE_IN_PROGRESS, ESCALATED}" }
      - { name: registered_state_count, type: integer, source: computed, description: "Count of distinct state_code over Registrations with status ACTIVE" }

  - name: TaxAgency
    parent: null
    common_fields: true
    fields:
      - { name: agency_kind, type: enum, source: input, description: "STATE_WITHHOLDING | STATE_UI | LOCAL" }
      - { name: state_code, type: string, source: input, description: "2-letter state code" }
      - { name: locality_code, type: string, source: input, required: false, description: "Locality matcher token for LOCAL agencies: an uppercase city name (e.g. PHILADELPHIA), a postal code (e.g. 19103), or '<STATE>-ALL' for statewide local taxes; null for state-level agencies" }
      - { name: agency_name, type: string, source: input, description: "Display name" }
      - { name: withholding_rate_bp, type: integer, source: input, required: false, description: "Flat state withholding rate in basis points (STATE_WITHHOLDING only)" }
      - { name: resident_rate_bp, type: integer, source: input, required: false, description: "Resident rate bp (LOCAL only)" }
      - { name: nonresident_rate_bp, type: integer, source: input, required: false, description: "Nonresident rate bp (LOCAL only)" }
      - { name: precedence_rank, type: integer, source: input, default: 100, description: "LOCAL assignment precedence; lower wins" }
      - { name: new_employer_rate_bp, type: integer, source: input, required: false, description: "New-employer UI rate bp (STATE_UI only)" }
      - { name: solvency_surcharge_bp, type: integer, source: input, default: 0, description: "UI solvency surcharge bp added after bracket lookup (STATE_UI only)" }
      - { name: ui_wage_base_cents, type: integer, source: input, required: false, description: "Annual UI taxable wage base per employee (STATE_UI only)" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Catalog active flag" }
      # Uniqueness: (agency_kind, state_code, locality_code) among is_active=true -> ERR_DUPLICATE_AGENCY

  - name: ReciprocityAgreement
    parent: null
    common_fields: true
    fields:
      - { name: state_a, type: string, source: input, description: "First state code (pair is unordered)" }
      - { name: state_b, type: string, source: input, description: "Second state code" }
      - { name: effective_from, type: datetime, source: input, description: "First covered date (inclusive), ISO date at 00:00:00Z" }
      - { name: effective_to, type: datetime, source: input, required: false, description: "Last covered date (INCLUSIVE); null = open-ended" }
      - { name: certificate_form_code, type: string, source: input, required: false, description: "Certificate form the employee must supply (e.g. NJ-165)" }
      - { name: scope, type: enum, source: input, description: "FULL | WAGES_ONLY" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED (now < effective_from) | ACTIVE (within range) | EXPIRED (effective_to < now); recomputed on clock sweep" }
      # Overlap: two agreements for the same unordered pair whose CLOSED date ranges share a day -> ERR_AGREEMENT_OVERLAP

  - name: WorkLocation
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Location label" }
      - { name: address_line1, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City name" }
      - { name: state_code, type: string, source: input, description: "2-letter state code" }
      - { name: postal_code, type: string, source: input, description: "ZIP/postal code" }
      - { name: location_type, type: enum, source: input, description: "COMPANY_OFFICE | REMOTE_HOME | CLIENT_SITE" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive locations reject new assignments/changes" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_ref, type: string, source: input, description: "External employee reference, unique" }
      - { name: full_name, type: string, source: input, description: "Employee name" }
      - { name: resident_state_code, type: string, source: input, description: "State of residence" }
      - { name: resident_locality_code, type: string, source: input, required: false, description: "Uppercase locality token of residence (matches TaxAgency.locality_code)" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date (ISO date at 00:00:00Z); day attribution starts here" }
      - { name: annual_wage_cents, type: integer, source: input, description: "Annualized wage in cents, > 0", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }
      - { name: current_work_location_id, type: string, source: input, description: "FK -> WorkLocation.id; updated by LocationChange effectuation" }
      - { name: termination_date, type: datetime, source: system, required: false, description: "Set by terminate; day attribution stops here" }

  - name: NexusCase
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State being monitored; one case per state among statuses {WATCH, THRESHOLD_MET, CONFIRMED, LAPSED}" }
      - { name: status, type: enum, source: system, description: "WATCH | THRESHOLD_MET | CONFIRMED | EXEMPT | LAPSED" }
      - { name: employee_days_ytd, type: integer, source: computed, description: "Calendar days in current year attributable to this state (see calc nexus_threshold_evaluation)" }
      - { name: employee_days_trailing_90d, type: integer, source: computed, description: "Attributable employee-days in [now-90d, now]; lapse signal" }
      - { name: wages_ytd_cents, type: integer, source: computed, description: "Attributed wages YTD (sum of per-employee round_half_up(annual_wage_cents * days_in_state / 365))" }
      - { name: threshold_basis, type: enum, source: computed, description: "NONE | DAYS | WAGES | BOTH — which nexus thresholds are met" }
      - { name: established_date, type: datetime, source: system, required: false, description: "Set when CONFIRMED" }
      - { name: exempt_reason, type: string, source: system, required: false, description: "Copied from exempt call input" }
      - { name: last_recomputed_at, type: datetime, source: system, description: "Clock time of last recompute" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> TaxAgency.id; one non-CLOSED registration per agency" }
      - { name: registration_kind, type: enum, source: computed, description: "Copied from agency: STATE_WITHHOLDING | STATE_UI | LOCAL" }
      - { name: state_code, type: string, source: computed, description: "Copied from agency" }
      - { name: account_number, type: string, source: system, required: false, description: "Assigned at activation (from activate input)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REJECTED | ACTIVE | CLOSED" }
      - { name: filing_frequency, type: enum, source: computed, description: "MONTHLY | QUARTERLY | SEMIWEEKLY (STATE_UI always QUARTERLY)" }
      - { name: deposit_tier, type: enum, source: computed, description: "STANDARD | ACCELERATED | NEXT_DAY" }
      - { name: frequency_basis, type: enum, source: computed, description: "PROVISIONAL (from projected wages at activation) | LOOKBACK (from trailing actuals at recompute_schedule)" }
      - { name: projected_annual_withholding_cents, type: integer, source: input, description: "Projected annual withholding, >= 0; drives provisional frequency" }
      - { name: lookback_liability_cents, type: integer, source: computed, description: "Sum of amount_due_cents over WITHHOLDING_DEPOSIT/WITHHOLDING_RETURN obligations with period_end in the trailing 4 closed quarters and status IN {DUE, LATE, FILED, CONFIRMED, WAIVED}" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Copied from reject call input" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Clock at submit" }
      - { name: activated_at, type: datetime, source: system, required: false, description: "Clock at activation" }
      - { name: closed_at, type: datetime, source: system, required: false, description: "Clock at close" }

  - name: WithholdingElection
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; Employee-role callers must pass their own id" }
      - { name: election_type, type: enum, source: input, description: "RECIPROCITY_EXEMPTION | COURTESY_RESIDENT | COURTESY_WORK" }
      - { name: work_state_code, type: string, source: input, description: "State where work is performed" }
      - { name: resident_state_code, type: string, source: computed, description: "Snapshot of employee.resident_state_code at creation" }
      - { name: certificate_form_code, type: string, source: input, required: false, description: "Required at validate when the covering agreement declares one" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, required: false, description: "Half-open interval end (EXCLUSIVE); null = open-ended; must be > effective_from" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VALIDATED | ACTIVE | SUPERSEDED | REVOKED | REJECTED | EXPIRED" }
      - { name: supersedes_election_id, type: string, source: system, required: false, description: "FK -> WithholdingElection.id; set when this creation superseded a prior same-type election" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD reference)" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Copied from reject call input" }

  - name: LocalAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: work_location_id, type: string, source: input, description: "FK -> WorkLocation.id" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open coverage start (inclusive)" }
      - { name: effective_to, type: datetime, source: system, required: false, description: "Half-open coverage end (exclusive); set when truncated/superseded; null while open" }
      - { name: resident_agency_id, type: string, source: computed, required: false, description: "FK -> TaxAgency.id; winning resident LOCAL agency or null" }
      - { name: work_agency_id, type: string, source: computed, required: false, description: "FK -> TaxAgency.id; winning work LOCAL agency or null" }
      - { name: resolution_source, type: enum, source: system, description: "AUTO_GEOCODE | MANUAL_OVERRIDE" }
      - { name: precedence_trace, type: string, source: computed, description: "Human-readable rank trace; NONE_FOUND when a side has no candidate; COLLAPSED when work==resident agency (resident set null)" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED" }
      - { name: override_reason, type: string, source: system, required: false, description: "Copied from override call input" }

  - name: UIRate
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; must be registration_kind=STATE_UI and status ACTIVE" }
      - { name: rate_year, type: integer, source: input, description: "Calendar year the rate applies to" }
      - { name: experience_rated, type: boolean, source: input, description: "False = new-employer account (flat agency new_employer_rate_bp; voluntary contributions prohibited)" }
      - { name: assigned_rate_bp, type: integer, source: input, description: "Rate bp printed on the agency notice (informational)" }
      - { name: contributions_paid_3yr_cents, type: integer, source: input, description: "UI contributions paid in the 3-year lookback, >= 0" }
      - { name: benefits_charged_3yr_cents, type: integer, source: input, description: "UI benefits charged in the 3-year lookback, >= 0" }
      - { name: taxable_payroll_3yr_cents, type: integer, source: input, description: "Taxable payroll in the 3-year lookback, > 0" }
      - { name: voluntary_contribution_applied_cents, type: integer, source: system, default: 0, description: "Sum of APPLIED voluntary contributions against this rate year" }
      - { name: reserve_ratio_bp, type: integer, source: computed, required: false, description: "round_half_up(10000 * (contributions + voluntary_applied - benefits) / taxable_payroll_3yr); null when not experience_rated" }
      - { name: final_rate_bp, type: integer, source: computed, description: "See calc ui_experience_rate; bracket lookup + surcharge, clamped [50, 900]" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | CONTESTED | EFFECTIVE | SUPERSEDED" }
      - { name: contest_reason, type: string, source: system, required: false, description: "Copied from contest call input" }
      - { name: received_date, type: datetime, source: system, description: "Clock at creation" }

  - name: VoluntaryContribution
    parent: null
    common_fields: true
    fields:
      - { name: ui_rate_id, type: string, source: input, description: "FK -> UIRate.id; must be status EFFECTIVE" }
      - { name: proposed_amount_cents, type: integer, source: input, description: "Voluntary contribution amount, > 0" }
      - { name: decision_deadline, type: datetime, source: input, description: "Remit-by timestamp; must be strictly in the future at creation" }
      - { name: projected_rate_without_vc_bp, type: integer, source: computed, description: "final_rate_bp of the rate as-is" }
      - { name: projected_rate_with_vc_bp, type: integer, source: computed, description: "Rate recomputed with voluntary_contribution_applied_cents += proposed_amount_cents" }
      - { name: projected_net_savings_cents, type: integer, source: computed, description: "(rate_without - rate_with) * projected_taxable_wages_cents / 10000 - proposed_amount_cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | DECLINED | REMITTED | APPLIED | EXPIRED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposer (SoD reference)" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of approver" }
      - { name: remitted_at, type: datetime, source: system, required: false, description: "Clock at remit" }

  - name: LocationChange
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; Employee-role callers must pass their own id" }
      - { name: to_work_location_id, type: string, source: input, description: "FK -> WorkLocation.id" }
      - { name: from_location_snapshot, type: object, source: computed, description: "{ work_location_id, state_code, label } captured at creation" }
      - { name: effective_date, type: datetime, source: input, description: "Date the move takes effect (may be past for retro corrections)" }
      - { name: reason, type: string, source: input, description: "Free-text reason" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | REJECTED | CANCELLED | EFFECTIVE | REVERSED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submitter (SoD reference)" }
      - { name: reviewed_by_user_id, type: string, source: system, required: false, description: "X-User-ID of reviewer" }
      - { name: impact_summary, type: string, source: computed, required: false, description: "States whose nexus cases will recompute; set at approve" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Copied from reject call input" }

  - name: FilingObligation
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; obligations are system-generated" }
      - { name: obligation_kind, type: enum, source: system, description: "WITHHOLDING_RETURN | WITHHOLDING_DEPOSIT | UI_RETURN | UI_CONTRIBUTION | LOCAL_RETURN" }
      - { name: period_start, type: datetime, source: system, description: "Period start (inclusive)" }
      - { name: period_end, type: datetime, source: system, description: "Period end (inclusive date at 00:00:00Z of last day)" }
      - { name: due_date, type: datetime, source: computed, description: "Per calc filing_calendar_generation incl. weekend roll-forward; recomputed when deposit_tier flips to NEXT_DAY" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Per calcs withholding_obligation_amount / ui_contribution_amount / local_obligation_amount; may be 0" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Set = amount_due_cents on file" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DUE | LATE | FILED | CONFIRMED | WAIVED" }
      - { name: filed_at, type: datetime, source: system, required: false, description: "filed_at input or clock at file" }
      - { name: filed_by_user_id, type: string, source: system, required: false, description: "X-User-ID of filer (SoD reference)" }
      - { name: confirmed_by_user_id, type: string, source: system, required: false, description: "X-User-ID of confirmer" }
      - { name: late_days, type: integer, source: computed, default: 0, description: "Calendar days from due_date+1 to filed_at (or clock while unfiled); 0 when filed on/before due_date" }

  - name: AgencyNotice
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, required: false, description: "FK -> Registration.id; optional account-level link" }
      - { name: filing_obligation_id, type: string, source: input, required: false, description: "FK -> FilingObligation.id; optional obligation link; at least one of registration_id/filing_obligation_id required" }
      - { name: notice_type, type: enum, source: input, description: "PENALTY_ASSESSMENT | RATE_NOTICE | MISSING_RETURN | ACCOUNT_INQUIRY | AUDIT" }
      - { name: received_date, type: datetime, source: input, description: "Date notice received (abatement window anchor)" }
      - { name: response_due_date, type: datetime, source: input, description: "Agency response deadline; must be >= received_date" }
      - { name: penalty_amount_cents, type: integer, source: input, default: 0, description: "Assessed penalty; system-updated by LATE-cascade creation and file-time recompute" }
      - { name: abated_amount_cents, type: integer, source: system, default: 0, description: "Sum of granted abatements" }
      - { name: status, type: enum, source: system, description: "RECEIVED | TRIAGED | RESPONSE_IN_PROGRESS | ESCALATED | RESOLVED | CLOSED" }
      - { name: severity, type: enum, source: computed, description: "HIGH if notice_type=AUDIT or penalty_amount_cents >= 500000; MEDIUM if penalty >= 50000; else LOW" }
      - { name: resolution_notes, type: string, source: system, required: false, description: "Copied from resolve call input" }

  - name: AbatementRequest
    parent: null
    common_fields: true
    fields:
      - { name: agency_notice_id, type: string, source: input, description: "FK -> AgencyNotice.id; notice must be PENALTY_ASSESSMENT and non-terminal" }
      - { name: abatement_type, type: enum, source: input, description: "FIRST_TIME | REASONABLE_CAUSE | STATUTORY" }
      - { name: requested_amount_cents, type: integer, source: input, description: "> 0 and <= notice outstanding penalty" }
      - { name: reason, type: string, source: input, description: "Justification text (min 20 chars for REASONABLE_CAUSE)" }
      - { name: eligible_amount_cents, type: integer, source: computed, description: "Per calc abatement_eligibility" }
      - { name: prior_penalty_count_3yr, type: integer, source: computed, description: "PENALTY_ASSESSMENT notices with received_date in [received-3y, received) and outstanding > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | GRANTED | PARTIALLY_GRANTED | DENIED | WITHDRAWN" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of preparer (SoD reference)" }
      - { name: reviewed_by_user_id, type: string, source: system, required: false, description: "X-User-ID of reviewer" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Clock at submit" }
      - { name: decided_at, type: datetime, source: system, required: false, description: "Clock at decide" }
      - { name: granted_amount_cents, type: integer, source: system, required: false, description: "= eligible_amount_cents when GRANTED; input amount when PARTIALLY_GRANTED; 0 when DENIED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /etax/employees/{id}/terminate"
        actor: NexusAnalyst
        preconditions:
          - "employee.status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "no LocationChange for this employee in PENDING_REVIEW or APPROVED (else ERR_LOCATION_CHANGE_PENDING)"
        side_effects:
          - "termination_date = input.termination_date"
          - "CURRENT LocalAssignment truncated: effective_to = termination_date (if that yields zero-length, assignment -> SUPERSEDED)"
          - "NexusCase recompute for the state of the truncated assignment"
          - "increments Employee.version by 1"

  - entity: NexusCase
    initial_state: WATCH
    terminal_states: []
    transitions:
      - from: WATCH
        to: THRESHOLD_MET
        trigger: "POST /etax/nexus-cases/{id}/recompute OR system cascade from LocationChange effectuation / Employee terminate"
        actor: NexusAnalyst | system
        preconditions:
          - "threshold_basis != NONE after recompute (days >= 20 OR wages >= 5000000 cents)"
        side_effects:
          - "Employer.compliance_posture recomputed (THRESHOLD_MET forces at least WATCH)"
      - from: THRESHOLD_MET
        to: WATCH
        trigger: "POST /etax/nexus-cases/{id}/recompute OR system cascade"
        actor: NexusAnalyst | system
        preconditions:
          - "threshold_basis == NONE after recompute (e.g. a LocationChange REVERSED removed days)"
        side_effects:
          - "Employer.compliance_posture recomputed"
      - from: THRESHOLD_MET
        to: CONFIRMED
        trigger: "POST /etax/nexus-cases/{id}/confirm"
        actor: NexusAnalyst
        preconditions:
          - "status == THRESHOLD_MET (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "established_date = clock"
          - "Employer.compliance_posture recomputed"
      - from: CONFIRMED
        to: LAPSED
        trigger: "POST /etax/nexus-cases/{id}/recompute"
        actor: NexusAnalyst
        preconditions:
          - "employee_days_trailing_90d == 0 AND clock >= established_date + 90 days"
        side_effects:
          - "Employer.registered_state_count unchanged (registrations unaffected); posture recomputed"
      - from: LAPSED
        to: WATCH
        trigger: "POST /etax/nexus-cases/{id}/recompute OR system cascade"
        actor: NexusAnalyst | system
        preconditions:
          - "employee_days_trailing_90d > 0 after recompute"
        side_effects: []
      - from: WATCH
        to: EXEMPT
        trigger: "POST /etax/nexus-cases/{id}/exempt"
        actor: TaxDirector
        preconditions:
          - "status IN {WATCH, THRESHOLD_MET} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "exempt_reason = input.exempt_reason; Employer posture recomputed"
      - from: THRESHOLD_MET
        to: EXEMPT
        trigger: "POST /etax/nexus-cases/{id}/exempt"
        actor: TaxDirector
        preconditions: []
        side_effects:
          - "exempt_reason = input.exempt_reason; Employer posture recomputed"
      - from: EXEMPT
        to: WATCH
        trigger: "POST /etax/nexus-cases/{id}/recompute"
        actor: NexusAnalyst
        preconditions:
          - "threshold_basis != NONE after recompute (exemption invalidated by renewed activity)"
        side_effects:
          - "Employer posture recomputed"
    note: "Cyclic: WATCH <-> THRESHOLD_MET on recompute; CONFIRMED -> LAPSED -> WATCH revival loop; EXEMPT -> WATCH on renewed activity."

  - entity: Registration
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /etax/registrations/{id}/submit"
        actor: NexusAnalyst
        preconditions:
          - "status == DRAFT or REJECTED (else ERR_INVALID_STATE_TRANSITION)"
          - "NexusCase for registration.state_code has status == CONFIRMED (else ERR_NEXUS_NOT_CONFIRMED)"
        side_effects:
          - "submitted_at = clock"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /etax/registrations/{id}/submit"
        actor: NexusAnalyst
        preconditions:
          - "NexusCase for registration.state_code has status == CONFIRMED (else ERR_NEXUS_NOT_CONFIRMED)"
        side_effects:
          - "submitted_at = clock; rejection_reason cleared"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /etax/registrations/{id}/reject"
        actor: NexusAnalyst
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "rejection_reason = input.rejection_reason"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /etax/registrations/{id}/activate"
        actor: NexusAnalyst
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "account_number = input.account_number; activated_at = clock"
          - "filing_frequency computed via deposit_schedule_assignment PROVISIONAL variant (STATE_UI forced QUARTERLY); frequency_basis = PROVISIONAL"
          - "FilingObligation rows generated for the calendar quarter containing activation per calc filing_calendar_generation"
          - "Employer.registered_state_count recomputed; increments Registration.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /etax/registrations/{id}/close"
        actor: TaxDirector
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "no FilingObligation with status IN {SCHEDULED, DUE, LATE} for this registration AND no linked AgencyNotice with status IN {RECEIVED, TRIAGED, RESPONSE_IN_PROGRESS, ESCALATED} (else ERR_REGISTRATION_NOT_SETTLED)"
        side_effects:
          - "closed_at = clock; Employer.registered_state_count recomputed"
    note: "Cycle: SUBMITTED -> REJECTED -> SUBMITTED resubmission loop."

  - entity: WithholdingElection
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, REVOKED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /etax/withholding-elections/{id}/validate"
        actor: NexusAnalyst
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
          - "work_state_code != resident_state_code (else ERR_INVALID_REQUEST)"
          - "work_state_code == state of employee.current_work_location_id (else ERR_INVALID_REQUEST)"
          - "RECIPROCITY_EXEMPTION: a ReciprocityAgreement for {work_state_code, resident_state_code} with status ACTIVE covering effective_from exists (else ERR_RECIPROCITY_NOT_AVAILABLE); if that agreement declares certificate_form_code, election.certificate_form_code must match (else ERR_INVALID_REQUEST)"
          - "COURTESY_RESIDENT: an ACTIVE Registration exists whose agency is STATE_WITHHOLDING for resident_state_code (else ERR_REGISTRATION_NOT_ACTIVE)"
          - "COURTESY_WORK: an ACTIVE Registration exists whose agency is STATE_WITHHOLDING for work_state_code (else ERR_REGISTRATION_NOT_ACTIVE)"
          - "effective_from > clock (otherwise transition runs to ACTIVE directly)"
        side_effects: []
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /etax/withholding-elections/{id}/validate (when effective_from <= clock)"
        actor: NexusAnalyst
        preconditions:
          - "all guards of SUBMITTED -> VALIDATED"
        side_effects: []
      - from: VALIDATED
        to: ACTIVE
        trigger: "system clock sweep (effective_from <= now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /etax/withholding-elections/{id}/reject"
        actor: NexusAnalyst
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "rejection_reason = input.rejection_reason"
      - from: VALIDATED
        to: REVOKED
        trigger: "POST /etax/withholding-elections/{id}/revoke"
        actor: Employee | NexusAnalyst
        preconditions:
          - "status IN {VALIDATED, ACTIVE} (else ERR_INVALID_STATE_TRANSITION)"
          - "Employee-role caller: election.employee_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /etax/withholding-elections/{id}/revoke"
        actor: Employee | NexusAnalyst
        preconditions:
          - "Employee-role caller: election.employee_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (creation of a same-type election for the same employee with supersede_existing=true)"
        actor: system
        preconditions: []
        side_effects:
          - "new election.supersedes_election_id = this election.id"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system (creation of a same-type election for the same employee with supersede_existing=true)"
        actor: system
        preconditions: []
        side_effects:
          - "new election.supersedes_election_id = this election.id"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep (effective_to != null AND effective_to < now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: EXPIRED
        trigger: "system clock sweep (effective_to != null AND effective_to < now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LocalAssignment
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (a newer LocalAssignment for the same employee fully covers this segment, or truncation yields zero length; or LocationChange REVERSED removes the effectuated segment)"
        actor: system
        preconditions: []
        side_effects:
          - "effective_to = min(existing effective_to, new segment effective_from); if effective_to <= effective_from the row is SUPERSEDED outright"
    note: "Segments are half-open [effective_from, effective_to). Overlap is resolved by truncation, never rejection (unlike WithholdingElection half-open rejection and ReciprocityAgreement closed-interval rejection)."

  - entity: UIRate
    initial_state: RECEIVED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /etax/ui-rates/{id}/review"
        actor: UISpecialist
        preconditions:
          - "status IN {RECEIVED, CONTESTED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: CONTESTED
        to: UNDER_REVIEW
        trigger: "POST /etax/ui-rates/{id}/review"
        actor: UISpecialist
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CONTESTED
        trigger: "POST /etax/ui-rates/{id}/contest"
        actor: UISpecialist
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "contest_reason = input.contest_reason"
      - from: UNDER_REVIEW
        to: EFFECTIVE
        trigger: "POST /etax/ui-rates/{id}/make_effective"
        actor: UISpecialist
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "SCHEDULED UI_CONTRIBUTION obligations for this registration with period_start year == rate_year have amount_due_cents recomputed with final_rate_bp"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (a new UIRate is created for the same registration_id + rate_year)"
        actor: system
        preconditions: []
        side_effects:
          - "VoluntaryContribution rows linked to this rate in {PROPOSED, APPROVED, REMITTED} remain but apply is blocked (ERR_RATE_SUPERSEDED)"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "system (a new UIRate is created for the same registration_id + rate_year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system (a new UIRate is created for the same registration_id + rate_year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONTESTED
        to: SUPERSEDED
        trigger: "system (a new UIRate is created for the same registration_id + rate_year)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Cycle: UNDER_REVIEW -> CONTESTED -> UNDER_REVIEW (re-review loop)."

  - entity: VoluntaryContribution
    initial_state: PROPOSED
    terminal_states: [APPLIED, DECLINED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /etax/voluntary-contributions/{id}/approve"
        actor: TaxDirector
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE_TRANSITION)"
          - "Employer.compliance_posture != DELINQUENT (else ERR_COMPANY_POSTURE_DELINQUENT)"
          - "X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /etax/voluntary-contributions/{id}/decline"
        actor: TaxDirector
        preconditions:
          - "status IN {PROPOSED, APPROVED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: APPROVED
        to: DECLINED
        trigger: "POST /etax/voluntary-contributions/{id}/decline"
        actor: TaxDirector
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REMITTED
        trigger: "POST /etax/voluntary-contributions/{id}/remit"
        actor: UISpecialist
        preconditions:
          - "status == APPROVED (else ERR_INVALID_STATE_TRANSITION)"
          - "clock <= decision_deadline (else ERR_DEADLINE_PASSED)"
        side_effects:
          - "remitted_at = clock"
      - from: REMITTED
        to: APPLIED
        trigger: "POST /etax/voluntary-contributions/{id}/apply"
        actor: UISpecialist
        preconditions:
          - "status == REMITTED (else ERR_INVALID_STATE_TRANSITION)"
          - "linked UIRate.status == EFFECTIVE (else ERR_RATE_SUPERSEDED)"
        side_effects:
          - "UIRate.voluntary_contribution_applied_cents += proposed_amount_cents"
          - "UIRate.reserve_ratio_bp and final_rate_bp recomputed (buy-down variant)"
          - "open UI_CONTRIBUTION obligations (status IN {SCHEDULED, DUE}) for the registration with period year == rate_year have amount_due_cents recomputed"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system clock sweep (now > decision_deadline)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Only PROPOSED rows auto-expire on the sweep; APPROVED rows never auto-expire — the remit deadline guard (ERR_DEADLINE_PASSED) is the sole enforcement after approval, so the deadline boundary stays observable via remit."

  - entity: LocationChange
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, CANCELLED, REVERSED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /etax/location-changes/{id}/approve"
        actor: NexusAnalyst
        preconditions:
          - "status == PENDING_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "employee.status == ACTIVE (else ERR_EMPLOYEE_NOT_ACTIVE)"
          - "to_work_location_id refers to a WorkLocation with is_active == true (else ERR_INVALID_REQUEST)"
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID; impact_summary computed (old/new state codes)"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /etax/location-changes/{id}/reject"
        actor: NexusAnalyst
        preconditions:
          - "status == PENDING_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "rejection_reason = input.rejection_reason"
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /etax/location-changes/{id}/cancel"
        actor: Employee
        preconditions:
          - "status IN {PENDING_REVIEW, APPROVED} (else ERR_INVALID_STATE_TRANSITION)"
          - "location_change.employee_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /etax/location-changes/{id}/cancel"
        actor: Employee
        preconditions:
          - "location_change.employee_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: APPROVED
        to: EFFECTIVE
        trigger: "system clock sweep (effective_date <= now)"
        actor: system
        preconditions:
          - "employee.status == ACTIVE at sweep time (otherwise the change stays APPROVED until employee active or cancelled)"
        side_effects:
          - "Employee.current_work_location_id = to_work_location_id; increments Employee.version by 1"
          - "CURRENT LocalAssignment for employee truncated at effective_date (zero-length -> SUPERSEDED); new LocalAssignment created via local_jurisdiction_resolution (AUTO_GEOCODE) from effective_date"
          - "NexusCase recompute cascades for the old state and the new state (WATCH<->THRESHOLD_MET auto-transitions may fire)"
          - "Employer.compliance_posture recomputed"
      - from: EFFECTIVE
        to: REVERSED
        trigger: "POST /etax/location-changes/{id}/reverse"
        actor: TaxDirector
        preconditions:
          - "status == EFFECTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Employee.current_work_location_id restored to from_location_snapshot.work_location_id; increments Employee.version by 1"
          - "LocalAssignment segment created by effectuation is SUPERSEDED; the truncated prior segment is reinstated (effective_to = null, status CURRENT)"
          - "NexusCase recompute cascades for both states (attribution totals return to pre-effectuation values)"
          - "Employer.compliance_posture recomputed"

  - entity: FilingObligation
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system clock sweep (period_end < now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: LATE
        trigger: "system clock sweep (current date >= due_date + 1 day AND status still DUE)"
        actor: system
        preconditions: []
        side_effects:
          - "late_days recomputed daily"
          - "if amount_due_cents > 0: an AgencyNotice (PENALTY_ASSESSMENT, filing_obligation_id = this, registration_id = this registration) is created with received_date = current date, response_due_date = current date + 30 days, penalty_amount_cents = provisional late_penalty_assessment at late_days = 1 (tier 2%, min 2500)"
          - "Employer.open_notice_count / outstanding_penalty_cents / compliance_posture recomputed"
      - from: DUE
        to: FILED
        trigger: "POST /etax/filing-obligations/{id}/file"
        actor: PayrollComplianceLead
        preconditions:
          - "status IN {DUE, LATE} (else ERR_INVALID_STATE_TRANSITION)"
          - "filed_at (or clock default) <= clock (else ERR_INVALID_REQUEST)"
        side_effects:
          - "amount_paid_cents = amount_due_cents; filed_by_user_id = X-User-ID; late_days finalized"
      - from: LATE
        to: FILED
        trigger: "POST /etax/filing-obligations/{id}/file"
        actor: PayrollComplianceLead
        preconditions:
          - "filed_at (or clock default) <= clock (else ERR_INVALID_REQUEST)"
        side_effects:
          - "amount_paid_cents = amount_due_cents; filed_by_user_id = X-User-ID; late_days finalized"
          - "linked PENALTY_ASSESSMENT notice (created at LATE) has penalty_amount_cents recomputed at the final late_days tier; Employer counters recomputed"
      - from: FILED
        to: CONFIRMED
        trigger: "POST /etax/filing-obligations/{id}/confirm"
        actor: PayrollComplianceLead
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "confirmed_by_user_id = X-User-ID"
      - from: LATE
        to: WAIVED
        trigger: "system (AbatementRequest decide leaves linked notice outstanding penalty == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Employer counters recomputed"

  - entity: AgencyNotice
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /etax/agency-notices/{id}/triage"
        actor: PayrollComplianceLead
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: TRIAGED
        to: RESPONSE_IN_PROGRESS
        trigger: "system (an AbatementRequest referencing this notice is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: RESPONSE_IN_PROGRESS
        trigger: "system (an AbatementRequest referencing this notice is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /etax/agency-notices/{id}/escalate"
        actor: PayrollComplianceLead
        preconditions:
          - "status IN {TRIAGED, RESPONSE_IN_PROGRESS} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Employer.compliance_posture recomputed (ESCALATED forces DELINQUENT)"
      - from: RESPONSE_IN_PROGRESS
        to: ESCALATED
        trigger: "POST /etax/agency-notices/{id}/escalate"
        actor: PayrollComplianceLead
        preconditions: []
        side_effects:
          - "Employer.compliance_posture recomputed"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /etax/agency-notices/{id}/resolve"
        actor: PayrollComplianceLead
        preconditions:
          - "status IN {TRIAGED, RESPONSE_IN_PROGRESS, ESCALATED} (else ERR_INVALID_STATE_TRANSITION)"
          - "no linked AbatementRequest with status IN {DRAFT, SUBMITTED, UNDER_REVIEW} (else ERR_ABATEMENT_PENDING)"
        side_effects:
          - "resolution_notes = input.resolution_notes; Employer counters recomputed"
      - from: RESPONSE_IN_PROGRESS
        to: RESOLVED
        trigger: "POST /etax/agency-notices/{id}/resolve"
        actor: PayrollComplianceLead
        preconditions:
          - "no linked AbatementRequest with status IN {DRAFT, SUBMITTED, UNDER_REVIEW} (else ERR_ABATEMENT_PENDING)"
        side_effects:
          - "resolution_notes = input.resolution_notes; Employer counters recomputed"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /etax/agency-notices/{id}/resolve"
        actor: PayrollComplianceLead
        preconditions:
          - "no linked AbatementRequest with status IN {DRAFT, SUBMITTED, UNDER_REVIEW} (else ERR_ABATEMENT_PENDING)"
        side_effects:
          - "resolution_notes = input.resolution_notes; Employer counters recomputed"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /etax/agency-notices/{id}/close"
        actor: TaxDirector
        preconditions:
          - "status == RESOLVED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Employer counters recomputed"

  - entity: AbatementRequest
    initial_state: DRAFT
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /etax/abatement-requests/{id}/submit"
        actor: PayrollComplianceLead
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "current date <= notice.received_date + 60 days (else ERR_ABATEMENT_WINDOW_CLOSED)"
          - "eligible_amount_cents > 0 (else ERR_ABATEMENT_NOT_ELIGIBLE)"
        side_effects:
          - "submitted_at = clock"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /etax/abatement-requests/{id}/review"
        actor: TaxDirector
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != prepared_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /etax/abatement-requests/{id}/decide with decision=GRANTED"
        actor: TaxDirector
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "granted_amount_cents input must be omitted (granted amount is pinned to eligible_amount_cents; else ERR_INVALID_REQUEST)"
        side_effects:
          - "granted_amount_cents = eligible_amount_cents; decided_at = clock"
          - "AgencyNotice.abated_amount_cents += granted_amount_cents"
          - "if notice.filing_obligation_id set and notice outstanding penalty == 0 and that obligation is LATE: obligation -> WAIVED"
          - "Employer counters recomputed"
      - from: UNDER_REVIEW
        to: PARTIALLY_GRANTED
        trigger: "POST /etax/abatement-requests/{id}/decide with decision=PARTIALLY_GRANTED"
        actor: TaxDirector
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "granted_amount_cents required, >= 1 and < eligible_amount_cents (else ERR_INVALID_REQUEST)"
        side_effects:
          - "granted_amount_cents = input; decided_at = clock; notice.abated_amount_cents += granted; Employer counters recomputed"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /etax/abatement-requests/{id}/decide with decision=DENIED"
        actor: TaxDirector
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "granted_amount_cents must be omitted (else ERR_INVALID_REQUEST)"
        side_effects:
          - "granted_amount_cents = 0; decided_at = clock"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /etax/abatement-requests/{id}/withdraw"
        actor: PayrollComplianceLead
        preconditions:
          - "status IN {DRAFT, SUBMITTED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /etax/abatement-requests/{id}/withdraw"
        actor: PayrollComplianceLead
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: registration-create-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /etax/registrations"
    occ_field: "expected_employer_version"
    description: |
      Creating a Registration against an Employer whose version has advanced
      since the client last observed it is rejected. This covers the case where
      another writer has just created a registration (which legitimately extends
      the employer's registration portfolio) and the current writer's view of
      the employer is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: election-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /etax/withholding-elections"
    occ_field: "expected_employee_version"
    description: |
      Creating a WithholdingElection (which with supersede_existing=true
      legitimately supersedes the employee's current same-type election) against
      an Employee whose version has advanced since the client last observed it
      is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assignment-override-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /etax/local-assignments/override"
    occ_field: "expected_employee_version"
    description: |
      A manual LocalAssignment override (which legitimately truncates the
      employee's current assignment segment) against an Employee whose version
      has advanced since the client last observed it is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: uirate-create-stale-registration
    parent_entity: Registration
    write_endpoint: "POST /etax/ui-rates"
    occ_field: "expected_registration_version"
    description: |
      Creating a UIRate (which legitimately supersedes the current rate for the
      same registration + rate_year) against a Registration whose version has
      advanced since the client last observed it is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: location-change-patch-stale-version
    parent_entity: LocationChange
    write_endpoint: "PATCH /etax/location-changes/{id}"
    occ_field: "expected_location_change_version"
    description: |
      Updating a PENDING_REVIEW LocationChange (effective_date / to_work_location_id /
      reason) against a LocationChange whose version has advanced since the
      client last observed it is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: nexus_threshold_evaluation
    trigger: "POST /etax/nexus-cases/{id}/recompute; cascade from LocationChange effectuation/reversal and Employee terminate; initial run at NexusCase creation"
    algorithm: threshold
    formula: |
      Attribution model: each Employee contributes calendar days to states via
      LocalAssignment segments (status CURRENT or SUPERSEDED) intersecting the
      window. A day d (date-granular, inclusive both ends) counts for state S
      when the covering segment's work_location.state_code == S and
      max(hire_date, segment.effective_from, window_start) <= d
      <= min(termination_date or +inf, segment.effective_to or +inf, clock).
      Days with no covering segment fall back to the employee's
      current_work_location_id state (for dates >= hire_date).
      employee_days_ytd(S)      = counted days in [Jan 1 of clock year, clock]
      employee_days_trailing_90d(S) = counted days in [clock - 90 days, clock]
      wages_ytd_cents(S) = SUM over employees of
          round_half_up(employee.annual_wage_cents * employee_days_ytd(S) / 365)
      (round PER EMPLOYEE, then sum — pinned order)
      Thresholds: DAYS >= 20 OR wages_ytd_cents >= 5000000.
      threshold_basis = NONE | DAYS | WAGES | BOTH.
    input_set: "All Employees (ACTIVE or TERMINATED) and all their LocalAssignment segments; window bounded by clock"
    constants:
      NEXUS_DAYS_THRESHOLD: 20
      NEXUS_WAGE_THRESHOLD_CENTS: 5000000
      LAPSE_WINDOW_DAYS: 90
    precision: "integer cents; round_half_up per employee line"

  - name: deposit_schedule_assignment
    trigger: "Registration activate (PROVISIONAL variant); POST /etax/registrations/{id}/recompute_schedule (LOOKBACK variant)"
    algorithm: threshold
    formula: |
      STATE_UI registrations: filing_frequency = QUARTERLY always.
      PROVISIONAL variant (at activation, basis = projected_annual_withholding_cents):
        projected < 250000            -> QUARTERLY
        250000 <= projected <= 5000000 -> MONTHLY
        projected > 5000000           -> SEMIWEEKLY
      LOOKBACK variant (at recompute_schedule, basis = lookback_liability_cents):
        lookback_liability_cents = SUM of FilingObligation.amount_due_cents for
          this registration where obligation_kind IN {WITHHOLDING_DEPOSIT, WITHHOLDING_RETURN}
          AND status IN {DUE, LATE, FILED, CONFIRMED, WAIVED}
          AND period_end within the trailing 4 closed calendar quarters.
        Same thresholds applied to lookback_liability_cents.
      deposit_tier:
        NEXT_DAY    if any WITHHOLDING_DEPOSIT for this registration has amount_due_cents >= 1000000000
        ACCELERATED else if filing_frequency == SEMIWEEKLY
        STANDARD    otherwise
      On tier flip to NEXT_DAY, due_date of each non-terminal WITHHOLDING_DEPOSIT
      becomes the next business day after its period_end.
      On LOOKBACK frequency change, future SCHEDULED obligations are regenerated:
      existing SCHEDULED rows -> WAIVED (reason FREQUENCY_CHANGE), new rows created.
    input_set: "This registration's FilingObligation rows (status filter as above)"
    constants:
      QUARTERLY_CAP_CENTS: 250000
      SEMIWEEKLY_THRESHOLD_CENTS: 5000000
      NEXT_DAY_THRESHOLD_CENTS: 1000000000
    precision: "integer cents; boundary >= as written (250000 is MONTHLY; 5000000 is MONTHLY; 1000000000 triggers NEXT_DAY)"
    variants:
      - name: provisional
        when: "At activation; no filed history exists"
        difference: "Uses projected_annual_withholding_cents (input estimate); same thresholds, can disagree with LOOKBACK for identical registration data"
      - name: lookback
        when: "At recompute_schedule"
        difference: "Uses trailing-4-closed-quarter actual obligation amounts; sets frequency_basis = LOOKBACK"

  - name: ui_experience_rate
    trigger: "UIRate creation; VoluntaryContribution apply (buy-down variant recomputation)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order (pinned):
      (1) if experience_rated == false:
            reserve_ratio_bp = null; final_rate_bp = agency.new_employer_rate_bp; STOP.
            (VoluntaryContribution creation against such a rate -> ERR_VC_NOT_ALLOWED_NEW_EMPLOYER.)
      (2) reserve_ratio_bp = round_half_up(10000 * (contributions_paid_3yr_cents
            + voluntary_contribution_applied_cents - benefits_charged_3yr_cents)
            / taxable_payroll_3yr_cents)   [may be negative]
      (3) bracket lookup:
            ratio >= 1500          -> 50
            1000 <= ratio <= 1499  -> 120
            500  <= ratio <= 999   -> 240
            100  <= ratio <= 499   -> 360
            0    <= ratio <= 99    -> 480
            -499 <= ratio <= -1    -> 600
            -999 <= ratio <= -500  -> 750
            ratio <= -1000         -> 900
      (4) final_rate_bp = bracket + agency.solvency_surcharge_bp
      (5) clamp: final_rate_bp = min(900, max(50, final_rate_bp))
    input_set: "The UIRate row + its registration's STATE_UI agency"
    constants:
      RATE_FLOOR_BP: 50
      RATE_CEILING_BP: 900
    precision: "integer basis points; round_half_up on reserve_ratio_bp"
    variants:
      - name: standard
        when: "voluntary_contribution_applied_cents == 0"
        difference: "Reserve ratio excludes voluntary contributions"
      - name: buy_down
        when: "voluntary_contribution_applied_cents > 0"
        difference: "Identical inputs plus applied VC raise the reserve ratio and can drop the bracket, yielding a lower final_rate_bp for the same base data"

  - name: voluntary_contribution_optimization
    trigger: "VoluntaryContribution creation (projection); approve re-validates nothing (projection pinned at creation)"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency, evaluation order pinned:
      (1) rate_without = ui_experience_rate with voluntary_contribution_applied_cents as stored
      (2) rate_with    = ui_experience_rate with voluntary_contribution_applied_cents
                         += proposed_amount_cents (i.e., the proposed VC itself shifts the
                         reserve ratio that determines the bracket that determines the saving)
      (3) projected_taxable_wages_cents = SUM over Employees with >= 1 attributed day in
          the registration's state during rate_year of
          min(annual_wage_cents, agency.ui_wage_base_cents)
      (4) projected_net_savings_cents =
          (rate_without_bp - rate_with_bp) * projected_taxable_wages_cents / 10000
          - proposed_amount_cents      [integer division, round_half_up on the product term]
      Creation requires projected_net_savings_cents > 0 (else ERR_NO_NET_SAVINGS).
    input_set: "UIRate row, its registration's agency, employees attributed to the registration state in rate_year"
    constants: {}
    precision: "integer cents; round_half_up on the savings product before subtracting the contribution"

  - name: local_jurisdiction_resolution
    trigger: "Employee creation (initial assignment from hire_date); POST /etax/local-assignments/resolve; LocationChange effectuation cascade; POST /etax/local-assignments/override (manual bypasses selection but still validates kind)"
    algorithm: topological
    formula: |
      Candidate set (work side): TaxAgency rows with agency_kind == LOCAL,
      is_active == true, state_code == work location state, and locality_code
      matching ANY of: location.postal_code  (postal match, specificity 0)
                       UPPER(location.city)  (city match, specificity 1)
                       state_code + '-ALL'   (statewide, specificity 2)
      Candidate set (resident side): same, using employee.resident_state_code and
      employee.resident_locality_code (postal match not available; locality_code
      equal to resident_locality_code -> specificity 1; statewide -> 2).
      Ranking (both sides): precedence_rank ASC, then specificity ASC,
      then created_at ASC. Winner = first row; empty set -> null (valid: no local tax).
      Collapse rule: if work winner == resident winner, resident_agency_id = null
      and precedence_trace notes COLLAPSED.
      Truncation: the employee's CURRENT assignment gets effective_to = new
      effective_from; zero-length remainder -> SUPERSEDED. New row status CURRENT.
    input_set: "LOCAL TaxAgency catalog + employee + work location"
    constants: {}
    precision: "deterministic selector; no arithmetic"

  - name: withholding_obligation_amount
    trigger: "FilingObligation generation (activate / recompute_schedule regeneration)"
    algorithm: aggregation
    formula: |
      WITHHOLDING_DEPOSIT / WITHHOLDING_RETURN (state S, rate r bp, period [p1, p2]):
        per employee with >= 1 attributed day in S during [p1, p2]:
          line_cents = round_half_up(annual_wage_cents * days_in_period / 365 * r / 10000)
        amount_due_cents = SUM(line_cents)   [PINNED: round per employee line, then sum;
        sum-then-round yields different cents and is non-conformant]
      WITHHOLDING_RETURN covers the full quarter; its amount uses the same
      per-line rule over the quarter (NOT the sum of deposit rows).
    input_set: "Employees attributed to the registration state within the obligation period"
    constants: {}
    precision: "integer cents; round_half_up per employee line, then sum"

  - name: ui_contribution_amount
    trigger: "FilingObligation generation; UIRate make_effective; VoluntaryContribution apply"
    algorithm: aggregation
    formula: |
      UI_CONTRIBUTION (quarter Q, wage base B, rate f bp), per employee with
      >= 1 attributed day in the registration state during Q:
        ytd_wages(boundary) = round_half_up(annual_wage_cents * days_employed_ytd(boundary) / 365)
        taxable = max(0, min(ytd_wages(Q.end), B) - min(ytd_wages(Q.start - 1 day), B))
        line_cents = round_half_up(taxable * f / 10000)
      amount_due_cents = SUM(line_cents)   [round per line, then sum]
      Rate resolution: EFFECTIVE UIRate of this registration with rate_year ==
      year(Q.start); if none, agency.new_employer_rate_bp.
      days_employed_ytd(t) = days from max(hire_date, Jan 1) to min(t, termination_date or t).
    input_set: "Employees attributed to the registration state during the quarter; EFFECTIVE UIRate"
    constants: {}
    precision: "integer cents; round_half_up per employee line, then sum"

  - name: local_obligation_amount
    trigger: "FilingObligation generation for LOCAL registrations"
    algorithm: aggregation
    formula: |
      LOCAL_RETURN (LOCAL agency A, quarter Q), per employee whose covering
      LocalAssignment during Q has work_agency_id == A.id:
        rate = A.resident_rate_bp if employee.resident_locality_code == A.locality_code
               else A.nonresident_rate_bp
        line_cents = round_half_up(annual_wage_cents * days_covered_in_Q / 365 * rate / 10000)
      amount_due_cents = SUM(line_cents)   [round per line, then sum]
    input_set: "LocalAssignment segments with work_agency_id == agency intersecting the quarter"
    constants: {}
    precision: "integer cents; round_half_up per employee line, then sum"

  - name: filing_calendar_generation
    trigger: "Registration activate; recompute_schedule regeneration"
    algorithm: interval_merge
    formula: |
      Generated for the calendar quarter containing activation (full quarter,
      even partially elapsed), plus the quarterly returns:
        WITHHOLDING_DEPOSIT rows per filing_frequency:
          MONTHLY:    one row per calendar month in the quarter
                      (period = month; due = 15th of next month)
          QUARTERLY:  one row (period = quarter; due = last day of month after quarter)
          SEMIWEEKLY: windows [Sat,Sun,Mon,Tue] due the Friday of the same week;
                      [Wed,Thu,Fri] due the Wednesday of the next week;
                      windows clipped to the quarter boundary.
        WITHHOLDING_RETURN: one row per quarter (due = last day of month after quarter).
        UI kind: UI_RETURN + UI_CONTRIBUTION, one row each per quarter
          (due = last day of month after quarter).
        LOCAL kind: LOCAL_RETURN per quarter (due = last day of month after quarter).
      Weekend roll-forward: a due_date on Saturday moves +2 days to Monday;
      on Sunday moves +1 day to Monday. No holiday calendar.
      NEXT_DAY tier: WITHHOLDING_DEPOSIT due_dates recompute to the next business
      day after period_end (same weekend roll).
    input_set: "Registration filing_frequency, deposit_tier, kind"
    constants: {}
    precision: "date-granular; inclusive period ends"

  - name: late_penalty_assessment
    trigger: "FilingObligation DUE->LATE (provisional, late_days=1); file from LATE (final)"
    algorithm: threshold
    formula: |
      late_days = calendar days from due_date + 1 day to filed_at (or clock while
      unfiled); 0 when filed on/before due_date.
      tier_rate: 1-5 days -> 2%; 6-15 days -> 5%; >15 days -> 10%
      penalty = max(MIN_PENALTY_CENTS, round_half_up(amount_due_cents * tier_rate))
      If amount_due_cents == 0: no penalty, no AgencyNotice is created at LATE.
      Provisional vs final: the LATE cascade posts the notice at late_days = 1
      (2% tier); filing from LATE recomputes at the final tier and UPDATES the
      same notice's penalty_amount_cents.
    input_set: "The single FilingObligation"
    constants:
      MIN_PENALTY_CENTS: 2500
      TIER1_MAX_DAYS: 5
      TIER2_MAX_DAYS: 15
    precision: "integer cents; round_half_up"
    variants:
      - name: provisional
        when: "At the DUE->LATE sweep"
        difference: "Computed at late_days = 1 (always 2% tier), posted to the auto-created notice"
      - name: final
        when: "At file time from LATE"
        difference: "Computed at actual late_days; can be higher than provisional; notice is updated in place"

  - name: abatement_eligibility
    trigger: "AbatementRequest creation (computes eligible_amount_cents, prior_penalty_count_3yr)"
    algorithm: aggregation
    formula: |
      outstanding = notice.penalty_amount_cents - notice.abated_amount_cents
      prior_penalty_count_3yr = COUNT of AgencyNotice rows with
        notice_type == PENALTY_ASSESSMENT
        AND received_date IN [notice.received_date - 3 years, notice.received_date)  (strictly earlier)
        AND (penalty_amount_cents - abated_amount_cents) > 0
        ordered by received_date ASC, created_at ASC (deterministic replay order).
      eligible_amount_cents:
        FIRST_TIME:       outstanding if prior_penalty_count_3yr == 0 else 0
        REASONABLE_CAUSE: outstanding
        STATUTORY:        floor(outstanding / 2)
      Submission window: current date <= notice.received_date + 60 days
      (day 60 allowed; day 61 -> ERR_ABATEMENT_WINDOW_CLOSED).
    input_set: "The linked notice + all PENALTY_ASSESSMENT notices in the 3-year lookback"
    constants:
      ABATEMENT_WINDOW_DAYS: 60
      FIRST_TIME_LOOKBACK_YEARS: 3
    precision: "integer cents; STATUTORY uses floor"

  - name: compliance_posture
    trigger: "AgencyNotice create/escalate/resolve/close; FilingObligation LATE/file/waive/confirm; NexusCase transitions; AbatementRequest decide"
    algorithm: aggregation
    formula: |
      open notices      = AgencyNotice status IN {RECEIVED, TRIAGED, RESPONSE_IN_PROGRESS, ESCALATED}
      outstanding_penalty_cents = SUM over open notices of (penalty_amount_cents - abated_amount_cents)
      DELINQUENT if any open notice has status ESCALATED
                OR any FilingObligation status == LATE with late_days > 30
                OR outstanding_penalty_cents > 1000000
      WATCH      else if any open notice exists
                OR any FilingObligation status == LATE
                OR any NexusCase status == THRESHOLD_MET
      GOOD_STANDING otherwise.
      open_notice_count = COUNT(open notices).
      registered_state_count = COUNT(DISTINCT state_code over Registration status == ACTIVE).
    input_set: "All notices, obligations, nexus cases, registrations"
    constants:
      DELINQUENT_PENALTY_CENTS: 1000000
      DELINQUENT_LATE_DAYS: 30
    precision: "integer cents; exact comparisons as written (> 30 days, > 1000000 cents)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids resolve to existing resources (left-to-right); body FK ids exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Employee-role caller may only act on resources whose employee_id == X-User-ID (election create/revoke, location-change create/cancel, own GETs)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Employee-role accessible endpoints"
  - priority: 5
    category: business_temporal
    check: "Date sanity: effective_from < effective_to; decision_deadline strictly future; response_due_date >= received_date; clock never moves backward"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "create/patch endpoints with date pairs; clock endpoint"
  - priority: 6
    category: state
    check: "Target resource is in a from-state that allows the transition (incl. terminal lockdown, rate EFFECTIVE for VC create); employee TERMINATED on location-change create/approve raises ERR_EMPLOYEE_NOT_ACTIVE from this same priority tier (from-state check first on a tie)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /etax/registrations; POST /etax/withholding-elections; POST /etax/local-assignments/override; POST /etax/ui-rates; PATCH /etax/location-changes/{id}"
  - priority: 8
    category: business_safety
    check: "Registration submit requires the state's NexusCase CONFIRMED"
    error_id: ERR_NEXUS_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /etax/registrations/{id}/submit"
  - priority: 9
    category: business_safety
    check: "VoluntaryContribution approve requires Employer.compliance_posture != DELINQUENT"
    error_id: ERR_COMPANY_POSTURE_DELINQUENT
    http_status: 409
    applies_to: "POST /etax/voluntary-contributions/{id}/approve"
  - priority: 10
    category: business_safety
    check: "Segregation of duties: VC approver != proposer; obligation confirmer != filer; abatement reviewer != preparer; location-change approver != submitter (by X-User-ID)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "approve/confirm/review endpoints"
  - priority: 11
    category: business_constraint
    check: "Singleton Employer already exists"
    error_id: ERR_EMPLOYER_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /etax/employers"
  - priority: 12
    category: business_constraint
    check: "TaxAgency (agency_kind, state_code, locality_code) unique among is_active=true"
    error_id: ERR_DUPLICATE_AGENCY
    http_status: 409
    applies_to: "POST /etax/tax-agencies"
  - priority: 13
    category: business_constraint
    check: "NexusCase unique per state_code among statuses {WATCH, THRESHOLD_MET, CONFIRMED, LAPSED}"
    error_id: ERR_DUPLICATE_NEXUS_CASE
    http_status: 409
    applies_to: "POST /etax/nexus-cases"
  - priority: 14
    category: business_constraint
    check: "One non-CLOSED Registration per agency_id"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /etax/registrations"
  - priority: 15
    category: business_constraint
    check: "One open LocationChange per employee (no PENDING_REVIEW/APPROVED sibling at create; same guard on terminate)"
    error_id: ERR_LOCATION_CHANGE_PENDING
    http_status: 409
    applies_to: "POST /etax/location-changes; POST /etax/employees/{id}/terminate"
  - priority: 16
    category: business_constraint
    check: "Half-open [effective_from, effective_to) overlap with a same-type, same-employee election in {SUBMITTED, VALIDATED, ACTIVE} when supersede_existing is not true; adjacency (from == prior.to) is allowed"
    error_id: ERR_ELECTION_OVERLAP
    http_status: 409
    applies_to: "POST /etax/withholding-elections"
  - priority: 17
    category: business_constraint
    check: "Closed-interval overlap on ReciprocityAgreement for the same unordered state pair (both endpoints inclusive; new.from > prior.to required to be disjoint)"
    error_id: ERR_AGREEMENT_OVERLAP
    http_status: 409
    applies_to: "POST /etax/reciprocity-agreements"
  - priority: 18
    category: business_referential
    check: "Agency kind fitness: ui-rate only on STATE_UI registration; override agencies must be LOCAL; VC only on experience_rated rates"
    error_id: ERR_AGENCY_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /etax/ui-rates; POST /etax/local-assignments/override"
  - priority: 19
    category: business_referential
    check: "Election work/resident semantics: work_state != resident_state; work_state == state of employee's current work location (at validate)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /etax/withholding-elections; validate"
  - priority: 20
    category: business_referential
    check: "RECIPROCITY_EXEMPTION requires an ACTIVE ReciprocityAgreement covering the {work, resident} pair and effective_from; certificate form must match when the agreement declares one"
    error_id: ERR_RECIPROCITY_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /etax/withholding-elections/{id}/validate"
  - priority: 21
    category: business_referential
    check: "Courtesy elections require an ACTIVE STATE_WITHHOLDING Registration for the target state (resident state for COURTESY_RESIDENT; work state for COURTESY_WORK)"
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /etax/withholding-elections/{id}/validate"
  - priority: 22
    category: business_referential
    check: "New-employer UI accounts (experience_rated=false) reject voluntary contributions"
    error_id: ERR_VC_NOT_ALLOWED_NEW_EMPLOYER
    http_status: 422
    applies_to: "POST /etax/voluntary-contributions"
  - priority: 23
    category: business_referential
    check: "VC apply blocked when the linked rate has been SUPERSEDED"
    error_id: ERR_RATE_SUPERSEDED
    http_status: 409
    applies_to: "POST /etax/voluntary-contributions/{id}/apply"
  - priority: 24
    category: business_temporal
    check: "VC remit requires clock <= decision_deadline (exact deadline allowed)"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /etax/voluntary-contributions/{id}/remit"
  - priority: 25
    category: business_temporal
    check: "Abatement submit within 60 days of notice received_date (day 60 inclusive)"
    error_id: ERR_ABATEMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /etax/abatement-requests/{id}/submit"
  - priority: 26
    category: business_fiscal
    check: "requested_amount_cents <= notice outstanding penalty"
    error_id: ERR_AMOUNT_EXCEEDS_PENALTY
    http_status: 422
    applies_to: "POST /etax/abatement-requests"
  - priority: 27
    category: business_fiscal
    check: "Voluntary contribution must project positive net savings"
    error_id: ERR_NO_NET_SAVINGS
    http_status: 422
    applies_to: "POST /etax/voluntary-contributions"
  - priority: 28
    category: business_fiscal
    check: "Abatement submit requires eligible_amount_cents > 0 (e.g. FIRST_TIME with prior penalties in 3-year lookback is ineligible)"
    error_id: ERR_ABATEMENT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /etax/abatement-requests/{id}/submit"
  - priority: 29
    category: business_fiscal
    check: "Notice resolve blocked while a linked AbatementRequest is non-terminal"
    error_id: ERR_ABATEMENT_PENDING
    http_status: 409
    applies_to: "POST /etax/agency-notices/{id}/resolve"
  - priority: 30
    category: business_fiscal
    check: "Registration close requires no obligations in {SCHEDULED, DUE, LATE} and no unresolved notices"
    error_id: ERR_REGISTRATION_NOT_SETTLED
    http_status: 409
    applies_to: "POST /etax/registrations/{id}/close"
  - priority: 31
    category: business_fiscal
    check: "General request sanity: malformed body, invalid enum, non-positive amounts, missing required fields, inactive target work location"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/etax/_clock/set_current_utc"
    description: "Set the logical clock (monotonic non-decreasing; moving backward -> ERR_INVALID_REQUEST). Server default before any set: 2026-08-01T00:00:00Z. Runs the scheduled sweep: agreement status recompute; election VALIDATED->ACTIVE / EXPIRED; PROPOSED VoluntaryContribution -> EXPIRED past deadline; obligation SCHEDULED->DUE and DUE->LATE with notice cascade; LocationChange APPROVED->EFFECTIVE cascade; Employer posture recompute."
    roles: [TaxDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["scheduled sweep per description"]

