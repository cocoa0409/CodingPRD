        distinguishing_aspect: "Two accepted resubmissions leave resubmission_count 2, equal to PORT_RESUBMISSION_LIMIT, so the third is refused with ERR_RESUBMISSION_LIMIT_REACHED (409) while the request stays in CSR_MISMATCH with the count unchanged - each attempt is individually well formed, only the cumulative count fails."
