      - name: claim_clearance_intervals_exclude_per_code_and_market_with_no_buffer
        grounds:
          - validations[priority=53]
          - validations[priority=25]
          - errors[ERR_CLAIM_CLEARANCE_OVERLAP]
          - entities.MarketingClaim.fields.cleared_from_utc
          - entities.MarketingClaim.fields.cleared_until_utc
          - entities.MarketingClaim.fields.claim_code
          - state_machines.MarketingClaim.DRAFT_to_CLEARED
          - state_machines.MarketingClaim.CLEARED_to_REJECTED
        distinguishing_aspect: |
          A second, deliberately different overlap regime on the same scaffold: the
          scope key is (claim_code, market_code) and there is NO buffer at all, so an
          interval that starts exactly at an incumbent's exclusive cleared_until_utc
          is accepted - the opposite calibration from the press-check rule, which
          needs 120 minutes of clearance on each side. The run also proves the
          predicate filters on legal_status: an interval that is refused while the
          incumbent is CLEARED is accepted verbatim once that incumbent has been
          withdrawn to REJECTED, with no other state change in between.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Five MarketingClaim rows, all DRAFT at creation: claim_a, claim_b and claim_c share claim_code CLM-NAS-01 and market_code US; claim_d has claim_code CLM-NAS-01 with market_code CA; claim_e has claim_code CLM-SRC-02 with market_code US."
