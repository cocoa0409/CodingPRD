              captures: { st_v4: $.data.version }
            - call: "POST /stores/${st}/markdown-stages"
              payload: { stage_index: 3, discount_pct: 0.50, sell_through_target_pct: 0.75, window_start_date: "2026-10-12", window_end_date: "2026-10-26", expected_store_version: "${st_v4}", supersede_overlapping: true }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { stg3: $.data.id }
          assert:
            - "adjacency is not overlap: creating ${stg2} with window_start_date equal to ${stg1}.window_end_date 2026-09-29 succeeded in setup and MarkdownStage.${stg2}.stage_status == ARMED"
            - "one day of true overlap: the first stage-3 create returns HTTP 409 with error_id == ERR_STAGE_WINDOW_OVERLAP because 2026-10-12 falls inside [2026-09-29,2026-10-13)"
            - "the refused create left GET /stores/${st}/markdown-stages with exactly 2 rows"
            - "the supersede create succeeds: MarkdownStage.${stg3}.stage_status == ARMED and MarkdownStage.${stg3}.discount_pct == 0.5000"
            - "MarkdownStage.${stg2}.stage_status == VOIDED with closed_reason == SUPERSEDED and activated_at == null"
            - "MarkdownStage.${stg1}.stage_status == ARMED (its window never overlapped, so it survives)"
            - "Store.${st}.planned_avg_discount_pct == 0.3500 — the average of ${stg1} 0.2000 and ${stg3} 0.5000, with the VOIDED stage excluded"
            - "Store.${st}.projected_gross_recovery_cents == 6467500 and projected_recovery_ratio == 1.2935"

      - name: augmentation_delivery_windows_are_closed_intervals_with_per_day_capacity_two
        grounds:
          - validations[priority=61]
          - errors[ERR_DELIVERY_SLOT_CAPACITY]
          - entities.AugmentationConsignment.fields.delivery_window_start_date
          - entities.AugmentationConsignment.fields.delivery_window_end_date
        distinguishing_aspect: |
          Different interval semantics from the markdown-stage rule on purpose: delivery windows are
          CLOSED intervals [start, end] and the constraint is an AGGREGATE per-day count (at most 2
          covering any single calendar day) rather than a pairwise no-overlap rule. Two windows that
          share the boundary day 2026-09-22 are therefore both permitted — the exact configuration
          that is legal for markdown stages only because those are half-open — and a third
          single-day window on 2026-09-22 is refused as the third cover of that day, while a
          disjoint window elsewhere is still accepted.
        test_recipe:
          setup:
            - "NY jurisdiction with max_augmentation_ratio 0.10 and MAX_CONCURRENT_DELIVERIES 2"
            - "One SELLING store with 5,000,000 cents of ORIGINAL cost value"
            - "Consignment A delivery [2026-09-20,2026-09-22] in PROPOSED"
