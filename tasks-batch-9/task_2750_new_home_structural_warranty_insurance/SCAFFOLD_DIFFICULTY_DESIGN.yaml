# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2750 - New-Home Structural Warranty Insurance
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every formula-derived value below is a pre-computed literal, not an estimate.
#
# Fixture identities used throughout (opaque roles carry literal operator ids):
#   uw-officer-001    UnderwritingOfficer
#   compliance-001    ComplianceOfficer
#   adjuster-001 / adjuster-002 / adjuster-003   ClaimsAdjuster (segregation of duties)
# BuilderPrincipal and Homeowner are entity_backed, so their as_user_id is always a ${var}.
#
# The canonical class-C builder (years_in_business 5, homes_closed_last_year 25,
# claims_history_score 94, TIER_3) scores exactly 45.00 -> risk_class C.
# The canonical policy (purchase_price_cents 44500000, TX, closing_date 2026-08-15) prices at
# premium_cents 363894 and mints terms 2026-08-15..2027-08-14 (WORKMANSHIP, limit 2000000),
# ..2028-08-14 (SYSTEMS, limit 6000000), ..2036-08-14 (STRUCTURAL, limit 44500000), with
# builder_obligation_end_date 2028-08-14.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: builder_risk_score_declared_vs_observed_variant_changes_band
        grounds:
          - calculations.builder_risk_score
          - entities.Builder.fields.risk_basis
          - entities.Builder.fields.risk_class
          - state_machines.Builder.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          The two variants of calculations.builder_risk_score read DIFFERENT input sets for the same
          two formula slots on one unchanged Builder row: initial_underwriting feeds the DECLARED
          claims_history_score (94) and homes_closed_last_year (25), while renewal_reassessment
          replaces them with the OBSERVED loss_ratio (0.0000 -> effective_claims_score 100) and the
          realised count of ACTIVE/EXPIRED policies (1 -> volume_factor 0). Identical stored data
          therefore yields 45.00/class C on the underwriting pass and 40.00/class B on the
          monitoring pass - a 5.00 delta that also crosses the CLASS_C_FLOOR band edge.
        test_recipe:
          setup:
            - "one Builder scored on declared data at risk_score 45.00, risk_class C, risk_basis INITIAL_UNDERWRITING, underwriting_status APPROVED"
            - "one Homeowner registered"
            - "exactly one WarrantyPolicy of that builder with coverage_status ACTIVE and premium_status PAID, so Builder.loss_ratio is 0.0000 and the realised policy volume is 1"
            - "logical clock advanced to 2026-08-15T00:00:00Z before enrollment so the 2026-08-15 closing date is not in the future"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { rs_initial: $.data.risk_score, rc_initial: $.data.risk_class }
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE", reviewer_notes: "declared data accepted" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id, prem1: $.data.premium_cents }
            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/premium-payments"
              payload: {}
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/policies/${p1}/activation"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
          trigger:
            - call: "POST /warranty/builders/${b1}/reassessment"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { rs_renewal: $.data.risk_score, rc_renewal: $.data.risk_class }
          assert:
            - "${rs_initial} == 45.00 and ${rc_initial} == \"C\" - the initial_underwriting variant on declared inputs"
            - "${rs_renewal} == 40.00 and ${rc_renewal} == \"B\" - the renewal_reassessment variant on observed inputs"
            - "${rs_initial} - ${rs_renewal} == 5.00, so the two variants disagree on the same unchanged Builder row"
            - "Builder.${b1}.risk_basis == \"RENEWAL_REASSESSMENT\""
            - "Builder.${b1}.underwriting_status == \"APPROVED\" - class B is not the D case that would auto-suspend"
            - "${prem1} == 363894"
      - name: claim_net_payable_builder_arm_waives_deductible_insurer_arm_charges_it
        grounds:
          - calculations.claim_net_payable
          - calculations.claim_obligor_assignment
          - entities.Claim.fields.deductible_applied_cents
          - entities.Claim.fields.net_payable_cents
          - state_machines.Claim.UNDER_INVESTIGATION_to_BUILDER_OBLIGATION_NOTICE
          - state_machines.Claim.UNDER_INVESTIGATION_to_INSURER_ADJUDICATION
        distinguishing_aspect: |
          Two claims with byte-identical money inputs (claimed_amount_cents 2187500,
          substantiation_ratio 0.80, designated_structural true) on the SAME policy and the SAME
          STRUCTURAL coverage term diverge purely on which period their reported_date fell in:
          variant builder_obligation_settlement forces step 3 deductible_applied_cents to 0 and
          yields net_payable_cents 1610000 with reserve_cents 0, while variant
          insurer_backed_settlement charges STRUCTURAL_DEDUCTIBLE_CENTS 250000 and yields
          net_payable_cents 1380000 which becomes the case reserve - a 230000 delta driven by the
          variant, not by the inputs.
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and its canonical 44500000 policy ACTIVE and PAID (builder_obligation_end_date 2028-08-14, STRUCTURAL term 2026-08-15..2036-08-14 with limit 44500000)"
            - "claim A filed while the logical clock reads 2026-09-01 (inside the builder-obligation period) with a structural assessment on file"
            - "claim B filed while the logical clock reads 2028-09-01 (inside the insurer-backed period) with an identical structural assessment on file"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id }
            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/premium-payments"
              payload: {}
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/policies/${p1}/activation"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/claims"
              payload: { policy_id: "${p1}", coverage_type: "STRUCTURAL", defect_category: "LOAD_BEARING_FAILURE", damage_description: "Stair-step cracking across the north foundation wall", claimed_amount_cents: 2187500 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { cA: $.data.id, obligorA: $.data.obligor }
            - call: "POST /warranty/claims/${cA}/investigation"
              payload: { substantiation_ratio: 0.80 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims/${cA}/structural-assessments"
              payload: { affected_elements: ["FOUNDATION_WALL"], deflection_ratio: 0.0040, load_bearing_affected: true }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/claims"
              payload: { policy_id: "${p1}", coverage_type: "STRUCTURAL", defect_category: "LOAD_BEARING_FAILURE", damage_description: "Identical stair-step cracking, second report", claimed_amount_cents: 2187500 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { cB: $.data.id, obligorB: $.data.obligor }
            - call: "POST /warranty/claims/${cB}/investigation"
              payload: { substantiation_ratio: 0.80 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims/${cB}/structural-assessments"
              payload: { affected_elements: ["FOUNDATION_WALL"], deflection_ratio: 0.0040, load_bearing_affected: true }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          trigger:
            - call: "POST /warranty/claims/${cA}/obligation-routing"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims/${cB}/obligation-routing"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          assert:
            - "${obligorA} == \"BUILDER\" and ${obligorB} == \"INSURER\""
            - "Claim.${cA}.status == \"BUILDER_OBLIGATION_NOTICE\" and Claim.${cB}.status == \"INSURER_ADJUDICATION\""
            - "Claim.${cA}.gross_adjusted_cents == 1750000 and Claim.${cB}.gross_adjusted_cents == 1750000 - the inputs are identical"
            - "Claim.${cA}.deductible_applied_cents == 0 and Claim.${cA}.betterment_cents == 140000 and Claim.${cA}.net_payable_cents == 1610000"
            - "Claim.${cB}.deductible_applied_cents == 250000 and Claim.${cB}.betterment_cents == 120000 and Claim.${cB}.net_payable_cents == 1380000"
            - "Claim.${cA}.reserve_cents == 0 and Claim.${cA}.incurred_authorized_cents == 0 - the builder arm establishes no reserve"
            - "Claim.${cB}.reserve_cents == 1380000 and Claim.${cB}.incurred_authorized_cents == 1380000"
            - "Claim.${cA}.net_payable_cents - Claim.${cB}.net_payable_cents == 230000"

  - rule_id: combinatorial_formula
    instances:
      - name: policy_premium_per_component_rounding_order_is_pinned
        grounds:
          - calculations.policy_premium
          - entities.WarrantyPolicy.fields.premium_component_workmanship_cents
          - entities.WarrantyPolicy.fields.premium_component_systems_cents
          - entities.WarrantyPolicy.fields.premium_component_structural_cents
          - entities.WarrantyPolicy.fields.state_surcharge_cents
          - entities.WarrantyPolicy.fields.risk_class_at_enrollment
        distinguishing_aspect: |
          §0.5 Rule 2 mode (b): the ORDER of rounding is what the formula pins. At
          purchase_price_cents 36500000 under risk_class C the three coverage components round
          independently to 46647 + 69971 + 178166 and, with STATE_SURCHARGE TX 4500, sum to exactly
          299284. Summing the three exact rational values first and rounding once at the end - the
          rejected reading - gives 299283. Rounding the structural component BEFORE applying
          STRUCTURAL_LOADING 1.25 is also rejected. The one-cent gap is the entire observable.
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED, so risk_class_at_enrollment is snapshotted as C with BASE_RATE_BP 71 and STRUCTURAL_LOADING 1.25"
            - "one Homeowner registered"
            - "logical clock advanced to 2026-08-15T00:00:00Z before enrollment so the 2026-08-15 closing date is not in the future"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Bruno Calder", email: "bruno.calder@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          trigger:
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "44 Willow Bend Dr", state_code: "TX", purchase_price_cents: 36500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p2: $.data.id, prem2: $.data.premium_cents }
          assert:
            - "WarrantyPolicy.${p2}.risk_class_at_enrollment == \"C\""
            - "WarrantyPolicy.${p2}.premium_component_workmanship_cents == 46647"
            - "WarrantyPolicy.${p2}.premium_component_systems_cents == 69971"
            - "WarrantyPolicy.${p2}.premium_component_structural_cents == 178166"
            - "WarrantyPolicy.${p2}.state_surcharge_cents == 4500"
            - "${prem2} == 299284"
            - "${prem2} != 299283 - 299283 is the value the round-once-at-the-end reading produces and is the falsifier for this instance"
      - name: claim_betterment_tier_selected_before_betterment_is_subtracted
        grounds:
          - calculations.claim_net_payable
          - entities.Claim.fields.betterment_cents
          - entities.Claim.fields.net_payable_cents
          - state_machines.Claim.UNDER_INVESTIGATION_to_INSURER_ADJUDICATION
        distinguishing_aspect: |
          §0.5 Rule 2 mode (c): the formula reads circularly because betterment_pct is keyed on a
          payable tier while betterment reduces that payable. The pinned order selects the tier from
          provisional_net_cents (pre-betterment). Two claims three cents apart straddle
          BETTERMENT_TIER_2_FLOOR 1500000: provisional_net 1500000 takes 8% and lands at 1380000,
          while provisional_net 1499998 takes 5% and lands at 1424998 - the LARGER claim yields the
          SMALLER settlement. Re-selecting the tier from the post-betterment figure would drop the
          first claim back to 5% and give 1425000, which is the falsifier.
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and the canonical 44500000 policy ACTIVE and PAID"
            - "logical clock at 2028-09-01T00:00:00Z, past builder_obligation_end_date 2028-08-14, so both claims are INSURER-obligated and step 3 charges the deductible"
            - "two claims on the STRUCTURAL term, both with substantiation_ratio 0.80 and a designated-structural assessment, claimed_amount_cents 2187500 and 2187497"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id }
            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/premium-payments"
              payload: {}
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/policies/${p1}/activation"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/claims"
              payload: { policy_id: "${p1}", coverage_type: "STRUCTURAL", defect_category: "STRUCTURAL_CRACKING", damage_description: "Foundation displacement, at the tier boundary", claimed_amount_cents: 2187500 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { cHi: $.data.id }
            - call: "POST /warranty/claims/${cHi}/investigation"
              payload: { substantiation_ratio: 0.80 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims/${cHi}/structural-assessments"
              payload: { affected_elements: ["FOOTING", "FOUNDATION_WALL"], deflection_ratio: 0.0051, load_bearing_affected: true }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims"
              payload: { policy_id: "${p1}", coverage_type: "STRUCTURAL", defect_category: "STRUCTURAL_CRACKING", damage_description: "Foundation displacement, three cents below the tier boundary", claimed_amount_cents: 2187497 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { cLo: $.data.id }
            - call: "POST /warranty/claims/${cLo}/investigation"
              payload: { substantiation_ratio: 0.80 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims/${cLo}/structural-assessments"
              payload: { affected_elements: ["FOOTING", "FOUNDATION_WALL"], deflection_ratio: 0.0051, load_bearing_affected: true }
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          trigger:
            - call: "POST /warranty/claims/${cHi}/obligation-routing"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
            - call: "POST /warranty/claims/${cLo}/obligation-routing"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          assert:
            - "Claim.${cHi}.gross_adjusted_cents == 1750000 and Claim.${cHi}.deductible_applied_cents == 250000"
            - "Claim.${cHi}.betterment_cents == 120000 and Claim.${cHi}.net_payable_cents == 1380000"
            - "Claim.${cLo}.gross_adjusted_cents == 1749998 and Claim.${cLo}.deductible_applied_cents == 250000"
            - "Claim.${cLo}.betterment_cents == 75000 and Claim.${cLo}.net_payable_cents == 1424998"
            - "Claim.${cLo}.net_payable_cents > Claim.${cHi}.net_payable_cents - the smaller claim settles higher, which only holds when the tier is read pre-betterment"
            - "Claim.${cHi}.net_payable_cents != 1425000 - 1425000 is the post-betterment re-selection reading and is the falsifier"

  - rule_id: non_linear_state_machine
    instances:
      - name: builder_referral_and_suspension_cycles_re_enter_prior_states
        grounds:
          - state_machines.Builder.UNDER_REVIEW_to_REFERRED
          - state_machines.Builder.REFERRED_to_UNDER_REVIEW
          - state_machines.Builder.APPROVED_to_SUSPENDED
          - state_machines.Builder.SUSPENDED_to_APPROVED
          - calculations.builder_risk_score
          - entities.UnderwritingReview.fields.resulting_underwriting_status
        distinguishing_aspect: |
          The Builder axis is non-linear by CYCLES: REFERRED -> UNDER_REVIEW re-enters a state the
          row already left (and re-runs the initial_underwriting scoring), and SUSPENDED -> APPROVED
          re-enters APPROVED after leaving it. A forward-only reading of the axis rejects both
          transitions. The observable is that the second review-intake succeeds from REFERRED while
          leaving risk_basis at INITIAL_UNDERWRITING, and that the row reaches APPROVED twice with
          exactly two UnderwritingReview rows in its journal.
        test_recipe:
          setup:
            - "one Builder driven DRAFT -> SUBMITTED -> UNDER_REVIEW -> REFERRED by a REFER decision, holding risk_score 45.00 and risk_class C"
            - "logical clock advanced to 2026-08-15T00:00:00Z before enrollment so the 2026-08-15 closing date is not in the future"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
