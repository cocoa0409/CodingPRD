            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", p50_cents: 10000000, sample_size: 20, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv1}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band1: $.data.id, band1_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band1}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band1_v}" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands/${band1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands/${band1}/publish", payload: {}, as: CompManager }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "MAPPING_OPEN" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PUBLISHED" }, as: CompAdmin }
          trigger:
            - { call: "POST /comp/refresh-cycles", payload: { comp_program_id: "${prog}", planned_window_start: "2027-01-01", planned_window_end: "2027-03-01", effective_date: "2027-01-01" }, as: CompManager, captures: { rc1: $.data.id } }
            - { call: "POST /comp/refresh-cycles", payload: { comp_program_id: "${prog}", planned_window_start: "2027-03-01", planned_window_end: "2027-05-01", effective_date: "2027-04-01" }, as: CompManager, captures: { rc2: $.data.id } }
            - { call: "POST /comp/refresh-cycles", payload: { comp_program_id: "${prog}", planned_window_start: "2027-02-15", planned_window_end: "2027-04-01", effective_date: "2027-03-15" }, as: CompManager, captures: { err: $.data.error_id } }
          assert:
            - "cycle 1 [2027-01-01, 2027-03-01) -> 201 SCHEDULED"
            - "cycle 2 [2027-03-01, 2027-05-01) -> 201 SCHEDULED: start == prior end is adjacency, not overlap (half-open)"
            - "cycle 3 [2027-02-15, 2027-04-01) -> ERR_REFRESH_WINDOW_CONFLICT (409): overlaps both non-terminal cycles"

      - name: exception_rolling_capacity_window
        grounds:
          - validations[priority=11]
          - errors[ERR_EXCEPTION_ROLLING_CAP]
          - entities.ExceptionRequest.fields.created_by_user_id
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on ExceptionRequest (versus
          RefreshCycle's pairwise half-open geometry): a third request is
          rejected because two APPROVED requests sit inside the trailing
          365-day window, and it becomes legal only after the logical clock
          moves 366 days past their created_at — no pairwise interval
          intersection is involved.
