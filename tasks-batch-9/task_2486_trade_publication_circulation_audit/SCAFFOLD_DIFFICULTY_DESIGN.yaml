            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_2}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_new_id: $.data.id }
          trigger:
            - call: "POST /circulation/statements/${st_new_id}/certify"
              payload: { certification_note: "unrelated period, frozen publication" }
              as: PublisherExecutive
              as_user_id: "exec-01"
              captures: { err: $.data.error_id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_3: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "AUDIT_VERIFIED", restates_statement_id: "${st1_id}", expected_publication_version: "${pub_ver_3}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_r_id: $.data.id, st_r_total: $.data.total_qualified_copies }
            - call: "POST /circulation/statements/${st_r_id}/certify"
              payload: { certification_note: "restatement of the audited period" }
              as: PublisherExecutive
              as_user_id: "exec-01"
