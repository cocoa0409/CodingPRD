scenario: |
  Generate task harder than expert level!

  2623. Brand Safety & Ad Verification Operations (advertising verification provider): inclusion and exclusion list management with publisher and content category classification, page-level content classification with brand suitability tiers beyond binary safe and unsafe, pre-bid blocking integration with the buying platform and post-bid monitoring reporting, invalid traffic detection across bots, data center traffic and sophisticated fraud patterns, viewability measurement with in-view time thresholds by format and measurement coverage rates, made-for-advertising and low-quality inventory identification, measurement accreditation and methodology audits, advertiser reporting with refund and credit claims against publishers, appeals from publishers over classification decisions

domain_name: brand-safety-ad-verification-operations

# Flat topology: every entity is addressed by its own top-level collection
# (/publishers, /pages, /measurement-batches, ...) and links are carried as
# foreign keys in request bodies rather than as URL nesting. api_prefix is
# therefore the API root itself; no single business aggregate owns the surface.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - version_pinning_on_approval

  entity_topology: flat
  state_machine_shape: parallel
  # MeasurementBatch carries two independent state dimensions on one row
  # (scoring_status x settlement_status); Appeal, InventoryList and Page are
  # cyclic; RefundClaim is branching. No machine is a pure linear pipeline.

  relationship_patterns:
    - one_to_many          # Publisher -> Page, Campaign -> MeasurementBatch, InventoryList -> ListEntry
    - cross_aggregate      # MeasurementBatch references Campaign (advertiser side) AND Page/Publisher (supply side)
    - polymorphic          # ListEntry.entry_value addresses a page URL, a domain, a Publisher.id or a category code depending on entry_type

  role_model: segregation_of_duties
  # The operator who reviewed a PageClassification may not decide the Appeal
  # against it; the operator who authored a MethodologyVersion may not conclude
  # its accreditation audit. Both are enforced on X-User-ID, not on role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Advertiser legal name"
        constraints: "1-120 chars, non-blank"
      - name: credit_cap_cents
        type: integer
        source: input
        description: "Lifetime ceiling on credit this advertiser may receive from all settled RefundClaims"
        default: 1000000
        constraints: ">= 0"
      - name: credit_received_cents_total
        type: integer
        source: computed
        description: "Running sum of net_credit_cents over RefundClaims in claim_state APPROVED; decremented on REVERSED. Half of the double-entry invariant INVARIANT_CREDIT_DOUBLE_ENTRY."
        default: 0
      - name: settled_claim_count
        type: integer
        source: computed
        description: "Count of RefundClaims for this advertiser's campaigns in claim_state APPROVED"
        default: 0

  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Publisher name"
        constraints: "1-120 chars, non-blank"
      - name: primary_domain
        type: string
        source: input
        description: "Registrable domain of the publisher's flagship property, lowercase host form (e.g. 'news.example.com')"
        constraints: "unique across Publishers; lowercase; no scheme, no path"
      - name: sourced_traffic_pct
        type: number
        source: input
        description: "Share of sessions the publisher buys from third-party traffic vendors; an MFA signal input"
        default: 0.0
        constraints: "0.0 <= x <= 1.0"
      - name: publisher_status
        type: enum
        source: system
        description: "Supply-side standing gate"
        default: ACTIVE
        constraints: "one of ACTIVE, RESTRICTED, DELISTED"
      - name: status_reason
        type: string
        source: system
        description: "Machine reason for the current publisher_status (e.g. QUARANTINE_THRESHOLD, MFA_THRESHOLD, ADMIN_ACTION)"
        default: null
      - name: mfa_page_count
        type: integer
        source: computed
        description: "Count of this publisher's Pages whose mfa_flag is true"
        default: 0
      - name: quarantined_batch_count
        type: integer
        source: computed
        description: "Count of this publisher's MeasurementBatches whose scoring_status is QUARANTINED"
        default: 0
      - name: certified_batch_count
        type: integer
        source: computed
        description: "Count of this publisher's MeasurementBatches whose scoring_status is CERTIFIED"
        default: 0
      - name: decided_appeal_count
        type: integer
        source: computed
        description: "Count of Appeals on this publisher's pages whose appeal_state is UPHELD or OVERTURNED"
        default: 0
      - name: overturned_appeal_count
        type: integer
        source: computed
        description: "Count of Appeals on this publisher's pages whose appeal_state is OVERTURNED"
        default: 0
      - name: credit_issued_cents_total
        type: integer
        source: computed
        description: "Running sum of net_credit_cents charged back to this publisher over RefundClaims in claim_state APPROVED; decremented on REVERSED. Other half of INVARIANT_CREDIT_DOUBLE_ENTRY."
        default: 0

  - name: MethodologyVersion
    parent: null
    common_fields: true
    fields:
      - name: standard_family
        type: enum
        source: input
        description: "Accreditation family this version belongs to; effective windows may not overlap inside one family"
        constraints: "one of VIEWABILITY, IVT, SUITABILITY"
      - name: version_code
        type: string
        source: input
        description: "Human-readable version label"
        constraints: "unique per standard_family; 1-40 chars"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the version's effective window (ISO 8601 UTC)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the version's effective window (ISO 8601 UTC)"
        constraints: "must be strictly greater than effective_from"
      - name: display_in_view_seconds
        type: number
        source: input
        description: "Minimum continuous in-view seconds required for a DISPLAY impression to count as viewable"
        default: 1.0
        constraints: "> 0"
      - name: video_in_view_seconds
        type: number
        source: input
        description: "Minimum continuous in-view seconds required for a VIDEO impression to count as viewable"
        default: 2.0
        constraints: "> 0"
      - name: display_pixel_pct
        type: number
        source: input
        description: "Minimum in-view pixel share for DISPLAY"
        default: 0.5
        constraints: "0 < x <= 1"
      - name: large_display_pixel_pct
        type: number
        source: input
        description: "Minimum in-view pixel share for LARGE_DISPLAY (creatives >= 242500 px)"
        default: 0.3
        constraints: "0 < x <= 1"
      - name: video_pixel_pct
        type: number
        source: input
        description: "Minimum in-view pixel share for VIDEO"
        default: 0.5
        constraints: "0 < x <= 1"
      - name: coverage_rate_floor
        type: number
        source: input
        description: "Minimum measurement coverage rate (measurable / measured) a batch must reach to be certified"
        default: 0.7
        constraints: "0 < x <= 1"
      - name: ivt_rate_ceiling
        type: number
        source: input
        description: "Maximum invalid-traffic rate a batch may carry and still be certified"
        default: 0.02
        constraints: "0 <= x < 1"
      - name: accreditation_status
        type: enum
        source: system
        description: "Accreditation standing of this methodology version"
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, ACCREDITED, SUSPENDED, LAPSED"
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AccreditationAuditor that created this version; the segregation-of-duties counterparty for audit conclusion"
      - name: lead_auditor_user_id
        type: string
        source: system
        description: "X-User-ID of the AccreditationAuditor that concluded the audit"
        default: null
      - name: audit_outcome
        type: enum
        source: system
        description: "Outcome recorded by the accreditation audit"
        default: null
        constraints: "one of PASSED, DEFICIENT, or null before conclusion"
      - name: audit_finding_rate
        type: number
        source: input
        description: "Sampling error rate the auditor measured, recorded at conclusion"
        default: null
        constraints: "0.0 <= x <= 1.0"
      - name: deficiency_note
        type: string
        source: input
        description: "Auditor narrative, required when audit_outcome is DEFICIENT"
        default: null
      - name: decertified_batch_count
        type: integer
        source: computed
        description: "Count of MeasurementBatches this version decertified when it was SUSPENDED"
        default: 0

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: "FK -> Advertiser.id; owning advertiser, must match X-User-ID for role Advertiser"
      - name: name
        type: string
        source: input
        description: "Campaign name"
        constraints: "1-120 chars, non-blank"
      - name: cpm_cents
        type: integer
        source: input
        description: "Media cost per thousand impressions in cents; the credit basis for RefundClaims"
        constraints: "> 0"
      - name: min_suitability_tier
        type: enum
        source: input
        description: "Lowest brand-suitability tier the campaign accepts; TIER_RANK below this value is a breach"
        constraints: "one of FLOOR, HIGH_RISK, MEDIUM_RISK, LOW_RISK, SAFE"
      - name: target_coverage_rate
        type: number
        source: input
        description: "Contracted measurement coverage rate the campaign must sustain across certified batches"
        default: 0.75
        constraints: "0 < x <= 1"
      - name: format
        type: enum
        source: input
        description: "Creative format all of this campaign's MeasurementBatches must declare"
        constraints: "one of DISPLAY, LARGE_DISPLAY, VIDEO"
      - name: status
        type: enum
        source: system
        description: "Campaign operational standing"
        default: ACTIVE
        constraints: "one of ACTIVE, UNDER_REMEDIATION"
      - name: coverage_status
        type: enum
        source: computed
        description: "Derived from certified_measured_impressions / certified_measurable_impressions against target_coverage_rate"
        default: UNKNOWN
        constraints: "one of UNKNOWN, ON_TARGET, BELOW_TARGET"
      - name: certified_measured_impressions
        type: integer
        source: computed
        description: "Sum of measured_impressions over this campaign's MeasurementBatches whose scoring_status is CERTIFIED"
        default: 0
      - name: certified_measurable_impressions
        type: integer
        source: computed
        description: "Sum of measurable_impressions over this campaign's MeasurementBatches whose scoring_status is CERTIFIED"
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        description: "Count of this campaign's RefundClaims whose claim_state is SUBMITTED or UNDER_REVIEW"
        default: 0

  - name: InventoryList
    parent: null
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: "FK -> Advertiser.id; owner of the list"
      - name: list_type
        type: enum
        source: input
        description: "INCLUSION lists carry ALLOW entries, EXCLUSION lists carry BLOCK entries"
        constraints: "one of INCLUSION, EXCLUSION"
      - name: name
        type: string
        source: input
        description: "List label"
        constraints: "1-120 chars; unique per (advertiser_id, list_type)"
      - name: status
        type: enum
        source: system
        description: "Publication standing; only PUBLISHED lists may be synced to a PreBidSegment"
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, STALE"
      - name: entry_count
        type: integer
        source: computed
        description: "Count of ListEntries whose list_id is this list"
        default: 0
      - name: published_version
        type: integer
        source: system
        description: "Snapshot of this list's version at the moment of the most recent publish; PreBidSegment pins this value"
        default: null
      - name: published_at
        type: datetime
        source: system
        description: "Logical clock reading at the most recent publish"
        default: null
      - name: stale_reason
        type: string
        source: system
        description: "Machine reason the list went STALE (e.g. RESTRICTED_PUBLISHER_ENTRY)"
        default: null

  - name: ListEntry
    parent: InventoryList
    common_fields: false
    fields:
      - name: list_id
        type: string
        source: input
        description: "FK -> InventoryList.id; the list this entry belongs to"
      - name: entry_type
        type: enum
        source: input
        description: "Addressing mode of entry_value; also fixes the precedence specificity of this entry"
        constraints: "one of PAGE_URL, DOMAIN, PUBLISHER, CATEGORY"
      - name: entry_value
        type: string
        source: input
        description: "Polymorphic target: a full page URL when entry_type is PAGE_URL, a lowercase host when DOMAIN, a Publisher.id when PUBLISHER, a content category code when CATEGORY"
        constraints: "1-300 chars; unique per (list_id, entry_type, entry_value)"
      - name: action
        type: enum
        source: computed
        description: "Derived from the parent list's list_type: ALLOW for INCLUSION, BLOCK for EXCLUSION"
        constraints: "one of ALLOW, BLOCK"
      - name: specificity_rank
        type: integer
        source: computed
        description: "Precedence weight derived from entry_type: PAGE_URL 4, DOMAIN 3, PUBLISHER 2, CATEGORY 1"
        constraints: "one of 1, 2, 3, 4"

  - name: PreBidSegment
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign whose bidder consumes this segment"
      - name: inclusion_list_id
        type: string
        source: input
        description: "FK -> InventoryList.id; optional allow list pinned by this segment"
        default: null
      - name: exclusion_list_id
        type: string
        source: input
        description: "FK -> InventoryList.id; optional block list pinned by this segment"
        default: null
      - name: suitability_floor_tier
        type: enum
        source: input
        description: "Pre-bid tier floor enforced by this segment; may be stricter than the campaign's min_suitability_tier"
        constraints: "one of FLOOR, HIGH_RISK, MEDIUM_RISK, LOW_RISK, SAFE"
      - name: sync_status
        type: enum
        source: system
        description: "Whether the buying platform holds the current list snapshot"
        default: PENDING
        constraints: "one of PENDING, SYNCED, STALE"
      - name: synced_inclusion_version
        type: integer
        source: system
        description: "InventoryList.published_version of inclusion_list_id captured at the last successful sync"
        default: null
      - name: synced_exclusion_version
        type: integer
        source: system
        description: "InventoryList.published_version of exclusion_list_id captured at the last successful sync"
        default: null
      - name: synced_at
        type: datetime
        source: system
        description: "Logical clock reading at the last successful sync"
        default: null
      - name: stale_reason
        type: string
        source: system
        description: "Machine reason the segment went STALE (e.g. LIST_STALE, CAMPAIGN_UNDER_REMEDIATION)"
        default: null

  - name: Page
    parent: null
    common_fields: true
    fields:
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; the publisher that owns this page"
      - name: url
        type: string
        source: input
        description: "Absolute page URL"
        constraints: "1-300 chars; unique per publisher_id; must start with 'https://'"
      - name: domain
        type: string
        source: computed
        description: "Lowercase host extracted from url; the DOMAIN-entry match key for list precedence"
      - name: classification_state
        type: enum
        source: system
        description: "Classification lifecycle position of the page"
        default: UNCLASSIFIED
        constraints: "one of UNCLASSIFIED, MODEL_CLASSIFIED, HUMAN_CONFIRMED, APPEALED, RECLASSIFIED"
      - name: current_tier
        type: enum
        source: computed
        description: "Brand suitability tier of the page's currently effective classification; null while UNCLASSIFIED"
        default: null
        constraints: "one of FLOOR, HIGH_RISK, MEDIUM_RISK, LOW_RISK, SAFE"
      - name: current_classification_id
        type: string
        source: computed
        description: "FK -> PageClassification.id; the classification whose review_state is PENDING_REVIEW, CONFIRMED or OVERRIDDEN with the latest created_at; null while UNCLASSIFIED"
        default: null
      - name: latest_category_codes
        type: array
        source: computed
        description: "Content category codes of the currently effective classification; the CATEGORY-entry match key for list precedence"
        default: []
      - name: mfa_score
        type: number
        source: computed
        description: "Made-for-advertising score of the currently effective classification, 2 decimal places"
        default: null
      - name: mfa_flag
        type: boolean
        source: computed
        description: "True when mfa_score >= MFA_FLAG_THRESHOLD (70.00)"
        default: false
      - name: appeal_count
        type: integer
        source: computed
        description: "Count of Appeals filed against classifications of this page"
        default: 0

  - name: PageClassification
    parent: null
    common_fields: true
    fields:
      - name: page_id
        type: string
        source: input
        description: "FK -> Page.id; the classified page"
      - name: methodology_version_id
        type: string
        source: input
        description: "FK -> MethodologyVersion.id; SUITABILITY-family version pinned by this classification"
      - name: classifier_kind
        type: enum
        source: input
        description: "MODEL for automated classification, HUMAN for analyst-authored; APPEAL_REMEDY is minted only by the system when an Appeal is OVERTURNED"
        constraints: "input accepts MODEL or HUMAN; system may also write APPEAL_REMEDY"
      - name: category_codes
        type: array
        source: input
        description: "Content category codes assigned to the page; drives base_risk_points"
        constraints: "0-6 entries, each one of ADULT, TERRORISM, ILLEGAL_DRUGS, ARMS, CRIME_VIOLENCE, HATE_SPEECH, PIRACY, DEATH_INJURY, TOBACCO_ALCOHOL, GAMBLING, DEBATED_SOCIAL, NEWS_HARD, SPORTS_NEWS, GENERAL"
      - name: model_confidence
        type: number
        source: input
        description: "Classifier confidence; below MODEL_CONFIDENCE_FLOOR (0.80) a MODEL classification inflates risk by CONFIDENCE_INFLATION (1.25)"
        default: 1.0
        constraints: "0.0 <= x <= 1.0"
      - name: ad_density_ratio
        type: number
        source: input
        description: "Share of above-the-fold area occupied by ad slots; MFA signal"
        constraints: "0.0 <= x <= 1.0"
      - name: refresh_seconds
        type: integer
        source: input
        description: "Auto-refresh interval of the page in seconds; 0 means no auto-refresh; MFA signal"
        constraints: ">= 0"
      - name: originality_score
        type: number
        source: input
        description: "Editorial originality 0-100 (100 = fully original); MFA signal"
        constraints: "0.0 <= x <= 100.0"
      - name: base_risk_points
        type: number
        source: computed
        description: "Sum of CATEGORY_RISK_WEIGHTS over category_codes"
        default: 0
      - name: adjusted_risk_points
        type: number
        source: computed
        description: "base_risk_points after the MFA and confidence multipliers, rounded to 2 decimals half-up"
        default: 0
      - name: assigned_tier
        type: enum
        source: computed
        description: "Tier this classification assigns to the page"
        constraints: "one of FLOOR, HIGH_RISK, MEDIUM_RISK, LOW_RISK, SAFE"
      - name: mfa_score
        type: number
        source: computed
        description: "Made-for-advertising score computed from ad_density_ratio, refresh_seconds, publisher.sourced_traffic_pct and originality_score, 2 decimals"
      - name: mfa_flag
        type: boolean
        source: computed
        description: "True when mfa_score >= MFA_FLAG_THRESHOLD (70.00); computed BEFORE assigned_tier because it feeds the MFA multiplier"
        default: false
      - name: review_state
        type: enum
        source: system
        description: "Human-review standing of this classification record"
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, CONFIRMED, OVERRIDDEN, SUPERSEDED, VACATED"
      - name: classifier_user_id
        type: string
        source: system
        description: "X-User-ID of the ClassificationAnalyst that created the record"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClassificationAnalyst that confirmed or overrode the record; the segregation-of-duties counterparty for appeal decisions"
        default: null
      - name: review_note
        type: string
        source: input
        description: "Analyst narrative recorded at review"
        default: null

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: classification_id
        type: string
        source: input
        description: "FK -> PageClassification.id; the disputed classification, which must be the page's currently effective record"
      - name: reason_code
        type: enum
        source: input
        description: "Publisher's stated ground for the appeal"
        constraints: "one of CATEGORY_MISREAD, CONTEXT_IGNORED, STALE_CRAWL, MFA_SIGNAL_WRONG"
      - name: evidence_note
        type: string
        source: input
        description: "Publisher narrative supporting the current round"
        constraints: "1-1000 chars, non-blank"
      - name: appeal_state
        type: enum
        source: system
        description: "Appeal lifecycle position; MORE_EVIDENCE_REQUIRED loops back to FILED"
        default: FILED
        constraints: "one of FILED, MORE_EVIDENCE_REQUIRED, UPHELD, OVERTURNED"
      - name: round_no
        type: integer
        source: system
        description: "Evidence round counter; starts at 1 and increments each time the publisher supplies further evidence"
        default: 1
        constraints: "1 <= round_no <= APPEAL_MAX_ROUNDS (3)"
      - name: revised_tier
        type: enum
        source: input
        description: "Tier the appeal awards the page; required when outcome is OVERTURNED"
        default: null
        constraints: "one of FLOOR, HIGH_RISK, MEDIUM_RISK, LOW_RISK, SAFE"
      - name: decision_note
        type: string
        source: input
        description: "DisputeOfficer narrative recorded at each decision"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DisputeOfficer that recorded the terminal decision"
        default: null
      - name: remedy_classification_id
        type: string
        source: computed
        description: "FK -> PageClassification.id; the APPEAL_REMEDY record minted when this appeal was OVERTURNED"
        default: null

  - name: MeasurementBatch
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the buying side of the measured delivery"
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; the supply side; must equal the owning publisher of page_id"
      - name: page_id
        type: string
        source: input
        description: "FK -> Page.id; the measured page"
      - name: methodology_version_id
        type: string
        source: input
        description: "FK -> MethodologyVersion.id; VIEWABILITY-family version pinned for scoring and certification"
      - name: format
        type: enum
        source: input
        description: "Creative format of the delivery; must equal the campaign's format"
        constraints: "one of DISPLAY, LARGE_DISPLAY, VIDEO"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the measured delivery window (ISO 8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the measured delivery window (ISO 8601 UTC); closed interval with a BATCH_WINDOW_BUFFER_SECONDS separation requirement"
        constraints: "must be strictly greater than window_start and not in the future relative to the logical clock"
      - name: measured_impressions
        type: integer
        source: input
        description: "Impressions the tag observed in the window"
        constraints: "> 0"
      - name: measurable_impressions
        type: integer
        source: input
        description: "Subset of measured impressions for which viewability could be determined"
        constraints: "0 <= measurable_impressions <= measured_impressions"
      - name: in_view_impressions
        type: integer
        source: input
        description: "Sensor-reported impressions that met the in-view criteria"
        constraints: "0 <= in_view_impressions <= measurable_impressions"
      - name: avg_in_view_seconds
        type: number
        source: input
        description: "Average continuous in-view duration of the in-view impressions"
        constraints: ">= 0"
      - name: avg_in_view_pixel_pct
        type: number
        source: input
        description: "Average in-view pixel share of the in-view impressions"
        constraints: "0.0 <= x <= 1.0"
      - name: qualified_in_view_impressions
        type: integer
        source: computed
        description: "in_view_impressions when the batch clears both format thresholds, otherwise 0"
        default: 0
      - name: non_viewable_impressions
        type: integer
        source: computed
        description: "measurable_impressions - qualified_in_view_impressions"
        default: 0
      - name: unmeasurable_impressions
        type: integer
        source: computed
        description: "measured_impressions - measurable_impressions"
        default: 0
      - name: coverage_rate
        type: number
        source: computed
        description: "measurable_impressions / measured_impressions, 4 decimals half-up"
        default: null
      - name: viewability_rate
        type: number
        source: computed
        description: "qualified_in_view_impressions / measurable_impressions, 4 decimals half-up; 0.0 when measurable_impressions is 0"
        default: null
      - name: ivt_impressions
        type: integer
        source: computed
        description: "Deduplicated invalid-traffic impressions from CONFIRMED IvtFindings"
        default: 0
      - name: ivt_rate
        type: number
        source: computed
        description: "ivt_impressions / measured_impressions, 4 decimals half-up"
        default: 0.0
      - name: sophistication_flag
        type: boolean
        source: computed
        description: "True when at least one CONFIRMED IvtFinding belongs to the SIVT family; forces quarantine at certification"
        default: false
      - name: net_billable_impressions
        type: integer
        source: computed
        description: "measured_impressions - ivt_impressions; the impression half of INVARIANT_IMPRESSION_CONSERVATION"
        default: 0
      - name: assessed_tier
        type: enum
        source: computed
        description: "Post-bid page-level suitability tier captured at scoring time"
        default: null
        constraints: "one of FLOOR, HIGH_RISK, MEDIUM_RISK, LOW_RISK, SAFE, UNRATED"
      - name: suitability_breach_flag
        type: boolean
        source: computed
        description: "True when TIER_RANK[assessed_tier] < TIER_RANK[campaign.min_suitability_tier], or assessed_tier is UNRATED"
        default: false
      - name: scoring_status
        type: enum
        source: system
        description: "Measurement dimension of the batch's parallel state"
        default: INGESTED
        constraints: "one of INGESTED, SCORED, CERTIFIED, QUARANTINED, DECERTIFIED"
      - name: settlement_status
        type: enum
        source: system
        description: "Money dimension of the batch's parallel state, independent of scoring_status"
        default: UNBILLED
        constraints: "one of UNBILLED, CLAIMED, CREDITED, CLOSED_NO_CREDIT"
      - name: scored_at
        type: datetime
        source: system
        description: "Logical clock reading when the batch was scored"
        default: null

  - name: IvtFinding
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> MeasurementBatch.id; the batch the detector flagged"
      - name: ivt_class
        type: enum
        source: input
        description: "Detection class; GENERAL_BOT and DATACENTER belong to the GIVT family, the SIVT_* classes to the SIVT family"
        constraints: "one of GENERAL_BOT, DATACENTER, SIVT_HIJACKED_DEVICE, SIVT_AD_FARM, SIVT_INCENTIVIZED"
      - name: ivt_family
        type: enum
        source: computed
        description: "GIVT for GENERAL_BOT and DATACENTER, SIVT for the SIVT_* classes; the dedup grouping key"
        constraints: "one of GIVT, SIVT"
      - name: flagged_impressions
        type: integer
        source: input
        description: "Impressions this detector attributes to the class"
        constraints: "> 0 and <= batch.measured_impressions"
      - name: confidence
        type: number
        source: input
        description: "Detector confidence; below IVT_CONFIRM_CONFIDENCE_FLOOR (0.75) the finding may not be confirmed"
        constraints: "0.0 <= x <= 1.0"
      - name: detector_note
        type: string
        source: input
        description: "Detector narrative"
        default: null
      - name: status
        type: enum
        source: system
        description: "Finding lifecycle; only CONFIRMED findings enter ivt_impressions"
        default: PROPOSED
        constraints: "one of PROPOSED, CONFIRMED, RETRACTED"
      - name: retract_reason
        type: string
        source: input
        description: "Reason recorded when the finding is retracted"
        default: null

  - name: RefundClaim
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the claiming campaign; also the OCC parent of claim creation"
      - name: publisher_id
        type: string
        source: input
        description: "FK -> Publisher.id; the publisher charged back"
      - name: batch_ids
        type: array
        source: input
        description: "FK -> MeasurementBatch.id; array of cited batch ids, at least one, all sharing campaign_id and publisher_id"
        constraints: "1-20 entries, no duplicates"
      - name: claim_state
        type: enum
        source: system
        description: "Adjudication position of the claim"
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, REVERSED"
      - name: claimed_impressions
        type: integer
        source: computed
        description: "Provisional impression basis under variant gross_impression_basis, recomputed while claim_state is SUBMITTED or UNDER_REVIEW"
        default: 0
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "Provisional credit under the gross basis, per-batch rounded then summed"
        default: 0
      - name: credited_impressions
        type: integer
        source: computed
        description: "Final impression basis under variant net_measured_basis, frozen at approval"
        default: null
      - name: gross_credit_cents
        type: integer
        source: computed
        description: "Final credit before the administration fee, per-batch rounded then summed"
        default: null
      - name: admin_fee_rate
        type: number
        source: computed
        description: "Fee rate selected from gross_credit_cents, never from net_credit_cents"
        default: null
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "round_half_up(gross_credit_cents * admin_fee_rate)"
        default: null
      - name: net_credit_cents
        type: integer
        source: computed
        description: "gross_credit_cents - admin_fee_cents; the amount posted to both ledgers"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DisputeOfficer that approved or rejected the claim"
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Adjudicator narrative"
        default: null
      - name: reject_reason_code
        type: enum
        source: input
        description: "Structured rejection ground; APPEAL_OVERTURNED is written only by the system cascade"
        default: null
        constraints: "one of EVIDENCE_INSUFFICIENT, BATCH_RESCORED, DUPLICATE_CLAIM, APPEAL_OVERTURNED"
      - name: reversal_reason
        type: string
        source: input
        description: "Reason recorded when an approved claim is reversed"
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Publisher
    state_field: publisher_status
    initial_state: ACTIVE
    terminal_states: [DELISTED]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system: threshold breach evaluated at the end of POST /measurement-batches/{id}/certify (quarantined_batch_count reaches PUBLISHER_QUARANTINE_LIMIT) or POST /page-classifications (mfa_page_count reaches PUBLISHER_MFA_LIMIT)"
        actor: system
        preconditions:
          - "publisher_status == ACTIVE"
          - "quarantined_batch_count >= 3 OR mfa_page_count >= 3 after the triggering counter increment"
        side_effects:
          - "sets Publisher.status_reason to QUARANTINE_THRESHOLD when quarantined_batch_count >= 3, otherwise MFA_THRESHOLD"
          - "cascade hop 2->3: because publisher_status became RESTRICTED, every InventoryList in status PUBLISHED that owns a ListEntry with action ALLOW, entry_type PUBLISHER and entry_value == this Publisher.id transitions PUBLISHED -> STALE with stale_reason RESTRICTED_PUBLISHER_ENTRY"
          - "cascade hop 3->4: because those lists became STALE, every PreBidSegment in sync_status SYNCED whose inclusion_list_id or exclusion_list_id names one of them transitions SYNCED -> STALE with stale_reason LIST_STALE"
          - "increments Publisher.version by 1"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /publishers/{id}/status with new_status ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "publisher_status == RESTRICTED"
          - "quarantined_batch_count < 3 AND mfa_page_count < 3 at the moment of reinstatement, otherwise ERR_RESTRICTION_STILL_JUSTIFIED"
        side_effects:
          - "sets Publisher.status_reason to ADMIN_REINSTATEMENT"
          - "STALE InventoryLists are NOT auto-republished; the advertiser must call POST /inventory-lists/{id}/publish again"
          - "increments Publisher.version by 1"
      - from: ACTIVE
        to: DELISTED
        trigger: "POST /publishers/{id}/status with new_status DELISTED"
        actor: PlatformAdmin
        preconditions:
          - "publisher_status == ACTIVE"
        side_effects:
          - "sets Publisher.status_reason to ADMIN_ACTION"
          - "increments Publisher.version by 1"
      - from: RESTRICTED
        to: DELISTED
        trigger: "POST /publishers/{id}/status with new_status DELISTED"
        actor: PlatformAdmin
        preconditions:
          - "publisher_status == RESTRICTED"
        side_effects:
          - "sets Publisher.status_reason to ADMIN_ACTION"
          - "increments Publisher.version by 1"
        note: "DELISTED is terminal; POST /publishers/{id}/status against a DELISTED publisher returns ERR_PUBLISHER_DELISTED"

  - entity: MethodologyVersion
    state_field: accreditation_status
    initial_state: PROVISIONAL
    terminal_states: [SUSPENDED, LAPSED]
    transitions:
      - from: PROVISIONAL
        to: ACCREDITED
        trigger: "POST /methodology-versions/{id}/audit-conclusion with outcome PASSED"
        actor: AccreditationAuditor
        preconditions:
          - "accreditation_status == PROVISIONAL"
          - "X-User-ID != MethodologyVersion.authored_by_user_id (segregation of duties)"
          - "audit_finding_rate <= AUDIT_MAX_FINDING_RATE (0.05)"
        side_effects:
          - "records audit_outcome PASSED, lead_auditor_user_id, audit_finding_rate"
          - "increments MethodologyVersion.version by 1"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /methodology-versions/{id}/audit-conclusion with outcome DEFICIENT"
        actor: AccreditationAuditor
        preconditions:
          - "accreditation_status == PROVISIONAL"
          - "X-User-ID != MethodologyVersion.authored_by_user_id (segregation of duties)"
          - "deficiency_note is present and non-blank"
        side_effects:
          - "records audit_outcome DEFICIENT, lead_auditor_user_id, audit_finding_rate, deficiency_note"
          - "cascade hop 1->2: because the version became SUSPENDED, every MeasurementBatch pinning it whose scoring_status is CERTIFIED transitions CERTIFIED -> DECERTIFIED and MethodologyVersion.decertified_batch_count is set to the number of batches moved"
          - "cascade hop 2->3: because those batches left CERTIFIED, each affected Campaign's certified_measured_impressions and certified_measurable_impressions are reduced by the decertified batch figures and coverage_status is recomputed"
          - "cascade hop 3->4: because coverage_status became BELOW_TARGET, the Campaign transitions ACTIVE -> UNDER_REMEDIATION, and because the campaign entered UNDER_REMEDIATION every PreBidSegment of that campaign in sync_status SYNCED transitions SYNCED -> STALE with stale_reason CAMPAIGN_UNDER_REMEDIATION"
          - "increments MethodologyVersion.version by 1"
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /methodology-versions/{id}/audit-conclusion with outcome DEFICIENT"
        actor: AccreditationAuditor
        preconditions:
          - "accreditation_status == ACCREDITED"
          - "X-User-ID != MethodologyVersion.authored_by_user_id (segregation of duties)"
          - "deficiency_note is present and non-blank"
        side_effects:
          - "identical cascade to the PROVISIONAL -> SUSPENDED transition (decertify batches, reduce campaign counters, remediate campaign, stale its segments)"
          - "increments MethodologyVersion.version by 1"
      - from: PROVISIONAL
        to: LAPSED
        trigger: "system: evaluated as the first step of POST /measurement-batches/{id}/score, POST /measurement-batches/{id}/certify and POST /page-classifications whenever the pinned version's effective window has closed"
        actor: system
        preconditions:
          - "logical clock >= MethodologyVersion.effective_to"
          - "accreditation_status == PROVISIONAL"
        side_effects:
          - "the triggering request is then rejected with ERR_METHODOLOGY_LAPSED"
          - "increments MethodologyVersion.version by 1"
      - from: ACCREDITED
        to: LAPSED
        trigger: "system: evaluated as the first step of POST /measurement-batches/{id}/score, POST /measurement-batches/{id}/certify and POST /page-classifications whenever the pinned version's effective window has closed"
        actor: system
        preconditions:
          - "logical clock >= MethodologyVersion.effective_to"
          - "accreditation_status == ACCREDITED"
        side_effects:
          - "the triggering request is then rejected with ERR_METHODOLOGY_LAPSED"
          - "increments MethodologyVersion.version by 1"

  - entity: InventoryList
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /inventory-lists/{id}/publish"
        actor: Advertiser
        preconditions:
          - "status == DRAFT"
          - "entry_count >= 1, otherwise ERR_EMPTY_LIST"
          - "no ListEntry of this list has action ALLOW, entry_type PUBLISHER and an entry_value naming a Publisher whose publisher_status is RESTRICTED or DELISTED, otherwise ERR_LIST_CONTAINS_RESTRICTED_PUBLISHER"
        side_effects:
          - "sets published_version to the list's current version and published_at to the logical clock"
          - "clears stale_reason"
          - "increments InventoryList.version by 1"
      - from: PUBLISHED
        to: STALE
        trigger: "system: a Publisher named by an ALLOW/PUBLISHER entry of this list transitions ACTIVE -> RESTRICTED (hop 2->3 of the quarantine cascade)"
        actor: system
        preconditions:
          - "status == PUBLISHED"
          - "the list owns a ListEntry with action ALLOW, entry_type PUBLISHER and entry_value == the restricted Publisher.id"
        side_effects:
          - "sets stale_reason to RESTRICTED_PUBLISHER_ENTRY"
          - "hop 3->4: every PreBidSegment in sync_status SYNCED referencing this list transitions SYNCED -> STALE"
          - "increments InventoryList.version by 1"
      - from: STALE
        to: PUBLISHED
        trigger: "POST /inventory-lists/{id}/publish"
        actor: Advertiser
        preconditions:
          - "status == STALE"
          - "no ListEntry of this list has action ALLOW, entry_type PUBLISHER and an entry_value naming a Publisher whose publisher_status is RESTRICTED or DELISTED, otherwise ERR_LIST_CONTAINS_RESTRICTED_PUBLISHER"
        side_effects:
          - "sets published_version to the list's current version and published_at to the logical clock"
          - "clears stale_reason"
          - "increments InventoryList.version by 1"
        note: "STALE -> PUBLISHED -> STALE is the list's revision cycle; PreBidSegments must be re-synced afterwards to pick up the new published_version"

  - entity: PreBidSegment
    state_field: sync_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: SYNCED
        trigger: "POST /pre-bid-segments/{id}/sync"
        actor: Advertiser
        preconditions:
          - "sync_status == PENDING"
          - "every referenced InventoryList (inclusion_list_id, exclusion_list_id) has status == PUBLISHED, otherwise ERR_LIST_NOT_PUBLISHED"
          - "Campaign.status == ACTIVE, otherwise ERR_CAMPAIGN_UNDER_REMEDIATION"
        side_effects:
          - "sets synced_inclusion_version and synced_exclusion_version to the corresponding InventoryList.published_version values (null when the list reference is null)"
          - "sets synced_at to the logical clock and clears stale_reason"
          - "increments PreBidSegment.version by 1"
      - from: SYNCED
        to: STALE
        trigger: "system: a referenced InventoryList transitions PUBLISHED -> STALE, or the owning Campaign transitions ACTIVE -> UNDER_REMEDIATION"
        actor: system
        preconditions:
          - "sync_status == SYNCED"
        side_effects:
          - "sets stale_reason to LIST_STALE or CAMPAIGN_UNDER_REMEDIATION according to the causing hop"
          - "GET /pages/{id}/pre-bid-decision against this segment now returns ERR_SEGMENT_NOT_SYNCED"
          - "increments PreBidSegment.version by 1"
      - from: STALE
        to: SYNCED
        trigger: "POST /pre-bid-segments/{id}/sync"
        actor: Advertiser
        preconditions:
          - "sync_status == STALE"
          - "every referenced InventoryList has status == PUBLISHED, otherwise ERR_LIST_NOT_PUBLISHED"
          - "Campaign.status == ACTIVE, otherwise ERR_CAMPAIGN_UNDER_REMEDIATION"
        side_effects:
          - "refreshes synced_inclusion_version / synced_exclusion_version to the current published_version values"
          - "sets synced_at to the logical clock and clears stale_reason"
          - "increments PreBidSegment.version by 1"

  - entity: Page
    state_field: classification_state
    initial_state: UNCLASSIFIED
    terminal_states: []
    transitions:
      - from: UNCLASSIFIED
        to: MODEL_CLASSIFIED
        trigger: "POST /page-classifications with classifier_kind MODEL or HUMAN"
        actor: ClassificationAnalyst
        preconditions:
          - "classification_state == UNCLASSIFIED"
          - "expected_page_version == Page.version (OCC)"
          - "the pinned MethodologyVersion has standard_family SUITABILITY and accreditation_status in {PROVISIONAL, ACCREDITED}"
        side_effects:
          - "sets current_classification_id, current_tier, latest_category_codes, mfa_score and mfa_flag from the new PageClassification"
          - "when the new classification's mfa_flag is true, increments Publisher.mfa_page_count by 1, which may trigger Publisher ACTIVE -> RESTRICTED"
          - "increments Page.version by 1"
      - from: MODEL_CLASSIFIED
        to: HUMAN_CONFIRMED
        trigger: "POST /page-classifications/{id}/review with decision CONFIRM or OVERRIDE"
        actor: ClassificationAnalyst
        preconditions:
          - "classification_state == MODEL_CLASSIFIED"
          - "the reviewed PageClassification.id == Page.current_classification_id"
          - "the reviewed PageClassification.review_state == PENDING_REVIEW"
        side_effects:
          - "sets the classification review_state to CONFIRMED (decision CONFIRM) or OVERRIDDEN (decision OVERRIDE) and stamps reviewed_by_user_id"
          - "on OVERRIDE, recomputes base_risk_points, adjusted_risk_points and assigned_tier from revised_category_codes and republishes Page.current_tier and Page.latest_category_codes"
          - "increments Page.version by 1"
      - from: HUMAN_CONFIRMED
        to: APPEALED
        trigger: "POST /appeals"
        actor: Publisher
        preconditions:
          - "classification_state == HUMAN_CONFIRMED"
          - "the appealed PageClassification.id == Page.current_classification_id"
        side_effects:
          - "increments Page.appeal_count by 1"
          - "further POST /page-classifications against this page are rejected with ERR_INVALID_PAGE_STATE until the appeal reaches a terminal state"
          - "increments Page.version by 1"
      - from: APPEALED
        to: HUMAN_CONFIRMED
        trigger: "POST /appeals/{id}/decide with outcome UPHELD"
        actor: DisputeOfficer
        preconditions:
          - "classification_state == APPEALED"
          - "Appeal.appeal_state == FILED"
        side_effects:
          - "leaves current_classification_id, current_tier and latest_category_codes unchanged"
          - "increments Publisher.decided_appeal_count by 1"
          - "increments Page.version by 1"
      - from: APPEALED
        to: RECLASSIFIED
        trigger: "POST /appeals/{id}/decide with outcome OVERTURNED"
        actor: DisputeOfficer
        preconditions:
          - "classification_state == APPEALED"
          - "Appeal.appeal_state == FILED"
          - "revised_tier is present"
        side_effects:
          - "cascade hop 1->2: because the appeal was overturned, the disputed PageClassification review_state becomes VACATED and a system PageClassification with classifier_kind APPEAL_REMEDY, assigned_tier == revised_tier and review_state CONFIRMED is appended; Page.current_classification_id and Page.current_tier are repointed to it"
          - "cascade hop 2->3: because Page.current_tier changed, every MeasurementBatch of this page whose settlement_status is CLAIMED has assessed_tier and suitability_breach_flag recomputed against the revised tier"
          - "cascade hop 3->4: because those batches' suitability_breach_flag changed, every RefundClaim citing them whose claim_state is SUBMITTED or UNDER_REVIEW recomputes claimed_impressions and provisional_credit_cents; a claim whose claimed_impressions becomes 0 transitions to REJECTED with reject_reason_code APPEAL_OVERTURNED"
          - "increments Publisher.decided_appeal_count and Publisher.overturned_appeal_count by 1"
          - "increments Page.version by 1"
      - from: RECLASSIFIED
        to: MODEL_CLASSIFIED
        trigger: "POST /page-classifications with classifier_kind MODEL or HUMAN"
        actor: ClassificationAnalyst
        preconditions:
          - "classification_state == RECLASSIFIED"
          - "expected_page_version == Page.version (OCC)"
        side_effects:
          - "sets the prior effective PageClassification review_state to SUPERSEDED"
          - "repoints current_classification_id, current_tier, latest_category_codes, mfa_score, mfa_flag to the new record"
          - "when mfa_flag flips false -> true, increments Publisher.mfa_page_count by 1; when it flips true -> false, decrements it by 1"
          - "increments Page.version by 1"
        note: "RECLASSIFIED -> MODEL_CLASSIFIED -> HUMAN_CONFIRMED -> APPEALED is the page's revision cycle; a page may be appealed repeatedly across cycles"
      - from: MODEL_CLASSIFIED
        to: MODEL_CLASSIFIED
        trigger: "POST /page-classifications with classifier_kind MODEL or HUMAN"
        actor: ClassificationAnalyst
        preconditions:
          - "classification_state == MODEL_CLASSIFIED"
          - "expected_page_version == Page.version (OCC)"
        side_effects:
          - "sets the prior PENDING_REVIEW classification's review_state to SUPERSEDED (create-with-supersede)"
          - "repoints current_classification_id, current_tier, latest_category_codes, mfa_score, mfa_flag to the new record"
          - "increments Page.version by 1"
      - from: HUMAN_CONFIRMED
        to: MODEL_CLASSIFIED
        trigger: "POST /page-classifications with classifier_kind MODEL or HUMAN"
        actor: ClassificationAnalyst
        preconditions:
          - "classification_state == HUMAN_CONFIRMED"
          - "expected_page_version == Page.version (OCC)"
        side_effects:
          - "sets the prior CONFIRMED or OVERRIDDEN classification's review_state to SUPERSEDED"
          - "repoints current_classification_id, current_tier, latest_category_codes, mfa_score, mfa_flag to the new record"
          - "increments Page.version by 1"

  - entity: PageClassification
    state_field: review_state
    initial_state: PENDING_REVIEW
    terminal_states: [SUPERSEDED, VACATED]
    transitions:
      - from: PENDING_REVIEW
        to: CONFIRMED
        trigger: "POST /page-classifications/{id}/review with decision CONFIRM"
        actor: ClassificationAnalyst
        preconditions:
          - "review_state == PENDING_REVIEW"
          - "this record is Page.current_classification_id"
        side_effects:
          - "stamps reviewed_by_user_id with X-User-ID and stores review_note"
          - "drives Page MODEL_CLASSIFIED -> HUMAN_CONFIRMED"
          - "increments PageClassification.version by 1"
      - from: PENDING_REVIEW
        to: OVERRIDDEN
        trigger: "POST /page-classifications/{id}/review with decision OVERRIDE"
        actor: ClassificationAnalyst
        preconditions:
          - "review_state == PENDING_REVIEW"
          - "this record is Page.current_classification_id"
          - "revised_category_codes is present and differs from category_codes"
        side_effects:
          - "replaces category_codes with revised_category_codes and recomputes base_risk_points, adjusted_risk_points and assigned_tier with classifier_kind treated as HUMAN (no confidence inflation)"
          - "stamps reviewed_by_user_id with X-User-ID"
          - "drives Page MODEL_CLASSIFIED -> HUMAN_CONFIRMED and republishes Page.current_tier"
          - "increments PageClassification.version by 1"
      - from: PENDING_REVIEW
        to: SUPERSEDED
        trigger: "POST /page-classifications creating a newer record for the same page"
        actor: ClassificationAnalyst
        preconditions:
          - "review_state == PENDING_REVIEW"
        side_effects:
          - "the newer record becomes Page.current_classification_id"
          - "increments PageClassification.version by 1"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "POST /page-classifications creating a newer record for the same page"
        actor: ClassificationAnalyst
        preconditions:
          - "review_state == CONFIRMED"
          - "the page has no Appeal in appeal_state FILED or MORE_EVIDENCE_REQUIRED"
        side_effects:
          - "the newer record becomes Page.current_classification_id"
          - "increments PageClassification.version by 1"
      - from: OVERRIDDEN
        to: SUPERSEDED
        trigger: "POST /page-classifications creating a newer record for the same page"
        actor: ClassificationAnalyst
        preconditions:
          - "review_state == OVERRIDDEN"
          - "the page has no Appeal in appeal_state FILED or MORE_EVIDENCE_REQUIRED"
        side_effects:
          - "the newer record becomes Page.current_classification_id"
          - "increments PageClassification.version by 1"
      - from: CONFIRMED
        to: VACATED
        trigger: "POST /appeals/{id}/decide with outcome OVERTURNED"
        actor: DisputeOfficer
        preconditions:
          - "review_state == CONFIRMED"
          - "an Appeal on this record is in appeal_state FILED"
        side_effects:
          - "an APPEAL_REMEDY PageClassification is appended and becomes Page.current_classification_id"
          - "increments PageClassification.version by 1"
      - from: OVERRIDDEN
        to: VACATED
        trigger: "POST /appeals/{id}/decide with outcome OVERTURNED"
        actor: DisputeOfficer
        preconditions:
          - "review_state == OVERRIDDEN"
          - "an Appeal on this record is in appeal_state FILED"
        side_effects:
          - "an APPEAL_REMEDY PageClassification is appended and becomes Page.current_classification_id"
          - "increments PageClassification.version by 1"

  - entity: Appeal
    state_field: appeal_state
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: FILED
        to: MORE_EVIDENCE_REQUIRED
        trigger: "POST /appeals/{id}/decide with outcome MORE_EVIDENCE"
        actor: DisputeOfficer
        preconditions:
          - "appeal_state == FILED"
          - "round_no < APPEAL_MAX_ROUNDS (3), otherwise ERR_APPEAL_ROUNDS_EXHAUSTED"
          - "X-User-ID != the disputed PageClassification.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "stores decision_note; leaves Page.classification_state at APPEALED"
          - "increments Appeal.version by 1"
      - from: MORE_EVIDENCE_REQUIRED
        to: FILED
        trigger: "POST /appeals/{id}/evidence"
        actor: Publisher
        preconditions:
          - "appeal_state == MORE_EVIDENCE_REQUIRED"
          - "X-User-ID == the Publisher that owns the appealed page"
          - "round_no < APPEAL_MAX_ROUNDS (3), otherwise ERR_APPEAL_ROUNDS_EXHAUSTED"
        side_effects:
          - "increments round_no by 1 and replaces evidence_note"
          - "increments Appeal.version by 1"
        note: "FILED -> MORE_EVIDENCE_REQUIRED -> FILED is the negotiation cycle, bounded at 3 rounds"
      - from: FILED
        to: UPHELD
        trigger: "POST /appeals/{id}/decide with outcome UPHELD"
        actor: DisputeOfficer
        preconditions:
          - "appeal_state == FILED"
          - "X-User-ID != the disputed PageClassification.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "stamps decided_by_user_id and decision_note"
          - "drives Page APPEALED -> HUMAN_CONFIRMED with no tier change"
          - "increments Publisher.decided_appeal_count by 1"
          - "increments Appeal.version by 1"
      - from: FILED
        to: OVERTURNED
        trigger: "POST /appeals/{id}/decide with outcome OVERTURNED"
        actor: DisputeOfficer
        preconditions:
          - "appeal_state == FILED"
          - "revised_tier is present, otherwise ERR_REVISED_TIER_REQUIRED"
          - "X-User-ID != the disputed PageClassification.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "stamps decided_by_user_id, decision_note, revised_tier and remedy_classification_id"
          - "drives the four-hop overturn cascade documented on Page APPEALED -> RECLASSIFIED"
          - "increments Publisher.decided_appeal_count and Publisher.overturned_appeal_count by 1"
          - "increments Appeal.version by 1"

  - entity: MeasurementBatch
    state_field: scoring_status
    initial_state: INGESTED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: INGESTED
        to: SCORED
        trigger: "POST /measurement-batches/{id}/score"
        actor: MeasurementOperator
        preconditions:
          - "scoring_status == INGESTED"
          - "the pinned MethodologyVersion accreditation_status is PROVISIONAL or ACCREDITED after the lapse evaluation, otherwise ERR_METHODOLOGY_LAPSED"
          - "Page.classification_state != UNCLASSIFIED is NOT required; an unclassified page yields assessed_tier UNRATED"
        side_effects:
          - "computes qualified_in_view_impressions, non_viewable_impressions, unmeasurable_impressions, coverage_rate, viewability_rate per calculation viewability_and_coverage"
          - "computes ivt_impressions, ivt_rate, sophistication_flag, net_billable_impressions per calculation ivt_dedup_rate"
          - "captures assessed_tier via calculation page_suitability_tier variant post_bid_page_level and sets suitability_breach_flag"
          - "sets scored_at to the logical clock"
          - "increments MeasurementBatch.version by 1"
      - from: SCORED
        to: CERTIFIED
        trigger: "POST /measurement-batches/{id}/certify"
        actor: MeasurementOperator
        preconditions:
          - "scoring_status == SCORED"
          - "the pinned MethodologyVersion accreditation_status is PROVISIONAL or ACCREDITED, otherwise ERR_METHODOLOGY_NOT_ACCREDITED"
          - "coverage_rate >= MethodologyVersion.coverage_rate_floor"
          - "ivt_rate <= MethodologyVersion.ivt_rate_ceiling"
          - "sophistication_flag == false"
          - "suitability_breach_flag == false"
        side_effects:
          - "increments Publisher.certified_batch_count by 1"
          - "adds measured_impressions and measurable_impressions to Campaign.certified_measured_impressions / certified_measurable_impressions and recomputes Campaign.coverage_status"
          - "increments MeasurementBatch.version by 1"
        note: "certify is a branching transition: the same trigger lands in CERTIFIED or QUARANTINED depending on the scored figures, with disjoint side-effect sets"
      - from: SCORED
        to: QUARANTINED
        trigger: "POST /measurement-batches/{id}/certify"
        actor: MeasurementOperator
        preconditions:
          - "scoring_status == SCORED"
          - "the pinned MethodologyVersion accreditation_status is PROVISIONAL or ACCREDITED, otherwise ERR_METHODOLOGY_NOT_ACCREDITED"
          - "coverage_rate < MethodologyVersion.coverage_rate_floor OR ivt_rate > MethodologyVersion.ivt_rate_ceiling OR sophistication_flag == true OR suitability_breach_flag == true"
        side_effects:
          - "cascade hop 1->2: increments Publisher.quarantined_batch_count by 1"
          - "cascade hop 2->3: because quarantined_batch_count reached PUBLISHER_QUARANTINE_LIMIT (3), Publisher transitions ACTIVE -> RESTRICTED with status_reason QUARANTINE_THRESHOLD"
          - "cascade hop 3->4: because the publisher became RESTRICTED, PUBLISHED InventoryLists holding an ALLOW/PUBLISHER entry for it become STALE, and the PreBidSegments referencing those lists become STALE"
          - "leaves Campaign.certified_* counters untouched"
          - "the batch becomes claimable: settlement_status UNBILLED may now move to CLAIMED"
          - "increments MeasurementBatch.version by 1"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "system: the pinned MethodologyVersion transitions to SUSPENDED via POST /methodology-versions/{id}/audit-conclusion with outcome DEFICIENT"
        actor: system
        preconditions:
          - "scoring_status == CERTIFIED"
          - "the batch pins the suspended MethodologyVersion"
        side_effects:
          - "decrements Publisher.certified_batch_count by 1"
          - "removes measured_impressions / measurable_impressions from the Campaign certified counters and recomputes Campaign.coverage_status"
          - "the batch becomes claimable: settlement_status UNBILLED may now move to CLAIMED"
          - "increments MeasurementBatch.version by 1"

  - entity: MeasurementBatch
    state_field: settlement_status
    initial_state: UNBILLED
    terminal_states: [CLOSED_NO_CREDIT]
    transitions:
      - from: UNBILLED
        to: CLAIMED
        trigger: "POST /refund-claims citing this batch"
        actor: Advertiser
        preconditions:
          - "settlement_status == UNBILLED"
          - "scoring_status is QUARANTINED or DECERTIFIED, otherwise ERR_BATCH_NOT_CLAIMABLE"
        side_effects:
          - "increments Campaign.open_claim_count by 1 (once per claim, not per batch)"
          - "increments MeasurementBatch.version by 1"
        note: "settlement_status evolves independently of scoring_status: a CLAIMED batch may still be DECERTIFIED later, and a DECERTIFIED batch may still be CREDITED"
      - from: CLAIMED
        to: CREDITED
        trigger: "POST /refund-claims/{id}/approve"
        actor: DisputeOfficer
        preconditions:
          - "settlement_status == CLAIMED"
          - "the citing RefundClaim transitions UNDER_REVIEW -> APPROVED"
        side_effects:
          - "increments MeasurementBatch.version by 1"
      - from: CLAIMED
        to: CLOSED_NO_CREDIT
        trigger: "POST /refund-claims/{id}/reject"
        actor: DisputeOfficer
        preconditions:
          - "settlement_status == CLAIMED"
          - "the citing RefundClaim transitions UNDER_REVIEW -> REJECTED"
        side_effects:
          - "increments MeasurementBatch.version by 1"
        note: "CLOSED_NO_CREDIT is terminal for the money dimension; the batch can never be cited by another claim"
      - from: CREDITED
        to: UNBILLED
        trigger: "POST /refund-claims/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "settlement_status == CREDITED"
          - "the citing RefundClaim transitions APPROVED -> REVERSED"
        side_effects:
          - "the batch becomes citable again by a future claim"
          - "increments MeasurementBatch.version by 1"

  - entity: IvtFinding
    state_field: status
    initial_state: PROPOSED
    terminal_states: [RETRACTED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /ivt-findings/{id}/confirm"
        actor: MeasurementOperator
        preconditions:
          - "status == PROPOSED"
          - "confidence >= IVT_CONFIRM_CONFIDENCE_FLOOR (0.75), otherwise ERR_IVT_CONFIDENCE_TOO_LOW"
          - "the parent MeasurementBatch scoring_status is INGESTED or SCORED, otherwise ERR_BATCH_ALREADY_ADJUDICATED"
        side_effects:
          - "recomputes MeasurementBatch.ivt_impressions, ivt_rate, sophistication_flag and net_billable_impressions per calculation ivt_dedup_rate"
          - "increments MeasurementBatch.version by 1"
          - "increments IvtFinding.version by 1"
      - from: CONFIRMED
        to: RETRACTED
        trigger: "POST /ivt-findings/{id}/retract"
        actor: MeasurementOperator
        preconditions:
          - "status == CONFIRMED"
          - "the parent MeasurementBatch scoring_status is INGESTED or SCORED, otherwise ERR_BATCH_ALREADY_ADJUDICATED"
          - "retract_reason is present and non-blank"
        side_effects:
          - "recomputes MeasurementBatch.ivt_impressions, ivt_rate, sophistication_flag and net_billable_impressions over the remaining CONFIRMED findings, restoring INVARIANT_IMPRESSION_CONSERVATION"
          - "increments MeasurementBatch.version by 1"
          - "increments IvtFinding.version by 1"
      - from: PROPOSED
        to: RETRACTED
        trigger: "POST /ivt-findings/{id}/retract"
        actor: MeasurementOperator
        preconditions:
          - "status == PROPOSED"
          - "retract_reason is present and non-blank"
        side_effects:
          - "no batch counters change because a PROPOSED finding never entered ivt_impressions"
          - "increments IvtFinding.version by 1"

  - entity: RefundClaim
    state_field: claim_state
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]   # APPROVED is settled but not terminal: POST /refund-claims/{id}/reverse still applies
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /refund-claims/{id}/review"
        actor: DisputeOfficer
        preconditions:
          - "claim_state == SUBMITTED"
          - "no Page cited through batch_ids has an Appeal in appeal_state FILED or MORE_EVIDENCE_REQUIRED, otherwise ERR_APPEAL_PENDING"
        side_effects:
          - "recomputes claimed_impressions and provisional_credit_cents under variant gross_impression_basis"
          - "increments RefundClaim.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /refund-claims/{id}/approve"
        actor: DisputeOfficer
        preconditions:
          - "claim_state == UNDER_REVIEW"
          - "net_credit_cents computed under variant net_measured_basis is > 0, otherwise ERR_NO_CREDITABLE_IMPRESSIONS"
          - "Advertiser.credit_received_cents_total + net_credit_cents <= Advertiser.credit_cap_cents, otherwise ERR_CREDIT_CAP_EXCEEDED"
        side_effects:
          - "freezes credited_impressions, gross_credit_cents, admin_fee_rate, admin_fee_cents, net_credit_cents"
          - "adds net_credit_cents to Advertiser.credit_received_cents_total and to Publisher.credit_issued_cents_total, preserving INVARIANT_CREDIT_DOUBLE_ENTRY"
          - "increments Advertiser.settled_claim_count by 1"
          - "moves every cited MeasurementBatch settlement_status CLAIMED -> CREDITED"
          - "decrements Campaign.open_claim_count by 1"
          - "stamps decided_by_user_id and decision_note"
          - "increments RefundClaim.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /refund-claims/{id}/reject"
        actor: DisputeOfficer
        preconditions:
          - "claim_state == UNDER_REVIEW"
          - "reject_reason_code is one of EVIDENCE_INSUFFICIENT, BATCH_RESCORED, DUPLICATE_CLAIM"
        side_effects:
          - "moves every cited MeasurementBatch settlement_status CLAIMED -> CLOSED_NO_CREDIT"
          - "decrements Campaign.open_claim_count by 1"
          - "leaves both credit ledgers untouched"
          - "increments RefundClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: hop 3->4 of the appeal-overturn cascade drives claimed_impressions to 0"
        actor: system
        preconditions:
          - "claim_state == SUBMITTED"
          - "claimed_impressions recomputed to 0 after an Appeal on a cited page was OVERTURNED"
        side_effects:
          - "sets reject_reason_code to APPEAL_OVERTURNED"
          - "moves every cited MeasurementBatch settlement_status CLAIMED -> CLOSED_NO_CREDIT"
          - "decrements Campaign.open_claim_count by 1"
          - "increments RefundClaim.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system: hop 3->4 of the appeal-overturn cascade drives claimed_impressions to 0"
        actor: system
        preconditions:
          - "claim_state == UNDER_REVIEW"
          - "claimed_impressions recomputed to 0 after an Appeal on a cited page was OVERTURNED"
        side_effects:
          - "sets reject_reason_code to APPEAL_OVERTURNED"
          - "moves every cited MeasurementBatch settlement_status CLAIMED -> CLOSED_NO_CREDIT"
          - "decrements Campaign.open_claim_count by 1"
          - "increments RefundClaim.version by 1"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /refund-claims/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "claim_state == APPROVED"
          - "reversal_reason is present and non-blank"
        side_effects:
          - "subtracts net_credit_cents from Advertiser.credit_received_cents_total and from Publisher.credit_issued_cents_total, restoring INVARIANT_CREDIT_DOUBLE_ENTRY to its pre-approval value"
          - "decrements Advertiser.settled_claim_count by 1"
          - "moves every cited MeasurementBatch settlement_status CREDITED -> UNBILLED"
          - "leaves Campaign.open_claim_count unchanged (it was already decremented at approval)"
          - "retains credited_impressions, gross_credit_cents, admin_fee_rate, admin_fee_cents and net_credit_cents as the audit record of what was reversed"
          - "increments RefundClaim.version by 1"

  - entity: Campaign
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: UNDER_REMEDIATION
        trigger: "system: hop 3->4 of the methodology-suspension cascade recomputes coverage_status to BELOW_TARGET"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "coverage_status == BELOW_TARGET after the certified counters were reduced"
        side_effects:
          - "every PreBidSegment of this campaign in sync_status SYNCED transitions SYNCED -> STALE with stale_reason CAMPAIGN_UNDER_REMEDIATION"
          - "POST /pre-bid-segments/{id}/sync for this campaign is rejected with ERR_CAMPAIGN_UNDER_REMEDIATION until the campaign returns to ACTIVE"
          - "increments Campaign.version by 1"
      - from: UNDER_REMEDIATION
        to: ACTIVE
        trigger: "POST /measurement-batches/{id}/certify landing in CERTIFIED that lifts coverage_status back to ON_TARGET"
        actor: MeasurementOperator
        preconditions:
          - "status == UNDER_REMEDIATION"
          - "coverage_status == ON_TARGET after the new certified batch is folded into the counters"
        side_effects:
          - "clears the remediation state; STALE PreBidSegments are NOT auto-resynced and must be re-synced explicitly"
          - "increments Campaign.version by 1"
        note: "ACTIVE -> UNDER_REMEDIATION -> ACTIVE is the campaign's remediation cycle"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: classification-create-stale-page
    parent_entity: Page
    write_endpoint: "POST /page-classifications"
    occ_field: "expected_page_version"
    description: |
      Creating a PageClassification for a Page whose version has advanced since
      the client last observed it is rejected with a stale-version error. The
      new record legitimately supersedes the page's currently effective
      classification (review_state PENDING_REVIEW, CONFIRMED or OVERRIDDEN
      becomes SUPERSEDED), so the write cannot be resolved by a state
      precondition: a client holding an outdated view of the page would silently
      supersede a classification it never saw. The OCC check reduces that to a
      deterministic version comparison.
    error_id: ERR_STALE_PAGE_VERSION
    http_status: 412

  - rule_id: claim-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /refund-claims"
    occ_field: "expected_campaign_version"
    description: |
      Creating a RefundClaim against a Campaign whose version has advanced since
      the client last observed it is rejected with a stale-version error. Claim
      creation is legitimately repeatable on the same campaign (each claim cites
      a different set of batches and each one increments
      Campaign.open_claim_count), so a second creation observing identical
      campaign state would itself succeed under the product semantics; the guard
      exists because the advertiser's view of the campaign's open-claim exposure
      and certified counters must be current before another claim is stacked on
      it.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: mfa_score
    trigger: "POST /page-classifications (before assigned_tier is computed) and POST /page-classifications/{id}/review with decision OVERRIDE"
    algorithm: weighted_scoring
    formula: |
      # All four components are computed independently, each rounded to 2
      # decimals half-up, then summed and rounded once more to 2 decimals.
      density_points     = min(40.00, round_half_up(ad_density_ratio * 100 * MFA_DENSITY_WEIGHT, 2))
      refresh_points     = MFA_REFRESH_FAST_POINTS   if 0 < refresh_seconds <= 15
                         = MFA_REFRESH_MEDIUM_POINTS if 15 < refresh_seconds <= 30
                         = 0.00                      otherwise (including refresh_seconds == 0)
      sourced_points     = round_half_up(publisher.sourced_traffic_pct * MFA_SOURCED_MAX, 2)
      originality_points = round_half_up((100 - originality_score) * MFA_ORIGINALITY_WEIGHT, 2)
      mfa_score = round_half_up(density_points + refresh_points + sourced_points + originality_points, 2)
      mfa_flag  = (mfa_score >= MFA_FLAG_THRESHOLD)          # >= , not >
      # Evaluation order is pinned: mfa_score -> mfa_flag -> base_risk_points ->
      # adjusted_risk_points -> assigned_tier. mfa_flag of THIS record feeds the
      # MFA multiplier of page_suitability_tier below; it must never be read from
      # the page's previous classification.
    input_set: "The classification's own ad_density_ratio, refresh_seconds and originality_score, plus sourced_traffic_pct read from the Publisher that owns page_id at request time"
    constants:
      MFA_DENSITY_WEIGHT: 0.4
      MFA_REFRESH_FAST_POINTS: 25.00
      MFA_REFRESH_MEDIUM_POINTS: 12.00
      MFA_SOURCED_MAX: 20.00
      MFA_ORIGINALITY_WEIGHT: 0.15
      MFA_FLAG_THRESHOLD: 70.00
    precision: "2 decimal places, round_half_up, applied per component and once on the sum"

  - name: page_suitability_tier
    trigger: "POST /page-classifications and POST /page-classifications/{id}/review (variant post_bid_page_level is also read by POST /measurement-batches/{id}/score into assessed_tier; variant pre_bid_domain_rollup is read by GET /pages/{id}/pre-bid-decision)"
    algorithm: weighted_scoring
    formula: |
      base_risk_points = sum(CATEGORY_RISK_WEIGHTS[c] for c in category_codes)      # 0.00 when category_codes is []
      mfa_multiplier        = MFA_RISK_MULTIPLIER if mfa_flag == true else 1.0
      confidence_multiplier = CONFIDENCE_INFLATION
                              if (classifier_kind == "MODEL" and model_confidence < MODEL_CONFIDENCE_FLOOR)
                              else 1.0
      # Multiplier order is pinned (mfa first, confidence second) and rounding
      # happens ONCE, after both multipliers:
      adjusted_risk_points = round_half_up(base_risk_points * mfa_multiplier * confidence_multiplier, 2)
      assigned_tier = FLOOR       if adjusted_risk_points >= 100.00
                    = HIGH_RISK   if 40.00 <= adjusted_risk_points < 100.00
                    = MEDIUM_RISK if 15.00 <= adjusted_risk_points < 40.00
                    = LOW_RISK    if  5.00 <= adjusted_risk_points <  15.00
                    = SAFE        if adjusted_risk_points < 5.00
      # A HUMAN classification and an OVERRIDE review never apply
      # confidence_multiplier, regardless of the model_confidence value supplied.
    input_set: "category_codes, model_confidence and classifier_kind of the classification under evaluation, plus the mfa_flag the same request just computed"
    constants:
      CATEGORY_RISK_WEIGHTS:
        ADULT: 100
        TERRORISM: 100
        ILLEGAL_DRUGS: 100
        ARMS: 40
        CRIME_VIOLENCE: 40
        HATE_SPEECH: 40
        PIRACY: 40
        DEATH_INJURY: 15
        TOBACCO_ALCOHOL: 15
        GAMBLING: 15
        DEBATED_SOCIAL: 15
        NEWS_HARD: 5
        SPORTS_NEWS: 5
        GENERAL: 0
      TIER_RANK: { FLOOR: 0, HIGH_RISK: 1, MEDIUM_RISK: 2, LOW_RISK: 3, SAFE: 4 }
      MFA_RISK_MULTIPLIER: 1.5
      CONFIDENCE_INFLATION: 1.25
      MODEL_CONFIDENCE_FLOOR: 0.80
      ROLLUP_WINDOW_DAYS: 30
    precision: "adjusted_risk_points: 2 decimal places, round_half_up (single rounding after both multipliers)"
    variants:
      - name: post_bid_page_level
        when: "Post-bid monitoring: POST /measurement-batches/{id}/score writes assessed_tier, and Page.current_tier is republished on every classification write"
        difference: |
          Reads the tier of the page's OWN currently effective classification
          (Page.current_classification_id) whatever its classification_state is
          - MODEL_CLASSIFIED counts. assessed_tier = UNRATED only when the page
          is still UNCLASSIFIED.
      - name: pre_bid_domain_rollup
        when: "Pre-bid blocking: GET /pages/{id}/pre-bid-decision resolves the tier gate"
        difference: |
          Ignores the requested page's own classification unless it is
          human-attested, and instead rolls the publisher up: candidate set =
          Pages of page.publisher_id whose classification_state is one of
          HUMAN_CONFIRMED, APPEALED, RECLASSIFIED and whose current
          classification's created_at >= (logical clock - ROLLUP_WINDOW_DAYS);
          effective_tier = the candidate tier with the MINIMUM TIER_RANK (worst
          suitability wins). When the candidate set is empty the rollup yields
          UNRATED. A MODEL-only classification therefore never lifts a
          publisher out of UNRATED, and one bad human-confirmed sibling page
          drags every page of the publisher down - so the same page with the
          same data can be BLOCKED pre-bid at HIGH_RISK while post-bid records
          it as MEDIUM_RISK.

  - name: viewability_and_coverage
    trigger: "POST /measurement-batches/{id}/score"
    algorithm: threshold
    formula: |
      required_seconds = methodology.video_in_view_seconds   if format == "VIDEO"
                       = methodology.display_in_view_seconds otherwise (DISPLAY, LARGE_DISPLAY)
      required_pixel   = methodology.video_pixel_pct         if format == "VIDEO"
                       = methodology.large_display_pixel_pct if format == "LARGE_DISPLAY"
                       = methodology.display_pixel_pct       if format == "DISPLAY"
      # The sensor's in-view claim is accepted wholesale or rejected wholesale:
      qualified_in_view_impressions = in_view_impressions
                                      if (avg_in_view_seconds  >= required_seconds
                                          and avg_in_view_pixel_pct >= required_pixel)
                                      else 0
      unmeasurable_impressions = measured_impressions - measurable_impressions
      non_viewable_impressions = measurable_impressions - qualified_in_view_impressions
      coverage_rate    = round_half_up(measurable_impressions / measured_impressions, 4)
      viewability_rate = round_half_up(qualified_in_view_impressions / measurable_impressions, 4)
                         if measurable_impressions > 0 else 0.0000
      # INVARIANT_IMPRESSION_CONSERVATION (structural, always true):
      #   measured_impressions == qualified_in_view_impressions
      #                           + non_viewable_impressions
      #                           + unmeasurable_impressions
    input_set: "The batch's own submitted counters and the format thresholds of the pinned MethodologyVersion (whose accreditation_status must be PROVISIONAL or ACCREDITED at score time)"
    constants:
      FORMAT_SET: [DISPLAY, LARGE_DISPLAY, VIDEO]
    precision: "rates: 4 decimal places, round_half_up; impression counters: integers"

  - name: ivt_dedup_rate
    trigger: "POST /measurement-batches/{id}/score, POST /ivt-findings/{id}/confirm and POST /ivt-findings/{id}/retract"
    algorithm: aggregation
    formula: |
      # Detectors inside one family observe overlapping impression sets, so the
      # family contribution is the MAXIMUM, not the sum. Families are additive.
      givt_component = max(f.flagged_impressions
                           for f in IvtFindings where f.batch_id == batch.id
                             and f.status == "CONFIRMED" and f.ivt_family == "GIVT")
                       or 0 when that set is empty
      sivt_component = max(f.flagged_impressions
                           for f in IvtFindings where f.batch_id == batch.id
                             and f.status == "CONFIRMED" and f.ivt_family == "SIVT")
                       or 0 when that set is empty
      ivt_impressions = min(givt_component + sivt_component, measured_impressions)
      ivt_rate        = round_half_up(ivt_impressions / measured_impressions, 4)
      sophistication_flag      = (sivt_component > 0)
      net_billable_impressions = measured_impressions - ivt_impressions
      # INVARIANT_IMPRESSION_CONSERVATION (money-neutral half):
      #   net_billable_impressions + ivt_impressions == measured_impressions
      # must hold before a confirm, after a confirm and again after the matching
      # retract - the retract restores the pre-confirm value exactly.
    input_set: "IvtFindings of this batch with status == CONFIRMED only; PROPOSED and RETRACTED findings are excluded. Ties inside a family do not need a tie-break because the aggregate is the max VALUE, not a chosen row."
    constants:
      GIVT_CLASSES: [GENERAL_BOT, DATACENTER]
      SIVT_CLASSES: [SIVT_HIJACKED_DEVICE, SIVT_AD_FARM, SIVT_INCENTIVIZED]
      IVT_CONFIRM_CONFIDENCE_FLOOR: 0.75
    precision: "ivt_rate: 4 decimal places, round_half_up; counters: integers"

  - name: claim_impression_basis
    trigger: "POST /refund-claims (variant gross_impression_basis), POST /refund-claims/{id}/review (variant gross_impression_basis, recomputed), hop 3->4 of the appeal-overturn cascade (variant gross_impression_basis, recomputed), POST /refund-claims/{id}/approve (variant net_measured_basis, frozen)"
    algorithm: forward_looking
    formula: |
      # Per cited batch b (batch_ids, in ascending b.created_at order):
      defective(b) = (b.suitability_breach_flag == true)
                     or (b.ivt_impressions > 0)
                     or (b.coverage_rate < b.methodology.coverage_rate_floor)
                     or (b.sophistication_flag == true)
                     or (b.scoring_status == "DECERTIFIED")   # the measurement itself was repudiated

      # variant gross_impression_basis:
      claimed_impressions = sum(b.measured_impressions for b in cited batches where defective(b))

      # variant net_measured_basis:
      credited(b) = b.measured_impressions
                    if b.suitability_breach_flag == true
                    else min(b.measured_impressions,
                             b.ivt_impressions
                             + max(0, b.measurable_impressions - b.qualified_in_view_impressions))
      credited_impressions = sum(credited(b) for b in cited batches where defective(b))
    input_set: "Only the batches listed in RefundClaim.batch_ids, each of which had scoring_status QUARANTINED or DECERTIFIED and settlement_status UNBILLED at claim creation; batches that fail defective(b) at recompute time contribute 0"
    constants: {}
    precision: "integer impressions; no rounding at this stage"
    variants:
      - name: gross_impression_basis
        when: "Provisional stage: claim creation, claim review, and every cascade recompute while claim_state is SUBMITTED or UNDER_REVIEW"
        difference: |
          Credits the ENTIRE measured delivery of every defective batch, because
          at intake the advertiser disputes the whole placement. A batch that is
          defective only through invalid traffic still contributes all of its
          measured_impressions.
      - name: net_measured_basis
        when: "Final stage: claim approval only; the result is frozen into credited_impressions"
        difference: |
          Credits only the demonstrably defective subset unless the defect is a
          brand-suitability breach: unmeasurable impressions are never credited
          (non-measurement is not a delivery defect) and the invalid-traffic and
          non-viewable subsets are combined then capped at measured_impressions
          so an overlapping detector cannot inflate the credit above the
          delivery. For an IVT-plus-viewability batch the two variants therefore
          return different impression counts for identical stored data.

  - name: claim_gross_credit_cents
    trigger: "POST /refund-claims and POST /refund-claims/{id}/review (over variant gross_impression_basis, written to provisional_credit_cents); POST /refund-claims/{id}/approve (over variant net_measured_basis, written to gross_credit_cents)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each cited batch's money to whole cents
      # FIRST, then sum the rounded per-batch amounts.
      per_batch_cents(b) = round_half_up(basis_impressions(b) * campaign.cpm_cents / 1000)
      credit_cents       = sum(per_batch_cents(b) for b in cited batches where defective(b))
      # FORBIDDEN alternative that produces a different total:
      #   round_half_up(sum(basis_impressions(b)) * campaign.cpm_cents / 1000)
      # Worked divergence with cpm_cents = 875 and bases 1501 and 2503:
      #   per-batch: 1313 + 2190 = 3503  (pinned answer)
      #   sum-then-round: round_half_up(4004 * 875 / 1000) = 3504
      # Batches are summed in ascending created_at order; the order does not
      # change the total because each term is already an integer.
    input_set: "The same cited-batch set as claim_impression_basis, using that calculation's active variant for basis_impressions(b)"
    constants: {}
    precision: "whole cents, round_half_up, applied per cited batch before summation"

  - name: claim_net_credit_cents
    trigger: "POST /refund-claims/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and one-pass:
      #   1. gross_credit_cents  (from claim_gross_credit_cents over net_measured_basis)
      #   2. admin_fee_rate      (tier selected from GROSS, never from net)
      #   3. admin_fee_cents
      #   4. net_credit_cents
      admin_fee_rate = ADMIN_FEE_RATE_HIGH_VOLUME
                       if gross_credit_cents >= ADMIN_FEE_TIER_BREAK_CENTS
                       else ADMIN_FEE_RATE_STANDARD
      admin_fee_cents = round_half_up(gross_credit_cents * admin_fee_rate)
      net_credit_cents = gross_credit_cents - admin_fee_cents
      # The dependency only LOOKS circular. Keying the tier on the payable
      # amount would be ill-defined: gross 555000 with the 0.10 tier yields net
      # 499500, which sits under the break and would demand 0.15, yielding
      # 471750 - a second fixed point. The scaffold pins the tier to
      # gross_credit_cents, so 555000 -> rate 0.10 -> fee 55500 -> net 499500.
    input_set: "gross_credit_cents of this claim only"
    constants:
      ADMIN_FEE_TIER_BREAK_CENTS: 500000
      ADMIN_FEE_RATE_STANDARD: 0.15
      ADMIN_FEE_RATE_HIGH_VOLUME: 0.10
    precision: "whole cents, round_half_up on the fee; net is an exact integer subtraction"

  - name: campaign_coverage_status
    trigger: "POST /measurement-batches/{id}/certify (both branches) and the MeasurementBatch CERTIFIED -> DECERTIFIED system transition"
    algorithm: aggregation
    formula: |
      # Source set: MeasurementBatches of this campaign with
      # scoring_status == CERTIFIED (QUARANTINED and DECERTIFIED batches are
      # excluded; window boundaries are irrelevant - the counters are lifetime).
      if certified_measured_impressions == 0:
          coverage_status = UNKNOWN
      else:
          ratio = round_half_up(certified_measurable_impressions / certified_measured_impressions, 4)
          coverage_status = ON_TARGET if ratio >= campaign.target_coverage_rate else BELOW_TARGET
    input_set: "Campaign.certified_measured_impressions and Campaign.certified_measurable_impressions, which are maintained incrementally by the certify and decertify transitions rather than recomputed from scratch"
    constants: {}
    precision: "ratio: 4 decimal places, round_half_up"

  - name: publisher_quality_index
    trigger: "GET /publishers/{id}/scorecard"
    algorithm: weighted_scoring
    formula: |
      # Source set S = MeasurementBatches with this publisher_id and
      # scoring_status IN {CERTIFIED, QUARANTINED, DECERTIFIED};
      # INGESTED and SCORED batches are excluded (not yet adjudicated).
      sum_measured   = sum(b.measured_impressions   for b in S)
      sum_ivt        = sum(b.ivt_impressions        for b in S)
      sum_measurable = sum(b.measurable_impressions for b in S)
      sum_qualified  = sum(b.qualified_in_view_impressions for b in S)
      ivt_rate_avg         = round_half_up(sum_ivt / sum_measured, 4)        if sum_measured   > 0 else 0.0000
      viewability_rate_avg = round_half_up(sum_qualified / sum_measurable, 4) if sum_measurable > 0 else 0.0000
      overturn_rate        = round_half_up(overturned_appeal_count / decided_appeal_count, 4)
                             if decided_appeal_count > 0 else 0.0000
      ivt_penalty         = ivt_rate_avg * 100 * QUALITY_IVT_WEIGHT
      viewability_penalty = 0.00 if sum_measurable == 0
                            else max(0, QUALITY_VIEWABILITY_TARGET - viewability_rate_avg) * 100 * QUALITY_VIEW_WEIGHT
      raw = 100
            - ivt_penalty
            - viewability_penalty
            - (mfa_page_count * QUALITY_MFA_PENALTY)
            - (quarantined_batch_count * QUALITY_QUARANTINE_PENALTY)
            + (overturn_rate * QUALITY_OVERTURN_CREDIT)
      quality_index = round_half_up(min(100, max(0, raw)), 2)
      tier_band = PREFERRED         if quality_index >= 85.00
                = STANDARD          if 60.00 <= quality_index < 85.00
                = WATCHLIST         if 40.00 <= quality_index < 60.00
                = SUSPENDED_QUALITY if quality_index < 40.00
      # Empty-evidence edge: a publisher with no adjudicated batch has
      # sum_measurable == 0, so the viewability penalty is 0.00 rather than the
      # full 105.00 the formula would otherwise charge, and quality_index is
      # exactly 100.00 with tier_band PREFERRED.
    input_set: "Adjudicated batches of this publisher plus the publisher's own mfa_page_count, quarantined_batch_count, decided_appeal_count and overturned_appeal_count counters"
    constants:
      QUALITY_IVT_WEIGHT: 2.0
      QUALITY_VIEWABILITY_TARGET: 0.70
      QUALITY_VIEW_WEIGHT: 1.5
      QUALITY_MFA_PENALTY: 5
      QUALITY_QUARANTINE_PENALTY: 3
      QUALITY_OVERTURN_CREDIT: 10
    precision: "quality_index: 2 decimal places, round_half_up, clamped to [0.00, 100.00]; rates: 4 decimals"

  - name: pre_bid_placement_decision
    trigger: "GET /pages/{id}/pre-bid-decision"
    algorithm: constraint_propagation
    formula: |
      # Gate order is PINNED: publisher standing, then list precedence, then the
      # tier floor. The first gate that resolves returns.
      # ---- Gate 0: segment readiness (rejects with an error, not a decision)
      if segment.sync_status != "SYNCED": reject ERR_SEGMENT_NOT_SYNCED
      # ---- Gate 1: publisher standing
      if page.publisher.publisher_status in {RESTRICTED, DELISTED}:
          return { decision: BLOCK, reason_code: PUBLISHER_RESTRICTED,
                   decisive_entry_id: null, decisive_specificity: null }
      # ---- Gate 2: list precedence over the union of both pinned lists
      candidates = ListEntries e of segment.inclusion_list_id or
                   segment.exclusion_list_id such that:
          e.entry_type == PAGE_URL   and e.entry_value == page.url
       or e.entry_type == DOMAIN     and e.entry_value == page.domain
       or e.entry_type == PUBLISHER  and e.entry_value == page.publisher_id
       or e.entry_type == CATEGORY   and e.entry_value in page.latest_category_codes
      # eligibility filter: only entries of lists whose status == PUBLISHED
      # ranking:   ORDER BY e.specificity_rank DESC
      # tie-break 1: action BLOCK before action ALLOW at equal specificity_rank
      # tie-break 2: e.created_at ASC (earliest entry wins; ListEntry.id is never consulted)
      if candidates is non-empty:
          decisive = first candidate under that ordering
          if decisive.action == BLOCK:
              return { decision: BLOCK, reason_code: LIST_EXCLUSION,
                       decisive_entry_id: decisive.id,
                       decisive_specificity: decisive.entry_type }
          else:
              return { decision: ALLOW_OVERRIDE, reason_code: LIST_INCLUSION,
                       decisive_entry_id: decisive.id,
                       decisive_specificity: decisive.entry_type }
              # An explicit ALLOW bypasses Gate 3 entirely.
      # ---- Gate 3: tier floor (fallback when the candidate set is empty)
      effective_tier = page_suitability_tier variant pre_bid_domain_rollup for page.publisher_id
      if effective_tier == "UNRATED":
          return { decision: BLOCK, reason_code: UNRATED_INVENTORY, ... }
      if TIER_RANK[effective_tier] < TIER_RANK[segment.suitability_floor_tier]:
          return { decision: BLOCK, reason_code: BELOW_SUITABILITY_FLOOR, ... }
      return { decision: ALLOW, reason_code: MEETS_FLOOR, ... }
    input_set: "ListEntries of the segment's pinned PUBLISHED lists, the page's url / domain / publisher_id / latest_category_codes, the publisher's standing, and the publisher rollup tier over the trailing ROLLUP_WINDOW_DAYS window"
    constants:
      SPECIFICITY_RANK: { PAGE_URL: 4, DOMAIN: 3, PUBLISHER: 2, CATEGORY: 1 }
      DECISION_SET: [ALLOW, ALLOW_OVERRIDE, BLOCK]
      REASON_CODE_SET: [PUBLISHER_RESTRICTED, LIST_EXCLUSION, LIST_INCLUSION, UNRATED_INVENTORY, BELOW_SUITABILITY_FLOOR, MEETS_FLOOR]
    precision: "categorical output; no numeric rounding"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table  (evaluated strictly in ascending `priority`;
# the FIRST violated rule returns and no later rule is evaluated)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    rule: "X-User-Role header present and one of the seven roles in §1.7; when the role is Advertiser or Publisher, X-User-ID must also be present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc, which still requires X-User-Role"

  - priority: 2
    category: authz
    rule: "The caller's role appears in the endpoint's allowed-roles list in §1.5"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "every endpoint"

  - priority: 3
    category: authz
    rule: "Entity-backed callers may only reach their own aggregate: an Advertiser caller's X-User-ID must equal the advertiser_id reached through the target (Campaign.advertiser_id, InventoryList.advertiser_id, RefundClaim.campaign.advertiser_id); a Publisher caller's X-User-ID must equal the publisher_id reached through the target (Page.publisher_id, Appeal.classification.page.publisher_id, MeasurementBatch.publisher_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose target resolves to an Advertiser or a Publisher, including GET /publishers/{id}/scorecard and GET /pages/{id}/pre-bid-decision"

  - priority: 4
    category: existence
    rule: "Every {id} path parameter resolves to a stored entity of the expected type"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "every path with an {id} segment"

  - priority: 5
    category: existence
    rule: "Every foreign-key value in the request body resolves to a stored entity of the expected type, including every element of batch_ids and the segment_id query parameter"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /campaigns, POST /inventory-lists, POST /pre-bid-segments, POST /pages, POST /page-classifications, POST /appeals, POST /measurement-batches, POST /ivt-findings, POST /refund-claims, GET /pages/{id}/pre-bid-decision"

  - priority: 6
    category: validation
    rule: "Request body is well formed: required input fields present, enum fields inside their declared value sets, numeric fields inside their declared ranges (ratios and confidences in [0,1], originality_score in [0,100], impression counters and cpm_cents non-negative integers, category_codes a non-empty array of known codes, refresh_seconds a non-negative integer, batch_ids a non-empty array of distinct ids)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every write endpoint"

  - priority: 7
    category: state
    rule: "The target entity is in a state from which the requested transition is declared in §1.2 (for example certify requires scoring_status == SCORED; approve requires claim_state == UNDER_REVIEW; publish requires status DRAFT or STALE; decide requires appeal_state FILED or MORE_EVIDENCE_REQUIRED; confirm requires status == PROPOSED)"
    error_id: "ERR_INVALID_<ENTITY>_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"

  - priority: 8
    category: concurrency
    rule: "expected_page_version equals the current Page.version"
    error_id: ERR_STALE_PAGE_VERSION
    http_status: 412
    applies_to: "POST /page-classifications"

  - priority: 9
    category: concurrency
    rule: "expected_campaign_version equals the current Campaign.version"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /refund-claims"

  - priority: 10
    category: business_safety
    rule: "Segregation of duties on appeal adjudication: X-User-ID of the DisputeOfficer deciding an appeal must differ from the reviewed_by_user_id and the classifier_user_id of the PageClassification under appeal"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/decide"

  - priority: 11
    category: business_safety
    rule: "Segregation of duties on methodology audit: X-User-ID of the AccreditationAuditor concluding an audit must differ from MethodologyVersion.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /methodology-versions/{id}/audit-conclusion"

  - priority: 12
    category: business_safety
    rule: "The MethodologyVersion pinned by a scoring request has accreditation_status PROVISIONAL or ACCREDITED"
    error_id: ERR_METHODOLOGY_NOT_ACCREDITED
    http_status: 409
    applies_to: "POST /measurement-batches/{id}/score, POST /page-classifications"

  - priority: 13
    category: business_safety
    rule: "The MethodologyVersion pinned by a scoring request is effective at the batch's window_start (effective_from <= window_start < effective_to when effective_to is set)"
    error_id: ERR_METHODOLOGY_LAPSED
    http_status: 409
    applies_to: "POST /measurement-batches/{id}/score"

  - priority: 14
    category: business_safety
    rule: "An OVERTURNED appeal decision supplies revised_tier and that tier is strictly better (higher TIER_RANK) than the disputed classification's assigned_tier; an UPHELD decision must not supply revised_tier"
    error_id: ERR_REVISED_TIER_REQUIRED
    http_status: 422
    applies_to: "POST /appeals/{id}/decide"

  - priority: 15
    category: business_referential
    rule: "Every batch in batch_ids belongs to the claim's campaign_id AND to the claim's publisher_id"
    error_id: ERR_BATCH_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /refund-claims"

  - priority: 16
    category: business_referential
    rule: "Every batch in batch_ids has scoring_status QUARANTINED or DECERTIFIED (a CERTIFIED, SCORED or INGESTED batch is not claimable)"
    error_id: ERR_BATCH_NOT_CLAIMABLE
    http_status: 409
    applies_to: "POST /refund-claims"

  - priority: 17
    category: business_referential
    rule: "Every batch in batch_ids has settlement_status UNBILLED, i.e. it is not already cited by a SUBMITTED, UNDER_REVIEW or APPROVED claim"
    error_id: ERR_BATCH_ALREADY_CLAIMED
    http_status: 409
    applies_to: "POST /refund-claims"

  - priority: 18
    category: business_referential
    rule: "When supplied, a PreBidSegment's inclusion_list_id must name an InventoryList with list_type INCLUSION and its exclusion_list_id one with list_type EXCLUSION, and every supplied list must belong to the same advertiser as the segment's campaign"
    error_id: ERR_LIST_ADVERTISER_MISMATCH
    http_status: 409
    applies_to: "POST /pre-bid-segments"

  - priority: 19
    category: business_referential
    rule: "An appeal targets the page's currently effective classification: PageClassification.review_state must be CONFIRMED or OVERRIDDEN and its id must equal Page.current_classification_id"
    error_id: ERR_CLASSIFICATION_SUPERSEDED
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 20
    category: business_referential
    rule: "No other Appeal on the same classification_id is in state FILED or MORE_EVIDENCE_REQUIRED"
    error_id: ERR_APPEAL_PENDING
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 21
    category: business_referential
    rule: "A batch's format must equal the format of its Campaign (a VIDEO campaign cannot receive DISPLAY measurement)"
    error_id: ERR_FORMAT_MISMATCH
    http_status: 409
    applies_to: "POST /measurement-batches"

  - priority: 22
    category: business_referential
    rule: "A batch's page_id must belong to its publisher_id"
    error_id: ERR_PAGE_PUBLISHER_MISMATCH
    http_status: 409
    applies_to: "POST /measurement-batches"

  - priority: 23
    category: business_constraint
    rule: "measurable_impressions <= measured_impressions AND in_view_impressions <= measurable_impressions AND measured_impressions > 0"
    error_id: ERR_IMPRESSION_COUNTS_INCONSISTENT
    http_status: 422
    applies_to: "POST /measurement-batches"

  - priority: 24
    category: business_constraint
    rule: "An IvtFinding's flagged_impressions must not exceed its batch's measured_impressions, and a confirm requires confidence >= IVT_CONFIRM_CONFIDENCE_FLOOR (0.75)"
    error_id: ERR_IVT_CONFIDENCE_TOO_LOW
    http_status: 409
    applies_to: "POST /ivt-findings, POST /ivt-findings/{id}/confirm"

  - priority: 25
    category: business_constraint
    rule: "(list_id, entry_type, entry_value) is unique within an InventoryList; (publisher_id, url) is unique across Pages"
    error_id: ERR_DUPLICATE_LIST_ENTRY
    http_status: 409
    applies_to: "POST /inventory-lists/{id}/entries, POST /pages (as ERR_DUPLICATE_PAGE_URL)"

  - priority: 26
    category: business_constraint
    rule: "An appeal may not open round APPEAL_MAX_ROUNDS + 1: a MORE_EVIDENCE decision or an evidence submission when round_no is already 3 is refused (a terminal UPHELD or OVERTURNED decision is always still available)"
    error_id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /appeals/{id}/decide with outcome MORE_EVIDENCE, POST /appeals/{id}/evidence"

  - priority: 27
    category: business_constraint
    rule: "A list may not be published while entry_count == 0, and a PreBidSegment must pin at least one of inclusion_list_id or exclusion_list_id"
    error_id: ERR_EMPTY_LIST
    http_status: 409
    applies_to: "POST /inventory-lists/{id}/publish, POST /pre-bid-segments (as ERR_SEGMENT_REQUIRES_LIST)"

  - priority: 28
    category: business_constraint
    rule: "A list may not be published while it holds an ALLOW entry naming a Publisher whose publisher_status is RESTRICTED or DELISTED"
    error_id: ERR_LIST_CONTAINS_RESTRICTED_PUBLISHER
    http_status: 409
    applies_to: "POST /inventory-lists/{id}/publish"

  - priority: 29
    category: business_temporal
    rule: "MethodologyVersion effectivity windows are half-open [effective_from, effective_to) and must not overlap another version of the same standard_family; abutting windows (previous.effective_to == new.effective_from) are legal"
    error_id: ERR_METHODOLOGY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /methodology-versions"

  - priority: 30
    category: business_temporal
    rule: "MeasurementBatch windows are closed [window_start, window_end] and two batches sharing (campaign_id, page_id, format) must be separated by more than BATCH_WINDOW_BUFFER_SECONDS (60): a new batch is refused when new.window_start <= existing.window_end + 60s AND existing.window_start <= new.window_end + 60s"
    error_id: ERR_BATCH_WINDOW_COLLISION
    http_status: 409
    applies_to: "POST /measurement-batches"

  - priority: 31
    category: business_temporal
    rule: "window_start < window_end and window_end must not be after the current logical clock"
    error_id: ERR_BATCH_WINDOW_IN_FUTURE
    http_status: 422
    applies_to: "POST /measurement-batches"

  - priority: 32
    category: business_temporal
    rule: "An appeal must be filed within APPEAL_FILING_WINDOW_DAYS (14) of the disputed classification's created_at, measured against the logical clock"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 33
    category: business_temporal
    rule: "A refund claim must be submitted within CLAIM_FILING_WINDOW_DAYS (30) of the latest window_end among its cited batches"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /refund-claims"

  - priority: 34
    category: business_fiscal
    rule: "An approval whose net_credit_cents would push Advertiser.credit_received_cents_total above Advertiser.credit_cap_cents is refused"
    error_id: ERR_CREDIT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /refund-claims/{id}/approve"

  - priority: 35
    category: business_fiscal
    rule: "An approval whose recomputed credited_impressions is 0 is refused (the claim must be rejected instead)"
    error_id: ERR_NO_CREDITABLE_IMPRESSIONS
    http_status: 409
    applies_to: "POST /refund-claims/{id}/approve"

# Deliberate priority pairs (see §1.8 rule priority_pair_validation_conflict):
#   - state (7) beats business_fiscal (34): a REJECTED claim submitted for
#     approval over an exhausted credit cap returns ERR_INVALID_CLAIM_STATE.
#   - business_constraint (23) beats business_temporal (30): a batch with both
#     inconsistent counters and a colliding window returns
#     ERR_IMPRESSION_COUNTS_INCONSISTENT.
#   - business_safety (10) beats business_constraint (26): a self-review by the
#     deciding officer on a round-3-exhausted appeal returns
#     ERR_SEGREGATION_OF_DUTIES.

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# (api_prefix is "/", so every path below is the complete route; the single
#  path placeholder name used anywhere in this scaffold is {id})
# ---------------------------------------------------------------------------
endpoints:

  # ---- test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every window, filing-deadline and rollup rule reads. The clock starts at the fixed default 2026-08-01T00:00:00Z on server startup and never falls back to wall-clock time; all fixture timestamps in this scaffold sit at or after that instant."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["sets the logical clock read by appeal/claim filing windows, methodology effectivity, batch window checks and the 30-day pre-bid rollup window"]

  # ---- advertisers ---------------------------------------------------------
  - method: POST
    path: "/advertisers"
    description: "Registers an advertiser and its lifetime credit cap"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "credit_cap_cents?"]
    output: Advertiser
    side_effects: ["initialises credit_received_cents_total and settled_claim_count to 0"]

  - method: GET
    path: "/advertisers/{id}"
    description: "Reads one advertiser including the credit ledger half of INVARIANT_CREDIT_DOUBLE_ENTRY"
    roles: [PlatformAdmin, Advertiser, DisputeOfficer]
    code: 200
    input: []
    output: Advertiser
    side_effects: []

  # ---- publishers ----------------------------------------------------------
  - method: POST
    path: "/publishers"
    description: "Registers a publisher, its flagship domain and its sourced-traffic share (an MFA scoring input)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, primary_domain, "sourced_traffic_pct?"]
    output: Publisher
    side_effects: ["initialises publisher_status to ACTIVE and every quality counter to 0"]

  - method: GET
    path: "/publishers/{id}"
    description: "Reads one publisher including publisher_status, status_reason and the quality counters"
    roles: [PlatformAdmin, Publisher, ClassificationAnalyst, MeasurementOperator, DisputeOfficer, AccreditationAuditor]
    code: 200
    input: []
    output: Publisher
    side_effects: []

  - method: POST
    path: "/publishers/{id}/status"
    description: "Administrative standing change: reinstate a RESTRICTED publisher or delist one permanently"
    roles: [PlatformAdmin]
    code: 200
    input: [new_status, "reason?"]
    output: Publisher
    side_effects:
      - "drives Publisher RESTRICTED -> ACTIVE (rejected with ERR_RESTRICTION_STILL_JUSTIFIED while quarantined_batch_count >= 3 or mfa_page_count >= 3) or ACTIVE|RESTRICTED -> DELISTED"
      - "sets status_reason to ADMIN_REINSTATEMENT or ADMIN_ACTION"
      - "increments Publisher.version by 1"

  - method: GET
    path: "/publishers/{id}/scorecard"
    description: "Computed read: publisher quality index and tier band over the publisher's adjudicated MeasurementBatches per calculation publisher_quality_index"
    roles: [PlatformAdmin, Publisher, DisputeOfficer]
    code: 200
    input: []
    output:
      publisher_id: string
      adjudicated_batch_count: integer
      ivt_rate_avg: number
      viewability_rate_avg: number
      overturn_rate: number
      mfa_page_count: integer
      quarantined_batch_count: integer
      quality_index: number
      tier_band: string
    side_effects: []

  # ---- methodology & accreditation ----------------------------------------
  - method: POST
    path: "/methodology-versions"
    description: "Publishes a measurement methodology version with its per-format in-view thresholds, coverage floor and IVT ceiling; windows are half-open and may not overlap inside one standard_family"
    roles: [AccreditationAuditor]
    code: 201
    input: [standard_family, version_code, effective_from, effective_to, "display_in_view_seconds?", "video_in_view_seconds?", "display_pixel_pct?", "large_display_pixel_pct?", "video_pixel_pct?", "coverage_rate_floor?", "ivt_rate_ceiling?"]
    output: MethodologyVersion
    side_effects:
      - "stamps authored_by_user_id from X-User-ID, which becomes the segregation-of-duties counterparty for the audit conclusion"
      - "sets accreditation_status to PROVISIONAL"

  - method: GET
    path: "/methodology-versions/{id}"
    description: "Reads one methodology version including accreditation_status, audit_outcome and decertified_batch_count"
    roles: [PlatformAdmin, AccreditationAuditor, MeasurementOperator, ClassificationAnalyst, DisputeOfficer]
    code: 200
    input: []
    output: MethodologyVersion
    side_effects: []

  - method: GET
    path: "/methodology-versions"
    description: "Lists methodology versions, filterable by family and accreditation standing"
    roles: [PlatformAdmin, AccreditationAuditor, MeasurementOperator, ClassificationAnalyst, DisputeOfficer]
    code: 200
    input: ["standard_family?", "accreditation_status?", "limit?", "offset?"]
    output: MethodologyVersion[]
    side_effects: []

  - method: POST
    path: "/methodology-versions/{id}/audit-conclusion"
    description: "Concludes the accreditation audit of a methodology version; PASSED accredits it, DEFICIENT suspends it and fires the four-hop decertification cascade"
    roles: [AccreditationAuditor]
    code: 200
    input: [outcome, audit_finding_rate, "deficiency_note?"]
    output: MethodologyVersion
    side_effects:
      - "drives MethodologyVersion PROVISIONAL -> ACCREDITED (outcome PASSED, audit_finding_rate <= 0.05) or PROVISIONAL|ACCREDITED -> SUSPENDED (outcome DEFICIENT)"
      - "rejects the caller with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals authored_by_user_id"
      - "on SUSPENDED, cascade hop 1->2: every CERTIFIED MeasurementBatch pinning this version becomes DECERTIFIED and decertified_batch_count is set"
      - "cascade hop 2->3: each affected Campaign's certified counters are reduced and coverage_status recomputed per calculation campaign_coverage_status"
      - "cascade hop 3->4: a Campaign whose coverage_status became BELOW_TARGET moves ACTIVE -> UNDER_REMEDIATION and its SYNCED PreBidSegments become STALE with stale_reason CAMPAIGN_UNDER_REMEDIATION"
      - "stamps lead_auditor_user_id, audit_outcome, audit_finding_rate and deficiency_note"

  # ---- campaigns -----------------------------------------------------------
  - method: POST
    path: "/campaigns"
    description: "Creates a campaign with its CPM, accepted suitability floor, contracted coverage rate and creative format"
    roles: [PlatformAdmin, Advertiser]
    code: 201
    input: [advertiser_id, name, cpm_cents, min_suitability_tier, format, "target_coverage_rate?"]
    output: Campaign
    side_effects: ["sets status ACTIVE, coverage_status UNKNOWN and all certified counters to 0"]

  - method: GET
    path: "/campaigns/{id}"
    description: "Reads one campaign including coverage_status, the certified impression counters and open_claim_count (also the source of expected_campaign_version for claim creation)"
    roles: [PlatformAdmin, Advertiser, DisputeOfficer, MeasurementOperator]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/campaigns"
    description: "Lists campaigns, filterable by owning advertiser and standing"
    roles: [PlatformAdmin, Advertiser, DisputeOfficer, MeasurementOperator]
    code: 200
    input: ["advertiser_id?", "status?", "coverage_status?", "format?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  # ---- inclusion / exclusion lists ----------------------------------------
  - method: POST
    path: "/inventory-lists"
    description: "Creates an inclusion (ALLOW) or exclusion (BLOCK) list owned by an advertiser"
    roles: [Advertiser]
    code: 201
    input: [advertiser_id, list_type, name]
    output: InventoryList
    side_effects: ["sets status DRAFT, entry_count 0 and published_version null"]

  - method: GET
    path: "/inventory-lists/{id}"
    description: "Reads one inventory list including status, entry_count, published_version and stale_reason"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: []
    output: InventoryList
    side_effects: []

  - method: GET
    path: "/inventory-lists"
    description: "Lists inventory lists, filterable by owning advertiser, type and publication standing"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: ["advertiser_id?", "list_type?", "status?", "limit?", "offset?"]
    output: InventoryList[]
    side_effects: []

  - method: POST
    path: "/inventory-lists/{id}/entries"
    description: "Appends an immutable entry to a list; list_id is taken from the path, and action plus specificity_rank are derived from the parent list's list_type and the entry_type"
    roles: [Advertiser]
    code: 201
    input: [entry_type, entry_value]
    output: ListEntry
    side_effects:
      - "computes action (ALLOW for INCLUSION, BLOCK for EXCLUSION) and specificity_rank (PAGE_URL 4, DOMAIN 3, PUBLISHER 2, CATEGORY 1)"
      - "increments InventoryList.entry_count by 1 and InventoryList.version by 1"
      - "a PUBLISHED list moves back to DRAFT-equivalent behaviour only through publish; entries added after publish are not visible to a synced segment until the list is republished and the segment re-synced"

  - method: GET
    path: "/inventory-lists/{id}/entries"
    description: "Reverse-reachability read for ListEntry: lists the entries of one list in ascending created_at order, which is also the tie-break order used by pre-bid list precedence"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: ListEntry[]
    side_effects: []

  - method: POST
    path: "/inventory-lists/{id}/publish"
    description: "Publishes or republishes a list, snapshotting its version into published_version"
    roles: [Advertiser]
    code: 200
    input: []
    output: InventoryList
    side_effects:
      - "drives InventoryList DRAFT -> PUBLISHED or STALE -> PUBLISHED"
      - "rejects an empty list with ERR_EMPTY_LIST and a list holding an ALLOW/PUBLISHER entry for a RESTRICTED or DELISTED publisher with ERR_LIST_CONTAINS_RESTRICTED_PUBLISHER"
      - "sets published_version and published_at, clears stale_reason, increments InventoryList.version by 1"

  # ---- pre-bid integration -------------------------------------------------
  - method: POST
    path: "/pre-bid-segments"
    description: "Creates the pre-bid segment the buying platform consumes, pinning up to one inclusion list, one exclusion list and a suitability floor tier"
    roles: [Advertiser]
    code: 201
    input: [campaign_id, suitability_floor_tier, "inclusion_list_id?", "exclusion_list_id?"]
    output: PreBidSegment
    side_effects: ["sets sync_status PENDING; at least one list must be pinned, otherwise ERR_SEGMENT_REQUIRES_LIST"]

  - method: GET
    path: "/pre-bid-segments/{id}"
    description: "Reads one pre-bid segment including sync_status, the pinned published_version snapshots and stale_reason"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: []
    output: PreBidSegment
    side_effects: []

  - method: GET
    path: "/pre-bid-segments"
    description: "Lists pre-bid segments, filterable by campaign, by either pinned list and by sync standing"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: ["campaign_id?", "inclusion_list_id?", "exclusion_list_id?", "sync_status?", "limit?", "offset?"]
    output: PreBidSegment[]
    side_effects: []

  - method: POST
    path: "/pre-bid-segments/{id}/sync"
    description: "Pushes the current list snapshot to the buying platform"
    roles: [Advertiser]
    code: 200
    input: []
    output: PreBidSegment
    side_effects:
      - "drives PreBidSegment PENDING -> SYNCED or STALE -> SYNCED"
      - "rejects a segment whose pinned lists are not all PUBLISHED with ERR_LIST_NOT_PUBLISHED and a campaign in UNDER_REMEDIATION with ERR_CAMPAIGN_UNDER_REMEDIATION"
      - "captures synced_inclusion_version / synced_exclusion_version and synced_at, clears stale_reason, increments PreBidSegment.version by 1"

  # ---- pages & classification ---------------------------------------------
  - method: POST
    path: "/pages"
    description: "Registers a page of a publisher; domain is derived from the URL host"
    roles: [PlatformAdmin, Publisher]
    code: 201
    input: [publisher_id, url]
    output: Page
    side_effects: ["computes domain from url, sets classification_state UNCLASSIFIED, current_tier null and latest_category_codes []"]

  - method: GET
    path: "/pages/{id}"
    description: "Reads one page including classification_state, current_tier, current_classification_id, mfa_flag and Page.version (the OCC token for classification writes)"
    roles: [PlatformAdmin, Publisher, ClassificationAnalyst, MeasurementOperator, DisputeOfficer, Advertiser]
    code: 200
    input: []
    output: Page
    side_effects: []

  - method: GET
    path: "/pages"
    description: "Lists pages, filterable by publisher, by the classification currently in force, by lifecycle state and by MFA flag"
    roles: [PlatformAdmin, Publisher, ClassificationAnalyst, MeasurementOperator, DisputeOfficer, Advertiser]
    code: 200
    input: ["publisher_id?", "current_classification_id?", "classification_state?", "mfa_flag?", "limit?", "offset?"]
    output: Page[]
    side_effects: []

  - method: GET
    path: "/pages/{id}/pre-bid-decision"
    description: "Computed read: the pre-bid ALLOW/BLOCK verdict for this page under one segment, per calculation pre_bid_placement_decision (publisher standing gate, then list precedence, then the publisher tier rollup)"
    roles: [PlatformAdmin, Advertiser]
    code: 200
    input: [segment_id]
    output:
      page_id: string
      segment_id: string
      decision: string
      reason_code: string
      decisive_entry_id: string
      decisive_specificity: string
      effective_tier: string
      floor_tier: string
    side_effects: ["rejects a segment whose sync_status is not SYNCED with ERR_SEGMENT_NOT_SYNCED"]

  - method: POST
    path: "/page-classifications"
    description: "Classifies a page. Requires expected_page_version (OCC on Page): the new record supersedes the page's currently effective classification, so a stale client view is refused with 412."
    roles: [ClassificationAnalyst]
    code: 201
    input: [page_id, methodology_version_id, expected_page_version, classifier_kind, category_codes, ad_density_ratio, refresh_seconds, originality_score, "model_confidence?"]
    output: PageClassification
    side_effects:
      - "computes mfa_score and mfa_flag per calculation mfa_score, then base_risk_points, adjusted_risk_points and assigned_tier per calculation page_suitability_tier, in that pinned order"
      - "sets the previously effective PageClassification review_state to SUPERSEDED"
      - "drives Page UNCLASSIFIED -> MODEL_CLASSIFIED, or RECLASSIFIED -> MODEL_CLASSIFIED, republishing current_classification_id, current_tier, latest_category_codes, mfa_score and mfa_flag"
      - "when the new classification's mfa_flag is true, increments Publisher.mfa_page_count by 1, which may drive Publisher ACTIVE -> RESTRICTED at PUBLISHER_MFA_LIMIT and fire the list/segment staling cascade"
      - "stamps classifier_user_id from X-User-ID"
      - "rejects a methodology_version_id whose standard_family is not SUITABILITY with ERR_METHODOLOGY_FAMILY_MISMATCH, evaluated before the accreditation and effectivity guards of priorities 12 and 13"
      - "increments Page.version by 1"

  - method: GET
    path: "/page-classifications/{id}"
    description: "Reads one classification record including base_risk_points, adjusted_risk_points, assigned_tier, mfa_score, review_state and reviewed_by_user_id"
    roles: [PlatformAdmin, ClassificationAnalyst, Publisher, DisputeOfficer, MeasurementOperator]
    code: 200
    input: []
    output: PageClassification
    side_effects: []

  - method: GET
    path: "/page-classifications"
    description: "Lists classification records, filterable by page, by pinned methodology version and by review standing"
    roles: [PlatformAdmin, ClassificationAnalyst, Publisher, DisputeOfficer, MeasurementOperator]
    code: 200
    input: ["page_id?", "methodology_version_id?", "review_state?", "classifier_kind?", "limit?", "offset?"]
    output: PageClassification[]
    side_effects: []

  - method: POST
    path: "/page-classifications/{id}/review"
    description: "Human review of a model classification: CONFIRM accepts the assigned tier, OVERRIDE re-scores the record from revised_category_codes"
    roles: [ClassificationAnalyst]
    code: 200
    input: [decision, "revised_category_codes?", "review_note?"]
    output: PageClassification
    side_effects:
      - "sets review_state CONFIRMED or OVERRIDDEN and stamps reviewed_by_user_id from X-User-ID, which becomes the segregation-of-duties counterparty for any appeal against this record"
      - "on OVERRIDE, recomputes mfa_score, base_risk_points, adjusted_risk_points and assigned_tier and republishes Page.current_tier and Page.latest_category_codes"
      - "drives Page MODEL_CLASSIFIED -> HUMAN_CONFIRMED"
      - "increments PageClassification.version and Page.version by 1"

  # ---- appeals -------------------------------------------------------------
  - method: POST
    path: "/appeals"
    description: "Publisher disputes the page's currently effective classification; must be filed within APPEAL_FILING_WINDOW_DAYS (14) of that record's created_at"
    roles: [Publisher]
    code: 201
    input: [classification_id, reason_code, evidence_note]
    output: Appeal
    side_effects:
      - "sets appeal_state FILED and round_no 1"
      - "drives Page HUMAN_CONFIRMED -> APPEALED and increments Page.appeal_count by 1"
      - "rejects a superseded or unreviewed target with ERR_CLASSIFICATION_SUPERSEDED and a second live appeal with ERR_APPEAL_PENDING"
      - "increments Page.version by 1"

  - method: GET
    path: "/appeals/{id}"
    description: "Reads one appeal including round_no, revised_tier, decided_by_user_id and remedy_classification_id"
    roles: [PlatformAdmin, Publisher, DisputeOfficer, ClassificationAnalyst]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/appeals"
    description: "Lists appeals, filterable by the disputed classification, by the remedy classification minted on overturn and by state"
    roles: [PlatformAdmin, Publisher, DisputeOfficer, ClassificationAnalyst]
    code: 200
    input: ["classification_id?", "remedy_classification_id?", "appeal_state?", "reason_code?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/appeals/{id}/evidence"
    description: "Publisher supplies a further evidence round, returning the appeal to FILED; bounded by APPEAL_MAX_ROUNDS (3)"
    roles: [Publisher]
    code: 200
    input: [evidence_note]
    output: Appeal
    side_effects:
      - "drives Appeal MORE_EVIDENCE_REQUIRED -> FILED, increments round_no by 1 and replaces evidence_note"
      - "rejects a round-exhausted appeal with ERR_APPEAL_ROUNDS_EXHAUSTED"
      - "increments Appeal.version by 1"

  - method: POST
    path: "/appeals/{id}/decide"
    description: "DisputeOfficer decision: MORE_EVIDENCE loops the appeal, UPHELD closes it without change, OVERTURNED re-tiers the page and fires the four-hop refund cascade"
    roles: [DisputeOfficer]
    code: 200
    input: [outcome, "revised_tier?", decision_note]
    output: Appeal
    side_effects:
      - "drives Appeal FILED -> MORE_EVIDENCE_REQUIRED, FILED -> UPHELD or FILED -> OVERTURNED"
      - "rejects the caller with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals the disputed classification's reviewed_by_user_id or classifier_user_id"
      - "on UPHELD, drives Page APPEALED -> HUMAN_CONFIRMED with no tier change"
      - "on OVERTURNED, cascade hop 1->2: the disputed PageClassification review_state becomes VACATED, an APPEAL_REMEDY PageClassification carrying revised_tier is minted and becomes Page.current_classification_id, and Page moves APPEALED -> RECLASSIFIED"
      - "cascade hop 2->3: every CLAIMED MeasurementBatch of that page recomputes assessed_tier and suitability_breach_flag against the revised tier"
      - "cascade hop 3->4: every RefundClaim citing those batches recomputes claimed_impressions and provisional_credit_cents under variant gross_impression_basis; a claim whose claimed_impressions falls to 0 is auto-REJECTED with reject_reason_code APPEAL_OVERTURNED and its cited batches move CLAIMED -> CLOSED_NO_CREDIT"
      - "increments Publisher.decided_appeal_count, and on OVERTURNED also Publisher.overturned_appeal_count"
      - "increments Appeal.version and Page.version by 1"

  # ---- post-bid measurement ------------------------------------------------
  - method: POST
    path: "/measurement-batches"
    description: "Ingests a post-bid measurement batch for one campaign/page/format over a closed delivery window; batches sharing (campaign_id, page_id, format) must be separated by more than BATCH_WINDOW_BUFFER_SECONDS (60)"
    roles: [MeasurementOperator]
    code: 201
    input: [campaign_id, publisher_id, page_id, methodology_version_id, format, window_start, window_end, measured_impressions, measurable_impressions, in_view_impressions, avg_in_view_seconds, avg_in_view_pixel_pct]
    output: MeasurementBatch
    side_effects:
      - "sets scoring_status INGESTED and settlement_status UNBILLED"
      - "rejects inconsistent counters with ERR_IMPRESSION_COUNTS_INCONSISTENT (priority 23), a colliding window with ERR_BATCH_WINDOW_COLLISION (priority 30), a format mismatch with ERR_FORMAT_MISMATCH and a page outside the publisher with ERR_PAGE_PUBLISHER_MISMATCH"
      - "rejects a methodology_version_id whose standard_family is not VIEWABILITY with ERR_METHODOLOGY_FAMILY_MISMATCH, evaluated with the other referential checks of this endpoint"

  - method: GET
    path: "/measurement-batches/{id}"
    description: "Reads one batch including every scored counter, both status dimensions and INVARIANT_IMPRESSION_CONSERVATION's terms"
    roles: [PlatformAdmin, MeasurementOperator, Advertiser, Publisher, DisputeOfficer, AccreditationAuditor]
    code: 200
    input: []
    output: MeasurementBatch
    side_effects: []

  - method: GET
    path: "/measurement-batches"
    description: "Lists batches, filterable by campaign, publisher, page, pinned methodology version and either status dimension"
    roles: [PlatformAdmin, MeasurementOperator, Advertiser, Publisher, DisputeOfficer, AccreditationAuditor]
    code: 200
    input: ["campaign_id?", "publisher_id?", "page_id?", "methodology_version_id?", "scoring_status?", "settlement_status?", "format?", "limit?", "offset?"]
    output: MeasurementBatch[]
    side_effects: []

  - method: POST
    path: "/measurement-batches/{id}/score"
    description: "Scores an ingested batch: applies the pinned methodology's per-format in-view thresholds, computes the coverage and viewability rates, deduplicates confirmed invalid traffic and captures the post-bid suitability tier"
    roles: [MeasurementOperator]
    code: 200
    input: []
    output: MeasurementBatch
    side_effects:
      - "drives MeasurementBatch scoring_status INGESTED -> SCORED"
      - "evaluates the pinned MethodologyVersion for lapse first (PROVISIONAL|ACCREDITED -> LAPSED) and then rejects with ERR_METHODOLOGY_LAPSED"
      - "computes qualified_in_view_impressions, non_viewable_impressions, unmeasurable_impressions, coverage_rate and viewability_rate per calculation viewability_and_coverage"
      - "computes ivt_impressions, ivt_rate, sophistication_flag and net_billable_impressions per calculation ivt_dedup_rate"
      - "captures assessed_tier per calculation page_suitability_tier variant post_bid_page_level and sets suitability_breach_flag against Campaign.min_suitability_tier"
      - "sets scored_at to the logical clock and increments MeasurementBatch.version by 1"

  - method: POST
    path: "/measurement-batches/{id}/certify"
    description: "Branching adjudication of a scored batch: the same call lands in CERTIFIED when the coverage floor and IVT ceiling are met with no sophisticated traffic and no brand-suitability breach, otherwise in QUARANTINED"
    roles: [MeasurementOperator]
    code: 200
    input: []
    output: MeasurementBatch
    side_effects:
      - "drives MeasurementBatch scoring_status SCORED -> CERTIFIED (coverage_rate >= coverage_rate_floor AND ivt_rate <= ivt_rate_ceiling AND sophistication_flag == false AND suitability_breach_flag == false) or SCORED -> QUARANTINED otherwise"
      - "on CERTIFIED: increments Publisher.certified_batch_count, adds measured_impressions and measurable_impressions to the Campaign certified counters and recomputes coverage_status per calculation campaign_coverage_status, which may drive Campaign UNDER_REMEDIATION -> ACTIVE"
      - "on QUARANTINED: cascade hop 1->2 increments Publisher.quarantined_batch_count, hop 2->3 drives Publisher ACTIVE -> RESTRICTED at PUBLISHER_QUARANTINE_LIMIT (3) with status_reason QUARANTINE_THRESHOLD, hop 3->4 stales the PUBLISHED lists holding an ALLOW/PUBLISHER entry for that publisher and then the SYNCED segments referencing those lists"
      - "a QUARANTINED batch becomes claimable (settlement_status UNBILLED may move to CLAIMED)"
      - "increments MeasurementBatch.version by 1"

  # ---- invalid traffic -----------------------------------------------------
  - method: POST
    path: "/ivt-findings"
    description: "Records a detector finding against a batch: general bot, data-centre traffic, or one of the sophisticated (SIVT) patterns"
    roles: [MeasurementOperator]
    code: 201
    input: [batch_id, ivt_class, flagged_impressions, confidence, "detector_note?"]
    output: IvtFinding
    side_effects: ["derives ivt_family (GIVT for GENERAL_BOT and DATACENTER, SIVT otherwise) and sets status PROPOSED; a PROPOSED finding never enters ivt_impressions"]

  - method: GET
    path: "/ivt-findings/{id}"
    description: "Reads one invalid-traffic finding including ivt_family, flagged_impressions and status"
    roles: [PlatformAdmin, MeasurementOperator, Publisher, DisputeOfficer, AccreditationAuditor]
    code: 200
    input: []
    output: IvtFinding
    side_effects: []

  - method: GET
    path: "/measurement-batches/{id}/ivt-findings"
    description: "Reverse-reachability read for IvtFinding: lists the findings of one batch, which is the input set of calculation ivt_dedup_rate"
    roles: [PlatformAdmin, MeasurementOperator, Publisher, DisputeOfficer, AccreditationAuditor]
    code: 200
    input: ["status?", "ivt_family?", "limit?", "offset?"]
    output: IvtFinding[]
    side_effects: []

  - method: POST
    path: "/ivt-findings/{id}/confirm"
    description: "Confirms a proposed finding, folding it into the batch's deduplicated invalid-traffic figures"
    roles: [MeasurementOperator]
    code: 200
    input: []
    output: IvtFinding
    side_effects:
      - "drives IvtFinding PROPOSED -> CONFIRMED; rejects confidence < 0.75 with ERR_IVT_CONFIDENCE_TOO_LOW and an already adjudicated batch with ERR_BATCH_ALREADY_ADJUDICATED"
      - "recomputes MeasurementBatch.ivt_impressions, ivt_rate, sophistication_flag and net_billable_impressions per calculation ivt_dedup_rate, preserving INVARIANT_IMPRESSION_CONSERVATION"
      - "increments IvtFinding.version and MeasurementBatch.version by 1"

  - method: POST
    path: "/ivt-findings/{id}/retract"
    description: "Retracts a proposed or confirmed finding; retracting a confirmed finding is the compensating operation that restores the batch's invalid-traffic figures exactly"
    roles: [MeasurementOperator]
    code: 200
    input: [retract_reason]
    output: IvtFinding
    side_effects:
      - "drives IvtFinding PROPOSED -> RETRACTED (no counter change) or CONFIRMED -> RETRACTED"
      - "on CONFIRMED -> RETRACTED, recomputes the batch figures over the remaining CONFIRMED findings, restoring INVARIANT_IMPRESSION_CONSERVATION to its pre-confirm values with no drift"
      - "increments IvtFinding.version and, when a confirmed finding was retracted, MeasurementBatch.version by 1"

  # ---- refund and credit claims -------------------------------------------
  - method: POST
    path: "/refund-claims"
    description: "Advertiser files a refund/credit claim against a publisher over quarantined or decertified batches. Requires expected_campaign_version (OCC on Campaign) because the claim stacks on the campaign's open-claim exposure."
    roles: [Advertiser]
    code: 201
    input: [campaign_id, publisher_id, batch_ids, expected_campaign_version]
    output: RefundClaim
    side_effects:
      - "sets claim_state SUBMITTED and computes claimed_impressions and provisional_credit_cents per calculations claim_impression_basis variant gross_impression_basis and claim_gross_credit_cents"
      - "moves every cited MeasurementBatch settlement_status UNBILLED -> CLAIMED"
      - "increments Campaign.open_claim_count by 1 and Campaign.version by 1"
      - "rejects batches outside the (campaign, publisher) scope with ERR_BATCH_SCOPE_MISMATCH, non-quarantined batches with ERR_BATCH_NOT_CLAIMABLE, already-cited batches with ERR_BATCH_ALREADY_CLAIMED and a late filing with ERR_CLAIM_WINDOW_CLOSED"

  - method: GET
    path: "/refund-claims/{id}"
    description: "Reads one claim including both impression bases, the gross/fee/net money triple and the rejection or reversal record"
    roles: [PlatformAdmin, Advertiser, Publisher, DisputeOfficer]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []

  - method: GET
    path: "/refund-claims"
    description: "Lists claims, filterable by campaign, by charged publisher, by any cited batch id and by adjudication state"
    roles: [PlatformAdmin, Advertiser, Publisher, DisputeOfficer]
    code: 200
    input: ["campaign_id?", "publisher_id?", "batch_ids?", "claim_state?", "reject_reason_code?", "limit?", "offset?"]
    output: RefundClaim[]
    side_effects: []

  - method: POST
    path: "/refund-claims/{id}/review"
    description: "Opens adjudication of a submitted claim and refreshes the provisional figures"
    roles: [DisputeOfficer]
    code: 200
    input: []
    output: RefundClaim
    side_effects:
      - "drives RefundClaim SUBMITTED -> UNDER_REVIEW"
      - "recomputes claimed_impressions and provisional_credit_cents under variant gross_impression_basis"
      - "rejects a claim whose cited pages carry a live appeal with ERR_APPEAL_PENDING"
      - "increments RefundClaim.version by 1"

  - method: POST
    path: "/refund-claims/{id}/approve"
    description: "Approves a claim under review: switches the impression basis to the net variant, prices the credit per cited batch, applies the gross-keyed administration fee and posts the net credit to both ledgers"
    roles: [DisputeOfficer]
    code: 200
    input: ["decision_note?"]
    output: RefundClaim
    side_effects:
      - "drives RefundClaim UNDER_REVIEW -> APPROVED"
      - "freezes credited_impressions per calculation claim_impression_basis variant net_measured_basis, gross_credit_cents per calculation claim_gross_credit_cents, and admin_fee_rate / admin_fee_cents / net_credit_cents per calculation claim_net_credit_cents"
      - "adds net_credit_cents to Advertiser.credit_received_cents_total and Publisher.credit_issued_cents_total, preserving INVARIANT_CREDIT_DOUBLE_ENTRY"
      - "increments Advertiser.settled_claim_count, decrements Campaign.open_claim_count"
      - "moves every cited MeasurementBatch settlement_status CLAIMED -> CREDITED"
      - "rejects a zero net basis with ERR_NO_CREDITABLE_IMPRESSIONS and a cap breach with ERR_CREDIT_CAP_EXCEEDED"
      - "stamps decided_by_user_id and increments RefundClaim.version by 1"

  - method: POST
    path: "/refund-claims/{id}/reject"
    description: "Rejects a claim under review with a structured ground; the cited batches close permanently for settlement"
    roles: [DisputeOfficer]
    code: 200
    input: [reject_reason_code, "decision_note?"]
    output: RefundClaim
    side_effects:
      - "drives RefundClaim UNDER_REVIEW -> REJECTED with reject_reason_code EVIDENCE_INSUFFICIENT, BATCH_RESCORED or DUPLICATE_CLAIM (APPEAL_OVERTURNED is system-only)"
      - "moves every cited MeasurementBatch settlement_status CLAIMED -> CLOSED_NO_CREDIT"
      - "decrements Campaign.open_claim_count, leaves both credit ledgers untouched"
      - "stamps decided_by_user_id and increments RefundClaim.version by 1"

  - method: POST
    path: "/refund-claims/{id}/reverse"
    description: "Compensating operation on an approved claim: unwinds both credit ledgers and returns the cited batches to UNBILLED so they can be re-cited"
    roles: [PlatformAdmin]
    code: 200
    input: [reversal_reason]
    output: RefundClaim
    side_effects:
      - "drives RefundClaim APPROVED -> REVERSED"
      - "subtracts net_credit_cents from Advertiser.credit_received_cents_total and Publisher.credit_issued_cents_total, restoring INVARIANT_CREDIT_DOUBLE_ENTRY to its pre-approval value with no drift"
      - "decrements Advertiser.settled_claim_count"
      - "moves every cited MeasurementBatch settlement_status CREDITED -> UNBILLED"
      - "retains the frozen money triple as the audit record and increments RefundClaim.version by 1"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # -- authentication / authorisation ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not one of the seven declared roles, or X-User-ID missing for the entity-backed roles Advertiser and Publisher"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "The caller's role is not listed for the endpoint in §1.5"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An Advertiser or Publisher caller targets a resource that resolves to a different advertiser or publisher"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID deciding an appeal reviewed or authored the disputed classification, or the auditor concluding an audit authored the methodology version"

  # -- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unknown enum value, out-of-range number, empty or duplicate-bearing batch_ids, blank retract_reason or reversal_reason, or window_start >= window_end"

  # -- existence -------------------------------------------------------------
  - id: ERR_ADVERTISER_NOT_FOUND
    http: 404
    condition: "advertiser_id in the path or body does not resolve"
  - id: ERR_PUBLISHER_NOT_FOUND
    http: 404
    condition: "publisher_id in the path or body does not resolve"
  - id: ERR_METHODOLOGY_VERSION_NOT_FOUND
    http: 404
    condition: "methodology_version_id in the path or body does not resolve"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign_id in the path or body does not resolve"
  - id: ERR_INVENTORY_LIST_NOT_FOUND
    http: 404
    condition: "An inventory list id in the path, or inclusion_list_id / exclusion_list_id in the body, does not resolve"
  - id: ERR_PRE_BID_SEGMENT_NOT_FOUND
    http: 404
    condition: "A pre-bid segment id in the path, or segment_id on GET /pages/{id}/pre-bid-decision, does not resolve"
  - id: ERR_PAGE_NOT_FOUND
    http: 404
    condition: "page_id in the path or body does not resolve"
  - id: ERR_PAGE_CLASSIFICATION_NOT_FOUND
    http: 404
    condition: "A classification id in the path, or classification_id in the body, does not resolve"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "An appeal id in the path does not resolve"
  - id: ERR_MEASUREMENT_BATCH_NOT_FOUND
    http: 404
    condition: "A batch id in the path, batch_id in the body, or any element of batch_ids does not resolve"
  - id: ERR_IVT_FINDING_NOT_FOUND
    http: 404
    condition: "An invalid-traffic finding id in the path does not resolve"
  - id: ERR_REFUND_CLAIM_NOT_FOUND
    http: 404
    condition: "A refund claim id in the path does not resolve"

  # -- state -----------------------------------------------------------------
  - id: ERR_INVALID_PUBLISHER_STATE
    http: 409
    condition: "The requested new_status is not reachable from the publisher's current publisher_status"
  - id: ERR_PUBLISHER_DELISTED
    http: 409
    condition: "Any status change is attempted against a DELISTED publisher (terminal state lockdown)"
  - id: ERR_RESTRICTION_STILL_JUSTIFIED
    http: 409
    condition: "Reinstatement to ACTIVE while quarantined_batch_count >= 3 or mfa_page_count >= 3"
  - id: ERR_INVALID_METHODOLOGY_STATE
    http: 409
    condition: "An audit conclusion is submitted for a version whose accreditation_status is already SUSPENDED or LAPSED"
  - id: ERR_INVALID_LIST_STATE
    http: 409
    condition: "publish is called on a list whose status is already PUBLISHED"
  - id: ERR_INVALID_SEGMENT_STATE
    http: 409
    condition: "sync is called on a segment whose sync_status is already SYNCED"
  - id: ERR_INVALID_PAGE_STATE
    http: 409
    condition: "A classification write or appeal filing is attempted from a page classification_state that does not declare the transition (e.g. filing an appeal while the page is MODEL_CLASSIFIED)"
  - id: ERR_INVALID_CLASSIFICATION_STATE
    http: 409
    condition: "review is called on a classification whose review_state is not PENDING_REVIEW"
  - id: ERR_INVALID_APPEAL_STATE
    http: 409
    condition: "decide or evidence is called from an appeal_state that does not declare the transition, including any call against a terminal UPHELD or OVERTURNED appeal"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "score is called on a batch whose scoring_status is not INGESTED, or certify on one whose scoring_status is not SCORED, or either against a DECERTIFIED batch"
  - id: ERR_INVALID_FINDING_STATE
    http: 409
    condition: "confirm is called on a finding whose status is not PROPOSED, or retract on one already RETRACTED"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "review, approve, reject or reverse is called from a claim_state that does not declare the transition, including any call against a terminal REJECTED or REVERSED claim"

  # -- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PAGE_VERSION
    http: 412
    condition: "expected_page_version supplied to POST /page-classifications does not equal the current Page.version"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version supplied to POST /refund-claims does not equal the current Campaign.version"

  # -- methodology & accreditation ------------------------------------------
  - id: ERR_METHODOLOGY_NOT_ACCREDITED
    http: 409
    condition: "The pinned methodology version's accreditation_status is SUSPENDED (or LAPSED) at score, certify or classification time"
  - id: ERR_METHODOLOGY_LAPSED
    http: 409
    condition: "The pinned methodology version's effective window has closed at the logical clock, or does not cover the batch's window_start"
  - id: ERR_METHODOLOGY_FAMILY_MISMATCH
    http: 409
    condition: "A PageClassification pins a version whose standard_family is not SUITABILITY, or a MeasurementBatch pins one whose standard_family is not VIEWABILITY"
  - id: ERR_METHODOLOGY_WINDOW_OVERLAP
    http: 409
    condition: "A new methodology version's half-open [effective_from, effective_to) window overlaps an existing version of the same standard_family; exact adjacency is allowed"
  - id: ERR_DUPLICATE_VERSION_CODE
    http: 409
    condition: "version_code is already used inside the same standard_family"
  - id: ERR_AUDIT_FINDING_RATE_TOO_HIGH
    http: 409
    condition: "An audit conclusion with outcome PASSED reports audit_finding_rate above AUDIT_MAX_FINDING_RATE (0.05)"
  - id: ERR_DEFICIENCY_NOTE_REQUIRED
    http: 422
    condition: "An audit conclusion with outcome DEFICIENT omits deficiency_note or supplies it blank"

  # -- lists, segments & pre-bid --------------------------------------------
  - id: ERR_DUPLICATE_PUBLISHER_DOMAIN
    http: 409
    condition: "primary_domain is already registered by another publisher"
  - id: ERR_DUPLICATE_LIST_NAME
    http: 409
    condition: "name is already used by another list of the same advertiser and list_type"
  - id: ERR_DUPLICATE_LIST_ENTRY
    http: 409
    condition: "(list_id, entry_type, entry_value) already exists in the list"
  - id: ERR_DUPLICATE_PAGE_URL
    http: 409
    condition: "url is already registered for the same publisher"
  - id: ERR_EMPTY_LIST
    http: 409
    condition: "publish is called on a list whose entry_count is 0"
  - id: ERR_LIST_CONTAINS_RESTRICTED_PUBLISHER
    http: 409
    condition: "publish is called on a list holding an ALLOW entry of entry_type PUBLISHER naming a RESTRICTED or DELISTED publisher"
  - id: ERR_LIST_ADVERTISER_MISMATCH
    http: 409
    condition: "A pinned list belongs to a different advertiser than the segment's campaign, or its list_type does not match the slot it was pinned into"
  - id: ERR_SEGMENT_REQUIRES_LIST
    http: 409
    condition: "A segment is created with neither inclusion_list_id nor exclusion_list_id"
  - id: ERR_LIST_NOT_PUBLISHED
    http: 409
    condition: "sync is called while a pinned list's status is DRAFT or STALE"
  - id: ERR_CAMPAIGN_UNDER_REMEDIATION
    http: 409
    condition: "sync is called for a campaign whose status is UNDER_REMEDIATION"
  - id: ERR_SEGMENT_NOT_SYNCED
    http: 409
    condition: "GET /pages/{id}/pre-bid-decision names a segment whose sync_status is PENDING or STALE"

  # -- classification & appeals ---------------------------------------------
  - id: ERR_CLASSIFICATION_SUPERSEDED
    http: 409
    condition: "An appeal targets a classification that is not the page's currently effective record, or whose review_state is PENDING_REVIEW, SUPERSEDED or VACATED"
  - id: ERR_APPEAL_PENDING
    http: 409
    condition: "A second appeal is filed against a classification that already has one in FILED or MORE_EVIDENCE_REQUIRED, or a claim review is attempted while a cited page carries a live appeal"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "An appeal is filed more than APPEAL_FILING_WINDOW_DAYS (14) after the disputed classification's created_at"
  - id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "A MORE_EVIDENCE decision or an evidence submission would open round APPEAL_MAX_ROUNDS + 1"
  - id: ERR_REVISED_TIER_REQUIRED
    http: 422
    condition: "An OVERTURNED decision omits revised_tier or supplies a tier no better than the disputed assigned_tier, or an UPHELD decision supplies revised_tier"

  # -- measurement & invalid traffic ----------------------------------------
  - id: ERR_FORMAT_MISMATCH
    http: 409
    condition: "A batch's format differs from its campaign's format"
  - id: ERR_PAGE_PUBLISHER_MISMATCH
    http: 409
    condition: "A batch's page_id does not belong to its publisher_id"
  - id: ERR_IMPRESSION_COUNTS_INCONSISTENT
    http: 422
    condition: "measurable_impressions > measured_impressions, in_view_impressions > measurable_impressions, or measured_impressions == 0"
  - id: ERR_BATCH_WINDOW_COLLISION
    http: 409
    condition: "A batch's closed window is within BATCH_WINDOW_BUFFER_SECONDS (60) of another batch sharing (campaign_id, page_id, format)"
  - id: ERR_BATCH_WINDOW_IN_FUTURE
    http: 422
    condition: "window_end is after the current logical clock"
  - id: ERR_IVT_CONFIDENCE_TOO_LOW
    http: 409
    condition: "A finding is confirmed with confidence below IVT_CONFIRM_CONFIDENCE_FLOOR (0.75), or created with flagged_impressions above the batch's measured_impressions"
  - id: ERR_BATCH_ALREADY_ADJUDICATED
    http: 409
    condition: "A finding is confirmed or retracted after its batch left INGESTED/SCORED (CERTIFIED, QUARANTINED or DECERTIFIED)"

  # -- claims & money --------------------------------------------------------
  - id: ERR_BATCH_SCOPE_MISMATCH
    http: 409
    condition: "A cited batch belongs to a different campaign or publisher than the claim declares"
  - id: ERR_BATCH_NOT_CLAIMABLE
    http: 409
    condition: "A cited batch's scoring_status is INGESTED, SCORED or CERTIFIED rather than QUARANTINED or DECERTIFIED"
  - id: ERR_BATCH_ALREADY_CLAIMED
    http: 409
    condition: "A cited batch's settlement_status is CLAIMED, CREDITED or CLOSED_NO_CREDIT"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 409
    condition: "A claim is filed more than CLAIM_FILING_WINDOW_DAYS (30) after the latest window_end among its cited batches"
  - id: ERR_NO_CREDITABLE_IMPRESSIONS
    http: 409
    condition: "Approval is attempted while the net_measured_basis recomputation yields 0 creditable impressions"
  - id: ERR_CREDIT_CAP_EXCEEDED
    http: 409
    condition: "Approval would push Advertiser.credit_received_cents_total above credit_cap_cents"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:

  - name: PlatformAdmin
    description: "Verification-provider operator: registers counterparties, changes publisher standing, sets the logical clock and reverses settled credits"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /advertisers"
      - "POST /publishers"
      - "POST /publishers/{id}/status"
      - "POST /refund-claims/{id}/reverse"
    shared_operations:
      - "POST /campaigns (shared with Advertiser)"
      - "POST /pages (shared with Publisher)"
      - "every GET read in §1.5, unrestricted by ownership"

  - name: Advertiser
    description: "Buy-side customer: owns campaigns, inclusion/exclusion lists and pre-bid segments, and files refund claims"
    identity: "entity_backed:Advertiser"
    exclusive_operations:
      - "POST /inventory-lists"
      - "POST /inventory-lists/{id}/entries"
      - "POST /inventory-lists/{id}/publish"
      - "POST /pre-bid-segments"
      - "POST /pre-bid-segments/{id}/sync"
      - "POST /refund-claims"
    shared_operations:
      - "POST /campaigns (shared with PlatformAdmin)"
      - "GET /pages/{id}/pre-bid-decision (shared with PlatformAdmin)"
      - "GET on advertisers, campaigns, inventory-lists, list entries, pre-bid-segments, pages, measurement-batches and refund-claims, restricted to the caller's own advertiser aggregate"

  - name: Publisher
    description: "Supply-side counterparty: registers pages, appeals classification decisions and reads its own scorecard"
    identity: "entity_backed:Publisher"
    exclusive_operations:
      - "POST /appeals"
      - "POST /appeals/{id}/evidence"
    shared_operations:
      - "POST /pages (shared with PlatformAdmin)"
      - "GET on publishers, the publisher scorecard, pages, page-classifications, appeals, measurement-batches, ivt-findings and refund-claims, restricted to the caller's own publisher aggregate"

  - name: ClassificationAnalyst
    description: "Content classification operator: creates model and human classifications and reviews them; the review identity becomes the segregation-of-duties counterparty for appeals"
    identity: "opaque"
    exclusive_operations:
      - "POST /page-classifications"
      - "POST /page-classifications/{id}/review"
    shared_operations:
      - "GET on publishers, pages, page-classifications, appeals and methodology-versions"

  - name: DisputeOfficer
    description: "Adjudicator of both dispute channels: decides publisher appeals and adjudicates advertiser refund claims. May never decide an appeal against a classification the same X-User-ID reviewed or authored."
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/decide"
      - "POST /refund-claims/{id}/review"
      - "POST /refund-claims/{id}/approve"
      - "POST /refund-claims/{id}/reject"
    shared_operations:
      - "GET on advertisers, publishers, the publisher scorecard, campaigns, pages, page-classifications, appeals, measurement-batches, ivt-findings and refund-claims"

  - name: AccreditationAuditor
    description: "Independent measurement auditor: authors methodology versions and concludes their accreditation audits, but never both for the same version under one X-User-ID"
    identity: "opaque"
    exclusive_operations:
      - "POST /methodology-versions"
      - "POST /methodology-versions/{id}/audit-conclusion"
    shared_operations:
      - "GET on publishers, methodology-versions, measurement-batches and ivt-findings"

  - name: MeasurementOperator
    description: "Post-bid measurement operator: ingests, scores and certifies batches and adjudicates invalid-traffic findings"
    identity: "opaque"
    exclusive_operations:
      - "POST /measurement-batches"
      - "POST /measurement-batches/{id}/score"
      - "POST /measurement-batches/{id}/certify"
      - "POST /ivt-findings"
      - "POST /ivt-findings/{id}/confirm"
      - "POST /ivt-findings/{id}/retract"
    shared_operations:
      - "GET on publishers, campaigns, pages, page-classifications, methodology-versions, measurement-batches and ivt-findings"
