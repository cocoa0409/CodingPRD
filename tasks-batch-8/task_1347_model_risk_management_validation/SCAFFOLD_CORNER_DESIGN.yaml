      - name: documentation_rejection_leaves_no_approved_doc
        claim_type: valid_transition
        grounds:
          - state_machines.ModelDocumentation.SUBMITTED_to_REJECTED
        distinguishing_aspect: "REJECT moves the doc SUBMITTED → REJECTED (terminal) and approves nothing — a later model approve still fails the documentation gate."
        test_recipe:
          setup:
            - "Model M registered; doc submitted then REJECTED"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Rej M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
