# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3031_personal_sales_engineer_assignment_post_sale_support
#
# Depth probe: the nine §0.5 Difficulty Rules, two instances each (18 total).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.6 only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: commission_provisional_vs_final_on_quote
        grounds:
          - calculations.engineer_commission_cents
          - entities.Quote.fields.gross_subtotal_cents
          - entities.Engineer.fields.lifetime_commission_cents
          - state_machines.InstrumentUnit.INSPECTED_to_SHIPPED
        distinguishing_aspect: "The same quote yields engineer_commission_cents 2800 under the provisional variant and 1600 under the final variant, so the two valid readings of COMMISSION_POOL_BPS differ on identical data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One TIER_1 engineer (cap 5000 bps), one customer with an ACTIVE assignment, a SYSTEM_PACKAGE quote holding a guitar line (anchor) and an amp line requiring it, the quote RESERVED, and one serialized guitar unit inspected PASS."
          setup_api_calls:
            - &clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &mk_eng
              call: "POST /engineers"
              payload: { full_name: "Dana Riggs", email: "dana.riggs@sweetwater.example", region: "MIDWEST" }
              as: PlatformAdmin
              captures: { eng_a_id: $.data.id }
            - &mk_cust
              call: "POST /customers"
              payload: { full_name: "Riley Chance", email: "riley.chance@example.com", home_state: "IN" }
              as: Anonymous
              captures: { cust_a_id: $.data.id, cust_a_v: $.data.version }
            - &mk_asg
              call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { asg_a_id: $.data.id }
            - &acc_asg
              call: "POST /assignments/${asg_a_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - &mk_guitar
              call: "POST /products"
              payload: { product_code: "SW-GTR-100", display_name: "Studio Guitar 100", product_family: "GUITAR", unit_price_cents: 120000 }
              as: PlatformAdmin
              captures: { guitar_code_ok: $.data.product_code }
            - &mk_amp
              call: "POST /products"
              payload: { product_code: "SW-AMP-050", display_name: "Combo Amp 50", product_family: "AMPLIFIER", unit_price_cents: 90000, required_family: "GUITAR" }
              as: PlatformAdmin
              captures: { amp_code_ok: $.data.product_code }
            - &mk_quote
              call: "POST /quotes"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", package_type: "SYSTEM_PACKAGE" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_a_id: $.data.id, quote_a_v0: $.data.version }
            - &line_guitar
              call: "POST /quotes/${quote_a_id}/lines"
              payload: { product_code: "SW-GTR-100", quantity: 1, is_anchor: true }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_gtr_id: $.data.id }
            - &line_amp
              call: "POST /quotes/${quote_a_id}/lines"
              payload: { product_code: "SW-AMP-050", quantity: 1, requires_line_id: "${qline_gtr_id}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_amp_id: $.data.id }
            - &q_submit
              call: "POST /quotes/${quote_a_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - &q_reserve
              call: "POST /quotes/${quote_a_id}/reserve"
              payload: { expected_quote_version: "${quote_a_v0}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_a_v1: $.data.version }
            - &mk_unit
              call: "POST /instrument-units"
              payload: { quote_line_id: "${qline_gtr_id}", serial_number: "SN-GTR-5521", model_code: "SW-GTR-100" }
              as: SetupTechnician
              captures: { unit_a_id: $.data.id }
            - &unit_setup
              call: "POST /instrument-units/${unit_a_id}/complete-setup"
              payload: { action_height_mm: 1.50, relief_mm: 0.10, intonation_offset_cents: 2 }
              as: SetupTechnician
            - &unit_inspect
              call: "POST /instrument-units/${unit_a_id}/record-inspection"
              payload: {}
              as: SetupTechnician
          trigger:
            - call: "GET /quotes/${quote_a_id}/summary"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { commission_provisional: $.data.engineer_commission_cents, variant_before: $.data.commission_variant }
            - call: "POST /instrument-units/${unit_a_id}/start-setup"
              payload: {}
              as: SetupTechnician
            - call: "POST /instrument-units/${unit_a_id}/ship"
              payload: {}
              as: SetupTechnician
            - call: "GET /quotes/${quote_a_id}/summary"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { commission_final: $.data.engineer_commission_cents, variant_after: $.data.commission_variant }
          assert:
            - "Quote.${quote_a_id}.gross_subtotal_cents == 69993"
            - "GET /quotes/${quote_a_id}/summary before shipping returns engineer_commission_cents == 2800 and commission_variant == provisional"
            - "GET /quotes/${quote_a_id}/summary after shipping the only instrument returns engineer_commission_cents == 1600 and commission_variant == final"
            - "Engineer.${eng_a_id}.lifetime_commission_cents == 1600 after the ship call"

      - name: restocking_fee_provisional_vs_final_on_gear_exchange
        grounds:
          - calculations.gear_exchange_restocking_fee
          - entities.GearExchange.fields.restocking_fee_bps
          - entities.Customer.fields.lifetime_gear_credit_cents
          - state_machines.GearExchange.TRIAL_ACTIVE_to_RETURN_REQUESTED
        distinguishing_aspect: "A STUDIO customer exchanging a TONE_MISMATCH instrument pays 1500 bps under the provisional variant and 500 bps under the final variant for the very same exchange, so the two readings of the reason rate differ on identical data and on a different entity domain than the commission calculation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. One STUDIO customer with an ACTIVE assignment, a quote line priced 40000 cents, a DRAFT gear exchange on that line with reason TONE_MISMATCH."
          setup_api_calls:
            - *clock
            - *mk_eng
            - call: "POST /customers"
              payload: { full_name: "Nova Bay", email: "nova.bay@example.com", home_state: "CA", account_tier: "STUDIO" }
              as: Anonymous
              captures: { cust_b_id: $.data.id, cust_b_v: $.data.version }
            - call: "POST /assignments"
              payload: { customer_id: "${cust_b_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", expected_customer_version: "${cust_b_v}" }
              as: SalesEngineerOps
              captures: { asg_b_id: $.data.id }
            - call: "POST /assignments/${asg_b_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - *mk_guitar
            - call: "POST /quotes"
              payload: { customer_id: "${cust_b_id}", engineer_id: "${eng_a_id}", package_type: "INSTRUMENT_ONLY" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_b_id: $.data.id }
            - call: "POST /quotes/${quote_b_id}/lines"
              payload: { product_code: "SW-GTR-100", quantity: 1, is_anchor: true }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_b_id: $.data.id }
            - call: "POST /gear-exchanges"
              payload: { quote_line_id: "${qline_b_id}", customer_id: "${cust_b_id}", reason: "TONE_MISMATCH" }
              as: SupportAgent
              captures: { gex_b_id: $.data.id }
          trigger:
            - call: "POST /gear-exchanges/${gex_b_id}/start-trial"
              payload: {}
              as: SupportAgent
              captures: { gex_b_fee_prov: $.data.restocking_fee_cents }
            - call: "POST /gear-exchanges/${gex_b_id}/request-return"
              payload: {}
              as: SupportAgent
              captures: { gex_b_fee_final: $.data.restocking_fee_cents, gex_b_bps_final: $.data.restocking_fee_bps }
          assert:
            - "GearExchange.${gex_b_id} restocking_fee_cents == 6000 and restocking_fee_bps == 1500 immediately after start-trial (provisional)"
            - "GearExchange.${gex_b_id} restocking_fee_cents == 2000 and restocking_fee_bps == 500 immediately after request-return (final)"
            - "the provisional and final variants of calculations.gear_exchange_restocking_fee disagree by 4000 cents on the identical quote line"
            - "GearExchange.${gex_b_id}.status == RETURN_REQUESTED and trial_end_date == 2026-09-24T00:00:00Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: inspection_verdict_three_input_conditional_fold
        grounds:
          - calculations.instrument_inspection_verdict
          - state_machines.InstrumentUnit.SETUP_COMPLETE_to_INSPECTED
          - validations[priority=6]
        distinguishing_aspect: "The verdict folds three measured inputs through nested conditional branches (mode (a)): action height in range, relief above floor, and intonation within tolerance, with the intonation branch carrying different weight in the preliminary and final variants."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-11T00:00:00Z. A RESERVED quote with one guitar line and a serialized unit in IN_SETUP."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - *mk_guitar
            - *mk_amp
            - *mk_quote
            - *line_guitar
            - *q_submit
            - *q_reserve
            - *mk_unit
            - call: "POST /instrument-units/${unit_a_id}/start-setup"
              payload: {}
              as: SetupTechnician
          trigger:
            - call: "POST /instrument-units/${unit_a_id}/complete-setup"
              payload: { action_height_mm: 1.50, relief_mm: 0.10, intonation_offset_cents: 12 }
              as: SetupTechnician
              captures: { verdict_prelim: $.data.inspection_overall }
            - call: "POST /instrument-units/${unit_a_id}/record-inspection"
              payload: {}
              as: SetupTechnician
              captures: { verdict_final: $.data.inspection_overall }
          assert:
            - "InstrumentUnit.${unit_a_id}.inspection_overall == CONDITIONAL after complete-setup (two of three checks pass, intonation is the failing branch)"
            - "InstrumentUnit.${unit_a_id}.inspection_overall == FAIL after record-inspection (the final variant treats a failed intonation as disqualifying)"
            - "InstrumentUnit.${unit_a_id}.setup_status == INSPECTED"
            - "POST /instrument-units/${unit_a_id}/ship is rejected with ERR_INSPECTION_NOT_PASSED (422)"

      - name: package_bundle_price_nested_rounding_order
        grounds:
          - calculations.package_bundle_price_cents
          - entities.QuoteLine.fields.line_total_cents
          - entities.QuoteLine.fields.bundle_discount_bps
        distinguishing_aspect: "Mode (b): the formula rounds each per-unit price before multiplying by quantity and again at the tier step, so rounding per unit then summing differs from summing then rounding by whole cents on a quantity-3 line."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. One engineer and one customer with an ACTIVE assignment, a SYSTEM_PACKAGE quote ready for a quantity-3 guitar line."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - call: "POST /products"
              payload: { product_code: "SW-MIC-111", display_name: "Field Mic 111", product_family: "MICROPHONE", unit_price_cents: 1111 }
              as: PlatformAdmin
              captures: { mic_code_ok: $.data.product_code }
            - *mk_quote
            - call: "POST /quotes/${quote_a_id}/lines"
              payload: { product_code: "SW-MIC-111", quantity: 3, is_anchor: true }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_mic_id: $.data.id, mic_line_total: $.data.line_total_cents, mic_unit_cents: $.data.unit_price_cents }
          trigger:
            - call: "POST /quotes/${quote_a_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "GET /quotes/${quote_a_id}/summary"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { bundle_price: $.data.package_bundle_price_cents, subtotal_cents: $.data.gross_subtotal_cents }
          assert:
            - "QuoteLine.${qline_mic_id}.unit_price_cents == 1111 and QuoteLine.${qline_mic_id}.bundle_discount_bps == 6667"
            - "the pinned per-unit rounding gives line_total_cents == 1110 (round_half_up(1111 * 3333 / 10000) == round_half_up(370.2963) == 370, then 3 * 370)"
            - "the rejected sum-then-round order would have given 1111 (round_half_up(3 * 1111 * 3333 / 10000) == round_half_up(1110.8889)), so the two orders differ by exactly 1 cent"
            - "Quote.${quote_a_id}.gross_subtotal_cents == 1110 and package_bundle_price_cents == 1110 at tier 0"
            - "Quote.${quote_a_id}.status == SUBMITTED and bundle_ready == true"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: assignment_cyclic_reopen_returns_ended_book_to_active
        grounds:
          - state_machines.Assignment.ENDED_to_ACTIVE
          - state_machines.Assignment.ACTIVE_to_ENDED
          - entities.Assignment.fields.sequence
        distinguishing_aspect: "Assignment is cyclic: ENDED -> ACTIVE is reachable again through reopen, so the machine is not a linear pipeline and the same row revisits an earlier state while sequence strictly increases."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-13T00:00:00Z. One engineer and one customer with an ACTIVE assignment."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
          trigger:
            - call: "POST /assignments/${asg_a_id}/end"
              payload: {}
              as: SalesEngineerOps
              captures: { seq_after_end: $.data.sequence, status_after_end: $.data.status }
            - call: "POST /assignments/${asg_a_id}/reopen"
              payload: {}
              as: SalesEngineerOps
              captures: { seq_after_reopen: $.data.sequence, status_after_reopen: $.data.status }
          assert:
            - "Assignment.${asg_a_id}.status == ENDED after the end call and == ACTIVE after reopen"
            - "Assignment.${asg_a_id}.sequence == ${seq_after_end} + 1 after reopen, so the row is identified by monotonically increasing sequence rather than by any id"
            - "Customer.${cust_a_id}.assigned_engineer_id == ${eng_a_id} again once reopened"
            - "Engineer.${eng_a_id}.active_book_size == 1 after reopen (the reopen compensation restores the slot)"

      - name: quote_branching_cycle_reserved_back_to_submitted_and_again
        grounds:
          - state_machines.Quote.RESERVED_to_SUBMITTED
          - state_machines.Quote.SUBMITTED_to_RESERVED
          - entities.Quote.fields.version
          - concurrency_rules[quote-reserve-stale-quote]
        distinguishing_aspect: "Quote is branching-with-cycle: RESERVED -> SUBMITTED via amend and then SUBMITTED -> RESERVED again, exercising a fork (reject vs reserve) plus a back-edge that a linear pipeline cannot express."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-14T00:00:00Z. A submitted-then-reserved SYSTEM_PACKAGE quote with two lines."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - *mk_guitar
            - *mk_amp
            - *mk_quote
            - *line_guitar
            - *line_amp
            - *q_submit
            - *q_reserve
          trigger:
            - call: "POST /quotes/${quote_a_id}/amend"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { status_after_amend: $.data.status, quote_v2: $.data.version }
            - call: "POST /quotes/${quote_a_id}/reserve"
              payload: { expected_quote_version: "${quote_v2}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { status_after_reserve2: $.data.status, quote_v3: $.data.version }
          assert:
            - "Quote.${quote_a_id}.status == SUBMITTED after amend and == RESERVED after the second reserve"
            - "Quote.${quote_a_id}.reserved_at is null after amend and non-null after the second reserve"
            - "Quote.${quote_a_id}.version == ${quote_v3} == ${quote_v2} + 1, so each reservation advances the version exactly once"
            - "the backorders created by the first reserve and swept are CANCELLED while the second reserve creates a fresh PREORDER_PENDING set"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: assignment_end_escalates_tickets_to_service_desk
        grounds:
          - state_machines.Assignment.ACTIVE_to_ENDED
          - state_machines.SupportTicket.IN_TRIAGE_to_ESCALATED
          - entities.ServiceCenter.fields.open_ticket_count
          - entities.EscalationLedger.fields.escalation_seq
          - calculations.customer_tech_support_entitlement
        distinguishing_aspect: "A depth-4 chain originating from the assignment-end transition: ending the Assignment downgrades the customer's entitlement, which escalates the open ticket, which appends an escalation ledger row, which increments the service center's open ticket count — each link caused by the previous link rather than by the original end call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One engineer, one customer with an ACTIVE assignment and one shipped instrument, one OPEN service center with capacity 2, and one ticket triaged to required_entitlement EXTENDED backed by an in-force warranty plan."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - &mk_center
              call: "POST /service-centers"
              payload: { name: "Indianapolis Bench", region: "MIDWEST", capacity_slots: 2, accepted_families: ["GUITAR", "AMPLIFIER"] }
              as: PlatformAdmin
              captures: { center_id: $.data.id }
            - &ship_one_instrument
              call: "POST /products"
              payload: { product_code: "SW-GTR-700", display_name: "Touring Guitar 700", product_family: "GUITAR", unit_price_cents: 200000 }
              as: PlatformAdmin
            - call: "POST /quotes"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", package_type: "INSTRUMENT_ONLY" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_c_id: $.data.id, quote_c_v0: $.data.version }
            - call: "POST /quotes/${quote_c_id}/lines"
              payload: { product_code: "SW-GTR-700", quantity: 1, is_anchor: true }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_c_id: $.data.id }
            - call: "POST /quotes/${quote_c_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /quotes/${quote_c_id}/reserve"
              payload: { expected_quote_version: "${quote_c_v0}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /instrument-units"
              payload: { quote_line_id: "${qline_c_id}", serial_number: "SN-GTR-8481", model_code: "SW-GTR-700" }
              as: SetupTechnician
              captures: { unit_c_id: $.data.id }
            - call: "POST /instrument-units/${unit_c_id}/start-setup"
              payload: {}
              as: SetupTechnician
            - call: "POST /instrument-units/${unit_c_id}/complete-setup"
              payload: { action_height_mm: 1.20, relief_mm: 0.12, intonation_offset_cents: 1 }
              as: SetupTechnician
            - call: "POST /instrument-units/${unit_c_id}/record-inspection"
              payload: {}
              as: SetupTechnician
            - call: "POST /instrument-units/${unit_c_id}/ship"
              payload: {}
              as: SetupTechnician
            - call: "POST /warranty-plans"
              payload: { customer_id: "${cust_a_id}", instrument_unit_id: "${unit_c_id}" }
              as: SalesEngineerOps
              captures: { plan_id: $.data.id }
            - call: "POST /warranty-plans/${plan_id}/activate"
              payload: { starts_on: "2026-09-15T00:00:00Z" }
              as: SalesEngineerOps
            - call: "POST /support-tickets"
              payload: { customer_id: "${cust_a_id}", subject: "Amp hum at high gain", channel: "PHONE", service_center_id: "${center_id}" }
              as: SupportAgent
              captures: { ticket_id: $.data.id }
            - call: "POST /support-tickets/${ticket_id}/triage"
              payload: {}
              as: SupportAgent
              captures: { required_ent: $.data.required_entitlement }
          trigger:
            - call: "POST /assignments/${asg_a_id}/end"
              payload: {}
              as: SalesEngineerOps
              captures: { asg_status_after: $.data.status }
            - call: "GET /support-tickets/${ticket_id}"
              payload: {}
              as: SupportAgent
              captures: { ticket_status_after: $.data.status, ticket_esc_seq: $.data.escalation_seq }
          assert:
            - "SupportTicket.${ticket_id}.required_entitlement == EXTENDED before the end call (link 0: warranty plan in force)"
            - "SupportTicket.${ticket_id}.status == ESCALATED after the end call (link 2: the entitlement downgrade pushed the open EXTENDED ticket to ESCALATED)"
            - "SupportTicket.${ticket_id}.escalation_seq == 1 and escalated_at == 2026-09-15T00:00:00Z"
            - "GET /escalation-ledger?support_ticket_id=${ticket_id} returns exactly 1 row with event_type SERVICE_DEPARTMENT_ESCALATION and escalation_seq 1 (link 3)"
            - "ServiceCenter.${center_id}.open_ticket_count == 1 after the cascade (link 4), having been 0 before the end call"
            - "Assignment.${asg_a_id}.status == ENDED and Customer.${cust_a_id}.assigned_engineer_id is null"

      - name: allocation_shortfall_unwinds_quote_and_sibling_backorders
        grounds:
          - state_machines.Backorder.ALLOCATION_SWEEP_to_PARTIALLY_FILLED
          - state_machines.Quote.RESERVED_to_SUBMITTED
          - calculations.backorder_allocation_units
          - entities.Quote.fields.reserved_at
        distinguishing_aspect: "A depth-3 chain originating from the allocation-finalize transition (a different trigger than the assignment-end cascade): the shortfall mutates the Backorder, which unwinds the parent Quote to SUBMITTED, which cancels the quote's sibling backorders."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-16T00:00:00Z. A RESERVED SYSTEM_PACKAGE quote with an anchor guitar line and a dependent amp line, each holding one PREORDER_PENDING backorder; the shared pool holds 1 unit."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - *mk_guitar
            - *mk_amp
            - *mk_quote
            - *line_guitar
            - *line_amp
            - *q_submit
            - *q_reserve
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_gtr_id}", engineer_id: "${eng_a_id}", units_requested: 3, preorder_open_at: "2026-09-16T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_first_id: $.data.id }
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_amp_id}", engineer_id: "${eng_a_id}", units_requested: 1, preorder_open_at: "2026-09-16T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_second_id: $.data.id }
            - call: "POST /backorders/${bo_first_id}/start-sweep"
              payload: { pool_units: 1 }
              as: SalesEngineerOps
              captures: { bo_first_estimate: $.data.overcommit_estimate_units }
          trigger:
            - call: "POST /backorders/${bo_first_id}/finalize-allocation"
              payload: { pool_units: 1 }
              as: SalesEngineerOps
              captures: { bo_first_filled: $.data.units_filled, bo_first_status: $.data.status }
            - call: "GET /backorders/${bo_second_id}"
              payload: {}
              as: SalesEngineerOps
              captures: { bo_second_status_after: $.data.status }
          assert:
            - "Backorder.${bo_first_id}.overcommit_estimate_units == 1 after start-sweep (the preliminary variant grants every claim its own view of the pool)"
            - "Backorder.${bo_first_id}.units_filled == 1 and status == PARTIALLY_FILLED after finalize-allocation (hop 1: the pool is conserving, so 1 of 3 requested units own the shortfall)"
            - "Quote.${quote_a_id}.status == SUBMITTED and Quote.${quote_a_id}.reserved_at is null after the shortfall (hop 2)"
            - "Backorder.${bo_second_id}.status == CANCELLED after the shortfall (hop 3: the sibling claim is cancelled as a consequence of the quote unwind, not of the original finalize call)"
            - "the sum of units_filled across the quote's non-CANCELLED backorders == 1, so the final variant conserves the pool that the preliminary estimates over-committed"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: ship_instrument_fail_verdict_beats_quote_not_reserved
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_INSPECTION_NOT_PASSED]
          - errors[ERR_QUOTE_NOT_RESERVED]
        distinguishing_aspect: "A dual-failure request that violates both the safety precondition (inspection_overall FAIL) and the state precondition (owning Quote not RESERVED) returns the business_safety error ERR_INSPECTION_NOT_PASSED, proving the business_safety category outranks the state-externalized ERR_QUOTE_NOT_RESERVED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-17T00:00:00Z. A RESERVED quote with one guitar line, a serialized unit inspected to a FAIL verdict, then the quote amended back to SUBMITTED."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - *mk_guitar
            - *mk_amp
            - *mk_quote
            - *line_guitar
            - *q_submit
            - *q_reserve
            - call: "GET /quotes/${quote_a_id}"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_a_v2: $.data.version }
            - *mk_unit
            - call: "POST /instrument-units/${unit_a_id}/start-setup"
              payload: {}
              as: SetupTechnician
            - call: "POST /instrument-units/${unit_a_id}/complete-setup"
              payload: { action_height_mm: 1.50, relief_mm: 0.10, intonation_offset_cents: 40 }
              as: SetupTechnician
            - call: "POST /instrument-units/${unit_a_id}/record-inspection"
              payload: {}
              as: SetupTechnician
            - call: "POST /quotes/${quote_a_id}/amend"
