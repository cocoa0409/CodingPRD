  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_a_audit_score_drop_suspends_operator_withdraws_catalog_cancels_departure_and_refunds_booking
        grounds:
          - calculations.operator_safety_score
          - state_machines.TourOperator.APPROVED_to_SUSPENDED
          - state_machines.Excursion.PUBLISHED_to_WITHDRAWN
          - state_machines.ExcursionDeparture.SELLING_to_CANCELLED_OPERATIONAL
          - state_machines.Booking.fulfillment_status.TICKETED_to_CANCELLED_BY_LINE
          - state_machines.Booking.financial_status.CHARGED_to_REFUNDED
          - entities.RefundLedgerEntry
          - endpoints[POST /shore-excursions/operators/{operatorId}/safety-audits]
        distinguishing_aspect: |
          Depth-4 chain triggered by filing a SafetyAudit: audit -> safety_score 59 suspends the operator
          (hop 1) -> the operator's PUBLISHED excursion is WITHDRAWN (hop 2) -> that excursion's SELLING
          departure is CANCELLED_OPERATIONAL (hop 3) -> that departure's TICKETED booking is
          CANCELLED_BY_LINE, REFUNDED and goodwill-credited with seats returned (hop 4). Each link is
          caused solely by the preceding link; no hop is triggered by the request payload.
        test_recipe:
          setup:
            - "Cozumel is an ALONGSIDE port with one meeting point admitting 4 concurrent groups."
            - "One operator has two clean audits — 2026-06-01 raw 63 and 2026-07-01 raw 66 — giving safety_score 65, which clears the floor of 60, so it is APPROVED."
            - "That operator owns one PUBLISHED PREMIUM excursion at base_price_cents 12000 with one SELLING departure meeting 2026-09-15T09:00:00Z, capacity 40 split 25/15."
            - "One GOLD guest holds a party_size 4 PRE_CRUISE booking, TICKETED and CHARGED at quoted 48508 / charge 49963."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
