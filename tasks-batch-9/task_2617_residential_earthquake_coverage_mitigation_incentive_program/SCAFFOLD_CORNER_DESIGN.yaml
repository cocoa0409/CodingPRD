            - call: "POST /eqp/claims"
              payload: { policy_id: "${pol_id}", event_id: "${ev_id}", structural_damage_cents: 300000, cosmetic_damage_cents: 0, contents_damage_cents: 0, loss_of_use_cents: 0, expected_event_version: "${ev_v3}" }
              as: ClaimAdjuster
              as_user_id: "adj-1"
              captures: { closed_event_err: $.data.error_id }
          assert:
            - "${ev_year} == 2026 derived from occurred_at, ${ev_status} == \"DECLARED\"; ${redeclare_err} == \"ERR_EVENT_INVALID_STATE\" with HTTP 409"
            - "${early_levy_err} == \"ERR_EVENT_CAPACITY_NOT_EXHAUSTED\" with HTTP 409 - a DECLARED event has no shortfall to collect"
            - "${cl_status} == \"FNOL_RECEIVED\" and ${dup_claim_err} == \"ERR_DUPLICATE_CLAIM\" with HTTP 409 for the same (policy, event) pair"
            - "${cl_final} == 8000000 and ${cl_payable} == 8000000 (10,000,000 structural less the 2,000,000 deductible)"
            - "${open_claims_err} == \"ERR_EVENT_HAS_OPEN_CLAIMS\" with HTTP 409 - FINAL_ADJUSTED is not a terminal claim status"
            - "${unpaid_err} == \"ERR_CLAIM_NOT_FULLY_PAID\" with HTTP 409 while paid_cents is 0"
            - "${pay_status} == \"PAID\" with ${paid} == 8000000, and ${settled_err} == \"ERR_CLAIM_ALREADY_SETTLED\" with HTTP 409 - a fully settled claim cannot be reopened even though reopen_count is still 0"
            - "${cl_closed} == \"CLOSED\", ${ev_closed} == \"CLOSED\" and ${ev_agg} == 8000000"
            - "${closed_event_err} == \"ERR_EVENT_CLOSED\" with HTTP 409 - the closed-event rule outranks the duplicate-claim rule on the same call"

      - name: assessment_eligibility_and_lock_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_ASSESSABLE_INSURERS
          - errors.ERR_EVENT_ASSESSMENT_LOCKED
          - calculations.post_event_assessment
        distinguishing_aspect: "An insurer with market_share_pct 0 is not assessable, so an event with a real 90,000,000-cent shortfall is refused with ERR_NO_ASSESSABLE_INSURERS until an insurer with a positive share exists - and once the assessment is struck the allocations are frozen, so any call that would move the loss aggregate is refused with ERR_EVENT_ASSESSMENT_LOCKED."
        test_recipe:
          setup:
            - "The only insurer at levy time carries market_share_pct 0.0, which fails the assessable filter"
