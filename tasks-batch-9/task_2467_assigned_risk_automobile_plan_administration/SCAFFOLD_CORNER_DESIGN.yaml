      - name: independent_money_and_coverage_axes
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape == parallel
          - state_machines.Policy (two machines on one entity)
        excluded_because:
          difficulty_instance: policy_money_axis_and_coverage_axis_advance_independently
          rationale: "That instance already drives premium_settlement_status from PREMIUM_OUTSTANDING to PAID_IN_FULL and back while policy_status stays IN_FORCE, and asserts the combined state after each move, which is exactly the parallel-dimension claim."
      - name: carrier_exit_cascade_down_the_book
        claim_type: cascade_down
        grounds:
          - state_machines.Carrier.transitions[ACTIVE->EXIT_NOTICED].side_effects
          - endpoints[POST /plan/carriers/{id}/exit-notice].side_effects
        excluded_because:
          difficulty_instance: carrier_exit_cascades_through_policy_reassignment_into_receiver_overallocation
          rationale: "That instance verifies the full parent-to-children cascade - IN_FORCE policies to REASSIGNMENT_PENDING, successor assignments minted, only non-terminal children touched - and follows it three levels into the receiving carrier's posture."
      - name: suspension_cascade_touches_only_pending_children
        claim_type: conditional_cascade
        grounds:
          - state_machines.Complaint.transitions[FINDINGS_RECORDED->RESOLVED_UPHELD].side_effects
          - calculations.carrier_performance_and_posture
        excluded_because:
          difficulty_instance: second_upheld_complaint_cascades_into_suspension_rescission_and_requeue
          rationale: "That instance shows the side effect firing only for PENDING_ACCEPTANCE assignments while an ACCEPTED sibling of the same carrier is left alone, which is the conditional-cascade claim."
      - name: rescission_reverses_every_placement_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Assignment.transitions[PENDING_ACCEPTANCE->RESCINDED].side_effects
          - endpoints[POST /plan/assignments/{id}/rescission].side_effects
        excluded_because:
          difficulty_instance: assigned_risk_headcount_conserved_across_placement_and_rescission
          rationale: "That instance asserts the conserved headcount before, during and after the undo, including quota_variance_units and posture returning to their pre-placement values with no drift."
      - name: issuance_is_guarded_by_the_carriers_posture
        claim_type: guarded_transitions
        grounds:
          - state_machines.Assignment.transitions[ACCEPTED->POLICY_ISSUED].preconditions
          - errors[ERR_CARRIER_SUSPENDED]
        excluded_because:
          difficulty_instance: policy_issuance_depends_on_the_designated_carriers_posture
          rationale: "That instance is the cross-entity guard in full: the assignment is in a state that permits issuance and the payload is valid, yet the transition is refused purely because the designated Carrier's posture became SUSPENDED."
  - section: calculations
