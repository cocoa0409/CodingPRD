              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 1.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id, c_ver: $.data.version }
          trigger:
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { destination_altitude_feet: 500, depart_utc: "2026-08-10T00:00:00Z", return_utc: "2026-08-12T00:00:00Z", expected_contract_version: "${c_ver}" }
              as: IntakeCoordinator
              captures: { ta_1: $.data.id }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: BillingSpecialist
              captures: { c_ver2: $.data.version }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { destination_altitude_feet: 500, depart_utc: "2026-08-12T00:00:00Z", return_utc: "2026-08-13T00:00:00Z", expected_contract_version: "${c_ver2}" }
              as: IntakeCoordinator
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { destination_altitude_feet: 500, depart_utc: "2026-08-12T00:00:01Z", return_utc: "2026-08-13T00:00:00Z", expected_contract_version: "${c_ver2}" }
              as: IntakeCoordinator
              captures: { ta_2: $.data.id }
          assert:
            - "TravelAuthorization.${ta_1}: status == REQUESTED, trip_hours == 48, supply_cylinders_authorized == 7, closed interval [2026-08-10T00:00:00Z, 2026-08-12T00:00:00Z]"
            - "The second trigger call (depart exactly 2026-08-12T00:00:00Z) -> 409 ERR_TRAVEL_INTERVAL_CONFLICT: the closed intervals share the single instant 2026-08-12T00:00:00Z and no buffer is applied"
            - "The rejected call created nothing and bumped nothing: GET /home-oxygen/travel-authorizations?contract_id=${c_id} still reports total_count 1 and RentalContract.${c_id}.version is still ${c_ver2}"
            - "The third trigger call (depart 2026-08-12T00:00:01Z) reuses the SAME expected_contract_version ${c_ver2} and succeeds, which is only possible because the rejected write did not increment the contract version"
            - "TravelAuthorization.${ta_2}: status == REQUESTED, trip_hours == 23 (floor(86399 / 3600)), base_liters == 1380, reserve_liters == 276 (RESERVE_PCT_TIER_1 0.20 because 23 <= 24), required_liters == 1656, cylinders_raw == 3, handling_surcharge_cylinders == 0, supply_cylinders_authorized == 3"
            - "One second of separation is the entire difference between a rejected and an accepted authorization; the route-stop rule would have accepted the touching case, so the two resources genuinely use different interval semantics"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: assign_then_release_restores_branch_in_stock_pool
        grounds:
          - endpoints[DELETE /home-oxygen/placements/{placement_id}]
          - state_machines.Placement.RESERVED_to_REMOVED
          - state_machines.EquipmentUnit.RESERVED_to_IN_STOCK
          - calculations.equipment_selection
          - calculations.monthly_allowable_cents
          - entities.EquipmentUnit.fields.status
        distinguishing_aspect: |
          The conserved quantity is the Branch's IN_STOCK equipment pool: after two assignments and
          two releases the branch must hold exactly the same two IN_STOCK units it started with, and
          a re-assignment must re-select the identical unit — no unit is stranded in RESERVED and no
          placement row is silently reused.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) with exactly two IN_STOCK units: SC-1001 (STATIONARY_CONCENTRATOR, 5.0 LPM, next_pm 2027-06-01) and PC-2001 (PORTABLE_CONCENTRATOR, 3.0 LPM, next_pm 2027-06-01)."
            - "One ACTIVE patient (ACTIVE_AMBULATORY) with an ACTIVE certificate prescribing 3.0 LPM, 24 h/day, portable indicated, lifetime need."
            - "One RentalContract (COMPETITIVE_BID_SINGLE_PAYMENT, cap 36) in (billing ACCRUING, service PENDING_SETUP) with a RESERVED PRIMARY_STATIONARY placement on SC-1001 and a RESERVED PORTABLE placement on PC-2001; no setup has run, so monthly_allowable_cents is 0 and both units are RESERVED."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2001", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_port: $.data.id }
            - call: "POST /home-oxygen/patients"
