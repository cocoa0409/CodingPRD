          - entities.AutoshipItem.fields.verification_state
        distinguishing_aspect: "The expiry is a system transition keyed on the logical clock: moving the clock to the stamped instant drives VERIFIED to EXPIRED and marks the item, while one day earlier the same prescription stays usable."
