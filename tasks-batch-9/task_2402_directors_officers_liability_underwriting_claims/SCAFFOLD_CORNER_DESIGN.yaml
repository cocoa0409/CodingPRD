              payload: { variant: "INDICATIVE" }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2024, filed_date: "2025-01-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/submissions/${sub_id}/score"
