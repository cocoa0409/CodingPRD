      - name: maintenance_window_activation_requires_the_clock_inside_the_window
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MaintenanceWindow[SCHEDULED -> ACTIVE]
          - state_machines.MaintenanceWindow[ACTIVE -> COMPLETED]
          - errors.ERR_INVALID_STATE
          - validations[priority=11]
        distinguishing_aspect: "Three separate guards on one window, all ERR_INVALID_STATE (409): activating before window_start, completing a window that is still SCHEDULED, and activating a second time once it is ACTIVE. Only after the clock is advanced into the interval does activate succeed, proving the guard is a clock comparison rather than a creation-order rule."
        test_recipe:
          setup:
            - "The clock sits at the boot default 2026-08-01T00:00:00.000Z. AMBIENT zone A1 is OPERATIONAL and one maintenance window on A1 is scheduled for 2026-08-02T00:00:00.000Z to 2026-08-02T06:00:00.000Z — a full day in the future."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-02T06:00:00.000Z" }
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { window_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows/${window_id}/activate"
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_early: $.data.error_id }
            - call: "POST /maintenance-windows/${window_id}/complete"
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_not_active: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T01:00:00.000Z" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /maintenance-windows/${window_id}/activate"
              as: GridEngineer
              as_user_id: "engineer-1"
            - call: "POST /maintenance-windows/${window_id}/activate"
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_twice: $.data.error_id }
          assert:
            - "the first activate returns HTTP status == 409 and ${err_early} == ERR_INVALID_STATE"
            - "the complete returns HTTP status == 409 and ${err_not_active} == ERR_INVALID_STATE"
            - "after both rejections MaintenanceWindow.${window_id}.status == SCHEDULED and GridZone.${zone_amb}.status == OPERATIONAL"
            - "the activate after the clock move returns HTTP status == 200 with MaintenanceWindow.${window_id}.status == ACTIVE"
            - "GridZone.${zone_amb}.status == MAINTENANCE after the successful activate"
            - "the repeat activate returns HTTP status == 409 and ${err_twice} == ERR_INVALID_STATE"
            - "MaintenanceWindow.${window_id}.status is still ACTIVE and GridZone.${zone_amb}.status is still MAINTENANCE"

      - name: audit_hold_clears_to_operational_only_on_a_second_clean_recount
        claim_type: valid_transition
        grounds:
          - state_machines.GridZone[OPERATIONAL -> AUDIT_HOLD]
          - state_machines.GridZone[AUDIT_HOLD -> OPERATIONAL]
          - calculations.zone_inventory_accuracy
          - global_constants.ACCURACY_HOLD_THRESHOLD
        distinguishing_aspect: "The AUDIT_HOLD cycle is self-healing only because the first audit rewrites physical_units: counting 97 against a system figure of 100 scores 0.9700 (< 0.98) and holds the zone, and the identical recount of 97 now scores exactly 1.0000 against the rewritten system figure of 97 and releases it. An implementation that kept the original 100 as the system baseline would stay stuck in AUDIT_HOLD forever."
        test_recipe:
          setup:
            - "AMBIENT zone A1 (OPERATIONAL, accuracy scores null, last_audited_at null) holds a single SKU AMB-1 with physical_units 100."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /grid-zones/${zone_amb}/audit-counts"
              payload: { counts: [{ sku_id: "${sku_id}", counted_units: 97 }] }
              as: GridEngineer
              as_user_id: "engineer-1"
            - call: "POST /grid-zones/${zone_amb}/audit-counts"
              payload: { counts: [{ sku_id: "${sku_id}", counted_units: 97 }] }
              as: GridEngineer
              as_user_id: "engineer-1"
          assert:
            - "after the first audit: GridZone.${zone_amb}.status == AUDIT_HOLD"
            - "after the first audit: GridZone.${zone_amb}.accuracy_score_unit_weighted == 0.9700"
            - "after the first audit: GridZone.${zone_amb}.accuracy_score_sku_weighted == 0.9700"
            - "after the first audit: GridZone.${zone_amb}.last_audited_at == 2026-08-01T00:00:00.000Z"
            - "after the first audit: InventorySku.${sku_id}.last_count_system_units == 100, last_count_counted_units == 97, last_count_variance_units == 3"
            - "after the first audit: InventorySku.${sku_id}.physical_units == 97 and on_hand_units == 97"
            - "after the second audit: GridZone.${zone_amb}.status == OPERATIONAL"
            - "after the second audit: GridZone.${zone_amb}.accuracy_score_unit_weighted == 1.0000"
