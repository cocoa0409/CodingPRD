            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: TransportManager
              captures: { plan_status_1: $.data.plan_status, settle_1: $.data.settlement_status, pay_1: $.data.driver_pay_cents, delivered_1: $.data.delivered_cases }
            - call: "GET /fleet/tractors/${tractor_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { odo_1: $.data.odometer_miles, msp_1: $.data.miles_since_pm, tr_status_1: $.data.status }
            - call: "GET /fleet/replenishment-orders/${order_1}"
              payload: {}
              as: FleetPlanner
              captures: { o1_status_1: $.data.status }
            - call: "GET /fleet/stores/${store_id}"
              payload: {}
              as: FleetPlanner
              captures: { open_1: $.data.open_scheduled_cases, del_ledger_1: $.data.delivered_cases_total }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: TransportManager
              captures: { drv_drive_1: $.data.drive_minutes_used_today, drv_ytd_1: $.data.ytd_gross_cents }
            - call: "GET /fleet/pay-statements"
              payload: { trip_id: "${trip_id}", limit: 10, offset: 0 }
              as: PayrollAnalyst
              captures: { stmt_probe: "$.data[0].id" }
            - call: "GET /fleet/maintenance-work-orders"
              payload: { tractor_id: "${tractor_id}", limit: 10, offset: 0 }
              as: MaintenanceCoordinator
              captures: { wo_probe: "$.data[0].id" }
            - call: "POST /fleet/trip-stops/${stop_2}/complete"
              payload: { cases_handled: 200 }
              as: Driver
              as_user_id: "${driver_id}"
              captures: { stop_2_done: $.data.status }
            - call: "POST /fleet/trips/${trip_id}/complete"
              payload: { actual_drive_minutes: 160, actual_duty_minutes: 255 }
              as: TransportManager
              captures: { plan_status_2: $.data.plan_status, settle_2: $.data.settlement_status, pay_2: $.data.driver_pay_cents, delivered_2: $.data.delivered_cases }
            - call: "GET /fleet/tractors/${tractor_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { odo_2: $.data.odometer_miles, msp_2: $.data.miles_since_pm, tr_status_2: $.data.status }
            - call: "GET /fleet/stores/${store_id}"
              payload: {}
              as: FleetPlanner
              captures: { open_2: $.data.open_scheduled_cases, del_ledger_2: $.data.delivered_cases_total }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: TransportManager
              captures: { drv_drive_2: $.data.drive_minutes_used_today, drv_ytd_2: $.data.ytd_gross_cents }
          assert:
            - "${planned_miles} == 130 and ${planned_duty} == 255 (drive 160 + service 55 + 40, no break) with ${stop_2_status} == ARRIVED"
            - "${refused} == ERR_INVALID_STATE_TRANSITION with HTTP 409 - an ARRIVED stop is not terminal"
            - "LINK 0 unapplied: ${plan_status_1} == IN_PROGRESS, ${settle_1} == PENDING, ${pay_1} == 0 and ${delivered_1} == 400 (only the stop-level completion of stop 1, which is not part of this cascade)"
            - "LINK 1 unapplied: ${o1_status_1} == SCHEDULED - no order is marked DELIVERED by a refused close-out"
            - "LINK 2 unapplied: ${open_1} == 600 and ${del_ledger_1} == 0 - the store ledgers did not move"
            - "LINK 3 unapplied: ${drv_drive_1} == 0 and ${drv_ytd_1} == 0 - no HOS consumption and no earnings"
            - "LINK 4 unapplied: ${odo_1} == 50000 and ${msp_1} == 10000 - not one mile of odometer creep"
            - "LINK 5 unapplied: the statement listing reports total_count 0, so ${stmt_probe} resolves to nothing"
            - "LINK 6 unapplied: the work-order listing reports total_count 0, so ${wo_probe} resolves to nothing, and ${tr_status_1} == ASSIGNED - the equipment was not released"
            - "${stop_2_done} == COMPLETED, then ${plan_status_2} == COMPLETED, ${settle_2} == ACCRUED, ${pay_2} == 24400 and ${delivered_2} == 600"
            - "the same seven links now all fire: ${odo_2} == 50130, ${msp_2} == 10130, ${tr_status_2} == AVAILABLE, ${open_2} == 0, ${del_ledger_2} == 600, ${drv_drive_2} == 160 and ${drv_ytd_2} == 24400"

      - name: trip_aggregates_are_re_derived_after_a_middle_stop_is_deleted
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.trip_plan_totals
          - endpoints[DELETE /fleet/trips/{trip_id}/stops/{trip_stop_id}]
          - endpoints[POST /fleet/trips/{trip_id}/stops]
        distinguishing_aspect: "Nine Trip fields are derived from the stop set, and the deletion of a MIDDLE stop is the case that separates re-derivation from bookkeeping: the survivors are renumbered 1..2 while keeping their own instants and per-segment miles, every aggregate is recomputed from the survivors alone, and appending a FUEL stop afterwards adds its fixed 25 service minutes rather than the 20 minutes its own window spans."
        test_recipe:
          setup:
            - "TRIP-C5 is DRAFT with three DELIVERY stops at S-6250 (600 cases/hour): 300 cases (service ceil(30)+15 = 45), 600 cases (75) and 120 cases (ceil(12)+15 = 27). Drive 60/60/30, miles 50/60/40, all loaded."
