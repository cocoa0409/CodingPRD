            - "after the completion: Merchant.${m}.escrowed_fee_cents == 0, Merchant.${m}.recognized_fee_cents == 850, Merchant.${m}.released_fee_cents == 812"
            - "escrowed_fee_cents + recognized_fee_cents + released_fee_cents == 1662 at every step"
            - "Merchant.${m}.settlement_variance_cents == -33"
            - "DeliveryOrder.${o}.settled_fee_cents == 817"
            - "Merchant.${m}.exception_count == 0"
