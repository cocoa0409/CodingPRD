        distinguishing_aspect: "A different pair from the safety-versus-referential conflict: priority 11 (category REMEMBRANCE_EVENT not in allowed_categories [COUNSELING]) versus priority 14 (awarded_cents 5000 against a required 11446). The response must be ERR_CATEGORY_NOT_ALLOWED (422)."
