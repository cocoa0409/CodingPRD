              payload: { item_code: "CLOTH", display_name: "Cloths", initial_on_hand: 200, reorder_threshold: 20 }
              as: EVSAdministrator
            - call: "POST /evs/staff"
              payload: { employee_code: "T1", display_name: "Tech One", capabilities: ["CLEAN"], certifications: ["ISO_CERT"] }
              as: EVSAdministrator
              captures: { t1: $.data.id }
            - call: "POST /evs/staff"
              payload: { employee_code: "T2", display_name: "Tech Two", capabilities: ["CLEAN"], certifications: [] }
              as: EVSAdministrator
              captures: { t2: $.data.id }
            - call: "POST /evs/staff/${t1}/clock-in"
