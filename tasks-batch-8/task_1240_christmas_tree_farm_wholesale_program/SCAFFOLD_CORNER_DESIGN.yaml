            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 100, H_6_7: 0, H_7_8: 0, H_8_9: 100, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_8_9", quantity: 100, unit_price_cents: 700 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { oa: $.data.id } }
