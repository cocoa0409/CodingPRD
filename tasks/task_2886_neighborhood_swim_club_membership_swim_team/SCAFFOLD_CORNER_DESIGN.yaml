      - name: valid_transition_party_rejection_refunds_the_charge_in_full
        claim_type: valid_transition
        grounds:
          - state_machines[PartyReservation].REQUESTED_to_REJECTED
          - endpoints[POST /swim-club/party-reservations/{id}/transitions]
          - entities.Household.fields.party_charges_owed_cents
          - entities.Household.fields.account_credit_cents
          - entities.PartyReservation.fields.refunded_cents
        distinguishing_aspect: |
          REQUESTED -> REJECTED is the one party edge whose refund is unconditionally full, with no
          CANCEL_FULL_REFUND_DAYS test at all - unlike CANCELLED_BY_HOST, which halves inside the
          window. The corner is that a refund is a REVERSAL, not a payment: it moves the money to
          account_credit_cents instead of deleting it, and refunded_cents on the reservation records
          the full amount while total_charge_cents stays where it was.
