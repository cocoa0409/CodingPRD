# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2398 Drive-Thru Speed-of-Service & Timer
#
# Every instance grounds only in SCAFFOLD.yaml §1.1–§1.6 of this same task
# directory. Shared fixture conventions used by every setup_api_calls chain:
#
#   * The four VolumeTierPolicy bands are ALWAYS created first, before any
#     Restaurant, because POST /drive-thru/restaurants derives volume_tier from
#     cars_per_hour_effective == 0.0 and aborts with ERR_TIER_POLICY_INCOMPLETE
#     when no band contains that value:
#       TIER_1  [0, 6)    relief 0.00  min_oot 0  bias ALTERNATE
#       TIER_2  [6, 12)   relief 0.03  min_oot 1  bias LONGEST_WAIT
#       TIER_3  [12, 18)  relief 0.07  min_oot 2  bias ACCURACY_FIRST
#       TIER_4  [18, inf) relief 0.12  min_oot 3  bias LONGEST_WAIT
#   * Operator is entity_backed:Restaurant  -> as_user_id is the Restaurant id.
#   * ShiftLeader is entity_backed:StaffMember -> as_user_id is a StaffMember id
#     of the target restaurant.
#   * ProgramAdmin / AccuracyAuditor are opaque; as_user_id is omitted unless an
#     audit id is pinned. MarketCoach is opaque but pinned ("coach-1"/"coach-2")
#     wherever the segregation-of-duties rule (§1.4 priority 16) is in play.
#   * The logical clock starts at 2026-08-01T00:00:00Z and is only ever advanced
#     by POST /drive-thru/_clock/set_current_utc. Every daypart used below is
#     LUNCH [660, 840) so clock 11:00:00Z-13:59:59Z satisfies §1.4 priority 19.
#   * Base LUNCH segment targets are 25 / 95 / 40 / 75 (total_target_seconds 235).
#   * POST /drive-thru/forecast-overrides and POST /drive-thru/throughput-reports
#     both carry expected_restaurant_version AND both bump Restaurant.version, so
#     each of them is immediately preceded by GET /drive-thru/restaurants/{id}
#     capturing a fresh $.data.version.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: oot_requirement_variant_divergence_on_staffing_basis
        grounds:
          - calculations.oot_requirement
          - calculations.restaurant_rollup_recompute
          - calculations.active_override_selection
          - entities.Restaurant.fields.staffing_basis
          - entities.Restaurant.fields.cars_per_hour_effective
          - entities.Restaurant.fields.required_oot_count
        distinguishing_aspect: |
          Variant domain is STAFFING (Restaurant + ForecastOverride + VolumeTierPolicy): on one
          frozen set of two CLOSED TimerLoop rows the observed variant reads cars_per_hour_effective
          12.0 -> TIER_3 -> required_oot_count 3 (min_oot 2 plus the DUAL_PARALLEL lane bump), while
          the forecast_adjusted variant scales the same 12.0 by the APPLIED override's -0.50 to 6.0
          -> TIER_2 -> required_oot_count 1 (min_oot 1, lane bump extinguished below 12 cph).
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands exist (TIER_1..TIER_4 as documented in the file header)."
            - "One DUAL_PARALLEL Restaurant with merge_slots_capacity 2, labor_minutes_budget 600, staffing_basis OBSERVED."
            - "One oot_certified StaffMember and one ACTIVE LUNCH DaypartProfile with targets 25/95/40/75."
            - "Two TimerLoop rows are driven all the way to CLOSED: loop A departs 11:04:10Z, loop B departs 11:04:20Z, so cars_closed_trailing == 2 and cars_per_hour_observed == 12.0."
            - "One ForecastOverride (WEATHER, projected_cars_delta_pct -0.50, effective 11:00:00Z..13:00:00Z) is APPLIED, so active_override_selection finds it at clock 11:04:20Z."
            - "Restaurant.staffing_basis is still OBSERVED, so the observed variant is the one in force."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_2", cars_per_hour_floor: 6, cars_per_hour_ceiling: 12, target_relief_pct: 0.03, min_oot_count: 1, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_3", cars_per_hour_floor: 12, cars_per_hour_ceiling: 18, target_relief_pct: 0.07, min_oot_count: 2, merge_award_bias: "ACCURACY_FIRST" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_4", cars_per_hour_floor: 18, target_relief_pct: 0.12, min_oot_count: 3, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Peachtree Dual Parallel", store_number: "S-2398-A", lane_config: "DUAL_PARALLEL", merge_slots_capacity: 2, labor_minutes_budget: 600, staffing_basis: "OBSERVED" }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Dana Ruiz", oot_certified: true, window_certified: true, max_consecutive_deployment_minutes: 90 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "LANE_A" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:20Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:01:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/order-complete"
              payload: { order_items_count: 3 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/restaurants/${r_id}/merge-award"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { slot1_id: $.data.id }
            - call: "POST /drive-thru/merge-slots/${slot1_id}/commit"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:02:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/window-arrive"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:10Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l1_id}/depart"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "LANE_B" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:15Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l2_id}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:16Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l2_id}/order-complete"
              payload: { order_items_count: 2 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/restaurants/${r_id}/merge-award"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { slot2_id: $.data.id }
            - call: "POST /drive-thru/merge-slots/${slot2_id}/commit"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:18Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l2_id}/window-arrive"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:20Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${l2_id}/depart"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rv1: $.data.version }
            - call: "POST /drive-thru/forecast-overrides"
              payload: { restaurant_id: "${r_id}", source: "WEATHER", effective_start_at: "2026-08-01T11:00:00Z", effective_end_at: "2026-08-01T13:00:00Z", projected_cars_delta_pct: -0.50, expected_restaurant_version: "${rv1}" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { fo_id: $.data.id }
            - call: "POST /drive-thru/forecast-overrides/${fo_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /drive-thru/forecast-overrides/${fo_id}/apply"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
          trigger:
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { tier_observed: $.data.volume_tier, oot_observed: $.data.required_oot_count, cph_eff_observed: $.data.cars_per_hour_effective }
            - call: "PATCH /drive-thru/restaurants/${r_id}"
              payload: { staffing_basis: "FORECAST_ADJUSTED" }
              as: Operator
              as_user_id: "${r_id}"
          assert:
            - "Before the PATCH: ${cph_eff_observed} == 12.0, ${tier_observed} == TIER_3, ${oot_observed} == 3 (observed variant: min_oot 2 + DUAL_PARALLEL lane bump 1 + accuracy bump 0)"
            - "PATCH response HTTP 200; Restaurant.${r_id}.staffing_basis == FORECAST_ADJUSTED"
            - "Restaurant.${r_id}.cars_closed_trailing == 2 (unchanged — no TimerLoop row moved)"
            - "Restaurant.${r_id}.cars_per_hour_observed == 12.0 (unchanged by the variant switch)"
            - "Restaurant.${r_id}.cars_per_hour_effective == 6.0 (forecast_adjusted variant: round_half_up(12.0 * (1 + -0.50), 1))"
            - "Restaurant.${r_id}.volume_tier == TIER_2"
            - "Restaurant.${r_id}.required_oot_count == 1 (min_oot 1 + lane bump 0 because 6.0 < DUAL_PARALLEL_BUMP_CPH 12 + accuracy bump 0)"
            - "Restaurant.${r_id}.deployed_oot_count == 0 and Restaurant.${r_id}.service_posture == SURGE"
            - "Variant delta on identical stored rows: required_oot_count 3 -> 1 and volume_tier TIER_3 -> TIER_2"
            - "TimerLoop.${l2_id}.served_after_loop_id == ${l1_id} (slot2 followed slot1 in sequence_index order)"

      - name: report_variant_divergence_provisional_vs_final
        grounds:
          - calculations.report_attainment_metrics
          - calculations.coaching_pool_points
          - entities.ThroughputReport.fields.metric_basis
          - entities.ThroughputReport.fields.window_tier
          - entities.ThroughputReport.fields.attainment_band
          - concurrency_rules[report-create-stale-restaurant]
        distinguishing_aspect: |
          Variant domain is REPORTING (ThroughputReport over TimerLoop + AccuracyIncident), a
          different entity domain from the staffing variant above: over one identical 600-second
          window the provisional variant anchors on depart_at and drops the REMAKE_OPEN loop
          (cars_served 1, metric_basis TOTAL, window_tier TIER_2, attainment 105.22, GREEN, 4 points)
          while the final variant anchors on arrive_at and folds the 20-second remake penalty in
          (cars_served 2, metric_basis ADJUSTED_TOTAL, window_tier TIER_3, attainment 94.44, AMBER,
          1 point).
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant; one StaffMember; one ACTIVE LUNCH DaypartProfile (25/95/40/75)."
            - "Loop A: arrive 11:00:00Z, greet 11:00:20Z, order-complete 11:01:00Z, window-arrive 11:02:00Z, depart 11:03:50Z -> total_seconds 230, target_total_seconds_pinned 235 (TIER_1 relief 0.00), accuracy_state VERIFIED."
            - "Loop B: arrive 11:03:50Z (restaurant is TIER_2 by then, relief 0.03 -> target_total_seconds_pinned 242), greet 11:04:10Z, order-complete 11:05:00Z, window-arrive 11:06:00Z, depart 11:08:40Z -> total_seconds 290."
            - "A WRONG_SIZE AccuracyIncident is logged against the already-CLOSED loop B (late guest complaint): severity MINOR, penalty_seconds 20, remake_cost_cents 350, loop B accuracy_state VERIFIED -> REMAKE_OPEN, adjusted_total_seconds 310."
            - "Clock advanced to 11:10:00Z so the reporting window [11:00:00Z, 11:10:00Z) is entirely in the past."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_2", cars_per_hour_floor: 6, cars_per_hour_ceiling: 12, target_relief_pct: 0.03, min_oot_count: 1, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_3", cars_per_hour_floor: 12, cars_per_hour_ceiling: 18, target_relief_pct: 0.07, min_oot_count: 2, merge_award_bias: "ACCURACY_FIRST" }
              as: ProgramAdmin
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_4", cars_per_hour_floor: 18, target_relief_pct: 0.12, min_oot_count: 3, merge_award_bias: "LONGEST_WAIT" }
              as: ProgramAdmin
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Ponce Single Lane", store_number: "S-2398-B", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 600 }
              as: ProgramAdmin
              captures: { r_id: $.data.id }
            - call: "POST /drive-thru/staff-members"
              payload: { restaurant_id: "${r_id}", full_name: "Ivy Chen", oot_certified: true, window_certified: true, max_consecutive_deployment_minutes: 90 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles"
              payload: { restaurant_id: "${r_id}", daypart: "LUNCH", start_minute: 660, end_minute: 840, greet_target_seconds: 25, order_target_seconds: 95, pull_forward_target_seconds: 40, window_target_seconds: 75 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { dp_id: $.data.id }
            - call: "POST /drive-thru/daypart-profiles/${dp_id}/activate"
              payload: {}
              as: Operator
              as_user_id: "${r_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { la_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:20Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${la_id}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:01:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${la_id}/order-complete"
              payload: { order_items_count: 3 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:02:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${la_id}/window-arrive"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:03:50Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${la_id}/depart"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/timer-loops"
              payload: { restaurant_id: "${r_id}", daypart_profile_id: "${dp_id}", lane: "SINGLE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:04:10Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${lb_id}/greet"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:05:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${lb_id}/order-complete"
              payload: { order_items_count: 5 }
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:06:00Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${lb_id}/window-arrive"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:08:40Z" }
              as: ProgramAdmin
            - call: "POST /drive-thru/timer-loops/${lb_id}/depart"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
            - call: "POST /drive-thru/accuracy-incidents"
              payload: { timer_loop_id: "${lb_id}", logged_by_staff_id: "${sl_id}", incident_type: "WRONG_SIZE" }
              as: ShiftLeader
              as_user_id: "${sl_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:10:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rv1: $.data.version }
            - call: "POST /drive-thru/throughput-reports"
              payload: { restaurant_id: "${r_id}", window_start_at: "2026-08-01T11:00:00Z", window_end_at: "2026-08-01T11:10:00Z", variant: "PROVISIONAL", expected_restaurant_version: "${rv1}" }
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { rep_prov_id: $.data.id }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              captures: { rv2: $.data.version }
            - call: "POST /drive-thru/throughput-reports"
              payload: { restaurant_id: "${r_id}", window_start_at: "2026-08-01T11:00:00Z", window_end_at: "2026-08-01T11:10:00Z", variant: "FINAL", expected_restaurant_version: "${rv2}" }
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { rep_final_id: $.data.id }
          assert:
            - "TimerLoop.${la_id}.total_seconds == 230 and TimerLoop.${la_id}.target_total_seconds_pinned == 235 and TimerLoop.${la_id}.accuracy_state == VERIFIED"
            - "TimerLoop.${lb_id}.total_seconds == 290 and TimerLoop.${lb_id}.target_total_seconds_pinned == 242 and TimerLoop.${lb_id}.adjusted_total_seconds == 310 and TimerLoop.${lb_id}.accuracy_state == REMAKE_OPEN"
            - "AccuracyIncident.${inc_id}.severity == MINOR and AccuracyIncident.${inc_id}.penalty_seconds == 20 and AccuracyIncident.${inc_id}.remake_cost_cents == 350"
            - "ThroughputReport.${rep_prov_id}.metric_basis == TOTAL"
            - "ThroughputReport.${rep_prov_id}.cars_served == 1 (loop B excluded: accuracy_state REMAKE_OPEN)"
            - "ThroughputReport.${rep_prov_id}.cars_per_hour == 6.0 and ThroughputReport.${rep_prov_id}.window_tier == TIER_2"
            - "ThroughputReport.${rep_prov_id}.avg_metric_seconds == 230.0 and ThroughputReport.${rep_prov_id}.mean_pinned_target_seconds == 235"
            - "ThroughputReport.${rep_prov_id}.target_total_seconds_effective == 242 and ThroughputReport.${rep_prov_id}.attainment_pct == 105.22 and ThroughputReport.${rep_prov_id}.attainment_band == GREEN"
            - "ThroughputReport.${rep_prov_id}.open_remake_incident_count == 1 and ThroughputReport.${rep_prov_id}.coaching_pool_points == 4"
            - "ThroughputReport.${rep_final_id}.metric_basis == ADJUSTED_TOTAL"
            - "ThroughputReport.${rep_final_id}.cars_served == 2 (both loops arrived inside the window; REMAKE_OPEN is included)"
            - "ThroughputReport.${rep_final_id}.cars_per_hour == 12.0 and ThroughputReport.${rep_final_id}.window_tier == TIER_3"
            - "ThroughputReport.${rep_final_id}.avg_metric_seconds == 270.0 and ThroughputReport.${rep_final_id}.mean_pinned_target_seconds == 238.5"
            - "ThroughputReport.${rep_final_id}.target_total_seconds_effective == 255 and ThroughputReport.${rep_final_id}.attainment_pct == 94.44 and ThroughputReport.${rep_final_id}.attainment_band == AMBER"
            - "ThroughputReport.${rep_final_id}.coaching_pool_points == 1"
            - "Variant delta on identical stored rows: cars_served 1 -> 2, window_tier TIER_2 -> TIER_3, attainment_band GREEN -> AMBER, coaching_pool_points 4 -> 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: loop_target_pinning_per_segment_rounding_order
        grounds:
          - calculations.loop_target_pinning
          - calculations.active_override_selection
          - entities.TimerLoop.fields.target_total_seconds_pinned
          - entities.ForecastOverride.fields.target_relief_pct_override
        distinguishing_aspect: |
          Mode (b) — ROUNDING ORDER MATTERS: with combined_relief 0.09 (tier_relief 0.00 from TIER_1
          plus the override's explicit target_relief_pct_override 0.09), relieving and rounding each
          of the four segment targets first and summing afterwards yields 27 + 104 + 44 + 82 == 257,
          whereas summing the raw targets first (235) and rounding once yields 256; the pinned field
          must be 257.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant with no TimerLoop rows, so cars_per_hour_effective is 0.0 and volume_tier is TIER_1 (target_relief_pct 0.00)."
            - "One ACTIVE LUNCH DaypartProfile with targets 25 / 95 / 40 / 75 (total_target_seconds 235)."
            - "One APPLIED ForecastOverride (LOCAL_EVENT, projected_cars_delta_pct 0.00, target_relief_pct_override 0.09) covering 11:00:00Z..13:00:00Z, so active_override_selection returns it at clock 11:00:00Z and override_relief is the explicit 0.09 rather than a derived value."
            - "Clock at 11:00:00Z (minute-of-day 660, inside the LUNCH half-open window)."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
