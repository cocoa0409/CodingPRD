              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 4.10, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 4.05, weight_pct: 0.10 }], inclusion_criteria_met_count: 3, expected_document_version: "${doc_v}", reprint_tier: "NONE", permitted_marketing_use: "NO_USE", reprint_copies_authorized: 0 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /research/vendor-inclusions/${inc_id}/finalize"
