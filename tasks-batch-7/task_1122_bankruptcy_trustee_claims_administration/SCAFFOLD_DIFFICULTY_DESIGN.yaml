  # =====================================================================
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics
  # reachable via DIFFERENT endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sale_minimum_price_exact_equality_accepted
        grounds:
          - calculations.sale_minimum_price
          - errors[ERR_BELOW_MINIMUM_PRICE]
        distinguishing_aspect: |
          Metric = hammer price in cents; endpoint = POST /trustee/sales/{id}/
          approve. scheduled_value 800,000 -> floor half = 400,000; sale_costs
          410,000 -> min_gross = max(410,000, 400,000) = 410,000. A hammer of
          exactly 410,000 must be APPROVED (>= semantics) while 409,999 must
          fail — a one-cent boundary.
        test_recipe:
          setup:
            - "Case in LIQUIDATION; two assets each MARKED_FOR_SALE with scheduled_value 800,000; two PROPOSED sales with sale_costs 410,000 and hammer 410,000 (sale 1) / 409,999 (sale 2)"
