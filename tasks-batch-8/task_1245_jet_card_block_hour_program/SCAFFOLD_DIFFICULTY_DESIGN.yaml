  # ---------------------------------------------------------------------------
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: blackout_window_blocks_trip_departure
        grounds:
          - entities.BlackoutWindow
          - "validations[priority=9]"
        distinguishing_aspect: |
          Interval semantics: half-open [window_start_utc, window_end_utc).
          Resource: BlackoutWindow on (program, category). Trip departure
          inside window → ERR_BLACKOUT_PERIOD. Adjacent trip outside the
          half-open boundary (== window_end_utc) is allowed.
        test_recipe:
          setup:
            - "BlackoutWindow [2026-02-01, 2026-02-10) for LIGHT"
            - "Trip A requested for 2026-02-05 (inside) → DENIED"
            - "Trip B requested for 2026-02-10T00:00:00Z (== end, half-open) → allowed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
