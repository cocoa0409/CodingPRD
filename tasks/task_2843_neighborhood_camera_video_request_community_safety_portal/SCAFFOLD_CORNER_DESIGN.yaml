# =============================================================================
# §1.9 Scaffold Corner Design — task_2843 Neighborhood Camera Video Request &
# Community Safety Portal
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against this scaffold's §1.1-§1.7 surface and emits one instance per
# applicable claim row. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN
# (§1.8) appear as `excluded_because:` stubs naming the covering instance.
#
# Fixture conventions shared with §1.8:
#   * logical clock is pinned with POST /_clock/set_current_utc before anything
#     time-sensitive; the portal's startup default is 2026-08-01T00:00:00Z.
#   * PlatformAdmin acts as "admin-1" (and "admin-2" where a duty must be
#     separated); Moderators are "mod-1" (opens) and "mod-2" (decides).
#   * AgencyAdmin's X-User-ID is the Agency.id; Officer's is the Officer.id;
#     Resident's is the Resident.id.
#   * every expected_*_version is captured from a server response immediately
#     before the guarded write, never written as a literal.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: resident_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - endpoints[POST /neighborhood-safety/residents]
          - entities.Resident.fields.status
          - entities.Resident.fields.fatigue_state
          - entities.Resident.fields.post_privilege_state
        distinguishing_aspect: "A single POST with every declared input field returns 201 and a Resident whose system and computed fields are already at their declared initial values (status ACTIVE, data_sharing_opt_out false, fatigue_state NORMAL, post_privilege_state UNRESTRICTED, all seven counters 0, version 1)."
        test_recipe:
          setup:
            - "Empty portal; the logical clock is pinned at 2026-08-12T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Mina Okafor", email: "mina@example.test", home_x_m: 120, home_y_m: -40, alert_radius_m: 900, notification_budget_per_day: 8, notification_mute_enabled: false }
              as: Anonymous
              captures: { res_id: "$.data.id", res_status: "$.data.status", res_optout: "$.data.data_sharing_opt_out", res_fatigue: "$.data.fatigue_state", res_priv: "$.data.post_privilege_state", res_sent: "$.data.notifications_sent_today", res_life: "$.data.lifetime_shared_footage_seconds", res_version: "$.data.version" }
          assert:
            - "the response status code is 201"
            - "${res_status} == ACTIVE"
            - "${res_optout} == false"
            - "${res_fatigue} == NORMAL"
            - "${res_priv} == UNRESTRICTED"
            - "${res_sent} == 0"
            - "${res_life} == 0"
            - "${res_version} == 1"
            - "Resident.${res_id}.alert_radius_m == 900"
            - "Resident.${res_id}.notification_budget_per_day == 8"
            - "Resident.${res_id}.home_x_m == 120 and Resident.${res_id}.home_y_m == -40"
            - "Resident.${res_id}.accuracy_strike_count == 0 and Resident.${res_id}.discrimination_strike_count == 0 and Resident.${res_id}.total_strike_score == 0"

      - name: resident_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Resident.fields.alert_radius_m
          - entities.Resident.fields.notification_budget_per_day
          - entities.Resident.fields.notification_mute_enabled
          - endpoints[POST /neighborhood-safety/residents]
        distinguishing_aspect: "Omitting the three optional notification inputs yields exactly the declared defaults alert_radius_m 800, notification_budget_per_day 6 and notification_mute_enabled false — the server must not substitute 0 or null for an omitted optional integer."
        test_recipe:
          setup:
            - "Empty portal; the logical clock is pinned at 2026-08-12T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Default Dana", email: "dana@example.test", home_x_m: 0, home_y_m: 0 }
              as: Anonymous
              captures: { res_id: "$.data.id", res_radius: "$.data.alert_radius_m", res_budget: "$.data.notification_budget_per_day", res_mute: "$.data.notification_mute_enabled" }
          assert:
            - "the response status code is 201"
            - "${res_radius} == 800"
            - "${res_budget} == 6"
            - "${res_mute} == false"
            - "Resident.${res_id}.status == ACTIVE"

      - name: agency_creation_applies_configuration_defaults
        claim_type: defaults
        grounds:
          - entities.Agency.fields.min_device_threshold
          - entities.Agency.fields.max_open_requests
          - entities.Agency.fields.period_request_quota
          - entities.Agency.fields.post_share_retention_days
          - entities.Agency.fields.justification_min_chars
          - endpoints[POST /neighborhood-safety/agencies]
        distinguishing_aspect: "An agency created with only name and jurisdiction_code carries the five declared policy defaults (min_device_threshold 5, max_open_requests 3, period_request_quota 20, post_share_retention_days 30, justification_min_chars 80) and starts in status PENDING_REVIEW, not ONBOARDED."
        test_recipe:
          setup:
            - "Empty portal; the logical clock is pinned at 2026-08-12T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Default Sheriff Office", jurisdiction_code: "DS-001" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id", ag_status: "$.data.status", ag_min: "$.data.min_device_threshold", ag_open: "$.data.max_open_requests", ag_quota: "$.data.period_request_quota", ag_ret: "$.data.post_share_retention_days", ag_just: "$.data.justification_min_chars" }
          assert:
            - "the response status code is 201"
            - "${ag_status} == PENDING_REVIEW"
            - "${ag_min} == 5"
            - "${ag_open} == 3"
            - "${ag_quota} == 20"
            - "${ag_ret} == 30"
            - "${ag_just} == 80"
            - "Agency.${ag_id}.open_request_count == 0 and Agency.${ag_id}.requests_submitted_count == 0"
            - "Agency.${ag_id}.latest_report_id == null"

      - name: resident_creation_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Resident.fields.status
          - entities.Resident.fields.notifications_sent_today
          - entities.Resident.fields.data_sharing_opt_out
          - endpoints[POST /neighborhood-safety/residents]
        distinguishing_aspect: "Client-supplied values for fields whose source is system or computed are ignored rather than honoured: a create body carrying status DEACTIVATED, data_sharing_opt_out true and notifications_sent_today 99 still returns 201 with status ACTIVE, data_sharing_opt_out false and notifications_sent_today 0, because those keys are not in the endpoint's declared input."
        test_recipe:
          setup:
            - "Empty portal; the logical clock is pinned at 2026-08-12T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Sneaky Sam", email: "sam@example.test", home_x_m: 10, home_y_m: 10, status: "DEACTIVATED", data_sharing_opt_out: true, notifications_sent_today: 99 }
              as: Anonymous
              captures: { res_id: "$.data.id", res_status: "$.data.status", res_optout: "$.data.data_sharing_opt_out", res_sent: "$.data.notifications_sent_today" }
          assert:
            - "the response status code is 201"
            - "${res_status} == ACTIVE"
            - "${res_optout} == false"
            - "${res_sent} == 0"
            - "Resident.${res_id}.version == 1"

      - name: device_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /neighborhood-safety/devices/{id}]
          - endpoints[POST /neighborhood-safety/devices]
          - entities.Device.fields.retention_window_days
        distinguishing_aspect: "GET /devices/{id} returns exactly the row the create call stored — same label, same grid position, same retention_window_days — with status ACTIVE, auto_decline_source NONE and both solicitation counters at 0."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; one resident owns one camera."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Owner One", email: "owner1@example.test", home_x_m: 0, home_y_m: 10 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Porch camera", grid_x_m: 0, grid_y_m: 10, retention_window_days: 45 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { dev_id: "$.data.id" }
          trigger:
            - call: "GET /neighborhood-safety/devices/${dev_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { g_label: "$.data.label", g_x: "$.data.grid_x_m", g_ret: "$.data.retention_window_days", g_status: "$.data.status", g_src: "$.data.auto_decline_source", g_pending: "$.data.pending_solicitation_count", g_recv: "$.data.solicitations_received_count" }
          assert:
            - "the response status code is 200"
            - "${g_label} == Porch camera"
            - "${g_x} == 0"
            - "${g_ret} == 45"
            - "${g_status} == ACTIVE"
            - "${g_src} == NONE"
            - "${g_pending} == 0"
            - "${g_recv} == 0"
            - "Device.${dev_id}.auto_decline_requests == false"

      - name: device_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /neighborhood-safety/devices]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three cameras owned by one resident, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 / offset 2 returns 1 row with total_count 3 and has_more false — total_count counts the filtered set, not the returned page."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; resident R1 owns three cameras at (0,10), (0,20) and (0,30); a second resident R2 owns one camera at (900,900) that the owner_resident_id filter must exclude."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Pager One", email: "pager1@example.test", home_x_m: 0, home_y_m: 10 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Pager Two", email: "pager2@example.test", home_x_m: 900, home_y_m: 900 }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Cam A", grid_x_m: 0, grid_y_m: 10 }
              as: Resident
              as_user_id: "${r1_id}"
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Cam B", grid_x_m: 0, grid_y_m: 20 }
              as: Resident
              as_user_id: "${r1_id}"
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Cam C", grid_x_m: 0, grid_y_m: 30 }
              as: Resident
              as_user_id: "${r1_id}"
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r2_id}", label: "Other Cam", grid_x_m: 900, grid_y_m: 900 }
              as: Resident
              as_user_id: "${r2_id}"
          trigger:
            - call: "GET /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", limit: 2, offset: 0 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p1_total: "$.meta.total_count", p1_more: "$.meta.has_more", p1_first: "$.data[0].id" }
            - call: "GET /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", limit: 2, offset: 2 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { p2_total: "$.meta.total_count", p2_more: "$.meta.has_more", p2_first: "$.data[0].id" }
          assert:
            - "the first page returns 200 with exactly 2 elements in data"
            - "${p1_total} == 3"
            - "${p1_more} == true"
            - "the second page returns 200 with exactly 1 element in data"
            - "${p2_total} == 3"
            - "${p2_more} == false"
            - "${p1_first} != ${p2_first}"

      - name: resident_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors.ERR_RESIDENT_NOT_FOUND
          - endpoints[GET /neighborhood-safety/residents/{id}]
        distinguishing_aspect: "A GET against a well-formed but unknown resident id returns 404 ERR_RESIDENT_NOT_FOUND — the collection segment `residents` selects which not-found error is raised, per validations[priority=3]."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; one real resident exists so the failure cannot be an empty-table artefact."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Real Rita", email: "rita@example.test", home_x_m: 5, home_y_m: 5 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "GET /neighborhood-safety/residents/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the response status code is 404"
            - "${err_id} == ERR_RESIDENT_NOT_FOUND"
            - "GET /neighborhood-safety/residents/${r1_id} still returns 200 for the same caller"

      - name: device_create_missing_required_grid_y_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
          - entities.Device.fields.grid_y_m
          - endpoints[POST /neighborhood-safety/devices]
        distinguishing_aspect: "Omitting the required input field grid_y_m returns 400 ERR_INVALID_REQUEST and creates no Device row, even though every other required field is present and the optional fields carry defaults."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; resident R1 exists and owns no camera yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Req Rae", email: "rae@example.test", home_x_m: 0, home_y_m: 10 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "Half a camera", grid_x_m: 0 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", limit: 10, offset: 0 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { dev_total: "$.meta.total_count" }
          assert:
            - "the create response status code is 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "${dev_total} == 0"

      - name: officer_create_with_unknown_agency_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_AGENCY_NOT_FOUND
          - endpoints[POST /neighborhood-safety/officers]
          - entities.Officer.fields.agency_id
        distinguishing_aspect: "A body-supplied foreign key is validated as strictly as a path id: creating an Officer whose agency_id names no Agency row returns 404 ERR_AGENCY_NOT_FOUND, and no Officer row is created."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; one ONBOARDED agency exists so the rejection is about the supplied id, not about an empty table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3, max_open_requests: 3, period_request_quota: 20, post_share_retention_days: 30, justification_min_chars: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", badge_number: "B-999", full_name: "Ghost Officer", duty_role: "REQUESTER" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { off_total: "$.meta.total_count" }
          assert:
            - "the response status code is 404"
            - "${err_id} == ERR_AGENCY_NOT_FOUND"
            - "${off_total} == 0"

      - name: resident_post_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
          - entities.ResidentPost.fields.category
          - entities.ResidentPost.fields.protected_class_term_count
          - endpoints[POST /neighborhood-safety/resident-posts]
        distinguishing_aspect: "Both enum range and integer bounds are enforced by validations[priority=5]: category GOSSIP is refused with 400 ERR_INVALID_REQUEST, and so is a classifier signal count of 51 against the declared 0..50 bound, while the same body with category SAFETY_REPORT and count 1 is accepted."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; resident R1 is ACTIVE with post_privilege_state UNRESTRICTED and alert_radius_m 0 so no alert fan-out is involved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Poster Pat", email: "pat@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${r1_id}", body: "Gossip about the neighbours.", category: "GOSSIP", post_x_m: 0, post_y_m: 0 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { err1: "$.data.error_id" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${r1_id}", body: "Too many signals.", category: "SAFETY_REPORT", post_x_m: 0, post_y_m: 0, hostile_tone_count: 51 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { err2: "$.data.error_id" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${r1_id}", body: "A legitimate safety report about a broken street light.", category: "SAFETY_REPORT", post_x_m: 0, post_y_m: 0, hostile_tone_count: 1 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { ok_post_id: "$.data.id", ok_state: "$.data.state" }
          assert:
            - "the first attempt returns 400 with ${err1} == ERR_INVALID_REQUEST"
            - "the second attempt returns 400 with ${err2} == ERR_INVALID_REQUEST"
            - "the third attempt returns 201"
            - "${ok_state} == PUBLISHED"
            - "ResidentPost.${ok_post_id}.discrimination_score == 0.09"
            - "ResidentPost.${ok_post_id}.alert_candidate_count == 0 and ResidentPost.${ok_post_id}.alert_fanout_count == 0"

      - name: data_control_action_row_is_immutable
        claim_type: immutability
        grounds:
          - entities.DataControlAction
          - endpoints[POST /neighborhood-safety/residents/{id}/data-controls]
          - endpoints[GET /neighborhood-safety/residents/{id}/data-control-actions]
          - entities.Resident.fields.data_sharing_opt_out
        distinguishing_aspect: "DataControlAction is declared with common_fields false, so its rows carry only id and created_at: §1.5 exposes no PATCH, PUT or DELETE for the collection, the created row has no version field, and the audit row survives a later OPT_IN_TO_REQUESTS as a second row rather than being rewritten."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-12T00:00:00Z; resident R1 is ACTIVE and owns no camera, so the opt-out has nothing to cascade to."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "Control Cass", email: "cass@example.test", home_x_m: 0, home_y_m: 0 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/residents/${r1_id}/data-controls"
              payload: { action_type: "OPT_OUT_OF_REQUESTS", reason: "Taking a break from requests." }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { dca1_id: "$.data.id", dca1_type: "$.data.action_type", dca1_devices: "$.data.affected_device_count", dca1_sols: "$.data.affected_solicitation_count" }
            - call: "POST /neighborhood-safety/residents/${r1_id}/data-controls"
              payload: { action_type: "OPT_IN_TO_REQUESTS", reason: "Ready again." }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { dca2_id: "$.data.id", dca2_type: "$.data.action_type" }
            - call: "GET /neighborhood-safety/residents/${r1_id}/data-control-actions"
              payload: { limit: 10, offset: 0 }
