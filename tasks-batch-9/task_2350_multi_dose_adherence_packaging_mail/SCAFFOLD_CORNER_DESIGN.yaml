          - roles.Patient.exclusive_operations
        distinguishing_aspect: "One end-to-end fill is handed off through five different X-Role values, so the positive half of the matrix is proven: no single role can be used to drive the pipeline, and every step accepts its owner."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; nothing else pre-exists"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, coinsurance_pct: 20 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
