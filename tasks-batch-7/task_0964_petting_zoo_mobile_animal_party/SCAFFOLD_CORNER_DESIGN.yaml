          assert:
            - "${err} == ERR_FORBIDDEN with http 403"

      - name: coordinator_cannot_verify_certificate
        claim_type: rbac_denial
        grounds: ["roles[ComplianceOfficer]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /insurance-certificates/{id}/verify is exclusive to ComplianceOfficer; a Coordinator caller gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["customer with a SUBMITTED certificate"]
          setup_api_calls:
            - { call: "POST /petting-zoo/customers", payload: { email: "rb2@x.com", full_name: "Rb Two", customer_type: "PRIVATE" }, as: Anonymous, captures: { c2: $.data.id } }
