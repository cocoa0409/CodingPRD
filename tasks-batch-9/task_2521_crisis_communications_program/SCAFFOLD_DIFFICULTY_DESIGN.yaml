            - "One DATA_BREACH incident in MONITORING (the sweep only needs an incident whose scenario_code matches)."
            - "One FAQ material with scenario_code DATA_BREACH reviewed at 2026-08-01T00:00:00Z, so readiness_score is 100.00 and readiness_state is READY."
