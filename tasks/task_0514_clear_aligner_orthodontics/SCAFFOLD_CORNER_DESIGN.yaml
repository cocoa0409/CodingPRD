        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /plans with a non-existent case_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["A clinician exists."]
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr Y6", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
          trigger:
            - call: "POST /plans"
              payload: { case_id: "00000000-0000-4000-8000-000000000000", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_FK_NOT_FOUND"

      - name: error_express_overlap_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXPRESS_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / express_window_buffer_within_24h_rejected
          rationale: "ERR_EXPRESS_WINDOW_OVERLAP is the asserted failure of the named §1.8 instance."

      - name: error_stale_financing_version_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_FINANCING_VERSION]", "concurrency_rules[financing-activate-stale-plan]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / amortization_per_installment_rounding_distinct_from_refund
          rationale: "OCC on financing activate is exercised in the named §1.8 chain via expected_financing_plan_version; the stale-version negative is enumerated below as an OCC corner."

