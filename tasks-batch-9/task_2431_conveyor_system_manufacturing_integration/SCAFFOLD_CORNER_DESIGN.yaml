              as: ShopSupervisor
              captures: { err_e12: $.data.error_id }
          assert:
            - "the response is 404 with error_id ERR_SEGMENT_NOT_FOUND"
            - "GET /fabrication-lots?project_id=${proj_e12p} returns total_count == 0"
            - "Project.${proj_e12p}.delivery_status == DESIGN_FROZEN (no rebaseline side effect fired)"

      - name: commissioning_ramp_target_and_verdict_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.CommissioningRamp.fields.target_cph
          - entities.CommissioningRamp.fields.verdict
          - calculations.ramp_step_evaluation
        excluded_because:
          difficulty_instance: boundary_precision_check / ramp_measured_exactly_equal_to_target_passes
          rationale: "That instance already pins target_cph == 938 from ceil(1250 * 75 / 100) and both PASS and FAIL verdicts on the same fixture."

  # =========================================================================
  # From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:
      - name: change_order_starts_in_draft_at_round_one
        claim_type: initial_state
        grounds:
          - state_machines.ChangeOrder.initial_state
          - entities.ChangeOrder.fields.round_no
          - endpoints[POST /change-orders]
        distinguishing_aspect: |
          A newly created ChangeOrder is in DRAFT with round_no 1, reviewed_by_user_id null and decision_comment
          null, and the project's commercial_status stays CLEAN until the order is submitted.
        test_recipe:
          setup:
            - "Fixture A project in delivery_status DESIGN and commercial_status CLEAN."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-020"
              captures: { proj_s1: $.data.id }
          trigger:
            - call: "POST /change-orders"
              payload: { project_id: "${proj_s1}", title: "Add spur to dock 4", scope_delta_cph: 0, price_delta_cents: 1000000, schedule_delta_days: 5 }
              as: ProjectDirector
              as_user_id: "pd-020"
              captures: { co_s1: $.data.id }
          assert:
            - "the response is 201 and ChangeOrder.${co_s1}.status == DRAFT"
            - "ChangeOrder.${co_s1}.round_no == 1 and ChangeOrder.${co_s1}.reviewed_by_user_id == null and ChangeOrder.${co_s1}.decision_comment == null"
            - "Project.${proj_s1}.commercial_status == CLEAN and Project.${proj_s1}.contract_value_cents == 243600000"

      - name: change_order_submit_moves_draft_to_submitted_and_project_to_change_pending
        claim_type: valid_transition
        grounds:
          - state_machines.ChangeOrder.DRAFT_to_SUBMITTED
          - state_machines.Project.CLEAN_to_CHANGE_PENDING
        distinguishing_aspect: |
          POST /change-orders/{id}/submit moves the order DRAFT -> SUBMITTED and, as its declared side effect,
          moves the project's commercial_status CLEAN -> CHANGE_PENDING while delivery_status stays DESIGN.
        test_recipe:
          setup:
            - "Fixture A project with one DRAFT ChangeOrder (pure price delta 1000000 cents)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-021"
              captures: { proj_s2: $.data.id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_s2}", title: "Add spur to dock 4", scope_delta_cph: 0, price_delta_cents: 1000000, schedule_delta_days: 5 }
              as: ProjectDirector
              as_user_id: "pd-021"
              captures: { co_s2: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_s2}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-021"
          assert:
            - "the response is 200 and ChangeOrder.${co_s2}.status == SUBMITTED with round_no == 1"
            - "Project.${proj_s2}.commercial_status == CHANGE_PENDING"
            - "Project.${proj_s2}.delivery_status == DESIGN (the parallel dimension is untouched)"
            - "Project.${proj_s2}.contract_value_cents == 243600000 (no repricing before approval)"

      - name: second_simulation_of_the_same_method_supersedes_the_prior_complete_run
        claim_type: valid_transition
        grounds:
          - state_machines.SimulationRun.COMPLETE_to_SUPERSEDED
          - endpoints[POST /projects/{id}/simulations]
          - endpoints[GET /projects/{id}/simulation-runs]
        distinguishing_aspect: |
          Two DETERMINISTIC_STEADY_STATE runs on an unchanged design leave the older row SUPERSEDED and the newer
          row COMPLETE with identical effective_throughput_cph 1400 — supersession is keyed on method, not on any
          change of result.
        test_recipe:
          setup:
            - "Fixture A project in DESIGN with one COMPLETE DETERMINISTIC_STEADY_STATE run at design_version 1."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-022"
              captures: { proj_s3: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_s3}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_s3a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_s3}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_s3b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_s3}", from_segment_id: "${seg_s3a}", to_segment_id: "${seg_s3b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_s3}/simulations"
              payload: { method: "DETERMINISTIC_STEADY_STATE" }
              as: DesignEngineer
              captures: { sim_s3a: $.data.id }
          trigger:
            - call: "POST /projects/${proj_s3}/simulations"
              payload: { method: "DETERMINISTIC_STEADY_STATE" }
              as: DesignEngineer
              captures: { sim_s3b: $.data.id }
          assert:
            - "the response is 201 and SimulationRun.${sim_s3b}.status == COMPLETE with effective_throughput_cph == 1400"
            - "SimulationRun.${sim_s3a}.status == SUPERSEDED and SimulationRun.${sim_s3a}.effective_throughput_cph == 1400"
            - "SimulationRun.${sim_s3a}.version == 2 (the supersession bumped it)"
            - "GET /projects/${proj_s3}/simulation-runs returns total_count == 2 with ${sim_s3b} first (created_at DESC)"
            - "GET /projects/${proj_s3}/simulation-runs?status=COMPLETE returns total_count == 1"

      - name: design_freeze_with_only_a_deterministic_run_returns_simulation_stale_or_missing
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Project.DESIGN_to_DESIGN_FROZEN
          - errors[ERR_SIMULATION_STALE_OR_MISSING]
          - calculations.line_throughput_simulation
        distinguishing_aspect: |
          A COMPLETE DETERMINISTIC_STEADY_STATE run whose effective_throughput_cph 1400 clears the 1250
          requirement still fails the freeze gate, because the gate's input set is restricted to method
          DEGRADED_AVAILABILITY — the error is ERR_SIMULATION_STALE_OR_MISSING, not ERR_THROUGHPUT_SHORTFALL.
        test_recipe:
          setup:
            - "Fixture A project in DESIGN whose only simulation run is DETERMINISTIC_STEADY_STATE (eff 1400)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-023"
              captures: { proj_s4: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_s4}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_s4a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_s4}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_s4b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_s4}", from_segment_id: "${seg_s4a}", to_segment_id: "${seg_s4b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_s4}/simulations"
              payload: { method: "DETERMINISTIC_STEADY_STATE" }
              as: DesignEngineer
              captures: { sim_s4: $.data.id }
          trigger:
            - call: "POST /projects/${proj_s4}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-023"
              captures: { err_s4: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_SIMULATION_STALE_OR_MISSING"
            - "SimulationRun.${sim_s4}.effective_throughput_cph == 1400 and SimulationRun.${sim_s4}.shortfall_cph == 0"
            - "Project.${proj_s4}.delivery_status == DESIGN and Project.${proj_s4}.design_frozen_at == null"

      - name: cutover_window_start_moves_the_share_ledger_from_legacy_to_in_transition
        claim_type: side_effect_execution
        grounds:
          - state_machines.CutoverWindow.SCHEDULED_to_IN_PROGRESS
          - entities.Project.fields.legacy_share_bps
          - entities.Project.fields.in_transition_share_bps
          - state_machines.SiteZone.LIVE_LEGACY_to_CUTOVER_IN_PROGRESS
        distinguishing_aspect: |
          Starting the window on the 6000 bps zone of a two-zone project moves exactly 6000 bps from
          legacy_share_bps to in_transition_share_bps (4000 / 6000 / 0), flips that zone to
          CUTOVER_IN_PROGRESS, leaves the 4000 bps zone LIVE_LEGACY, and lifts delivery_status to CUTOVER.
