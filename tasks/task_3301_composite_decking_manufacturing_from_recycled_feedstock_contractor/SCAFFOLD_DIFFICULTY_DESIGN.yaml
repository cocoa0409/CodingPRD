# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3301_composite_decking_manufacturing_from_recycled_feedstock_contractor
#
# Depth probe: 2 instances per §0.5 rule. Every setup_api_calls chain replays
# cleanly from empty-DB against SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dealer_invoicing_provisional_vs_final
        grounds:
          - calculations.dealer_invoicing
          - state_machines.ShipmentOrder.REQUESTED_to_CONFIRMED
          - state_machines.ShipmentOrder.CONFIRMED_to_SHIPPED
          - state_machines.StockingCommitment.OPEN_to_MET
        distinguishing_aspect: |
          Same order data, two evaluation contexts: the provisional variant
          evaluated at CONFIRMED uses dealer tier STANDARD (no MET commitment
          yet), while the final variant persisted at SHIPPED uses tier
          PREFERRED because a 1000-lf commitment flipped MET between confirm
          and ship. 200 * 500 = 100000 provisional vs floor(100000 * 0.9) =
          90000 final — a 10000-cent divergence on identical order fields.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z (SELLING season for the plant's 01-01..02-28 window)."
            - "Plant with fg_store 2000 lf for the product line (one completed SELLABLE run)."
            - "PriceBook base price 500 cents/lf for the line, discounts STANDARD 0 bp / PREFERRED 1000 bp."
            - "Dealer with an OPEN StockingCommitment season 2026 committed 1000 lf, fulfilled 800 lf."
            - "Order A: 200 lf REQUESTED. Dealer has no MET commitment from season 2025."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 2, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/price-books"
              payload: { name: "PB26", effective_from: "2026-01-01", base_prices: { "${line_id}": 500 }, tier_discounts_bp: { STANDARD: 0, PREFERRED: 1000 } }
              as: ChannelManager
              captures: { pb_id: $.data.id }
            - call: "POST /decking/dealers"
              payload: { name: "Dealer D", territory_code: "VA-N", credit_limit_cents: 100000000 }
              as: ChannelManager
              captures: { dealer_id: $.data.id }
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 2000, production_date: "2026-03-01", run_kind: "SELLABLE", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run_id: $.data.id }
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "VIRGIN_PE", weight_lbs: 3000, received_date: "2026-02-20", moisture_pct: 1.0, contamination_ppm: 10, melt_flow_index: 0.7, certificate_ref: "C-1" }
              as: QualityEngineer
              captures: { lot_pe: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 3000, received_date: "2026-02-20", moisture_pct: 5.0, contamination_ppm: 100, certificate_ref: "C-2" }
              as: QualityEngineer
              captures: { lot_wf: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot_pe}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/feedstock-lots/${lot_wf}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/start"
              payload: {}
              as: OpsManager
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/complete"
              payload: { actual_lf: 2000 }
              as: OpsManager
            - call: "POST /decking/stocking-commitments"
              payload: { dealer_id: "${dealer_id}", territory_code: "VA-N", product_line_id: "${line_id}", committed_lf: 1000, season_year: 2026 }
              as: ChannelManager
              captures: { sc_id: $.data.id }
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 800, ship_week_start: "2026-03-02" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { order_f: $.data.id }
            - call: "POST /decking/shipment-orders/${order_f}/confirm"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/shipment-orders/${order_f}/ship"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders/${order_f}/deliver"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 200, ship_week_start: "2026-04-06" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { order_a: $.data.id }
            - call: "POST /decking/shipment-orders/${order_a}/confirm"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 200, ship_week_start: "2026-03-02" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { order_m: $.data.id }
            - call: "POST /decking/shipment-orders/${order_m}/confirm"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders/${order_m}/ship"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders/${order_m}/deliver"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
          trigger:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-06T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/shipment-orders/${order_a}/ship"
              payload: {}
              as: DealerSalesRep
          assert:
            - "ShipmentOrder.${order_m}.invoiced_cents == 100000 (200 lf * 500 at STANDARD tier 0 bp)"
            - "ShipmentOrder.${order_a}.invoiced_cents == 90000 (200 lf * 500 at PREFERRED tier 1000 bp)"
            - "StockingCommitment.${sc_id}.status == MET and fulfilled_lf == 1000"
            - "Dealer.${dealer_id}.outstanding_cents == 190000"
            - "the provisional projection for ${order_a} at confirm time (STANDARD) differed from the persisted final value by exactly 10000 cents"

      - name: claim_credit_prorated_vs_expired
        grounds:
          - calculations.claim_credit
          - calculations.claim_eligibility
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          claim_credit's two variants operate on the WarrantyClaim domain (vs
          dealer_invoicing on ShipmentOrder): registration R1 (enhanced, n=10
          from the SILVER-tier contractor) filed 2404 elapsed days after install
          yields remaining_years 4 and credit floor(200000*4/10) = 80000;
          registration R2 (non-enhanced, n=5) on the same filing clock yields
          remaining_years 0 and credit 0 — identical inputs, opposite variants.
        test_recipe:
          setup:
            - "Two registrations on installs dated 2020-01-01 sharing one board lot lineage worth 200000 cents invoiced."
            - "R1 enhanced by a SILVER-tier contractor (score 100) so warranty_years == 10."
            - "R2 non-enhanced (n=5)."
            - "Logical clock at 2026-08-01T00:00:00Z; both claims filed, sampled, reviewed with CONFIRMS_DEFECT."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 2, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Enhance", color: "Brown", capped: false, profile: "SQUARE", emboss: "SMOOTH", board_length_ft: 12, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/price-books"
              payload: { name: "PB26", effective_from: "2026-01-01", base_prices: { "${line_id}": 500 }, tier_discounts_bp: { STANDARD: 0, PREFERRED: 1000 } }
              as: ChannelManager
            - call: "POST /decking/dealers"
              payload: { name: "Dealer D", territory_code: "VA-N", credit_limit_cents: 100000000 }
              as: ChannelManager
              captures: { dealer_id: $.data.id }
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "VIRGIN_PE", weight_lbs: 2000, received_date: "2026-02-20", moisture_pct: 1.0, contamination_ppm: 10, melt_flow_index: 0.7, certificate_ref: "C-1" }
              as: QualityEngineer
              captures: { lot_pe: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 2000, received_date: "2026-02-20", moisture_pct: 5.0, contamination_ppm: 100, certificate_ref: "C-2" }
              as: QualityEngineer
              captures: { lot_wf: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot_pe}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/feedstock-lots/${lot_wf}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 1000, production_date: "2026-03-01", run_kind: "SELLABLE", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run_id: $.data.id }
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/start"
              payload: {}
              as: OpsManager
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/complete"
              payload: { actual_lf: 1000 }
              as: OpsManager
            - call: "GET /decking/production-runs/${run_id}/board-lots"
              payload: {}
              as: OpsManager
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 400, ship_week_start: "2026-03-02" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /decking/shipment-orders/${order_id}/confirm"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/shipment-orders/${order_id}/ship"
              payload: {}
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders/${order_id}/deliver"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
            - call: "POST /decking/contractors"
              payload: { name: "Pro Carol", email: "carol@build.example" }
              as: ProgramAdmin
              captures: { contractor_id: $.data.id }
            - call: "POST /decking/training-modules"
              payload: { title: "Install Basics", version_no: 1, duration_hours: 4.0, required_for_tier: "SILVER" }
              as: ProgramAdmin
              captures: { module_id: $.data.id }
            - call: "POST /decking/training-records"
              payload: { contractor_id: "${contractor_id}", module_id: "${module_id}" }
              as: Contractor
              as_user_id: "${contractor_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /decking/training-records/${tr_id}/pass"
              payload: {}
              as: ProgramAdmin
            - call: "POST /decking/contractors/${contractor_id}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /decking/install-registrations"
              payload: { contractor_id: "${contractor_id}", dealer_id: "${dealer_id}", product_line_id: "${line_id}", install_date: "2020-01-01", board_lot_id: "${lot_id}" }
              as: Contractor
              as_user_id: "${contractor_id}"
              captures: { reg1: $.data.id }
            - call: "POST /decking/install-registrations/${reg1}/mark-installed"
              payload: {}
              as: Contractor
              as_user_id: "${contractor_id}"
            - call: "POST /decking/install-registrations/${reg1}/activate-warranty"
              payload: {}
              as: Contractor
              as_user_id: "${contractor_id}"
            - call: "POST /decking/install-registrations"
              payload: { contractor_id: "${contractor_id}", dealer_id: "${dealer_id}", product_line_id: "${line_id}", install_date: "2020-01-01", board_lot_id: "${lot_id}" }
              as: Contractor
              as_user_id: "${contractor_id}"
              captures: { reg2: $.data.id }
            - call: "POST /decking/install-registrations/${reg2}/mark-installed"
              payload: {}
              as: Contractor
              as_user_id: "${contractor_id}"
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/warranty-claims"
              payload: { install_registration_id: "${reg1}", category: "STRUCTURAL" }
              as: ClaimsAdjuster
              captures: { claim1: $.data.id }
            - call: "POST /decking/warranty-claims"
              payload: { install_registration_id: "${reg2}", category: "STRUCTURAL" }
              as: ClaimsAdjuster
              captures: { claim2: $.data.id }
            - call: "POST /decking/warranty-claims/${claim1}/request-sample"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /decking/warranty-claims/${claim2}/request-sample"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /decking/warranty-claims/${claim1}/samples"
              payload: {}
              as: ClaimsAdjuster
              captures: { sample1: "$.data[0].id" }
            - call: "GET /decking/warranty-claims/${claim2}/samples"
              payload: {}
              as: ClaimsAdjuster
              captures: { sample2: "$.data[0].id" }
            - call: "POST /decking/claim-samples/${sample1}/receive"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /decking/claim-samples/${sample1}/review"
              payload: { lab_verdict: "CONFIRMS_DEFECT" }
              as: ClaimsAdjuster
            - call: "POST /decking/claim-samples/${sample2}/receive"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /decking/claim-samples/${sample2}/review"
              payload: { lab_verdict: "CONFIRMS_DEFECT" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /decking/warranty-claims/${claim1}/adjudicate"
              payload: { decision: "APPROVE", adjudication: "CREDIT" }
              as: ClaimsAdjuster
            - call: "POST /decking/warranty-claims/${claim2}/adjudicate"
              payload: { decision: "APPROVE", adjudication: "CREDIT" }
              as: ClaimsAdjuster
          assert:
            - "InstallRegistration.${reg1}.warranty_years == 10 (SILVER tier, 1 project * 100 = score 100)"
            - "WarrantyClaim.${claim1}.status == APPROVED and credit_amount_cents == 80000 (floor(200000 * 4 / 10))"
            - "WarrantyClaim.${claim2}.status == APPROVED and credit_amount_cents == 0 (expired variant)"
            - "Dealer.${dealer_id}.outstanding_cents == 120000 (200000 invoiced minus 80000 credited)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: changeover_minutes_mode_a
        grounds:
          - calculations.changeover_minutes
          - endpoints.POST_/decking/plants/{id}/production-runs
        distinguishing_aspect: |
          Mode (a): a conditional-branch formula with 5 inputs (color, profile,
          emboss, capped identity vs the prior run on the slot, plus run size).
          R1 (Grey/GROOVED/WOODGRAIN/uncapped) on an empty slot gets 60 initial
          minutes; R2 (Brown/SQUARE/SMOOTH/capped) on the same slot next day
          gets 15+45+60+30+25 = 175 changeover minutes and total 175+175 = 350.
        test_recipe:
          setup:
            - "Logical clock 2026-03-01. Plant daily_capacity_lf 10000, lines 1."
            - "Two product lines L1 (uncapped, Grey/GROOVED/WOODGRAIN) and L2 (capped, Brown/SQUARE/SMOOTH) sharing one ACTIVE formulation."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "L1", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line1: $.data.id }
            - call: "POST /decking/product-lines"
              payload: { name: "L2", color: "Brown", capped: true, profile: "SQUARE", emboss: "SMOOTH", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line2: $.data.id }
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line1}", planned_lf: 500, production_date: "2026-03-02", run_kind: "NULL_SLOT", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run1: $.data.id, run1_changeover: $.data.changeover_minutes, run1_total: $.data.total_minutes, plant_v1: $.data.version }
          trigger:
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line2}", planned_lf: 500, production_date: "2026-03-03", run_kind: "NULL_SLOT", expected_plant_version: "${plant_v1}" }
              as: OpsManager
              captures: { run2: $.data.id, run2_changeover: $.data.changeover_minutes, run2_total: $.data.total_minutes, run2_slot: $.data.line_slot }
          assert:
            - "ProductionRun.${run1}.line_slot == 1 and changeover_minutes == 60 (initial setup on empty slot)"
            - "ProductionRun.${run1}.total_minutes == 132 (60 + ceil(500/10000*1440) = 60+72)"
            - "ProductionRun.${run2}.line_slot == 1 (only slot; different production_date)"
            - "ProductionRun.${run2}.changeover_minutes == 175 (15 base + 45 color + 60 profile + 30 emboss + 25 cap)"
            - "ProductionRun.${run2}.total_minutes == 247"

      - name: pcr_decay_nested_rounding_mode_b
        grounds:
          - calculations.pcr_decay
          - state_machines.Plant.*_to_*
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters — the scaffold pins
          per-day truncation (floor applied each of 30 elapsed days), which
          yields 850 lbs from 1000 lbs, while round-once-on-total would yield
          floor(1000 * 0.995^30) = 860 lbs. The 10-lb delta proves the pinned
          rounding order was applied.
        test_recipe:
          setup:
            - "Logical clock 2026-03-01; plant created; 1000 lbs PCR_FILM released."
            - "Clock advanced 30 days to 2026-03-31; one run-capacity-review processes all 30 elapsed days."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id }
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "COLLECTION_PROGRAM" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "PCR_FILM", weight_lbs: 1000, received_date: "2026-03-01", moisture_pct: 1.0, contamination_ppm: 100, melt_flow_index: 0.7, certificate_ref: "C-1" }
              as: QualityEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot_id}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /decking/plants/${plant_id}/run-capacity-review"
              payload: {}
              as: OpsManager
              captures: { pcr_after: $.data.resin_store }
          assert:
            - "Plant.${plant_id}.resin_store.PCR_FILM == 850 (per-day floor over 30 days; round-once would give 860)"
            - "Plant.${plant_id}.season_posture == SELLING (03-31 is past the 02-28 window end)"
            - "Plant.${plant_id}.version incremented by exactly 1 from the review"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: collection_program_cyclic_suspend_reactivate
        grounds:
          - state_machines.CollectionProgram (implied by endpoints suspend/reactivate/terminate)
          - entities.CollectionProgram.fields.status
          - entities.Supplier.fields.quality_tier
        distinguishing_aspect: |
          Cycle on CollectionProgram (ACTIVE -> SUSPENDED -> ACTIVE) — distinct
          entity from LeadReferral. While SUSPENDED, PCR_FILM releases earn no
          rebate; on reactivation the supplier returns to PREFERRED and new
          releases resume accrual: release 100 lbs at 10 cents/lb while ACTIVE
          (+1000), 100 lbs while SUSPENDED (+0), 100 lbs after reactivation
          (+1000) -> accrued_rebate_cents == 2000.
        test_recipe:
          setup:
            - "Logical clock 2026-03-01; plant; supplier with an ACTIVE collection program at 10 cents/lb."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id }
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "COLLECTION_PROGRAM" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/collection-programs"
              payload: { supplier_id: "${sup_id}", region: "Mid-Atlantic", rebate_per_lb_cents: 10 }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "PCR_FILM", weight_lbs: 100, received_date: "2026-03-01", moisture_pct: 1.0, contamination_ppm: 100, melt_flow_index: 0.7, certificate_ref: "L1" }
              as: QualityEngineer
              captures: { lot1: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot1}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/collection-programs/${prog_id}/suspend"
              payload: {}
              as: ChannelManager
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "PCR_FILM", weight_lbs: 100, received_date: "2026-03-02", moisture_pct: 1.0, contamination_ppm: 100, melt_flow_index: 0.7, certificate_ref: "L2" }
              as: QualityEngineer
              captures: { lot2: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot2}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/collection-programs/${prog_id}/reactivate"
              payload: {}
              as: ChannelManager
          trigger:
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "PCR_FILM", weight_lbs: 100, received_date: "2026-03-03", moisture_pct: 1.0, contamination_ppm: 100, melt_flow_index: 0.7, certificate_ref: "L3" }
              as: QualityEngineer
              captures: { lot3: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot3}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
          assert:
            - "CollectionProgram.${prog_id}.status == ACTIVE after the suspend/reactivate cycle"
            - "CollectionProgram.${prog_id}.accrued_rebate_cents == 2000 (1000 before suspension + 0 during + 1000 after)"
            - "Supplier.${sup_id}.quality_tier == PREFERRED after reactivation and == STANDARD while suspended"
            - "Plant.${plant_id}.resin_store.PCR_FILM == 300 (all three releases still add mass regardless of program status)"

      - name: lead_referral_decline_reassign_loop
        grounds:
          - state_machines.LeadReferral.ASSIGNED_to_DECLINED
          - state_machines.LeadReferral.DECLINED_to_ASSIGNED
          - state_machines.Contractor.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Loop on LeadReferral (ASSIGNED -> DECLINED -> ASSIGNED) — distinct
          entity from CollectionProgram. The declining contractor is excluded
          from the reassignment pool, so a two-contractor pool deterministically
          lands on the other contractor; Contractor also exhibits its own
