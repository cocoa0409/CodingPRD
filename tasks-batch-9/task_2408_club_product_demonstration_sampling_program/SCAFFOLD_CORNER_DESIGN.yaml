          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The transition endpoint is not idempotent by design: a second SUBMIT on a SUBMITTED event returns ERR_INVALID_STATE 409, leaves submitted_at at its original instant and does not bump version — replaying the request must not re-stamp the row."
