            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 2, reason: "PREVENTIVE", expected_mold_version: "${mold_v}" }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
            - { call: "GET /plant/molds/${mold_id}", as: ProcessEngineer, captures: { mold_v3: "$.data.version" } }
            - { call: "POST /plant/molds/${mold_id}/cavity-blockouts", payload: { cavity_index: 2, reason: "PREVENTIVE", expected_mold_version: "${mold_v3}" }, as: ProcessEngineer, captures: { blk2_id: "$.data.id" } }
          assert:
            - "stale expected_mold_version (${mold_v}, observed before blockout 1 bumped the mold) -> error_id == ERR_STALE_VERSION, http 412"
            - "retry with the fresh version succeeds: blockout created; mold.version incremented on every mutation (1 create, 2 install, 3 blk1, 4 blk2)"

      - name: occ_schedule_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-schedule-stale-order]"]
        distinguishing_aspect: "Re-slotting a SCHEDULED order (a legitimate supersede) with the pre-first-schedule version -> 412; state rules alone cannot reject it because SCHEDULED->SCHEDULED is a valid transition."
        test_recipe:
          setup: ["qualified spec; order1 SCHEDULED via first schedule (version now 2)"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 3000, planned_weight_g: 22 }, as: ProductionScheduler, captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler }
          trigger:
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-03T10:00:00Z", planned_end: "2026-08-03T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler, captures: { err: "$.data.error_id" } }
            - { call: "GET /plant/production-orders/${ord_id}", as: ProductionScheduler, captures: { ord_v2: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-03T10:00:00Z", planned_end: "2026-08-03T14:00:00Z", expected_production_order_version: "${ord_v2}" }, as: ProductionScheduler, captures: { ord_st: "$.data.status" } }
          assert:
            - "re-slot with the stale version ${ord_v} -> error_id == ERR_STALE_VERSION, http 412"
            - "re-slot with current version succeeds (SCHEDULED->SCHEDULED): old slot CANCELLED, new CONFIRMED slot on 2026-08-03; order.status == SCHEDULED"

      - name: occ_qualification_create_stale_spec_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[qualification-run-create-stale-spec]"]
        distinguishing_aspect: "Second qualification-run create carrying the spec version from before run 1's creation -> 412 ERR_STALE_VERSION (OCC is checked before the active-run constraint)."
        test_recipe:
          setup: ["spec IN_QUALIFICATION; run Q1 created (spec version advanced from ${spec_v})"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "NONE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 4, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION (spec.version was advanced by run 1's creation side effect; the client's pinned view is stale)"

      - name: cascade_coverage_via_qc_reject
        claim_type: cascade_chain
        grounds: [state_machines.QualityTestLot.SAMPLED_to_REJECTED]
        excluded_because:
          difficulty_instance: qc_reject_cascade_holds_order_frees_line
          rationale: "The 3-link cascading side-effect chain (lot -> order -> slot -> line) is asserted end-to-end in the difficulty instance."

      - name: cascade_coverage_via_customer_suspend
        claim_type: cascade_chain
        grounds: [state_machines.Customer.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: customer_suspend_cascades_orders_slots
          rationale: "The 2-link cascade (customer -> orders -> slots) is asserted end-to-end in the difficulty instance."

      - name: dual_variant_coverage_via_logistics_and_resin
        claim_type: dual_variant_divergence
        grounds: [calculations.logistics_mode_comparison, calculations.resin_consumption_reconciliation]
        excluded_because:
          difficulty_instance: freight_warehouse_vs_blow_on_site_divergence
          rationale: "Both dual-variant calculations (plus the resin companion) are asserted with literal divergence in difficulty instances."

  - section: consistency_model
    instances:
      - name: close_response_reflects_debit_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the close response already carries the computed reconciliation fields, and a plain GET of the material lot in the same test (no clock ops, no batch) shows the debit."
        test_recipe:
          setup: ["run R1 OPEN; lot R-100 500 kg RELEASED"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme Bev", customer_code: "ACME", credit_limit_cents: 100000000 }, as: PlantAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /plant/machine-lines", payload: { line_code: "L1", has_inline_labeler: true, max_bottle_diameter_mm: 120, resident_volume_kg: 50 }, as: PlantAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/molds", payload: { mold_code: "M8", base_cavities: 8, compatible_resins: ["PET"], reference_weight_g: 20 }, as: PlantAdmin, captures: { mold_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs", payload: { customer_id: "${cust_id}", spec_code: "B500", resin_type: "PET", color_contrast_class: "CLEAR", target_weight_g: 22, weight_tolerance_pct: 2.0, neck_finish: "PCO1881", height_mm: 210, diameter_mm: 66, bottle_cube_cm3: 4000, preform_cube_cm3: 150, preform_weight_g: 22, unit_price_cents: 9, label_type: "PRESSURE_SENSITIVE", min_cavitation_required: 4 }, as: ProcessEngineer, captures: { spec_id: "$.data.id" } }
            - { call: "POST /plant/bottle-specs/${spec_id}/submit", as: ProcessEngineer }
            - { call: "POST /plant/bottle-specs/${spec_id}/begin-qualification", as: ProcessEngineer, captures: { spec_v: "$.data.version" } }
            - { call: "POST /plant/qualification-runs", payload: { bottle_spec_id: "${spec_id}", sample_cavity_count: 8, expected_bottle_spec_version: "${spec_v}" }, as: ProcessEngineer, captures: { qrun_id: "$.data.id" } }
            - { call: "POST /plant/qualification-runs/${qrun_id}/execute", payload: { measured_mean_weight_g: 22.1, weight_spread_g: 0.4, visual_defects: 0 }, as: ProcessEngineer }
            - { call: "POST /plant/qualification-runs/${qrun_id}/submit-review", as: QualityTechnician }
            - { call: "POST /plant/qualification-runs/${qrun_id}/review", payload: { decision: "APPROVE" }, as: CustomerQualityRep, as_user_id: "${cust_id}" }
            - { call: "POST /plant/production-orders", payload: { bottle_spec_id: "${spec_id}", quantity_ordered: 3000, planned_weight_g: 22 }, as: ProductionScheduler, captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /plant/production-orders/${ord_id}/schedule", payload: { machine_line_id: "${line_id}", planned_start: "2026-08-02T10:00:00Z", planned_end: "2026-08-02T14:00:00Z", expected_production_order_version: "${ord_v}" }, as: ProductionScheduler }
            - { call: "POST /plant/material-lots", payload: { material_type: "RESIN", resin_type: "PET", lot_code: "R-100", received_kg: 500 }, as: PlantAdmin, captures: { mlot_id: "$.data.id" } }
            - { call: "POST /plant/material-lots/${mlot_id}/release", as: QualityTechnician }
            - { call: "POST /plant/molds/${mold_id}/install", payload: { machine_line_id: "${line_id}" }, as: ProcessEngineer }
            - { call: "POST /plant/production-orders/${ord_id}/release", as: ProductionScheduler }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/production-runs", payload: { production_order_id: "${ord_id}", machine_line_id: "${line_id}", mold_id: "${mold_id}", material_lot_id: "${mlot_id}" }, as: ProcessEngineer, captures: { run_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/production-runs/${run_id}/close", payload: { cycles_completed: 2000, good_count: 11880, scrap_count: 120, actual_drawdown_kg: 360.0 }, as: ProcessEngineer, captures: { rst: "$.data.status", prov: "$.data.provisional_consumption_kg" } }
            - { call: "GET /plant/material-lots/${mlot_id}", as: QualityTechnician, captures: { av: "$.data.available_kg", st: "$.data.status" } }
          assert:
            - "close response itself: status == CLOSED, provisional_consumption_kg == 352.0 (same-request visibility)"
            - "immediate GET lot: available_kg == 140.0, status == IN_USE (no async lag)"
