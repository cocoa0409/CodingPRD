            - "GET /parcel-owner-consents?petition_id=${pet_v7}&consent_status=SIGNED returns total_count == 2"

      - name: hold_on_a_non_scheduled_hearing_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
        distinguishing_aspect: |
          A VACATED or already-HELD hearing must fail on hearing_status before any notice or
          temporal check runs.
        excluded_because:
          difficulty_instance: hold_vacated_hearing_state_error_precedes_notice_safety_error
          rationale: |
            That §1.8 instance vacates a noticed hearing through the consent-withdrawal cascade and
            asserts ERR_HEARING_NOT_SCHEDULED wins over the notice error that is also outstanding,
            which covers both this rule and its precedence.

      - name: notice_without_an_adopted_plan_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=55]
        distinguishing_aspect: |
          Notice publication, ordinance adoption and the MSD alternative all require an ADOPTED
          plan of services.
        excluded_because:
          difficulty_instance: notice_publication_gated_on_plan_of_services_adoption_state
          rationale: |
            That §1.8 instance publishes notice before and after adoption on the same hearing and
            asserts ERR_PLAN_NOT_ADOPTED then success, which pins the gate to the plan's adoption
            dimension.

      - name: adopting_a_plan_missing_a_required_service_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=56]
        distinguishing_aspect: |
          A plan may only be adopted once covered_service_types contains every statutory required
          service type.
        excluded_because:
          difficulty_instance: plan_adoption_gated_on_commitment_activation_state
          rationale: |
            That §1.8 instance attempts adoption with the commitment still DRAFT — so
            covered_service_types is empty — and asserts ERR_SERVICE_TYPE_NOT_COVERED, then adopts
            successfully after activation.

      - name: adopting_an_ordinance_with_an_open_protest_period_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=59]
        distinguishing_aspect: |
          The protest period must be closed before the ordinance can be adopted.
        excluded_because:
          difficulty_instance: adopt_ordinance_protest_safety_error_precedes_fiscal_deficit_error
          rationale: |
            That §1.8 instance asserts ERR_PROTEST_PERIOD_OPEN is returned while a fiscal-deficit
            violation is also outstanding on the same call, which covers this rule and its
            precedence.

      - name: filing_outside_the_protest_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=64]
        distinguishing_aspect: |
          A filing whose filed_at falls outside [protest_opens_at, protest_closes_at] is refused.
        excluded_because:
          difficulty_instance: protest_filing_temporal_error_precedes_parcel_referential_error
          rationale: |
            That §1.8 instance files outside the window with a foreign parcel and asserts
            ERR_PROTEST_FILING_OUT_OF_WINDOW wins, covering this rule together with its precedence
            over the referential check.

      - name: overlapping_chamber_bookings_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=67]
        distinguishing_aspect: |
          Two hearings of one municipality may not occupy the chamber within the changeover buffer.
        excluded_because:
          difficulty_instance: chamber_buffered_half_open_interval_admits_exact_touch_only
          rationale: |
            That §1.8 instance asserts ERR_HEARING_SLOT_CONFLICT one minute inside the buffer and
            success exactly on it, covering this rule at its tightest point.

      - name: activating_past_provider_capacity_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=79]
        distinguishing_aspect: |
          A provider may not be encumbered beyond concurrent_project_capacity on any calendar day.
        excluded_because:
          difficulty_instance: provider_closed_date_intervals_collide_on_the_shared_touching_day
          rationale: |
            That §1.8 instance asserts ERR_PROVIDER_CAPACITY_EXCEEDED for the touching window and
            success for the disjoint one, covering this rule at the exact collision day.

      - name: adopting_an_ordinance_without_a_finalized_analysis_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=82]
        distinguishing_aspect: |
          Ordinance adoption requires a FINALIZED fiscal impact analysis of the case.
        excluded_because:
          difficulty_instance: ordinance_adoption_gated_on_fiscal_analysis_finalized_state
          rationale: |
            That §1.8 instance attempts adoption with the analysis still DRAFT, asserts
            ERR_FISCAL_ANALYSIS_NOT_FINALIZED, then finalizes and adopts, pinning the gate to the
            analysis status dimension.

      - name: state_error_precedes_notice_safety_error_on_hold
        claim_type: priority_ordering
        grounds:
          - validations[priority=36]
          - validations[priority=58]
        distinguishing_aspect: |
          Two violations outstanding on one hold request must return the lower-priority-number
          error.
        excluded_because:
          difficulty_instance: hold_vacated_hearing_state_error_precedes_notice_safety_error
          rationale: |
            That §1.8 instance is exactly this ordering test: both rules are violated by the same
            request and it asserts the priority-36 error wins.

      - name: protest_safety_error_precedes_fiscal_error_on_ordinance_adoption
        claim_type: priority_ordering
        grounds:
          - validations[priority=59]
          - validations[priority=84]
        distinguishing_aspect: |
          An open protest period and an intolerable deficit are both outstanding; the protest error
          must win.
        excluded_because:
          difficulty_instance: adopt_ordinance_protest_safety_error_precedes_fiscal_deficit_error
          rationale: |
            That §1.8 instance constructs both violations on one adopt-ordinance call and asserts
            the priority-59 error is returned.

      - name: temporal_error_precedes_referential_error_on_protest_filing
        claim_type: priority_ordering
        grounds:
          - validations[priority=64]
          - validations[priority=71]
        distinguishing_aspect: |
          A late filing that also names a foreign parcel must fail on the temporal rule.
        excluded_because:
          difficulty_instance: protest_filing_temporal_error_precedes_parcel_referential_error
          rationale: |
            That §1.8 instance constructs both violations on one filing and asserts the priority-64
            error is returned.

  # =====================================================================================
  # SECTION 5 — Endpoints
  # NOTE: §1.5 declares no bulk endpoints, so the guide's "Bulk action" row has no
  # applicable instance in this scaffold.
  # =====================================================================================
  - section: endpoints
    instances:
      - name: statute_and_municipality_crud_round_trips_through_read_and_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /statute-profiles]
          - endpoints[GET /statute-profiles/{statuteProfileId}]
          - endpoints[POST /municipalities]
          - endpoints[GET /municipalities/{municipalityId}]
          - endpoints[GET /municipalities]
        distinguishing_aspect: |
          The configuration hub of the whole scaffold has no update or delete endpoint, so its CRUD
          surface is create-read-list only: what POST returned must come back byte-identical from
          the by-id read, and the two municipalities created under one statute profile must both
          appear under the statute_profile_id filter while the municipality created under the other
          profile must not.
        test_recipe:
          setup:
            - "Empty database; the logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE", "PETITION_MAJORITY"], required_service_types: ["POLICE"], notice_min_days: 21 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_e1a: $.data.id, e1_notice_days: $.data.notice_min_days }
            - call: "POST /statute-profiles"
              payload: { state_code: "SC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_e1b: $.data.id }
            - call: "GET /statute-profiles/${st_e1a}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "muni-probe"
              captures: { e1_read_state: $.data.state_code, e1_read_notice: $.data.notice_min_days }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_e1a}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_e1a: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_e1a}", name: "Ridgeview", state_code: "NC", population: 20000, citywide_annual_service_cost_cents: 400000000, citywide_population: 20000, general_fund_millage_rate: 8.0, corporate_boundary_perimeter_feet: 60000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_e1b: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_e1b}", name: "Fort Landing", state_code: "SC", population: 10000, citywide_annual_service_cost_cents: 200000000, citywide_population: 10000, general_fund_millage_rate: 6.0, corporate_boundary_perimeter_feet: 40000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_e1c: $.data.id }
            - call: "GET /municipalities/${muni_e1a}"
              payload: {}
              as: CountyAssessor
              as_user_id: "cta-01"
              captures: { e1_muni_name: $.data.name, e1_muni_ledger: $.data.taxable_assessed_value_cents, e1_muni_statute: $.data.statute_profile_id }
          assert:
            - "both statute-profile creates return status 201 and ${e1_notice_days} == 21"
            - "${e1_read_state} == NC"
            - "${e1_read_notice} == 21"
            - "${e1_muni_name} == Cedar Grove"
            - "${e1_muni_ledger} == 0"
            - "${e1_muni_statute} == ${st_e1a}"
            - "GET /municipalities?statute_profile_id=${st_e1a} returns total_count == 2 and has_more == false, containing ${muni_e1a} and ${muni_e1b}"
            - "GET /municipalities?statute_profile_id=${st_e1b} returns total_count == 1, containing only ${muni_e1c}"
            - "GET /municipalities?state_code=SC returns total_count == 1"
            - "no update or delete endpoint exists for StatuteProfile or Municipality in §1.5"

      - name: excluding_a_parcel_disconnects_its_account_and_reduces_the_territory
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /parcels/{parcelId}/exclude]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The exclude action is the only endpoint that shrinks a territory, and its three side
          effects have to land together in one call: the parcel leaves the territory, the parcel's
          OUTSIDE_CITY water account is DISCONNECTED so it can never be cut over later, and the
          case's parcel_count, territory_acreage and territory_assessed_value_cents fall to the
          values of the surviving parcels while the case version advances. The clock endpoint is
          exercised in the same instance because every stamp in the scaffold reads from it.
        test_recipe:
          setup:
            - "A DRAFT case with two parcels — P1 40,000,000 cents / 5.00 acres and P2 60,000,000 cents / 5.00 acres — and one OUTSIDE_CITY water account on P2."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["WATER"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_e2: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_e2}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_e2: $.data.id }
            - call: "POST /municipalities/${muni_e2}/service-providers"
              payload: { provider_name: "Cedar Grove Water", service_types: ["WATER"], concurrent_project_capacity: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { prov_e2: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_e2: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_e2}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 2, developed_lot_count: 2, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { case_e2: $.data.id }
            - call: "POST /annexation-cases/${case_e2}/parcels"
              payload: { primary_owner_id: "${ow_e2}", parcel_apn: "E2-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { parcel_e2a: $.data.id }
            - call: "POST /annexation-cases/${case_e2}/parcels"
              payload: { primary_owner_id: "${ow_e2}", parcel_apn: "E2-2", assessed_value_cents: 60000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { parcel_e2b: $.data.id }
            - call: "POST /utility-accounts"
              payload: { parcel_id: "${parcel_e2b}", service_provider_id: "${prov_e2}", service_type: "WATER", monthly_base_cents: 4000 }
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { acct_e2: $.data.id, e2_acct_status_before: $.data.account_status }
            - call: "GET /annexation-cases/${case_e2}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { e2_value_before: $.data.territory_assessed_value_cents, e2_acreage_before: $.data.territory_acreage, e2_count_before: $.data.parcel_count, e2_ver_before: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:00:00Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { e2_clock: $.data.current_utc }
            - call: "POST /parcels/${parcel_e2b}/exclude"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { e2_parcel_status: $.data.parcel_status }
            - call: "GET /annexation-cases/${case_e2}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { e2_value_after: $.data.territory_assessed_value_cents, e2_acreage_after: $.data.territory_acreage, e2_count_after: $.data.parcel_count, e2_ver_after: $.data.version }
            - call: "GET /utility-accounts/${acct_e2}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e2}"
              captures: { e2_acct_status_after: $.data.account_status }
          assert:
            - "${e2_clock} == 2026-08-20T12:00:00Z"
            - "${e2_acct_status_before} == OUTSIDE_CITY"
            - "${e2_value_before} == 100000000"
            - "${e2_acreage_before} == 10.00"
            - "${e2_count_before} == 2"
            - "${e2_ver_before} == 3"
            - "exclude returns status 200 and ${e2_parcel_status} == EXCLUDED"
            - "${e2_value_after} == 40000000"
            - "${e2_acreage_after} == 5.00"
            - "${e2_count_after} == 1"
            - "${e2_ver_after} == 4"
            - "${e2_acct_status_after} == DISCONNECTED"
            - "Parcel.${parcel_e2a}.parcel_status == PROPOSED"
            - "GET /parcels?annexation_case_id=${case_e2}&parcel_status=PROPOSED returns total_count == 1"
            - "GET /utility-accounts?parcel_id=${parcel_e2b}&account_status=DISCONNECTED returns total_count == 1"

      - name: plan_read_returns_the_cost_coverage_and_readiness_derived_from_its_commitments
        claim_type: computed_read
        grounds:
          - endpoints[GET /plans-of-services/{planId}]
          - endpoints[GET /service-providers/{serviceProviderId}]
          - calculations.plan_service_readiness
          - calculations.provider_capacity_encumbrance
        distinguishing_aspect: |
          A plan of services stores nothing about cost or coverage of its own — every field read
          back is derived from the commitments beneath it. Two activated commitments of 500,000 and
          300,000 cents on a statute requiring POLICE and FIRE must make the plan read back
          committed_cost_cents 800,000, both service types covered and service_readiness READY,
          while the shared provider's ledger reads back the sum of the two 46-day windows rather
          than the length of their union.
        test_recipe:
          setup:
            - "A TERRITORY_CERTIFIED case under a statute requiring POLICE and FIRE, one provider offering both with concurrent_project_capacity 2, and a DRAFT plan of services with no commitments."
          setup_api_calls:
