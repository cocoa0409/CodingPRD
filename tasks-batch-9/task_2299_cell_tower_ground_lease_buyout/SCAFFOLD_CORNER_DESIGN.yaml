  - section: cross_cutting_complexity_layers
    instances:
      - name: optimistic_concurrency_valuation_pinned_to_a_superseded_stream_version_rejected_then_retried
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[valuation-create-stale-stream]
          - validations[priority=10]
          - errors[ERR_STALE_LEASE_STREAM_VERSION]
          - endpoints[POST /lease-buyouts/lease-streams/{id}/valuations]
          - complexity_profile.cross_cutting_complexity_layers[optimistic_concurrency]
        distinguishing_aspect: |
          The version the analyst read is invalidated by a write to a *child* of the stream, not to the
          stream row itself: the servicing agent adds a colocation tenancy, which changes
          tenancy_quality_score and therefore the discount rate the valuation would snapshot. An
          implementation that only bumps LeaseStream.version on PATCHes of the stream, or that ignores
          expected_lease_stream_version when it merely looks plausible, happily writes a valuation
          computed from superseded inputs. The stale attempt must be 412 ERR_STALE_LEASE_STREAM_VERSION
          with no StreamValuation row created, and the retry with the refreshed version must succeed and
          snapshot the *new* score - so the test also catches a system that returns 412 forever.
        test_recipe:
          setup:
            - "a lease stream with one investment-grade anchor tenancy"
            - "the analyst has read the stream and holds its version"
            - "the servicing agent then adds a second, non-investment-grade colocation tenancy"
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "${tc_id}", site_code: "NE-1042", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { ts_id: $.data.id } }
            - { call: "POST /lease-buyouts/landowners", payload: { legal_name: "Hollis Farm LLC", entity_type: "LLC", contact_email: "owner@hollis.example" }, as: AcquisitionAnalyst, captures: { lo_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams", payload: { tower_site_id: "${ts_id}", landowner_id: "${lo_id}", current_annual_rent_cents: 3600000, escalator_type: "FIXED_PCT", escalator_pct_bps: 300, remaining_term_months: 180 }, as: AcquisitionAnalyst, captures: { ls_id: $.data.id } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v1: $.data.version } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Meridian Mobile", carrier_credit_tier: "NON_INVESTMENT_GRADE", tenancy_type: "COLOCATION", monthly_rent_share_cents: 90000, term_end_date: "2034-06-30" }, as: ServicingAgent, captures: { t2_id: $.data.id } }
          trigger:
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations", payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v1}" }, as: AcquisitionAnalyst, captures: { err_id: $.data.error_id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v2: $.data.version } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations", payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v2}" }, as: AcquisitionAnalyst, captures: { val_id: $.data.id, snap: $.data.tenancy_quality_score_snapshot } }
          assert:
            - "the first valuation attempt returns status 412"
            - "${err_id} == ERR_STALE_LEASE_STREAM_VERSION"
            - "${err_id} != ERR_INVALID_REQUEST"
            - "${ls_v2} != ${ls_v1}"
            - "the retry returns status 201 and ${val_id} is present"
            - "${snap} equals the stream's current tenancy_quality_score, which now includes the colocation row, not the score that was in force when ${ls_v1} was read"
            - "GET /lease-buyouts/lease-streams/${ls_id}/valuations as AcquisitionAnalyst returns exactly one valuation, proving the rejected attempt wrote nothing"
      - name: optimistic_concurrency_pledge_pinned_to_a_facility_version_consumed_by_a_sibling_pledge_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pledge-create-stale-facility]
          - validations[priority=11]
          - errors[ERR_STALE_FACILITY_VERSION]
          - endpoints[POST /lease-buyouts/financing-facilities/{id}/pledges]
          - complexity_profile.cross_cutting_complexity_layers[optimistic_concurrency]
        distinguishing_aspect: |
          Both pledge requests are prepared against the same freshly read facility version, which is the
          real-world race: a treasury operator batching two streams into one warehouse. The first pledge
          consumes that version by changing pledged_eligible_total_cents and the borrowing base, so the
          second - though otherwise entirely valid, on a different acquired stream, within the
          concentration limit - was decided against superseded headroom and must be 412
          ERR_STALE_FACILITY_VERSION, not 201 and not a borrowing-base error. Re-reading the facility and
          resending the identical body must then succeed, and the facility must end with exactly two
          pledged streams, which rules out both "ignore the version" and "count the rejected attempt".
        test_recipe:
          setup:
            - "a portfolio with 200,000,000 cents of capital and two closed deals, so two lease streams are ACQUIRED"
            - "a mark-to-model facility at a 6500 bps advance rate with the concentration limit wide open"
