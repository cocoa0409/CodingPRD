            - { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T09:00:00Z", window_end_utc: "2026-09-15T09:30:00Z" }, as: LoadMaster, as_user_id: "lm_bob" }
