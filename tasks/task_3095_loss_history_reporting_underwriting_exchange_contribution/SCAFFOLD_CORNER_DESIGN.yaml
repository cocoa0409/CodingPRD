  # ===========================================================================
  - section: calculations
    instances:
      - name: report_inclusion_orders_entries_loss_date_desc_then_created_at_asc
        claim_type: Correct Result
        grounds:
          - calculations.report_inclusion_set
          - entities.ReportClaimEntry.fields.entry_sequence
        distinguishing_aspect: "Entries are sequenced loss_date DESC with created_at ASC as the tie-break — never id: two claims with the same loss_date contributed in one batch come out in their contribution order."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B1 ACTIVE; consumer Eli with 3 claims: loss dates 2025-01-05, 2025-03-01, 2025-03-01 (two share a date, contributed in that order)."
