  # ===========================================================================
  - section: errors
    instances:

      - name: six_business_key_collisions_each_return_their_own_409_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_POLICY_CODE]
          - errors[ERR_DUPLICATE_COUNTERPARTY_CODE]
          - errors[ERR_DUPLICATE_STATION_CODE]
          - errors[ERR_DUPLICATE_PROGRAM_CODE]
          - errors[ERR_DUPLICATE_MTM_PERIOD]
          - errors[ERR_DUPLICATE_FLIGHT_LEG]
        distinguishing_aspect: |
          Priority 17 fans out to seven distinct codes, and each creator must report
          its own: a repeated policy_code is not the generic ERR_INVALID_REQUEST, and
          the FlightLeg key is the pair (flight_number, departure_date) rather than
          the flight number alone. The duplicate policy attempt also proves priority
          17 runs before the same-fiscal_year supersession side effect, since the
          original policy is still ACTIVE at version 1 afterwards.
        test_recipe:
          setup:
            - "One of each keyed row already exists: policy FY27-DUP, counterparty DLRC, stations DFW and ORD, program HP-DUP, MTM run 2027-02, flight leg FA100 on 2027-02-10."
