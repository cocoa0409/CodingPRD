  - rule_id: resource_temporal_overlap
    instances:

      - name: unit_occupancy_buffer_rejects_start_exactly_fourteen_days_after_end
        grounds:
          - validations[priority=20]
          - errors[ERR_UNIT_OCCUPANCY_CONFLICT]
          - entities.Lease.fields.start_date
          - entities.Lease.fields.end_date
        distinguishing_aspect: |
          Interval semantics A — PAIRWISE closed-closed intervals on the Unit resource,
          symmetrically inflated by a 14-day refurbishment buffer. Against an incumbent
          ending 2027-08-26, a candidate starting 2027-09-09 (== end + 14) is REJECTED
          because the test is `s <= e2 + 14`, while 2027-09-10 (== end + 15) is accepted.
        test_recipe:
          setup:
            - "One branch, TX-RUR permit-free jurisdiction, one PUBLISHED 20x48 configuration."
            - "One customer with headroom and one unit."
            - "Incumbent lease occupying the closed interval 2026-09-01..2027-08-26 on that unit, still in occupancy_status PENDING."
