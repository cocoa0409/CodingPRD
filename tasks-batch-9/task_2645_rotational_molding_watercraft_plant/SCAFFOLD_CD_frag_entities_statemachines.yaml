      # ------------------------------------------------------------- Shape: cyclic
      - name: sm_cyclic_claim_return_to_queue_revokes_the_waiver_and_remeasures_the_hull_age
        claim_type: "Shape: cyclic"
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_SUBMITTED
          - state_machines.WarrantyClaim.storage_review_status
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/return-to-queue
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/waive-storage-finding
          - errors.ERR_STORAGE_FINDING_NOT_WAIVABLE
          - validations[priority=47]
        distinguishing_aspect: "The UNDER_REVIEW -> SUBMITTED backward edge makes the claim machine cyclic, and one full lap is destructive rather than cosmetic: it drags the storage axis back to NOT_STARTED (so the WAIVED finding is gone and a second waive attempt is refused with ERR_STORAGE_FINDING_NOT_WAIVABLE) and it clears months_in_service, so the second start-review re-measures the hull's age against the newer clock and reports 3 instead of 2."
        test_recipe:
          setup:
            - "One hull is produced, inspected SELLABLE, stored, loaded, sealed, departed and delivered, so it carries delivered_at == 2026-08-02T00:00:00Z and satisfies §1.4 priority 61."
            - "The trailer holds one hull with gross_cube_m3 2.0000 against trailer_cube_capacity_m3 3.0000, so cube_utilization_pct == round(2.0000 / 3.0000 * 100, 2) == 66.67 >= MIN_SEAL_UTILIZATION_PCT 60.00 and the seal is admitted; payload 24.000 <= 100.000."
            - "Customer CUS-SM-CYC acknowledges the storage guidance at 2026-08-01T00:00:00Z, which is at or before delivered_at, so §1.4 priority 56 is satisfied on BOTH storage reviews."
            - "WarrantyClaim WC-SM-CYC-1 of type HARDWARE (so §1.4 priority 27's deformation floor never applies) starts at claim_status SUBMITTED with storage_review_status NOT_STARTED and every money field null."
            - "The inspection points [5.90, 6.00, 6.10, 5.95, 6.05, 6.00] give mean 6.000, sd 0.065, cv 1.08 <= 12.00 and min 5.900 >= 4.50, and the cycle's warpage index is 0.000, so the verdict is PASS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
