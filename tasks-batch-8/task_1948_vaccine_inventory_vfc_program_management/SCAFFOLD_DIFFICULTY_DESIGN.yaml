              captures: { ord1_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord1}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v1: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord1}/approve"
              payload: { approved_vfc_doses: 10, expected_provider_site_version: "${site_v1}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${site_s}/vaccine-orders"
              payload: { expected_vfc_doses: 5 }
              as: VaccineManager
              captures: { ord2: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord2}/lines"
              payload: { vaccine_product_id: "${prod_p}", requested_doses: 5 }
              as: VaccineManager
              captures: { ord2_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord2}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v2: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord2}/approve"
              payload: { approved_vfc_doses: 5, expected_provider_site_version: "${site_v2}" }
              as: StateProgramOfficer
          trigger:
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord1}/allocation-receipts"
              payload: { order_line_id: "${ord1_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-O1A", expires_on: "2027-06-30", quantity_doses: 4 }
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}/vaccine-orders/${ord1}"
              payload: {}
              as: VaccineManager
              captures: { ord1_mid_status: $.data.status }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord1}/allocation-receipts"
