            - "Chargeback.${cb_id}.reversal_cents == 0"
            - "Vendor.${v_id}.open_chargeback_cents == 425000"
            - "Vendor.${v_id}.recovered_lifetime_cents == 0"
            - "Vendor.${v_id}.refund_due_cents == 0"
            - "Vendor.${v_id}.exposure_alert_flag == false"

      - name: violation_void_restores_open_counts_but_not_the_evidence_ledger
        grounds:
          - state_machines.ComplianceViolation.EVIDENCE_COMPLETE_to_VOIDED
          - entities.Shipment.fields.open_violation_count
          - entities.Shipment.fields.evidence_capture_count
          - entities.Vendor.fields.open_violation_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: CARDINALITY, not money. Voiding a violation must return
          Shipment.open_violation_count and Vendor.open_violation_count to exactly their pre-filing
          value of 0, while the cumulative evidence ledger, Shipment.evidence_capture_count, is
          explicitly NOT compensated and must remain at 2 - a monotone audit counter. An
          implementation that decrements the evidence counter alongside the open counter, or that
          leaves open_violation_count at 1, breaks the invariant in opposite directions.
        test_recipe:
          setup:
            - "Vendor V-1502 with a PUBLISHED guide carrying TIER_1 LBL-01 (min_evidence_count 2)."
            - "One 1000-unit / 500-cent shipment received on 2026-08-10 with open_violation_count 0 and evidence_capture_count 0 - the pre-filing baseline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-1502", legal_name: "Ledgerkeep Labels", payment_terms_days: 45 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-A", title: "Domestic Routing Guide 2026-A", scope_code: "ALL", effective_from: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g1_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "LABELING", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 25000, per_unit_recovery_cents: 30, handling_pct: 2.00, min_fee_cents: 30000, cap_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_lbl_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po1_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po1_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /compliance/shipments/${s1_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /compliance/shipments/${s1_id}/violations"
              payload: { requirement_id: "${r_lbl_id}", affected_units: 500, affected_cartons: 20, narrative: "GS1-128 labels unreadable on half the load." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio_id: $.data.id }
            - call: "POST /compliance/violations/${vio_id}/evidence"
              payload: { kind: "PHOTO", reference_uri: "s3://evidence/lbl-01/face.jpg" }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { ev1_id: $.data.id }
            - call: "POST /compliance/violations/${vio_id}/evidence"
              payload: { kind: "SCAN", reference_uri: "s3://evidence/lbl-01/scan-fail.txt" }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { ev2_id: $.data.id }
            - call: "POST /compliance/violations/${vio_id}/void"
              payload: { void_reason: "Carrier-supplied overlabels were present; detection was in error." }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "After the third trigger call Shipment.${s1_id}.open_violation_count == 1 and Shipment.${s1_id}.evidence_capture_count == 2"
            - "ComplianceViolation.${vio_id}.status == VOIDED"
            - "ComplianceViolation.${vio_id}.evidence_count == 2"
            - "Shipment.${s1_id}.open_violation_count == 0"
            - "Shipment.${s1_id}.evidence_capture_count == 2"
            - "Vendor.${v_id}.open_violation_count == 0"
            - "Vendor.${v_id}.open_chargeback_cents == 0"
            - "GET /compliance/violations/${vio_id}/evidence returns total_count == 2"
            - "EvidenceItem.${ev1_id}.subject_type == VIOLATION"
            - "EvidenceItem.${ev2_id}.subject_type == VIOLATION"
            - "GET /compliance/chargebacks?violation_id=${vio_id} returns total_count == 0"
