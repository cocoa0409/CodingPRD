# =============================================================================
# Diabetes Education & CGM Program (DSMES) — benchmark seed tables (v1)
# §1.0–§1.7 live in this file. §1.8 → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  903. Diabetes Education & CGM Program (DSMES): referral & accreditation-required
  assessment, curriculum & DSMES-hours tracking, CGM/pump device enrollment & data,
  dietitian & goal/A1c, DSMT-hours benefit & billing, telehealth & group, no-show &
  completion, outcome

domain_name: diabetes-education-dsmes
api_prefix: /dsmes

# -----------------------------------------------------------------------------
# Complexity profile (Step 0)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation          # finite DSMT benefit-hour pool competed for by education sessions
  secondary_archetype: temporal_windowing      # dietitian calendars + group-class room scheduling
  complexity_layers:
    - optimistic_concurrency                    # session-schedule / group-seat CREATE-with-supersede on parent version
    - dual_variant_calculation                  # provisional (scheduled) vs final (attended) hours; projected vs measured A1c
    - cascading_side_effects                    # no-show -> suspend -> cancel sessions -> reverse hours/seats
    - rate_threshold_triggers                   # no-show suspension threshold; benefit-hour cap boundary

  entity_topology: flat                         # peer entities under /dsmes/<collection>, FK references in bodies
  state_machine_shape: parallel                 # Session carries independent encounter_status x billing_status axes
  relationship_patterns:
    - one_to_many                               # Enrollment -> Sessions, DeviceEnrollment -> DeviceReadings
    - many_to_many                              # Enrollment <-> GroupClass via group Sessions (seats)
    - cross_aggregate                           # Session validity depends on Enrollment/Referral/Program state
  role_model: peer_roles                        # ProgramCoordinator (ops), Dietitian (clinical), BillingSpecialist (revenue)
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "DSMES program / site name" }
      - { name: accreditation_body, type: enum, source: input, description: "Accrediting body", constraints: "one of ADA, ADCES" }
      - { name: accreditation_status, type: enum, source: input, default: ACCREDITED, description: "Accreditation posture; must be ACCREDITED to enroll", constraints: "one of ACCREDITED, PROBATION, LAPSED" }
      - { name: accreditation_expires_on, type: datetime, source: input, required: false, description: "Date accreditation lapses (informational)" }

  - name: Curriculum
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Curriculum template name" }
      - { name: diabetes_type_focus, type: enum, source: input, description: "Population this curriculum targets", constraints: "one of TYPE_1, TYPE_2, GESTATIONAL, PREDIABETES, ANY" }
      - { name: required_hours, type: number, source: input, description: "Curriculum-required completed education hours to finish the program (e.g. 10.0)" }
      - { name: module_count, type: integer, source: input, description: "Number of curriculum modules" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB (date)" }
      - { name: diabetes_type, type: enum, source: input, description: "Diabetes classification", constraints: "one of TYPE_1, TYPE_2, GESTATIONAL, PREDIABETES" }
      - { name: payer, type: enum, source: input, description: "Primary payer", constraints: "one of MEDICARE, MEDICAID, COMMERCIAL, SELF_PAY" }
      - { name: baseline_a1c, type: number, source: input, description: "Baseline HbA1c percent at intake (e.g. 8.0)" }

  - name: Dietitian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Registered dietitian / educator name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: credential, type: enum, source: input, description: "Professional credential", constraints: "one of RD, RN, CDCES, PHARMD" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the educator is currently practicing" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: referring_provider_npi, type: string, source: input, description: "NPI of the referring clinician" }
      - { name: referral_reason, type: enum, source: input, description: "Reason for referral", constraints: "one of NEWLY_DIAGNOSED, POOR_CONTROL, MEDICATION_CHANGE, ANNUAL_FOLLOWUP" }
      - { name: status, type: enum, source: system, description: "Referral lifecycle", constraints: "one of RECEIVED, ASSESSED, ENROLLED, REJECTED" }
      - { name: assessment_completed_at, type: datetime, source: computed, required: false, description: "Logical-clock time the accreditation-required assessment was completed" }
      - { name: assessed_a1c, type: number, source: computed, required: false, description: "HbA1c recorded at the assessment" }
      - { name: assessed_by_dietitian_id, type: string, source: computed, required: false, description: "Dietitian X-User-ID that completed the assessment (denormalized actor id, not a navigable FK)" }
      - { name: rejection_reason, type: string, source: computed, required: false, description: "Reason captured on rejection" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id" }
      - { name: curriculum_id, type: string, source: input, description: "FK -> Curriculum.id" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id (copied from referral)" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id (copied from referral)" }
      - { name: benefit_year_index, type: integer, source: system, default: 0, description: "0 = initial DSMT benefit year; >=1 = follow-up year (re-anchoring out of scope)" }
      - { name: benefit_year_start, type: datetime, source: system, required: false, description: "Logical-clock date the benefit year anchored (set at activation)" }
      - { name: benefit_year_end, type: datetime, source: computed, required: false, description: "= benefit_year_start + 365 days" }
      - { name: benefit_hours_cap, type: number, source: computed, description: "= INITIAL_BENEFIT_HOURS (10.0) when benefit_year_index==0 else FOLLOWUP_BENEFIT_HOURS (2.0)" }
      - { name: required_curriculum_hours, type: number, source: system, description: "Copied from Curriculum.required_hours at creation" }
      - { name: provisional_hours_used, type: number, source: computed, default: 0, description: "Sum of per-session provisional hours over sessions in {SCHEDULED, CHECKED_IN, COMPLETED} (see calc enrollment_hours_dual)" }
      - { name: final_hours_used, type: number, source: computed, default: 0, description: "Sum of per-session final hours over sessions in {COMPLETED} only (see calc enrollment_hours_dual)" }
      - { name: hours_remaining, type: number, source: computed, description: "= benefit_hours_cap - provisional_hours_used" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Count of this enrollment's sessions in NO_SHOW" }
      - { name: status, type: enum, source: system, description: "Enrollment lifecycle", constraints: "one of PENDING, ACTIVE, SUSPENDED, COMPLETED, WITHDRAWN" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: dietitian_id, type: string, source: input, description: "FK -> Dietitian.id" }
      - { name: group_class_id, type: string, source: input, required: false, description: "FK -> GroupClass.id (null for individual sessions; set for group sessions)" }
      - { name: modality, type: enum, source: input, description: "Delivery modality", constraints: "one of INDIVIDUAL, GROUP" }
      - { name: is_telehealth, type: boolean, source: input, default: false, description: "Telehealth place-of-service modifier (does not change unit math)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: planned_minutes, type: integer, source: computed, description: "= (scheduled_end - scheduled_start) in whole minutes" }
      - { name: actual_minutes, type: integer, source: computed, required: false, description: "Face-to-face minutes supplied at completion" }
      - { name: provisional_hours, type: number, source: computed, description: "= floor(planned_minutes / UNIT_MINUTES) * HOURS_PER_UNIT" }
      - { name: final_hours, type: number, source: computed, required: false, description: "= floor(actual_minutes / UNIT_MINUTES) * HOURS_PER_UNIT (set at COMPLETED)" }
      - { name: billable_units, type: integer, source: computed, required: false, description: "30-minute DSMT units billed (see calc session_billing)" }
      - { name: charge_cents, type: integer, source: computed, required: false, description: "= billable_units * per-unit rate for modality (see calc session_billing)" }
      - { name: encounter_status, type: enum, source: system, description: "Encounter axis", constraints: "one of SCHEDULED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "Billing axis (independent of encounter axis)", constraints: "one of UNBILLED, SUBMITTED, PAID, DENIED" }

  - name: GroupClass
    parent: null
    common_fields: true
    fields:
      - { name: curriculum_id, type: string, source: input, description: "FK -> Curriculum.id" }
      - { name: dietitian_id, type: string, source: input, description: "FK -> Dietitian.id (educator leading the class)" }
      - { name: room_id, type: string, source: input, description: "Room identifier used for room-conflict overlap detection" }
      - { name: scheduled_start, type: datetime, source: input, description: "Class start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Class end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: capacity, type: integer, source: input, description: "Maximum seats (participants)" }
      - { name: seats_taken, type: integer, source: computed, default: 0, description: "Count of group Sessions referencing this class in {SCHEDULED, CHECKED_IN, COMPLETED, NO_SHOW} (CANCELLED releases the seat)" }
      - { name: topic, type: string, source: input, description: "Class topic / module" }

  - name: DeviceEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: device_type, type: enum, source: input, description: "Device category", constraints: "one of CGM, INSULIN_PUMP, SMART_PEN" }
      - { name: serial_number, type: string, source: input, description: "Device serial number" }
      - { name: status, type: enum, source: system, description: "Device loan lifecycle", constraints: "one of REQUESTED, ACTIVE, RETURNED, EXPIRED" }
      - { name: activated_at, type: datetime, source: computed, required: false, description: "Logical-clock time device was activated" }
      - { name: expires_on, type: datetime, source: computed, required: false, description: "= activated_at + DEVICE_LOAN_DAYS (90) days" }
      - { name: readings_count, type: integer, source: computed, default: 0, description: "Number of accepted DeviceReading rows" }
      - { name: latest_glucose_mgdl, type: number, source: computed, required: false, description: "glucose_mgdl of the reading with the latest measured_at (tie-break created_at ASC)" }
      - { name: avg_glucose_mgdl, type: number, source: computed, required: false, description: "Mean glucose_mgdl over accepted readings, 1 decimal, round_half_up" }

  - name: DeviceReading
    parent: null
    common_fields: false         # id, created_at only — append-only, immutable
    fields:
      - { name: device_enrollment_id, type: string, source: input, description: "FK -> DeviceEnrollment.id" }
      - { name: glucose_mgdl, type: number, source: input, description: "Sensor glucose value in mg/dL" }
      - { name: measured_at, type: datetime, source: input, description: "Instant the reading was captured (ISO 8601 UTC)" }

  - name: CarePlan
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: goal_description, type: string, source: input, description: "Behavioral / clinical goal narrative" }
      - { name: target_a1c, type: number, source: input, description: "Target HbA1c percent" }
      - { name: baseline_a1c, type: number, source: system, description: "Copied from the enrollment's patient at creation" }
      - { name: projected_a1c_delta, type: number, source: computed, description: "Provisional projected A1c reduction from education hours (see calc a1c_outcome_dual)" }
      - { name: measured_a1c, type: number, source: computed, required: false, description: "Measured HbA1c supplied at close" }
      - { name: final_a1c_delta, type: number, source: computed, required: false, description: "Final measured A1c reduction = baseline_a1c - measured_a1c (see calc a1c_outcome_dual)" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times the plan target has been revised" }
      - { name: status, type: enum, source: system, description: "Care-plan lifecycle", constraints: "one of OPEN, REVISED, MET, NOT_MET" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [ENROLLED, REJECTED]
    transitions:
      - from: RECEIVED
        to: ASSESSED
        trigger: "POST /dsmes/referrals/{id}/assess"
        actor: Dietitian
        preconditions:
          - "Referral.status == RECEIVED (else ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "assessment_completed_at = current logical clock"
          - "assessed_a1c = input assessed_a1c"
          - "assessed_by_dietitian_id = X-User-ID"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /dsmes/referrals/{id}/reject"
        actor: ProgramCoordinator
        preconditions:
          - "Referral.status in {RECEIVED, ASSESSED} (else ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "rejection_reason = input rejection_reason"

      - from: ASSESSED
        to: REJECTED
        trigger: "POST /dsmes/referrals/{id}/reject"
        actor: ProgramCoordinator
        preconditions:
          - "Referral.status in {RECEIVED, ASSESSED} (else ERR_REFERRAL_INVALID_STATE)"
        side_effects:
          - "rejection_reason = input rejection_reason"

      - from: ASSESSED
        to: ENROLLED
        trigger: "system — on POST /dsmes/enrollments creating an Enrollment for this referral"
        actor: system
        preconditions:
          - "Referral.status == ASSESSED (cross-entity guard on enrollment creation; else ERR_REFERRAL_NOT_ASSESSED)"
        side_effects:
          - "Referral becomes terminal ENROLLED (bubble-up from Enrollment creation)"

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /dsmes/enrollments/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "Enrollment.status == PENDING (else ERR_ENROLLMENT_INVALID_STATE)"
          - "Program.accreditation_status == ACCREDITED (else ERR_PROGRAM_NOT_ACCREDITED)"
        side_effects:
          - "benefit_year_start = current logical clock date"
          - "benefit_year_end recomputed = benefit_year_start + 365 days"
          - "increments Enrollment.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — when no_show_count reaches NO_SHOW_SUSPENSION_THRESHOLD after a session NO_SHOW"
        actor: system
        preconditions:
          - "Enrollment.status == ACTIVE and no_show_count >= 3"
        side_effects:
          - "CASCADE: every Session of this enrollment in {SCHEDULED, CHECKED_IN} transitions to CANCELLED"
          - "each cascaded cancel reverses that session's provisional hours and, for group sessions, releases the GroupClass seat"
          - "provisional_hours_used and hours_remaining recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dsmes/enrollments/{id}/reinstate"
        actor: ProgramCoordinator
        preconditions:
          - "Enrollment.status == SUSPENDED (else ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "increments Enrollment.version by 1"
          - "no_show_count is NOT reset (historical strikes persist)"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system — when final_hours_used >= required_curriculum_hours after a session COMPLETED"
        actor: system
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "final_hours_used >= required_curriculum_hours"
        side_effects:
          - "CASCADE: each OPEN CarePlan on this enrollment recomputes projected_a1c_delta from final_hours_used"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /dsmes/enrollments/{id}/withdraw"
        actor: ProgramCoordinator
        preconditions:
          - "Enrollment.status in {ACTIVE, SUSPENDED} (else ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "CASCADE: every Session in {SCHEDULED, CHECKED_IN} transitions to CANCELLED (reversing provisional hours / releasing seats)"

      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /dsmes/enrollments/{id}/withdraw"
        actor: ProgramCoordinator
        preconditions:
          - "Enrollment.status in {ACTIVE, SUSPENDED} (else ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "CASCADE: every Session in {SCHEDULED, CHECKED_IN} transitions to CANCELLED (reversing provisional hours / releasing seats)"

  - entity: Session
    note: "Two independent axes: encounter_status (below) and billing_status (see Session.billing state machine). Terminal encounter states may still evolve on the billing axis."
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /dsmes/sessions/{id}/check-in"
        actor: Dietitian
        preconditions:
          - "Session.encounter_status == SCHEDULED (else ERR_SESSION_INVALID_STATE)"
        side_effects: []

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /dsmes/sessions/{id}/complete"
        actor: Dietitian
        preconditions:
          - "Session.encounter_status == CHECKED_IN (else ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "actual_minutes = input actual_minutes; final_hours = floor(actual_minutes/30)*0.5"
          - "billable_units and charge_cents computed (calc session_billing) using benefit units remaining BEFORE this completion"
          - "billing_status: UNBILLED -> SUBMITTED"
          - "Enrollment.final_hours_used recomputed (LINK1)"
          - "if final_hours_used >= required_curriculum_hours: Enrollment ACTIVE -> COMPLETED (LINK2), which recomputes each OPEN CarePlan.projected_a1c_delta (LINK3)"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /dsmes/sessions/{id}/no-show"
        actor: Dietitian
        preconditions:
          - "Session.encounter_status == SCHEDULED (else ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "Enrollment.no_show_count += 1 (LINK1); provisional_hours_used recomputed (NO_SHOW leaves the provisional set)"
          - "if no_show_count >= 3: Enrollment ACTIVE -> SUSPENDED (LINK2), cascading cancellation of remaining SCHEDULED/CHECKED_IN sessions (LINK3), each reversing provisional hours / releasing seats (LINK4)"
          - "group session NO_SHOW keeps the GroupClass seat consumed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dsmes/sessions/{id}/cancel"
        actor: Dietitian
        preconditions:
          - "Session.encounter_status in {SCHEDULED, CHECKED_IN} (else ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "provisional_hours reversed from Enrollment.provisional_hours_used; hours_remaining recomputed"
          - "if group session: GroupClass.seats_taken -= 1 (seat released)"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /dsmes/sessions/{id}/cancel"
        actor: Dietitian
        preconditions:
          - "Session.encounter_status in {SCHEDULED, CHECKED_IN} (else ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "provisional_hours reversed from Enrollment.provisional_hours_used; hours_remaining recomputed"
          - "if group session: GroupClass.seats_taken -= 1 (seat released)"

  - entity: Session.billing
    note: "Independent billing axis on the same Session row; advances only after the encounter reaches COMPLETED."
    initial_state: UNBILLED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: UNBILLED
        to: SUBMITTED
        trigger: "system — on Session encounter COMPLETED"
        actor: system
        preconditions:
          - "Session.encounter_status == COMPLETED"
        side_effects:
          - "billable_units, charge_cents pinned at submission"

      - from: SUBMITTED
        to: PAID
        trigger: "POST /dsmes/sessions/{id}/adjudicate (billing_decision=PAID)"
        actor: BillingSpecialist
        preconditions:
          - "Session.billing_status == SUBMITTED (else ERR_BILLING_INVALID_STATE)"
        side_effects: []

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /dsmes/sessions/{id}/adjudicate (billing_decision=DENIED)"
        actor: BillingSpecialist
        preconditions:
          - "Session.billing_status == SUBMITTED (else ERR_BILLING_INVALID_STATE)"
        side_effects: []

  - entity: DeviceEnrollment
    initial_state: REQUESTED
    terminal_states: [RETURNED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /dsmes/device-enrollments/{id}/activate"
        actor: Dietitian
        preconditions:
          - "DeviceEnrollment.status == REQUESTED (else ERR_DEVICE_INVALID_STATE)"
          - "Enrollment.status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "activated_at = current logical clock; expires_on = activated_at + 90 days"

      - from: ACTIVE
        to: RETURNED
        trigger: "POST /dsmes/device-enrollments/{id}/return"
        actor: Dietitian
        preconditions:
          - "DeviceEnrollment.status == ACTIVE (else ERR_DEVICE_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system — on POST /dsmes/device-enrollments/{id}/readings when current clock > expires_on"
        actor: system
        preconditions:
          - "DeviceEnrollment.status == ACTIVE and current clock > expires_on"
        side_effects:
          - "reading is rejected with ERR_DEVICE_EXPIRED; device transitions to EXPIRED (no reading persisted)"

  - entity: CarePlan
    initial_state: OPEN
    terminal_states: [MET, NOT_MET]
    transitions:
      - from: OPEN
        to: REVISED
        trigger: "POST /dsmes/care-plans/{id}/revise"
        actor: Dietitian
        preconditions:
          - "CarePlan.status == OPEN (else ERR_CARE_PLAN_INVALID_STATE)"
        side_effects:
          - "target_a1c = input target_a1c; revision_count += 1"

      - from: REVISED
        to: OPEN
        trigger: "POST /dsmes/care-plans/{id}/reopen"
        actor: Dietitian
        preconditions:
          - "CarePlan.status == REVISED (else ERR_CARE_PLAN_INVALID_STATE)"
        side_effects:
          - "projected_a1c_delta recomputed from current final_hours_used"

      - from: OPEN
        to: MET
        trigger: "POST /dsmes/care-plans/{id}/close (outcome=MET)"
        actor: Dietitian
        preconditions:
          - "CarePlan.status == OPEN (else ERR_CARE_PLAN_INVALID_STATE)"
        side_effects:
          - "measured_a1c = input measured_a1c; final_a1c_delta = baseline_a1c - measured_a1c"

      - from: OPEN
        to: NOT_MET
        trigger: "POST /dsmes/care-plans/{id}/close (outcome=NOT_MET)"
        actor: Dietitian
        preconditions:
          - "CarePlan.status == OPEN (else ERR_CARE_PLAN_INVALID_STATE)"
        side_effects:
          - "measured_a1c = input measured_a1c; final_a1c_delta = baseline_a1c - measured_a1c"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede)
# =============================================================================
concurrency_rules:
  - rule_id: session-schedule-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /dsmes/sessions"
    occ_field: "expected_enrollment_version"
    description: |
      Scheduling an individual Session against an Enrollment whose version has
      advanced since the client last observed it is rejected. Each schedule debits
      the finite DSMT benefit-hour pool (provisional_hours_used) and advances the
      enrollment version; a create still carrying the pre-debit version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: group-seat-stale-class
    parent_entity: GroupClass
    write_endpoint: "POST /dsmes/group-classes/{id}/sessions"
    occ_field: "expected_group_class_version"
    description: |
      Reserving a seat (creating a group Session) against a GroupClass whose version
      has advanced since the client last observed it is rejected. Each seat reservation
      consumes finite capacity and advances the class version; a reservation carrying
      the pre-reservation version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_hours_rounding
    trigger: "session creation (provisional_hours) and session completion (final_hours)"
    algorithm: threshold
    formula: |
      units(minutes) = floor(minutes / UNIT_MINUTES)          # 30-min DSMT units
      provisional_hours = units(planned_minutes) * HOURS_PER_UNIT
      final_hours       = units(actual_minutes)  * HOURS_PER_UNIT
      # Pinned ordering (combinatorial mode b): round EACH session to whole 30-min
      # units FIRST, then aggregate at the enrollment level. Never sum raw minutes
      # across sessions and divide once.
    input_set: "single session's planned_minutes / actual_minutes"
    constants:
      UNIT_MINUTES: 30
      HOURS_PER_UNIT: 0.5
    precision: "hours are multiples of 0.5; minutes floored to whole units"

  - name: enrollment_hours_dual
    trigger: "session create, check-in, complete, no-show, cancel; enrollment cascade"
    algorithm: aggregation
    formula: |
      provisional_hours_used = SUM over sessions s of this enrollment
          WHERE s.encounter_status IN {SCHEDULED, CHECKED_IN, COMPLETED}
          OF floor(s.planned_minutes / 30) * 0.5
      final_hours_used = SUM over sessions s of this enrollment
          WHERE s.encounter_status == COMPLETED
          OF floor(s.actual_minutes / 30) * 0.5
      hours_remaining = benefit_hours_cap - provisional_hours_used
    input_set: "enrollment's non-cancelled sessions; NO_SHOW and CANCELLED excluded from both sums"
    variants:
      - name: provisional
        when: "scheduling / capacity gating and hours_remaining display"
        difference: "includes SCHEDULED and CHECKED_IN sessions from planned_minutes; forward-looking"
      - name: final
        when: "curriculum completion check and billing base"
        difference: "counts only COMPLETED sessions from actual_minutes; chronological / realized"
    precision: "0.5-hour multiples"

  - name: session_billing
    trigger: "session completion (CHECKED_IN -> COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      remaining_units_before = round((benefit_hours_cap - final_hours_used_BEFORE_this) / HOURS_PER_UNIT)
      raw_units = floor(actual_minutes / UNIT_MINUTES)
      billable_units = min(raw_units, max(remaining_units_before, 0))     # cannot bill beyond benefit
      unit_rate_cents = INDIVIDUAL_UNIT_RATE_CENTS if modality == INDIVIDUAL else GROUP_UNIT_RATE_CENTS
      charge_cents = billable_units * unit_rate_cents
      # >=3 inputs (actual_minutes, remaining benefit units, modality) with nested
      # min/max and a conditional rate branch (combinatorial mode a).
    input_set: "the completing session plus the enrollment's benefit consumption before this completion"
    constants:
      UNIT_MINUTES: 30
      HOURS_PER_UNIT: 0.5
      INDIVIDUAL_UNIT_RATE_CENTS: 5000
      GROUP_UNIT_RATE_CENTS: 1500
    precision: "integer cents; units are whole 30-min increments"

  - name: a1c_outcome_dual
    trigger: "care-plan creation / reopen (projected); care-plan close (final)"
    algorithm: projection
    formula: |
      projected_a1c_delta = min(final_hours_used * A1C_REDUCTION_PER_HOUR,
                                max(baseline_a1c - A1C_FLOOR, 0))
      final_a1c_delta = baseline_a1c - measured_a1c        # only when closed
    input_set: "enrollment final_hours_used (projected) vs measured lab A1c at close (final)"
    constants:
      A1C_REDUCTION_PER_HOUR: 0.1
      A1C_FLOOR: 6.5
    variants:
      - name: projected
        when: "plan is OPEN / REVISED — estimate from completed education hours"
        difference: "derived from final_hours_used, capped at baseline_a1c - 6.5"
      - name: final
        when: "plan close — realized from a measured lab value"
        difference: "baseline_a1c - measured_a1c, independent of hours"
    precision: "1 decimal place, round_half_up"

  - name: group_seats
    trigger: "group session create / cancel / enrollment cascade"
    algorithm: aggregation
    formula: |
      seats_taken = COUNT of group Sessions g WHERE g.group_class_id == class.id
                    AND g.encounter_status IN {SCHEDULED, CHECKED_IN, COMPLETED, NO_SHOW}
      # capacity gate on reserve: seats_taken (before) < capacity
    input_set: "group class's non-cancelled group sessions"
    constants: {}
    precision: "integer seats"

  - name: device_glucose_stats
    trigger: "accepted DeviceReading ingest"
    algorithm: aggregation
    formula: |
      readings_count = COUNT of accepted readings for the device
      avg_glucose_mgdl = mean(glucose_mgdl over accepted readings)
      latest_glucose_mgdl = glucose_mgdl of the reading with MAX measured_at
                            (tie-break: created_at ASC)
    input_set: "device's accepted readings"
    constants: {}
    precision: "avg to 1 decimal, round_half_up"

  - name: no_show_suspension
    trigger: "session NO_SHOW"
    algorithm: threshold
    formula: |
      no_show_count = COUNT of enrollment's sessions in NO_SHOW
      if no_show_count >= NO_SHOW_SUSPENSION_THRESHOLD and Enrollment.status == ACTIVE:
          Enrollment -> SUSPENDED (with cascade cancellation)
    input_set: "enrollment's NO_SHOW sessions"
    constants:
      NO_SHOW_SUSPENSION_THRESHOLD: 3
    precision: "integer count; boundary is >= (the 3rd no-show suspends)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path and body-referenced resources exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "OCC: when expected_<parent>_version supplied, it equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dsmes/sessions, POST /dsmes/group-classes/{id}/sessions"
    note: "Checked BEFORE business rules so a stale write never mutates the pool."

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, numeric ranges"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create/action endpoints"

  - priority: 6
    category: business_temporal
    check: "scheduled_end strictly after scheduled_start"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /dsmes/sessions, POST /dsmes/group-classes"

  - priority: 7
    category: state
    check: "Enrollment.status == ACTIVE for session scheduling and device activation"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /dsmes/sessions, POST /dsmes/group-classes/{id}/sessions, POST /dsmes/device-enrollments/{id}/activate"

  - priority: 8
    category: state
    check: "Session encounter_status precondition for the requested encounter transition"
    error_id: ERR_SESSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /dsmes/sessions/{id}/(check-in|complete|no-show|cancel)"

  - priority: 9
    category: state
    check: "Referral.status == ASSESSED before an Enrollment can be created"
    error_id: ERR_REFERRAL_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /dsmes/enrollments"

  - priority: 10
    category: business_referential
    check: "Program.accreditation_status == ACCREDITED before an enrollment activates"
    error_id: ERR_PROGRAM_NOT_ACCREDITED
    http_status: 403
    applies_to: "POST /dsmes/enrollments/{id}/activate"

  - priority: 11
    category: business_referential
    check: "Curriculum.diabetes_type_focus is ANY or equals the patient's diabetes_type"
    error_id: ERR_CURRICULUM_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /dsmes/enrollments"

  - priority: 12
    category: business_temporal
    check: "Dietitian has no other non-terminal INDIVIDUAL session overlapping [start,end) (half-open; touching endpoints allowed)"
    error_id: ERR_DIETITIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /dsmes/sessions"

  - priority: 13
    category: business_temporal
    check: "The enrolling patient has no other non-terminal session overlapping the group class time window"
    error_id: ERR_PATIENT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /dsmes/group-classes/{id}/sessions"

  - priority: 14
    category: business_constraint
    check: "GroupClass.seats_taken < capacity before reserving a seat"
    error_id: ERR_GROUP_CLASS_FULL
    http_status: 409
    applies_to: "POST /dsmes/group-classes/{id}/sessions"

  - priority: 15
    category: business_temporal
    check: "New GroupClass in the same room_id keeps >= ROOM_BUFFER_MINUTES (15) gap from every other class (closed interval + buffer)"
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /dsmes/group-classes"

  - priority: 16
    category: business_fiscal
    check: "provisional_hours_used + this session's provisional_hours must not exceed benefit_hours_cap"
    error_id: ERR_BENEFIT_HOURS_EXCEEDED
    http_status: 402
    applies_to: "POST /dsmes/sessions, POST /dsmes/group-classes/{id}/sessions"

  - priority: 17
    category: state
    check: "DeviceEnrollment.status == ACTIVE and current clock <= expires_on for reading ingest"
    error_id: ERR_DEVICE_EXPIRED
    http_status: 409
    applies_to: "POST /dsmes/device-enrollments/{id}/readings"

  - priority: 18
    category: state
    check: "Session.billing_status == SUBMITTED before adjudication"
    error_id: ERR_BILLING_INVALID_STATE
    http_status: 409
    applies_to: "POST /dsmes/sessions/{id}/adjudicate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/window rules read this clock."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Program ----
  - method: POST
    path: "/dsmes/programs"
    description: "Create a DSMES program"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, accreditation_body, "accreditation_status?", "accreditation_expires_on?"]
    output: Program
    side_effects: ["accreditation_status defaults to ACCREDITED"]

  - method: GET
    path: "/dsmes/programs/{id}"
    description: "Get a program"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: Program
    side_effects: []

  # ---- Curriculum ----
  - method: POST
    path: "/dsmes/curricula"
    description: "Create a curriculum template"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, diabetes_type_focus, required_hours, module_count]
    output: Curriculum
    side_effects: []

  - method: GET
    path: "/dsmes/curricula/{id}"
    description: "Get a curriculum"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: Curriculum
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/dsmes/patients"
    description: "Register a patient"
    roles: [ProgramCoordinator]
    code: 201
    input: [mrn, full_name, date_of_birth, diabetes_type, payer, baseline_a1c]
    output: Patient
    side_effects: []

  - method: GET
    path: "/dsmes/patients/{id}"
    description: "Get a patient"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Dietitian ----
  - method: POST
    path: "/dsmes/dietitians"
    description: "Register a dietitian / educator"
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, npi, credential, "active?"]
    output: Dietitian
    side_effects: []

  - method: GET
    path: "/dsmes/dietitians/{id}"
    description: "Get a dietitian"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: Dietitian
    side_effects: []

  # ---- Referral ----
  - method: POST
    path: "/dsmes/referrals"
    description: "Create a referral (RECEIVED)"
    roles: [ProgramCoordinator]
    code: 201
    input: [program_id, patient_id, referring_provider_npi, referral_reason]
    output: Referral
    side_effects: ["status = RECEIVED"]

  - method: GET
    path: "/dsmes/referrals/{id}"
    description: "Get a referral"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/dsmes/referrals"
    description: "List referrals (filterable)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: ["program_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  - method: POST
    path: "/dsmes/referrals/{id}/assess"
    description: "Complete the accreditation-required assessment (RECEIVED -> ASSESSED)"
    roles: [Dietitian]
    code: 200
    input: [assessed_a1c]
    output: Referral
    side_effects: ["status -> ASSESSED", "assessment_completed_at, assessed_a1c, assessed_by_dietitian_id set"]

  - method: POST
    path: "/dsmes/referrals/{id}/reject"
    description: "Reject a referral"
    roles: [ProgramCoordinator]
    code: 200
    input: ["rejection_reason?"]
    output: Referral
    side_effects: ["status -> REJECTED"]

  # ---- Enrollment ----
  - method: POST
    path: "/dsmes/enrollments"
    description: "Create an enrollment from an ASSESSED referral (PENDING)"
    roles: [ProgramCoordinator]
    code: 201
    input: [referral_id, curriculum_id]
    output: Enrollment
    side_effects:
      - "status = PENDING; patient_id/program_id copied from referral"
      - "required_curriculum_hours copied from curriculum"
      - "Referral -> ENROLLED (bubble-up)"

  - method: GET
    path: "/dsmes/enrollments/{id}"
    description: "Get an enrollment (with computed hours)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/dsmes/enrollments"
    description: "List enrollments (filterable)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: ["referral_id?", "patient_id?", "curriculum_id?", "program_id?", "status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []

  - method: POST
    path: "/dsmes/enrollments/{id}/activate"
    description: "Activate an enrollment (PENDING -> ACTIVE)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> ACTIVE", "benefit_year_start/end set", "increments Enrollment.version by 1"]

  - method: POST
    path: "/dsmes/enrollments/{id}/reinstate"
    description: "Reinstate a suspended enrollment (SUSPENDED -> ACTIVE)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> ACTIVE", "increments Enrollment.version by 1", "no_show_count retained"]

  - method: POST
    path: "/dsmes/enrollments/{id}/withdraw"
    description: "Withdraw an enrollment (ACTIVE|SUSPENDED -> WITHDRAWN)"
    roles: [ProgramCoordinator]
    code: 200
    input: ["withdraw_reason?"]
    output: Enrollment
    side_effects: ["status -> WITHDRAWN", "cascade-cancel remaining SCHEDULED/CHECKED_IN sessions"]

  # ---- Session (individual) ----
  - method: POST
    path: "/dsmes/sessions"
    description: "Schedule an INDIVIDUAL session (OCC on enrollment; debits provisional hours)"
    roles: [Dietitian]
    code: 201
    input: [enrollment_id, dietitian_id, modality, scheduled_start, scheduled_end, "is_telehealth?", expected_enrollment_version]
    output: Session
    side_effects:
      - "encounter_status = SCHEDULED; billing_status = UNBILLED"
      - "planned_minutes, provisional_hours computed"
      - "Enrollment.provisional_hours_used/hours_remaining recomputed"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/dsmes/sessions/{id}"
    description: "Get a session"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/dsmes/sessions"
    description: "List sessions (filterable)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: ["enrollment_id?", "dietitian_id?", "group_class_id?", "encounter_status?", "billing_status?", "limit?", "offset?"]
    output: "Session[]"
    side_effects: []

  - method: POST
    path: "/dsmes/sessions/{id}/check-in"
    description: "Check in a session (SCHEDULED -> CHECKED_IN)"
    roles: [Dietitian]
    code: 200
    input: []
    output: Session
    side_effects: ["encounter_status -> CHECKED_IN"]

  - method: POST
    path: "/dsmes/sessions/{id}/complete"
    description: "Complete a session (CHECKED_IN -> COMPLETED); computes final hours and billing"
    roles: [Dietitian]
    code: 200
    input: [actual_minutes]
    output: Session
    side_effects:
      - "actual_minutes, final_hours, billable_units, charge_cents computed"
      - "billing_status -> SUBMITTED"
      - "Enrollment.final_hours_used recomputed; may auto-COMPLETE enrollment (cascade to CarePlan projected delta)"

  - method: POST
    path: "/dsmes/sessions/{id}/no-show"
    description: "Mark a session NO_SHOW (SCHEDULED -> NO_SHOW)"
    roles: [Dietitian]
    code: 200
    input: []
    output: Session
    side_effects:
      - "encounter_status -> NO_SHOW"
      - "Enrollment.no_show_count += 1; may auto-SUSPEND enrollment (cascade-cancel remaining sessions)"

  - method: POST
    path: "/dsmes/sessions/{id}/cancel"
    description: "Cancel a session (SCHEDULED|CHECKED_IN -> CANCELLED)"
    roles: [Dietitian]
    code: 200
    input: ["cancel_reason?"]
    output: Session
    side_effects:
      - "encounter_status -> CANCELLED"
      - "provisional hours reversed; group seat released if applicable"

  - method: POST
    path: "/dsmes/sessions/{id}/adjudicate"
    description: "Adjudicate a submitted claim (SUBMITTED -> PAID|DENIED)"
    roles: [BillingSpecialist]
    code: 200
    input: [billing_decision]
    output: Session
    side_effects: ["billing_status -> PAID or DENIED"]

  # ---- GroupClass ----
  - method: POST
    path: "/dsmes/group-classes"
    description: "Create a group class (room-conflict checked)"
    roles: [ProgramCoordinator]
    code: 201
    input: [curriculum_id, dietitian_id, room_id, scheduled_start, scheduled_end, capacity, topic]
    output: GroupClass
    side_effects: ["seats_taken = 0"]

  - method: GET
    path: "/dsmes/group-classes/{id}"
    description: "Get a group class"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: GroupClass
    side_effects: []

  - method: GET
    path: "/dsmes/group-classes"
    description: "List group classes (filterable)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: ["curriculum_id?", "dietitian_id?", "limit?", "offset?"]
    output: "GroupClass[]"
    side_effects: []

  - method: POST
    path: "/dsmes/group-classes/{id}/sessions"
    description: "Reserve a seat: create a GROUP session for an enrollment (OCC on class; consumes a seat + benefit hours)"
    roles: [Dietitian]
    code: 201
    input: [enrollment_id, "is_telehealth?", expected_group_class_version]
    output: Session
    side_effects:
      - "creates Session with modality=GROUP, group_class_id set, dietitian_id copied from class, times copied from class"
      - "encounter_status = SCHEDULED; provisional hours debited; GroupClass.seats_taken += 1"
      - "increments GroupClass.version by 1"

  # ---- DeviceEnrollment ----
  - method: POST
    path: "/dsmes/device-enrollments"
    description: "Enroll a CGM/pump device (REQUESTED)"
    roles: [ProgramCoordinator]
    code: 201
    input: [enrollment_id, device_type, serial_number]
    output: DeviceEnrollment
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/dsmes/device-enrollments/{id}"
    description: "Get a device enrollment"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: DeviceEnrollment
    side_effects: []

  - method: GET
    path: "/dsmes/device-enrollments"
    description: "List device enrollments (filterable)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: "DeviceEnrollment[]"
    side_effects: []

  - method: POST
    path: "/dsmes/device-enrollments/{id}/activate"
    description: "Activate a device (REQUESTED -> ACTIVE); requires enrollment ACTIVE"
    roles: [Dietitian]
    code: 200
    input: []
    output: DeviceEnrollment
    side_effects: ["status -> ACTIVE", "activated_at set; expires_on = activated_at + 90 days"]

  - method: POST
    path: "/dsmes/device-enrollments/{id}/return"
    description: "Return a device (ACTIVE -> RETURNED)"
    roles: [Dietitian]
    code: 200
    input: []
