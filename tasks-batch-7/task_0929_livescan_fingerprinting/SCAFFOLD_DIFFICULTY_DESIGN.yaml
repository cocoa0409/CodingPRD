              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/cards/${card_id}/positions/R_RING/attempts"
              payload: { score: 82 }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/cards/${card_id}/positions/R_LITTLE/attempts"
              payload: { score: 82 }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/cards/${card_id}/positions/L_THUMB/attempts"
              payload: { score: 82 }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/cards/${card_id}/positions/L_INDEX/attempts"
              payload: { score: 82 }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/cards/${card_id}/positions/L_MIDDLE/attempts"
              payload: { score: 82 }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/cards/${card_id}/positions/L_RING/attempts"
              payload: { score: 82 }
