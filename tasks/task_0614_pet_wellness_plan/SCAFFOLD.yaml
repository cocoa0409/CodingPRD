# =============================================================================
# PRD Benchmark Scaffold — Pet Wellness-Plan Membership
# (Banfield Optimum Wellness style)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  Pet Wellness-Plan Membership (Banfield Optimum Wellness style): plan tier &
  enrolled-pet, monthly recurring fee vs à-la-carte, included preventive services
  (exam/vaccine/dental) & usage tracking, multi-pet & multi-clinic, annual contract
  & auto-renew, service-credit reconciliation, upgrade/cancel proration,
  vs-insurance distinction

domain_name: pet-wellness-plan
api_prefix: /wellness

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # entitlement valuation (forward) vs credit consumption (chronological)
    - cascading_side_effects          # enroll/renew/cancel ripple across pet, ledger, clinic, contract
    - optimistic_concurrency          # OCC on Membership.version for plan-change-supersede race
    - derived_field_reconciliation    # contract.entitlement_balance reconciled from credit ledger

  entity_topology: hybrid
  # Membership is a parent aggregate; EnrolledPet, ContractTerm, ServiceCredit,
  # and ServiceVisit hang off it, while Plan, PlanService, and Clinic are
  # flat reference entities joined by FK.

  state_machine_shape: cyclic
  # ContractTerm cycles ACTIVE -> RENEWAL_PENDING -> ACTIVE across renewal rounds;
  # Membership branches ENROLLED -> {SUSPENDED, CANCEL_PENDING} -> ...

  relationship_patterns:
    - one_to_many        # Membership -> EnrolledPet, ContractTerm -> ServiceCredit
    - many_to_many       # PlanService <-> Plan via inclusion; ServiceVisit references Clinic + EnrolledPet
    - cross_aggregate    # ServiceVisit (per pet) debits ContractTerm.entitlement_balance_cents

  role_model: peer_roles
  # PlanAdmin owns catalog (Plan/PlanService/Clinic), Member owns own Membership,
  # ClinicStaff records visits, BillingAdmin runs the monthly billing epoch.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Reference / catalog entities (flat) ---

  - name: Plan
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: tier, type: enum, source: input, description: "Plan tier label", constraints: "one of {ESSENTIAL, PLUS, PREMIUM}" }
      - { name: name, type: string, source: input, description: "Human-readable plan name" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly membership fee in cents", constraints: ">= 0" }
      - { name: annual_value_cents, type: integer, source: input, description: "Catalog sticker value of the bundle for vs-a-la-carte comparison", constraints: ">= 0" }
      - { name: alacarte_discount_pct, type: number, source: input, description: "Member discount on à-la-carte (non-included) services, as a fraction", default: 0.0, constraints: "0.0 <= x <= 0.5" }
      - { name: enrollment_fee_cents, type: integer, source: input, description: "One-time fee charged at first enrollment of a pet on this plan", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Catalog availability", default: "ACTIVE", constraints: "one of {ACTIVE, RETIRED}" }

  - name: PlanService
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan that includes this preventive service" }
      - { name: service_code, type: enum, source: input, description: "Preventive service category", constraints: "one of {EXAM, VACCINE, DENTAL}" }
      - { name: included_quantity, type: integer, source: input, description: "Number of credits of this service granted per annual contract term", constraints: ">= 0" }
      - { name: unit_value_cents, type: integer, source: input, description: "Per-unit catalog value used for entitlement valuation and à-la-carte fallback pricing", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "Whether this inclusion line is live", default: "ACTIVE", constraints: "one of {ACTIVE, RETIRED}" }

  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinic name" }
      - { name: region_code, type: string, source: input, description: "Geographic region (e.g., CA, TX)" }
      - { name: status, type: enum, source: system, description: "Clinic operational state", default: "OPEN", constraints: "one of {OPEN, CLOSED}" }

  # --- Member account ---

  - name: MemberAccount
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique account email", constraints: "unique, case-insensitive" }
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: home_clinic_id, type: string, source: input, description: "FK -> Clinic.id; default clinic for this member's pets" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Refundable account credit balance; debited by fees, credited by cancellation refunds and proration credits", default: 0 }
      - { name: status, type: enum, source: system, description: "Account lifecycle", default: "ACTIVE", constraints: "one of {ACTIVE}" }

  # --- Membership aggregate root ---

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_account_id, type: string, source: input, description: "FK -> MemberAccount.id; owning account" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan currently in force on this membership" }
      - { name: billing_anchor_day, type: integer, source: input, description: "Day-of-month (1..28) the monthly fee is charged", constraints: "1 <= x <= 28" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "Snapshot of Plan.monthly_fee_cents at enrollment / last plan change; the amount billed each epoch" }
      - { name: pet_count, type: integer, source: computed, description: "Count of EnrolledPet rows under this membership whose status IN {ENROLLED, SUSPENDED}", default: 0 }
      - { name: auto_renew, type: boolean, source: input, description: "Whether the active ContractTerm rolls into a new term at expiry", default: true }
      - { name: status, type: enum, source: system, description: "Membership lifecycle", default: "PENDING_PAYMENT", constraints: "one of {PENDING_PAYMENT, ENROLLED, SUSPENDED, CANCEL_PENDING, CANCELLED}" }

  - name: EnrolledPet
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; owning membership" }
      - { name: name, type: string, source: input, description: "Pet name" }
      - { name: species, type: enum, source: input, description: "Pet species", constraints: "one of {DOG, CAT}" }
      - { name: weight_kg, type: number, source: input, description: "Pet weight in kg; affects DENTAL surcharge tier", constraints: "> 0" }
      - { name: enrolled_at, type: datetime, source: system, description: "When the pet was added (logical clock); drives mid-term proration" }
      - { name: status, type: enum, source: system, description: "Pet enrollment state", default: "ENROLLED", constraints: "one of {ENROLLED, SUSPENDED, REMOVED}" }

  - name: ContractTerm
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; owning membership" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan snapshot governing this term's included credits" }
      - { name: term_index, type: integer, source: system, description: "1 for the first term, incremented on each renewal", constraints: ">= 1" }
      - { name: starts_at, type: datetime, source: system, description: "Term start instant (logical clock)" }
      - { name: ends_at, type: datetime, source: system, description: "Term end instant = starts_at + 365 days" }
      - { name: entitlement_granted_cents, type: integer, source: computed, description: "Total catalog value of included credits granted for this term (forward-looking valuation)" }
      - { name: entitlement_consumed_cents, type: integer, source: computed, description: "Catalog value of credits consumed chronologically by ServiceVisits in this term", default: 0 }
      - { name: entitlement_balance_cents, type: integer, source: computed, description: "Derived: entitlement_granted_cents - entitlement_consumed_cents; reconciled from the ServiceCredit ledger", default: 0 }
      - { name: status, type: enum, source: system, description: "Term lifecycle", default: "ACTIVE", constraints: "one of {ACTIVE, RENEWAL_PENDING, EXPIRED, TERMINATED}" }

  - name: ServiceCredit
    parent: ContractTerm
    common_fields: true
    fields:
      - { name: contract_term_id, type: string, source: input, description: "FK -> ContractTerm.id; the term that granted this credit bucket" }
      - { name: service_code, type: enum, source: system, description: "Preventive service category this bucket covers", constraints: "one of {EXAM, VACCINE, DENTAL}" }
      - { name: granted_quantity, type: integer, source: system, description: "Units granted in this bucket at term start", constraints: ">= 0" }
      - { name: consumed_quantity, type: integer, source: computed, description: "Units consumed by COMPLETED ServiceVisits, in chronological order", default: 0 }
      - { name: unit_value_cents, type: integer, source: system, description: "Snapshot of PlanService.unit_value_cents at grant time" }
      - { name: status, type: enum, source: system, description: "Bucket state", default: "OPEN", constraints: "one of {OPEN, EXHAUSTED, FORFEITED}" }

  - name: ServiceVisit
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; owning membership" }
      - { name: enrolled_pet_id, type: string, source: input, description: "FK -> EnrolledPet.id; the pet seen" }
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; where the visit occurred" }
      - { name: contract_term_id, type: string, source: computed, description: "FK -> ContractTerm.id; the ACTIVE term the visit debits, resolved at recording time" }
      - { name: service_code, type: enum, source: input, description: "Preventive service rendered", constraints: "one of {EXAM, VACCINE, DENTAL}" }
      - { name: visited_at, type: datetime, source: system, description: "Visit instant (logical clock); defines chronological consumption order" }
      - { name: covered_by_credit, type: boolean, source: computed, description: "True if a ServiceCredit unit was available and consumed; false if billed à-la-carte", default: false }
      - { name: charged_cents, type: integer, source: computed, description: "Member charge for this visit: 0 if covered, else discounted à-la-carte price" }
      - { name: status, type: enum, source: system, description: "Visit state", default: "COMPLETED", constraints: "one of {COMPLETED, VOIDED}" }

  - name: BillingCycle
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; membership billed" }
      - { name: period_start, type: datetime, source: system, description: "Start of the billed monthly period" }
      - { name: period_end, type: datetime, source: system, description: "End of the billed monthly period" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Membership monthly fee charged this cycle (0 while SUSPENDED)" }
      - { name: proration_credit_cents, type: integer, source: computed, description: "Proration credit applied this cycle from mid-term plan changes/removals", default: 0 }
      - { name: status, type: enum, source: system, description: "Cycle state", default: "BILLED", constraints: "one of {BILLED}" }

  - name: PlanChangeRequest
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; membership being changed" }
      - { name: from_plan_id, type: string, source: input, description: "FK -> Plan.id; the plan in force before the change" }
      - { name: to_plan_id, type: string, source: input, description: "FK -> Plan.id; the target plan" }
      - { name: change_kind, type: enum, source: computed, description: "UPGRADE if to_plan.monthly_fee_cents > from_plan.monthly_fee_cents, else DOWNGRADE", constraints: "one of {UPGRADE, DOWNGRADE}" }
      - { name: proration_delta_cents, type: integer, source: computed, description: "Signed proration amount: positive = additional charge for the rest of the cycle, negative = credit back" }
      - { name: status, type: enum, source: system, description: "Request state", default: "APPLIED", constraints: "one of {APPLIED, SUPERSEDED}" }

  - name: ClockState
    parent: null
    common_fields: false   # id, created_at only
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Logical clock value; defaults to 2026-01-01T00:00:00Z at server startup" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Membership
    field: status
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ENROLLED
        trigger: "POST /wellness/memberships/{id}/activate"
        actor: Member
        preconditions:
          - "Membership.status == PENDING_PAYMENT (else ERR_MEMBERSHIP_NOT_PENDING)"
          - "At least one EnrolledPet with status ENROLLED exists (else ERR_NO_ENROLLED_PET)"
          - "Plan.status == ACTIVE for Membership.plan_id (else ERR_PLAN_RETIRED)"
        side_effects:
          - "Create the first ContractTerm (term_index=1, starts_at=clock.now, ends_at=now+365d, status=ACTIVE)"
          - "Grant ServiceCredit buckets from the plan's ACTIVE PlanService rows (compute_entitlement_grant)"
          - "Set ContractTerm.entitlement_granted_cents and entitlement_balance_cents (compute_entitlement_grant)"
          - "Charge enrollment_fee_cents + first monthly_fee_cents to MemberAccount.wallet_credit_cents (debit; may go negative)"
          - "Create first BillingCycle (status=BILLED, fee_charged_cents=monthly_fee_cents)"
          - "Set Membership.monthly_fee_cents = Plan.monthly_fee_cents snapshot"

      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /wellness/memberships/{id}/suspend"
        actor: Member
        preconditions:
          - "Membership.status == ENROLLED (else ERR_MEMBERSHIP_NOT_ENROLLED)"
        side_effects:
          - "Set all EnrolledPet.status ENROLLED -> SUSPENDED (cascade down)"
          - "Future BillingCycle.fee_charged_cents = 0 while SUSPENDED"
          - "ContractTerm clock continues (no extension); credits remain OPEN"

      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /wellness/memberships/{id}/resume"
        actor: Member
        preconditions:
          - "Membership.status == SUSPENDED (else ERR_MEMBERSHIP_NOT_SUSPENDED)"
          - "ContractTerm.status == ACTIVE and clock.now < ContractTerm.ends_at (else ERR_TERM_EXPIRED)"
        side_effects:
          - "Set all EnrolledPet.status SUSPENDED -> ENROLLED (cascade down, only those suspended by the suspend action)"
          - "Resume monthly billing at next anchor"

      - from: [ENROLLED, SUSPENDED]
        to: CANCEL_PENDING
        trigger: "POST /wellness/memberships/{id}/cancel"
        actor: Member
        preconditions:
          - "Membership.status IN {ENROLLED, SUSPENDED} (else ERR_MEMBERSHIP_NOT_CANCELLABLE)"
        side_effects:
          - "Compute early_termination_settlement (cancellation reconciliation)"
          - "Set Membership.auto_renew = false"
          - "Mark contract for termination at end of current cycle; record settlement on wallet"
          - "Set ContractTerm.status ACTIVE -> TERMINATED"
          - "Set all OPEN ServiceCredit.status -> FORFEITED (cascade); pet statuses unchanged until finalize"

      - from: CANCEL_PENDING
        to: CANCELLED
        trigger: "POST /wellness/memberships/{id}/finalize-cancel"
        actor: BillingAdmin
        preconditions:
          - "Membership.status == CANCEL_PENDING (else ERR_MEMBERSHIP_NOT_CANCEL_PENDING)"
        side_effects:
          - "Set all EnrolledPet.status -> REMOVED (cascade down)"
          - "No further BillingCycles created for this membership"

  - entity: ContractTerm
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /wellness/_billing/run-epoch (system, when clock.now >= ends_at - 7 days and Membership.auto_renew)"
        actor: BillingAdmin
        preconditions:
          - "ContractTerm.status == ACTIVE"
          - "Membership.auto_renew == true"
          - "clock.now >= ends_at - 7 days (RENEWAL_WINDOW_DAYS) (else not eligible)"
        side_effects:
          - "Flag term as entering renewal; no credits granted yet"

      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "POST /wellness/_billing/run-epoch (system, when clock.now >= ends_at)"
        actor: BillingAdmin
        preconditions:
          - "ContractTerm.status == RENEWAL_PENDING"
          - "clock.now >= ends_at"
        side_effects:
          - "Set all OPEN ServiceCredit on this term -> FORFEITED (unused credits do not roll over)"
          - "Create successor ContractTerm (term_index+1, starts_at=ends_at, ends_at=+365d, status=ACTIVE) (cyclic renewal)"
          - "Grant fresh ServiceCredit buckets on the successor term (compute_entitlement_grant)"
          - "Charge renewal monthly_fee on next BillingCycle"

      - from: ACTIVE
        to: TERMINATED
        trigger: "system (Membership cancel; see Membership ENROLLED/SUSPENDED -> CANCEL_PENDING)"
        actor: system
        preconditions:
          - "Owning Membership transitioned to CANCEL_PENDING"
        side_effects:
          - "Set all OPEN ServiceCredit -> FORFEITED (cascade)"
          - "entitlement_balance_cents frozen for settlement computation"

  - entity: ServiceVisit
    field: status
    initial_state: COMPLETED
    terminal_states: [VOIDED]
    transitions:
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /wellness/visits/{id}/void"
        actor: ClinicStaff
        preconditions:
          - "ServiceVisit.status == COMPLETED (else ERR_VISIT_NOT_VOIDABLE)"
          - "Owning ContractTerm.status == ACTIVE (else ERR_TERM_NOT_ACTIVE_FOR_VOID)"
        side_effects:
          - "If covered_by_credit: restore one unit to the consumed ServiceCredit (consumed_quantity-1), bucket EXHAUSTED->OPEN if it was full (compensation)"
          - "Recompute ContractTerm.entitlement_consumed_cents and entitlement_balance_cents (reconcile_term_balance)"
          - "If billed à-la-carte: credit charged_cents back to MemberAccount.wallet_credit_cents (compensation)"

  - entity: EnrolledPet
    field: status
    initial_state: ENROLLED
    terminal_states: [REMOVED]
    transitions:
      - from: ENROLLED
        to: SUSPENDED
        trigger: "system (owning Membership ENROLLED->SUSPENDED)"
        actor: system
        preconditions:
          - "Owning Membership transitioned ENROLLED->SUSPENDED"
        side_effects: []
        note: "Cascade-down from Membership.suspend; the pet cannot accrue visits while SUSPENDED."

      - from: SUSPENDED
        to: ENROLLED
        trigger: "system (owning Membership SUSPENDED->ENROLLED via resume)"
        actor: system
        preconditions:
          - "Owning Membership transitioned SUSPENDED->ENROLLED and this pet was suspended by that membership's suspend action"
        side_effects: []
        note: "Cyclic with the ENROLLED->SUSPENDED edge above (ENROLLED<->SUSPENDED loop)."

      - from: [ENROLLED, SUSPENDED]
        to: REMOVED
        trigger: "POST /wellness/memberships/{id}/pets/{petId}/remove (Member) OR system (Membership finalize-cancel)"
        actor: Member
        preconditions:
          - "Pet status IN {ENROLLED, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Recompute Membership.pet_count"
          - "increments Membership.version by 1 (only on the explicit /remove endpoint, not the finalize-cancel cascade)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-change-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /wellness/memberships/{id}/plan-change"
    occ_field: "expected_membership_version"
    description: |
      Applying a PlanChangeRequest against a Membership whose version has advanced
      since the client last observed it is rejected. A prior plan-change already
      took effect (legitimately superseding the membership's plan_id and bumping
      its version under the plan-change side effects), so the current writer's view
      of the membership is stale and its computed proration would be based on the
      wrong from_plan. The check is a stale-version comparison, not a timing rule.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: compute_entitlement_grant
    trigger: "Membership PENDING_PAYMENT->ENROLLED (activate); ContractTerm RENEWAL_PENDING->EXPIRED successor grant"
    algorithm: forward_looking
    formula: |
      # Forward-looking valuation of the bundle at term start.
      # For each ACTIVE PlanService row of the membership's plan, create one
      # ServiceCredit bucket with granted_quantity = included_quantity and
      # unit_value_cents snapshot = PlanService.unit_value_cents.
      entitlement_granted_cents = 0
      for ps in ACTIVE PlanService where ps.plan_id == term.plan_id (ordered by service_code ASC):
          create ServiceCredit(service_code=ps.service_code,
                               granted_quantity=ps.included_quantity,
                               consumed_quantity=0,
                               unit_value_cents=ps.unit_value_cents,
                               status = OPEN if ps.included_quantity > 0 else EXHAUSTED)
          entitlement_granted_cents += ps.included_quantity * ps.unit_value_cents
      term.entitlement_consumed_cents = 0
      term.entitlement_balance_cents = entitlement_granted_cents
    input_set: "ACTIVE PlanService rows of term.plan_id only; RETIRED inclusion lines excluded"
    precision: "integer cents, exact"
    variants:
      - name: enrollment_grant
        when: "first term created at activate"
        difference: "buckets seeded from current ACTIVE PlanService catalog at enrollment instant"
      - name: renewal_grant
        when: "successor term created at term expiry"
        difference: "re-reads the catalog at renewal instant — a PlanService retired mid-term is NOT re-granted"

  - name: consume_credit_chronological
    trigger: "POST /wellness/visits (record visit)"
    algorithm: chronological
    formula: |
      # Chronological consumption: a visit at visited_at consumes one matching
      # credit unit IF and only if the bucket for its service_code still has
      # granted_quantity - consumed_quantity > 0 at the moment of recording.
      # Visits are recorded in clock order; consumption is order-dependent.
      bucket = ServiceCredit where contract_term_id == visit.contract_term_id
                                and service_code == visit.service_code
      remaining = bucket.granted_quantity - bucket.consumed_quantity
      if remaining > 0:
          bucket.consumed_quantity += 1
          if bucket.consumed_quantity == bucket.granted_quantity: bucket.status = EXHAUSTED
          visit.covered_by_credit = true
          visit.charged_cents = 0
      else:
          visit.covered_by_credit = false
          visit.charged_cents = alacarte_price(visit)   # see compute_alacarte_price
      term.entitlement_consumed_cents = sum over buckets of (consumed_quantity * unit_value_cents)
      term.entitlement_balance_cents  = term.entitlement_granted_cents - term.entitlement_consumed_cents
    input_set: "ServiceVisit rows with status COMPLETED in the ACTIVE term, processed in visited_at ASC order; tie-break created_at ASC"
    constants: {}
    precision: "integer cents, exact"
    note: "The Nth visit of a service_code is covered iff N <= granted_quantity; the (granted+1)th is billed à-la-carte. Boundary: granted_quantity exactly equals consumed before this visit -> not covered."

  - name: compute_alacarte_price
    trigger: "record visit when no credit available; à-la-carte (non-member-equivalent) pricing"
    algorithm: tiered_pricing
    formula: |
      # Three inputs interacting non-linearly: base unit value, member discount,
      # and a DENTAL weight surcharge tier. Evaluation order is pinned.
      base_cents = PlanService.unit_value_cents for (membership.plan_id, service_code)
                   # if the plan has no PlanService line for that code (e.g. plan
                   # excludes DENTAL), use CATALOG_DEFAULT_UNIT_CENTS[service_code].
      surcharge_cents = 0
      if service_code == DENTAL:
          if pet.weight_kg >= DENTAL_LARGE_KG:   surcharge_cents = DENTAL_LARGE_SURCHARGE_CENTS
          elif pet.weight_kg >= DENTAL_MED_KG:   surcharge_cents = DENTAL_MED_SURCHARGE_CENTS
          else:                                  surcharge_cents = 0
      gross_cents = base_cents + surcharge_cents
      discount_cents = round_half_up(gross_cents * plan.alacarte_discount_pct)   # round the discount, THEN subtract
      charged_cents = gross_cents - discount_cents
    input_set: "single visit; pet.weight_kg; plan.alacarte_discount_pct; PlanService.unit_value_cents"
    constants:
      DENTAL_MED_KG: 10
      DENTAL_LARGE_KG: 25
      DENTAL_MED_SURCHARGE_CENTS: 1500
      DENTAL_LARGE_SURCHARGE_CENTS: 4000
      CATALOG_DEFAULT_UNIT_CENTS: { EXAM: 6000, VACCINE: 3500, DENTAL: 22000 }
    precision: "2-step: round the discount to integer cents (round_half_up) BEFORE subtracting from gross; result is integer cents"
    note: "Rounding order is pinned: discount = round(gross * pct) first, then charged = gross - discount. Doing 'round(gross*(1-pct))' can differ by a cent."

  - name: compute_plan_change_proration
    trigger: "POST /wellness/memberships/{id}/plan-change"
    algorithm: forward_looking
    formula: |
      # Daily-rate proration over the current monthly billing window.
      days_in_cycle = days_between(current_cycle.period_start, current_cycle.period_end)  # inclusive of start, exclusive of end
      days_remaining = days_between(clock.now_date, current_cycle.period_end)             # >= 0
      from_daily = from_plan.monthly_fee_cents / days_in_cycle      # real division, not integer
      to_daily   = to_plan.monthly_fee_cents   / days_in_cycle
      # Proration delta = (to_daily - from_daily) * days_remaining, rounded ONCE at the end.
      proration_delta_cents = round_half_up((to_daily - from_daily) * days_remaining)
      change_kind = UPGRADE if to_plan.monthly_fee_cents > from_plan.monthly_fee_cents else DOWNGRADE
      # UPGRADE (delta > 0): debit wallet by delta now.
      # DOWNGRADE (delta < 0): credit wallet by -delta now.
    input_set: "current ACTIVE BillingCycle window; from_plan and to_plan monthly fees"
    constants:
      RENEWAL_WINDOW_DAYS: 7
    precision: "round the final product ONCE, round_half_up, to integer cents; intermediate daily rates kept as exact rationals"
    note: "Rounding order pinned: compute (to_daily - from_daily) * days_remaining as an exact rational, round once. Rounding the two daily rates first then multiplying can differ."

  - name: reconcile_term_balance
    trigger: "after each visit record, visit void, plan change, or _billing/run-epoch"
    algorithm: aggregation
    formula: |
      # Derived-field reconciliation: keep entitlement_consumed/balance consistent
      # with the ServiceCredit ledger.
      term.entitlement_consumed_cents = sum( c.consumed_quantity * c.unit_value_cents
                                             for c in ServiceCredit where contract_term_id == term.id )
      term.entitlement_balance_cents  = term.entitlement_granted_cents - term.entitlement_consumed_cents
    input_set: "all ServiceCredit rows of the term regardless of status (OPEN, EXHAUSTED, FORFEITED keep their consumed_quantity)"
    precision: "integer cents, exact"
    note: "FORFEITED buckets retain consumed_quantity; forfeiture only blocks further consumption, it does not zero prior consumption."

  - name: compute_early_termination_settlement
    trigger: "Membership ENROLLED/SUSPENDED -> CANCEL_PENDING (cancel)"
    algorithm: forward_looking
    formula: |
      # Reconciliation: what does the member owe / get back on early cancel?
      # The member keeps the catalog value of credits already consumed; the plan
      # claws back nothing already consumed, but charges an early-termination fee
      # capped at the UNCONSUMED entitlement value the member benefited from at a
      # discount. Two valid readings exist (see variants) — we pin the gross one.
      consumed_value = term.entitlement_consumed_cents
      fees_paid = sum(BillingCycle.fee_charged_cents for cycles of this membership) + plan.enrollment_fee_cents
      # Settlement (gross_basis, pinned): member is refunded the unused portion of
      # fees paid in excess of consumed catalog value, floored at 0, minus ETF.
      unused_value = max(0, fees_paid - consumed_value)
      etf_cents = min(EARLY_TERMINATION_FEE_CENTS, unused_value)
      settlement_credit_cents = max(0, unused_value - etf_cents)
      # Apply settlement_credit_cents to MemberAccount.wallet_credit_cents.
    input_set: "this membership's BilledCycles (status BILLED), plan.enrollment_fee_cents, term.entitlement_consumed_cents"
    constants:
      EARLY_TERMINATION_FEE_CENTS: 5000
    precision: "integer cents, exact; floors applied with max(0, ...)"
    variants:
      - name: gross_basis
        when: "pinned default for all cancellations"
        difference: "unused_value = fees_paid - consumed_value (consumed valued at full catalog unit value)"
      - name: net_discounted_basis
        when: "NOT used; documented to mark the divergence a naive reader might pick"
        difference: "would value consumed credits at the discounted à-la-carte price instead of full catalog value, yielding a larger refund — explicitly NOT the chosen rule"

  - name: compute_monthly_billing
    trigger: "POST /wellness/_billing/run-epoch"
    algorithm: chronological
    formula: |
      # For each Membership due on this epoch (billing_anchor_day matches the
      # epoch date's day-of-month), in created_at ASC order:
      if membership.status == SUSPENDED:
          fee = 0
      elif membership.status IN {ENROLLED}:
          fee = membership.monthly_fee_cents
      else:
          skip  # PENDING_PAYMENT, CANCEL_PENDING (handled at finalize), CANCELLED
      create BillingCycle(period_start, period_end, fee_charged_cents=fee, status=BILLED)
      debit MemberAccount.wallet_credit_cents by fee
      # Renewal handling: see ContractTerm transitions (RENEWAL_PENDING / EXPIRED).
    input_set: "Memberships whose billing_anchor_day == day-of-month(clock.now), status IN {ENROLLED, SUSPENDED}, ordered by created_at ASC, tie-break id is NOT used"
    precision: "integer cents, exact"
    note: "Processing order is created_at ASC; deterministic and id-independent."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Member acting on a Membership/MemberAccount must own it (X-User-ID == MemberAccount.id of the resource owner)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-scoped membership/account endpoints"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (membership, then pet/visit/term)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 5
    category: existence
    check: "Referenced FK bodies exist (plan_id, clinic_id, enrolled_pet_id, to_plan_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "create/plan-change/visit endpoints with FK bodies"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition (see §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 7
    category: business_temporal
    check: "OCC: expected_membership_version must equal current Membership.version on plan-change"
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412
    applies_to: "POST /wellness/memberships/{id}/plan-change"

  - priority: 8
    category: business_referential
    check: "ServiceVisit.enrolled_pet_id must belong to the same Membership in the path (pet.membership_id == membership.id)"
    error_id: ERR_PET_NOT_IN_MEMBERSHIP
    http_status: 409
    applies_to: "POST /wellness/memberships/{id}/visits"

  - priority: 9
    category: business_referential
    check: "Clinic.status must be OPEN to record a visit there"
    error_id: ERR_CLINIC_CLOSED
    http_status: 409
    applies_to: "POST /wellness/memberships/{id}/visits"

  - priority: 10
    category: business_constraint
    check: "Pet recorded for a visit must have status ENROLLED (SUSPENDED/REMOVED pets cannot accrue visits)"
    error_id: ERR_PET_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /wellness/memberships/{id}/visits"

  - priority: 11
    category: business_constraint
    check: "plan-change to_plan must differ from current plan and to_plan.status == ACTIVE"
    error_id: ERR_INVALID_PLAN_CHANGE
    http_status: 422
    applies_to: "POST /wellness/memberships/{id}/plan-change"

  - priority: 12
    category: business_constraint
    check: "billing_anchor_day in 1..28; weight_kg > 0; monthly_fee_cents >= 0; enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "create endpoints"

  - priority: 13
    category: business_constraint
    check: "MemberAccount.email is unique (case-insensitive)"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /wellness/member-accounts"

  - priority: 14
    category: business_temporal
    check: "Cannot record a visit dated outside the ACTIVE ContractTerm window [starts_at, ends_at)"
    error_id: ERR_VISIT_OUTSIDE_TERM
    http_status: 409
    applies_to: "POST /wellness/memberships/{id}/visits"

