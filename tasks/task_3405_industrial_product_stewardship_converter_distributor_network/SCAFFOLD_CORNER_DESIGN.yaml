          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Segregation between submitter and decider: the ProductManager who submitted the clearance cannot also decide it — decision is RegulatoryManager-exclusive (403 ERR_UNAUTHORIZED)."
