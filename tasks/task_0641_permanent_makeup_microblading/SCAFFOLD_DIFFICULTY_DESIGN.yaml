              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client A", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client A" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Technician
            - call: "POST /appointments/${appt_id}/finish-procedure"
              payload: {}
              as: Technician
            - call: "POST /appointments/${appt_id}/pay-balance"
              payload: { amount_cents: 52000 }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /healing-logs"
              payload: { appointment_id: "${appt_id}", day_offset: 21, outcome_flag: "POOR" }
              as: Technician
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Technician
              captures: { src_ver: $.data.version }
            - call: "POST /redo-requests"
              payload: { appointment_id: "${appt_id}", reason: "patchy retention" }
              as: FrontDesk
              captures: { redo_id: $.data.id }
            - call: "POST /redo-requests/${redo_id}/approve"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /redo-requests/${redo_id}/schedule"
              payload: { scheduled_start: "2026-02-10T10:00:00Z", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", expected_appointment_version: "${src_ver}" }
              as: FrontDesk
              captures: { redo_status: $.data.status, redo_appt_id: $.data.redo_appointment_id }
            - call: "POST /appointments/${redo_appt_id}/start"
              payload: {}
              as: Technician
            - call: "POST /appointments/${redo_appt_id}/finish-procedure"
              payload: {}
              as: Technician
            - call: "POST /healing-logs"
              payload: { appointment_id: "${redo_appt_id}", day_offset: 14, outcome_flag: "GOOD" }
              as: Technician
            - call: "POST /appointments/${redo_appt_id}/complete"
              payload: {}
              as: Technician
            - call: "GET /redo-requests/${redo_id}"
              payload: {}
              as: FrontDesk
              captures: { final_redo_status: $.data.status }
          assert:
            - "RedoRequest.${redo_id}.status after schedule == SCHEDULED"
            - "Appointment.${redo_appt_id}.appointment_kind == REDO"
            - "Appointment.${redo_appt_id}.session_price_cents == 0"
            - "Appointment.${redo_appt_id}.payment_status == PAID_IN_FULL"
            - "RedoRequest.${redo_id}.status after redo appointment completes == FULFILLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_license_suspend_void_kit_deposit_posture_depth3
        grounds:
          - state_machines.Technician.LICENSE_ACTIVE_to_LICENSE_SUSPENDED
          - state_machines.Appointment.BOOKED_to_VOIDED
          - calculations.studio_kit_ledger
          - entities.Studio.fields.compliance_posture
        distinguishing_aspect: "Depth-3 cascade from a single trigger: suspend-license (A) -> appointment BOOKED->VOIDED (B, caused by A) -> that void restores the sterile kit and emits a deposit REFUND and recomputes Studio.compliance_posture to FROZEN (C, each caused by B). Each link is caused by the prior link, not the original action."
        test_recipe:
          setup:
            - "Single LICENSE_ACTIVE technician; a BOOKED DEPOSIT_PAID appointment that has consumed a sterile kit (started)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 3 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client A", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client A" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Technician
            - call: "GET /studios/${studio_id}"
              payload: {}
              as: StudioAdmin
              captures: { studio_ver_pre: $.data.version, kit_consumed_pre: $.data.sterile_kit_consumed }
          trigger:
            - call: "POST /technicians/${tech_id}/suspend-license"
              payload: { expected_studio_version: "${studio_ver_pre}" }
              as: ComplianceOfficer
            - call: "GET /appointments/${appt_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { appt_ls: $.data.lifecycle_status, appt_ps: $.data.payment_status, appt_kit: $.data.kit_consumed }
            - call: "GET /studios/${studio_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_after: $.data.compliance_posture, kit_consumed_after: $.data.sterile_kit_consumed }
          assert:
            - "Appointment.${appt_id}.lifecycle_status == VOIDED"
            - "Appointment.${appt_id}.kit_consumed == false"
            - "Appointment.${appt_id}.payment_status == REFUNDED"
            - "Studio.${studio_id}.sterile_kit_consumed == 0"
            - "Studio.${studio_id}.compliance_posture == FROZEN"

      - name: tc_no_show_strike_block_depth2
        grounds:
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - calculations.client_no_show_strikes
          - entities.Client.fields.client_status
        distinguishing_aspect: "Depth-2 cascade from a different trigger (no-show, not license suspend): /no-show (A) sets lifecycle NO_SHOW and recomputes Client.no_show_strikes to 3 (B, caused by A) which itself flips Client.client_status to BLOCKED (caused by B)."
        test_recipe:
          setup:
            - "A client with 2 existing NO_SHOW appointments and a 3rd BOOKED appointment past its scheduled_start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
