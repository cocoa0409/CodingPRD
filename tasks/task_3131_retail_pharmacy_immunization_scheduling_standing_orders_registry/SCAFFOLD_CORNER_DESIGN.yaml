# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task: retail_pharmacy_immunization_scheduling_standing_orders_registry
# Breadth probe over every testable claim in §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections/claim_types follow the
# claim-extraction-guide taxonomy.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: store_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.PharmacyStore, entities.PharmacyStore.fields.status]
        distinguishing_aspect: "POST /immunization/stores with required inputs returns 201; status defaults to ACTIVE, version starts at 1, id/created_at/updated_at are server-minted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-1", state_code: "CA", address_line: "1 Main St" }
              as: StoreManager
              captures: { st_status: $.data.status, st_version: $.data.version, st_id: $.data.id, st_created: $.data.created_at }
          assert:
            - "HTTP 201"
            - "captured st_status == ACTIVE (system default)"
            - "captured st_version == 1"
            - "captured st_id is a UUID with no type prefix; st_created is ISO 8601 UTC with three fractional digits"

      - name: patient_registration_optional_field_defaults
        claim_type: defaults
        grounds: [entities.Patient.fields.allergy_flags, entities.Patient.fields.high_risk_flag, entities.Patient.fields.insurance_plan_id]
        distinguishing_aspect: "Omitting allergy_flags, high_risk_flag and insurance_plan_id at registration applies defaults [] and false and leaves the FK absent."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Default", date_of_birth: "1990-05-05", state_code: "CA" }
              as: PharmacyTechnician
              captures: { p_allergy: $.data.allergy_flags, p_hr: $.data.high_risk_flag, p_ver: $.data.version }
          assert:
            - "HTTP 201"
            - "captured p_allergy == [] (default empty array)"
            - "captured p_hr == false (default)"
            - "captured p_ver == 1; insurance_plan_id absent or null in response"

      - name: product_registration_defaults_min_interval_and_observation
        claim_type: defaults
        grounds: [entities.VaccineProduct.fields.min_interval_days, entities.VaccineProduct.fields.observation_minutes]
        distinguishing_aspect: "Omitting min_interval_days and observation_minutes at product registration applies defaults 0 and 15."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { vp_interval: $.data.min_interval_days, vp_obs: $.data.observation_minutes }
          assert:
            - "HTTP 201"
            - "captured vp_interval == 0 and vp_obs == 15 (declared defaults)"

      - name: patient_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Patient.fields.date_of_birth, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /immunization/patients without required date_of_birth returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /immunization/patients"
              payload: { full_name: "No Dob", state_code: "CA" }
              as: PharmacyTechnician
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /immunization/patients afterwards returns total_count 0"

      - name: lot_creation_computed_doses_available_and_protocol_resolution_at_booking
        claim_type: computed_fields
        grounds: [entities.VaccineLot.fields.doses_available, entities.ImmunizationAppointment.fields.state_protocol_id, entities.ImmunizationAppointment.fields.dose_number]
        distinguishing_aspect: "Lot creation initializes doses_available = doses_received (computed, not client-set); booking resolves state_protocol_id from (store.state_code, vaccine_product_id) and computes dose_number = 1 for a first-time patient."
        test_recipe:
          setup: ["store S (CA), product FLU (cvx 141), protocol CA+FLU, patient P"]
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-2", state_code: "CA", address_line: "2 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
              captures: { prot_id: $.data.id }
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Cmp", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p: $.data.id }
          trigger:
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 7 }
              as: StoreManager
              captures: { lot_avail: $.data.doses_available, lot_status: $.data.status, lot_store: $.data.store_id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:00:00Z" }
              as: PharmacyTechnician
              captures: { appt_prot: $.data.state_protocol_id, appt_dose: $.data.dose_number, appt_status: $.data.status, appt_walkin: $.data.is_walk_in }
          assert:
            - "captured lot_avail == 7 (doses_available initialized from doses_received), lot_status == RELEASED, lot_store == ${store_s}"
            - "captured appt_prot == ${prot_id} (resolved from store CA + product FLU)"
            - "captured appt_dose == 1 (no prior COMPLETED records)"
            - "captured appt_status == SCHEDULED (initial state) and appt_walkin == false (default)"

      - name: temperature_reading_immutable_and_inband_no_side_effects
        claim_type: immutability
        grounds: [entities.TemperatureReading, entities.TemperatureReading.fields.is_excursion, entities.TemperatureReading.fields.excursion_severity_tier]
        distinguishing_aspect: "TemperatureReading has common_fields false: its response carries id and created_at but no version/updated_at; an in-band reading computes is_excursion false and tier NONE and leaves the lot RELEASED."
        test_recipe:
          setup: ["store S, product FLU (band 2.0-8.0C), lot L1 RELEASED with 5 doses"]
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-3", state_code: "CA", address_line: "3 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
          trigger:
            - call: "POST /immunization/lots/${lot_l1}/temperature-readings"
              payload: { recorded_at: "2026-09-01T08:00:00Z", temperature_c: 5.0 }
              as: PharmacyTechnician
              captures: { tr_exc: $.data.is_excursion, tr_tier: $.data.excursion_severity_tier, tr_version: $.data.version }
            - call: "GET /immunization/lots/${lot_l1}"
              as: StoreManager
              captures: { lot_status: $.data.status, lot_avail: $.data.doses_available }
          assert:
            - "captured tr_exc == false and tr_tier == NONE (5.0C is inside [2.0, 8.0])"
            - "response has no version/updated_at fields (captured tr_version is null/absent)"
            - "captured lot_status == RELEASED and lot_avail == 5 (no side effects for in-band reading)"

      - name: get_nonexistent_resource_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /immunization/stores/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: StoreManager
          assert:
            - "HTTP 404 with error_id ERR_NOT_FOUND"
            - "response_type == error and data.error_id == ERR_NOT_FOUND"

      - name: lot_creation_requires_existing_parent_store
        claim_type: parent_relationship
        grounds: [entities.VaccineLot.parent, entities.VaccineLot.fields.store_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /immunization/stores/{storeId}/lots with a nonexistent storeId returns 404 ERR_NOT_FOUND — the child cannot be created under a missing parent."
        test_recipe:
          setup: ["product FLU exists; no stores"]
          setup_api_calls:
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
          trigger:
            - call: "POST /immunization/stores/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
          assert:
            - "HTTP 404 with error_id ERR_NOT_FOUND"

      - name: protocol_creation_enum_constraint_violation
        claim_type: type_constraints
        grounds: [entities.StateProtocol.fields.authority_type, entities.StateProtocol.fields.registry_format, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Creating a protocol with authority_type or registry_format outside the declared enum returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["product FLU exists"]
          setup_api_calls:
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
          trigger:
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "ROYAL_DECREE", registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: pagination_defaults_and_envelope_on_list
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /immunization/patients with no pagination params returns the fixed envelope: limit 10, offset 0, total_count and has_more present; meta carries api_request_id and api_request_timestamp."
        test_recipe:
          setup: ["three patients registered"]
          setup_api_calls:
            - call: "POST /immunization/patients"
              payload: { full_name: "P1", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
            - call: "POST /immunization/patients"
              payload: { full_name: "P2", date_of_birth: "1981-01-01", state_code: "CA" }
              as: PharmacyTechnician
            - call: "POST /immunization/patients"
              payload: { full_name: "P3", date_of_birth: "1982-01-01", state_code: "CA" }
              as: PharmacyTechnician
          trigger:
            - call: "GET /immunization/patients"
              as: PharmacyTechnician
              captures: { total: $.total_count, has_more: $.has_more, count: $.data }
          assert:
            - "response_type == array; captured total == 3; has_more == false; data has 3 entries"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "default pagination limit 10 / offset 0 applied (no params passed)"

      - name: fk_reverse_reachability_filtered_lists
        claim_type: parent_relationship
        grounds: [entities.ImmunizationRecord.fields.patient_id, entities.VaccineLot.fields.store_id]
        distinguishing_aspect: "Every FK is discoverable from the parent: GET /immunization/stores/{id}/lots, GET /immunization/lots?store_id=, GET /immunization/appointments?patient_id=, GET /immunization/immunization-records?patient_id= all return arrays filtered to the parent."
        test_recipe:
          setup: ["store S, product FLU, protocol, patient P, lot L1 at S, appointment A for P"]
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-4", state_code: "CA", address_line: "4 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat FK", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:00:00Z" }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id }
          trigger:
            - call: "GET /immunization/stores/${store_s}/lots"
              as: StoreManager
              captures: { lots_sub: $.data }
            - call: "GET /immunization/appointments"
              payload: { patient_id: "${pat_p}" }
              as: PharmacyTechnician
              captures: { appts_filtered: $.data }
          assert:
            - "captured lots_sub has exactly 1 entry with id == ${lot_l1} (sub-resource reverse reachability)"
            - "captured appts_filtered has exactly 1 entry with id == ${appt_a} (filtered-list reverse reachability)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: check_in_valid_transition_and_window_enforcement
        claim_type: valid_transition
        grounds: [state_machines.ImmunizationAppointment.SCHEDULED_to_CHECKED_IN, "validations[priority=11]", "errors[ERR_CHECKIN_WINDOW_MISSED]"]
        distinguishing_aspect: "Non-walk-in check-in inside [slot_start − 30min, slot_start + 60min] succeeds; 31 minutes early fails with ERR_CHECKIN_WINDOW_MISSED."
        test_recipe:
          setup: ["store S, product FLU, protocol, patient P; appointment scheduled at 2026-09-01T10:00:00Z (non-walk-in); clock at 09:29:00 (31 min early) then 09:30:00"]
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-5", state_code: "CA", address_line: "5 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat CI", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z" }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id }
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:29:00Z" }
              as: StoreManager
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:30:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              captures: { appt_status: $.data.status, appt_ver: $.data.version }
          assert:
            - "the check-in at 09:29 returned 409 ERR_CHECKIN_WINDOW_MISSED (one minute before window opens)"
            - "captured appt_status == CHECKED_IN and appt_ver == 2 (check-in at exactly slot_start − 30min succeeds and bumps version)"

      - name: questionnaire_from_scheduled_rejected_and_second_questionnaire_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ImmunizationAppointment.CHECKED_IN_to_SCREENED, "errors[ERR_APPOINTMENT_NOT_CHECKED_IN]", "errors[ERR_QUESTIONNAIRE_ALREADY_EXISTS]"]
        distinguishing_aspect: "Questionnaire against a SCHEDULED (never checked-in) appointment fails with ERR_APPOINTMENT_NOT_CHECKED_IN; a second questionnaire on a SCREENED appointment fails with ERR_QUESTIONNAIRE_ALREADY_EXISTS."
        test_recipe:
          setup: ["store S, product FLU, protocol, patient P; walk-in appointment A checked in and screened; second appointment B left SCHEDULED"]
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-6", state_code: "CA", address_line: "6 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Q", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-03T10:00:00Z" }
              as: PharmacyTechnician
              captures: { appt_b: $.data.id }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false } }
              as: PharmacyTechnician
          trigger:
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: true } }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments/${appt_b}/questionnaire"
              payload: { answers: { FEVER_TODAY: false } }
              as: PharmacyTechnician
          assert:
            - "second questionnaire on A returns 409 ERR_QUESTIONNAIRE_ALREADY_EXISTS"
            - "questionnaire on SCHEDULED B returns 409 ERR_APPOINTMENT_NOT_CHECKED_IN"

      - name: refer_out_branch_cancels_appointment_from_screened
        claim_type: valid_transition
        grounds: [state_machines.ImmunizationAppointment.SCREENED_to_CANCELLED, entities.PrescreeningQuestionnaire.fields.review_outcome]
        distinguishing_aspect: "review-consent with outcome REFER_OUT moves SCREENED → CANCELLED and stamps the questionnaire review_outcome REFERRED_OUT; the appointment is then terminally locked."
        test_recipe:
          setup: ["walk-in appointment A at store S progressed to SCREENED; lot L1 available"]
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-7", state_code: "CA", address_line: "7 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat RO", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
