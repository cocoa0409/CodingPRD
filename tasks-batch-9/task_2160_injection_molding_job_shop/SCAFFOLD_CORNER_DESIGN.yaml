        claim_type: Violation to Error
        grounds: ["errors[ERR_MOLD_RETIRED]", "validations[priority=11]", "state_machines.Mold.NEW_to_RETIRED", "state_machines.Quote.DRAFT_to_PRICED"]
        distinguishing_aspect: "Priority 11 also guards the commercial surface: once M-1 is RETIRED, POST /quotes/{id}/price on its outstanding DRAFT quote returns 409 ERR_MOLD_RETIRED and the quote stays DRAFT with a null price."
