# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2846 — Eye Bank Corneal Tissue Recovery & Distribution
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. The logical clock's
# startup default is 2026-08-01T00:00:00Z; every chain below sets it explicitly
# to 2026-08-03T06:00:00.000Z first so that death_at (2026-08-03T02:00:00.000Z)
# is already in the past and every deadline literal is deterministic.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: tissue_shelf_life_provisional_vs_final_expiry
        grounds:
          - calculations.tissue_shelf_life
          - calculations.tissue_quality_score
          - calculations.tissue_classification
          - entities.CorneaTissue.fields.shelf_life_variant
          - entities.CorneaTissue.fields.shelf_life_hours
          - entities.CorneaTissue.fields.expires_at
          - state_machines.CorneaTissue.UNGRADED_to_ELIGIBLE
        distinguishing_aspect: |
          This dual variant lives on the CorneaTissue domain: the SAME tissue row carries a
          PROVISIONAL_AT_RECOVERY shelf life of 336 h (expires 2026-08-17T09:00:00.000Z) from
          recovery and a FINAL_AT_CLASSIFICATION shelf life of 240 h (expires
          2026-08-13T09:00:00.000Z) after classification, because the final variant additionally
          charges the 72 h never-cooled penalty and the 24 h low-ECD penalty.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one RECOVERY_ONLY technician and one RECOVERY_AND_EVAL technician"
            - "donor died 2026-08-03T02:00:00.000Z, ASYSTOLE, NEVER cooled (body_cooled_at omitted), age 52 -> recovery_window_minutes 720, recovery_deadline_at 2026-08-03T14:00:00.000Z"
            - "donor consented TRANSPLANT_ONLY and its single serology panel resulted NON_REACTIVE"
            - "one OD cornea preserved in OPTISOL_GS at 2026-08-03T09:00:00.000Z (death-to-preservation 420 min, band WITHIN_STANDARD)"
            - "the tissue carries a RECORDED SLIT_LAMP with all three grades 0 and a RECORDED SPECULAR with guttata_grade 0 and endothelial_cell_count 2100"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Rosa Field", certification_level: "RECOVERY_ONLY", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rt_id: $.data.id }
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Ivo Grader", certification_level: "RECOVERY_AND_EVAL", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { et_id: $.data.id }
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-B", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "NO", historian_relationship: "SPOUSE" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors/${donor_id}/consent"
              payload: { consent_type: "FIRST_PERSON", consent_scope: "TRANSPLANT_ONLY", authorizing_party_name: "Registry Self-Consent" }
              as: EyeBankCoordinator
              captures: { donor_v1: $.data.version }
            - call: "POST /eye-bank/donors/${donor_id}/serology-panels"
              payload: { specimen_type: "POST_MORTEM", drawn_at: "2026-08-03T04:00:00.000Z", hemodilution_pct: 0.00, expected_donor_version: "${donor_v1}" }
              as: LabTechnician
              captures: { panel_id: $.data.id }
            - call: "POST /eye-bank/serology-panels/${panel_id}/results"
              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: LabTechnician
            - call: "POST /eye-bank/donors/${donor_id}/approve-recovery"
              payload: {}
              as: MedicalDirector
            - call: "POST /eye-bank/recoveries"
              payload: { donor_id: "${donor_id}", technician_id: "${rt_id}", dispatched_at: "2026-08-03T06:30:00.000Z", planned_release_at: "2026-08-03T10:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rec_id: $.data.id }
            - call: "POST /eye-bank/recoveries/${rec_id}/arrive"
              payload: { arrival_at: "2026-08-03T07:00:00.000Z" }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
            - call: "POST /eye-bank/recoveries/${rec_id}/complete"
              payload: { preservation_at: "2026-08-03T09:00:00.000Z", preservation_medium: "OPTISOL_GS", recovered_lateralities: ["OD"] }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
            - call: "GET /eye-bank/tissues"
              payload: { recovery_id: "${rec_id}" }
              as: EyeBankCoordinator
              captures: { tissue_id: "$.data[0].id", tissue_v0: "$.data[0].version", prov_hours: "$.data[0].shelf_life_hours", prov_expiry: "$.data[0].expires_at", prov_variant: "$.data[0].shelf_life_variant" }
            - call: "POST /eye-bank/tissues/${tissue_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SLIT_LAMP", performed_at: "2026-08-03T09:30:00.000Z", epithelium_defect_grade: 0, stromal_clarity_grade: 0, dm_folds_grade: 0, expected_tissue_version: "${tissue_v0}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
              captures: { tissue_v1: $.data.tissue_version_after }
            - call: "POST /eye-bank/tissues/${tissue_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SPECULAR", performed_at: "2026-08-03T09:45:00.000Z", guttata_grade: 0, endothelial_cell_count: 2100, expected_tissue_version: "${tissue_v1}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
          trigger:
            - call: "POST /eye-bank/tissues/${tissue_id}/classify"
              payload: {}
              as: MedicalDirector
              captures: { final_hours: $.data.shelf_life_hours, final_expiry: $.data.expires_at }
          assert:
            - "${prov_variant} == \"PROVISIONAL_AT_RECOVERY\""
            - "${prov_hours} == 336"
            - "${prov_expiry} == \"2026-08-17T09:00:00.000Z\""
            - "${final_hours} == 240"
            - "${final_expiry} == \"2026-08-13T09:00:00.000Z\""
            - "CorneaTissue.${tissue_id}.shelf_life_variant == \"FINAL_AT_CLASSIFICATION\""
            - "the two variants diverge by exactly 96 hours on the same row: 336 - 240 == 96, i.e. 4 calendar days of expiry lost at classification"
            - "CorneaTissue.${tissue_id}.tissue_quality_score == 66"
            - "CorneaTissue.${tissue_id}.classification == \"TRANSPLANT_THERAPEUTIC\""
            - "CorneaTissue.${tissue_id}.disposition_status == \"ELIGIBLE\""

      - name: donor_screening_risk_interview_vs_post_serology_reconciled
        grounds:
          - calculations.donor_screening_risk_score
          - calculations.serology_overall_result
          - entities.Donor.fields.screening_risk_score
          - entities.Donor.fields.screening_risk_variant
          - entities.ScreeningRecord.fields.weight_applied
          - state_machines.SerologyPanel.DRAWN_to_RESULTED
        distinguishing_aspect: |
          This dual variant lives on the Donor domain and on a different metric (integer risk
          points, not hours): the SAME three ScreeningRecord rows score 10 under INTERVIEW_ONLY
          (UNKNOWN answers charged 0) and 65 under POST_SEROLOGY_RECONCILED once a panel with
          hemodilution_pct 55.00 resolves to INDETERMINATE and the reconciliation predicate
          charges both UNKNOWN answers at full weight (30 + 25).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "donor died 2026-08-03T02:00:00.000Z, ASYSTOLE, age 60, status SCREENING"
            - "three screening records: TATTOO_12M = YES (weight 10), HEP_B_C_HISTORY = UNKNOWN (weight 30), SEPSIS = UNKNOWN (weight 25)"
            - "donor.serology_status is still PENDING, so the INTERVIEW_ONLY variant is selected and screening_risk_score == 10"
            - "one DRAWN serology panel with hemodilution_pct 55.00 awaiting results"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-C", referral_source: "MEDICAL_EXAMINER", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 60, cause_of_death_category: "TRAUMA" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "YES", historian_relationship: "CHILD" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "HEP_B_C_HISTORY", response: "UNKNOWN", historian_relationship: "CHILD" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "SEPSIS", response: "UNKNOWN", historian_relationship: "MEDICAL_RECORD" }
              as: EyeBankCoordinator
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: LabTechnician
              captures: { risk_pre: $.data.screening_risk_score, variant_pre: $.data.screening_risk_variant, donor_v1: $.data.version }
            - call: "POST /eye-bank/donors/${donor_id}/serology-panels"
              payload: { specimen_type: "POST_MORTEM", drawn_at: "2026-08-03T04:30:00.000Z", hemodilution_pct: 55.00, expected_donor_version: "${donor_v1}" }
              as: LabTechnician
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/serology-panels/${panel_id}/results"
              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: LabTechnician
              captures: { overall: $.data.overall_result }
          assert:
            - "${risk_pre} == 10"
            - "${variant_pre} == \"INTERVIEW_ONLY\""
            - "${overall} == \"INDETERMINATE\""
            - "Donor.${donor_id}.screening_risk_variant == \"POST_SEROLOGY_RECONCILED\""
            - "Donor.${donor_id}.screening_risk_score == 65"
            - "Donor.${donor_id}.serology_status == \"INDETERMINATE\""
            - "the same three ScreeningRecord rows yield 10 under one variant and 65 under the other: delta == 55 == 30 + 25, the two UNKNOWN weights"
            - "GET /eye-bank/donors/${donor_id}/screening-records shows weight_applied 10 for TATTOO_12M, 30 for HEP_B_C_HISTORY and 25 for SEPSIS"
            - "Donor.${donor_id}.status == \"SCREENING\" (an INDETERMINATE panel does not rule the donor out)"

  - rule_id: combinatorial_formula
    instances:

      - name: allocation_fee_rounds_each_surcharge_before_summing
        grounds:
          - calculations.allocation_processing_fee
          - calculations.tissue_quality_score
          - calculations.tissue_classification
          - entities.Allocation.fields.processing_fee_cents
          - entities.Allocation.fields.reserved_classification_snapshot
          - entities.Allocation.fields.reserved_ecd_snapshot
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER matters. All three surcharges on a
          245000-cent TRANSPLANT_OPTICAL base land on exactly .5 raw cents (17762.5, 10412.5,
          4287.5), so rounding each component half-up before summing yields 277464 while summing
          the raw percentages first and rounding once yields 277463; the scaffold pins the
          per-component order and the test detects the one-cent divergence.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "donor died 2026-08-03T02:00:00.000Z, ASYSTOLE, cooled at 2026-08-03T03:00:00.000Z (60 min delay), age 52 -> recovery_window_minutes 960, deadline 2026-08-03T18:00:00.000Z"
            - "one OD cornea preserved in OPTISOL_GS at 2026-08-03T09:00:00.000Z, band WITHIN_STANDARD"
            - "evaluations: SLIT_LAMP all grades 0, SPECULAR guttata_grade 0 and endothelial_cell_count 3100 -> tissue_quality_score 86 -> classification TRANSPLANT_OPTICAL, disposition ELIGIBLE, expires_at 2026-08-17T09:00:00.000Z"
            - "one ACTIVE surgeon with an OPEN URGENT DMEK request for surgery_date 2026-08-05T00:00:00.000Z (days_to_surgery 1), min_ecd 2000, max_donor_age_years 70, laterality_preference ANY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Rosa Field", certification_level: "RECOVERY_ONLY", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rt_id: $.data.id }
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Ivo Grader", certification_level: "RECOVERY_AND_EVAL", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { et_id: $.data.id }
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-A", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", body_cooled_at: "2026-08-03T03:00:00.000Z", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "NO", historian_relationship: "SPOUSE" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors/${donor_id}/consent"
              payload: { consent_type: "FIRST_PERSON", consent_scope: "TRANSPLANT_ONLY", authorizing_party_name: "Registry Self-Consent" }
              as: EyeBankCoordinator
              captures: { donor_v1: $.data.version }
            - call: "POST /eye-bank/donors/${donor_id}/serology-panels"
              payload: { specimen_type: "POST_MORTEM", drawn_at: "2026-08-03T04:00:00.000Z", hemodilution_pct: 0.00, expected_donor_version: "${donor_v1}" }
              as: LabTechnician
              captures: { panel_id: $.data.id }
            - call: "POST /eye-bank/serology-panels/${panel_id}/results"
              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: LabTechnician
            - call: "POST /eye-bank/donors/${donor_id}/approve-recovery"
              payload: {}
              as: MedicalDirector
            - call: "POST /eye-bank/recoveries"
              payload: { donor_id: "${donor_id}", technician_id: "${rt_id}", dispatched_at: "2026-08-03T06:30:00.000Z", planned_release_at: "2026-08-03T10:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rec_id: $.data.id }
            - call: "POST /eye-bank/recoveries/${rec_id}/arrive"
              payload: { arrival_at: "2026-08-03T07:00:00.000Z" }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
            - call: "POST /eye-bank/recoveries/${rec_id}/complete"
              payload: { preservation_at: "2026-08-03T09:00:00.000Z", preservation_medium: "OPTISOL_GS", recovered_lateralities: ["OD"] }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
            - call: "GET /eye-bank/tissues"
              payload: { recovery_id: "${rec_id}" }
              as: EyeBankCoordinator
              captures: { tissue_id: "$.data[0].id", tissue_v0: "$.data[0].version" }
            - call: "POST /eye-bank/tissues/${tissue_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SLIT_LAMP", performed_at: "2026-08-03T09:30:00.000Z", epithelium_defect_grade: 0, stromal_clarity_grade: 0, dm_folds_grade: 0, expected_tissue_version: "${tissue_v0}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
              captures: { tissue_v1: $.data.tissue_version_after }
            - call: "POST /eye-bank/tissues/${tissue_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SPECULAR", performed_at: "2026-08-03T09:45:00.000Z", guttata_grade: 0, endothelial_cell_count: 3100, expected_tissue_version: "${tissue_v1}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
            - call: "POST /eye-bank/tissues/${tissue_id}/classify"
              payload: {}
              as: MedicalDirector
              captures: { classification: $.data.classification, quality: $.data.tissue_quality_score }
            - call: "POST /eye-bank/surgeons"
              payload: { full_name: "Dr Anwar Reed", center_code: "CTR-01", specialty: "DMEK" }
              as: EyeBankCoordinator
              captures: { surgeon_id: $.data.id }
            - call: "POST /eye-bank/surgeon-requests"
              payload: { surgeon_id: "${surgeon_id}", procedure_type: "DMEK", surgery_date: "2026-08-05T00:00:00.000Z", min_ecd: 2000, max_donor_age_years: 70, laterality_preference: "ANY", urgency: "URGENT" }
              as: Surgeon
              as_user_id: "${surgeon_id}"
              captures: { request_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/allocations"
              payload: { tissue_id: "${tissue_id}", request_id: "${request_id}" }
              as: EyeBankCoordinator
              captures: { alloc_id: $.data.id, fee: $.data.processing_fee_cents }
          assert:
            - "${quality} == 86"
            - "${classification} == \"TRANSPLANT_OPTICAL\""
            - "${fee} == 277464"
            - "Allocation.${alloc_id}.reserved_classification_snapshot == \"TRANSPLANT_OPTICAL\""
            - "Allocation.${alloc_id}.reserved_ecd_snapshot == 3100"
            - "the fee decomposes as 245000 base + 17763 urgency + 10413 procedure + 4288 short-notice; the three rounded surcharges sum to 32464"
            - "277464 != 277463 — the sum-then-round order (245000 * 0.1325 = 32462.5 -> 32463) is one cent lower and is FORBIDDEN"
            - "Allocation.${alloc_id}.status == \"RESERVED\" and Allocation.${alloc_id}.source == \"MANUAL\""

      - name: request_priority_tier_derived_from_base_score_only
        grounds:
          - calculations.request_priority_score
          - entities.SurgeonRequest.fields.base_score
          - entities.SurgeonRequest.fields.priority_tier
          - entities.SurgeonRequest.fields.priority_score
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: priority_score
          is base_score plus a bonus chosen by the tier, and the tier is derived from base_score
          ONLY. A URGENT request 4 days out scores base 55 -> GOLD -> 63; re-deriving the tier
          from 63 would give PLATINUM and 70, which the pinned three-step order forbids.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one ACTIVE surgeon"
            - "no tissue, no allocation — the calculation depends only on the request row and the clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/surgeons"
              payload: { full_name: "Dr Mira Vale", center_code: "CTR-02", specialty: "PK" }
              as: EyeBankCoordinator
              captures: { surgeon_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/surgeon-requests"
              payload: { surgeon_id: "${surgeon_id}", procedure_type: "PK", surgery_date: "2026-08-08T00:00:00.000Z", min_ecd: 2000, max_donor_age_years: 70, laterality_preference: "ANY", urgency: "URGENT" }
              as: Surgeon
              as_user_id: "${surgeon_id}"
              captures: { request_id: $.data.id, base: $.data.base_score, tier: $.data.priority_tier, score: $.data.priority_score }
          assert:
            - "${base} == 55 (urgency_weight 30 + surgery_proximity_points 25 for days_to_surgery 4)"
            - "${tier} == \"GOLD\""
            - "${score} == 63"
            - "${score} != 70 — re-deriving the tier from priority_score 63 would select PLATINUM and add 15 instead of 8"
            - "SurgeonRequest.${request_id}.priority_tier == \"GOLD\" even though priority_score 63 sits above the PLATINUM floor of 60"
            - "SurgeonRequest.${request_id}.status == \"OPEN\""

  - rule_id: non_linear_state_machine
    instances:

      - name: tissue_custody_and_disposition_advance_as_independent_dimensions
        grounds:
          - state_machines.CorneaTissue.disposition_status
          - state_machines.CorneaTissue.custody_status
          - entities.CorneaTissue.fields.reissue_generation
          - entities.CorneaTissue.fields.issue_count
          - endpoints."POST /eye-bank/tissues/{id}/return"
        distinguishing_aspect: |
          Parallel shape — CorneaTissue carries TWO independent state fields. Across dispatch and
          delivery the custody dimension advances IN_HOUSE -> IN_TRANSIT -> AT_SURGEON while the
          disposition dimension stays pinned at ISSUED; only the return moves disposition
          (ISSUED -> ELIGIBLE) and the two dimensions end in the non-obvious combination
          ELIGIBLE + RETURNED_TO_BANK, with reissue_generation 1 and issue_count still 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "donor A (cooled 60 min, ASYSTOLE, age 52), one OD cornea preserved 2026-08-03T09:00:00.000Z, quality 86, TRANSPLANT_OPTICAL, expires_at 2026-08-17T09:00:00.000Z"
            - "ACTIVE surgeon with an OPEN ROUTINE PK request for surgery_date 2026-08-08T00:00:00.000Z"
            - "allocation RESERVED then CONFIRMED, shipment PREPARED with a 09:45 baseline reading of 4.0 C (before shipped_at, so excluded from the verdict window), dispatched 2026-08-03T10:00:00.000Z, in-window readings 10:00 -> 4.0 C and 11:00 -> 5.0 C, delivered 2026-08-03T12:00:00.000Z with verdict PASS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Rosa Field", certification_level: "RECOVERY_ONLY", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rt_id: $.data.id }
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Ivo Grader", certification_level: "RECOVERY_AND_EVAL", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { et_id: $.data.id }
            - call: "POST /eye-bank/donors"
