            - call: "POST /league-policies/${pol_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Declan", last_name: "Moreau", date_of_birth: "2014-11-02", guardian_email: "g19@prb.example" }
              as: LeagueAdministrator
