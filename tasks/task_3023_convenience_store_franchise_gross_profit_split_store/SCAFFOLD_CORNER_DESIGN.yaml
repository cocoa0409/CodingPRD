            - "GET /franchise/revenue-lines?settlement_id=${setZ_id} then returns exactly 2 rows"

      - name: dual_variant_layer_is_covered_by_the_difficulty_index
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.gross_profit_split.variants
          - calculations.shrink_charge_book_to_physical.variants
        excluded_because:
          difficulty_instance: settlement_provisional_split_vs_final_split_diverge
          rationale: "Both declared dual-variant calculations are asserted end-to-end by that §1.8 instance and by shrink_charge_recomputed_at_finalize_after_agreement_amendment."
        # NO test_recipe.

      - name: cascading_side_effects_layer_is_covered_by_the_difficulty_index
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Store.ACTIVE_to_TERMINATED
          - state_machines.Franchisee.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: franchisee_terminate_cascades_store_then_cancels_order_then_finalizes_settlement
          rationale: "The deepest cascade (four hops) and the reinstate cascade (three hops) are both asserted as §1.8 instances."
        # NO test_recipe.

      - name: rate_threshold_layer_is_covered_by_the_difficulty_index
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - constants.TIER_BONUS_HIGH_THRESHOLD_CENTS
          - calculations.waste_share_allocation
        excluded_because:
          difficulty_instance: settlement_gross_profit_exactly_20000000_earns_the_high_tier_bonus
          rationale: "The >= boundary at 20000000 is asserted by that §1.8 instance, and the waste tier boundary is exercised by waste_share_period_total_keys_tier_then_per_order_share."
        # NO test_recipe.

