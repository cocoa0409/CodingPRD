            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id", nd1: "$.data.non_drawbackable_cents", el1: "$.data.drawback_eligible_duty_cents "} }
          trigger:
