          assert:
            - "after the credit-hold call: Customer.${cust_id}.trading_status == CREDIT_HOLD and Customer.${cust_id}.audit_status == CLEAR"
            - "after the compliance-audits call: Customer.${cust_id}.audit_status == AUDIT_IN_PROGRESS while trading_status is still CREDIT_HOLD"
            - "Customer.${cust_id}.credit_hold_reason == \"Aged unresolved chargebacks under manual review\" (the audit did not overwrite it with an AUTO: reason)"
            - "after record-finding: ComplianceAudit.${audit_id}.status == IN_PROGRESS, findings_count == 1, recovery_claim_amount == 1200.00"
            - "after issue-findings: ComplianceAudit.${audit_id}.status == FINDINGS_ISSUED and Customer.${cust_id}.audit_status == FINDINGS_OPEN"
            - "Customer.${cust_id}.compliance_penalty_points == 10 and trading_status == CREDIT_HOLD (10 < SUSPENSION_POINTS 25, so the commercial axis did not advance)"

  - rule_id: transitive_cascade
    instances:
      - name: deduction_validation_overspend_chain_reaches_customer_credit_hold
        cascade_depth: 4
        grounds:
          - calculations.deduction_valuation
          - calculations.promotion_spend_status
          - calculations.allocation_posture
          - calculations.customer_penalty_score
          - state_machines.Customer.trading_status
        distinguishing_aspect: |
          One request — validating a well-evidenced 12250.00 claim against a promotion planned
          at 10200.00 — propagates four hops across four entities:
          hop 1 Deduction MATCHED -> VALIDATED and Promotion.consumed_deduction_amount rises to
          12250.00; hop 2 recognized_spend_amount becomes max(2500.00, 12250.00) = 12250.00 so
          spend_ratio is 1.2010 and spend_status jumps WITHIN_BUDGET -> OVERSPENT; hop 3
          BudgetAllocation.overspend_event_count goes 0 -> 1 and posture OPEN -> RESTRICTED;
          hop 4 customer_penalty_score reaches 10 and Customer.trading_status goes
          ACTIVE -> CREDIT_HOLD with an AUTO: reason. An implementation that stops after hop 2
          leaves posture OPEN, and one that stops after hop 3 leaves the customer ACTIVE, so
          each of hops 2, 3 and 4 has its own falsifying assert.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03."
            - "One program, brand (list 24.00, cogs 8.70), customer MegaMart on the EVIDENCE_BASED policy, and one APPROVED allocation with planned_amount 100000.00 and planned_incremental_units 20000."
