  # --- RedemptionOrder ---
  - method: POST
    path: "/api/redemption-orders"
    description: "Redeem points for a catalog item; holds points in escrow; idempotent per (employee, idempotency_key)"
    roles: [Employee]
    code: 201
    input: [catalog_item_id, "quantity?", idempotency_key]
    output: RedemptionOrder
    side_effects: ["fulfillment_status=PENDING_SUBMISSION, escrow_status=HELD", "HOLD ledger entry (available -> held)", "inventory decrement", "single order with points_total > 50000 auto-creates AbuseFlag(REDEMPTION_ANOMALY, OPEN) but still succeeds"]

  - method: GET
    path: "/api/redemption-orders/{redemptionOrderId}"
    description: "Get a redemption order"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: []

  - method: GET
    path: "/api/redemption-orders"
    description: "List redemption orders with filters"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: ["employee_id?", "catalog_item_id?", "fulfillment_status?", "escrow_status?", "program_id?"]
    output: "RedemptionOrder[]"
    side_effects: []

  - method: POST
    path: "/api/redemption-orders/{redemptionOrderId}/submit"
    description: "Submit order to the vendor; assigns ship_date via the capacity selector"
    roles: [VendorOps]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: ["fulfillment_status -> SUBMITTED", "ship_date assigned", "increments RedemptionOrder.version by 1"]

  - method: POST
    path: "/api/redemption-orders/{redemptionOrderId}/mark-shipped"
    description: "Mark a SUBMITTED order shipped"
    roles: [VendorOps]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: ["fulfillment_status -> SHIPPED", "increments RedemptionOrder.version by 1"]

  - method: POST
    path: "/api/redemption-orders/{redemptionOrderId}/mark-delivered"
    description: "Mark a SHIPPED order delivered; settles escrow, consumes awards FIFO, creates the ESTIMATED TaxRecord"
    roles: [VendorOps]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: ["fulfillment -> DELIVERED, escrow -> SETTLED", "SETTLE_REDEEM ledger entry", "FIFO award consumption", "TaxRecord created (de-minimis + PROVISIONAL gross-up)", "delivered_at = now", "increments RedemptionOrder.version by 1"]

  - method: POST
    path: "/api/redemption-orders/{redemptionOrderId}/cancel"
    description: "Cancel a PENDING_SUBMISSION or SUBMITTED order; full refund and inventory restore"
    roles: [Employee, HRAdmin]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: ["fulfillment -> CANCELLED, escrow -> REFUNDED", "REFUND ledger entry", "inventory restored", "ship slot freed", "increments RedemptionOrder.version by 1"]

  - method: POST
    path: "/api/redemption-orders/{redemptionOrderId}/request-return"
    description: "Request return of a DELIVERED order within 14 days; gift cards non-returnable"
    roles: [Employee]
    code: 200
    input: ["reason?"]
    output: RedemptionOrder
    side_effects: ["fulfillment -> RETURN_REQUESTED", "increments RedemptionOrder.version by 1"]

  - method: POST
    path: "/api/redemption-orders/{redemptionOrderId}/complete-return"
    description: "Complete a requested return; refund minus restocking fee; voids or amends the TaxRecord"
    roles: [VendorOps]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: ["fulfillment -> RETURNED, escrow -> SETTLED_WITH_FEE", "REFUND + RESTOCKING_FEE ledger entries", "TaxRecord ESTIMATED->VOIDED or FINALIZED->AMENDED", "inventory NOT restored", "increments RedemptionOrder.version by 1"]

