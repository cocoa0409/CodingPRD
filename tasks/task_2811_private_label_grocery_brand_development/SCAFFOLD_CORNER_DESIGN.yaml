        claim_type: priority_conflict
        grounds:
          - validations[priority=16]
          - validations[priority=44]
          - errors[ERR_SPECIFICATION_NOT_DRAFT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / spec_lock_state_beats_budget_fiscal
          rationale: "That §1.8 instance violates both rows at once and asserts ERR_SPECIFICATION_NOT_DRAFT is returned while ERR_PROGRAM_BUDGET_EXCEEDED is not."

