  - section: state_machines
    instances:
      - name: every_machine_starts_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.BreedingLine
          - state_machines.CrossingBlock
          - state_machines.NurseryPlanting
          - state_machines.TrialSeries
          - state_machines.TrialEntry
        distinguishing_aspect: "Six freshly created rows must sit in exactly the declared initial states - BreedingLine at NURSERY plus NOT_REQUIRED on its second dimension, CrossingBlock PLANNED, NurseryPlanting SCHEDULED, TrialSeries PLANNING, TrialEntry ENTERED, NurseryBlock AVAILABLE - so no machine is created mid-flight."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "IS1", environment_class: "HIGH_YIELD_IRRIGATED", total_plot_capacity: 400, plot_cost_usd: 45.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /nursery-blocks"
              payload: { block_code: "NB-IS1", nursery_type: "WINTER", location_code: "PR_ISABELA", plot_count: 200, fallow_buffer_days: 14 }
