      - name: retirement_too_early_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_RETIREMENT_TOO_EARLY]
        distinguishing_aspect: "Lead-time boundary: with the clock in 2026, retirement_year 2027 (< 2026+2) fails ERR_RETIREMENT_TOO_EARLY; 2028 (== clock year + 2) succeeds."
        test_recipe:
          setup: ["Clock 2026-09-01. Plan P DRAFT; two ACTIVE COAL units R1, R2."]
