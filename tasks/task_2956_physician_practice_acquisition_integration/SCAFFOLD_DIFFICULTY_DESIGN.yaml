            - "Re-issuing the identical CONVERTED request then succeeds: BillingConversion.${conv_id}.status == CONVERTED"

  # ===========================================================================
  # Rule 8 — Resource/temporal overlap under different interval semantics
  #   semantics 1 : closed date interval [effective_on, terminates_on] per payer
  #   semantics 2 : discrete committee-cycle slot count (bucketed capacity)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: payer_contract_closed_interval_touching_endpoint_collides
        grounds:
          - validations[priority=31]
          - entities.PayerContract.fields.effective_on
          - entities.PayerContract.fields.terminates_on
          - errors.ERR_PAYER_CONTRACT_INTERVAL_OVERLAP
        distinguishing_aspect: |
          Continuous-time interval semantics: two coverage terms for the SAME
          payer_name are compared as CLOSED intervals on both ends, so a second
          contract whose effective_on equals the incumbent's terminates_on shares
          exactly one day and is rejected, while effective_on one day later is
          accepted. Interval semantics are date-range containment — distinct from
          the discrete slot-count bucketing of the committee-cycle instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SOURCING."
            - "One incumbent PayerContract for payer_name Aetna Choice covering 2026-11-01 through 2027-10-31, novation_status NOT_REQUESTED."
            - "One PayerContract for a DIFFERENT payer_name (Cigna Open Access) covering the identical dates, to prove the check is scoped to payer_name."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /payer-contracts"
              payload: { acquisition_id: "${acq_id}", payer_name: "Aetna Choice", payer_type: "COMMERCIAL", contract_form: "ASSIGNABLE", notice_days_required: 90, effective_on: "2026-11-01", terminates_on: "2027-10-31", annual_revenue_share_bps: 2500, committee_slots_per_cycle: 2 }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { aetna_id: "$.data.id" }
            - call: "POST /payer-contracts"
              payload: { acquisition_id: "${acq_id}", payer_name: "Cigna Open Access", payer_type: "COMMERCIAL", contract_form: "ASSIGNABLE", notice_days_required: 60, effective_on: "2026-11-01", terminates_on: "2027-10-31", annual_revenue_share_bps: 1500, committee_slots_per_cycle: 2 }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { cigna_id: "$.data.id" }
          trigger:
            - call: "POST /payer-contracts"
              payload: { acquisition_id: "${acq_id}", payer_name: "Aetna Choice", payer_type: "COMMERCIAL", contract_form: "ASSIGNABLE", notice_days_required: 90, effective_on: "2027-10-31", terminates_on: "2028-10-30", annual_revenue_share_bps: 2500, committee_slots_per_cycle: 2 }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "response error_id == ERR_PAYER_CONTRACT_INTERVAL_OVERLAP with HTTP 409"
            - "no second Aetna Choice PayerContract row exists: GET /payer-contracts?acquisition_id=${acq_id} still reports total_count 2"
            - "PayerContract.${aetna_id}.terminates_on == 2027-10-31 (untouched by the rejected write)"
            - "PayerContract.${cigna_id} was accepted despite identical dates, proving the check keys on payer_name within one acquisition_id"
            - "Re-issuing the same payload with effective_on 2027-11-01 and terminates_on 2028-10-31 succeeds with HTTP 201 and novation_status NOT_REQUESTED"
            - "a third Aetna Choice term for 2026-10-01 through 2026-10-31, entirely before the incumbent's effective_on, is accepted — the check is containment, not same-payer exclusivity"

      - name: credentialing_committee_cycle_aggregate_capacity_exceeded
        grounds:
          - validations[priority=32]
          - calculations.credentialing_committee_cycle
          - entities.PayerContract.fields.committee_slots_per_cycle
          - entities.CredentialingPackage.fields.committee_cycle_on
