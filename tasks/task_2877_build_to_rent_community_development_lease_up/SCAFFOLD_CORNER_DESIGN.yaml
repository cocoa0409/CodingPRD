              payload: { name: "Hartwell", market_code: "WA-SEA", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 25000000, maintenance_tech_headcount: 2 }
