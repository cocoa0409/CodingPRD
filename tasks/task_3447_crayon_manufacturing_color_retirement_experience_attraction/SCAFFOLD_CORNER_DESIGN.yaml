          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The APPROVE action is SafetyOfficer-exclusive even though the endpoint admits both roles: a Formulator calling APPROVE on a SUBMITTED, safety-passed formula gets 403 ERR_UNAUTHORIZED and the formula stays SUBMITTED."
        test_recipe:
          setup:
