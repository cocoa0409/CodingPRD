          rationale: "That §1.8 instance already asserts, after approve, that both COMPLETED trips reach settlement_status BILLED, that the period's MISSED_TRIP memo reaches APPLIED with applied_report_id set, and that credit_balance_cents falls to 0."

  # =========================================================================
  - section: calculations
    instances:

      - name: apc_sensor_row_outranks_every_driver_tally
        claim_type: correct_result
        grounds:
          - calculations.ridership_counted_boardings
          - entities.RidershipCount.fields.sequence_no
          - entities.Trip.fields.counted_boardings
        distinguishing_aspect: "With sequence_no 1 a DRIVER_TALLY of 7, sequence_no 2 an APC_SENSOR of 21 and sequence_no 3 an APC_SENSOR of 19, counted_boardings resolves to 19 and counted_ada_boardings to 1 — the highest APC sequence_no wins, never the largest number and never the tally."
        test_recipe:
          setup:
            - "One COMPLETED trip on 2026-09-02 whose completion appended a DRIVER_TALLY row of 7 boardings at sequence_no 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Counting Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cn1: $.data.id }
            - call: "POST /service-contracts/${cn1}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${cn1}", name: "Counting Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rn1: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-3101", seat_capacity: 20, is_ada_accessible: false, odometer_km: 1300, service_interval_km: 20000 }
              as: FleetManager
              captures: { vn1: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Counting Driver", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { dn1: $.data.id }
            - call: "POST /routes/${rn1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rn1}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tn1: "$.data[0].id" }
            - call: "POST /trips/${tn1}/assign"
              payload: { vehicle_id: "${vn1}", driver_id: "${dn1}" }
              as: OpsPlanner
            - call: "POST /trips/${tn1}/start"
              payload: { actual_departure_min: 421 }
              as: DriverUser
              as_user_id: "${dn1}"
            - call: "POST /trips/${tn1}/complete"
              payload: { actual_completion_min: 469, boarded: 7, alighted: 7, ada_boardings: 0 }
              as: DriverUser
              as_user_id: "${dn1}"
          trigger:
            - call: "POST /ridership-counts"
              payload: { trip_id: "${tn1}", boarded: 21, alighted: 21, ada_boardings: 3, source: "APC_SENSOR" }
              as: OpsPlanner
              captures: { rc2_seq: $.data.sequence_no }
            - call: "POST /ridership-counts"
              payload: { trip_id: "${tn1}", boarded: 19, alighted: 19, ada_boardings: 1, source: "APC_SENSOR" }
              as: OpsPlanner
              captures: { rc3_seq: $.data.sequence_no }
          assert:
            - "${rc2_seq} == 2 and ${rc3_seq} == 3"
            - "GET /trips/${tn1} -> Trip.counted_boardings == 19"
            - "GET /trips/${tn1} -> Trip.counted_ada_boardings == 1"
            - "GET /trips/${tn1}/ridership-counts -> total_count == 3 with sequence_no 1, 2 and 3 in ascending order"
            - "GET /trips/${tn1}/ridership-counts?source=DRIVER_TALLY -> total_count == 1 and data[0].boarded == 7"

      - name: match_selector_picks_earliest_eligible_departure
        claim_type: correct_result
        grounds:
          - calculations.trip_match_selector
          - state_machines.OnDemandRequest.PENDING_to_MATCHED
        distinguishing_aspect: "For a pickup minute of 433 across trips departing 420, 432, 444 and 456, the selector filters out both trips departing before 433 and returns the 444 trip, not the 420 trip and not the last one."
        test_recipe:
          setup:
            - "One ACTIVE ServiceContract with a PUBLISHED Route (window 420..456, headway 12) for 2026-09-02, all four trips SCHEDULED and unassigned."
            - "One PENDING OnDemandRequest for pickup 433, party of 2, requires_ada false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Selector Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { cs1: $.data.id }
