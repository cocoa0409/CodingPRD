              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/system-descriptions/${sd}/lock-boundary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "D-01", title: "Daily batch reconciliation", frequency: "DAILY", automation: "AUTOMATED", risk_rating: "MODERATE", population_size: 100 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { d01: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "W-01", title: "Weekly vulnerability scan", frequency: "WEEKLY", automation: "AUTOMATED", risk_rating: "LOW", population_size: 4 }
              as: ComplianceLead
              as_user_id: "cl-1"
