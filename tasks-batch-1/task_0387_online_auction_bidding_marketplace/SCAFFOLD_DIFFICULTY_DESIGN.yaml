            - "HTTP status == 409"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bid_increment_minimum_exact_boundary   # numeric threshold >= on /bids
        grounds:
          - "validations[priority=11]"
          - calculations.bid_increment
          - entities.Bid.fields.max_proxy_cents
        distinguishing_aspect: |
          Numeric boundary on the bid endpoint: with current_price 10000 the increment is 500 so the minimum
          acceptable next bid is exactly 10500. max_proxy 10499 is rejected ERR_BID_TOO_LOW; max_proxy 10500 is
          accepted (>= boundary inclusive). This instance asserts the ACCEPTED side at exactly 10500.
        test_recipe:
          setup:
            - "Seller S publishes AUCTION start 10000 ending 2026-06-10; Buyer A bids max 10000 (first -> current 10000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s11@x.com", display_name: "S11", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "a11@x.com", display_name: "A11", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b11@x.com", display_name: "B11", roles: ["BUYER"] }
              as: Anonymous
              captures: { bb_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
