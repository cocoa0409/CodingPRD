            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 150000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
          trigger:
            - { call: "GET /surety-bonds/${b_id}", payload: {}, as: FiduciaryAdmin, captures: { fum: $.data.funds_under_management_cents, util: $.data.utilization_bps } }
