  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_state_beats_weather_safety
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_ALREADY_TERMINAL]
          - errors[ERR_WEATHER_RESTRICTED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: dispatching a CANCELLED job whose
          window also overlaps an ACTIVE weather restriction violates both priority 8
          (terminal state) and priority 12 (weather safety); the state error wins.
        test_recipe:
          setup:
            - "Job created and CONFIRMED, then CANCELLED"
            - "ACTIVE WeatherRestriction WIND overlapping the job window 2026-06-01T08:00:00Z-10:00:00Z"
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/job-orders/${job1}/cancel"
              payload: { cancel_reason: "Vessel diverted" }
              as: PortDispatcher
            - call: "POST /api/weather-restrictions"
              payload: { restriction_type: "WIND", threshold_value: 35.0, port_area: "NORTH_HARBOR", effective_start: "2026-06-01T07:00:00Z", effective_end: "2026-06-01T12:00:00Z" }
              as: PortAdmin
          trigger:
            - call: "POST /api/job-orders/${job1}/dispatch"
              payload: {}
              as: PortDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Dispatch is rejected with error_id == ERR_ALREADY_TERMINAL (HTTP 409), NOT ERR_WEATHER_RESTRICTED — state priority 8 outranks business_safety priority 12"

      - name: tug_safety_beats_duplicate_constraint
        grounds:
          - validations[priority=10]
          - validations[priority=19]
          - errors[ERR_TUG_UNAVAILABLE]
          - errors[ERR_DUPLICATE_TUG_ASSIGNMENT]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint: creating a second
          assignment for the same tug on the same job while the tug is RESTRICTED violates
          both priority 10 (tug availability) and priority 19 (duplicate tug); the safety
          error wins. A different category pair than the state-vs-safety instance.
        test_recipe:
          setup:
            - "Job CONFIRMED; tug Atlas has a PROPOSED assignment on the job (created while AVAILABLE)"
            - "A FAILED gear inspection has since moved the tug to RESTRICTED (PROPOSED assignments are not superseded by the cascade)"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
