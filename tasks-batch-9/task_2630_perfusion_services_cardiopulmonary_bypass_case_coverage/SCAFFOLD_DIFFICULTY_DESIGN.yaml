          - entities.PerfusionDevice.fields.open_reservation_count
          - entities.PumpChecklist.fields.blood_mgmt_signoff
        distinguishing_aspect: |
          A different invariant on a different ledger: open_reservation_count must always equal the
          number of live cases holding the machine in a reserving bypass_status, and the machine's
          status must follow that count rather than the identity of the cancelling case. Two
          non-colliding cases hold the same pump, so the first cancel is the interesting one - it
          must decrement to 1 and leave the machine RESERVED, where a naive "release my devices"
          implementation would free a pump another case is still counting on. Only the second cancel
