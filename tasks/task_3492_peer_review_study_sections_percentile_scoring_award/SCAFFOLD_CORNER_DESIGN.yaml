scaffold_corner_design:
  - section: entities
    instances:
      - name: foa_create_returns_open_with_server_fields
        claim_type: creation
        grounds:
          - entities.FundingOpportunity
          - endpoints.POST_/grants/funding-opportunities
        distinguishing_aspect: Creating a FOA returns 201 with the declared initial state OPEN, version 1, and server-minted id/created_at; all input fields echo.
        test_recipe:
          setup:
            - empty database
          setup_api_calls: []
          trigger:
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-201
                title: R01 Base FOA
                activity_code: R01
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                foa_id: $.data.id
                foa_st: $.data.status
                foa_v: $.data.version
          assert:
            - response code == 201
            - FundingOpportunity.${foa_id}.status == OPEN (initial state)
            - FundingOpportunity.${foa_id}.version == 1
            - FundingOpportunity.${foa_id}.activity_code == R01
            - FundingOpportunity.${foa_id}.research_strategy_page_limit == 12
            - FundingOpportunity.${foa_id}.id is a UUID and created_at is present
      - name: application_create_body_applicant_id_input_ignored
        claim_type: defaults
        grounds:
          - entities.Application.fields.applicant_id
          - entities.Application.fields.excluded_reviewer_ids
          - entities.Application.fields.human_subjects_involved
        distinguishing_aspect: 'applicant_id is server-taken from X-User-ID (a body value is ignored), and omitted flags default: human_subjects_involved false, vertebrate_animals_involved false, excluded_reviewer_ids
          [].'
        test_recipe:
          setup:
            - institution and FOA exist; applicant pi_a registered
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: State University
              as: ProgramOfficer
              captures:
                inst_id: $.data.id
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-202
                title: R01 Defaults FOA
                activity_code: R01
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                foa_id: $.data.id
            - call: POST /grants/applicants
              payload:
                full_name: PI A
                email: pia@x.edu
                career_stage: ESTABLISHED_INVESTIGATOR
              as: ProgramOfficer
              captures:
                pi_a: $.data.id
          trigger:
            - call: POST /grants/applications
              payload:
                foa_id: ${foa_id}
                institution_id: ${inst_id}
                title: Defaults app
                research_strategy_page_count: 5
                direct_cents_per_year:
                  - 20000000
                requested_years: 1
                applicant_id: 00000000-0000-0000-0000-000000000000
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                app_a: $.data.id
                app_owner: $.data.applicant_id
          assert:
            - Application.${app_a}.applicant_id == ${pi_a} (header wins; body applicant_id ignored)
            - Application.${app_a}.human_subjects_involved == false
            - Application.${app_a}.vertebrate_animals_involved == false
            - Application.${app_a}.excluded_reviewer_ids == []
            - Application.${app_a}.status == DRAFT
            - Application.${app_a}.live_assignment_count == 0
      - name: application_computed_score_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Application.fields.percentile_raw
          - entities.Application.fields.impact_score
        distinguishing_aspect: Client-supplied values for computed fields (impact_score, percentile_raw) are ignored at creation; both read back null until release-scores computes them.
        test_recipe:
          setup:
            - institution and FOA exist; applicant registered
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: State University
              as: ProgramOfficer
              captures:
                inst_id: $.data.id
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-203
                title: R01 Computed FOA
                activity_code: R01
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                foa_id: $.data.id
            - call: POST /grants/applicants
              payload:
                full_name: PI A
                email: pia@x.edu
                career_stage: ESTABLISHED_INVESTIGATOR
              as: ProgramOfficer
              captures:
                pi_a: $.data.id
          trigger:
            - call: POST /grants/applications
              payload:
                foa_id: ${foa_id}
                institution_id: ${inst_id}
                title: Computed app
                research_strategy_page_count: 5
                direct_cents_per_year:
                  - 20000000
                requested_years: 1
                impact_score: 10
                percentile_raw: 1.0
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                app_a: $.data.id
          assert:
            - Application.${app_a}.impact_score == null (client input ignored)
            - Application.${app_a}.percentile_raw == null
            - Application.${app_a}.percentile_normalized == null
      - name: get_application_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_APPLICATION_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: Reading a well-formed but nonexistent application id yields 404 ERR_APPLICATION_NOT_FOUND.
        test_recipe:
          setup:
            - empty database
          setup_api_calls: []
          trigger:
            - call: GET /grants/applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
              payload: {}
              as: ProgramOfficer
              captures:
                err: $.data.error_id
          assert:
            - GET fails with error_id == ERR_APPLICATION_NOT_FOUND (http 404)
      - name: duplicate_pa_number_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=12]
          - errors[ERR_DUPLICATE_PA_NUMBER]
        distinguishing_aspect: pa_number is unique across funding opportunities; a second create with the same pa_number fails 409 while a different pa_number succeeds.
        test_recipe:
          setup:
            - one FOA with pa_number PA-26-204 exists
          setup_api_calls:
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-204
                title: First
                activity_code: R01
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
          trigger:
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-204
                title: Second
                activity_code: R21
                research_strategy_page_limit: 6
                min_direct_cents_per_year: 500000
                max_direct_cents_per_year: 10000000
                max_years: 2
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                err: $.data.error_id
          assert:
            - second create fails with error_id == ERR_DUPLICATE_PA_NUMBER (http 409)
      - name: duplicate_application_per_foa_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=12]
          - errors[ERR_DUPLICATE_APPLICATION]
        distinguishing_aspect: 'One non-terminal application per (applicant, FOA): the same applicant''s second application to the same FOA fails 409, while another applicant''s application to that FOA
          succeeds.'
        test_recipe:
          setup:
            - institution, FOA exist; applicant pi_a has a DRAFT application against the FOA; applicant pi_b registered
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: State University
              as: ProgramOfficer
              captures:
                inst_id: $.data.id
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-205
                title: R01 Dup FOA
                activity_code: R01
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                foa_id: $.data.id
            - call: POST /grants/applicants
              payload:
                full_name: PI A
                email: pia@x.edu
                career_stage: ESTABLISHED_INVESTIGATOR
              as: ProgramOfficer
              captures:
                pi_a: $.data.id
            - call: POST /grants/applicants
              payload:
                full_name: PI B
                email: pib@x.edu
                career_stage: NEW_INVESTIGATOR
              as: ProgramOfficer
              captures:
                pi_b: $.data.id
            - call: POST /grants/applications
              payload:
                foa_id: ${foa_id}
                institution_id: ${inst_id}
                title: First
                research_strategy_page_count: 5
                direct_cents_per_year:
                  - 20000000
                requested_years: 1
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                app_a: $.data.id
          trigger:
            - call: POST /grants/applications
              payload:
                foa_id: ${foa_id}
                institution_id: ${inst_id}
                title: Second
                research_strategy_page_count: 5
                direct_cents_per_year:
                  - 20000000
                requested_years: 1
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                err: $.data.error_id
            - call: POST /grants/applications
              payload:
                foa_id: ${foa_id}
                institution_id: ${inst_id}
                title: Other applicant
                research_strategy_page_count: 5
                direct_cents_per_year:
                  - 20000000
                requested_years: 1
              as: Applicant
              as_user_id: ${pi_b}
              captures:
                app_b: $.data.id
                app_b_st: $.data.status
          assert:
            - pi_a's second application fails with error_id == ERR_DUPLICATE_APPLICATION (http 409)
            - pi_b's application succeeds with status == DRAFT
      - name: invalid_activity_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.FundingOpportunity.fields.activity_code
          - errors[ERR_VALIDATION]
        distinguishing_aspect: activity_code outside the declared enum {R01, R21, R03} is rejected with ERR_VALIDATION (400).
        test_recipe:
          setup:
            - empty database
          setup_api_calls: []
          trigger:
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-206
                title: Bad enum
                activity_code: R99
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                err: $.data.error_id
          assert:
            - create fails with error_id == ERR_VALIDATION (http 400)
      - name: reviewer_created_invited_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Reviewer
          - entities.Reviewer.fields.active_assignment_count
        distinguishing_aspect: A recruited reviewer starts INVITED with active_assignment_count 0 and declared_conflicts [].
        test_recipe:
          setup:
            - an institution exists
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: Other College
              as: ProgramOfficer
              captures:
                inst2_id: $.data.id
          trigger:
            - call: POST /grants/reviewers
              payload:
                full_name: Rev X
                institution_id: ${inst2_id}
                expertise_keywords:
                  - neuro
              as: ScientificReviewOfficer
              captures:
                rx: $.data.id
                rx_st: $.data.status
          assert:
            - Reviewer.${rx}.status == INVITED
            - Reviewer.${rx}.active_assignment_count == 0
            - Reviewer.${rx}.declared_conflicts == []
  - section: state_machines
    instances:
      - name: reviewer_declined_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Reviewer
          - errors[ERR_REVIEWER_INVALID_STATE]
        distinguishing_aspect: 'DECLINED is terminal: a second respond on the same reviewer fails with ERR_REVIEWER_INVALID_STATE and changes nothing.'
        test_recipe:
          setup:
            - reviewer invited then declined
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: Other College
              as: ProgramOfficer
              captures:
                inst2_id: $.data.id
            - call: POST /grants/reviewers
              payload:
                full_name: Rev X
                institution_id: ${inst2_id}
                expertise_keywords:
                  - neuro
              as: ScientificReviewOfficer
              captures:
                rx: $.data.id
            - call: POST /grants/reviewers/${rx}/respond
              payload:
                decision: DECLINE
              as: Reviewer
              as_user_id: ${rx}
          trigger:
            - call: POST /grants/reviewers/${rx}/respond
              payload:
                decision: ACCEPT
              as: Reviewer
              as_user_id: ${rx}
              captures:
                err: $.data.error_id
            - call: GET /grants/reviewers/${rx}
              payload: {}
              as: ProgramOfficer
              captures:
                rx_st: $.data.status
          assert:
            - second respond fails with error_id == ERR_REVIEWER_INVALID_STATE (http 409)
            - Reviewer.${rx}.status == DECLINED (unchanged)
      - name: resubmit_submitted_application_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - errors[ERR_APPLICATION_NOT_SUBMITTABLE]
        distinguishing_aspect: 'submit is not idempotent: the same trigger twice moves DRAFT -> SUBMITTED once; the second call fails ERR_APPLICATION_NOT_SUBMITTABLE.'
        test_recipe:
          setup:
            - one DRAFT application against an OPEN FOA
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: State University
              as: ProgramOfficer
              captures:
                inst_id: $.data.id
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-207
                title: R01 Resubmit FOA
                activity_code: R01
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                foa_id: $.data.id
            - call: POST /grants/applicants
              payload:
                full_name: PI A
                email: pia@x.edu
                career_stage: ESTABLISHED_INVESTIGATOR
              as: ProgramOfficer
              captures:
                pi_a: $.data.id
            - call: POST /grants/applications
              payload:
                foa_id: ${foa_id}
                institution_id: ${inst_id}
                title: Resubmit app
                research_strategy_page_count: 5
                direct_cents_per_year:
                  - 20000000
                requested_years: 1
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                app_a: $.data.id
            - call: POST /grants/applications/${app_a}/submit
              payload: {}
              as: Applicant
              as_user_id: ${pi_a}
          trigger:
            - call: POST /grants/applications/${app_a}/submit
              payload: {}
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                err: $.data.error_id
          assert:
            - second submit fails with error_id == ERR_APPLICATION_NOT_SUBMITTABLE (http 409)
            - Application.${app_a}.status == SUBMITTED
      - name: critique_before_convene_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Assignment.ACCEPTED_to_CRITIQUE_SUBMITTED
          - errors[ERR_SECTION_NOT_IN_MEETING]
        distinguishing_aspect: Critique submission is gated on the application's section being MEETING_HELD; while RECRUITING it fails ERR_SECTION_NOT_IN_MEETING and the assignment stays ACCEPTED.
        test_recipe:
          setup:
            - application UNDER_REVIEW with one ACCEPTED assignment; section still RECRUITING
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: State University
              as: ProgramOfficer
              captures:
                inst_id: $.data.id
            - call: POST /grants/institutions
              payload:
                name: Other College
              as: ProgramOfficer
              captures:
                inst2_id: $.data.id
            - call: POST /grants/institutes
              payload:
                name: National Test Institute
                appropriation_cents: 100000000
                reserve_cents: 0
                indirect_cost_rate: 0.5
                select_pay_cap_pct: 0.1
                select_pay_extension_percentile: 5.0
              as: ProgramOfficer
              captures:
                insti_id: $.data.id
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-208
                title: R01 Critique FOA
                activity_code: R01
                research_strategy_page_limit: 12
                min_direct_cents_per_year: 1000000
                max_direct_cents_per_year: 25000000
                max_years: 5
                open_date: '2026-08-01T00:00:00Z'
                receipt_deadline: '2026-12-01T00:00:00Z'
              as: ProgramOfficer
              captures:
                foa_id: $.data.id
            - call: POST /grants/study-sections
              payload:
                name: Section CR
                meeting_date: '2027-03-01T00:00:00Z'
                application_quota: 10
              as: ScientificReviewOfficer
              captures:
                sec_id: $.data.id
            - call: POST /grants/applicants
              payload:
                full_name: PI A
                email: pia@x.edu
                career_stage: ESTABLISHED_INVESTIGATOR
              as: ProgramOfficer
              captures:
                pi_a: $.data.id
            - call: POST /grants/applications
              payload:
                foa_id: ${foa_id}
                institution_id: ${inst_id}
                title: Critique app
                research_strategy_page_count: 5
                direct_cents_per_year:
                  - 20000000
                requested_years: 1
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                app_a: $.data.id
            - call: POST /grants/applications/${app_a}/submit
              payload: {}
              as: Applicant
              as_user_id: ${pi_a}
              captures:
                app_a_v: $.data.version
            - call: POST /grants/applications/${app_a}/referral
              payload:
                study_section_id: ${sec_id}
                institute_id: ${insti_id}
                expected_application_version: ${app_a_v}
              as: ReferralOfficer
            - call: POST /grants/reviewers
              payload:
                full_name: Rev 1
                institution_id: ${inst2_id}
                expertise_keywords:
                  - neuro
              as: ScientificReviewOfficer
              captures:
                r1: $.data.id
            - call: POST /grants/reviewers/${r1}/respond
              payload:
                decision: ACCEPT
              as: Reviewer
              as_user_id: ${r1}
            - call: POST /grants/assignments
              payload:
                application_id: ${app_a}
                reviewer_id: ${r1}
                role: PRIMARY
              as: ScientificReviewOfficer
              captures:
                a_1: $.data.id
            - call: POST /grants/assignments/${a_1}/respond
              payload:
                decision: ACCEPT
              as: Reviewer
              as_user_id: ${r1}
          trigger:
            - call: POST /grants/assignments/${a_1}/submit-critique
              payload:
                significance_score: 3
                innovation_score: 3
                approach_score: 3
                investigator_score: 3
                environment_score: 3
                overall_impact_score: 3
              as: Reviewer
              as_user_id: ${r1}
              captures:
                err: $.data.error_id
          assert:
            - submit-critique fails with error_id == ERR_SECTION_NOT_IN_MEETING (http 409)
            - Assignment.${a_1}.status == ACCEPTED (unchanged)
      - name: convene_without_under_review_applications_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.StudySection.RECRUITING_to_MEETING_HELD
          - errors[ERR_SECTION_NOT_CONVENABLE]
        distinguishing_aspect: convene requires at least one UNDER_REVIEW application in the section; an empty section fails ERR_SECTION_NOT_CONVENABLE.
        test_recipe:
          setup:
            - one RECRUITING section with no applications
          setup_api_calls:
            - call: POST /grants/study-sections
              payload:
                name: Empty Section
                meeting_date: '2027-03-01T00:00:00Z'
                application_quota: 10
              as: ScientificReviewOfficer
              captures:
                sec_id: $.data.id
          trigger:
            - call: POST /grants/study-sections/${sec_id}/convene
              payload: {}
              as: ScientificReviewOfficer
              captures:
                err: $.data.error_id
          assert:
            - convene fails with error_id == ERR_SECTION_NOT_CONVENABLE (http 409)
            - StudySection.${sec_id}.status == RECRUITING
      - name: release_before_convene_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.StudySection.MEETING_HELD_to_SCORES_RELEASED
          - errors[ERR_SECTION_NOT_RELEASABLE]
        distinguishing_aspect: 'release-scores from RECRUITING (skipping MEETING_HELD) is an invalid transition: ERR_SECTION_NOT_RELEASABLE, no scores computed.'
        test_recipe:
          setup:
            - one RECRUITING section (never convened)
          setup_api_calls:
            - call: POST /grants/study-sections
              payload:
                name: Early Section
                meeting_date: '2027-03-01T00:00:00Z'
                application_quota: 10
              as: ScientificReviewOfficer
              captures:
                sec_id: $.data.id
          trigger:
            - call: POST /grants/study-sections/${sec_id}/release-scores
              payload: {}
              as: ScientificReviewOfficer
              captures:
                err: $.data.error_id
          assert:
            - release-scores fails with error_id == ERR_SECTION_NOT_RELEASABLE (http 409)
            - StudySection.${sec_id}.status == RECRUITING
      - name: decline_after_decline_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Assignment.ASSIGNED_to_DECLINED
          - errors[ERR_ASSIGNMENT_INVALID_STATE]
        distinguishing_aspect: 'DECLINED is terminal for an assignment: a second respond fails ERR_ASSIGNMENT_INVALID_STATE; reviewer capacity was already released exactly once.'
        test_recipe:
          setup:
            - application UNDER_REVIEW with assignment a_1 DECLINED once already (reviewer count back to 0)
          setup_api_calls:
            - call: POST /grants/institutions
              payload:
                name: State University
              as: ProgramOfficer
              captures:
                inst_id: $.data.id
            - call: POST /grants/institutions
              payload:
                name: Other College
              as: ProgramOfficer
              captures:
                inst2_id: $.data.id
            - call: POST /grants/institutes
              payload:
                name: National Test Institute
                appropriation_cents: 100000000
                reserve_cents: 0
                indirect_cost_rate: 0.5
                select_pay_cap_pct: 0.1
                select_pay_extension_percentile: 5.0
              as: ProgramOfficer
              captures:
                insti_id: $.data.id
            - call: POST /grants/funding-opportunities
              payload:
                pa_number: PA-26-209
                title: R01 Decline FOA
                activity_code: R01
                research_strategy_page_limit: 12
