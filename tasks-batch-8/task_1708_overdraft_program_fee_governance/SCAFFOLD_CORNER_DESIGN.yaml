# =============================================================================
# Task 1708 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Sections follow references/claim-extraction-guide.md. Corners already exercised
# by a §1.8 instance are emitted as excluded_because stubs.
# Standard program config unless overridden: fee 3500, daily cap 10500, count cap 3,
# de_minimis 500, sustained threshold 5, sustained fee 3000, grace 10, notice 30,
# steering 6/90, expiry 30, disclosure "D1". Business dates 2026-08-03..07 (Mon..Fri).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_applies_defaults
        claim_type: creation
        grounds: [entities.OverdraftProgram]
        distinguishing_aspect: "A fully-specified create returns 201 with status ACTIVE, version 1, and all input fields echoed."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-STD", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: HIGH_TO_LOW, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { p_id: "$.data.id", p_status: "$.data.status", p_ver: "$.data.version" } }
          trigger:
            - { call: "GET /v1/programs/${p_id}", as: ProgramAdmin, captures: { g_fee: "$.data.fee_amount_cents", g_status: "$.data.status" } }
          assert:
            - "p_status == ACTIVE AND p_ver == 1"
            - "g_fee == 3500 AND g_status == ACTIVE"
            - "GET response envelope carries meta.api_request_id and response_type 'object'"

      - name: account_create_initializes_computed_fields
        claim_type: computed_fields
        grounds: [entities.DepositAccount.fields.ledger_balance_cents, entities.DepositAccount.fields.status]
        distinguishing_aspect: "Account creation system-initializes status ACTIVE, ledger 0, all counters 0, version 1; client input cannot set them."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-E1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
          trigger:
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "New Holder" }, as: Teller, captures: { a_status: "$.data.status", a_ledger: "$.data.ledger_balance_cents", a_days: "$.data.consecutive_negative_business_days", a_assessed: "$.data.lifetime_fees_assessed_cents", a_waived: "$.data.lifetime_fees_waived_cents", a_co: "$.data.charged_off_cents", a_ver: "$.data.version" } }
          assert:
            - "a_status == ACTIVE AND a_ledger == 0 AND a_days == 0 AND a_assessed == 0 AND a_waived == 0 AND a_co == 0 AND a_ver == 1"

      - name: account_create_missing_required_program_id_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.DepositAccount.fields.program_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required program_id yields 400 ERR_INVALID_REQUEST before any existence or state check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/accounts", payload: { holder_name: "No Program" }, as: Teller, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: program_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.OverdraftProgram.fields.posting_order_policy, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "posting_order_policy outside {HIGH_TO_LOW, CHRONOLOGICAL} is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/programs", payload: { name: "OD-BAD", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: SIDEWAYS, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_fee_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields 404 ERR_NOT_FOUND in the error envelope (response_type 'error', data.error_id)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/fees/11111111-2222-4333-8444-555555555555", as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND and the envelope's response_type is 'error'"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: seal_settled_batch_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PostingBatch, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Seal is only valid from OPEN; sealing a SETTLED batch fails and leaves counters untouched."
        test_recipe:
          setup: ["Program; empty batch 2026-08-03 sealed and settled"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/batches/${b1}", as: ProgramAdmin, captures: { b_status: "$.data.status", b_count: "$.data.fees_assessed_count" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION AND b_status == SETTLED AND b_count == 0"

      - name: settle_open_batch_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PostingBatch.SEALED_to_SETTLED]
        distinguishing_aspect: "Settle requires SEALED; settling an OPEN batch fails."
        test_recipe:
          setup: ["Program; batch 2026-08-03 OPEN"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: double_revoke_election_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.OptInElection.OPTED_IN_to_REVOKED]
        distinguishing_aspect: "Second revoke of an already-REVOKED election fails; election version does not advance."
        test_recipe:
          setup: ["Program; account; election OPTED_IN; one revoke applied"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM3", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H SM3" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}", captures: { el: "$.data.id" } }
            - { call: "POST /v1/opt-in-elections/${el}/revoke", payload: {}, as: AccountHolder, as_user_id: "${acct}" }
          trigger:
            - { call: "POST /v1/opt-in-elections/${el}/revoke", payload: {}, as: AccountHolder, as_user_id: "${acct}", captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/opt-in-elections/${el}", as: ProgramAdmin, captures: { el_status: "$.data.status", el_ver: "$.data.version" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION AND el_status == REVOKED AND el_ver == 2"

      - name: approve_applied_request_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FeeWaiverRequest]
        distinguishing_aspect: "APPLIED is terminal; approving it again fails and the fee stays WAIVED."
        test_recipe:
          setup:
            - "Program; opted-in account; batch 2026-08-03 with debit 2000 from ledger 0 sealed+settled -> fee F1 3500 POSTED"
            - "FULL waiver by Teller auto-applied (3500 <= teller cap) -> request APPLIED, F1 WAIVED"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM4", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H SM4" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}", as: ProgramAdmin, captures: { f1: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acct}", fee_ids: ["${f1}"], kind: FULL, reason_code: BANK_ERROR }, as: Teller, as_user_id: "teller-1", captures: { wr: "$.data.id", wr_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/fee-waiver-requests/${wr}/approve", payload: {}, as: Supervisor, as_user_id: "sup-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/fees/${f1}", as: ProgramAdmin, captures: { f1_status: "$.data.status" } }
          assert:
            - "wr_status == APPLIED"
            - "err == ERR_INVALID_STATE_TRANSITION AND f1_status == WAIVED"

      - name: appeal_denied_final_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FeeWaiverRequest.PENDING_COMPLIANCE_to_DENIED_FINAL]
        distinguishing_aspect: "A compliance-stage denial is DENIED_FINAL; no appeal transition exists from it."
        test_recipe:
          setup:
            - "Program with fee 120000 (caps 1000000/10), opted-in account; batch 2026-08-03 debit 1000 from 0 sealed+settled -> fee 120000 POSTED"
            - "FULL waiver by Teller t-1 -> computed 120000 > MANAGER_CAP 100000 -> PENDING_COMPLIANCE; denied by ComplianceOfficer co-1 -> DENIED_FINAL"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM5", fee_amount_cents: 120000, daily_fee_cap_cents: 1000000, max_daily_fees_count: 10, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H SM5" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}", as: ProgramAdmin, captures: { f1: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acct}", fee_ids: ["${f1}"], kind: FULL, reason_code: HARDSHIP }, as: Teller, as_user_id: "teller-1", captures: { wr: "$.data.id", wr_status: "$.data.status" } }
            - { call: "POST /v1/fee-waiver-requests/${wr}/deny", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { den_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/fee-waiver-requests/${wr}/appeal", payload: {}, as: Teller, as_user_id: "teller-1", captures: { err: "$.data.error_id" } }
          assert:
            - "wr_status == PENDING_COMPLIANCE"
            - "den_status == DENIED_FINAL"
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: withdraw_effective_notice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProgramChangeNotice.ISSUED_to_EFFECTIVE, state_machines.ProgramChangeNotice]
        distinguishing_aspect: "Activation applies new_value to the program (fee 3500 -> 3600, version bumps to 3); withdrawing an EFFECTIVE notice then fails."
        test_recipe:
          setup:
            - "Program (fee 3500, notice_window_days 30); notice FEE_AMOUNT -> '3600' created; clock 2026-08-03T09:00:00Z; notice issued (effective_at 2026-09-02T09:00:00Z)"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM6", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id", pv1: "$.data.version" } }
            - { call: "POST /v1/notices", payload: { program_id: "${prog}", parameter: FEE_AMOUNT, new_value: "3600", expected_program_version: "${pv1}" }, as: ProgramAdmin, captures: { n1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/notices/${n1}/issue", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/notices/${n1}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { n_status: "$.data.status" } }
            - { call: "GET /v1/programs/${prog}", as: ProgramAdmin, captures: { p_fee: "$.data.fee_amount_cents", p_ver: "$.data.version" } }
            - { call: "POST /v1/notices/${n1}/withdraw", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "n_status == EFFECTIVE AND p_fee == 3600 AND p_ver == 3  (create bumped to 2, activate to 3)"
            - "err == ERR_INVALID_STATE_TRANSITION  (EFFECTIVE is terminal)"

      - name: accept_declined_offer_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EducationOffer]
        distinguishing_aspect: "DECLINED is terminal; a later accept fails."
        test_recipe:
          setup: ["Program; account (version 1 captured); manual COUNSELING offer created by Teller with OCC"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM7", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H SM7" }, as: Teller, captures: { acct: "$.data.id", av1: "$.data.version" } }
            - { call: "POST /v1/education-offers", payload: { account_id: "${acct}", offer_type: COUNSELING, expected_account_version: "${av1}" }, as: Teller, captures: { off: "$.data.id", off_status: "$.data.status" } }
            - { call: "POST /v1/education-offers/${off}/decline", payload: {}, as: AccountHolder, as_user_id: "${acct}", captures: { dec_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/education-offers/${off}/accept", payload: {}, as: AccountHolder, as_user_id: "${acct}", captures: { err: "$.data.error_id" } }
          assert:
            - "off_status == OFFERED AND dec_status == DECLINED"
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: close_restricted_account_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DepositAccount.ACTIVE_to_CLOSED_VOLUNTARY, "errors[ERR_CLOSE_NEGATIVE_BALANCE]"]
        distinguishing_aspect: "Close is only valid from ACTIVE; on a RESTRICTED account the state error (priority 7) wins over the negative-balance fiscal check (priority 11)."
        test_recipe:
          setup: ["Program with sustained threshold 1; opted-in account; batch 2026-08-03 debit 5000 from 0 sealed+settled -> RESTRICTED, ledger -11500"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM8", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 1, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H SM8" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 5000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/accounts/${acct}/close", payload: {}, as: Teller, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { a_status: "$.data.status" } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION AND a_status == RESTRICTED"

      - name: seal_assigns_posting_sequence_credits_first
        claim_type: side_effect_execution
        grounds: [state_machines.AccountTransaction.AUTHORIZED_to_POSTED, entities.AccountTransaction.fields.posting_sequence]
        distinguishing_aspect: "Seal assigns per-account 1-based posting_sequence with credits ahead of debits even when authorized later, sets batch_id and posted_date, and bumps items_posted_count."
        test_recipe:
          setup: ["Program CHRONOLOGICAL; account; batch 2026-08-03 OPEN; debit 2000 authorized 09:00, credit 5000 at 09:01, debit 1000 at 09:02"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM9", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H SM9" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}", captures: { t_deb1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: CREDIT_DEPOSIT, amount_cents: 5000 }, as: AccountHolder, as_user_id: "${acct}", captures: { t_cred: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:02:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}", captures: { t_deb2: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk, captures: { posted: "$.data.items_posted_count" } }
            - { call: "GET /v1/transactions/${t_cred}", as: ProgramAdmin, captures: { cred_seq: "$.data.posting_sequence", cred_batch: "$.data.batch_id", cred_pd: "$.data.posted_date", cred_status: "$.data.status" } }
            - { call: "GET /v1/transactions/${t_deb1}", as: ProgramAdmin, captures: { deb1_seq: "$.data.posting_sequence", deb1_status: "$.data.status" } }
            - { call: "GET /v1/transactions/${t_deb2}", as: ProgramAdmin, captures: { deb2_seq: "$.data.posting_sequence" } }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { ledger: "$.data.ledger_balance_cents" } }
          assert:
            - "posted == 3 AND cred_seq == 1 AND deb1_seq == 2 AND deb2_seq == 3  (credits first, then chronological debits)"
            - "cred_batch == ${b1} AND cred_pd == '2026-08-03' AND cred_status == POSTED AND deb1_status == POSTED"
            - "ledger == 2000  (0 + 5000 - 2000 - 1000; the early debit never overdraws because the credit posts first)"

      - name: fee_starts_assessed_until_settle
        claim_type: initial_state
        grounds: [state_machines.OverdraftFee, entities.OverdraftFee.fields.posted_date]
        distinguishing_aspect: "A fee created at seal is ASSESSED with posted_date null; only settle moves it to POSTED with the batch's business date."
        test_recipe:
          setup: ["Program; opted-in account; batch 2026-08-03 with debit 2000 from 0, SEALED"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-SM10", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H SM10" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}", as: ProgramAdmin, captures: { f1: "$.data[0].id", f_status_seal: "$.data[0].status", f_pd_seal: "$.data[0].posted_date" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees/${f1}", as: ProgramAdmin, captures: { f_status_settle: "$.data.status", f_pd_settle: "$.data.posted_date" } }
          assert:
            - "f_status_seal == ASSESSED AND f_pd_seal == null"
            - "f_status_settle == POSTED AND f_pd_settle == '2026-08-03'"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: credits_post_before_debits_despite_later_authorization
        claim_type: correct_result
        grounds: [calculations.posting_order_and_fee_assessment]
        distinguishing_aspect: "A credit authorized AFTER a debit still posts first inside the seal; an account at 0 with a later 5000 credit and an earlier 2000 debit ends at 3000 with zero fees."
        test_recipe:
          setup: ["Program CHRONOLOGICAL; account (ledger 0); batch 2026-08-03 OPEN; debit 2000 authorized 09:00, credit 5000 authorized 09:01"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-CAL1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H CAL1" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}", captures: { t_deb: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: CREDIT_DEPOSIT, amount_cents: 5000 }, as: AccountHolder, as_user_id: "${acct}", captures: { t_cred: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk, captures: { fees: "$.data.fees_assessed_count", returned: "$.data.items_returned_count" } }
            - { call: "GET /v1/transactions/${t_deb}", as: ProgramAdmin, captures: { deb_status: "$.data.status", deb_seq: "$.data.posting_sequence" } }
            - { call: "GET /v1/transactions/${t_cred}", as: ProgramAdmin, captures: { cred_seq: "$.data.posting_sequence" } }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { ledger: "$.data.ledger_balance_cents" } }
          assert:
            - "fees == 0 AND returned == 0  (credit-first ordering: 0 + 5000 - 2000 = 3000, never negative)"
            - "cred_seq == 1 AND deb_seq == 2 AND deb_status == POSTED"
            - "ledger == 3000"

      - name: high_to_low_amount_tie_break_authorized_at
        claim_type: correct_result
        grounds: [calculations.posting_order_and_fee_assessment]
        distinguishing_aspect: "Under HIGH_TO_LOW, equal-amount debits are tie-broken by authorized_at ASC (created_at as final fallback, never id): the 09:00 debit gets sequence 1, the 09:01 debit sequence 2."
        test_recipe:
          setup: ["Program HIGH_TO_LOW; opted-in account (ledger 0); batch 2026-08-03 OPEN; debit 2000 at 09:00, debit 2000 at 09:01"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-CAL2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: HIGH_TO_LOW, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H CAL2" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}", captures: { tA: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}", captures: { tB: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk, captures: { fees: "$.data.fees_assessed_count" } }
            - { call: "GET /v1/transactions/${tA}", as: ProgramAdmin, captures: { seqA: "$.data.posting_sequence" } }
            - { call: "GET /v1/transactions/${tB}", as: ProgramAdmin, captures: { seqB: "$.data.posting_sequence" } }
          assert:
            - "seqA == 1 AND seqB == 2  (amount tie -> authorized_at ASC)"
            - "fees == 2  (-2000 and -4000, both magnitudes > 500)"

      - name: sustained_fee_exempt_from_daily_caps
        claim_type: constants_applied
        grounds: [calculations.sustained_overdraft_day_count, entities.OverdraftFee.fields.fee_type]
        distinguishing_aspect: "The SUSTAINED fee posts even when the day's OVERDRAFT fees already saturated the daily caps (3 fees / 10500): lifetime assessed becomes 13500, and the SUSTAINED fee carries transaction_id null."
        test_recipe:
          setup:
            - "Program: sustained threshold 1, sustained fee 3000, fee 3500, cap 10500, count 3, de_minimis 500, steering 99, disclosure D1"
            - "Opted-in account (ledger 0); batch 2026-08-03: debits 2000, 2000, 2000 at 09:00/09:01/09:02 -> sealed: 3 OVERDRAFT fees (cap-saturating), ledger -6000"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-CAL3", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 1, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 99, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H CAL3" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:02:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk, captures: { fees: "$.data.fees_assessed_count", fee_cents: "$.data.fees_assessed_cents" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}&fee_type=SUSTAINED", as: ProgramAdmin, captures: { sus_amt: "$.data[0].amount_cents", sus_txn: "$.data[0].transaction_id", sus_status: "$.data[0].status" } }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { assessed: "$.data.lifetime_fees_assessed_cents", ledger: "$.data.ledger_balance_cents", status: "$.data.status" } }
          assert:
            - "fees == 3 AND fee_cents == 10500  (daily caps saturated by OVERDRAFT fees alone)"
            - "sus_amt == 3000 AND sus_txn == null AND sus_status == POSTED  (SUSTAINED exempt from caps; not tied to any item)"
            - "assessed == 13500 AND ledger == -12000 AND status == RESTRICTED  (-6000 - 10500 - 3000)"

      - name: steering_offer_at_exact_fee_count_threshold
        claim_type: boundary_edge
        grounds: [calculations.steering_fee_trigger, entities.EducationOffer.fields.trigger_reason]
        distinguishing_aspect: "4 posted fees in the window produce no offer; reaching exactly 6 (>= threshold) at the third settle auto-creates one FEE_THRESHOLD offer."
        test_recipe:
          setup:
            - "Program: standard config (steering 6/90, sustained threshold 5 so no restriction interferes), disclosure D1"
            - "Opted-in account funded to 300 (batch 2026-08-03 credit, sealed+settled)"
            - "Batch 2026-08-04: debits 1000, 500 -> 2 fees, settled (ledger -8200, count 1); batch 2026-08-05: debits 100, 100 -> 2 fees, settled (4 fees total, count 2, no offer yet)"
            - "Batch 2026-08-06: debits 100, 100 sealed (2 more fees), not yet settled"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-CAL4", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H CAL4" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: ONLINE, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b0: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: CREDIT_DEPOSIT, amount_cents: 300 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b0}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b0}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 500 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { b2: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b2}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/education-offers?account_id=${acct}", as: ProgramAdmin }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-06" }, as: OperationsClerk, captures: { b3: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b3}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/batches/${b3}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/education-offers?account_id=${acct}", as: ProgramAdmin, captures: { off_reason: "$.data[0].trigger_reason", off_status: "$.data[0].status", off_type: "$.data[0].offer_type" } }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { status: "$.data.status", days: "$.data.consecutive_negative_business_days" } }
          assert:
            - "The offers list after the 2026-08-05 settle (4 fees in window) is empty  (4 < 6)"
            - "off_reason == FEE_THRESHOLD AND off_status == OFFERED AND off_type == OVERDRAFT_LINE_OF_CREDIT  (exactly 6 >= 6 after the third settle)"
            - "status == ACTIVE AND days == 3  (threshold 5 not reached; FEE_THRESHOLD path only)"

      - name: report_metrics_scrutiny_flag_true
        claim_type: correct_result
        grounds: [calculations.report_revenue_metrics, entities.RegulatoryReport.fields.scrutiny_flag]
        distinguishing_aspect: "With 4 POSTED fees of 3500 (14000) and 3000 waived, waiver_ratio_bps = floor(3000*10000/14000) = 2142 > 1500 -> scrutiny_flag true; avg_fees_per_overdrafter_centi = 400."
        test_recipe:
