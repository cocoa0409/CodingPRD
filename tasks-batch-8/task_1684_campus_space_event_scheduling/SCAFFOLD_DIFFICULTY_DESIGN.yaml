scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Invoice vs Room)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_includes_quoted_but_final_excludes
        grounds:
          - calculations.final_invoice_total
          - entities.Invoice.fields.service_charge_cents
          - state_machines.EventReservation.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Invoice (fiscal) domain dual variant: for identical event data the PROVISIONAL variant counts a
          QUOTED-never-approved catering order (provisional total 16000) while the FINAL variant counts
          FULFILLED/INVOICED orders only (final total 10000) — same inputs, totals differ by exactly 6000.
        test_recipe:
          setup:
            - "INTERNAL org; room internal rate 5000/h; event 2026-09-10 14:00-16:00 Thursday -> 2 off-peak buckets -> room_charge 10000"
            - "One CATERING order qty 2 quoted at 3000/unit (quoted_total 6000) and never approved; event checked in and completed"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Math", org_type: "INTERNAL_DEPARTMENT", contact_email: "math@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "MTH-101", building_code: "MTH", capacity: 50, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Colloquium", expected_attendance: 20, start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "CATERING", quantity: 2, service_start_at: "2026-09-10T14:00:00Z", service_end_at: "2026-09-10T15:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 3000 }, as: ServiceCoordinator }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id", prov_total: "$.data[0].total_cents", prov_service: "$.data[0].service_charge_cents" } }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T13:45:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/check-in", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T17:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
          assert:
            - "captured ${prov_service} == 6000 and ${prov_total} == 16000 (PROVISIONAL counted the QUOTED order)"
            - "Invoice.${inv_id}.status == FINALIZED"
            - "Invoice.${inv_id}.service_charge_cents == 0 (FINAL excludes the never-fulfilled QUOTED order)"
            - "Invoice.${inv_id}.room_charge_cents == 10000 and Invoice.${inv_id}.insurance_surcharge_cents == 0 (INTERNAL)"
            - "Invoice.${inv_id}.total_cents == 10000"
            - "ServiceOrder.${so_id}.status == CANCELLED and fee_waived == true"
            - "EventReservation.${ev_id}.status == COMPLETED"

      - name: utilization_scheduled_counts_approved_but_realized_excludes
        grounds:
          - calculations.utilization_bps
          - "endpoints[GET /campus/rooms/{id}/utilization]"
        distinguishing_aspect: |
          Room-analytics domain dual variant (distinct from the Invoice domain instance): for the same room
          and window, scheduled_utilization_bps counts an APPROVED-not-yet-completed event (210 booked
          minutes -> 1458 bps) while realized_utilization_bps counts COMPLETED only (-> 0 bps) before
          completion and 1458 after — the variants diverge and later converge on the same data.
        test_recipe:
          setup:
            - "INTERNAL org; event 2026-09-10 16:00-18:30 with setup 30 / teardown 30 -> booked interval 15:30-19:00 = 210 minutes; utilization window is the full UTC day (1440 minutes)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Physics", org_type: "INTERNAL_DEPARTMENT", contact_email: "phys@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "PHY-201", building_code: "PHY", capacity: 80, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Seminar", expected_attendance: 40, start_at: "2026-09-10T16:00:00Z", end_at: "2026-09-10T18:30:00Z", setup_minutes: 30, teardown_minutes: 30, expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
          trigger:
            - { call: "GET /campus/rooms/${room_id}/utilization", payload: { window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z" }, as: Scheduler, captures: { sched_bps: $.data.scheduled_utilization_bps, real_bps: $.data.realized_utilization_bps, sched_min: $.data.scheduled_minutes } }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T15:45:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/check-in", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T20:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}/utilization", payload: { window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z" }, as: Scheduler, captures: { real_bps_after: $.data.realized_utilization_bps } }
          assert:
            - "${sched_bps} == 1458 and ${sched_min} == 210 (APPROVED event counted in scheduled variant)"
            - "${real_bps} == 0 (nothing COMPLETED yet)"
            - "window_minutes == 1440 and outage_minutes == 0 on both reads"
            - "after completion: ${real_bps_after} == 1458 (variants converge once the event is COMPLETED)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: room_charge_per_bucket_rounding_order
        grounds:
          - calculations.room_charge_cents
          - entities.EventReservation.fields.pinned_hourly_rate_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-bucket-then-sum; with rate 9999 and three
          peak buckets the pinned order yields 37497 peak cents while the forbidden sum-then-round order
          yields 37496 — a provable 1-cent divergence, observable as room_charge_cents == 47496.
        test_recipe:
          setup:
            - "EXTERNAL org; room external rate 9999/h, peak multiplier 12500 bps; event 2026-09-10 (Thursday) 17:30-20:30, no setup/teardown"
            - "Billable 17:30-20:30 touches clock-hour buckets 17 (off-peak 9999), 18, 19, 20 (peak 12499 each after per-bucket round_half_up)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Alumni Assoc", org_type: "EXTERNAL", contact_email: "alum@ext.org", insurance_certificate_expiry: "2026-12-31T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "GYM-A", building_code: "GYM", capacity: 300, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 9999 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Reception", expected_attendance: 250, start_at: "2026-09-10T17:30:00Z", end_at: "2026-09-10T20:30:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
          trigger:
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { room_chg: "$.data[0].room_charge_cents", surcharge: "$.data[0].insurance_surcharge_cents", total: "$.data[0].total_cents" } }
          assert:
            - "${room_chg} == 47496 (9999 + 12499 + 12499 + 12499; per-bucket rounding pinned — sum-then-round would give 47495)"
            - "${surcharge} == 950 (round_half_up(0.02 * 47496) computed over already-rounded lines)"
            - "${total} == 48446"

      - name: priority_score_multiinput_conditional_bonus
        grounds:
          - calculations.priority_score
          - entities.AcademicBlock.fields.priority_score
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: score combines enrollment*10, per-feature
          weights, and a conditional large-class bonus applied only at enrollment >= 100 — block B1
          (180, STAGE) scores 1940, B2 (95, PROJECTOR+VIDEO_CONF) scores 980, B3 (exactly 100, no
          features) scores 1100, proving the >= boundary and the additive feature terms.
        test_recipe:
          setup:
            - "Term Fall 2026 in DRAFT; three blocks created with distinct enrollments and feature sets"
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "CHEM-401", instructor_name: "Dr. A", enrollment: 180, days_of_week: ["MON", "WED", "FRI"], start_time: "09:00", end_time: "09:50", required_features: ["STAGE"] }, as: Scheduler, captures: { b1_id: $.data.id, b1_score: $.data.priority_score } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "ART-110", instructor_name: "Dr. B", enrollment: 95, days_of_week: ["TUE", "THU"], start_time: "11:00", end_time: "12:15", required_features: ["PROJECTOR", "VIDEO_CONF"] }, as: Scheduler, captures: { b2_id: $.data.id, b2_score: $.data.priority_score } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "MTH-201", instructor_name: "Dr. C", enrollment: 100, days_of_week: ["MON"], start_time: "13:00", end_time: "14:15", required_features: [] }, as: Scheduler, captures: { b3_id: $.data.id, b3_score: $.data.priority_score } }
          trigger:
            - { call: "GET /campus/academic-blocks/${b1_id}", payload: {}, as: Scheduler }
          assert:
            - "${b1_score} == 1940 (180*10 + 40 STAGE + 100 large-class bonus)"
            - "${b2_score} == 980 (95*10 + 10 PROJECTOR + 20 VIDEO_CONF; 95 < 100 so no bonus)"
            - "${b3_score} == 1100 (100*10 + 0 features + 100 bonus at the >= 100 boundary)"

      - name: placement_evaluation_order_score_then_assign_then_bump
        grounds:
          - calculations.scheduling_placement
          - state_machines.SchedulingRun.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: scores are computed from request data BEFORE any assignment,
          blocks are processed in (score DESC, enrollment DESC, created_at ASC), and bumping is a fallback
          only when no free feasible room exists — the higher-scored 180-enrollment block wins the single
          STAGE room by bumping a REQUESTED event, while the 140-enrollment block goes UNPLACED.
        test_recipe:
          setup:
            - "Term advanced to SCHEDULING (priority window); single room RC capacity 200 with STAGE; REQUESTED event occupies RC on Monday 2026-10-05 09:30-11:30 (occupancy with 30m buffer until 12:00)"
            - "Block BX enrollment 180 STAGE (score 1940) and BY enrollment 140 STAGE (score 1540), both MON 10:00-11:00 — only one can be placed"
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "BIO-500", instructor_name: "Dr. X", enrollment: 180, days_of_week: ["MON"], start_time: "10:00", end_time: "11:00", required_features: ["STAGE"] }, as: Scheduler, captures: { bx_id: $.data.id } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "BIO-501", instructor_name: "Dr. Y", enrollment: 140, days_of_week: ["MON"], start_time: "10:00", end_time: "11:00", required_features: ["STAGE"] }, as: Scheduler, captures: { by_id: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Dept Chem", org_type: "INTERNAL_DEPARTMENT", contact_email: "chem@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "HALL-C", building_code: "HLL", capacity: 200, features: ["STAGE"], internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { rc_id: $.data.id, rc_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${rc_id}", title: "Seminar", expected_attendance: 100, start_at: "2026-10-05T09:30:00Z", end_at: "2026-10-05T11:30:00Z", expected_room_version: "${rc_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v}" }, as: Scheduler, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /campus/scheduling-runs/${run_id}/finalize", payload: {}, as: Scheduler, captures: { placed: $.data.placed_count, bumped: $.data.bumped_event_ids, unplaced: $.data.unplaced_block_ids } }
          assert:
            - "${placed} == 1 and ${unplaced} == [${by_id}] (BX processed first on score 1940 > 1540 and takes the only STAGE room)"
            - "${bumped} == [${ev_id}] (bump is the fallback path: no free STAGE room, the REQUESTED event is bumpable)"
            - "AcademicBlock.${bx_id}.status == PLACED and assigned_room_id == ${rc_id}"
            - "EventReservation.${ev_id}.status == BUMPED and room_id == null"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (EventReservation cycle, ServiceOrder loop)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_confirmed_bumped_rebooked_confirmed_cycle
        grounds:
          - state_machines.EventReservation.CONFIRMED_to_BUMPED
          - state_machines.EventReservation.BUMPED_to_APPROVED
          - state_machines.EventReservation.APPROVED_to_CONFIRMED
        distinguishing_aspect: |
          EventReservation machine is cyclic: CONFIRMED -> BUMPED (shield-safe academic bump) -> APPROVED
          (rebook into room RE with freshly re-pinned rates) -> CONFIRMED again — the entity traverses
          APPROVED/CONFIRMED twice in one lifetime with two different invoices.
        test_recipe:
          setup:
            - "Term SCHEDULING at clock 2026-08-12; room RD cap 100 STAGE (internal 5000), room RE cap 120 no features (internal 4000); INTERNAL org"
            - "Event 2026-10-05 (Mon) 10:00-12:00 in RD, CONFIRMED well over 72h ahead (bumpable); block enrollment 90 STAGE MON 10:30-11:30 can only fit RD"
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Dept Hist", org_type: "INTERNAL_DEPARTMENT", contact_email: "hist@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "HALL-D", building_code: "HLL", capacity: 100, features: ["STAGE"], internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { rd_id: $.data.id, rd_v: $.data.version } }
            - { call: "POST /campus/rooms", payload: { name: "HALL-E", building_code: "HLL", capacity: 120, internal_hourly_rate_cents: 4000, student_hourly_rate_cents: 2000, external_hourly_rate_cents: 9000 }, as: FacilitiesManager, captures: { re_id: $.data.id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${rd_id}", title: "Lecture", expected_attendance: 80, start_at: "2026-10-05T10:00:00Z", end_at: "2026-10-05T12:00:00Z", expected_room_version: "${rd_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv1_id: "$.data[0].id" } }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "ENG-300", instructor_name: "Dr. Z", enrollment: 90, days_of_week: ["MON"], start_time: "10:30", end_time: "11:30", required_features: ["STAGE"] }, as: Scheduler, captures: { blk_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v}" }, as: Scheduler, captures: { run_id: $.data.id } }
            - { call: "POST /campus/scheduling-runs/${run_id}/finalize", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/rebook", payload: { room_id: "${re_id}" }, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}", status: "PROVISIONAL" }, as: FinanceAdmin, captures: { inv2_id: "$.data[0].id", inv2_total: "$.data[0].total_cents" } }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          assert:
            - "after finalize: EventReservation.${ev_id}.status was BUMPED and Invoice.${inv1_id}.status == VOIDED"
            - "after rebook: status APPROVED, room_id == ${re_id}, new invoice ${inv2_id} != ${inv1_id}"
            - "${inv2_total} == 8000 (re-pinned at RE internal 4000: 2 off-peak buckets, no surcharge)"
            - "final: EventReservation.${ev_id}.status == CONFIRMED (cycle completed)"

      - name: service_order_quote_revision_loop
        grounds:
          - state_machines.ServiceOrder.QUOTED_to_NEEDS_REVISION
          - state_machines.ServiceOrder.NEEDS_REVISION_to_QUOTED
          - entities.ServiceOrder.fields.quoted_total_cents
        distinguishing_aspect: |
          ServiceOrder machine has a revision loop (QUOTED -> NEEDS_REVISION -> QUOTED), and the loop is
          observable on the parent Invoice: service_charge goes 6000 -> 0 (NEEDS_REVISION excluded) -> 4500,
          so invoice totals track 16000 -> 10000 -> 14500 across the cycle.
        test_recipe:
          setup:
            - "INTERNAL org; event 2026-09-11 (Friday) 10:00-12:00, 2 off-peak buckets at 5000 -> room 10000; AV order qty 2"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Film Club", org_type: "INTERNAL_DEPARTMENT", contact_email: "film@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "AUD-1", building_code: "AUD", capacity: 60, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Screening", expected_attendance: 50, start_at: "2026-09-11T10:00:00Z", end_at: "2026-09-11T12:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "AV", quantity: 2, service_start_at: "2026-09-11T09:30:00Z", service_end_at: "2026-09-11T12:30:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
          trigger:
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 3000 }, as: ServiceCoordinator }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { tot_q1: "$.data[0].total_cents" } }
            - { call: "POST /campus/service-orders/${so_id}/request-revision", payload: { note: "too pricey" }, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { tot_rev: "$.data[0].total_cents" } }
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 2250 }, as: ServiceCoordinator }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { tot_q2: "$.data[0].total_cents" } }
            - { call: "POST /campus/service-orders/${so_id}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          assert:
            - "${tot_q1} == 16000 (10000 + 6000 first quote)"
            - "${tot_rev} == 10000 (NEEDS_REVISION excludes the order from the provisional rollup)"
            - "${tot_q2} == 14500 (re-quote 2 * 2250 = 4500 re-enters the rollup)"
            - "ServiceOrder.${so_id}.status == APPROVED and quoted_total_cents == 4500 and revision_note == null after re-quote"

  # =========================================================================
  # Rule 4 — transitive_cascade (finalize chain depth 4; daily-close chain depth 4)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_bump_chain_run_block_event_invoice_org
        grounds:
          - state_machines.SchedulingRun.DRAFT_to_FINALIZED
          - state_machines.AcademicBlock.UNPLACED_to_PLACED
          - state_machines.EventReservation.CONFIRMED_to_BUMPED
          - state_machines.Invoice.PROVISIONAL_to_VOIDED
          - entities.Organization.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-4 chain from the finalize trigger: run finalize -> block PLACED into room RF -> the
          conflicting CONFIRMED event is BUMPED (caused by the placement) -> its PROVISIONAL invoice is
          VOIDED (caused by the bump) -> org outstanding_balance_cents drops 16000 -> 0 (caused by the
          void); a parallel hop cancels the SCHEDULED-path service order (fee_waived) and revokes the
          REQUESTED access grant.
        test_recipe:
          setup:
            - "Term SCHEDULING at clock 2026-08-12; room RF cap 100 STAGE internal 5000 key_count 1; INTERNAL org"
            - "Event 2026-10-05 (Mon) 10:00-12:00 CONFIRMED (bumpable: >72h away, no issued grants); CATERING order quoted 6000; REQUESTED key grant; provisional invoice total 16000 (outstanding 16000)"
            - "Block enrollment 80 STAGE MON 10:30-11:30; RF is its only feasible room"
          setup_api_calls:
            - { call: "POST /campus/terms", payload: { name: "Fall 2026", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-12-15T00:00:00Z", priority_open_at: "2026-08-10T00:00:00Z", general_open_at: "2026-09-01T00:00:00Z" }, as: Scheduler, captures: { term_id: $.data.id } }
            - { call: "POST /campus/organizations", payload: { name: "Dept Bio", org_type: "INTERNAL_DEPARTMENT", contact_email: "bio@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "HALL-F", building_code: "HLL", capacity: 100, features: ["STAGE"], key_count: 1, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Symposium", expected_attendance: 90, start_at: "2026-10-05T10:00:00Z", end_at: "2026-10-05T12:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "CATERING", quantity: 2, service_start_at: "2026-10-05T10:00:00Z", service_end_at: "2026-10-05T12:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 3000 }, as: ServiceCoordinator }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "PHYSICAL_KEY" }, as: OrgRequester, as_user_id: "${org_id}", captures: { grant_id: $.data.id } }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id", prov_total: "$.data[0].total_cents" } }
            - { call: "GET /campus/organizations/${org_id}", payload: {}, as: Scheduler, captures: { out_before: $.data.outstanding_balance_cents } }
            - { call: "POST /campus/academic-blocks", payload: { term_id: "${term_id}", course_code: "GEO-210", instructor_name: "Dr. G", enrollment: 80, days_of_week: ["MON"], start_time: "10:30", end_time: "11:30", required_features: ["STAGE"] }, as: Scheduler, captures: { blk_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "GET /campus/terms/${term_id}", payload: {}, as: Scheduler, captures: { term_v: $.data.version } }
            - { call: "POST /campus/scheduling-runs", payload: { term_id: "${term_id}", expected_term_version: "${term_v}" }, as: Scheduler, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /campus/scheduling-runs/${run_id}/finalize", payload: {}, as: Scheduler }
          assert:
            - "${prov_total} == 16000 and ${out_before} == 16000 (provisional room 10000 + quoted catering 6000)"
            - "AcademicBlock.${blk_id}.status == PLACED and assigned_room_id == ${room_id}"
            - "EventReservation.${ev_id}.status == BUMPED and room_id == null"
            - "Invoice.${inv_id}.status == VOIDED (bump waiver)"
            - "ServiceOrder.${so_id}.status == CANCELLED and fee_waived == true"
            - "AccessGrant.${grant_id}.status == REVOKED"
            - "Organization.${org_id}.outstanding_balance_cents == 0 (ledger sync at end of chain)"

      - name: daily_close_noshow_strike_standing_suspension_decline
        grounds:
          - state_machines.EventReservation.CONFIRMED_to_NO_SHOW
          - state_machines.Organization.PROBATION_to_SUSPENDED
          - entities.Organization.fields.no_show_count
          - calculations.standing_threshold
        distinguishing_aspect: |
          Depth-4 chain from the daily-close trigger (different trigger than finalize): close marks the
          third CONFIRMED event NO_SHOW -> org no_show_count becomes 3 -> standing crosses to SUSPENDED
          -> the org's still-REQUESTED fourth event is auto-DECLINED with decline_reason ORG_SUSPENDED;
          each hop is caused by the previous hop's mutation.
        test_recipe:
          setup:
            - "INTERNAL org with three CONFIRMED never-checked-in events on 2026-09-10/11/12 14:00-15:00 (same room, different days)"
            - "A fourth event EV-Y created REQUESTED at 2026-09-12T15:00Z for 2026-09-20 (decision_deadline 2026-09-15, so it survives step 3 of the close)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Debate Union", org_type: "INTERNAL_DEPARTMENT", contact_email: "debate@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "CLA-10", building_code: "CLA", capacity: 40, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v0: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "N1", expected_attendance: 10, start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T15:00:00Z", expected_room_version: "${room_v0}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v1: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "N2", expected_attendance: 10, start_at: "2026-09-11T14:00:00Z", end_at: "2026-09-11T15:00:00Z", expected_room_version: "${room_v1}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "N3", expected_attendance: 10, start_at: "2026-09-12T14:00:00Z", end_at: "2026-09-12T15:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e3: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e3}/approve", payload: {}, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e1}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/event-reservations/${e2}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/event-reservations/${e3}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T15:00:00Z" }, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v3: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Future meet", expected_attendance: 10, start_at: "2026-09-20T14:00:00Z", end_at: "2026-09-20T15:00:00Z", expected_room_version: "${room_v3}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ey_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T16:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler, captures: { no_shows: $.data.no_shows_marked, suspended: $.data.orgs_suspended } }
          assert:
            - "${no_shows} == 3 and ${suspended} == 1"
            - "EventReservation.${e1}/${e2}/${e3}.status == NO_SHOW"
            - "Organization.${org_id}.no_show_count == 3 and standing == SUSPENDED"
            - "EventReservation.${ey_id}.status == DECLINED and decline_reason == ORG_SUSPENDED (cascade terminal hop)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_voided_invoice_state_beats_overpayment_fiscal
        grounds:
          - "validations[priority=6]"
          - "validations[priority=10]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_OVERPAYMENT]"
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: paying a VOIDED invoice with an amount that also exceeds the
          balance must surface ERR_INVALID_STATE (priority 6), never ERR_OVERPAYMENT (priority 10).
        test_recipe:
          setup:
            - "INTERNAL org event approved then ADMIN-cancelled (fee 0) -> invoice VOIDED with total 10000"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Geol", org_type: "INTERNAL_DEPARTMENT", contact_email: "geo@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "GEO-5", building_code: "GEO", capacity: 30, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Talk", expected_attendance: 15, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /campus/invoices/${inv_id}/pay", payload: { amount_cents: 999999 }, as: FinanceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (VOIDED is terminal; the state check at priority 6 preempts the fiscal overpayment check at priority 10)"
            - "Invoice.${inv_id}.paid_cents == 0 and status == VOIDED"

      - name: confirm_external_insurance_safety_beats_expired_window_temporal
        grounds:
          - "validations[priority=7]"
          - "validations[priority=8]"
          - "errors[ERR_INSURANCE_INVALID]"
          - "errors[ERR_CONFIRM_WINDOW_EXPIRED]"
        distinguishing_aspect: |
          Pair business_safety-vs-business_temporal (a different category pair than state-vs-fiscal): an
          EXTERNAL confirm attempted with invalid insurance AND an already-expired confirm window must
          surface ERR_INSURANCE_INVALID (priority 7), not ERR_CONFIRM_WINDOW_EXPIRED (priority 8).
        test_recipe:
          setup:
            - "EXTERNAL org whose insurance expires 2026-08-20 (event ends 2026-09-10 -> invalid); approved at clock 2026-08-01 -> confirm_deadline 2026-08-03; clock advanced to 2026-08-04 (window expired too)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "City Choir", org_type: "EXTERNAL", contact_email: "choir@ext.org", insurance_certificate_expiry: "2026-08-20T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "AUD-9", building_code: "AUD", capacity: 100, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Concert", expected_attendance: 80, start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INSURANCE_INVALID (safety check at priority 7 preempts the temporal check at priority 8)"
            - "EventReservation.${ev_id}.status == APPROVED (unchanged)"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cancel_notice_exactly_72h_free_exactly_24h_half
        grounds:
          - calculations.cancellation_fee
          - "endpoints[POST /campus/event-reservations/{id}/cancel]"
        distinguishing_aspect: |
          Metric = notice duration (hours) on the cancel endpoint: at exactly 72h notice the fee is 0 and
          the invoice is VOIDED (>= is inclusive at the free tier); at exactly 24h notice the 50% tier
          applies (fee 5000 on a 10000 base) — the two >= boundaries land in different tiers.
        test_recipe:
          setup:
            - "INTERNAL org; two approved events: E72 on 2026-09-14 (Mon) 14:00-16:00 and E24 on 2026-09-15 14:00-16:00; room internal 5000 -> each provisional base 10000, no service orders"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Phil", org_type: "INTERNAL_DEPARTMENT", contact_email: "phil@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "PHI-7", building_code: "PHI", capacity: 30, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E72", expected_attendance: 10, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e72: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E24", expected_attendance: 10, start_at: "2026-09-15T14:00:00Z", end_at: "2026-09-15T16:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e24: $.data.id } }
            - { call: "POST /campus/event-reservations/${e72}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e24}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${e24}" }, as: FinanceAdmin, captures: { inv24: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T14:00:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${e72}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { fee72: $.data.cancellation_fee_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T14:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e24}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { fee24: $.data.cancellation_fee_cents } }
          assert:
            - "${fee72} == 0 (notice exactly 72h is in the free tier; >= is inclusive) and E72's invoice is VOIDED"
            - "${fee24} == 5000 (notice exactly 24h lands in the 50% tier over base 10000)"
            - "Invoice.${inv24}.status == FINALIZED and total_cents == 5000"

      - name: crew_schedule_at_exactly_concurrent_capacity
        grounds:
          - calculations.crew_load_overlap
          - "errors[ERR_CREW_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          Metric = overlapping SCHEDULED order count on the schedule endpoint (distinct from notice-hours):
          with concurrent_capacity 2, the second overlapping assignment (load 1 < 2) succeeds and the third
          (load 2 == capacity) is rejected — the boundary is load < capacity, strict.
        test_recipe:
          setup:
            - "INTERNAL org; three rooms; three approved events on 2026-09-16 14:00-15:00 each with an APPROVED AV order over service window 13:00-14:00; one AV crew capacity 2 shift 08:00-20:00"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "AV Users", org_type: "INTERNAL_DEPARTMENT", contact_email: "av@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "AV-1", building_code: "AVB", capacity: 20, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /campus/rooms", payload: { name: "AV-2", building_code: "AVB", capacity: 20, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { r2: $.data.id, r2_v: $.data.version } }
            - { call: "POST /campus/rooms", payload: { name: "AV-3", building_code: "AVB", capacity: 20, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { r3: $.data.id, r3_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${r1}", title: "S1", expected_attendance: 10, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${r1_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${r2}", title: "S2", expected_attendance: 10, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${r2_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${r3}", title: "S3", expected_attendance: 10, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${r3_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e3: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e3}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/service-orders", payload: { event_id: "${e1}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:00:00Z", service_end_at: "2026-09-16T14:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so1: $.data.id } }
            - { call: "POST /campus/service-orders", payload: { event_id: "${e2}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:00:00Z", service_end_at: "2026-09-16T14:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so2: $.data.id } }
            - { call: "POST /campus/service-orders", payload: { event_id: "${e3}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:00:00Z", service_end_at: "2026-09-16T14:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so3: $.data.id } }
            - { call: "POST /campus/service-orders/${so1}/quote", payload: { unit_cost_cents: 1000 }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${so2}/quote", payload: { unit_cost_cents: 1000 }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${so3}/quote", payload: { unit_cost_cents: 1000 }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${so1}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-orders/${so2}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-orders/${so3}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-crews", payload: { name: "AV Team Alpha", category: "AV", concurrent_capacity: 2, shift_start: "08:00", shift_end: "20:00" }, as: ServiceCoordinator, captures: { crew_id: $.data.id } }
          trigger:
            - { call: "POST /campus/service-orders/${so1}/schedule", payload: { crew_id: "${crew_id}" }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${so2}/schedule", payload: { crew_id: "${crew_id}" }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${so3}/schedule", payload: { crew_id: "${crew_id}" }, as: ServiceCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "ServiceOrder.${so1}.status == SCHEDULED and ServiceOrder.${so2}.status == SCHEDULED (load 1 < capacity 2 allowed)"
            - "${err} == ERR_CREW_CAPACITY_EXCEEDED (load 2 == capacity rejected; boundary is strict <)"
            - "ServiceOrder.${so3}.status == APPROVED and crew_id == null"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: service_order_lifecycle_gated_by_event_state
        grounds:
          - state_machines.ServiceOrder.REQUESTED_to_QUOTED
          - "endpoints[POST /campus/service-orders]"
        distinguishing_aspect: |
          Pair ServiceOrder x EventReservation: attaching or quoting a service order requires the parent
          event in APPROVED or CONFIRMED — creation against a REQUESTED event fails ERR_INVALID_STATE,
          succeeds after the event's approve transition, and the quote then proceeds.
        test_recipe:
          setup:
            - "INTERNAL org; room; event in REQUESTED (not yet approved)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Soc", org_type: "INTERNAL_DEPARTMENT", contact_email: "soc@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "SOC-3", building_code: "SOC", capacity: 25, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Panel", expected_attendance: 20, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:30:00Z", service_end_at: "2026-09-16T15:30:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:30:00Z", service_end_at: "2026-09-16T15:30:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
            - { call: "POST /campus/service-orders/${so_id}/quote", payload: { unit_cost_cents: 1500 }, as: ServiceCoordinator }
          assert:
            - "${err} == ERR_INVALID_STATE (event was REQUESTED; order attach gated on event state)"
            - "after approve: ServiceOrder.${so_id} created REQUESTED, then QUOTED with quoted_total_cents == 1500"

      - name: event_confirm_gated_by_org_insurance
        grounds:
          - state_machines.EventReservation.APPROVED_to_CONFIRMED
          - entities.Organization.fields.insurance_certificate_expiry
          - "errors[ERR_INSURANCE_INVALID]"
        distinguishing_aspect: |
          Pair EventReservation x Organization (a different pair than ServiceOrder x EventReservation):
          an EXTERNAL event's confirm transition reads the ORG's insurance fields — invalid insurance
          blocks with ERR_INSURANCE_INVALID, and PATCHing the org's insurance valid flips the same
          transition to success with no change to the event itself.
        test_recipe:
          setup:
            - "EXTERNAL org created without insurance; event approved (confirm window open until 2026-08-03 at default clock)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Garden Club", org_type: "EXTERNAL", contact_email: "garden@ext.org" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "QUAD-1", building_code: "QUAD", capacity: 500, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Plant Sale", expected_attendance: 300, start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
            - { call: "PATCH /campus/organizations/${org_id}", payload: { insurance_certificate_expiry: "2026-12-31T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          assert:
            - "${err} == ERR_INSURANCE_INVALID (expiry missing -> invalid through end_at)"
            - "after PATCH: EventReservation.${ev_id}.status == CONFIRMED"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics/resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_conflict_buffered_halfopen_adjacency
        grounds:
          - calculations.occupied_interval
          - "errors[ERR_ROOM_NOT_AVAILABLE]"
        distinguishing_aspect: |
          Room resource semantics = exclusive occupancy with an ASYMMETRIC post-event buffer: E1
          10:00-11:00 blocks the room until 11:30 (buffer 30); E2 starting exactly 11:30 is allowed
          (half-open adjacency at the buffered edge), while E3 starting 11:29 collides — one minute
          decides, and the buffer (not just the event interval) defines the edge.
        test_recipe:
          setup:
            - "INTERNAL org; room buffer default 30; E1 approved 2026-09-16 10:00-11:00 (occupancy 10:00-11:30)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Econ", org_type: "INTERNAL_DEPARTMENT", contact_email: "econ@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "ECO-1", building_code: "ECO", capacity: 40, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E1", expected_attendance: 10, start_at: "2026-09-16T10:00:00Z", end_at: "2026-09-16T11:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
          trigger:
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E2", expected_attendance: 10, start_at: "2026-09-16T11:30:00Z", end_at: "2026-09-16T12:30:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v3: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E3", expected_attendance: 10, start_at: "2026-09-16T11:29:00Z", end_at: "2026-09-16T12:00:00Z", expected_room_version: "${room_v3}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
          assert:
            - "EventReservation.${e2}.status == APPROVED (11:30 start is exactly E1's buffered occupancy end; half-open => no conflict)"
            - "${err} == ERR_ROOM_NOT_AVAILABLE (11:29 start collides with the 30-minute post-buffer of E1)"
            - "no EventReservation created for E3 (list for room shows exactly 2 events)"

      - name: crew_overlap_aggregate_capacity_no_buffer
        grounds:
          - calculations.crew_load_overlap
          - entities.ServiceCrew.fields.concurrent_capacity
        distinguishing_aspect: |
          ServiceCrew resource semantics differ from Room: aggregate capacity (N parallel assignments) over
          half-open service windows with NO buffer — a capacity-1 crew accepts an adjacent order
          (14:00 start after a 13:00-14:00 order) yet rejects a partially overlapping 13:30-14:30 order,
          while a room with buffer would have rejected the adjacency.
        test_recipe:
          setup:
            - "INTERNAL org; three rooms with approved events 2026-09-16; three APPROVED AV orders with windows A 13:00-14:00, B 14:00-15:00, C 13:30-14:30; one AV crew capacity 1 shift 08:00-20:00"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Events Office", org_type: "INTERNAL_DEPARTMENT", contact_email: "events@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "EV-1", building_code: "EVB", capacity: 20, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /campus/rooms", payload: { name: "EV-2", building_code: "EVB", capacity: 20, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { r2: $.data.id, r2_v: $.data.version } }
            - { call: "POST /campus/rooms", payload: { name: "EV-3", building_code: "EVB", capacity: 20, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { r3: $.data.id, r3_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${r1}", title: "A", expected_attendance: 10, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${r1_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ea: $.data.id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${r2}", title: "B", expected_attendance: 10, start_at: "2026-09-16T15:00:00Z", end_at: "2026-09-16T16:00:00Z", expected_room_version: "${r2_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { eb: $.data.id } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${r3}", title: "C", expected_attendance: 10, start_at: "2026-09-16T14:30:00Z", end_at: "2026-09-16T15:30:00Z", expected_room_version: "${r3_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ec: $.data.id } }
            - { call: "POST /campus/event-reservations/${ea}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${eb}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ec}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ea}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:00:00Z", service_end_at: "2026-09-16T14:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { soa: $.data.id } }
            - { call: "POST /campus/service-orders", payload: { event_id: "${eb}", category: "AV", quantity: 1, service_start_at: "2026-09-16T14:00:00Z", service_end_at: "2026-09-16T15:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { sob: $.data.id } }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ec}", category: "AV", quantity: 1, service_start_at: "2026-09-16T13:30:00Z", service_end_at: "2026-09-16T14:30:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { soc: $.data.id } }
            - { call: "POST /campus/service-orders/${soa}/quote", payload: { unit_cost_cents: 1000 }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${sob}/quote", payload: { unit_cost_cents: 1000 }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${soc}/quote", payload: { unit_cost_cents: 1000 }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${soa}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-orders/${sob}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-orders/${soc}/approve", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/service-crews", payload: { name: "AV Solo", category: "AV", concurrent_capacity: 1, shift_start: "08:00", shift_end: "20:00" }, as: ServiceCoordinator, captures: { crew_id: $.data.id } }
            - { call: "POST /campus/service-orders/${soa}/schedule", payload: { crew_id: "${crew_id}" }, as: ServiceCoordinator }
          trigger:
            - { call: "POST /campus/service-orders/${sob}/schedule", payload: { crew_id: "${crew_id}" }, as: ServiceCoordinator }
            - { call: "POST /campus/service-orders/${soc}/schedule", payload: { crew_id: "${crew_id}" }, as: ServiceCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "ServiceOrder.${sob}.status == SCHEDULED (14:00 start touches 14:00 end — half-open adjacency, NOT an overlap; no buffer on crews)"
            - "${err} == ERR_CREW_CAPACITY_EXCEEDED (13:30-14:30 overlaps 13:00-14:00 and load 1 == capacity 1)"

  # =========================================================================
  # Rule 9 — compensating_invariant (money vs physical key inventory)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_ledger_conservation_across_cancel_pay_refund
        grounds:
          - entities.Organization.fields.outstanding_balance_cents
          - state_machines.Invoice.PROVISIONAL_to_VOIDED
          - state_machines.Invoice.PAID_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity = money: org outstanding_balance_cents returns to exactly 0 with no drift
          across both compensation styles — an ADMIN cancel (VOIDED) and a CLIENT cancel -> full pay ->
          full refund cycle (PAID -> REFUNDED with paid == refunded == 10000).
        test_recipe:
          setup:
            - "INTERNAL org; room internal 5000; E1 2026-09-14 14:00-16:00 approved (outstanding 10000) then ADMIN-cancelled; E2 2026-09-15 14:00-16:00 approved then CLIENT-cancelled at 1h notice (100% tier)"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Astr", org_type: "INTERNAL_DEPARTMENT", contact_email: "astr@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "AST-1", building_code: "AST", capacity: 30, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E1", expected_attendance: 10, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E2", expected_attendance: 10, start_at: "2026-09-15T14:00:00Z", end_at: "2026-09-15T16:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${e2}" }, as: FinanceAdmin, captures: { inv2: "$.data[0].id" } }
            - { call: "POST /campus/event-reservations/${e1}/cancel", payload: {}, as: Scheduler }
            - { call: "GET /campus/organizations/${org_id}", payload: {}, as: Scheduler, captures: { out_mid: $.data.outstanding_balance_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T13:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e2}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /campus/invoices/${inv2}/pay", payload: { amount_cents: 10000 }, as: OrgRequester, as_user_id: "${org_id}", captures: { st_paid: $.data.status } }
            - { call: "POST /campus/invoices/${inv2}/refund", payload: { amount_cents: 10000 }, as: FinanceAdmin, captures: { st_ref: $.data.status } }
            - { call: "GET /campus/organizations/${org_id}", payload: {}, as: Scheduler, captures: { out_end: $.data.outstanding_balance_cents } }
          assert:
            - "${out_mid} == 0 (ADMIN cancel compensated the full 10000 provisional via VOIDED — no ledger drift)"
            - "Invoice.${inv2}.total_cents == 10000 (100% notice tier) and cancellation_fee_cents == 10000"
            - "${st_paid} == PAID and ${st_ref} == REFUNDED with paid_cents == refunded_cents == 10000"
            - "${out_end} == 0 (money conserved end-to-end: billed == collected == refunded)"

      - name: key_inventory_conservation_across_issue_return_lost
        grounds:
          - entities.Room.fields.key_count
          - entities.Room.fields.keys_issued
          - entities.Room.fields.keys_lost_total
          - state_machines.AccessGrant.ISSUED_to_RETURNED
          - state_machines.AccessGrant.OVERDUE_to_LOST
        distinguishing_aspect: |
          Conserved quantity = physical key units (different type than money): at every point
          key_count + keys_lost_total == 2 (the original inventory) and keys_issued equals the count of
          ISSUED key grants; a RETURN frees slot 1 for reuse by a later issue, while a LOST retires its
          slot permanently and shrinks key_count to 1.
        test_recipe:
          setup:
            - "INTERNAL org; room key_count 2; CONFIRMED event 2026-09-16 14:00-16:00; three PHYSICAL_KEY grant requests G1, G2, G3"
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept Music", org_type: "INTERNAL_DEPARTMENT", contact_email: "music@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "MUS-1", building_code: "MUS", capacity: 30, key_count: 2, internal_hourly_rate_cents: 5000, student_hourly_rate_cents: 2500, external_hourly_rate_cents: 12000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "Recital", expected_attendance: 20, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T16:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "PHYSICAL_KEY" }, as: FacilitiesManager, captures: { g1: $.data.id } }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "PHYSICAL_KEY" }, as: FacilitiesManager, captures: { g2: $.data.id } }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "PHYSICAL_KEY" }, as: FacilitiesManager, captures: { g3: $.data.id } }
            - { call: "POST /campus/access-grants/${g1}/issue", payload: {}, as: FacilitiesManager, captures: { g1_slot: $.data.key_slot } }
            - { call: "POST /campus/access-grants/${g2}/issue", payload: {}, as: FacilitiesManager, captures: { g2_slot: $.data.key_slot } }
            - { call: "POST /campus/access-grants/${g3}/issue", payload: {}, as: FacilitiesManager, captures: { err_full: $.data.error_id } }
          trigger:
            - { call: "POST /campus/access-grants/${g1}/return", payload: {}, as: FacilitiesManager, captures: { g1_forfeit: $.data.deposit_forfeit_cents } }
            - { call: "POST /campus/access-grants/${g3}/issue", payload: {}, as: FacilitiesManager, captures: { g3_slot: $.data.key_slot } }
            - { call: "POST /campus/access-grants/${g2}/mark-lost", payload: {}, as: FacilitiesManager, captures: { g2_forfeit: $.data.deposit_forfeit_cents } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: FacilitiesManager, captures: { kc: $.data.key_count, ki: $.data.keys_issued, kl: $.data.keys_lost_total } }
            - { call: "GET /campus/organizations/${org_id}", payload: {}, as: Scheduler, captures: { dep_held: $.data.deposit_held_cents } }
          assert:
            - "${g1_slot} == 1 and ${g2_slot} == 2 (lowest-free-slot assignment)"
            - "${err_full} == ERR_NO_KEYS_AVAILABLE (keys_issued == key_count == 2 blocked the third issue)"
            - "${g1_forfeit} == 0 (on-time return) and ${g3_slot} == 1 (freed slot reused — compensation restores capacity)"
            - "${g2_forfeit} == 7500 (100% forfeit on LOST)"
            - "${kc} == 1 and ${kl} == 1 and ${kc} + ${kl} == 2 and ${ki} == 1 (only G3 outstanding)"
            - "${dep_held} == 7500 (G3's deposit only; G1 released, G2 forfeited)"
            - "Invoice for ${ev_id} has deposit_charge_cents == 7500 and total_cents == 17500 (room 10000 + forfeit 7500)"
