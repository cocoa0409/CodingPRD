# =============================================================================
# Task 1578: Pump & Valve Repair / Rebuild Center — §1.8 Test Targeting Index
# 2 instances per Difficulty Rule (9 rules x 2 = 18 instances)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_total_commercial_vs_warranty_variant
        grounds:
          - calculations.quote_total
          - calculations.warranty_eligibility
          - entities.Quote.fields.pricing_variant
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          Dual-variant pricing on the Quote/RepairOrder domain: identical part_lines
          and labor inputs price at 117500 under COMMERCIAL and 18750 under WARRANTY
          (parts 50%, labor zeroed, surge forced 1.0) — a different entity domain
          from the TestRun verdict variant instance.
        test_recipe:
          setup:
            - "Customer C (warranty_terms_days 365, high credit), PUMP asset A, window W (capacity 1000)"
            - "RO1 for A driven RECEIVED -> CLOSED with a COMMERCIAL quote (lines: P1 x2 @15000, P2 x1 @7500; labor 4h @ 20000)"
            - "RO2 created for same asset A with warranty_parent_ro_id = RO1 -> warranty_case true"
            - "RO2 quoted with byte-identical lines and labor"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme Refining", account_number: "AC-100", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-1001", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500, test_standard: "API_610_PER_POINT" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /parts", payload: { part_number: "IMPELLER-1", description: "Impeller", unit_price_cents: 15000 }, as: ServiceManager, captures: { p1: $.data.id } }
            - { call: "POST /parts", payload: { part_number: "SEAL-1", description: "Mech seal", unit_price_cents: 7500 }, as: ServiceManager, captures: { p2: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAL_LEAK", failure_description: "leak", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
            - { call: "POST /repair-orders/${ro1}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro1}/inspection-reports", payload: { findings_summary: "worn", recommended_action: "REPAIR", estimated_labor_hours: 4, part_lines: [ { part_id: "${p1}", quantity: 2 }, { part_id: "${p2}", quantity: 1 } ] }, as: Inspector, captures: { rep1: $.data.id } }
            - { call: "POST /inspection-reports/${rep1}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro1}", payload: {}, as: ServiceManager, captures: { ro1_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro1}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [ { part_id: "${p1}", quantity: 2, unit_price_cents: 15000 }, { part_id: "${p2}", quantity: 1, unit_price_cents: 7500 } ], expected_repair_order_version: "${ro1_v}" }, as: ServiceManager, captures: { q1: $.data.id, q1_total: $.data.total_cents } }
            - { call: "POST /quotes/${q1}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q1}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders/${ro1}/start-repair", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro1}/submit-for-test", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro1}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 100, measured_value: 100, reference_value: 100 } ] }, as: Technician }
            - { call: "POST /repair-orders/${ro1}/close", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAL_LEAK", failure_description: "leak again", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10, warranty_parent_ro_id: "${ro1}" }, as: IntakeCoordinator, captures: { ro2: $.data.id, ro2_warranty: $.data.warranty_case } }
            - { call: "POST /repair-orders/${ro2}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro2}/inspection-reports", payload: { findings_summary: "worn again", recommended_action: "REPAIR", estimated_labor_hours: 4, part_lines: [ { part_id: "${p1}", quantity: 2 }, { part_id: "${p2}", quantity: 1 } ] }, as: Inspector, captures: { rep2: $.data.id } }
            - { call: "POST /inspection-reports/${rep2}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro2}", payload: {}, as: ServiceManager, captures: { ro2_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro2}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [ { part_id: "${p1}", quantity: 2, unit_price_cents: 15000 }, { part_id: "${p2}", quantity: 1, unit_price_cents: 7500 } ], expected_repair_order_version: "${ro2_v}" }, as: ServiceManager, captures: { q2: $.data.id, q2_total: $.data.total_cents, q2_variant: $.data.pricing_variant } }
          trigger:
            - { call: "GET /quotes/${q1}", payload: {}, as: ServiceManager, captures: { q1_total_read: $.data.total_cents, q1_variant: $.data.pricing_variant } }
          assert:
            - "Quote.${q1}.pricing_variant == COMMERCIAL"
            - "Quote.${q1}.total_cents == 117500"
            - "RepairOrder.${ro2}.warranty_case == true"
            - "RepairOrder.${ro2}.repeat_failure_flag == true"
            - "Quote.${q2}.pricing_variant == WARRANTY"
            - "Quote.${q2}.total_cents == 18750"

      - name: test_verdict_per_point_vs_weighted_avg_variant
        grounds:
          - calculations.test_verdict
          - entities.Asset.fields.test_standard
          - entities.TestRun.fields.verdict
        distinguishing_aspect: |
          Dual-variant verdict on the TestRun/Asset domain: identical measured points
          (deviations +8.00, -8.00, -2.00) FAIL under PER_POINT (max 8.00 > 5.0) but
          PASS under WEIGHTED_AVG (weighted mean -1.33 within 5.0) — a different
          entity domain from the quote pricing variant instance.
        test_recipe:
          setup:
            - "Customer, window W (capacity 1000), two PUMP assets: A1 test_standard API_610_PER_POINT, A2 SHOP_WEIGHTED_AVG"
            - "RO1 (A1) and RO2 (A2) both driven to IN_TEST"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Beta Chemical", account_number: "BC-200", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-2001", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500, test_standard: "API_610_PER_POINT" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-2002", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500, test_standard: "SHOP_WEIGHTED_AVG" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a1}", failure_mode: "CAVITATION", failure_description: "noise", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
            - { call: "POST /repair-orders/${ro1}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro1}/inspection-reports", payload: { findings_summary: "pitting", recommended_action: "REPAIR", estimated_labor_hours: 4, part_lines: [] }, as: Inspector, captures: { rep1: $.data.id } }
            - { call: "POST /inspection-reports/${rep1}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro1}", payload: {}, as: ServiceManager, captures: { ro1_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro1}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro1_v}" }, as: ServiceManager, captures: { q1: $.data.id } }
            - { call: "POST /quotes/${q1}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q1}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders/${ro1}/start-repair", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro1}/submit-for-test", payload: {}, as: Technician }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${a2}", failure_mode: "CAVITATION", failure_description: "noise", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro2: $.data.id } }
            - { call: "POST /repair-orders/${ro2}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro2}/inspection-reports", payload: { findings_summary: "pitting", recommended_action: "REPAIR", estimated_labor_hours: 4, part_lines: [] }, as: Inspector, captures: { rep2: $.data.id } }
            - { call: "POST /inspection-reports/${rep2}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro2}", payload: {}, as: ServiceManager, captures: { ro2_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro2}", capacity_window_id: "${win}", labor_hours: 4, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro2_v}" }, as: ServiceManager, captures: { q2: $.data.id } }
            - { call: "POST /quotes/${q2}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q2}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders/${ro2}/start-repair", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro2}/submit-for-test", payload: {}, as: Technician }
          trigger:
            - { call: "POST /repair-orders/${ro1}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 80, measured_value: 108, reference_value: 100 }, { duty_pct: 100, measured_value: 92, reference_value: 100 }, { duty_pct: 120, measured_value: 98, reference_value: 100 } ] }, as: Technician, captures: { t1_verdict: $.data.verdict, t1_max: $.data.max_deviation_pct } }
            - { call: "POST /repair-orders/${ro2}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 80, measured_value: 108, reference_value: 100 }, { duty_pct: 100, measured_value: 92, reference_value: 100 }, { duty_pct: 120, measured_value: 98, reference_value: 100 } ] }, as: Technician, captures: { t2_verdict: $.data.verdict, t2_weighted: $.data.weighted_deviation_pct } }
          assert:
            - "TestRun on ${ro1}: verdict == FAIL and max_deviation_pct == 8.00"
            - "RepairOrder.${ro1}.status == IN_REPAIR and repair_round == 1"
            - "TestRun on ${ro2}: verdict == PASS and weighted_deviation_pct == -1.33"
            - "RepairOrder.${ro2}.status == COMPLETE"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quote_total_per_line_rounding_order
        grounds:
          - calculations.quote_total
          - entities.Quote.fields.parts_subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with two WARRANTY part lines of qty 3 @ 7501 cents,
          pinned per-line-then-sum rounding yields 11252 + 11252 = 22504, whereas
          sum-then-round would yield 22503 — the scaffold pins per-line round_half_up
          BEFORE summation.
        test_recipe:
          setup:
            - "Customer (terms 365), PUMP asset, window capacity 1000"
            - "Parent RO closed; warranty RO created against it and quoted with two identical part lines qty 3 @ 7501, labor 0h"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Caddo Pipeline", account_number: "CP-300", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-3001", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500, test_standard: "SHOP_WEIGHTED_AVG" }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 1000 }, as: Planner, captures: { win: $.data.id } }
            - { call: "POST /parts", payload: { part_number: "SHAFT-1", description: "Shaft", unit_price_cents: 7501 }, as: ServiceManager, captures: { p1: $.data.id } }
            - { call: "POST /parts", payload: { part_number: "SLEEVE-1", description: "Sleeve", unit_price_cents: 7501 }, as: ServiceManager, captures: { p2: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "BEARING_FAILURE", failure_description: "vibration", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
            - { call: "POST /repair-orders/${ro1}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro1}/inspection-reports", payload: { findings_summary: "bearing shot", recommended_action: "REPAIR", estimated_labor_hours: 2, part_lines: [] }, as: Inspector, captures: { rep1: $.data.id } }
            - { call: "POST /inspection-reports/${rep1}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro1}", payload: {}, as: ServiceManager, captures: { ro1_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro1}", capacity_window_id: "${win}", labor_hours: 2, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro1_v}" }, as: ServiceManager, captures: { q1: $.data.id } }
            - { call: "POST /quotes/${q1}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q1}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /repair-orders/${ro1}/start-repair", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro1}/submit-for-test", payload: {}, as: Technician }
            - { call: "POST /repair-orders/${ro1}/test-runs", payload: { test_type: "PERFORMANCE_CURVE", measured_points: [ { duty_pct: 100, measured_value: 100, reference_value: 100 } ] }, as: Technician }
            - { call: "POST /repair-orders/${ro1}/close", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "BEARING_FAILURE", failure_description: "vibration again", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10, warranty_parent_ro_id: "${ro1}" }, as: IntakeCoordinator, captures: { ro2: $.data.id } }
            - { call: "POST /repair-orders/${ro2}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro2}/inspection-reports", payload: { findings_summary: "bearing shot again", recommended_action: "REPAIR", estimated_labor_hours: 0, part_lines: [ { part_id: "${p1}", quantity: 3 }, { part_id: "${p2}", quantity: 3 } ] }, as: Inspector, captures: { rep2: $.data.id } }
            - { call: "POST /inspection-reports/${rep2}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro2}", payload: {}, as: ServiceManager, captures: { ro2_v: $.data.version } }
          trigger:
            - { call: "POST /quotes", payload: { repair_order_id: "${ro2}", capacity_window_id: "${win}", labor_hours: 0, labor_rate_cents: 20000, part_lines: [ { part_id: "${p1}", quantity: 3, unit_price_cents: 7501 }, { part_id: "${p2}", quantity: 3, unit_price_cents: 7501 } ], expected_repair_order_version: "${ro2_v}" }, as: ServiceManager, captures: { q2: $.data.id, q2_sub: $.data.parts_subtotal_cents, q2_total: $.data.total_cents } }
          assert:
            - "Quote.${q2}.pricing_variant == WARRANTY"
            - "Quote.${q2}.parts_subtotal_cents == 22504"
            - "Quote.${q2}.labor_cents == 0"
            - "Quote.${q2}.total_cents == 22504"

      - name: surge_multiplier_nested_minmax_clamp
        grounds:
          - calculations.surge_multiplier
          - calculations.window_posture
          - entities.Quote.fields.surge_multiplier_applied
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >= 3 inputs and non-linear interaction:
          multiplier combines window posture (SURGE -> 1.25), intake_priority SURGE
          (+0.15) and pool_program credit (-0.10) then clamps through nested
          min/max into [1.0, 1.5] — 1.30 for the surge case, floor-clamped 1.00
          for NORMAL+pool+STANDARD — a different mode from the rounding-order instance.
        test_recipe:
          setup:
            - "Window W1 capacity 100; RO1 (customer C1, est 80h) approved -> W1 reserved 80 -> posture SURGE"
            - "Customer C2 pool_program=true; RO2 intake_priority SURGE quoted into W1 -> multiplier snapshot"
            - "Window W2 capacity 50 (NORMAL); customer C3 pool_program=true; RO3 STANDARD quoted into W2 -> floor clamp"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Delta Gas", account_number: "DG-400", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { c1: $.data.id } }
            - { call: "POST /customers", payload: { name: "Echo Fuels", account_number: "EF-401", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: true }, as: ServiceManager, captures: { c2: $.data.id } }
            - { call: "POST /customers", payload: { name: "Foxtrot Chem", account_number: "FC-402", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: true }, as: ServiceManager, captures: { c3: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W1", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", bay_hours_capacity: 100 }, as: Planner, captures: { w1: $.data.id } }
            - { call: "POST /capacity-windows", payload: { label: "W2", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", bay_hours_capacity: 50 }, as: Planner, captures: { w2: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${c1}", serial_number: "V-4001", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${c1}", asset_id: "${a1}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 80 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
            - { call: "POST /repair-orders/${ro1}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro1}/inspection-reports", payload: { findings_summary: "seat scored", recommended_action: "REPAIR", estimated_labor_hours: 40, part_lines: [] }, as: Inspector, captures: { rep1: $.data.id } }
            - { call: "POST /inspection-reports/${rep1}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro1}", payload: {}, as: ServiceManager, captures: { ro1_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro1}", capacity_window_id: "${w1}", labor_hours: 40, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro1_v}" }, as: ServiceManager, captures: { q1: $.data.id } }
            - { call: "POST /quotes/${q1}/issue", payload: {}, as: ServiceManager }
            - { call: "POST /quotes/${q1}/approve", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /assets", payload: { customer_id: "${c2}", serial_number: "V-4002", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${c2}", asset_id: "${a2}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "SURGE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro2: $.data.id } }
            - { call: "POST /repair-orders/${ro2}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro2}/inspection-reports", payload: { findings_summary: "seat scored", recommended_action: "REPAIR", estimated_labor_hours: 5, part_lines: [] }, as: Inspector, captures: { rep2: $.data.id } }
            - { call: "POST /inspection-reports/${rep2}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro2}", payload: {}, as: ServiceManager, captures: { ro2_v: $.data.version } }
            - { call: "POST /assets", payload: { customer_id: "${c3}", serial_number: "V-4003", equipment_class: "GENERAL_VALVE", manufacturer: "Flowserve", model: "G1" }, as: IntakeCoordinator, captures: { a3: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${c3}", asset_id: "${a3}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro3: $.data.id } }
            - { call: "POST /repair-orders/${ro3}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro3}/inspection-reports", payload: { findings_summary: "seat scored", recommended_action: "REPAIR", estimated_labor_hours: 5, part_lines: [] }, as: Inspector, captures: { rep3: $.data.id } }
            - { call: "POST /inspection-reports/${rep3}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro3}", payload: {}, as: ServiceManager, captures: { ro3_v: $.data.version } }
          trigger:
            - { call: "POST /quotes", payload: { repair_order_id: "${ro2}", capacity_window_id: "${w1}", labor_hours: 5, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro2_v}" }, as: ServiceManager, captures: { q2: $.data.id, q2_mult: $.data.surge_multiplier_applied } }
