            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 3000 }, as: LeasingAgent, captures: { fa: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-02", amount_cents: 4000 }, as: LeasingAgent, captures: { fb: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/payments", payload: { lease_id: "${lease}", tenant_id: "${ten}", channel: "CARD", amount_cents: 4000, received_date: "2026-08-03" }, as: LeasingAgent, captures: { pay: $.data.id } }
