# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3464_enforcement_consent_orders_consumer_redress_distribution
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Common setup steps are anchored at first use (&c_*) and aliased (*c_*) after.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: subject_company_create_applies_defaults_computed_tier_and_system_fields
        claim_type: Creation
        grounds:
          - entities.SubjectCompany
          - entities.SubjectCompany.fields.complaint_count_90d
          - entities.SubjectCompany.fields.risk_tier
          - endpoints.POST_/enforcement/subject-companies
          - calculations.complaint_velocity_risk_tier
        distinguishing_aspect: "Creating a company with only legal_name defaults complaint_count_90d to 0, computes risk_tier STANDARD, stamps version 1, and — with no clock call made — created_at equals the logical clock's fixed startup default 2026-09-01T00:00:00Z, proving the clock never falls back to wall time."
        test_recipe:
          setup:
            - "Empty database; no clock call has ever been made."
          setup_api_calls: []
          trigger:
            - &c_company
              call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Default Widgets LLC" }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "SubjectCompany.${company_id}.complaint_count_90d == 0 (default applied)"
            - "SubjectCompany.${company_id}.risk_tier == STANDARD"
            - "SubjectCompany.${company_id}.version == 1"
            - "SubjectCompany.${company_id}.created_at == 2026-09-01T00:00:00Z and updated_at == 2026-09-01T00:00:00Z (logical clock startup default)"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: investigation_get_roundtrips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Investigation
          - endpoints.GET_/enforcement/investigations/{investigationId}
        distinguishing_aspect: "Every stored field of an investigation round-trips through GET unchanged, including the server-stamped opened_by_user_id and the initial INTAKE status."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one subject company; one investigation opened by StaffAttorney sa-7."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - &c_inv
              call: "POST /enforcement/investigations"
              payload: { subject_company_id: "${company_id}", origin: "REFERRAL", summary: "Deceptive billing practices" }
              as: StaffAttorney
              as_user_id: "sa-7"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "GET /enforcement/investigations/${inv_id}"
              payload: {}
              as: StaffAttorney
          assert:
            - "the response status is 200"
            - "Investigation.${inv_id}.origin == REFERRAL and summary == \"Deceptive billing practices\""
            - "Investigation.${inv_id}.subject_company_id == ${company_id}"
            - "Investigation.${inv_id}.status == INTAKE"
            - "Investigation.${inv_id}.opened_by_user_id == \"sa-7\""
            - "Investigation.${inv_id}.created_at == 2026-09-01T00:00:00Z"

      - name: claims_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/enforcement/claims
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three FILED claims on one fund, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false; a claimant_id filter collapses the same list to exactly 1 row."
        test_recipe:
          setup:
            - "Fund OPEN_FOR_CLAIMS after a 1500000 collection; claimants A, B, C NOTIFIED; three claims FILED (losses 100000, 200000, 300000)."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - &c_inv_pr
              call: "POST /enforcement/investigations/${inv_id}/transition"
              payload: { target_state: "PRELIMINARY_REVIEW" }
              as: StaffAttorney
            - &c_inv_eg
              call: "POST /enforcement/investigations/${inv_id}/transition"
              payload: { target_state: "EVIDENCE_GATHERING" }
              as: StaffAttorney
            - &c_inv_ng
              call: "POST /enforcement/investigations/${inv_id}/transition"
              payload: { target_state: "NEGOTIATING" }
              as: StaffAttorney
            - &c_order
              call: "POST /enforcement/investigations/${inv_id}/consent-orders"
              payload: { monetary_relief_cents: 1500000, max_penalty_cents: 500000000, reporting_frequency_months: 6, monitoring_term_years: 5, conduct_prohibitions: ["NO_UNSUBSTANTIATED_CLAIMS"] }
              as: StaffAttorney
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - &c_propose
              call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "IN_PUBLIC_COMMENT", expected_consent_order_version: "${order_v1}" }
              as: StaffAttorney
              captures: { order_v2: $.data.version }
            - &c_clock_oct
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_finalize
              call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "FINAL", expected_consent_order_version: "${order_v2}" }
              as: Commissioner
              captures: { order_v3: $.data.version }
            - &c_monitor
              call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "IN_MONITORING", expected_consent_order_version: "${order_v3}" }
              as: Commissioner
            - &c_judgment
              call: "POST /enforcement/consent-orders/${order_id}/judgment"
              payload: { amount_cents: 1500000 }
              as: Commissioner
              captures: { judgment_id: $.data.id }
            - &c_get_fund
              call: "GET /enforcement/judgments/${judgment_id}/redress-fund"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { fund_id: "$.data[0].id" }
            - &c_claimant_a
              call: "POST /enforcement/redress-funds/${fund_id}/claimants"
              payload: { full_name: "Ann Apple", email: "ann@example.com", identified_from: "COMPANY_RECORDS" }
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { claimant_a_id: $.data.id }
            - &c_claimant_b
              call: "POST /enforcement/redress-funds/${fund_id}/claimants"
              payload: { full_name: "Bob Berry", email: "bob@example.com", identified_from: "COMPANY_RECORDS" }
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { claimant_b_id: $.data.id }
            - &c_claimant_c
              call: "POST /enforcement/redress-funds/${fund_id}/claimants"
              payload: { full_name: "Cid Cherry", email: "cid@example.com", identified_from: "CLAIMS_PROCESS" }
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { claimant_c_id: $.data.id }
            - &c_pay_full
              call: "POST /enforcement/judgments/${judgment_id}/payments"
              payload: { amount_cents: 1500000, kind: "COLLECTION" }
              as: CompanyRepresentative
              as_user_id: "${company_id}"
            - call: "POST /enforcement/claims"
              payload: { claimant_id: "${claimant_a_id}", redress_fund_id: "${fund_id}", documented_loss_cents: 100000 }
              as: Claimant
              as_user_id: "${claimant_a_id}"
            - call: "POST /enforcement/claims"
              payload: { claimant_id: "${claimant_b_id}", redress_fund_id: "${fund_id}", documented_loss_cents: 200000 }
              as: Claimant
              as_user_id: "${claimant_b_id}"
            - call: "POST /enforcement/claims"
              payload: { claimant_id: "${claimant_c_id}", redress_fund_id: "${fund_id}", documented_loss_cents: 300000 }
              as: Claimant
              as_user_id: "${claimant_c_id}"
          trigger:
            - call: "GET /enforcement/claims"
              payload: { redress_fund_id: "${fund_id}", limit: 2, offset: 0 }
              as: FundAdministrator
              as_user_id: "fa-1"
            - call: "GET /enforcement/claims"
              payload: { redress_fund_id: "${fund_id}", limit: 2, offset: 2 }
              as: FundAdministrator
              as_user_id: "fa-1"
            - call: "GET /enforcement/claims"
              payload: { claimant_id: "${claimant_b_id}" }
              as: FundAdministrator
              as_user_id: "fa-1"
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "page 2 (offset 2) returns exactly 1 row with total_count == 3 and has_more == false"
            - "rows are ordered by created_at ASC (the 100000 claim precedes the 200000 claim precedes the 300000 claim)"
            - "the claimant_id filter returns exactly 1 row (claimant B's claim, documented_loss_cents == 200000)"

      - name: consent_order_get_with_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/enforcement/consent-orders/{orderId}
          - errors.ERR_CONSENT_ORDER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated order id produces the entity-specific 404 ERR_CONSENT_ORDER_NOT_FOUND inside the standard error envelope — not a generic 404 and not a 400."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; no consent orders exist."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /enforcement/consent-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Commissioner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CONSENT_ORDER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: cid_create_missing_response_due_date_returns_400
        claim_type: Required Fields
        grounds:
          - entities.CivilInvestigativeDemand.fields.response_due_date
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "response_due_date is a required input with no default: omitting it from CID creation is a 400 ERR_INVALID_REQUEST, and no CID row is left behind."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one investigation in EVIDENCE_GATHERING."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
          trigger:
            - call: "POST /enforcement/investigations/${inv_id}/cids"
              payload: { subject_matter: "All pricing spreadsheets 2024-2026" }
              as: StaffAttorney
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /enforcement/investigations/${inv_id}/cids returns 0 rows"

      - name: claimant_identified_from_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Claimant.fields.identified_from
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "identified_from is a closed enum (COMPANY_RECORDS | CLAIMS_PROCESS): the value WILD_GUESS is rejected 400 ERR_INVALID_REQUEST before any claimant is persisted."
        test_recipe:
          setup:
            - "Fund exists in ACCUMULATING (judgment 1500000 entered, no payments yet)."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - *c_judgment
            - *c_get_fund
          trigger:
            - call: "POST /enforcement/redress-funds/${fund_id}/claimants"
              payload: { full_name: "Eve Eagle", email: "eve@example.com", identified_from: "WILD_GUESS" }
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /enforcement/redress-funds/${fund_id}/claimants returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: investigation_created_starts_in_intake_with_version_1
        claim_type: Initial State
        grounds:
          - state_machines.Investigation
        distinguishing_aspect: "A freshly created investigation is INTAKE at version 1 with no transitions applied."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one subject company."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
          trigger:
            - call: "POST /enforcement/investigations"
              payload: { subject_company_id: "${company_id}", origin: "COMPLAINT", summary: "Billing complaints cluster" }
              as: StaffAttorney
              captures: { inv_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Investigation.${inv_id}.status == INTAKE"
            - "Investigation.${inv_id}.version == 1"

      - name: investigation_intake_to_negotiating_rejected
        claim_type: Invalid Transition
        grounds:
          - state_machines.Investigation.INTAKE_to_PRELIMINARY_REVIEW
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "INTAKE cannot skip straight to NEGOTIATING — the transition table has no such row, so the attempt fails 409 and the investigation stays INTAKE."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one investigation in INTAKE."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
          trigger:
            - call: "POST /enforcement/investigations/${inv_id}/transition"
              payload: { target_state: "NEGOTIATING" }
              as: StaffAttorney
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /enforcement/investigations/${inv_id} still shows status INTAKE and version 1"

      - name: consent_order_expired_is_terminal_and_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ConsentOrder.IN_MONITORING_to_EXPIRED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "A 1-year order entering monitoring at 2026-10-01 auto-expires once the clock passes 2027-10-01; from EXPIRED even a Commissioner-requested TERMINATED transition is rejected 409."
        test_recipe:
          setup:
            - "Order (monitoring_term_years 1) IN_MONITORING since 2026-10-01; clock advanced to 2027-10-02T00:00:00Z so the sweep has expired it."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - call: "POST /enforcement/investigations/${inv_id}/consent-orders"
              payload: { monetary_relief_cents: 1500000, max_penalty_cents: 500000000, reporting_frequency_months: 6, monitoring_term_years: 1, conduct_prohibitions: ["NO_UNSUBSTANTIATED_CLAIMS"] }
              as: StaffAttorney
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /enforcement/consent-orders/${order_id}"
              payload: {}
              as: Commissioner
              captures: { order_v_expired: $.data.version }
          trigger:
            - call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "TERMINATED", expected_consent_order_version: "${order_v_expired}" }
              as: Commissioner
              captures: { error_id: $.data.error_id }
          assert:
            - "the pre-trigger GET showed status EXPIRED (auto-transitioned by the clock sweep at 2027-10-02, strictly past monitoring_ends_at 2027-10-01T00:00:00Z)"
            - "the transition attempt returns 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /enforcement/consent-orders/${order_id} still shows EXPIRED"

      - name: cid_quash_petition_enforced_then_late_response_accepted
        claim_type: Valid Transition
        grounds:
          - state_machines.CivilInvestigativeDemand.ISSUED_to_QUASH_PETITIONED
          - state_machines.CivilInvestigativeDemand.QUASH_PETITIONED_to_ENFORCED
          - state_machines.CivilInvestigativeDemand.ENFORCED_to_RESPONDED
        distinguishing_aspect: "The quash-and-enforce detour lets a company respond AFTER the original due date without ERR_CID_RESPONSE_OVERDUE — the overdue rule applies only to ISSUED -> RESPONDED, so an ENFORCED demand responded at 2026-09-20 (due was 2026-09-15) succeeds."
        test_recipe:
          setup:
            - "Investigation in EVIDENCE_GATHERING; CID issued with response_due_date 2026-09-15T00:00:00Z; company has petitioned to quash and the agency has enforced."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - call: "POST /enforcement/investigations/${inv_id}/cids"
              payload: { subject_matter: "All pricing spreadsheets 2024-2026", response_due_date: "2026-09-15T00:00:00Z" }
              as: StaffAttorney
              captures: { cid_id: $.data.id }
            - call: "POST /enforcement/cids/${cid_id}/transition"
              payload: { target_state: "ISSUED" }
              as: StaffAttorney
            - call: "POST /enforcement/cids/${cid_id}/transition"
              payload: { target_state: "QUASH_PETITIONED" }
              as: CompanyRepresentative
              as_user_id: "${company_id}"
            - call: "POST /enforcement/cids/${cid_id}/transition"
              payload: { target_state: "ENFORCED" }
              as: StaffAttorney
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /enforcement/cids/${cid_id}/transition"
              payload: { target_state: "RESPONDED", response_document_ref: "doc-production-1" }
              as: CompanyRepresentative
              as_user_id: "${company_id}"
          assert:
            - "the response status is 200 and CivilInvestigativeDemand.${cid_id}.status == RESPONDED"
            - "CivilInvestigativeDemand.${cid_id}.responded_at == 2026-09-20T00:00:00Z"
            - "CivilInvestigativeDemand.${cid_id}.response_document_ref == \"doc-production-1\""

      - name: check_auto_stale_at_exactly_90_day_boundary
        claim_type: Valid Transition
        grounds:
          - state_machines.RefundCheck.ISSUED_to_STALE
          - calculations.check_lifecycle_timing
        distinguishing_aspect: "A check issued 2026-10-01T00:00:00Z is still ISSUED at 2026-12-29T00:00:00Z (89 days) and auto-transitions to STALE at exactly 2026-12-30T00:00:00Z (now >= stale_after, >= semantics at the boundary)."
        test_recipe:
          setup:
            - "Fund DISBURSING; claim A (final award 500000) has its check issued at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - *c_judgment
            - *c_get_fund
            - *c_claimant_a
            - *c_pay_full
            - call: "POST /enforcement/claims"
              payload: { claimant_id: "${claimant_a_id}", redress_fund_id: "${fund_id}", documented_loss_cents: 500000 }
              as: Claimant
              as_user_id: "${claimant_a_id}"
              captures: { claim_a_id: $.data.id }
            - call: "POST /enforcement/claims/${claim_a_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: FundAdministrator
              as_user_id: "fa-1"
            - call: "POST /enforcement/claims/${claim_a_id}/transition"
              payload: { target_state: "APPROVED" }
              as: FundAdministrator
              as_user_id: "fa-1"
            - call: "GET /enforcement/redress-funds/${fund_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { fund_v: $.data.version }
            - call: "POST /enforcement/redress-funds/${fund_id}/transition"
              payload: { target_state: "CLAIMS_CLOSED", expected_redress_fund_version: "${fund_v}" }
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { fund_v2: $.data.version }
            - call: "POST /enforcement/redress-funds/${fund_id}/transition"
              payload: { target_state: "DISBURSING", expected_redress_fund_version: "${fund_v2}" }
              as: FundAdministrator
              as_user_id: "fa-1"
            - call: "POST /enforcement/claims/${claim_a_id}/checks"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-1"
              captures: { check_a_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /enforcement/claims/${claim_a_id}/checks"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-1"
              captures: { check_status_89d: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /enforcement/claims/${claim_a_id}/checks"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-1"
              captures: { check_status_90d: "$.data[0].status" }
          assert:
            - "the check's issued_at == 2026-10-01T00:00:00Z and stale_after == 2026-12-30T00:00:00Z (issued + 90 days)"
            - "at 2026-12-29T00:00:00Z the check is still ISSUED"
            - "at exactly 2026-12-30T00:00:00Z the check has auto-transitioned to STALE"

