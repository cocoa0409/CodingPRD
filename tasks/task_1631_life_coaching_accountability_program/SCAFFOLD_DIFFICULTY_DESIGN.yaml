    instances:
      - name: session_completion_gated_by_coach_credential
        grounds:
          - state_machines.Session.SCHEDULED_to_COMPLETED
          - validations[priority=6]
          - errors[ERR_COACH_NOT_CREDENTIALED]
        distinguishing_aspect: |
          Pair Session -> Coach: completing a SCHEDULED session is rejected when the
