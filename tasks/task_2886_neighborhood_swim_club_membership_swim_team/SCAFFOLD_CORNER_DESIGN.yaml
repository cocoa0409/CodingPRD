              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_couple_id}", season_id: "${s27_id}", join_date: "2027-05-22", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_b_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_a_balance: $.data.balance_due_cents }
            - call: "POST /swim-club/memberships/${m_b_id}/invoice"
              payload: {}
              as: Treasurer
