# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable §1.1–§1.7 claims not already covered by §1.8. Real
# instances carry an executable test_recipe; corners already exercised by a
# §1.8 difficulty instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: facility_create_returns_all_fields
        claim_type: Creation
        grounds: [entities.Facility, endpoints]
        distinguishing_aspect: "POST /epcra/facilities returns 201 with compliance_posture=COMPLIANT, erp_status=NONE, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /epcra/facilities"
              payload: { name: "Corner Plant", epa_facility_id: "CN-0001", state_code: "TX", county: "Harris", operator_name: "Corner LLC" }
              as: Regulator
              captures: { fac_id: $.data.id, ver: $.data.version, posture: $.data.compliance_posture, erp: $.data.erp_status }
          assert:
            - "Facility.${fac_id}.compliance_posture == COMPLIANT"
            - "Facility.${fac_id}.erp_status == NONE"
            - "Facility.${fac_id}.version == 1"

      - name: facility_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: "[\"validations[priority=3]\", \"errors[ERR_INVALID_REQUEST]\"]"
        distinguishing_aspect: "Omitting operator_name from POST /epcra/facilities returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /epcra/facilities"
              payload: { name: "NoOp", epa_facility_id: "CN-0002", state_code: "TX", county: "Harris" }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: get_facility_not_found_returns_404
        claim_type: Not Found
        grounds: "[\"validations[priority=4]\", \"errors[ERR_FACILITY_NOT_FOUND]\"]"
        distinguishing_aspect: "GET /epcra/facilities/{id} with an unknown UUID returns ERR_FACILITY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /epcra/facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FACILITY_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_facilities_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Facility]
        distinguishing_aspect: "GET /epcra/facilities returns an array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two facilities exist."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "P1", epa_facility_id: "CN-0003", state_code: "TX", county: "Harris", operator_name: "Op1" }
              as: Regulator
            - call: "POST /epcra/facilities"
              payload: { name: "P2", epa_facility_id: "CN-0004", state_code: "TX", county: "Harris", operator_name: "Op2" }
              as: Regulator
          trigger:
            - call: "GET /epcra/facilities"
              payload: {}
              as: Regulator
          assert:
            - "response_type == array; meta.total_count >= 2; has_more present"

      - name: chemical_ehs_missing_tpq_returns_invalid_request
        claim_type: Type Constraints
        grounds: "[\"validations[priority=3]\", \"errors[ERR_INVALID_REQUEST]\", entities.Chemical.fields.tpq_lbs]"
        distinguishing_aspect: "Creating an is_ehs=true chemical without tpq_lbs returns ERR_INVALID_REQUEST (400) — conditional required field."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-EHS", name: "MysteryGas", is_ehs: true, rq_lbs: 10, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: inventory_invalid_enum_storage_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: "[\"validations[priority=3]\", \"errors[ERR_INVALID_REQUEST]\", entities.ChemicalInventory.fields.storage_type]"
        distinguishing_aspect: "storage_type outside {TANK,CYLINDER,DRUM,BULK} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A facility and a non-EHS chemical exist."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "EnumF", epa_facility_id: "CN-0005", state_code: "TX", county: "Harris", operator_name: "EnumOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-05", name: "Xylene", is_ehs: false, rq_lbs: 1000, hazard_weight: 0.1, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
          trigger:
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 100, average_daily_amount_lbs: 50, days_on_site: 10, storage_type: "BOX" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: inventory_unknown_chemical_returns_not_found
        claim_type: Parent Relationships
        grounds: "[\"validations[priority=4]\", \"errors[ERR_CHEMICAL_NOT_FOUND]\", entities.ChemicalInventory.fields.chemical_id]"
        distinguishing_aspect: "Declaring inventory with an unknown chemical_id returns ERR_CHEMICAL_NOT_FOUND (404) — flat FK integrity."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "FkF", epa_facility_id: "CN-0006", state_code: "TX", county: "Harris", operator_name: "FkOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "00000000-0000-4000-8000-000000000001", reporting_year: 2025, max_daily_amount_lbs: 100, average_daily_amount_lbs: 50, days_on_site: 10, storage_type: "DRUM" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHEMICAL_NOT_FOUND"

      - name: error_inventory_threshold_boundary_covered
        claim_type: Computed Fields
        grounds: [entities.ChemicalInventory.fields.is_reportable]
        excluded_because:
          difficulty_instance: boundary_precision_check / inventory_threshold_inclusive_boundary
          rationale: "The >= threshold computed-field boundary is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: inspection_start_valid_transition
        claim_type: Valid Transition
        grounds: [state_machines.Inspection.SCHEDULED_to_IN_PROGRESS]
        distinguishing_aspect: "POST /epcra/inspections/{id}/start moves a SCHEDULED inspection to IN_PROGRESS."
        test_recipe:
          setup: ["A facility with a SCHEDULED inspection."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "InspF", epa_facility_id: "CN-0007", state_code: "TX", county: "Harris", operator_name: "InspOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-C1", scheduled_date: "2026-05-01T09:00:00Z" }
              as: Regulator
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /epcra/inspections/${insp_id}/start"
              payload: {}
              as: Regulator
              captures: { st: $.data.status }
          assert:
            - "Inspection.${insp_id}.status == IN_PROGRESS"

      - name: case_review_twice_returns_case_not_open
        claim_type: Idempotency
        grounds: "[state_machines.ComplianceCase.OPEN_to_UNDER_REVIEW, \"errors[ERR_CASE_NOT_OPEN]\"]"
        distinguishing_aspect: "A second review on a case already UNDER_REVIEW returns ERR_CASE_NOT_OPEN (409)."
        test_recipe:
          setup: ["A facility with a manual case moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "CaseF", epa_facility_id: "CN-0008", state_code: "TX", county: "Harris", operator_name: "CaseOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/compliance-cases"
              payload: { facility_id: "${fac_id}", severity: "LOW" }
              as: Regulator
              captures: { case_id: $.data.id }
            - call: "POST /epcra/compliance-cases/${case_id}/review"
              payload: {}
              as: Regulator
          trigger:
            - call: "POST /epcra/compliance-cases/${case_id}/review"
              payload: {}
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CASE_NOT_OPEN"

      - name: inspection_complete_twice_returns_not_in_progress
        claim_type: Idempotency
        grounds: "[state_machines.Inspection.IN_PROGRESS_to_PASSED, \"errors[ERR_INSPECTION_NOT_IN_PROGRESS]\"]"
        distinguishing_aspect: "Completing an inspection that is already PASSED returns ERR_INSPECTION_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A facility with an inspection completed PASS."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "DblF", epa_facility_id: "CN-0009", state_code: "TX", county: "Harris", operator_name: "DblOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-C2", scheduled_date: "2026-05-02T09:00:00Z" }
              as: Regulator
              captures: { insp_id: $.data.id }
            - call: "POST /epcra/inspections/${insp_id}/start"
              payload: {}
              as: Regulator
            - call: "POST /epcra/inspections/${insp_id}/complete"
              payload: { result: "PASS" }
              as: Regulator
          trigger:
            - call: "POST /epcra/inspections/${insp_id}/complete"
              payload: { result: "PASS" }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSPECTION_NOT_IN_PROGRESS"

      - name: release_report_written_before_verbal_invalid_stage
        claim_type: Invalid Transitions
        grounds: "[state_machines.ReleaseNotification.reporting_VERBAL_GIVEN_to_WRITTEN_FILED, \"errors[ERR_RELEASE_INVALID_STAGE]\"]"
        distinguishing_aspect: "Reporting WRITTEN while reporting_status is still PENDING_VERBAL returns ERR_RELEASE_INVALID_STAGE (409)."
        test_recipe:
          setup: ["A facility with a below-RQ release still at PENDING_VERBAL."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "StageF", epa_facility_id: "CN-0010", state_code: "TX", county: "Harris", operator_name: "StageOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-10", name: "Acetone", is_ehs: false, rq_lbs: 5000, hazard_weight: 0.1, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-10T00:00:00Z", quantity_released_lbs: 10, medium: "SOIL" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /epcra/release-notifications/${rel_id}/report"
              payload: { stage: "WRITTEN" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RELEASE_INVALID_STAGE"

      - name: release_written_without_erp_returns_no_erp_linkage
        claim_type: guarded transitions
        grounds: "[state_machines.ReleaseNotification.reporting_VERBAL_GIVEN_to_WRITTEN_FILED, \"errors[ERR_NO_ERP_LINKAGE]\", entities.Facility.fields.erp_status]"
        distinguishing_aspect: "Advancing to WRITTEN_FILED while facility erp_status != ACTIVE returns ERR_NO_ERP_LINKAGE (409) — cross-entity guard."
        test_recipe:
          setup: ["Facility (no ERP linkage), below-RQ release advanced to VERBAL_GIVEN."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "ErpF", epa_facility_id: "CN-0011", state_code: "TX", county: "Harris", operator_name: "ErpOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-11", name: "Hexane", is_ehs: false, rq_lbs: 5000, hazard_weight: 0.1, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-11T00:00:00Z", quantity_released_lbs: 10, medium: "AIR" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rel_id: $.data.id }
            - call: "POST /epcra/release-notifications/${rel_id}/report"
              payload: { stage: "VERBAL" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /epcra/release-notifications/${rel_id}/report"
              payload: { stage: "WRITTEN" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ERP_LINKAGE"

      - name: sds_supersede_prior_active_sheet
        claim_type: Side Effect Execution
        grounds: [state_machines.SDS.ACTIVE_to_SUPERSEDED, entities.SDS.fields.status]
        distinguishing_aspect: "Uploading a second SDS for the same facility+chemical flips the prior sheet to SUPERSEDED and leaves the new one ACTIVE."
        test_recipe:
          setup: ["Facility, chemical, and one ACTIVE SDS."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "SdsF", epa_facility_id: "CN-0012", state_code: "TX", county: "Harris", operator_name: "SdsOp" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-12", name: "Styrene", is_ehs: false, rq_lbs: 1000, hazard_weight: 0.1, physical_state: "LIQUID" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://v1", revision_date: "2025-01-01T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { sds1_id: $.data.id }
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fac_v2: $.data.version }
          trigger:
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://v2", revision_date: "2025-06-01T00:00:00Z", expected_facility_version: "${fac_v2}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { sds2_id: $.data.id }
            - call: "GET /epcra/sds/${sds1_id}"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { s1_status: $.data.status }
          assert:
            - "SDS.${sds1_id}.status == SUPERSEDED"
            - "SDS.${sds2_id}.status == ACTIVE"

      - name: filing_review_on_draft_returns_not_reviewable
        claim_type: Invalid Transitions
        grounds: "[state_machines.TierIIFiling.SUBMITTED_to_UNDER_REVIEW, \"errors[ERR_FILING_NOT_REVIEWABLE]\"]"
        distinguishing_aspect: "A review BEGIN on a DRAFT filing returns ERR_FILING_NOT_REVIEWABLE (409)."
        test_recipe:
          setup: ["Facility with a DRAFT filing."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "RevF", epa_facility_id: "CN-0013", state_code: "TX", county: "Harris", operator_name: "RevOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/review"
              payload: { decision: "BEGIN" }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FILING_NOT_REVIEWABLE"

      - name: error_filing_revision_cycle_covered
        claim_type: cyclic
        grounds: [state_machines.TierIIFiling.RETURNED_FOR_REVISION_to_SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / filing_revision_cycle_back_edge
          rationale: "The RETURNED_FOR_REVISION->SUBMITTED back-edge is asserted by the named §1.8 instance."

      - name: error_release_parallel_dimensions_covered
        claim_type: parallel
        grounds: [state_machines.ReleaseNotification.remediation_ONGOING_to_CONTAINED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / release_parallel_reporting_remediation
          rationale: "Independent evolution of reporting_status vs remediation_status is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: release_rq_inclusive_boundary
        claim_type: Constants Applied
        grounds: [calculations.release_rq_determination, entities.ReleaseNotification.fields.exceeds_rq]
        distinguishing_aspect: "A release of exactly rq_lbs (500) sets exceeds_rq=true because the test is >= (not >) — RQ metric, distinct from the inventory threshold boundary."
        test_recipe:
          setup: ["Facility and a chemical with rq 500 lb."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "RqF", epa_facility_id: "CN-0014", state_code: "TX", county: "Harris", operator_name: "RqOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-14", name: "Phenol", is_ehs: false, rq_lbs: 500, hazard_weight: 0.2, physical_state: "SOLID" }
              as: Regulator
              captures: { chem_id: $.data.id }
          trigger:
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-12T00:00:00Z", quantity_released_lbs: 500, medium: "WATER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rel_id: $.data.id, ex: $.data.exceeds_rq }
          assert:
            - "ReleaseNotification.${rel_id}.exceeds_rq == true"
            - "ReleaseNotification.${rel_id}.requires_lepc == true"

      - name: filing_late_penalty_applied
        claim_type: Correct Result
        grounds: [calculations.tier_ii_filing_fee, entities.TierIIFiling.fields.is_late, entities.TierIIFiling.fields.assessed_fee_cents]
        distinguishing_aspect: "Submitting an RY2025 filing at 2026-03-02 (past the 2026-03-01 deadline) sets is_late=true and assessed_fee_cents=11000 (10000 subtotal + 10% late penalty)."
        test_recipe:
          setup: ["Clock at 2026-03-02; facility with reportable EHS inventory + ACTIVE SDS; DRAFT filing for 2025."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Regulator
            - call: "POST /epcra/facilities"
              payload: { name: "LateF", epa_facility_id: "CN-0015", state_code: "TX", county: "Harris", operator_name: "LateOp" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "7782-50-5", name: "Chlorine", is_ehs: true, tpq_lbs: 100, rq_lbs: 5000, hazard_weight: 0.5, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/chemical-inventories"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", reporting_year: 2025, max_daily_amount_lbs: 200, average_daily_amount_lbs: 150, days_on_site: 300, storage_type: "CYLINDER" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://cl", revision_date: "2025-01-02T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /epcra/tier-ii-filings"
              payload: { facility_id: "${fac_id}", reporting_year: 2025 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { fil_id: $.data.id }
          trigger:
            - call: "POST /epcra/tier-ii-filings/${fil_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { late: $.data.is_late, assessed: $.data.assessed_fee_cents }
          assert:
            - "TierIIFiling.${fil_id}.is_late == true"
            - "TierIIFiling.${fil_id}.assessed_fee_cents == 11000"

      - name: rmp_next_due_date_five_years
        claim_type: Correct Result
        grounds: [calculations.rmp_next_due_date, entities.RiskManagementPlan.fields.next_due_date]
        distinguishing_aspect: "An RMP submitted 2025-06-01 gets next_due_date 2030-06-01 (submitted_date + 5 years)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "RmpF", epa_facility_id: "CN-0016", state_code: "TX", county: "Harris", operator_name: "RmpOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /epcra/risk-management-plans"
              payload: { facility_id: "${fac_id}", program_level: 2, submitted_date: "2025-06-01T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rmp_id: $.data.id, due: $.data.next_due_date }
          assert:
            - "RiskManagementPlan.${rmp_id}.next_due_date == 2030-06-01T00:00:00Z"

      - name: error_threshold_branch_covered
        claim_type: Correct Result
        grounds: [calculations.applicable_threshold_determination]
        excluded_because:
          difficulty_instance: combinatorial_formula / threshold_ehs_branch_nested_min
          rationale: "The conditional-branch + nested-min threshold formula is asserted by the named §1.8 instance."

      - name: error_hazard_round_then_sum_covered
        claim_type: Precision
        grounds: [calculations.facility_hazard_index]
        excluded_because:
          difficulty_instance: combinatorial_formula / hazard_index_round_then_sum
