        claim_type: tiered_pricing
        grounds:
          - calculations.production_cost
          - entities.ScaleUpBatch.fields.compounding_fee_pct
        excluded_because:
          difficulty_instance: combinatorial_formula / production_fee_tier_selected_from_pre_fee_material_cost
          rationale: "That instance pins material_cost_cents 446550 below the 500000 tier ceiling and asserts the tier stays 12.0 after the fee pushes the total across it."

