  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_approval_gated_on_a_sibling_engagement_state_plus_flag
        grounds:
          - validations[priority=60]
          - entities.TAEngagement.fields.state
          - entities.TAEngagement.fields.competency_verified
          - entities.LoanProduct.fields.requires_ta_completion
          - state_machines.TAEngagement.SCHEDULED_to_COMPLETED
          - state_machines.Loan.UNDERWRITING_to_APPROVED
        distinguishing_aspect: |
          The gate here is a CONJUNCTION of a sibling entity's state and one of its boolean
          attestations, reached through a third entity (the borrower) rather than through the
          loan's own parent: a COMPLETED engagement alone is not enough, it must also carry
          competency_verified true. The dependency is also asymmetric in time - the same
          engagement that unblocks approval does NOT re-price the loan, because ta_discount_bps
          was frozen at underwriting when only 4.00 hours had been delivered. The other
          instance in this rule reads the collective status set of an entity's OWN children.
        test_recipe:
          setup:
            - "One institution with a product whose requires_ta_completion is true and whose product_cap_cents is 100,000,000 so the fiscal rule never fires."
            - "A GEOCODED borrower with credit_score 740."
