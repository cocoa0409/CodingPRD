      - name: action_endpoints_drive_their_declared_transition
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/upfit/equipment-installations/{equipment_installation_id}/commission
          - state_machines.EquipmentInstallation
        distinguishing_aspect: |
          Each action endpoint moves its entity along exactly one declared edge and enforces that
          edge's preconditions.
        excluded_because:
          difficulty_instance: equipment_installation_commission_decommission_recommission_cycle
          rationale: |
            §1.8 walks install → commission → decommission → recommission on one row, asserting the
            state after every hop and the refusal of each trigger from the wrong state, which covers
            the action-endpoint claim for the richest action family in the scaffold.

  # =========================================================================
  # 6. From Table 6 (Errors) — every catalogued error_id must be triggerable
  # =========================================================================
  - section: errors
    instances:

      - name: every_entity_lookup_error_is_triggerable_not_found
        claim_type: Error Triggerability
        grounds:
          - errors
          - validations.priority_10_to_23_the_fourteen_not_found_rules
        distinguishing_aspect: |
          One instance per catalogued 404 would be fourteen copies of the same call, so this instance
          sweeps all fourteen entity lookups with a syntactically valid but unknown UUID and pins the
          error_id of each — the point being that each entity has its OWN code and that a generic
          ERR_NOT_FOUND is not acceptable.

          Coverage map for the remaining 51 codes in §1.6, so that no error in the catalog is
          untested across §1.8 and §1.9 together:
            - the five request-shape codes: §1.9 rbac (ERR_UNAUTHENTICATED / ERR_UNAUTHORIZED /
              ERR_CUSTOMER_SCOPE_VIOLATION / ERR_SEGREGATION_OF_DUTIES) and §1.9 entities
              Required Fields + Type Constraints (ERR_INVALID_REQUEST)
            - the two 412s: §1.9 cross_cutting_complexity_layers, one instance per §1.2.1 rule
            - ERR_DUPLICATE_VIN / ERR_DUPLICATE_CONFIG_CODE / ERR_DUPLICATE_ORDER_NUMBER,
              ERR_CONFIG_NOT_PUBLISHED, ERR_CONFIG_INVALID_STATE, ERR_INTERFACE_INVALID_STATE,
              ERR_CERTIFICATION_INVALID_STATE, ERR_SLOT_INVALID_STATE, ERR_SLOT_DATE_RANGE_INVALID,
              ERR_BAY_BODY_TYPE_UNSUPPORTED, ERR_PTO_NOT_PROVISIONED, ERR_BODY_ALREADY_INSTALLED and
              ERR_CHASSIS_WARRANTY_VOIDING_INTERFACE: the sibling battery instance below
            - ERR_ORDER_INVALID_STATE, ERR_CHASSIS_INVALID_STATE, ERR_INSTALLATION_INVALID_STATE:
              §1.9 state_machines and §1.8 allocate_chassis_blocked_while_unit_is_quarantined /
              equipment_installation_commission_decommission_recommission_cycle
            - ERR_GVWR_EXCEEDED / ERR_REAR_GAWR_EXCEEDED / ERR_FRONT_GAWR_EXCEEDED and
              ERR_IN_SERVICE_DATE_INFEASIBLE: §1.8 release_rear_gawr_outranks_in_service_date_infeasible
              and §1.9 in_service_date_exactly_at_the_earliest_feasible_boundary
            - ERR_PAYLOAD_SHORTFALL: §1.9 payload_shortfall_is_evaluated_from_the_result_of_the_weight_gates
            - ERR_MEASURED_CERTIFICATION_REQUIRED / ERR_CERTIFICATION_ORDER_MISMATCH: §1.8
              label_order_state_outranks_certification_order_mismatch
            - ERR_CHASSIS_OCCUPANCY_CONFLICT / ERR_BAY_CAPACITY_CONFLICT: §1.8
              chassis_exclusive_closed_interval_rejects_touching_endpoint and
              work_bay_aggregate_capacity_half_open_adjacency_allowed, plus §1.9
              queue_if_full_flag_converts_the_capacity_rejection_into_a_queued_slot
            - ERR_CHASSIS_NOT_AVAILABLE_BY_SLOT_START: §1.9 slot_that_starts_before_the_unit_arrives_is_rejected
            - ERR_CAB_TO_AXLE_INSUFFICIENT / ERR_WHEELBASE_INSUFFICIENT: §1.9
              cab_to_axle_outranks_wheelbase_at_configuration_create
            - ERR_AUX_ELECTRICAL_LOAD_EXCEEDED: §1.8 aux_electrical_load_exactly_at_chassis_ceiling_then_one_amp_over
            - ERR_PTO_FLOW_CAPACITY_EXCEEDED: §1.8 pto_flow_conservation_across_install_and_remove
            - ERR_HYDRAULIC_CIRCUIT_REQUIRED / ERR_NON_STANDARD_POOL_EQUIPMENT: §1.9
              hydraulic_circuit_check_outranks_the_pool_standardization_check
