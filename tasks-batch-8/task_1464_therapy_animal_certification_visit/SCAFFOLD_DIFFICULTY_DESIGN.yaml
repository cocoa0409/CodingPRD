            - { call: "POST /v1/teams", payload: { animal_id: "${a1}", team_name: "TE1" }, as: Handler, as_user_id: "${h1}", captures: { t1: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t1}" }, as: Handler, as_user_id: "${h1}", captures: { e1: $.data.id } }
            - { call: "POST /v1/handlers", payload: { full_name: "H E2", email: "he2@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h2: $.data.id } }
