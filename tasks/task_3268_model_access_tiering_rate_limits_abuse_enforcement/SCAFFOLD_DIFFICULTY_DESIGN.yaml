            - call: "GET /organizations/${org_at}"
              payload: {}
              as: PlatformAdmin
              captures: { tier_at: $.data.tier, spend_at: $.data.lifetime_spend_cents }
            - call: "GET /organizations/${org_below}"
              payload: {}
