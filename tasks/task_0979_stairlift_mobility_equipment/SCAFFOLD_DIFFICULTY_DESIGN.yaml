  # ===========================================================================
  # Rule 4: transitive_cascade (>=2 instances, depth>=3 and depth>=2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: removal_complete_four_hop_cascade
        grounds:
          - state_machines.RemovalJob.SCHEDULED_to_COMPLETED
          - state_machines.Agreement.REMOVAL_REQUESTED_to_REMOVED
          - state_machines.ServicePlan.ACTIVE_to_CANCELLED
          - state_machines.WarrantyClaim
        distinguishing_aspect: |
          Depth-4 cascade: POST /removal-jobs/{id}/complete → Agreement
          REMOVAL_REQUESTED→REMOVED → EquipmentUnit INSTALLED→REMOVED (and condition
          graded) → ServicePlan ACTIVE→CANCELLED → all open WarrantyClaims
          {SUBMITTED, UNDER_REVIEW, APPROVED} → DENIED with reason=AGREEMENT_REMOVED.
          Each link is caused by the previous link, not the original POST.
        test_recipe:
          setup:
            - "Agreement ACTIVE (PURCHASE, past cooling-off) with ServicePlan ACTIVE"
            - "One WarrantyClaim in UNDER_REVIEW, one in APPROVED (not yet PAID)"
            - "RemovalJob SCHEDULED"
          setup_api_calls:
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/product-models"
              payload: { model_code: "SL-STRAIGHT-100", kind: "STAIRLIFT", supports_curved: false, supports_outdoor: false, min_stair_width_mm: 700, base_purchase_price_cents: 380000, monthly_rental_rate_cents: 7500, install_labor_hours: 4 }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/customers"
              payload: { full_name: "Cascade Carol", date_of_birth: "1949-08-15", home_region_code: "EAST" }
              as: SalesRep
              captures: { cust_id: $.data.id , cust_v: $.data.version }
            - call: "POST /stairlift-ops/customers/${cust_id}/home-assessments"
              payload: { scheduled_date: "2026-06-02" }
              as: Assessor
              captures: { assess_id: $.data.id }
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/measure"
              payload: { staircase_kind: "STRAIGHT", stair_rise_mm: 2400, stair_run_mm: 3200, stair_width_mm: 800, landing_clearance_mm: 600, has_outdoor_exposure: false, electrical_outlet_within_2m: true }
              as: Assessor
            - call: "POST /stairlift-ops/home-assessments/${assess_id}/approve"
              payload: { model_code: "SL-STRAIGHT-100" }
              as: AssessmentReviewer
            - call: "POST /stairlift-ops/customers/${cust_id}/quotes"
              payload: { home_assessment_id: "${assess_id}", model_code: "SL-STRAIGHT-100", acquisition_mode: "PURCHASE" }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/issue"
              payload: {}
              as: SalesRep
            - call: "POST /stairlift-ops/equipment-units"
              payload: { model_code: "SL-STRAIGHT-100", serial_number: "SN-CC-001" }
              as: InventoryManager
              captures: { unit_id: $.data.id }
            - call: "POST /stairlift-ops/quotes/${quote_id}/accept"
              payload: { equipment_unit_id: "${unit_id}", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /stairlift-ops/agreements/${ag_id}/skip-funding"
              payload: {}
              as: FundingOfficer
            - call: "POST /stairlift-ops/agreements/${ag_id}/install-jobs"
              payload: { technician_crew_id: "CREW-D", scheduled_start_utc: "2026-06-10T09:00:00Z", scheduled_end_utc: "2026-06-10T13:00:00Z" }
              as: InstallCoordinator
              captures: { ij_id: $.data.id }
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /stairlift-ops/install-jobs/${ij_id}/start"
              payload: {}
              as: InstallCoordinator
            - call: "POST /stairlift-ops/install-jobs/${ij_id}/complete"
              payload: { measured_labor_hours: 4, installed_rail_length_m: 4.00 }
              as: InstallCoordinator
            - call: "POST /stairlift-ops/agreements/${ag_id}/service-plans"
              payload: { tier: "STANDARD" }
              as: InstallCoordinator
              captures: { sp_id: $.data.id }
            - call: "POST /stairlift-ops/agreements/${ag_id}/activate"
              payload: {}
              as: InstallCoordinator
            # Advance clock past 30-day cooling-off
            - call: "POST /stairlift-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            # Two claims
            - call: "POST /stairlift-ops/agreements/${ag_id}/warranty-claims"
              payload: { service_plan_id: "${sp_id}", claim_kind: "MECHANICAL", claimed_cents: 10000 }
              as: ClaimsAdjuster
              captures: { wc1_id: $.data.id }
            - call: "POST /stairlift-ops/agreements/${ag_id}/warranty-claims"
              payload: { service_plan_id: "${sp_id}", claim_kind: "ELECTRICAL", claimed_cents: 5000 }
              as: ClaimsAdjuster
              captures: { wc2_id: $.data.id }
            - call: "POST /stairlift-ops/warranty-claims/${wc1_id}/review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /stairlift-ops/warranty-claims/${wc2_id}/review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /stairlift-ops/warranty-claims/${wc2_id}/adjudicate"
              payload: { decision: "APPROVED", approved_cents: 5000 }
              as: ClaimsAdjuster
            # Schedule removal
            - call: "POST /stairlift-ops/agreements/${ag_id}/removal-jobs"
              payload: { technician_crew_id: "CREW-D", scheduled_start_utc: "2026-07-20T09:00:00Z", scheduled_end_utc: "2026-07-20T11:00:00Z" }
              as: InstallCoordinator
              captures: { rj_id: $.data.id }
          trigger:
            - call: "POST /stairlift-ops/removal-jobs/${rj_id}/complete"
              payload: { condition_grade_at_removal: "REFURB_A" }
              as: InstallCoordinator
          assert:
            - "Agreement.${ag_id}.status == REMOVED"
            - "EquipmentUnit.${unit_id}.status == REMOVED"
            - "EquipmentUnit.${unit_id}.condition_grade == REFURB_A"
            - "ServicePlan.${sp_id}.status == CANCELLED"
            - "WarrantyClaim.${wc1_id}.status == DENIED"
            - "WarrantyClaim.${wc1_id}.denial_reason == 'AGREEMENT_REMOVED'"
            - "WarrantyClaim.${wc2_id}.status == DENIED"
            - "WarrantyClaim.${wc2_id}.denial_reason == 'AGREEMENT_REMOVED'"

      - name: assessment_supersede_two_hop_cascade
        grounds:
          - state_machines.HomeAssessment
          - state_machines.Quote.DRAFT_to_SUPERSEDED
          - state_machines.Quote.ISSUED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (Quote issue path vs RemovalJob):
          creating a new SCHEDULED HomeAssessment on a Customer → any prior MEASURED
          HomeAssessment transitions to SUPERSEDED → any DRAFT or ISSUED Quote
