            - "Program required_clock_hours=1000, theory=600, externship=400, licensure_min_attendance_pct=0.9."
            - "Agreement ENROLLED; attendance built to exactly 0.9: 900 attended over 1000 scheduled (theory 600 of 600 scheduled at full + externship 400... use scheduled 1000 attended 900)."
            - "Hours: theory 600 (scheduled 600 attended 600 -> but need exactly 0.9). Use one THEORY entry scheduled 1000 attended... split: theory 600/600 + externship 400 scheduled 400 attended 300 gives 900/1000=0.9 but externship hours 300 < 400."
            - "Simplify: theory entry scheduled 600 attended 600; externship entry scheduled 500 attended 400 -> clock 1000, scheduled 1100... not 0.9. Use theory 600/660 + externship 400/440 -> 1000/1100=0.909. Pin exact: theory scheduled 600 attended 540, externship scheduled 500 attended 460 -> clock 1000 theory 540<600 fails theory req."
            - "Final pinned values: one THEORY entry scheduled 667 attended 600 (theory met), one EXTERNSHIP entry scheduled 444 attended 400 (externship met); clock=1000, scheduled_to_date=1111, attendance=1000/1111=0.9001 (>=0.9)."
