              as_user_id: "finance-filer-1"
              captures: { lf_v3: $.data.version }
            - call: "POST /host-community-agreements/${hca_id}/execute"
              payload: { expected_landfill_version: "${lf_v3}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
            - call: "POST /special-waste-approvals"
              payload: { landfill_id: "${lf_id}", generator_name: "Ridgeview Plating Co", waste_code: "IS-4410", profile_stream: "INDUSTRIAL_SPECIAL", approved_tons_cap: 500, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-07-31T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { swa_id: $.data.id }
            - call: "POST /special-waste-approvals/${swa_id}/approve"
              payload: { decision_reason: "Profile accepted" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { swa_state: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /operating-days"
              payload: { landfill_id: "${lf_id}", active_cell_id: "${c1_id}", operating_date: "2026-08-05T00:00:00Z", working_face_area_sf: 5000, cover_material_type: "ALTERNATIVE_TARP" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { od_id: $.data.id }
            - call: "POST /waste-loads"
              payload: { operating_day_id: "${od_id}", hauler_ref: "H-1", waste_stream: "INDUSTRIAL_SPECIAL", manifest_tons: 20.00, load_check_result: "PASS", special_waste_approval_id: "${swa_id}" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { wl1_id: $.data.id }
            - call: "POST /waste-loads"
              payload: { operating_day_id: "${od_id}", hauler_ref: "H-2", waste_stream: "MSW", manifest_tons: 30.00, load_check_result: "PASS" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { wl2_id: $.data.id }
          trigger:
            - call: "POST /waste-loads/${wl1_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /waste-loads/${wl2_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { wl2_screen: $.data.screening_status, wl2_gate: $.data.gate_charge_amount }
            - call: "GET /special-waste-approvals/${swa_id}"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { swa_state2: $.data.status, swa_tons: $.data.consumed_tons }
          assert:
            - "${swa_state} == 'APPROVED' before the clock moves"
            - "${err1} == 'ERR_APPROVAL_EXPIRED' with HTTP 422 — 2026-08-05 is past expires_on 2026-07-31 on both readings (the day's operating_date and the logical clock)"
            - "WasteLoad.${wl1_id} is unchanged: screening_status 'PENDING', billing_status 'UNBILLED', gate_charge_amount null"
            - "${wl2_screen} == 'CLEARED' and ${wl2_gate} == 1387.50 — the same day still accepts an ordinary load, so the failure is specific to the expired reference"
            - "${swa_state2} == 'APPROVED' and ${swa_tons} == 0 — the rejected clearing accrued no tonnage"

      - name: slot_capacity_one_rejects_the_overlap_that_capacity_two_accepts
        claim_type: conditional_validation
        grounds:
          - validations[priority=19]
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
          - entities.TreatmentAgreement.fields.concurrent_slot_capacity
        distinguishing_aspect: "The rule fires only relative to the agreement's own configured slot capacity: the identical pair of overlapping windows is refused under capacity 1 and accepted under capacity 2, and the occupancy count is per agreement rather than per landfill."
        test_recipe:
          setup:
            - "Landfill LF (OPEN) with TreatmentAgreement TA-1 (concurrent_slot_capacity 1) and TA-2 (capacity omitted, so the default 2 applies), both effective across 2026 with daily_gallon_cap 20000."
            - "One SCHEDULED shipment of 2000 gallons on each agreement over the half-open window [08:00, 12:00) of 2026-08-01."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Narrow POTW", daily_gallon_cap: 20000, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", concurrent_slot_capacity: 1 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta1_id: $.data.id }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta2_id: $.data.id, ta2_slots: $.data.concurrent_slot_capacity }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta1_id}", gallons: 2000, window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta2_id}", gallons: 2000, window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta1_id}", gallons: 2000, window_start: "2026-08-01T10:00:00Z", window_end: "2026-08-01T14:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta2_id}", gallons: 2000, window_start: "2026-08-01T10:00:00Z", window_end: "2026-08-01T14:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s4_state: $.data.status }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta1_id}", gallons: 2000, window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T16:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { s5_state: $.data.status }
          assert:
            - "${ta2_slots} == 2 from the declared default"
            - "${err1} == 'ERR_SLOT_CAPACITY_EXCEEDED' with HTTP 409 — TA-1 already has one occupant covering 10:00 and its capacity is 1"
            - "${s4_state} == 'SCHEDULED' — the identical window pair is legal on TA-2 because its capacity is 2"
            - "${s5_state} == 'SCHEDULED' — the window [12:00, 16:00) merely touches [08:00, 12:00) and windows are half-open, so it does not occupy a concurrent slot even under capacity 1"
            - "TreatmentAgreement.${ta1_id}.scheduled_gallons_today == 4000 (shipments S-1 and the touching one) and TreatmentAgreement.${ta2_id}.scheduled_gallons_today == 4000, both well under the 20000 daily cap"

      - name: the_higher_priority_error_is_returned_when_two_rules_fail
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: prohibited_material_outranks_special_waste_tonnage_cap   # §1.8 rule: priority_pair_validation_conflict
          rationale: "That §1.8 instance fails priority 11 and priority 25 in one request and asserts ERR_PROHIBITED_MATERIAL is returned, then fixes only the load check to expose the lower rung."

      - name: distant_ladder_rungs_resolve_in_declared_order
        claim_type: priority_conflict
        grounds:
          - validations[priority=14]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: gas_corrective_action_outranks_financial_assurance_shortfall   # §1.8 rule: priority_pair_validation_conflict
          rationale: "That §1.8 instance breaks rungs 14 and 27 with one single request to POST /cells/{cell_id}/authorize-waste-placement and asserts the 409 from rung 14 rather than the 402 from rung 27."

      - name: load_pricing_validity_depends_on_the_live_host_agreement
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=24]
        excluded_because:
          difficulty_instance: billing_depends_on_which_host_agreement_is_live   # §1.8 rule: cross_entity_state_dependency
          rationale: "That §1.8 instance clears loads with no live agreement (ERR_NO_EXECUTED_HOST_AGREEMENT), with an EXECUTED one and with an UNDER_AMENDMENT one, which is the cross-entity validity claim."

      - name: individually_legal_shipments_can_breach_the_collective_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority=26]
          - validations[priority=19]
        excluded_because:
          difficulty_instance: leachate_slot_occupancy_is_half_open_and_survives_state_changes   # §1.8 rule: resource_temporal_overlap
          rationale: "That §1.8 instance builds a day of individually small shipments that collectively hit the 20000 gallon cap exactly and then exceed it, and it also counts concurrent occupancy, covering the aggregate claim."

      - name: the_integrity_check_runs_before_the_state_gate_it_would_mask
        claim_type: cascading_validation
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cross_site_reference_outranks_cell_not_accepting_waste   # §1.8 rule: priority_pair_validation_conflict
          rationale: "That §1.8 instance shows the cross-site integrity check at rung 7 running before the cell-state gate at rung 10, so the later check never sees a foreign row."

  # NOTE: the Bulk-action row of the endpoint table has no instance because §1.5
  # declares no bulk endpoint; every write acts on exactly one row.
  - section: endpoints
    instances:

      - name: gas_well_crud_surface_reads_back_what_the_writes_stored
        claim_type: standard_crud
        grounds:
          - endpoints[POST /gas-wells]
          - endpoints[GET /gas-wells/{gas_well_id}]
          - endpoints[GET /gas-wells]
          - endpoints[GET /cells/{cell_id}/gas-wells]
        distinguishing_aspect: "The same GasWell must be reachable three ways — by id, through the filtered collection and through the cell sub-resource — and the well_code uniqueness scope is the LANDFILL, so two cells of one site cannot share a code while a second site can."
        test_recipe:
          setup:
            - "Landfill LF with two cells C-1 and C-2, both still in DESIGN (well creation does not require a placed cell)."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-2", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /gas-wells"
              payload: { cell_id: "${c1_id}", well_code: "W-1", depth_ft: 85 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { w1_id: $.data.id, w1_state: $.data.status, w1_depth: $.data.depth_ft }
            - call: "POST /gas-wells"
              payload: { cell_id: "${c1_id}", well_code: "W-2", depth_ft: 90 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { w2_id: $.data.id }
            - call: "GET /gas-wells/${w1_id}"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { got_code: $.data.well_code, got_cell: $.data.cell_id }
            - call: "GET /gas-wells"
              payload: { cell_id: "${c1_id}", limit: 10, offset: 0 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
            - call: "GET /cells/${c2_id}/gas-wells"
              payload: {}
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
          assert:
            - "both creates return HTTP 201 with status 'DRILLED', version 1 and last_tuned_at null; ${w1_state} == 'DRILLED' and ${w1_depth} == 85"
            - "${got_code} == 'W-1' and ${got_cell} == '${c1_id}' — the read-back matches the write"
            - "trigger 4 returns 2 items with total_count 2 (W-1 and W-2)"
            - "trigger 5 returns 0 items with total_count 0 — C-2 has no wells, and the sub-resource never leaks its sibling's rows"
            - "no update or delete endpoint exists for GasWell in §1.5; the row changes only through its declared action endpoints"

      - name: the_operating_status_action_closes_the_site_and_then_locks_it
        claim_type: action_endpoint
        grounds:
          - state_machines.Landfill.OPEN_to_CLOSED
          - endpoints[POST /landfills/{landfill_id}/operating-status]
        distinguishing_aspect: "One endpoint drives several posture edges chosen by its operating_status body value; the CLOSED edge demands every cell be in {CLOSED, REJECTED, DESIGN} and, once taken, is terminal, so the very same endpoint must then refuse."
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 in DESIGN and Cell C-2 moved to UNDER_CONSTRUCTION."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-2", design_airspace_cy: 200, design_area_sf: 45001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-20T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /cells/${c2_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
          trigger:
            - call: "POST /landfills/${lf_id}/operating-status"
              payload: { operating_status: "CLOSED" }
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /landfills/${lf_id}/operating-status"
              payload: { operating_status: "OPEN" }
              as: PlatformAdmin
              captures: { state_open: $.data.operating_status }
            - call: "GET /cells"
              payload: { landfill_id: "${lf_id}", status: "UNDER_CONSTRUCTION" }
              as: PlatformAdmin
            - call: "POST /landfills/${lf_id}/operating-status"
              payload: { operating_status: "CLOSED" }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == 'ERR_INVALID_STATE_TRANSITION' with HTTP 409 — C-2 is UNDER_CONSTRUCTION, which is not in {CLOSED, REJECTED, DESIGN}"
            - "${state_open} == 'OPEN' — the same endpoint's OPEN edge is legal from OPEN and leaves the site open"
            - "trigger 3 still reports total_count 1, so the refused close changed nothing"
            - "${err2} == 'ERR_INVALID_STATE_TRANSITION' with HTTP 409 for the same reason on the retry; the site stays OPEN with version unchanged since trigger 2"

      - name: estimate_certification_by_its_own_filer_is_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.ClosureCostEstimate.DRAFT_to_CERTIFIED
        distinguishing_aspect: "The certify action is allowed for the FinanceOfficer role in general but forbidden for the specific user who filed the estimate, so authorisation depends on the row's stored actor rather than on the role alone — and a different FinanceOfficer then succeeds against the same row."
        test_recipe:
          setup:
            - "Landfill LF with a DRAFT estimate for 2026 filed by the FinanceOfficer user finance-filer-1 (no certified cells, so the required amount is the post-closure leg only)."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id, lf_v1: $.data.version }
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v1}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_id: $.data.id, est_state0: $.data.status }
          trigger:
            - call: "POST /closure-cost-estimates/${est_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { err1: $.data.error_id }
            - call: "GET /closure-cost-estimates/${est_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_state1: $.data.status }
            - call: "POST /closure-cost-estimates/${est_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-certifier-2"
              captures: { est_state: $.data.status, est_req: $.data.required_assurance_amount }
          assert:
            - "${est_state0} == 'DRAFT' — the row was filed by the X-User-ID finance-filer-1, which the server retains for the duties check"
            - "${err1} == 'ERR_SEGREGATION_OF_DUTIES' with HTTP 403 and ${est_state1} == 'DRAFT' — the refused certification changed nothing"
            - "${est_state} == 'CERTIFIED' for the second, different FinanceOfficer on the same row"
            - "${est_req} == 4519664.50 — no cell is in the closure basis, so only the post-closure leg counts"

      - name: the_projection_read_returns_derived_data_not_stored_data
        claim_type: computed_read
        grounds:
          - endpoints[GET /landfills/{landfill_id}/remaining-life-projection]
        excluded_because:
          difficulty_instance: remaining_life_survey_based_vs_ledger_based_divergence   # §1.8 rule: dual_variant_calc
          rationale: "That §1.8 instance reads the projection endpoint under both variants and asserts variant, density, remaining_life_years and source_survey_id, which is the computed-read claim for the only computed-read endpoint in §1.5."

      - name: linking_a_load_to_an_approval_associates_both_rows
        claim_type: cross_reference_link
        grounds:
          - entities.WasteLoad.fields.special_waste_approval_id
        excluded_because:
          difficulty_instance: amend_rebases_special_waste_tonnage_and_reverses_exhaustion   # §1.8 rule: compensating_invariant
          rationale: "That §1.8 instance creates loads that reference a SpecialWasteApproval, asserts the approval's consumed_tons moves with the link, and reads the association back through the approval filter on GET /waste-loads."

  - section: errors
    instances:

      - name: every_entity_type_reports_its_own_not_found_error_id
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_LANDFILL_NOT_FOUND]
          - errors[ERR_CELL_NOT_FOUND]
          - errors[ERR_LINER_QA_PACKAGE_NOT_FOUND]
          - errors[ERR_AERIAL_SURVEY_NOT_FOUND]
          - errors[ERR_OPERATING_DAY_NOT_FOUND]
          - errors[ERR_WASTE_LOAD_NOT_FOUND]
          - errors[ERR_SPECIAL_WASTE_APPROVAL_NOT_FOUND]
          - errors[ERR_TREATMENT_AGREEMENT_NOT_FOUND]
          - errors[ERR_LEACHATE_SHIPMENT_NOT_FOUND]
          - errors[ERR_GAS_WELL_NOT_FOUND]
          - errors[ERR_SURFACE_EMISSION_SCAN_NOT_FOUND]
          - errors[ERR_CLOSURE_COST_ESTIMATE_NOT_FOUND]
          - errors[ERR_HOST_COMMUNITY_AGREEMENT_NOT_FOUND]
        distinguishing_aspect: "All thirteen entity-specific 404 ids must be individually reachable through the by-id read of their own entity; a single shared 'not found' id would satisfy none of these thirteen assertions."
        test_recipe:
