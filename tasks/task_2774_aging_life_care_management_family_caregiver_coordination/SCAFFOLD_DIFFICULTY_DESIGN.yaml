  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: discharged_client_beats_daily_cap_on_time_entry_creation
        grounds:
          - validations[priority=41]
          - validations[priority=72]
          - errors[ERR_CLIENT_NOT_IN_SERVICE]
          - errors[ERR_DAILY_CAP_EXCEEDED]
          - state_machines.Client.PROSPECT_to_DISCHARGED
        distinguishing_aspect: |
          Category pair `state` (priority 41, ERR_CLIENT_NOT_IN_SERVICE) versus `business_fiscal`
          (priority 72, ERR_DAILY_CAP_EXCEEDED): one POST /care/time-entries call violates both, and
          the lower-numbered state check must win, proven against a control client where only the
          fiscal rule is violated and ERR_DAILY_CAP_EXCEEDED is returned instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "Care manager Dana with hourly_rate_cents 22500."
            - "Client Eleanor (billing_increment_min 15) with 540 + 60 = 600 rounded minutes already logged by Dana on service_date 2026-08-10, then DISCHARGED."
            - "Control client Frances (billing_increment_min 15) with 540 + 60 = 600 rounded minutes already logged by Dana on service_date 2026-08-11, left in PROSPECT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Eleanor Whitfield", residence_setting: "PRIVATE_HOME", billing_increment_min: 15 }
              as: PracticeAdmin
              captures: { cli_e: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Frances Ortega", residence_setting: "PRIVATE_HOME", billing_increment_min: 15 }
              as: PracticeAdmin
              captures: { cli_f: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_e}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T18:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_e1: $.data.id, te_e1_min: $.data.rounded_minutes }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_e}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-10T18:00:00Z", end_at: "2026-08-10T19:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_e2: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_f}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-11T09:00:00Z", end_at: "2026-08-11T18:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_f1: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_f}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-11T18:00:00Z", end_at: "2026-08-11T19:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_f2: $.data.id }
            - call: "PATCH /care/clients/${cli_e}/state"
              payload: { to_state: "DISCHARGED", reason: "Client died; engagement closed." }
              as: PracticeAdmin
              captures: { e_state: $.data.status }
          trigger:
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_e}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-10T19:00:00Z", end_at: "2026-08-10T19:15:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_dual: $.data.error_id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_f}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-11T19:00:00Z", end_at: "2026-08-11T19:15:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_cap: $.data.error_id }
          assert:
            - "TimeEntry.${te_e1}.rounded_minutes == 540 and TimeEntry.${te_e2}.rounded_minutes == 60 (600 exactly, which passes)"
            - "Client.${cli_e}.status == DISCHARGED"
            - "The dual-violation call returns HTTP 409 with error_id ERR_CLIENT_NOT_IN_SERVICE, NOT ERR_DAILY_CAP_EXCEEDED"
            - "The control call returns HTTP 422 with error_id ERR_DAILY_CAP_EXCEEDED, proving the fiscal rule was live and only lost on priority"
            - "No TimeEntry row exists with start_at == 2026-08-10T19:00:00Z"
            - "No TimeEntry row exists with start_at == 2026-08-11T19:00:00Z"

