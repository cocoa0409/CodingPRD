              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /referrals"
