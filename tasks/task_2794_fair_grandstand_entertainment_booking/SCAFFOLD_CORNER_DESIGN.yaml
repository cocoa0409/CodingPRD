          setup:
            - "Canonical edition, stage, agent and artist; one offer with response_window_hours 48."
            - "The offer is sent at 2026-08-01T00:00:00.000Z, so expires_at_utc is 2026-08-03T00:00:00.000Z."
            - "The offer version is captured right after the send (before the counter) so that the same value is guaranteed stale once the agent's counter has incremented it -- the counter does not re-stamp expires_at_utc."
            - "The clock is then set to exactly 2026-08-03T00:00:00.000Z: the precondition is 'clock < expires_at_utc', so equality is already lapsed."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
