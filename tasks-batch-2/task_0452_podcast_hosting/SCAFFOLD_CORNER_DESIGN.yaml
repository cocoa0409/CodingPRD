  - section: errors
    instances:
      - name: pay_statement_with_zero_net_returns_nothing_to_pay
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOTHING_TO_PAY]", state_machines.PayoutStatement.FINALIZED_to_PAID]
        distinguishing_aspect: "A FINALIZED statement with net_payable_cents==0 (no delivered placements in window) → ERR_NOTHING_TO_PAY (409) on pay."
        test_recipe:
          setup: ["Publisher with no delivered placements; DRAFT statement then FINALIZED (net 0)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "PubNp", payout_email: "pnp@x.com", revenue_share_pct: 0.70 }
              as: PlatformAdmin
              captures: { pubNp: $.data.id }
            - call: "POST /payout-statements"
              payload: { publisher_id: "${pubNp}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { psNp: $.data.id }
            - call: "POST /payout-statements/${psNp}/finalize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payout-statements/${psNp}/pay"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "PayoutStatement.${psNp}.net_payable_cents == 0"
            - "response.status == 409"
            - "response.data.error_id == ERR_NOTHING_TO_PAY"

      - name: stale_campaign_version_on_create_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_CAMPAIGN_VERSION]", "concurrency_rules[placement-create-stale-campaign]"]
        excluded_because:
          difficulty_instance: optimistic_concurrency / placement_create_stale_campaign_version_rejected
          rationale: "OCC stale-version 412 is the assertion of the named §1.8 instance."

      - name: midroll_overlap_error_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_MIDROLL_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / midroll_halfopen_plus_buffer_overlap_on_episode
