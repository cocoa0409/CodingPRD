          assert:
            - "first cycle chain == [DEPARTMENT, PURCHASING]; after edit+resubmit chain == [DEPARTMENT] (chain is re-pinned, not retained)"
            - "final status == APPROVED with a single DEPARTMENT approval in the second cycle"
            - "approvals audit retains both cycles: decisions == [RETURNED, APPROVED] in created_at order"
            - "Requisition.version == 6 (create 1, submit 2, return 3, PATCH 4, resubmit 5, approve 6)"

      - name: contract_negotiation_round_cycle
        grounds:
          - state_machines.Contract.UNDER_REVIEW_to_IN_NEGOTIATION
          - state_machines.Contract.IN_NEGOTIATION_to_UNDER_REVIEW
          - entities.Contract.fields.negotiation_round
        distinguishing_aspect: |
          Cyclic machine on Contract (different entity than the requisition loop): the
          UNDER_REVIEW -> IN_NEGOTIATION -> UNDER_REVIEW loop runs twice and
          negotiation_round increments exactly on loop entry (== 2); from EXECUTED the
          negotiate trigger is rejected.
        test_recipe:
          setup:
            - "ACTIVE vendor; contract C in DRAFT (period [2026-01-01, 2027-01-01))"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "ContractorCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", commodity_code: "LAB", value_cents: 9000000, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: ContractOfficer
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /contracts/${c_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/negotiate"
              payload: { note: "round 1: liability cap" }
              as: ContractOfficer
              captures: { round_1: $.data.negotiation_round }
            - call: "POST /contracts/${c_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/negotiate"
              payload: { note: "round 2: payment terms" }
              as: ContractOfficer
              captures: { round_2: $.data.negotiation_round }
            - call: "POST /contracts/${c_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/approve-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/execute"
              as: ProcurementDirector
              captures: { c_status: $.data.status }
            - call: "POST /contracts/${c_id}/negotiate"
              payload: { note: "round 3 attempt" }
              as: ContractOfficer
              captures: { err: $.data.error_id }
          assert:
            - "negotiation_round == 1 after first negotiate and == 2 after the second (increments on loop entry only, not on resubmission)"
            - "status == EXECUTED after the loop plus approve-review and execute"
            - "negotiate from EXECUTED rejected: err == ERR_CONTRACT_STATE_INVALID"

      - name: po_fulfillment_match_parallel_dimensions
        grounds:
          - state_machines.PurchaseOrder
          - entities.PurchaseOrder.fields.fulfillment_status
          - entities.PurchaseOrder.fields.match_status
        distinguishing_aspect: |
          Parallel state dimensions on PurchaseOrder (different shape than the two
          cycles): a receipt drives ISSUED -> PARTIALLY_RECEIVED while an invoice
          mismatch drives match_status UNMATCHED -> EXCEPTION; completing receiving
          reaches FULLY_RECEIVED WITHOUT clearing the EXCEPTION, proving the two axes
          evolve independently until the exception is resolved.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor; requisition 1 line qty 2 @ 300,000 (total 600,000) APPROVED and issued as PO"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Theater", cost_center: "CC-700", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "StageCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "THR", description: "spots", quantity: 2, unit_price_cents: 300000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { fs_1: $.data.fulfillment_status, ms_1: $.data.match_status }
            - call: "POST /purchase-orders/${po_id}/invoices"
              payload: { invoice_number: "INV-P", lines: [{ line_no: 0, quantity: 2, unit_price_cents: 300000 }] }
              as: APClerk
              captures: { inv_id: $.data.id, inv_status: $.data.status, inv_reason: $.data.exception_reason }
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { fs_2: $.data.fulfillment_status, ms_2: $.data.match_status }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { fs_3: $.data.fulfillment_status, ms_3: $.data.match_status }
            - call: "POST /invoices/${inv_id}/resolve-exception"
              payload: { action: "ACCEPT_VARIANCE" }
              as: APClerk
              as_user_id: "ap-1"
              captures: { inv_status_2: $.data.status }
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { fs_4: $.data.fulfillment_status, ms_4: $.data.match_status }
          assert:
            - "after first receipt: fulfillment PARTIALLY_RECEIVED, match UNMATCHED"
            - "invoice for qty 2 against received qty 1 lands EXCEPTION with exception_reason QTY_OVER_RECEIPT; fulfillment stays PARTIALLY_RECEIVED (invoice does not touch the fulfillment axis)"
            - "after completing receipt: fulfillment FULLY_RECEIVED while match REMAINS EXCEPTION (receiving does not clear the match axis)"
            - "after ACCEPT_VARIANCE re-match passes: invoice PAYABLE and match_status MATCHED while fulfillment stays FULLY_RECEIVED"

  - rule_id: transitive_cascade
    instances:
      - name: contract_termination_four_hop_cascade
        grounds:
          - state_machines.Contract.EXECUTED_to_TERMINATED
          - entities.PurchaseOrder.fields.contract_terminated_flag
          - state_machines.Invoice.PAYABLE_to_EXCEPTION
        distinguishing_aspect: |
          Depth-3 cascade from contract terminate (different trigger than the vendor
          cascade): Contract TERMINATED -> PO contract_terminated_flag=true (match
          EXCEPTION) -> the PO's PAYABLE invoice flips to EXCEPTION/CONTRACT_TERMINATED
          (caused by the PO flag change) -> a still-APPROVED requisition riding the
          contract is RETURNED (caused by the termination itself); payment is then
          blocked on the excepted invoice.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor V; contract C (commodity LAB) EXECUTED"
            - "R1 (contract C, 400,000) APPROVED -> PO1 issued -> fully received -> invoice INV1 PAYABLE"
            - "R2 (contract C, 300,000) APPROVED, not yet issued"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Medicine", cost_center: "CC-800", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "MedSupply" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", commodity_code: "LAB", value_cents: 9000000, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: ContractOfficer
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/approve-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/execute"
              as: ProcurementDirector
              captures: { c_ver: $.data.version }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", contract_id: "${c_id}", lines: [{ commodity_code: "LAB", description: "gloves", quantity: 1, unit_price_cents: 400000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r1_id}/issue-po"
              as: Buyer
              captures: { po1_id: $.data.id, po1_pin: $.data.contract_version_pinned }
            - call: "POST /purchase-orders/${po1_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
            - call: "POST /purchase-orders/${po1_id}/invoices"
              payload: { invoice_number: "INV-C1", lines: [{ line_no: 0, quantity: 1, unit_price_cents: 400000 }] }
              as: APClerk
              captures: { inv1_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", contract_id: "${c_id}", lines: [{ commodity_code: "LAB", description: "masks", quantity: 1, unit_price_cents: 300000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
          trigger:
            - call: "POST /contracts/${c_id}/terminate"
              payload: { reason: "vendor breach" }
              as: ProcurementDirector
              captures: { c_status: $.data.status }
            - call: "GET /purchase-orders/${po1_id}"
              as: ProcurementAdmin
              captures: { po1_ms: $.data.match_status, po1_flag: $.data.contract_terminated_flag }
            - call: "GET /invoices/${inv1_id}"
              as: ProcurementAdmin
              captures: { inv1_status: $.data.status, inv1_reason: $.data.exception_reason }
            - call: "GET /requisitions/${r2_id}"
              as: ProcurementAdmin
              captures: { r2_status: $.data.status, r2_reason: $.data.returned_reason }
            - call: "POST /invoices/${inv1_id}/pay"
              as: APClerk
              as_user_id: "ap-1"
              captures: { err: $.data.error_id }
          assert:
            - "PO1.contract_version_pinned == the pre-termination contract version captured at execute (pinning survives the terminate)"
            - "Contract TERMINATED; PO1 contract_terminated_flag == true and match_status == EXCEPTION"
            - "INV1 -> EXCEPTION with exception_reason == CONTRACT_TERMINATED (hop 3 caused by hop 2)"
            - "R2 -> RETURNED with returned_reason == CONTRACT_TERMINATED (still-APPROVED requisitions are sent back for re-sourcing)"
            - "pay on the excepted invoice rejected: err == ERR_INVOICE_NOT_PAYABLE"

      - name: vendor_suspension_award_unwind_cascade
        grounds:
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
          - state_machines.Quote.AWARDED_to_DISQUALIFIED
          - state_machines.BidSolicitation.AWARDED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 cascade from vendor suspend (different trigger than contract
          terminate): suspending the AWARDED vendor disqualifies its awarded quote,
          which cancels the AWARDED solicitation, which returns the requisition whose
          PURCHASING gate depended on that award — each hop caused by the previous one;
          an earlier suspension of a non-winning vendor only disqualifies its quote and
          is excluded from the eligible pool at close.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendors V2,V3,V4,V5 (no certifications, tier NONE)"
            - "Requisition R total 3,000,000 to be competitively sourced: SUBMITTED, DEPARTMENT step approved; solicitation OPEN (deadline 2026-08-08); 4 quotes: V2 2,900,000 / V3 3,100,000 / V4 3,000,000 / V5 3,200,000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /departments"
              payload: { name: "Athletics", cost_center: "CC-900", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V2" }
              as: Buyer
              captures: { v2_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V3" }
              as: Buyer
              captures: { v3_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V4" }
              as: Buyer
              captures: { v4_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V5" }
              as: Buyer
              captures: { v5_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v2_id}", lines: [{ commodity_code: "ATH", description: "turf", quantity: 1, unit_price_cents: 3000000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/solicitations"
              payload: { response_deadline: "2026-08-08T00:00:00Z" }
              as: Buyer
              captures: { s_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${v2_id}", price_cents: 2900000 }
              as: Buyer
              captures: { q2_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${v3_id}", price_cents: 3100000 }
              as: Buyer
              captures: { q3_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${v4_id}", price_cents: 3000000 }
              as: Buyer
              captures: { q4_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${v5_id}", price_cents: 3200000 }
              as: Buyer
              captures: { q5_id: $.data.id }
          trigger:
            - call: "POST /vendors/${v2_id}/suspend"
              payload: { reason: "debarment review" }
              as: ProcurementAdmin
            - call: "GET /solicitations/${s_id}/quotes"
              as: ProcurementAdmin
              captures: { q2_status: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /solicitations/${s_id}/close"
              as: Buyer
            - call: "POST /solicitations/${s_id}/award"
              as: ProcurementDirector
              captures: { awarded: $.data.awarded_quote_id }
            - call: "POST /vendors/${v4_id}/suspend"
              payload: { reason: "sanctions hit" }
              as: ProcurementAdmin
            - call: "GET /solicitations/${s_id}"
              as: ProcurementAdmin
              captures: { s_status: $.data.status }
            - call: "GET /requisitions/${r_id}"
              as: ProcurementAdmin
              captures: { r_status: $.data.status, r_reason: $.data.returned_reason }
            - call: "GET /vendors/${v4_id}/quotes"
              as: ProcurementAdmin
              captures: { q4_status: "$.data[0].status" }
          assert:
            - "hop 1: V2's SUBMITTED quote -> DISQUALIFIED on suspension (eligible pool shrinks before close)"
            - "award winner == quote V4 (score 70.00 = 0.70*100; V3 67.74, V5 65.63; V2 excluded from the pool) and requisition vendor_id becomes V4"
            - "hop 2-4 after suspending V4: awarded quote DISQUALIFIED, solicitation CANCELLED, requisition RETURNED with returned_reason VENDOR_SUSPENDED"
            - "each later hop fires only because the previous hop fired (quotes NOT_AWARDED of V3/V5 remain NOT_AWARDED, not DISQUALIFIED)"

      - name: pcard_cycle_close_escalation_cascade
        grounds:
          - calculations.reconciliation_aging
          - state_machines.PCard.ACTIVE_to_SUSPENDED
          - state_machines.LimitElevation.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from the close-cycle checkpoint (different trigger than the
          two manual cascades): closing a cycle with unreconciled debits ages the card
          (counter 1), the SECOND dirty close escalates the card to SUSPENDED (caused by
          the counter threshold), which cancels the card's SCHEDULED elevation (caused
          by the suspension) — while utilization resets to the new cycle even though the
          old debits remain POSTED.
        test_recipe:
          setup:
            - "Department; P-card (single 100,000, monthly 500,000, MCC unrestricted)"
            - "Cycle 0: two unreconciled debits (50,000 + 40,000), then close-cycle (counter -> 1)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Library", cost_center: "CC-1000", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Pat", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 50000, entry_type: "DEBIT", merchant_name: "Amazon", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 40000, entry_type: "DEBIT", merchant_name: "B&N", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcards/${pc_id}/close-cycle"
              as: ProcurementAdmin
              captures: { cyc1: $.data.cycle_index, cons1: $.data.consecutive_unreconciled_cycles }
            - call: "POST /pcards/${pc_id}/elevations"
              payload: { elevated_single_txn_limit_cents: 200000, window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-22T00:00:00Z" }
              as: ProcurementAdmin
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 30000, entry_type: "DEBIT", merchant_name: "Amazon", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcards/${pc_id}/close-cycle"
              as: ProcurementAdmin
              captures: { cyc2: $.data.cycle_index, cons2: $.data.consecutive_unreconciled_cycles, card_status: $.data.status }
            - call: "GET /pcards/${pc_id}/elevations"
              as: ProcurementAdmin
              captures: { e_status: "$.data[0].status" }
            - call: "GET /pcards/${pc_id}"
              as: ProcurementAdmin
              captures: { util: $.data.utilization_cents, avail: $.data.available_credit_cents }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 10000, entry_type: "DEBIT", merchant_name: "Amazon", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first close: consecutive_unreconciled_cycles == 1, cycle_index == 1, card stays ACTIVE"
            - "second close: counter == 2 hits the inclusive SUSPEND_AFTER threshold -> card SUSPENDED, cycle_index == 2"
            - "cascade hop 3: the SCHEDULED elevation -> CANCELLED (caused by the suspension, not the close itself)"
            - "utilization_cents == 0 and available_credit_cents == 500000 in the fresh cycle even though 120,000 of old debits remain POSTED"
            - "new posting rejected: err == ERR_CARD_NOT_ACTIVE (state gate, not a funds gate)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_mask_fiscal_on_returned_requisition
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_REQUISITION_NOT_IN_APPROVAL]
          - errors[ERR_GRANT_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Pair state vs business_fiscal: on a RETURNED requisition whose grant could
          never fund it (charge 608,000 > remaining 500,000), approve-step answers the
          p6 state error ERR_REQUISITION_NOT_IN_APPROVAL, never the p11 fiscal error.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor; grant award 500,000 (F&A 0.52, categories SUPPLIES)"
            - "Grant-funded requisition 1 x SUPPLIES 400,000 (charge 608,000) SUBMITTED, DEPARTMENT step approved, then RETURNED at the GRANT_COMPLIANCE step"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Geology", cost_center: "CC-1100", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "RockCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "G-SM", sponsor: "NASA", total_award_cents: 500000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "GEO", description: "cores", quantity: 1, unit_price_cents: 400000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/return-step"
              payload: { reason: "scope question" }
              as: GrantOfficer
              as_user_id: "grant-officer-1"
          trigger:
            - call: "POST /requisitions/${r_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
              captures: { err: $.data.error_id }
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { enc: $.data.encumbered_cents }
          assert:
            - "err == ERR_REQUISITION_NOT_IN_APPROVAL (p6 state), NOT ERR_GRANT_BUDGET_EXCEEDED (p11 fiscal), although the requisition's charge 608,000 exceeds the grant's 500,000 remaining"
            - "grant encumbered_cents == 0 (no partial side effect from the masked fiscal check)"

      - name: priority_safety_mask_referential_on_submit
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_GRANT_CATEGORY_NOT_ALLOWABLE]
          - errors[ERR_VENDOR_SUSPENDED]
        distinguishing_aspect: |
          Pair business_safety vs business_referential (different categories than
          state/fiscal): submitting a grant-funded requisition whose line category is
          non-allowable AND whose vendor is SUSPENDED returns the p7 compliance error
          ERR_GRANT_CATEGORY_NOT_ALLOWABLE (422), never the p10 referential error.
        test_recipe:
          setup:
            - "Department; vendor VS suspended; grant with allowed_categories [SUPPLIES]"
            - "Requisition on that vendor and grant with a TRAVEL line (100,000)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "History", cost_center: "CC-1200", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "TravelCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/suspend"
              payload: { reason: "audit hold" }
              as: ProcurementAdmin
            - call: "POST /grants"
              payload: { grant_code: "G-CAT", sponsor: "Mellon", total_award_cents: 5000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "HIS", description: "archive trip", quantity: 1, unit_price_cents: 100000, cost_category: "TRAVEL" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err: $.data.error_id }
            - call: "GET /requisitions/${r_id}"
              as: ProcurementAdmin
              captures: { r_status: $.data.status }
          assert:
            - "err == ERR_GRANT_CATEGORY_NOT_ALLOWABLE (p7 safety), NOT ERR_VENDOR_SUSPENDED (p10 referential), although both conditions hold"
            - "requisition stays DRAFT (no partial submit side effects: submitted_at remains null)"

      - name: priority_existence_mask_state_on_patch
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_GRANT_NOT_FOUND]
          - errors[ERR_REQUISITION_NOT_EDITABLE]
        distinguishing_aspect: |
          Pair existence vs state (a third, distinct category pair): PATCHing a
          SUBMITTED requisition with a nonexistent grant_id returns the p3 404
          ERR_GRANT_NOT_FOUND, never the p6 409 ERR_REQUISITION_NOT_EDITABLE — the OCC
          version itself is valid, isolating the ordering to existence < state.
        test_recipe:
          setup:
            - "Department; vendor; requisition 400,000 SUBMITTED (version captured)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dance", cost_center: "CC-1300", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "StageLights" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "DAN", description: "floor", quantity: 1, unit_price_cents: 400000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_ver: $.data.version }
          trigger:
            - call: "PATCH /requisitions/${r_id}"
              payload: { expected_requisition_version: "${r_ver}", grant_id: "00000000-0000-0000-0000-000000000000" }
              as: Requester
              as_user_id: "req-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_GRANT_NOT_FOUND (p3 existence, 404), NOT ERR_REQUISITION_NOT_EDITABLE (p6 state, 409) and NOT ERR_STALE_VERSION (p5 — the correct version was supplied)"

  - rule_id: boundary_precision_check
    instances:
      - name: approval_threshold_inclusive_boundary
        grounds:
          - calculations.approval_chain_resolution
          - entities.Requisition.fields.required_chain
        distinguishing_aspect: |
          Inclusive threshold on the total_cents metric via submit: 500,000 cents
          exactly crosses INTO the PURCHASING tier (>=), while 499,999 does not — one
          cent flips the pinned chain.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Math", cost_center: "CC-1400", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "CalcCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "MTH", description: "server", quantity: 1, unit_price_cents: 500000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { ra_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "MTH", description: "server-lite", quantity: 1, unit_price_cents: 499999, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /requisitions/${ra_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { chain_a: $.data.required_chain }
            - call: "POST /requisitions/${rb_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { chain_b: $.data.required_chain }
          assert:
            - "total 500,000 (== T1): required_chain == [DEPARTMENT, PURCHASING] (inclusive >=)"
            - "total 499,999 (T1 - 1): required_chain == [DEPARTMENT] (one cent below the tier)"
            - "both submits succeed: anti-split rolling sums 500,000 and 999,999 stay under 2,500,000"

      - name: pcard_single_txn_limit_boundary
        grounds:
          - calculations.pcard_utilization
          - calculations.effective_single_txn_limit
          - errors[ERR_SINGLE_TXN_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Inclusive limit on the amount_cents metric via the transaction endpoint
          (different metric and endpoint than the approval tier): a debit of exactly
          single_txn_limit posts; limit + 1 cent is rejected.
        test_recipe:
          setup:
            - "Department; P-card single 100,000 monthly 500,000"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Bursar", cost_center: "CC-1500", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Lee", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 100000, entry_type: "DEBIT", merchant_name: "Staples", mcc_code: "5943" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { t_status: $.data.status }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 100001, entry_type: "DEBIT", merchant_name: "Staples", mcc_code: "5943" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
            - call: "GET /pcards/${pc_id}"
              as: ProcurementAdmin
              captures: { util: $.data.utilization_cents, avail: $.data.available_credit_cents }
          assert:
            - "amount == limit (100,000): posts, status POSTED (inclusive <=)"
            - "amount == limit + 1 (100,001): err == ERR_SINGLE_TXN_LIMIT_EXCEEDED (no transaction persisted)"
            - "utilization_cents == 100000 and available_credit_cents == 400000 after exactly one accepted debit"

      - name: anti_split_rolling_sum_inclusive_boundary
        grounds:
          - calculations.anti_split_aggregate
          - errors[ERR_BID_SPLITTING_DETECTED]
        distinguishing_aspect: |
          Inclusive aggregate threshold on the rolling-30-day same-vendor sum metric via
          submit (third distinct metric/endpoint): 1,200,000 + 1,200,000 already counted
          plus a 100,000 requisition hits exactly 2,500,000 and is rejected, while
          99,999 stays one cent under and submits.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor V; clock fixed at 2026-08-01"
            - "R1 and R2 (1,200,000 each, same department+vendor) SUBMITTED and APPROVED (both counted in the window)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /departments"
              payload: { name: "Philosophy", cost_center: "CC-1600", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "PrintCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "PHI", description: "journals", quantity: 1, unit_price_cents: 1200000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "PHI", description: "binding", quantity: 1, unit_price_cents: 1200000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "PHI", description: "reprints", quantity: 1, unit_price_cents: 100000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r3_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "PHI", description: "reprints-sm", quantity: 1, unit_price_cents: 99999, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r4_id: $.data.id }
          trigger:
            - call: "POST /requisitions/${r3_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err: $.data.error_id }
            - call: "POST /requisitions/${r4_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { r4_status: $.data.status }
            - call: "GET /requisitions/${r3_id}"
              as: ProcurementAdmin
              captures: { r3_status: $.data.status }
          assert:
            - "rolling sum 2,400,000 + 100,000 == 2,500,000 (== BID_THRESHOLD, inclusive): err == ERR_BID_SPLITTING_DETECTED; R3 stays DRAFT"
            - "rolling sum 2,400,000 + 99,999 == 2,499,999: R4 submits (status SUBMITTED) — one cent decides"
            - "R3 (DRAFT) never enters the window sum, so R4's check still sees exactly 2,400,000 counted"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: issue_po_requires_approved_requisition
        grounds:
          - state_machines.Requisition.APPROVED_to_PO_ISSUED
          - errors[ERR_REQUISITION_NOT_APPROVED]
        distinguishing_aspect: |
          Pair (PurchaseOrder, Requisition): PO creation is gated on the source
          requisition being APPROVED — issuing against a SUBMITTED requisition fails,
          and the same call succeeds once the chain completes.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor; requisition 400,000 SUBMITTED"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Sociology", cost_center: "CC-1700", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SurveyCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "SOC", description: "panel", quantity: 1, unit_price_cents: 400000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
          trigger:
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { err: $.data.error_id }
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { po_status: $.data.fulfillment_status, po_req: $.data.requisition_id }
          assert:
            - "issue-po while SUBMITTED: err == ERR_REQUISITION_NOT_APPROVED (no PO created)"
            - "after the DEPARTMENT step completes the chain: issue-po succeeds, PO fulfillment_status == ISSUED and requisition_id == the source requisition"

      - name: contract_execute_requires_active_vendor
        grounds:
          - state_machines.Contract.REVIEW_APPROVED_to_EXECUTED
          - errors[ERR_VENDOR_SUSPENDED]
        distinguishing_aspect: |
          Pair (Contract, Vendor) — different entities than PO/Requisition: executing a
          REVIEW_APPROVED contract whose vendor was suspended mid-negotiation fails
          with ERR_VENDOR_SUSPENDED and leaves the contract in REVIEW_APPROVED.
        test_recipe:
          setup:
            - "Vendor V; contract C walked DRAFT -> UNDER_REVIEW -> REVIEW_APPROVED; V then SUSPENDED"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "RiskyVendor" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", commodity_code: "SEC", value_cents: 2000000, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: ContractOfficer
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/approve-review"
              as: ContractOfficer
            - call: "POST /vendors/${v_id}/suspend"
              payload: { reason: "insurance lapsed" }
              as: ProcurementAdmin
          trigger:
            - call: "POST /contracts/${c_id}/execute"
              as: ProcurementDirector
              captures: { err: $.data.error_id }
            - call: "GET /contracts/${c_id}"
              as: ProcurementAdmin
              captures: { c_status: $.data.status }
            - call: "POST /vendors/${v_id}/reinstate"
              as: ProcurementAdmin
            - call: "POST /contracts/${c_id}/execute"
              as: ProcurementDirector
              captures: { c_status_2: $.data.status }
          assert:
            - "execute while vendor SUSPENDED: err == ERR_VENDOR_SUSPENDED; contract remains REVIEW_APPROVED"
            - "after reinstate: execute succeeds, status == EXECUTED"

      - name: dispute_requires_card_not_closed
        grounds:
          - state_machines.PCardTransaction.POSTED_to_DISPUTED
          - errors[ERR_CARD_CLOSED]
        distinguishing_aspect: |
          Pair (PCardTransaction, PCard) — a third entity pair: a RECONCILED
          transaction can normally be disputed, but once the CARD is CLOSED the
          transaction-level transition is blocked by the parent's state.
        test_recipe:
          setup:
            - "Department; card; DEBIT 50,000 posted and reconciled (GENERAL); card CLOSED (no open transactions)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Alumni", cost_center: "CC-1800", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Sam", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 50000, entry_type: "DEBIT", merchant_name: "Hotel", mcc_code: "7011" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { t_id: $.data.id }
            - call: "POST /pcard-transactions/${t_id}/reconcile"
              payload: { receipt_reference: "rcpt-1", allocation_type: "GENERAL" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcards/${pc_id}/close"
              as: ProcurementAdmin
          trigger:
            - call: "POST /pcard-transactions/${t_id}/dispute"
              payload: { reason: "duplicate charge" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
            - call: "GET /pcard-transactions/${t_id}"
              as: ProcurementAdmin
              captures: { t_status: $.data.status }
          assert:
            - "dispute on a CLOSED card: err == ERR_CARD_CLOSED (the transaction itself is RECONCILED, a valid from-state — the card's state is what blocks)"
            - "transaction remains RECONCILED (no partial mutation)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_period_half_open_overlap
        grounds:
          - state_machines.Contract.REVIEW_APPROVED_to_EXECUTED
          - errors[ERR_CONTRACT_OVERLAP]
          - entities.Contract.fields.effective_end
        distinguishing_aspect: |
          Half-open [start, end) semantics on the Contract resource: a new contract for
          the same (vendor, commodity) starting inside the incumbent's period collides,
          while one starting exactly at the incumbent's effective_end is adjacent, not
          overlapping, and executes cleanly.
        test_recipe:
          setup:
            - "Vendor V ACTIVE; contract C1 (commodity LAB) EXECUTED for [2026-01-01, 2027-01-01)"
            - "C2 same vendor+commodity [2026-06-01, 2027-06-01) at REVIEW_APPROVED; C3 same vendor+commodity [2027-01-01, 2028-01-01) at REVIEW_APPROVED"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "LabVendor" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", commodity_code: "LAB", value_cents: 5000000, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: ContractOfficer
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c1_id}/approve-review"
              as: ContractOfficer
            - call: "POST /contracts/${c1_id}/execute"
              as: ProcurementDirector
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", commodity_code: "LAB", value_cents: 3000000, effective_start: "2026-06-01T00:00:00Z", effective_end: "2027-06-01T00:00:00Z" }
              as: ContractOfficer
              captures: { c2_id: $.data.id }
            - call: "POST /contracts/${c2_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c2_id}/approve-review"
              as: ContractOfficer
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", commodity_code: "LAB", value_cents: 4000000, effective_start: "2027-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: ContractOfficer
              captures: { c3_id: $.data.id }
            - call: "POST /contracts/${c3_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c3_id}/approve-review"
              as: ContractOfficer
          trigger:
            - call: "POST /contracts/${c2_id}/execute"
              as: ProcurementDirector
              captures: { err: $.data.error_id }
            - call: "POST /contracts/${c3_id}/execute"
              as: ProcurementDirector
              captures: { c3_status: $.data.status }
            - call: "GET /contracts/${c2_id}"
              as: ProcurementAdmin
              captures: { c2_status: $.data.status }
          assert:
            - "C2 [2026-06-01, 2027-06-01) overlaps C1 [2026-01-01, 2027-01-01): err == ERR_CONTRACT_OVERLAP; C2 stays REVIEW_APPROVED"
            - "C3 starting exactly at C1's effective_end (2027-01-01): executes (half-open adjacency is NOT an overlap); status == EXECUTED"

      - name: elevation_window_gap_buffer
        grounds:
          - errors[ERR_ELEVATION_OVERLAP]
          - errors[ERR_ELEVATION_GAP_VIOLATION]
          - entities.LimitElevation.fields.window_start
        distinguishing_aspect: |
          Buffer-gap interval semantics on the PCard resource (different resource and
          different geometry than the contract's pure half-open overlap): a second
          elevation must neither overlap an existing SCHEDULED window NOR start within
          7 days after it — gap exactly 7 days passes, 3 days fails, interior start
          fails as overlap.
        test_recipe:
          setup:
            - "Department; card; elevation E1 SCHEDULED for [2026-08-10, 2026-08-12)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Housing", cost_center: "CC-1900", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Kim", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /pcards/${pc_id}/elevations"
              payload: { elevated_single_txn_limit_cents: 200000, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: ProcurementAdmin
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /pcards/${pc_id}/elevations"
              payload: { elevated_single_txn_limit_cents: 200000, window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-13T00:00:00Z" }
              as: ProcurementAdmin
              captures: { err_overlap: $.data.error_id }
            - call: "POST /pcards/${pc_id}/elevations"
              payload: { elevated_single_txn_limit_cents: 200000, window_start: "2026-08-15T00:00:00Z", window_end: "2026-08-16T00:00:00Z" }
              as: ProcurementAdmin
              captures: { err_gap: $.data.error_id }
            - call: "POST /pcards/${pc_id}/elevations"
              payload: { elevated_single_txn_limit_cents: 200000, window_start: "2026-08-19T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: ProcurementAdmin
              captures: { e4_status: $.data.status }
          assert:
            - "start 2026-08-11 inside E1 [08-10, 08-12): err_overlap == ERR_ELEVATION_OVERLAP"
            - "start 2026-08-15 (3-day gap after E1 ends 08-12): err_gap == ERR_ELEVATION_GAP_VIOLATION (gap < 7 days)"
            - "start 2026-08-19 (gap exactly 7 days): created SCHEDULED (>= 7 satisfies the buffer)"

  - rule_id: compensating_invariant
    instances:
      - name: grant_encumbrance_conservation_invariant
        grounds:
          - calculations.grant_budget_ledger
          - state_machines.Requisition.APPROVED_to_CANCELLED
          - state_machines.Invoice.PAYABLE_to_PAID
        distinguishing_aspect: |
          Conserved quantity: the grant award decomposition
          spent + encumbered + provisional_remaining == total_award holds after
          approve (encumber), cancel-from-APPROVED (release), and pay (settle) — a
          forward/cancel/pay sequence leaves zero drift at 5,000,000.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor; grant award 5,000,000 (F&A 0.52, SUPPLIES)"
            - "R1 10 x 100,000 SUPPLIES (charge 1,520,000) and R2 1 x 500,000 SUPPLIES (charge 760,000) both fully APPROVED"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Astronomy", cost_center: "CC-2000", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "OpticsCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "G-INV", sponsor: "NSF", total_award_cents: 5000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "AST", description: "lenses", quantity: 10, unit_price_cents: 100000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "AST", description: "mount", quantity: 1, unit_price_cents: 500000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
          trigger:
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { s_1: $.data.spent_cents, e_1: $.data.encumbered_cents, p_1: $.data.provisional_remaining_cents }
            - call: "POST /requisitions/${r2_id}/cancel"
              as: Requester
              as_user_id: "req-user-1"
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { s_2: $.data.spent_cents, e_2: $.data.encumbered_cents, p_2: $.data.provisional_remaining_cents }
            - call: "POST /requisitions/${r1_id}/issue-po"
              as: Buyer
              captures: { po1_id: $.data.id }
            - call: "POST /purchase-orders/${po1_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 10 }] }
              as: ReceivingClerk
            - call: "POST /purchase-orders/${po1_id}/invoices"
              payload: { invoice_number: "INV-INV", lines: [{ line_no: 0, quantity: 10, unit_price_cents: 100000 }] }
              as: APClerk
              captures: { inv1_id: $.data.id }
            - call: "POST /invoices/${inv1_id}/pay"
              as: APClerk
              as_user_id: "ap-1"
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { s_3: $.data.spent_cents, e_3: $.data.encumbered_cents, p_3: $.data.provisional_remaining_cents, t_3: $.data.settled_remaining_cents }
          assert:
            - "checkpoint 1 (both approved): spent 0 + encumbered 2,280,000 + provisional 2,720,000 == 5,000,000"
            - "checkpoint 2 (R2 cancelled from APPROVED): spent 0 + encumbered 1,520,000 + provisional 3,480,000 == 5,000,000 (cancel fully compensates the encumbrance)"
            - "checkpoint 3 (R1 paid): spent 1,520,000 + encumbered 0 + provisional 3,480,000 == 5,000,000; settled_remaining == 3,480,000"

      - name: pcard_credit_decomposition_invariant
        grounds:
          - calculations.pcard_utilization
          - state_machines.PCardTransaction.DISPUTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity (different from the grant budget): the card's credit
          decomposition utilization + available == monthly_limit across debit, dispute
          (no drift — DISPUTED stays in utilization), merchant-favor restore,
          cardholder-favor reversal (drops out), and a CREDIT refund (pushes below the
          remaining debits).
        test_recipe:
          setup:
            - "Department; card single 100,000 monthly 500,000"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Facilities", cost_center: "CC-2100", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Jo", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 80000, entry_type: "DEBIT", merchant_name: "Grainger", mcc_code: "5085" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 20000, entry_type: "DEBIT", merchant_name: "Grainger", mcc_code: "5085" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /pcard-transactions/${t1_id}/dispute"
              payload: { reason: "unrecognized" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "GET /pcards/${pc_id}"
              as: ProcurementAdmin
              captures: { u_1: $.data.utilization_cents, a_1: $.data.available_credit_cents }
            - call: "POST /pcard-transactions/${t1_id}/resolve-dispute"
              payload: { outcome: "MERCHANT_FAVOR" }
              as: ProcurementAdmin
            - call: "POST /pcard-transactions/${t1_id}/dispute"
              payload: { reason: "still wrong" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcard-transactions/${t1_id}/resolve-dispute"
              payload: { outcome: "CARDHOLDER_FAVOR" }
              as: ProcurementAdmin
              captures: { t1_status: $.data.status }
            - call: "GET /pcards/${pc_id}"
              as: ProcurementAdmin
              captures: { u_2: $.data.utilization_cents, a_2: $.data.available_credit_cents }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 5000, entry_type: "CREDIT", merchant_name: "Grainger", mcc_code: "5085" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { t3_status: $.data.status }
            - call: "POST /pcard-transactions/${t2_id}/reconcile"
              payload: { receipt_reference: "rcpt-2", allocation_type: "GENERAL" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "GET /pcards/${pc_id}"
              as: ProcurementAdmin
              captures: { u_3: $.data.utilization_cents, a_3: $.data.available_credit_cents }
          assert:
            - "while t1 DISPUTED: utilization == 100000, available == 400000 (dispute alone moves nothing)"
            - "after MERCHANT_FAVOR then CARDHOLDER_FAVOR: t1 REVERSED, utilization == 20000, available == 480000 (20,000 + 480,000 == 500,000)"
            - "CREDIT 5,000 posts directly to RECONCILED: utilization == 15000, available == 485000"
            - "reconciling t2 does not change utilization: still 15,000 + 485,000 == 500,000 (RECONCILED remains in-cycle)"

      - name: surplus_proceeds_conservation_invariant
        grounds:
          - calculations.surplus_proceeds_waterfall
          - entities.SurplusAsset.fields.proceeds_central_share_cents
        distinguishing_aspect: |
          Conserved quantity (a third type: proceeds decomposition, not a ledger):
          cost_recovery + dept_share + central_share == sale_price exactly, with the
          half-cent rounding remainder forced into the central share
          (100,001 - 20,000 = 80,001; dept gets round_half_up(40,000.5) = 40,001;
          central absorbs 40,000).
        test_recipe:
          setup:
            - "Two departments; asset declared 2026-08-01 (est 200,000, disposal cost 20,000); clock advanced past the 10-day window; asset LISTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /departments"
              payload: { name: "IT", cost_center: "CC-2200", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /surplus-assets"
              payload: { asset_tag: "AST-9", department_id: "${d_id}", description: "projector", condition: "GOOD", estimated_value_cents: 200000, disposal_cost_cents: 20000 }
              as: SurplusManager
              captures: { a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /surplus-assets/${a_id}/list-for-sale"
              as: SurplusManager
          trigger:
            - call: "POST /surplus-assets/${a_id}/sell"
              payload: { sale_price_cents: 100001, buyer_name: "Bidder-7" }
              as: SurplusManager
              captures: { cost_r: $.data.proceeds_cost_recovery_cents, dept_s: $.data.proceeds_dept_share_cents, cent_s: $.data.proceeds_central_share_cents, a_status: $.data.status }
          assert:
            - "proceeds_cost_recovery_cents == 20000 (min(20,000, 100,001))"
            - "proceeds_dept_share_cents == 40001 (round_half_up(0.5 * 80,001) — the half-cent rounds UP into the department share)"
            - "proceeds_central_share_cents == 40000 (absorbs the complement: 80,001 - 40,001)"
            - "conservation: 20,000 + 40,001 + 40,000 == 100,001 == sale_price_cents; status == SOLD"
