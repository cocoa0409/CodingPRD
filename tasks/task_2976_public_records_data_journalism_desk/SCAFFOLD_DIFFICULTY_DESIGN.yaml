  - rule_id: priority_pair_validation_conflict
    instances:
      - name: request_state_priority_100_beats_fee_budget_priority_270
        grounds:
          - validations[priority=100]
          - validations[priority=270]
          - calculations.fee_waiver_and_net_fee
          - calculations.desk_fee_budget_ledger
        distinguishing_aspect: |
          A fee determination on a DRAFT request whose net fee (5250) also exceeds the desk's entire
          available budget (1000) violates BOTH the state gate at priority 100 and the fiscal gate at
          priority 270. Only ERR_INVALID_REQUEST_STATE (409) may be returned; an implementation that
          checks affordability before state returns ERR_FEE_BUDGET_EXCEEDED (402). The control call
          proves the 402 is genuinely reachable once the state gate is satisfied.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk with fee_budget_total_cents 1000 (so fee_budget_available_cents is 1000)."
            - "One Agency: search_fee_cents_per_hour 3500, page_fee_cents 25, max_waiver_cents 10000."
            - "One RecordsRequest left in DRAFT (never submitted), waiver_requested true, public_interest_score 85."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Shoestring Desk", fee_budget_total_cents: 1000, retention_policy_days: 365 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Section 8 inspection failures 2024-2025", requested_format: "CSV", estimated_page_count: 120, waiver_requested: true, public_interest_score: 85, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /records-desk/records-requests/${req_id}/fee-determination"
              payload: { search_hours: 3.5, billed_page_count: 120 }
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/fee-determination"
              payload: { search_hours: 3.5, billed_page_count: 120 }
              as: RecordsCoordinator
          assert:
            - "trigger call 1: HTTP 409 with error_id == \"ERR_INVALID_REQUEST_STATE\" (priority 100), NOT ERR_FEE_BUDGET_EXCEEDED"
            - "after trigger call 1: RecordsRequest.${req_id}.status == \"DRAFT\", gross_fee_cents == null, net_fee_cents == null, fee_committed_cents == 0"
            - "after trigger call 1: Desk.${desk_id}.fee_budget_available_cents == 1000 and fee_budget_committed_cents == 0"
            - "trigger call 3 (control, state gate now satisfied): HTTP 402 with error_id == \"ERR_FEE_BUDGET_EXCEEDED\" (priority 270), because net_fee_cents would be 5250 > 1000 available"
            - "after trigger call 3: RecordsRequest.${req_id}.status == \"AWAITING_AGENCY_RESPONSE\", fee_determined_at == null, fee_committed_cents == 0"
            - "after trigger call 3: Desk.${desk_id}.fee_budget_total_cents == 1000 == available + committed + spent"

      - name: reviewer_conflict_priority_150_beats_capacity_priority_200
        grounds:
