            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv_id}", share_bp: 10000 }, as: TechTransferOfficer, captures: { entry_id: "$.data.id" } }
