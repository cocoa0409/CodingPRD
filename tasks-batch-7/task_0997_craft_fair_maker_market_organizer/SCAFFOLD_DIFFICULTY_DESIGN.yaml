  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_forbids_vs_quorum_not_met
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_POSTURE_FORBIDS]
          - errors[ERR_JURY_QUORUM_NOT_MET]
        distinguishing_aspect: |
          Category pair = state (posture) vs business_safety (jury quorum).
          Application has zero jury scores (quorum not met) AND MakerEvent is
          in SCHEDULING (posture forbids decide). Higher-priority
          ERR_POSTURE_FORBIDS (priority 4) MUST win over
          ERR_JURY_QUORUM_NOT_MET (priority 7).
        test_recipe:
          setup:
            - "MakerEvent has reached SCHEDULING (past JURY_REVIEW)"
            - "One application exists with no jury scores (artificially advanced by direct coordinator flow before scores arrived)"
            - "A second application has been WAITLISTED so begin-scheduling succeeded; we then attempt a late decide on the first"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Priority Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "Hall", weather_exposure: "INDOOR", category: "CERAMICS", category_cap: 3 }
              as: EventCoordinator
              captures: { zone_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones/${zone_id}/booths"
              payload: { code: "H-01", tier: "STANDARD", footprint_sqm: 9, price_cents: 5000 }
              as: EventCoordinator
            - call: "POST /vendor-profiles"
              payload: { display_name: "V1", contact_email: "v1@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { v1: $.data.id }
            - call: "POST /vendor-profiles"
              payload: { display_name: "V2", contact_email: "v2@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { v2: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${v1}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { app1: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app1}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v1}"
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${v2}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${v2}"
              captures: { app2: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app2}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/close-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications/${app2}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app2}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-2"
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v1: $.data.version }
