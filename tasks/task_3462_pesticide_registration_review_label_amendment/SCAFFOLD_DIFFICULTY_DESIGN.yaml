# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3462_pesticide_registration_review_label_amendment
# 9 Difficulty Rules x >= 2 grounded instances = 19 instances.
# All chains replay against SCAFFOLD.yaml §1.1-§1.7; every ${var} is bound by
# a captures: line earlier in the same instance. Clock is the logical clock
# (default 2026-09-01T00:00:00Z), moved only via POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dietary_risk_screening_vs_refined_divergence
        grounds:
          - calculations.dietary_exposure_and_risk_quotient
          - calculations.level_of_concern_determination
          - entities.RiskAssessment.fields.tier
        distinguishing_aspect: |
          Two valid assessment tiers on the SAME application data produce different
          dietary quotients: SCREENING prices CORN at the legal tolerance (2.0 ppm,
          100% crop treated) giving dietary_rq 7.143 and LOC exceeded, while REFINED
          uses the ACCEPTED field-trial mean (0.4 ppm) scaled by pct_crop_treated 0.3
          giving dietary_rq 0.429 and LOC clear. Entity domain: risk assessment on a
          RegistrationApplication.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. AI (rd 0.05, lc50 100.0, tox III); product 'Nominex 15G' (GRANULAR, reg-alice); FOOD_USE application IN_REVIEW with a CORN use site at 2.0 lbs/acre GROUND; four required studies present; RESIDUE_CHEMISTRY study ACCEPTED with field_trial_residue_ppm 0.4 on CORN; tolerance CORN 2.0 PROPOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex 15G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p}", use_pattern: "FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "CORN", pest_code: "ARMYWORM", max_application_rate_lbs_acre: 2.0, max_applications_per_season: 2, preharvest_interval_days: 7, application_method: "GROUND", restricted_entry_interval_hours: 24 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "RESIDUE_CHEMISTRY", guideline_reference: "OCSPP 860.1500", commodity_code: "CORN", field_trial_residue_ppm: 0.4 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { res: $.data.id }
            - call: "POST /pesticide-registry/tolerances"
              payload: { product_id: "${p}", commodity_code: "CORN", tolerance_ppm: 2.0 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/study-submissions/${res}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app}/submit"
              payload: { payment_cents: 500000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
          trigger:
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
              captures: { scr: $.data.id }
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app}", tier: "REFINED", pct_crop_treated: 0.3 }
              as: RiskAssessor
              as_user_id: "ra-1"
              captures: { ref: $.data.id }
          assert:
            - "RiskAssessment.${scr}: assessment_seq == 1, dietary_exposure_mg_day == 25.0, dietary_rq == 7.143, occupational_rq == 0.006, ecological_rq == 0.001, level_of_concern_exceeded == true"
            - "RiskAssessment.${ref}: assessment_seq == 2, dietary_exposure_mg_day == 1.5, dietary_rq == 0.429, level_of_concern_exceeded == false"
            - "identical product/study inputs: occupational_rq and ecological_rq are the same on both assessments (0.006 and 0.001); only the dietary pathway diverges between tiers"

      - name: existing_stocks_fixed_vs_depletion_deadline
        grounds:
          - calculations.existing_stocks_deadlines
          - entities.CancellationProceeding.fields.allow_sale_until
          - state_machines.CancellationProceeding.HEARING_HELD_to_EFFECTIVE
        distinguishing_aspect: |
          Same authorized quantity (12000 units) under the two stocks-provision variants
          yields different statutory windows: FIXED gives a 365-day sale window
          (2028-02-29) while DEPLETION at 2000 units/month gives ceil(12000/2000*30)=180
          days (2027-08-28), and the use window is twice the sale window only under
          DEPLETION. Entity domain: CancellationProceeding (distinct from the
          risk-assessment domain of the other instance).
        test_recipe:
          setup:
            - "Clock advanced to 2027-03-01T00:00:00Z. Two REGISTERED NON_FOOD_USE products P1 'Nominex G' and P2 'Nominex WP' (both owned by reg-alice, each fully approved through the application pipeline). Each has an open CANCELLATION proceeding (initiated by rr-1, hearing held) ready for its order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p1: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p1}", use_pattern: "NON_FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "TURF", pest_code: "GRUB", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 24 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app1: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app1}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s1e: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app1}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s1t: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app1}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s1f: $.data.id }
            - call: "POST /pesticide-registry/study-submissions/${s1e}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s1t}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s1f}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app1}/submit"
              payload: { payment_cents: 150000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app1}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app1}/review-decisions"
              payload: { decision: "APPROVE", final_classification: "GENERAL_USE" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex WP", active_ingredient_id: "${ai}", formulation_type: "WETTABLE_POWDER" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p2: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p2}", use_pattern: "NON_FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "TURF", pest_code: "GRUB", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 24 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app2: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app2}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s2e: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app2}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s2t: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app2}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s2f: $.data.id }
            - call: "POST /pesticide-registry/study-submissions/${s2e}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s2t}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s2f}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app2}/submit"
              payload: { payment_cents: 150000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app2}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app2}/review-decisions"
              payload: { decision: "APPROVE", final_classification: "GENERAL_USE" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/cancellation-proceedings"
              payload: { product_id: "${p1}", proceeding_type: "CANCELLATION", reason: "RISK_FINDING" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
              captures: { pr1: $.data.id }
            - call: "POST /pesticide-registry/cancellation-proceedings/${pr1}/hear"
              payload: {}
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /pesticide-registry/cancellation-proceedings"
              payload: { product_id: "${p2}", proceeding_type: "CANCELLATION", reason: "RISK_FINDING" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
              captures: { pr2: $.data.id }
            - call: "POST /pesticide-registry/cancellation-proceedings/${pr2}/hear"
              payload: {}
              as: RegistrationReviewer
              as_user_id: "rr-1"
          trigger:
            - call: "POST /pesticide-registry/cancellation-proceedings/${pr1}/issue-order"
              payload: { existing_stocks_authorized_units: 12000, stocks_method: "FIXED" }
              as: RegistrationReviewer
              as_user_id: "rr-2"
            - call: "POST /pesticide-registry/cancellation-proceedings/${pr2}/issue-order"
              payload: { existing_stocks_authorized_units: 12000, stocks_method: "DEPLETION", depletion_rate_units_per_month: 2000 }
              as: RegistrationReviewer
              as_user_id: "rr-2"
          assert:
            - "CancellationProceeding.${pr1}: status == EFFECTIVE, effective_at == 2027-03-01T00:00:00Z, allow_sale_until == 2028-02-29T00:00:00Z, allow_use_until == 2029-02-28T00:00:00Z (FIXED variant)"
            - "CancellationProceeding.${pr2}: status == EFFECTIVE, effective_at == 2027-03-01T00:00:00Z, allow_sale_until == 2027-08-28T00:00:00Z, allow_use_until == 2028-02-24T00:00:00Z (DEPLETION variant: 180 and 360 days)"
            - "identical effective_at and authorized units, different windows — the variant choice alone drives the dates"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: amendment_timeline_tiered_conditionals
        grounds:
          - calculations.amendment_review_timeline
          - entities.LabelAmendment.fields.review_due_at
        distinguishing_aspect: |
          Mode (a) tiered/conditional formula: NEW_USE on a RESTRICTED_USE product with
          a proposed tolerance and an IN_EFFECT bulletin stacks 365+90+180+60=695 days,
          while an expedited METHOD_CHANGE on the same product stacks (91+90+60)=241
          then halves with ceil to 121 days — four interacting inputs with conditional
          branches, pinned to literal review_due_at values.
        test_recipe:
          setup:
            - "Clock 2026-09-05T00:00:00Z. FOOD_USE product 'Nominex 15G' REGISTERED with classification RESTRICTED_USE (approved pipeline, tolerance CORN 0.05 ESTABLISHED, one ACTIVE CORN use site). Endangered-species bulletin IN_EFFECT for county 06037 (months 3-8)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "II", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex 15G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p}", use_pattern: "FOOD_USE", requested_classification: "RESTRICTED_USE", proposed_use_sites: [{ site_code: "CORN", pest_code: "ARMYWORM", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 7, application_method: "GROUND", restricted_entry_interval_hours: 48 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { se: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { st: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { sf: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "RESIDUE_CHEMISTRY", guideline_reference: "OCSPP 860.1500", commodity_code: "CORN", field_trial_residue_ppm: 0.02 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { sr: $.data.id }
            - call: "POST /pesticide-registry/tolerances"
              payload: { product_id: "${p}", commodity_code: "CORN", tolerance_ppm: 0.05 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/study-submissions/${se}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${st}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${sf}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${sr}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app}/submit"
              payload: { payment_cents: 500000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app}/review-decisions"
              payload: { decision: "APPROVE", final_classification: "RESTRICTED_USE" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /pesticide-registry/endangered-species-bulletins"
              payload: { product_id: "${p}", county_fips: "06037", restriction_code: "SEASONAL_WINDOW", window_start_month: 3, window_end_month: 8, consultation_reference: "USFWS-BO-2026-114" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "GET /pesticide-registry/products/${p}"
              payload: {}
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { pv1: $.data.version }
            - call: "GET /pesticide-registry/products/${p}/use-sites?status=ACTIVE"
              payload: {}
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { site1: "$.data[0].id" }
          trigger:
            - call: "POST /pesticide-registry/label-amendments"
              payload: { product_id: "${p}", amendment_type: "NEW_USE", payload: { use_site: { site_code: "SOYBEAN", pest_code: "APHID", max_application_rate_lbs_acre: 1.5, max_applications_per_season: 2, preharvest_interval_days: 14, application_method: "GROUND", restricted_entry_interval_hours: 48 }, commodity_code: "SOYBEAN", tolerance_ppm: 0.05 }, expected_product_version: "${pv1}" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { am1: $.data.id }
            - call: "GET /pesticide-registry/products/${p}"
              payload: {}
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { pv2: $.data.version }
            - call: "POST /pesticide-registry/label-amendments"
              payload: { product_id: "${p}", amendment_type: "METHOD_CHANGE", payload: { use_site_id: "${site1}", new_application_method: "AERIAL", expedited: true }, expected_product_version: "${pv2}" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { am2: $.data.id }
          assert:
            - "LabelAmendment.${am1}: submitted_at == 2026-09-05T00:00:00Z, review_due_at == 2028-07-31T00:00:00Z (365 base + 90 RUP + 180 new-food-use + 60 bulletin = 695 days), priia_category == \"NEW_USE\""
            - "LabelAmendment.${am2}: review_due_at == 2027-01-04T00:00:00Z (91 base + 90 RUP + 60 bulletin = 241, expedited ceil(241/2) = 121 days), priia_category == \"METHOD_CHANGE-EXPEDITED\""
            - "Product.version advanced by exactly 1 per amendment creation (${pv2} == ${pv1} + 1)"

      - name: dietary_exposure_round_per_commodity_then_sum
        grounds:
          - calculations.dietary_exposure_and_risk_quotient
          - entities.RiskAssessment.fields.dietary_exposure_mg_day
        distinguishing_aspect: |
          Mode (b) nested rounding order: tolerances CORN 0.11111 and WHEAT 0.22223 give
          per-commodity terms 1.3889 and 4.4446 when each term is rounded to 4 dp first
          (pinned), summing to 5.8335 -> 5.834; the naive sum-then-round order yields
          5.833. The assertion pins 5.834, so an implementation with the wrong rounding
          order fails by one milliunit.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Product with a FOOD_USE application IN_REVIEW (CORN site, 1.0 lbs/acre GROUND, four studies); tolerances CORN 0.11111 and WHEAT 0.22223 both PROPOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
