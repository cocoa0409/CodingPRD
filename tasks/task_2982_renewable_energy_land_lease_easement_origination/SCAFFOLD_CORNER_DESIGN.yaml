              as_user_id: "tc-user-01"
              captures: { i_id: "$.data.id", raiser: "$.data.created_by_user_id" }
          trigger:
            - call: "POST /land-origination/title-curative-items/${i_id}/clear"
              payload: {}
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "${raiser} == tc-user-01"
            - "HTTP 422"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "TitleCurativeItem.${i_id}.status == OPEN and cleared_at is null"
            - "Parcel.${p_id}.curative_cost_cents == 0 and status == QUALIFIED (a MATERIAL item never blocks qualification)"
            - "Replaying the identical clear as tc-user-02 returns 200 with status CLEARED and lifts Parcel.${p_id}.curative_cost_cents to 90000"

      - name: exercise_cannot_be_performed_by_the_user_who_executed
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 25]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.OptionAgreement.fields.executed_by_user_id
        distinguishing_aspect: "The second limb of the segregation rule lives on a different entity and a different pair of users from the curative limb: pm-user-01 legitimately executed the instrument, which is precisely what disqualifies them from exercising it, and the refusal must leave no LeaseAgreement behind."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement sent, accepted and executed by pm-user-01, so executed_by_user_id is pm-user-01."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
