scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: jurisdiction_create_applies_limit_defaults
        claim_type: Defaults
        grounds: [entities.Jurisdiction.fields.gift_single_limit_cents, endpoints]
        distinguishing_aspect: "POST /jurisdictions with only name applies declared defaults (gift_single_limit_cents 5000, penalty_cap_cents 50000)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Bare Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
          assert:
            - "Jurisdiction.${jur_id}.gift_single_limit_cents == 5000"
            - "Jurisdiction.${jur_id}.gift_annual_source_limit_cents == 25000"
            - "Jurisdiction.${jur_id}.penalty_cap_cents == 50000"

      - name: filer_create_computed_fields_defaulted
        claim_type: Computed Fields
        grounds: [entities.Filer.fields.compliance_status, entities.Filer.fields.training_status, entities.Filer.fields.outstanding_penalty_cents, entities.Filer.fields.open_recusal_count]
        distinguishing_aspect: "A newly created filer returns compliance_status COMPLIANT, training_status NONE, outstanding_penalty_cents 0, open_recusal_count 0 regardless of any client-supplied values."
        test_recipe:
          setup: ["Jurisdiction exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "New Filer", official_title: "Aide", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
          assert:
            - "Filer.${filer_id}.compliance_status == COMPLIANT"
            - "Filer.${filer_id}.training_status == NONE"
            - "Filer.${filer_id}.outstanding_penalty_cents == 0"
            - "Filer.${filer_id}.open_recusal_count == 0"

      - name: filer_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Filer", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /filers/{unknown} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /filers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: statement_create_missing_required_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Statement.fields.filing_period_id", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /statements without filing_period_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Jurisdiction and Filer exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
          trigger:
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: filer_invalid_category_enum_returns_validation
        claim_type: Type Constraints
        grounds: ["entities.Filer.fields.filer_category", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /filers with filer_category 'MAYOR' (not in the enum) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Jurisdiction exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "X", official_title: "Y", filer_category: "MAYOR" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: filers_list_returns_pagination_envelope
        claim_type: Listing
        grounds: [entities.Filer, response_envelope]
        distinguishing_aspect: "GET /filers returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["One jurisdiction with one filer."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
          trigger:
            - call: "GET /filers"
              payload: { jurisdiction_id: "${jur_id}" }
              as: Registrar
          assert:
            - "response.response_type == array"
            - "response.meta pagination total_count == 1"
            - "response.meta pagination has_more == false"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: accept_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Statement.SUBMITTED_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DRAFT (never submitted) statement returns ERR_INVALID_STATE; accept is only defined from SUBMITTED."
        test_recipe:
          setup: ["A DRAFT statement (created, not submitted)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /statements/${stmt_id}/accept"
              payload: {}
              as: EthicsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: pay_already_paid_penalty_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Penalty.ASSESSED_to_PAID", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a penalty already in terminal PAID returns ERR_INVALID_STATE; no double decrement of outstanding."
        test_recipe:
          setup: ["ELECTED filer, a 40-day-late statement ACCEPTED (penalty 45000 ASSESSED), penalty then PAID."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmt_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /penalties"
              payload: { filer_id: "${filer_id}" }
              as: EthicsOfficer
              captures: { pen_id: "$.data[0].id" }
            - call: "POST /penalties/${pen_id}/pay"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /penalties/${pen_id}/pay"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Filer.${filer_id}.outstanding_penalty_cents == 0"

      - name: screen_dismiss_branch_terminal
        claim_type: Valid Transition
        grounds: [state_machines.Complaint.FILED_to_DISMISSED]
        distinguishing_aspect: "Screening a complaint with decision DISMISSED moves it FILED->DISMISSED (the other fork of the screen branch)."
        test_recipe:
          setup: ["A FILED complaint."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /complaints"
              payload: { filer_id: "${filer_id}", allegation: "frivolous", complainant_ref: "cx-7" }
              as: EthicsOfficer
              captures: { complaint_id: $.data.id }
          trigger:
            - call: "POST /complaints/${complaint_id}/screen"
              payload: { decision: "DISMISSED", screen_note: "no merit" }
              as: EthicsOfficer
          assert:
            - "Complaint.${complaint_id}.status == DISMISSED"

      - name: dispose_already_disposed_gift_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.GiftReport.REPORTED_to_DISPOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Disposing a gift already in terminal DISPOSED returns ERR_INVALID_STATE; the aggregate is not decremented twice."
        test_recipe:
          setup: ["Filer CURRENT training with one REPORTED gift (NET 4000) that has been DISPOSED once."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme", gift_kind: "GIFT", received_at: "2026-05-01T00:00:00Z", fair_market_value_cents: 4000 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { gift_id: $.data.id }
            - call: "POST /gift-reports/${gift_id}/dispose"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /gift-reports/${gift_id}/dispose"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Filer.${filer_id}.reportable_gift_total_cents == 0"

      - name: pay_restores_withheld_statement_to_published
        claim_type: Compensation
        grounds: [state_machines.Penalty.ASSESSED_to_PAID, entities.Statement.fields.public_status, entities.Filer.fields.compliance_status]
        distinguishing_aspect: "Paying off the outstanding penalty flips the filer back to COMPLIANT and restores its WITHHELD statement to PUBLISHED (compensating the withhold cascade)."
        test_recipe:
          setup: ["ELECTED filer with a PUBLISHED CY2024 statement that was WITHHELD when a late CY2025 statement acceptance made the filer DELINQUENT (outstanding 45000)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2024-01-01T00:00:00Z", coverage_end: "2024-12-31T00:00:00Z", due_at: "2026-01-15T00:00:00Z", label: "CY2024" }
              as: Registrar
              captures: { periodA_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${periodA_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmtA_id: $.data.id }
            - call: "POST /statements/${stmtA_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmtA_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /statements/${stmtA_id}"
              payload: {}
              as: Registrar
              captures: { vA: $.data.version }
            - call: "POST /statements/${stmtA_id}/publish"
              payload: { expected_statement_version: "${vA}" }
              as: Registrar
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z", label: "CY2025" }
              as: Registrar
              captures: { periodB_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: Registrar
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${periodB_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmtB_id: $.data.id }
            - call: "POST /statements/${stmtB_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmtB_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /penalties"
              payload: { filer_id: "${filer_id}", statement_id: "${stmtB_id}" }
              as: EthicsOfficer
              captures: { penB_id: "$.data[0].id" }
          trigger:
            - call: "POST /penalties/${penB_id}/pay"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          assert:
            - "Filer.${filer_id}.outstanding_penalty_cents == 0"
            - "Filer.${filer_id}.compliance_status == COMPLIANT"
            - "Statement.${stmtA_id}.public_status == PUBLISHED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: gift_over_single_limit_returns_error
        claim_type: Correct Result
        grounds: ["validations[priority=13]", "errors[ERR_GIFT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "A single gift with NET reportable 5001 (one cent over the 5000 limit) is rejected with ERR_GIFT_LIMIT_EXCEEDED; the > side of the boundary."
        test_recipe:
          setup: ["Filer CURRENT training; single-gift limit 5000."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme", gift_kind: "GIFT", received_at: "2026-05-01T00:00:00Z", fair_market_value_cents: 5001 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GIFT_LIMIT_EXCEEDED"

      - name: gift_annual_source_limit_exceeded
        claim_type: Correct Result
        grounds: ["calculations.gift_annual_aggregate", "validations[priority=15]", "errors[ERR_GIFT_ANNUAL_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Two same-source same-year gifts of NET 15000 each (both under the 20000 single limit) push the annual aggregate to 30000 > 25000 -> ERR_GIFT_ANNUAL_LIMIT_EXCEEDED on the second."
        test_recipe:
          setup: ["Filer CURRENT training; single limit 20000, annual-source limit 25000; one 15000 gift from 'Acme' already reported."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 20000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme", gift_kind: "GIFT", received_at: "2026-05-01T00:00:00Z", fair_market_value_cents: 15000 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { gift1_id: $.data.id }
          trigger:
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme", gift_kind: "GIFT", received_at: "2026-07-01T00:00:00Z", fair_market_value_cents: 15000 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GIFT_ANNUAL_LIMIT_EXCEEDED"
            - "Filer.${filer_id}.reportable_gift_total_cents == 15000"

      - name: gift_dispose_decrements_annual_aggregate
        claim_type: Correct Result
        grounds: [state_machines.GiftReport.REPORTED_to_DISPOSED, calculations.gift_annual_aggregate, entities.Filer.fields.reportable_gift_total_cents]
        distinguishing_aspect: "Reporting a NET 4000 gift then disposing it returns Filer.reportable_gift_total_cents to 0 (aggregation reversal)."
        test_recipe:
          setup: ["Filer CURRENT training with one REPORTED gift NET 4000."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme", gift_kind: "GIFT", received_at: "2026-05-01T00:00:00Z", fair_market_value_cents: 4000 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { gift_id: $.data.id }
          trigger:
            - call: "POST /gift-reports/${gift_id}/dispose"
              payload: { disposition_method: "RETURNED" }
              as: Filer
              as_user_id: "${filer_id}"
          assert:
            - "GiftReport.${gift_id}.status == DISPOSED"
            - "Filer.${filer_id}.reportable_gift_total_cents == 0"

      - name: final_sanction_capped_at_penalty_cap
        claim_type: Constants Applied
        grounds: [calculations.final_sanction, state_machines.Investigation.OPEN_to_SUSTAINED, entities.Investigation.fields.final_sanction_cents]
        distinguishing_aspect: "A SUSTAINED adjudication with recommended_sanction_cents 999999 clamps final_sanction_cents to the jurisdiction cap 50000."
        test_recipe:
          setup: ["Complaint SCREENED, Investigation opened by inv-1; jurisdiction penalty cap 50000."]
          setup_api_calls:
