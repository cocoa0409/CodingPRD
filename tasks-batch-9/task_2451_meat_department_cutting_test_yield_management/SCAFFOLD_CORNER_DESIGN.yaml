            - "ShrinkReconciliation.${sr1_id}.physical_salable_lb == 34.00 and variance_lb == -0.50"
            - "ShrinkReconciliation.${sr1_id}.variance_pct == -0.0145 and within_tolerance == true"
            - "ShrinkReconciliation.${sr1_id}.markdown_dollars_cents == 0 and shrink_dollars_cents == 0 — only the single in-scope line contributes and it carries no markdown or shrink"
