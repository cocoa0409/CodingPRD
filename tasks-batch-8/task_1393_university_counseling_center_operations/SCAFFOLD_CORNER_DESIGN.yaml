      - name: error_stale_version_on_episode_booking
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[session-book-stale-episode-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Booking with expected_episode_version one behind the current version -> ERR_STALE_VERSION 412; deterministic two-sequential-requests OCC probe."
        test_recipe:
          setup: ["OPEN episode at version V after one booking; client retries with stale V-1... precisely: capture version, book once (bumps), book again with the ORIGINAL captured version"]
          setup_api_calls:
            - call: "POST /ucc/counselors"
