scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_provisional_vs_final_nav_pricing
        grounds:
          - calculations.subscription_shares
          - state_machines.Subscription.PENDING_ACH_to_SETTLED
          - entities.Subscription.fields.provisional_nav_cents
          - entities.Subscription.fields.settled_nav_cents
          - entities.Subscription.fields.shares_allocated
        distinguishing_aspect: "Same funded_amount on the same Subscription yields provisional_nav_cents=1000 (500.0000 implied shares at create) but settled_nav_cents=1250 (400.0000 shares minted) once a Valuation posts between create and settle — divergence on the Subscription/Fund pricing domain."
        test_recipe:
          setup:
            - "Fund F created (gross=100000000, liab=0); shares=0 so NAV bootstraps to 1000."
            - "Investor A approved, subscribes 1000000 and settles -> 1000 shares; shares_outstanding=1000, NAV stays 1000."
            - "Investor B approved; subscribes 500000 while NAV=1000 (provisional_nav_cents=1000)."
            - "A Valuation posts moving NAV to 1250 before B settles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund F", vehicle_type: "REIT", gross_asset_value_cents: 100000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "a@x.com", full_name: "Inv A", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv_a: $.data.id }
            - call: "POST /investors/${inv_a}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv_a}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv_a}"
              captures: { sub_a: $.data.id, fund_v1: $.data.version }
            - call: "POST /subscriptions/${sub_a}/settle"
              payload: {}
              as: Operator
              captures: { fund_v2: $.data.version }
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Operator
              captures: { fund_v_pre_b: $.data.version }
            - call: "POST /investors"
              payload: { email: "b@x.com", full_name: "Inv B", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv_b: $.data.id }
            - call: "POST /investors/${inv_b}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv_b}", share_class_id: "${sc_id}", funded_amount_cents: 500000, expected_fund_version: "${fund_v_pre_b}" }
              as: Investor
              as_user_id: "${inv_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1250000, total_liabilities_cents: 0 }
              as: FundManager
          trigger:
            - call: "POST /subscriptions/${sub_b}/settle"
              payload: {}
              as: Operator
              captures: { sub_b_shares: $.data.shares_allocated }
          assert:
            - "Subscription.${sub_b}.provisional_nav_cents == 1000"
            - "Subscription.${sub_b}.settled_nav_cents == 1250"
            - "Subscription.${sub_b}.shares_allocated == 400.0000"
            - "Subscription.${sub_b}.provisional_nav_cents != Subscription.${sub_b}.settled_nav_cents"

      - name: early_withdrawal_penalty_tier_vs_dividend_per_share_allocation
        grounds:
          - calculations.early_withdrawal_penalty
          - calculations.dividend_allocation
          - state_machines.RedemptionRequest.QUEUED_to_FULFILLED
          - state_machines.Distribution.DECLARED_to_PAID
        distinguishing_aspect: "Two valid value-derivation algorithms on different entity domains: RedemptionRequest computes net_proceeds via tiered penalty (200bps -> net 200900) while Distribution computes per-share payout (round-per-holding); they share no formula and operate on RedemptionRequest vs Distribution/Holding subjects."
        test_recipe:
          setup:
            - "Fund F with one settled holding of 1000 shares (investor A), NAV held at 1025 via valuations through seq 5."
            - "A force-fulfill redemption of 200 shares uses the 200bps tier; a separate distribution of 1.5c/share pays the holding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund P", vehicle_type: "REIT", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "a@p.com", full_name: "Inv A", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv_a: $.data.id }
            - call: "POST /investors/${inv_a}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv_a}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, drip_elected: false, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /subscriptions/${sub_a}/settle"
              payload: {}
              as: Operator
              captures: { holding_a: $.data.holding_id }
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q2", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q3", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q4", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2027-Q1", gross_asset_value_cents: 1025000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "GET /holdings/${holding_a}"
              payload: {}
              as: Operator
              captures: { holding_a_v: $.data.version }
            - call: "POST /redemption-requests"
              payload: { holding_id: "${holding_a}", shares_requested: 200, expected_holding_version: "${holding_a_v}" }
              as: Investor
              as_user_id: "${inv_a}"
              captures: { rr_id: $.data.id }
            - call: "POST /funds/${fund_id}/distributions"
              payload: { period_label: "2027-Q1", dividend_per_share_cents: 1.5 }
              as: FundManager
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /redemption-requests/${rr_id}/force-fulfill"
              payload: {}
              as: Operator
              captures: { rr_net: $.data.net_proceeds_cents }
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Operator
              captures: { dist_total: $.data.total_paid_cents }
          assert:
            - "RedemptionRequest.${rr_id}.penalty_tier_rate_bps == 200"
            - "RedemptionRequest.${rr_id}.penalty_cents == 4100"
            - "RedemptionRequest.${rr_id}.net_proceeds_cents == 200900"
            - "Distribution.${dist_id}.total_paid_cents == 1200"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a),(b),(c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dividend_round_per_holding_then_sum_mode_b
        grounds:
          - calculations.dividend_allocation
          - state_machines.Distribution.DECLARED_to_PAID
          - entities.Distribution.fields.total_paid_cents
        distinguishing_aspect: "Mode (b) nested rounding order: three holdings of 33.0000 shares at 1.5c/share give round-per-holding-then-sum=150c, whereas sum-then-round would give 149c; the scaffold pins round-per-holding-then-sum so total_paid_cents==150."
        test_recipe:
          setup:
            - "Fund D, share class A min 1000. Three approved investors each settle a 33000-cent subscription at NAV 1000 -> 33.0000 shares each; shares_outstanding=99."
            - "A valuation posts so NAV=1000 (net 99000 / 99). Distribution declares 1.5c/share."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund D", vehicle_type: "REIT", gross_asset_value_cents: 99000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 1000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "h1@d.com", full_name: "H1", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv1: $.data.id }
            - call: "POST /investors/${inv1}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv1}", share_class_id: "${sc_id}", funded_amount_cents: 33000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv1}"
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions/${sub1}/settle"
              payload: {}
              as: Operator
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Operator
              captures: { fund_v1: $.data.version }
            - call: "POST /investors"
              payload: { email: "h2@d.com", full_name: "H2", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv2: $.data.id }
            - call: "POST /investors/${inv2}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv2}", share_class_id: "${sc_id}", funded_amount_cents: 33000, expected_fund_version: "${fund_v1}" }
              as: Investor
              as_user_id: "${inv2}"
              captures: { sub2: $.data.id }
            - call: "POST /subscriptions/${sub2}/settle"
              payload: {}
              as: Operator
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Operator
              captures: { fund_v2: $.data.version }
            - call: "POST /investors"
              payload: { email: "h3@d.com", full_name: "H3", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv3: $.data.id }
            - call: "POST /investors/${inv3}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv3}", share_class_id: "${sc_id}", funded_amount_cents: 33000, expected_fund_version: "${fund_v2}" }
              as: Investor
              as_user_id: "${inv3}"
              captures: { sub3: $.data.id }
            - call: "POST /subscriptions/${sub3}/settle"
              payload: {}
              as: Operator
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 99000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds/${fund_id}/distributions"
              payload: { period_label: "2026-Q1", dividend_per_share_cents: 1.5 }
              as: FundManager
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Operator
              captures: { dist_total: $.data.total_paid_cents }
          assert:
            - "Distribution.${dist_id}.total_paid_cents == 150"

      - name: ach_fee_waiver_circular_dependency_mode_c
        grounds:
          - calculations.ach_fee
          - state_machines.Subscription.PENDING_ACH_to_SETTLED
          - entities.Subscription.fields.ach_fee_cents
          - entities.Subscription.fields.total_charged_cents
        distinguishing_aspect: "Mode (c) circular-looking dependency: ach_fee_cents feeds prelim_total which decides whether ach_fee_cents is waived; the scaffold pins evaluation order (compute raw fee from funded -> prelim_total -> conditional waiver), so a funded 2481000 yields prelim 2500848 >= 2500000 -> ach_fee_cents==0, total_charged_cents==2481000."
        test_recipe:
          setup:
            - "Fund C with share class min 100000; investor approved; subscription funded 2481000 settles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund C", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "big@c.com", full_name: "Big", accredited_status: "ACCREDITED", annual_income_cents: 500000000, net_worth_cents: 500000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 2481000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
              captures: { fee: $.data.ach_fee_cents, total: $.data.total_charged_cents }
          assert:
            - "Subscription.${sub}.ach_fee_cents == 0"
            - "Subscription.${sub}.total_charged_cents == 2481000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: redemption_cyclic_queued_deferred_queued
        grounds:
          - state_machines.RedemptionRequest.QUEUED_to_DEFERRED
          - state_machines.RedemptionRequest.DEFERRED_to_QUEUED
          - state_machines.RedemptionRequest.QUEUED_to_FULFILLED
        distinguishing_aspect: "RedemptionRequest is cyclic: a sweep defers a capped request (QUEUED->DEFERRED), open-redemption-window returns it to QUEUED, and a later sweep fulfills it (QUEUED->FULFILLED) — a loop, not a linear pipeline, on the RedemptionRequest entity."
        test_recipe:
          setup:
            - "Fund with total_capital=1000000 -> cap 50000. Holding of 1000 shares (investor A), NAV 1000."
            - "Two queued redemptions: R1 30 shares (gross 30000), R2 25 shares (gross 25000). First sweep fulfills R1, defers R2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund Q", vehicle_type: "REIT", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "a@q.com", full_name: "A", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv_a: $.data.id }
            - call: "POST /investors/${inv_a}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv_a}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /subscriptions/${sub_a}/settle"
              payload: {}
              as: Operator
              captures: { holding_a: $.data.holding_id }
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "GET /holdings/${holding_a}"
              payload: {}
              as: Operator
              captures: { hv1: $.data.version }
            - call: "POST /redemption-requests"
              payload: { holding_id: "${holding_a}", shares_requested: 30, expected_holding_version: "${hv1}" }
              as: Investor
              as_user_id: "${inv_a}"
              captures: { r1: $.data.id }
            - call: "GET /holdings/${holding_a}"
              payload: {}
              as: Operator
              captures: { hv2: $.data.version }
            - call: "POST /redemption-requests"
              payload: { holding_id: "${holding_a}", shares_requested: 25, expected_holding_version: "${hv2}" }
              as: Investor
              as_user_id: "${inv_a}"
              captures: { r2: $.data.id }
            - call: "POST /funds/${fund_id}/run-redemption-sweep"
              payload: {}
              as: Operator
            - call: "GET /redemption-requests/${r2}"
              payload: {}
              as: Operator
              captures: { r2_status_deferred: $.data.status }
          trigger:
            - call: "POST /funds/${fund_id}/open-redemption-window"
              payload: {}
              as: Operator
            - call: "GET /redemption-requests/${r2}"
              payload: {}
              as: Operator
              captures: { r2_status_requeued: $.data.status }
            - call: "POST /funds/${fund_id}/run-redemption-sweep"
              payload: {}
              as: Operator
            - call: "GET /redemption-requests/${r2}"
              payload: {}
              as: Operator
              captures: { r2_status_final: $.data.status }
          assert:
            - "RedemptionRequest.${r1}.status == FULFILLED"
            - "RedemptionRequest.${r2}.status == FULFILLED"

      - name: investor_suitability_cyclic_approved_pending_approved
        grounds:
          - state_machines.Investor.PENDING_to_APPROVED
          - state_machines.Investor.APPROVED_to_PENDING
        distinguishing_aspect: "Investor suitability is cyclic on a different entity: APPROVED can be revoked back to PENDING and re-approved (PENDING->APPROVED->PENDING->APPROVED), a revision loop distinct from the RedemptionRequest cycle."
        test_recipe:
          setup:
            - "Investor registered (PENDING), approved (APPROVED), then revoked (PENDING)."
          setup_api_calls:
            - call: "POST /investors"
              payload: { email: "cyc@x.com", full_name: "Cyc", accredited_status: "NON_ACCREDITED", annual_income_cents: 8000000, net_worth_cents: 12000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /investors/${inv}/revoke-suitability"
              payload: {}
              as: ComplianceOfficer
              captures: { st_pending: $.data.suitability_status }
          trigger:
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
              captures: { st_reapproved: $.data.suitability_status }
          assert:
            - "Investor.${inv}.suitability_status == APPROVED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: distribution_pay_drip_chain_dist_holding_fund
        grounds:
          - state_machines.Distribution.DECLARED_to_PAID
          - calculations.dividend_allocation
          - calculations.fund_shares_outstanding
          - calculations.nav_per_share
          - entities.Holding.fields.shares_owned
          - entities.Fund.fields.shares_outstanding
        distinguishing_aspect: "Depth-3 cascade from Distribution PAID: (A) Distribution PAID -> (B) each DRIP Holding.shares_owned += drip_shares -> (C) Fund.shares_outstanding recomputed and Fund.nav_per_share_cents recomputed; each hop is caused by the prior, not by the original trigger directly."
        test_recipe:
          setup:
            - "Fund with 3 DRIP-electing holdings of 33.0000 shares each (shares_outstanding 99), NAV 1000 via valuation. Distribution 1.5c/share declared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Operator
            - call: "POST /funds"
              payload: { name: "Fund DR", vehicle_type: "REIT", gross_asset_value_cents: 99000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 1000, mgmt_fee_bps: 100, drip_eligible: true }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "d1@dr.com", full_name: "D1", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv1: $.data.id }
            - call: "POST /investors/${inv1}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv1}", share_class_id: "${sc_id}", funded_amount_cents: 33000, drip_elected: true, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv1}"
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions/${sub1}/settle"
              payload: {}
              as: Operator
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Operator
              captures: { fund_v1: $.data.version }
            - call: "POST /investors"
              payload: { email: "d2@dr.com", full_name: "D2", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv2: $.data.id }
            - call: "POST /investors/${inv2}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv2}", share_class_id: "${sc_id}", funded_amount_cents: 33000, drip_elected: true, expected_fund_version: "${fund_v1}" }
              as: Investor
              as_user_id: "${inv2}"
              captures: { sub2: $.data.id }
            - call: "POST /subscriptions/${sub2}/settle"
              payload: {}
              as: Operator
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Operator
              captures: { fund_v2: $.data.version }
