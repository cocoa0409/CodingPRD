          trigger:
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${cur_bag_id}", counting_machine_id: "${mach_id}", window_start: "2026-08-03T09:30:00Z", window_end: "2026-08-03T10:30:00Z", expected_sealed_bag_version: "${cur_bag_v}" }
              as: VaultTeller
