            - "CompoundingBatch.${batch_id}.status == IN_PROCESS (compile rejected)"

      - name: batch_start_with_zero_ingredients_empty_set_boundary
        grounds:
          - state_machines.CompoundingBatch.DRAFT_to_IN_PROCESS
          - errors[ERR_NO_INGREDIENTS_CHARGED]
          - entities.BatchIngredientUsage.fields.compounding_batch_id
        distinguishing_aspect: |
          On POST /compounding-batches/{bid}/start: a DRAFT batch with zero
          BatchIngredientUsage rows hits the empty-collection boundary and is
          rejected with ERR_NO_INGREDIENTS_CHARGED (409); this is the empty-set
          edge metric (count==0), reached via a different endpoint (start) than
          the numeric-band boundary in instance 1.
        test_recipe:
          setup:
            - "503A facility, nonsterile MFR, PRESCRIPTION batch in DRAFT with NO BatchIngredientUsage rows charged."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
