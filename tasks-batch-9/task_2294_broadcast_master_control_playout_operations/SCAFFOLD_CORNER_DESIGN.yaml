            - "the items listing returns total_count 3 — all seven SCHEDULED items were deleted and replaced, and sequence numbers restart from the supplied revision"
            - "item_count == 3, blocked_item_count == 0, scheduled_total_seconds == 3600, projected_end_variance_seconds == 0, commercial_seconds_by_hour == {\"0\": 30} (hour keys are 0-based offsets from schedule_start_utc)"
            - "SpotOrder.${ord1_id}.scheduled_spots == 1 and unplaced_spots == 3 (was 2 and 2), status still OPEN, credit_accrued_cents == 0"
            - "spot_inventory_conservation holds: ordered_spots 4 == aired_spots 0 + short_aired_spots 0 + credited_spots 0 + scheduled_spots 1 + unplaced_spots 3"
            - "the cycle is re-traversable: the playlist reaches VALIDATED then ARMED again, with armed_at_utc re-written to logical_now"

