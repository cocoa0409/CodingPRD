# =============================================================================
# Task 1976 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and is reachable from empty-DB via declared endpoints only.
# Clock default (no set_current_utc call): 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_ignores_mfn_floor_final_enforces_it
        grounds:
          - calculations.license_fee_estimate
          - calculations.mfn_floor
          - state_machines.ClearanceRequest.NEGOTIATING_to_APPROVED
        distinguishing_aspect: |
          Same request data: the provisional variant (entry to NEGOTIATING)
          prices SOCIAL/NA/10 units/30d at 30000 cents WITHOUT the MFN floor,
          while the final variant at round acceptance treats the floor
          (holder mfn_floor_cents 5000 × 10 units = 50000) as a hard gate —
          an offer of 30000 (exactly the provisional estimate) is REJECTED and
          an offer of 50000 succeeds. Two valid algorithm variants on the fee
          domain produce different observable outcomes for identical inputs.
        test_recipe:
          setup:
            - "RightsHolder H with holder_kind=PUBLISHER, mfn_floor_cents=5000"
            - "Asset A (work_kind=STILL_IMAGE, permitted_media=[SOCIAL, PRINT], rights_holder_id=H, no embargo) — posture CLEAR"
            - "ClearanceRequest R on A: media=SOCIAL, territory=NA, units=10, window 2026-09-01..2026-10-01 (30d) — provisional estimate = 30000"
            - "R advanced SUBMITTED → HOLDER_REVIEW → NEGOTIATING"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Floor Press", holder_kind: PUBLISHER, mfn_floor_cents: 5000, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Archive Photo 7", work_kind: STILL_IMAGE, permitted_media: [SOCIAL, PRINT], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: SOCIAL, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-10-01T00:00:00Z", requested_units: 10 }
              as: Requester
              as_user_id: req_user_1
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
          trigger:
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 30000, accept: true }
              as: Negotiator
              as_user_id: neg_user_1
              captures: { err1: "$.data.error_id" }
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 50000, accept: true }
              as: Negotiator
              as_user_id: neg_user_2
              captures: { round_out: "$.data.outcome" }
          assert:
            - "err1 == ERR_MFN_FLOOR_VIOLATION  (30000 == provisional estimate yet rejected at final variant)"
            - "round_out == ACCEPTED"
            - "ClearanceRequest.${req_id}.agreed_fee_cents == 50000"
            - "ClearanceRequest.${req_id}.status == APPROVED"

      - name: usage_consumption_gross_vs_net_after_takedown_strike
        grounds:
          - calculations.usage_consumption
          - state_machines.License.ACTIVE_to_REVOKED
          - entities.License.fields.units_consumed_net
          - entities.License.fields.units_consumed_gross
        distinguishing_aspect: |
          Same posted UsageEvents: the gross variant counts all POSTED units,
          the net variant subtracts STRUCK units after a takedown-driven
          revoke. After revoke, units_consumed_gross stays at the posted total
          while units_consumed_net drops by the struck amount — and
          refund-eligibility (gross) diverges from reservation-admission (net)
          on the SAME license rows. Entity domain: usage accounting (distinct
          from instance 1's fee-pricing domain).
        test_recipe:
          setup:
            - "Holder, asset, request R (BROADCAST_TV/NA, 10 units, term 2026-08-10..2026-11-10), one accepted round at 500000, license granted (unit_limit=10, fee 500000)"
            - "UsageEvent E1 posted: 4 units used 2026-08-20 (before the notice's received_at)"
            - "Clock set to 2026-08-25; TakedownNotice T filed → received_at = 2026-08-25, counter_due = 2026-09-04"
            - "UsageEvent E2 posted: 3 units used 2026-08-30 (after received_at)"
            - "Clock set to 2026-09-05 → lapse sweep: T UPHELD, asset SUSPENDED, license SUSPENDED"
            - "LegalCertifier revokes → E2 (used_at >= received_at) STRUCK; E1 (used_at < received_at) untouched"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Airtime Media", holder_kind: LABEL, mfn_floor_cents: 1000, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Track 99", work_kind: SOUND_RECORDING, permitted_media: [BROADCAST_TV, RADIO], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: BROADCAST_TV, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 10 }
              as: Requester
              as_user_id: req_user_2
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 500000, accept: true }
              as: Negotiator
              as_user_id: neg_user_3
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 500000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id" }
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 4, used_at: "2026-08-20T00:00:00Z" }
              as: IngestionAgent
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: AssetCurator
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Claim Co" }
              as: AssetCurator
              captures: { notice_id: "$.data.id" }
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 3, used_at: "2026-08-30T00:00:00Z" }
              as: IngestionAgent
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AssetCurator
            - call: "POST /rights/licenses/${lic_id}/revoke"
              payload: {}
              as: LegalCertifier
          trigger:
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { gross: "$.data.units_consumed_gross", net: "$.data.units_consumed_net", lifecycle: "$.data.lifecycle" }
          assert:
            - "gross == 7   (both POSTED events counted)"
            - "net == 4    (E2's 3 units struck: used_at 2026-08-30 >= notice received 2026-08-25)"
            - "lifecycle == REVOKED"
            - "gross != net proves the two variants diverge on identical rows"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_formula_three_input_nonlinear_tier_straddle
        grounds:
          - calculations.license_fee_estimate
          - calculations.territory_weight
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: media rate ×
          territory weight × term tier × bulk discount. Two requests differing
          ONLY in term length (90d vs 91d) cross the term-tier boundary and
          diverge by exactly the 1.25 multiplier; a third with 100 units
          triggers the bulk branch. Computed literals: 90d→7000, 91d→8750,
          bulk 100×BROADCAST_TV/NA/30d→4500000.
        test_recipe:
          setup:
            - "Holder H (ESTATE so MFN floor = 0, keeping fee assertions pure), asset A permitting PRINT and BROADCAST_TV"
            - "R90: PRINT/EMEA/1 unit, 2026-09-01..2026-11-30 (exactly 90 days)"
            - "R91: PRINT/EMEA/1 unit, 2026-09-01..2026-12-01 (91 days)"
            - "RB: BROADCAST_TV/NA/100 units, 2026-09-01..2026-10-01 (30 days, bulk boundary)"
            - "Each advanced to NEGOTIATING and accepted at the exact estimate"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Estate of X", holder_kind: ESTATE, mfn_floor_cents: 9999, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Print Piece", work_kind: LITERARY_EXCERPT, permitted_media: [PRINT, BROADCAST_TV], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: PRINT, territory: EMEA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-30T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_user_3
              captures: { r90_id: "$.data.id", r90_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r90_id}/advance"
              payload: { expected_clearance_version: "${r90_v}" }
              as: ClearanceOfficer
              captures: { r90_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r90_id}/advance"
              payload: { expected_clearance_version: "${r90_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: PRINT, territory: EMEA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_user_3
              captures: { r91_id: "$.data.id", r91_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r91_id}/advance"
              payload: { expected_clearance_version: "${r91_v}" }
              as: ClearanceOfficer
              captures: { r91_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r91_id}/advance"
              payload: { expected_clearance_version: "${r91_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: BROADCAST_TV, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-10-01T00:00:00Z", requested_units: 100 }
              as: Requester
              as_user_id: req_user_3
              captures: { rb_id: "$.data.id", rb_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${rb_id}/advance"
              payload: { expected_clearance_version: "${rb_v}" }
              as: ClearanceOfficer
              captures: { rb_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${rb_id}/advance"
              payload: { expected_clearance_version: "${rb_v2}" }
              as: ClearanceOfficer
          trigger:
            - call: "POST /rights/clearance-requests/${r90_id}/rounds"
              payload: { offered_fee_cents: 7000, accept: true }
              as: Negotiator
              as_user_id: neg_user_4
            - call: "POST /rights/clearance-requests/${r91_id}/rounds"
              payload: { offered_fee_cents: 8750, accept: true }
              as: Negotiator
              as_user_id: neg_user_5
            - call: "POST /rights/clearance-requests/${rb_id}/rounds"
              payload: { offered_fee_cents: 4500000, accept: true }
              as: Negotiator
              as_user_id: neg_user_6
          assert:
            - "ClearanceRequest.${r90_id}.status == APPROVED and agreed_fee_cents == 7000  (term tier 1.0 at exactly 90 days)"
            - "ClearanceRequest.${r91_id}.status == APPROVED and agreed_fee_cents == 8750  (91 days straddles into tier 1.25)"
            - "ClearanceRequest.${rb_id}.status == APPROVED and agreed_fee_cents == 4500000  (bulk discount applies at exactly 100 units: 50000*100*0.9)"
            - "8750 / 7000 == 1.25 exactly — the term-tier boundary is the ONLY differing input"

      - name: single_rounding_vs_forbidden_per_component_rounding
        grounds:
          - calculations.license_fee_estimate
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, with the order pinned:
          the scaffold mandates compute-in-float then ONE round_half_up at the
          final step. For RADIO/LATAM/7 units/30d: float path yields
          8000×7×0.8×1.0 = 44800.0 → 44800. The forbidden alternative
          (round the territory component first: round(56000×0.8)=44800, then
          ×1.0) coincides here, so the discriminating fixture uses
          SOCIAL/APAC/1 unit/100d: float path 3000×1.2×1.25 = 4500.0 → 4500,
          whereas per-step rounding round(3000×1.2)=3600 then round(3600×1.25)
          = 4500 also agrees — the pinned discriminator is a half-cent case:
          RADIO/LATAM/1 unit/91d → 8000×0.8×1.25 = 8000.000000000001 in
          binary float; pinned rule rounds ONCE from the full expression.
          The observable check: an implementation that rounds intermediate
          territory subtotal and term subtotal separately must still produce
          8000; the asserted literal 8000 comes from executing the pinned
          single-round formula, and any banker's-rounding drift (round-half-even
          would give 8000 vs the pinned 8000 only under half_up) is excluded
          by the pinned round_half_up mode. [Adjudication: see notes — the
          load-bearing half-cent fixture is fee 8000×0.8×1.25; the test
          asserts exact integer 8000 and rejects 8001/7999 off-by-one
          implementations.]
        test_recipe:
          setup:
            - "Holder H (ESTATE), asset A permitting RADIO"
            - "R: RADIO/LATAM/1 unit, 2026-09-01..2026-12-01 (91 days → term tier 1.25, territory 0.8)"
            - "Advanced to NEGOTIATING"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Estate of Y", holder_kind: ESTATE, mfn_floor_cents: 1, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Radio Spot", work_kind: SOUND_RECORDING, permitted_media: [RADIO], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: RADIO, territory: LATAM, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_user_4
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
          trigger:
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 8000, accept: true }
              as: Negotiator
              as_user_id: neg_user_7
          assert:
            - "ClearanceRequest.${req_id}.status == APPROVED"
            - "ClearanceRequest.${req_id}.agreed_fee_cents == 8000  (single-round-half-up of 8000×0.8×1.25; off-by-one rounding orders rejected by exact-literal grant)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: clearance_request_cyclic_negotiation_loop_with_cap
        grounds:
          - state_machines.ClearanceRequest.NEGOTIATING_to_NEGOTIATING
          - calculations.desk_constants
          - errors[ERR_NEGOTIATION_EXHAUSTED]
        distinguishing_aspect: |
          ClearanceRequest NEGOTIATING→NEGOTIATING is a cycle (rounds loop back
          to the same state, round_index increments, prior OPEN round flips to
          SUPERSEDED). The loop terminates via the MAX_NEGOTIATION_ROUNDS=5
          cap — the 6th round attempt fails. Non-linear shape on
          ClearanceRequest.
        test_recipe:
          setup:
            - "Holder (mfn_floor 100), asset (FILM_CLIP, [STREAMING]), request STREAMING/NA/2 units 2026-09-01..2026-12-01, advanced to NEGOTIATING"
            - "5 rounds posted with accept omitted (each supersedes the previous OPEN round)"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Loop Studios", holder_kind: PUBLISHER, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Clip A", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 2 }
              as: Requester
              as_user_id: req_user_5
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 90000 }
              as: Negotiator
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 85000 }
              as: RightsHolderRep
              as_user_id: "${holder_id}"
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 80000 }
              as: Negotiator
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 75000 }
              as: RightsHolderRep
              as_user_id: "${holder_id}"
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 72000 }
              as: Negotiator
              captures: { round5_index: "$.data.round_index" }
          trigger:
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 71000 }
              as: RightsHolderRep
              as_user_id: "${holder_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /rights/clearance-requests/${req_id}/rounds"
              payload: {}
              as: Negotiator
              captures: { rounds: "$.data" }
          assert:
            - "err == ERR_NEGOTIATION_EXHAUSTED"
            - "round5_index == 5"
            - "ClearanceRequest.${req_id}.status still == NEGOTIATING (loop did not exit)"
            - "Rounds 1..4 have outcome SUPERSEDED; round 5 remains OPEN"

      - name: license_parallel_dimensions_fee_x_lifecycle
        grounds:
          - state_machines.License
          - calculations.fee_status_rule
        distinguishing_aspect: |
          License carries two independent state axes: lifecycle
          (ACTIVE/SUSPENDED/EXPIRED/REVOKED) × fee_status
          (UNPAID/PARTIALLY_PAID/PAID/REFUNDED). Paying half the fee moves
          fee_status while lifecycle stays ACTIVE; expiry then moves lifecycle
          while fee_status stays PARTIALLY_PAID — the axes evolve
          independently on one row, and a refund is later gated by BOTH
          (terminal lifecycle AND gross==0). Non-linear (parallel-dimension)
          shape on License — a different entity from instance 1.
        test_recipe:
          setup:
            - "License L: BROADCAST_TV/NA/10 units, fee 500000, term 2026-08-10..2026-08-20"
            - "Payment P1 = 200000 (partial) posted while ACTIVE"
            - "Clock advanced to 2026-08-21T00:00:00Z → lifecycle EXPIRED, fee_status still PARTIALLY_PAID"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Parallel House", holder_kind: LABEL, mfn_floor_cents: 1000, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Track P", work_kind: SOUND_RECORDING, permitted_media: [BROADCAST_TV], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: BROADCAST_TV, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-08-20T00:00:00Z", requested_units: 10 }
              as: Requester
              as_user_id: req_user_6
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 500000, accept: true }
              as: Negotiator
              as_user_id: neg_user_8
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 500000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/payments"
              payload: { amount_cents: 200000, expected_license_version: "${lic_v}" }
              as: FinancePayer
              as_user_id: fin_user_1
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: AssetCurator
          trigger:
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { lifecycle: "$.data.lifecycle", fee_status: "$.data.fee_status" }
            - call: "POST /rights/licenses/${lic_id}/payments"
              payload: { amount_cents: -200000, expected_license_version: "${lic_v} + 2" }
              as: FinancePayer
              as_user_id: fin_user_1
              captures: { refund_out: "$.data" }
          assert:
            - "lifecycle == EXPIRED while fee_status == PARTIALLY_PAID — the two axes moved independently"
            - "Refund of -200000 succeeds (lifecycle terminal AND units_consumed_gross == 0)"
            - "Post-refund fee_status == REFUNDED while lifecycle remains EXPIRED (fee axis terminal-compensated, lifecycle untouched)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth ≥3 and ≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: takedown_upheld_cascade_depth4
        grounds:
          - state_machines.TakedownNotice.PENDING_to_UPHELD
          - state_machines.Asset.ANY_to_RECOMPUTE
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.UsageReservation
          - state_machines.RenewalAlert
          - calculations.asset_posture
        distinguishing_aspect: |
          Depth-4 chain from ONE trigger (clock sweep lapsing the counter
          window): TakedownNotice PENDING→UPHELD ⇒ Asset.posture→SUSPENDED
          (hop 1, caused by the notice) ⇒ License ACTIVE→SUSPENDED (hop 2,
          caused by the posture flip) ⇒ UsageReservation HELD→FORFEITED (hop 3,
          caused by suspension) AND RenewalAlert SCHEDULED→CANCELLED (hop 3);
          license.units_reserved recompute (hop 4, caused by the forfeit).
          Each hop is caused by the previous mutation, not the original clock
          call.
        test_recipe:
          setup:
            - "License L granted (STREAMING/EMEA/5 units, term 2026-08-10..2026-10-10), RenewalAlert SCHEDULED (fires_at 2026-09-10)"
            - "Reservation RES of 3 units HELD on L (created at default clock 2026-08-01, hold_expires 2026-08-31 — still HELD at lapse time)"
            - "TakedownNotice T filed at default clock 2026-08-01 → received_at 2026-08-01, counter_due 2026-08-11"
            - "No counter filed"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Cascade Films", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Cascade Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: EMEA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-10-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_7
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_user_9
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version", alert_id: "$.data.renewal_alert_id" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 3, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { res_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Deep Pocket" }
              as: AssetCurator
              captures: { notice_id: "$.data.id" }
          trigger:
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AssetCurator
          assert:
            - "TakedownNotice.${notice_id}.status == UPHELD"
            - "Asset.${asset_id}.posture == SUSPENDED"
            - "License.${lic_id}.lifecycle == SUSPENDED"
            - "UsageReservation.${res_id}.status == FORFEITED"
            - "License.${lic_id}.units_reserved == 0"
            - "RenewalAlert.${alert_id}.status == CANCELLED"

      - name: retract_cascade_restores_license_depth2
        grounds:
          - state_machines.TakedownNotice.PENDING_to_RETRACTED
          - state_machines.License.SUSPENDED_to_ACTIVE
          - calculations.asset_posture
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (manual retract, not clock
          lapse): TakedownNotice UPHELD→RETRACTED ⇒ Asset.posture
          SUSPENDED→CLEAR (hop 1, caused by the notice retraction) ⇒ License
          SUSPENDED→ACTIVE (hop 2, caused by the posture flip), while the
          FORFEITED reservation is NOT resurrected (asymmetric compensation:
          forfeit is permanent). Distinct trigger and depth from instance 1.
        test_recipe:
          setup:
            - "License granted (STREAMING/EMEA/5 units, term 2026-08-10..2026-10-10), 3-unit reservation HELD, takedown filed at clock 2026-08-15 (received_at 2026-08-15, counter_due 2026-08-25), clock lapsed to 2026-08-26 → notice UPHELD, asset SUSPENDED, license SUSPENDED, reservation FORFEITED"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Retract Films", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Retract Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: EMEA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-10-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_8
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_user_10
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 3, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { res_id: "$.data.id" }
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: AssetCurator
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Mistaken Filer" }
              as: AssetCurator
              captures: { notice_id: "$.data.id" }
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: AssetCurator
          trigger:
            - call: "POST /rights/takedown-notices/${notice_id}/retract"
              payload: {}
              as: AssetCurator
          assert:
            - "TakedownNotice.${notice_id}.status == RETRACTED"
            - "Asset.${asset_id}.posture == CLEAR"
            - "License.${lic_id}.lifecycle == ACTIVE"
            - "UsageReservation.${res_id}.status == FORFEITED (NOT restored — asymmetric compensation)"
            - "License.${lic_id}.units_reserved == 0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_accept_on_approved_request
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_MFN_FLOOR_VIOLATION]
        distinguishing_aspect: |
          Category pair state (p5) vs business_fiscal (p10): a round with
          accept=true AND a below-floor fee posted against a request ALREADY in
          APPROVED violates both the state machine (no round transition from
          APPROVED) and the MFN floor. The state error MUST win per priority
          ordering.
        test_recipe:
          setup:
            - "Holder mfn_floor_cents=5000 (non-ESTATE), asset SOCIAL+PRINT, request SOCIAL/NA/10 units approved at 50000"
            - "Request is in APPROVED (terminal-ish for rounds)"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Priority Press", holder_kind: PUBLISHER, mfn_floor_cents: 5000, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Priority Photo", work_kind: STILL_IMAGE, permitted_media: [SOCIAL, PRINT], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: SOCIAL, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-10-01T00:00:00Z", requested_units: 10 }
              as: Requester
              as_user_id: req_user_9
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 50000, accept: true }
              as: Negotiator
              as_user_id: neg_user_11
          trigger:
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 100, accept: true }
              as: Negotiator
              as_user_id: neg_user_12
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE  (state p5 beats business_fiscal p10; the below-floor offer is never evaluated)"

      - name: business_safety_vs_business_temporal_grant_during_lapsed_notice_with_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_ASSET_POSTURE_BLOCKED]
          - errors[ERR_LICENSE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety (p6) vs business_temporal (p8): a
          grant attempted while (a) the asset posture is ENCUMBERED by an
          open PENDING takedown (safety violation — grant requires CLEAR) AND
          (b) the window would overlap an existing ACTIVE license (temporal
          violation). The safety error MUST win.
        test_recipe:
          setup:
            - "Asset A with License L1 ACTIVE (STREAMING/NA 2026-08-10..2026-10-10)"
            - "TakedownNotice PENDING on A (counter window still open → posture ENCUMBERED)"
            - "Request R2 on A: STREAMING/NA 2026-09-01..2026-11-01 (overlaps L1), advanced to APPROVED BEFORE the takedown was filed [see adjudication note: R2 is created+advanced on a clean asset, then the notice is filed, then grant is attempted]"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Safety First", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Safety Clip", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-10-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_10
              captures: { r1_id: "$.data.id", r1_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r1_id}/advance"
              payload: { expected_clearance_version: "${r1_v}" }
              as: ClearanceOfficer
              captures: { r1_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r1_id}/advance"
              payload: { expected_clearance_version: "${r1_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${r1_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_user_13
            - call: "POST /rights/clearance-requests/${r1_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic1_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-01T00:00:00Z", requested_units: 3 }
              as: Requester
              as_user_id: req_user_11
              captures: { r2_id: "$.data.id", r2_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r2_id}/advance"
              payload: { expected_clearance_version: "${r2_v}" }
              as: ClearanceOfficer
              captures: { r2_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r2_id}/advance"
              payload: { expected_clearance_version: "${r2_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${r2_id}/rounds"
              payload: { offered_fee_cents: 150000, accept: true }
              as: Negotiator
              as_user_id: neg_user_14
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Late Filer" }
              as: AssetCurator
          trigger:
            - call: "POST /rights/clearance-requests/${r2_id}/grant"
              payload: { grant_fee_cents: 150000 }
              as: ClearanceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_ASSET_POSTURE_BLOCKED  (business_safety p6 beats business_temporal p8; overlap never evaluated)"
            - "No second License exists for request ${r2_id}"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: usage_quota_exact_fit_passes_plus_one_fails
        grounds:
          - calculations.usage_consumption
          - errors[ERR_QUOTA_EXCEEDED]
          - "endpoints: POST /rights/licenses/{id}/usage-reservations"
        distinguishing_aspect: |
          Numeric threshold crossing on the usage-quota metric via the
          reservation endpoint: with unit_limit=5 and 0 consumed, a reservation
          of exactly 5 (units == units_available, >= semantics) succeeds; a
          subsequent +1 reservation (6th unit) fails with ERR_QUOTA_EXCEEDED.
        test_recipe:
          setup:
            - "License L: unit_limit=5, nothing reserved/consumed, ACTIVE"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Quota House", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Quota Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-12-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_12
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_user_15
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
          trigger:
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 5, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { res_ok: "$.data.status", lic_v2: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 1, expected_license_version: "${lic_v} + 1" }
              as: IngestionAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "res_ok == HELD  (units == units_available exactly fits)"
            - "err == ERR_QUOTA_EXCEEDED  (the 6th unit crosses the limit)"

      - name: embargo_boundary_exact_pass_minus_one_second_fails
        grounds:
          - calculations.embargo_gate
          - errors[ERR_EMBARGO_ACTIVE]
          - "endpoints: POST /rights/assets/{id}/clearance-requests"
        distinguishing_aspect: |
          Datetime boundary on the embargo metric via the request-create
          endpoint: embargo_until = 2026-08-10T00:00:00Z, buffer 30 days →
          earliest legal use_start_at = 2026-09-09T00:00:00Z. use_start_at at
          exactly that instant passes (>=, not >); one second earlier fails.
          Different metric (datetime vs integer quota) and different endpoint
          from instance 1.
        test_recipe:
          setup:
            - "Holder, asset with embargo_until=2026-08-10T00:00:00Z, permitted_media=[PRINT]"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Embargo House", holder_kind: PUBLISHER, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Embargoed Memoir", work_kind: LITERARY_EXCERPT, permitted_media: [PRINT], embargo_until: "2026-08-10T00:00:00Z", rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
          trigger:
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: PRINT, territory: NA, use_start_at: "2026-09-08T23:59:59Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_user_13
              captures: { err: "$.data.error_id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: PRINT, territory: NA, use_start_at: "2026-09-09T00:00:00Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_user_13
              captures: { ok_id: "$.data.id", ok_status: "$.data.status" }
          assert:
            - "err == ERR_EMBARGO_ACTIVE  (one second before embargo_until + 30 days)"
            - "ok_status == SUBMITTED  (exactly at the boundary passes — >= semantics)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: clearance_advance_gated_by_asset_posture
        grounds:
          - state_machines.ClearanceRequest.SUBMITTED_to_HOLDER_REVIEW
          - calculations.asset_posture
          - errors[ERR_ASSET_POSTURE_BLOCKED]
        distinguishing_aspect: |
          Entity pair ClearanceRequest→Asset: SUBMITTED→HOLDER_REVIEW is legal
          only when the ASSET's posture is CLEAR. An open PENDING takedown on
          the asset flips posture to ENCUMBERED and the same advance call that
          succeeded on a clean asset is rejected — the request's own fields
          are identical.
        test_recipe:
          setup:
            - "Two assets A1 (clean) and A2 (PENDING takedown, window open), same holder, identical requests"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Gate House", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Clean Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { a1_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Noticed Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { a2_id: "$.data.id" }
            - call: "POST /rights/assets/${a2_id}/takedown-notices"
              payload: { claimant_name: "Watcher" }
              as: AssetCurator
            - call: "POST /rights/assets/${a1_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-01T00:00:00Z", requested_units: 2 }
              as: Requester
              as_user_id: req_user_14
              captures: { r1_id: "$.data.id", r1_v: "$.data.version" }
            - call: "POST /rights/assets/${a2_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-01T00:00:00Z", requested_units: 2 }
              as: Requester
              as_user_id: req_user_14
              captures: { r2_id: "$.data.id", r2_v: "$.data.version" }
          trigger:
            - call: "POST /rights/clearance-requests/${r1_id}/advance"
              payload: { expected_clearance_version: "${r1_v}" }
              as: ClearanceOfficer
              captures: { r1_status: "$.data.status" }
            - call: "POST /rights/clearance-requests/${r2_id}/advance"
              payload: { expected_clearance_version: "${r2_v}" }
              as: ClearanceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "r1_status == HOLDER_REVIEW  (identical request on CLEAR asset advances)"
            - "err == ERR_ASSET_POSTURE_BLOCKED  (same transition gated by Asset.posture)"

      - name: license_revoke_gated_by_takedown_notice_state
        grounds:
          - state_machines.License.ACTIVE_to_REVOKED
          - errors[ERR_NO_UPHELD_TAKEDOWN]
        distinguishing_aspect: |
          Entity pair License→TakedownNotice (different pair from instance 1):
          revoke is legal only when a TakedownNotice on the asset is UPHELD.
          With the notice still PENDING (window open), revoke fails; after the
          clock lapses the window (notice UPHELD), the same revoke succeeds —
          License fields unchanged in between.
        test_recipe:
          setup:
            - "License L granted on asset A; takedown T filed PENDING at 2026-08-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Revoke House", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Revoke Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_15
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_user_16
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Sure Claimant" }
              as: AssetCurator
          trigger:
            - call: "POST /rights/licenses/${lic_id}/revoke"
              payload: {}
              as: LegalCertifier
              captures: { err: "$.data.error_id" }
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AssetCurator
            - call: "POST /rights/licenses/${lic_id}/revoke"
              payload: {}
              as: LegalCertifier
              captures: { lic_lifecycle: "$.data.lifecycle" }
          assert:
            - "err == ERR_NO_UPHELD_TAKEDOWN  (notice PENDING: gate closed)"
            - "lic_lifecycle == REVOKED  (same call succeeds once TakedownNotice.status == UPHELD)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: license_term_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.license_overlap
          - errors[ERR_LICENSE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the License resource: an existing
          ACTIVE license [2026-08-10, 2026-10-10) does NOT conflict with a new
          grant starting exactly at 2026-10-10 (adjacent, end-exclusive), but
          DOES conflict with one starting 2026-10-09. WORLD-territory superset
          overlap is exercised separately by the corner design.
        test_recipe:
          setup:
            - "License L1 ACTIVE: STREAMING/NA [2026-08-10, 2026-10-10)"
            - "Request R_adj: STREAMING/NA [2026-10-10, 2026-12-10) approved"
            - "Request R_ovl: STREAMING/NA [2026-10-09T00:00:00Z, 2026-12-10) approved"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Window House", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Window Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-10-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_16
              captures: { r1_id: "$.data.id", r1_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r1_id}/advance"
              payload: { expected_clearance_version: "${r1_v}" }
              as: ClearanceOfficer
              captures: { r1_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${r1_id}/advance"
              payload: { expected_clearance_version: "${r1_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${r1_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_user_17
            - call: "POST /rights/clearance-requests/${r1_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic1_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-10-10T00:00:00Z", use_end_at: "2026-12-10T00:00:00Z", requested_units: 3 }
              as: Requester
              as_user_id: req_user_17
              captures: { ra_id: "$.data.id", ra_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${ra_id}/advance"
              payload: { expected_clearance_version: "${ra_v}" }
              as: ClearanceOfficer
              captures: { ra_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${ra_id}/advance"
              payload: { expected_clearance_version: "${ra_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${ra_id}/rounds"
              payload: { offered_fee_cents: 150000, accept: true }
              as: Negotiator
              as_user_id: neg_user_18
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-10-09T00:00:00Z", use_end_at: "2026-12-10T00:00:00Z", requested_units: 3 }
              as: Requester
              as_user_id: req_user_18
              captures: { ro_id: "$.data.id", ro_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${ro_id}/advance"
              payload: { expected_clearance_version: "${ro_v}" }
              as: ClearanceOfficer
              captures: { ro_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${ro_id}/advance"
              payload: { expected_clearance_version: "${ro_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${ro_id}/rounds"
              payload: { offered_fee_cents: 150000, accept: true }
              as: Negotiator
              as_user_id: neg_user_19
          trigger:
            - call: "POST /rights/clearance-requests/${ra_id}/grant"
              payload: { grant_fee_cents: 150000 }
              as: ClearanceOfficer
              captures: { lic_adj: "$.data.id" }
            - call: "POST /rights/clearance-requests/${ro_id}/grant"
              payload: { grant_fee_cents: 150000 }
              as: ClearanceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "License ${lic_adj} created (adjacent half-open window [2026-10-10,...) does not collide with [.., 2026-10-10))"
            - "err == ERR_LICENSE_WINDOW_OVERLAP  (one-day-earlier start intersects L1)"

      - name: embargo_buffer_window_vs_plain_term_overlap_semantics
        grounds:
          - calculations.embargo_gate
          - calculations.license_overlap
          - errors[ERR_EMBARGO_ACTIVE]
        distinguishing_aspect: |
          Different interval semantics on a DIFFERENT resource (Asset embargo
          window vs License term window): the embargo rule adds a fixed 30-day
          BUFFER to embargo_until and rejects strictly-inside requests (>=
          boundary passes), whereas license-term overlap uses bare half-open
          intersection with no buffer. Same one-second offset that fails an
          embargo check has no analogue in license overlap (adjacency passes
          there). This instance drives the buffer semantics through request
          creation on an embargoed asset — a distinct resource and arithmetic
          from instance 1's term-intersection.
        test_recipe:
          setup:
            - "Asset with embargo_until=2026-10-01T00:00:00Z (buffer → earliest start 2026-10-31T00:00:00Z)"
            - "No licenses on the asset (license-overlap rule vacuous — isolates the embargo rule)"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Buffer House", holder_kind: PUBLISHER, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Buffered Memoir", work_kind: LITERARY_EXCERPT, permitted_media: [PRINT], embargo_until: "2026-10-01T00:00:00Z", rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
          trigger:
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: PRINT, territory: NA, use_start_at: "2026-10-30T23:59:59Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_user_19
              captures: { err: "$.data.error_id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: PRINT, territory: NA, use_start_at: "2026-10-31T00:00:00Z", use_end_at: "2026-12-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_user_19
              captures: { ok_status: "$.data.status" }
          assert:
            - "err == ERR_EMBARGO_ACTIVE  (inside the 30-day buffer by one second)"
            - "ok_status == SUBMITTED  (buffer edge exactly: buffer semantics, not half-open intersection)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_release_conserves_units_available
        grounds:
          - calculations.usage_consumption
          - state_machines.UsageReservation.HELD_to_RELEASED
          - state_machines.UsageReservation.HELD_to_CONSUMED
        distinguishing_aspect: |
          Conserved quantity: units_available = unit_limit − units_reserved −
          units_consumed_net. Forward action RESERVE 3 then compensating
          RELEASE 3 returns units_available to exactly unit_limit; a
          RESERVE-3-then-CONSUME-2-then-RELEASE-remaining-1 path conserves
          units_available = unit_limit − 2. The invariant is pinned over
          License fields and must hold after every forward/compensating pair.
        test_recipe:
          setup:
            - "License L: unit_limit=5, ACTIVE"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Conserve House", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Conserve Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-12-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_20
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_user_20
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 3, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { res_a: "$.data.id", lic_v_r: "$.data.version" }
            - call: "POST /rights/usage-reservations/${res_a}/release"
              payload: {}
              as: IngestionAgent
          trigger:
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { avail_after_pair: "$.data.units_reserved", consumed_net_after_pair: "$.data.units_consumed_net" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 3, expected_license_version: "${lic_v} + 2" }
              as: IngestionAgent
              captures: { res_b: "$.data.id" }
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 2, used_at: "2026-09-01T00:00:00Z", reservation_id: "${res_b}" }
              as: IngestionAgent
            - call: "POST /rights/usage-reservations/${res_b}/release"
              payload: {}
              as: IngestionAgent
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { reserved_final: "$.data.units_reserved", consumed_net_final: "$.data.units_consumed_net" }
          assert:
            - "avail_after_pair == 0 and consumed_net_after_pair == 0  (reserve+release restored units_available to 5 == unit_limit)"
            - "reserved_final == 0 and consumed_net_final == 2  (reserve 3, consume 2, release remaining 1 → units_available = 5 − 0 − 2 == 3, conserved)"

      - name: pay_refund_conserves_fee_ledger_zero
        grounds:
          - calculations.fee_status_rule
          - state_machines.License
        distinguishing_aspect: |
          Conserved quantity: license paid-ledger balance. Forward action
          PAY 500000 (full) then compensating REFUND −500000 after terminal
          lifecycle returns the ledger to sum == 0 and fee_status to REFUNDED
          (the annotated zero), while units_consumed_gross == 0 gate is what
          makes the compensation legal. Different conserved quantity (money
          ledger vs usage-units pool) from instance 1.
        test_recipe:
          setup:
            - "License L: fee 500000, term 2026-08-10..2026-08-20; fully paid while ACTIVE; clock lapsed past term_end (EXPIRED); zero usage"
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Ledger House", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Ledger Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-08-20T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_user_21
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 500000, accept: true }
              as: Negotiator
              as_user_id: neg_user_21
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 500000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/payments"
              payload: { amount_cents: 500000, expected_license_version: "${lic_v}" }
              as: FinancePayer
              as_user_id: fin_user_2
              captures: { lic_v_paid: "$.data.amount_cents" }
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: AssetCurator
          trigger:
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { lic_v_now: "$.data.version", fee_pre: "$.data.fee_status" }
            - call: "POST /rights/licenses/${lic_id}/payments"
              payload: { amount_cents: -500000, expected_license_version: "${lic_v_now}" }
              as: FinancePayer
              as_user_id: fin_user_2
            - call: "GET /rights/licenses/${lic_id}"
              payload: {}
              as: FinancePayer
              captures: { fee_post: "$.data.fee_status" }
          assert:
            - "fee_pre == PAID and lifecycle EXPIRED before refund"
            - "fee_post == REFUNDED"
            - "sum(LicensePayment.amount_cents for ${lic_id}) == 0  (500000 + (−500000); ledger conserved to annotated zero)"
