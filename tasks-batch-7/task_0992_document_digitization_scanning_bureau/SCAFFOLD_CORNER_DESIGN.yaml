  # ===========================================================================
  - section: rbac
    instances:
      - name: indexer_cannot_create_batches_forbidden
        claim_type: role_permission_denied
        grounds: [roles.Indexer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Role denial is role-based, not user-based: Indexer (a valid authenticated role) gets 403 on POST /batches which is IntakeClerk-exclusive."
        test_recipe:
          setup: ["client + agreement"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "RBAC Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: Indexer, as_user_id: "idx-9", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN (403)"

      - name: client_user_cross_tenant_read_forbidden
        claim_type: role_permission_denied
        grounds: [roles.ClientUser, "validations[priority=2]"]
        distinguishing_aspect: "ClientUser identity is entity-backed: X-User-ID must equal the resource's client_id; client A's user reading client B's batch is 403 even though ClientUser is in the endpoint's role list."
        test_recipe:
          setup: ["clients A and B with agreements; batch created under client B"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Tenant A", hipaa_covered: false }, as: PlatformAdmin, captures: { cidA: $.data.id } }
            - { call: "POST /clients/${cidA}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /clients", payload: { name: "Tenant B", hipaa_covered: false }, as: PlatformAdmin, captures: { cidB: $.data.id } }
            - { call: "POST /clients/${cidB}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cidB}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bidB: $.data.id } }
          trigger:
            - { call: "GET /batches/${bidB}", payload: {}, as: ClientUser, as_user_id: "${cidA}", captures: { err: $.data.error_id } }
            - { call: "GET /batches/${bidB}", payload: {}, as: ClientUser, as_user_id: "${cidB}", captures: { okstat: $.data.status } }
          assert:
            - "cross-tenant: ${err} == ERR_FORBIDDEN"
            - "own-tenant: ${okstat} == INTAKE"

      - name: segregation_of_duties_role_exclusive_chain
        claim_type: role_permission_allowed
        grounds: [roles.ScanOperator, roles.QAReviewer, roles.ComplianceOfficer]
        distinguishing_aspect: "The pipeline's adjacent steps are held by disjoint roles: start-scan works as ScanOperator, pass-qa works as QAReviewer, close works as ComplianceOfficer — each role's exclusive op succeeds only under its own header."
        test_recipe:
          setup: ["full pipeline to CLOSED executed with per-step roles"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "SoD Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 5, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /shelf-slots", payload: { shelf_code: "SH-SOD", zone: "GENERAL", capacity_grams: 2000 }, as: PlatformAdmin, captures: { slot: $.data.id } }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/shelf-assignments", payload: { shelf_slot_id: "${slot}" }, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "CONTRACT", pages: 100, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /documents/${d1}/index-records", payload: { metadata_json: { title: "T1", record_date: "2026-01-01", subject: "S1" }, ocr_text_ref: "ocr://t1" }, as: Indexer, as_user_id: "idx-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /batches/${bid}/deliver", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /boxes/${box1}/begin-destruction", payload: {}, as: DestructionSpecialist, as_user_id: "ds-1" }
            - { call: "POST /boxes/${box1}/destruction-certificates", payload: { witness_user_id: "wit-1", method: "PULP" }, as: DestructionSpecialist, as_user_id: "ds-1" }
          trigger:
            - { call: "POST /batches/${bid}/close", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { err: $.data.error_id } }
            - { call: "POST /batches/${bid}/close", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { final: $.data.status } }
          assert:
            - "role denial on the exclusive op: ${err} == ERR_FORBIDDEN (close is ComplianceOfficer-only)"
            - "every step accepted under its owning role; ${final} == CLOSED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_commit_rejected_then_fresh_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[scan-commit-stale-batch]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Batch.version: a commit carrying the pre-commit version observed before a successful sibling commit is stale by the time it arrives and is rejected 412; re-reading the batch and re-committing with the fresh version succeeds."
        test_recipe:
          setup: ["client + agreement; SCANNING batch with two 50-page documents; two OPEN sessions ss1/ss2 on two scanners; caller observed batch version before ss1's commit"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "OCC Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 50, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d2: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-2", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc2: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss1: $.data.id } }
            - { call: "POST /scan-sessions/${ss1}/page-logs", payload: { document_id: "${d1}", pages: 50 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc2}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss2: $.data.id } }
            - { call: "POST /scan-sessions/${ss2}/page-logs", payload: { document_id: "${d2}", pages: 50 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv_observed: $.data.version } }
            - { call: "POST /scan-sessions/${ss1}/commit", payload: { expected_batch_version: "${bv_observed}" }, as: ScanOperator, as_user_id: "scan-1" }
          trigger:
            - { call: "POST /scan-sessions/${ss2}/commit", payload: { expected_batch_version: "${bv_observed}" }, as: ScanOperator, as_user_id: "scan-1", captures: { err: $.data.error_id } }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv_fresh: $.data.version } }
            - { call: "POST /scan-sessions/${ss2}/commit", payload: { expected_batch_version: "${bv_fresh}" }, as: ScanOperator, as_user_id: "scan-1", captures: { sstat: $.data.status } }
          assert:
            - "stale commit: ${err} == ERR_STALE_VERSION (http 412) — ss1's commit advanced Batch.version past the observed value"
            - "fresh commit: ${sstat} == COMMITTED"
            - "${bv_fresh} == ${bv_observed} + 1 (exactly one mutation landed between)"

      - name: derived_fields_reconciled_immediately_on_commit
        claim_type: derived_field_reconciliation
        grounds: [entities.Batch.fields.scanned_pages, entities.ScanSession.fields.page_count]
        distinguishing_aspect: "Derived fields are reconciled within the same request lifecycle: session page_count accumulates per page-log, and the batch aggregates land in the very response of the commit-triggering read."
        test_recipe:
          setup: ["client + agreement; SCANNING batch with one 80-page document; OPEN session"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Deriv Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 300 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id } }
            - { call: "POST /boxes/${box1}/documents", payload: { doc_type: "OTHER", pages: 80, contains_phi: false, ocr_confidence: 95 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { d1: $.data.id } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches/${bid}/start-scan", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scanner-units", payload: { scanner_code: "SCN-1", capacity_pages_per_session: 500 }, as: PlatformAdmin, captures: { sc: $.data.id } }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss: $.data.id } }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 50 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /scan-sessions/${ss}/page-logs", payload: { document_id: "${d1}", pages: 30 }, as: ScanOperator, as_user_id: "scan-1", captures: { pc: $.data.session_id } }
          trigger:
            - { call: "GET /scan-sessions/${ss}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { pagecount: $.data.page_count } }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv: $.data.version } }
            - { call: "POST /scan-sessions/${ss}/commit", payload: { expected_batch_version: "${bv}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { scanned: $.data.scanned_pages } }
          assert:
            - "accumulation across two logs: ${pagecount} == 80 (50 + 30)"
            - "post-commit read shows ${scanned} == 80 immediately (no async lag)"

      - name: draft_invoice_provisional_recompute_covered
        claim_type: computed_read
        grounds: ["endpoints[GET /invoices/{id}]"]
        excluded_because:
          difficulty_instance: scan_commit_bubbleup_cascade_document_batch_invoice
          rationale: "The DRAFT recompute-on-read is asserted as hop 3 of that §1.8 cascade instance (page_subtotal_cents == 4500 without any invoice-direct mutation)."

      - name: disposition_sweep_side_effects_covered
        claim_type: scheduled_actions
        grounds: [state_machines.Batch.DELIVERED_to_DISPOSITION_PENDING]
        excluded_because:
          difficulty_instance: clock_sweep_cascade_batch_box_shelf
          rationale: "Clock-driven sweep, box transitions, and shelf release are asserted hop-by-hop in the §1.8 cascade instance."

      - name: cascade_side_effect_chain_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: scan_commit_bubbleup_cascade_document_batch_invoice
          rationale: "N-level cascade (commit -> document -> batch -> invoice) verified end-to-end in §1.8."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_next_read
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a box created by POST is visible with status RECEIVED in the very next GET, and the batch version bump from start-prep is visible to a following read with no delay."
        test_recipe:
          setup: ["client + agreement"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Imm Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1", captures: { bid: $.data.id } }
          trigger:
            - { call: "POST /batches/${bid}/boxes", payload: { box_label: "BX-1", intake_weight_grams: 600 }, as: IntakeClerk, as_user_id: "clerk-1", captures: { box1: $.data.id, xstat: $.data.status } }
            - { call: "GET /boxes/${box1}", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { xstat2: $.data.status } }
            - { call: "POST /batches/${bid}/start-prep", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { bv: $.data.version } }
            - { call: "GET /batches/${bid}", payload: {}, as: IntakeClerk, as_user_id: "clerk-1", captures: { bv2: $.data.version, bstat: $.data.status } }
          assert:
            - "${xstat} == RECEIVED in the create response and ${xstat2} == RECEIVED in the immediate read"
            - "${bv} == 2 and the following read confirms ${bv2} == 2 with ${bstat} == PREPPING"
