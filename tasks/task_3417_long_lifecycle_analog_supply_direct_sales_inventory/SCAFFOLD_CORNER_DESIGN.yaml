# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3417_long_lifecycle_analog_supply_direct_sales_inventory
# Breadth probe over SCAFFOLD.yaml 1.1-1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: part_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Part
          - endpoints.POST_/parts
        distinguishing_aspect: "A part created with only the four required inputs returns 201 with lifecycle_status ACTIVE, demand_rate_units_per_week 0, buffer_multiple 1.5, on_hand_units 0, reserved_units 0, posture NORMAL (zero-target rule), version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { part_number: "OPA177FP", description: "Precision op amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { e1_part: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Part.${e1_part}.lifecycle_status == ACTIVE and version == 1"
            - "Part.${e1_part}.demand_rate_units_per_week == 0 and buffer_multiple == 1.5 (defaults)"
            - "Part.${e1_part}.on_hand_units == 0 and reserved_units == 0 (system-controlled)"
            - "Part.${e1_part}.posture == NORMAL (target_trailing_units == 0 rule)"
            - "response data carries non-null id, created_at, updated_at; meta.api_request_id present"

      - name: part_create_missing_part_number_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Part.fields.part_number
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required part_number yields ERR_INVALID_REQUEST 400 while every other required field is present."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { description: "No number", package_family: "SOIC", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { e2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
            - "no Part is persisted (a subsequent GET /parts/{any id} is 404)"

      - name: part_create_computed_field_input_rejected
        claim_type: System Fields
        grounds:
          - entities.Part.fields.on_hand_units
          - validations[priority=4]
        distinguishing_aspect: "Client-supplied computed/system fields (on_hand_units) are unknown input on POST /parts and rejected with ERR_INVALID_REQUEST, not silently ignored."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { part_number: "OPA177GQ", description: "Sneaky stock", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR", on_hand_units: 9999 }
              as: SupplyPlanner
              captures: { e3_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: customer_create_invalid_tier_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.tier
          - validations[priority=4]
        distinguishing_aspect: "tier must be one of STRATEGIC | KEY | STANDARD | SMALL; 'VIP' is rejected with ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Enum Testers", tier: "VIP", channel: "DIRECT_FIELD", credit_limit_cents: 1000 }
              as: ChannelManager
              captures: { e4_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: order_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.SalesOrder
          - endpoints.GET_/orders/{id}
        distinguishing_aspect: "A freshly created DRAFT order round-trips through GET with the channel snapshot copied from the customer, null pricing fields, and status DRAFT — immediate consistency, no lag."
        test_recipe:
          setup: ["One STANDARD / DIRECT_ONLINE customer; one part; one DRAFT order of 3 units."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TL072CP", description: "JFET op amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { e6_part: $.data.id }
            - call: "POST /customers"
              payload: { name: "Roundtrip Co", tier: "STANDARD", channel: "DIRECT_ONLINE", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { e6_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${e6_cust}", lines: [{ part_id: "${e6_part}", quantity: 3 }] }
              as: Customer
              as_user_id: "${e6_cust}"
              captures: { e6_ord: $.data.id }
          trigger:
            - call: "GET /orders/${e6_ord}"
              payload: {}
              as: ChannelManager
          assert:
            - "status == DRAFT; channel == DIRECT_ONLINE (snapshot of the customer's channel)"
            - "subtotal_cents and total_cents are null and submitted_at is null while DRAFT; service_fee_cents == 0 (declared default)"
            - "customer_id == ${e6_cust}; version == 1"
      - name: orders_list_paginates_with_total_count_has_more_and_scope
        claim_type: Listing
        grounds:
          - endpoints.GET_/orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three orders on customer A: limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status filter narrows; Customer B sees only its own (zero) orders."
        test_recipe:
          setup: ["Customer A with three DRAFT orders; customer B with none. Clock at default."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM324N", description: "Quad op amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { e7_part: $.data.id }
            - call: "POST /customers"
              payload: { name: "Paged A", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { e7_cust_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Paged B", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { e7_cust_b: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${e7_cust_a}", lines: [{ part_id: "${e7_part}", quantity: 1 }] }
              as: Customer
              as_user_id: "${e7_cust_a}"
            - call: "POST /orders"
              payload: { customer_id: "${e7_cust_a}", lines: [{ part_id: "${e7_part}", quantity: 2 }] }
              as: Customer
              as_user_id: "${e7_cust_a}"
            - call: "POST /orders"
              payload: { customer_id: "${e7_cust_a}", lines: [{ part_id: "${e7_part}", quantity: 3 }] }
              as: Customer
              as_user_id: "${e7_cust_a}"
          trigger:
            - call: "GET /orders"
              payload: { customer_id: "${e7_cust_a}", limit: 2, offset: 0 }
              as: ChannelManager
            - call: "GET /orders"
              payload: { customer_id: "${e7_cust_a}", limit: 2, offset: 2 }
              as: ChannelManager
            - call: "GET /orders"
              payload: { status: "DRAFT" }
              as: ChannelManager
            - call: "GET /orders"
              payload: {}
              as: Customer
              as_user_id: "${e7_cust_b}"
          assert:
            - "page 1: exactly 2 rows, total_count == 3, has_more == true"
            - "page 2: exactly 1 row, total_count == 3, has_more == false"
            - "status=DRAFT filter returns 3 rows"
            - "as Customer B with no customer_id filter: total_count == 0 (role scoping — never sees A's orders)"

      - name: entity_gets_with_unknown_ids_return_specific_404
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors.ERR_PART_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_ALLOCATION_RUN_NOT_FOUND
        distinguishing_aspect: "Every resource family returns its own entity-specific 404 error id (never a generic 404) when a syntactically valid but unallocated UUID is addressed."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "GET /parts/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: PlatformAdmin
              captures: { nf_part: $.data.error_id }
            - call: "GET /customers/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: PlatformAdmin
              captures: { nf_cust: $.data.error_id }
            - call: "GET /orders/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: PlatformAdmin
              captures: { nf_ord: $.data.error_id }
            - call: "GET /order-lines/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: PlatformAdmin
              captures: { nf_line: $.data.error_id }
            - call: "GET /capacity-pools/00000000-0000-0000-0000-0000000000a5"
              payload: {}
              as: PlatformAdmin
              captures: { nf_pool: $.data.error_id }
            - call: "GET /lifetime-buys/00000000-0000-0000-0000-0000000000a6"
              payload: {}
              as: PlatformAdmin
              captures: { nf_ltb: $.data.error_id }
            - call: "GET /design-wins/00000000-0000-0000-0000-0000000000a7"
              payload: {}
              as: PlatformAdmin
              captures: { nf_dw: $.data.error_id }
            - call: "POST /allocation-runs/00000000-0000-0000-0000-0000000000a8/publish"
              payload: {}
              as: SupplyPlanner
              captures: { nf_run: $.data.error_id }
            - call: "POST /eol-notices/00000000-0000-0000-0000-0000000000a9/rescind"
              payload: {}
              as: SupplyPlanner
              captures: { nf_notice: $.data.error_id }
            - call: "POST /site-qualifications/00000000-0000-0000-0000-0000000000aa/transition"
              payload: { to_state: "IN_REVIEW" }
              as: QualityEngineer
              captures: { nf_qual: $.data.error_id }
            - call: "POST /reference-designs/00000000-0000-0000-0000-0000000000ab/publish"
              payload: {}
              as: FieldEngineer
              captures: { nf_rd: $.data.error_id }
          assert:
            - "part -> ERR_PART_NOT_FOUND; customer -> ERR_CUSTOMER_NOT_FOUND; order -> ERR_ORDER_NOT_FOUND; order line -> ERR_ORDER_LINE_NOT_FOUND"
            - "pool -> ERR_CAPACITY_POOL_NOT_FOUND; lifetime buy -> ERR_LIFETIME_BUY_NOT_FOUND; design win -> ERR_DESIGN_WIN_NOT_FOUND"
            - "run publish -> ERR_ALLOCATION_RUN_NOT_FOUND; notice rescind -> ERR_EOL_NOTICE_NOT_FOUND; qualification transition -> ERR_SITE_QUALIFICATION_NOT_FOUND; reference-design publish -> ERR_REFERENCE_DESIGN_NOT_FOUND"
            - "all responses HTTP 404 with the standard error envelope"

      - name: part_initial_state_active_on_create
        claim_type: Initial State
        grounds:
          - state_machines.Part
        excluded_because:
          difficulty_instance: part_lifecycle_eol_rescind_cycle
          rationale: "The cycle instance's chain asserts ACTIVE at creation and re-arrival at ACTIVE after rescission; initial state is asserted there."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_second_submit_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.SalesOrder.DRAFT_to_ALLOCATED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Repeating the same submit trigger on an already-ALLOCATED order is rejected with ERR_INVALID_STATE and changes nothing — submits are not idempotent."
        test_recipe:
          setup: ["Part NORMAL (demand 0) with 100 on hand and a 100-cent schedule; customer STANDARD / DIRECT_FIELD credit 1000000; order of 5 submitted once (ALLOCATED)."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "SN7404N", description: "Hex inverter", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { s1_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { s1_pool: $.data.id }
            - call: "POST /parts/${s1_part}/receipts"
              payload: { capacity_pool_id: "${s1_pool}", units: 100 }
              as: SupplyPlanner
              captures: { s1_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${s1_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${s1_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Idem Co", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { s1_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${s1_cust}", lines: [{ part_id: "${s1_part}", quantity: 5 }] }
              as: Customer
              as_user_id: "${s1_cust}"
              captures: { s1_ord: $.data.id }
            - call: "POST /orders/${s1_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${s1_cust}"
          trigger:
            - call: "POST /orders/${s1_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${s1_cust}"
              captures: { s1_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "GET /orders/${s1_ord}: status still ALLOCATED, total_cents == 500 (no double price lock)"
            - "GET /parts/${s1_part}: reserved_units == 5 (no double reservation)"

      - name: ship_backordered_order_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SalesOrder.ALLOCATED_to_SHIPPED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Ship is declared only from ALLOCATED; a BACKORDERED order (shortage part, no award) rejects ship with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Part shortage: demand 40, buffer 1.5, target 1560, on_hand 50 (coverage 0.0321); schedule 100 cents; order of 10 submitted -> BACKORDERED with awarded_units 0."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TLV2462IDR", description: "RRIO op amp", package_family: "SOIC", process_technology: "CMOS_180NM", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { s2_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { s2_pool: $.data.id }
            - call: "POST /parts/${s2_part}/receipts"
              payload: { capacity_pool_id: "${s2_pool}", units: 50 }
              as: SupplyPlanner
              captures: { s2_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${s2_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${s2_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Backorder Co", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { s2_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${s2_cust}", lines: [{ part_id: "${s2_part}", quantity: 10 }] }
              as: Customer
              as_user_id: "${s2_cust}"
              captures: { s2_ord: $.data.id }
            - call: "POST /orders/${s2_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${s2_cust}"
          trigger:
            - call: "POST /orders/${s2_ord}/ship"
              payload: {}
              as: SupplyPlanner
              captures: { s2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "GET /orders/${s2_ord}: status still BACKORDERED"
            - "GET /parts/${s2_part}: on_hand_units == 50 unchanged"

      - name: cancel_shipped_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SalesOrder
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "SHIPPED is terminal: after ship decrements on_hand from 100 to 90, a cancel attempt is rejected and the shipped quantities stay shipped (no compensation fires from a terminal state)."
        test_recipe:
          setup: ["Part NORMAL demand 0, on_hand 100, schedule 100 cents; customer STANDARD / DIRECT_FIELD credit 1000000; order of 10 submitted (ALLOCATED) then shipped."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "CD4011BE", description: "NAND gate", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { s3_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { s3_pool: $.data.id }
            - call: "POST /parts/${s3_part}/receipts"
              payload: { capacity_pool_id: "${s3_pool}", units: 100 }
              as: SupplyPlanner
              captures: { s3_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${s3_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${s3_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Shipper Co", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { s3_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${s3_cust}", lines: [{ part_id: "${s3_part}", quantity: 10 }] }
              as: Customer
              as_user_id: "${s3_cust}"
              captures: { s3_ord: $.data.id }
            - call: "POST /orders/${s3_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${s3_cust}"
            - call: "POST /orders/${s3_ord}/ship"
              payload: {}
              as: SupplyPlanner
          trigger:
            - call: "POST /orders/${s3_ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${s3_cust}"
              captures: { s3_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "GET /orders/${s3_ord}: status == SHIPPED"
            - "GET /parts/${s3_part}: on_hand_units == 90, reserved_units == 0 (ship already consumed the stock)"
            - "GET /customers/${s3_cust}: open_exposure_cents == 0 (exposure released at ship, not re-released)"

      - name: qualification_skip_in_review_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SiteQualification.REQUESTED_to_IN_REVIEW
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "REQUESTED -> QUALIFIED is not a declared transition; the workflow forces the IN_REVIEW hop first."
        test_recipe:
          setup: ["One SiteQualification (site KFAB, segment INDUSTRIAL) freshly created in REQUESTED."]
          setup_api_calls:
            - call: "POST /site-qualifications"
              payload: { site_name: "KFAB", segment: "INDUSTRIAL" }
              as: QualityEngineer
              captures: { s4_qual: $.data.id }
          trigger:
            - call: "POST /site-qualifications/${s4_qual}/transition"
              payload: { to_state: "QUALIFIED" }
              as: QualityEngineer
              captures: { s4_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "the qualification remains REQUESTED (no GET needed: a subsequent legal transition to IN_REVIEW succeeds)"

      - name: qualification_suspend_requalify_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.SiteQualification.QUALIFIED_to_SUSPENDED
          - state_machines.SiteQualification.SUSPENDED_to_QUALIFIED
          - entities.CapacityPool.fields.qualified_for_automotive
        distinguishing_aspect: "The QUALIFIED -> SUSPENDED -> QUALIFIED loop is legal, and each pass flips the derived CapacityPool.qualified_for_automotive flag for matching site_name pools."
        test_recipe:
          setup: ["Capacity pool at site ATX-ASSEMBLY (window open at default clock); qualification (ATX-ASSEMBLY, AUTOMOTIVE) driven to QUALIFIED."]
          setup_api_calls:
            - call: "POST /capacity-pools"
              payload: { site_name: "ATX-ASSEMBLY", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { s5_pool: $.data.id }
            - call: "POST /site-qualifications"
              payload: { site_name: "ATX-ASSEMBLY", segment: "AUTOMOTIVE" }
              as: QualityEngineer
              captures: { s5_qual: $.data.id }
            - call: "POST /site-qualifications/${s5_qual}/transition"
              payload: { to_state: "IN_REVIEW" }
              as: QualityEngineer
            - call: "POST /site-qualifications/${s5_qual}/transition"
              payload: { to_state: "QUALIFIED" }
              as: QualityEngineer
          trigger:
            - call: "POST /site-qualifications/${s5_qual}/transition"
              payload: { to_state: "SUSPENDED" }
              as: QualityEngineer
              captures: { s5_mid: $.data.status }
            - call: "POST /site-qualifications/${s5_qual}/transition"
              payload: { to_state: "QUALIFIED" }
              as: QualityEngineer
              captures: { s5_final: $.data.status }
          assert:
            - "suspend response status == SUSPENDED; requalify response status == QUALIFIED (cycle closed)"
            - "GET /capacity-pools/${s5_pool}: qualified_for_automotive == true after requalification"
            - "during the SUSPENDED interlude the pool's flag was false (observable via the same GET before the requalify — sequence the assertions accordingly)"

      - name: pool_clock_sweep_planned_open_closed_with_boundary
        claim_type: Valid Transition
        grounds:
          - state_machines.CapacityPool
          - errors.ERR_POOL_NOT_OPEN
        distinguishing_aspect: "Clock-derived pool status with inclusive-start / exclusive-end semantics: PLANNED before period_start, OPEN at exactly period_start, CLOSED at exactly period_end; receipts are accepted only while OPEN."
        test_recipe:
          setup: ["One non-automotive part; one pool [2026-10-01, 2026-11-01) — at the default clock 2026-09-01 it is PLANNED."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "SN7400N", description: "Quad NAND", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { s6_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "LFAB", process_technology: "CMOS_180NM", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { s6_pool: $.data.id, s6_planned: $.data.status }
            - call: "POST /parts/${s6_part}/receipts"
              payload: { capacity_pool_id: "${s6_pool}", units: 10 }
              as: SupplyPlanner
              captures: { s6_err1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /parts/${s6_part}/receipts"
              payload: { capacity_pool_id: "${s6_pool}", units: 50 }
              as: SupplyPlanner
              captures: { s6_ok_oh: $.data.on_hand_units }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /parts/${s6_part}/receipts"
              payload: { capacity_pool_id: "${s6_pool}", units: 10 }
              as: SupplyPlanner
              captures: { s6_err2: $.data.error_id }
          assert:
            - "create response status == PLANNED (default clock precedes period_start)"
            - "receipt while PLANNED: error_id == ERR_POOL_NOT_OPEN, HTTP 422"
            - "at exactly 2026-10-01T00:00:00Z the pool is OPEN (inclusive start) and the receipt of 50 succeeds: on_hand_units == 50"
            - "at exactly 2026-11-01T00:00:00Z the pool is CLOSED (exclusive end): trigger receipt -> error_id == ERR_POOL_NOT_OPEN"
            - "GET /capacity-pools/${s6_pool}: allocated_units == 50, status == CLOSED"

      - name: eol_clock_sweep_drives_last_time_buy_and_discontinued
        claim_type: Valid Transition
        grounds:
          - state_machines.Part.EOL_ANNOUNCED_to_LAST_TIME_BUY
          - state_machines.Part.LAST_TIME_BUY_to_DISCONTINUED
          - state_machines.EolNotice.ANNOUNCED_to_COMPLETED
        distinguishing_aspect: "The logical-clock sweep fires both date-gated part transitions at their exact instants (>= semantics) and completes the linked notice only at DISCONTINUED."
        test_recipe:
          setup: ["Part with ANNOUNCED notice: notice 2026-09-01, last_order 2027-02-28, last_ship 2027-05-29."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "CD4001BE", description: "NOR gate", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { s7_part: $.data.id }
            - call: "POST /parts/${s7_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "EOL program" }
              as: SupplyPlanner
              captures: { s7_notice: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /parts/${s7_part}"
              payload: {}
              as: SupplyPlanner
              captures: { s7_mid: $.data.lifecycle_status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-29T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "at exactly last_order_date the part is LAST_TIME_BUY (>= boundary), captured mid-state == LAST_TIME_BUY"
            - "after the trigger sweep: GET /parts/${s7_part} shows lifecycle_status == DISCONTINUED"
            - "GET /parts/${s7_part}/eol-notices: the notice status == COMPLETED"
            - "DISCONTINUED is terminal: no further lifecycle transition is declared from it"

      - name: rescind_rescinded_notice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EolNotice.ANNOUNCED_to_RESCINDED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "RESCINDED is terminal for EolNotice: a second rescind is rejected with ERR_INVALID_STATE and the part (already back to ACTIVE) is untouched."
        test_recipe:
          setup: ["Part with a notice created then rescinded (part back to ACTIVE)."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "CD4013BE", description: "Dual D flip-flop", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { s8_part: $.data.id }
            - call: "POST /parts/${s8_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "Premature notice" }
              as: SupplyPlanner
              captures: { s8_notice: $.data.id }
            - call: "POST /eol-notices/${s8_notice}/rescind"
              payload: {}
              as: SupplyPlanner
          trigger:
            - call: "POST /eol-notices/${s8_notice}/rescind"
              payload: {}
              as: SupplyPlanner
              captures: { s8_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "GET /parts/${s8_part}: lifecycle_status == ACTIVE (second rescind did not re-fire the cascade)"

      - name: design_win_completes_at_four_year_anniversary
        claim_type: Valid Transition
        grounds:
          - state_machines.DesignWin.ACTIVE_to_COMPLETED
          - calculations.calc_revenue_tail
        distinguishing_aspect: "At start_date + 4 years exactly, the sweep moves the win to COMPLETED and both recognition profiles have fully recognized the expected revenue (1000000 cents each — variants converge only at end of life)."
        test_recipe:
          setup: ["Part ACTIVE; published reference design; one ACTIVE design win start_date 2027-01-01, expected 1000000."]
          setup_api_calls:
