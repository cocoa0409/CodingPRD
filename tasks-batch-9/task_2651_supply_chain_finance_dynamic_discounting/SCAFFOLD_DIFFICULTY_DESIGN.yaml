  - rule_id: non_linear_state_machine
    instances:
      - name: offer_counter_rename_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.DiscountOffer (shape cyclic)
          - state_machines.DiscountOffer.NAMED_to_COUNTERED
          - state_machines.DiscountOffer.COUNTERED_to_NAMED
          - validations[priority=21]
          - global_constants.MAX_COUNTER_ROUNDS
          - errors.ERR_COUNTER_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          A cycle with a bounded loop counter that only advances on one of the two edges:
          counter_round increments on COUNTERED -> NAMED (rename) and not on NAMED -> COUNTERED
          (counter), so the offer legally traverses the loop three times and the FOURTH counter is
          rejected with ERR_COUNTER_ROUNDS_EXHAUSTED while the offer is still in NAMED and still
          acceptable. Each edge also requires a strictly rising APR, so the ladder cannot revisit
          a rate it has already used.
        test_recipe:
          setup:
            - "SUPPLIER_NAMED programme OPEN with max_acceptable_apr_bps 1200; LIVE session"
            - "One fully onboarded supplier and one ELIGIBLE invoice"
            - "One NAMED offer at 700 bps"
