              captures: { trip_2_id: $.data.id }
          trigger:
            - call: "GET /programs"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /programs"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "GET /programs"
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "GET /programs"
              as: ThirdPartyTester
              as_user_id: "tester-1"
            - call: "GET /programs"
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: ThirdPartyTester
              as_user_id: "tester-1"
            - call: "POST /inspection-trips/${trip_1_id}/hold"
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
            - call: "POST /inspection-trips/${trip_2_id}/cancel"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "all five GET /programs calls return 200 with total_count == 1 — reads are shared by every role"
            - "the ThirdPartyTester clock call returns 200 with current_utc == \"2026-08-02T00:00:00Z\""
            - "the committee hold is 200: InspectionTrip.${trip_1_id}.status == \"HELD\" with held_at == \"2026-08-02T00:00:00.000Z\", and UnitOrder.${unit_id}.build_status == \"PRE_CON_HELD\""
            - "the admin cancel is 200: InspectionTrip.${trip_2_id}.status == \"CANCELLED\" and the unit stays PRE_CON_HELD"
            - "GET /inspection-trips?unit_order_id=${unit_id}&status=HELD returns total_count == 1"

  - section: complexity_layers
    instances:

      - name: slot_line_optimistic_concurrency_rejects_stale_capacity_reads
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-slot-line]
          - validations[priority=8]
          - errors.ERR_STALE_SLOT_LINE_VERSION
          - entities.SupplierSlotLine.fields.version
        distinguishing_aspect: |
          SupplierSlotLine.version advances on EVERY write that changes the free-slot
          picture — reservation creation and release alike — so a client replaying the
          version it read before a sibling booking (or before a release) is rejected
          412 ERR_STALE_SLOT_LINE_VERSION, and only a freshly read version is
          accepted. The sibling rule change-order-create-stale-unit is covered by the
          §1.9 validations instance stale_version_check_rejects_before_the_markup_cap.
        test_recipe:
          setup:
            - "one ACTIVE ApparatusProgram and one SupplierSlotLine with total_slot_count 3 at version 1"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Concurrency program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 3 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, line_v1: $.data.version }
          trigger:
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_a_id: $.data.id }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-10-01T00:00:00Z", slot_end_date: "2026-10-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_stale_1: $.data.error_id }
            - call: "GET /slot-lines/${line_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_v2: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-10-01T00:00:00Z", slot_end_date: "2026-10-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v2}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_b_id: $.data.id }
            - call: "POST /chassis-reservations/${res_a_id}/release"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-11-01T00:00:00Z", slot_end_date: "2026-11-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v2}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_stale_2: $.data.error_id }
            - call: "GET /slot-lines/${line_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_v3: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-11-01T00:00:00Z", slot_end_date: "2026-11-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v3}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_c_id: $.data.id }
          assert:
            - "${line_v1} == 1 at creation; after the first reservation ${line_v2} == 2 — every capacity-changing write increments the line version"
            - "${e_stale_1} == ERR_STALE_SLOT_LINE_VERSION with HTTP 412 — the windows do not overlap and a slot was free, so this is purely the concurrency guard"
            - "the retry with ${line_v2} is 201 (${res_b_id}) and the line reaches version 3"
            - "${e_stale_2} == ERR_STALE_SLOT_LINE_VERSION with HTTP 412 — a RELEASE also advanced the version (to 4), so a version read before it is stale even though capacity grew"
            - "${line_v3} == 4 and the final booking is 201 (${res_c_id}), leaving version 5"
            - "ChassisReservation.${res_a_id}.status == \"RELEASED\"; SupplierSlotLine.${line_id}.reserved_slot_count == 2 and available_slot_count == 1; GET /chassis-reservations?slot_line_id=${line_id} returns total_count == 3"

      - name: soft_ceiling_auto_suspension_is_strict_at_the_exact_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.program_committed_cents.constants
          - state_machines.ApparatusProgram.ACTIVE_to_SUSPENDED
          - validations[priority=52]
          - entities.ApparatusProgram.fields.suspension_reason
        distinguishing_aspect: |
          With contract_ceiling_cents 75862222 the soft ceiling rounds to exactly
          68276000, which is exactly the single award's committed amount: the program
          stays ACTIVE because the trigger is a strict `>`. Approving a change order
          worth ONE cent takes committed_cents to 68276001 and auto-suspends the
          program inside that same successful request.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with contract_ceiling_cents 75862222 (soft ceiling round_half_up(75862222 * 90 / 100) == 68276000), one RELEASED spec and one PUMPER award of 68276000"
            - "the unit is at PRE_CON_HELD with a HELD PRE_CONSTRUCTION trip so a change order can be submitted"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Boundary program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 75862222 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Boundary spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
            - call: "POST /plant-bays"
              payload: { name: "Bay A", max_concurrent_visitors: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { status_at_boundary: $.data.status }
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "PRE_CONSTRUCTION", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", committee_size: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_id: $.data.id }
            - call: "POST /inspection-trips/${trip_id}/hold"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /unit-orders/${unit_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { unit_v: $.data.version }
            - call: "POST /change-orders"
              payload: { unit_order_id: "${unit_id}", inspection_trip_id: "${trip_id}", line_items: [{ description: "One cent documentation fee", quantity: 1, unit_cost_cents: 1, markup_pct: 0.0, is_taxable: false }], weight_delta_front_kg: 0, weight_delta_rear_kg: 0, expected_unit_order_version: "${unit_v}" }
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/submit"
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
            - call: "POST /change-orders/${co_id}/approve"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          assert:
            - "after the award: ApparatusProgram.${prog_id}.committed_cents == 68276000, ${status_at_boundary} == \"ACTIVE\" and suspension_reason == null — committed_cents equal to the soft ceiling does NOT suspend"
            - "ChangeOrder.${co_id}.price_delta_cents == 1 (quantity 1 x 1 cent, no markup, not taxable)"
            - "the approve returns 200 with status == \"APPROVED\" and applied_at == \"2026-08-01T00:00:00.000Z\" — the triggering write still succeeds"
            - "UnitOrder.${unit_id}.change_order_total_cents == 1 and open_change_order_count == 0"
            - "ApparatusProgram.${prog_id}.committed_cents == 68276001 with status == \"SUSPENDED\" and suspension_reason == \"SOFT_CEILING_BREACH\" — one cent past the boundary flips it"
            - "no ERR_CONTRACT_CEILING_EXCEEDED is raised: 68276001 is far below the hard ceiling 75862222"

      - name: cascade_a_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_approval_cascades_weight_certification_build_and_trip
          rationale: "All four CASCADE A hops plus the ledger sync are asserted hop by hop there, including the ordering-sensitive certification reset."

      - name: cascade_b_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.BidSpecification.UNDER_REVIEW_to_RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / specification_supersede_cascades_void_drift_and_certification
          rationale: "The supersede cascade (predecessor SUPERSEDED, entries VOID, spec_drift_flag, certification invalidation) is asserted there, including the terminal-unit exclusion."

      - name: dual_variant_delta_when_the_price_variant_switches
        claim_type: dual_variant_calculation
        grounds:
          - calculations.unit_award_price.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / award_locked_versus_delivery_year_escalation_price
          rationale: "The switch from the award-locked to the delivery-year variant and the resulting price_variance_cents are asserted there."

      - name: compensating_rescind_leaves_no_ledger_drift
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_RESCINDED
        excluded_because:
          difficulty_instance: compensating_invariant / rescind_restores_money_and_axle_loads_without_undoing_state_hops
          rationale: "That instance proves the money and weight side effects reverse exactly while the state hops the cascade caused are NOT undone."

  - section: consistency_model
    instances:

      - name: derived_fields_are_visible_immediately_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.program_committed_cents
          - calculations.slot_line_utilization
        distinguishing_aspect: |
          Every derived field is authoritative the instant its trigger returns: the
          award response already carries the computed price and axle loads, the very
          next read of the program shows committed_cents 68276000, the reservation
          response's sibling line read shows available_slot_count already decremented,
          and a cancellation's reversal is visible with no intervening sweep.
        test_recipe:
          setup:
            - "one ACTIVE program with a RELEASED specification and one SupplierSlotLine with total_slot_count 2"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Immediate program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Immediate spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, line_v: $.data.version }
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id, price_in_create: $.data.price_cents }
            - call: "GET /programs/${prog_id}"
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { committed_after_award: $.data.committed_cents }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", unit_order_id: "${unit_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_id: $.data.id }
            - call: "GET /slot-lines/${line_id}"
              as: ThirdPartyTester
              as_user_id: "tester-1"
              captures: { available_after_hold: $.data.available_slot_count }
            - call: "POST /unit-orders/${unit_id}/cancel"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /programs/${prog_id}"
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { committed_after_cancel: $.data.committed_cents }
            - call: "GET /slot-lines/${line_id}"
              as: ThirdPartyTester
              as_user_id: "tester-1"
              captures: { available_after_cancel: $.data.available_slot_count }
          assert:
            - "${price_in_create} == 68276000 and the same response already carries front_axle_load_kg 5810, rear_axle_load_kg 10110, gross_weight_kg 15920 and weight_status \"WITHIN_LIMITS\" — no second read is needed"
            - "${committed_after_award} == 68276000 on the immediately following read; no sweep, delay or ops-run was involved"
            - "${available_after_hold} == 1 and long_lead_status on UnitOrder.${unit_id} == \"SLOT_RESERVED\" right after the reservation response"
            - "${committed_after_cancel} == 0 — the cancellation's ledger reversal is visible in the very next request"
            - "${available_after_cancel} == 2 and ChassisReservation.${res_id}.status == \"RELEASED\" — the cancel cascade freed the slot immediately"
