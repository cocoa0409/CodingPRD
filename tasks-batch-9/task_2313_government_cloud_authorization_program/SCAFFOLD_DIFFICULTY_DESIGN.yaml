  - name: poam_remediation_and_risk_disposition_dimensions_advance_independently
    grounds:
    - state_machines.PoamItem.remediation_status_IN_REMEDIATION_to_AWAITING_VERIFICATION
    - state_machines.PoamItem.risk_disposition_DEVIATION_REQUESTED_to_EXTENSION_GRANTED
    - state_machines.PoamItem.remediation_status_AWAITING_VERIFICATION_to_CLOSED
    - calculations.poam_remediation_deadline
    distinguishing_aspect: 'The same PoamItem row carries two orthogonal state dimensions: the BOARD approval moves risk_disposition
      DEVIATION_REQUESTED -> EXTENSION_GRANTED and rewrites deadline_at to 2026-04-02T00:00:00Z while remediation_status stays
      AWAITING_VERIFICATION, and the later VERIFY_CLOSE moves remediation_status to CLOSED without resetting risk_disposition.'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; offering PATH_SELECTED (AGENCY_SPONSORED) with an engagement whose assessor_user_id is
        3pao-1.
      - PoamItem severity HIGH, source SELF_IDENTIFIED, detected_at 2026-02-01T00:00:00Z -> deadline_at 2026-03-03T00:00:00Z
        (BASE_DAYS_HIGH 30).
      - Remediation dimension driven OPEN -> IN_REMEDIATION -> AWAITING_VERIFICATION.
      - A DeviationRequest of kind OPERATIONAL_REQUIREMENT for 30 days is routed to the BOARD queue by board-1 and is in BOARD_REVIEW.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
