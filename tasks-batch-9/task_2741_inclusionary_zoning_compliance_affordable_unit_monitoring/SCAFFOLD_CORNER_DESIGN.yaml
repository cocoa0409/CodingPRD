          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 20 units, approval 2026-01-15) screened SUBJECT (2 units required, total_obligation 20000 bps), ONSITE elected, agreement recorded."
            - "Two RENTAL 2-bedroom units at 5000 bps: DW-101 and DW-102 (900 sqft against a 1000 sqft comparable)."
            - "MarketingPlan approved with window 2026-08-05T00:00:00Z .. 2026-08-20T00:00:00Z and preference_categories VETERAN and LOCAL_WORKER, which moves both units to MARKETING."
            - "LotteryEvent for 2 units at eligibility 5000 bps. Three households register and apply on 2026-08-10: H1 claiming VETERAN (score 100), H2 claiming VETERAN and LOCAL_WORKER (score 200), H3 claiming nothing (score 0). Income limits at 5000 bps are 6334900 for size 3 and 5639000 for size 2, so all three are eligible."
