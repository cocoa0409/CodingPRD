              as: ScaleOperator
              captures: { l1: $.data.id }
            - call: "POST /mill/lots/${l1}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
              as: QualityLabTech
            - call: "GET /mill/contracts/${c_id}"
              as: Merchandiser
              captures: { cv_now: $.data.version, ful: $.data.fulfilled_cwt }
          trigger:
            - call: "PUT /mill/contracts/${c_id}"
              payload: { expected_contract_version: "${cv_now}", base_price_cents_per_cwt: 1550 }
              as: Merchandiser
              captures: { err1: $.data.error_id }
            - call: "POST /mill/contracts/${c_id}/cancel"
              payload: {}
              as: Merchandiser
