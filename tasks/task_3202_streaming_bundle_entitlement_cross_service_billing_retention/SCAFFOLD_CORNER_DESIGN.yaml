              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_PREMIUM", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1999, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
