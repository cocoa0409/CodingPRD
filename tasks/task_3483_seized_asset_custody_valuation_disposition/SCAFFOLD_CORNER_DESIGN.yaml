              as: AssetCustodian
              captures: { ra22: $.data.id, ra22_v: $.data.version }
          trigger:
            - call: "POST /custody/valuations"
              payload: { asset_id: "00000000-0000-4000-8000-000000000000", method: "BLUE_BOOK", raw_value_cents: 300000, assessed_condition_grade: "GOOD", expected_asset_version: "${ra22_v}" }
              as: Claimant
              as_user_id: "cl-orma"
              captures: { pri_role_err: $.data.error_id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "00000000-0000-4000-8000-000000000000", asset_type: "VEHICLE", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { pri_shape_err: $.data.error_id }
          assert:
            - "pri_role_err == ERR_FORBIDDEN with HTTP 403 (role p2 fires before existence p4)"
            - "pri_shape_err == ERR_INVALID_REQUEST with HTTP 400 (shape p3 fires before existence p4)"

  # ===========================================================================
  - section: errors
