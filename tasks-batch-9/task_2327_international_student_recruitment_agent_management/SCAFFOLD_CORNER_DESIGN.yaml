      - name: certification_expires_on_uses_module_validity_constants
        claim_type: constants_applied
        grounds:
          - entities.TrainingCertification.fields.expires_on
          - entities.TrainingCertification.fields.module_code
          - endpoints["GET /recruitment/agencies/{id}/training-certifications"]
        distinguishing_aspect: |
          expires_on is derived per module from MODULE_VALIDITY_DAYS, so the same issued_on
          of 2026-08-01 yields 2027-08-01 for PROGRAM_ACCURACY and VISA_INTEGRITY (365 days)
          but 2027-01-28 for PROHIBITED_CLAIMS (180 days).
        test_recipe:
          setup:
            - "One agency with no certifications; the clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Validity Constants Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "PROGRAM_ACCURACY", score: 92, issued_on: "2026-08-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { cert_pa_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "PROHIBITED_CLAIMS", score: 88, issued_on: "2026-08-01" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { cert_pc_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "VISA_INTEGRITY", score: 80, issued_on: "2026-08-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { cert_vi_id: "$.data.id" }
          assert:
            - 'TrainingCertification.${cert_pa_id}.expires_on == "2027-08-01" (365 days) and .status == "VALID"'
            - 'TrainingCertification.${cert_pc_id}.expires_on == "2027-01-28" (180 days) and .status == "VALID"'
            - 'TrainingCertification.${cert_vi_id}.expires_on == "2027-08-01" (365 days) and .status == "VALID" (score exactly 80 is accepted)'
            - 'GET /recruitment/agencies/${ag1_id}/training-certifications returns total_count == 3'

      - name: risk_score_fraud_rate_rounds_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.agency_integrity_risk_score.precision
          - calculations.application_fraud_signal_index
          - state_machines.ApplicationDocument.FLAGGED_to_CONFIRMED_FRAUD
        distinguishing_aspect: |
          With three reviewed documents of which one is CONFIRMED_FRAUD the fraud term is
          40 * (1/3) = 13.333333..., so the score is 30 + 13.333333 = 43.333333 which
          round_half_up to two places gives exactly 43.33 - not 43.34 and not the unrounded
          43.3333 - and that value sits just above the 40.00 WATCH band.
        test_recipe:
          setup:
            - "One agency with a DRAFT application carrying three documents; the clock is at 2026-08-01T00:00:00Z."
            - "Two documents are clean and verified; the third declares four signals worth 70 so it is auto-FLAGGED."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Rounding Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog1_id}", student_ref: "STU-001", student_residence_country: "IN", student_us_person: false }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /recruitment/applications/${a1_id}/documents"
              payload: { doc_type: "PASSPORT", content_hash: "hash-r-001", issuer_name: "MEA India", declared_signals: [] }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /recruitment/applications/${a1_id}/documents"
              payload: { doc_type: "ENGLISH_TEST", content_hash: "hash-r-002", issuer_name: "IELTS", declared_signals: [] }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /recruitment/applications/${a1_id}/documents"
              payload: { doc_type: "FINANCIAL_PROOF", content_hash: "hash-r-003", issuer_name: "Unknown Bank", declared_signals: ["ISSUER_UNVERIFIED", "TRANSCRIPT_ANOMALY", "TRANSLATION_MISMATCH", "DATE_INCONSISTENCY"] }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /recruitment/documents/${d1_id}/verification"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/documents/${d2_id}/verification"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /recruitment/documents/${d3_id}/verification"
              payload: { outcome: "CONFIRMED_FRAUD", note: "Bank confirms the letter is fabricated" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "GET /recruitment/agencies/${ag1_id}/risk-profile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'ApplicationDocument.${d3_id}.fraud_index == 70 and its verification_state was "FLAGGED" on creation, then "CONFIRMED_FRAUD" after the trigger'
            - 'the cascade appended one CONFIRMED IntegrityIncident with category "DOCUMENT_FRAUD", severity "HIGH", occurred_on "2026-08-01"'
            - 'data.reviewed_document_count == 3 and data.confirmed_fraud_document_count == 1'
            - 'data.rolling_risk_score == 43.33 and data.lifetime_risk_score == 43.33 (30 + 40/3 = 43.333333 rounded half-up once at two places)'
            - 'the values are not 43.34, not 43.3333 and not 43.30'
            - 'Agency.${ag1_id}.compliance_posture == "WATCH" (43.33 >= 40.00) and StudentApplication.${a1_id}.integrity_hold == true'

      - name: risk_decay_boundaries_at_ninety_and_one_hundred_eighty_days
        claim_type: decay_function
        grounds:
          - calculations.agency_integrity_risk_score.constants[DECAY_FULL_MAX_AGE_DAYS, DECAY_MID_MAX_AGE_DAYS]
          - endpoints["POST /_clock/set_current_utc"]
          - calculations.agency_integrity_risk_score.variants
        distinguishing_aspect: |
          Three HIGH incidents aged exactly 90, exactly 180 and 181 days at the 2027-01-15
          clock exercise both decay steps at their inclusive edges: factors 1.00, 0.75 and
          0.50 give 30.00, 22.50 and 15.00 for a rolling total of 67.50, while the lifetime
          variant applies no decay at all and reports 90.00.
        test_recipe:
          setup:
            - "The clock is moved to 2027-01-15 first, so all three occurred_on dates are in the past."
            - "One agency with no contracts, so the PROBATION escalation has nothing to suspend."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Decay Curve Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "HIGH", occurred_on: "2026-10-17", source: "AUDIT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc90_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "HIGH", occurred_on: "2026-07-19", source: "AUDIT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc180_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "HIGH", occurred_on: "2026-07-18", source: "AUDIT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc181_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/integrity-incidents/${inc90_id}/resolution"
              payload: { outcome: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/integrity-incidents/${inc180_id}/resolution"
              payload: { outcome: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/integrity-incidents/${inc181_id}/resolution"
              payload: { outcome: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "GET /recruitment/agencies/${ag1_id}/risk-profile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'after the first CONFIRM (age exactly 90 days, factor 1.00): Agency.${ag1_id}.rolling_risk_score == 30.00 and .compliance_posture == "GOOD_STANDING"'
            - 'after the second CONFIRM (age exactly 180 days, factor 0.75 adds 22.50): rolling_risk_score == 52.50 and .compliance_posture == "WATCH"'
            - 'after the third CONFIRM (age 181 days, factor 0.50 adds 15.00): rolling_risk_score == 67.50 and .compliance_posture == "PROBATION" (>= 65.00)'
            - 'the risk-profile read returns data.rolling_risk_score == 67.50, data.lifetime_risk_score == 90.00, data.lifetime_minus_rolling_delta == 22.50 and data.confirmed_incident_count == 3'
            - 'data.posture_band == "PROBATION" - the band is read from the rolling variant, not from the undecayed 90.00'

