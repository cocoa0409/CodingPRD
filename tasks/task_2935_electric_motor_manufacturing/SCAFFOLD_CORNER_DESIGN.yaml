      - name: out_of_set_enums_and_out_of_range_numbers_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
          - entities.MotorDesign.fields.rated_output_kw
          - entities.MotorDesign.fields.target_efficiency_class
          - entities.StatorBuild.fields.slot_fill_pct
        distinguishing_aspect: |
          Four distinct schema failure modes all collapse to ERR_INVALID_REQUEST at priority 10:
          an enum value outside the declared set, a number below the declared floor, a decimal
          width wider than declared, and a pagination limit above the declared maximum of 100.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-BAD-ENUM", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE1", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
