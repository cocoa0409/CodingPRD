            - "GET /compliance/rx-data-submissions/${rx} -> data.gross_spend_cents == null, data.rebate_reported_cents == null, data.rebate_cap_pct == null, data.rebate_credit_cents == null, data.net_plan_spend_cents == null, data.reconciled_at == null"
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> exactly 1 entry with deficiency_type \"RXDC_LATE\", onset_date \"2028-06-02\", days_open 14, daily_rate_cents 20000, size_multiplier 2.0, signed_amount_cents 560000"
            - "GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 560000, data.deficiency_points == 5, data.compliance_posture == \"AT_RISK\""

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: attestation_submit_posture_gate_outranks_segregation_of_duties
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_POSTURE_BLOCKS_ATTESTATION]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The trigger violates THREE rules at once — posture DEFICIENT (business_safety, priority 11),
          submitter == preparer (authorization_sod, priority 12) and an outstanding gag review on the
          PBM contract (business_constraint, priority 13). Only ERR_POSTURE_BLOCKS_ATTESTATION with
          HTTP 409 is correct; returning 403 ERR_SEGREGATION_OF_DUTIES or 409
          ERR_GAG_CLAUSES_OUTSTANDING proves the ladder is mis-ordered. The pair spans two different
          HTTP statuses, so the error code cannot be guessed from the status.
        test_recipe:
          setup:
            - "Logical clock at 2027-05-04T09:00:00Z."
            - "ACTIVE PlanYear PY2027, covered_lives 6000, attestation deadline 2028-01-31."
            - "The TPA contract is gag_review_status COMPLIANT; a second PBM contract was escalated to NON_COMPLIANT, so deficiency_points is 6 and compliance_posture is DEFICIENT with a 30000 GAG_CLAUSE accrual on the ledger."
            - "One Attestation created AFTER the posture flip, so it is still DRAFT, prepared by officer-prep-1, contract_terms_doc_count 3."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-04T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
