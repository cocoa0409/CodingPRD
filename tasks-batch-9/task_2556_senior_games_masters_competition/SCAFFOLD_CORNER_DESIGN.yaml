              as: GamesAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /senior-games/personnel-assignments/${asg_id}/confirm"
              payload: {}
              as: SportOfficial
              as_user_id: "${pers_id}"
              captures: { asg_status: $.data.status }
          trigger:
            - call: "POST /senior-games/competition-results"
              payload: { sport_entry_id: "${en_id}", session_slot_id: "${slot_id}", submitted_by_personnel_id: "${pers_id}", mark_value: 13.420, placement: 1 }
              as: SportOfficial
              as_user_id: "${pers_id}"
              captures: { e_early: $.data.error_id }
            - call: "POST /senior-games/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T09:00:00Z" }
              as: GamesAdmin
            - call: "POST /senior-games/session-slots/${slot_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: GamesAdmin
            - call: "POST /senior-games/competition-results"
              payload: { sport_entry_id: "${en_id}", session_slot_id: "${slot_id}", submitted_by_personnel_id: "${pers_id}", mark_value: 13.420, placement: 1 }
              as: SportOfficial
              as_user_id: "cccccccc-0001-4000-8000-000000000000"
              captures: { e_owner: $.data.error_id }
            - call: "POST /senior-games/competition-results"
              payload: { sport_entry_id: "${en_id}", session_slot_id: "${slot_id}", submitted_by_personnel_id: "${pers_id}", mark_value: 13.420, placement: 1 }
              as: SportOfficial
              as_user_id: "${pers_id}"
              captures: { res_id: $.data.id, res_status: $.data.status }
            - call: "POST /senior-games/competition-results"
              payload: { sport_entry_id: "${en_id}", session_slot_id: "${slot_id}", submitted_by_personnel_id: "${pers_id}", mark_value: 13.900, placement: 2 }
              as: SportOfficial
              as_user_id: "${pers_id}"
              captures: { e_dup_result: $.data.error_id }
            - call: "POST /senior-games/competition-results/${res_id}/verify"
              payload: {}
              as: RegistrationOfficer
              captures: { e_verify_early: $.data.error_id }
            - call: "POST /senior-games/session-slots/${slot_id}/advance"
              payload: { to_status: "COMPLETED" }
              as: GamesAdmin
            - call: "POST /senior-games/personnel-assignments"
              payload: { personnel_id: "${pers_id}", session_slot_id: "${slot_id}", role_at_event: "TIMER" }
              as: GamesAdmin
              captures: { e_dup_asg: $.data.error_id }
            - call: "POST /senior-games/competition-results/${res_id}/verify"
              payload: {}
              as: RegistrationOfficer
              captures: { res_status_2: $.data.status, res_nq: $.data.national_qualifying }
          assert:
            - "${asg_status} == \"CONFIRMED\" and SessionSlot.${slot_id}.confirmed_official_count == 1 before the triggers run"
            - "the submission against the SCHEDULED slot returns HTTP 409 with ${e_early} == \"ERR_SLOT_NOT_COMPETED\", because priority 48 demands IN_PROGRESS or COMPLETED at submission"
            - "${e_owner} == \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403: the SportOfficial header id differs from submitted_by_personnel_id even though that personnel row exists"
            - "${res_status} == \"SUBMITTED\" once the slot is IN_PROGRESS and the owning official submits"
            - "${e_dup_result} == \"ERR_RESULT_ALREADY_RECORDED\" with HTTP 409, and GET /senior-games/competition-results with sport_entry_id == ${en_id} returns total_count == 1 holding mark_value 13.420"
            - "${e_verify_early} == \"ERR_SLOT_NOT_COMPETED\" with HTTP 409: the same rule needs status COMPLETED at verification, so IN_PROGRESS is enough to submit but not to verify"
            - "PersonnelAssignment.${asg_id}.status == \"COMPLETED\" after the slot advances to COMPLETED, and Personnel.${pers_id}.assigned_minutes_total is still 60 because a completed shift stays on the ledger"
            - "${e_dup_asg} == \"ERR_ASSIGNMENT_DUPLICATE\" with HTTP 409, not ERR_PERSONNEL_DOUBLE_BOOKED: the priority-66 scan excludes COMPLETED assignments and slots outside {SCHEDULED, IN_PROGRESS}, so the priority-90 uniqueness rule on (personnel_id, session_slot_id) is what refuses it"
            - "${res_status_2} == \"RECORD_PENDING\" and ${res_nq} == false: the verify succeeds on the COMPLETED slot, takes the record branch because SportEvent.current_record_id is null, and leaves national_qualifying false because the event declares no national_qualifying_standard"

