            - call: "GET /bureau/undeliverable-returns/${e3_return_2}"
              payload: {}
              as: ClientLiaison
              captures: { e3_return2_disp: "$.data.disposition", e3_return2_seq: "$.data.feedback_batch_seq" }
            - call: "POST /bureau/clients/${e3_client_id}/address-feedback"
              payload: { note: "second attempt" }
              as: ClientLiaison
              captures: { e3_error: "$.data.error_id" }
          assert:
            - "${e3_disp_1} == ADDRESS_UPDATED (both corrections present and reason_code != DECEASED) and ${e3_disp_2} == UNRESOLVED (DECEASED discards the corrections)"
            - "${e3_pending_before} == 2 — each classification incremented the client counter once"
            - "HTTP 200 with ${e3_batches} == 1 and ${e3_pending_after} == 0"
            - "${e3_return1_disp} == FEEDBACK_SENT and ${e3_return2_disp} == FEEDBACK_SENT with ${e3_return1_seq} == 1 == ${e3_return2_seq}: both branches share the single batch sequence"
            - "StatementRecord.${e3_record_1}.address_line1 == '3500 Forwarding Lane' with hygiene_status CORRECTED and address_update_pending false, while StatementRecord.${e3_record_2} keeps '3402 Return Row' with hygiene_status STALE and address_update_pending false"
            - "HTTP 409 with ${e3_error} == ERR_NO_PENDING_FEEDBACK on the second release, and address_feedback_batch_count stays 1"

