              as_user_id: "${cons_id}"
              captures: { req_id: $.data.id }
            - call: "POST /health-data/consumer-requests/${req_id}/request-more-info"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-23T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /health-data/consumer-requests/${req_id}/resubmit-identity"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          assert:
            - "error_id == ERR_VERIFICATION_WINDOW_EXPIRED"
            - "http_status == 409"
            - "ConsumerRequest.${req_id}.state == VERIFICATION_PENDING"
            - "ConsumerRequest.${req_id}.verification_rounds_used == 1"
            - "ConsumerRequest.${req_id}.verification_window_ends_at == 2026-08-22T00:00:00Z"

      - name: aggregate_validation_submit_with_no_active_elements_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=48]", "errors[ERR_NO_ACTIVE_ELEMENTS]"]
        distinguishing_aspect: "The product has a DataElement row, but its only element is RETIRED, so the aggregate count of ACTIVE elements is 0 and submit is refused with the assessment left in DRAFT."
