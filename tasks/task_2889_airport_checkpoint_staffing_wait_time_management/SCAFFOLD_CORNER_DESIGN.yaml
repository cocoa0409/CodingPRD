          assert:
            - "${open_state} == OPEN and ${open_at} == 2026-09-10T08:00:00Z from the logical clock"
            - "${avail_after_open} == 5 (6 - required_officer_count 1) and ${open_count} == 1"
            - "${dup_open_error} == ERR_INVALID_STATE_TRANSITION (409)"
            - "${avail_after_dup} == 5 — the rejected second open left the conserved quantity untouched, it did not fall to 4"

