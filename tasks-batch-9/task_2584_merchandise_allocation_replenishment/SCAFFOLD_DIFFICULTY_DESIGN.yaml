              as_user_id: "u-mgr-1"
            - call: "POST /allocation/transfer-recommendations/${t1_id}/dispatch"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/transfer-recommendations/${t1_id}/receive"
