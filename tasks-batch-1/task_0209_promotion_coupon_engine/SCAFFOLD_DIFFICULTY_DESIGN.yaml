              captures: { err: $.data.error_id }
          assert:
            - "lock returns ERR_PROMO_NOT_REDEEMABLE (409) because the referenced Promotion is PAUSED"

      # --- pair B: Promotion SEGMENT eligibility depends on SegmentMembership state ---
      - name: cesd_segment_apply_requires_active_membership
        grounds:
          - validations[priority=12]
          - state_machines.SegmentMembership.ACTIVE_to_REVOKED
          - entities.Promotion.fields.eligible_segment_id
        distinguishing_aspect: |
          Apply of a SEGMENT-eligibility Promotion depends on a different entity's state (the customer's
          SegmentMembership must be ACTIVE). Revoking the membership makes the apply fail with ERR_NOT_ELIGIBLE.
          Entity pair Promotion->SegmentMembership — distinct from instance 1's Cart->Promotion pair.
        test_recipe:
          setup:
            - "Clock 2026-06-15. Segment VIP; Customer C added then REVOKED. Promotion CE2 SEGMENT (eligible_segment_id=VIP) ACTIVE, coupon CEC2; cart with line."
          setup_api_calls:
