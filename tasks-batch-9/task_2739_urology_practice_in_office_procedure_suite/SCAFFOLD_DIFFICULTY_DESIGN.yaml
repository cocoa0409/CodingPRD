            - "trigger call 1 returns HTTP 409 with error_id == \"ERR_ROOM_WINDOW_CONFLICT\" (14:59 is inside the half-open [14:00, 15:00))"
            - "trigger call 2 returns HTTP 200 with schedule_status == \"SCHEDULED\", scheduled_end_at == \"2026-09-14T15:20:00.000Z\" and block_end_at == \"2026-09-14T16:00:00.000Z\" (a start exactly at the previous block_end_at is legal)"
            - "trigger call 3 returns schedule_status == \"DRAFT\" for case 2"
            - "an implementation using a closed room interval rejects trigger call 2; one that omits SCOPE_TURNOVER_ADD_MIN puts block_end_at at 14:40 and wrongly accepts trigger call 1"

      - name: bp_renal_dose_step_rounding_at_egfr_45
        grounds:
          - calculations.antibiotic_agent_selection
          - calculations.case_occupancy_window.constants.RENAL_ADJUST_EGFR
          - entities.AntibioticOrder.fields.dose_mg
          - endpoints[POST /urology/antibiotic-orders]
        distinguishing_aspect: |
          Boundary of a NUMERIC threshold plus a rounding step, both keyed on the
          same constant RENAL_ADJUST_EGFR = 45 but consumed by two different
          calculations: egfr 45 is NOT adjusted (the comparison is >=) while egfr
          44 is, changing procedure_minutes by 10 and the dose factor to 0.5. The
          third assertion lands on a rounding tie-adjacent value: TMP_SMX at
          160 * 0.5 = 80 mg gives 80 / 25 = 3.2, which round_half_up takes DOWN to
          3, so the dose is 75 mg and not 100 mg — truncation and round-half-up
          agree here while ceil does not. The other precision instance probes an
          interval boundary, not a numeric one.
        test_recipe:
          setup:
            - "one urologist, one scheduler"
            - "patient A Hugo Vance with egfr exactly 45, antibiotic_allergy_class NONE, anticoagulant_flag false"
            - "patient B Marta Quill with egfr 44, antibiotic_allergy_class NONE, anticoagulant_flag false"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
            - "type CYSTOSCOPY: base 20, cleanup HIGH, requires_antibiotic true, no scope, no consignment, required_prep_codes []"
            - "both cases stay DRAFT: ordering an antibiotic has no schedule_status precondition, so no occupancy conflict can arise between the two 14:00 starts"
            - "GENTAMICIN (min_egfr 60) is out of the eligible pool for both patients; AUTO therefore picks CIPROFLOXACIN at protocol rank 1"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4211", full_name: "Hugo Vance", date_of_birth: "1957-07-07", primary_urologist_id: "${uro_id}", egfr: 45, anticoagulant_flag: false, antibiotic_allergy_class: "NONE" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_a_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-4212", full_name: "Marta Quill", date_of_birth: "1951-10-19", primary_urologist_id: "${uro_id}", egfr: 44, anticoagulant_flag: false, antibiotic_allergy_class: "NONE" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_b_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", requires_scope: false, requires_antibiotic: true, consignment_required: false, required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T07:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_a_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T14:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_a_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_b_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T14:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_b_id: $.data.id }
          trigger:
            - call: "POST /urology/antibiotic-orders"
              payload: { case_id: "${case_a_id}", ordered_by_provider_id: "${uro_id}", requested_agent: "AUTO" }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { order_a_id: $.data.id }
            - call: "POST /urology/antibiotic-orders"
              payload: { case_id: "${case_b_id}", ordered_by_provider_id: "${uro_id}", requested_agent: "AUTO" }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { order_b_id: $.data.id }
            - call: "POST /urology/antibiotic-orders"
              payload: { case_id: "${case_b_id}", ordered_by_provider_id: "${uro_id}", requested_agent: "TMP_SMX" }
              as: Urologist
              as_user_id: "${uro_id}"
              captures: { order_c_id: $.data.id }
            - call: "GET /urology/procedure-cases/${case_a_id}"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
            - call: "GET /urology/procedure-cases/${case_b_id}"
              payload: {}
              as: Urologist
              as_user_id: "${uro_id}"
          assert:
            - "trigger call 1 returns agent == \"CIPROFLOXACIN\", dose_mg == 500, route == \"ORAL\", status == \"ORDERED\" and prophylaxis_window_start_at == \"2026-09-14T13:00:00.000Z\" (egfr 45 >= RENAL_ADJUST_EGFR, factor 1.0, 500 / 25 = 20 exactly)"
            - "trigger call 2 returns agent == \"CIPROFLOXACIN\" and dose_mg == 250 (egfr 44 < 45, factor 0.5, 250 / 25 = 10 exactly)"
            - "trigger call 3 returns agent == \"TMP_SMX\" and dose_mg == 75 (160 * 0.5 = 80, 80 / 25 = 3.2, round_half_up -> 3, 3 * 25 = 75); an implementation that rounds the milligram value up to the next 25 step returns 100 and fails"
            - "trigger call 4 returns procedure_minutes == 20 and block_end_at == \"2026-09-14T14:40:00.000Z\" for patient A"
            - "trigger call 5 returns procedure_minutes == 30 and block_end_at == \"2026-09-14T14:50:00.000Z\" for patient B (RENAL_EXTRA_MIN 10 added at egfr 44)"
            - "an implementation using a strict > comparison against RENAL_ADJUST_EGFR halves patient A's dose to 250 and inflates its procedure_minutes to 30, failing calls 1 and 4"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: ce_checkin_blocked_by_scope_state
        grounds:
          - validations[priority=52]
          - state_machines[ProcedureCase.schedule_status].transitions[check-in].preconditions
          - entities.ScopeAsset.fields.hld_pass_at
          - endpoints[POST /urology/scope-assets/{id}/commissioning]
          - endpoints[GET /urology/procedure-cases/{id}/readiness]
        distinguishing_aspect: |
          The blocking predicate lives entirely on a DIFFERENT entity than the one
          being mutated, and specifically on a nullable timestamp rather than an
          enum: the ScopeAsset is in the correct status IN_USE and has
          leak_test_required false, so every enum-level check passes — only
          hld_pass_at being null stops the check-in. The same request succeeds once
          the scope is commissioned, with nothing about the case changed. The other
          cross-entity instance depends on TWO other entities (room and provider)
          and is ordered between them.
