  - section: rbac
    instances:
      - name: unauthenticated_missing_headers_or_unknown_role_rejected_before_any_lookup
        claim_type: unauthenticated
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 1, both headers present and role declared]
        distinguishing_aspect: "Priority 1 outranks both authorization and id resolution, so an unknown role name on a real endpoint, a missing X-User-ID on an otherwise legal call, and any header-less call against a non-existent id all return 401 - never 403 and never 404."
        test_recipe:
          setup:
            - "One real branch exists so that a 404 would be the alternative outcome for a bad id and a 200 the alternative for a good one."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
          trigger:
            - call: "GET /branches/${br_id}"
              payload: {}
              as: NO_ROLE_HEADER
              captures: { e_norole: "$.data.error_id" }
            - call: "GET /branches/${br_id}"
              payload: {}
              as: Auditor
              captures: { e_unknown: "$.data.error_id" }
            - call: "GET /branches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NO_ROLE_HEADER
              captures: { e_badid: "$.data.error_id" }
            - call: "POST /branches"
              payload: { code: "BR-XXX", name: "Should not exist", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: NO_USER_ID_HEADER
              captures: { e_nouser: "$.data.error_id" }
          assert:
            - "${e_norole} == ERR_UNAUTHENTICATED with HTTP 401 when the X-User-Role header is absent entirely"
            - "${e_unknown} == ERR_UNAUTHENTICATED with HTTP 401 for the role string Auditor: only the six declared roles authenticate, and an undeclared name is a 401 rather than a 403"
            - "${e_badid} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_BRANCH_NOT_FOUND: priority 1 runs before the priority-3 path resolution"
            - "${e_nouser} == ERR_UNAUTHENTICATED with HTTP 401 when X-User-Role is PlatformAdmin but X-User-ID is omitted, and GET /branches afterwards returns total_count 1 - the rejected create wrote nothing"

