            - "ProductionLot.${lot_big_id}.process_state == LOT_TESTING and ProductionLot.${lot_big_id}.retest_count == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: battery_assembly_parallel_axes_rework_generations
        grounds:
          - state_machines.BatteryAssembly.torque_status
          - state_machines.BatteryAssembly.insulation_status
          - state_machines.BatteryAssembly.certification_status
          - endpoints[POST /battery-assemblies/{id}/verifications]
          - endpoints[POST /battery-assemblies/{id}/rework]
          - errors.ERR_ASSEMBLY_AXIS_ALREADY_RECORDED
          - errors.ERR_ASSEMBLY_STATE_INVALID
        distinguishing_aspect: |
          BatteryAssembly carries two independent PENDING/PASS/FAIL axes plus a
          compound derived status, so the SAME call with the SAME payload lands in a
          different state depending on the other axis and on the rework generation:
          a TORQUE PASS leaves certification PENDING in generation 2 (insulation was
          reset) although the identical PASS produced CERTIFIED in generation 1. The
          machine is also non-idempotent (a second verdict on a recorded axis is 409)
          and re-entrant only through rework, which is itself refused once the
          assembly is CERTIFIED.
        test_recipe:
          setup:
            - "Plant, an APPROVED lead design, a lot advanced to ASSEMBLY, one assembly with module_count 6, torque_spec_nm 20.00 (window [19.00, 22.00]) and ir_min_megaohm 1.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_b_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { sup_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Dana Quality", job_class: "QUALITY", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { qa_a_id: $.data.id }
            - call: "POST /cell-designs"
              payload: { code: "CD-LEAD-465", chemistry: "LEAD_ACID", plate_type: "TUBULAR", cells_per_battery: 12, cell_nominal_voltage_v: 2.0, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.000, lead_content_kg: 300.000, formation_charge_factor: 1.5, list_price_cents: 500000 }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { design_id: $.data.id }
            - call: "POST /cell-designs/${design_id}/review-actions"
              payload: { action: "SUBMIT" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
            - call: "POST /cell-designs/${design_id}/review-actions"
              payload: { action: "APPROVE" }
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
            - call: "POST /production-lots"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-0001", quantity: 9 }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/advance"
              payload: { to_state: "PLATE_PRODUCTION" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /production-lots/${lot_id}/advance"
              payload: { to_state: "FORMATION" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /production-lots/${lot_id}/advance"
              payload: { to_state: "ASSEMBLY" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
            - call: "POST /battery-assemblies"
              payload: { lot_id: "${lot_id}", serial_number: "ASM-0001", module_count: 6, case_type: "STEEL_TRAY", torque_spec_nm: 20.00, ir_min_megaohm: 1.00 }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { asm_id: $.data.id }
          trigger:
            - call: "POST /battery-assemblies/${asm_id}/verifications"
              payload: { verification_type: "INSULATION_RESISTANCE", measured_ir_megaohm: 1.00, test_voltage_v: 500 }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { ins1: $.data.insulation_status, cert1: $.data.certification_status }
            - call: "POST /battery-assemblies/${asm_id}/verifications"
              payload: { verification_type: "TORQUE", measured_torque_nm: 22.10, connection_count: 12 }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { tq2: $.data.torque_status, cert2: $.data.certification_status }
            - call: "POST /battery-assemblies/${asm_id}/verifications"
              payload: { verification_type: "TORQUE", measured_torque_nm: 20.00, connection_count: 12 }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              expect_error: ERR_ASSEMBLY_AXIS_ALREADY_RECORDED
            - call: "POST /battery-assemblies/${asm_id}/rework"
              payload: { rework_note: "retorque all links" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              captures: { rw_count: $.data.rework_count, cert3: $.data.certification_status, ins3: $.data.insulation_status }
            - call: "POST /battery-assemblies/${asm_id}/verifications"
              payload: { verification_type: "TORQUE", measured_torque_nm: 19.00, connection_count: 12 }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { tq4: $.data.torque_status, cert4: $.data.certification_status }
            - call: "POST /battery-assemblies/${asm_id}/verifications"
              payload: { verification_type: "INSULATION_RESISTANCE", measured_ir_megaohm: 1.00, test_voltage_v: 500 }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { cert5: $.data.certification_status }
            - call: "POST /battery-assemblies/${asm_id}/rework"
              payload: { rework_note: "no defect - must be refused" }
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              expect_error: ERR_ASSEMBLY_STATE_INVALID
          assert:
            - "${ins1} == PASS and ${cert1} == PENDING   # IR exactly at the minimum passes; the torque axis is still PENDING"
            - "${tq2} == FAIL and ${cert2} == REJECTED   # 22.10 > 20.00 * 1.10 = 22.00"
            - "the third call is 409 ERR_ASSEMBLY_AXIS_ALREADY_RECORDED (one verdict per axis per generation)"
            - "${rw_count} == 1 and ${cert3} == PENDING and ${ins3} == PENDING   # rework resets BOTH axes, not just the failed one"
            - "${tq4} == PASS and ${cert4} == PENDING    # identical PASS to generation 1 yet certification stays PENDING - the insulation evidence was destroyed"
            - "${cert5} == CERTIFIED                     # 19.00 == 20.00 * 0.95 passes on the lower edge; the pair is now complete"
            - "the last call is 409 ERR_ASSEMBLY_STATE_INVALID (rework demands REJECTED or REVOKED)"
            - "BatteryAssembly.${asm_id}.rework_count == 1 (the refused rework did not increment it)"

      - name: production_lot_quarantine_retest_cycle_with_hard_cap
        grounds:
          - state_machines.ProductionLot.process_state.LOT_TESTING_to_QUARANTINED
          - state_machines.ProductionLot.process_state.QUARANTINED_to_LOT_TESTING
          - state_machines.ProductionLot.process_state.QUARANTINED_to_SCRAPPED
          - calculations.lot_sampling_plan
          - errors.ERR_RETEST_LIMIT_REACHED
          - errors.ERR_LOT_STATE_INVALID
        distinguishing_aspect: |
          A different entity from the assembly instance and a different kind of
          non-linearity: ProductionLot.process_state is CYCLIC. LOT_TESTING is
          re-entered through QUARANTINED, and each traversal mutates the machine's own
          transition table - retest_count 2 removes the QUARANTINED -> LOT_TESTING edge
          entirely, so the third quarantine is a trap whose only exit is SCRAPPED. The
          cycle also rewrites the sampling plan each pass (8/1 -> 16/0) and zeroes the
          evidence counters, so the state is not a function of the current state alone.
