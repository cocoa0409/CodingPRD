    side_effects: ["status := DRAFT", "pinned_drawing_revision := the named drawing's revision_round", "increments EngineeredOrder.version by 1"]
  - id: list_order_compliance_labels
    method: GET
    path: "/engineered-orders/{id}/compliance-labels"
    description: "Reverse-reachability list of the order's labels"
    roles: [ComplianceOfficer, QualityEngineer, PlantAdmin, LogisticsCoordinator, CustomerReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComplianceLabel[]
    side_effects: []
  - id: list_compliance_labels
    method: GET
    path: "/compliance-labels"
    description: "Filtered list resolving the order, drawing and report FKs"
    roles: [ComplianceOfficer, QualityEngineer, PlantAdmin, LogisticsCoordinator]
    code: 200
    input: ["engineered_order_id?", "submittal_drawing_id?", "test_report_id?", "status?", "ppe_category?", "limit?", "offset?"]
    output: ComplianceLabel[]
    side_effects: []
  - id: get_compliance_label
    method: GET
    path: "/compliance-labels/{id}"
    description: "Read one label with its computed arc-flash values"
    roles: [ComplianceOfficer, QualityEngineer, PlantAdmin, LogisticsCoordinator, CustomerReviewer]
    code: 200
    input: []
    output: ComplianceLabel
    side_effects: []
  - id: generate_compliance_label
    method: POST
    path: "/compliance-labels/{id}/generate"
    description: "DRAFT -> GENERATED; runs calc arc_flash_label_values and refuses at or above 40.0 cal/cm2"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceLabel
    side_effects: ["status := GENERATED", "populate incident_energy_cal_cm2, ppe_category, arc_flash_boundary_mm, rating_text"]
  - id: verify_compliance_label
    method: POST
    path: "/compliance-labels/{id}/verify"
    description: "GENERATED -> VERIFIED; verifier must differ from the generator"
    roles: [QualityEngineer]
    code: 200
    input: [verified_by_user_id]
    output: ComplianceLabel
    side_effects: ["status := VERIFIED"]
  - id: issue_compliance_label
    method: POST
    path: "/compliance-labels/{id}/issue"
    description: "VERIFIED -> ISSUED (terminal); unblocks freight clearance"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceLabel
    side_effects: ["status := ISSUED", "HELD ShipmentRelease rows on the order become clearable"]
  - id: void_compliance_label
    method: POST
    path: "/compliance-labels/{id}/void"
    description: "DRAFT, GENERATED, VERIFIED, ISSUED or STALE -> VOIDED (terminal)"
    roles: [ComplianceOfficer, QualityEngineer]
    code: 200
    input: [void_reason]
    output: ComplianceLabel
    side_effects: ["status := VOIDED", "CLEARED or STAGED ShipmentRelease rows on the order revert to HELD"]

  # --- ShipmentRelease ------------------------------------------------------
  - id: create_shipment_release
    method: POST
    path: "/engineered-orders/{id}/shipment-releases"
    description: "Define a billing/shipping stage; OCC-guarded by expected_engineered_order_version"
    roles: [LogisticsCoordinator, ContractAdmin]
    code: 201
    input: [stage_index, stage_share_bp, is_final_stage, expected_engineered_order_version]
    output: ShipmentRelease
    side_effects: ["status := HELD", "run calc stage_billing_allocation to set stage_billing_cents", "increments EngineeredOrder.version by 1"]
  - id: list_order_shipment_releases
    method: GET
    path: "/engineered-orders/{id}/shipment-releases"
    description: "Reverse-reachability list of the order's stages, ordered by stage_index"
    roles: [LogisticsCoordinator, ContractAdmin, PlantAdmin, FieldServiceEngineer, SalesEngineer]
    code: 200
    input: ["status?", "is_final_stage?", "limit?", "offset?"]
    output: ShipmentRelease[]
    side_effects: []
  - id: get_shipment_release
    method: GET
    path: "/shipment-releases/{id}"
    description: "Read one stage with its accrued storage fee"
    roles: [LogisticsCoordinator, ContractAdmin, PlantAdmin, FieldServiceEngineer, SalesEngineer]
    code: 200
    input: []
    output: ShipmentRelease
    side_effects: []
  - id: clear_shipment_release
    method: POST
    path: "/shipment-releases/{id}/clear"
    description: "HELD -> CLEARED; requires an ISSUED ComplianceLabel on the order and every earlier stage already dispatched"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: ShipmentRelease
    side_effects: ["status := CLEARED, cleared_at := logical clock"]
  - id: stage_shipment_release
    method: POST
    path: "/shipment-releases/{id}/stage"
    description: "CLEARED or SITE_STORAGE -> STAGED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: ShipmentRelease
    side_effects: ["status := STAGED"]
  - id: ship_shipment_release
    method: POST
    path: "/shipment-releases/{id}/ship"
    description: "STAGED -> IN_TRANSIT; the first stage in transit moves the order into SHIPPING and bills the stage"
    roles: [LogisticsCoordinator]
    code: 200
    input: [carrier_reference]
    output: ShipmentRelease
    side_effects: ["status := IN_TRANSIT, shipped_at := logical clock", "order.billed_to_date_cents increases by stage_billing_cents", "order.fulfillment_status -> SHIPPING on the first stage", "increments EngineeredOrder.version by 1"]
  - id: deliver_shipment_release
    method: POST
    path: "/shipment-releases/{id}/deliver"
    description: "IN_TRANSIT -> DELIVERED (terminal)"
    roles: [LogisticsCoordinator, FieldServiceEngineer]
    code: 200
    input: []
    output: ShipmentRelease
    side_effects: ["status := DELIVERED, delivered_at := logical clock", "recompute order_production_posture"]

  # --- SiteStorageAgreement -------------------------------------------------
  - id: create_site_storage_agreement
    method: POST
    path: "/shipment-releases/{id}/site-storage-agreements"
    description: "Park a staged stage in site storage under a billable agreement; drives ShipmentRelease STAGED -> SITE_STORAGE"
    roles: [LogisticsCoordinator]
    code: 201
    input: [storage_start_at, storage_end_at, crate_count, insured_value_cents]
    output: SiteStorageAgreement
    side_effects: ["status := OPEN", "parent ShipmentRelease -> SITE_STORAGE", "run calc site_storage_fee to set billable_days, storage_subtotal_cents, insurance_surcharge_cents, long_stay_discount_cents, total_fee_cents"]
  - id: list_shipment_site_storage_agreements
    method: GET
    path: "/shipment-releases/{id}/site-storage-agreements"
    description: "Reverse-reachability list of a stage's storage agreements"
    roles: [LogisticsCoordinator, ContractAdmin, PlantAdmin, SalesEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SiteStorageAgreement[]
    side_effects: []
  - id: get_site_storage_agreement
    method: GET
    path: "/site-storage-agreements/{id}"
    description: "Read one storage agreement with its computed fee breakdown"
    roles: [LogisticsCoordinator, ContractAdmin, PlantAdmin, SalesEngineer]
    code: 200
    input: []
    output: SiteStorageAgreement
    side_effects: []
  - id: close_site_storage_agreement
    method: POST
    path: "/site-storage-agreements/{id}/close"
    description: "OPEN -> CLOSED (terminal); finalises the fee and returns the stage to STAGED"
    roles: [LogisticsCoordinator]
    code: 200
    input: ["storage_end_at?"]
    output: SiteStorageAgreement
    side_effects: ["status := CLOSED", "re-run calc site_storage_fee", "parent ShipmentRelease SITE_STORAGE -> STAGED", "ShipmentRelease.storage_fee_accrued_cents increases by total_fee_cents"]
  - id: waive_site_storage_agreement
    method: POST
    path: "/site-storage-agreements/{id}/waive"
    description: "OPEN -> WAIVED (terminal); zeroes the fee as a commercial concession"
    roles: [LogisticsCoordinator, ContractAdmin]
    code: 200
    input: [waived_by_user_id]
    output: SiteStorageAgreement
    side_effects: ["status := WAIVED", "total_fee_cents := 0", "ShipmentRelease.storage_fee_accrued_cents unchanged"]

  # --- CommissioningJob -----------------------------------------------------
  - id: create_commissioning_job
    method: POST
    path: "/engineered-orders/{id}/commissioning-jobs"
    description: "Schedule field commissioning for a delivered stage"
    roles: [FieldServiceEngineer, PlantAdmin]
    code: 201
    input: [shipment_release_id, mobilization_at, lead_field_user_id]
    output: CommissioningJob
    side_effects: ["status := SCHEDULED", "completion_ratio_bp := 10000 (no punch items yet)"]
  - id: list_commissioning_jobs
    method: GET
    path: "/commissioning-jobs"
    description: "Filtered list resolving both the order and shipment FKs"
    roles: [FieldServiceEngineer, PlantAdmin, QualityEngineer, LogisticsCoordinator, ContractAdmin, CustomerReviewer]
    code: 200
    input: ["engineered_order_id?", "shipment_release_id?", "status?", "startup_certificate_issued?", "limit?", "offset?"]
    output: CommissioningJob[]
    side_effects: []
  - id: get_commissioning_job
    method: GET
    path: "/commissioning-jobs/{id}"
    description: "Read one commissioning job with its punch aggregates and completion ratio"
    roles: [FieldServiceEngineer, PlantAdmin, QualityEngineer, LogisticsCoordinator, ContractAdmin, CustomerReviewer]
    code: 200
    input: []
    output: CommissioningJob
    side_effects: []
  - id: mobilize_commissioning_job
    method: POST
    path: "/commissioning-jobs/{id}/mobilize"
    description: "SCHEDULED or DEMOBILIZED_INCOMPLETE -> MOBILIZED; the first mobilization moves the order into COMMISSIONING"
    roles: [FieldServiceEngineer]
    code: 200
    input: []
    output: CommissioningJob
    side_effects: ["status := MOBILIZED, mobilization_at := logical clock", "order.fulfillment_status -> COMMISSIONING", "increments EngineeredOrder.version by 1"]
  - id: request_energization
    method: POST
    path: "/commissioning-jobs/{id}/request-energization"
    description: "MOBILIZED -> ENERGIZATION_PENDING; requires blocking_punch_count == 0"
    roles: [FieldServiceEngineer]
    code: 200
    input: []
    output: CommissioningJob
    side_effects: ["status := ENERGIZATION_PENDING"]
  - id: energize_commissioning_job
    method: POST
    path: "/commissioning-jobs/{id}/energize"
    description: "ENERGIZATION_PENDING -> PUNCH_OPEN; energizes the equipment"
    roles: [FieldServiceEngineer, QualityEngineer]
    code: 200
    input: []
    output: CommissioningJob
    side_effects: ["status := PUNCH_OPEN, energized_at := logical clock", "run calc punch_completion_ratio"]
  - id: demobilize_commissioning_job
    method: POST
    path: "/commissioning-jobs/{id}/demobilize"
    description: "MOBILIZED, ENERGIZATION_PENDING or PUNCH_OPEN -> DEMOBILIZED_INCOMPLETE"
    roles: [FieldServiceEngineer]
    code: 200
    input: ["reason?"]
    output: CommissioningJob
    side_effects: ["status := DEMOBILIZED_INCOMPLETE", "demobilization_round increases by 1", "recompute order_production_posture"]
  - id: cancel_commissioning_job
    method: POST
    path: "/commissioning-jobs/{id}/cancel"
    description: "Any non-terminal state -> CANCELLED (terminal); rejects every open punch item"
    roles: [PlantAdmin, FieldServiceEngineer]
    code: 200
    input: ["reason?"]
    output: CommissioningJob
    side_effects: ["status := CANCELLED", "OPEN, ASSIGNED and RESOLVED PunchListItem rows -> REJECTED", "recompute order_production_posture"]

