            - call: "POST /businesses"
              payload: { legal_name: "OCC Seller", owner_name: "OS", zone_code: "C1" }
              as: Applicant
              captures: { seller_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "OCC Buyer", owner_name: "OB", zone_code: "C1" }
              as: Applicant
              captures: { buyer_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${seller_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${seller_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /transfers"
              payload: { license_id: "${lic_id}", from_business_id: "${seller_id}", to_business_id: "${buyer_id}" }
              as: Applicant
              as_user_id: "${seller_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /transfers/${tr_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-15T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /licenses/${lic_id}/renew"
              payload: {}
              as: Applicant
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /transfers/${tr_id}/complete"
              payload: { expected_license_version: "${lic_v}" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

