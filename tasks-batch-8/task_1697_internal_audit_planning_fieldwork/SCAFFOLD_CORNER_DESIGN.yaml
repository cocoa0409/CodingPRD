          setup: ["Two PLANNED engagements on two entities; staff1 assigned ACTIVE to eng1; auditor a2 on roster"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
