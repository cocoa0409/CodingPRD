            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
