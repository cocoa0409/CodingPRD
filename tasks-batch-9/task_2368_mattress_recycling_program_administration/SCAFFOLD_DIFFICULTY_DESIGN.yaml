            - "Hauler.${hauler_id}.active_route_count == 1"

      - name: volume_report_acceptance_requires_enrolled_site
        grounds:
          - validations[priority=61]
          - errors[ERR_SITE_NOT_ENROLLED]
          - state_machines.CollectionSite.ENROLLED_to_SUSPENDED
          - state_machines.CollectionSite.SUSPENDED_to_ENROLLED
          - state_machines.VolumeReport.SUBMITTED_to_ACCEPTED
          - calculations.site_volume_credit
        distinguishing_aspect: |
          A second, differently-shaped cross-entity gate: the dependency runs child → parent
          (VolumeReport acceptance reads CollectionSite.enrollment_status) and the blocking state is
          reached *after* the child was legally created, so the same SUBMITTED report is refused while
          the site is SUSPENDED and credited with exactly 152195c once the site is reinstated.
        test_recipe:
          setup:
            - "WA program with site credit 305c/unit and a 500-unit bonus threshold."
            - "ENROLLED NORTH site with a SUBMITTED 2026-09 volume report of 300 mattress + 199 foundation units (499 units — one short of the bonus threshold)."
            - "The site is then SUSPENDED by the administrator (no quarantine, strike count 0)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Chinook Collection Site", site_type: "COLLECTION_SITE", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_id}/volume-reports"
              payload: { period_month: "2026-09", units_mattress: 300, units_foundation: 199 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/suspend"
              payload: { reason: "Unresolved site audit findings" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_id}/reinstate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "First accept response: HTTP 409 with data.error_id == ERR_SITE_NOT_ENROLLED"
            - "After the first (rejected) accept: VolumeReport.${vr_id}.status == SUBMITTED, credit_cents == 0, credited_units == 0"
            - "After the first (rejected) accept: StateProgram.${prog_wa_id}.site_credit_paid_cents == 0"
            - "CollectionSite.${site_id}.enrollment_status == ENROLLED after reinstate"
            - "StateProgram.${prog_wa_id}.enrolled_site_count == 1 after reinstate"
            - "Second accept response: HTTP 200 with data.status == ACCEPTED"
            - "VolumeReport.${vr_id}.credited_units == 499"
            - "VolumeReport.${vr_id}.credit_cents == 152195"
            - "CollectionSite.${site_id}.units_on_hand == 499 and CollectionSite.${site_id}.units_reported_total == 499"
            - "StateProgram.${prog_wa_id}.site_credit_paid_cents == 152195 and StateProgram.${prog_wa_id}.reserve_balance_cents == 4847805"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: fee_rate_interval_abuts_predecessor_end_but_rejects_one_instant_earlier
        grounds:
          - calculations.rate_period_overlap
          - validations[priority=68]
          - errors[ERR_RATE_PERIOD_OVERLAP]
          - entities.FeeRateSchedule.fields.effective_from
          - entities.FeeRateSchedule.fields.effective_to
        distinguishing_aspect: |
          FeeRateSchedule intervals are HALF-OPEN [effective_from, effective_to): a successor starting at
          exactly the predecessor's exclusive end 2027-01-01T00:00:00Z is accepted, while one starting a
          second earlier (2026-12-31T23:59:59Z) overlaps and is refused with ERR_RATE_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "CA program (recommended_rate_cents 1075, band [860, 1290])."
            - "ACTIVE FOUNDATION rate 900c for the closed interval [2026-08-01T00:00:00Z, 2027-01-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v_ca_1: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "FOUNDATION", fee_cents_per_unit: 900, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_state_program_version: "${v_ca_1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_f900_id: $.data.id }
            - call: "POST /fee-rate-schedules/${sch_f900_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
            - call: "POST /fee-rate-schedules/${sch_f900_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_ca_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { v_ca_2: $.data.version }
          trigger:
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "FOUNDATION", fee_cents_per_unit: 950, effective_from: "2026-12-31T23:59:59Z", expected_state_program_version: "${v_ca_2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "FOUNDATION", fee_cents_per_unit: 950, effective_from: "2027-01-01T00:00:00Z", expected_state_program_version: "${v_ca_2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_f950_id: $.data.id }
            - call: "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&unit_class=FOUNDATION"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "First proposal response: HTTP 409 with data.error_id == ERR_RATE_PERIOD_OVERLAP"
            - "Second proposal response: HTTP 201 with data.effective_from == 2027-01-01T00:00:00Z"
            - "FeeRateSchedule.${sch_f950_id}.status == PROPOSED and FeeRateSchedule.${sch_f950_id}.effective_to == null"
            - "FeeRateSchedule.${sch_f950_id}.recommended_rate_cents_at_proposal == 1075"
            - "FeeRateSchedule.${sch_f900_id}.status == ACTIVE and FeeRateSchedule.${sch_f900_id}.effective_to == 2027-01-01T00:00:00Z"
            - "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&unit_class=FOUNDATION returns data.meta total_count == 2 (the rejected proposal created nothing)"

      - name: hauler_window_turnaround_buffer_capacity_boundary
        grounds:
          - calculations.hauler_window_conflict
          - validations[priority=70]
          - errors[ERR_HAULER_WINDOW_CAPACITY_EXCEEDED]
          - entities.Hauler.fields.max_concurrent_routes
          - entities.PickupOrder.fields.pickup_window_start
        distinguishing_aspect: |
          A different overlap geometry from the rate intervals: pickup windows are CLOSED on both ends and
          the new window is padded by a 60-minute turnaround buffer against an aggregate capacity, so a
          second route starting exactly 60 minutes after the first window's end conflicts (padded start
          11:00 touches end 11:00) while one starting 61 minutes after does not.
        test_recipe:
          setup:
            - "WA program with an ENROLLED NORTH site holding 510 on-hand units and a CERTIFIED recycler."
            - "A single-route hauler (max_concurrent_routes 1) serving NORTH."
            - "One SCHEDULED 100-unit order on that hauler for the window 2026-08-05T09:00:00Z – 11:00:00Z."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /haulers"
              payload: { state_program_id: "${prog_wa_id}", company_name: "Single Truck Hauling", service_regions: ["NORTH"], per_unit_rate_cents: 500, per_km_rate_cents: 200, max_route_payment_cents: 200000, max_concurrent_routes: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { hauler1_id: $.data.id }
            - call: "POST /recyclers"
              payload: { state_program_id: "${prog_wa_id}", facility_name: "Cascade Fiber Recovery", accepted_unit_classes: ["MATTRESS", "FOUNDATION"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { recycler_id: $.data.id }
            - call: "POST /recyclers/${recycler_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_id}/volume-reports"
              payload: { period_month: "2026-08", units_mattress: 320, units_foundation: 190 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { vr1_id: $.data.id }
            - call: "POST /volume-reports/${vr1_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler1_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T09:00:00Z", pickup_window_end: "2026-08-05T11:00:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { po_a_id: $.data.id }
          trigger:
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler1_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T12:00:00Z", pickup_window_end: "2026-08-05T13:00:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler1_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T12:01:00Z", pickup_window_end: "2026-08-05T13:00:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { po_c_id: $.data.id }
          assert:
            - "First trigger response: HTTP 409 with data.error_id == ERR_HAULER_WINDOW_CAPACITY_EXCEEDED"
            - "Second trigger response: HTTP 201 with data.pickup_window_start == 2026-08-05T12:01:00Z"
            - "PickupOrder.${po_c_id}.hauler_id == ${hauler1_id}"
            - "Hauler.${hauler1_id}.active_route_count == 2"
            - "CollectionSite.${site_id}.units_on_hand == 310 and CollectionSite.${site_id}.units_in_transit == 200"
            - "PickupOrder.${po_a_id}.fulfillment_status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pay_then_refund_restores_program_ledger_exactly
        grounds:
          - calculations.program_ledger_reconciliation
          - calculations.reserve_coverage_months
          - calculations.fee_rate_recommendation
          - state_machines.SalesRemittance.FILED_to_PAID
          - state_machines.SalesRemittance.PAID_to_REFUNDED
          - entities.StateProgram.fields.reserve_balance_cents
        distinguishing_aspect: |
          The money invariant: after paying 1271043c and refunding the same amount, the program's
          fee_collected_cents returns to 0, reserve_balance_cents to the opening 5000000c,
          reserve_coverage_months to 1.00 and recommended_rate_cents to 1075 — every derived field that
          moved to 1271043 / 6271043 / 1.25 / 1064 is exactly restored, with no residue.
        test_recipe:
