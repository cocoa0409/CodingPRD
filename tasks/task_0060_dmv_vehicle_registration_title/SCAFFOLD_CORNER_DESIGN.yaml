# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index (breadth probe)
# task_0060_dmv_vehicle_registration_title  (Expert)
# Walks references/claim-extraction-guide.md against §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_owner_minimal_required_fields_returns_201
        claim_type: Creation
        grounds: [entities.Owner.fields.full_name, entities.Owner.fields.residence_county_code]
        distinguishing_aspect: "POST /owners with full_name + residence_county_code returns 201; credential_type defaults STANDARD, real_id_status defaults NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { full_name: "Jane Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id, ct: $.data.credential_type, ris: $.data.real_id_status }
          assert:
            - "response.http_status == 201"
            - "Owner.${owner_id}.credential_type == STANDARD"
            - "Owner.${owner_id}.real_id_status == NONE"

      - name: create_vehicle_missing_required_vin_returns_validation
        claim_type: Required Fields
        grounds: [entities.Vehicle.fields.vin]
        distinguishing_aspect: "POST /vehicles omitting vin (a source:input field with no default) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Veh Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: create_vehicle_invalid_vin_length_returns_invalid_vin
        claim_type: Type Constraints
        grounds: ["validations[priority=14]", entities.Vehicle.fields.vin]
        distinguishing_aspect: "POST /vehicles with a vin not 17 chars returns ERR_INVALID_VIN (422)."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Bad VIN Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "SHORTVIN", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_VIN"
            - "response.http_status == 422"

      - name: create_vehicle_duplicate_vin_returns_invalid_vin
        claim_type: Type Constraints
        grounds: ["validations[priority=14]", entities.Vehicle.fields.vin]
        distinguishing_aspect: "A second POST /vehicles reusing an existing 17-char vin returns ERR_INVALID_VIN (422) on the uniqueness clause."
        test_recipe:
          setup: ["An owner and a vehicle with vin 1HGCM82633A000200 exist."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Dup VIN Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000200", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
          trigger:
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000200", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_VIN"
            - "response.http_status == 422"

      - name: get_vehicle_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "GET /vehicles/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: vehicle_computed_defaults_on_create
        claim_type: Computed Fields
        grounds: [entities.Vehicle.fields.vin_status, entities.Vehicle.fields.title_status, entities.Vehicle.fields.active_lien_count]
        distinguishing_aspect: "On POST /vehicles, vin_status defaults UNVERIFIED, title_status NONE, active_lien_count 0 regardless of any client-supplied value."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Default Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000201", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
          assert:
            - "Vehicle.${veh_id}.vin_status == UNVERIFIED"
            - "Vehicle.${veh_id}.title_status == NONE"
            - "Vehicle.${veh_id}.active_lien_count == 0"

      - name: list_vehicles_filter_by_owner_returns_array
        claim_type: Listing
        grounds: [entities.Vehicle.fields.owner_id]
        distinguishing_aspect: "GET /vehicles?owner_id=X returns a paginated Vehicle[] of only that owner's vehicles with total_count and has_more."
        test_recipe:
          setup: ["An owner with one vehicle."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "List Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000202", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
          trigger:
            - call: "GET /vehicles?owner_id=${owner_id}"
              payload: {}
              as: ClerkAgent
          assert:
            - "response.response_type == array"
            - "response.data[0].owner_id == ${owner_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_title_application_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TitleApplication.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving a TitleApplication still in DRAFT (never submitted) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A DRAFT title application on a VIN-verified vehicle."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Draft Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000210", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000210", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
          trigger:
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: submit_title_application_vin_unverified_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TitleApplication.DRAFT_to_SUBMITTED, "validations[priority=5]"]
        distinguishing_aspect: "Submitting a DRAFT application whose vehicle vin_status is UNVERIFIED returns ERR_VIN_NOT_VERIFIED (409)."
        test_recipe:
          setup: ["A DRAFT title application on a vehicle that was never VIN-verified."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Unverified Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000211", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
          trigger:
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VIN_NOT_VERIFIED"
            - "response.http_status == 409"

      - name: transfer_title_without_existing_title_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TitleApplication.DRAFT_to_SUBMITTED, "errors[ERR_TRANSFER_REQUIRES_TITLE]"]
        distinguishing_aspect: "Submitting a TRANSFER application on a vehicle with title_status NONE returns ERR_TRANSFER_REQUIRES_TITLE (409)."
        test_recipe:
          setup: ["VIN-verified vehicle with title_status NONE; a TRANSFER application in DRAFT."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Transfer Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000212", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000212", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "TRANSFER" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
          trigger:
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRANSFER_REQUIRES_TITLE"
            - "response.http_status == 409"

      - name: approve_salvage_hold_without_passing_inspection_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TitleApplication.SALVAGE_HOLD_to_APPROVED, "validations[priority=6]"]
        distinguishing_aspect: "Approving a SALVAGE_HOLD application with no PASS SalvageInspection returns ERR_SALVAGE_INSPECTION_REQUIRED (409)."
        test_recipe:
          setup: ["Salvage-branded, VIN-verified vehicle; title application in SALVAGE_HOLD with no inspection."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Hold Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000213", model_year: 2024, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER", is_salvage_branded: true }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000213", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
          trigger:
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SALVAGE_INSPECTION_REQUIRED"
            - "response.http_status == 409"

      - name: deactivate_physical_plate_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.LicensePlate.ACTIVE_to_DEACTIVATED, "validations[priority=12]"]
        distinguishing_aspect: "Deactivating a PHYSICAL plate returns ERR_PLATE_NOT_ELECTRONIC (409)."
        test_recipe:
          setup: ["ACTIVE registration with one PHYSICAL plate in status ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DmvAdmin
            - call: "POST /owners"
              payload: { full_name: "Phys Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000214", model_year: 2008, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000214", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations"
              payload: { vehicle_id: "${veh_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
            - call: "POST /fee-assessments/${fa_id}/pay"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: ClerkAgent
            - call: "POST /license-plates"
              payload: { registration_id: "${reg_id}", plate_number: "PHYS-0214", plate_type: "PHYSICAL", expected_registration_version: "${reg_v}" }
              as: ClerkAgent
              captures: { plate_id: $.data.id }
            - call: "POST /license-plates/${plate_id}/activate"
              payload: {}
              as: ClerkAgent
          trigger:
            - call: "POST /license-plates/${plate_id}/deactivate"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PLATE_NOT_ELECTRONIC"
            - "response.http_status == 409"

      - name: activate_plate_registration_not_active_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.LicensePlate.ISSUED_to_ACTIVE, "errors[ERR_REGISTRATION_NOT_ACTIVE]"]
        distinguishing_aspect: "Activating a plate whose parent Registration is SUSPENDED returns ERR_REGISTRATION_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A SUSPENDED registration with a PHYSICAL plate left in ISSUED (never activated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DmvAdmin
            - call: "POST /owners"
              payload: { full_name: "Susp Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000215", model_year: 2008, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000215", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations"
              payload: { vehicle_id: "${veh_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
            - call: "POST /fee-assessments/${fa_id}/pay"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: ClerkAgent
            - call: "POST /license-plates"
              payload: { registration_id: "${reg_id}", plate_number: "PHYS-0215", plate_type: "PHYSICAL", expected_registration_version: "${reg_v}" }
              as: ClerkAgent
              captures: { plate_id: $.data.id }
            - call: "POST /registrations/${reg_id}/suspend"
              payload: {}
              as: DmvAdmin
          trigger:
            - call: "POST /license-plates/${plate_id}/activate"
              payload: {}
              as: ClerkAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REGISTRATION_NOT_ACTIVE"
            - "response.http_status == 409"

      - name: terminal_registration_expire_then_suspend_invalid
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Registration.ACTIVE_to_EXPIRED, state_machines.Registration.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "After a registration reaches terminal EXPIRED, suspending it returns ERR_INVALID_STATE (409); all plates already SURRENDERED."
        test_recipe:
          setup: ["An ACTIVE registration with one PHYSICAL plate; then expired."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DmvAdmin
            - call: "POST /owners"
              payload: { full_name: "Exp Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000216", model_year: 2008, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000216", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations"
              payload: { vehicle_id: "${veh_id}", owner_id: "${owner_id}", registration_type: "INITIAL" }
              as: ClerkAgent
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
            - call: "POST /fee-assessments/${fa_id}/pay"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: ClerkAgent
            - call: "POST /license-plates"
              payload: { registration_id: "${reg_id}", plate_number: "PHYS-0216", plate_type: "PHYSICAL", expected_registration_version: "${reg_v}" }
              as: ClerkAgent
              captures: { plate_id: $.data.id }
            - call: "POST /registrations/${reg_id}/expire"
              payload: {}
              as: DmvAdmin
          trigger:
            - call: "POST /registrations/${reg_id}/suspend"
              payload: {}
              as: DmvAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"
            - "LicensePlate.${plate_id}.status == SURRENDERED"

      - name: expire_surrenders_all_plates_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.Registration.ACTIVE_to_EXPIRED, entities.LicensePlate.fields.surrendered_at]
        distinguishing_aspect: "Expiring an ACTIVE registration surrenders its plate (status SURRENDERED) and stamps surrendered_at."
        test_recipe:
          setup: ["An ACTIVE registration with one ACTIVE PHYSICAL plate."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DmvAdmin
            - call: "POST /owners"
              payload: { full_name: "Exp2 Owner", residence_county_code: "KING" }
              as: ClerkAgent
              captures: { owner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${owner_id}", vin: "1HGCM82633A000217", model_year: 2008, purchase_price_cents: 3000000, msrp_cents: 3200000, vehicle_class: "PASSENGER" }
              as: ClerkAgent
              captures: { veh_id: $.data.id }
            - call: "POST /vin-verifications"
              payload: { vehicle_id: "${veh_id}", submitted_vin: "1HGCM82633A000217", outcome: "MATCH" }
              as: ClerkAgent
            - call: "POST /title-applications"
              payload: { vehicle_id: "${veh_id}", applicant_owner_id: "${owner_id}", application_type: "INITIAL" }
              as: ClerkAgent
              captures: { ta_id: $.data.id }
            - call: "POST /title-applications/${ta_id}/submit"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/approve"
              payload: {}
              as: ClerkAgent
            - call: "POST /title-applications/${ta_id}/issue"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations"
