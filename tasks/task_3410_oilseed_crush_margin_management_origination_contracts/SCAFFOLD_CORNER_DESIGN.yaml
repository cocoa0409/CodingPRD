            - *k_sched
            - *k_sched_pub
            - *k_elev
          trigger:
            - call: "POST /api/shipment-routing-quotes"
              payload: { origin_elevator_id: "${k_elev_id}", bushels: 100 }
              as: LogisticsCoordinator
              captures: { k_err9: $.data.error_id }
          assert:
            - "response 422 with error_id ERR_NO_ROUTE_AVAILABLE"

      - name: carry_months_between_computes_storage_cost
        claim_type: Correct Result
        grounds: [calculations.carry_assessment]
        distinguishing_aspect: "months_between(2026-11, 2027-03) == 4, so storage cost is 4 x 5 == 20 cents and the signal is (1225 - 1200) - 20 == 5 -> CARRY; the month arithmetic itself is under test."
        test_recipe:
          setup: ["Elevator; BEAN quotes 2026-11 = 1200 and 2027-03 = 1225 as-of 2026-09-01."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_qb
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2027-03", price_cents: 1225, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/elevators/${k_elev_id}/carry-assessment"
              payload: { nearby_month: "2026-11", deferred_month: "2027-03" }
              as: CrushTrader
          assert:
            - "storage_cost_cents_per_bushel == 20 (4 months x 5)"
            - "signal_cents_per_bushel == 5 and decision == CARRY"
            - "nearby_price_cents == 1200 and deferred_price_cents == 1225"

      - name: truck_lane_daily_capacity_exact_then_rejected
        claim_type: Correct Result
        grounds: ["validations[priority=10]", errors.ERR_LANE_DAILY_CAPACITY_EXCEEDED, entities.FreightLane.fields.daily_capacity_bushels]
        distinguishing_aspect: "TRUCK per-departure-date aggregate: 600 + 400 on the same date exactly equals the 1000-bu lane capacity and books; one more bushel on that date fails — while the SAME lane on a different date is unaffected."
        test_recipe:
          setup: ["Elevator holding 2000 bu; TRUCK lane, capacity 1000/day, transit 2."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_plant
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "CASH", quantity_bushels: 2000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { k_ctr_t_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_t_id}", gross_bushels: 2000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_t: $.data.id }
            - call: "POST /api/delivery-tickets/${k_tkt_t}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${k_elev_id}", destination_plant_id: "${k_plant_id}", mode: "TRUCK", freight_cents_per_bushel: 12, transit_days: 2, daily_capacity_bushels: 1000 }
              as: LogisticsCoordinator
              captures: { k_lane_t: $.data.id }
          trigger:
            - call: "POST /api/shipments"
              payload: { lane_id: "${k_lane_t}", bushels: 600, departure_date: "2026-09-10T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /api/shipments"
              payload: { lane_id: "${k_lane_t}", bushels: 400, departure_date: "2026-09-10T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /api/shipments"
              payload: { lane_id: "${k_lane_t}", bushels: 1, departure_date: "2026-09-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { k_err10: $.data.error_id }
            - call: "POST /api/shipments"
              payload: { lane_id: "${k_lane_t}", bushels: 1, departure_date: "2026-09-11T00:00:00Z" }
              as: LogisticsCoordinator
          assert:
            - "600-bu and 400-bu shipments both book 201 (600 + 400 == 1000 <= 1000)"
            - "the 1-bu same-date shipment fails 422 ERR_LANE_DAILY_CAPACITY_EXCEEDED (1000 + 1 > 1000)"
            - "the 1-bu shipment on 2026-09-11 books 201 (per-date aggregate, not cumulative)"

  # ===========================================================================
  - section: validations
    instances:
      - name: election_beyond_unpriced_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", errors.ERR_PRICING_EXCEEDS_QUANTITY]
        distinguishing_aspect: "On a healthy UNPRICED contract, an election of 1500 bu against 2000 quantity after 800 already priced violates only the quantity constraint -> 422 ERR_PRICING_EXCEEDS_QUANTITY (no state error masks it here)."
        test_recipe:
          setup: ["DEFERRED contract 2000 bu, deadline 2026-12-15, futures 2026-12 quoted 1100; 800 bu already priced."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 2000, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
              captures: { k_ctr_e_id: $.data.id, k_ctr_e_v0: $.data.version }
            - call: "POST /api/origination-contracts/${k_ctr_e_id}/pricing-elections"
              payload: { bushels: 800, expected_contract_version: "${k_ctr_e_v0}" }
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${k_ctr_e_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { k_ctr_e_v1: $.data.version }
          trigger:
            - call: "POST /api/origination-contracts/${k_ctr_e_id}/pricing-elections"
              payload: { bushels: 1500, expected_contract_version: "${k_ctr_e_v1}" }
              as: OriginationMerchandiser
              captures: { k_err11: $.data.error_id }
          assert:
            - "response 422 with error_id ERR_PRICING_EXCEEDS_QUANTITY (800 + 1500 > 2000)"
            - "priced_bushels remains 800"

      - name: delivery_before_window_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", errors.ERR_DELIVERY_OUTSIDE_WINDOW]
        distinguishing_aspect: "delivery_date 2026-09-10 against window [2026-09-15, 2026-09-30] fails 422 ERR_DELIVERY_OUTSIDE_WINDOW; a delivery exactly on window start is accepted (inclusive boundary)."
        test_recipe:
          setup: ["SOY_OIL contract window 2026-09-15..2026-09-30; clock at 2026-09-10."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_buyer
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${k_buyer_id}", plant_id: "${k_plant_id}", product: "SOY_OIL", quantity_lbs: 1000, price_cents_per_lb: 20, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-09-30T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { k_sale_w: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/product-sales-contracts/${k_sale_w}/deliver"
              payload: { delivery_date: "2026-09-10T00:00:00Z", quantity_lbs: 100, actual_ffa_pct: 0.3 }
              as: ProductMerchandiser
              captures: { k_err12: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/product-sales-contracts/${k_sale_w}/deliver"
              payload: { delivery_date: "2026-09-15T00:00:00Z", quantity_lbs: 100, actual_ffa_pct: 0.3 }
              as: ProductMerchandiser
          assert:
            - "the 09-10 delivery fails 422 ERR_DELIVERY_OUTSIDE_WINDOW"
            - "the 09-15 delivery (exactly window start) succeeds 201 — the window is inclusive at both ends"
            - "delivered_lbs == 100 after the accepted delivery only"

      - name: sales_window_end_before_start_rejected
        claim_type: Violation → Error
        grounds: [entities.ProductSalesContract.fields.delivery_window_end, errors.ERR_DELIVERY_WINDOW_INVALID]
        distinguishing_aspect: "Two invalid window shapes share one error: end <= start, and a span over 62 days — both 422 ERR_DELIVERY_WINDOW_INVALID at creation."
        test_recipe:
          setup: ["Buyer and plant exist."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_buyer
          trigger:
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${k_buyer_id}", plant_id: "${k_plant_id}", product: "SOY_OIL", quantity_lbs: 1000, price_cents_per_lb: 20, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-09-10T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { k_err13a: $.data.error_id }
            - call: "POST /api/product-sales-contracts"
              payload: { buyer_id: "${k_buyer_id}", plant_id: "${k_plant_id}", product: "SOY_OIL", quantity_lbs: 1000, price_cents_per_lb: 20, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z", max_ffa_pct: 0.5 }
              as: ProductMerchandiser
              captures: { k_err13b: $.data.error_id }
          assert:
            - "end-before-start fails 422 ERR_DELIVERY_WINDOW_INVALID"
            - "the 121-day span fails 422 ERR_DELIVERY_WINDOW_INVALID (span > 62)"

      - name: meal_delivery_below_protein_spec_rejected
        claim_type: Violation → Error
        grounds: [entities.ProductSalesContract.fields.min_protein_pct, errors.ERR_QUALITY_SPEC_FAILED]
        distinguishing_aspect: "A SOY_MEAL delivery at protein 45.5 against a 46.0 minimum fails 422 ERR_QUALITY_SPEC_FAILED and records nothing; delivered_lbs stays 0."
        test_recipe:
          setup: ["SOY_MEAL contract 2000 lbs, min_protein 46.0, window 2026-09-10..2026-09-20; clock at 2026-09-12."]
          setup_api_calls:
            - *k_clock
            - *k_plant
            - *k_buyer
            - *k_sale_meal
