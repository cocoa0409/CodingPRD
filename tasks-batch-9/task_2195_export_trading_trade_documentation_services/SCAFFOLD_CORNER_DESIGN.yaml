          - errors[ERR_DISPUTE_STATE_INVALID]
        distinguishing_aspect: "A counter is declared only from OFFERED, so countering an OPEN case (no offer on the table yet) is a priority-11 own-state failure — ERR_DISPUTE_STATE_INVALID (409) is returned in preference to the priority-35 money-bound error even though current_offer_usd is null and no bound can be evaluated."
