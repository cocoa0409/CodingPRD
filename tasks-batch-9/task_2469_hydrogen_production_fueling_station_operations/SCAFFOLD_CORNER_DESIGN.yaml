            - "Station STN-S8: LOW 5000 L vessel at 100.00 bar (stored 40.000), capacity 900.000, two current responder certifications."
            - "A RELEASED lot of mass_kg 280.000 (purity PASS by QA-1, CI certified, released by CA-1)."
            - "Delivery of 280.000 kg TUBE_TRAILER with trailer 2500.0 L finishing at 100.00 bar: heel 20.000, net 260.000."
