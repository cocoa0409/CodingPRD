            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-LATE", release_type: "SINGLE", release_date: "2026-08-21", track_ids: ["${trk_b}"] }, as: AnRManager, captures: { rel_late: $.data.id } }
