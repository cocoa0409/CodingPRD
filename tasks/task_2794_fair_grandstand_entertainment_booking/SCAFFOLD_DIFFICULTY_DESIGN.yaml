      - name: activation_net_fee_nested_min_three_premiums
        grounds:
          - calculations.activation_net_fee
          - entities.SponsorshipActivation.fields.net_fee_cents
          - entities.Sponsor.fields.exclusivity_tier
          - entities.ShowBooking.fields.gross_potential_cents
        distinguishing_aspect: |
          MODE (a) - three independent inputs feeding one non-linear expression. rights,
          Sponsor.exclusivity_tier and the booking's gross_potential_cents combine additively
          into premium_pct and are then clamped by a nested min against
          MAX_PREMIUM_MULTIPLIER. The same base_fee_cents therefore produces three different
          fees: 2600000 on the clamped arm (0.40 premium capped to 0.30), 1250000 on the
          uncapped arm (0.25 premium under the cap on a 888306-gross show), and 1000000 with
          no premium at all. Neither of the other two modes exercises a clamp.
        test_recipe:
          setup:
            - "One edition with two stages: a 4000/6000 grandstand and a 500/500 pavilion, so STAGE_NAMING can be sold once on each stage without tripping ERR_STAGE_NAMING_ALREADY_GRANTED."
            - "Show 1 on the grandstand carries RESERVED 6295/400/1160 unbundled plus GENERAL_ADMISSION 3950/250/2100 bundled -> gross_potential_cents 12919037, at or above HIGH_DEMAND_GROSS_THRESHOLD_CENTS."
            - "Show 2 on the pavilion carries a single GENERAL_ADMISSION scale, face 3770, facility fee 0, allotment 250, unbundled -> gross_potential_cents round_half_up(3770 * 250 * 0.9425) == 888306, far below the threshold."
            - "Sponsor A is PRESENTING, sponsor B is SUPPORTING."
            - "Activation 1: sponsor A, show 1, STAGE_NAMING, base 2000000 -> premium 0.25 + 0.10 + 0.05 == 0.40, uncapped arm 2800000, cap arm 2600000."
            - "Activation 2: sponsor B, show 2, STAGE_NAMING, base 1000000 -> premium 0.25 only, uncapped arm 1250000, cap arm 1300000."
            - "Activation 3: sponsor B, show 2, SIGNAGE, base 1000000 -> premium 0.00, both arms 1000000."
