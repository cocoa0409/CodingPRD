              captures: { certA: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${whA}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
