  - rule_id: compensating_invariant
    instances:
      - name: spare_reservation_and_release_conserve_reserved_count
        grounds:
          - endpoints.POST_service_contracts_spare_reservations
          - endpoints.POST_service_contracts_spare_releases
          - entities.ServiceContract.fields.spare_reserved_count
          - state_machines.ServiceContract.ACTIVE_to_SUSPENDED
          - state_machines.ServiceContract.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: ServiceContract.spare_reserved_count together with
          the paired Module.reserved_service_contract_id pointer. Reserve ->
          release -> reserve must return both to their starting values (1, ${sc})
          with no drift, and the derived contract_state and
          DisplayProject.service_posture must ride the same round trip
          (ACTIVE -> SUSPENDED -> ACTIVE, NORMAL -> AT_RISK -> NORMAL). Only the
          OCC version is allowed to move monotonically.
        test_recipe:
          setup:
