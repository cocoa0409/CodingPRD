          Parallel state dimensions on one HardwareUnit row - a different entity from the cyclic
          PartyApproval machine: four consecutive calls move handling_status ON_ROOF -> REMOVED -> STORED
          while condition_grade independently walks UNINSPECTED -> SERVICEABLE -> DAMAGED, and each call
