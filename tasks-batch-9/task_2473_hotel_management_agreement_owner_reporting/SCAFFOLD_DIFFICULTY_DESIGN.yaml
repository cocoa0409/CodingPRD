            - "after REAFFIRM the CENTRALIZED_SERVICES FeeAccrual of ${pkg7b} is back in status INVOICED with amount_cents == 500000, and CentralizedServiceCharge.${chg7b}.disclosure_status == DISCLOSED"
            - "the second execute returns HTTP 200 with CashDistribution.${dist7b}.status == EXECUTED"
            - "ManagementAgreement.${agr7b}.ffe_reserve_balance_cents == 2200001 and working_capital_balance_cents == 1000000 (wc_restoration_cents was 0)"
            - "the reserve-ledger list holds exactly one row: entry_type CONTRIBUTION, amount_cents 2200001, balance_after_cents 2200001, source_kind DISTRIBUTION_EXECUTION"
            - "the BASE accrual of ${pkg7b} is PAID with paid_amount_cents == 1787500 and the INCENTIVE accrual is PAID with paid_amount_cents == 1012499"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: report_period_slot_uniqueness_rejects_only_the_same_month
        grounds:
          - validations[priority=36]
          - calculations.package_derived_fields
          - errors[ERR_PERIOD_ALREADY_REPORTED]
        distinguishing_aspect: |
          Closed discrete-slot collision on the composite key (agreement, fiscal_year, period_month):
          only an exact repeat of (2026, 9) collides, while the adjacent month (2026, 10), the same
          month in the next fiscal year (2027, 9) and the year-rolling month (2026, 12) are all
          accepted — adjacency never conflicts because the slot has no extent.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with an APPROVED FY2026 OperatingBudget."
            - "One MonthlyReportPackage already occupying the (2026, 9) slot."
          setup_api_calls:
