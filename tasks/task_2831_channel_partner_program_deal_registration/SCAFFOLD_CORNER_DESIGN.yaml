        grounds:
          - validations[priority=44]
          - errors[ERR_SUPERSEDE_TARGET_INVALID]
          - endpoints[POST /deal-registrations]
        distinguishing_aspect: "supersedes_registration_id must match the new registration's partner, account AND product line: pointing a SUPPORT_SERVICES draft at an APPROVED ANALYTICS_ADDON registration yields ERR_SUPERSEDE_TARGET_INVALID 422, while the same pointer from an ANALYTICS_ADDON draft is accepted."
