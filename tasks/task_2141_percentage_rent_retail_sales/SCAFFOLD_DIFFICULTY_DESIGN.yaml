  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: report_period_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.reporting_interval_conflicts
          - validations[priority=11]
          - errors[ERR_REPORTING_PERIOD_OVERLAP]
          - entities.SalesReport.fields.period_start
          - entities.SalesReport.fields.period_end
        distinguishing_aspect: |
          Resource is the LeaseYear and the interval semantics are HALF-OPEN with no buffer: a
          new period starting exactly at an existing period's end (2026-10-01) is accepted with
          201, while a period straddling that end (2026-09-15 to 2026-10-15) is rejected with
          ERR_REPORTING_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "One ACTIVE lease with LeaseYear 1 spanning 2026-09-01 to 2027-09-01, status OPEN."
            - "One PENDING report already occupies 2026-09-01 to 2026-10-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Interval Retail LLC", trade_name: "IntervalShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "2101", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
