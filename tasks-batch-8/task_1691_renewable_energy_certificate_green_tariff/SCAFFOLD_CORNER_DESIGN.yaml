            - "err3 == ERR_REGION_INELIGIBLE (certificate CAISO != obligation region ERCOT; note compliance has no technology rule)"

      - name: void_minted_reading_rejected_and_unminted_void_debits
        claim_type: violation_to_error
        grounds: ["validations[priority=37]", "errors[ERR_READING_ALREADY_MINTED]", "entities.Generator.fields.cumulative_accepted_kwh"]
        distinguishing_aspect: "Void is referentially guarded: a mint-consumed reading rejects void with ERR_READING_ALREADY_MINTED, while an unminted ACCEPTED reading voids and debits cumulative_accepted_kwh (1700 -> 1000)."
        test_recipe:
          setup: ["Generator ACTIVE; r2 (July, 1000 kWh) accepted and consumed by a mint-run; then r1 (August, 700 kWh) accepted afterwards so it stays unminted"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
