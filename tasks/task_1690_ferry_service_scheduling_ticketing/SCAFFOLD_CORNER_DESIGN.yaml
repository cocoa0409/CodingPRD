              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/begin-boarding"
              payload: {}
              as: TerminalAgent
          trigger:
            - call: "POST /ferry/sailings/${s_id}/depart"
              payload: {}
              as: TerminalAgent
          assert:
            - "Sailing.${s_id}.status == DEPARTED"
            - "Booking.${b_id}.status == NO_SHOW"
            - "Sailing.${s_id}.reserved_vehicle_feet == 0  # released"
            - "Customer.${cust_id}.refund_credit_cents == 0  # no-show forfeits fare"

      - name: full_sailing_happy_path_completes
        claim_type: valid_transition
        grounds: [state_machines.Sailing, state_machines.Booking, state_machines.CrewAssignment]
        distinguishing_aspect: "End-to-end: SCHEDULED->OPEN->CLOSED->BOARDING->DEPARTED->COMPLETED; a checked-in boarded booking reaches COMPLETED; crew assignments RELEASED and crew back to AVAILABLE."
        test_recipe:
          setup: ["base setup; sailing OPEN; booking confirmed then checked-in at BOOKING_CLOSED; boarded at BOARDING"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
