            - "GET /hie/access-audit-entries filtered by query_id ${qM_id} returns exactly 1 row with action == DISCLOSED, suppression_reason == null and purpose_of_use == TREATMENT"
      - name: subscription_activation_blocked_until_a_fresh_adt_publisher_run_passes
        grounds:
          - validations.priority_21_ERR_SUBSCRIPTION_CONFORMANCE_MISSING
          - state_machines.NotificationSubscription.PENDING_ACTIVATION_to_ACTIVE
          - state_machines.ConformanceTest.RUNNING_to_PASSED
          - entities.NotificationSubscription.fields.activating_conformance_test_id
        distinguishing_aspect: |
          A different entity pair - NotificationSubscription -> ConformanceTest - and a different
          dependency shape: the gate is not a status enum on a sibling row but the existence of a
          ConformanceTest for a specific profile in the strictly PASSED state. A WAIVED ADT_PUBLISHER run
          is deliberately insufficient here even though it was sufficient to certify the participant, so
          activation flips from 409 to 200 only after a second ADT_PUBLISHER attempt genuinely passes,
          and the subscription must pin that second run's id.
        test_recipe:
