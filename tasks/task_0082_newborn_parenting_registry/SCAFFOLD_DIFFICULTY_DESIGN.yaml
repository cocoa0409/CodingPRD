          Datetime-inclusive boundary on a different endpoint (approve): requested_at exactly EQUAL
          to sep_deadline (2026-04-04T10:00:00.000Z for a MARKETPLACE policy) is WITHIN the window
          (inclusive <=) and enrolls; one millisecond later would expire. Distinct metric (SEP
          datetime) and endpoint from the readiness numeric-threshold instance.
        test_recipe:
          setup:
            - "Clock at 2026-04-04T10:00:00Z."
            - "A MARKETPLACE policy (slots_max 3); newborn birth_datetime 2026-03-05T10:00:00Z; PENDING enrollment requested_at exactly 2026-04-04T10:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-04T10:00:00Z" }
              as: RegistrySupervisor
            - call: "POST /insurance-policies"
              payload: { carrier_name: "MktCo", subscriber_name: "Pat Doe", plan_type: "MARKETPLACE", coverage_effective_date: "2026-01-01", dependent_slots_max: 3 }
              as: BenefitsCoordinator
              captures: { policy_id: $.data.id }
