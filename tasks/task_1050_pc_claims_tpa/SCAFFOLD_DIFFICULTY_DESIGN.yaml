              payload: { policy_id: "${policy_id}", coverage_type: "LIABILITY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "INVESTIGATING" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "EVALUATED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /litigation-cases"
              payload: { claim_id: "${claim_id}", venue: "Superior Court" }
              as: ClaimsManager
              captures: { lit_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "CLOSED" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LITIGATION_OPEN"
            - "Claim.${claim_id}.status == EVALUATED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: adjuster_window_buffer_conflict
        grounds:
          - validations[priority=9]
          - entities.Assignment.fields.inspection_start
        distinguishing_aspect: "ADJUSTER inspection windows conflict when within the 60-minute travel buffer: [09:00,10:00) and [10:30,11:30) are 30 minutes apart -> ERR_ASSIGNMENT_WINDOW_CONFLICT. Buffer (adjacency) semantics on the Adjuster resource."
        test_recipe:
          setup:
            - "One adjuster; two claims; adjuster assigned to claim1 over 09:00-10:00."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "RT1", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-RT1", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "A", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "B", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim2: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim1}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T10:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
          trigger:
            - call: "POST /assignments"
              payload: { claim_id: "${claim2}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T10:30:00Z", inspection_end: "2026-06-16T11:30:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ASSIGNMENT_WINDOW_CONFLICT"

      - name: vendor_window_touching_endpoints_allowed
        grounds:
          - validations[priority=9]
          - entities.Assignment.fields.vendor_id
        distinguishing_aspect: "VENDOR windows use strict half-open [start,end) with NO buffer: [09:00,11:00) and [11:00,12:00) touch at 11:00 and do NOT conflict, so the second vendor assignment is created ACTIVE. Different interval semantics (strict, no buffer) on the Vendor resource, vs the Adjuster buffer rule."
        test_recipe:
          setup:
            - "One vendor credentialed for PROPERTY; two PROPERTY claims; vendor assigned to claim1 over 09:00-11:00."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "RT2", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-RT2", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Prop Co", vendor_type: "APPRAISER", credentialed_coverages: ["PROPERTY"] }
              as: ClaimsManager
              captures: { vendor_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "A", description: "d" }
              as: ClaimsManager
              captures: { claim1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "B", description: "d" }
              as: ClaimsManager
              captures: { claim2: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim1}", assignee_type: "VENDOR", vendor_id: "${vendor_id}", scope: "APPRAISAL", inspection_start: "2026-06-17T09:00:00Z", inspection_end: "2026-06-17T11:00:00Z" }
              as: ClaimsManager
          trigger:
            - call: "POST /assignments"
              payload: { claim_id: "${claim2}", assignee_type: "VENDOR", vendor_id: "${vendor_id}", scope: "APPRAISAL", inspection_start: "2026-06-17T11:00:00Z", inspection_end: "2026-06-17T12:00:00Z" }
              as: ClaimsManager
              captures: { vasg2: $.data.id }
          assert:
            - "Assignment.${vasg2}.status == ACTIVE"

  - rule_id: compensating_invariant
    instances:
      - name: incurred_conserved_across_payment_issue_and_void
        grounds:
          - state_machines.Payment.APPROVED_to_ISSUED
          - state_machines.Payment.ISSUED_to_VOID
          - entities.Claim.fields.gross_incurred_cents
        distinguishing_aspect: "gross_incurred_cents (paid + outstanding reserve) is invariant across a payment ISSUE (reserve 1000000->600000, paid 0->400000) and its VOID compensation (back to reserve 1000000, paid 0): gross stays 1000000. Conserved quantity = per-claim incurred."
        test_recipe:
          setup:
            - "Claim assigned; indemnity reserve raised to 1000000; payment 400000 APPROVED (400000 <= reserve)."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "CI1", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-CI1", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: 1000000, reason: "set", expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v2: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 400000, expected_claim_version: "${v2}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjuster
              as_user_id: "${adj_id}"
          trigger:
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "ISSUED" }
              as: FinanceOfficer
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "VOID" }
              as: FinanceOfficer
          assert:
            - "Claim.${claim_id}.gross_incurred_cents == 1000000"
            - "Claim.${claim_id}.indemnity_reserve_cents == 1000000"
            - "Claim.${claim_id}.paid_indemnity_cents == 0"

      - name: account_reserve_pool_conserved_across_reserve_roundtrip
        grounds:
          - calculations.account_financial_rollup
          - entities.ClientAccount.fields.open_case_reserve_total_cents
        distinguishing_aspect: "ClientAccount.open_case_reserve_total_cents (aggregate reserve pool across open claims) returns to its original 0 after a +500000 / -500000 reserve-change round trip; conserved quantity is the account-level reserve pool, a different type than per-claim incurred."
        test_recipe:
          setup:
            - "Claim assigned; a +500000 indemnity reserve change already applied (account pool = 500000)."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "CI2", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-CI2", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: 500000, reason: "up", expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
          trigger:
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v2: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: -500000, reason: "down", expected_claim_version: "${v2}" }
              as: Adjuster
              as_user_id: "${adj_id}"
          assert:
            - "Claim.${claim_id}.indemnity_reserve_cents == 0"
            - "ClientAccount.${acct_id}.open_case_reserve_total_cents == 0"
