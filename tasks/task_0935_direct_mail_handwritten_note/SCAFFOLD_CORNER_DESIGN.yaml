        distinguishing_aspect: "Two EDDM jobs carrying identical route data (two fully covered 6-delivery routes, 12 pieces) price at 268 cents under SATURATION and 307 cents under HIGH_DENSITY_PLUS."
        test_recipe:
          setup: ["One campaign with two EDDM jobs in DRAFT, one per rate variant, each holding two identical routes."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
