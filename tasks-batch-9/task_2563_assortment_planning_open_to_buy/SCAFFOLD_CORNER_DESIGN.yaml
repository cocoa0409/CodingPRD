            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "signed off" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { ok_status: $.data.status, ok_budget: $.data.receipt_budget_cents }
            - call: "POST /otb/actuals-posts"
              payload: { plan_month_id: "${m1_id}", week_index: 1, actual_sales_cents: 7000000, actual_receipts_cents: 5000000, actual_units_received: 1900 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { e_planner_actuals: $.data.error_id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { v1: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2600, ship_window_start: "2026-10-01T00:00:00Z", ship_window_end: "2026-10-15T00:00:00Z", expected_plan_month_version: "${v1}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_id: $.data.id }
            - call: "POST /otb/receipt-commitments/${rc_id}/commit"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e_director_commit: $.data.error_id }
            - call: "POST /otb/receipt-commitments/${rc_id}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { ok_commit: $.data.commit_status }
            - call: "POST /otb/receipt-commitments/${rc_id}/ship"
              payload: {}
              as: MerchOpsAdmin
              captures: { e_admin_ship: $.data.error_id }
            - call: "POST /otb/receipt-commitments/${rc_id}/ship"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { ok_ship: $.data.fulfillment_status }
          assert:
            - "${submitted} == SUBMITTED, so the buyer's approve attempt is state-legal and fails only on the role"
            - "${e_buyer_approve} == ERR_UNAUTHORIZED_ROLE (403): approve is exclusive to PlanningDirector"
            - "${e_planner_vendor} == ERR_UNAUTHORIZED_ROLE (403): POST /otb/vendors is exclusive to MerchOpsAdmin, and a well-formed body does not buy the planner access"
            - "${e_vendor_read} == ERR_UNAUTHORIZED_ROLE (403): VendorRep's shared_operations list is only GET /otb/receipt-commitments and GET /otb/receipt-commitments/{id}, so 'every GET in the API' does NOT extend to it"
            - "${ok_status} == APPROVED with ${ok_budget} == 60000000 for the rightful director: the endpoint itself works"
            - "${e_planner_actuals} == ERR_UNAUTHORIZED_ROLE (403), NOT ERR_PLAN_MONTH_NOT_OPEN: the month is LOCKED_PLAN and the post would fail priority 10 anyway, but priority 2 fires first"
            - "${e_director_commit} == ERR_UNAUTHORIZED_ROLE (403) while ${ok_commit} == COMMITTED for the buyer on the same commitment id: the director who approved the budget cannot spend it"
            - "${e_admin_ship} == ERR_UNAUTHORIZED_ROLE (403) while ${ok_ship} == SHIPPED for the VendorRep: shipping is supplier-side only, and the admin that seeded the vendor cannot ship for it"
            - "each denied call left no trace: the plan was still SUBMITTED before the director approved it, no second Vendor row exists, and the commitment reached COMMITTED exactly once"

      - name: shared_operations_span_roles_while_vendor_scope_stays_narrow
        claim_type: shared_operations
        grounds:
          - roles
          - errors.ERR_NOT_COMMITMENT_VENDOR
          - validations[priority=7].ERR_NOT_COMMITMENT_VENDOR
        distinguishing_aspect: "Three different sharing rules meet here. POST /otb/assortment-items is in two roles' shared lists, so planner and buyer both create items successfully. Every GET is shared by the four office roles, so all four read the same plan. And VendorRep's entity_backed identity is enforced at priority 7 on ship and receipts ONLY - the same rep may freely GET another vendor's commitment (it is on its shared list, unscoped) but is refused with ERR_NOT_COMMITMENT_VENDOR when it tries to ship it. A blanket per-vendor filter on reads, or a missing scope check on ship, both fail."
        test_recipe:
          setup:
            - "an APPROVED plan with M1 LOCKED_PLAN and two AUTHORIZED vendors ATLS and BRLS, each category-authorized, each holding one COMMITTED commitment"
          setup_api_calls:
