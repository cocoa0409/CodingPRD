  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_chapter7_petition
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_MEANS_TEST_ABUSE]
        distinguishing_aspect: |
          Error-category pair STATE (priority 6) vs BUSINESS_SAFETY (priority 11): a second petition on an
          already-FILED Chapter 7 case whose means_test_result is PRESUMPTION_ABUSE violates both; the
          state check wins, returning ERR_INVALID_STATE not ERR_MEANS_TEST_ABUSE.
        test_recipe:
          setup:
            - "A CHAPTER_7 case is already FILED (petitioned once) and its means_test_result became PRESUMPTION_ABUSE only after a later re-submission; a second petition violates both state and the abuse bar."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Pri5a Debtor", email: "pri5a@x.com", prior_discharge_within_8y: false }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 600000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
          trigger:
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /cases/${case_id}/petition .status == 409"
            - "POST /cases/${case_id}/petition .data.error_id == ERR_INVALID_STATE"

      - name: business_referential_beats_business_temporal_on_claim_filing
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_CLAIM_CREDITOR_MISMATCH]
          - errors[ERR_STAY_TERMINATED]
        distinguishing_aspect: |
          Error-category pair BUSINESS_REFERENTIAL (priority 7, creditor mismatch) vs BUSINESS_TEMPORAL
          (priority 13, stay terminated): a claim filed by the wrong creditor on a DISMISSED case (stay
          TERMINATED) violates both; the referential check wins with ERR_CLAIM_CREDITOR_MISMATCH.
        test_recipe:
          setup:
            - "A case has been DISMISSED (stay TERMINATED). A debt was scheduled for creditor A. A second creditor B attempts to file a claim on that debt — both the referential mismatch (B != A) and the stay-terminated check fire."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Pri5b Debtor", email: "pri5b@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-5b" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr A" }
              as: Creditor
              captures: { cr_a_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr B" }
              as: Creditor
              captures: { cr_b_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_a_id}", debt_class: "UNSECURED", scheduled_amount_cents: 90000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/dismiss"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /claims"
              payload: { case_id: "${case_id}", debt_id: "${debt_id}", filed_by_creditor_id: "${cr_b_id}", claimed_amount_cents: 90000 }
              as: Creditor
              as_user_id: "${cr_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /claims .status == 409"
            - "POST /claims .data.error_id == ERR_CLAIM_CREDITOR_MISMATCH"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: means_test_one_cent_above_median_crosses_to_disposable_screen
        grounds:
          - calculations.means_test_evaluation
          - entities.MeansTest.fields.result
        distinguishing_aspect: |
          Numeric threshold metric on POST /means-tests: at annualized_cmi == median the income screen
          passes (<=), but one cent above (cmi 500001 -> annualized 6000012) crosses into the disposable
          screen; with low disposable it still resolves PRESUMPTION_OK, proving the boundary is the <= cut.
        test_recipe:
          setup:
            - "A CHAPTER_13 case; means inputs put annualized CMI exactly one cent-times-twelve above median with disposable below the abuse floor."
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Bound6a Debtor", email: "bound6a@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 500001, monthly_expenses_cents: 480000, median_annual_income_cents: 6000000 }
