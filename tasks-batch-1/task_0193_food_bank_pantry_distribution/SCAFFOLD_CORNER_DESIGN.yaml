# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Food Bank & Pantry Distribution — breadth probe over §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_cold_storage_unit_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.ColdStorageUnit
          - endpoints.POST_/cold-storage-units
        distinguishing_aspect: "POST /cold-storage-units with name/temp_zone/capacity_lbs returns 201; stored_lbs defaults to 0 and status to AVAILABLE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /cold-storage-units"
              payload: { name: "Freezer A", temp_zone: "FROZEN", capacity_lbs: 1000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id, stored: $.data.stored_lbs, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "ColdStorageUnit.stored_lbs == 0.00 and ColdStorageUnit.status == AVAILABLE"
            - "response data.id is a non-empty server-minted UUID"

      - name: get_inventory_lot_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.InventoryLot
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /inventory-lots/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /inventory-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FoodBankOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and response error_id == ERR_NOT_FOUND"

      - name: create_inventory_lot_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.InventoryLot.fields.intake_lbs
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /inventory-lots omitting intake_lbs returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "A REFRIGERATED unit exists."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and response error_id == ERR_INVALID_REQUEST"

      - name: create_inventory_lot_invalid_enum_food_category_rejected
        claim_type: Type Constraints
        grounds:
          - entities.InventoryLot.fields.food_category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /inventory-lots with food_category outside {PRODUCE,DAIRY,FROZEN_MEAT,DRY_GOODS,BAKERY} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A DRY unit exists."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "DryShelf", temp_zone: "DRY", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "CANDY", source_type: "DONATION", intake_lbs: 10, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and response error_id == ERR_INVALID_REQUEST"

      - name: agency_fair_share_weight_default_applied
        claim_type: Defaults
        grounds:
          - entities.Agency.fields.fair_share_weight
          - endpoints.POST_/agencies
        distinguishing_aspect: "POST /agencies omitting fair_share_weight defaults it to 1 and status to ACTIVE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Pantry Default", service_area: "County-X" }
              as: AllocationManager
              captures: { agency_id: $.data.id, w: $.data.fair_share_weight, st: $.data.status }
          assert:
            - "Agency.fair_share_weight == 1 and Agency.status == ACTIVE"

      - name: inventory_lot_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.InventoryLot.fields.remaining_lbs
          - entities.InventoryLot.fields.disposition
        distinguishing_aspect: "POST /inventory-lots: server sets remaining_lbs = intake_lbs and disposition AVAILABLE; computed fields are not client-supplied."
        test_recipe:
          setup:
            - "A REFRIGERATED unit exists."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "DAIRY", source_type: "PURCHASED", intake_lbs: 250, expiration_date: "2026-07-01T00:00:00.000Z", unit_cost_cents: 90 }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, rem: $.data.remaining_lbs, disp: $.data.disposition }
          assert:
            - "InventoryLot.remaining_lbs == 250.00 and InventoryLot.disposition == AVAILABLE"
            - "InventoryLot.version == 1 and InventoryLot.required_temp_zone == REFRIGERATED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispose_already_disposed_lot_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_DISPOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Disposing a lot already in DISPOSED (terminal) is rejected with ERR_INVALID_STATE; no further version bump."
        test_recipe:
          setup:
            - "A lot intaken AVAILABLE then disposed (now DISPOSED, version 2)."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /inventory-lots/${lot_id}/dispose"
              payload: { expected_lot_version: "${lot_v}" }
              as: FoodBankOperator
              captures: { lot_v2: $.data.version }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/dispose"
              payload: { expected_lot_version: "${lot_v2}" }
              as: FoodBankOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and response error_id == ERR_INVALID_STATE"

      - name: reject_already_approved_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AgencyOrder.SUBMITTED_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /agency-orders/{id}/reject on an APPROVED order is rejected (reject is only defined from SUBMITTED)."
        test_recipe:
          setup:
            - "An approved order reserved against a PRODUCE lot."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 300, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry M", service_area: "County-13", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W36", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 100 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
          trigger:
            - call: "POST /agency-orders/${order_id}/reject"
              payload: {}
              as: AllocationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and response error_id == ERR_INVALID_STATE"

      - name: certify_household_branches_denied_on_ineligible_income
        claim_type: Valid Transition
        grounds:
          - state_machines.ClientHousehold.PENDING_to_DENIED
          - entities.ClientHousehold.fields.tefap_eligible
        distinguishing_aspect: "POST /client-households/{id}/certify on a household whose income exceeds the size threshold transitions PENDING -> DENIED, not CERTIFIED."
        test_recipe:
          setup:
            - "A household size 1 with monthly_income_cents 199801 (one cent over the size-1 threshold 199800) -> tefap_eligible false."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Pantry N", service_area: "County-14", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 199801 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id, elig: $.data.tefap_eligible }
          trigger:
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
              captures: { st: $.data.certification_status }
          assert:
            - "ClientHousehold.tefap_eligible == false"
            - "ClientHousehold.certification_status == DENIED"

      - name: certification_expires_after_365_days_on_clock_advance
        claim_type: Valid Transition
        grounds:
          - state_machines.ClientHousehold.CERTIFIED_to_EXPIRED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "A CERTIFIED household's certification ages to EXPIRED once the clock passes certified_at + 365 days."
        test_recipe:
          setup:
            - "Clock at 2026-06-01; an eligible household certified at that time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: AllocationManager
            - call: "POST /agencies"
              payload: { name: "Pantry O", service_area: "County-15", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00.000Z" }
              as: AllocationManager
          assert:
            - "ClientHousehold.${hh_id}.certification_status == EXPIRED"

      - name: terminal_fulfilled_order_cannot_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AgencyOrder.APPROVED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A FULFILLED order (terminal) rejects cancel with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "An order fulfilled via a finalized distribution event."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 300, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry P", service_area: "County-16", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W37", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 100 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
            - call: "POST /distribution-events/${ev_id}/finalize"
              payload: { actual_distributed_lbs: 100 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /agency-orders/${order_id}/cancel"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and response error_id == ERR_INVALID_STATE"

      - name: cycle_close_blocked_while_order_unresolved
        claim_type: guarded transitions
        grounds:
          - state_machines.AllocationCycle.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing a cycle that still has a SUBMITTED order is rejected with ERR_INVALID_STATE (cross-entity guard on child order states)."
        test_recipe:
          setup:
            - "An OPEN cycle with one SUBMITTED order still unresolved."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Pantry Q", service_area: "County-17", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W38", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 100 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /allocation-cycles/${cycle_id}/close"
              payload: {}
              as: AllocationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and response error_id == ERR_INVALID_STATE"
            - "AllocationCycle.${cycle_id}.status == OPEN (unchanged)"

      - name: recall_blocked_when_event_finalized
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AgencyOrder.APPROVED_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Recall is blocked once the order is FULFILLED via a finalized event — recall is only defined from APPROVED, so the call hits ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "An order fulfilled via a finalized event (now FULFILLED)."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 300, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry R", service_area: "County-18", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W39", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 100 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
            - call: "POST /distribution-events/${ev_id}/finalize"
              payload: { actual_distributed_lbs: 100 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /agency-orders/${order_id}/recall"
              payload: {}
              as: AllocationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and response error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: cold_storage_occupancy_excludes_depleted_lots
        claim_type: Input Set Filtering
        grounds:
          - calculations.cold_storage_occupancy
          - entities.ColdStorageUnit.fields.stored_lbs
        distinguishing_aspect: "After a lot is fully reserved and the order finalized (lot DEPLETED), the lot's poundage leaves stored_lbs — occupancy counts only {AVAILABLE,RESERVED}."
        test_recipe:
          setup:
            - "A 100-lb PRODUCE lot fully reserved and distributed (now DEPLETED) in a 5000-lb cooler."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry S", service_area: "County-19", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W40", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 100 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
            - call: "POST /distribution-events/${ev_id}/finalize"
              payload: { actual_distributed_lbs: 100 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          trigger:
            - call: "GET /cold-storage-units/${unit_id}"
              payload: {}
              as: FoodBankOperator
              captures: { stored: $.data.stored_lbs }
          assert:
            - "ColdStorageUnit.${unit_id}.stored_lbs == 0.00 (DEPLETED lot excluded)"
            - "InventoryLot.${lot_id}.disposition == DEPLETED"

      - name: tefap_split_partial_distribution_waterfall_correct
        claim_type: Correct Result
        grounds:
          - calculations.event_tefap_split
          - entities.DistributionEvent.fields.tefap_lbs
        distinguishing_aspect: "Finalizing at actual 120 (planned 150) over a DONATION line (100, exp earlier) then a TEFAP line (50, exp later) attributes 100 to DONATION and 20 to TEFAP -> tefap_lbs 20.00."
        test_recipe:
          setup:
            - "Order with DONATION PRODUCE line 100 lbs (exp 2026-07-01) and TEFAP DRY_GOODS line 50 lbs (exp 2026-08-01); packed (planned 150)."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { cooler_id: $.data.id }
            - call: "POST /cold-storage-units"
              payload: { name: "DryShelf", temp_zone: "DRY", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { dry_id: $.data.id }
            - call: "POST /inventory-lots"
