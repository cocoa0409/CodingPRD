          - validations[priority=7]
        excluded_because:
          difficulty_instance: priority_pair_designation_phase_state_beats_party_exclusion
          rationale: "The state-vs-constraint precedence is asserted in the named §1.8 instance."

      - name: recorder_safety_shadows_docket_completeness
        claim_type: Priority Ordering
        grounds:
