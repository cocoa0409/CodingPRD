              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 40000, cash_copay_cents: 0, min_tier_required: "GOLD", award_allotment_per_night: 3 }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/blackout-windows"
              payload: { start_date: "2026-09-10", end_date: "2026-09-20", scope: "ALL_REDEMPTIONS" }
              as: ProgramAdministrator
              captures: { w_id: $.data.id, w_days: $.data.day_count }
            - call: "POST /loyalty/blackout-windows/${w_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "pri2@example.com", full_name: "Rune Dahl", enrollment_date: "2026-05-06" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_v: $.data.version, tier0: $.data.elite_tier }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 100000, adjustment_reason: "Service recovery from a prior season", expected_member_version: "${m_v}" }
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
          trigger:
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-12", checkout_date: "2026-09-14", expected_hotel_version: "${h_v}" }
              as: ProgramAdministrator
              captures: { err_masked: $.data.error_id }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-25", checkout_date: "2026-09-27", expected_hotel_version: "${h_v}" }
              as: ProgramAdministrator
              captures: { err_unmasked: $.data.error_id }
          assert:
            - "the captured ${tier0} was BASE and the captured ${w_days} was 11, so both violations are live on the first call"
            - "first call: response code 422 and ${err_masked} == ERR_BLACKOUT_DATE_UNAVAILABLE"
            - "first call: ${err_masked} != ERR_TIER_BELOW_INVENTORY_MINIMUM even though the response code would have been 422 either way"
            - "second call: response code 422 and ${err_unmasked} == ERR_TIER_BELOW_INVENTORY_MINIMUM - the dates are clear of 2026-09-10..2026-09-20 but the member is still below GOLD"
            - "the second call is not rejected for points: 80000 required against a 100000 balance, and priority 71 outranks priority 80 in any case"
            - "Member.${m_id}.point_balance is still 100000 and no Redemption row exists for that member"
            - "Hotel.${h_id}.version is still ${h_v} - both rejected calls left the property row untouched"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fiftieth_qualifying_night_flips_platinum_while_the_same_post_floors_1234_and_pays_a_gold_bonus
        grounds:
          - calculations.elite_tier_recompute
          - calculations.stay_base_points
          - calculations.stay_elite_bonus_points
          - calculations.program_fee_assessment
          - calculations.benefit_entitlement_matrix
          - endpoints.POST_loyalty_stays_stayId_post
        distinguishing_aspect: |
          Metric: the integer qualifying_nights_ytd threshold, tested at exactly 50 (the >= boundary)
          having been observed at 49 one call earlier, on POST /loyalty/stays/{stayId}/post. The same
          response carries two further precision boundaries: floor(12345 * 10 / 100) == 1234 rather
          than 1235, and the GOLD multiplier is the one applied because tier_at_checkin was snapshotted
          before this post moved the member to PLATINUM.
        test_recipe:
          setup:
            - "One ACTIVE property with program_fee_pct 0.04 and a qualifying, elite-counting TRANSIENT rate plan."
            - "Stay A: 49 nights, 2026-05-01 to 2026-06-19, room_revenue_cents 490000, already posted - the member reads exactly 49 qualifying nights and GOLD."
            - "Stay B: created after Stay A posted, so tier_at_checkin is GOLD: 1 night, 2026-07-01 to 2026-07-02, room_revenue_cents 12345, still PENDING_POSTING."
            - "The logical clock stays at its 2026-08-01 default, so both checkouts are in the past and both checkin years match the clock year."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Northgate Terrace", brand_code: "NGT", market_tier: "SELECT", program_fee_pct: 0.04, rooms_count: 110, trailing_12m_occupancy_pct: 0.68, trailing_12m_adr_cents: 17000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR-NGT", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "bnd1@example.com", full_name: "Sofia Marchetti", enrollment_date: "2026-01-02" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-05-01", checkout_date: "2026-06-19", room_revenue_cents: 490000 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id, sa_nights: $.data.nights }
            - call: "POST /loyalty/stays/${sa_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { nights_49: $.data.qualifying_nights_ytd, tier_49: $.data.elite_tier }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-02", room_revenue_cents: 12345 }
              as: ProgramAdministrator
              captures: { sb_id: $.data.id, sb_tier_snapshot: $.data.tier_at_checkin }
          trigger:
            - call: "POST /loyalty/stays/${sb_id}/post"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "the captured ${sa_nights} was 49, ${nights_49} was 49 and ${tier_49} was GOLD - one night below the PLATINUM boundary"
            - "response code 200 and Member.${m_id}.qualifying_nights_ytd == 50 with elite_tier == PLATINUM: the >= comparison fires at exactly 50"
            - "Stay.${sb_id}.base_points_awarded == 1234 == floor(12345 * 10 / 100), not 1235 and not 1234.5"
            - "the captured ${sb_tier_snapshot} was GOLD, so Stay.${sb_id}.bonus_multiplier_applied == 0.50 and bonus_points_awarded == 617 == floor(1234 * 0.50) - the PLATINUM 0.75 multiplier that the same response establishes is NOT used"
            - "Stay.${sb_id}.program_fee_assessed_cents == 494 == round_half_up(12345 * 0.04) == round_half_up(493.8), and Hotel.${h_id}.fee_ledger_balance_cents == 20094 (19600 + 494)"
            - "exactly two EliteBenefitDelivery rows are synthesized for Stay ${sb_id} - UPGRADE and BREAKFAST, the GOLD entitlement - and no LATE_CHECKOUT row, because the matrix reads tier_at_checkin and not the new PLATINUM tier"
            - "Member.${m_id}.point_balance == 50851 (49000 + 1234 + 617) and lifetime_points_earned == 50851"
            - "Hotel.${h_id}.status is still ACTIVE (20094 is below the 250000 threshold)"

      - name: checkout_on_the_first_of_the_next_month_leaves_the_september_batch_empty
        grounds:
          - calculations.batch_item_selection
          - validations.priority_76_ERR_BATCH_NO_ELIGIBLE_ITEMS
          - calculations.owner_reimbursement
          - endpoints.POST_loyalty_reimbursement_batches_batchId_release
          - entities.ReimbursementBatch.fields.period_month
        distinguishing_aspect: |
          A different metric on a different endpoint: the INCLUSIVE calendar-month window of
          batch_item_selection, probed at its upper endpoint. The award stay's only night is
          2026-09-29 and 2026-09-30, yet its checkout_date of 2026-10-01 assigns it to the October
          period, so releasing the September batch is rejected and the October batch collects it.
          The same setup also sits exactly on the 0.95 compression-occupancy boundary, which pays the
          full ADR rather than 0.75 of it.
        test_recipe:
          setup:
            - "One ACTIVE property with trailing_12m_occupancy_pct exactly 0.95 and trailing_12m_adr_cents 30000, no paid stays (fee ledger 0)."
            - "A STANDARD award window over all of 2026 at 40000 points per night, allotment 5, min_tier BASE."
            - "A member funded by a settled 100000-point DIRECT_PURCHASE."
            - "One 2-night award stay 2026-09-29 to 2026-10-01, completed with the clock at 2026-10-02 so it sits in ACCRUED."
