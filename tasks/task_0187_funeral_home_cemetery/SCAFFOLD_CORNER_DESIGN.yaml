  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: plot_reserve_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plot-reserve-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reserve carrying a stale expected_plot_version (the v0 observed before a successful reserve advanced the version) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A plot at version v0 (AVAILABLE); two cases. One reserve advances the version; a second reserve still carries v0."]
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /plots"
              payload: { funeral_home_id: "${home_id}", section: "A", plot_code: "A-30", current_price_cents: 80000 }
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { plot_id: $.data.id, plot_v0: $.data.version }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Case One", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case1_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Case Two", case_mode: "AT_NEED", date_of_death: "2026-06-02T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case2_id: $.data.id }
            - call: "POST /plots/${plot_id}/reserve"
              payload: { case_id: "${case1_id}", expected_plot_version: "${plot_v0}" }
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { plot_v1: $.data.version }
            - call: "POST /plots/${plot_id}/release"
              payload: {}
              as: CemeteryClerk
              as_user_id: "cc-1"
          trigger:
            - call: "POST /plots/${plot_id}/reserve"
              payload: { case_id: "${case2_id}", expected_plot_version: "${plot_v0}" }
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { err: $.data.error_id }
          assert:
            - "second reserve response error_id == ERR_STALE_VERSION (carries stale ${plot_v0}; current version advanced by the earlier reserve and release)"
            - "response code == 412"

