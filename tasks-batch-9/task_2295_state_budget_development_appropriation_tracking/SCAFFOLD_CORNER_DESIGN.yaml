          trigger:
            - call: "POST /fiscal/budget-transfers"
              payload: { source_appropriation_id: "${src_id}", target_appropriation_id: "${tgt_id}", amount_cents: 50000000, transfer_type: "INTRA_AGENCY", justification: "stale token", expected_source_appropriation_version: "${src_v_stale}" }
              as: BudgetAnalyst
            - call: "POST /fiscal/budget-transfers"
              payload: { source_appropriation_id: "${src_id}", target_appropriation_id: "${src_id}", amount_cents: 50000000, transfer_type: "INTRA_AGENCY", justification: "stale token and self transfer", expected_source_appropriation_version: "${src_v_stale}" }
              as: BudgetAnalyst
            - call: "GET /fiscal/appropriations/${src_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { src_v_fresh: $.data.version }
            - call: "POST /fiscal/budget-transfers"
              payload: { source_appropriation_id: "${src_id}", target_appropriation_id: "${tgt_id}", amount_cents: 50000000, transfer_type: "INTRA_AGENCY", justification: "fresh token", expected_source_appropriation_version: "${src_v_fresh}" }
              as: BudgetAnalyst
              captures: { xfer_id: $.data.id }
            - call: "GET /fiscal/appropriations/${src_id}/budget-transfers"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "the first stale proposal returns HTTP 412 with error_id == ERR_STALE_VERSION"
            - "the second stale proposal also returns ERR_STALE_VERSION and not ERR_TRANSFER_SAME_APPROPRIATION, proving priority 9 outranks priority 30"
            - "${src_v_fresh} is greater than ${src_v_stale}"
            - "the fresh proposal returns HTTP 201 with BudgetTransfer.${xfer_id}.status == PROPOSED"
            - "the list returns total_count == 1, so neither rejected proposal persisted a row"

      - name: corner_cascading_side_effects_reach_a_second_entity
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Allotment.APPROVED_to_RELEASED
          - entities.Appropriation.fields.release_hold
        excluded_because:
          difficulty_instance: transitive_cascade / allotment_release_cascades_to_release_hold_on_a_sibling_appropriation
          rationale: "That §1.8 instance follows the release through the cycle's cash posture onto a sibling appropriation's release_hold and back, which is the cascading-side-effects claim."

      - name: corner_dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.appropriation_available_balance
          - calculations.appropriation_available_balance.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / available_balance_cash_basis_vs_authority_basis_diverge
          rationale: "That §1.8 instance asserts both variants on the same row and their divergence, covering the layer directly."

      - name: corner_derived_field_reconciliation_after_a_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - invariants.expenditure_ledger_conservation
          - entities.FederalGrant.fields.moe_compliance_status
        excluded_because:
          difficulty_instance: compensating_invariant / void_restores_expenditure_ledger_and_flips_the_moe_verdict_back
          rationale: "That §1.8 instance voids a charge and asserts the expenditure ledger and the dependent MOE verdict both reconcile to their pre-charge values."

  # ===========================================================================
  # Section 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Allotment.APPROVED_to_RELEASED
          - invariants.released_authority_conservation
          - entities.BudgetCycle.fields.total_released_cents
        distinguishing_aspect: |
          Immediate consistency claim spanning three entities in one write: the release
          response itself already carries the new allotment figures, and reads issued
          immediately afterwards — with no intervening call, no polling and no background
          job — show the appropriation and the cycle rollups already updated. Nothing in this
          domain is eventually consistent.
        setup_note: "Eleven-call chain to phase EXECUTION with an approved quarter-1 allotment awaiting release."
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 in phase EXECUTION with ADOPTED GENERAL revenue of 10000000000 cents; logical clock at the default 2026-08-01 (quarter 1)"
            - "GENERAL Appropriation P100 enacted 2000000000 with released_cents 0 and cash_status UNRELEASED"
            - "APPROVED quarter-1 Allotment with computed_release_cents 440000000, prepared by analyst-1 and approved by dir-1"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 440000000 }
              as: BudgetAnalyst
              captures: { alt_id: $.data.id }
            - call: "POST /fiscal/allotments/${alt_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${alt_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /fiscal/allotments/${alt_id}/release"
              payload: {}
              as: StateController
            - call: "GET /fiscal/appropriations/${appr_id}"
              payload: {}
              as: StateController
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: StateController
            - call: "GET /fiscal/appropriations/${appr_id}/balance-summary"
              payload: {}
              as: StateController
          assert:
            - "the release response itself already reports Allotment.${alt_id}.status == RELEASED with released_cents == 440000000"
            - "the immediately following appropriation read reports released_cents == 440000000, cash_status == PARTIALLY_RELEASED and available_cash_cents == 440000000"
            - "the immediately following cycle read reports total_released_cents == 440000000, cash_utilization_pct == 0.22 and cash_posture == NORMAL"
            - "the balance-summary read agrees with the appropriation row on released_cents and available_cash_cents"
            - "all three ledger levels satisfy released_authority_conservation with no retry or delay"
