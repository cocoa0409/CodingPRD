scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_preliminary_vs_comprehensive_diverge
        grounds:
          - calculations.risk_score
          - entities.Client.fields.preliminary_risk_score
          - entities.Client.fields.comprehensive_risk_score
          - entities.Client.fields.risk_level
        distinguishing_aspect: "Dual variant lives on the CLIENT risk domain: PRELIMINARY (reporter factors, no risk_level set) vs COMPREHENSIVE (verified factors, sets risk_level) — a different entity domain from the Case financial-exposure dual variant."
        test_recipe:
          setup:
            - "One Client, freshly created (version 1)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1948-02-11", address: "12 Elm St" }
              as: IntakeWorker
              captures: { cli: "$.data.id", v1: "$.data.version" }
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "PRELIMINARY", isolation_level: 2, cognitive_impairment_level: 2, financial_vulnerability_level: 1, caregiver_dependency_level: 0, prior_report_count: 1, expected_client_version: "${v1}" }
              as: Caseworker
              captures: { v2: "$.data.version", prelim: "$.data.preliminary_risk_score" }
          trigger:
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 3, cognitive_impairment_level: 3, financial_vulnerability_level: 2, caregiver_dependency_level: 2, prior_report_count: 1, expected_client_version: "${v2}" }
              as: Caseworker
              captures: { comp: "$.data.comprehensive_risk_score", lvl: "$.data.risk_level" }
          assert:
            - "Client.${cli}.preliminary_risk_score == 57"
            - "Client.${cli}.comprehensive_risk_score == 100"
            - "Client.${cli}.risk_level == HIGH"
            - "Client.${cli}.preliminary_risk_score != Client.${cli}.comprehensive_risk_score"

      - name: exposure_estimated_vs_substantiated_diverge
        grounds:
          - calculations.financial_exposure
          - entities.Case.fields.estimated_exposure_cents
          - entities.Case.fields.substantiated_exposure_cents
          - state_machines.FinancialAccount.ACTIVE_to_FROZEN
        distinguishing_aspect: "Dual variant lives on the CASE money domain: ESTIMATED sums whole account balances, SUBSTANTIATED sums freeze.flagged_amount_cents — a different entity domain from the Client risk dual variant."
        test_recipe:
          setup:
            - "Client with two accounts (balances 3,000,000 and 2,500,000 cents); a screened-in Case UNDER_INVESTIGATION alleging FINANCIAL_EXPLOITATION; one account already frozen (flagged 1,200,000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1948-02-11", address: "12 Elm St" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "First Bank", total_balance_cents: 3000000 }
              as: IntakeWorker
              captures: { acc1: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Second CU", total_balance_cents: 2500000 }
              as: IntakeWorker
              captures: { acc2: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", reporter_name: "Dr. Lee", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "suspected exploitation" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc1}", flagged_amount_cents: 1200000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz1: "$.data.id" }
          trigger:
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc2}", flagged_amount_cents: 800000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz2: "$.data.id" }
          assert:
            - "Case.${cas}.estimated_exposure_cents == 5500000"
            - "Case.${cas}.substantiated_exposure_cents == 2000000"
            - "Case.${cas}.estimated_exposure_cents != Case.${cas}.substantiated_exposure_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_nonlinear_cap_and_tier
        grounds:
          - calculations.risk_score
          - entities.Client.fields.comprehensive_risk_score
          - entities.Client.fields.risk_level
        distinguishing_aspect: "Mode (a): >=3 weighted inputs with non-linear interaction — min(prior_report_count,5) cap AND min(raw,100) score cap AND tiered risk_level selection; distinct mode from the fund_recovery rounding instance."
        test_recipe:
          setup:
            - "One freshly created Client (version 1)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Boris Kent", date_of_birth: "1940-05-03", address: "9 Oak Ave" }
              as: IntakeWorker
              captures: { cli: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 3, cognitive_impairment_level: 3, financial_vulnerability_level: 3, caregiver_dependency_level: 3, prior_report_count: 8, expected_client_version: "${v1}" }
              as: Caseworker
              captures: { comp: "$.data.comprehensive_risk_score", lvl: "$.data.risk_level" }
          assert:
            - "Client.${cli}.comprehensive_risk_score == 100"
            - "Client.${cli}.risk_level == HIGH"

      - name: fund_recovery_rounding_order_remainder
        grounds:
          - calculations.fund_recovery_distribution
          - entities.FinancialAccount.fields.restitution_cents
          - entities.FinancialAccount.fields.created_at
        distinguishing_aspect: "Mode (b): per-account round_half_up THEN sum, with the 1-cent remainder allocated to the largest-flagged account, tie broken by earliest created_at (never id); distinct mode from the risk_score nonlinear instance."
        test_recipe:
          setup:
            - "Case UNDER_INVESTIGATION with three accounts each balance 1,000,000, each frozen with flagged_amount 1,000,000; accounts created in order acc1, acc2, acc3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Cora Diaz", date_of_birth: "1945-09-19", address: "3 Pine Rd" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Bank A", total_balance_cents: 1000000 }
              as: IntakeWorker
              captures: { acc1: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Bank B", total_balance_cents: 1000000 }
              as: IntakeWorker
              captures: { acc2: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Bank C", total_balance_cents: 1000000 }
              as: IntakeWorker
              captures: { acc3: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "funds moved" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc1}", flagged_amount_cents: 1000000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz1: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc2}", flagged_amount_cents: 1000000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz2: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc3}", flagged_amount_cents: 1000000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz3: "$.data.id" }
          trigger:
            - call: "POST /cases/${cas}/recover-funds"
              payload: { recovered_amount_cents: 100000 }
              as: Supervisor
          assert:
            - "FinancialAccount.${acc1}.restitution_cents == 33334"
            - "FinancialAccount.${acc2}.restitution_cents == 33333"
            - "FinancialAccount.${acc3}.restitution_cents == 33333"

  - rule_id: non_linear_state_machine
    instances:
      - name: investigation_revision_cycle
        grounds:
          - state_machines.Investigation.FINDINGS_SUBMITTED_to_IN_PROGRESS
          - entities.Investigation.fields.return_count
          - entities.Investigation.fields.status
        distinguishing_aspect: "Investigation is genuinely cyclic: FINDINGS_SUBMITTED -> IN_PROGRESS via return, re-enterable, incrementing return_count; a different entity from the branching Report machine."
        test_recipe:
          setup:
            - "Investigation in FINDINGS_SUBMITTED for a screened-in case whose client has a COMPREHENSIVE risk score."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dora Finch", date_of_birth: "1943-01-07", address: "5 Birch Ln" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "VOLUNTARY", allegation_types: ["NEGLECT"], priority: "ROUTINE", narrative: "concern" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "GET /clients/${cli}"
              payload: {}
              as: Caseworker
              captures: { vN: "$.data.version" }
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 3, cognitive_impairment_level: 3, financial_vulnerability_level: 2, caregiver_dependency_level: 2, prior_report_count: 1, expected_client_version: "${vN}" }
              as: Caseworker
            - call: "POST /investigations/${inv}/submit-findings"
              payload: { finding_summary: "draft findings" }
              as: Caseworker
          trigger:
            - call: "POST /investigations/${inv}/return"
              payload: { return_reason: "obtain bank records" }
              as: Supervisor
          assert:
            - "Investigation.${inv}.status == IN_PROGRESS"
            - "Investigation.${inv}.return_count == 1"

      - name: report_screen_out_branch_no_case
        grounds:
          - state_machines.Report.RECEIVED_to_SCREENED_OUT
          - state_machines.Report.RECEIVED_to_SCREENED_IN
          - entities.Report.fields.case_id
        distinguishing_aspect: "Report is a fork RECEIVED -> {SCREENED_IN, SCREENED_OUT}; the SCREEN_OUT branch creates NO Case and mutates no Client (divergent side-effect set from SCREEN_IN); a different entity from the cyclic Investigation machine."
        test_recipe:
          setup:
            - "One Client and one RECEIVED Report about it."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ed Grant", date_of_birth: "1950-11-30", address: "7 Cedar Ct" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "ANONYMOUS", allegation_types: ["SELF_NEGLECT"], priority: "ROUTINE", narrative: "welfare check" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
          trigger:
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_OUT", screen_out_reason: "does not meet APS criteria" }
              as: Supervisor
          assert:
            - "Report.${rep}.status == SCREENED_OUT"
            - "Report.${rep}.case_id == null"
            - "Report.${rep}.screen_out_reason == 'does not meet APS criteria'"
            - "no Case exists whose report_id == ${rep} (GET /cases?report_id=${rep} returns total_count 0)"

  - rule_id: transitive_cascade
    instances:
      - name: close_cascade_placement_bed_release
        grounds:
          - state_machines.Case.READY_FOR_CLOSURE_to_CLOSED
          - state_machines.EmergencyPlacement.ACTIVE_to_DISCHARGED
          - entities.Facility.fields.available_beds
        distinguishing_aspect: "Depth-3 cascade Case.close -> Placement.discharge (link B) -> Facility.available_beds increment (link C); each link caused by the previous, not by the close directly; trigger is case close."
        test_recipe:
          setup:
            - "Case READY_FOR_CLOSURE (investigation disposed) with one ACTIVE court-authorized placement at a 2-bed facility (available_beds 1); client capacity IMPAIRED; no freezes so estimated_exposure 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /facilities"
              payload: { name: "Safe Harbor", total_beds: 2 }
              as: Admin
              captures: { fac: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Faye Holt", date_of_birth: "1939-06-14", address: "2 Maple Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "unsafe home" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /clients/${cli}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
            - call: "POST /placements"
              payload: { case_id: "${cas}", facility_id: "${fac}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-05T00:00:00Z", court_authorized: true }
              as: Caseworker
              captures: { plc: "$.data.id" }
            - call: "GET /clients/${cli}"
              payload: {}
              as: Caseworker
              captures: { vN: "$.data.version" }
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 2, cognitive_impairment_level: 2, financial_vulnerability_level: 1, caregiver_dependency_level: 1, prior_report_count: 0, expected_client_version: "${vN}" }
              as: Caseworker
            - call: "POST /investigations/${inv}/submit-findings"
              payload: { finding_summary: "abuse indicators" }
              as: Caseworker
            - call: "POST /investigations/${inv}/dispose"
              payload: { disposition: "UNSUBSTANTIATED" }
              as: Supervisor
          trigger:
            - call: "POST /cases/${cas}/close"
              payload: { closure_reason: "client relocated safely" }
              as: Supervisor
          assert:
            - "Case.${cas}.status == CLOSED"
            - "EmergencyPlacement.${plc}.status == DISCHARGED"
            - "Facility.${fac}.available_beds == 2"

      - name: dispose_cascade_case_client_status
        grounds:
          - state_machines.Investigation.FINDINGS_SUBMITTED_to_DISPOSED
          - state_machines.Case.UNDER_INVESTIGATION_to_READY_FOR_CLOSURE
          - state_machines.Client.UNDER_INVESTIGATION_to_SERVICES_PENDING
        distinguishing_aspect: "Depth-3 cascade Investigation.dispose -> Case.READY_FOR_CLOSURE (link B) -> Client.SERVICES_PENDING (link C); different trigger (dispose) from the close cascade."
        test_recipe:
          setup:
            - "Investigation FINDINGS_SUBMITTED on a screened-in case; client UNDER_INVESTIGATION with a COMPREHENSIVE risk score."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Gina Ray", date_of_birth: "1946-03-22", address: "4 Fir St" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "poor conditions" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "GET /clients/${cli}"
              payload: {}
              as: Caseworker
              captures: { vN: "$.data.version" }
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 3, cognitive_impairment_level: 2, financial_vulnerability_level: 1, caregiver_dependency_level: 1, prior_report_count: 2, expected_client_version: "${vN}" }
              as: Caseworker
            - call: "POST /investigations/${inv}/submit-findings"
              payload: { finding_summary: "neglect substantiated" }
              as: Caseworker
          trigger:
            - call: "POST /investigations/${inv}/dispose"
              payload: { disposition: "SUBSTANTIATED" }
              as: Supervisor
          assert:
            - "Investigation.${inv}.status == DISPOSED"
            - "Case.${cas}.status == READY_FOR_CLOSURE"
            - "Client.${cli}.status == SERVICES_PENDING"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: placement_safety_beats_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_CLIENT_NOT_ELIGIBLE_FOR_PLACEMENT]
        distinguishing_aspect: "business_safety (client ineligible, priority 10) is returned over business_temporal (no bed, priority 15) — the safety-vs-temporal error-category pair."
        test_recipe:
          setup:
            - "1-bed facility fully occupied by an ACTIVE placement for an eligible client A; a second screened-in client B whose capacity is UNKNOWN and risk_level null (ineligible)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /facilities"
              payload: { name: "One Bed House", total_beds: 1 }
              as: Admin
              captures: { fac: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Client A", date_of_birth: "1941-04-04", address: "1 A St" }
              as: IntakeWorker
              captures: { cliA: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cliA}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "A unsafe" }
              as: IntakeWorker
              captures: { repA: "$.data.id" }
            - call: "POST /reports/${repA}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { casA: "$.data.case_id" }
            - call: "POST /clients/${cliA}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
            - call: "POST /placements"
              payload: { case_id: "${casA}", facility_id: "${fac}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-20T00:00:00Z", court_authorized: true }
              as: Caseworker
              captures: { plcA: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Client B", date_of_birth: "1938-08-08", address: "2 B St" }
              as: IntakeWorker
              captures: { cliB: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cliB}", reporter_type: "VOLUNTARY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "B concern" }
              as: IntakeWorker
              captures: { repB: "$.data.id" }
            - call: "POST /reports/${repB}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { casB: "$.data.case_id" }
          trigger:
            - call: "POST /placements"
              payload: { case_id: "${casB}", facility_id: "${fac}", start_at: "2026-06-02T00:00:00Z", end_at: "2026-06-05T00:00:00Z" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 422 with data.error_id == 'ERR_CLIENT_NOT_ELIGIBLE_FOR_PLACEMENT'"
            - "data.error_id != 'ERR_NO_BED_AVAILABLE'"

      - name: close_state_beats_cross_report_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_CASE_INVALID_STATE]
        distinguishing_aspect: "state (case not READY_FOR_CLOSURE, priority 7) is returned over business_constraint (mandatory cross-report missing, priority 17) — the state-vs-constraint pair, different from the safety-vs-temporal pair."
        test_recipe:
          setup:
            - "Case UNDER_INVESTIGATION (not ready) with one frozen account (balance 5,000,000) so estimated_exposure 5,000,000 and no cross-report filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Hank Ives", date_of_birth: "1942-02-02", address: "6 Ash Blvd" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Big Bank", total_balance_cents: 5000000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "drained account" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 5000000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz: "$.data.id" }
          trigger:
            - call: "POST /cases/${cas}/close"
              payload: { closure_reason: "premature" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_CASE_INVALID_STATE'"
            - "data.error_id != 'ERR_CROSS_REPORT_REQUIRED'"

  - rule_id: boundary_precision_check
    instances:
      - name: risk_score_high_threshold_exactly_70
        grounds:
          - calculations.risk_score
          - entities.Client.fields.risk_level
        distinguishing_aspect: "Boundary at exactly 70 -> HIGH (inclusive >=70), on the risk_score metric via POST /clients/{id}/risk-assessments; a different metric and endpoint from the exposure boundary."
        test_recipe:
          setup:
            - "One freshly created Client (version 1)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ivy Nash", date_of_birth: "1944-07-07", address: "8 Elm Ct" }
              as: IntakeWorker
              captures: { cli: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 3, cognitive_impairment_level: 2, financial_vulnerability_level: 0, caregiver_dependency_level: 2, prior_report_count: 0, expected_client_version: "${v1}" }
              as: Caseworker
              captures: { comp: "$.data.comprehensive_risk_score", lvl: "$.data.risk_level" }
          assert:
            - "Client.${cli}.comprehensive_risk_score == 70"
            - "Client.${cli}.risk_level == HIGH"

      - name: exposure_cross_report_threshold_exactly_50000
        grounds:
          - calculations.financial_exposure
          - validations[priority=17]
          - errors[ERR_CROSS_REPORT_REQUIRED]
        distinguishing_aspect: "Boundary at exactly 5,000,000 cents estimated exposure -> mandatory cross-report (inclusive >=), on the estimated_exposure metric via POST /cases/{id}/close; a different metric and endpoint from the risk-score boundary."
        test_recipe:
          setup:
            - "Case READY_FOR_CLOSURE (investigation disposed) with one frozen account (balance 5,000,000) so estimated_exposure exactly 5,000,000; no cross-report filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Jack Owen", date_of_birth: "1937-12-12", address: "10 Vine St" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Metro Bank", total_balance_cents: 5000000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "large loss" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 3000000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz: "$.data.id" }
            - call: "GET /clients/${cli}"
              payload: {}
              as: Caseworker
              captures: { vN: "$.data.version" }
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 2, cognitive_impairment_level: 1, financial_vulnerability_level: 3, caregiver_dependency_level: 0, prior_report_count: 1, expected_client_version: "${vN}" }
              as: Caseworker
            - call: "POST /investigations/${inv}/submit-findings"
              payload: { finding_summary: "financial exploitation" }
              as: Caseworker
            - call: "POST /investigations/${inv}/dispose"
              payload: { disposition: "SUBSTANTIATED" }
              as: Supervisor
          trigger:
            - call: "POST /cases/${cas}/close"
              payload: { closure_reason: "attempt close" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 422 with data.error_id == 'ERR_CROSS_REPORT_REQUIRED'"
            - "Case.${cas}.estimated_exposure_cents == 5000000"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: freeze_requires_case_under_investigation
        grounds:
          - validations[priority=12]
          - state_machines.Case.OPEN_to_UNDER_INVESTIGATION
          - errors[ERR_NOT_FINANCIAL_EXPLOITATION]
        distinguishing_aspect: "FinancialFreeze creation is gated by the Case's state (must be UNDER_INVESTIGATION): an OPEN case (no investigation yet) rejects the freeze — entity pair Freeze->Case."
        test_recipe:
          setup:
            - "Screened-in Case still OPEN (no investigation opened) alleging FINANCIAL_EXPLOITATION, with one ACTIVE account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Kate Pym", date_of_birth: "1949-10-10", address: "11 Rose Ave" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "City Bank", total_balance_cents: 400000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "suspicious transfers" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
          trigger:
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 100000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 422 with data.error_id == 'ERR_NOT_FINANCIAL_EXPLOITATION'"
            - "Case.${cas}.status == OPEN"

      - name: placement_enabled_by_client_high_risk
        grounds:
          - validations[priority=10]
          - calculations.risk_score
          - entities.Client.fields.risk_level
        distinguishing_aspect: "EmergencyPlacement creation is gated by the subject Client's derived risk_level: a HIGH risk_level (capacity still UNKNOWN) makes the client eligible and the placement succeeds — entity pair Placement->Client, different from Freeze->Case."
        test_recipe:
          setup:
            - "Screened-in case UNDER_INVESTIGATION; subject client has COMPREHENSIVE risk_level HIGH but capacity_status still UNKNOWN; a 1-bed facility available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /facilities"
              payload: { name: "Refuge", total_beds: 1 }
              as: Admin
              captures: { fac: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Lena Quy", date_of_birth: "1936-05-05", address: "13 Iris Ln" }
              as: IntakeWorker
              captures: { cli: "$.data.id", v1: "$.data.version" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "high risk" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "GET /clients/${cli}"
              payload: {}
              as: Caseworker
              captures: { vN: "$.data.version" }
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 3, cognitive_impairment_level: 3, financial_vulnerability_level: 2, caregiver_dependency_level: 2, prior_report_count: 1, expected_client_version: "${vN}" }
              as: Caseworker
              captures: { lvl: "$.data.risk_level" }
          trigger:
            - call: "POST /placements"
              payload: { case_id: "${cas}", facility_id: "${fac}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-03T00:00:00Z", court_authorized: true }
              as: Caseworker
              captures: { plc: "$.data.id" }
          assert:
            - "Client.${cli}.risk_level == HIGH"
            - "Client.${cli}.capacity_status == UNKNOWN"
            - "EmergencyPlacement.${plc}.status == ACTIVE"
            - "Facility.${fac}.available_beds == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: placement_bed_halfopen_capacity_overlap
        grounds:
          - validations[priority=15]
          - entities.EmergencyPlacement.fields.start_at
          - errors[ERR_NO_BED_AVAILABLE]
        distinguishing_aspect: "Facility bed overlap uses half-open [start_at,end_at) capacity geometry — adjacency (end==next start) does NOT collide; a distinct interval semantics from the freeze buffer rule, and a different resource (Facility)."
        test_recipe:
          setup:
            - "1-bed facility with an ACTIVE court-authorized placement over [2026-06-01, 2026-06-03) for eligible client A; a second eligible (IMPAIRED) client B screened in."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /facilities"
              payload: { name: "Single Bed", total_beds: 1 }
              as: Admin
              captures: { fac: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Client A2", date_of_birth: "1941-01-01", address: "1 A2 St" }
              as: IntakeWorker
              captures: { cliA: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cliA}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "A2" }
              as: IntakeWorker
              captures: { repA: "$.data.id" }
            - call: "POST /reports/${repA}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { casA: "$.data.case_id" }
            - call: "POST /clients/${cliA}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
            - call: "POST /placements"
              payload: { case_id: "${casA}", facility_id: "${fac}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-03T00:00:00Z", court_authorized: true }
              as: Caseworker
              captures: { plcA: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Client B2", date_of_birth: "1938-02-02", address: "2 B2 St" }
              as: IntakeWorker
              captures: { cliB: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cliB}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "B2" }
              as: IntakeWorker
              captures: { repB: "$.data.id" }
            - call: "POST /reports/${repB}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { casB: "$.data.case_id" }
            - call: "POST /clients/${cliB}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
          trigger:
            - call: "POST /placements"
              payload: { case_id: "${casB}", facility_id: "${fac}", start_at: "2026-06-02T00:00:00Z", end_at: "2026-06-04T00:00:00Z", court_authorized: true }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_NO_BED_AVAILABLE'"
            - "a placement for client B starting exactly at 2026-06-03T00:00:00Z (== plcA.end_at) would instead be accepted (half-open adjacency does not collide)"

      - name: freeze_account_buffer_cooldown_overlap
        grounds:
          - validations[priority=14]
          - entities.FinancialFreeze.fields.freeze_end
          - errors[ERR_FREEZE_WINDOW_OVERLAP]
        distinguishing_aspect: "FinancialAccount freeze overlap uses closed intervals plus a mandatory 24h cool-down after the prior freeze_end — a buffered geometry distinct from the placement half-open adjacency rule, and a different resource (FinancialAccount)."
        test_recipe:
          setup:
            - "Case UNDER_INVESTIGATION alleging FINANCIAL_EXPLOITATION; account frozen over [2026-06-01, 2026-06-05] then that freeze LIFTED (account ACTIVE again)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Mona Ash", date_of_birth: "1947-03-03", address: "14 Lily Rd" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Harbor Bank", total_balance_cents: 900000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "repeat exploitation" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 200000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-05T00:00:00Z" }
              as: Caseworker
              captures: { fz1: "$.data.id" }
            - call: "POST /freezes/${fz1}/lift"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 150000, freeze_start: "2026-06-05T12:00:00Z", freeze_end: "2026-06-10T00:00:00Z" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_FREEZE_WINDOW_OVERLAP'"
            - "a freeze_start of 2026-06-06T00:00:00Z (== prior freeze_end + 24h) would instead be accepted"

  - rule_id: compensating_invariant
    instances:
      - name: bed_conservation_place_then_discharge
        grounds:
          - state_machines.EmergencyPlacement.ACTIVE_to_DISCHARGED
          - entities.Facility.fields.available_beds
          - entities.Facility.fields.occupied_beds
        distinguishing_aspect: "Forward place (occupy 1 bed) + compensating discharge (release 1 bed) leaves Facility.available_beds + occupied_beds == total_beds == 3 with available_beds restored to 3; conserved quantity = beds."
        test_recipe:
          setup:
            - "3-bed facility; eligible (IMPAIRED) screened-in client; one ACTIVE placement (available_beds 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /facilities"
              payload: { name: "Three Bed", total_beds: 3 }
              as: Admin
              captures: { fac: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Nora Bly", date_of_birth: "1940-09-09", address: "15 Fern St" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "needs shelter" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /clients/${cli}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
            - call: "POST /placements"
              payload: { case_id: "${cas}", facility_id: "${fac}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-04T00:00:00Z", court_authorized: true }
              as: Caseworker
              captures: { plc: "$.data.id" }
          trigger:
            - call: "POST /placements/${plc}/discharge"
              payload: {}
              as: Caseworker
          assert:
            - "EmergencyPlacement.${plc}.status == DISCHARGED"
            - "Facility.${fac}.available_beds == 3"
            - "Facility.${fac}.occupied_beds == 0"

      - name: money_conservation_freeze_then_lift
        grounds:
          - state_machines.FinancialAccount.FROZEN_to_ACTIVE
          - entities.FinancialAccount.fields.available_balance_cents
          - entities.FinancialAccount.fields.frozen_amount_cents
        distinguishing_aspect: "Forward freeze (move balance to frozen) + compensating lift (return balance) leaves available_balance_cents + frozen_amount_cents == total_balance_cents == 1,000,000 with available restored; conserved quantity = money (different from beds)."
        test_recipe:
          setup:
            - "Case UNDER_INVESTIGATION alleging FINANCIAL_EXPLOITATION; account balance 1,000,000 with an ACTIVE freeze (frozen 1,000,000, available 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Omar Cyr", date_of_birth: "1935-04-04", address: "16 Sage Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Union Bank", total_balance_cents: 1000000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "account drained" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 600000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz: "$.data.id" }
          trigger:
            - call: "POST /freezes/${fz}/lift"
              payload: {}
              as: Supervisor
          assert:
            - "FinancialFreeze.${fz}.status == LIFTED"
            - "FinancialAccount.${acc}.available_balance_cents == 1000000"
            - "FinancialAccount.${acc}.frozen_amount_cents == 0"
