      - name: cash_to_close_invariant_under_reissue_and_trueup
        grounds:
          - calculations.cash_to_close
          - state_machines.ClosingStatement.ISSUED_to_SUPERSEDED
          - state_machines.ClosingStatement.ACKNOWLEDGED_to_TRUED_UP
        distinguishing_aspect: |
          Conserved quantity #2 — deal-level economic identity (different
          quantity than exception_count): for any statement version of the
          same deal with unchanged inputs, cash_to_close_cents ==
          psa_price_cents - loan_amount_cents + total_prorations_cents +
          assumption_fee_cents - earnest_money_cents. Reissue (forward) then
          true-up with a fully-approved REPAIR_CREDIT adjustment (compensating
          correction) must re-derive cash_to_close so that the FINAL figure
          equals the provisional figure plus the signed adjustment total —
