            - "second invoice: subtotal round(500000*100/10000)=5000 == 5000 does NOT trigger (strictly less-than) -> total_cents == 25300 (5000 + 300 + 20000)"
            - "the two invoices differ by 25000 despite wages differing by a factor of 50 — the boundary is the decision point"

      - name: payroll_interval_half_open_adjacency_vs_overlap
        grounds:
          - validations.priority-10
          - entities.PayrollReport.fields.period_end
        distinguishing_aspect: |
          Empty-intersection boundary on a different metric (time intervals, not
