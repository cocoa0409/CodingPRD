            - call: "POST /auction-results"
              payload: { vehicle_class: CLASSIC, make: "Ford", model: "Mustang", year: 1970, sale_price_cents: 3200000, sale_date: "2026-06-01T00:00:00Z", source_name: "D" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vehicles/${v_id}/valuations"
              payload: { method: AUCTION_COMPOSITE, proposed_agreed_value_cents: 3050000, expected_vehicle_version: "${v_ver}" }
              as: Underwriter
              captures: { comp: $.data.computed_value_cents }
          assert:
            - "computed_value_cents == 3050000 (trim 2800000 and 3200000; mean(3000000, 3100000))"
