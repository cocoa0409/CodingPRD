          assert:
            - "pick1 == ${u_b} (lowest cycles 50; earliest created_at wins the 50/50 tie)"
            - "pick2 == ${u_c} (remaining 50-cycle unit) and pick3 == ${u_a} (200 cycles chosen last)"
