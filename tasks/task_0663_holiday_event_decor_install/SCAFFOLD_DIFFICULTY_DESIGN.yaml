scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: renewal_price_provisional_vs_final_diverge_on_contract
        grounds:
          - calculations.compute_renewal_price
          - state_machines.RenewalOffer.SENT_to_ACCEPTED
          - entities.RenewalOffer.fields.provisional_price_cents
          - entities.RenewalOffer.fields.final_price_cents
        distinguishing_aspect: >
          On the Contract domain: provisional_price (514500, escalation only) differs from
          final_price (550500) by exactly the 36000 of one ASSESSED-not-SETTLED DamageReport
          carried forward at acceptance.
        test_recipe:
          setup:
            - "PlatformAdmin catalog SKU (unit_replacement_cents=6000) exists; clock at 2026-04-01 default."
            - "COMMERCIAL Client + Contract signed with single ACCEPTED proposal (install_fee 475000, storage 15000, surcharge 0, total 490000), then ACTIVE."
            - "A COMPLETED TAKEDOWN WorkOrder carries one DamageReport ASSESSED as REPAIR (settlement_total 36000), not yet SETTLED."
            - "A RenewalOffer was created (provisional_price 514500) and SENT."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Acme Retail", account_type: "COMMERCIAL", contact_email: "ops@acme.test", site_address: "1 Plaza" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "LIGHT-A", category: "LIGHTING", unit_replacement_cents: 6000, on_hand_qty: 20 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z", custom_design_surcharge_cents: 0 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "Classic Red" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 50, unit_install_cents: 10000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v_proposed: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v_proposed}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "TAKEDOWN" }
              as: FieldSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 1, leg_distance_km: 5.0, on_site_minutes: 60 }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew One", daily_capacity_minutes: 480, home_base_zip: "90001" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_date: "2026-11-10T00:00:00Z" }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: FieldSupervisor
            - call: "POST /visits/${visit_id}/complete"
              payload: { actual_minutes: 60 }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/damage-reports"
              payload: { inventory_item_id: "${sku_id}", damaged_qty: 5 }
              as: FieldSupervisor
              captures: { dr_id: $.data.id }
            - call: "POST /damage-reports/${dr_id}/assess"
              payload: { resolution_path: "REPAIR" }
              as: FieldSupervisor
            - call: "POST /contracts/${contract_id}/renewal-offers"
              payload: { expires_at: "2026-12-31T00:00:00Z", expected_contract_version: "${contract_v_proposed}" }
              as: AccountManager
              captures: { offer_id: $.data.id, prov_price: $.data.provisional_price_cents }
            - call: "POST /renewal-offers/${offer_id}/send"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /renewal-offers/${offer_id}/accept"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { final_price: $.data.final_price_cents }
          assert:
            - "RenewalOffer.${offer_id}.provisional_price_cents == 514500"
            - "RenewalOffer.${offer_id}.final_price_cents == 550500"
            - "RenewalOffer.${offer_id}.final_price_cents - RenewalOffer.${offer_id}.provisional_price_cents == 36000"

      - name: crew_planned_vs_actual_utilization_diverge_on_crew
        grounds:
          - calculations.compute_crew_utilization
          - state_machines.WorkOrder.UNSCHEDULED_to_SCHEDULED
          - state_machines.WorkOrder.DISPATCHED_to_COMPLETED
          - entities.Crew.fields.planned_utilization_pct
          - entities.Crew.fields.actual_utilization_pct
        distinguishing_aspect: >
          On the Crew domain (different entity from Contract): planned_utilization_pct (69, from
          scheduled route_total_minutes 333) differs from actual_utilization_pct (94, from summed
          COMPLETED actual_minutes 450) on the same crew/date.
        test_recipe:
          setup:
            - "ACTIVE COMMERCIAL contract exists; one Crew (capacity 480)."
            - "One INSTALL WorkOrder scheduled on the crew with 3 visits (legs 12.4/7.8/21.1 km, on-site 90/120/60) → route_total_minutes 333 → planned_utilization 69."
            - "Visits completed with actual_minutes 150/180/120 (sum 450), then WorkOrder COMPLETED → actual_utilization 94."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Beacon HOA", account_type: "COMMERCIAL", contact_email: "hoa@beacon.test", site_address: "9 Way" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-A", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 50 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "Gold" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 10, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /crews"
              payload: { crew_name: "Alpha", daily_capacity_minutes: 480, home_base_zip: "90001" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL" }
              as: FieldSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 1, leg_distance_km: 12.4, on_site_minutes: 90 }
              as: FieldSupervisor
              captures: { v1: $.data.id }
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 2, leg_distance_km: 7.8, on_site_minutes: 120 }
              as: FieldSupervisor
              captures: { v2: $.data.id }
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 3, leg_distance_km: 21.1, on_site_minutes: 60 }
              as: FieldSupervisor
              captures: { v3: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_date: "2026-11-15T00:00:00Z" }
              as: FieldSupervisor
              captures: { planned_after_schedule: $.data.route_total_minutes }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: FieldSupervisor
            - call: "POST /visits/${v1}/complete"
              payload: { actual_minutes: 150 }
              as: FieldSupervisor
            - call: "POST /visits/${v2}/complete"
              payload: { actual_minutes: 180 }
              as: FieldSupervisor
            - call: "POST /visits/${v3}/complete"
              payload: { actual_minutes: 120 }
              as: FieldSupervisor
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldSupervisor
          assert:
            - "WorkOrder.${wo_id}.route_total_minutes == 333"
            - "Crew.${crew_id}.planned_utilization_pct == 69"
            - "Crew.${crew_id}.actual_utilization_pct == 94"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a, b, c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contract_total_nonlinear_branching_mode_a
        grounds:
          - calculations.compute_contract_total
          - calculations.compute_install_fee
          - calculations.compute_storage_fee
          - state_machines.Contract.PROPOSED_to_SIGNED
        distinguishing_aspect: >
          Mode (a): >=3 inputs (install_fee, storage_fee, surcharge, contract_type, clock vs deadline)
          with conditional branching — HOA + before-deadline yields early_bird_discount 54522 and
          total 449825 (install 439347 + storage 15000 + surcharge 50000 − 54522).
        test_recipe:
          setup:
            - "Clock set to 2026-02-15 (before early_bird_deadline 2026-03-01)."
            - "HOA Client + Contract (surcharge 50000, deadline 2026-03-01), one ACCEPTED proposal with two line items (4999×30 + 12500×25, total_unit_count 55 → tier 0.05 → install_fee 439347), no STORED storage lot (storage_fee 15000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Maple HOA", account_type: "HOA", contact_email: "board@maple.test", site_address: "Maple Ln" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "LIGHT-RUN", category: "LIGHTING", unit_replacement_cents: 3000, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_light: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "WREATH-XL", category: "WREATH", unit_replacement_cents: 8000, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_wreath: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "HOA", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z", custom_design_surcharge_cents: 50000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "Winter Gold", is_custom: true }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_light}", quantity: 30, unit_install_cents: 4999 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_wreath}", quantity: 25, unit_install_cents: 12500 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { total: $.data.total_amount_cents }
          assert:
            - "Contract.${contract_id}.install_fee_cents == 439347"
            - "Contract.${contract_id}.storage_fee_cents == 15000"
            - "Contract.${contract_id}.early_bird_discount_cents == 54522"
            - "Contract.${contract_id}.total_amount_cents == 449825"

      - name: route_minutes_round_per_leg_then_sum_mode_b
        grounds:
          - calculations.compute_route_minutes
          - state_machines.WorkOrder.UNSCHEDULED_to_SCHEDULED
          - entities.Visit.fields.leg_distance_km
        distinguishing_aspect: >
          Mode (b): nested rounding order pinned — round each leg (12.4→19, 7.8→12, 21.1→32 = 63)
          THEN add on-site 270 = 333; the wrong sum-then-round order would give 332.
        test_recipe:
          setup:
            - "ACTIVE COMMERCIAL contract, one Crew (capacity 480)."
            - "INSTALL WorkOrder with 3 visits (legs 12.4/7.8/21.1 km, on-site 90/120/60)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Cobalt Co", account_type: "COMMERCIAL", contact_email: "c@cobalt.test", site_address: "3 St" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "GARLAND-A", category: "GARLAND", unit_replacement_cents: 4000, on_hand_qty: 60 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_id}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "Greens" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 10, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_id}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /crews"
              payload: { crew_name: "Bravo", daily_capacity_minutes: 480, home_base_zip: "90001" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL" }
              as: FieldSupervisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 1, leg_distance_km: 12.4, on_site_minutes: 90 }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 2, leg_distance_km: 7.8, on_site_minutes: 120 }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/visits"
              payload: { stop_sequence: 3, leg_distance_km: 21.1, on_site_minutes: 60 }
              as: FieldSupervisor
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_date: "2026-11-20T00:00:00Z" }
              as: FieldSupervisor
              captures: { route: $.data.route_total_minutes }
          assert:
            - "WorkOrder.${wo_id}.route_total_minutes == 333"

      - name: damage_settlement_order_pinned_mode_c
        grounds:
          - calculations.compute_damage_settlement
          - state_machines.DamageReport.OPEN_to_ASSESSED
          - entities.DamageReport.fields.replacement_cost_cents
          - entities.DamageReport.fields.settlement_total_cents
        distinguishing_aspect: >
          Mode (c): circular-looking dependency pinned to order — replacement_cost (29500) is computed
          first, then the tier-derived base_pct (0.20), then effective_pct, then labor (5900), then
          total (35400); standard (non-renewal) variant.
        test_recipe:
          setup:
            - "ACTIVE COMMERCIAL contract (not in renewal posture) with a COMPLETED TAKEDOWN WorkOrder."
            - "Catalog SKU unit_replacement_cents=4500; one OPEN DamageReport damaged_qty=... NOTE replacement_cost uses a different SKU set: use unit_replacement 5900 qty 5 → 29500."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Drift Inc", account_type: "COMMERCIAL", contact_email: "d@drift.test", site_address: "4 Rd" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /inventory-items"
