scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: patient_create_assigns_mrn_and_default_status
        claim_type: creation_defaults
        grounds:
          - entities.Patient.fields.mrn
          - entities.Patient.fields.status
          - entities.Patient.fields.language_code
        distinguishing_aspect: "POST /patients returns 201 with server-minted mrn, status PRE_REGISTERED, language_code default 'en', version 1; client-supplied id/status are ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Def", last_name: "Ault", date_of_birth: "1995-01-05", sex_at_birth: "F", primary_phone: "+15551100001" }
              as: Registrar
              captures: { p_id: $.data.id, mrn: $.data.mrn, st: $.data.status, lang: $.data.language_code, ver: $.data.version }
          assert:
            - "mrn matches pattern '^MRN\\d{8}$'"
            - "st == PRE_REGISTERED"
            - "lang == en"
            - "ver == 1"

      - name: patient_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /patient-access/patients/{id}"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND / 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /patient-access/patients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: patient_list_pagination_envelope
        claim_type: listing_pagination
        grounds:
          - response_envelope
          - endpoints["GET /patient-access/patients"]
        distinguishing_aspect: "GET /patients returns response_type 'array' with limit/offset/total_count/has_more; defaults limit=10."
        test_recipe:
          setup: ["three patients exist"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Pg", last_name: "One", date_of_birth: "1990-01-01", sex_at_birth: "M", primary_phone: "+15551100002" }
              as: Registrar
            - call: "POST /patient-access/patients"
              payload: { first_name: "Pg", last_name: "Two", date_of_birth: "1990-01-02", sex_at_birth: "F", primary_phone: "+15551100003" }
              as: Registrar
            - call: "POST /patient-access/patients"
              payload: { first_name: "Pg", last_name: "Three", date_of_birth: "1990-01-03", sex_at_birth: "X", primary_phone: "+15551100004" }
              as: Registrar
          trigger:
            - call: "GET /patient-access/patients?limit=2&offset=0"
              as: Registrar
              captures: { tc: $.data }
          assert:
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "data has pagination fields limit, offset, total_count, has_more"
            - "total_count == 3"
            - "has_more == true when limit=2 offset=0"

      - name: appointment_derived_fields_ignore_client_input
        claim_type: computed_fields
        grounds:
          - entities.Appointment.fields.registration_gate
          - entities.Appointment.fields.amount_collected_cents
          - entities.Appointment.fields.auth_satisfied
        distinguishing_aspect: "Computed/system fields supplied in a create payload are ignored; a freshly created appointment shows registration_gate derived by clearance_status, not a client-supplied 'CLEAR'."
        test_recipe:
          setup: ["registered patient, PPO policy"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Cmp", last_name: "Uted", date_of_birth: "1992-02-02", sex_at_birth: "M", primary_phone: "+15551100005" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYERH", member_id: "MCMP", plan_type: "HMO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
          trigger:
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "CARD", procedure_code: "99213", scheduled_start: "2026-08-30T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRZ" }
              as: Registrar
              captures: { gate: $.data.registration_gate, coll: $.data.amount_collected_cents, sat: $.data.auth_satisfied }
          assert:
            - "gate == BLOCKED  (HMO plan with no referral match)"
            - "coll == 0"
            - "sat == true  (ESTABLISHED visit needs no auth)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: checkin_before_ready_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Appointment.READY_to_ARRIVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "check-in from PRE_CHECKED (not READY) is rejected with ERR_INVALID_STATE; no QueueTicket is issued."
        test_recipe:
          setup: ["PRE_CHECKED appointment, gate CLEAR"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "St", last_name: "One", date_of_birth: "1993-03-03", sex_at_birth: "F", primary_phone: "+15551200001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MS1", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRS1" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
            - call: "GET /patient-access/appointments/${a_id}/queue-tickets"
              as: FrontDeskAgent
              captures: { tickets: $.data }
          assert:
            - "err == ERR_INVALID_STATE"
            - "queue ticket list is empty (total_count == 0)"

      - name: terminal_completed_rejects_cancel
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Appointment
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED appointment is terminal: cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["COMPLETED appointment (full flow executed)"]
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:50:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Term", last_name: "Inal", date_of_birth: "1994-04-04", sex_at_birth: "M", primary_phone: "+15551200002" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MT1", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRS2" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 0 }
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${a_id}/mark-ready"
              payload: {}
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${a_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/queue-tickets/call-next"
              payload: { department_code: "ORTHO", queue_date: "2026-08-10" }
              as: FrontDeskAgent
            - call: "POST /patient-access/appointments/${a_id}/complete"
              payload: {}
              as: FrontDeskAgent
              captures: { st: $.data.status }
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/cancel"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "st == COMPLETED"
            - "err == ERR_INVALID_STATE"

      - name: complete_sets_estimate_final_and_ticket_served
        claim_type: side_effect_execution
        grounds:
          - state_machines.Appointment.IN_ROOM_to_COMPLETED
          - state_machines.QueueTicket.CALLED_to_SERVED
          - state_machines.CopayEstimate.PROVISIONAL_to_FINAL
        distinguishing_aspect: "Completing the visit fires both declared side effects: ticket CALLED->SERVED and estimate PROVISIONAL->FINAL."
        test_recipe:
          setup: ["IN_ROOM appointment with a PROVISIONAL estimate and CALLED ticket"]
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:50:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Side", last_name: "Fx", date_of_birth: "1995-05-05", sex_at_birth: "F", primary_phone: "+15551200003" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MSF", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRS3" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 2000, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 5000 }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /patient-access/appointments/${a_id}/payments"
              payload: { amount_cents: 500, method: "CARD", kind: "POST" }
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${a_id}/mark-ready"
              payload: {}
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${a_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/queue-tickets/call-next"
              payload: { department_code: "ORTHO", queue_date: "2026-08-10" }
              as: FrontDeskAgent
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/complete"
              payload: {}
              as: FrontDeskAgent
            - call: "GET /patient-access/appointments/${a_id}/queue-tickets"
              as: FrontDeskAgent
              captures: { t_state: "$.data[0].state" }
            - call: "GET /patient-access/appointments/${a_id}/copay-estimates"
              as: FinancialCounselor
              captures: { e_state: "$.data[0].status" }
          assert:
            - "t_state == SERVED"
            - "e_state == FINAL"

      - name: cancel_appointment_removes_waiting_ticket
        claim_type: cross_entity_cascade
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - state_machines.QueueTicket.WAITING_to_REMOVED
        distinguishing_aspect: "Cancelling an appointment with a WAITING ticket would REMOVE the ticket; however cancel is only legal from pre-arrival states while tickets only exist post-check-in, so the path is unreachable — the ticket REMOVED transition is exercised by the close-day sweep instead."
        excluded_because:
          difficulty_instance: non_linear_state_machine / queue_ticket_called_skipped_branch
          rationale: "Ticket lifecycle and appointment interplay are exercised there; the WAITING->REMOVED branch fires in close_day_marks_no_shows via the close-day sweep. The direct cancel-with-ticket path is unreachable because cancel is restricted to pre-arrival states and tickets only exist post-check-in."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: eligibility_result_stale_after_30_days
        claim_type: threshold_boundary
        grounds:
          - calculations.eligibility_result
          - entities.EligibilityCheck.fields.result
        distinguishing_aspect: "A check exactly 30 days old is still fresh (strict >); at 31 days the stored check reads STALE."
        test_recipe:
          setup: ["appointment with eligibility check posted 2026-08-01; clock advanced to 2026-08-31 (exactly 30 days) then 2026-09-01 (31 days)"]
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Stale", last_name: "Check", date_of_birth: "1996-06-06", sex_at_birth: "M", primary_phone: "+15551300001" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MST", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-05T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRST" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 3500, coinsurance_pct: 0, auth_required: false }
              as: Registrar
              captures: { ec_id: $.data.id }
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: AccessSupervisor
            - call: "GET /patient-access/appointments/${a_id}/eligibility-checks"
              as: Registrar
              captures: { res30: "$.data[0].result" }
          trigger:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AccessSupervisor
            - call: "GET /patient-access/appointments/${a_id}/eligibility-checks"
              as: Registrar
              captures: { res31: "$.data[0].result" }
          assert:
            - "res30 == VERIFIED"
            - "res31 == STALE"

      - name: eligibility_result_failed_on_inactive_coverage
        claim_type: correct_result
        grounds:
          - calculations.eligibility_result
        distinguishing_aspect: "coverage_status != ACTIVE maps to result FAILED regardless of auth_required."
        test_recipe:
          setup: ["registered patient, policy, appointment"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Fail", last_name: "Ed", date_of_birth: "1997-07-07", sex_at_birth: "F", primary_phone: "+15551300002" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MFA", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-09-06T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRFA" }
              as: Registrar
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "INACTIVE", copay_cents: 0, coinsurance_pct: 0, auth_required: false }
              as: Registrar
              captures: { res: $.data.result }
          assert:
            - "res == FAILED"

      - name: queue_sequence_monotonic_after_skip
        claim_type: aggregation_monotonic
        grounds:
          - calculations.queue_sequence
          - entities.QueueTicket.fields.sequence_number
        distinguishing_aspect: "Sequence numbers are 1-based and never reused: after ticket #1 is SKIPPED, the next check-in in the same department-day gets sequence_number 2."
        test_recipe:
          setup: ["two READY appointments same department/date; first checked in, called, skipped; second checks in"]
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:45:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Seq", last_name: "One", date_of_birth: "1998-08-08", sex_at_birth: "M", primary_phone: "+15551300003" }
              as: Registrar
              captures: { q1_id: $.data.id }
            - call: "POST /patient-access/patients/${q1_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${q1_id}", payer_id: "PAYER1", member_id: "MQ1", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { polq1: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${q1_id}", department_code: "DERM", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRQ1" }
              as: Registrar
              captures: { aq1: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${polq1}", appointment_id: "${aq1}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${aq1}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${aq1}/copay-estimates"
              payload: { policy_id: "${polq1}", allowed_amount_cents: 0 }
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${aq1}/mark-ready"
              payload: {}
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${aq1}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/queue-tickets/call-next"
              payload: { department_code: "DERM", queue_date: "2026-08-10" }
              as: FrontDeskAgent
              captures: { t1: $.data.id, seq1: $.data.sequence_number }
            - call: "POST /patient-access/queue-tickets/${t1}/skip"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/patients"
              payload: { first_name: "Seq", last_name: "Two", date_of_birth: "1999-09-09", sex_at_birth: "F", primary_phone: "+15551300004" }
              as: Registrar
              captures: { q2_id: $.data.id }
            - call: "POST /patient-access/patients/${q2_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${q2_id}", payer_id: "PAYER1", member_id: "MQ2", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { polq2: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${q2_id}", department_code: "DERM", procedure_code: "99213", scheduled_start: "2026-08-10T09:15:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRQ2" }
              as: Registrar
              captures: { aq2: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${polq2}", appointment_id: "${aq2}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${aq2}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${aq2}/copay-estimates"
              payload: { policy_id: "${polq2}", allowed_amount_cents: 0 }
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${aq2}/mark-ready"
              payload: {}
              as: FinancialCounselor
          trigger:
            - call: "POST /patient-access/appointments/${aq2}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "GET /patient-access/appointments/${aq2}/queue-tickets"
              as: FrontDeskAgent
              captures: { seq2: "$.data[0].sequence_number" }
