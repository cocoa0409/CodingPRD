      - name: patch_mill_receiving_status_reopens_and_closes_the_yard
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /mills/{id}]
          - entities.Mill.fields.receiving_status
          - roles.MillScaler
        distinguishing_aspect: |
          PATCH /mills/{id} is the only way to move receiving_status, and both the platform
          admin and the mill's own scaler may call it; the change must be visible on the very
          next read.
        test_recipe:
          setup:
            - "Mill A exists with receiving_status OPEN"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
          trigger:
            - call: "PATCH /mills/${mill_a_id}"
              payload: { receiving_status: "CLOSED" }
              as: MillScaler
              as_user_id: "${mill_a_id}"
            - call: "GET /mills/${mill_a_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rs_closed: $.data.receiving_status }
            - call: "PATCH /mills/${mill_a_id}"
              payload: { receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "${rs_closed} == CLOSED"
            - "Mill.${mill_a_id}.receiving_status == OPEN"
            - "Mill.${mill_a_id}.version == 3"

