          - state_machines.SubstantiationRecord.VERIFIED_to_REVOKED
        distinguishing_aspect: |
          A different category pair — business_safety (priority 58) vs
          business_referential (priority 73) — on a different endpoint. Revoking the
          allergen certificate that the packet pinned makes the document both STALE
          (version pin no longer matches, rule 73) and backed by a non-VERIFIED
          record (rule 58). Because the brief requires no natural, kosher or halal
          claim, no rework cascade fires, so the shipment really is still
