  - section: cross_cutting_complexity_layers
    instances:

      - name: consent_create_with_stale_student_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consent-create-stale-student]
          - validations[priority=10]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A consent create carrying the student version observed before a financial-profile write returns HTTP 412 ERR_STALE_VERSION; re-reading the student and resending with the current version succeeds and bumps the version by exactly 1."
        test_recipe:
          setup:
            - "One student with one guardian; the client observed version 1 at creation and a financial-profile write has since advanced the version to 2."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", stu_v_stale: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/guardians"
              payload: { full_name: "Mai Nguyen", relationship: "MOTHER", contact_email: "mai@example.org", is_primary: true }
              as: Registrar
              captures: { g1_id: "$.data.id" }
            - call: "PATCH /sbhc/students/${stu_id}/financial-profile"
              payload: { household_income_annual_cents: 3000000, household_size: 4, payer_route: "SELF_PAY" }
              as: Registrar
              captures: { stu_v_fresh: "$.data.version" }
          trigger:
            - call: "POST /sbhc/students/${stu_id}/consents"
              payload: { category: "GENERAL_TREATMENT", school_year: "2025-2026", granted_by: "GUARDIAN", granted_by_user_id: "${g1_id}", expected_student_version: "${stu_v_stale}" }
              as: Registrar
              captures: { err: "$.data.error_id" }
            - call: "POST /sbhc/students/${stu_id}/consents"
              payload: { category: "GENERAL_TREATMENT", school_year: "2025-2026", granted_by: "GUARDIAN", granted_by_user_id: "${g1_id}", expected_student_version: "${stu_v_fresh}" }
              as: Registrar
              captures: { c_id: "$.data.id" }
          assert:
            - "the stale attempt returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "Consent.${c_id}.status == ACTIVE"
            - "Student.${stu_id}.version == 3"
            - "exactly 1 Consent row exists for student ${stu_id}"

