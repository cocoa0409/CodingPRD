      - name: grandparent_discipline_falls_through_to_the_code_prefix_rule
        claim_type: correct_result
        grounds:
          - calculations.discipline_alignment_score
          - calculations.assignment_qualification_determination
          - entities.CourseAssignment.fields.alignment_score
          - entities.CourseAssignment.fields.exception_code
        distinguishing_aspect: |
          Only ONE level of parenthood is honored: a Broadcast MASTERS scores 0.7100 against its
          parent Journalism (qualified) but only 0.4000 against its grandparent Communication,
          because the grandparent misses every proximity row and falls through to the two-digit
          code-prefix rule — the reachable route to exception_code DISCIPLINE_MISALIGNED with a
          non-zero alignment_score.
        test_recipe:
          setup:
            - "The taxonomy is Communication 09.01 -> Journalism 09.04 -> Broadcast Journalism 09.05, all requiring MASTERS."
            - "Rin Alvarez holds a single VERIFIED, OFFICIAL_RECEIVED, domestic MASTERS in Broadcast Journalism with 30 graduate hours, so the dossier is VERIFIED and the appointment is CREDENTIALED_ELIGIBLE."
            - "The DEGREE_FIELD program owns two 3-credit LOWER_DIVISION sections in the OPEN 2026FA term: one whose discipline is Journalism (MONDAY) and one whose discipline is Communication (TUESDAY)."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - call: "POST /disciplines"
              payload: { code: "09.05", name: "Broadcast Journalism", parent_discipline_id: "${journ_id}", required_terminal_degree_level: MASTERS, min_graduate_credit_hours: 18 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { bcast_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { full_name: "Rin Alvarez", email: "rin.alvarez@example.edu", employment_class: ADJUNCT, home_program_id: "${prog_df_id}" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_r_id: $.data.id }
            - call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_r_id}", degree_level: MASTERS, discipline_id: "${bcast_id}", conferring_institution: "Coastal University", is_foreign_institution: false, graduate_credit_hours_in_discipline: 30 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_r_bcast_id: $.data.id }
            - call: "POST /credential-records/${rec_r_bcast_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - call: "POST /credential-records/${rec_r_bcast_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - *c_sec_df
            - call: "POST /course-sections"
              payload: { course_code: "COMM101", title: "Introduction to Communication", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${comm_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["TU"], meeting_start_minute: 540, meeting_end_minute: 620 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_comm_id: $.data.id, sec_comm_v: $.data.version }
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_r_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_parent_id: $.data.id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_comm_id}", faculty_member_id: "${fac_r_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_comm_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_grandparent_id: $.data.id }
          assert:
            - "Trigger 1: CourseAssignment.${asn_parent_id}.alignment_score == 0.7100 (source.parent_discipline_id == target.id) with status == VERIFIED_QUALIFIED, qualification_basis == TERMINAL_DEGREE, exception_code == null"
            - "Trigger 2: CourseAssignment.${asn_grandparent_id}.alignment_score == 0.4000 — Broadcast is neither the child nor a sibling of Communication, so only the code prefix 09 matches"
            - "Trigger 2: status == EXCEPTION_FLAGGED with qualification_basis == NONE and exception_code == DISCIPLINE_MISALIGNED, because 0.4000 < 0.70"
            - "FacultyMember.${fac_r_id}.assigned_credit_hours == 6 of the ADJUNCT cap 9 — both assignments are live"
            - "Program.${prog_df_id}.unqualified_assignment_count is only rewritten by a roster generate, so no roster exists and the two assignments were decided at creation time"

      - name: evaluation_fee_tier_boundaries_and_floor_and_cap
        claim_type: tiered_pricing
        grounds: [calculations.evaluation_fee_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / evaluation_fee_tiered_pages_times_expedite_multiplier_with_floor_and_cap
          rationale: "Every tier boundary, the marginal-rate step, the EXPEDITE multiplier, the 15000 floor and the 95000 cap are asserted as pre-computed literals by that §1.8 instance."

      - name: allocation_fills_the_floor_before_distributing_the_residual
        claim_type: waterfall_allocation
        grounds: [calculations.evaluation_cost_allocation]
        excluded_because:
          difficulty_instance: combinatorial_formula / evaluation_cost_allocation_floor_then_residual_by_weight_desc_then_created_at
          rationale: "Floor-then-residual ordering, the weight-descending then created_at ASC tie-break and the shares-sum-to-fee invariant are the asserted subject of that §1.8 instance."

      - name: risk_index_weights_sum_and_tier_multiplier_applied_once
        claim_type: weighted_scoring
