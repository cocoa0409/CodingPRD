              payload: { campaign_id: "${camp}", sender_number_id: "${num}", to_number: "+15550000041", body: "one", carrier_code: "VZW" }
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/messages"
              payload: { campaign_id: "${camp}", sender_number_id: "${num}", to_number: "+15550000042", body: "two", carrier_code: "VZW" }
              as: CampaignManager
