      - name: contribution_settle_then_refund_conserves_donor_deduction_ledger
        grounds:
          - state_machines.sm_contribution_status
          - calculations.calc_contribution_deductible_amount
          - entities.DonorMember.fields.lifetime_deductible_cents
          - entities.DonorMember.fields.lifetime_settled_cents
          - endpoints."POST /nil/contributions/{id}/refund"
          - endpoints."POST /nil/collectives/{id}/billing-runs"
        distinguishing_aspect: |
          A different action pair and a different conserved quantity from
          release_then_reversal_conserves_collective_funds_identity: here the pair
          is SETTLE then REFUND on a Contribution, and the conserved quantity is the
          donor's consumed charitable-deduction headroom against the AGI ceiling,
          not the collective's cash identity. Recording a second 400000-cent gift
          consumes the last 100000 of the 600000-cent ceiling; refunding it and then
          running the year-end recompute must return consumed headroom to exactly
          the 500000 it was before that gift existed, with the surviving
          contribution's own deductible_amount_cents untouched at 500000.
        test_recipe:
          setup:
            - "A NONPROFIT_501C3 collective, so charitable_deduction_enabled is true."
            - "One OPEN tier and one INDIVIDUAL DonorMember with annual_agi_cents 1000000, so the ceiling is floor(1000000*60/100) = 600000."
            - "Contribution C1 of gross 512851 -> fee 12851 -> net 500000 is settled first, consuming 500000 of the ceiling and leaving 100000 of headroom."
            - "Before the trigger: DonorMember.lifetime_settled_cents 500000, DonorMember.lifetime_deductible_cents 500000, Contribution C1 deductible_amount_cents 500000, status ACTIVE."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Deduction Ledger Fund", institution_name: "California Institution E", institution_ipeds_code: "018100", home_state_code: "CA", association_ruleset: "NCAA_2026", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T5", tier_name: "Deduction Chair", annual_dues_cents: 450000, benefit_rank: 5 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Cal Charlie", email: "cal@example.com", donor_kind: "INDIVIDUAL", annual_agi_cents: 1000000 }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 512851, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { c1_id: $.data.id }
            - call: "GET /nil/donor-members/${donor_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { settled_before: $.data.lifetime_settled_cents, deductible_before: $.data.lifetime_deductible_cents, donor_status_before: $.data.status }
          trigger:
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 410287, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { c2_id: $.data.id, c2_deductible: $.data.deductible_amount_cents, c2_net: $.data.net_amount_cents }
            - call: "POST /nil/contributions/${c2_id}/refund"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /nil/collectives/${col_id}/billing-runs"
              payload: { run_kind: "YEAR_END_TAX_RECOMPUTE" }
              as: TreasuryOfficer
              captures: { recomputed_n: $.data.recomputed_contribution_count, delta_cents: $.data.deduction_delta_cents }
          assert:
            - "${settled_before} == 500000"
            - "${deductible_before} == 500000"
            - "${donor_status_before} == ACTIVE"
            - "${c2_net} == 400000"
            - "${c2_deductible} == 100000"
            - "Contribution.${c2_id}.status == REFUNDED"
            - "Contribution.${c1_id}.status == SETTLED"
            - "Contribution.${c1_id}.net_amount_cents == 500000"
            - "Contribution.${c1_id}.deductible_amount_cents == 500000"
            - "DonorMember.${donor_id}.lifetime_settled_cents == 500000"
            - "DonorMember.${donor_id}.lifetime_deductible_cents == 500000"
            - "DonorMember.${donor_id}.status == ACTIVE"
            - "Collective.${col_id}.settled_net_funds_cents == 500000"
            - "Collective.${col_id}.charitable_deduction_enabled == true"
            - "${recomputed_n} == 1"
            - "${delta_cents} == 0"
            - "Consumed AGI headroom is 500000 before C2 exists, 600000 with C2 settled, and exactly 500000 again after the refund plus recompute, so the compensation leaves zero drift and the surviving row is neither double-counted nor orphaned."
