            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: GpoAdmin
