            - "FramingOrder.${order_id}.balance_due == 39.47"

      - name: balance_paid_before_ready_covers_estimate_reaches_paid_in_full
        claim_type: cascading_side_effects
        grounds:
          - state_machines.FramingOrder.DEPOSIT_PAID_to_PAID_IN_FULL
