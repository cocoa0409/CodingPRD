      - name: corner_vial_selection_takes_the_earliest_expiry_then_the_dearest_lot
        claim_type: selector_ranking
        grounds:
          - calculations.vial_selection
          - entities.Vial.status
        distinguishing_aspect: "Three AVAILABLE lots of the same drug: RX-9010 expires 2026-12-31, while RX-9001 and RX-9011 share the 2027-06-30 expiry at 132000 and 140000 cents. The first encounter draws RX-9010 (earliest expiry wins outright); the second draws RX-9011, because the expiry tie is broken by unit_acquisition_cost_cents DESC — the dearest capital is burned first, which is the opposite of the intuitive cheapest-first rule."
        test_recipe:
          setup:
            - "the corner prologue with an ACTIVE LOADING plan for P-NP / OD"
            - "lots RX-9010 (exp 2026-12-31, 100000, 1 vial), RX-9001 (exp 2027-06-30, 132000, 5 vials) and RX-9011 (exp 2027-06-30, 140000, 1 vial)"
