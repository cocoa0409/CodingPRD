            - { call: "POST /events/${ev_t}/start", payload: {}, as: MeetDirector, captures: { ev_t_v: "$.data.version" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_ta}" }, as: Any, captures: { lane_ta: "$.data[0].id" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_tb}" }, as: Any, captures: { lane_tb: "$.data[0].id" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_tc}" }, as: Any, captures: { lane_tc: "$.data[0].id" } }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_td}" }, as: Any, captures: { lane_td: "$.data[0].id" } }
