              payload: {}
              as: CustomerOps
              as_user_id: "${c_bl}"
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_bl}", evaluation_id: "${e_bl}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 2000000, unit_price_cents_per_nm3: 12, monthly_facility_fee_cents: 500000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
              captures: { k_bl: $.data.id }
            - call: "POST /gas-supply/supply-contracts/${k_bl}/activate"
              payload: {}
              as: SupplyPlanner
            - call: "POST /gas-supply/onsite-plants"
              payload: { contract_id: "${k_bl}", name: "BLK-1 ASU", nameplate_capacity_nm3h: 6000, capital_cost_cents: 120000000, power_kwh_per_nm3: 0.42 }
              as: PlantOperator
              captures: { p_bl: $.data.id }
            - call: "POST /gas-supply/onsite-plants/${p_bl}/advance"
              payload: {}
              as: PlantOperator
            - call: "POST /gas-supply/onsite-plants/${p_bl}/advance"
              payload: {}
              as: PlantOperator
            - call: "POST /gas-supply/onsite-plants/${p_bl}/advance"
              payload: {}
              as: PlantOperator
            - call: "POST /gas-supply/onsite-plants/${p_bl}/turnarounds"
              payload: { window_start: "2027-03-09T00:00:00Z", window_end: "2027-03-10T00:00:00Z", scope: "Touching-start window" }
              as: PlantOperator
              captures: { ta_bl1: $.data.id, ta_bl1_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_bl1}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_bl1_v}" }
              as: CustomerOps
              as_user_id: "${c_bl}"
            - call: "POST /gas-supply/onsite-plants/${p_bl}/turnarounds"
              payload: { window_start: "2027-03-20T00:00:00Z", window_end: "2027-03-22T00:00:00Z", scope: "Touching-end window" }
              as: PlantOperator
              captures: { ta_bl2: $.data.id, ta_bl2_v: $.data.version }
            - call: "POST /gas-supply/turnarounds/${ta_bl2}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_bl2_v}" }
              as: CustomerOps
              as_user_id: "${c_bl}"
          trigger:
            - call: "POST /gas-supply/turnarounds/${ta_bl1}/schedule"
              payload: {}
              as: PlantOperator
              captures: { ta_bl1_st: $.data.status }
            - call: "POST /gas-supply/turnarounds/${ta_bl2}/schedule"
              payload: {}
              as: PlantOperator
              captures: { err_bl: $.data.error_id }
          assert:
            - "[2027-03-09, 2027-03-10) schedules: ${ta_bl1_st} == SCHEDULED (window_end == blackout start shares no instant with the closed blackout)"
            - "[2027-03-20, 2027-03-22) rejected: 422 ${err_bl} == ERR_TURNAROUND_IN_BLACKOUT (blackout end is inclusive)"
            - "Turnaround.${ta_bl2}.status remains AGREED"

      - name: plant_already_exists_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=7]
          - errors[ERR_PLANT_ALREADY_EXISTS]
        distinguishing_aspect: "One live dedicated plant per contract: a second plant create while the first is non-DECOMMISSIONED is 409 ERR_PLANT_ALREADY_EXISTS."
