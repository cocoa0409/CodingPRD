# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-ID / X-User-Role headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Request-body FK references a non-existent entity" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not legal from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_UNIQUENESS_VIOLATION, http: 409, condition: "Unique constraint violated (ticker, index_code, category_code, methodology code+version, active seat per workstation user)" }
  - { id: ERR_TEMPORAL_OVERLAP, http: 422, condition: "Effectiveness window overlaps a same-key EFFECTIVE/ACTIVE sibling window, or effective_to <= effective_from" }
  - { id: ERR_SNAPSHOT_INVALID, http: 422, condition: "Holdings snapshot weights do not sum to 10000 bp, as_of_date is in the future, or snapshot date already ingested for the fund" }
  - { id: ERR_NO_ELIGIBLE_CATEGORY, http: 422, condition: "No active category satisfies min_weight_bp for the latest holdings snapshot" }
  - { id: ERR_CONFLICT_OF_INTEREST, http: 422, condition: "OPEN COMMERCIAL_RATING_CONFLICT flag blocks rating publication or committee vote; or analyst proposes on a fund whose issuer has an unwaived commercial relationship" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Proposer voting on own proposal, or duplicate vote by the same voter" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "Reserved for explicit close attempts before quorum; proposals auto-transition so normally unused — kept for direct finalize attempts" }
  - { id: ERR_SEAT_LIMIT_REACHED, http: 422, condition: "seats_in_use == seat_limit, or agreement/licensee not ACTIVE when granting a seat" }
  - { id: ERR_LICENSE_TIER_INSUFFICIENT, http: 422, condition: "Index launch/link requires an ACTIVE agreement with tier DERIVED_WORKS" }
  - { id: ERR_DISPUTE_NOT_ISSUER, http: 422, condition: "raised_by_company_id is not the fund's issuer, or corrected_value missing for a numeric disputed_field" }
  - { id: ERR_RATING_KIND_MISMATCH, http: 409, condition: "publish called on an ANALYST rating, or proposals opened on a QUANTITATIVE rating" }
  - { id: ERR_METHODOLOGY_NOT_EFFECTIVE, http: 409, condition: "Rating computation or index launch references a methodology not in EFFECTIVE status" }
  - { id: ERR_SUPPRESSED_RATING, http: 409, condition: "Rating has suppression_reason != NONE (DISPUTE_HOLD or CONFLICT_HOLD) blocking publication" }
  - { id: ERR_OPEN_DISPUTES_REMAIN, http: 409, condition: "Reinstate/offboard/liquidate blocked because open_dispute_count > 0 or the fund has OPEN/UNDER_INVESTIGATION disputes" }
  - { id: ERR_ARREARS_OUTSTANDING, http: 409, condition: "Licensee reinstate requires arrears_cents == 0" }
  - { id: ERR_SEATS_STILL_ACTIVE, http: 409, condition: "Agreement termination requires seats_in_use == 0" }
  - { id: ERR_INDEX_NOT_LICENSABLE, http: 409, condition: "Index launch preconditions unmet (no constituents, methodology not effective, agreement missing)" }
  - { id: ERR_AUDIT_OUTCOME_INVALID, http: 422, condition: "Closing an audit with outcome=PENALTY while unlicensed_uses_found == 0" }
  - { id: ERR_VALIDATION, http: 400, condition: "Generic malformed request (missing required field, bad enum, bad type)" }
  - { id: ERR_FUTURE_EFFECTIVE_DATE, http: 422, condition: "MethodologyChange approve requires effective_date >= logical clock date; effectuate requires clock date >= effective_date" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ResearchOps
    description: "Internal research operations: data ingestion, methodologies, quantitative ratings, disputes, fund-company lifecycle, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /research/fund-companies* (create/suspend/reinstate/offboard)"
      - "POST /research/funds, /research/funds/{id}/holdings, /assign-category, /liquidate"
      - "POST /research/categories"
      - "POST /research/methodologies* and /research/methodology-changes*"
      - "POST /research/ratings/compute, /publish, /withdraw"
      - "POST /research/data-disputes/{id}/investigate, /resolve"
      - "POST /_clock/set_current_utc"
    shared_operations: ["GET on all research resources"]
  - name: Analyst
    description: "Research analyst: opens committee proposals and votes; identity used for SoD"
    identity: opaque
    exclusive_operations:
      - "POST /research/ratings/{id}/proposals"
      - "POST /research/proposals/{id}/votes"
      - "POST /research/proposals/{id}/withdraw"
    shared_operations: ["GET on funds, ratings, methodologies, proposals, votes"]
  - name: LicenseAdmin
    description: "Licensing operations: licensees, agreements, seats, audits, indices"
    identity: opaque
    exclusive_operations:
      - "POST /research/licensees*, /research/license-agreements*, /research/seat-entitlements/{id}/revoke"
      - "POST /research/license-audits*"
      - "POST /research/indices*"
    shared_operations: ["GET on licensing and research resources"]
  - name: ComplianceOfficer
    description: "Conflict-of-interest governance: waives conflict flags"
    identity: opaque
    exclusive_operations:
      - "POST /research/conflict-flags/{id}/waive"
    shared_operations: ["GET on all resources"]
  - name: FundCompanyRep
    description: "External fund company representative; raises data-quality disputes on own funds. X-User-ID equals the FundCompany.id the rep belongs to (issuer check enforced against it)."
    identity: "entity_backed:FundCompany"
    exclusive_operations:
      - "POST /research/funds/{id}/disputes"
    shared_operations: ["GET on own company's funds, ratings, disputes"]
