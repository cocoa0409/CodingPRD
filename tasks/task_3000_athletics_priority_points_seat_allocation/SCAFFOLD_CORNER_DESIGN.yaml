          rationale: "The named §1.8 instance already asserts the tier selection on base_total_cents rather than the fee-inclusive total at the 49000/51940 boundary."

      - name: renewal_pricing_applies_the_escalator_under_its_ceiling
        claim_type: variant_divergence
        grounds:
          - calculations.seat_requirement_amount.variants
          - entities.SeatAssignment.fields.pricing_mode
        excluded_because:
          difficulty_instance: dual_variant_calc / renewal_vs_market_seat_requirement_diverge_after_reprice
          rationale: "The named §1.8 instance already asserts the RENEWAL 298513 versus MARKET 400000 divergence in a repriced section, covering both the escalator and the ceiling ratio."

      - name: loyalty_multiplier_threshold_is_inclusive_at_five_years
        claim_type: constants_applied
        grounds:
          - calculations.priority_point_score.constants
          - entities.Donor.fields.consecutive_giving_years
        excluded_because:
          difficulty_instance: boundary_precision_check / loyalty_multiplier_at_exactly_five_consecutive_years
          rationale: "The named §1.8 instance already asserts the 1.10 multiplier firing at exactly 5 consecutive years and not at 4."

  # ---------------------------------------------------------------------------
  # Table 4 (Validations) — claim-extraction-guide.md §4.
  # 27 numbered rules. Claims cover violation_to_error, satisfaction_to_pass and
  # priority_ordering, plus the pattern rows: priority conflict (including both
  # §1.4 carve-outs), cross-entity, temporal, aggregate and conditional
  # validation. Every ladder instance violates TWO rules at once and pins the
  # winner, so an implementation that checks in the wrong order fails.
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unknown_path_id_outranks_a_missing_required_body_field
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_DISPUTE_NOT_FOUND]
        distinguishing_aspect: |
          request-info requires info_note in the body, so a call with an empty
          body against a nonexistent dispute id violates priority 5 (existence)
          AND priority 6 (required fields) simultaneously. Priority 5 must win:
          404 ERR_DISPUTE_NOT_FOUND, not 400 ERR_INVALID_REQUEST. An
          implementation that deserialises and validates the payload before
          loading the row returns the wrong status.
        test_recipe:
          setup:
            - "Empty database; no PointDispute row exists with the probed id."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/point-disputes/00000000-0000-4000-8000-00000000d15e/request-info"
              payload: {}
              as: DisputeAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 404 with error.code == \"ERR_DISPUTE_NOT_FOUND\""
            - "The response body is NOT 400 and error.code is NOT \"ERR_INVALID_REQUEST\", even though the required info_note field is absent"

      - name: role_rejection_outranks_path_existence_for_an_unknown_section
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - endpoints[POST /athletics/sections/{id}/seats]
        distinguishing_aspect: |
          Seat creation is exclusive to PlatformAdmin. A DevelopmentOfficer
          calling it against a nonexistent section id violates priority 2 (role)
          and priority 5 (existence). Priority 2 must win with 403
          ERR_FORBIDDEN_ROLE, so the API never leaks whether the id exists to a
          caller who is not allowed on the endpoint at all.
        test_recipe:
          setup:
            - "Empty database; no Section row exists with the probed id."
          setup_api_calls: []
          trigger:
            - call: "POST /athletics/sections/00000000-0000-4000-8000-00000000cec7/seats"
              payload: { row_label: "Z", seat_number: 1 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 403 with error.code == \"ERR_FORBIDDEN_ROLE\""
            - "The response is NOT 404 and error.code is NOT \"ERR_SECTION_NOT_FOUND\""

      - name: an_empty_user_id_header_outranks_both_role_and_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 requires X-User-ID to be present AND non-empty. Sending the
          empty string (not a whitespace string, which would still be a present
          header with content) on an endpoint the role is not permitted on must
          produce 401 ERR_UNAUTHENTICATED, ahead of priority 2's 403. An
          implementation that only checks header presence returns 403.
        test_recipe:
          setup:
            - "Empty database; no rows are required because authentication is checked first."
          setup_api_calls: []
          trigger:
            - call: "GET /athletics/donors"
              payload: {}
              as: Donor
              as_user_id: ""
          assert:
            - "HTTP 401 with error.code == \"ERR_UNAUTHENTICATED\""
            - "The response is NOT 403 ERR_FORBIDDEN_ROLE, even though the Donor role is not listed on GET /athletics/donors"

      - name: pagination_bounds_are_enforced_at_both_ends_of_the_declared_range
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - endpoints[GET /athletics/donors]
        distinguishing_aspect: |
          Priority 6 pins limit to 1..100 inclusive and offset to at least 0.
          limit=100 must succeed while limit=101 must fail, and limit=0 must fail
          as well as offset=-1 — four probes that separate an inclusive bound from
          an exclusive one and a signed offset from an unsigned one. Failures must
          be 400 ERR_INVALID_REQUEST, never a silent clamp to the default.
        test_recipe:
          setup:
            - "One Donor row exists so that a successful list has something to return."
          setup_api_calls:
            - call: "POST /athletics/donors"
              payload: { full_name: "Pag Bounds", email: "pag.bounds@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /athletics/donors?limit=100"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors?limit=101"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors?limit=0"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors?offset=-1"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "limit=100 returns HTTP 200 with total_count == 1, has_more == false and exactly 1 element in data"
            - "limit=101 returns HTTP 400 with error.code == \"ERR_INVALID_REQUEST\" (the upper bound is inclusive at 100)"
            - "limit=0 returns HTTP 400 with error.code == \"ERR_INVALID_REQUEST\" (the lower bound is 1, not 0)"
            - "offset=-1 returns HTTP 400 with error.code == \"ERR_INVALID_REQUEST\" and no silent clamp to 0"

      - name: certifying_a_cycle_you_initiated_yourself_returns_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /athletics/point-recalculations]
        distinguishing_aspect: |
          initiated_by_user_id is captured from the CREATE call's X-User-ID, not
          from its role, so a PlatformAdmin creating the cycle while
          impersonating user id "certifier-1" poisons that id for certification.
          The same physical user then gets 403 ERR_SEGREGATION_OF_DUTIES even
          though the PointsCertifier role is correct and the OCC version matches,
          and a different user id succeeds against the SAME unchanged version —
          proving the check keys on X-User-ID and that the rejection performed no
          write.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "One donor with a 1000000-cent RECEIVED ATHLETICS_ANNUAL gift dated 2026-03-01."
            - "A PointRecalculation created by the PlatformAdmin role under X-User-ID \"certifier-1\", then run and communicated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Sol Duties", email: "sol.duties@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { sd_id: "$.data.id" }
            - call: "POST /athletics/donors/${sd_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "certifier-1"
              captures: { sdr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${sdr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${sdr_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-recalculations/${sdr_id}"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
              captures: { sdr_v: "$.data.version" }
          trigger:
            - call: "POST /athletics/point-recalculations/${sdr_id}/certify"
              payload: { expected_recalculation_version: "${sdr_v}" }
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "POST /athletics/point-recalculations/${sdr_id}/certify"
              payload: { expected_recalculation_version: "${sdr_v}" }
              as: PointsCertifier
              as_user_id: "certifier-2"
          assert:
            - "PointRecalculation.${sdr_id}.initiated_by_user_id == \"certifier-1\" before the trigger"
            - "First certify: HTTP 403 with error.code == \"ERR_SEGREGATION_OF_DUTIES\" (NOT 412 and NOT 409)"
            - "After the rejection PointRecalculation.${sdr_id}.status is still \"COMMUNICATED\", version is still ${sdr_v}, certified_by_user_id is null and Donor.${sd_id}.rank_position is null"
            - "Second certify with the SAME expected_recalculation_version ${sdr_v} but user id \"certifier-2\": HTTP 200, status == \"CERTIFIED\", certified_by_user_id == \"certifier-2\", certified_at == \"2026-04-01T00:00:00.000Z\""
            - "Donor.${sd_id}.rank_position == 1 and PointRecalculation.${sdr_id}.certified_points_sum == 15.00"

      - name: deciding_a_dispute_you_reviewed_yourself_returns_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - endpoints[POST /athletics/point-disputes/{id}/review]
          - endpoints[POST /athletics/point-disputes/{id}/decide]
        distinguishing_aspect: |
          The dispute arm of priority 4 compares X-User-ID against
          reviewed_by_user_id, which is stamped on the FIRST review only. A
          DisputeAnalyst reviewing under user id "policy-1" therefore blocks the
          PolicyCommittee user "policy-1" from deciding, while "policy-2"
          succeeds. This is the second, independent comparand of the same rule —
          an implementation that only guards certify passes the previous instance
          and fails this one.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z (inside the dispute window that ends 2026-09-30T00:00:00.000Z)."
            - "One donor scored to 15.00 by a run, with the recalculation COMMUNICATED."
            - "One PointDispute filed by the donor and taken UNDER_REVIEW by the DisputeAnalyst role acting under X-User-ID \"policy-1\"."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Duna Review", email: "duna.review@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { dur_id: "$.data.id" }
            - call: "POST /athletics/donors/${dur_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { durr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${durr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${durr_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-disputes"
              payload: { donor_id: "${dur_id}", recalculation_id: "${durr_id}", claimed_points_delta: 5.00, basis_note: "A 2024 athletics annual gift is missing from the scored input set" }
              as: Donor
              as_user_id: "${dur_id}"
              captures: { durd_id: "$.data.id" }
            - call: "POST /athletics/point-disputes/${durd_id}/review"
              payload: {}
              as: DisputeAnalyst
              as_user_id: "policy-1"
          trigger:
            - call: "POST /athletics/point-disputes/${durd_id}/decide"
              payload: { decision: "UPHOLD", granted_points_delta: 5.00 }
              as: PolicyCommittee
              as_user_id: "policy-1"
            - call: "POST /athletics/point-disputes/${durd_id}/decide"
              payload: { decision: "UPHOLD", granted_points_delta: 5.00 }
              as: PolicyCommittee
              as_user_id: "policy-2"
          assert:
            - "PointDispute.${durd_id}.reviewed_by_user_id == \"policy-1\" and status == \"UNDER_REVIEW\" before the trigger"
            - "First decide: HTTP 403 with error.code == \"ERR_SEGREGATION_OF_DUTIES\""
            - "After the rejection PointDispute.${durd_id}.status is still \"UNDER_REVIEW\", decided_by_user_id is null, granted_points_delta is null, and Donor.${dur_id}.dispute_adjustment_points == 0.00 with certified_points == 15.00"
            - "Second decide as \"policy-2\": HTTP 200, status == \"UPHELD\", decided_by_user_id == \"policy-2\", granted_points_delta == 5.00"
            - "Donor.${dur_id}.dispute_adjustment_points == 5.00 and certified_points == 20.00 in the same request's effect"

      - name: household_link_rejects_a_non_joint_partner_and_a_self_link
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_HOUSEHOLD_LINK_INVALID]
          - endpoints[POST /athletics/donors/{id}/household-link]
        distinguishing_aspect: |
          Priority 22 is a conjunction of three clauses. Two of them are probed
          here with the OCC version held valid throughout: linking a
          JOINT_HOUSEHOLD donor to an INDIVIDUAL partner fails the entity_type
          clause, and linking a donor to itself fails the different-donor clause
          even though both entity_type checks would pass. Both must be 409
          ERR_HOUSEHOLD_LINK_INVALID rather than 400 or 422, and the valid link
          must then succeed with the partner recorded on BOTH rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donor H1 and Donor H2 both entity_type JOINT_HOUSEHOLD, plus Donor H3 entity_type INDIVIDUAL. No donor is linked yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Hana Joint", email: "hana.joint@example.com", alumni_status: "NON_ALUMNUS", entity_type: "JOINT_HOUSEHOLD" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { h1_id: "$.data.id", h1_v: "$.data.version" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Hugo Joint", email: "hugo.joint@example.com", alumni_status: "NON_ALUMNUS", entity_type: "JOINT_HOUSEHOLD" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { h2_id: "$.data.id" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Hana Single", email: "hana.single@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { h3_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/donors/${h1_id}/household-link"
              payload: { partner_donor_id: "${h3_id}", expected_donor_version: "${h1_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${h1_id}/household-link"
              payload: { partner_donor_id: "${h1_id}", expected_donor_version: "${h1_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${h1_id}/household-link"
              payload: { partner_donor_id: "${h2_id}", expected_donor_version: "${h1_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Link to the INDIVIDUAL donor: HTTP 409 with error.code == \"ERR_HOUSEHOLD_LINK_INVALID\""
            - "Self-link: HTTP 409 with error.code == \"ERR_HOUSEHOLD_LINK_INVALID\" (NOT 400 ERR_INVALID_REQUEST)"
            - "After both rejections Donor.${h1_id}.version is still ${h1_v} and household_partner_donor_id is still null, so the SAME version is reusable"
            - "Valid link to the JOINT_HOUSEHOLD donor: HTTP 200 with Donor.${h1_id}.household_partner_donor_id == \"${h2_id}\" and version == ${h1_v} + 1"
            - "Donor.${h2_id}.household_partner_donor_id == \"${h1_id}\" (the link is written on both rows)"
            - "Donor.${h3_id}.household_partner_donor_id is still null"

      - name: granting_a_relocation_onto_a_seat_outside_the_target_section_returns_target_invalid
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_RELOCATION_TARGET_INVALID]
          - endpoints[POST /athletics/relocation-requests/{id}/decide]
        distinguishing_aspect: |
          Priority 23 has two clauses — target_seat_id must be PRESENT and it must
          belong to target_section_id — and its validity depends on a different
          entity (the Seat's section_id) than the one being mutated. Naming an
          AVAILABLE seat that sits in the donor's ORIGIN section satisfies
          priority 17 but violates 23, so the failure cannot be explained as a
          seat-availability problem; omitting target_seat_id entirely must fail
