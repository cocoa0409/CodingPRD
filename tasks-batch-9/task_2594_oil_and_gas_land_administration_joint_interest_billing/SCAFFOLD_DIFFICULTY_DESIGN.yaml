      - name: dispute_adjustment_cascades_three_hops_into_sibling_dispute_expiry
        grounds:
          - state_machines.BillingDispute.OPERATOR_RESPONDED_to_RESOLVED_ADJUSTED
          - state_machines.JibStatement.DISPUTED_to_ADJUSTED
          - entities.JibStatement.fields.superseded_statement_id
          - entities.BillingDispute.fields.deemed_in_favor_of_partner
          - endpoints.POST_/land-admin/disputes/{dispute_id}/resolution
        depth: 3
        chain: "BillingDispute.dispute_status -> JibStatement.statement_status and Well.billed_to_date_cents -> a superseding DRAFT JibStatement -> sibling BillingDispute.dispute_status"
        distinguishing_aspect: |
          A different trigger from the obligation-run cascade: an AuditReviewer resolving one partner's
          dispute ADJUSTED. Hop 1 de-bills the well BECAUSE the adjusted statement leaves the billed
          set, taking Well.billed_to_date_cents from 1153008 to 0. Hop 2 creates the superseding DRAFT
          statement BECAUSE the period still has to be billed and the adjusted row is terminal. Hop 3
          expires OA's still-OPEN dispute with deemed_in_favor_of_partner true BECAUSE the superseding
          draft means the bill OA contested no longer exists - OA's dispute is never touched directly.
        test_recipe:
