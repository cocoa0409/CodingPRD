      - name: delay_moving_departure_earlier_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_45
          - errors.ERR_SCHEDULE_NOT_MONOTONIC
        distinguishing_aspect: "A delay may only push the departure later: 01:00Z is before the stored 02:00Z, so the leg refuses the write with 422 ERR_SCHEDULE_NOT_MONOTONIC even though the supplied pair is internally consistent and would satisfy priority 44."
        test_recipe:
          setup:
            - "AN101 HKG->LAX scheduled 2026-09-10T02:00Z -> 15:00Z, status SCHEDULED, block_minutes 780"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
          trigger:
            - { call: "POST /flight-legs/${leg1}/delay", payload: { new_departure_utc: "2026-09-10T01:00:00Z", new_arrival_utc: "2026-09-10T14:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 422 with error_id ERR_SCHEDULE_NOT_MONOTONIC"
            - "FlightLeg.${leg1}.scheduled_departure_utc == 2026-09-10T02:00:00Z and FlightLeg.${leg1}.status == SCHEDULED"
            - "FlightLeg.${leg1}.block_minutes == 780 and FlightLeg.${leg1}.version is unchanged"
            - "a delay to 2026-09-10T04:00:00Z -> 2026-09-10T18:00:00Z is accepted and moves the leg to DELAYED"

      - name: clock_set_to_earlier_instant_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_49
          - errors.ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: "The logical clock is monotonic non-decreasing: rewinding one day is refused with 422 ERR_CLOCK_NOT_MONOTONIC while setting it to the identical instant it already holds is accepted."
        test_recipe:
          setup:
            - "The logical clock has been advanced from its default 2026-08-01T00:00:00Z to 2026-08-05T08:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T08:00:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 422 with error_id ERR_CLOCK_NOT_MONOTONIC"
            - "GET /_clock still reports 2026-08-05T08:00:00Z"
            - "re-setting the clock to exactly 2026-08-05T08:00:00Z returns 200, since the comparison is >= and not >"

      - name: duplicate_station_iata_code_rejected
        claim_type: uniqueness
        grounds:
          - validations.priority_42
          - errors.ERR_DUPLICATE_STATION_CODE
        distinguishing_aspect: "iata_code is globally unique across Station, so a second HKG row is refused with 409 ERR_DUPLICATE_STATION_CODE even when its country_code and kennel_bay_count differ from the stored row."
        test_recipe:
          setup:
            - "Station HKG (HK) with kennel_bay_count 4 already exists"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
          trigger:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "CN", kennel_bay_count: 9 }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 409 with error_id ERR_DUPLICATE_STATION_CODE"
            - "GET /stations returns total_count 1"
            - "Station.${st_hkg}.country_code == HK and Station.${st_hkg}.kennel_bay_count == 4"

      - name: duplicate_active_breed_restriction_rejected
        claim_type: uniqueness
        grounds:
          - validations.priority_43
          - errors.ERR_DUPLICATE_BREED_RESTRICTION
        distinguishing_aspect: "Uniqueness is scoped to (species_profile_id, LOWERCASED breed_name) among ACTIVE rows only, so BULLDOG collides with the stored bulldog despite the differing case and the differing restriction_type."
        test_recipe:
          setup:
            - "SpeciesProfile DOG with one ACTIVE SNUB_NOSED BreedRestriction on 'bulldog'"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /breed-restrictions", payload: { species_profile_id: "${sp_dog}", breed_name: "bulldog", restriction_type: "SNUB_NOSED" }, as: ProgramAdmin, as_user_id: "admin-01", captures: { br1: $.data.id } }
          trigger:
            - { call: "POST /breed-restrictions", payload: { species_profile_id: "${sp_dog}", breed_name: "BULLDOG", restriction_type: "CARGO_ONLY" }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 409 with error_id ERR_DUPLICATE_BREED_RESTRICTION"
            - "SpeciesProfile.${sp_dog}.breed_restriction_count == 1"
            - "GET /species-profiles/${sp_dog}/breed-restrictions with status ACTIVE returns only ${br1}"
            - "after PUT /breed-restrictions/${br1}/status to WITHDRAWN the same BULLDOG create succeeds, since only ACTIVE rows participate"

      - name: incident_citing_another_animals_segment_rejected
        claim_type: referential_scope
        grounds:
          - validations.priority_39
          - errors.ERR_SEGMENT_ANIMAL_MISMATCH
        distinguishing_aspect: "Both foreign keys exist, so the 404 sweep at priority 7 passes; what fails is the RELATIONSHIP between them - the cited segment belongs to a different animal - giving 422 ERR_SEGMENT_ANIMAL_MISMATCH."
        test_recipe:
          setup:
            - "Two CHECKED reservations, each with one screened animal"
            - "Animal A holds a RESERVED sequence-1 segment on AN101; animal B holds no segment"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Lam", contact_email: "lam@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res2: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res2}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Taro", breed_name: "Beagle", declared_weight_kg: 12, height_at_shoulder_cm: 30, length_nose_to_tail_cm: 45, age_weeks: 40 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an2: $.data.id } }
            - { call: "POST /animal-records/${an2}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          trigger:
            - { call: "POST /animal-incidents", payload: { animal_record_id: "${an2}", segment_assignment_id: "${seg1}", incident_type: "INJURY", discovered_at_utc: "2026-08-01T12:00:00Z" }, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 422 with error_id ERR_SEGMENT_ANIMAL_MISMATCH"
            - "GET /animal-incidents with animal_record_id ${an2} returns an empty list"
            - "AnimalRecord.${an2}.status == SCREENED, so no cascade ran"

      - name: screen_with_retired_species_rejected
        claim_type: state_precondition
        grounds:
          - validations.priority_19
          - errors.ERR_SPECIES_RETIRED
        distinguishing_aspect: "The species lifecycle is re-checked at screening time, not only at animal creation: a record created while DOG was ACTIVE can no longer be screened once the profile is RETIRED, and the failure is 422 ERR_SPECIES_RETIRED rather than a 404."
        test_recipe:
          setup:
            - "SpeciesProfile DOG created ACTIVE, an animal record created under it, then the profile moved to RETIRED"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "PUT /species-profiles/${sp_dog}/status", payload: { status: "RETIRED" }, as: ProgramAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 422 with error_id ERR_SPECIES_RETIRED"
            - "AnimalRecord.${an1}.status == DRAFT and AnimalRecord.${an1}.container_compliance_state == UNEVALUATED"
            - "AnimalRecord.${an1}.chargeable_weight_kg is null, so no pricing basis was derived"

      - name: screen_of_banned_breed_rejected
        claim_type: business_rule
        grounds:
          - validations.priority_21
          - errors.ERR_BREED_BANNED
        distinguishing_aspect: "The BANNED match is case-insensitive on breed_name, so an animal booked as 'labrador' trips a restriction stored as 'Labrador' and is refused at 422 ERR_BREED_BANNED before the age check at priority 22 that it would also fail."
        test_recipe:
          setup:
            - "SpeciesProfile DOG with min_age_weeks 16 and an ACTIVE BANNED BreedRestriction on 'Labrador'"
            - "An animal booked as breed 'labrador' aged only 10 weeks, so both priority 21 and priority 22 would fail"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /breed-restrictions", payload: { species_profile_id: "${sp_dog}", breed_name: "Labrador", restriction_type: "BANNED" }, as: ProgramAdmin, as_user_id: "admin-01", captures: { br_ban: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 10 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 422 with error_id ERR_BREED_BANNED"
            - "the error is not ERR_ANIMAL_UNDERAGE, proving the declared priority order 21 before 22"
            - "AnimalRecord.${an1}.status == DRAFT"
            - "SpeciesProfile.${sp_dog}.breed_restriction_count == 1"

      - name: screen_of_underage_animal_rejected
        claim_type: business_rule
        grounds:
          - validations.priority_22
          - errors.ERR_ANIMAL_UNDERAGE
        distinguishing_aspect: "The minimum age comes from the animal's own SpeciesProfile rather than a global constant, and the comparison is >=: 15 weeks against min_age_weeks 16 is refused with 422 ERR_ANIMAL_UNDERAGE while exactly 16 weeks screens successfully."
        test_recipe:
          setup:
            - "SpeciesProfile DOG with min_age_weeks 16 and no breed restrictions"
            - "An animal aged 15 weeks whose container is otherwise fully compliant"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 15 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 422 with error_id ERR_ANIMAL_UNDERAGE"
            - "AnimalRecord.${an1}.status == DRAFT and deficiency_codes == []"
            - "the same animal at age_weeks 16 screens with 200 and container_compliance_state COMPLIANT"

      - name: cargo_only_species_on_checked_routing_rejected
        claim_type: business_rule
        grounds:
          - validations.priority_23
          - errors.ERR_ROUTING_NOT_PERMITTED_FOR_BREED
        distinguishing_aspect: "The CARGO_ONLY constraint can come from the SPECIES acceptance_class rather than a breed restriction, and it is enforced against the owning reservation's routing_type: a CARGO_ONLY species booked CHECKED is refused with 422 ERR_ROUTING_NOT_PERMITTED_FOR_BREED even though the species is not EMBARGOED_SPECIES."
        test_recipe:
          setup:
            - "SpeciesProfile REPTILE with acceptance_class CARGO_ONLY and min_age_weeks 8"
            - "A CHECKED reservation whose animal is a fully compliant REPTILE aged 30 weeks"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "REPTILE", common_name: "Reptile", acceptance_class: "CARGO_ONLY", max_cabin_weight_kg: 0, min_age_weeks: 8 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_rep: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_rep}", container_model_id: "${cm_k9l}", animal_name: "Sunny", breed_name: "Iguana", declared_weight_kg: 6, height_at_shoulder_cm: 20, length_nose_to_tail_cm: 40, age_weeks: 30 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 422 with error_id ERR_ROUTING_NOT_PERMITTED_FOR_BREED"
            - "the error is not ERR_SPECIES_NOT_ACCEPTED: acceptance_class CARGO_ONLY is not EMBARGOED_SPECIES"
            - "AnimalRecord.${an1}.status == DRAFT"
            - "the identical animal under a CARGO reservation screens with 200"

      - name: cabin_acceptance_above_species_cabin_weight_rejected
        claim_type: business_rule
        grounds:
          - validations.priority_25
          - errors.ERR_CABIN_WEIGHT_EXCEEDED
        distinguishing_aspect: "The cabin weight ceiling is enforced at ACCEPTANCE against the measured weight, not at screening against the declared weight: a 10 kg gross animal that screened cleanly is refused at 422 ERR_CABIN_WEIGHT_EXCEEDED once the counter scale reports 15 kg, making gross 17 against max_cabin_weight_kg 12."
        test_recipe:
          setup:
            - "SpeciesProfile DOG with max_cabin_weight_kg 12; cabin-eligible container CABIN-S 35 x 25 x 28, tare 2, ventilation 10 pct over 2 sides"
            - "A CABIN reservation booked by agent-01 whose animal declared 8 kg screens COMPLIANT at chargeable 10, is marked TRAVEL_READY, compliance is verified with no destination requirements on file, and the reservation is CONFIRMED"
            - "The counter then amends measured_weight_kg to 15"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "CABIN-S", interior_length_cm: 35, interior_width_cm: 25, interior_height_cm: 28, tare_weight_kg: 2, ventilation_area_pct: 10, ventilated_side_count: 2, wheels_removable: false, cabin_eligible: true }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_cabin: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CABIN" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_cabin}", animal_name: "Pip", breed_name: "Terrier", declared_weight_kg: 8, height_at_shoulder_cm: 20, length_nose_to_tail_cm: 30, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CABIN", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "POST /animal-records/${an1}/mark-travel-ready", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /reservations/${res1}/verify-compliance", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: ReservationsAgent, as_user_id: "agent-01" }
            - { call: "PUT /animal-records/${an1}", payload: { measured_weight_kg: 15 }, as: AcceptanceAgent, as_user_id: "accept-02" }
          trigger:
            - { call: "POST /segment-assignments/${seg1}/accept", payload: {}, as: AcceptanceAgent, as_user_id: "accept-02" }
          assert:
            - "response status is 422 with error_id ERR_CABIN_WEIGHT_EXCEEDED"
            - "SegmentAssignment.${seg1}.status == RESERVED and SegmentAssignment.${seg1}.fee_variant == PROVISIONAL"
            - "AnimalRecord.${an1}.status == TRAVEL_READY and container_compliance_state == COMPLIANT, so the failure is the weight gate and not priority 26"
            - "FlightLeg.${leg1}.booked_cabin_count == 1, unchanged by the refused acceptance"
            - "an amendment back to measured_weight_kg 10 makes the same acceptance return 200"

      - name: priority_ordering_between_station_suspension_and_routing_limit
        claim_type: priority_ordering
        grounds:
          - validations.priority_29
          - validations.priority_50
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / station_suspension_outranks_routing_limit_rejected
          rationale: "The named §1.8 instance builds a state in which both gates fail and asserts the lower-priority error is the one returned."
        
      - name: priority_ordering_between_connection_minimum_and_routing_limit
        claim_type: priority_ordering
        grounds:
          - validations.priority_47
          - validations.priority_50
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / connection_minimum_outranks_routing_limit_rejected
          rationale: "The named §1.8 instance makes the sub-minimum connection and the exhausted routing limit fail together and pins ERR_CONNECTION_BELOW_MINIMUM as the response."

  - section: endpoints
    instances:
      - name: charge_summary_reports_invariant_holds_true
        claim_type: computed_read
        grounds:
          - endpoints.GET /reservations/{id}/charge-summary
          - calculations.reservation_charge_assembly
        distinguishing_aspect: "The charge summary is a pure projection: it recomputes nothing and writes nothing, returning the seven stored money fields plus the boolean invariant subtotal == net + discount + refunded, which holds at 33180 == 33180 + 0 + 0 on a freshly priced reservation."
        test_recipe:
          setup:
            - "A CHECKED reservation whose screened 20 kg Labrador holds a RESERVED sequence-1 segment on AN101, priced provisionally at 33180"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
