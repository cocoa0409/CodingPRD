# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1863: Real Estate Syndication & Investor Relations
#
# Enumerates every testable claim declared by SCAFFOLD.yaml §1.1–§1.7 that
# §1.8 does NOT already cover. Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, computed, system fields
  # ===========================================================================
  - section: entities
    instances:

      - name: syndication_create_returns_draft_with_common_fields
        claim_type: creation
        grounds: [entities.Syndication, endpoints]
        distinguishing_aspect: "POST /syndications returns 201 with id (UUID), created_at, updated_at, version=1, status=DRAFT"
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /syndications"
              payload: { syndication_name: "NewSyn", sponsor_legal_entity: "New LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id", syn_v: "$.data.version" }
          assert:
            - "HTTP status == 201"
            - "data.id is a UUID with no prefix"
            - "data.version == 1"
            - "data.status == DRAFT"
            - "data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"

      - name: syndication_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Syndication.fields.syndication_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required input field syndication_name -> ERR_INVALID_REQUEST (400)"
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /syndications"
              payload: { sponsor_legal_entity: "New LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: investor_create_portal_access_defaults_invited
        claim_type: defaults
        grounds: [entities.Investor.fields.portal_access_status]
        distinguishing_aspect: "Investor.portal_access_status defaults to INVITED on creation"
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { full_legal_name: "D Inv", tax_id_last4: "1234", email: "d@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
          assert:
            - "Investor.portal_access_status == INVITED"

      - name: offering_create_total_committed_funded_distributed_zero
        claim_type: defaults
        grounds: [entities.Offering.fields.total_committed_cents, entities.Offering.fields.total_funded_cents]
        distinguishing_aspect: "Offering's three aggregate cents fields initialize to 0 on creation"
        test_recipe:
          setup: ["One ACTIVE syndication; one OWNED property"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "D Syn", sponsor_legal_entity: "D LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "D Prop", street_address: "1 D St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "D Off", target_raise_cents: 1000000, min_subscription_cents: 10000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: "$.data.id" }
          assert:
            - "Offering.total_committed_cents == 0"
            - "Offering.total_funded_cents == 0"
            - "Offering.total_distributed_cents == 0"
            - "Offering.unreturned_capital_cents == 0"
            - "Offering.status == DRAFT"

      - name: subscription_create_initializes_computed_fields
        claim_type: computed_fields
        grounds: [entities.Subscription.fields.funded_cents, entities.Subscription.fields.accrued_pref_cents]
        distinguishing_aspect: "Subscription funded_cents, accrued_pref_cents, unreturned_capital_cents initialize to 0 (system-set; client input ignored)"
        test_recipe:
          setup: ["One OPEN offering"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "CF Syn", sponsor_legal_entity: "CF LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "CF Prop", street_address: "1 C St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "CF Off", target_raise_cents: 1000000, min_subscription_cents: 10000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /investors"
              payload: { full_legal_name: "CF Inv", tax_id_last4: "1111", email: "cf@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
              captures: { inv_id: "$.data.id" }
          trigger:
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 5000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.funded_cents == 0"
            - "Subscription.accrued_pref_cents == 0"
            - "Subscription.unreturned_capital_cents == 0"
            - "Subscription.status == DRAFT"

      - name: document_create_pending_review_default
        claim_type: defaults
        grounds: [entities.SubscriptionDocument.fields.review_status]
        distinguishing_aspect: "SubscriptionDocument.review_status defaults to PENDING_REVIEW; received_at stamped by server"
        test_recipe:
          setup: ["One DRAFT subscription"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "Doc Syn", sponsor_legal_entity: "Doc LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "Doc Prop", street_address: "2 D St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "Doc Off", target_raise_cents: 1000000, min_subscription_cents: 10000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /investors"
              payload: { full_legal_name: "Doc Inv", tax_id_last4: "1111", email: "doc@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
              captures: { inv_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 5000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "W9", file_uri: "s3://d/w9" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { doc_id: "$.data.id" }
          assert:
            - "SubscriptionDocument.review_status == PENDING_REVIEW"
            - "SubscriptionDocument.received_at is set"
            - "SubscriptionDocument.reviewed_by is null"

      - name: document_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.SubscriptionDocument]
        distinguishing_aspect: "SubscriptionDocument has common_fields: false — no updated_at, no version; the only mutation paths are /accept and /reject action endpoints (no PATCH/PUT)"
        test_recipe:
          setup: ["One PENDING_REVIEW SubscriptionDocument"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "ImSyn", sponsor_legal_entity: "Im LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "Im Prop", street_address: "3 I St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "Im Off", target_raise_cents: 1000000, min_subscription_cents: 10000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /investors"
              payload: { full_legal_name: "Im Inv", tax_id_last4: "1111", email: "im@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
              captures: { inv_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 5000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "W9", file_uri: "s3://i/w9" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { doc_id: "$.data.id" }
          trigger:
            - call: "GET /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${doc_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "SubscriptionDocument response has no updated_at field"
            - "SubscriptionDocument response has no version field"
            - "SubscriptionDocument has id and created_at"

      - name: get_syndication_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SYNDICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET with non-existent UUID -> 404 ERR_SYNDICATION_NOT_FOUND"
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /syndications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SponsorOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SYNDICATION_NOT_FOUND"
            - "HTTP status == 404"

      - name: offering_enum_invalid_status_filter
        claim_type: type_constraints
        grounds: [entities.Offering.fields.status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Filtering offerings by an unrecognized status enum value -> ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["One syndication with one offering"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "EnSyn", sponsor_legal_entity: "En LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
          trigger:
            - call: "GET /syndications/${syn_id}/offerings?status=BOGUS"
              payload: {}
              as: SponsorOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  # Section: state_machines — valid, invalid-from, precondition enforcement, terminal lockdown
  # ===========================================================================
  - section: state_machines
    instances:

      - name: syndication_close_from_draft_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Syndication, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /syndications/{id}/close from DRAFT (not ACTIVE) -> ERR_INVALID_STATE"
        test_recipe:
          setup: ["One DRAFT syndication"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "SSyn", sponsor_legal_entity: "SS LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
          trigger:
            - call: "POST /syndications/${syn_id}/close"
              payload: {}
              as: SponsorOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: subscription_submit_twice_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Subscription, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /submit from SUBMITTED (already past DRAFT) -> ERR_INVALID_STATE; state machine does not allow SUBMITTED -> SUBMITTED"
        test_recipe:
          setup: ["One subscription in SUBMITTED status"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "TSSyn", sponsor_legal_entity: "TS LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "TS Prop", street_address: "4 T St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "TS Off", target_raise_cents: 1000000, min_subscription_cents: 10000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /investors"
              payload: { full_legal_name: "TS Inv", tax_id_last4: "1111", email: "ts@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
              captures: { inv_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 5000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "SUBSCRIPTION_AGREEMENT", file_uri: "s3://t/sub" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { d_sub: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "W9", file_uri: "s3://t/w9" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { d_w9: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "SUITABILITY_QUESTIONNAIRE", file_uri: "s3://t/suit" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { d_suit: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${d_sub}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${d_w9}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${d_suit}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: terminal_distribution_cannot_be_approved
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Distribution]
        distinguishing_aspect: "Distribution in terminal PAID state cannot transition further; approve from PAID -> ERR_INVALID_STATE"
        test_recipe:
          setup: ["One distribution in PAID status"]
          setup_api_calls:
            - call: "POST /syndications"
              payload: { syndication_name: "TdSyn", sponsor_legal_entity: "Td LLC", preferred_return_pct_annual: 0.08, carried_interest_pct: 0.20 }
              as: SponsorOperator
              captures: { syn_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/activate"
              payload: {}
              as: SponsorOperator
            - call: "POST /properties"
              payload: { property_legal_name: "Td Prop", street_address: "5 T St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${prop_id}", offering_name: "Td Off", target_raise_cents: 1000000, min_subscription_cents: 10000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /investors"
              payload: { full_legal_name: "Td Inv", tax_id_last4: "1111", email: "td@x.com", investor_class: "ACCREDITED" }
              as: SponsorOperator
              captures: { inv_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 5000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "SUBSCRIPTION_AGREEMENT", file_uri: "s3://td/sub" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { d_sub: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "W9", file_uri: "s3://td/w9" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { d_w9: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "SUITABILITY_QUESTIONNAIRE", file_uri: "s3://td/suit" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { d_suit: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents"
              payload: { doc_type: "ACCREDITATION_LETTER", file_uri: "s3://td/acc" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { d_acc: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${d_sub}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${d_w9}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${d_suit}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/documents/${d_acc}/accept"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/submit"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/verify-accreditation"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_id}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/capital-calls"
              payload: { total_call_cents: 5000000, due_date: "2027-01-01T00:00:00Z" }
              as: SponsorOperator
              captures: { cc_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/capital-calls/${cc_id}/issue"
              payload: {}
              as: SponsorOperator
            - call: "GET /syndications/${syn_id}/offerings/${off_id}/capital-calls/${cc_id}/contributions"
              payload: {}
              as: SponsorOperator
              captures: { contrib_id: "$.data[0].id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/capital-calls/${cc_id}/contributions/${contrib_id}/receive-escrow"
              payload: { amount_cents: 5000000 }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/capital-calls/${cc_id}/contributions/${contrib_id}/release-escrow"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports"
              payload: { report_year: 2026, report_quarter: 1, noi_cents: 10000000, occupancy_pct: 0.95 }
              as: SponsorOperator
              captures: { qr_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/quarterly-reports/${qr_id}/publish"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/distributions"
              payload: { quarterly_report_id: "${qr_id}", distribution_kind: "QUARTERLY_OPERATING", total_distributable_cents: 1000000 }
              as: SponsorOperator
              captures: { dist_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/distributions/${dist_id}/calculate"
              payload: {}
              as: SponsorOperator
            - call: "GET /syndications/${syn_id}/offerings/${off_id}/distributions/${dist_id}"
              payload: {}
              as: SponsorOperator
              captures: { dist_ver: "$.data.version" }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/distributions/${dist_id}/approve"
              payload: { expected_distribution_version: "${dist_ver}" }
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/distributions/${dist_id}/pay"
              payload: {}
