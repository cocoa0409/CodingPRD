            - call: "POST /studies/${study_id}/guide/approve"
              payload: {}
              as: ResearchLead
              as_user_id: "u_lead_1"
            - call: "POST /themes"
              payload: { label: "Admin confusion" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { th_id: $.data.id }
            - call: "POST /findings"
              payload: { study_id: "${study_id}", theme_id: "${th_id}", statement: "New admins stall on the invite screen", severity: "MEDIUM" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { f1_id: $.data.id }
          trigger:
            - call: "GET /studies/${study_id}"
