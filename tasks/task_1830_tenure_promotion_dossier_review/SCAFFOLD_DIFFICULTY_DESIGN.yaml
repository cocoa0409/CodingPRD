      - name: quorum_exactly_met_certify_succeeds
        grounds:
          - calculations.vote_tally
          - state_machines.ReviewRound.TALLYING_to_COMPLETED
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: |
          Boundary on the vote-turnout metric via certify: committee of 4
          MEMBERs + 1 CHAIR gives M = 5 and quorum_required = ceil(0.5*5) = 3;
          exactly 3 ballots cast satisfies votes_cast >= quorum_required (the
          >= boundary, not >), so certification succeeds.
        test_recipe:
