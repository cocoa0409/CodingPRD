      - name: appeal_denied_cycles_the_incident_back_to_counted_and_thaws_frozen_dunning
        grounds:
          - state_machines.FalseAlarmIncident.COUNTED_to_APPEALED
          - state_machines.FalseAlarmIncident.APPEALED_to_COUNTED
          - state_machines.Appeal.HEARD_to_DENIED
          - state_machines.PenaltyInvoice.CURRENT_to_NOTICE
          - calculations.delinquency_escalation
        distinguishing_aspect: >-
