              as_user_id: "${applicant_a_id}"
              captures: { facility_a_id: $.data.id }
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_b_id}", name: "District Wellfield", facility_type: "UTILITY", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_b_id}"
              captures: { facility_b_id: $.data.id }
            - call: "POST /public-assistance/facilities/${facility_a_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities/${facility_b_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_a_id}", facility_id: "${facility_a_id}", category: "C", title: "Pump station rebuild", scope_of_work: "Rebuild the pump station", estimated_repair_cost_cents: 100000000 }
              as: ApplicantAgent
              as_user_id: "${applicant_a_id}"
              captures: { project_a_id: $.data.id }
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_b_id}", facility_id: "${facility_b_id}", category: "C", title: "Wellfield rebuild", scope_of_work: "Rebuild the wellfield", estimated_repair_cost_cents: 99999999 }
              as: ApplicantAgent
              as_user_id: "${applicant_b_id}"
              captures: { project_b_id: $.data.id }
            - call: "POST /public-assistance/projects/${project_a_id}/submit"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_a_id}"
            - call: "POST /public-assistance/projects/${project_b_id}/submit"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_b_id}"
            - call: "POST /public-assistance/projects/${project_a_id}/cost-review"
              payload: { decision: "VALIDATE" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects/${project_b_id}/cost-review"
              payload: { decision: "VALIDATE" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /public-assistance/projects/${project_a_id}/obligate"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
            - call: "POST /public-assistance/projects/${project_b_id}/obligate"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
          assert:
            - "Project.${project_a_id}.federal_share_obligated_cents == 75000000 (round_half_up(100000000 * 0.75)) and size_class == LARGE"
            - "Project.${project_b_id}.federal_share_obligated_cents == 74999999 (round_half_up(74999999.25)) and size_class == LARGE"
            - "Applicant.${applicant_a_id}.total_obligated_cents == 75000000, audit_requirement == SINGLE_AUDIT, monitoring_status == ENHANCED (the threshold is inclusive)"
            - "Applicant.${applicant_b_id}.total_obligated_cents == 74999999, audit_requirement == NONE, monitoring_status == STANDARD (one cent short changes nothing)"
            - "GET /public-assistance/progress-reports?applicant_id=${applicant_a_id} -> total_count == 1 with quarter_label '2026-Q3', period_start_at '2026-07-01T00:00:00Z', period_end_at '2026-10-01T00:00:00Z', due_at '2026-10-31T00:00:00Z' and status DUE"
            - "GET /public-assistance/progress-reports?applicant_id=${applicant_b_id} -> total_count == 0"
            - "Disaster.${disaster_id}.enhanced_monitoring_applicant_count == 1 and total_obligated_cents == 149999999"

      - name: obligation_cascade_reaches_four_levels_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Project.VALIDATED_to_OBLIGATED
        excluded_because:
          difficulty_instance: transitive_cascade / obligate_cascade_project_to_applicant_to_audit_to_report_to_disaster
          rationale: "That §1.8 instance already walks cascade origin A end to end (project share -> applicant ledger -> audit and monitoring escalation -> auto ProgressReport -> declaration counters) and asserts the ordering dependency between the escalation and the report creation."

      - name: provisional_and_final_variants_diverge_on_the_same_project
        claim_type: dual_variant_calculation
        grounds:
          - calculations.project_eligible_cost.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / project_eligible_cost_provisional_vs_final_divergence
          rationale: "That §1.8 instance holds both variants side by side on one project and pins the delta produced by documented actuals and a recorded settlement, which is exactly the variant-divergence claim."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: obligation_cascade_is_fully_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - state_machines.Project.VALIDATED_to_OBLIGATED
        distinguishing_aspect: "The deepest cascade in the system is still synchronous: the obligate response already carries the recomputed project share, and the very next reads of the applicant, the auto-created report and the declaration are correct with no delay, retry or sweep."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z, declaration DR-5000 at the default 0.75 federal cost share."
            - "Applicant ELIGIBLE with one ELIGIBLE facility and a validated project of estimate 100000000 (no cost lines, no insurance)."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-5000", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "Local government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "POST /public-assistance/facilities/${facility_id}/screen"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "POST /public-assistance/projects"
              payload: { applicant_id: "${applicant_id}", facility_id: "${facility_id}", category: "C", title: "Pump station rebuild", scope_of_work: "Rebuild the pump station", estimated_repair_cost_cents: 100000000 }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id }
            - call: "POST /public-assistance/projects/${project_id}/submit"
              payload: {}
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "POST /public-assistance/projects/${project_id}/cost-review"
              payload: { decision: "VALIDATE" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /public-assistance/projects/${project_id}/obligate"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
            - call: "GET /public-assistance/applicants/${applicant_id}"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
            - call: "GET /public-assistance/progress-reports?applicant_id=${applicant_id}"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
            - call: "GET /public-assistance/disasters/${disaster_id}"
              payload: {}
              as: GrantsOfficer
              as_user_id: "officer-1"
          assert:
            - "the obligate response body itself already shows status == OBLIGATED, federal_share_obligated_cents == 75000000 and obligated_by_user_id == 'officer-1'"
            - "the immediately following applicant read shows total_obligated_cents == 75000000, available_drawdown_cents == 75000000, audit_requirement == SINGLE_AUDIT and monitoring_status == ENHANCED"
            - "the immediately following report list shows total_count == 1 with status DUE and quarter_label '2026-Q3' — no sweep was needed to materialise it"
            - "the immediately following declaration read shows total_obligated_cents == 75000000 and enhanced_monitoring_applicant_count == 1"
            - "every one of those reads is correct on its first call: repeating any of them returns byte-identical data, so nothing in the cascade is deferred"
