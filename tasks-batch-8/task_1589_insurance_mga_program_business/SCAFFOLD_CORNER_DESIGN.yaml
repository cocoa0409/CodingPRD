        claim_type: violation_to_error
        grounds: ["roles.CarrierUnderwriter", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Carrier ownership scoping: carrier B's underwriter suspending carrier A's program -> 403 ERR_FORBIDDEN (X-User-ID != program.carrier_id)."
        test_recipe:
          setup: ["carrier A with program; carrier B exists"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier RB6A", naic_code: "NAIC-RB6A", contact_email: "a@rb6.com" }, as: PlatformAdmin, captures: { caA: $.data.id } }
            - { call: "POST /mga/carriers", payload: { name: "Carrier RB6B", naic_code: "NAIC-RB6B", contact_email: "b@rb6.com" }, as: PlatformAdmin, captures: { caB: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${caA}", name: "RB6 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /mga/programs/${prog}/suspend", payload: {}, as: CarrierUnderwriter, as_user_id: "${caB}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (correct role, wrong carrier identity)"

      - name: rbac_platform_admin_cannot_bind_forbidden
        claim_type: violation_to_error
        grounds: ["roles.PlatformAdmin", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "PlatformAdmin is infrastructure-only: policy bind -> 403 (ops power does not imply underwriting authority)."
        test_recipe:
          setup: ["empty database (role check fires first)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mga/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/bind", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN"

      - name: rbac_tpa_adjuster_cannot_create_program_forbidden
        claim_type: violation_to_error
        grounds: ["roles.TPAAdjuster", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "TPAAdjuster has no program-creation right: POST /mga/programs -> 403."
        test_recipe:
          setup: ["carrier exists"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier RB8", naic_code: "NAIC-RB8", contact_email: "a@rb8.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
          trigger:
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "Nope", line_of_business: "PROPERTY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: TPAAdjuster, as_user_id: "00000000-0000-4000-8000-000000000000", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_guideline_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[guideline-create-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Program.version: a guideline create carrying the pre-supersede version (captured before another guideline create bumped it) is rejected 412 ERR_STALE_VERSION; the same call with a fresh version succeeds and bumps version by exactly 1."
        test_recipe:
          setup: ["program PROPOSED v1; guideline G1 created with expected 1 (program now v2)"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier OC1", naic_code: "NAIC-OC1", contact_email: "a@oc1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "OC1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, v1: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${v1}" }, as: MGAUnderwriter, captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "TRUCKING", max_policy_premium_cents: 400000, max_policy_limit_cents: 2000000, min_policy_premium_cents: 8000, expected_program_version: "${v1}" }, as: MGAUnderwriter, captures: { err: $.data.error_id } }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { v_now: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "TRUCKING", max_policy_premium_cents: 400000, max_policy_limit_cents: 2000000, min_policy_premium_cents: 8000, expected_program_version: "${v_now}" }, as: MGAUnderwriter, captures: { g2: $.data.id } }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { v_end: $.data.version } }
          assert:
            - "stale create (expected_program_version == 1 while program is v2): error_id == ERR_STALE_VERSION, http 412"
            - "fresh create succeeds; program.version went 1 -> 2 (G1) -> 3 (G2): ${v_end} == ${v1} + 2"
            - "G1 remains ACTIVE (different scope; no supersede)"

      - name: occ_capacity_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[capacity-create-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second OCC rule (different write endpoint): a capacity-allocation create with a stale expected_program_version -> 412; a fresh one succeeds and supersedes the prior tranche (prior -> SUPERSEDED)."
        test_recipe:
          setup: ["program PROPOSED v1; allocation A1 created with expected 1 (program now v2)"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier OC2", naic_code: "NAIC-OC2", contact_email: "a@oc2.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "OC2 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, v1: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${v1}" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q4", allocated_cents: 400000, expected_program_version: "${v1}" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { err: $.data.error_id } }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { v_now: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q4", allocated_cents: 400000, expected_program_version: "${v_now}" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { a2: $.data.id } }
            - { call: "GET /mga/capacity-allocations/${a1}", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { a1_st: $.data.status } }
          assert:
            - "stale create: error_id == ERR_STALE_VERSION (412); no allocation created (list still length 1)"
            - "fresh create succeeds: allocation ${a2} ACTIVE with allocated 400000; ${a1} status == SUPERSEDED"

      - name: derived_fields_reconcile_after_partial_collections
        claim_type: derived_field_reconciliation
        grounds: ["entities.Policy.fields.collected_cents", "entities.Program.fields.trust_balance_cents"]
        distinguishing_aspect: "Two partial collections (100000 + 55000) keep the denormalized counters exact: policy.collected_cents == 155000, program.trust_balance_cents == 155000, and the second entry's running_balance_cents == 155000."
        test_recipe:
          setup: ["ACTIVE program; policy BOUND gross 155000"]
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier DF", naic_code: "NAIC-DF", contact_email: "a@df.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "DF Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Derived Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
            - { call: "POST /mga/policies/${pol}/bind", payload: {}, as: MGAUnderwriter }
          trigger:
            - { call: "POST /mga/policies/${pol}/collections", payload: { amount_cents: 100000 }, as: MGAFinance, captures: { rb1: $.data.running_balance_cents } }
            - { call: "POST /mga/policies/${pol}/collections", payload: { amount_cents: 55000 }, as: MGAFinance, captures: { rb2: $.data.running_balance_cents } }
            - { call: "GET /mga/policies/${pol}", payload: {}, as: MGAFinance, captures: { coll: $.data.collected_cents } }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAFinance, captures: { tb: $.data.trust_balance_cents } }
          assert:
            - "running balances: 100000 then 155000"
            - "Policy.${pol}.collected_cents == 155000; Program.${prog}.trust_balance_cents == 155000 (derived fields reconcile after each write)"

      - name: cascading_side_effects_layer_stub
        claim_type: cascading_side_effects
        grounds: ["state_machines.Program.ACTIVE_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: audit_escalation_cascade_depth3
          rationale: "N-level chain (audit -> program -> appointment -> claim, plus quote/bordereau fan-out) asserted end-to-end there."

      - name: dual_variant_calculation_layer_stub
        claim_type: dual_variant_calculation
        grounds: ["calculations.loss_ratio"]
        excluded_because:
          difficulty_instance: loss_ratio_paid_vs_incurred_divergence
          rationale: "Both variants computed on identical data with delta asserted there."

