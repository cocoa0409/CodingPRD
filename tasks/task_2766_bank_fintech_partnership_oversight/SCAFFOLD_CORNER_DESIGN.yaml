            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", custody_account_id: "${fbo_frozen_id}", entry_type: "END_USER_CREDIT", amount_cents: 1000, effective_at: "2026-08-06T00:00:00Z", expected_custody_account_version: "${fbo_frozen_v}", memo: "inflow attempt while FROZEN" }
