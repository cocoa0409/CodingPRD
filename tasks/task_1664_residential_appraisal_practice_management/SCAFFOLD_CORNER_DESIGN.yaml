# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Residential Appraisal Practice Management.
# Breadth enumeration of every testable claim in SCAFFOLD.yaml §1.1–§1.7 not
# already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Instance names are
# unique across BOTH design files.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: client_creation_retrieval_defaults
        claim_type: creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /appraisal/clients with all required fields -> 201; status defaults to ACTIVE, version == 1, server-minted id; subsequent GET returns identical field values."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /appraisal/clients"
              payload: { name: "First Client", client_type: DIRECT_LENDER, contact_email: "ops@c1.example", default_turn_time_days: 5 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_status: $.data.status, c_v: $.data.version, c_created: $.data.created_at }
            - call: "GET /appraisal/clients/${c_id}"
              as: FirmAdmin
              captures: { g_name: $.data.name, g_status: $.data.status }
          assert:
            - "created status == ACTIVE (default applied; captured ${c_status})"
            - "version == 1 and created_at == 2026-08-01T00:00:00Z (logical clock default; captured ${c_v}/${c_created})"
            - "GET round-trip: name == 'First Client', status ACTIVE (captured ${g_name}/${g_status})"

      - name: appraiser_creation_retrieval_computed_defaults
        claim_type: computed_fields
        grounds: [entities.Appraiser, calculations.turn_time_scorecard]
        distinguishing_aspect: "New CERTIFIED appraiser: status ACTIVE, sanction_override false; computed counters completed_count/on_time_count/no_show_count all 0 and standing GOOD_STANDING before any assignment."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
          trigger:
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "New Appraiser", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-9", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_status: $.data.status, a_sanction: $.data.sanction_override }
            - call: "GET /appraisal/appraisers/${a_id}/scorecard"
              as: FirmAdmin
              captures: { sc_done: $.data.completed_count, sc_rate: $.data.on_time_rate, sc_standing: $.data.standing, sc_min: $.data.confirmed_minutes }
          assert:
            - "status == ACTIVE, sanction_override == false (captured ${a_status}/${a_sanction})"
            - "scorecard: completed_count == 0, on_time_rate == null, standing == GOOD_STANDING, confirmed_minutes == 0 (captured ${sc_done}/${sc_rate}/${sc_standing}/${sc_min})"

      - name: trainee_appraiser_requires_certified_supervisor
        claim_type: type_constraints
        grounds: [entities.Appraiser.fields.supervisor_id, "errors[ERR_SUPERVISOR_NOT_CERTIFIED]"]
        distinguishing_aspect: "supervisor_id is required iff license_level == TRAINEE and must reference a CERTIFIED_RESIDENTIAL appraiser: trainee without supervisor -> ERR_VALIDATION; trainee supervised by a merely LICENSED appraiser -> ERR_SUPERVISOR_NOT_CERTIFIED; trainee under a certified supervisor -> 201."
        test_recipe:
          setup: ["one LICENSED appraiser L and one CERTIFIED_RESIDENTIAL appraiser S exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Larry Licensed", license_level: LICENSED, license_number: "LA-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { l_id: $.data.id }
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Sara Supervisor", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Tina Trainee", license_level: TRAINEE, license_number: "TR-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Tina Trainee", license_level: TRAINEE, license_number: "TR-1", license_expiry: "2027-06-01", supervisor_id: "${l_id}" }
              as: FirmAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Tina Trainee", license_level: TRAINEE, license_number: "TR-1", license_expiry: "2027-06-01", supervisor_id: "${s_id}" }
              as: FirmAdmin
              captures: { t_id: $.data.id, t_sup: $.data.supervisor_id }
          assert:
            - "missing supervisor for TRAINEE -> error_id ERR_VALIDATION (captured ${err1})"
            - "LICENSED supervisor -> error_id ERR_SUPERVISOR_NOT_CERTIFIED (captured ${err2})"
            - "CERTIFIED_RESIDENTIAL supervisor -> 201; supervisor_id == ${s_id} (captured ${t_id}/${t_sup})"

      - name: panel_membership_creation_retrieval
        claim_type: creation
        grounds: [entities.PanelMembership]
        distinguishing_aspect: "Membership create -> 201 status ACTIVE; GET by id round-trips client_id/appraiser_id."
        test_recipe:
          setup: ["client and appraiser exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "A", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /appraisal/panel-memberships"
              payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }
              as: FirmAdmin
              captures: { pm_id: $.data.id, pm_status: $.data.status }
            - call: "GET /appraisal/panel-memberships/${pm_id}"
              as: FirmAdmin
              captures: { g_c: $.data.client_id, g_a: $.data.appraiser_id }
          assert:
            - "created status == ACTIVE (captured ${pm_status})"
            - "GET round-trip: client_id == ${c_id}, appraiser_id == ${a_id} (captured ${g_c}/${g_a})"

      - name: fee_schedule_creation_open_ended_default
        claim_type: defaults
        grounds: [entities.FeeSchedule.fields.effective_to]
        distinguishing_aspect: "Omitting effective_to leaves the window open-ended (null) and the create succeeds with OCC version 1."
        test_recipe:
          setup: ["client exists, version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
          trigger:
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: COMPLEX, base_fee_cents: 60000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
              captures: { fs_id: $.data.id, fs_to: $.data.effective_to }
            - call: "GET /appraisal/fee-schedules/${fs_id}"
              as: FirmAdmin
              captures: { fs_base: $.data.base_fee_cents }
          assert:
            - "created with effective_to == null (open-ended default; captured ${fs_to})"
            - "GET round-trip: base_fee_cents == 60000 (captured ${fs_base})"

      - name: order_creation_retrieval_initial_state
        claim_type: initial_state
        grounds: [entities.AppraisalOrder, state_machines.AppraisalOrder]
        distinguishing_aspect: "Order create -> 201 with status RECEIVED, assigned_appraiser_id null, fee fields null, open_complaint_count 0; GET round-trip matches."
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "5 New St", property_type: CONDO, estimated_value_cents: 30000000, loan_type: VA, requested_turn_days: 10 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id, o_status: $.data.status, o_assignee: $.data.assigned_appraiser_id, o_fee: $.data.fee_current_cents, o_complaints: $.data.open_complaint_count }
            - call: "GET /appraisal/orders/${o_id}"
              as: FirmAdmin
              captures: { g_status: $.data.status, g_ptype: $.data.property_type }
          assert:
            - "initial status == RECEIVED, assigned_appraiser_id == null, fee_current_cents == null, open_complaint_count == 0 (captured ${o_status}/${o_assignee}/${o_fee}/${o_complaints})"
            - "GET round-trip: status RECEIVED, property_type CONDO (captured ${g_status}/${g_ptype})"

      - name: appointment_creation_initial_state
        claim_type: initial_state
        grounds: [entities.Appointment, state_machines.Appointment]
        distinguishing_aspect: "Appointment create on an ASSIGNED order -> 201 PROPOSED; order not yet advanced (still ASSIGNED until confirm)."
        test_recipe:
          setup: ["inspection order ASSIGNED to appraiser A at clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "A", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - { call: "POST /appraisal/panel-memberships", payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "5 New St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /appraisal/orders/${o_id}/determine-scope", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
          trigger:
            - call: "POST /appraisal/appointments"
              payload: { order_id: "${o_id}", appraiser_id: "${a_id}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { ap_id: $.data.id, ap_status: $.data.status }
            - call: "GET /appraisal/orders/${o_id}"
              as: FirmAdmin
              captures: { o_status: $.data.status }
          assert:
            - "appointment initial status == PROPOSED (captured ${ap_status})"
            - "order remains ASSIGNED before any confirm (captured ${o_status})"

      - name: comparable_creation_computed_and_default_fields
        claim_type: computed_fields
        grounds: [entities.Comparable, calculations.comparable_adjustment]
        distinguishing_aspect: "Create computes derived fields immediately: other_adjustment_cents defaults to 0; adjusted_price_cents == sale + rounded lines (45250000 + 10000 == 45260000 for a single +6000 line); status DRAFT."
        test_recipe:
          setup: ["desktop order in IN_ANALYSIS"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "A", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - { call: "POST /appraisal/panel-memberships", payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "5 New St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /appraisal/orders/${o_id}/determine-scope", payload: { requires_inspection: false }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/start-analysis", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
          trigger:
            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o_id}", address: "9 Cmp Rd", sale_price_cents: 45250000, sale_date: "2026-06-01", distance_miles: 0.30, site_adjustment_cents: 0, gla_adjustment_cents: 0, condition_adjustment_cents: 6000 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { cm_id: $.data.id, cm_adj: $.data.adjusted_price_cents, cm_other: $.data.other_adjustment_cents, cm_status: $.data.status }
          assert:
            - "other_adjustment_cents defaulted to 0 (captured ${cm_other})"
            - "adjusted_price_cents == 45260000 (45250000 + round_half_up(6000/10000)*10000 = 45250000 + 10000; captured ${cm_adj})"
            - "status == DRAFT (captured ${cm_status})"

      - name: report_creation_system_fields
        claim_type: system_fields
        grounds: [entities.Report]
        distinguishing_aspect: "Report create sets signing_appraiser_id from the order's assignee (not from input), revision_round 0, qc_fail_count 0, status DRAFT; one report per order — a second create fails ERR_INVALID_STATE because the order left IN_ANALYSIS."
        test_recipe:
          setup: ["desktop order in IN_ANALYSIS with 3 locked eligible comps (standard fixture triple 44500000/45700000/45000000 adjusted, weights 3/2/1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "A", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - { call: "POST /appraisal/panel-memberships", payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "5 New St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /appraisal/orders/${o_id}/determine-scope", payload: { requires_inspection: false }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/start-analysis", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o_id}", address: "1 Pine St", sale_price_cents: 44000000, sale_date: "2026-06-15", distance_miles: 0.40, site_adjustment_cents: 500000, gla_adjustment_cents: 0, condition_adjustment_cents: 0 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { cm1: $.data.id }
            - { call: "POST /appraisal/comparables/${cm1}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${cm1}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o_id}", address: "2 Pine St", sale_price_cents: 46000000, sale_date: "2026-06-10", distance_miles: 0.80, site_adjustment_cents: 0, gla_adjustment_cents: 0, condition_adjustment_cents: -300000 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { cm2: $.data.id }
            - { call: "POST /appraisal/comparables/${cm2}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${cm2}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o_id}", address: "3 Pine St", sale_price_cents: 45000000, sale_date: "2026-05-20", distance_miles: 1.20, site_adjustment_cents: 0, gla_adjustment_cents: 0, condition_adjustment_cents: 0 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { cm3: $.data.id }
            - { call: "POST /appraisal/comparables/${cm3}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${cm3}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
          trigger:
            - call: "POST /appraisal/reports"
              payload: { order_id: "${o_id}", report_type: FORM_1073, condition_rating: C2 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { r_id: $.data.id, r_signer: $.data.signing_appraiser_id, r_round: $.data.revision_round, r_fails: $.data.qc_fail_count, r_status: $.data.status, r_value: $.data.value_conclusion_cents }
            - call: "POST /appraisal/reports"
              payload: { order_id: "${o_id}", report_type: FORM_1004, condition_rating: C3 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "signing_appraiser_id == ${a_id} (server-set from assignee); revision_round == 0; qc_fail_count == 0; status == DRAFT (captured ${r_signer}/${r_round}/${r_fails}/${r_status})"
            - "value_conclusion_cents == 45000000 (weighted 3/2/1 over 44500000/45700000/45000000; captured ${r_value})"
            - "second report for the same order rejected: error_id == ERR_INVALID_STATE (order now DRAFTING; captured ${err})"

      - name: revision_request_creation_open_state_and_version_bump
        claim_type: creation
        grounds: [entities.RevisionRequest, state_machines.RevisionRequest, "concurrency_rules[revision-create-stale-order]"]
        distinguishing_aspect: "Create on a DELIVERED order -> 201 OPEN; creating bumps AppraisalOrder.version by exactly 1 (observable via the OCC field's parent)."
        test_recipe:
          setup: ["desktop order DELIVERED at 2026-08-02; fresh order version captured"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "A", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Q", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-2", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { q_id: $.data.id }
            - { call: "POST /appraisal/panel-memberships", payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "5 New St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /appraisal/orders/${o_id}/determine-scope", payload: { requires_inspection: false }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/start-analysis", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
