              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Finn Waller", grade_level: 5, date_of_birth: "2015-10-10T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: ["ASTHMA"], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
