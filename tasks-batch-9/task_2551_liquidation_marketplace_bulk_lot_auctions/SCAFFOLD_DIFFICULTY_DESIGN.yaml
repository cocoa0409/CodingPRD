  # ===========================================================================
  # Rule 5 - priority-pair validation conflicts, different error-category pairs
  #   instance 1: state (prio 9) beats business_fiscal (prio 16)
  #   instance 2: business_temporal (prio 12) beats business_constraint (prio 13)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: closed_listing_state_error_wins_over_bid_below_minimum
        grounds:
          - validations[priority 9 -> ERR_LISTING_STATE_INVALID]
          - validations[priority 16 -> ERR_BID_BELOW_MINIMUM]
          - errors[ERR_LISTING_STATE_INVALID]
          - errors[ERR_BID_BELOW_MINIMUM]
          - state_machines.Listing.OPEN_to_CLOSED_NO_SALE
          - endpoints[POST /liquidation/listings/{id}/bids]
        distinguishing_aspect: |
          The request violates two rules at once, from two different categories: the listing is
          CLOSED_NO_SALE (state, priority 9) and the 1-cent bid is far below min_next_bid_cents
          (business_fiscal, priority 16). Only the priority-9 ERR_LISTING_STATE_INVALID with HTTP 409
