# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Task 2629: Junior Golf Tour & Ranking Administration (junior golf association)
#
# Breadth probe over §1.1–§1.7. Every `section:` value is one of the nine sections of
# references/claim-extraction-guide.md and every `claim_type:` is a row of that section's table.
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe; corners it already asserts appear
# here as `excluded_because:` stubs with no test_recipe.
#
# LOGICAL CLOCK: the documented process-start default is 2026-08-01T00:00:00Z. Recipes that do
# not call POST /_clock/set_current_utc rely on that default; every temporal recipe sets it.
#
# SHARED FIXTURE VOCABULARY (identical literals to §1.8 so the two files read as one suite):
#   season      2026 Junior Tour, age_cutoff_date 2026-08-31, assistance_budget_cents 500000
#   member m1   Ava Stone,  born 2010-05-04 -> age 16 -> U17, handicap 3.2, publication_opt_in true
#   member m2   Ben Cole,   born 2010-06-15 -> age 16 -> U17, handicap 5.1
#   member m3   Cara Diaz,  born 2010-03-02 -> age 16 -> U17, handicap 6.4
#   course      course_rating 71.4, slope_rating 128  ->  differential factor 113/128
#   actors      TourAdmin "admin-1", RulesOfficial "official-anna" / "ro-1",
#               ChiefReferee "referee-nolan", ConductCommittee "cc-1", Coach "coach-recruit-1"

scaffold_corner_design:

  # =========================================================================
  # 1. From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:

      - name: season_creation_returns_funded_three_bucket_ledger
        claim_type: creation
        grounds:
          - entities.Season
          - endpoints.POST_seasons
          - response_envelope.success
        distinguishing_aspect: "POST /seasons with all six required inputs returns 201 and a ledger initialised to available == budget == 500000 with committed 0 and disbursed 0, ranking_epoch 0 and ranked_member_count 0 — not nulls and not a single balance field."
        test_recipe:
          setup:
            - "Empty database; no season exists yet."
          setup_api_calls: []
          trigger:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id, avail: $.data.assistance_available_cents, comm: $.data.assistance_committed_cents, disb: $.data.assistance_disbursed_cents, epoch: $.data.ranking_epoch } }
          assert:
            - "http_status == 201"
            - "${avail} == 500000"
            - "${comm} == 0"
            - "${disb} == 0"
            - "${epoch} == 0"
            - "Season.${season_id}.assistance_budget_cents == 500000"
            - "Season.${season_id}.age_cutoff_date == 2026-08-31"
            - "Season.${season_id}.ranked_member_count == 0"
            - "Season.${season_id}.last_ranking_run_at == null"

      - name: member_retrieval_returns_stored_registration
        claim_type: retrieval
        grounds:
          - endpoints.GET_members_memberId
          - entities.Member
        distinguishing_aspect: "GET /members/{memberId} returns the same handicap_index 3.2 and birth_date 2010-05-04 that POST /members stored, together with the derived age_division U17 — a read that recomputes nothing and loses nothing."
        test_recipe:
          setup:
            - "One season with age_cutoff_date 2026-08-31 and one registered member m1 in PENDING_VERIFICATION."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
          trigger:
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { hi: $.data.handicap_index, div: $.data.age_division, es: $.data.eligibility_status } }
          assert:
            - "http_status == 200"
            - "${hi} == 3.2"
            - "${div} == U17"
            - "${es} == PENDING_VERIFICATION"
            - "Member.${m1_id}.birth_date == 2010-05-04"
            - "Member.${m1_id}.publication_opt_in == true"
            - "Member.${m1_id}.conduct_points == 0"
            - "Member.${m1_id}.late_withdrawal_count == 0"

      - name: entries_list_filters_by_tournament_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_entries
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /entries?tournament_id=<t1>&limit=1&offset=1 returns exactly one row — the SECOND entry of t1 in creation order — with total_count 2 and has_more false, while an entry belonging to t2 never appears. Filter, offset and count must compose rather than each ignoring the others."
        test_recipe:
          setup:
            - "One season, three VERIFIED U17 members m1, m2 and m3."
            - "Two ENTRY_OPEN REGIONAL tournaments t1 (field_size_limit 4) and t2 (field_size_limit 4) with non-overlapping dates so no travel-window conflict fires."
            - "m1 and m2 enter t1 in that order; m3 enters t2."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m2_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Cara Diaz", birth_date: "2010-03-02", state_code: "GA", guardian_email: "cara.guardian@example.com", handicap_index: 6.4, handicap_effective_date: "2026-07-22", handicap_source: "WHS_CLUB", publication_opt_in: false }, as: Anonymous, captures: { m3_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m3_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128, tee_group_size: 3, tee_interval_minutes: 10 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Georgia Regional", division: "U17", tier: "REGIONAL", start_date: "2026-10-10", end_date: "2026-10-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-10-01T00:00:00Z", withdrawal_deadline_at: "2026-10-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128, tee_group_size: 3, tee_interval_minutes: 10 }, as: TourAdmin, captures: { t2_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${t2_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries", payload: { member_id: "${m2_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m2_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /entries", payload: { member_id: "${m3_id}", tournament_id: "${t2_id}" }, as: Member, as_user_id: "${m3_id}", captures: { e3_id: $.data.id } }
          trigger:
            - { call: "GET /entries", payload: { tournament_id: "${t1_id}", limit: 1, offset: 1 }, as: TourAdmin }
          assert:
            - "http_status == 200"
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == false"
            - "meta.limit == 1"
            - "meta.offset == 1"
            - "data length == 1"
            - "data[0].id == ${e2_id}"
            - "no returned row has id == ${e3_id}"
            - "no returned row has id == ${e1_id}"

      - name: tournament_not_found_on_unknown_identifier
        claim_type: not_found
        grounds:
          - endpoints.GET_tournaments_tournamentId
          - validations.priority_11
          - errors.ERR_TOURNAMENT_NOT_FOUND
        distinguishing_aspect: "GET /tournaments/{unknown} returns 404 ERR_TOURNAMENT_NOT_FOUND, not 200 with an empty body and not 500 — the existence rung of the ladder answers before any tournament field is read."
        test_recipe:
          setup:
            - "One season exists so the database is not empty, but no tournament has ever been created."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
          trigger:
            - { call: "GET /tournaments/00000000-0000-0000-0000-0000000000ff", payload: {}, as: TourAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http_status == 404"
            - "${err} == ERR_TOURNAMENT_NOT_FOUND"
            - "response_type == error"

      - name: member_registration_missing_birth_date_is_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_members
          - entities.Member.fields.birth_date
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "birth_date has source input and no default, so omitting it returns 422 ERR_INVALID_REQUEST from the request_schema rung at priority 3 — the member is NOT created with a null birth_date and no age_division is invented."
        test_recipe:
          setup:
            - "One season with age_cutoff_date 2026-08-31."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
          trigger:
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "http_status == 422"
            - "${err} == ERR_INVALID_REQUEST"

      - name: member_publication_opt_in_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.Member.fields.publication_opt_in
          - endpoints.POST_members
        distinguishing_aspect: "Omitting the optional publication_opt_in stores false, not null and not true — recruiting exposure is opt-in, so the default is what later makes GET /members/{id}/published-results answer ERR_PUBLICATION_NOT_CONSENTED."
        test_recipe:
          setup:
            - "One season with age_cutoff_date 2026-08-31."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
          trigger:
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB" }, as: Anonymous, captures: { m2_id: $.data.id, opt: $.data.publication_opt_in } }
          assert:
            - "http_status == 201"
            - "${opt} == false"
            - "Member.${m2_id}.publication_opt_in == false"
            - "Member.${m2_id}.certified_ranking_points == null"
            - "Member.${m2_id}.certified_counted_events == 0"
            - "Member.${m2_id}.provisional_ranking_points == 0.00"

      - name: member_age_division_is_computed_and_client_value_ignored
        claim_type: computed_fields
        grounds:
          - calculations.member_age_division
          - entities.Member.fields.age_division
          - entities.Member.fields.age_at_cutoff
        distinguishing_aspect: "age_division has source computed and is not in POST /members' input:, so it is derived solely from birth_date against Season.age_cutoff_date 2026-08-31 — born 2010-05-04 gives age_at_cutoff 16 and U17. The threshold is the month-day comparison: 2008-08-31 reaches its birthday on the cutoff (age 18 -> U19) while 2008-09-01 does not (age 17 -> U17), and a 10-year-old gets a null division."
        test_recipe:
          setup:
            - "One season with age_cutoff_date 2026-08-31."
            - "One member born 2008-09-01 is registered first; his month-day 09-01 falls AFTER the cutoff month-day, so his birthday has not been reached and his age_at_cutoff is 17."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Eli Ward", birth_date: "2008-09-01", state_code: "TN", guardian_email: "eli.guardian@example.com", handicap_index: 4.0, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB" }, as: Anonymous, captures: { ma_id: $.data.id, ma_age: $.data.age_at_cutoff, ma_div: $.data.age_division } }
          trigger:
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Finn Ward", birth_date: "2008-08-31", state_code: "TN", guardian_email: "finn.guardian@example.com", handicap_index: 4.0, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB" }, as: Anonymous, captures: { mb_id: $.data.id, mb_age: $.data.age_at_cutoff, mb_div: $.data.age_division } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Gus Small", birth_date: "2016-01-01", state_code: "TN", guardian_email: "gus.guardian@example.com", handicap_index: 20.0, handicap_effective_date: "2026-07-15", handicap_source: "SELF_ATTESTED" }, as: Anonymous, captures: { mc_id: $.data.id, mc_age: $.data.age_at_cutoff, mc_div: $.data.age_division } }
          assert:
            - "${ma_age} == 17"
            - "${ma_div} == U17"
            - "${mb_age} == 18"
            - "${mb_div} == U19"
            - "${mc_age} == 10"
            - "${mc_div} == null"
            - "Member.${ma_id}.age_division == U17"
            - "Member.${mb_id}.age_division == U19"
            - "Member.${mc_id}.age_division == null"

      - name: entry_system_fields_are_server_generated_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Entry
          - endpoints.POST_entries
          - response_envelope.success
        distinguishing_aspect: "POST /entries' input: is exactly five fields, so id, created_at, updated_at, version, submitted_at, entry_status and every fee field are server-minted; submitted_at must equal the logical clock 2026-08-10T00:00:00Z rather than any client value, and version must start at 1."
        test_recipe:
          setup:
            - "The clock is pinned to 2026-08-10T00:00:00Z."
            - "One season, one VERIFIED U17 member m1, one ENTRY_OPEN REGIONAL tournament with entry_fee_cents 25000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128, tee_group_size: 3, tee_interval_minutes: 10 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id, sub: $.data.submitted_at, ver: $.data.version, st: $.data.entry_status } }
          assert:
            - "http_status == 201"
            - "${sub} == 2026-08-10T00:00:00Z"
            - "${ver} == 1"
            - "${st} == APPLIED"
            - "Entry.${e1_id}.gross_fee_cents == 25000"
            - "Entry.${e1_id}.late_entry_surcharge_cents == 0"
            - "Entry.${e1_id}.aid_award_cents == 0"
            - "Entry.${e1_id}.net_fee_due_cents == 25000"
            - "Entry.${e1_id}.fee_status == UNPAID"
            - "Entry.${e1_id}.amount_paid_cents == 0"
            - "Entry.${e1_id}.rank_at_entry == null"
            - "Entry.${e1_id}.waitlist_position == null"
            - "meta.api_request_id is present"
            - "meta.api_request_timestamp is present"

      - name: tournament_tier_rejects_value_outside_enum
        claim_type: type_constraints
        grounds:
          - entities.Tournament.fields.tier
          - endpoints.POST_tournaments
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "tier is constrained to LOCAL | REGIONAL | NATIONAL | INVITATIONAL, so 'MAJOR' returns 422 ERR_INVALID_REQUEST — the tournament is not created with an unknown tier that would later make TIER_BASE_POINTS lookup fail at ranking time."
        test_recipe:
          setup:
            - "One season with age_cutoff_date 2026-08-31."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
          trigger:
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Bad Tier Event", division: "U17", tier: "MAJOR", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http_status == 422"
            - "${err} == ERR_INVALID_REQUEST"

      - name: entry_foreign_key_to_unknown_tournament_is_rejected
        claim_type: foreign_key_validation
        grounds:
          - complexity_profile.entity_topology
          - entities.Entry.fields.tournament_id
          - validations.priority_11
          - errors.ERR_TOURNAMENT_NOT_FOUND
        distinguishing_aspect: "entity_topology is flat, so Entry.tournament_id travels in the body rather than the path; a body FK pointing at a non-existent tournament must still be dereferenced and answered with 404 ERR_TOURNAMENT_NOT_FOUND, and no orphan Entry row may be created."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1; no tournament has been created at all."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
          trigger:
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "00000000-0000-0000-0000-0000000000ee" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "http_status == 404"
            - "${err} == ERR_TOURNAMENT_NOT_FOUND"
            - "GET /entries?member_id=${m1_id} returns total_count 0"

      - name: exemption_grant_requires_an_existing_member
        claim_type: parent_relationships
        grounds:
          - entities.ExemptionGrant.fields.member_id
          - endpoints.POST_exemption_grants
          - validations.priority_10
          - errors.ERR_MEMBER_NOT_FOUND
        distinguishing_aspect: "The grant's two FKs are checked in ladder order: an unknown member_id returns 404 ERR_MEMBER_NOT_FOUND at priority 10 even though the tournament_id is perfectly valid and the tournament state would also admit the grant."
        test_recipe:
          setup:
            - "One season and one ENTRY_OPEN REGIONAL tournament; no member id matching the request exists."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
          trigger:
            - { call: "POST /exemption-grants", payload: { member_id: "00000000-0000-0000-0000-0000000000dd", tournament_id: "${t1_id}", category: "SPONSOR_INVITE", expires_at: "2026-09-01T00:00:00Z" }, as: TourAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http_status == 404"
            - "${err} == ERR_MEMBER_NOT_FOUND"
            - "GET /exemption-grants?tournament_id=${t1_id} returns total_count 0"

  # =========================================================================
  # 2. From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:

      - name: member_initial_state_is_pending_verification
        claim_type: initial_state
        grounds:
          - state_machines.Member.initial_state
          - endpoints.POST_members
        distinguishing_aspect: "A self-registered member lands in PENDING_VERIFICATION, never VERIFIED — so the freshly created member cannot yet enter anything, which is what makes ERR_MEMBER_NOT_VERIFIED reachable."
        test_recipe:
          setup:
            - "One season with age_cutoff_date 2026-08-31."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
          trigger:
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id, es: $.data.eligibility_status } }
          assert:
            - "http_status == 201"
            - "${es} == PENDING_VERIFICATION"
            - "Member.${m1_id}.version == 1"

      - name: open_entries_moves_scheduled_tournament_to_entry_open
        claim_type: valid_transition
        grounds:
          - state_machines.Tournament.SCHEDULED_to_ENTRY_OPEN
          - endpoints.POST_tournaments_tournamentId_open_entries
        distinguishing_aspect: "open-entries on a SCHEDULED tournament returns 200 with status ENTRY_OPEN and an untouched census (entry_count 0, open_slot_count equal to field_size_limit 2) — the transition changes the gate, not the field."
        test_recipe:
          setup:
            - "One season and one REGIONAL tournament freshly created in SCHEDULED with field_size_limit 2."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin, captures: { st1: $.data.status, open: $.data.open_slot_count } }
          assert:
            - "${st0} == SCHEDULED"
            - "http_status == 200"
            - "${st1} == ENTRY_OPEN"
            - "${open} == 2"
            - "Tournament.${t1_id}.entry_count == 0"
            - "Tournament.${t1_id}.field_quality_factor == 1.00"

      - name: close_entries_before_entry_close_at_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Tournament.ENTRY_OPEN_to_ENTRY_CLOSED
          - validations.priority_61
          - errors.ERR_ENTRY_WINDOW_OPEN
        distinguishing_aspect: "close-entries at clock 2026-08-31T23:59:59Z, one second before entry_close_at 2026-09-01T00:00:00Z, returns ERR_ENTRY_WINDOW_OPEN and leaves the tournament ENTRY_OPEN — the rule is 'clock at or after entry_close_at', so the boundary instant itself is the first legal moment."
        test_recipe:
          setup:
            - "One season and one ENTRY_OPEN REGIONAL tournament with entry_close_at 2026-09-01T00:00:00Z."
            - "The clock is set to 2026-08-31T23:59:59Z."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-31T23:59:59Z" }, as: Anonymous }
          trigger:
            - { call: "POST /tournaments/${t1_id}/close-entries", payload: {}, as: TourAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http_status == 409"
            - "${err} == ERR_ENTRY_WINDOW_OPEN"
            - "Tournament.${t1_id}.status == ENTRY_OPEN"

      - name: start_from_scheduled_tournament_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Tournament
          - validations.priority_30
          - errors.ERR_INVALID_TOURNAMENT_STATE
        distinguishing_aspect: "start is only declared FIELD_SET -> IN_PROGRESS, so invoking it on a SCHEDULED tournament returns ERR_INVALID_TOURNAMENT_STATE rather than ERR_EMPTY_FIELD — the state gate at priority 30 answers before the capacity rule at priority 72, and status stays SCHEDULED."
        test_recipe:
          setup:
            - "One season and one REGIONAL tournament still in SCHEDULED; entries were never opened, so the field is also empty."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
          trigger:
            - { call: "POST /tournaments/${t1_id}/start", payload: {}, as: TourAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http_status == 409"
            - "${err} == ERR_INVALID_TOURNAMENT_STATE"
            - "${err} != ERR_EMPTY_FIELD"
            - "Tournament.${t1_id}.status == SCHEDULED"

      - name: cancelled_tournament_rejects_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Tournament.terminal_states
          - endpoints.POST_tournaments_tournamentId_cancel
          - errors.ERR_INVALID_TOURNAMENT_STATE
        distinguishing_aspect: "CANCELLED is terminal, so a second cancel AND an open-entries attempt on the same tournament both return ERR_INVALID_TOURNAMENT_STATE; the census frozen by the first cancel (open_slot_count 2, accepted_count 0) must not be recomputed by either rejected call."
        test_recipe:
          setup:
            - "One season and one ENTRY_OPEN REGIONAL tournament with field_size_limit 2 that is then cancelled."
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /tournaments/${t1_id}/cancel", payload: { cancellation_reason: "course flooded" }, as: TourAdmin, captures: { st1: $.data.status, open1: $.data.open_slot_count } }
          trigger:
            - { call: "POST /tournaments/${t1_id}/cancel", payload: { cancellation_reason: "cancelled again by mistake" }, as: TourAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "${st1} == CANCELLED"
            - "${open1} == 2"
            - "trigger 1: http_status == 409"
            - "${err} == ERR_INVALID_TOURNAMENT_STATE"
            - "trigger 2: http_status == 409"
            - "${err2} == ERR_INVALID_TOURNAMENT_STATE"
            - "Tournament.${t1_id}.status == CANCELLED"
            - "Tournament.${t1_id}.accepted_count == 0"

      - name: second_withdraw_on_withdrawn_entry_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Entry.APPLIED_to_WITHDRAWN
          - validations.priority_31
          - errors.ERR_INVALID_ENTRY_STATE
        distinguishing_aspect: "withdraw is not idempotent: the second call on an already WITHDRAWN entry returns 409 ERR_INVALID_ENTRY_STATE, and crucially the tournament census must not double-count — closed_count stays 1 and applied_count stays 0 rather than drifting to 2 and -1."
        test_recipe:
          setup:
            - "One season, one VERIFIED U17 member m1, one ENTRY_OPEN REGIONAL tournament, one APPLIED entry that is then withdrawn at clock 2026-08-12T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 2, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /tournaments/${t1_id}/open-entries", payload: {}, as: TourAdmin }
            - { call: "POST /entries", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}" }, as: Member, as_user_id: "${m1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-12T00:00:00Z" }, as: Anonymous }
            - { call: "POST /entries/${e1_id}/withdraw", payload: { reason: "schedule change" }, as: Member, as_user_id: "${m1_id}", captures: { st1: $.data.entry_status } }
          trigger:
            - { call: "POST /entries/${e1_id}/withdraw", payload: { reason: "withdrawn twice" }, as: Member, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "${st1} == WITHDRAWN"
            - "http_status == 409"
            - "${err} == ERR_INVALID_ENTRY_STATE"
            - "Entry.${e1_id}.entry_status == WITHDRAWN"
            - "Tournament.${t1_id}.closed_count == 1"
            - "Tournament.${t1_id}.applied_count == 0"
            - "Tournament.${t1_id}.entry_count == 1"

      - name: peer_verify_on_scheduled_round_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Round
          - validations.priority_32
          - errors.ERR_INVALID_ROUND_STATE
        distinguishing_aspect: "peer-verify is declared only from SUBMITTED, so calling it on a SCHEDULED round with no card yet returns ERR_INVALID_ROUND_STATE and must NOT increment dispute_count or move the round to PEER_VERIFIED."
        test_recipe:
          setup:
            - "The two-member REGIONAL 2-round tournament driven to IN_PROGRESS with both entries ACCEPTED and PAID."
            - "m1's round 1 is created with m2 as marker and no score has been submitted."
          setup_api_calls:
