        distinguishing_aspect: "Age is the bare calendar-year difference year(scheduled_start_utc) - birth_year against a min_age of 18, so a 2007 birth (19) and a 2008 birth (18) both register while a 2009 birth (17) is refused — the September start date and the runners' birthdays never enter the comparison."
