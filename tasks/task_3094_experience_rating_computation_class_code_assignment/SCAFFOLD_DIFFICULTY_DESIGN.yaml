# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3094_experience_rating_computation_class_code_assignment
# Nine rules × 2 instances each = 18 instances. All fixtures computed per §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_mod_includes_submitted_report_but_final_mod_excludes_it
        grounds:
          - calculations.credibility_weighting
          - calculations.experience_mod_provisional
          - entities.ExperienceModSheet.fields.provisional_mod_factor
        distinguishing_aspect: |
          Identical claim data produce different results depending on input-set
          membership: the provisional variant includes a SUBMITTED unit stat
          report's $500,000 payroll (E=3,750,000, W=0.6522) while the final
          variant excludes it (E=3,000,000, W=0.6000); provisional 1.19 vs
          final 1.44 — dual-variant behavior on the ExperienceModSheet domain.
        test_recipe:
          setup:
            - "Bureau with eligibility 500000, split point 1000000, K=4000, J=6000, UW threshold 2500000."
            - "Employer A; carrier; class code 3632 for TX; rating table TX promulgated (3632: ELR 150, d 4000, rate 250)."
            - "Policy P1 for A effective 2024-01-01 to 2025-01-01 with payroll 2,000,000 dollars; its report R1 VALIDATED with claims C1 1,600,000 and C2 2,400,000."
            - "Policy P2 for A effective 2025-01-01 to 2026-01-01 with payroll 500,000 dollars; its report R2 left in SUBMITTED with no claims."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
              captures: { bureau_id: $.data.id }
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id, employer_a_v: $.data.version }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2024-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-1001", effective_date: "2024-01-01", expiration_date: "2025-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 2000000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_p1: $.data.id }
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p1}", payroll_lines: [{ class_code: "3632", payroll_dollars: 2000000 } ], claim_lines: [{ claim_number: "C1", claim_type: "INDEMNITY", incurred_cents: 1600000, paid_cents: 1600000, claim_status: "CLOSED", state_code: "TX" }, { claim_number: "C2", claim_type: "INDEMNITY", incurred_cents: 2400000, paid_cents: 2400000, claim_status: "CLOSED", state_code: "TX" } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { report_r1: $.data.id }
            - call: "POST /unit-stat-reports/${report_r1}/validate"
              payload: {}
              as: BureauAnalyst
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-1002", effective_date: "2025-01-01", expiration_date: "2026-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 500000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_p2: $.data.id }
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p2}", payroll_lines: [{ class_code: "3632", payroll_dollars: 500000 } ], claim_lines: [{ claim_number: "C9", claim_type: "MEDICAL", incurred_cents: 0, paid_cents: 0, claim_status: "CLOSED", state_code: "TX" } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /experience-mod-sheets"
              payload: { employer_id: "${employer_a}", rating_effective_date: "2026-01-01", expected_employer_version: "${employer_a_v}" }
              as: BureauAnalyst
              captures: { sheet_id: $.data.id }
          assert:
            - "ExperienceModSheet.${sheet_id}.expected_losses_cents == 3000000"
            - "ExperienceModSheet.${sheet_id}.actual_primary_cents == 3300000"
            - "ExperienceModSheet.${sheet_id}.actual_excess_cents == 700000"
            - "ExperienceModSheet.${sheet_id}.ballast_cents == 300000"
            - "ExperienceModSheet.${sheet_id}.weight_w == \"0.6000\""
            - "ExperienceModSheet.${sheet_id}.mod_factor == \"1.44\""
            - "ExperienceModSheet.${sheet_id}.provisional_mod_factor == \"1.19\""
            - "ExperienceModSheet.${sheet_id}.mod_factor != ExperienceModSheet.${sheet_id}.provisional_mod_factor"

      - name: takeout_credit_short_rate_differs_from_pro_rata
        grounds:
          - calculations.take_out_credit
          - entities.AssignedRiskTakeOut.fields.credit_cents
        distinguishing_aspect: |
          Same enrollment, same exit date: the TAKE_OUT (short-rate) variant
          yields 326700 cents (factor 0.6534) while the pro-rata formula
          (governing non-take-out exits) would yield 363014 cents — a
          dual-variant split on the AssignedRisk domain, distinct from the
          ExperienceModSheet dual-variant instance.
        test_recipe:
          setup:
            - "Bureau defaults; employer C ACTIVE; carrier1 with quota 10,000,000."
            - "Enrollment for C effective 2026-01-01 to 2026-12-31 (total 365 days), estimated annual premium 1,000,000, ACTIVE on carrier1."
            - "Voluntary carrier carrier2 ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-11T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10002", legal_name: "Pool Carrier One", assigned_risk_quota_cents: 10000000 }
              as: BureauAdmin
              captures: { carrier_1: $.data.id }
            - call: "POST /carriers"
              payload: { naic_number: "10003", legal_name: "Voluntary Carrier Two", assigned_risk_quota_cents: 1000000 }
              as: BureauAdmin
              captures: { carrier_2: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000003", legal_name: "Capitol Fasteners", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_c: $.data.id }
            - call: "POST /assigned-risk-enrollments"
              payload: { employer_id: "${employer_c}", state_code: "TX", effective_date: "2026-01-01", expiration_date: "2026-12-31", estimated_annual_premium_cents: 1000000 }
              as: PoolAdministrator
              captures: { enr_1: $.data.id, enr_1_v: $.data.version }
            - call: "POST /assigned-risk-enrollments/${enr_1}/assign"
              payload: { carrier_id: "${carrier_1}" }
              as: PoolAdministrator
              captures: { enr_1_v2: $.data.version }
          trigger:
            - call: "POST /assigned-risk-take-outs"
              payload: { enrollment_id: "${enr_1}", voluntary_carrier_id: "${carrier_2}", exit_date: "2026-04-11", expected_enrollment_version: "${enr_1_v2}" }
              as: VoluntaryCarrierRepresentative
              as_user_id: "${carrier_2}"
              captures: { takeout_1: $.data.id }
            - call: "POST /assigned-risk-take-outs/${takeout_1}/approve"
              payload: {}
              as: PoolAdministrator
          assert:
            - "AssignedRiskTakeOut.${takeout_1}.credit_cents == 326700"
            - "AssignedRiskTakeOut.${takeout_1}.credit_cents != 363014 (the pro-rata result for the same inputs)"
            - "AssignedRiskEnrollment.${enr_1}.status == EXITED and exit_reason == TAKE_OUT"
            - "AssignedRiskEnrollment.${enr_1}.take_out_credit_cents == 326700"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: experience_mod_six_term_credibility_formula
        grounds:
          - calculations.credibility_weighting
          - calculations.primary_excess_split
          - calculations.expected_losses
        distinguishing_aspect: |
          Mode (a): a six-term formula with nested min() per claim, conditional
          tiered inputs (ELR and d-ratio per class code), and non-linear
          interaction — W depends on E, B depends on E, and the excess credit
          term couples W with expected_excess; with the base fixture the exact
          pipeline yields mod_factor 1.44 (numerator 4,740,000 over denominator
          3,300,000).
        test_recipe:
          setup:
            - "Bureau defaults; employer A; carrier; class 3632; TX rating table promulgated."
            - "Policy P1 payroll 2,000,000; report VALIDATED with claims 1,600,000 and 2,400,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id, employer_a_v: $.data.version }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2024-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-1001", effective_date: "2024-01-01", expiration_date: "2025-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 2000000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_p1: $.data.id }
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p1}", payroll_lines: [{ class_code: "3632", payroll_dollars: 2000000 } ], claim_lines: [{ claim_number: "C1", claim_type: "INDEMNITY", incurred_cents: 1600000, paid_cents: 1600000, claim_status: "CLOSED", state_code: "TX" }, { claim_number: "C2", claim_type: "INDEMNITY", incurred_cents: 2400000, paid_cents: 2400000, claim_status: "CLOSED", state_code: "TX" } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { report_r1: $.data.id }
            - call: "POST /unit-stat-reports/${report_r1}/validate"
              payload: {}
              as: BureauAnalyst
          trigger:
            - call: "POST /experience-mod-sheets"
              payload: { employer_id: "${employer_a}", rating_effective_date: "2026-01-01", expected_employer_version: "${employer_a_v}" }
              as: BureauAnalyst
              captures: { sheet_id: $.data.id }
          assert:
            - "ExperienceModSheet.${sheet_id}.expected_primary_cents == 1200000"
            - "ExperienceModSheet.${sheet_id}.expected_excess_cents == 1800000"
            - "ExperienceModSheet.${sheet_id}.weight_w == \"0.6000\""
            - "ExperienceModSheet.${sheet_id}.mod_factor == \"1.44\""

      - name: manual_premium_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.manual_premium
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-line-then-sum; two payroll lines of 101 dollars at rate 350
          yield round_half_up(353.5)=354 each, total 708, whereas sum-then-round
          would give 707. The Policy must persist 708.
        test_recipe:
          setup:
            - "Bureau defaults; employer B; carrier; class 3632 rated 350 in TX."
            - "TX rating table promulgated with 3632 at rate 350, ELR 150, d 4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000002", legal_name: "Brazos Fabrication", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_b: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2026-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 350, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /policies"
              payload: { employer_id: "${employer_b}", carrier_id: "${carrier_id}", policy_number: "WC-2001", effective_date: "2026-02-01", expiration_date: "2027-02-01", class_codes: [{ class_code: "3632", payroll_dollars: 101 }, { class_code: "3632", payroll_dollars: 101 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_x: $.data.id }
          assert:
            - "Policy.${policy_x}.manual_premium_cents == 708"
            - "Policy.${policy_x}.manual_premium_cents != 707"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: mod_sheet_cycles_promulgated_contested_revised_promulgated
        grounds:
          - state_machines.ExperienceModSheet.PROMULGATED_to_CONTESTED
          - state_machines.ExperienceModSheet.CONTESTED_to_REVISED
          - state_machines.ModAppeal.UNDER_REVIEW_to_REVERSED
        distinguishing_aspect: |
          ExperienceModSheet exhibits a cycle PROMULGATED -> CONTESTED ->
          REVISED, and the spawned revision sheet can itself be PROMULGATED —
          a revision loop on this entity, distinct from the ClassAssignment
          cycle in the sibling instance.
        test_recipe:
          setup:
            - "Base fixture: employer A with VALIDATED report (claims 1,600,000 + 2,400,000); sheet S1 PROMULGATED with mod 1.44."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id, employer_a_v: $.data.version }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2024-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_tx: $.data.id }
            - call: "POST /rating-tables/${rt_tx}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /policies"
              payload: { employer_id: "${employer_a}", carrier_id: "${carrier_id}", policy_number: "WC-1001", effective_date: "2024-01-01", expiration_date: "2025-01-01", class_codes: [{ class_code: "3632", payroll_dollars: 2000000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_p1: $.data.id }
            - call: "POST /unit-stat-reports"
              payload: { policy_id: "${policy_p1}", payroll_lines: [{ class_code: "3632", payroll_dollars: 2000000 } ], claim_lines: [{ claim_number: "C1", claim_type: "INDEMNITY", incurred_cents: 1600000, paid_cents: 1600000, claim_status: "CLOSED", state_code: "TX" }, { claim_number: "C2", claim_type: "INDEMNITY", incurred_cents: 2400000, paid_cents: 2400000, claim_status: "CLOSED", state_code: "TX" } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { report_r1: $.data.id }
            - call: "POST /unit-stat-reports/${report_r1}/validate"
              payload: {}
              as: BureauAnalyst
            - call: "POST /experience-mod-sheets"
              payload: { employer_id: "${employer_a}", rating_effective_date: "2026-01-01", expected_employer_version: "${employer_a_v}" }
              as: BureauAnalyst
              captures: { sheet_1: $.data.id }
            - call: "POST /experience-mod-sheets/${sheet_1}/promulgate"
              payload: {}
              as: BureauAnalyst
          trigger:
            - call: "POST /mod-appeals"
              payload: { mod_sheet_id: "${sheet_1}", reason: "Claim C2 reserved too high" }
              as: EmployerRepresentative
              as_user_id: "${employer_a}"
              captures: { appeal_1: $.data.id }
            - call: "POST /mod-appeals/${appeal_1}/review"
              payload: {}
              as: BureauAnalyst
            - call: "POST /mod-appeals/${appeal_1}/decide"
              payload: { decision: "REVERSED", decision_reason: "Carrier corrected C2 downward" }
              as: BureauAnalyst
          assert:
            - "ModAppeal.${appeal_1}.status == REVERSED"
            - "ExperienceModSheet.${sheet_1}.status == REVISED"
            - "GET /employers/${employer_a}/experience-mod-sheets returns 2 rows, and the second sheet has revision_of_sheet_id == ${sheet_1} and status DRAFT"

      - name: class_assignment_cycles_assigned_disputed_reassigned
        grounds:
          - state_machines.ClassAssignment.ASSIGNED_to_DISPUTED
          - state_machines.ClassAssignment.DISPUTED_to_REASSIGNED
          - state_machines.ClassAssignment.CONFIRMED_to_DISPUTED
        distinguishing_aspect: |
          ClassAssignment exhibits a non-linear loop ASSIGNED -> DISPUTED ->
          REASSIGNED (which spawns a fresh ASSIGNED assignment that can itself
          be disputed again), and CONFIRMED -> DISPUTED -> CONFIRMED is also
          reachable — cyclic revision on this entity, a different entity than
          ExperienceModSheet.
        test_recipe:
          setup:
            - "Bureau defaults; employer A ACTIVE; class codes 3632 and 8810 ACTIVE for TX."
            - "ClassAssignment CA1 for A created and assigned (no inspection is auto-created because the employer has no prior inspection requirement trigger configured — the assignment proceeds to ASSIGNED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
              captures: { cc_3632: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "8810", description: "Clerical Office Employees", state_code: "TX" }
              as: BureauAdmin
              captures: { cc_8810: $.data.id }
            - call: "POST /class-assignments"
              payload: { employer_id: "${employer_a}", class_code_id: "${cc_3632}", effective_date: "2026-03-01" }
              as: BureauAnalyst
              captures: { ca_1: $.data.id }
            - call: "POST /class-assignments/${ca_1}/assign"
              payload: {}
              as: BureauAnalyst
          trigger:
            - call: "POST /class-assignment-disputes"
              payload: { class_assignment_id: "${ca_1}", reason: "WRONG_CLASS" }
              as: EmployerRepresentative
              as_user_id: "${employer_a}"
              captures: { cad_1: $.data.id }
            - call: "POST /class-assignment-disputes/${cad_1}/review"
              payload: {}
              as: BureauAnalyst
            - call: "POST /class-assignment-disputes/${cad_1}/resolve"
              payload: { resolution: "REASSIGNED", new_class_code_id: "${cc_8810}" }
              as: BureauAnalyst
          assert:
            - "ClassAssignment.${ca_1}.status == REASSIGNED"
            - "ClassAssignmentDispute.${cad_1}.status == RESOLVED and resolution == REASSIGNED"
            - "GET /employers/${employer_a}/class-assignments returns 2 rows; the newer row has class_code_id == ${cc_8810} and status ASSIGNED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_correction_cascades_report_sheet_premium
        grounds:
          - state_machines.UnitStatReport.LOCKED_to_CORRECTED
          - state_machines.ExperienceModSheet.PROMULGATED_to_REVISED
          - calculations.retroactive_premium_adjustment
        distinguishing_aspect: |
          Depth-3 cascade: correcting claim C2 (2,400,000 -> 1,700,000) on a
          LOCKED report flips the report to CORRECTED, which flips the sheet
          to REVISED and spawns a new DRAFT sheet whose computation yields mod
          1.28, which drives retroactive_premium_adjustment_cents == -800000
          (billed 7,200,000 -> 6,400,000 on manual premium 5,000,000). Each
          hop is caused by the previous one.
        test_recipe:
          setup:
            - "Base fixture with employer A; report R1 VALIDATED then LOCKED via promulgation of sheet S1 (mod 1.44, manual premium 5,000,000 from payroll 2,000,000 at rate 250)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
