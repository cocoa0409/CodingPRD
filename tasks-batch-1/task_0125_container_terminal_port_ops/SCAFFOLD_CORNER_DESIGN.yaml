        claim_type: Violation → Error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_BERTH_CLOSED]"
          - "entities.Berth.fields.status"
        distinguishing_aspect: "Berthing a window whose parent berth was registered with status=CLOSED -> ERR_BERTH_CLOSED (409); the window was scheduled while the berth was AVAILABLE-fitting but berth time re-checks availability."
        test_recipe:
          setup: ["A berth registered CLOSED; a SCHEDULED window on it (scheduling does not check Berth.status, only fit and clash)."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-CLSD", length_m: 400, draft_m: 16.0, status: "CLOSED" }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000720", name: "Closed Berth V", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
