# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Utility Capital Project & Work-Order Costing
# Sections follow references/claim-extraction-guide.md. Every instance drives
# empty-DB -> precondition using only §1.5 endpoints. §1.8-covered corners are
# emitted as excluded_because stubs. Operator ids: admin-1, eng-1, eng-2,
# sup-1, sup-2, ctrl-1, ctrl-2, clerk-1, rates-1. Default clock 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: work_order_creation_seeds_estimate_and_defaults
        claim_type: creation
        grounds: ["endpoints[POST /ucp/work-orders]", entities.WorkOrder.fields.status, entities.Estimate.fields.estimate_seq]
        distinguishing_aspect: "Creating a work order returns 201 with status DRAFT, version 1, zeroed computed counters, WITHIN_TOLERANCE posture, and seeds exactly one PROPOSED estimate with estimate_seq 1 whose submitted_by_user_id is the creator."
        test_recipe:
          setup: ["Program CAP-SEED exists and is OPEN"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-SEED", fiscal_year: 2026, authorized_amount_cents: 5000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Seed order", initial_estimated_cost_cents: 250000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id, st: $.data.status, ver: $.data.version, posture: $.data.variance_posture, direct: $.data.actual_direct_cents, cwip: $.data.cwip_cents, seq: $.data.estimate_seq, req_id: "$.meta.api_request_id" } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est_status: "$.data[0].status", est_seq: "$.data[0].estimate_seq", est_amt: "$.data[0].estimated_cost_cents", est_by: "$.data[0].submitted_by_user_id", total: "$.total_count" } }
          assert:
            - "WorkOrder status ${st} == DRAFT, version ${ver} == 1, variance_posture ${posture} == WITHIN_TOLERANCE"
            - "Computed counters zero: actual_direct_cents ${direct} == 0 and cwip_cents ${cwip} == 0; estimate_seq ${seq} == 1"
            - "Seed estimate: status ${est_status} == PROPOSED, estimate_seq ${est_seq} == 1, estimated_cost_cents ${est_amt} == 250000, submitted_by ${est_by} == eng-1"
            - "Exactly one estimate exists (total_count ${total} == 1) and the envelope carries a non-empty api_request_id (${req_id})"

      - name: work_order_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required field title (and similarly a missing program_id or a non-positive initial_estimated_cost_cents) is a 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-REQ", fiscal_year: 2026, authorized_amount_cents: 5000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, initial_estimated_cost_cents: 250000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Bad amount", initial_estimated_cost_cents: 0 }, as: ProjectEngineer, as_user_id: eng-1, captures: { err2: $.data.error_id } }
          assert:
            - "Missing title: ${err} == ERR_VALIDATION; zero estimate: ${err2} == ERR_VALIDATION"

      - name: work_order_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", entities.WorkOrder.fields.order_type]
        distinguishing_aspect: "An undeclared enum member for order_type (not CAPITAL|EXPENSE) is rejected with ERR_VALIDATION before any state or business check."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-ENUM", fiscal_year: 2026, authorized_amount_cents: 5000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: "CAPITALISH", title: "Bad enum", initial_estimated_cost_cents: 250000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { err: $.data.error_id } }
          assert:
            - "error_id ${err} == ERR_VALIDATION"

      - name: get_missing_work_order_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent work-order UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Database is empty"]
          setup_api_calls: []
          trigger:
            - { call: "GET /ucp/work-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "error_id ${err} == ERR_NOT_FOUND (404)"

      - name: unit_catalog_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, "endpoints[GET /ucp/unit-catalog]"]
        distinguishing_aspect: "List pagination honors limit/offset with total_count and has_more: 3 catalog rows with limit 2 -> page 1 has_more true, page 2 (offset 2) returns the final row with has_more false."
        test_recipe:
          setup: ["Three catalog rows exist"]
          setup_api_calls:
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: POLE, standard_cost_cents: 10000, annual_depreciation_rate_pct: 4.0 }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: METER, standard_cost_cents: 8000, annual_depreciation_rate_pct: 6.0 }, as: SystemAdmin, as_user_id: admin-1 }
          trigger:
            - { call: "GET /ucp/unit-catalog", payload: { limit: 2, offset: 0 }, as: Auditor, captures: { total1: "$.total_count", more1: "$.has_more" } }
            - { call: "GET /ucp/unit-catalog", payload: { limit: 2, offset: 2 }, as: Auditor, captures: { total2: "$.total_count", more2: "$.has_more" } }
          assert:
            - "Page 1: total_count ${total1} == 3 and has_more ${more1} == true"
            - "Page 2: total_count ${total2} == 3 and has_more ${more2} == false"

      - name: estimates_reverse_lookup_by_supersedes_estimate_id
        claim_type: parent_relationships
        grounds: [entities.Estimate.fields.supersedes_estimate_id, "endpoints[GET /ucp/estimates]"]
        distinguishing_aspect: "The self-referential FK is reverse-reachable: after estimate #2 supersedes #1, GET /ucp/estimates?supersedes_estimate_id=<E1> returns exactly [E2]."
        test_recipe:
          setup: ["Work order submitted with seed estimate E1 approved"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-SUP", fiscal_year: 2026, authorized_amount_cents: 50000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Supersede order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est1: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est1}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_v3: $.data.version } }
            - { call: "POST /ucp/estimates", payload: { work_order_id: "${wo}", estimated_cost_cents: 105000, expected_work_order_version: "${wo_v3}" }, as: ProjectEngineer, as_user_id: eng-1, captures: { est2: $.data.id } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_v4: $.data.version } }
            - { call: "POST /ucp/estimates/${est2}/approve", payload: { expected_work_order_version: "${wo_v4}" }, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "GET /ucp/estimates", payload: { supersedes_estimate_id: "${est1}" }, as: Auditor, captures: { found_id: "$.data[0].id", total: "$.total_count" } }
          assert:
            - "Reverse lookup returns exactly the superseding estimate: id ${found_id} == ${est2}, total_count ${total} == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: invalid_transitions_from_draft_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From DRAFT, the triggers start, authorize, and return are all illegal and each returns 409 ERR_INVALID_STATE; the estimate cannot be approved while the work order is DRAFT either."
        test_recipe:
          setup: ["Work order in DRAFT with its seed PROPOSED estimate"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-INV", fiscal_year: 2026, authorized_amount_cents: 50000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Draft order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id, wo_v1: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est1: "$.data[0].id" } }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err_start: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err_auth: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/return", payload: { reason: "not submitted" }, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err_ret: $.data.error_id } }
            - { call: "POST /ucp/estimates/${est1}/approve", payload: { expected_work_order_version: "${wo_v1}" }, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err_appr: $.data.error_id } }
          assert:
            - "start from DRAFT: ${err_start} == ERR_INVALID_STATE"
            - "authorize from DRAFT: ${err_auth} == ERR_INVALID_STATE"
            - "return from DRAFT: ${err_ret} == ERR_INVALID_STATE"
            - "estimate approve while work order DRAFT: ${err_appr} == ERR_INVALID_STATE"

      - name: cancelled_work_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel, a submit, and a charge against the cancelled order all fail with ERR_INVALID_STATE and nothing mutates."
        test_recipe:
          setup: ["Work order cancelled from SUBMITTED"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-TRM", fiscal_year: 2026, authorized_amount_cents: 50000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Doomed order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1 }
            - { call: "POST /ucp/work-orders/${wo}/cancel", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/cancel", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err_cancel: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { err_submit: $.data.error_id } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { err_charge: $.data.error_id } }
          assert:
            - "Cancelled: status ${st} == CANCELLED"
            - "Second cancel: ${err_cancel} == ERR_INVALID_STATE; submit: ${err_submit} == ERR_INVALID_STATE; charge: ${err_charge} == ERR_INVALID_STATE"

      - name: child_entities_start_in_initial_states
        claim_type: initial_state
        grounds: [state_machines.CIACAgreement, state_machines.RegulatoryAsset, state_machines.AccountingPeriod]
        distinguishing_aspect: "CIAC agreements start PLEDGED, regulatory assets start PROPOSED, accounting periods start OPEN — each visible in its creation response."
        test_recipe:
          setup: ["Program and a DRAFT work order exist"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-INI", fiscal_year: 2026, authorized_amount_cents: 50000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Init order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
          trigger:
            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wo}", pledged_cents: 50000, pledge_expiry_at: "2026-12-31T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { ciac_st: $.data.status } }
            - { call: "POST /ucp/regulatory-assets", payload: { description: "Deferral", original_cents: 9000, amortization_months: 3 }, as: RateAnalyst, as_user_id: rates-1, captures: { ra_st: $.data.status, ra_rem: $.data.remaining_cents } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per_st: $.data.status } }
          assert:
            - "CIAC initial ${ciac_st} == PLEDGED; RegulatoryAsset initial ${ra_st} == PROPOSED with remaining ${ra_rem} == 9000; period initial ${per_st} == OPEN"

      - name: suspended_work_order_rejects_charges
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_WORK_ORDER_SUSPENDED]", state_machines.WorkOrder.IN_PROGRESS_to_SUSPENDED]
        distinguishing_aspect: "A charge posted while the work order is SUSPENDED fails with the dedicated 409 ERR_WORK_ORDER_SUSPENDED (not generic ERR_INVALID_STATE), and charging works again after resume."
        test_recipe:
          setup: ["CAPITAL work order authorized, started; MATERIAL 0% overhead; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-SUS", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Suspendable order", initial_estimated_cost_cents: 9000000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 4000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg_ok: $.data.total_cents } }
            - { call: "POST /ucp/work-orders/${wo}/suspend", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 4000, charge_date: "2026-08-06" }, as: FieldClerk, as_user_id: clerk-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/resume", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 4000, charge_date: "2026-08-07" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg_ok2: $.data.total_cents } }
          assert:
            - "Pre-suspend charge posted: total ${chg_ok} == 4000"
            - "While suspended: error_id ${err} == ERR_WORK_ORDER_SUSPENDED"
            - "After resume the same charge posts again: total ${chg_ok2} == 4000"

      - name: expense_order_lifecycle_no_capitalization
        claim_type: side_effect_execution
        grounds: [calculations.afudc_accrual, state_machines.WorkOrder.COMPLETED_to_CLOSED]
        distinguishing_aspect: "An EXPENSE work order gets O&M overhead loading (10% -> total 11,000c on a 10,000c charge), earns NO AFUDC at period close (entry list empty), and closes out with an empty unitization list producing zero FixedAssetUnits and capitalizable_total_cents 0."
        test_recipe:
          setup: ["EXPENSE work order authorized/started with MATERIAL/EXPENSE overhead 10%; period 2026-08 with one 10,000c charge; period closed (proving no AFUDC for EXPENSE); period 2026-09 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-EXP", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: EXPENSE, rate_pct: 10.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: EXPENSE, title: "Storm repair O&M", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 10000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg_total: $.data.total_cents, chg_ovh: $.data.overhead_amount_cents } }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1 }
          trigger:
            - { call: "GET /ucp/afudc-entries", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { af_list: $.data } }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-09-10" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [] }, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status, cap: $.data.capitalizable_total_cents } }
            - { call: "GET /ucp/fixed-asset-units", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { units: $.data } }
          assert:
            - "O&M loading applied: overhead ${chg_ovh} == 1000 and total ${chg_total} == 11000"
            - "No AFUDC for EXPENSE orders: entry list ${af_list} == []"
            - "EXPENSE closeout with empty lines succeeds: status ${st} == CLOSED, capitalizable_total_cents ${cap} == 0, units ${units} == []"

      - name: ciac_pledge_expiry_receive_rejection_and_close_sweep
        claim_type: valid_transition
        grounds: [state_machines.CIACAgreement.PLEDGED_to_EXPIRED, "errors[ERR_CIAC_EXPIRED]", "endpoints[POST /ucp/_clock/set_current_utc]"]
        distinguishing_aspect: "The clock-driven auto-transition fires two ways: a receive attempted after pledge_expiry_at fails with ERR_CIAC_EXPIRED and flips the agreement to EXPIRED, while a never-touched pledge is swept to EXPIRED by the next period close."
        test_recipe:
          setup:
            - "Program, period 2026-08 (open), and a DRAFT work order; CIAC A and B both pledged with expiry 2026-08-10T00:00:00Z; logical clock then advanced past expiry"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-CIACX", fiscal_year: 2026, authorized_amount_cents: 50000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "CIAC expiry order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wo}", pledged_cents: 50000, pledge_expiry_at: "2026-08-10T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { ca: $.data.id } }
            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wo}", pledged_cents: 60000, pledge_expiry_at: "2026-08-10T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { cb: $.data.id } }
            - { call: "POST /ucp/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin, as_user_id: admin-1 }
          trigger:
            - { call: "POST /ucp/ciac-agreements/${ca}/receive", payload: {}, as: RateAnalyst, as_user_id: rates-1, captures: { err: $.data.error_id } }
            - { call: "GET /ucp/ciac-agreements/${ca}", payload: {}, as: Auditor, captures: { ca_st: $.data.status } }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/ciac-agreements/${cb}", payload: {}, as: Auditor, captures: { cb_st: $.data.status } }
          assert:
            - "Late receive rejected: error_id ${err} == ERR_CIAC_EXPIRED and agreement A flipped to ${ca_st} == EXPIRED"
            - "Period close sweep expired untouched pledge B: ${cb_st} == EXPIRED"

      - name: ciac_refund_forfeiture_depends_on_cancel_state
        claim_type: side_effect_execution
        grounds: [calculations.ciac_refund, state_machines.CIACAgreement.RECEIVED_to_REFUNDED]
        distinguishing_aspect: "Cancel from AUTHORIZED refunds the full 50,000c (0% forfeiture — never reached IN_PROGRESS); cancel from IN_PROGRESS retains 10% (5,000c forfeited, 45,000c refunded) and writes the 20,000c CWIP off to program.expense_writeoff_cents."
        test_recipe:
          setup:
            - "WO-A authorized (never started) with a RECEIVED 50,000c CIAC; WO-B started with a 20,000c charge and a RECEIVED 50,000c CIAC; MATERIAL 0% overhead; period 2026-08 open"
