            - "after the refused attempt: FruitLot.${lot2}.cold_chain_status == PACKED and FruitLot.${lot2}.cooling_tunnel_id == null and CoolingTunnel.${tun}.committed_slots == 3"
            - "adjacent attempt: response status is 200 and FruitLot.${lot2}.cold_chain_status == COOLING"
            - "CoolingTunnel.${tun}.committed_slots == 4"
            - "FruitLot.${lot1}.forecast_shelf_life_days == 6"
            - "FruitLot.${lot2}.field_delay_hours == 7.00 and FruitLot.${lot2}.forecast_shelf_life_days == 2"

  - rule_id: compensating_invariant
    instances:

      - name: session_dispute_reverses_only_the_disputed_session_wage_accrual
        grounds:
          - state_machines.PickSession.APPROVED_to_DISPUTED
          - calculations.crew_wage_ledger
          - calculations.picker_productivity
          - entities.Crew.fields.accrued_wage_cents
        distinguishing_aspect: |
          The compensation is EXACT and SCOPED: with two APPROVED sessions on one
          crew (net 4950 and net 9000, ledger 13950), disputing only the second
          must leave Crew.accrued_wage_cents at exactly 4950 — neither 0 (over-
          reversal of the whole ledger) nor 13950 (no reversal) — while the
          disputed session RETAINS its own computed net_cents of 9000 and only
          the disputing picker's lifetime productivity is rolled back.
        test_recipe:
          setup:
            - "One STRAWBERRY block with one passing water sample so food_safety_posture is CLEARED."
            - "One DOMESTIC crew with two pickers, support plan complete, CERTIFIED then ACTIVE."
            - "One harvest window OPEN on 2026-08-03 with piece_rate_cents_per_clamshell 45 and clamshell_net_weight_lbs 1.00."
            - "Session A: picker one, 3.00 hours, 20 clamshells, 0 culled -> piece 900, guarantee floor 4950, makeup 4050, net 4950; APPROVED."
            - "Session B: picker two, 3.00 hours, 200 clamshells, 0 culled -> piece 9000, guarantee floor 4950, makeup 0, net 9000; APPROVED."
