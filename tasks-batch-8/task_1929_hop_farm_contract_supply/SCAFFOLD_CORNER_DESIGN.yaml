      - name: allocation_run_supersedes_projected
        claim_type: side_effect_execution
        grounds:
          - calculations.allocation_run_supersede
        distinguishing_aspect: "A second run for the same (crop_year, variety) CANCELS the prior PROJECTED allocation and creates a fresh one; the new row has a different id."
        test_recipe:
          setup: ["ACTIVE contract vol 1000 CASCADE 2026-2028; one run already executed (no inventory -> allocated 0)"]
          setup_api_calls:
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 1000, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
