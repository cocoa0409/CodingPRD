              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { oA: $.data.id }
            - call: "POST /api/orders/${oA}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l2}", allocation_cycle_id: "${cS}", product_line_id: "${pl1}", quantity: 5, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
