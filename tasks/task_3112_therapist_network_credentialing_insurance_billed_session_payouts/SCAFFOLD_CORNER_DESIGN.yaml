          - entities.Session
        distinguishing_aspect: "Creation validates both body foreign keys in the declared order and persists nothing on failure, so the returned session count stays zero for both the missing-clinician and missing-patient variants."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician and one patient on file."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
