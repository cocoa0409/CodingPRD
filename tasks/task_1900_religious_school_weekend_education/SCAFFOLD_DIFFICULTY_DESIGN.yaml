            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam L", primary_email: "l@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id, fam_v: $.data.version } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Only", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "POST /school/families/${fam_id}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_v}" }, as: SchoolAdmin, captures: { inv: $.data.id } }
            - { call: "POST /school/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SchoolAdmin }
          trigger:
            - { call: "POST /school/school-years/${y_id}/accrue-late-fees", payload: {}, as: SchoolAdmin, captures: { run1_total: $.data.total_fees_cents } }
            - { call: "POST /school/school-years/${y_id}/accrue-late-fees", payload: {}, as: SchoolAdmin, captures: { run2_total: $.data.total_fees_cents } }
            - { call: "GET /school/invoices/${inv}", payload: {}, as: SchoolAdmin }
          assert:
