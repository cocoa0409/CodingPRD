            - "after trigger[1]: ${late_high} == 10, ${pts_high} == 10.00, Facility.${fac_high_id}.serious_event_points == 10.00 and compliance_posture == RESTRICTED (inclusive AT the endpoint)"
            - "${pts_high} - ${pts_low} == 0.50 and both events have report_status REPORTED_LATE"
            - "the two facilities' postures differ while their event counts are identical: exactly one lateness step of 0.1 separates 9.50 from 10.00"
            - "neither report cascades into a substantiation (neither listing is SUBSTANTIATED), so the boundary is observed on the posture field alone"

      - name: fragrance_allergen_thresholds_inclusive_per_product_form_and_vacuous_set
        grounds:
          - calculations.allergen_disclosure_completeness
          - entities.ProductIngredient.fields.disclosure_required
          - entities.ProductListing.fields.undisclosed_allergen_count
          - entities.ProductListing.fields.allergen_disclosure_complete
        distinguishing_aspect: |
          A DIFFERENT metric (ProductIngredient.concentration_pct) at DIFFERENT endpoints: the
          inclusive ">= ALLERGEN_THRESHOLD_LEAVE_ON (0.001)" endpoint and the inclusive
          ">= ALLERGEN_THRESHOLD_RINSE_OFF (0.01)" endpoint, each probed at exactly the threshold and
          one 0.0001 step below, plus the empty-required-set case that must evaluate to complete ==
          true rather than incomplete. The same 0.0010 concentration is disclosure-required on a
          LEAVE_ON listing and NOT required on a RINSE_OFF one.
        test_recipe:
          setup:
            - "one REGISTERED facility and one ResponsiblePerson"
            - "listing L_leave (LEAVE_ON, consumer) with LINALOOL at exactly 0.0010 % undisclosed and CITRAL at 0.0009 % undisclosed"
            - "listing L_rinse (RINSE_OFF, consumer) with LINALOOL at 0.0010 % undisclosed and GERANIOL at exactly 0.0100 % undisclosed"
            - "listing L_empty (LEAVE_ON, consumer) with no ingredients at all"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
