# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_route_returns_201_with_computed_sla
        claim_type: Creation
        grounds: ["entities.Route.fields.status", "entities.Route.fields.sla_deadline", "calculations.route_sla_deadline"]
        distinguishing_aspect: "Creating a STAT route returns 201, status defaults to PLANNED, and sla_deadline = scheduled_start + 120 min = 2026-05-05T11:00:00Z."
        test_recipe:
          setup: ["A rate card and lab exist; a STAT route is created with a 09:00 start"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "STAT", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
          assert:
            - "response.status == 201"
            - "Route.${rt}.status == PLANNED"
            - "Route.${rt}.sla_deadline == 2026-05-05T11:00:00Z"

      - name: create_route_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: ["endpoints.POST /med-courier/routes", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required run_type field on route creation returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A rate card and lab exist"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_specimen_invalid_temp_band_returns_400
        claim_type: Type Constraints
        grounds: ["entities.Specimen.fields.required_temp_min_c", "entities.Specimen.fields.required_temp_max_c", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "required_temp_max_c (2) < required_temp_min_c (8) on specimen creation returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A route with one stop exists"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s1}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 8, required_temp_max_c: 2 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: route_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_ROUTE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent route id returns ERR_ROUTE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /med-courier/routes/00000000-0000-0000-0000-000000000000", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ROUTE_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: complete_before_stops_resolved_returns_409
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Route.DISPATCHED_to_COMPLETED", "errors[ERR_STOPS_NOT_RESOLVED]"]
        distinguishing_aspect: "Completing a DISPATCHED route while its single stop is still SCHEDULED returns ERR_STOPS_NOT_RESOLVED (409)."
        test_recipe:
          setup: ["Dispatched route with one still-SCHEDULED stop"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/complete", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STOPS_NOT_RESOLVED"

      - name: reschedule_non_missed_stop_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.Stop.MISSED_to_SCHEDULED", "errors[ERR_STOP_INVALID_STATE]"]
        distinguishing_aspect: "Rescheduling a SCHEDULED (not MISSED) stop returns ERR_STOP_INVALID_STATE (409)."
        test_recipe:
          setup: ["Dispatched route with a SCHEDULED stop that was never missed"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/stops/${s1}/reschedule", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STOP_INVALID_STATE"

      - name: dropoff_scan_before_pickup_returns_409
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Specimen.IN_TRANSIT_to_DELIVERED", "errors[ERR_SPECIMEN_INVALID_STATE]"]
        distinguishing_aspect: "A DROPOFF scan at the dropoff stop of a specimen still AWAITING_PICKUP returns ERR_SPECIMEN_INVALID_STATE (409)."
        test_recipe:
          setup: ["Dispatched route; specimen never picked up; dropoff scanned at its dropoff stop"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}", captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SPECIMEN_INVALID_STATE"

      - name: issue_already_issued_billing_returns_409
        claim_type: Idempotency
        grounds: ["state_machines.RunBilling.DRAFT_to_ISSUED", "errors[ERR_BILLING_INVALID_STATE]"]
        distinguishing_aspect: "Issuing a billing already in ISSUED returns ERR_BILLING_INVALID_STATE (409); issue is not idempotent."
        test_recipe:
          setup: ["A completed route billing has been issued once (ISSUED)"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 5.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/routes/${rt}/complete", payload: {}, as: Dispatcher, captures: { rv: $.data.version } }
            - { call: "POST /med-courier/routes/${rt}/billing", payload: { expected_route_version: "${rv}" }, as: Dispatcher, captures: { bill: $.data.id } }
            - { call: "POST /med-courier/billings/${bill}/issue", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/billings/${bill}/issue", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BILLING_INVALID_STATE"

      - name: suspend_already_suspended_driver_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.Driver.ACTIVE_to_SUSPENDED", "errors[ERR_DRIVER_INVALID_STATE]"]
        distinguishing_aspect: "SUSPEND action on an already-SUSPENDED driver returns ERR_DRIVER_INVALID_STATE (409)."
        test_recipe:
          setup: ["A driver has been suspended once"]
          setup_api_calls:
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/drivers/${drv}/credential", payload: { action: "SUSPEND" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /med-courier/drivers/${drv}/credential", payload: { action: "SUSPEND" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DRIVER_INVALID_STATE"

      - name: unassign_reverts_route_to_planned
        claim_type: Valid Transition
        grounds: ["state_machines.Route.ASSIGNED_to_PLANNED", "entities.Vehicle.fields.status"]
        distinguishing_aspect: "Unassigning an ASSIGNED route returns it to PLANNED with driver_id/vehicle_id cleared and the vehicle back to AVAILABLE (last_released_at untouched)."
        test_recipe:
          setup: ["A route is assigned to a driver and vehicle"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/unassign", payload: {}, as: Dispatcher }
          assert:
            - "Route.${rt}.status == PLANNED"
            - "Route.${rt}.driver_id == null"
            - "Vehicle.${veh}.status == AVAILABLE"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: add_stop_duplicate_sequence_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_STOP_SEQUENCE]"]
        distinguishing_aspect: "Adding a second stop with sequence 1 to a route that already has sequence 1 returns ERR_DUPLICATE_STOP_SEQUENCE (409)."
        test_recipe:
          setup: ["A route already has a stop at sequence 1"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_STOP_SEQUENCE"

      - name: dispatch_frozen_specimen_standard_driver_returns_422
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_CREDENTIAL_TYPE_INSUFFICIENT]"]
        distinguishing_aspect: "Dispatching a route carrying a FROZEN specimen with a STANDARD-credentialed driver returns ERR_CREDENTIAL_TYPE_INSUFFICIENT (422) — FROZEN requires HAZMAT."
        test_recipe:
          setup: ["ASSIGNED route with a FROZEN specimen and a STANDARD driver; refrigerated vehicle"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
