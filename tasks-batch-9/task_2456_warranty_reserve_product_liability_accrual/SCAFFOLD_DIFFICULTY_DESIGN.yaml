      - name: recovery_assert_blocked_until_linked_field_action_is_approved
        grounds:
          - state_machines.SupplierRecovery.DRAFT_to_ASSERTED
          - state_machines.FieldAction.SUBMITTED_to_APPROVED
          - validations[priority=23]
          - entities.SupplierRecovery.fields.field_action_id
          - errors[ERR_FIELD_ACTION_NOT_APPROVED]
        distinguishing_aspect: |
          A DIFFERENT entity pair from the first instance — SupplierRecovery x FieldAction:
          the recovery is in its own legal `from` state DRAFT and the supplier is not
          IMPAIRED, but asserting is refused with ERR_FIELD_ACTION_NOT_APPROVED while the
          linked FieldAction sits in DRAFT and again while it sits in SUBMITTED, and only the
          FieldAction reaching APPROVED unlocks the assertion.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists so an APPROVED decision has a booking period."
            - "Supplier SUP-3 has credit_rating AAA (collectability HIGH), annual_purchase_volume_cents 1000000000 and contractual_recovery_cap_bps 2000, so its cap is 200000000 cents."
            - "ProductFamily FAM-M has failure mode FM-M-BRD whose supplier_id is SUP-3."
            - "FieldAction FA-M-01 is a DRAFT SERVICE_CAMPAIGN over 4000 units with a selected engineering-approved PERMANENT_REPAIR remedy priced at 6500 cents per unit."
            - "A SupplierRecovery for 2000000 cents exists in status DRAFT with field_action_id = FA-M-01."
          setup_api_calls:
