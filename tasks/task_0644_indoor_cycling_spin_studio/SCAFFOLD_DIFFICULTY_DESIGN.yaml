            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /credit-packs/${pack_id}"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { after_book_remaining: $.data.remaining_credits }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "CreditPack.${pack_id}.consumed_credits == 0"
            - "CreditPack.${pack_id}.remaining_credits == 5"
            - "Reservation.${r1_id}.attendance_status == EARLY_CANCELLED"

      - name: penalty_waive_conserves_wallet_cents
        grounds:
          - state_machines.Reservation.BOOKED_to_LATE_CANCELLED
          - entities.PenaltyCharge.fields.amount_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: "Conserved quantity = monetary wallet cents (a different conserved quantity than pack credits): a LATE_CANCEL charges a fee (no wallet change), and the manager waive compensates it by crediting exactly amount_cents to wallet_credit_cents, leaving the member whole."
        test_recipe:
          setup:
            - "Member late-cancels (late_cancel_fee_cents 2000 charged as PenaltyCharge); a manager then waives the charge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 5, price_cents: 5000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-05T18:00:00Z", end_utc: "2026-06-05T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /penalty-charges"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
              captures: { charge_id: $.data.0.id }
          trigger:
            - call: "POST /penalty-charges/${charge_id}/waive"
              payload: {}
              as: StudioManager
          assert:
            - "PenaltyCharge.${charge_id}.waived == true"
            - "PenaltyCharge.${charge_id}.amount_cents == 2000"
            - "Member.${member_id}.wallet_credit_cents == 2000"
            - "Member.${member_id}.active_strike_count == 0"

