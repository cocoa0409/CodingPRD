# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3008_off_price_opportunistic_buying_pack_hold_store
#
# Depth probe: two instances per §0.5 Difficulty Rule (18 total), each grounded
# in SCAFFOLD.yaml §1.1–§1.7 and carrying a fully structured test_recipe.
# Logical clock default at server start: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: open_to_buy_provisional_commitment_vs_finalized_receipt_spend
        grounds:
          - calculations.open_to_buy_forward_commit
          - calculations.receipt_variance_valuation
          - state_machines.Receipt.OPEN_to_RECEIVED
          - state_machines.Lot.EVALUATED_to_ACCEPTED
        distinguishing_aspect: |
          Dual-variant logic on the MerchandiseSeason open-to-buy domain: the
          provisional variant (committed_forward_cents from accepted landed
          costs) and the finalized variant (spent_forward_cents from per-line
          extended receipt costs) produce different numbers for the same lot
          because 30 of 40 units were received, and both coexist on the season
          read with the over-spend alert comparing them.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 (budget 30000000, reserve 0.30) OPEN."
            - "Vendor V1 STANDARD zone MT tier A. Lot L1 IMMEDIATE, asking 6000000, negotiated 6000000 (landed 6150000), unit_count 40, one LotLine qty 40 unit_cost 150000, ACCEPTED against season version 1."
            - "Warehouse W1. Receipt R1 opened with one ReceiptLine declared_qty 40, received 30, completed."
          setup_api_calls:
            - &dd_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanningLead
            - &dd_season_ss2027
              call: "POST /merchandise-seasons"
              payload: { season_code: "SS2027", start_date: "2027-02-01T00:00:00Z", end_date: "2027-07-31T00:00:00Z", department_otb_budget_cents: 30000000, packaway_reserve_ratio: 0.30 }
              as: PlanningLead
              captures: { ss2027_id: $.data.id, ss2027_v: $.data.version }
            - &dd_open_ss2027
              call: "POST /merchandise-seasons/${ss2027_id}/open"
              payload: {}
              as: PlanningLead
            - &dd_zone_mt
              call: "POST /price-zones"
              payload: { zone_code: "MT", compare_at_multiplier: 2.0, markdown_cadence_weeks: 4, clearance_weeks: 12 }
              as: PricingAnalyst
            - &dd_vendor_v1
              call: "POST /vendors"
              payload: { legal_name: "Rocky Mountain Apparel Closeouts", vendor_code: "RMA", discretion_level: "STANDARD", ticket_discretion_required: false, default_zone_code: "MT", vendor_tier: "A" }
              as: PlanningLead
              captures: { vendor_v1_id: $.data.id }
            - call: "POST /lots"
              payload: { lot_code: "L1-CLOSEOUT", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 6000000, mixed_lot: false, unit_count: 40, expected_sell_through_pct: 0.8, estimated_unit_retail_cents: 20000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_l1_id: $.data.id }
            - call: "POST /lots/${lot_l1_id}/lot-lines"
              payload: { style_code: "FLC-HOODIE", department: "APPAREL", quantity: 40, unit_cost_cents: 150000, compare_at_claim_cents: 40000, target_retail_cents: 20000 }
              as: Buyer
              captures: { line_l1_id: $.data.id }
            - call: "POST /lots/${lot_l1_id}/evaluate"
              payload: { negotiated_price_cents: 6000000 }
              as: Buyer
            - call: "POST /lots/${lot_l1_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - &dd_wh_w1
              call: "POST /warehouses"
              payload: { warehouse_code: "W1-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_w1_id: $.data.id }
            - call: "POST /receipts"
              payload: { lot_id: "${lot_l1_id}", warehouse_id: "${wh_w1_id}" }
              as: WarehouseClerk
              captures: { receipt_r1_id: $.data.id }
            - call: "GET /receipts/${receipt_r1_id}/receipt-lines"
              payload: {}
              as: WarehouseClerk
              captures: { rl1_id: "$.data[0].id" }
            - call: "PATCH /receipts/${receipt_r1_id}/lines/${rl1_id}"
              payload: { received_qty: 30 }
              as: WarehouseClerk
          trigger:
            - call: "POST /receipts/${receipt_r1_id}/complete"
              payload: {}
              as: WarehouseClerk
            - call: "GET /merchandise-seasons/${ss2027_id}"
              payload: {}
              as: PlanningLead
          assert:
            - "MerchandiseSeason.${ss2027_id}.committed_forward_cents == 6150000 (provisional variant: landed cost committed at acceptance)"
            - "MerchandiseSeason.${ss2027_id}.spent_forward_cents == 4612500 (finalized variant: round_half_up(30 * 6150000 / 40))"
            - "MerchandiseSeason.${ss2027_id}.over_spend_alert == false (4612500 <= 6150000)"
            - "ReceiptLine.${rl1_id}.variance_qty == 10 and variance_value_cents == 1537500 (round_half_up(10 * 6150000 / 40))"
            - "a ShrinkCase with lot_id == ${lot_l1_id}, shrink_type UNSCANNED_UNIT, units_untraceable == 10, status OPEN was created by the completion cascade"

      - name: holding_cost_pro_rata_daily_vs_month_boundary_by_warehouse_zone
        grounds:
          - calculations.holding_cost_accrual
          - state_machines.PackawayHold.STORED_to_AGING_REVIEW
        distinguishing_aspect: |
          Dual-variant logic on the PackawayHold holding-cost domain: identical
          pallet count, rate, and 44-day age produce 29333 cents under the
          pro-rata daily variant (zone MT warehouse) and 40000 cents under the
          month-boundary variant (zone WC warehouse).
        test_recipe:
          setup:
            - "Clock starts 2026-09-01. Season SS2027 OPEN, FW2027 DRAFT. Vendor STANDARD zone MT."
            - "Lot PA1 PACKAWAY asking 1000000 (landed 1150000), ACCEPTED against SS2027 (season version 1 at accept time)."
            - "Two warehouses: WMT zone MT rate 5000/pallet/month; WWC zone WC rate 5000/pallet/month."
            - "Two holds HMT and HWC, 4 pallets each, entered 2026-09-01."
            - "Clock advanced to 2026-10-15 (44 days later)."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-08-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2027_id: $.data.id }
            - *dd_zone_mt
            - call: "POST /price-zones"
              payload: { zone_code: "WC", compare_at_multiplier: 1.5, markdown_cadence_weeks: 4, clearance_weeks: 12 }
              as: PricingAnalyst
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "PA1", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${fw2027_id}" }
              as: Buyer
              captures: { lot_pa1_id: $.data.id }
            - call: "POST /lots/${lot_pa1_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_pa1_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /warehouses"
              payload: { warehouse_code: "WMT-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_mt_id: $.data.id }
            - call: "POST /warehouses"
              payload: { warehouse_code: "WWC-LAX", pallet_capacity: 200, zone_code: "WC", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_wc_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa1_id}", warehouse_id: "${wh_mt_id}", pallet_count: 4, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_mt_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa1_id}", warehouse_id: "${wh_wc_id}", pallet_count: 4, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_wc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlanningLead
          trigger:
            - call: "POST /packaway-holds/${hold_mt_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_wc_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
          assert:
            - "PackawayHold.${hold_mt_id}.accrued_holding_cost_cents == 29333 (pro_rata_daily: 4*5000*1 + floor(4*5000*14/30) = 20000 + 9333)"
            - "PackawayHold.${hold_wc_id}.accrued_holding_cost_cents == 40000 (month_boundary: 4*5000*2)"
            - "PackawayHold.${hold_mt_id}.status == AGING_REVIEW and PackawayHold.${hold_wc_id}.status == AGING_REVIEW"
            - "the two identical-shape holds differ in accrued cost only because of the warehouse zone variant"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: deal_quality_score_three_input_clamped_weighted_blend
        grounds:
          - calculations.deal_quality_score
          - state_machines.Lot.OFFERED_to_EVALUATED
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — margin_pct is
          floored at 0 by max(), sell-through capped at 1 by min(), a discrete
          discretion penalty switches on vendor level, a discrete lot-type bonus
          switches on lot type, and the weighted blend is clamped to [0, 100].
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor V1 STANDARD."
            - "Lot L1 CLOSEOUT asking 50000, negotiated 48000 (landed 48000 + 150000 = 198000), unit_count 10, sell-through 0.8, est retail 20000."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "L1-DQ", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 50000, mixed_lot: false, unit_count: 10, expected_sell_through_pct: 0.8, estimated_unit_retail_cents: 20000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_dq_id: $.data.id }
            - call: "POST /lots/${lot_dq_id}/lot-lines"
              payload: { style_code: "DQ-STYLE", department: "APPAREL", quantity: 10, unit_cost_cents: 5000, compare_at_claim_cents: 40000, target_retail_cents: 20000 }
              as: Buyer
          trigger:
            - call: "POST /lots/${lot_dq_id}/evaluate"
              payload: { negotiated_price_cents: 48000 }
              as: Buyer
          assert:
            - "Lot.${lot_dq_id}.landed_cost_cents == 198000 (48000 negotiated + 150000 freight surcharge)"
            - "Lot.${lot_dq_id}.deal_quality_score == 42.6 (margin = (20000-19800)/20000 = 0.01; 100*(0.6*0.01 + 0.4*0.8) + 10 closeout bonus - 0 discretion = 42.6)"
            - "Lot.${lot_dq_id}.status == EVALUATED and Lot.${lot_dq_id}.version == 2"

      - name: receipt_variance_per_line_rounding_order_pinned
        grounds:
          - calculations.receipt_variance_valuation
          - state_machines.Receipt.OPEN_to_RECEIVED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — extended and variance
          values are rounded per receipt line BEFORE summing; the pinned order
          (per-line round_half_up, then sum) is asserted against a mixed
          two-line receipt whose per-line and lot-level rounding disagree.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor V1 STANDARD zone MT."
            - "Lot L2 IMMEDIATE asking 1000001, negotiated 1000001 (landed 1150001), unit_count 3, two LotLines qty 2 and qty 1."
            - "Receipt R2 with received_qty 1 on each line (2 of 3 units received)."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "L2-ROUND", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CANCELLATION", disposition: "IMMEDIATE", asking_price_cents: 1000001, mixed_lot: false, unit_count: 3, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 500000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_l2_id: $.data.id }
            - call: "POST /lots/${lot_l2_id}/lot-lines"
              payload: { style_code: "RND-A", department: "HOME", quantity: 2, unit_cost_cents: 333333, compare_at_claim_cents: 900000, target_retail_cents: 500000 }
              as: Buyer
            - call: "POST /lots/${lot_l2_id}/lot-lines"
              payload: { style_code: "RND-B", department: "HOME", quantity: 1, unit_cost_cents: 333334, compare_at_claim_cents: 900000, target_retail_cents: 500000 }
              as: Buyer
            - call: "POST /lots/${lot_l2_id}/evaluate"
              payload: { negotiated_price_cents: 1000001 }
              as: Buyer
            - call: "POST /lots/${lot_l2_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - *dd_wh_w1
            - call: "POST /receipts"
              payload: { lot_id: "${lot_l2_id}", warehouse_id: "${wh_w1_id}" }
              as: WarehouseClerk
              captures: { receipt_r2_id: $.data.id }
            - call: "GET /receipts/${receipt_r2_id}/receipt-lines"
              payload: {}
              as: WarehouseClerk
              captures: { rl2a_id: "$.data[0].id", rl2b_id: "$.data[1].id" }
            - call: "PATCH /receipts/${receipt_r2_id}/lines/${rl2a_id}"
              payload: { received_qty: 1 }
              as: WarehouseClerk
            - call: "PATCH /receipts/${receipt_r2_id}/lines/${rl2b_id}"
              payload: { received_qty: 1 }
              as: WarehouseClerk
          trigger:
            - call: "POST /receipts/${receipt_r2_id}/complete"
              payload: {}
              as: WarehouseClerk
          assert:
            - "ReceiptLine.${rl2a_id}.extended_cost_cents == 383334 (round_half_up(1 * 1150001 / 3) per line, rounded BEFORE any summation)"
            - "ReceiptLine.${rl2b_id}.extended_cost_cents == 383334"
            - "MerchandiseSeason.${ss2027_id}.spent_forward_cents == 766668 (sum of per-line rounded values, NOT round_half_up(2 * 1150001 / 3) = 766667)"
            - "ReceiptLine.${rl2a_id}.variance_value_cents == 383334 and ReceiptLine.${rl2b_id}.variance_value_cents == 0 (variance_qty 1 and 0 respectively)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: lot_evaluate_reevaluate_cycle_before_terminal_decision
        grounds:
          - state_machines.Lot.EVALUATED_to_EVALUATED
          - state_machines.Lot
        distinguishing_aspect: |
          The Lot machine is cyclic: EVALUATED -> EVALUATED re-evaluation
          revises landed cost and score, and only then can a terminal
          ACCEPTED/PASSED/CANCELLED state be taken — the loop is exercised once
          before accept, and the acceptance commits only the final terms.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor V1 STANDARD. Lot L3 IMMEDIATE asking 6000000."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "L3-CYCLE", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 6000000, mixed_lot: false, unit_count: 40, expected_sell_through_pct: 0.8, estimated_unit_retail_cents: 20000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_l3_id: $.data.id }
            - call: "POST /lots/${lot_l3_id}/lot-lines"
              payload: { style_code: "CYC-1", department: "APPAREL", quantity: 40, unit_cost_cents: 150000, compare_at_claim_cents: 40000, target_retail_cents: 20000 }
              as: Buyer
          trigger:
            - call: "POST /lots/${lot_l3_id}/evaluate"
              payload: { negotiated_price_cents: 6000000 }
              as: Buyer
              captures: { eval1_version: $.data.version }
            - call: "POST /lots/${lot_l3_id}/evaluate"
              payload: { negotiated_price_cents: 5900000 }
              as: Buyer
              captures: { eval2_version: $.data.version }
            - call: "POST /lots/${lot_l3_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
          assert:
            - "the second evaluate succeeded from EVALUATED (cyclic re-entry): Lot.version advanced from ${eval1_version} to ${eval2_version}"
            - "Lot.${lot_l3_id}.deal_quality_score == 42.15 after re-negotiation (landed 6050000; unit basis 15125; margin 0.24375; 100*(0.6*0.24375 + 0.4*0.8) + 10 = 56.425 clamped blend -> 56.43)"
            - "Lot.${lot_l3_id}.status == ACCEPTED after the loop exits through the terminal accept"
            - "MerchandiseSeason.${ss2027_id}.committed_forward_cents == 6050000 (only the final negotiated landed cost committed, not the sum of both evaluations)"

      - name: packaway_hold_aging_review_keep_loop_then_release
        grounds:
          - state_machines.PackawayHold.STORED_to_AGING_REVIEW
          - state_machines.PackawayHold.AGING_REVIEW_to_STORED
          - state_machines.PackawayHold.AGING_REVIEW_to_RELEASED
        distinguishing_aspect: |
          The PackawayHold machine is cyclic: STORED -> AGING_REVIEW -> STORED
          (keep) loops before AGING_REVIEW -> RELEASED exits the cycle, with
          each loop accruing holding cost and bumping review_count — a
          different entity than the Lot negotiation cycle.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN, FW2027 DRAFT (start 2027-08-01). Vendor STANDARD zone MT."
            - "PACKAWAY lot PA2 asking 1000000 (landed 1150000) ACCEPTED; warehouse WMT rate 5000; hold H entered 2026-09-01 with window [2027-07-01, 2027-08-31], 4 pallets."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-08-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2027h_id: $.data.id }
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "PA2", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${fw2027h_id}" }
              as: Buyer
              captures: { lot_pa2_id: $.data.id }
            - call: "POST /lots/${lot_pa2_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_pa2_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /merchandise-seasons/${ss2027_id}/close"
              payload: {}
              as: PlanningLead
              note: "lot is ACCEPTED (terminal), no holds or plans exist yet, so the close is admitted"
            - call: "POST /merchandise-seasons/${fw2027h_id}/open"
              payload: {}
              as: PlanningLead
            - call: "POST /warehouses"
              payload: { warehouse_code: "WMT-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_mt2_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa2_id}", warehouse_id: "${wh_mt2_id}", pallet_count: 4, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_pa2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: PlanningLead
          trigger:
            - call: "POST /packaway-holds/${hold_pa2_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_pa2_id}/aging-review"
              payload: { trigger_reason: "DECISION_KEEP" }
              as: InventoryPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: PlanningLead
            - call: "POST /packaway-holds/${hold_pa2_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_pa2_id}/aging-review"
              payload: { trigger_reason: "DECISION_RELEASE" }
              as: InventoryPlanner
          assert:
            - "PackawayHold.${hold_pa2_id}.review_count == 3 (threshold review, keep decision, threshold review)"
            - "after DECISION_KEEP the hold returned to STORED (cycle completed once)"
            - "after DECISION_RELEASE the hold is RELEASED with release_date == 2027-08-01"
            - "PackawayHold.${hold_pa2_id}.accrued_holding_cost_cents == 222666 (334 days: 11 full months * 20000 = 220000 + floor(20000*4/30) = 2666, pro_rata_daily)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: receipt_complete_shrinkcase_storesku_soldout_chain
        grounds:
          - state_machines.Receipt.OPEN_to_RECEIVED
          - state_machines.ShrinkCase.OPEN_to_CONFIRMED
          - state_machines.StoreSku.ON_FLOOR_to_SOLD_OUT
          - calculations.receipt_variance_valuation
          - calculations.shrink_valuation
        distinguishing_aspect: |
          Depth >= 3 cascade from receipt completion: completing the receipt
          mutates ReceiptLine (variance valuation), which itself creates an
          OPEN ShrinkCase per short line; a separate traceable shrink confirm
          on the same lot mutates StoreSku on-hand, which at zero triggers the
          SOLD_OUT transition — each hop caused by the previous link.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor V1 STANDARD zone MT."
            - "Lot L4 IMMEDIATE asking 6000000 negotiated 6000000 (landed 6150000), unit_count 40, one line qty 40 unit_cost 150000, ACCEPTED."
            - "Ticket T1 for the line in zone MT. Store ST1 (SUBURBAN_FAMILY, MT). StoreSku SS1 with 10 units on hand priced by T1."
            - "Receipt R4 opened; line declared 40, received 30."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "L4-CASCADE", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 6000000, mixed_lot: false, unit_count: 40, expected_sell_through_pct: 0.8, estimated_unit_retail_cents: 20000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_l4_id: $.data.id }
            - call: "POST /lots/${lot_l4_id}/lot-lines"
              payload: { style_code: "CASCADE-1", department: "APPAREL", quantity: 40, unit_cost_cents: 150000, compare_at_claim_cents: 40000, target_retail_cents: 20000 }
              as: Buyer
              captures: { line_l4_id: $.data.id }
            - call: "POST /lots/${lot_l4_id}/evaluate"
              payload: { negotiated_price_cents: 6000000 }
              as: Buyer
            - call: "POST /lots/${lot_l4_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_l4_id}", zone_code: "MT" }
              as: PricingAnalyst
              captures: { ticket_t1_id: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "ST1", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_st1_id: $.data.id }
            - call: "POST /store-skus"
              payload: { store_id: "${store_st1_id}", lot_line_id: "${line_l4_id}", ticket_id: "${ticket_t1_id}", season_id: "${ss2027_id}", units_on_hand: 10 }
              as: StoreOpsLead
              captures: { ss1_id: $.data.id }
            - *dd_wh_w1
            - call: "POST /receipts"
              payload: { lot_id: "${lot_l4_id}", warehouse_id: "${wh_w1_id}" }
              as: WarehouseClerk
              captures: { receipt_r4_id: $.data.id }
            - call: "GET /receipts/${receipt_r4_id}/receipt-lines"
              payload: {}
              as: WarehouseClerk
              captures: { rl4_id: "$.data[0].id" }
            - call: "PATCH /receipts/${receipt_r4_id}/lines/${rl4_id}"
              payload: { received_qty: 30 }
              as: WarehouseClerk
            - call: "POST /receipts/${receipt_r4_id}/complete"
              payload: {}
              as: WarehouseClerk
            - call: "POST /shrink-cases"
              payload: { store_id: "${store_st1_id}", store_sku_id: "${ss1_id}", lot_id: "${lot_l4_id}", shrink_type: "UNSCANNED_UNIT", units_lost: 10, units_untraceable: 0 }
              as: ShrinkAuditor
              captures: { sc4b_id: $.data.id }
          trigger:
            - call: "POST /shrink-cases/${sc4b_id}/confirm"
              payload: {}
              as: ShrinkAuditor
          assert:
            - "ShrinkCase.${sc4b_id}.shrink_value_cents == 1537500 (10 * round_half_up(6150000/40) = 10 * 153750)"
            - "StoreSku.${ss1_id}.units_on_hand == 0 after the confirm cascade"
            - "StoreSku.${ss1_id}.status == SOLD_OUT (the on-hand-zero transition fired as a consequence of the shrink mutation, not a direct deplete call)"
            - "MerchandiseSeason.${ss2027_id}.spent_forward_cents == 4612500 (receipt hop still settled)"

      - name: hold_aging_liquidate_liquidationorder_storesku_liquidated_chain
        grounds:
          - state_machines.PackawayHold.AGING_REVIEW_to_LIQUIDATED
          - state_machines.LiquidationOrder.DRAFT_to_APPROVED
          - state_machines.LiquidationOrder.APPROVED_to_EXECUTED
          - state_machines.StoreSku.ON_FLOOR_to_LIQUIDATED
          - calculations.liquidation_recovery
        distinguishing_aspect: |
          Depth 3 cascade from a different trigger: the aging-review liquidate
          decision mutates the hold and itself creates a DRAFT LiquidationOrder
          for a clearance store that already holds the same lot line on the
          floor; approving then executing that order mutates the affected
          StoreSku to LIQUIDATED with the actual recovery variant — the chain
          is triggered by an InventoryPlanner review, not by any receipt or
          store action.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN, FW2027 DRAFT. Vendor STANDARD zone MT."
            - "PACKAWAY lot PA3 asking 1000000 (landed 1150000) ACCEPTED with one LotLine; warehouse WMT; hold HP3 4 pallets window [2027-07-01, 2027-08-31]."
            - "Clearance store STC (clearance_outlet true, zone MT) with a StoreSku of the same lot line (ticket for MT) holding 50 units at 9999 cents."
            - "Clock advanced to 2027-06-01 (273 days, STALE)."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-08-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2027i_id: $.data.id }
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "PA3", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${fw2027i_id}" }
              as: Buyer
              captures: { lot_pa3_id: $.data.id }
            - call: "POST /lots/${lot_pa3_id}/lot-lines"
              payload: { style_code: "PA3-S", department: "HOME", quantity: 100, unit_cost_cents: 11500, compare_at_claim_cents: 15000, target_retail_cents: 10000 }
              as: Buyer
              captures: { line_pa3_id: $.data.id }
            - call: "POST /lots/${lot_pa3_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_pa3_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /warehouses"
              payload: { warehouse_code: "WMT-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_mt3_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa3_id}", warehouse_id: "${wh_mt3_id}", pallet_count: 4, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_pa3_id: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "STC", cluster_code: "VALUE_RURAL", zone_code: "MT", storage_capacity_units: 500, clearance_outlet: true }
              as: AllocationManager
              captures: { store_stc_id: $.data.id }
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_pa3_id}", zone_code: "MT" }
              as: PricingAnalyst
              captures: { ticket_pa3_id: $.data.id }
            - call: "POST /store-skus"
              payload: { store_id: "${store_stc_id}", lot_line_id: "${line_pa3_id}", ticket_id: "${ticket_pa3_id}", season_id: "${ss2027_id}", units_on_hand: 50 }
              as: StoreOpsLead
              captures: { ss_stc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlanningLead
          trigger:
            - call: "POST /packaway-holds/${hold_pa3_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_pa3_id}/aging-review"
              payload: { trigger_reason: "DECISION_LIQUIDATE" }
              as: InventoryPlanner
            - call: "GET /lots/${lot_pa3_id}/liquidation-orders"
              payload: {}
              as: PlanningLead
              captures: { lo3_id: "$.data[0].id", lo3_rate: "$.data[0].recovery_rate_pct" }
            - call: "POST /liquidation-orders/${lo3_id}/approve"
              payload: {}
              as: PlanningLead
            - call: "POST /liquidation-orders/${lo3_id}/execute"
              payload: { actual_units: 40 }
              as: StoreOpsLead
          assert:
            - "PackawayHold.${hold_pa3_id}.status == LIQUIDATED and review_count == 2"
            - "a LiquidationOrder ${lo3_id} with reason PACKAWAY_STALE, store_id == ${store_stc_id} was created by the review cascade (not by a direct POST /liquidation-orders)"
            - "after approve, recovery_value_cents == 124988 (provisional: round_half_up(50 * 9999 * 0.25) = round_half_up(124987.50) with the cascade-pinned recovery_rate_pct 0.25)"
            - "after execute with actual_units 40, recovery_value_cents == 99990 (actual variant: round_half_up(40 * 9999 * 0.25) = 99990) and StoreSku.${ss_stc_id}.status == LIQUIDATED with units_on_hand == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_fiscal_on_lot_accept
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - errors.ERR_OTB_FORWARD_EXCEEDED
        distinguishing_aspect: |
          Category pair (state, business_fiscal): accepting a lot that is still
          OFFERED (never evaluated) AND whose landed cost would exceed forward
          OTB must yield ERR_INVALID_STATE (priority 5), not
          ERR_OTB_FORWARD_EXCEEDED (priority 11).
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor V1 STANDARD."
            - "Lot L5 IMMEDIATE asking 50000000 (would exceed the 21000000 forward cap if evaluated) left in OFFERED state."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "L5-CONFLICT", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 50000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.8, estimated_unit_retail_cents: 1000000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_l5_id: $.data.id }
          trigger:
            - call: "POST /lots/${lot_l5_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
              captures: { err5: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE (lot is OFFERED, not EVALUATED)"
            - "ERR_OTB_FORWARD_EXCEEDED is NOT returned even though the asking price would breach the forward cap"
            - "Lot.${lot_l5_id}.status remains OFFERED and MerchandiseSeason.${ss2027_id}.committed_forward_cents == 0"

      - name: business_temporal_vs_stale_version_on_packaway_release
        grounds:
          - validations[priority=8]
          - validations[priority=25]
          - errors.ERR_HOLD_WINDOW_CLOSED
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: |
          Category pair (business_temporal, OCC stale-version): releasing a
          hold with a deliberately stale expected_hold_version AND a release
          date outside the window must yield 422 ERR_HOLD_WINDOW_CLOSED
          (priority 8), not 412 ERR_STALE_VERSION (priority 25).
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN, FW2027 DRAFT. Vendor STANDARD zone MT."
            - "PACKAWAY lot PA4 asking 1000000 (landed 1150000) ACCEPTED; hold HP4 2 pallets window [2027-07-01, 2027-08-31] entered 2026-09-01 (version 1 at creation)."
            - "An aging review at 2026-12-10 bumps the hold version; the release attempt uses the pre-review version expression and is outside the window."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - call: "POST /merchandise-seasons"
              payload: { season_code: "FW2027", start_date: "2027-08-01T00:00:00Z", end_date: "2027-12-31T00:00:00Z", department_otb_budget_cents: 5000000, packaway_reserve_ratio: 0.20 }
              as: PlanningLead
              captures: { fw2027j_id: $.data.id }
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "PA4", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 1000000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${fw2027j_id}" }
              as: Buyer
              captures: { lot_pa4_id: $.data.id }
            - call: "POST /lots/${lot_pa4_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_pa4_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /warehouses"
              payload: { warehouse_code: "WMT-DEN", pallet_capacity: 200, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_mt4_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_pa4_id}", warehouse_id: "${wh_mt4_id}", pallet_count: 2, release_window_start: "2027-07-01T00:00:00Z", release_window_end: "2027-08-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_pa4_id: $.data.id, hold_pa4_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T00:00:00Z" }
              as: PlanningLead
            - call: "POST /packaway-holds/${hold_pa4_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_pa4_id}/aging-review"
              payload: { trigger_reason: "DECISION_KEEP" }
              as: InventoryPlanner
          trigger:
            - call: "POST /packaway-holds/${hold_pa4_id}/release"
              payload: { expected_hold_version: "${hold_pa4_v}" }
              as: InventoryPlanner
              captures: { err_rel: $.data.error_id }
          assert:
            - "the release attempt fails with 422 ERR_HOLD_WINDOW_CLOSED (2026-12-10 is outside [2027-07-01, 2027-08-31]; temporal priority 8 beats OCC priority 25)"
            - "ERR_STALE_VERSION is NOT returned despite the stale expected_hold_version (hold version advanced twice by the review loop)"
            - "PackawayHold.${hold_pa4_id}.status remains STORED and release_date is null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: otb_forward_admission_at_exact_cap_boundary
        grounds:
          - calculations.open_to_buy_forward_commit
          - validations[priority=11]
          - errors.ERR_OTB_FORWARD_EXCEEDED
        distinguishing_aspect: |
          Numeric threshold boundary on forward OTB: with forward cap
          21000000 and committed 6150000, a candidate landed cost of exactly
          14850000 is admitted (<=), while 14850001 is rejected — the boundary
          sits on the <= operator, not <.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN (budget 30000000, reserve 0.30: forward cap 21000000). Vendor V1 STANDARD."
            - "Lot LB1 IMMEDIATE negotiated 6000000 (landed 6150000) ACCEPTED -> committed_forward 6150000."
            - "Lot LB2 IMMEDIATE asking 14650000; Lot LB3 IMMEDIATE asking 14650001; both EVALUATED with negotiated equal to asking (landed 14850000 and 14850001 after the 150000 freight surcharge)."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
            - *dd_open_ss2027
            - *dd_zone_mt
            - *dd_vendor_v1
            - call: "POST /lots"
              payload: { lot_code: "LB1", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 6000000, mixed_lot: false, unit_count: 40, expected_sell_through_pct: 0.8, estimated_unit_retail_cents: 20000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_lb1_id: $.data.id }
            - call: "POST /lots/${lot_lb1_id}/lot-lines"
              payload: { style_code: "LB1-S", department: "APPAREL", quantity: 40, unit_cost_cents: 150000, compare_at_claim_cents: 40000, target_retail_cents: 20000 }
              as: Buyer
            - call: "POST /lots/${lot_lb1_id}/evaluate"
              payload: { negotiated_price_cents: 6000000 }
              as: Buyer
            - call: "POST /lots/${lot_lb1_id}/accept"
              payload: { expected_season_version: "${ss2027_v}" }
              as: Buyer
            - call: "POST /lots"
              payload: { lot_code: "LB2", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 14650000, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 300000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_lb2_id: $.data.id }
            - call: "POST /lots/${lot_lb2_id}/evaluate"
              payload: { negotiated_price_cents: 14650000 }
              as: Buyer
            - call: "POST /lots"
              payload: { lot_code: "LB3", vendor_id: "${vendor_v1_id}", season_id: "${ss2027_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 14650001, mixed_lot: false, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 300000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_lb3_id: $.data.id }
            - call: "POST /lots/${lot_lb3_id}/evaluate"
              payload: { negotiated_price_cents: 14650001 }
              as: Buyer
          trigger:
            - call: "POST /lots/${lot_lb2_id}/accept"
              payload: { expected_season_version: "${ss2027_v} + 1" }
              as: Buyer
            - call: "POST /lots/${lot_lb3_id}/accept"
              payload: { expected_season_version: "${ss2027_v} + 2" }
              as: Buyer
              captures: { err_b3: $.data.error_id }
          assert:
            - "LB2 accept succeeds: landed 14850000 == forward availability exactly (21000000 - 6150000), admitted by <="
            - "MerchandiseSeason.${ss2027_id}.committed_forward_cents == 21000000 (cap fully committed, zero headroom)"
            - "LB3 accept fails with 422 ERR_OTB_FORWARD_EXCEEDED: landed 14850001 exceeds availability by one cent"
            - "Lot.${lot_lb3_id}.status remains EVALUATED"

      - name: hold_age_bucket_at_exactly_aging_review_days
        grounds:
          - calculations.hold_age_bucket
          - validations[priority=9]
          - errors.ERR_AGING_REVIEW_PREMATURE
        distinguishing_aspect: |
          Integer-day threshold boundary on hold age: at exactly 90 days the
          bucket flips FRESH -> AGING (>=) and the aging review is admitted,
          while at 89 days it is rejected with ERR_AGING_REVIEW_PREMATURE —
          a different metric (days) and endpoint than the OTB cents boundary.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN, FW2027 DRAFT. Vendor STANDARD zone MT."
            - "PACKAWAY lot PA5 ACCEPTED; hold HB entered 2026-09-01 window [2027-07-01, 2027-08-31], 2 pallets."
          setup_api_calls:
            - *dd_clock
            - *dd_season_ss2027
