              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
          trigger:
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_SSI_NOT_APPROVED (no APPROVED revision to pin)"

      - name: create_technician_invalid_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_VALIDATION]", entities.Technician.fields.certifications]
        distinguishing_aspect: "Enum closure: a certification method outside {CONCRETE_STRENGTH, SOIL_COMPACTION, WELD_VISUAL, BOLT_TENSION} fails ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/technicians"
              payload: { full_name: "Bad Cert", employee_code: "T9", certifications: [ { method: "XRAY", level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {err: $.data.error_id}
          assert:
            - "http status 400 and error_id == ERR_VALIDATION"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_envelope_pagination_defaults
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "A list endpoint returns response_type array with meta.api_request_id and the pagination fields limit=10, offset=0, total_count=0, has_more=false on an empty collection."
        test_recipe:
          setup: ["one project with no NCRs"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Envelope", permit_number: "P-EP-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id}
          trigger:
            - call: "GET /api/projects/${proj_id}/ncrs"
              as: ProjectManager
          assert:
            - "response body has meta.api_request_id and meta.api_request_timestamp; response_type == 'array'"
            - "data == [] with total_count == 0, has_more == false, limit == 10, offset == 0 (pagination defaults)"

      - name: assignments_list_filters_compose
        claim_type: listing
        grounds: ["endpoints:GET /api/assignments"]
        distinguishing_aspect: "Filtered list composition: GET /api/assignments?technician_id=X&work_date=2026-05-04 returns exactly the assignments matching both predicates (1 of 2), not the union."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item required_count 5); technicians t1 and t2; assignment a1 for t1 and assignment a2 for t2, both 2026-05-04 non-overlapping"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Filters", permit_number: "P-EP-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 5, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech Two", employee_code: "T2", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t2: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t2}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a2: $.data.id}
          trigger:
            - call: "GET /api/assignments?technician_id=${t1}&work_date=2026-05-04"
              as: ProjectManager
              captures: {hit: "$.data[0].id"}
          assert:
            - "exactly one assignment returned and its id == ${a1} (intersection, not union)"

      - name: letter_blocked_when_dir_coverage_missing
        claim_type: conditional_action
        grounds: [calculations.project_posture_derivation, "errors[ERR_POSTURE_NOT_READY]"]
        distinguishing_aspect: "The READY_FOR_LETTER gate has a DIR-coverage clause independent of scope satisfaction: with all items SATISFIED and zero NCRs but a COMPLETED assignment lacking covered_by_dir_id, posture stays IN_PROGRESS and issue-letter fails."
        test_recipe:
          setup: ["project with APPROVED SSI (one soil item required_count 1) fully satisfied; assignment COMPLETED; NO daily report filed"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "NoDIR", permit_number: "P-EP-3", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a1: $.data.id}
            - call: "POST /api/assignments/${a1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${a1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments/${a1}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {posture: $.data.compliance_posture}
          assert:
            - "error_id == ERR_POSTURE_NOT_READY and compliance_posture == IN_PROGRESS (DIR coverage missing blocks readiness)"

      - name: void_letter_cycles_project_back_to_active
        claim_type: side_effect_execution
        grounds: [state_machines.Project.COMPLETED_to_ACTIVE, state_machines.Project.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "Project letter lifecycle is cyclic: issue -> void-letter (BuildingOfficial) returns status ACTIVE with letter_status VOIDED and posture recomputed to READY_FOR_LETTER; a subsequent issue-letter succeeds again."
        test_recipe:
          setup: ["project with APPROVED SSI (one soil item required_count 1) fully satisfied, assignment COMPLETED and covered by a SUBMITTED DIR; letter ISSUED"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "VoidCycle", permit_number: "P-EP-4", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a1: $.data.id}
            - call: "POST /api/assignments/${a1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${a1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments/${a1}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-04", assignment_ids: ["${a1}"], summary: "pad tested" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/projects/${proj_id}/void-letter"
              payload: { void_reason: "late NCR discovered by audit" }
              as: BuildingOfficial
              captures: {st: $.data.status, lstat: $.data.letter_status}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {posture: $.data.compliance_posture, reason: $.data.letter_void_reason}
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
              as: ProjectManager
              captures: {relstat: $.data.letter_status}
          assert:
            - "after void: status == ACTIVE, letter_status == VOIDED, letter_void_reason == 'late NCR discovered by audit'"
            - "posture recomputed to READY_FOR_LETTER (gates still satisfied)"
            - "re-issue succeeds: letter_status == ISSUED again"

      - name: void_letter_when_none_issued_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Project.COMPLETED_to_ACTIVE, "errors[ERR_NO_LETTER_TO_VOID]"]
        distinguishing_aspect: "void-letter requires letter_status == ISSUED: on a fresh project it fails ERR_NO_LETTER_TO_VOID."
        test_recipe:
          setup: ["one project, letter_status NONE"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "NoLetter", permit_number: "P-EP-5", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id}
          trigger:
            - call: "POST /api/projects/${proj_id}/void-letter"
              payload: { void_reason: "premature" }
              as: BuildingOfficial
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_NO_LETTER_TO_VOID"

      - name: double_issue_letter_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Project.ACTIVE_to_COMPLETED, "errors[ERR_LETTER_ALREADY_ISSUED]"]
        distinguishing_aspect: "Second issue-letter on a COMPLETED project fails ERR_LETTER_ALREADY_ISSUED (state precondition, not silent idempotency)."
        test_recipe:
          setup: ["project READY_FOR_LETTER then letter ISSUED (same chain as void_letter_cycles_project_back_to_active setup)"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "DoubleIssue", permit_number: "P-EP-6", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a1: $.data.id}
            - call: "POST /api/assignments/${a1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${a1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments/${a1}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-04", assignment_ids: ["${a1}"], summary: "pad tested" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_LETTER_ALREADY_ISSUED"

      - name: mutation_blocked_after_project_completed
        claim_type: conditional_action
        grounds: ["validations[priority=4]", "errors[ERR_PROJECT_COMPLETED]"]
        distinguishing_aspect: "Global completed-gate: after the letter issues, creating a new assignment under the COMPLETED project fails ERR_PROJECT_COMPLETED (the posture gate freezes child mutations)."
        test_recipe:
          setup: ["project with letter ISSUED (same ready chain as double_issue_letter_rejected setup); technician t1"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Frozen", permit_number: "P-EP-7", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {a1: $.data.id}
            - call: "POST /api/assignments/${a1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${a1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/assignments/${a1}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-04", assignment_ids: ["${a1}"], summary: "pad tested" }
              as: Technician
              as_user_id: "${t1}"
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
