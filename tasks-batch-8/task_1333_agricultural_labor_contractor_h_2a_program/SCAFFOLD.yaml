# =============================================================================
# Task 1333 — Agricultural Labor Contractor & H-2A Program — Seed Tables
# =============================================================================

scenario: |
  Agricultural Labor Contractor & H-2A Program (H-2A farm labor contractor): job order & prevailing wage determination, recruitment & domestic worker preference period, visa petition & consular scheduling, housing inspection & transportation obligation, three-quarters guarantee & wage reconciliation, piece-rate vs adverse-effect wage make-up, contract worker transfer between growers, audit & enforcement exposure

domain_name: h2a-labor-contractor
api_prefix: /h2a

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: hybrid          # JobOrder-rooted tree + flat Worker / TransferRequest cross-refs
  state_machine_shape: cyclic      # JobOrder deficiency cure loop; VisaPetition RFE loop; HousingUnit recert loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# Money is integer cents. Dates are ISO 8601 calendar dates (YYYY-MM-DD).
# "clock" below = the server logical clock (see POST /h2a/_clock/set_current_utc;
# default 2026-08-01T00:00:00Z before any set call).
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Grower / fixed-site employer legal name" }
      - { name: fein, type: string, source: input, description: "Federal employer identification number; unique across growers", constraints: "unique" }
      - { name: state_code, type: string, source: input, description: "Primary state of operation (2-letter)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEBARRED; ACTIVE at creation; SUSPENDED on penalty assessment; DEBARRED on debarment", default: ACTIVE, constraints: "ACTIVE | SUSPENDED | DEBARRED" }
      - { name: debarment_ends_on, type: string, source: computed, description: "ISO date debarment ends (decision date + debarment_years*365 days); null unless DEBARRED", default: null }

  - name: WageDetermination
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State the wage survey applies to" }
      - { name: crop, type: string, source: input, description: "Crop name (case-insensitive unique key part)" }
      - { name: activity, type: enum, source: input, description: "HARVEST | PACKING | PLANTING | GENERAL", constraints: "HARVEST | PACKING | PLANTING | GENERAL" }
      - { name: effective_year, type: integer, source: input, description: "Calendar year the determination applies to" }
      - { name: aewr_hourly_cents, type: integer, source: input, description: "Adverse Effect Wage Rate, cents/hour, > 0" }
      - { name: prevailing_hourly_cents, type: integer, source: input, description: "Prevailing hourly wage, cents/hour, > 0" }
      - { name: prevailing_piece_rate_cents_per_unit, type: integer, source: input, description: "Prevailing piece rate cents per unit; null if none surveyed", default: null }
      - { name: piece_unit_name, type: string, source: input, description: "Unit name for piece work (e.g. BOX); null when no piece rate", default: null }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED; creating a determination whose (state_code, crop, activity, effective_year) matches an existing PUBLISHED row flips the older row to SUPERSEDED", default: PUBLISHED, constraints: "PUBLISHED | SUPERSEDED; at most one PUBLISHED per (state_code, crop, activity, effective_year)" }

  - name: JobOrder
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; the grower this job order serves" }
      - { name: wage_determination_id, type: string, source: input, description: "FK -> WageDetermination.id; must reference a PUBLISHED determination at submit time" }
      - { name: title, type: string, source: input, description: "Job order title" }
      - { name: crop, type: string, source: input, description: "Crop for this order" }
      - { name: activity, type: enum, source: input, description: "HARVEST | PACKING | PLANTING | GENERAL", constraints: "HARVEST | PACKING | PLANTING | GENERAL" }
      - { name: worksite_state, type: string, source: input, description: "2-letter state code of the worksite" }
      - { name: work_start_date, type: string, source: input, description: "First day of the work contract period (ISO date)" }
      - { name: work_end_date, type: string, source: input, description: "Last day of the work contract period (ISO date); must be >= work_start_date" }
      - { name: daily_standard_hours, type: integer, source: input, description: "Contract standard hours per workday (1..12), basis of the 3/4 guarantee" }
      - { name: workers_requested, type: integer, source: input, description: "Total workers requested (domestic + H-2A), >= 1" }
      - { name: offered_hourly_cents, type: integer, source: input, description: "Employer-offered hourly wage, cents, > 0" }
      - { name: offered_piece_rate_cents_per_unit, type: integer, source: input, description: "Employer-offered piece rate cents/unit; null = no piece work offered", default: null }
      - { name: inbound_transport_cents, type: integer, source: input, description: "Inbound transportation reimbursement per worker, cents, >= 0" }
      - { name: outbound_transport_cents, type: integer, source: input, description: "Outbound (return) transportation per worker, cents, >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DEFICIENCY | CERTIFIED | RECRUITING | PETITIONING | ACTIVE | CLOSING | CLOSED | WITHDRAWN", default: DRAFT }
      - { name: deficiency_note, type: string, source: system, description: "Reviewer note recorded at flag-deficiency; null otherwise", default: null }
      - { name: locked_aewr_hourly_cents, type: integer, source: system, description: "AEWR snapshot locked from the wage determination at submit; null while DRAFT", default: null }
      - { name: locked_prevailing_hourly_cents, type: integer, source: system, description: "Prevailing hourly snapshot locked at submit; null while DRAFT", default: null }
      - { name: locked_prevailing_piece_rate_cents_per_unit, type: integer, source: system, description: "Prevailing piece-rate snapshot locked at submit; null while DRAFT", default: null }
      - { name: required_hourly_floor_cents, type: integer, source: computed, description: "Read-only. After submit: max(locked_aewr, locked_prevailing, offered_hourly, 725). While DRAFT: computed from the referenced (live) determination. FEDERAL_MINIMUM_WAGE_CENTS = 725" }
      - { name: effective_piece_rate_cents_per_unit, type: integer, source: computed, description: "Read-only. null when both offered piece rate and (locked/live) prevailing piece rate are null; otherwise max of the non-null values" }
      - { name: total_calendar_days, type: integer, source: computed, description: "Read-only = (work_end_date - work_start_date).days + 1" }
      - { name: total_workdays, type: integer, source: computed, description: "Read-only = count of dates in [work_start_date, work_end_date] inclusive whose weekday is not Sunday" }
      - { name: recruitment_cutoff_date, type: string, source: computed, description: "Read-only = work_start_date + (floor(total_calendar_days / 2) - 1) days; domestic preference obligation covers applications with applied_on <= this date" }
      - { name: transport_threshold_date, type: string, source: computed, description: "Read-only = same date as recruitment_cutoff_date (the 50% point of the contract period)" }
      - { name: domestic_hired_count, type: integer, source: computed, description: "Read-only = count of DomesticApplication rows for this order with status HIRED" }
      - { name: visa_worker_ceiling, type: integer, source: computed, description: "Read-only = workers_requested - domestic_hired_count; upper bound for petition requested_worker_count at file time" }

  - name: DomesticApplication
    parent: JobOrder
    common_fields: true
    fields:
      - { name: job_order_id, type: string, source: system, description: "FK -> JobOrder.id; set from path" }
      - { name: applicant_name, type: string, source: input, description: "US domestic worker applicant name" }
      - { name: contact_phone, type: string, source: input, description: "Applicant contact phone" }
      - { name: applied_on, type: string, source: system, description: "ISO date of application = clock date at creation" }
      - { name: status, type: enum, source: system, description: "APPLIED | HIRED | REJECTED | WITHDRAWN; WITHDRAWN only via job-order withdraw/debar cascade", default: APPLIED, constraints: "APPLIED | HIRED | REJECTED | WITHDRAWN" }
      - { name: qualification, type: enum, source: system, description: "QUALIFIED | UNQUALIFIED; set by the decide endpoint; null while APPLIED", default: null, constraints: "QUALIFIED | UNQUALIFIED | null" }
      - { name: decided_on, type: string, source: system, description: "ISO date of decision; null while APPLIED", default: null }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Worker legal name" }
      - { name: passport_number, type: string, source: input, description: "Passport number; unique across workers", constraints: "unique" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: country_code, type: string, source: input, description: "ISO country code of origin" }
      - { name: status, type: enum, source: system, description: "REGISTERED | PETITIONED | VISA_ISSUED | WORKING | DEPARTED | ABANDONED", default: REGISTERED }
      - { name: petition_id, type: string, source: system, description: "FK -> VisaPetition.id; the petition this worker is linked to; null when REGISTERED", default: null }

  - name: VisaPetition
    parent: JobOrder
    common_fields: true
    fields:
      - { name: job_order_id, type: string, source: system, description: "FK -> JobOrder.id; set from path" }
      - { name: receipt_code, type: string, source: input, description: "Petition receipt number; unique", constraints: "unique" }
      - { name: requested_worker_count, type: integer, source: input, description: "Beneficiaries requested, >= 1; at file time must be <= job order visa_worker_ceiling" }
      - { name: approved_worker_count, type: integer, source: system, description: "Set at approval = adjudicate input approved_worker_count; null until APPROVED", default: null }
      - { name: rfe_count, type: integer, source: system, description: "Number of RFEs issued; increments on each issue-rfe; hard limit 2", default: 0 }
      - { name: filed_on, type: string, source: system, description: "ISO date petition moved DRAFT->FILED; null while DRAFT", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | RFE | APPROVED | DENIED | WITHDRAWN", default: DRAFT }

  - name: ConsularAppointment
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; worker must be linked to petition_id" }
      - { name: petition_id, type: string, source: input, description: "FK -> VisaPetition.id; petition must be APPROVED" }
      - { name: consulate_code, type: string, source: input, description: "Consulate identifier (e.g. MEX-MTY)" }
      - { name: appointment_date, type: string, source: input, description: "ISO date of the interview; must be strictly after clock date at creation" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: outcome, type: enum, source: system, description: "ISSUED | REFUSED | NO_SHOW; set by complete; null until COMPLETED", default: null, constraints: "ISSUED | REFUSED | NO_SHOW | null" }
      - { name: completed_on, type: string, source: system, description: "ISO date completed; null until COMPLETED", default: null }

  - name: HousingUnit
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; grower whose worksite the unit serves" }
      - { name: name, type: string, source: input, description: "Unit name / address label" }
      - { name: capacity, type: integer, source: input, description: "Maximum simultaneous occupants, >= 1" }
      - { name: inspection_status, type: enum, source: system, description: "UNINSPECTED | CERTIFIED | FAILED | EXPIRED; driven by inspections and expire", default: UNINSPECTED, constraints: "UNINSPECTED | CERTIFIED | FAILED | EXPIRED" }
      - { name: certified_on, type: string, source: system, description: "ISO date of latest PASS inspection; null unless CERTIFIED", default: null }
      - { name: certification_valid_until, type: string, source: computed, description: "Read-only = certified_on + 365 days; null unless CERTIFIED" }
      - { name: occupied_count, type: integer, source: computed, description: "Read-only = count of HousingAssignment rows for this unit with status OCCUPIED" }

  - name: HousingInspection
    parent: HousingUnit
    common_fields: false
    fields:
      - { name: housing_unit_id, type: string, source: system, description: "FK -> HousingUnit.id; set from path" }
      - { name: inspected_on, type: string, source: input, description: "ISO date of inspection; must be <= clock date" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "PASS | FAIL" }
      - { name: deficiency_codes, type: array, source: input, description: "List of deficiency code strings; ignored when result PASS", default: [] }

  - name: HousingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: housing_unit_id, type: string, source: input, description: "FK -> HousingUnit.id" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id" }
      - { name: worker_assignment_id, type: string, source: input, description: "FK -> WorkerAssignment.id; must be ACTIVE and its job order's grower must own the unit" }
      - { name: move_in_date, type: string, source: input, description: "ISO move-in date; occupancy window is [move_in_date, move_out_date) half-open, open end = +infinity while OCCUPIED" }
      - { name: move_out_date, type: string, source: system, description: "ISO move-out date set at vacate (or by assignment-end cascade = assignment ended_on); null while OCCUPIED", default: null }
      - { name: status, type: enum, source: system, description: "OCCUPIED | VACATED", default: OCCUPIED, constraints: "OCCUPIED | VACATED" }

  - name: WorkerAssignment
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; worker must be VISA_ISSUED and petitioned to this job order (except transfer-created rows)" }
      - { name: job_order_id, type: string, source: input, description: "FK -> JobOrder.id; order must be ACTIVE" }
      - { name: started_on, type: string, source: system, description: "ISO date work began (clock date at start, or transfer effective date); null while PLANNED", default: null }
      - { name: ended_on, type: string, source: system, description: "ISO date assignment ended (inclusive last covered day); null until terminal", default: null }
      - { name: end_reason, type: enum, source: system, description: "COMPLETED | FOR_CAUSE | ABANDONED | TRANSFERRED_OUT; null until terminal", default: null, constraints: "COMPLETED | FOR_CAUSE | ABANDONED | TRANSFERRED_OUT | null" }
      - { name: guarantee_eligible, type: boolean, source: computed, description: "Read-only = end_reason not in {FOR_CAUSE, ABANDONED}; true while non-terminal" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | TERMINATED | TRANSFERRED_OUT", default: PLANNED, constraints: "PLANNED | ACTIVE | COMPLETED | TERMINATED | TRANSFERRED_OUT" }

  - name: WorkLog
    parent: WorkerAssignment
    common_fields: false
    fields:
      - { name: worker_assignment_id, type: string, source: input, description: "FK -> WorkerAssignment.id" }
      - { name: work_date, type: string, source: input, description: "ISO date worked; unique per assignment; must be within [assignment.started_on, min(clock date, order.work_end_date)]" }
      - { name: hours_worked, type: number, source: input, description: "Hours worked that day; multiple of 0.25; 0 < hours_worked <= 16" }
      - { name: units_picked, type: integer, source: input, description: "Piece units picked that day, >= 0; must be 0 when the job order's effective_piece_rate is null" }

  - name: WageReconciliation
    parent: WorkerAssignment
    common_fields: true
    fields:
      - { name: worker_assignment_id, type: string, source: system, description: "FK -> WorkerAssignment.id; 1:1, created automatically when the assignment starts" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED; OPEN recomputes (provisional variant) on every WorkLog create; FINALIZED freezes the final variant", default: OPEN, constraints: "OPEN | FINALIZED" }
      - { name: computed_through_date, type: string, source: computed, description: "As-of date: assignment.ended_on when the assignment is terminal (ended assignments stop accruing); otherwise min(clock date, order.work_end_date)" }
      - { name: total_units, type: integer, source: computed, description: "Sum of units_picked over all WorkLogs of the assignment" }
      - { name: piece_earnings_cents, type: integer, source: computed, description: "Sum over workweeks of weekly_units * effective_piece_rate (0 when piece rate null)" }
      - { name: hourly_floor_earnings_cents, type: integer, source: computed, description: "Sum over workweeks of per-week floor earnings; per-week floor = sum over days of round_half_up(day_quarter_hours * floor / 4)" }
      - { name: makeup_pay_cents, type: integer, source: computed, description: "Sum over workweeks of max(0, weekly_floor - weekly_piece)" }
      - { name: guarantee_basis_workdays, type: integer, source: computed, description: "workday_count(max(order.start, assignment.started_on), min(order.end, computed_through_date))" }
      - { name: guaranteed_quarters, type: integer, source: computed, description: "floor(guarantee_basis_workdays * daily_standard_hours * 4 * 3 / 4) in quarter-hours" }
      - { name: worked_quarters, type: integer, source: computed, description: "Sum of hours_worked*4 over WorkLogs inside the guarantee basis window" }
      - { name: shortfall_quarters, type: integer, source: computed, description: "max(0, guaranteed_quarters - worked_quarters)" }
      - { name: guarantee_pay_cents, type: integer, source: computed, description: "round_half_up(shortfall_quarters * required_hourly_floor_cents / 4) when guarantee applies, else 0" }
      - { name: guarantee_applied, type: boolean, source: computed, description: "false only when FINALIZED and end_reason in {FOR_CAUSE, ABANDONED}; true otherwise (provisional assumes eligible)" }
      - { name: inbound_transport_owed_cents, type: integer, source: computed, description: "order.inbound_transport_cents when computed_through_date >= order.transport_threshold_date and (OPEN or end_reason != ABANDONED); else 0" }
      - { name: outbound_transport_owed_cents, type: integer, source: computed, description: "order.outbound_transport_cents when FINALIZED and end_reason == COMPLETED; else 0" }
      - { name: total_due_cents, type: integer, source: computed, description: "piece_earnings_cents + makeup_pay_cents + guarantee_pay_cents + inbound + outbound" }
      - { name: finalized_on, type: string, source: system, description: "ISO date finalized; null while OPEN", default: null }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; the worker being transferred" }
      - { name: from_assignment_id, type: string, source: input, description: "FK -> WorkerAssignment.id; source assignment, must be ACTIVE" }
      - { name: to_job_order_id, type: string, source: input, description: "FK -> JobOrder.id; target order, must be ACTIVE and belong to a different grower" }
      - { name: reason, type: enum, source: input, description: "CONTRACT_IMPOSSIBILITY | GROWER_REQUEST | WORKER_REQUEST", constraints: "CONTRACT_IMPOSSIBILITY | GROWER_REQUEST | WORKER_REQUEST" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requester (audit trail; GrowerRep canceller must match)" }
      - { name: status, type: enum, source: system, description: "PENDING | GROWER_APPROVED | APPROVED | REJECTED | CANCELLED", default: PENDING, constraints: "PENDING | GROWER_APPROVED | APPROVED | REJECTED | CANCELLED" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; audited grower" }
      - { name: job_order_id, type: string, source: input, description: "FK -> JobOrder.id; optional scope; must belong to grower_id when present", default: null }
      - { name: trigger_source, type: enum, source: input, description: "MANUAL | ABANDONMENT | HOUSING | WAGE_DISCREPANCY; system-created abandonment cases use ABANDONMENT", constraints: "MANUAL | ABANDONMENT | HOUSING | WAGE_DISCREPANCY" }
      - { name: note, type: string, source: input, description: "Free-text opening note", default: null }
      - { name: opened_on, type: string, source: system, description: "ISO date the case opened (clock date)" }
      - { name: status, type: enum, source: system, description: "OPEN | FINDINGS_ISSUED | CLOSED_NO_ACTION | RESOLVED_PENALTY | RESOLVED_DEBARMENT", default: OPEN, constraints: "OPEN | FINDINGS_ISSUED | CLOSED_NO_ACTION | RESOLVED_PENALTY | RESOLVED_DEBARMENT" }
      - { name: findings, type: array, source: system, description: "List of {violation_code, count, willful} recorded at issue-findings; [] until then", default: [] }
      - { name: provisional_exposure_cents, type: integer, source: computed, description: "Provisional variant: sum over findings of BASE[violation_code] * count (no willful multiplier, no cap, no discount); null until findings issued", default: null }
      - { name: final_penalty_cents, type: integer, source: computed, description: "Final variant: per violation kind min(BASE*count*(2 if willful else 1), 1000000), summed, then * 90/100 round_half_up when good_faith; null until penalty assessed", default: null }
      - { name: debarment_years, type: integer, source: system, description: "1..3; set by debar; null otherwise", default: null }
      - { name: closed_on, type: string, source: system, description: "ISO date the case reached a terminal state; null while open", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Grower
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /h2a/audit-cases/{id}/assess-penalty (system side effect on the case's grower)"
        actor: system
        preconditions:
          - "AuditCase reaches RESOLVED_PENALTY and grower is ACTIVE"
        side_effects:
          - "Grower.status = SUSPENDED; Grower.version increments"
      - from: SUSPENDED
        to: DEBARRED
        trigger: "POST /h2a/audit-cases/{id}/debar (system side effect)"
        actor: system
        preconditions:
          - "AuditCase reaches RESOLVED_DEBARMENT and grower not already DEBARRED"
        side_effects:
          - "Grower.status = DEBARRED; debarment_ends_on = clock date + debarment_years*365 days"
          - "Cascade: every JobOrder of this grower in {DRAFT, SUBMITTED, DEFICIENCY, CERTIFIED, RECRUITING} -> WITHDRAWN; each such withdrawal cascades: its VisaPetitions in DRAFT -> WITHDRAWN (linked Workers with status PETITIONED -> REGISTERED, petition_id = null) and its DomesticApplications in APPLIED -> WITHDRAWN"
      - from: ACTIVE
        to: DEBARRED
        trigger: "POST /h2a/audit-cases/{id}/debar (system side effect)"
        actor: system
        preconditions:
          - "AuditCase reaches RESOLVED_DEBARMENT and grower ACTIVE"
        side_effects:
          - "Same as SUSPENDED -> DEBARRED (status, debarment_ends_on, cascade)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /h2a/growers/{id}/refresh-status"
        actor: WageAuditor
        preconditions:
          - "Grower SUSPENDED and no AuditCase for this grower in {OPEN, FINDINGS_ISSUED}"
        side_effects:
          - "Grower.status = ACTIVE"
      - from: DEBARRED
        to: ACTIVE
        trigger: "POST /h2a/growers/{id}/refresh-status"
        actor: WageAuditor
        preconditions:
          - "Grower DEBARRED and clock date >= debarment_ends_on"
        side_effects:
          - "Grower.status = ACTIVE; debarment_ends_on = null"
        note: "If no transition applies, refresh-status returns 200 with the grower unchanged."

  - entity: WageDetermination
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /h2a/wage-determinations (system side effect on the prior row)"
        actor: system
        preconditions:
          - "A new WageDetermination is created whose (state_code, crop, activity, effective_year) matches the existing PUBLISHED row"
        side_effects:
          - "Prior row status = SUPERSEDED; prior row version increments; job orders that already submitted keep their locked_* snapshots (pinning)"

  - entity: JobOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /h2a/job-orders/{id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "status == DRAFT or DEFICIENCY (else ERR_JOB_ORDER_INVALID_STATE)"
          - "Grower.status == ACTIVE (else ERR_GROWER_NOT_ACTIVE)"
          - "Referenced WageDetermination.status == PUBLISHED (else ERR_WAGE_DETERMINATION_NOT_PUBLISHED)"
          - "work_end_date >= work_start_date (else ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "locked_aewr_hourly_cents / locked_prevailing_hourly_cents / locked_prevailing_piece_rate_cents_per_unit snapshot from the determination"
          - "status = SUBMITTED; deficiency_note = null"
      - from: DEFICIENCY
        to: SUBMITTED
        trigger: "POST /h2a/job-orders/{id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "Same as DRAFT -> SUBMITTED"
        side_effects:
          - "Same as DRAFT -> SUBMITTED (snapshots re-taken, deficiency_note cleared)"
        note: "Cure leg of the SUBMITTED <-> DEFICIENCY cycle."
      - from: SUBMITTED
        to: DEFICIENCY
        trigger: "POST /h2a/job-orders/{id}/flag-deficiency"
        actor: ProgramReviewer
        preconditions:
          - "status == SUBMITTED (else ERR_JOB_ORDER_INVALID_STATE)"
        side_effects:
          - "status = DEFICIENCY; deficiency_note = input note"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /h2a/job-orders/{id}/certify"
        actor: ProgramReviewer
        preconditions:
          - "status == SUBMITTED (else ERR_JOB_ORDER_INVALID_STATE)"
          - "clock date <= work_start_date - 30 days (CERT_LEAD_DAYS = 30; else ERR_CERTIFICATION_LEAD_TIME)"
        side_effects:
          - "status = CERTIFIED"
      - from: CERTIFIED
        to: RECRUITING
        trigger: "POST /h2a/job-orders/{id}/begin-recruitment"
        actor: ContractorAdmin
        preconditions:
          - "status == CERTIFIED (else ERR_JOB_ORDER_INVALID_STATE)"
        side_effects:
          - "status = RECRUITING"
      - from: RECRUITING
        to: PETITIONING
        trigger: "POST /h2a/job-orders/{id}/close-recruitment"
        actor: ContractorAdmin
        preconditions:
          - "status == RECRUITING (else ERR_JOB_ORDER_INVALID_STATE)"
          - "No DomesticApplication for this order in APPLIED (else ERR_UNDECIDED_APPLICATIONS_REMAIN)"
        side_effects:
          - "status = PETITIONING; visa_worker_ceiling is now fixed by the HIRED count"
      - from: PETITIONING
        to: ACTIVE
        trigger: "POST /h2a/job-orders/{id}/activate"
        actor: ContractorAdmin
        preconditions:
          - "status == PETITIONING (else ERR_JOB_ORDER_INVALID_STATE)"
          - "At least one VisaPetition for this order in APPROVED (else ERR_NO_APPROVED_PETITION)"
          - "clock date >= work_start_date (else ERR_ORDER_NOT_YET_STARTED)"
        side_effects:
          - "status = ACTIVE"
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /h2a/job-orders/{id}/close"
        actor: ContractorAdmin
        preconditions:
          - "status == ACTIVE (else ERR_JOB_ORDER_INVALID_STATE)"
          - "clock date >= work_end_date (else ERR_ORDER_NOT_YET_STARTED analogue: ERR_ORDER_PERIOD_NOT_ENDED)"
          - "Every WorkerAssignment for this order in {COMPLETED, TERMINATED, TRANSFERRED_OUT} (else ERR_OPEN_ASSIGNMENTS_REMAIN)"
        side_effects:
          - "status = CLOSING"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /h2a/job-orders/{id}/finalize"
        actor: ContractorAdmin
        preconditions:
          - "status == CLOSING (else ERR_JOB_ORDER_INVALID_STATE)"
          - "Every WageReconciliation of every assignment of this order is FINALIZED (else ERR_UNFINALIZED_RECONCILIATIONS_REMAIN)"
        side_effects:
          - "status = CLOSED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /h2a/job-orders/{id}/withdraw"
        actor: ContractorAdmin
        preconditions:
          - "status in {DRAFT, SUBMITTED, DEFICIENCY, CERTIFIED, RECRUITING, PETITIONING} (else ERR_JOB_ORDER_INVALID_STATE)"
          - "No VisaPetition for this order in {FILED, RFE, APPROVED} (else ERR_OPEN_PETITIONS_EXIST)"
        side_effects:
          - "status = WITHDRAWN"
          - "Cascade: VisaPetitions in DRAFT -> WITHDRAWN (linked Workers in PETITIONED -> REGISTERED, petition_id = null); DomesticApplications in APPLIED -> WITHDRAWN"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /h2a/job-orders/{id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN"]
        side_effects: ["Same as DRAFT -> WITHDRAWN"]
      - from: DEFICIENCY
        to: WITHDRAWN
        trigger: "POST /h2a/job-orders/{id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN"]
        side_effects: ["Same as DRAFT -> WITHDRAWN"]
      - from: CERTIFIED
        to: WITHDRAWN
        trigger: "POST /h2a/job-orders/{id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN"]
        side_effects: ["Same as DRAFT -> WITHDRAWN"]
      - from: RECRUITING
        to: WITHDRAWN
        trigger: "POST /h2a/job-orders/{id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN"]
        side_effects: ["Same as DRAFT -> WITHDRAWN"]
      - from: PETITIONING
        to: WITHDRAWN
        trigger: "POST /h2a/job-orders/{id}/withdraw"
        actor: ContractorAdmin
        preconditions: ["Same as DRAFT -> WITHDRAWN (the no-open-petitions guard is what blocks withdrawal once a petition is FILED/RFE/APPROVED)"]
        side_effects: ["Same as DRAFT -> WITHDRAWN"]

  - entity: DomesticApplication
    initial_state: APPLIED
    terminal_states: [HIRED, REJECTED, WITHDRAWN]
    transitions:
      - from: APPLIED
        to: HIRED
        trigger: "POST /h2a/domestic-applications/{id}/decide with decision=HIRE"
        actor: ContractorAdmin
        preconditions:
          - "status == APPLIED (else ERR_APPLICATION_INVALID_STATE)"
          - "Parent JobOrder.domestic_hired_count < JobOrder.workers_requested (else ERR_WORKER_CEILING_EXCEEDED)"
        side_effects:
          - "status = HIRED; qualification = input qualification; decided_on = clock date"
          - "Parent JobOrder domestic_hired_count recomputed (derived); visa_worker_ceiling recomputed"
      - from: APPLIED
        to: REJECTED
        trigger: "POST /h2a/domestic-applications/{id}/decide with decision=REJECT"
        actor: ContractorAdmin
        preconditions:
          - "status == APPLIED (else ERR_APPLICATION_INVALID_STATE)"
          - "NOT (input qualification == QUALIFIED and applied_on <= parent.recruitment_cutoff_date) (else ERR_DOMESTIC_PREFERENCE_VIOLATION)"
        side_effects:
          - "status = REJECTED; qualification = input qualification; decided_on = clock date"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "system (cascade from JobOrder withdraw or Grower debarment)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Worker
    initial_state: REGISTERED
    terminal_states: [DEPARTED, ABANDONED]
    transitions:
      - from: REGISTERED
        to: PETITIONED
        trigger: "POST /h2a/visa-petitions/{id}/link-worker (system side effect on the worker)"
        actor: system
        preconditions:
          - "Worker REGISTERED"
        side_effects:
          - "Worker.status = PETITIONED; Worker.petition_id = petition id"
      - from: PETITIONED
        to: REGISTERED
        trigger: "system (petition WITHDRAWN/DENIED cascade, job-order withdraw/debar cascade, or consular outcome REFUSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Worker.status = REGISTERED; Worker.petition_id = null"
      - from: PETITIONED
        to: VISA_ISSUED
        trigger: "POST /h2a/consular-appointments/{id}/complete with outcome=ISSUED (system side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "Worker.status = VISA_ISSUED"
      - from: VISA_ISSUED
        to: WORKING
        trigger: "POST /h2a/worker-assignments/{id}/start (system side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "Worker.status = WORKING"
      - from: WORKING
        to: DEPARTED
        trigger: "system (assignment end with end_reason COMPLETED or FOR_CAUSE and no other PLANNED/ACTIVE assignment for the worker)"
        actor: system
        preconditions: []
        side_effects:
          - "Worker.status = DEPARTED"
      - from: WORKING
        to: ABANDONED
        trigger: "POST /h2a/worker-assignments/{id}/report-abandonment (system side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "Worker.status = ABANDONED"

  - entity: VisaPetition
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /h2a/visa-petitions/{id}/file"
        actor: ContractorAdmin
        preconditions:
          - "status == DRAFT (else ERR_PETITION_INVALID_STATE)"
          - "Parent JobOrder.status == PETITIONING (else ERR_JOB_ORDER_INVALID_STATE)"
          - "requested_worker_count <= parent.visa_worker_ceiling (else ERR_PETITION_EXCEEDS_VISA_CEILING)"
        side_effects:
          - "status = FILED; filed_on = clock date"
      - from: FILED
        to: RFE
        trigger: "POST /h2a/visa-petitions/{id}/issue-rfe"
        actor: ProgramReviewer
        preconditions:
          - "status == FILED (else ERR_PETITION_INVALID_STATE)"
          - "rfe_count < 2 (MAX_RFE_COUNT = 2; else ERR_RFE_LIMIT_REACHED)"
        side_effects:
          - "status = RFE; rfe_count += 1"
      - from: RFE
        to: FILED
        trigger: "POST /h2a/visa-petitions/{id}/respond-rfe"
        actor: ContractorAdmin
        preconditions:
          - "status == RFE (else ERR_PETITION_INVALID_STATE)"
        side_effects:
          - "status = FILED (rfe_count unchanged)"
        note: "FILED <-> RFE cycle; after 2 RFEs the petition must be adjudicated."
      - from: FILED
        to: APPROVED
        trigger: "POST /h2a/visa-petitions/{id}/adjudicate with decision=APPROVE"
        actor: ProgramReviewer
        preconditions:
          - "status in {FILED, RFE} (else ERR_PETITION_INVALID_STATE)"
          - "approved_worker_count == count of Workers linked to this petition (else ERR_APPROVED_COUNT_MISMATCH)"
          - "approved_worker_count >= 1 and <= requested_worker_count (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = APPROVED; approved_worker_count set"
      - from: RFE
        to: APPROVED
        trigger: "POST /h2a/visa-petitions/{id}/adjudicate with decision=APPROVE"
        actor: ProgramReviewer
        preconditions: ["Same as FILED -> APPROVED"]
        side_effects: ["Same as FILED -> APPROVED"]
      - from: FILED
        to: DENIED
        trigger: "POST /h2a/visa-petitions/{id}/adjudicate with decision=DENY"
        actor: ProgramReviewer
        preconditions:
          - "status in {FILED, RFE} (else ERR_PETITION_INVALID_STATE)"
        side_effects:
          - "status = DENIED"
          - "Cascade: linked Workers in PETITIONED -> REGISTERED, petition_id = null"
      - from: RFE
        to: DENIED
        trigger: "POST /h2a/visa-petitions/{id}/adjudicate with decision=DENY"
        actor: ProgramReviewer
        preconditions: ["Same as FILED -> DENIED"]
        side_effects: ["Same as FILED -> DENIED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (cascade from JobOrder withdraw or Grower debarment)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked Workers in PETITIONED -> REGISTERED, petition_id = null"

  - entity: ConsularAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /h2a/consular-appointments/{id}/complete"
        actor: VisaOfficer
        preconditions:
          - "status == SCHEDULED (else ERR_APPOINTMENT_INVALID_STATE)"
          - "clock date >= appointment_date (else ERR_APPOINTMENT_NOT_YET_DUE)"
        side_effects:
          - "status = COMPLETED; outcome = input; completed_on = clock date"
          - "outcome ISSUED -> Worker PETITIONED -> VISA_ISSUED; outcome REFUSED -> Worker -> REGISTERED and petition_id = null; outcome NO_SHOW -> worker unchanged"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /h2a/consular-appointments/{id}/cancel"
        actor: ContractorAdmin
        preconditions:
          - "status == SCHEDULED (else ERR_APPOINTMENT_INVALID_STATE)"
        side_effects:
          - "status = CANCELLED (frees the daily consular slot)"

  - entity: HousingUnit
    initial_state: UNINSPECTED
    terminal_states: []
    transitions:
      - from: UNINSPECTED
        to: CERTIFIED
        trigger: "POST /h2a/housing-units/{id}/inspections with result=PASS"
        actor: HousingInspector
        preconditions: []
        side_effects:
          - "inspection_status = CERTIFIED; certified_on = inspected_on"
      - from: UNINSPECTED
        to: FAILED
        trigger: "POST /h2a/housing-units/{id}/inspections with result=FAIL"
        actor: HousingInspector
        preconditions: []
        side_effects:
          - "inspection_status = FAILED"
      - from: FAILED
        to: CERTIFIED
        trigger: "POST /h2a/housing-units/{id}/inspections with result=PASS"
        actor: HousingInspector
        preconditions: []
        side_effects:
          - "inspection_status = CERTIFIED; certified_on = inspected_on (recertification leg of the cycle)"
      - from: CERTIFIED
        to: FAILED
        trigger: "POST /h2a/housing-units/{id}/inspections with result=FAIL"
        actor: HousingInspector
        preconditions: []
        side_effects:
          - "inspection_status = FAILED; certified_on = null"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /h2a/housing-units/{id}/expire"
        actor: ContractorAdmin
        preconditions:
          - "inspection_status == CERTIFIED (else ERR_HOUSING_UNIT_INVALID_STATE)"
          - "clock date > certification_valid_until (else ERR_HOUSING_CERTIFICATION_STILL_VALID)"
        side_effects:
          - "inspection_status = EXPIRED"
      - from: EXPIRED
        to: CERTIFIED
        trigger: "POST /h2a/housing-units/{id}/inspections with result=PASS"
        actor: HousingInspector
        preconditions: []
        side_effects:
          - "inspection_status = CERTIFIED; certified_on = inspected_on"

  - entity: HousingAssignment
    initial_state: OCCUPIED
    terminal_states: [VACATED]
    transitions:
      - from: OCCUPIED
        to: VACATED
        trigger: "POST /h2a/housing-assignments/{id}/vacate"
        actor: ContractorAdmin
        preconditions:
          - "status == OCCUPIED (else ERR_HOUSING_ASSIGNMENT_INVALID_STATE)"
          - "move_out_date >= move_in_date (else ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "status = VACATED; move_out_date set; unit occupied_count recomputed (derived)"
      - from: OCCUPIED
        to: VACATED
        trigger: "system (cascade: worker assignment reaches COMPLETED/TERMINATED/TRANSFERRED_OUT)"
        actor: system
        preconditions: []
        side_effects:
          - "status = VACATED; move_out_date = assignment.ended_on"

  - entity: WorkerAssignment
    initial_state: PLANNED
    terminal_states: [COMPLETED, TERMINATED, TRANSFERRED_OUT]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /h2a/worker-assignments/{id}/start"
        actor: ContractorAdmin
        preconditions:
          - "status == PLANNED (else ERR_ASSIGNMENT_INVALID_STATE)"
          - "clock date <= job order work_end_date (else ERR_ORDER_PERIOD_ENDED)"
        side_effects:
          - "status = ACTIVE; started_on = clock date"
          - "Worker VISA_ISSUED -> WORKING"
          - "Create the 1:1 WageReconciliation (status OPEN) and compute the provisional variant"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /h2a/worker-assignments/{id}/end with end_reason=COMPLETED"
        actor: ContractorAdmin
        preconditions:
          - "status == ACTIVE (else ERR_ASSIGNMENT_INVALID_STATE)"
          - "clock date >= started_on"
        side_effects:
          - "status = COMPLETED; ended_on = clock date; end_reason = COMPLETED; guarantee_eligible = true"
          - "Worker -> DEPARTED when the worker has no other PLANNED/ACTIVE assignment"
          - "Cascade: OCCUPIED HousingAssignments for this worker_assignment -> VACATED (move_out_date = ended_on)"
          - "WageReconciliation recomputed (still OPEN; basis now uses ended_on)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /h2a/worker-assignments/{id}/end with end_reason=FOR_CAUSE"
        actor: ContractorAdmin
        preconditions:
          - "status == ACTIVE (else ERR_ASSIGNMENT_INVALID_STATE)"
          - "clock date >= started_on"
        side_effects:
          - "status = TERMINATED; ended_on = clock date; end_reason = FOR_CAUSE; guarantee_eligible = false"
          - "Worker -> DEPARTED when no other PLANNED/ACTIVE assignment"
          - "Housing cascade as COMPLETED; WageReconciliation recomputed (guarantee no longer applies once finalized)"
      - from: PLANNED
        to: TERMINATED
        trigger: "POST /h2a/worker-assignments/{id}/end with end_reason=FOR_CAUSE"
        actor: ContractorAdmin
        preconditions:
          - "status == PLANNED (else ERR_ASSIGNMENT_INVALID_STATE); only FOR_CAUSE allowed from PLANNED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = TERMINATED; ended_on = clock date; end_reason = FOR_CAUSE; guarantee_eligible = false"
          - "Worker unchanged (never started; remains VISA_ISSUED)"
        note: "Escape hatch so a never-started PLANNED assignment cannot block job-order close."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /h2a/worker-assignments/{id}/report-abandonment"
        actor: ContractorAdmin | GrowerRep (source grower only)
        preconditions:
          - "status == ACTIVE (else ERR_ASSIGNMENT_INVALID_STATE)"
          - "GrowerRep caller: X-User-ID must equal the assignment's job order grower_id (else ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
        side_effects:
          - "status = TERMINATED; ended_on = clock date; end_reason = ABANDONED; guarantee_eligible = false"
          - "Worker WORKING -> ABANDONED"
          - "Housing cascade as COMPLETED; WageReconciliation recomputed"
          - "System creates an AuditCase (grower = order's grower, job_order = order, trigger_source = ABANDONMENT, status OPEN)"
      - from: ACTIVE
        to: TRANSFERRED_OUT
        trigger: "POST /h2a/transfer-requests/{id}/finalize (system side effect on the source assignment)"
        actor: system
        preconditions: []
        side_effects:
          - "status = TRANSFERRED_OUT; end_reason = TRANSFERRED_OUT; ended_on = transfer effective date - 1 day; guarantee_eligible = true"
          - "Housing cascade as COMPLETED (move_out_date = ended_on)"
          - "Source WageReconciliation recomputed with the truncated basis window (stays OPEN)"

  - entity: WageReconciliation
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /h2a/worker-assignments/{id}/finalize-reconciliation"
        actor: ContractorAdmin
        preconditions:
          - "Parent WorkerAssignment in {COMPLETED, TERMINATED, TRANSFERRED_OUT} (else ERR_RECONCILIATION_INVALID_STATE)"
          - "status == OPEN (else ERR_RECONCILIATION_INVALID_STATE)"
        side_effects:
          - "Final variant computed: computed_through_date = assignment.ended_on; guarantee_applied from end_reason; outbound transport per rule; status = FINALIZED; finalized_on = clock date"

  - entity: TransferRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: GROWER_APPROVED
        trigger: "POST /h2a/transfer-requests/{id}/grower-approve"
        actor: GrowerRep
        preconditions:
          - "status == PENDING (else ERR_TRANSFER_INVALID_STATE)"
          - "X-User-ID == to_job_order.grower_id (else ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
        side_effects:
          - "status = GROWER_APPROVED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /h2a/transfer-requests/{id}/grower-reject"
        actor: GrowerRep
        preconditions:
          - "status == PENDING (else ERR_TRANSFER_INVALID_STATE)"
          - "X-User-ID == to_job_order.grower_id (else ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
        side_effects:
          - "status = REJECTED"
      - from: GROWER_APPROVED
        to: APPROVED
        trigger: "POST /h2a/transfer-requests/{id}/finalize"
        actor: ContractorAdmin
        preconditions:
          - "status == GROWER_APPROVED (else ERR_TRANSFER_INVALID_STATE)"
          - "Source WorkerAssignment still ACTIVE (else ERR_ASSIGNMENT_INVALID_STATE)"
          - "Target JobOrder still ACTIVE (else ERR_JOB_ORDER_INVALID_STATE)"
        side_effects:
          - "Transfer effective date = clock date"
          - "Source WorkerAssignment ACTIVE -> TRANSFERRED_OUT (ended_on = effective date - 1 day); its WageReconciliation recomputed on the truncated basis"
          - "New WorkerAssignment created on the target order (status ACTIVE, started_on = effective date); a new OPEN WageReconciliation is created for it (provisional variant)"
          - "Worker remains WORKING"
          - "status = APPROVED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /h2a/transfer-requests/{id}/cancel"
        actor: ContractorAdmin | GrowerRep
        preconditions:
          - "status in {PENDING, GROWER_APPROVED} (else ERR_TRANSFER_INVALID_STATE)"
          - "GrowerRep caller: X-User-ID == requested_by_user_id (else ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
        side_effects:
          - "status = CANCELLED"
      - from: GROWER_APPROVED
        to: CANCELLED
        trigger: "POST /h2a/transfer-requests/{id}/cancel"
        actor: ContractorAdmin | GrowerRep
        preconditions: ["Same as PENDING -> CANCELLED"]
        side_effects: ["Same as PENDING -> CANCELLED"]

  - entity: AuditCase
    initial_state: OPEN
    terminal_states: [CLOSED_NO_ACTION, RESOLVED_PENALTY, RESOLVED_DEBARMENT]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /h2a/audit-cases/{id}/issue-findings"
        actor: WageAuditor
        preconditions:
          - "status == OPEN (else ERR_AUDIT_CASE_INVALID_STATE)"
          - "findings non-empty; each violation_code in {WAGE_UNDERPAYMENT, HOUSING_SUBSTANDARD, TRANSPORT_VIOLATION, RECRUITMENT_VIOLATION, RECORDKEEPING}; each count >= 1 (else ERR_INVALID_FINDINGS)"
        side_effects:
          - "findings stored; provisional_exposure_cents computed (provisional variant); status = FINDINGS_ISSUED"
      - from: FINDINGS_ISSUED
        to: CLOSED_NO_ACTION
        trigger: "POST /h2a/audit-cases/{id}/close-no-action"
        actor: WageAuditor
        preconditions:
          - "status == FINDINGS_ISSUED (else ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "status = CLOSED_NO_ACTION; closed_on = clock date"
      - from: FINDINGS_ISSUED
        to: RESOLVED_PENALTY
        trigger: "POST /h2a/audit-cases/{id}/assess-penalty"
        actor: WageAuditor
        preconditions:
          - "status == FINDINGS_ISSUED (else ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "final_penalty_cents computed (final variant with good_faith input); status = RESOLVED_PENALTY; closed_on = clock date"
          - "Grower ACTIVE -> SUSPENDED (unless already DEBARRED)"
      - from: FINDINGS_ISSUED
        to: RESOLVED_DEBARMENT
        trigger: "POST /h2a/audit-cases/{id}/debar"
        actor: WageAuditor
        preconditions:
          - "status == FINDINGS_ISSUED (else ERR_AUDIT_CASE_INVALID_STATE)"
          - "debarment_years in 1..3 (else ERR_INVALID_DEBARMENT_TERM)"
        side_effects:
          - "status = RESOLVED_DEBARMENT; debarment_years set; closed_on = clock date"
          - "Grower -> DEBARRED with debarment_ends_on = clock date + debarment_years*365 days; full withdrawal cascade per Grower machine"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: job-order-patch-stale-version
    parent_entity: JobOrder
    write_endpoint: "PATCH /h2a/job-orders/{jobOrderId}"
    occ_field: expected_job_order_version
    description: |
      Updating a DRAFT or DEFICIENCY job order whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just patched the order (e.g. re-dated the contract
      period during a deficiency cure) and the current writer's view of the
      order is therefore stale.
    error_id: ERR_STALE_JOB_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: workday_calendar_count
    trigger: "Used by job_order_derived_terms, three_quarters_guarantee, recruitment_window"
    algorithm: aggregation
    formula: |
      workday_count(d1, d2) = number of dates d with d1 <= d <= d2 (both bounds
      INCLUSIVE) such that weekday(d) != Sunday. Returns 0 when d2 < d1.
    input_set: "A start and end ISO date"
    constants:
      EXCLUDED_WEEKDAY: Sunday
    precision: "integer day count; no rounding"

  - name: job_order_derived_terms
    trigger: "On JobOrder create, PATCH, and read; locked_* snapshots taken at submit"
    algorithm: threshold
    formula: |
      total_calendar_days = (work_end_date - work_start_date).days + 1
      total_workdays = workday_count(work_start_date, work_end_date)
      recruitment_cutoff_date = work_start_date + (floor(total_calendar_days / 2) - 1) days
      transport_threshold_date = recruitment_cutoff_date
      aewr = locked_aewr_hourly_cents if submitted else determination.aewr_hourly_cents
      prev = locked_prevailing_hourly_cents if submitted else determination.prevailing_hourly_cents
      required_hourly_floor_cents = max(aewr, prev, offered_hourly_cents, FEDERAL_MINIMUM_WAGE_CENTS)
      piece_candidates = non-null values among {offered_piece_rate_cents_per_unit, locked/live prevailing piece rate}
      effective_piece_rate_cents_per_unit = max(piece_candidates) if non-empty else null
      visa_worker_ceiling = workers_requested - domestic_hired_count
    input_set: "The JobOrder plus its referenced WageDetermination (live values while DRAFT; locked snapshots after submit)"
    constants:
      FEDERAL_MINIMUM_WAGE_CENTS: 725
    precision: "integer cents and integer days; max() ties resolve to the same value regardless of source"
    variants:
      - name: pre_submission_live
        when: "status == DRAFT (or DEFICIENCY before first submit)"
        difference: "Reads the live WageDetermination; a superseding determination changes the derived terms"
      - name: post_submission_locked
        when: "status != DRAFT after at least one submit"
        difference: "Reads the locked_* snapshots; superseding the determination afterwards leaves the order unchanged"

  - name: recruitment_window
    trigger: "DomesticApplication decide with decision=REJECT"
    algorithm: threshold
    formula: |
      obligated = (applied_on <= parent.recruitment_cutoff_date)   # <= is INCLUSIVE
      if obligated and qualification == QUALIFIED: rejecting is forbidden
      Boundary: an application whose applied_on == recruitment_cutoff_date is still
      inside the preference window; applied_on == cutoff + 1 day is outside.
    input_set: "The DomesticApplication and its parent JobOrder.recruitment_cutoff_date"
    precision: "date granularity; inclusive upper bound"

  - name: weekly_wage_reconciliation
    trigger: "WorkLog create (while reconciliation OPEN); WorkerAssignment start/end/transfer-finalize (recompute); finalize-reconciliation (freeze)"
    algorithm: chronological
    formula: |
      Workweeks are consecutive 7-day blocks anchored at job_order.work_start_date:
      week k covers [start + 7k, start + 7k + 6] intersected with [start, end].
      For each workweek w intersecting [assignment.started_on, computed_through_date]:
        weekly_piece_cents(w) = (sum of units_picked over w's WorkLogs) * piece_rate
                                (piece_rate = effective_piece_rate_cents_per_unit; 0 when null)
        weekly_floor_cents(w) = SUM over DAYS d in w of
                                round_half_up(day_hours(d) * 4 * floor_cents / 4)
                                where day_hours from that day's WorkLog (0 if none),
                                floor_cents = required_hourly_floor_cents.
        ROUNDING ORDER (pinned): round each DAY to whole cents with round_half_up,
        THEN sum within the week. Never sum hours first and round once.
        weekly_makeup_cents(w) = max(0, weekly_floor_cents(w) - weekly_piece_cents(w))
      piece_earnings_cents   = sum_w weekly_piece_cents(w)
      hourly_floor_earnings_cents = sum_w weekly_floor_cents(w)
      makeup_pay_cents       = sum_w weekly_makeup_cents(w)
    input_set: "All WorkLog rows of the assignment (immutable; any work_date), the assignment, the parent JobOrder's locked terms"
    precision: "integer cents; round_half_up applied per day per the pinned order"
    variants:
      - name: provisional
        when: "reconciliation status == OPEN"
        difference: "computed_through_date = assignment.ended_on when the assignment is terminal, else min(clock date, order.work_end_date); guarantee assumed applicable; outbound transport = 0; inbound per threshold rule using computed_through_date"
      - name: final
        when: "finalize-reconciliation freezes the row"
        difference: "computed_through_date = assignment.ended_on; guarantee_applied = (end_reason not in {FOR_CAUSE, ABANDONED}); outbound owed when end_reason == COMPLETED"

  - name: three_quarters_guarantee
    trigger: "Runs inside weekly_wage_reconciliation (same triggers)"
    algorithm: threshold
    formula: |
      basis_start = max(order.work_start_date, assignment.started_on)
      basis_end   = min(order.work_end_date, computed_through_date)
      guarantee_basis_workdays = workday_count(basis_start, basis_end)   # 0 if basis_end < basis_start
      total_quarters     = guarantee_basis_workdays * daily_standard_hours * 4
      guaranteed_quarters = floor(total_quarters * 3 / 4)     # integer floor on quarter-hours
      worked_quarters    = sum over WorkLogs with work_date in [basis_start, basis_end] of round(hours_worked * 4)
      shortfall_quarters = max(0, guaranteed_quarters - worked_quarters)
      guarantee_pay_cents = round_half_up(shortfall_quarters * required_hourly_floor_cents / 4)
                            when guarantee_applied else 0
      Boundary: shortfall_quarters == 0 yields guarantee_pay_cents == 0 (no negative
      clawback when worked > guaranteed); the guarantee is exactly 3/4, computed on
      integer quarter-hours so 3/4 of an odd quarter count truncates DOWN.
    input_set: "Assignment window, JobOrder window and locked floor, WorkLogs in the basis window"
    precision: "integer quarter-hours; floor for the 3/4 factor; round_half_up for cents"

  - name: transportation_reimbursement
    trigger: "Runs inside weekly_wage_reconciliation (same triggers)"
    algorithm: threshold
    formula: |
      span_end = computed_through_date
      inbound_transport_owed_cents =
        order.inbound_transport_cents
          if span_end >= order.transport_threshold_date
             and (reconciliation OPEN or assignment.end_reason != ABANDONED)
          else 0
      outbound_transport_owed_cents =
        order.outbound_transport_cents
          if reconciliation FINALIZED and assignment.end_reason == COMPLETED
          else 0
      Boundary: span_end == transport_threshold_date EXACTLY owes inbound (>= inclusive).
    input_set: "Assignment span, JobOrder.transport_threshold_date and transport amounts"
    precision: "integer cents; inclusive threshold"

  - name: consular_capacity_check
    trigger: "POST /h2a/consular-appointments (validation)"
    algorithm: threshold
    formula: |
      existing = count of ConsularAppointment with status == SCHEDULED,
                 same consulate_code, same appointment_date
      Reject when existing >= MAX_DAILY_CONSULAR_SLOTS (6). The 6th appointment of
      the day is accepted (existing == 5 < 6); the 7th is rejected (existing == 6).
      CANCELLED and COMPLETED appointments do not consume slots.
    input_set: "SCHEDULED appointments only, exact (consulate_code, appointment_date) match"
    constants:
      MAX_DAILY_CONSULAR_SLOTS: 6
    precision: "integer count; boundary at == 6 rejects"

  - name: housing_occupancy_capacity
    trigger: "POST /h2a/housing-assignments (validation); occupied_count derived on HousingUnit reads"
    algorithm: interval_merge
    formula: |
      An occupancy window is the half-open interval [move_in_date, move_out_date),
      with move_out_date = +infinity while status == OCCUPIED.
      overlap(a, b) = a.move_in < b.move_out and b.move_in < a.move_out
      (pure adjacency — a.move_in == b.move_out — does NOT overlap).
      Create rejects when:
        count(OCCUPIED assignments of the unit overlapping the new window) + 1 > unit.capacity
        -> ERR_HOUSING_CAPACITY_EXCEEDED  (aggregate-capacity semantics, not pairwise)
      and when the same WORKER has any other OCCUPIED assignment (any unit) overlapping
      the new window -> ERR_WORKER_HOUSING_OVERLAP (one bed per worker, capacity 1).
    input_set: "OCCUPIED HousingAssignments of the unit (and of the worker); VACATED rows never overlap"
    precision: "date granularity; half-open intervals"

  - name: audit_penalty_assessment
    trigger: "issue-findings (provisional variant); assess-penalty (final variant)"
    algorithm: weighted_scoring
    formula: |
      Provisional (at issue-findings):
        provisional_exposure_cents = sum over findings of BASE[violation_code] * count
      Final (at assess-penalty), evaluation order PINNED:
        for each violation kind present:
          kind_total = BASE[kind] * count * (WILLFUL_MULTIPLIER if willful else 1)
          kind_capped = min(kind_total, PER_KIND_CAP_CENTS)        # cap BEFORE summing
        penalty_sum = sum of kind_capped over kinds
        if good_faith: final_penalty_cents = round_half_up(penalty_sum * 90 / 100)
        else:          final_penalty_cents = penalty_sum
      Any other evaluation order (discount before cap, cap after sum) yields
      different cents and is non-conformant.
    input_set: "The case's findings array (5 violation codes)"
    constants:
      BASE_WAGE_UNDERPAYMENT_CENTS: 150000
      BASE_HOUSING_SUBSTANDARD_CENTS: 120000
      BASE_TRANSPORT_VIOLATION_CENTS: 90000
      BASE_RECRUITMENT_VIOLATION_CENTS: 110000
      BASE_RECORDKEEPING_CENTS: 60000
      WILLFUL_MULTIPLIER: 2
      PER_KIND_CAP_CENTS: 1000000
      GOOD_FAITH_DISCOUNT_PCT: 10
    precision: "integer cents; round_half_up for the discount step"
    variants:
      - name: provisional
        when: "computed at issue-findings"
        difference: "ignores willful multiplier, per-kind cap, and good-faith discount"
      - name: final
        when: "computed at assess-penalty"
        difference: "applies willful multiplier, per-kind cap before summation, then good-faith discount after summation"

  - name: debarment_term
    trigger: "POST /h2a/audit-cases/{id}/debar"
    algorithm: aggregation
    formula: |
      debarment_ends_on = clock date + debarment_years * 365 days
      refresh-status reinstates when clock date >= debarment_ends_on (inclusive).
    input_set: "debarment_years (1..3), clock date"
    constants:
      DAYS_PER_DEBARMENT_YEAR: 365
    precision: "date granularity; inclusive reinstatement boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number = checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: GrowerRep X-User-ID equals the governing Grower id (transfer create -> source order's grower; transfer approve/reject -> target grower; transfer cancel -> requested_by_user_id; report-abandonment -> source order's grower)"
    error_id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP
    http_status: 403
    applies_to: "POST /h2a/transfer-requests (GrowerRep caller); POST /h2a/transfer-requests/{id}/grower-approve, /grower-reject, /cancel; POST /h2a/worker-assignments/{id}/report-abandonment"
  - priority: 4
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right through the path"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "Target entity is in a state that permits the operation (per §1.2 transition preconditions)"
    error_id: "ERR_{ENTITY}_INVALID_STATE family; ERR_GROWER_NOT_ACTIVE; ERR_WAGE_DETERMINATION_NOT_PUBLISHED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Domestic worker preference: REJECT of a QUALIFIED applicant with applied_on <= recruitment_cutoff_date is forbidden; housing must be CERTIFIED and within certification_valid_until at move-in"
    error_id: "ERR_DOMESTIC_PREFERENCE_VIOLATION (422) | ERR_HOUSING_NOT_CERTIFIED (409)"
    http_status: 422
    applies_to: "POST /h2a/domestic-applications/{id}/decide; POST /h2a/housing-assignments"
  - priority: 7
    category: business_temporal
    check: "Clock/date windows: certification lead time (clock <= start - 30d); activate requires clock >= start; close requires clock >= end; start requires clock <= end; appointment date strictly future at create and reached at complete; work log date within assignment window and not in the future; inspection date not in the future; expire requires clock > certification_valid_until"
    error_id: "ERR_CERTIFICATION_LEAD_TIME | ERR_ORDER_NOT_YET_STARTED | ERR_ORDER_PERIOD_NOT_ENDED | ERR_ORDER_PERIOD_ENDED | ERR_APPOINTMENT_DATE_NOT_FUTURE | ERR_APPOINTMENT_NOT_YET_DUE | ERR_WORK_LOG_DATE_OUT_OF_RANGE | ERR_INSPECTION_DATE_IN_FUTURE | ERR_HOUSING_CERTIFICATION_STILL_VALID"
    http_status: 409
    applies_to: "date/clock-sensitive endpoints"
  - priority: 8
    category: business_referential
    check: "Cross-entity coherence: housing unit's grower == assignment's order's grower; transfer target grower != source grower; worker's petition job order == assignment's job order; appointment worker linked to appointment petition; audit case job_order belongs to grower"
    error_id: "ERR_GROWER_MISMATCH | ERR_SAME_GROWER_TRANSFER | ERR_WORKER_ORDER_MISMATCH | ERR_WORKER_NOT_ON_PETITION"
    http_status: 409
    applies_to: "POST /h2a/housing-assignments; POST /h2a/transfer-requests; POST /h2a/worker-assignments; POST /h2a/consular-appointments; POST /h2a/audit-cases"
  - priority: 9
    category: business_constraint
    check: "Uniqueness (fein, passport_number, receipt_code, one WorkLog per assignment+date, one open transfer per worker, one active appointment per worker); capacity/quota (consular daily slots, housing capacity, worker ceiling incl. domestic hires, petition link overflow, visa ceiling at file, RFE limit, approved==linked count); guarded transitions (no undecided applications, no open assignments, all reconciliations finalized, no open petitions for withdraw)"
    error_id: "ERR_DUPLICATE_* | ERR_*_CAPACITY_* | ERR_WORKER_CEILING_EXCEEDED | ERR_PETITION_WORKER_OVERFLOW | ERR_PETITION_EXCEEDS_VISA_CEILING | ERR_RFE_LIMIT_REACHED | ERR_APPROVED_COUNT_MISMATCH | ERR_UNDECIDED_APPLICATIONS_REMAIN | ERR_OPEN_ASSIGNMENTS_REMAIN | ERR_UNFINALIZED_RECONCILIATIONS_REMAIN | ERR_OPEN_PETITIONS_EXIST | ERR_WORKER_ALREADY_ASSIGNED | ERR_WORKER_HAS_ACTIVE_APPOINTMENT | ERR_DUPLICATE_ACTIVE_TRANSFER"
    http_status: 409
    applies_to: "creation and guarded-transition endpoints"
  - priority: 10
    category: business_fiscal
    check: "Field domain: wage rates and transport amounts positive/non-negative; requested_worker_count >= 1; approved_worker_count in [1, requested]; debarment_years in 1..3; hours multiple of 0.25 in (0,16]; units >= 0 and 0 when piece rate null; end before start rejected; OCC expected version matches current"
    error_id: "ERR_INVALID_REQUEST (400) | ERR_INVALID_HOURS (400) | ERR_INVALID_DATE_RANGE (400) | ERR_INVALID_DEBARMENT_TERM (400) | ERR_INVALID_FINDINGS (400) | ERR_STALE_JOB_ORDER_VERSION (412)"
    http_status: 400
    applies_to: "all mutating endpoints"
    description: "Fiscal/field-domain checks run last: a request that fails both a structural/business rule and a field-domain rule reports the business rule first."

# =============================================================================
# §1.5 API Endpoint Table
# GET endpoints accept the listed query params; all are optional.
# &ALL_ROLES = every authenticated role may read.
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/h2a/_clock/set_current_utc"
    description: "Set the server logical clock. Before any set call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All date-sensitive rules evaluate against this clock's UTC date."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; no entity mutates"]

  # --- Grower ---
  - method: POST
    path: "/h2a/growers"
    description: "Register a grower client"
    roles: [ContractorAdmin]
    code: 201
    input: [legal_name, fein, state_code]
    output: Grower
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/h2a/growers"
    description: "List growers"
    roles: &ALL_ROLES [ContractorAdmin, GrowerRep, ProgramReviewer, HousingInspector, VisaOfficer, WageAuditor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Grower[]"
    side_effects: []
  - method: POST
    path: "/h2a/growers/{growerId}/refresh-status"
    description: "Re-evaluate SUSPENDED/DEBARRED grower standing against the clock and open audit cases"
    roles: [WageAuditor]
    code: 200
    input: []
    output: Grower
    side_effects: ["SUSPENDED -> ACTIVE when no OPEN/FINDINGS_ISSUED cases; DEBARRED -> ACTIVE when clock >= debarment_ends_on; otherwise unchanged (200)"]

  # --- WageDetermination ---
  - method: POST
    path: "/h2a/wage-determinations"
    description: "Publish a wage determination; supersedes any PUBLISHED row with the same (state_code, crop, activity, effective_year)"
    roles: [ProgramReviewer]
    code: 201
    input: [state_code, crop, activity, effective_year, aewr_hourly_cents, prevailing_hourly_cents, "prevailing_piece_rate_cents_per_unit?", "piece_unit_name?"]
    output: WageDetermination
    side_effects: ["Matching prior PUBLISHED row -> SUPERSEDED; job orders already submitted keep locked snapshots"]
  - method: GET
    path: "/h2a/wage-determinations"
    description: "List wage determinations"
    roles: *ALL_ROLES
    code: 200
    input: ["state_code?", "crop?", "activity?", "effective_year?", "status?", "limit?", "offset?"]
    output: "WageDetermination[]"
    side_effects: []

  # --- JobOrder ---
  - method: POST
    path: "/h2a/job-orders"
    description: "Create a job order in DRAFT"
    roles: [ContractorAdmin]
    code: 201
    input: [grower_id, wage_determination_id, title, crop, activity, worksite_state, work_start_date, work_end_date, daily_standard_hours, workers_requested, offered_hourly_cents, "offered_piece_rate_cents_per_unit?", inbound_transport_cents, outbound_transport_cents]
    output: JobOrder
    side_effects: ["status = DRAFT; derived terms computed from the live determination"]
  - method: GET
    path: "/h2a/job-orders"
    description: "List job orders"
    roles: *ALL_ROLES
    code: 200
    input: ["grower_id?", "wage_determination_id?", "status?", "limit?", "offset?"]
    output: "JobOrder[]"
    side_effects: []
  - method: GET
    path: "/h2a/job-orders/{jobOrderId}"
    description: "Get a job order"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: JobOrder
    side_effects: []
  - method: PATCH
    path: "/h2a/job-orders/{jobOrderId}"
    description: "Update a DRAFT or DEFICIENCY job order; guarded by OCC on JobOrder.version"
    roles: [ContractorAdmin]
    code: 200
    input: [expected_job_order_version, "work_start_date?", "work_end_date?", "daily_standard_hours?", "workers_requested?", "offered_hourly_cents?", "offered_piece_rate_cents_per_unit?", "inbound_transport_cents?", "outbound_transport_cents?"]
    output: JobOrder
    side_effects: ["Increments JobOrder.version by 1; derived terms recomputed from the live determination"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/submit"
    description: "Submit (DRAFT->SUBMITTED) or cure-resubmit (DEFICIENCY->SUBMITTED); locks wage snapshots"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = SUBMITTED; locked_* snapshots taken"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/flag-deficiency"
    description: "Reviewer flags a deficiency (SUBMITTED->DEFICIENCY)"
    roles: [ProgramReviewer]
    code: 200
    input: [note]
    output: JobOrder
    side_effects: ["status = DEFICIENCY; deficiency_note set"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/certify"
    description: "Certify the job order (SUBMITTED->CERTIFIED); requires clock <= start - 30 days"
    roles: [ProgramReviewer]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = CERTIFIED"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/begin-recruitment"
    description: "Open domestic recruitment (CERTIFIED->RECRUITING)"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = RECRUITING"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/close-recruitment"
    description: "Close recruitment (RECRUITING->PETITIONING); all applications must be decided"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = PETITIONING"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/activate"
    description: "Activate the order (PETITIONING->ACTIVE); needs >= 1 APPROVED petition and clock >= start"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = ACTIVE"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/close"
    description: "Close the work period (ACTIVE->CLOSING); every assignment must be terminal"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = CLOSING"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/finalize"
    description: "Finalize the order (CLOSING->CLOSED); every reconciliation must be FINALIZED"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = CLOSED"]
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/withdraw"
    description: "Withdraw a pre-petitioning order; cascades to DRAFT petitions and APPLIED applications"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: JobOrder
    side_effects: ["status = WITHDRAWN; DRAFT petitions -> WITHDRAWN (workers revert to REGISTERED); APPLIED applications -> WITHDRAWN"]

  # --- DomesticApplication ---
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/domestic-applications"
    description: "Record a domestic (US worker) application; order must be RECRUITING"
    roles: [ContractorAdmin]
    code: 201
    input: [applicant_name, contact_phone]
    output: DomesticApplication
    side_effects: ["status = APPLIED; applied_on = clock date"]
  - method: GET
    path: "/h2a/job-orders/{id}/domestic-applications"
    description: "List domestic applications for an order"
    roles: *ALL_ROLES
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DomesticApplication[]"
    side_effects: []
  - method: POST
    path: "/h2a/domestic-applications/{applicationId}/decide"
    description: "Decide an application; preference-window rule guards REJECT of QUALIFIED applicants"
    roles: [ContractorAdmin]
    code: 200
    input: [decision, qualification]
    output: DomesticApplication
    side_effects: ["status -> HIRED or REJECTED; parent domestic_hired_count and visa_worker_ceiling recomputed"]

  # --- Worker ---
  - method: POST
    path: "/h2a/workers"
    description: "Register a foreign worker"
    roles: [ContractorAdmin]
    code: 201
    input: [full_name, passport_number, date_of_birth, country_code]
    output: Worker
    side_effects: ["status = REGISTERED"]
  - method: GET
    path: "/h2a/workers"
    description: "List workers"
    roles: *ALL_ROLES
    code: 200
    input: ["status?", "petition_id?", "limit?", "offset?"]
    output: "Worker[]"
    side_effects: []
  - method: GET
    path: "/h2a/workers/{workerId}"
    description: "Get a worker"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Worker
    side_effects: []

  # --- VisaPetition ---
  - method: POST
    path: "/h2a/job-orders/{jobOrderId}/visa-petitions"
    description: "Create a petition in DRAFT; order must be CERTIFIED, RECRUITING, or PETITIONING"
    roles: [ContractorAdmin]
    code: 201
    input: [receipt_code, requested_worker_count]
    output: VisaPetition
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/h2a/job-orders/{id}/visa-petitions"
    description: "List petitions for an order"
    roles: *ALL_ROLES
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VisaPetition[]"
    side_effects: []
  - method: GET
    path: "/h2a/visa-petitions/{petitionId}"
    description: "Get a petition"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: VisaPetition
    side_effects: []
  - method: POST
    path: "/h2a/visa-petitions/{petitionId}/file"
    description: "File the petition (DRAFT->FILED); requested count must fit the visa ceiling"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: VisaPetition
    side_effects: ["status = FILED; filed_on = clock date"]
  - method: POST
    path: "/h2a/visa-petitions/{petitionId}/link-worker"
    description: "Link a REGISTERED worker to a DRAFT or FILED petition"
    roles: [ContractorAdmin]
    code: 200
    input: [worker_id]
    output: VisaPetition
    side_effects: ["Worker REGISTERED -> PETITIONED with petition_id set; linked count must stay <= requested_worker_count (ERR_PETITION_WORKER_OVERFLOW)"]
  - method: POST
    path: "/h2a/visa-petitions/{petitionId}/issue-rfe"
    description: "Issue a Request for Evidence (FILED->RFE); at most 2 RFEs per petition"
    roles: [ProgramReviewer]
    code: 200
    input: ["note?"]
    output: VisaPetition
    side_effects: ["status = RFE; rfe_count += 1"]
  - method: POST
    path: "/h2a/visa-petitions/{petitionId}/respond-rfe"
    description: "Respond to an RFE (RFE->FILED)"
    roles: [ContractorAdmin]
    code: 200
    input: ["note?"]
    output: VisaPetition
    side_effects: ["status = FILED"]
  - method: POST
    path: "/h2a/visa-petitions/{petitionId}/adjudicate"
    description: "Approve (needs approved_worker_count == linked workers) or deny the petition"
    roles: [ProgramReviewer]
    code: 200
    input: [decision, "approved_worker_count?"]
    output: VisaPetition
    side_effects: ["APPROVE: status = APPROVED, approved_worker_count set. DENY: status = DENIED, linked workers revert to REGISTERED"]

  # --- ConsularAppointment ---
  - method: POST
    path: "/h2a/consular-appointments"
    description: "Schedule a consular interview; daily per-consulate quota of 6 SCHEDULED"
    roles: [ContractorAdmin]
    code: 201
    input: [worker_id, petition_id, consulate_code, appointment_date]
    output: ConsularAppointment
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/h2a/consular-appointments"
    description: "List consular appointments"
    roles: *ALL_ROLES
    code: 200
    input: ["worker_id?", "petition_id?", "consulate_code?", "appointment_date?", "status?", "limit?", "offset?"]
    output: "ConsularAppointment[]"
    side_effects: []
  - method: GET
    path: "/h2a/consular-appointments/{appointmentId}"
    description: "Get a consular appointment"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ConsularAppointment
    side_effects: []
  - method: POST
    path: "/h2a/consular-appointments/{appointmentId}/complete"
    description: "Record the interview outcome (SCHEDULED->COMPLETED); ISSUED advances the worker to VISA_ISSUED"
    roles: [VisaOfficer]
    code: 200
    input: [outcome]
    output: ConsularAppointment
    side_effects: ["status = COMPLETED; worker transition per outcome"]
  - method: POST
    path: "/h2a/consular-appointments/{appointmentId}/cancel"
    description: "Cancel a scheduled appointment, freeing the daily slot"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: ConsularAppointment
    side_effects: ["status = CANCELLED"]

  # --- HousingUnit / HousingInspection ---
  - method: POST
    path: "/h2a/housing-units"
    description: "Register employer-provided housing"
    roles: [ContractorAdmin]
    code: 201
    input: [grower_id, name, capacity]
    output: HousingUnit
    side_effects: ["inspection_status = UNINSPECTED"]
  - method: GET
    path: "/h2a/housing-units"
    description: "List housing units"
    roles: *ALL_ROLES
    code: 200
    input: ["grower_id?", "inspection_status?", "limit?", "offset?"]
    output: "HousingUnit[]"
    side_effects: []
  - method: GET
    path: "/h2a/housing-units/{unitId}"
    description: "Get a housing unit (includes occupied_count)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: HousingUnit
    side_effects: []
  - method: POST
    path: "/h2a/housing-units/{unitId}/inspections"
    description: "Record an inspection (immutable); flips the unit inspection_status per result"
    roles: [HousingInspector]
    code: 201
    input: [inspected_on, result, "deficiency_codes?"]
    output: HousingInspection
    side_effects: ["Unit: PASS -> CERTIFIED (certified_on = inspected_on); FAIL -> FAILED (certified_on cleared)"]
  - method: GET
    path: "/h2a/housing-units/{id}/inspections"
    description: "List inspections of a unit"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "HousingInspection[]"
    side_effects: []
  - method: POST
    path: "/h2a/housing-units/{unitId}/expire"
    description: "Flip CERTIFIED -> EXPIRED once the clock is past certification_valid_until"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: HousingUnit
    side_effects: ["inspection_status = EXPIRED"]

  # --- HousingAssignment ---
  - method: POST
    path: "/h2a/housing-assignments"
    description: "Move a worker into housing; unit must be currently certified and within capacity"
    roles: [ContractorAdmin]
    code: 201
    input: [housing_unit_id, worker_id, worker_assignment_id, move_in_date]
    output: HousingAssignment
    side_effects: ["status = OCCUPIED; unit occupied_count recomputed"]
  - method: GET
    path: "/h2a/housing-assignments"
    description: "List housing assignments"
    roles: *ALL_ROLES
    code: 200
    input: ["housing_unit_id?", "worker_id?", "worker_assignment_id?", "status?", "limit?", "offset?"]
    output: "HousingAssignment[]"
    side_effects: []
  - method: GET
    path: "/h2a/housing-assignments/{housingAssignmentId}"
    description: "Get a housing assignment"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: HousingAssignment
    side_effects: []
  - method: POST
    path: "/h2a/housing-assignments/{housingAssignmentId}/vacate"
    description: "Vacate housing (OCCUPIED->VACATED)"
    roles: [ContractorAdmin]
    code: 200
    input: [move_out_date]
    output: HousingAssignment
    side_effects: ["status = VACATED; move_out_date set; occupied_count recomputed"]

  # --- WorkerAssignment / WorkLog / WageReconciliation ---
  - method: POST
    path: "/h2a/worker-assignments"
    description: "Assign a VISA_ISSUED worker to an ACTIVE job order of the worker's petition"
    roles: [ContractorAdmin]
    code: 201
    input: [worker_id, job_order_id]
    output: WorkerAssignment
    side_effects: ["status = PLANNED; ceiling check: domestic_hired_count + count(PLANNED/ACTIVE assignments) must stay <= workers_requested"]
  - method: GET
    path: "/h2a/worker-assignments"
    description: "List worker assignments"
    roles: *ALL_ROLES
    code: 200
    input: ["worker_id?", "job_order_id?", "status?", "limit?", "offset?"]
    output: "WorkerAssignment[]"
    side_effects: []
  - method: GET
    path: "/h2a/worker-assignments/{assignmentId}"
    description: "Get a worker assignment"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: WorkerAssignment
    side_effects: []
  - method: POST
    path: "/h2a/worker-assignments/{assignmentId}/start"
    description: "Start work (PLANNED->ACTIVE); creates the OPEN wage reconciliation"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: WorkerAssignment
    side_effects: ["status = ACTIVE; started_on = clock date; Worker -> WORKING; WageReconciliation created OPEN (provisional variant computed)"]
  - method: POST
    path: "/h2a/worker-assignments/{assignmentId}/end"
    description: "End an assignment (COMPLETED or FOR_CAUSE); triggers departure, housing vacate cascade, reconciliation recompute"
    roles: [ContractorAdmin]
    code: 200
    input: [end_reason]
    output: WorkerAssignment
    side_effects: ["status -> COMPLETED/TERMINATED; ended_on = clock date; guarantee_eligible per reason; Worker -> DEPARTED if no other live assignment; housing vacated; reconciliation recomputed"]
  - method: POST
    path: "/h2a/worker-assignments/{assignmentId}/report-abandonment"
    description: "Report job abandonment; ends the assignment (ABANDONED), abandons the worker, opens an AuditCase"
    roles: [ContractorAdmin, GrowerRep]
    code: 200
    input: ["note?"]
    output: WorkerAssignment
    side_effects: ["status = TERMINATED (end_reason ABANDONED); Worker -> ABANDONED; housing vacated; system AuditCase opened (trigger_source ABANDONMENT)"]
  - method: POST
    path: "/h2a/work-logs"
    description: "Record one day's hours/units for an ACTIVE assignment (immutable; one row per assignment+date)"
    roles: [ContractorAdmin]
    code: 201
    input: [worker_assignment_id, work_date, hours_worked, units_picked]
    output: WorkLog
    side_effects: ["OPEN WageReconciliation recomputed (provisional variant)"]
  - method: GET
    path: "/h2a/worker-assignments/{id}/work-logs"
    description: "List work logs of an assignment"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkLog[]"
    side_effects: []
  - method: GET
    path: "/h2a/worker-assignments/{id}/reconciliation"
    description: "Fetch the 1:1 wage reconciliation of an assignment (array of 0 or 1)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: "WageReconciliation[]"
    side_effects: []
  - method: POST
    path: "/h2a/worker-assignments/{assignmentId}/finalize-reconciliation"
    description: "Freeze the FINAL reconciliation variant for a terminal assignment"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: WageReconciliation
    side_effects: ["status = FINALIZED; final variant computed (eligibility, outbound transport, ended_on basis)"]

  # --- TransferRequest ---
  - method: POST
    path: "/h2a/transfer-requests"
    description: "Request transfer of a worker to another grower's ACTIVE order"
    roles: [ContractorAdmin, GrowerRep]
    code: 201
    input: [worker_id, from_assignment_id, to_job_order_id, reason]
    output: TransferRequest
    side_effects: ["status = PENDING; requested_by_user_id = X-User-ID"]
  - method: GET
    path: "/h2a/transfer-requests"
    description: "List transfer requests"
    roles: *ALL_ROLES
    code: 200
    input: ["worker_id?", "from_assignment_id?", "to_job_order_id?", "status?", "limit?", "offset?"]
    output: "TransferRequest[]"
    side_effects: []
  - method: GET
    path: "/h2a/transfer-requests/{transferRequestId}"
    description: "Get a transfer request"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/h2a/transfer-requests/{transferRequestId}/grower-approve"
    description: "Target grower approves the inbound transfer (PENDING->GROWER_APPROVED)"
    roles: [GrowerRep]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status = GROWER_APPROVED"]
  - method: POST
    path: "/h2a/transfer-requests/{transferRequestId}/grower-reject"
    description: "Target grower rejects the transfer (PENDING->REJECTED)"
    roles: [GrowerRep]
    code: 200
    input: ["note?"]
    output: TransferRequest
    side_effects: ["status = REJECTED"]
  - method: POST
    path: "/h2a/transfer-requests/{transferRequestId}/finalize"
    description: "Execute the approved transfer; ends the source assignment and starts the target assignment atomically"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["Source assignment -> TRANSFERRED_OUT (ended_on = clock - 1 day); source reconciliation recomputed; new ACTIVE assignment + OPEN reconciliation created on target order; worker remains WORKING; status = APPROVED"]
  - method: POST
    path: "/h2a/transfer-requests/{transferRequestId}/cancel"
    description: "Cancel a PENDING or GROWER_APPROVED transfer (requester or contractor)"
    roles: [ContractorAdmin, GrowerRep]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status = CANCELLED"]

  # --- AuditCase ---
  - method: POST
    path: "/h2a/audit-cases"
    description: "Open an audit case (manual); system also opens ABANDONMENT cases automatically"
    roles: [WageAuditor]
    code: 201
    input: [grower_id, "job_order_id?", trigger_source, "note?"]
    output: AuditCase
    side_effects: ["status = OPEN; opened_on = clock date"]
  - method: GET
    path: "/h2a/audit-cases"
    description: "List audit cases"
    roles: *ALL_ROLES
    code: 200
    input: ["grower_id?", "job_order_id?", "status?", "limit?", "offset?"]
    output: "AuditCase[]"
    side_effects: []
  - method: GET
    path: "/h2a/audit-cases/{auditCaseId}"
    description: "Get an audit case"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: AuditCase
    side_effects: []
  - method: POST
    path: "/h2a/audit-cases/{auditCaseId}/issue-findings"
    description: "Record findings; computes provisional_exposure_cents"
    roles: [WageAuditor]
    code: 200
    input: [findings]
    output: AuditCase
    side_effects: ["status = FINDINGS_ISSUED; provisional exposure computed (provisional variant)"]
  - method: POST
    path: "/h2a/audit-cases/{auditCaseId}/close-no-action"
    description: "Close without enforcement action"
    roles: [WageAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["status = CLOSED_NO_ACTION; closed_on set"]
  - method: POST
    path: "/h2a/audit-cases/{auditCaseId}/assess-penalty"
    description: "Assess the final civil money penalty; suspends the grower"
    roles: [WageAuditor]
    code: 200
    input: [good_faith]
    output: AuditCase
    side_effects: ["status = RESOLVED_PENALTY; final_penalty_cents computed (final variant); Grower ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/h2a/audit-cases/{auditCaseId}/debar"
    description: "Debar the grower; cascades withdrawal of pre-petitioning job orders, their DRAFT petitions, and undecided applications"
    roles: [WageAuditor]
    code: 200
    input: [debarment_years]
    output: AuditCase
    side_effects: ["status = RESOLVED_DEBARMENT; Grower -> DEBARRED with debarment_ends_on; JobOrder/Petition/Application withdrawal cascade"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP, http: 403, condition: "Entity-backed identity does not own the resource (transfer target grower, transfer canceller, abandonment reporter)" }
  # existence
  - { id: ERR_GROWER_NOT_FOUND, http: 404, condition: "Grower id does not exist" }
  - { id: ERR_WAGE_DETERMINATION_NOT_FOUND, http: 404, condition: "Wage determination id does not exist" }
  - { id: ERR_JOB_ORDER_NOT_FOUND, http: 404, condition: "Job order id does not exist" }
  - { id: ERR_DOMESTIC_APPLICATION_NOT_FOUND, http: 404, condition: "Domestic application id does not exist" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "Worker id does not exist" }
  - { id: ERR_VISA_PETITION_NOT_FOUND, http: 404, condition: "Visa petition id does not exist" }
  - { id: ERR_CONSULAR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Consular appointment id does not exist" }
  - { id: ERR_HOUSING_UNIT_NOT_FOUND, http: 404, condition: "Housing unit id does not exist" }
  - { id: ERR_HOUSING_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Housing assignment id does not exist" }
  - { id: ERR_WORKER_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Worker assignment id does not exist" }
  - { id: ERR_TRANSFER_REQUEST_NOT_FOUND, http: 404, condition: "Transfer request id does not exist" }
  - { id: ERR_AUDIT_CASE_NOT_FOUND, http: 404, condition: "Audit case id does not exist" }
  # input / fiscal domain
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, unknown/invalid field or enum value, non-positive amounts, invalid counts" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "end before start (job order dates, move-out before move-in)" }
  - { id: ERR_INVALID_HOURS, http: 400, condition: "hours_worked not a multiple of 0.25 or outside (0, 16]" }
  - { id: ERR_INVALID_DEBARMENT_TERM, http: 400, condition: "debarment_years outside 1..3" }
  - { id: ERR_INVALID_FINDINGS, http: 400, condition: "findings empty, unknown violation_code, or count < 1" }
  # state
  - { id: ERR_GROWER_NOT_ACTIVE, http: 409, condition: "Operation requires grower ACTIVE (submit, petition create, assignment create)" }
  - { id: ERR_WAGE_DETERMINATION_NOT_PUBLISHED, http: 409, condition: "Referenced wage determination is SUPERSEDED at submit" }
  - { id: ERR_JOB_ORDER_INVALID_STATE, http: 409, condition: "Job order not in a state that permits the operation" }
  - { id: ERR_PETITION_INVALID_STATE, http: 409, condition: "Petition not in a state that permits the operation" }
  - { id: ERR_WORKER_INVALID_STATE, http: 409, condition: "Worker not in a state that permits the operation (e.g. link requires REGISTERED, appointment requires PETITIONED, assignment requires VISA_ISSUED)" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment not in a state that permits the operation" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application already decided or withdrawn" }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "Appointment not SCHEDULED" }
  - { id: ERR_TRANSFER_INVALID_STATE, http: 409, condition: "Transfer request not in a state that permits the operation" }
  - { id: ERR_AUDIT_CASE_INVALID_STATE, http: 409, condition: "Audit case not in a state that permits the operation" }
  - { id: ERR_RECONCILIATION_INVALID_STATE, http: 409, condition: "Reconciliation already FINALIZED, or assignment not terminal" }
  - { id: ERR_HOUSING_UNIT_INVALID_STATE, http: 409, condition: "Expire requires inspection_status CERTIFIED" }
  - { id: ERR_HOUSING_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Housing assignment already VACATED" }
  # temporal
  - { id: ERR_CERTIFICATION_LEAD_TIME, http: 409, condition: "clock date > work_start_date - 30 days at certify" }
  - { id: ERR_ORDER_NOT_YET_STARTED, http: 409, condition: "clock date < work_start_date at activate" }
  - { id: ERR_ORDER_PERIOD_NOT_ENDED, http: 409, condition: "clock date < work_end_date at close" }
  - { id: ERR_ORDER_PERIOD_ENDED, http: 409, condition: "clock date > work_end_date at assignment start" }
  - { id: ERR_APPOINTMENT_DATE_NOT_FUTURE, http: 409, condition: "appointment_date <= clock date at create" }
  - { id: ERR_APPOINTMENT_NOT_YET_DUE, http: 409, condition: "clock date < appointment_date at complete" }
  - { id: ERR_WORK_LOG_DATE_OUT_OF_RANGE, http: 409, condition: "work_date outside [assignment.started_on, min(clock date, order.work_end_date)]" }
  - { id: ERR_INSPECTION_DATE_IN_FUTURE, http: 400, condition: "inspected_on > clock date" }
  - { id: ERR_HOUSING_CERTIFICATION_STILL_VALID, http: 409, condition: "expire called while clock date <= certification_valid_until" }
  # safety / compliance
  - { id: ERR_DOMESTIC_PREFERENCE_VIOLATION, http: 422, condition: "REJECT of QUALIFIED applicant whose applied_on <= recruitment_cutoff_date" }
  - { id: ERR_HOUSING_NOT_CERTIFIED, http: 409, condition: "Unit not CERTIFIED or clock past certification_valid_until at move-in" }
  # referential
  - { id: ERR_GROWER_MISMATCH, http: 409, condition: "Housing unit grower != assignment's order grower; or audit case job_order belongs to another grower" }
  - { id: ERR_SAME_GROWER_TRANSFER, http: 409, condition: "Transfer target job order belongs to the same grower as the source" }
  - { id: ERR_WORKER_ORDER_MISMATCH, http: 409, condition: "Worker's petition job order != assignment job order (direct create only; transfers exempt)" }
  - { id: ERR_WORKER_NOT_ON_PETITION, http: 409, condition: "Appointment worker not linked to the appointment petition" }
  # constraint / quota
  - { id: ERR_DUPLICATE_FEIN, http: 409, condition: "fein already registered" }
  - { id: ERR_DUPLICATE_PASSPORT, http: 409, condition: "passport_number already registered" }
  - { id: ERR_DUPLICATE_RECEIPT_CODE, http: 409, condition: "receipt_code already used" }
  - { id: ERR_DUPLICATE_WORK_LOG, http: 409, condition: "A WorkLog already exists for this assignment and work_date" }
  - { id: ERR_CONSULATE_CAPACITY_FULL, http: 409, condition: "6 SCHEDULED appointments already exist for (consulate_code, appointment_date)" }
  - { id: ERR_HOUSING_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping OCCUPIED assignments would exceed unit capacity" }
  - { id: ERR_WORKER_HOUSING_OVERLAP, http: 409, condition: "Worker already has an overlapping OCCUPIED housing assignment" }
  - { id: ERR_WORKER_CEILING_EXCEEDED, http: 409, condition: "domestic_hired + live assignments would exceed workers_requested (also guards domestic HIRE)" }
  - { id: ERR_PETITION_WORKER_OVERFLOW, http: 409, condition: "Linked workers would exceed requested_worker_count" }
  - { id: ERR_PETITION_EXCEEDS_VISA_CEILING, http: 409, condition: "requested_worker_count > visa_worker_ceiling at file" }
  - { id: ERR_RFE_LIMIT_REACHED, http: 409, condition: "rfe_count already 2" }
  - { id: ERR_APPROVED_COUNT_MISMATCH, http: 409, condition: "approved_worker_count != number of linked workers at approval" }
  - { id: ERR_UNDECIDED_APPLICATIONS_REMAIN, http: 409, condition: "close-recruitment with applications still APPLIED" }
  - { id: ERR_OPEN_ASSIGNMENTS_REMAIN, http: 409, condition: "close with non-terminal assignments" }
  - { id: ERR_UNFINALIZED_RECONCILIATIONS_REMAIN, http: 409, condition: "finalize with OPEN reconciliations" }
  - { id: ERR_OPEN_PETITIONS_EXIST, http: 409, condition: "withdraw with petitions in FILED/RFE/APPROVED" }
  - { id: ERR_WORKER_ALREADY_ASSIGNED, http: 409, condition: "Worker already has a PLANNED or ACTIVE assignment" }
  - { id: ERR_WORKER_HAS_ACTIVE_APPOINTMENT, http: 409, condition: "Worker already has a SCHEDULED consular appointment" }
  - { id: ERR_DUPLICATE_ACTIVE_TRANSFER, http: 409, condition: "Worker already has a PENDING or GROWER_APPROVED transfer" }
  - { id: ERR_NO_APPROVED_PETITION, http: 409, condition: "activate without any APPROVED petition" }
  # optimistic concurrency
  - { id: ERR_STALE_JOB_ORDER_VERSION, http: 412, condition: "expected_job_order_version does not match the current JobOrder.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractorAdmin
    description: "Farm labor contractor operator staff; runs job orders, recruitment, petitions, payroll, housing occupancy, transfers"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /h2a/job-orders* lifecycle actions (submit, begin/close-recruitment, activate, close, finalize, withdraw)"
      - "POST /h2a/domestic-applications* and decide"
      - "POST /h2a/workers; POST /h2a/visa-petitions* file/link/respond; POST /h2a/consular-appointments create/cancel"
      - "POST /h2a/housing-units, /expire, /h2a/housing-assignments create/vacate"
      - "POST /h2a/worker-assignments* start/end; POST /h2a/work-logs; finalize-reconciliation"
      - "POST /h2a/transfer-requests/{id}/finalize"
    shared_operations:
      - "All GET endpoints"
      - "POST /h2a/transfer-requests create/cancel; POST /h2a/worker-assignments/{id}/report-abandonment (shared with GrowerRep)"
  - name: GrowerRep
    description: "Representative of a specific Grower; approves inbound transfers, may request transfers and report abandonment on own orders"
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /h2a/transfer-requests/{id}/grower-approve and /grower-reject (X-User-ID must equal target order's grower_id)"
    shared_operations:
      - "All GET endpoints"
      - "POST /h2a/transfer-requests create/cancel; report-abandonment (own grower's orders only)"
  - name: ProgramReviewer
    description: "Government reviewer (SWA/OFLC/USCIS side); deficiency flags, certification, RFE/adjudication, wage determinations"
    identity: opaque
    exclusive_operations:
      - "POST /h2a/wage-determinations"
      - "POST /h2a/job-orders/{id}/flag-deficiency and /certify"
      - "POST /h2a/visa-petitions/{id}/issue-rfe and /adjudicate"
    shared_operations: ["All GET endpoints"]
  - name: HousingInspector
    description: "Independent housing inspector; segregation of duties: the contractor cannot certify its own housing"
    identity: opaque
    exclusive_operations:
      - "POST /h2a/housing-units/{id}/inspections"
    shared_operations: ["All GET endpoints"]
  - name: VisaOfficer
    description: "Consular officer recording interview outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /h2a/consular-appointments/{id}/complete"
    shared_operations: ["All GET endpoints"]
  - name: WageAuditor
    description: "Wage & Hour Division auditor; enforcement cases, penalties, debarment, grower standing"
    identity: opaque
    exclusive_operations:
      - "POST /h2a/audit-cases* (create, issue-findings, close-no-action, assess-penalty, debar)"
      - "POST /h2a/growers/{id}/refresh-status"
    shared_operations: ["All GET endpoints"]
  - name: SystemAdmin
    description: "Test-harness operator for the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /h2a/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
