      - name: cn_val_volume_tolerance_boundary
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_VOLUME_TOLERANCE_EXCEEDED]"
          - "constants.OVERRECEIPT_TOLERANCE_PCT"
        distinguishing_aspect: "Over-receipt tolerance is exactly 110%: against committed 100 kg, a 110 kg lot is accepted (110 <= 110) and one further kg breaches it — the inclusive boundary pins the rule."
        test_recipe:
          setup: ["Supplier SUP-K-30 QUALIFIED/ACTIVE with committed_volume_kg 100; lot of 110 kg already received."]
          setup_api_calls:
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-K-30", isolate_type: "PEA", committed_volume_kg: 100, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *k_sup_qualify
            - *k_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-30A", quantity_kg: 110, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_a: $.data.id }
          trigger:
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-K-30B", quantity_kg: 1, received_at: "2026-09-02T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { err: $.data.error_id }
          assert:
            - "the 110 kg lot was accepted (110 <= 100 * 110% inclusive)"
            - "the extra 1 kg lot fails 422 ERR_VOLUME_TOLERANCE_EXCEEDED (111 > 110)"

      - name: cn_val_lot_receipt_requires_active_agreement
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AGREEMENT_NOT_ACTIVE]"
          - "endpoints.POST_/protein-ops/ingredient-lots"
        distinguishing_aspect: "Lot receipt against a DRAFT agreement fails 422 ERR_AGREEMENT_NOT_ACTIVE even though the supplier exists and is QUALIFIED."
        test_recipe:
