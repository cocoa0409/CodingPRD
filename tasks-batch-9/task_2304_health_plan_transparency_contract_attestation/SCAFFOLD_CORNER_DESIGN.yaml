        claim_type: cross_entity
        grounds:
          - state_machines.ServiceProviderContract.IN_REVIEW_to_NON_COMPLIANT
        excluded_because:
          difficulty_instance: transitive_cascade / gag_escalation_cascade_five_links_to_voided_attestation
          rationale: "That §1.8 instance asserts all five CASCADE-A links end to end, including the DRAFT attestation voided by the posture flip."

      - name: mrf_validating_branch_publishes_or_rejects
        claim_type: branching
        grounds:
