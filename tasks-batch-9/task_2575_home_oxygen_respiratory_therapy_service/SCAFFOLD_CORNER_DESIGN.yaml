            - "${pick_ok} == ${u_ok}: adding one unit that satisfies every predicate turns the same request into a 201, which proves the rejection came from the filter and not from the role or the contract state"

      - name: travel_supply_altitude_factor_step_and_ceiling
        claim_type: waterfall_allocation
        grounds:
          - calculations.travel_supply_authorization
          - entities.TravelAuthorization.fields.altitude_factor
          - entities.TravelAuthorization.fields.effective_lpm
        distinguishing_aspect: |
          altitude_gain is divided by 1000 and CEILED, so 4000 ft and 4001 ft of gain fall in
          different steps (1.12 vs 1.15), and a large gain is clamped at ALTITUDE_FACTOR_MAX so
          1.36 is reported as 1.30 — the clamp, not the step, decides the high-altitude case.
        test_recipe:
          setup:
            - "One patient at altitude_feet 500 with an ACTIVE certificate prescribing 2.0 lpm at 24 hours per day, and a contract driven all the way to service_status IN_SERVICE."
            - "The three requests use pairwise disjoint, non-touching travel windows so that no window-conflict rule fires."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
