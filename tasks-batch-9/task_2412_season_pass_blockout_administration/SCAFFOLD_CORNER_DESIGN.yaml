              payload: { season_pass_id: "${pass_b}", park_day_id: "${tiny_day}", arrival_window_start: "15:00", arrival_window_end: "16:00" }
              as: PassOfficeClerk
              captures: { e100: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_PARK_DAY_CAPACITY_FULL', not ERR_RESERVATION_SLOT_FULL"
            - "GET /park-days/${tiny_day} → data.reservation_slot_capacity == 1, data.window_slot_capacity == 1, data.reserved_count == 1, data.remaining_slot_count == 0"
            - "after POST /reservations/${res_a}/cancel the same booking for pass B returns 201 and GET /park-days/${tiny_day} → data.reserved_count == 1, data.released_count == 1"

  # ===========================================================================
  # RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: program_admin_exclusive_calendar_writes_are_refused_to_other_roles
        claim_type: role_exclusive_operation
        grounds:
          - roles.ProgramAdmin
          - roles.PassOfficeClerk
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /park-days]
        distinguishing_aspect: "The park calendar is ProgramAdmin's exclusive territory: a PassOfficeClerk, a GateAgent and a Passholder are each refused with 403 on the identical body that a ProgramAdmin accepts."
        test_recipe:
          setup:
            - "One program in DESIGN."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
          trigger:
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: PassOfficeClerk
              captures: { e1: "$.data.error_id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id" }
          assert:
            - "first trigger: HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "GateAgent and Passholder callers receive the same 403 on the same body"
            - "second trigger: HTTP 201 with data.day_class == 'STANDARD'"
            - "GET /park-days?program_id=${prog} → data.total_count == 1 (the refused calls created nothing)"
            - "GET /park-days as PassOfficeClerk returns 200 (reads are shared even where the write is exclusive)"

      - name: gate_agent_cannot_review_or_decide_a_sharing_case
        claim_type: role_exclusive_operation
        grounds:
          - roles.GateAgent
          - roles.ComplianceOfficer
          - endpoints[POST /sharing-cases/{case_id}/review]
          - endpoints[POST /sharing-cases/{case_id}/decide]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The gate opens cases but may not adjudicate them: the same GateAgent who is authorised to POST /sharing-cases is refused review and decide, which are ComplianceOfficer-exclusive."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE and a STANDARD park day 2026-09-01."
            - "A processed ACTIVE BRONZE pass with one visit and an OPEN SharingCase opened by gate user G1."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_901}", entry_at: "2026-09-01T10:00:00Z", gate_code: "NORTH", photo_match: "MISMATCH" }
              as: GateAgent
              captures: { v1: "$.data.id" }
            - call: "POST /sharing-cases"
              payload: { season_pass_id: "${pass_a}", evidence_visit_ids: ["${v1}"], note: "Photo mismatch" }
              as: GateAgent
              as_user_id: "gate-user-g1"
              captures: { case_1: "$.data.id" }
          trigger:
            - call: "POST /sharing-cases/${case_1}/review"
              payload: {}
              as: GateAgent
              as_user_id: "gate-user-g1"
              captures: { e1: "$.data.error_id" }
            - call: "POST /sharing-cases/${case_1}/decide"
              payload: { decision: "DISMISSED", rationale: "Self-service dismissal" }
              as: GateAgent
              as_user_id: "gate-user-g1"
              captures: { e2: "$.data.error_id" }
            - call: "POST /sharing-cases/${case_1}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-o1"
          assert:
            - "first and second triggers: HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "after the refusals GET /sharing-cases/${case_1} → data.case_status == 'OPEN' and data.review_round == 0"
            - "third trigger: HTTP 200 with data.case_status == 'UNDER_REVIEW'"
            - "GET /sharing-cases/${case_1} as GateAgent returns 200 (listing and reading cases is shared)"

      - name: pass_office_clerk_cannot_reverse_an_applied_upgrade
        claim_type: role_exclusive_operation
        grounds:
          - roles.PassOfficeClerk
          - roles.ComplianceOfficer
          - endpoints[POST /upgrade-orders/{upgrade_order_id}/reverse]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The clerk who quoted and applied the upgrade cannot undo it: reversal, which rewrites the pass ledger, is ComplianceOfficer-exclusive."
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE (12000) and GOLD (30000) and no park days."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL with an APPLIED BRONZE→GOLD upgrade (total_due 7000 paid in full)."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /upgrade-orders"
              payload: { season_pass_id: "${pass_a}", source_tier_id: "${bronze}", target_tier_id: "${gold}", credit_mode: "PAID_TO_DATE" }
              as: PassOfficeClerk
              captures: { ord: "$.data.id" }
            - call: "POST /upgrade-orders/${ord}/apply"
              payload: { payment_amount_cents: 7000 }
              as: PassOfficeClerk
          trigger:
            - call: "POST /upgrade-orders/${ord}/reverse"
              payload: { reason: "Clerk change of mind" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
            - call: "POST /upgrade-orders/${ord}/reverse"
              payload: { reason: "Charged in error" }
              as: ComplianceOfficer
              as_user_id: "officer-o1"
          assert:
            - "first trigger: HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED' and GET /upgrade-orders/${ord} → data.status == 'APPLIED'"
            - "second trigger: HTTP 200 with data.status == 'REVERSED'"
            - "GET /season-passes/${pass_a} → data.tier_id == '${bronze}' and data.contract_value_cents == 12000 (the reversal restored the source tier)"
            - "GET /season-passes/${pass_a} → data.billed_total_cents == data.paid_to_date_cents + data.credited_total_cents + data.outstanding_balance_cents"

      - name: passholder_cannot_read_the_holder_directory
        claim_type: role_exclusive_operation
        grounds:
          - roles.Passholder
          - endpoints[GET /passholders]
          - endpoints[GET /passholders/{passholder_id}]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The Passholder role is entity-backed and deliberately excluded from the directory listing, yet may still read a single holder row — the exclusion is on the collection, not on the resource."
        test_recipe:
          setup:
            - "Two holders exist."
          setup_api_calls:
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ben Holder", email: "ben@example.com", date_of_birth: "1988-06-11" }
              as: PassOfficeClerk
              captures: { holder_b: "$.data.id" }
          trigger:
            - call: "GET /passholders"
              as: Passholder
              as_user_id: "${holder_a}"
              captures: { err: "$.data.error_id" }
            - call: "GET /passholders/${holder_a}"
              as: Passholder
              as_user_id: "${holder_a}"
          assert:
            - "first trigger: HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "second trigger: HTTP 200 with data.full_name == 'Ada Holder' and data.status == 'ACTIVE'"
            - "GET /passholders as GateAgent returns 200 with data.total_count == 2 (the other four roles keep the directory)"

