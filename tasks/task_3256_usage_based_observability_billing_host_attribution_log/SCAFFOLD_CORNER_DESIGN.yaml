# =============================================================================
# §1.9 Scaffold Corner Design — task_3256
# Breadth probe across §1.1–§1.7 surface claims not exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: billing_account_create_returns_declared_fields_and_good_standing
        claim_type: Creation
        grounds:
          - entities.BillingAccount
          - endpoints.POST_/billing-accounts
        distinguishing_aspect: "A BillingAccount created with name, plan_tier, billing_cycle_anchor_day returns 201 with standing=GOOD (system-set, never client-supplied), version=1, and id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ENTERPRISE plan tier config exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-accounts"
              payload: { name: "Test Acct", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "the response status is 201"
            - "BillingAccount.${acct_id}.standing == GOOD"
            - "BillingAccount.${acct_id}.version == 1"
            - "BillingAccount.${acct_id}.plan_tier == ENTERPRISE"
            - "meta.api_request_id present"

      - name: retention_tier_get_returns_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.RetentionTier
          - endpoints.GET_/billing-accounts/{id}/retention-tiers
        distinguishing_aspect: "A retention tier's fields round-trip via list endpoint; the basis-point multiplier and half-open window are preserved verbatim."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Account exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "RT", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "t", retention_days: 15, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 15000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
          trigger:
            - call: "GET /api/billing-accounts/${acct_id}/retention-tiers"
              payload: {}
              as: BillingAdmin
          assert:
            - "the response returns exactly 1 row"
            - "RetentionTier.index_rate_multiplier_bp == 15000"
            - "RetentionTier.retention_days == 15"

      - name: pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/billing-accounts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three BillingAccounts, limit=2&offset=0 returns 2 rows, total_count=3, has_more=true; offset=2 returns 1 row, has_more=false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ENTERPRISE plan tier exists. Three billing accounts exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "A1", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "A2", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "A3", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/billing-accounts"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response returns 2 rows with total_count == 3 and has_more == true"

      - name: billing_account_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/billing-accounts/{id}
          - errors.ERR_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "An unknown UUID on the account path segment produces 404 ERR_NOT_FOUND, not 400 and not a generic error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/billing-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_NOT_FOUND"

      - name: billing_account_create_missing_plan_tier_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.BillingAccount.fields.plan_tier
          - validations.priority_13_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "plan_tier is required input with no default; omission is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-accounts"
              payload: { name: "NoPlan", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"

      - name: exclusion_filter_default_enabled_true
        claim_type: Defaults
        grounds:
          - entities.ExclusionFilter.fields.enabled
        distinguishing_aspect: "Omitting 'enabled' on filter creation stores the default true; a subsequent ingest against a matching tag is excluded."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Account, period, retention tier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Default", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "t", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "x-*", sample_rate_pct: 0, priority: 1 }
              as: BillingAdmin
              captures: { filter_id: $.data.id }
          assert:
            - "ExclusionFilter.${filter_id}.enabled == true (default applied)"

      - name: meter_accumulator_quantity_is_computed_not_input
        claim_type: Computed Fields
        grounds:
          - entities.MeterAccumulator.fields.quantity
          - endpoints.POST_/billing-accounts/{id}/billing-periods/{id}/usage-records
        distinguishing_aspect: "MeterAccumulator.quantity is computed; attempts to set it via usage-record input have no direct field. Quantity derives from posted UsageRecords."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Account with OPEN period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Computed", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "TRACE", quantity: 7 }
              as: IngestionAgent
          trigger:
            - call: "GET /api/billing-accounts/${acct_id}/billing-periods/${period_id}/meter-accumulators"
              payload: { meter: "TRACE" }
              as: BillingAdmin
          assert:
            - "MeterAccumulator for TRACE has quantity == 7"

      - name: system_fields_on_create_input_ignored
        claim_type: System Fields
        grounds:
          - entities.BillingAccount
        distinguishing_aspect: "Client-supplied id, version, standing on POST are ignored — server mints id, sets version=1, standing=GOOD."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ENTERPRISE plan tier exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-accounts"
              payload: { name: "SysFields", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1, id: "00000000-0000-4000-8000-deadbeefdead", version: 99, standing: "DELINQUENT" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "the response status is 201"
            - "BillingAccount.${acct_id}.id != '00000000-0000-4000-8000-deadbeefdead'"
            - "BillingAccount.${acct_id}.version == 1"
            - "BillingAccount.${acct_id}.standing == GOOD"

      - name: plan_tier_enum_out_of_set_rejected
        claim_type: Type Constraints
        grounds:
          - entities.BillingAccount.fields.plan_tier
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "plan_tier is closed enum {FREE, PRO, ENTERPRISE}; 'GOLD' is rejected 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-accounts"
              payload: { name: "BadTier", plan_tier: "GOLD", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"

  # =========================================================================
  - section: state_machines
    instances:
      - name: invalid_transition_invoice_pay_from_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.Invoice
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Invoice in DRAFT cannot transition directly to PAID; only ISSUED -> PAID is valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Period closed -> DRAFT invoice created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Inv", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "TRACE", quantity: 1 }
              as: IngestionAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "GET /api/billing-accounts/${acct_id}/billing-periods/${period_id}"
              payload: {}
              as: BillingAdmin
          assert:
            - "BillingPeriod.${period_id}.status == CLOSED"
            - "DRAFT invoice exists; attempting POST /invoices/{id}/pay directly without /issue returns 409 ERR_INVALID_STATE"

      - name: terminal_state_lockdown_paid_invoice_cannot_void
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Invoice
        distinguishing_aspect: "A PAID invoice (terminal) cannot transition to VOID; POST /invoices/{id}/void on a PAID invoice is rejected."
        test_recipe:
          setup:
            - "PAID invoice exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "PaidInv", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /api/billing-accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
          assert:
            - "if a PAID invoice exists, /void returns 409 ERR_INVALID_STATE"
            - "terminal states admit no further transitions"

  # =========================================================================
  - section: calculations
    instances:
      - name: chargeback_rollup_excludes_non_compliant_records
        claim_type: Correct Result
        grounds:
          - calculations.chargeback_rollup_per_team
        distinguishing_aspect: "UsageRecords with tag_compliant=false flow into the UNATTRIBUTED bucket, not the team's rollup; disputed records are also excluded from the team's bucket."
        test_recipe:
          setup:
            - "Team T1 exists; one UsageRecord attributed to T1 with tag_compliant=true quantity=10; one UsageRecord tag_compliant=false quantity=5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "CB", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/teams"
              payload: { name: "T1", cost_center: "CC-1" }
              as: BillingAdmin
              captures: { team1_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "TRACE", quantity: 10, team_id: "${team1_id}" }
              as: IngestionAgent
          trigger:
            - call: "GET /api/billing-accounts/${acct_id}/billing-periods/${period_id}/chargeback"
              payload: {}
              as: FinanceReader
          assert:
            - "the by_team bucket for T1 includes only compliant, undisputed UsageRecords"
            - "the unattributed_cents bucket captures tag_compliant=false rows"

      - name: exclusion_filter_selection_priority_then_created_at_tiebreak
        claim_type: Correct Result
        grounds:
          - calculations.exclusion_filter_selection
        distinguishing_aspect: "When two filters match, the lower priority wins; on priority tie, the earlier created_at wins (id is FORBIDDEN as tie-break)."
        test_recipe:
          setup:
            - "Two enabled filters both match 'web-*': f1 priority=2, f2 priority=1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Filter", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "t", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "web-*", sample_rate_pct: 0, priority: 2 }
              as: BillingAdmin
            - call: "POST /api/billing-accounts/${acct_id}/exclusion-filters"
              payload: { service_tag_pattern: "web-*", sample_rate_pct: 100, priority: 1 }
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 50, service_tag: "web-server", ingested_at_utc: "2026-09-05T00:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
              captures: { ev_id: $.data.id }
          assert:
            - "LogEvent.${ev_id}.exclusion_state == INDEXED (priority=1 sample_rate=100 wins over priority=2)"

      - name: cardinality_threshold_boundary_strictly_greater
        claim_type: Boundary / Edge
        grounds:
          - calculations.cardinality_threshold_check
        distinguishing_aspect: "Incident opens when cardinality_estimate > included + 10000 — strictly greater. included=200 means threshold is 10200; estimate=10200 does NOT fire, estimate=10201 does."
        test_recipe:
          setup:
            - "Series registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "Thr", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/teams"
              payload: { name: "T", cost_center: "C" }
              as: BillingAdmin
              captures: { team_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series"
              payload: { metric_name: "m", team_id: "${team_id}" }
              as: BillingAdmin
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/custom-metric-series/${series_id}/rollup"
              payload: { cardinality_estimate: 10200 }
              as: IngestionAgent
            - call: "GET /api/billing-accounts/${acct_id}/cardinality-incidents"
              payload: {}
              as: BillingAdmin
          assert:
            - "no CardinalityIncident was opened at estimate=10200 (== included + 10000, not >)"
            - "a subsequent rollup with estimate=10201 opens an incident"

  # =========================================================================
  - section: validations
    instances:
      - name: period_closed_rejects_log_ingest
        claim_type: violation_to_error
        grounds:
          - validations.priority_5_state
          - errors.ERR_PERIOD_CLOSED
        distinguishing_aspect: "Posting a LogEvent to a CLOSED period returns 409 ERR_PERIOD_CLOSED."
        test_recipe:
          setup:
            - "Period CLOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "PC", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/retention-tiers"
              payload: { name: "t", retention_days: 30, effective_from_utc: "2026-09-01T00:00:00Z", effective_to_utc: "2026-10-01T00:00:00Z", index_rate_multiplier_bp: 10000, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/log-events"
              payload: { size_bytes: 100, service_tag: "x", ingested_at_utc: "2026-10-02T00:00:00Z", retention_tier_id: "${tier_id}" }
              as: IngestionAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_PERIOD_CLOSED"

      - name: tag_policy_block_rejects_non_compliant_usage_record
        claim_type: violation_to_error
        grounds:
          - validations.priority_11_business_referential
          - errors.ERR_TAG_POLICY_VIOLATION
        distinguishing_aspect: "TagPolicy enforcement=BLOCK rejects UsageRecords without a team_id or with a team whose tag value isn't in allowed_values."
        test_recipe:
          setup:
            - "TagPolicy BLOCK requiring tag key 'team' in {a,b}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "TP", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/tag-policies"
              payload: { required_tag_key: "team", allowed_values: ["a", "b"], enforcement: "BLOCK" }
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "TRACE", quantity: 5 }
              as: IngestionAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_TAG_POLICY_VIOLATION"

      - name: occ_stale_version_on_commitment_create
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[commitment-activate-stale-account]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Creating a Commitment with an expected_billing_account_version that's been superseded returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Account created; version captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "OCC", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 5, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v}" }
              as: BillingAdmin
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "LOG_INDEX", committed_quantity: 5, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 1, overage_unit_rate_cents: 5, expected_billing_account_version: "${acct_v}" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and err == ERR_STALE_VERSION"
            - "the first commitment create bumped account.version, so the second with stale expected_version is rejected"

  # =========================================================================
  - section: endpoints
    instances:
      - name: rbac_team_lead_cannot_close_billing_period
        claim_type: rbac_denial
        grounds:
          - endpoints.POST_/billing-accounts/{id}/billing-periods/{id}/close
          - roles.TeamLead
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "TeamLead lacks the close permission; the response is 403 ERR_FORBIDDEN before any state checks."
        test_recipe:
          setup:
            - "Account with OPEN period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "RBAC", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/teams"
              payload: { name: "T", cost_center: "C" }
              as: BillingAdmin
              captures: { team_id: $.data.id }
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/close"
              payload: {}
              as: TeamLead
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN"

      - name: rbac_finance_reader_cannot_create_commitment
        claim_type: rbac_denial
