# =============================================================================
# §1.9 Scaffold Corner Design — Direct Selling Consultant Compensation
# Breadth walk of the claim-extraction guide's nine sections against §1.1-§1.7.
# Corners already proved by §1.8 appear as excluded_because stubs naming the
# difficulty instance that covers them.
# Shared shorthand used in the prose: "mini fixture" = PLAN-A at defaults, the TX
# jurisdiction (825 bp, facilitator true) and the KIT-STD starter kit product;
# "enrolled consultant" = the five-call chain create application -> accept-agreement
# -> identity-decision VERIFY -> pay-starter-kit 11129 -> approve.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: compensation_plan_creation_returns_every_declared_field
        claim_type: Creation
        grounds: ["entities.CompensationPlan", "endpoints[POST /direct-selling/compensation-plans]"]
        distinguishing_aspect: "A creation response must echo all 30 declared plan fields including the nested rank_ladder rungs; a serializer that omits the ladder or the bands fails."
        test_recipe:
          setup:
            - "Empty system, logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id", plan_code: "$.data.plan_code", plan_name: "$.data.name", mode: "$.data.compression_mode", pv_cents: "$.data.point_value_cents", count: "$.data.consultant_count", ver: "$.data.version", created: "$.data.created_at" }
          assert:
            - "HTTP 201 with plan_id a UUID, plan_code == PLAN-A, plan_name == Consultant Plan A"
            - "mode == DYNAMIC, pv_cents == 100, count == 0, ver == 1, created == 2026-08-01T00:00:00Z"
            - "every §1.1 CompensationPlan field is present in the response body, including rank_ladder with 4 rungs and pv_bonus_bands with 3 bands"

      - name: product_and_jurisdiction_reads_return_stored_rows
        claim_type: Retrieval
        grounds: ["entities.Product", "entities.TaxJurisdiction", "endpoints[GET /direct-selling/products/{product_id}]", "endpoints[GET /direct-selling/tax-jurisdictions/{jurisdiction_id}]"]
        distinguishing_aspect: "Single-row reads return exactly what was stored, including the boolean flags that later gate ordering, commissioning and buyback."
        test_recipe:
          setup:
            - "Mini fixture created: PLAN-A, TX jurisdiction, KIT-STD product."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
              as: PlatformAdmin
              captures: { tx_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
              as: PlatformAdmin
              captures: { kit_id: "$.data.id" }
          trigger:
            - call: "GET /direct-selling/tax-jurisdictions/${tx_id}"
              as: Consultant
              captures: { j_state: "$.data.state_code", j_rate: "$.data.tax_rate_bp", j_basis: "$.data.tax_basis_mode", j_remitter: "$.data.remitter" }
            - call: "GET /direct-selling/products/${kit_id}"
              as: Applicant
              captures: { p_sku: "$.data.sku", p_kit: "$.data.is_starter_kit", p_pts: "$.data.volume_points_per_unit", p_comm: "$.data.commissionable", p_bb: "$.data.buyback_eligible" }
            - call: "GET /direct-selling/compensation-plans/${plan_id}"
              as: LegalReviewer
              captures: { g_code: "$.data.plan_code" }
          assert:
            - "j_state == TX, j_rate == 825, j_basis == SRP and j_remitter == FACILITATOR (both derived from facilitator_agreement_active true)"
            - "p_sku == KIT-STD, p_kit == true, p_pts == 0, p_comm == true (default), p_bb == true (default)"
            - "g_code == PLAN-A; all three catalog reads are open to every role"

      - name: listing_endpoints_filter_and_paginate
        claim_type: Listing
        grounds: ["endpoints[GET /direct-selling/products]", "endpoints[GET /direct-selling/consultants]", "response_envelope.list"]
        distinguishing_aspect: "Filters narrow the row set and limit/offset page it while total_count keeps describing the filtered set, not the table."
        test_recipe:
          setup:
            - "Mini fixture plus three enrolled root consultants and three products (KIT-STD, SERUM, SAMPLE)."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
              as: PlatformAdmin
              captures: { kit_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "SERUM", name: "Renewal Serum", wholesale_price_cents: 2000, srp_cents: 4000, volume_points_per_unit: 20 }
              as: PlatformAdmin
              captures: { serum_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "SAMPLE", name: "Sample Pack", wholesale_price_cents: 100, srp_cents: 200, volume_points_per_unit: 1, buyback_eligible: false }
              as: PlatformAdmin
              captures: { sample_id: "$.data.id" }
          trigger:
            - call: "GET /direct-selling/products"
              as: PlatformAdmin
              captures: { all_first_sku: "$.data[0].sku" }
            - call: "GET /direct-selling/products"
              payload: { is_starter_kit: true }
              as: PlatformAdmin
              captures: { kit_only_sku: "$.data[0].sku" }
            - call: "GET /direct-selling/products"
              payload: { buyback_eligible: false }
              as: PlatformAdmin
              captures: { nobb_sku: "$.data[0].sku" }
            - call: "GET /direct-selling/products"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { page1_first: "$.data[0].sku" }
            - call: "GET /direct-selling/products"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
              captures: { page2_first: "$.data[0].sku" }
          assert:
            - "the unfiltered list returns 3 rows with all_first_sku == KIT-STD (creation order)"
            - "kit_only_sku == KIT-STD and the filtered list has exactly 1 row"
            - "nobb_sku == SAMPLE and that list has exactly 1 row"
            - "page1_first == KIT-STD with 2 rows returned, page2_first == SAMPLE with 1 row returned, and the two pages are disjoint"
            - "filter plus pagination compose: GET with is_starter_kit false and limit 1 returns 1 row"

      - name: not_found_errors_for_every_entity_path
        claim_type: Not Found
        grounds: ["validations[priority=5]", "errors[ERR_PLAN_NOT_FOUND]", "errors[ERR_CONSULTANT_NOT_FOUND]", "errors[ERR_RUN_NOT_FOUND]"]
        distinguishing_aspect: "Every one of the 13 path-id families answers with its own NOT_FOUND code and HTTP 404, so no path collapses onto a generic 404."
        test_recipe:
          setup:
            - "Empty system; every trigger addresses the literal all-zero UUID, which no row can ever own."
          setup_api_calls: []
          trigger:
            - call: "GET /direct-selling/compensation-plans/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_plan: "$.data.error_id" }
            - call: "GET /direct-selling/enrollment-applications/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_app: "$.data.error_id" }
            - call: "GET /direct-selling/consultants/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_cons: "$.data.error_id" }
            - call: "GET /direct-selling/product-orders/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_order: "$.data.error_id" }
            - call: "GET /direct-selling/qualification-periods/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_period: "$.data.error_id" }
            - call: "GET /direct-selling/period-qualifications/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_qual: "$.data.error_id" }
            - call: "GET /direct-selling/commission-runs/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_run: "$.data.error_id" }
            - call: "GET /direct-selling/commission-statements/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_stmt: "$.data.error_id" }
            - call: "GET /direct-selling/buyback-requests/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_bb: "$.data.error_id" }
            - call: "GET /direct-selling/compliance-cases/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_case: "$.data.error_id" }
            - call: "GET /direct-selling/income-disclosure-statements/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_disc: "$.data.error_id" }
            - call: "GET /direct-selling/products/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_prod: "$.data.error_id" }
            - call: "GET /direct-selling/tax-jurisdictions/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e_jur: "$.data.error_id" }
          assert:
            - "e_plan == ERR_PLAN_NOT_FOUND, e_app == ERR_APPLICATION_NOT_FOUND, e_cons == ERR_CONSULTANT_NOT_FOUND, e_order == ERR_ORDER_NOT_FOUND"
            - "e_period == ERR_PERIOD_NOT_FOUND, e_qual == ERR_QUALIFICATION_NOT_FOUND, e_run == ERR_RUN_NOT_FOUND, e_stmt == ERR_STATEMENT_NOT_FOUND"
            - "e_bb == ERR_BUYBACK_NOT_FOUND, e_case == ERR_CASE_NOT_FOUND, e_disc == ERR_DISCLOSURE_NOT_FOUND, e_prod == ERR_PRODUCT_NOT_FOUND, e_jur == ERR_JURISDICTION_NOT_FOUND"
            - "all thirteen responses carry HTTP 404 and a non-empty message, and each names the addressed entity rather than a generic code"

      - name: missing_required_fields_and_bad_shapes_rejected_with_validation
        claim_type: Required Fields
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Shape validation at priority 4 fires before any lookup or business rule, so a malformed body never reaches the domain."
        test_recipe:
          setup:
            - "Mini fixture created (PLAN-A, TX, KIT-STD)."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
              as: PlatformAdmin
              captures: { kit_id: "$.data.id" }
          trigger:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-B" }
              as: PlatformAdmin
              captures: { e_missing_name: "$.data.error_id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "SERUM", name: "Renewal Serum", wholesale_price_cents: 2000 }
              as: PlatformAdmin
              captures: { e_missing_srp: "$.data.error_id" }
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "CA", tax_rate_bp: 725 }
              as: PlatformAdmin
              captures: { e_missing_flag: "$.data.error_id" }
            - call: "POST /direct-selling/enrollment-applications"
              payload: { applicant_email: "zoe@ex.test", applicant_full_name: "Zoe Gap", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}" }
              as: PlatformAdmin
              captures: { e_missing_state: "$.data.error_id" }
          assert:
            - "all four responses are ERR_VALIDATION with HTTP 400"
            - "each message names the missing field (name, srp_cents, facilitator_agreement_active, applicant_state_code)"
            - "no row was created by any of the four calls: GET /direct-selling/compensation-plans returns 1 row and GET /direct-selling/products returns 1 row"

      - name: plan_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds: ["entities.CompensationPlan", "endpoints[POST /direct-selling/compensation-plans]"]
        distinguishing_aspect: "All 23 optional plan knobs plus the four-rung rank ladder come back at their documented defaults from a two-field create."
        test_recipe:
          setup:
            - "Empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-D", name: "Defaults Plan" }
              as: PlatformAdmin
              captures: { d_payline: "$.data.payline_min_pv_points", d_pvmin: "$.data.pv_bonus_min_points", d_leg: "$.data.active_leg_min_points", d_cap: "$.data.pv_bonus_cap_cents", d_probation: "$.data.probation_keep_bp", d_tier: "$.data.withhold_tier_threshold_cents", d_low: "$.data.withhold_low_bp", d_high: "$.data.withhold_high_bp", d_min: "$.data.min_payout_cents", d_seventy: "$.data.seventy_rule_bp", d_bb: "$.data.buyback_rate_bp", d_free: "$.data.restock_free_limit_cents", d_fee: "$.data.restock_fee_bp", d_cool: "$.data.sanction_cooloff_days", d_appeal: "$.data.appeal_window_days", d_reins: "$.data.reinstatement_window_days", d_ident: "$.data.max_identity_attempts", d_ship_free: "$.data.free_shipping_threshold_cents", d_ship_flat: "$.data.flat_shipping_cents", d_consec: "$.data.consecutive_qualifying_periods", d_grace: "$.data.maintenance_grace_periods", d_bump: "$.data.senior_rank_bump_bp", d_window: "$.data.buyback_window_days" }
            - call: "POST /direct-selling/products"
              payload: { sku: "PLAIN", name: "Plain Product", wholesale_price_cents: 500, srp_cents: 1000 }
              as: PlatformAdmin
              captures: { pr_pts: "$.data.volume_points_per_unit", pr_comm: "$.data.commissionable", pr_bb: "$.data.buyback_eligible", pr_kit: "$.data.is_starter_kit" }
          assert:
            - "d_payline == 200, d_pvmin == 100, d_leg == 300, d_cap == 50000, d_probation == 5000"
            - "d_tier == 20000, d_low == 1000, d_high == 2500, d_min == 2500, d_seventy == 7000"
            - "d_bb == 9000, d_window == 365, d_free == 45000, d_fee == 500, d_cool == 30, d_appeal == 14, d_reins == 180, d_ident == 2"
            - "d_ship_free == 25000, d_ship_flat == 995, d_consec == 2, d_grace == 1, d_bump == 200"
            - "pr_pts == 0, pr_comm == true, pr_bb == true, pr_kit == false"
            - "the default rank_ladder has rungs CONSULTANT, SENIOR_CONSULTANT, DIRECTOR, EXECUTIVE_DIRECTOR with rank_order 1..4"

      - name: computed_fields_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds: ["entities.EnrollmentApplication", "entities.ProductOrder", "validations[priority=4]"]
        distinguishing_aspect: "Money and status fields are server-derived: a client that tries to dictate kit_total_cents or total_due_cents is rejected, never obeyed."
        test_recipe:
          setup:
            - "Mini fixture plus SERUM catalogued, one enrolled root consultant and an OPEN period 2026-08."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
              as: PlatformAdmin
            - call: "POST /direct-selling/products"
              payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
              as: PlatformAdmin
              captures: { kit_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "SERUM", name: "Renewal Serum", wholesale_price_cents: 2000, srp_cents: 4000, volume_points_per_unit: 20 }
              as: PlatformAdmin
              captures: { serum_id: "$.data.id" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { p8_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications"
              payload: { applicant_email: "cyd@ex.test", applicant_full_name: "Cyd Computed", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", identity_document_reference: "DOC-CYD" }
              as: PlatformAdmin
              captures: { app_id: "$.data.id", kit_total: "$.data.kit_total_cents", kit_tax: "$.data.kit_tax_cents" }
            - call: "POST /direct-selling/enrollment-applications/${app_id}/accept-agreement"
              payload: { agreement_version: "AGR-2026-01" }
              as: Applicant
              as_user_id: "${app_id}"
            - call: "POST /direct-selling/enrollment-applications/${app_id}/identity-decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /direct-selling/enrollment-applications/${app_id}/pay-starter-kit"
              payload: { amount_cents: 11129, payment_reference: "KIT-PAY-CYD" }
              as: PlatformAdmin
            - call: "POST /direct-selling/enrollment-applications/${app_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { cons_id: "$.data.id" }
          trigger:
            - call: "POST /direct-selling/product-orders"
              payload: { consultant_id: "${cons_id}", order_type: "BUSINESS_SUPPLY", posted_period_code: "2026-08", ship_to_state_code: "TX", lines: [ { product_id: "${serum_id}", quantity: 5 } ] }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { o_merch: "$.data.merchandise_subtotal_cents", o_srp: "$.data.srp_basis_cents", o_tax: "$.data.tax_total_cents", o_ship: "$.data.shipping_cents", o_due: "$.data.total_due_cents", o_pts: "$.data.total_volume_points", o_comm_pts: "$.data.commissionable_volume_points", o_returned: "$.data.returned_volume_points", o_refunded: "$.data.refunded_cents", o_posted: "$.data.volume_posted", o_rate: "$.data.tax_rate_bp", o_mode: "$.data.tax_basis_mode" }
          assert:
            - "kit_tax == 1229 and kit_total == 11129 are computed from the product's srp_cents and the jurisdiction, never from input"
            - "o_merch == 10000, o_srp == 20000, o_tax == 1650, o_ship == 995 (10000 < free_shipping_threshold_cents 25000), o_due == 12645"
            - "o_pts == 100, o_comm_pts == 100, o_returned == 0, o_refunded == 0, o_posted == false"
            - "o_rate == 825 and o_mode == SRP are snapshots taken at creation, not live joins"
            - "the same POST with merchandise_subtotal_cents 1, tax_total_cents 1, total_due_cents 1 and volume_posted true added to the body produces the identical computed values above (client values for computed fields are ignored, not honoured and not rejected)"

      - name: system_fields_generated_and_client_values_ignored
        claim_type: System Fields
        grounds: ["response_envelope", "entities.CompensationPlan", "entities.Consultant"]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the system from the logical clock, and client-supplied values are refused."
        test_recipe:
          setup:
            - "Empty system; clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-S", name: "System Fields Plan" }
              as: PlatformAdmin
              captures: { s_id: "$.data.id", s_created: "$.data.created_at", s_updated: "$.data.updated_at", s_ver: "$.data.version" }
            - call: "PATCH /direct-selling/compensation-plans/${s_id}"
              payload: { min_payout_cents: 3000 }
              as: PlatformAdmin
              captures: { s2_id: "$.data.id", s2_created: "$.data.created_at", s2_ver: "$.data.version", s2_min: "$.data.min_payout_cents" }
          assert:
            - "s_id is a UUID the client never supplied; s_created == s_updated == 2026-08-01T00:00:00Z; s_ver == 1"
            - "s2_id == s_id and s2_created == s_created (immutable system fields survive the update)"
            - "s2_ver == 2 (version increments on every write) and s2_min == 3000"
            - "repeating the create with id, created_at, updated_at and version in the body yields a fresh UUID, created_at 2026-08-01T00:00:00Z and version 1 (the submitted system values are ignored)"

      - name: type_constraints_reject_unknown_enums_and_out_of_range_integers
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", "entities.ProductOrder", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Enum members outside the declared set and integers outside the declared range are rejected before any state or ownership check."
        test_recipe:
          setup:
            - "Mini fixture plus SERUM catalogued, one enrolled root consultant and an OPEN period 2026-08."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
              as: PlatformAdmin
            - call: "POST /direct-selling/products"
              payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
              as: PlatformAdmin
              captures: { kit_id: "$.data.id" }
            - call: "POST /direct-selling/products"
              payload: { sku: "SERUM", name: "Renewal Serum", wholesale_price_cents: 2000, srp_cents: 4000, volume_points_per_unit: 20 }
              as: PlatformAdmin
              captures: { serum_id: "$.data.id" }
            - call: "POST /direct-selling/qualification-periods"
              payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: CommissionAnalyst
              captures: { p8_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications"
              payload: { applicant_email: "tye@ex.test", applicant_full_name: "Tye Types", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", identity_document_reference: "DOC-TYE" }
              as: PlatformAdmin
              captures: { app_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications/${app_id}/accept-agreement"
              payload: { agreement_version: "AGR-2026-01" }
              as: Applicant
              as_user_id: "${app_id}"
            - call: "POST /direct-selling/enrollment-applications/${app_id}/identity-decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /direct-selling/enrollment-applications/${app_id}/pay-starter-kit"
              payload: { amount_cents: 11129, payment_reference: "KIT-PAY-TYE" }
              as: PlatformAdmin
            - call: "POST /direct-selling/enrollment-applications/${app_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { cons_id: "$.data.id" }
          trigger:
            - call: "POST /direct-selling/product-orders"
