      - name: per_incident_plan_selects_the_pro_rata_variant_with_no_uptime_target
        claim_type: variant_selection
        grounds:
          - calculations.outage_credit_amount.variants.PER_INCIDENT
          - entities.ServicePlan.fields.sla_credit_method
          - entities.OutageCredit.fields.method
