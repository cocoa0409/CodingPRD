            - "PAIR-4 member A is nevertheless reachable on the sibling endpoint: POST /warranty-claims for CLM-CVY-2 while the customer is SUSPENDED fails 409 ERR_CUSTOMER_NOT_ACTIVE, and no claim row is created"
