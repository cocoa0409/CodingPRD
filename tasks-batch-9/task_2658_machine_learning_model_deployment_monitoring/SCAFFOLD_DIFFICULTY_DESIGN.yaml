  - rule_id: combinatorial_formula
    instances:

      - name: ramp_plan_five_input_nonlinear_headroom_interaction
        grounds:
          - calculations.traffic_ramp_step_plan
          - calculations.endpoint_traffic_ledger
          - entities.Deployment.fields.ramp_step_index
          - entities.Deployment.fields.traffic_pct
          - entities.TrafficRampStep.fields.delta_pct
          - entities.ServingEndpoint.fields.allocated_traffic_pct
          - validations.priority_70
          - state_machines.Deployment_rollout_state.PENDING_to_RAMPING
        distinguishing_aspect: |
          MODE (a) — five inputs interacting non-linearly: ramp_step_index (tiered checkpoint
          table), traffic_pct, pattern (branch on whether the 5-point reserve applies),
          health_state (branch on the DEGRADED halving) and the endpoint ledger
          (max_traffic_pct - reserve - allocated). The interaction is non-linear because the
          SAME endpoint state (max 40.00, allocated 35.00) gives granted_delta 0 for the
          REALTIME arm — which reserves 5 points it is not allowed to touch — and granted_delta
          5.00 for the SHADOW arm, which reserves nothing. No single input predicts the outcome.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED ModelVersion with feature_spec_hash 'fs-v1'"
            - "one OPEN ServingEndpoint with max_traffic_pct 40.00 (deliberately below the 100.00 final checkpoint) and deploy_cooldown_minutes 30"
            - "one REALTIME Deployment d1 on it, serve window [2026-08-01T00:00:00Z, 2026-08-31T00:00:00Z)"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "narrow-cluster", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 40.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
