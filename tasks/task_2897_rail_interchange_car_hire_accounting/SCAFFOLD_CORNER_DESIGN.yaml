              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "HR", description: "Flat car billed by the hour", time_component_mode: "HOURLY", free_time_hours: 4, hourly_rate_cents: 150, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: false }
              as: ClearinghouseAdmin
              captures: { hr_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 200001", car_type_id: "${hr_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 500, load_status: "EMPTY" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
          trigger:
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-26T06:00:00Z", odometer_miles: 590, load_status: "EMPTY" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "GET /car-hire/hire-movements?car_id=${car_id}&handling_road_id=${bn_id}&status=CLOSED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { mv_id: "$.data[0].id" }
          assert:
            - "CarHireMovement.${mv_id}.chargeable_hours == 50.00 (54.00 elapsed less 4 free hours)"
            - "CarHireMovement.${mv_id}.chargeable_days == null — the HOURLY branch never ceilings to days"
            - "CarHireMovement.${mv_id}.time_component_cents == 7500 == round_half_up(50.00 * 150)"
            - "CarHireMovement.${mv_id}.mileage_component_cents == 212 == round_half_up(90 * 2350 / 1000) — billed although the segment is EMPTY, because HR has loaded_mileage_only false"
            - "CarHireMovement.${mv_id}.gross_hire_cents == 7712 and net_hire_cents == 7712"

      - name: mileage_rounding_is_half_up_not_half_even
