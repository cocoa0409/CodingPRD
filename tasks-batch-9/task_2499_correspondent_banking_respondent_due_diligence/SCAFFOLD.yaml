    roles: [ComplianceAnalyst, SanctionsOfficer]
    code: 200
    input: []
    output: InformationRequest
    side_effects: ["requires state DRAFT, else ERR_INVALID_RFI_STATE", "calculations.rfi_response_sla writes sla_hours and due_at", "sets state SENT and dispatched_at = the logical clock"]

  - method: POST
    path: "/correspondent-banking/information-requests/{informationRequestId}/response"
    description: "Respondent answers the RFI. Permitted from SENT, OVERDUE or ESCALATED — a late answer is accepted and can later earn back strikes."
    roles: [RespondentContact]
