      - GET /episodes/${ep}/reviews returns an empty list
  - name: adjudicate_paid_claim_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Claim
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Adjudicating a claim that is already PAID is rejected 409 ERR_INVALID_STATE — adjudicate is only legal from PENDING.
