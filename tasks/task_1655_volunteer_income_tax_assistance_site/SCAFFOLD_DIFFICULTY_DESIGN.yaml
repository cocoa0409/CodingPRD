          trigger:
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp1}", volunteer_id: "${prep_id}", purpose: INTAKE, start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt1: $.data.id } }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp2}", volunteer_id: "${prep_id}", purpose: PREPARATION, start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { appt2: $.data.id } }
            - { call: "POST /appointments", payload: { site_id: "${site_id}", taxpayer_id: "${tp3}", volunteer_id: "${prep_id}", purpose: FOLLOW_UP, start_at: "2026-08-03T10:30:00Z", end_at: "2026-08-03T11:30:00Z" }, as: Screener, as_user_id: "${scr_id}", captures: { err: $.data.error_id } }
          assert:
            - "Appointment 10:00-11:00 created (201)"
            - "Appointment 11:00-12:00 created (201) — adjacent half-open intervals do not overlap"
            - "Appointment 10:30-11:30 rejected with ERR_APPOINTMENT_OVERLAP_VOLUNTEER (409)"

      - name: site_station_capacity_boundary
        grounds:
          - calculations.appointment_conflict_check
          - validations[priority=7]
          - errors[ERR_SITE_CAPACITY_FULL]
          - entities.Site.fields.station_capacity
        distinguishing_aspect: |
          Resource = Site, semantics = aggregate concurrency capacity (DIFFERENT
          interval semantics than the volunteer's binary exclusion): with
          station_capacity == 1, a second appointment overlapping the first is
          rejected (C >= capacity) even though a DIFFERENT volunteer staffs it,
          while an adjacent 11:00-12:00 appointment is allowed because its
          overlap set is empty (C == 0 < 1).
        test_recipe:
          setup:
            - "Certified OPEN site with station_capacity 1; coordinator and preparer both ACTIVE; three verified taxpayers"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Kiosk VITA", sponsor_org: "UnitedWay", station_capacity: 1, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 10 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /volunteers", payload: { site_id: "${site_id}", full_name: "Coord Ann", email: "coord@x.org", is_coordinator: true }, as: SponsorAdmin, captures: { coord_id: $.data.id, coord_v: $.data.version } }
            - { call: "POST /volunteers/${coord_id}/certifications", payload: { test_type: ETHICS, score: 95, tax_season: 2026, expected_volunteer_version: "${coord_v}" }, as: SponsorAdmin }
