            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-10T00:30:00Z", turbidity_ntu: 5.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-10T00:45:00Z", turbidity_ntu: 5.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
          trigger:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T03:30:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T09:00:00Z" }, as: PackLineSupervisor, captures: { r1_status: "$.data.status", r1_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-runs/${r1_id}/close", payload: { outcome: "ABORTED" }, as: PackLineSupervisor }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: PackLineSupervisor, captures: { r2_status: "$.data.status", r2_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-runs/${r2_id}/close", payload: { outcome: "ABORTED" }, as: PackLineSupervisor }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:30:00Z" }, as: ShedAdmin }
