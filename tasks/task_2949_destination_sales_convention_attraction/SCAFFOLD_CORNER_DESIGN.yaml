              as: SalesManager
              captures: { v_c: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_b_id}", rooms_peak_invited: 400, expected_opportunity_version: "${v_c}" }
              as: SalesManager
              captures: { c_b2_id: $.data.id }
