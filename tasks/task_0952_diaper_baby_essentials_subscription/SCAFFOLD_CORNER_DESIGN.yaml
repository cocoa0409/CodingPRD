        grounds: [calculations.gift_credit_applied_cents, calculations.referral_credit_applied_cents, calculations.promo_discount_cents, calculations.total_due_cents]
        distinguishing_aspect: "On a 2999-cent base with a 1000-cent GIFT credit and a 5000-cent GOODWILL credit under a 0.10 promo, the stack yields gift 1000, referral-pool 1500 (capped at 50% of the ORIGINAL 2999 base, not of the 1999 remainder), loyalty 0 and promo 240, leaving total_due 259."
        test_recipe:
          setup:
            - "Registry owner O holding a 1000-cent GIFT credit claimed from a paid gift, plus a 5000-cent GOODWILL credit issued by SupportAgent."
            - "Plan promo_discount_pct 0.10; subscription at pack_count 2 on a 1200-cent SKU, so the allocated cycle is 2400 + 599 = 2999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
