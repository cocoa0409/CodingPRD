              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_c_id}" }
              as: PublisherEditor
              captures: { sub_c_id: $.data.id }
            - call: "POST /submissions/${sub_c_id}/correlations"
              payload: { standard_code: "NV.M.1.1", depth_level: "MASTERY", page_reference: "pp. 10-48", evidence_citation: "Unit 1 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_nv_id}"
            - call: "POST /submissions/${sub_a_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions/${sub_b_id}/file"
              payload: {}
