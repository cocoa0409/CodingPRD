              as_user_id: "${rn_id}"
              captures: { e_lot: $.data.error_id }
            - call: "GET /urology/consignment-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
              captures: { lot_v1: $.data.version }
            - call: "POST /urology/procedure-cases/${case_2_id}/device-reservation"
              payload: { consignment_lot_id: "${lot_id}", quantity: 2, expected_lot_version: "${lot_v1}" }
