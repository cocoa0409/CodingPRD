              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:00Z" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T02:00:00Z" }
              as: VETTING_APPROVER
              as_user_id: "u_appr_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T03:00:00Z" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T04:00:00Z" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T05:00:00Z" }
