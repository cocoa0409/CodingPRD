          assert:
            - "response error_id == ERR_UNAUTHORIZED_ROLE, http 403 (Supervisor may collect DAILY but never CLEARANCE)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: create_notification_stale_version_rejected
        claim_type: layer_optimistic_concurrency
        grounds:
          - "concurrency_rules[notification-create-stale-project]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC loser path: after N1 advances Project.version, a second filing still carrying the pre-N1 expected_project_version is rejected with ERR_STALE_VERSION (412) — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Project P ASSESSED; client observed Project.version before N1; N1 filed successfully (version advanced)"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-L1", site_address: "39 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "GET /abatement/projects/${p_id}", payload: {}, as: ContractorAdmin, captures: { p_v0: "$.data.version" } }
            - { call: "POST /abatement/notifications", payload: { project_id: "${p_id}", notification_type: "INITIAL", declared_acm_sq_ft: 100, expected_project_version: "${p_v0}" }, as: ContractorAdmin, captures: { n1_id: "$.data.id" } }
          trigger:
            - { call: "POST /abatement/notifications", payload: { project_id: "${p_id}", notification_type: "REVISION", declared_acm_sq_ft: 120, expected_project_version: "${p_v0}" }, as: ContractorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION, http 412 (expected ${p_v0} is one behind the current version)"
            - "no second notification persisted; N1 remains FILED"

      - name: revise_containment_stale_version_rejected
        claim_type: layer_optimistic_concurrency
        grounds:
          - "concurrency_rules[containment-revise-stale-containment]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC loser path on the second concurrency rule: a revise carrying an expected_containment_version one behind the current version fails with ERR_STALE_VERSION (412) and leaves machines_required untouched."
        test_recipe:
          setup: ["Project P ASSESSED; Containment C (FULL, 240000 cuft, machines_required 8) at version c_v0"]
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-L2", site_address: "40 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/workers", payload: { full_name: "Sup One", certification_level: "SUPERVISOR", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-01-01T00:00:00Z", respirator_fit_expires_at: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_sup: "$.data.id" } }
            - { call: "POST /abatement/containments", payload: { project_id: "${p_id}", work_area_volume_cuft: 240000, containment_class: "FULL" }, as: Supervisor, as_user_id: "${w_sup}", captures: { c_id: "$.data.id", c_v0: "$.data.version" } }
          trigger:
            - { call: "POST /abatement/containments/${c_id}/revise", payload: { work_area_volume_cuft: 120000, expected_containment_version: "${c_v0} - 1" }, as: Supervisor, as_user_id: "${w_sup}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION, http 412"
            - "Containment.${c_id}.machines_required remains 8 and version remains ${c_v0}"

      - name: layer_cascade_coverage_stub
        claim_type: layer_cascading_side_effects
        grounds:
          - "state_machines.Project.AWAITING_CLEARANCE_to_RECLEANING"
        excluded_because:
          difficulty_instance: "transitive_cascade / clearance_fail_transitive_reclean_extension_chain"
          rationale: "N-level cascade ordering verified end-to-end in the named §1.8 instance (and its sibling certificate_lapse chain)."

      - name: layer_dual_variant_coverage_stub
        claim_type: layer_dual_variant_calculation
        grounds:
          - "calculations.survey_acm_quantities"
          - "calculations.disposal_cost"
        excluded_because:
          difficulty_instance: "dual_variant_calc / survey_provisional_assumes_pending_vs_final_positive_only"
          rationale: "Both variants and their delta asserted in the two §1.8 dual-variant instances."

      - name: layer_derived_field_reconciliation_stub
        claim_type: layer_derived_field_reconciliation
        grounds:
          - "entities.Project.fields.manifested_weight_lbs"
          - "entities.Worker.fields.assigned_scheduled_hours"
        excluded_because:
          difficulty_instance: "compensating_invariant / assignment_create_cancel_conserves_scheduled_hours"
          rationale: "Derived-field recompute on create/cancel/void asserted in the two §1.9-bound invariant instances."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: worker_create_read_consistent
        claim_type: immediate_consistency
        grounds:
          - "entities.Worker"
        distinguishing_aspect: "Immediate consistency: the worker created by POST is fully readable (same field values, computed status ACTIVE, assigned_scheduled_hours 0, version 1) on the very next GET with no delay or reconciliation gap."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /abatement/workers", payload: { full_name: "Han Read", certification_level: "HANDLER", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-02-01T00:00:00Z", respirator_fit_expires_at: "2027-03-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_id: "$.data.id" } }
            - { call: "GET /abatement/workers/${w_id}", payload: {}, as: ContractorAdmin, captures: { w_name: "$.data.full_name", w_status: "$.data.status", w_hours: "$.data.assigned_scheduled_hours", w_ver: "$.data.version" } }
          assert:
            - "GET returns full_name == 'Han Read', certification_level == HANDLER, status == ACTIVE"
            - "assigned_scheduled_hours == 0; version == 1; created_at == 2026-08-01T00:00:00.000Z (logical clock default)"
