              as: EnrollmentSpecialist
              captures: { app1: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam2}", child_first_name: "Al", child_last_name: "A", child_dob: "2022-02-20" }
              as: EnrollmentSpecialist
              captures: { app2: "$.data.id" }
            - call: "POST /applications/${app1}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app1}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app1}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app2}/submit"
