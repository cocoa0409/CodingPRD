- section: consistency model
  instances:

  - name: variance_hold_and_its_suspense_are_visible_in_the_same_response
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model=immediate
    - calculations.royalty_check_reconciliation
    - calculations.division_order_net_revenue_invariant
    distinguishing_aspect: "Consistency is immediate, not eventual: the POST that reports a mismatched check returns check_status VARIANCE_HELD in its own body, and reads issued straight afterwards - with no intervening write and no delay - already show the DivisionOrder SUSPENDED, the SuspenseAccount ACCRUING at 106.47 and the owner's suspense_total at 106.47."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
