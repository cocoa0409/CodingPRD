          - calculations.custody_ledger_counters
          - entities.Vendor.fields.outstanding_sample_count
        distinguishing_aspect: "Vendor NRTH holds three samples - one EXPECTED, one RECEIVED, one RETURNED - and only the RECEIVED one is outstanding, so the incremental counter must read 1 while a naive count of all three would read 3."
        test_recipe:
          setup:
            - "Three samples for vendor NRTH: SMP-A never received, SMP-B received, SMP-C received then moved to RETURN_PENDING and returned on time."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-A", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smpA_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-B", vendor_id: "${v_id}", declared_style_number: "TOP1002" }
              as: SampleCoordinator
              captures: { smpB_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-C", vendor_id: "${v_id}", declared_style_number: "TOP1003" }
              as: SampleCoordinator
              captures: { smpC_id: $.data.id }
            - call: "POST /studio/samples/${smpB_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smpC_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smpC_id}/custody-move"
              payload: { to_state: "RETURN_PENDING" }
              as: SampleCoordinator
          trigger:
            - call: "POST /studio/samples/${smpC_id}/return"
              payload: {}
              as: SampleCoordinator
            - call: "GET /studio/vendors/${v_id}"
              as: StudioAdmin
              captures: { outstanding: $.data.outstanding_sample_count }
          assert:
            - "response status == 200"
            - "${outstanding} == 1"
            - "Sample.${smpA_id}.custody_state == \"EXPECTED\""
            - "Sample.${smpB_id}.custody_state == \"RECEIVED\""
            - "Sample.${smpC_id}.custody_state == \"RETURNED\""
            - "Sample.${smpC_id}.return_days_late == 0"
            - "Vendor.${v_id}.late_return_count == 0"

      - name: color_composite_weighting_depends_on_the_station_type
        claim_type: weighted_scoring
        grounds:
          - calculations.color_composite_delta_e
          - entities.Station.fields.station_type
        excluded_because:
          difficulty_instance: combinatorial_formula / color_composite_weighting_branches_on_station_type
          rationale: "The same patch array is measured on a MODEL and a STILL_LIFE station there, with both composite literals and both PASS/FAIL verdicts asserted."

      - name: session_total_is_shared_out_per_item_before_it_reaches_the_style
        claim_type: waterfall_allocation
        grounds:
          - calculations.session_cost_allocation
          - entities.ShotListItem.fields.allocated_cost_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / session_cost_allocation_rounds_per_item_before_folding_into_styles
          rationale: "Floor share, one-cent remainder distribution by created_at ASC, and the per-item-then-per-style folding order are all asserted with literal cents there."

      - name: capacity_threshold_is_tested_on_both_sides_of_the_exact_total
        claim_type: threshold
        grounds:
          - validations[priority=53].ERR_STATION_CAPACITY_EXCEEDED
          - calculations.capacity_ledger_counters
        excluded_because:
          difficulty_instance: boundary_precision_check / station_day_capacity_accepts_the_exact_total_and_rejects_it_by_one_minute
          rationale: "The exact-total acceptance and the one-minute rejection are both driven there against a 480-minute day."

      - name: provisional_projection_includes_planned_and_held_commitments
        claim_type: forward_looking
        grounds:
          - calculations.cost_per_style.variants.provisional
          - endpoints[GET /studio/styles/{style_id}/cost-summary]
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_per_style_provisional_vs_final_diverge_on_one_snapshot
          rationale: "The projection is read at a snapshot where a HELD booking and an uncaptured item still count, which is the forward-looking claim."

      - name: cost_per_style_variants_disagree_on_one_snapshot
        claim_type: variant_divergence
        grounds:
          - calculations.cost_per_style.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_per_style_provisional_vs_final_diverge_on_one_snapshot
          rationale: "Both variants are read from the same database snapshot with distinct literal cents, and the delta is asserted."

      - name: turnaround_variant_choice_drives_the_sla_verdict
        claim_type: variant_selection
        grounds:
          - calculations.retouch_turnaround_hours.variants
          - entities.RetouchTask.fields.sla_state
        excluded_because:
          difficulty_instance: dual_variant_calc / retouch_turnaround_gross_breaches_while_net_sits_on_the_sla
          rationale: "That instance pins sla_state to the GROSS variant while the NET figure sits inside the service level, which is the selection claim."

      - name: wrap_reconciles_the_projection_into_the_persisted_ledger
        claim_type: reconciliation
        grounds:
          - calculations.session_cost_allocation
          - entities.Style.fields.allocated_cost_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_per_style_provisional_vs_final_diverge_on_one_snapshot
          rationale: "The FINAL figure read there is exactly the ledger the wrap posted, so the provisional-to-final handover is already asserted with literal cents."

  # ===================================================== Table 4: validations
  - section: validations
    instances:
      - name: style_category_that_disagrees_with_its_profile_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=37].ERR_CATEGORY_PROFILE_MISMATCH
          - entities.Style.fields.category
        distinguishing_aspect: "The only AssetProfile on file is APPAREL_TOP, so a FOOTWEAR style pointing at it fails priority 37 with 422 ERR_CATEGORY_PROFILE_MISMATCH even though every FK resolves."
        test_recipe:
          setup:
            - "Vendor NRTH and one AssetProfile whose category is APPAREL_TOP."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /studio/styles"
              payload: { style_number: "SHOE9001", category: "FOOTWEAR", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
          assert:
            - "response status == 422"
            - "response error_id == \"ERR_CATEGORY_PROFILE_MISMATCH\""

      - name: style_whose_category_matches_its_profile_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=37].ERR_CATEGORY_PROFILE_MISMATCH
          - endpoints[POST /studio/styles]
        distinguishing_aspect: "The same request with category APPAREL_TOP satisfies priority 37 and returns 201 with content_state NOT_STARTED and both computed counters at zero - the rule must not fire on the compliant pairing."
        test_recipe:
          setup:
            - "Vendor NRTH and one AssetProfile whose category is APPAREL_TOP."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
          assert:
            - "response status == 201"
            - "Style.${sty_id}.content_state == \"NOT_STARTED\""
            - "Style.${sty_id}.priority_tier == \"C\""
            - "Style.${sty_id}.required_item_count == 0"
            - "Style.${sty_id}.allocated_cost_cents == 0"
            - "Style.${sty_id}.base_style_id == null"

      - name: colorway_code_is_required_exactly_when_a_base_style_is_named
        claim_type: conditional_validation
        grounds:
          - validations[priority=38].ERR_INVALID_BASE_STYLE
          - entities.Style.fields.base_style_id
          - entities.Style.fields.colorway_code
        distinguishing_aspect: "Priority 38 is a conditional pair rule: base_style_id without colorway_code is 422 ERR_INVALID_BASE_STYLE, and colorway_code without base_style_id is the same error - while supplying both together succeeds."
        test_recipe:
          setup:
            - "Base style TOP1001 exists with base_style_id null."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001BLK", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", base_style_id: "${base_id}" }
              as: StudioAdmin
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001NVY", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", colorway_code: "NVY" }
              as: StudioAdmin
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001RED", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", base_style_id: "${base_id}", colorway_code: "RED" }
              as: StudioAdmin
              captures: { cw_id: $.data.id }
          assert:
            - "first call: status == 422 and error_id == \"ERR_INVALID_BASE_STYLE\""
            - "second call: status == 422 and error_id == \"ERR_INVALID_BASE_STYLE\""
            - "third call: status == 201"
            - "Style.${cw_id}.base_style_id == ${base_id}"
            - "Style.${cw_id}.colorway_code == \"RED\""

      - name: release_window_that_ends_before_it_starts_is_an_invalid_time_window
        claim_type: temporal_validation
        grounds:
          - validations[priority=39].ERR_INVALID_TIME_WINDOW
          - entities.ReleaseDocument.fields.valid_from
        distinguishing_aspect: "Priority 39 covers three interval shapes; here the release's valid_until equals its valid_from, and because the rule demands valid_until > valid_from (strict) the equal-instant window is 422 ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup:
            - "Model Ada Vell exists with no release on file."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Ada Vell", talent_type: "MODEL", hourly_rate_cents: 25000, day_rate_cents: 150000, minimum_call_hours: 0, max_daily_minutes: 600 }
              as: StudioAdmin
              captures: { md_id: $.data.id }
          trigger:
            - call: "POST /studio/release-documents"
              payload: { talent_id: "${md_id}", scope: "ECOM_ONLY", territory: "GLOBAL", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-08-01T00:00:00Z" }
              as: StudioAdmin
          assert:
            - "response status == 422"
            - "response error_id == \"ERR_INVALID_TIME_WINDOW\""

      - name: custody_advance_waits_for_the_match_axis_after_the_edge_is_admitted
        claim_type: cascading_validation
        grounds:
          - validations[priority=12].ERR_SAMPLE_INVALID_CUSTODY
          - validations[priority=45].ERR_SAMPLE_NOT_MATCHED
        distinguishing_aspect: "RECEIVED -> IN_STUDIO is a declared edge, so priority 12 passes and the request falls through to priority 45, which rejects it with 409 ERR_SAMPLE_NOT_MATCHED because the box is still UNMATCHED - the two checks must run in that order, not the reverse."
        test_recipe:
          setup:
            - "Sample SMP-1001 is RECEIVED and still UNMATCHED (no style has been reconciled to it)."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smp_id: $.data.id }
            - call: "POST /studio/samples/${smp_id}/receive"
              payload: {}
              as: SampleCoordinator
          trigger:
            - call: "POST /studio/samples/${smp_id}/custody-move"
              payload: { to_state: "IN_STUDIO" }
              as: SampleCoordinator
          assert:
            - "response status == 409"
            - "response error_id == \"ERR_SAMPLE_NOT_MATCHED\""
            - "Sample.${smp_id}.custody_state == \"RECEIVED\""
            - "Sample.${smp_id}.match_state == \"UNMATCHED\""

      - name: two_simultaneous_violations_return_the_lower_priority_number
        claim_type: priority_ordering
        grounds:
          - validations[priority=13].ERR_SESSION_NOT_BOOKED
          - validations[priority=41].ERR_TALENT_OVERLAP
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cancelled_session_state_gate_outranks_talent_double_booking
          rationale: "Both rules are violated by one request there and the priority-13 error is asserted, plus the control run that isolates the priority-41 error."

      - name: individually_legal_sessions_collectively_exceed_the_station_day
        claim_type: aggregate_validation
        grounds:
          - validations[priority=53].ERR_STATION_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: boundary_precision_check / station_day_capacity_accepts_the_exact_total_and_rejects_it_by_one_minute
          rationale: "Two accepted sessions are summed against the station's daily capacity there before the third is refused on the aggregate."

      - name: locking_depends_on_the_state_of_a_sample_not_of_the_session
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=46].ERR_SAMPLE_NOT_IN_STUDIO
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / session_lock_blocked_by_sample_custody_then_admitted_after_the_box_hits_the_rack
          rationale: "Both the invalid and the valid cross-entity state are exercised there against an otherwise unchanged session."

  # ======================================================= Table 5: endpoints
  - section: endpoints
    instances:
      - name: sample_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /studio/samples]
          - endpoints[GET /studio/samples/{sample_id}]
          - endpoints[GET /studio/samples]
        distinguishing_aspect: "The sample surface is create + read + filtered list only (no update, no delete): the created row reads back identically, and the list filtered by vendor and custody_state returns exactly the one EXPECTED box with total_count 1 and has_more false."
        test_recipe:
          setup:
            - "Vendor NRTH holds two samples; SMP-A is left EXPECTED and SMP-B is received."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-B", vendor_id: "${v_id}", declared_style_number: "TOP1002" }
              as: SampleCoordinator
              captures: { smpB_id: $.data.id }
            - call: "POST /studio/samples/${smpB_id}/receive"
              payload: {}
              as: SampleCoordinator
          trigger:
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-A", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smpA_id: $.data.id }
            - call: "GET /studio/samples/${smpA_id}"
              as: Producer
              captures: { read_barcode: $.data.barcode }
            - call: "GET /studio/samples?vendor_id=${v_id}&custody_state=EXPECTED&limit=10&offset=0"
              as: SampleCoordinator
          assert:
            - "first call: status == 201"
            - "${read_barcode} == \"SMP-A\""
            - "filtered list: total_count == 1 and has_more == false and limit == 10 and offset == 0"
            - "the list contains ${smpA_id} and does not contain ${smpB_id}"
            - "Sample.${smpA_id}.custody_state == \"EXPECTED\""
            - "Sample.${smpA_id}.match_state == \"UNMATCHED\""

      - name: lock_action_fires_once_every_precondition_is_satisfied
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /studio/shoot-sessions/{session_id}/lock]
          - state_machines.ShootSession.BOOKED_to_LOCKED
        distinguishing_aspect: "With a required ASSIGNED item and its sample IN_STUDIO, the lock action moves BOOKED -> LOCKED and bumps the session version, leaving the item ASSIGNED and the committed station minutes at 240."
        test_recipe:
          setup:
            - "Style TOP1001 has one required ON_MODEL item assigned to a 09:00-13:00 MODEL session, and its sample is MATCHED and IN_STUDIO."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smp_id: $.data.id }
            - call: "POST /studio/samples/${smp_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smp_id}/match"
              payload: { style_id: "${sty_id}" }
              as: SampleCoordinator
            - call: "POST /studio/samples/${smp_id}/custody-move"
              payload: { to_state: "IN_STUDIO" }
              as: SampleCoordinator
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { sty_v: $.data.version }
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "ON_MODEL", angle_code: "FRONT", estimated_minutes: 60, expected_style_version: "${sty_v}", required: true }
              as: Producer
              captures: { it_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses_id: $.data.id, ses_v1: $.data.version }
            - call: "POST /studio/shot-list-items/${it_id}/assign"
              payload: { session_id: "${ses_id}" }
              as: Producer
          trigger:
            - call: "POST /studio/shoot-sessions/${ses_id}/lock"
              payload: {}
              as: Producer
              captures: { ses_v2: $.data.version }
          assert:
            - "response status == 200"
            - "ShootSession.${ses_id}.session_state == \"LOCKED\""
            - "${ses_v2} > ${ses_v1}"
            - "ShotListItem.${it_id}.item_state == \"ASSIGNED\""
            - "Station.${st_id}.committed_minutes_today == 240"

      - name: cost_summary_of_an_unshot_style_reports_zeros_and_recommends_in_house
        claim_type: computed_read
        grounds:
          - endpoints[GET /studio/styles/{style_id}/cost-summary]
          - calculations.cost_per_style
        distinguishing_aspect: "With no session touching the style and no OUTSOURCED provider on file, the computed read must return both cost figures at 0, a null quote, a null variance and recommended_source IN_HOUSE rather than erroring or omitting the fields."
        test_recipe:
          setup:
            - "Style TOP1001 owns one PLANNED required item; the only provider on file is IN_HOUSE."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
