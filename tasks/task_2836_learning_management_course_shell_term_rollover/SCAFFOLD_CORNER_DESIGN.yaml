              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${tgt_b}", item_type: "PAGE", title: "leftover draft", storage_mb: 1.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { tgt_b_item: $.data.id }
          trigger:
            - call: "POST /rollover-jobs"
              payload: { source_shell_id: "${src}", target_shell_id: "${tgt_a}", target_term_id: "${t2}", expected_target_shell_version: "${tgt_a_v}" }
              as: LmsAdmin
              captures: { err_source: $.data.error_id }
            - call: "POST /course-shells/${src}/lifecycle-transitions"
              payload: { target_state: "CONCLUDED" }
              as: Registrar
              captures: { src_concluded: $.data.provisioning_state }
            - call: "GET /course-shells/${tgt_b}"
              payload: {}
              as: LmsAdmin
              captures: { tgt_b_v: $.data.version, tgt_b_items: $.data.content_item_count }
            - call: "POST /rollover-jobs"
              payload: { source_shell_id: "${src}", target_shell_id: "${tgt_b}", target_term_id: "${t2}", expected_target_shell_version: "${tgt_b_v}" }
              as: LmsAdmin
              captures: { err_target: $.data.error_id }
            - call: "GET /course-shells/${tgt_a}"
              payload: {}
              as: LmsAdmin
              captures: { tgt_a_v2: $.data.version, tgt_a_items: $.data.content_item_count }
            - call: "POST /rollover-jobs"
              payload: { source_shell_id: "${src}", target_shell_id: "${tgt_a}", target_term_id: "${t2}", expected_target_shell_version: "${tgt_a_v2}" }
              as: LmsAdmin
              captures: { job_id: $.data.id, job_state: $.data.job_state, strip_dates: $.data.strip_dates, shift_mode: $.data.date_shift_mode }
            - call: "POST /rollover-jobs/${job_id}/transitions"
              payload: { action: "VALIDATE" }
              as: LmsAdmin
              captures: { job_state2: $.data.job_state, eligible: $.data.eligible_item_count }
          assert:
            - "${src_state} == PROVISIONED and ${err_source} == ERR_ROLLOVER_SOURCE_INELIGIBLE at HTTP 422 — a live shell is not a rollover source, and the rule is enforced by POST /rollover-jobs itself, not deferred to VALIDATE"
            - "${src_concluded} == CONCLUDED"
            - "${tgt_b_items} == 1 and ${err_target} == ERR_ROLLOVER_TARGET_NOT_EMPTY at HTTP 422 — one leftover item is enough"
            - "${tgt_a_items} == 0 and ${job_id} is created at HTTP 201 with ${job_state} == DRAFT, ${strip_dates} == true and ${shift_mode} == ANCHOR_PROPORTIONAL (the declared defaults)"
            - "${job_state2} == VALIDATED with ${eligible} == 2 — both source items count, since neither is SKIPPED"
            - "GET /rollover-jobs filtered to target_shell_id ${tgt_a} reports total_count 1 — the two refusals created no RolloverJob row"

      - name: an_open_dispute_blocks_the_term_from_closing_until_it_is_resolved
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_DISPUTES_BLOCK_CLOSE]
          - validations[38]
          - state_machines.AcademicTerm.lifecycle_state.GRADING_to_CLOSED
          - state_machines.GradePassback.passback_state.ACCEPTED_to_DISPUTED
        distinguishing_aspect: "AcademicTerm.open_amendment_count is written by a grandchild entity (a GradeDispute two hops away), and the term close gate reads it: with one OPEN dispute the close is 422 ERR_OPEN_DISPUTES_BLOCK_CLOSE, and only after the dispute resolves UPHELD — which must decrement the counter back to 0 — does the identical close call succeed and cascade the shell to CONCLUDED."
        test_recipe:
          setup:
            - "Term 2026FA is walked to FINALS with PUBLISHED shell BI205-01 (owner prof) and one ACTIVE STUDENT row for S1 carrying 75.00 of 100.00 points."
            - "The passback is submitted by prof and accepted by registrar reg-1 (segregation of duties), then S1 files one dispute."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /people"
              payload: { sis_person_id: "F-6240", full_name: "Rita Levi-Montalcini", primary_affiliation: "FACULTY" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { prof_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6241", full_name: "Learner H", primary_affiliation: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { s1: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "BI205-01", shell_type: "OFFICIAL", base_seat_cap: 15 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_id}/publish"
              payload: {}
              as: LmsAdmin
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1}", role: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { enr_id: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Final exam", points_possible: 100.00, storage_mb: 2.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_id: $.data.id }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${enr_id}", content_item_id: "${item_id}", earned_points: 75.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { earned: $.data.earned_points_total }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /grade-passbacks"
              payload: { shell_id: "${shell_id}" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb: $.data.id }
            - call: "POST /grade-passbacks/${pb}/transitions"
              payload: { action: "SUBMIT" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { submitted: $.data.submitted_points_total }
            - call: "POST /grade-passbacks/${pb}/registrar-decisions"
              payload: { decision: "ACCEPT", note: "roster verified" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { pb_accepted: $.data.passback_state, accepted_pts: $.data.accepted_points_total }
            - call: "POST /grade-disputes"
              payload: { passback_id: "${pb}", enrollment_id: "${enr_id}", content_item_id: "${item_id}", claimed_earned_points: 95.00 }
              as: Student
              as_user_id: "${s1}"
              captures: { disp: $.data.id, disp_state: $.data.dispute_state, held: $.data.held_points }
          trigger:
            - call: "GET /grade-passbacks/${pb}"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { pb_disputed: $.data.passback_state, open_disputes: $.data.open_dispute_count, accepted_now: $.data.accepted_points_total, disputed_now: $.data.disputed_points_held }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_grading: $.data.lifecycle_state, amendments: $.data.open_amendment_count }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "CLOSED" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { err_close: $.data.error_id }
            - call: "POST /grade-disputes/${disp}/resolve"
              payload: { outcome: "UPHELD", note: "rubric re-checked, grade stands" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { disp_state2: $.data.dispute_state, resolved_at: $.data.resolved_at }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { amendments_after: $.data.open_amendment_count, term_state_after: $.data.lifecycle_state }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "CLOSED" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_closed: $.data.lifecycle_state, published_after: $.data.published_shell_count }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { shell_after: $.data.provisioning_state, active_after: $.data.active_enrollment_count }
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { enr_after: $.data.enrollment_state }
          assert:
            - "${earned} == 75.00, ${submitted} == 75.00, ${pb_accepted} == ACCEPTED and ${accepted_pts} == 75.00"
            - "${disp_state} == OPEN with ${held} == 75.00 — the escrow is the enrollment's earned points, not the claimed 95.00"
            - "${pb_disputed} == DISPUTED, ${open_disputes} == 1, ${accepted_now} == 0.00 and ${disputed_now} == 75.00"
            - "${term_grading} == GRADING with ${amendments} == 1 — the grandchild's filing is visible on the term"
            - "${err_close} == ERR_OPEN_DISPUTES_BLOCK_CLOSE at HTTP 422 and the term stays in GRADING"
            - "${disp_state2} == RESOLVED_UPHELD with ${resolved_at} == \"2026-08-01T00:00:00Z\" (the untouched logical clock)"
            - "${amendments_after} == 0 and ${term_state_after} == GRADING — the counter came back down without the term moving"
            - "${term_closed} == CLOSED with ${published_after} == 0, ${shell_after} == CONCLUDED, ${active_after} == 0 and ${enr_after} == COMPLETED — the identical close call now runs its full cascade"

  - section: rbac
