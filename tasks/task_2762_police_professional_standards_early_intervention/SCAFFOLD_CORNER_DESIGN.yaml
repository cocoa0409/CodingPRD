          Holding the Investigator role is not the same as being this investigation's investigator.
          The identity rule sits at priority 6 and covers exactly three endpoints - scheduling,
          holding and findings - so a second certified investigator is refused on all three yet is
          still allowed to toll the statutory clock, which is a shared operation with no identity
          binding. Two of the refusals also prove ordering: findings by the wrong investigator is an
          identity error even though the investigation is in the wrong state for findings, and a
          hold by the wrong investigator is an identity error even though the interview has not
          started.
