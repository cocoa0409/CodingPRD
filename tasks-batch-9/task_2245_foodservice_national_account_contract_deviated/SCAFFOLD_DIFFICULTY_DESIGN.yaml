              as: RebateAccountant
              captures: { rate_below: $.data.rebate_rate_pct }
          assert:
            - "OrderLine.${ln95_c}.list_unit_price_cents == 5000 and OrderLine.${ln95_c}.extended_price_cents == 475000"
            - "OrderLine.${ln95_n}.extended_price_cents == 25000 and OrderLine.${ln95_n}.is_contracted_item == false"
            - "OrderLine.${ln95_c}.service_fee_cents == 0"
            - "RebatePeriod.${rp95_id}.gross_purchases_cents == 500000"
            - "RebatePeriod.${rp95_id}.contracted_purchases_cents == 475000"
            - "RebatePeriod.${rp95_id}.compliance_pct == 95.00"
