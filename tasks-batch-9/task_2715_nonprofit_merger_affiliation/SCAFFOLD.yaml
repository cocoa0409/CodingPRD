# =============================================================================
# SCAFFOLD — Nonprofit Merger & Affiliation (nonprofit strategic restructuring)
# Sections §1.0 - §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# and corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2715. Nonprofit Merger & Affiliation (nonprofit strategic restructuring): strategic rationale development with mission alignment, program overlap and financial sustainability analysis, partner identification, confidential exploratory conversations and letter of intent, due diligence across finances, contracts, restricted funds, litigation and workforce obligations, structure selection among merger, asset acquisition, parent-subsidiary and management services agreement, board approval processes at each organization with fiduciary duty documentation, state attorney general notice and approval where required for charitable asset transfers, restricted gift and endowment transfer with donor consent or judicial modification where restrictions conflict, integration planning across staffing, systems, branding and program continuity

domain_name: nonprofit-merger-affiliation
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection; parents are
  # referenced by FK fields in request bodies, never by URL nesting for writes.

  state_machine_shape: cyclic
  # Restructuring cycles DILIGENCE_CLOSED -> DILIGENCE and {DILIGENCE, DILIGENCE_CLOSED,
  # STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW} -> LOI_NEGOTIATION.
  # LetterOfIntent cycles ISSUED -> COUNTERED -> ISSUED and carries a second
  # independent state dimension (exclusivity_status). RestrictedFund is a
  # branching fork-join with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Restructuring -> LetterOfIntent / DiligenceRequest / BoardApproval / AGFiling / IntegrationTask
    - self_referential     # Organization.parent_org_id, IntegrationTask.depends_on_task_id
    - cross_aggregate      # RestrictedFund (owned by Organization) mutated inside a Restructuring workflow
    - polymorphic_party    # BoardApproval.approving_party / LetterOfIntent.countered_by_party resolve to one of two Organization FKs on Restructuring

  role_model: segregation_of_duties
  # The DiligenceLead who raised a finding may not clear it; the StrategyOfficer
  # who negotiates may not record a board vote; the CharitableTrustCounsel who
  # files with the attorney general may not enter the regulator's decision.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 10 entities / 52 endpoints / 52 error codes / 9 calculations / 8 state machines.
  # Density target: every calculation reads at least two entities, and every
  # cascade crosses at least three.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered charitable name of the nonprofit"
        constraints: "1-160 chars, non-blank"
      - name: ein
        type: string
        source: input
        description: "Federal employer identification number, unique across all Organizations"
        constraints: "matches ^[0-9]{2}-[0-9]{7}$; unique"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of incorporation; drives attorney-general jurisdiction"
        constraints: "matches ^[A-Z]{2}$"
      - name: mission_code
        type: string
        source: input
        description: "Mission taxonomy code; the two characters before the hyphen are the mission family"
        constraints: "matches ^[A-Z]{2}-[A-Z_]+$"
      - name: annual_expense_cents
        type: integer
        source: input
        description: "Total annual operating expense in integer cents"
        constraints: ">= 0"
      - name: unrestricted_net_assets_cents
        type: integer
        source: input
        description: "Unrestricted net assets in integer cents"
        constraints: ">= 0"
      - name: monthly_expense_cents
        type: integer
        source: computed
        description: "round_half_up(annual_expense_cents / 12); recomputed on every financial restatement. Pinned per-organization rounding step of calculations.combined_operating_reserve_months"
      - name: restricted_corpus_cents
        type: integer
        source: computed
        description: "Restricted corpus attributed to this organization; recomputed on every RestrictedFund mutation per calculations.organization_restricted_corpus"
        default: 0
      - name: governance_seats
        type: integer
        source: computed
        description: "Seats on the combined post-transaction board currently allocated to this organization by a CERTIFIED BoardApproval; 0 before any certification and after rescission or supersession"
        default: 0
      - name: affiliation_role
        type: enum
        source: system
        description: "Structural role this organization holds after consummation"
        default: INDEPENDENT
        constraints: "one of INDEPENDENT, SURVIVOR, DISSOLVED, DIVESTED, PARENT, SUBSIDIARY, MSA_PROVIDER, MSA_CLIENT"
      - name: parent_org_id
        type: string
        source: computed
        description: "FK -> Organization.id; set to the PARENT organization when a PARENT_SUBSIDIARY restructuring is consummated; null otherwise"
        default: null

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: org_id
        type: string
        source: input
        description: "FK -> Organization.id; the nonprofit that operates this program"
      - name: name
        type: string
        source: input
        description: "Program name"
        constraints: "1-160 chars, non-blank"
      - name: service_category
        type: enum
        source: input
        description: "Service line used for program-overlap pairing"
        constraints: "one of YOUTH_MENTORING, FOOD_SECURITY, HOUSING, WORKFORCE_TRAINING, BEHAVIORAL_HEALTH, ARTS_EDUCATION"
      - name: county_code
        type: string
        source: input
        description: "Service geography used for program-overlap pairing"
        constraints: "matches ^[A-Z]{2}-[A-Z_]+$"
      - name: annual_expense_cents
        type: integer
        source: input
        description: "Annual program expense in integer cents"
        constraints: ">= 0"
      - name: clients_served
        type: integer
        source: input
        description: "Annual unduplicated client count"
        constraints: ">= 0"
      - name: continuity_status
        type: enum
        source: system
        description: "Program continuity disposition through the restructuring"
        default: ACTIVE
        constraints: "one of ACTIVE, PLANNED_TRANSFER, PLANNED_SUNSET, TRANSFERRED, SUNSET"
      - name: transferred_to_org_id
        type: string
        source: computed
        description: "FK -> Organization.id; recipient organization once continuity_status becomes TRANSFERRED at consummation"
        default: null

  - name: Restructuring
    parent: null
    common_fields: true
    fields:
      - name: initiator_org_id
        type: string
        source: input
        description: "FK -> Organization.id; the organization that opened the confidential exploratory conversation"
      - name: target_org_id
        type: string
        source: input
        description: "FK -> Organization.id; the prospective partner organization"
      - name: confidentiality_tier
        type: enum
        source: input
        description: "Disclosure tier for the exploratory phase; optional on create and defaults to STANDARD"
        default: STANDARD
        constraints: "one of STANDARD, RESTRICTED, BOARD_ONLY"
      - name: status
        type: enum
        source: system
        description: "Deal lifecycle state"
        default: EXPLORATORY
        constraints: "one of EXPLORATORY, RATIONALE_BUILT, LOI_NEGOTIATION, DILIGENCE, DILIGENCE_CLOSED, STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW, INTEGRATION, CONSUMMATED, ABANDONED"
      - name: structure_type
        type: enum
        source: computed
        description: "Selected legal structure; null until POST /restructurings/{id}/select-structure succeeds, and retained across a negotiation-round revert"
        default: null
        constraints: "one of MERGER, ASSET_ACQUISITION, PARENT_SUBSIDIARY, MANAGEMENT_SERVICES_AGREEMENT"
      - name: round_no
        type: integer
        source: system
        description: "Negotiation round counter; incremented by one on every revert to LOI_NEGOTIATION"
        default: 1
      - name: combined_board_seats
        type: integer
        source: computed
        description: "Total seats on the post-transaction combined board, copied from the LetterOfIntent at execution"
        default: 0
      - name: reserved_seat_pool
        type: integer
        source: computed
        description: "Seats not yet allocated to either party; set to combined_board_seats at LetterOfIntent execution, drawn down at BoardApproval certification, restored on rescission or supersession"
        default: 0
      - name: unrestricted_transfer_value_cents
        type: integer
        source: computed
        description: "Unrestricted charitable assets to be transferred, supplied at structure selection"
        default: 0
      - name: unresolved_restricted_fund_count
        type: integer
        source: computed
        description: "Count of party RestrictedFunds whose transfer_status is not TRANSFERRED and not RETAINED; recomputed on every RestrictedFund mutation"
        default: 0
      - name: restricted_asset_posture
        type: enum
        source: computed
        description: "Derived gate over party restricted funds; recomputed on every RestrictedFund mutation per calculations.restricted_asset_posture"
        default: NOT_ASSESSED
        constraints: "one of NOT_ASSESSED, RESTRICTED_PENDING, BLOCKED, CLEARED"
      - name: ag_review_required
        type: boolean
        source: computed
        description: "True when either party state_code is in AG_REVIEW_STATES; fixed at creation"
      - name: abandonment_reason
        type: string
        source: computed
        description: "Reason recorded when status becomes ABANDONED"
        default: null

  - name: AlignmentAssessment
    parent: null
    common_fields: false
    fields:
      - name: restructuring_id
        type: string
        source: input
        description: "FK -> Restructuring.id; the deal this immutable snapshot scores"
      - name: variant
        type: enum
        source: input
        description: "Which inclusion rule set produced this snapshot"
        constraints: "one of SCREENING, DILIGENCE_ADJUSTED"
      - name: sequence_no
        type: integer
        source: computed
        description: "1 + count of prior AlignmentAssessments with the same restructuring_id and variant; the selector key for latest-of-variant lookups"
      - name: included_program_count
        type: integer
        source: computed
        description: "Number of Programs of both parties admitted by this variant inclusion filter"
      - name: overlap_pair_count
        type: integer
        source: computed
        description: "Number of ordered (initiator program, target program) pairs sharing service_category and county_code within the admitted set"
      - name: program_overlap_index
        type: number
        source: computed
        description: "overlap_pair_count divided by the smaller admitted party program count, clamped to 1.0000"
        constraints: "4 decimal places, round_half_up"
      - name: mission_alignment_points
        type: number
        source: computed
        description: "Mission-code component of the composite, after any escalated-restricted-funds deduction"
        constraints: "2 decimal places"
      - name: program_overlap_points
        type: number
        source: computed
        description: "Non-linear overlap component peaking at program_overlap_index 0.5"
        constraints: "2 decimal places"
      - name: combined_monthly_expense_cents
        type: integer
        source: computed
        description: "initiator.monthly_expense_cents + target.monthly_expense_cents; per-organization rounding happens BEFORE the sum"
      - name: open_diligence_exposure_cents
        type: integer
        source: computed
        description: "Sum of DiligenceRequest.exposure_cents for this deal with status in OPEN, RESPONDED, ESCALATED; always 0 for the SCREENING variant"
      - name: available_unrestricted_cents
        type: integer
        source: computed
        description: "Combined party unrestricted_net_assets_cents minus open_diligence_exposure_cents, floored at 0"
      - name: reserve_months
        type: number
        source: computed
        description: "available_unrestricted_cents divided by combined_monthly_expense_cents"
        constraints: "2 decimal places, round_half_up; 0.00 when combined_monthly_expense_cents is 0"
      - name: sustainability_points
        type: number
        source: computed
        description: "Tiered financial-sustainability component keyed on reserve_months"
        constraints: "2 decimal places"
      - name: composite_score
        type: number
        source: computed
        description: "mission_alignment_points + program_overlap_points + sustainability_points"
        constraints: "2 decimal places, range 0.00-100.00"
      - name: composite_rating
        type: enum
        source: computed
        description: "Banded label for composite_score"
        constraints: "one of STRONG, MODERATE, WEAK, NOT_VIABLE"

  - name: LetterOfIntent
    parent: null
    common_fields: true
    fields:
      - name: restructuring_id
        type: string
        source: input
        description: "FK -> Restructuring.id; the deal being negotiated"
      - name: round_no
        type: integer
        source: computed
        description: "Copied from Restructuring.round_no at creation"
      - name: proposed_structure_type
        type: enum
        source: input
        description: "Structure the letter proposes"
        constraints: "one of MERGER, ASSET_ACQUISITION, PARENT_SUBSIDIARY, MANAGEMENT_SERVICES_AGREEMENT"
      - name: combined_board_seats
        type: integer
        source: input
        description: "Total seats on the proposed post-transaction combined board"
        constraints: "integer, 3-51"
      - name: board_seat_split_initiator
        type: integer
        source: input
        description: "Seats of combined_board_seats reserved for the initiator organization"
        constraints: "integer >= 0; must be <= combined_board_seats"
      - name: exclusivity_days
        type: integer
        source: input
        description: "Length in days of the confidential exclusivity window opened by this letter"
        constraints: "integer, 1-365"
      - name: exclusivity_start_date
        type: string
        source: input
        description: "Inclusive first day of the confidential exclusivity window, YYYY-MM-DD; supplied by the issuing party and may be later than the calendar date of the logical clock"
        constraints: "matches ^[0-9]{4}-[0-9]{2}-[0-9]{2}$; must not be earlier than the calendar date of current_utc"
      - name: exclusivity_end_date
        type: string
        source: computed
        description: "exclusivity_start_date plus (exclusivity_days - 1) days, YYYY-MM-DD; the window is CLOSED on both ends"
      - name: exclusivity_status
        type: enum
        source: system
        description: "Second, independent state dimension of this entity; evolves without regard to status"
        default: ACTIVE
        constraints: "one of ACTIVE, RELEASED, EXPIRED"
      - name: expires_at
        type: datetime
        source: computed
        description: "exclusivity_end_date rendered at 00:00:00.000Z; a regulatory sweep lapses the letter at or after this instant"
      - name: status
        type: enum
        source: system
        description: "Negotiation state dimension"
        default: ISSUED
        constraints: "one of ISSUED, COUNTERED, EXECUTED, WITHDRAWN, LAPSED, SUPERSEDED"
      - name: countered_by_party
        type: enum
        source: computed
        description: "Which party lodged the most recent counter"
        default: null
        constraints: "one of INITIATOR, TARGET"
      - name: counter_round_count
        type: integer
        source: computed
        description: "Number of counters lodged against this letter"
        default: 0
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical clock at execution"
        default: null
      - name: withdrawal_reason
        type: string
        source: computed
        description: "Reason recorded on withdrawal"
        default: null

  - name: DiligenceRequest
    parent: null
    common_fields: true
    fields:
      - name: restructuring_id
        type: string
        source: input
        description: "FK -> Restructuring.id; the deal under diligence"
      - name: workstream
        type: enum
        source: input
        description: "Diligence workstream"
        constraints: "one of FINANCE, CONTRACTS, RESTRICTED_FUNDS, LITIGATION, WORKFORCE"
      - name: severity
        type: enum
        source: input
        description: "Assessed severity of the finding"
        constraints: "one of LOW, MEDIUM, HIGH, CRITICAL"
      - name: summary
        type: string
        source: input
        description: "One-line description of the finding"
        constraints: "1-400 chars, non-blank"
      - name: exposure_cents
        type: integer
        source: input
        description: "Quantified financial exposure of the finding in integer cents"
        default: 0
        constraints: ">= 0"
      - name: raised_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DiligenceLead that created the request; the segregation-of-duties comparand"
      - name: cleared_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the DiligenceLead that cleared the request"
        default: null
      - name: status
        type: enum
        source: system
        description: "Finding lifecycle state"
        default: OPEN
        constraints: "one of OPEN, RESPONDED, ESCALATED, CLEARED, WAIVED"
      - name: response_ref
        type: string
        source: computed
        description: "Document reference supplied with the response"
        default: null
      - name: escalation_reason
        type: string
        source: computed
        description: "Reason recorded on escalation"
        default: null
      - name: waiver_justification
        type: string
        source: computed
        description: "Board-level risk-acceptance justification recorded on waiver"
        default: null

  - name: RestrictedFund
    parent: null
    common_fields: true
    fields:
      - name: org_id
        type: string
        source: input
        description: "FK -> Organization.id; the organization of record that holds the fund"
      - name: fund_name
        type: string
        source: input
        description: "Donor-facing fund name"
        constraints: "1-160 chars, non-blank"
      - name: fund_type
        type: enum
        source: input
        description: "Restriction class; PERM_ENDOWMENT is the only class whose judicial release is capped"
        constraints: "one of TEMP_RESTRICTED, PERM_ENDOWMENT, CONDITIONAL_PLEDGE"
      - name: principal_cents
        type: integer
        source: input
        description: "Original gift principal in integer cents"
        constraints: ">= 1"
      - name: accumulated_appreciation_cents
        type: integer
        source: input
        description: "Net appreciation above principal in integer cents"
        default: 0
        constraints: ">= 0"
      - name: historic_dollar_value_cents
        type: integer
        source: input
        description: "Historic dollar value floor protected by state endowment law"
        constraints: ">= 0; must be <= principal_cents + accumulated_appreciation_cents"
      - name: restriction_purpose_code
        type: string
        source: input
        description: "Donor-imposed purpose code"
        constraints: "matches ^[A-Z]{2}-[A-Z_]+$"
      - name: restriction_conflict
        type: boolean
        source: input
        description: "True when the donor restriction conflicts with the receiving organization charitable purposes, so donor consent alone cannot cure it"
        default: false
      - name: donor_of_record_reachable
        type: boolean
        source: input
        description: "True when a living donor of record can be solicited for consent"
        default: true
      - name: transfer_status
        type: enum
        source: system
        description: "Restricted-asset transfer state"
        default: HELD
        constraints: "one of HELD, CONSENT_SOUGHT, CONSENT_GRANTED, CONSENT_DENIED, PETITION_FILED, MODIFIED, TRANSFERRED, RETAINED"
      - name: consent_method
        type: enum
        source: computed
        description: "How the donor consent was obtained"
        default: null
        constraints: "one of WRITTEN, ELECTRONIC"
      - name: consent_decision
        type: enum
        source: computed
        description: "Donor decision recorded on the consent solicitation"
        default: null
        constraints: "one of GRANTED, DENIED"
      - name: consent_signed_at
        type: datetime
        source: computed
        description: "Logical clock at which the consent decision was recorded"
        default: null
      - name: petition_basis
        type: enum
        source: computed
        description: "Statutory basis pleaded in the judicial modification petition"
        default: null
        constraints: "one of IMPRACTICABLE, WASTEFUL, UNLAWFUL, DONOR_UNREACHABLE"
      - name: petition_filed_at
        type: datetime
        source: computed
        description: "Logical clock at petition filing"
        default: null
      - name: court_docket_no
        type: string
        source: computed
        description: "Court docket number of the petition"
        default: null
      - name: court_decision
        type: enum
        source: computed
        description: "Recorded judicial outcome"
        default: null
        constraints: "one of GRANTED, GRANTED_WITH_CONDITIONS, DENIED"
      - name: modified_purpose_code
        type: string
        source: computed
        description: "Purpose code substituted by the court order"
        default: null
      - name: transfer_basis
        type: enum
        source: computed
        description: "Which authority the executed transfer relied on; selects the transferable-amount variant"
        default: null
        constraints: "one of DONOR_CONSENT, JUDICIAL_MODIFICATION"
      - name: transferable_amount_cents
        type: integer
        source: computed
        description: "Amount releasable under transfer_basis per calculations.restricted_fund_transferable_amount"
        default: 0
      - name: transferred_amount_cents
        type: integer
        source: computed
        description: "Amount actually moved to the recipient organization; equals transferable_amount_cents while transfer_status is TRANSFERRED, 0 otherwise"
        default: 0
      - name: retained_amount_cents
        type: integer
        source: computed
        description: "principal_cents + accumulated_appreciation_cents - transferred_amount_cents; stays with the organization of record"
        default: 0
      - name: transferred_to_org_id
        type: string
        source: computed
        description: "FK -> Organization.id; recipient organization while transfer_status is TRANSFERRED"
        default: null
      - name: transfer_restructuring_id
        type: string
        source: computed
        description: "FK -> Restructuring.id; the deal under whose authority the transfer executed"
        default: null
      - name: unwind_count
        type: integer
        source: computed
        description: "Number of times an executed transfer has been unwound"
        default: 0

  - name: BoardApproval
    parent: null
    common_fields: true
    fields:
      - name: restructuring_id
        type: string
        source: input
        description: "FK -> Restructuring.id; the deal voted upon"
      - name: approving_party
        type: enum
        source: input
        description: "Which side of the deal this board belongs to; INITIATOR resolves to Restructuring.initiator_org_id and TARGET to Restructuring.target_org_id"
        constraints: "one of INITIATOR, TARGET"
      - name: seats_total
        type: integer
        source: input
        description: "Total seated directors on that organization board"
        constraints: "integer, 1-51"
      - name: recusals
        type: integer
        source: input
        description: "Directors recused for conflict of interest"
        default: 0
        constraints: ">= 0; must be <= seats_total"
      - name: votes_for
        type: integer
        source: input
        description: "Directors voting in favour"
        constraints: ">= 0"
      - name: votes_against
        type: integer
        source: input
        description: "Directors voting against"
        constraints: ">= 0"
      - name: abstentions
        type: integer
        source: input
        description: "Directors present but abstaining; excluded from votes_cast"
        default: 0
        constraints: ">= 0"
      - name: conflict_disclosures_count
        type: integer
        source: input
        description: "Written conflict-of-interest disclosures filed with the fiduciary record"
        default: 0
        constraints: ">= 0"
      - name: eligible_seats
        type: integer
        source: computed
        description: "seats_total - recusals"
      - name: quorum_required
        type: integer
        source: computed
        description: "ceil(eligible_seats / 2)"
      - name: votes_cast
        type: integer
        source: computed
        description: "votes_for + votes_against"
      - name: approval_ratio
        type: number
        source: computed
        description: "votes_for / votes_cast"
        constraints: "4 decimal places, round_half_up; 0.0000 when votes_cast is 0"
      - name: required_ratio
        type: number
        source: computed
        description: "Supermajority threshold keyed on the deal structure_type"
        constraints: "4 decimal places"
      - name: decision
        type: enum
        source: computed
        description: "APPROVED when votes_cast > 0 and approval_ratio >= required_ratio, otherwise REJECTED"
        constraints: "one of APPROVED, REJECTED"
      - name: fiduciary_memo_ref
        type: string
        source: computed
        description: "Reference to the fiduciary-duty memorandum filed at certification"
        default: null
      - name: recording_secretary_ref
        type: string
        source: input
        description: "Staff reference of the board secretary who recorded these minutes; the two-signature control compares it against certifying_secretary_ref"
        constraints: "1-64 chars, non-blank"
      - name: certifying_secretary_ref
        type: string
        source: computed
        description: "Staff reference of the board secretary who certified these minutes; MUST differ from recording_secretary_ref"
        default: null
      - name: pinned_composite_score
        type: number
        source: computed
        description: "composite_score of the latest DILIGENCE_ADJUSTED AlignmentAssessment at the instant of certification"
        default: null
      - name: pinned_assessment_sequence_no
        type: integer
        source: computed
        description: "sequence_no of that pinned assessment; a later DILIGENCE_ADJUSTED assessment makes this approval stale"
        default: null
      - name: allocated_seats
        type: integer
        source: computed
        description: "Seats drawn from Restructuring.reserved_seat_pool at certification for approving_party"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Resolution lifecycle state; initial state is REJECTED when decision is REJECTED, otherwise RECORDED"
        constraints: "one of RECORDED, CERTIFIED, REJECTED, RESCINDED, SUPERSEDED"
      - name: rescission_reason
        type: string
        source: computed
        description: "Reason recorded on rescission"
        default: null

  - name: AGFiling
    parent: null
    common_fields: true
    fields:
      - name: restructuring_id
        type: string
        source: input
        description: "FK -> Restructuring.id; the deal being noticed to the attorney general"
      - name: state_code
        type: string
        source: input
        description: "State whose attorney general receives the filing"
        constraints: "matches ^[A-Z]{2}$"
      - name: filing_type
        type: enum
        source: input
        description: "NOTICE for below-threshold transfers, APPROVAL_PETITION where prior approval is required"
        constraints: "one of NOTICE, APPROVAL_PETITION"
      - name: legal_costs_cents
        type: integer
        source: input
        description: "Transaction legal costs excluding the attorney-general filing fee"
        constraints: ">= 0"
      - name: transferred_charitable_asset_value_cents
        type: integer
        source: computed
        description: "Restructuring.unrestricted_transfer_value_cents plus the sum of RestrictedFund.transferred_amount_cents for funds whose transfer_restructuring_id is this deal and transfer_status is TRANSFERRED"
      - name: judicial_basis_present
        type: boolean
        source: computed
        description: "True when at least one such transferred fund has transfer_basis JUDICIAL_MODIFICATION"
      - name: provisional_consideration_cents
        type: integer
        source: computed
        description: "transferred_charitable_asset_value_cents + legal_costs_cents; the fee-exclusive total that selects the fee tier"
      - name: ag_filing_fee_cents
        type: integer
        source: computed
        description: "Tiered fee selected from provisional_consideration_cents"
      - name: closing_costs_cents
        type: integer
        source: computed
        description: "legal_costs_cents + ag_filing_fee_cents"
      - name: total_consideration_cents
        type: integer
        source: computed
        description: "transferred_charitable_asset_value_cents + closing_costs_cents"
      - name: statutory_waiting_days
        type: integer
        source: computed
        description: "Statutory review period in calendar days per calculations.ag_statutory_waiting_period"
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical clock at creation; filings are created already SUBMITTED"
      - name: review_deadline_at
        type: datetime
        source: computed
        description: "submitted_at plus statutory_waiting_days calendar days; at or after this instant a regulatory sweep deems the filing approved"
      - name: decision_recorded_at
        type: datetime
        source: computed
        description: "Logical clock at which the regulator decision was recorded"
        default: null
      - name: objection_reason
        type: string
        source: computed
        description: "Reason recorded with an OBJECTED decision"
        default: null
      - name: status
        type: enum
        source: system
        description: "Filing lifecycle state"
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, OBJECTED, DEEMED_APPROVED"

  - name: IntegrationTask
    parent: null
    common_fields: true
    fields:
      - name: restructuring_id
        type: string
        source: input
        description: "FK -> Restructuring.id; the deal being integrated"
      - name: workstream
        type: enum
        source: input
        description: "Integration workstream"
        constraints: "one of STAFFING, SYSTEMS, BRANDING, PROGRAM_CONTINUITY"
      - name: crew_code
        type: string
        source: input
        description: "Integration crew that occupies the planned window; capacity is exactly one task per crew per instant"
        constraints: "matches ^CREW-[A-Z0-9]{2,8}$"
      - name: title
        type: string
        source: input
        description: "Task title"
        constraints: "1-160 chars, non-blank"
      - name: planned_start_date
        type: string
        source: input
        description: "Inclusive start of the crew window, YYYY-MM-DD"
      - name: planned_end_date
        type: string
        source: input
        description: "EXCLUSIVE end of the crew window, YYYY-MM-DD; must be strictly after planned_start_date"
      - name: depends_on_task_id
        type: string
        source: input
        description: "FK -> IntegrationTask.id; predecessor that must be COMPLETE before this task may start"
        default: null
      - name: status
        type: enum
        source: system
        description: "Task lifecycle state; initial state is HELD when the deal restricted_asset_posture is RESTRICTED_PENDING or BLOCKED and workstream is PROGRAM_CONTINUITY, otherwise PLANNED"
        constraints: "one of PLANNED, HELD, IN_PROGRESS, COMPLETE, CANCELLED"
      - name: held_reason
        type: string
        source: computed
        description: "Reason the task is HELD"
        default: null
      - name: started_at
        type: datetime
        source: computed
        description: "Logical clock at start"
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical clock at completion"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: Restructuring
    initial_state: EXPLORATORY
    terminal_states: [CONSUMMATED, ABANDONED]
    transitions:
      - from: EXPLORATORY
        to: RATIONALE_BUILT
        trigger: "system, on the first successful POST /alignment-assessments with variant SCREENING for this deal"
        actor: system
        preconditions:
          - "restructuring.status == EXPLORATORY"
        side_effects:
          - "sets status = RATIONALE_BUILT"
          - "increments Restructuring.version by 1"
        note: "Auto-transition; there is no manual endpoint for this hop."

      - from: RATIONALE_BUILT
        to: LOI_NEGOTIATION
        trigger: "system, on the first successful POST /letters-of-intent for this deal"
        actor: system
        preconditions:
          - "restructuring.status == RATIONALE_BUILT"
        side_effects:
          - "sets status = LOI_NEGOTIATION"
          - "increments Restructuring.version by 1 (in addition to the OCC bump of the create itself, which is the same single mutation)"

      - from: LOI_NEGOTIATION
        to: DILIGENCE
        trigger: "system, on POST /letters-of-intent/{id}/execute"
        actor: system
        preconditions:
          - "restructuring.status == LOI_NEGOTIATION"
          - "the executed LetterOfIntent has status ISSUED and exclusivity_status ACTIVE"
        side_effects:
          - "sets status = DILIGENCE"
          - "copies letter_of_intent.combined_board_seats into combined_board_seats"
          - "sets reserved_seat_pool = combined_board_seats"
          - "increments Restructuring.version by 1"

      - from: DILIGENCE
        to: DILIGENCE_CLOSED
        trigger: "system, re-evaluated after every DiligenceRequest mutation for this deal"
        actor: system
        preconditions:
          - "restructuring.status == DILIGENCE"
          - "count of DiligenceRequest for this deal >= 1"
          - "every DiligenceRequest for this deal has status IN {CLEARED, WAIVED}"
        side_effects:
          - "sets status = DILIGENCE_CLOSED"
          - "increments Restructuring.version by 1"
        note: "Bubble-up aggregate transition."

      - from: DILIGENCE_CLOSED
        to: DILIGENCE
        trigger: "system, on POST /diligence-requests creating a new finding for this deal"
        actor: system
        preconditions:
          - "restructuring.status == DILIGENCE_CLOSED"
        side_effects:
          - "sets status = DILIGENCE"
          - "increments Restructuring.version by 1"
        note: "Reopen cycle DILIGENCE -> DILIGENCE_CLOSED -> DILIGENCE."

      - from: DILIGENCE_CLOSED
        to: STRUCTURE_SELECTED
        trigger: "POST /restructurings/{id}/select-structure"
        actor: StrategyOfficer
        preconditions:
          - "restructuring.status == DILIGENCE_CLOSED"
          - "X-User-ID == restructuring.initiator_org_id"
          - "structure_type == the proposed_structure_type of the LetterOfIntent for this deal whose status is EXECUTED, else ERR_STRUCTURE_TYPE_MISMATCH"
          - "the latest DILIGENCE_ADJUSTED AlignmentAssessment (highest sequence_no) exists and its composite_rating IN {STRONG, MODERATE}, else ERR_ALIGNMENT_RATING_INSUFFICIENT"
          - "that assessment reserve_months >= RESERVE_FLOOR_MONTHS, else ERR_RESERVE_BELOW_FLOOR"
        side_effects:
          - "sets structure_type and unrestricted_transfer_value_cents from the request"
          - "sets status = STRUCTURE_SELECTED"
          - "increments Restructuring.version by 1"

      - from: STRUCTURE_SELECTED
        to: BOARD_APPROVAL
        trigger: "system, on the first successful POST /board-approvals for this deal"
        actor: system
        preconditions:
          - "restructuring.status == STRUCTURE_SELECTED"
        side_effects:
          - "sets status = BOARD_APPROVAL"
          - "increments Restructuring.version by 1"

      - from: BOARD_APPROVAL
        to: REGULATORY_REVIEW
        trigger: "system, re-evaluated after every BoardApproval mutation for this deal"
        actor: system
        preconditions:
          - "restructuring.status == BOARD_APPROVAL"
          - "a BoardApproval with approving_party INITIATOR and status CERTIFIED exists for this deal"
          - "a BoardApproval with approving_party TARGET and status CERTIFIED exists for this deal"
        side_effects:
          - "sets status = REGULATORY_REVIEW"
          - "increments Restructuring.version by 1"
          - "when ag_review_required == false, immediately continues to INTEGRATION in the same request (see next transition)"
        note: "Bubble-up aggregate transition gated on both parties, and the guarded entry point for the conditional AG bypass."

      - from: REGULATORY_REVIEW
        to: INTEGRATION
        trigger: "system, either (a) immediately on entering REGULATORY_REVIEW when ag_review_required == false, or (b) when an AGFiling for this deal reaches status APPROVED or DEEMED_APPROVED"
        actor: system
        preconditions:
          - "restructuring.status == REGULATORY_REVIEW"
          - "ag_review_required == false OR an AGFiling for this deal has status IN {APPROVED, DEEMED_APPROVED}"
        side_effects:
          - "sets status = INTEGRATION"
          - "increments Restructuring.version by 1"

      - from: INTEGRATION
        to: CONSUMMATED
        trigger: "POST /restructurings/{id}/consummate"
        actor: StrategyOfficer
        preconditions:
          - "restructuring.status == INTEGRATION"
          - "X-User-ID == restructuring.initiator_org_id"
          - "restricted_asset_posture IN {NOT_ASSESSED, CLEARED}, else ERR_RESTRICTED_ASSETS_UNRESOLVED"
          - "every IntegrationTask for this deal has status IN {COMPLETE, CANCELLED}, else ERR_INTEGRATION_INCOMPLETE"
        side_effects:
          - "sets status = CONSUMMATED"
          - "sets affiliation_role on both parties per structure_type: MERGER -> initiator SURVIVOR / target DISSOLVED; ASSET_ACQUISITION -> initiator SURVIVOR / target DIVESTED; PARENT_SUBSIDIARY -> initiator PARENT / target SUBSIDIARY and target.parent_org_id = initiator_org_id; MANAGEMENT_SERVICES_AGREEMENT -> initiator MSA_PROVIDER / target MSA_CLIENT"
          - "for every Program of either party with continuity_status PLANNED_TRANSFER: sets continuity_status = TRANSFERRED and transferred_to_org_id = the party whose affiliation_role is SURVIVOR, PARENT or MSA_PROVIDER"
          - "for every Program of either party with continuity_status PLANNED_SUNSET: sets continuity_status = SUNSET"
          - "increments Restructuring.version by 1, and Organization.version by 1 on each mutated organization"

      - from: DILIGENCE
        to: LOI_NEGOTIATION
        trigger: "system, on POST /diligence-requests/{id}/escalate where the escalated finding has severity CRITICAL"
        actor: system
        preconditions:
          - "restructuring.status IN {DILIGENCE, DILIGENCE_CLOSED, STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW}"
          - "the escalated DiligenceRequest.severity == CRITICAL"
        side_effects:
          - "sets status = LOI_NEGOTIATION"
          - "increments round_no by 1"
          - "CASCADE HOP 3: because the deal re-entered LOI_NEGOTIATION, the LetterOfIntent for this deal with status EXECUTED becomes SUPERSEDED and its exclusivity_status becomes RELEASED"
          - "CASCADE HOP 4: because that letter became SUPERSEDED, every BoardApproval for this deal with status CERTIFIED becomes SUPERSEDED"
          - "CASCADE HOP 5: because those approvals became SUPERSEDED, each returns its allocated_seats to reserved_seat_pool, sets its own allocated_seats = 0, and resets Organization.governance_seats to 0 on the corresponding party"
          - "increments Restructuring.version by 1"
        note: "Same transition applies from DILIGENCE_CLOSED, STRUCTURE_SELECTED, BOARD_APPROVAL and REGULATORY_REVIEW; structure_type is retained so the next round letter must propose the same structure."

      - from: EXPLORATORY
        to: ABANDONED
        trigger: "POST /restructurings/{id}/abandon"
        actor: StrategyOfficer
        preconditions:
          - "restructuring.status NOT IN {CONSUMMATED, ABANDONED}"
          - "X-User-ID IN {restructuring.initiator_org_id, restructuring.target_org_id}"
        side_effects:
          - "sets status = ABANDONED and abandonment_reason from the request"
          - "every LetterOfIntent for this deal with status IN {ISSUED, COUNTERED, EXECUTED} becomes WITHDRAWN with exclusivity_status RELEASED"
          - "every BoardApproval for this deal with status IN {RECORDED, CERTIFIED} becomes SUPERSEDED, returning allocated_seats to reserved_seat_pool and resetting Organization.governance_seats to 0"
          - "every IntegrationTask for this deal with status IN {PLANNED, HELD, IN_PROGRESS} becomes CANCELLED"
          - "every RestrictedFund whose transfer_restructuring_id is this deal and transfer_status is TRANSFERRED is unwound exactly as POST /restricted-funds/{id}/unwind"
          - "increments Restructuring.version by 1"
        note: "Applies from every non-terminal status, not only EXPLORATORY."

  - entity: LetterOfIntent
    initial_state: ISSUED
    terminal_states: [EXECUTED, WITHDRAWN, LAPSED, SUPERSEDED]
    note: |
      This entity carries TWO independent state dimensions on the same row.
      Dimension A is `status` (negotiation). Dimension B is `exclusivity_status`
      (the confidential exclusivity window). They evolve independently: a sweep
      can flip exclusivity_status ACTIVE -> EXPIRED while status stays ISSUED,
      and a counter can flip status ISSUED -> COUNTERED while exclusivity_status
      stays ACTIVE.
    transitions:
      - from: ISSUED
        to: COUNTERED
        trigger: "POST /letters-of-intent/{id}/counter"
        actor: StrategyOfficer
        preconditions:
          - "letter.status == ISSUED"
          - "X-User-ID == restructuring.target_org_id (only the non-issuing party may counter)"
          - "letter.exclusivity_status == ACTIVE"
        side_effects:
          - "sets status = COUNTERED, countered_by_party = TARGET, increments counter_round_count by 1"
          - "leaves exclusivity_status untouched at ACTIVE"
          - "increments LetterOfIntent.version by 1"

      - from: COUNTERED
        to: ISSUED
        trigger: "POST /letters-of-intent/{id}/revise"
        actor: StrategyOfficer
        preconditions:
          - "letter.status == COUNTERED"
          - "X-User-ID == restructuring.initiator_org_id"
          - "1 <= board_seat_split_initiator <= letter.combined_board_seats - 1, else ERR_SEAT_SPLIT_OUT_OF_RANGE"
        side_effects:
          - "overwrites board_seat_split_initiator with the revised value"
          - "sets status = ISSUED"
          - "leaves counter_round_count, exclusivity_start_date, exclusivity_end_date and exclusivity_status untouched"
          - "increments LetterOfIntent.version by 1"
        note: "Cycle ISSUED -> COUNTERED -> ISSUED; the deal stays in LOI_NEGOTIATION throughout."

      - from: ISSUED
        to: EXECUTED
        trigger: "POST /letters-of-intent/{id}/execute"
        actor: StrategyOfficer
        preconditions:
          - "letter.status == ISSUED"
          - "X-User-ID == restructuring.target_org_id (the counterparty countersigns)"
          - "letter.exclusivity_status == ACTIVE, else ERR_INVALID_LETTER_STATE"
          - "current_utc < letter.expires_at"
        side_effects:
          - "sets status = EXECUTED and executed_at = current_utc"
          - "leaves exclusivity_status at ACTIVE for the life of the deal"
          - "advances the Restructuring LOI_NEGOTIATION -> DILIGENCE, copying combined_board_seats and seeding reserved_seat_pool"
          - "increments LetterOfIntent.version by 1"

      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /letters-of-intent/{id}/withdraw"
        actor: StrategyOfficer
        preconditions:
          - "letter.status IN {ISSUED, COUNTERED}"
          - "X-User-ID == restructuring.initiator_org_id"
        side_effects:
          - "sets status = WITHDRAWN and withdrawal_reason from the request"
          - "sets exclusivity_status = RELEASED"
          - "increments LetterOfIntent.version by 1"
        note: "Also applies from COUNTERED."

      - from: ISSUED
        to: LAPSED
        trigger: "system, on POST /regulatory-sweeps when current_utc >= letter.expires_at"
        actor: system
        preconditions:
          - "letter.status IN {ISSUED, COUNTERED}"
          - "current_utc >= letter.expires_at"
        side_effects:
          - "sets status = LAPSED"
          - "sets exclusivity_status = RELEASED"
          - "increments LetterOfIntent.version by 1"

      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system, cascade hop 3 of a CRITICAL DiligenceRequest escalation, or cascade of POST /restructurings/{id}/abandon"
        actor: system
        preconditions:
          - "letter.status == EXECUTED"
        side_effects:
          - "sets status = SUPERSEDED"
          - "sets exclusivity_status = RELEASED"
          - "triggers cascade hop 4 on every CERTIFIED BoardApproval of the same deal"
          - "increments LetterOfIntent.version by 1"

      - from: ISSUED
        to: ISSUED
        trigger: "system, on POST /regulatory-sweeps when current_utc date > letter.exclusivity_end_date (dimension B only)"
        actor: system
        preconditions:
          - "letter.exclusivity_status == ACTIVE"
          - "the calendar date of current_utc is strictly after exclusivity_end_date"
        side_effects:
          - "sets exclusivity_status = EXPIRED and leaves status untouched"
          - "increments LetterOfIntent.version by 1"
        note: "Dimension-B-only transition: proves the two dimensions are independent."

  - entity: DiligenceRequest
    initial_state: OPEN
    terminal_states: [CLEARED, WAIVED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /diligence-requests/{id}/respond"
        actor: StrategyOfficer
        preconditions:
          - "request.status IN {OPEN, ESCALATED}"
          - "X-User-ID IN {restructuring.initiator_org_id, restructuring.target_org_id}"
        side_effects:
          - "sets status = RESPONDED, response_ref from the request, and exposure_cents to the supplied revised value when present"
          - "does NOT mutate the Restructuring row: neither status nor version changes, because a response alone never closes diligence"
          - "increments DiligenceRequest.version by 1"
        note: "Also applies from ESCALATED, which makes {OPEN|ESCALATED} -> RESPONDED -> ESCALATED a cycle."

      - from: RESPONDED
        to: CLEARED
        trigger: "POST /diligence-requests/{id}/clear"
        actor: DiligenceLead
        preconditions:
          - "request.status == RESPONDED"
          - "X-User-ID != request.raised_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets status = CLEARED and cleared_by_user_id = X-User-ID"
          - "re-evaluates the Restructuring DILIGENCE -> DILIGENCE_CLOSED bubble-up"
          - "increments DiligenceRequest.version by 1"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /diligence-requests/{id}/escalate"
        actor: DiligenceLead
        preconditions:
          - "request.status IN {OPEN, RESPONDED}"
          - "restructuring.status IN {DILIGENCE, DILIGENCE_CLOSED, STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW}"
        side_effects:
          - "CASCADE HOP 1: sets status = ESCALATED and escalation_reason from the request"
          - "CASCADE HOP 2: because a finding is now ESCALATED and its severity is CRITICAL, the Restructuring reverts to LOI_NEGOTIATION and round_no increments by 1 (hops 3, 4 and 5 follow from that revert, see the Restructuring machine)"
          - "when severity != CRITICAL the cascade stops at hop 1 and only this row mutates"
          - "increments DiligenceRequest.version by 1"
        note: "Also applies from RESPONDED. This is the depth-5 cascade origin."

      - from: OPEN
        to: WAIVED
        trigger: "POST /diligence-requests/{id}/waive"
        actor: DiligenceLead
        preconditions:
          - "request.status IN {OPEN, RESPONDED, ESCALATED}"
          - "X-User-ID != request.raised_by_user_id, else ERR_SEGREGATION_OF_DUTIES - the lead who raised a finding may not be the one who accepts it unresolved"
        side_effects:
          - "sets status = WAIVED and waiver_justification from the request"
          - "removes this row exposure from open_diligence_exposure_cents of any later DILIGENCE_ADJUSTED assessment"
          - "re-evaluates the Restructuring DILIGENCE -> DILIGENCE_CLOSED bubble-up"
          - "increments DiligenceRequest.version by 1"
        note: "Also applies from RESPONDED and ESCALATED."

  - entity: RestrictedFund
    initial_state: HELD
    terminal_states: [RETAINED]
    note: |
      Branching fork-join. From CONSENT_SOUGHT the machine forks on the donor
      decision, and the two branches carry DIFFERENT side-effect sets: the
      consent branch pins transfer_basis DONOR_CONSENT and releases the whole
      fund value, while the judicial branch pins transfer_basis
      JUDICIAL_MODIFICATION and releases only the amount above the historic
      dollar value plus a spending-rate-capped slice. The two branches rejoin at
      TRANSFERRED.
    transitions:
      - from: HELD
        to: CONSENT_SOUGHT
        trigger: "POST /restricted-funds/{id}/seek-consent"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status == HELD"
          - "fund.donor_of_record_reachable == true, else ERR_INVALID_FUND_STATE"
        side_effects:
          - "sets transfer_status = CONSENT_SOUGHT"
          - "recomputes Restructuring.unresolved_restricted_fund_count and restricted_asset_posture on every deal in which this organization is a party"
          - "increments RestrictedFund.version by 1"

      - from: CONSENT_SOUGHT
        to: CONSENT_GRANTED
        trigger: "POST /restricted-funds/{id}/record-consent with decision GRANTED"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status == CONSENT_SOUGHT"
        side_effects:
          - "sets consent_method, consent_decision = GRANTED, consent_signed_at = current_utc"
          - "sets transfer_status = CONSENT_GRANTED"
          - "sets transferable_amount_cents per the DONOR_CONSENT variant of calculations.restricted_fund_transferable_amount"
          - "recomputes Restructuring.unresolved_restricted_fund_count and restricted_asset_posture on every deal in which this organization is a party"
          - "increments RestrictedFund.version by 1"
        note: "Branch A side effects: full value released, no court involvement."

      - from: CONSENT_SOUGHT
        to: CONSENT_DENIED
        trigger: "POST /restricted-funds/{id}/record-consent with decision DENIED"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status == CONSENT_SOUGHT"
        side_effects:
          - "sets consent_method, consent_decision = DENIED, consent_signed_at = current_utc"
          - "sets transfer_status = CONSENT_DENIED and transferable_amount_cents = 0"
          - "recomputes restricted_asset_posture to BLOCKED on every deal in which this organization is a party (a denied fund blocks the posture)"
          - "increments RestrictedFund.version by 1"
        note: "Branch B side effects: posture flips to BLOCKED, which is a different set from branch A."

      - from: CONSENT_DENIED
        to: PETITION_FILED
        trigger: "POST /restricted-funds/{id}/file-petition"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status IN {HELD, CONSENT_DENIED}"
          - "when transfer_status == HELD, fund.donor_of_record_reachable must be false and petition_basis must be DONOR_UNREACHABLE, else ERR_DONOR_CONSENT_REQUIRED"
        side_effects:
          - "sets petition_basis, court_docket_no, modified_purpose_code and petition_filed_at = current_utc"
          - "sets transfer_status = PETITION_FILED"
          - "recomputes Restructuring.unresolved_restricted_fund_count and restricted_asset_posture (BLOCKED clears back to RESTRICTED_PENDING once no fund is CONSENT_DENIED)"
          - "increments RestrictedFund.version by 1"
        note: "Also applies from HELD for an unreachable donor of record, which is the second fork entry."

      - from: PETITION_FILED
        to: MODIFIED
        trigger: "POST /restricted-funds/{id}/record-court-decision with decision GRANTED or GRANTED_WITH_CONDITIONS"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status == PETITION_FILED"
        side_effects:
          - "sets court_decision and transfer_status = MODIFIED"
          - "sets transferable_amount_cents per the JUDICIAL_MODIFICATION variant of calculations.restricted_fund_transferable_amount"
          - "recomputes Restructuring.unresolved_restricted_fund_count and restricted_asset_posture"
          - "increments RestrictedFund.version by 1"

      - from: PETITION_FILED
        to: RETAINED
        trigger: "POST /restricted-funds/{id}/record-court-decision with decision DENIED"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status == PETITION_FILED"
        side_effects:
          - "sets court_decision = DENIED, transfer_status = RETAINED, transferable_amount_cents = 0, retained_amount_cents = principal_cents + accumulated_appreciation_cents"
          - "recomputes Restructuring.unresolved_restricted_fund_count and restricted_asset_posture (a RETAINED fund is resolved and no longer blocks)"
          - "increments RestrictedFund.version by 1"

      - from: CONSENT_GRANTED
        to: TRANSFERRED
        trigger: "POST /restricted-funds/{id}/transfer"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status IN {CONSENT_GRANTED, MODIFIED}"
          - "transfer_basis == DONOR_CONSENT requires transfer_status == CONSENT_GRANTED; transfer_basis == JUDICIAL_MODIFICATION requires transfer_status == MODIFIED"
          - "fund.restriction_conflict == false when transfer_basis == DONOR_CONSENT, else ERR_JUDICIAL_ORDER_REQUIRED"
          - "fund.org_id IN {restructuring.initiator_org_id, restructuring.target_org_id}, else ERR_FUND_NOT_DEAL_PARTY_ASSET"
          - "restructuring.status IN {STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW, INTEGRATION}, else ERR_INVALID_DEAL_STATE"
        side_effects:
          - "CASCADE HOP 1: sets transfer_status = TRANSFERRED, transfer_basis, transfer_restructuring_id, transferred_to_org_id = the counterparty organization, transferred_amount_cents = transferable_amount_cents, retained_amount_cents = principal_cents + accumulated_appreciation_cents - transferred_amount_cents"
          - "CASCADE HOP 2: because the fund moved, restricted_corpus_cents is recomputed on BOTH party Organizations per calculations.organization_restricted_corpus, and each mutated Organization.version increments by 1"
          - "CASCADE HOP 3: because the party corpus figures changed, the Restructuring recomputes unresolved_restricted_fund_count and restricted_asset_posture, which flips RESTRICTED_PENDING -> CLEARED when the count reaches 0"
          - "CASCADE HOP 4: because the posture became CLEARED, every IntegrationTask of this deal with workstream PROGRAM_CONTINUITY and status HELD becomes PLANNED with held_reason cleared to null"
          - "increments RestrictedFund.version by 1 and Restructuring.version by 1"
        note: "Also applies from MODIFIED. This is the depth-4 cascade origin."

      - from: TRANSFERRED
        to: CONSENT_GRANTED
        trigger: "POST /restricted-funds/{id}/unwind"
        actor: CharitableTrustCounsel
        preconditions:
          - "fund.transfer_status == TRANSFERRED"
          - "the Restructuring named by transfer_restructuring_id has status NOT IN {CONSUMMATED}"
        side_effects:
          - "sets transfer_status = CONSENT_GRANTED when transfer_basis was DONOR_CONSENT, or MODIFIED when it was JUDICIAL_MODIFICATION (conditional compensation)"
          - "clears transferred_to_org_id, transfer_restructuring_id and transfer_basis to null; sets transferred_amount_cents = 0 and retained_amount_cents = 0; increments unwind_count by 1"
          - "leaves transferable_amount_cents at its pre-transfer value so a re-transfer releases the identical amount"
          - "recomputes restricted_corpus_cents on both party Organizations, restoring each to its exact pre-transfer value"
          - "recomputes Restructuring.unresolved_restricted_fund_count and restricted_asset_posture, which reverts CLEARED -> RESTRICTED_PENDING"
          - "every IntegrationTask of that deal with workstream PROGRAM_CONTINUITY and status PLANNED returns to HELD"
          - "increments RestrictedFund.version by 1 and Restructuring.version by 1"
        note: "Compensating action for the transfer; the conserved quantity is the party-pair restricted corpus."

  - entity: BoardApproval
    initial_state: RECORDED
    terminal_states: [REJECTED, RESCINDED, SUPERSEDED]
    note: |
      Conditional initial state: POST /board-approvals computes `decision` from
      the vote tally and lands the row in RECORDED when decision is APPROVED and
      directly in the terminal state REJECTED when decision is REJECTED.
    transitions:
      - from: RECORDED
        to: CERTIFIED
        trigger: "POST /board-approvals/{id}/certify"
        actor: BoardSecretary
        preconditions:
          - "approval.status == RECORDED"
          - "X-User-ID == the Organization id resolved from approval.approving_party"
          - "certifying_secretary_ref != approval.recording_secretary_ref, else ERR_SEGREGATION_OF_DUTIES"
          - "approval.conflict_disclosures_count >= approval.recusals, else ERR_CONFLICT_DISCLOSURE_MISSING"
          - "restructuring.reserved_seat_pool >= the seats this party is due - an invariant assertion, not a client-facing validation: seat_ledger_total == combined_board_seats holds at every instant, so a compliant implementation can never observe a short pool and no error code is defined for it"
        side_effects:
          - "sets status = CERTIFIED and fiduciary_memo_ref from the request"
          - "sets pinned_composite_score and pinned_assessment_sequence_no from the latest DILIGENCE_ADJUSTED AlignmentAssessment of the deal"
          - "sets allocated_seats per calculations.governance_seat_allocation, decrements Restructuring.reserved_seat_pool by that amount, and sets Organization.governance_seats = allocated_seats on the approving party"
          - "re-evaluates the Restructuring BOARD_APPROVAL -> REGULATORY_REVIEW bubble-up"
          - "increments BoardApproval.version by 1, Restructuring.version by 1 and Organization.version by 1"

      - from: CERTIFIED
        to: RESCINDED
        trigger: "POST /board-approvals/{id}/rescind"
        actor: BoardSecretary
        preconditions:
          - "approval.status IN {RECORDED, CERTIFIED}"
          - "X-User-ID == the Organization id resolved from approval.approving_party"
          - "restructuring.status NOT IN {CONSUMMATED, ABANDONED}"
        side_effects:
          - "sets status = RESCINDED and rescission_reason from the request"
          - "returns allocated_seats to Restructuring.reserved_seat_pool, sets own allocated_seats = 0 and resets Organization.governance_seats to 0 on that party"
          - "when the deal was in REGULATORY_REVIEW it reverts to BOARD_APPROVAL because the both-parties-certified condition no longer holds"
          - "increments BoardApproval.version by 1, Restructuring.version by 1 and Organization.version by 1"
        note: "Compensating action for certification; the conserved quantity is the seat ledger."

      - from: RECORDED
        to: SUPERSEDED
        trigger: "system, on POST /board-approvals creating a newer approval for the same deal and approving_party, on cascade hop 4 of a CRITICAL escalation, or on deal abandonment"
        actor: system
        preconditions:
          - "approval.status IN {RECORDED, CERTIFIED}"
        side_effects:
          - "sets status = SUPERSEDED"
          - "returns allocated_seats to Restructuring.reserved_seat_pool, sets own allocated_seats = 0 and resets Organization.governance_seats to 0 on that party"
          - "increments BoardApproval.version by 1"
        note: "Also applies from CERTIFIED."

  - entity: AGFiling
    initial_state: SUBMITTED
    terminal_states: [APPROVED, OBJECTED, DEEMED_APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ag-filings/{id}/decision with decision APPROVED"
        actor: StateCharitiesRegulator
        preconditions:
          - "filing.status == SUBMITTED"
        side_effects:
          - "sets status = APPROVED and decision_recorded_at = current_utc"
          - "advances the Restructuring REGULATORY_REVIEW -> INTEGRATION"
          - "increments AGFiling.version by 1 and Restructuring.version by 1"

      - from: SUBMITTED
        to: OBJECTED
        trigger: "POST /ag-filings/{id}/decision with decision OBJECTED"
        actor: StateCharitiesRegulator
        preconditions:
          - "filing.status == SUBMITTED"
          - "objection_reason is present and non-blank, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets status = OBJECTED, objection_reason and decision_recorded_at = current_utc"
          - "leaves the Restructuring in REGULATORY_REVIEW so a fresh filing is required"
          - "increments AGFiling.version by 1"

      - from: SUBMITTED
        to: DEEMED_APPROVED
        trigger: "system, on POST /regulatory-sweeps when current_utc >= filing.review_deadline_at"
        actor: system
        preconditions:
          - "filing.status == SUBMITTED"
          - "current_utc >= filing.review_deadline_at (inclusive at the exact instant)"
        side_effects:
          - "sets status = DEEMED_APPROVED and decision_recorded_at = current_utc"
          - "advances the Restructuring REGULATORY_REVIEW -> INTEGRATION"
          - "increments AGFiling.version by 1 and Restructuring.version by 1"

  - entity: IntegrationTask
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    note: |
      Conditional initial state: a PROGRAM_CONTINUITY task created while the deal
      restricted_asset_posture is RESTRICTED_PENDING or BLOCKED lands in HELD;
      every other combination lands in PLANNED.
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /integration-tasks/{id}/start"
        actor: IntegrationManager
        preconditions:
          - "task.status == PLANNED"
          - "restructuring.status == INTEGRATION, else ERR_INVALID_DEAL_STATE"
          - "restructuring.ag_review_required == false OR an AGFiling for this deal has status IN {APPROVED, DEEMED_APPROVED}, else ERR_AG_APPROVAL_MISSING"
          - "when depends_on_task_id is not null, that task has status COMPLETE, else ERR_DEPENDENCY_NOT_COMPLETE"
        side_effects:
          - "sets status = IN_PROGRESS and started_at = current_utc"
          - "increments IntegrationTask.version by 1"

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /integration-tasks/{id}/complete"
        actor: IntegrationManager
        preconditions:
          - "task.status == IN_PROGRESS"
        side_effects:
          - "sets status = COMPLETE and completed_at = current_utc"
          - "increments IntegrationTask.version by 1"

      - from: HELD
        to: PLANNED
        trigger: "system, cascade hop 4 when the deal restricted_asset_posture becomes CLEARED"
        actor: system
        preconditions:
          - "task.status == HELD"
          - "restructuring.restricted_asset_posture == CLEARED"
        side_effects:
          - "sets status = PLANNED and held_reason = null"
          - "increments IntegrationTask.version by 1"

      - from: PLANNED
        to: HELD
        trigger: "system, on POST /restricted-funds/{id}/unwind when the posture reverts to RESTRICTED_PENDING"
        actor: system
        preconditions:
          - "task.status == PLANNED"
          - "task.workstream == PROGRAM_CONTINUITY"
          - "restructuring.restricted_asset_posture IN {RESTRICTED_PENDING, BLOCKED}"
        side_effects:
          - "sets status = HELD and held_reason = RESTRICTED_ASSETS_UNRESOLVED"
          - "increments IntegrationTask.version by 1"

      - from: PLANNED
        to: CANCELLED
        trigger: "system, on POST /restructurings/{id}/abandon"
        actor: system
        preconditions:
          - "task.status IN {PLANNED, HELD, IN_PROGRESS}"
        side_effects:
          - "sets status = CANCELLED"
          - "increments IntegrationTask.version by 1"
        note: "Also applies from HELD and IN_PROGRESS."

  - entity: Program
    initial_state: ACTIVE
    terminal_states: [TRANSFERRED, SUNSET]
    transitions:
      - from: ACTIVE
        to: PLANNED_TRANSFER
        trigger: "POST /programs/{id}/continuity-decision with disposition TRANSFER"
        actor: IntegrationManager
        preconditions:
          - "program.continuity_status == ACTIVE"
          - "program.org_id IN {restructuring.initiator_org_id, restructuring.target_org_id}, else ERR_PROGRAM_NOT_DEAL_PARTY_ASSET"
          - "restructuring.status IN {DILIGENCE, DILIGENCE_CLOSED, STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW, INTEGRATION}"
        side_effects:
          - "sets continuity_status = PLANNED_TRANSFER"
          - "removes nothing from the SCREENING inclusion set but removes nothing from DILIGENCE_ADJUSTED either, since PLANNED_TRANSFER is admitted by both variants"
          - "increments Program.version by 1"

      - from: ACTIVE
        to: PLANNED_SUNSET
        trigger: "POST /programs/{id}/continuity-decision with disposition SUNSET"
        actor: IntegrationManager
        preconditions:
          - "program.continuity_status == ACTIVE"
          - "program.org_id IN {restructuring.initiator_org_id, restructuring.target_org_id}, else ERR_PROGRAM_NOT_DEAL_PARTY_ASSET"
          - "restructuring.status IN {DILIGENCE, DILIGENCE_CLOSED, STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW, INTEGRATION}"
        side_effects:
          - "sets continuity_status = PLANNED_SUNSET"
          - "excludes this program from the DILIGENCE_ADJUSTED inclusion set of every later AlignmentAssessment while leaving the SCREENING set unchanged"
          - "increments Program.version by 1"

      - from: PLANNED_TRANSFER
        to: TRANSFERRED
        trigger: "system, on POST /restructurings/{id}/consummate"
        actor: system
        preconditions:
          - "program.continuity_status == PLANNED_TRANSFER"
        side_effects:
          - "sets continuity_status = TRANSFERRED and transferred_to_org_id = the surviving, parent or provider organization"
          - "increments Program.version by 1"

      - from: PLANNED_SUNSET
        to: SUNSET
        trigger: "system, on POST /restructurings/{id}/consummate"
        actor: system
        preconditions:
          - "program.continuity_status == PLANNED_SUNSET"
        side_effects:
          - "sets continuity_status = SUNSET"
          - "increments Program.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent Restructuring.version only)
# =============================================================================

concurrency_rules:
  - rule_id: loi-round-create-stale-restructuring
    parent_entity: Restructuring
    write_endpoint: "POST /letters-of-intent"
    occ_field: "expected_restructuring_version"
    description: |
      Issuing a LetterOfIntent against a Restructuring whose version has advanced
      since the client last read it is rejected. A new letter legitimately
      supersedes the negotiating position captured by the previous letter, so the
      operation cannot be resolved by a state precondition alone: the writer must
      prove it saw the deal as it stands, including any board seat pool, round
      counter or posture change already applied.
      Version arithmetic is per REQUEST and not per side effect: when a single
      request both writes a child row and drives an auto-transition of the parent,
      Restructuring.version increases by exactly 1, never by 2. A request refused
      by any validation - including this one - increments nothing.
    error_id: ERR_STALE_RESTRUCTURING_VERSION
    http_status: 412

  - rule_id: board-approval-recreate-stale-restructuring
    parent_entity: Restructuring
    write_endpoint: "POST /board-approvals"
    occ_field: "expected_restructuring_version"
    description: |
      Recording a BoardApproval against a Restructuring whose version has advanced
      since the client last read it is rejected. A re-vote by the same party
      legitimately supersedes that party earlier resolution and returns its seat
      allocation to the pool, so the write is valid on repeat and must instead be
      pinned to the deal version the board actually deliberated over.
      Version arithmetic is per REQUEST and not per side effect: the first approval
      of a deal both creates the row and advances STRUCTURE_SELECTED ->
      BOARD_APPROVAL, and Restructuring.version still increases by exactly 1. A
      request refused by any validation - including this one - increments nothing.
    error_id: ERR_STALE_RESTRUCTURING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: combined_operating_reserve_months
    trigger: "on POST /alignment-assessments (both variants); the per-organization step also runs on POST /organizations and POST /organizations/{id}/financial-restatement to refresh Organization.monthly_expense_cents"
    algorithm: aggregation
    formula: |
      # STEP 1 - per-organization rounding. This happens BEFORE any summation and
      # is the pinned order. Summing annual expense first and dividing once is a
      # DIFFERENT, FORBIDDEN order that can differ by one cent.
      monthly(o)              = round_half_up(o.annual_expense_cents / 12)   # integer cents
      Organization.monthly_expense_cents = monthly(o)

      # STEP 2 - sum the already-rounded per-organization figures.
      combined_monthly_expense_cents = monthly(initiator) + monthly(target)

      # STEP 3 - available unrestricted assets, variant dependent.
      raw_available = initiator.unrestricted_net_assets_cents + target.unrestricted_net_assets_cents
      available_unrestricted_cents = max(0, raw_available - open_diligence_exposure_cents)

      # STEP 4 - months of reserve.
      if combined_monthly_expense_cents == 0:
          reserve_months = 0.00
      else:
          reserve_months = round_half_up(available_unrestricted_cents / combined_monthly_expense_cents, 2)
    input_set: "Exactly the two Organizations named by Restructuring.initiator_org_id and Restructuring.target_org_id, read at the instant the assessment is created. open_diligence_exposure_cents is 0 for the SCREENING variant and, for DILIGENCE_ADJUSTED, is the sum of DiligenceRequest.exposure_cents over rows with restructuring_id == this deal AND status IN {OPEN, RESPONDED, ESCALATED} (rows in CLEARED or WAIVED are excluded)."
    constants:
      RESERVE_FLOOR_MONTHS: 3.00
    precision: "monthly_expense_cents and combined_monthly_expense_cents are integer cents rounded half-up; reserve_months is 2 decimal places, round_half_up"
    variants:
      - name: per_organization_then_sum
        when: "always - this is the only sanctioned order"
        difference: "Each organization annual expense is divided by 12 and rounded to whole cents first, then the two rounded figures are added."
      - name: sum_then_divide
        when: "never - documented only to name the forbidden alternative"
        difference: "Adding the two annual expenses and dividing the total by 12 once yields a combined_monthly_expense_cents that can be one cent lower, which can move reserve_months across a tier boundary and change composite_score by 10 points."

  - name: mission_program_alignment_score
    trigger: "on POST /alignment-assessments; the resulting composite_rating and reserve_months gate POST /restructurings/{id}/select-structure"
    algorithm: weighted_scoring
    formula: |
      # ---- mission component (3-way conditional branch) ----
      if initiator.mission_code == target.mission_code:        base_mission = 40.00
      elif family(initiator.mission_code) == family(target.mission_code): base_mission = 28.00
      else:                                                    base_mission = 12.00
      # family(code) = the two characters preceding the first hyphen.

      if variant == DILIGENCE_ADJUSTED and there exists a DiligenceRequest of this
         deal with workstream == RESTRICTED_FUNDS and severity == CRITICAL and
         status == ESCALATED:
          mission_alignment_points = max(0.00, base_mission - 10.00)
      else:
          mission_alignment_points = base_mission

      # ---- program overlap component (non-linear, peaks at 0.5) ----
      admitted = programs of initiator and target admitted by the variant filter
      init_count   = count(admitted where org_id == initiator_org_id)
      target_count = count(admitted where org_id == target_org_id)
      included_program_count = init_count + target_count
      overlap_pair_count = count of ordered pairs (p in initiator admitted, q in target admitted)
                           with p.service_category == q.service_category
                           and  p.county_code      == q.county_code
      denom = min(init_count, target_count)
      if denom == 0:
          program_overlap_index = 0.0000
      else:
          program_overlap_index = min(1.0000, round_half_up(overlap_pair_count / denom, 4))
      program_overlap_points = round_half_up(30.00 * (1 - abs(program_overlap_index - 0.5) * 2), 2)

      # ---- sustainability component (tiered on reserve_months from
      #      calculations.combined_operating_reserve_months) ----
      if   reserve_months >= 6.00: sustainability_points = 30.00
      elif reserve_months >= 3.00: sustainability_points = 20.00
      elif reserve_months >= 1.50: sustainability_points = 10.00
      else:                        sustainability_points =  0.00

      composite_score = round_half_up(mission_alignment_points + program_overlap_points + sustainability_points, 2)
      if   composite_score >= 80.00: composite_rating = STRONG
      elif composite_score >= 60.00: composite_rating = MODERATE
      elif composite_score >= 40.00: composite_rating = WEAK
      else:                          composite_rating = NOT_VIABLE
    input_set: "Programs of both party Organizations, filtered by variant (see variants below); DiligenceRequests of this deal filtered by status; the two party Organizations. Tie-breaks are not needed because the result is a count, not a selection."
    constants:
      MISSION_IDENTICAL_POINTS: 40.00
      MISSION_FAMILY_POINTS: 28.00
      MISSION_UNRELATED_POINTS: 12.00
      RESTRICTED_FUNDS_ESCALATION_DEDUCTION: 10.00
      OVERLAP_MAX_POINTS: 30.00
      OVERLAP_PEAK_INDEX: 0.5
      SUSTAINABILITY_TIER_HIGH_MONTHS: 6.00
      SUSTAINABILITY_TIER_MID_MONTHS: 3.00
      SUSTAINABILITY_TIER_LOW_MONTHS: 1.50
    precision: "program_overlap_index 4 decimal places round_half_up; every points field and composite_score 2 decimal places round_half_up"
    variants:
      - name: SCREENING
        when: "variant == SCREENING; the pre-diligence rationale snapshot"
        difference: "Admits EVERY Program of both parties regardless of continuity_status, sets open_diligence_exposure_cents = 0 so available_unrestricted_cents is the raw combined figure, and never applies the RESTRICTED_FUNDS escalation deduction."
      - name: DILIGENCE_ADJUSTED
        when: "variant == DILIGENCE_ADJUSTED; the post-diligence snapshot that gates structure selection"
        difference: "Admits only Programs with continuity_status IN {ACTIVE, PLANNED_TRANSFER}; subtracts open_diligence_exposure_cents from available unrestricted assets; and deducts RESTRICTED_FUNDS_ESCALATION_DEDUCTION from the mission component when a CRITICAL restricted-funds finding is ESCALATED. For identical stored data the two variants therefore return different composite_score and can return different composite_rating."

  - name: restricted_fund_transferable_amount
    trigger: "on POST /restricted-funds/{id}/record-consent with decision GRANTED (DONOR_CONSENT variant) and on POST /restricted-funds/{id}/record-court-decision with decision GRANTED or GRANTED_WITH_CONDITIONS (JUDICIAL_MODIFICATION variant); the stored value is consumed by POST /restricted-funds/{id}/transfer"
    algorithm: threshold
    formula: |
      fund_value = principal_cents + accumulated_appreciation_cents

      # variant DONOR_CONSENT
      transferable_amount_cents = fund_value

      # variant JUDICIAL_MODIFICATION
      if fund_type == PERM_ENDOWMENT:
          above_hdv    = max(0, fund_value - historic_dollar_value_cents)
          capped_slice = floor(historic_dollar_value_cents * ENDOWMENT_SPENDING_RATE_BPS / 10000)
          transferable_amount_cents = above_hdv + capped_slice
      else:                                  # TEMP_RESTRICTED, CONDITIONAL_PLEDGE
          transferable_amount_cents = fund_value

      retained_amount_cents = fund_value - transferable_amount_cents
    input_set: "The single RestrictedFund row only. No other entity participates, and the value is frozen at the moment the branch resolves so a later restatement of the fund inputs does not silently change an executed transfer."
    constants:
      ENDOWMENT_SPENDING_RATE_BPS: 700
    precision: "integer cents; the spending-rate slice uses floor (truncation toward zero), never round_half_up"
    variants:
      - name: DONOR_CONSENT
        when: "the fund reached CONSENT_GRANTED through donor consent"
        difference: "Releases the entire fund value including all accumulated appreciation; historic_dollar_value_cents is ignored."
      - name: JUDICIAL_MODIFICATION
        when: "the fund reached MODIFIED through a granted judicial modification petition"
        difference: "For a PERM_ENDOWMENT releases only the amount above the historic dollar value plus a floor-truncated 7 percent slice of the historic dollar value, so for identical fund data it releases strictly less than the DONOR_CONSENT variant. For other fund types the two variants agree."

  - name: organization_restricted_corpus
    trigger: "on every RestrictedFund mutation (create, seek-consent, record-consent, file-petition, record-court-decision, transfer, unwind) for every Organization the fund touches"
    algorithm: aggregation
    formula: |
      restricted_corpus_cents(o) =
            SUM over f where f.org_id == o.id AND f.transfer_status != TRANSFERRED
                 of (f.principal_cents + f.accumulated_appreciation_cents)
          + SUM over f where f.org_id == o.id AND f.transfer_status == TRANSFERRED
                 of f.retained_amount_cents
          + SUM over f where f.transferred_to_org_id == o.id AND f.transfer_status == TRANSFERRED
                 of f.transferred_amount_cents
    input_set: "All RestrictedFund rows whose org_id or transferred_to_org_id equals this Organization id, with the explicit transfer_status filters above. No time window and no ordering, so no tie-break is required."
    constants: {}
    precision: "integer cents; exact, no rounding"
    variants:
      - name: pair_conservation_invariant
        when: "read as the conserved quantity of a transfer and its unwind"
        difference: "pair_restricted_corpus_cents(r) = restricted_corpus_cents(r.initiator) + restricted_corpus_cents(r.target) is invariant across POST /restricted-funds/{id}/transfer and across transfer followed by unwind, because a transfer only moves transferred_amount_cents from the retained side to the recipient side of the same total."

  - name: governance_seat_allocation
    trigger: "on POST /board-approvals/{id}/certify; reversed on rescind and on supersession"
    algorithm: waterfall_allocation
    formula: |
      loi = the LetterOfIntent of this deal whose status is EXECUTED or SUPERSEDED
            with the highest round_no; on a tie in round_no, the row with the
            latest created_at wins.
      if approving_party == INITIATOR:
          due = loi.board_seat_split_initiator
      else:
          due = r.combined_board_seats - loi.board_seat_split_initiator

      assert  r.reserved_seat_pool >= due            # invariant, structurally unreachable as a client error
      allocated_seats            = due
      r.reserved_seat_pool       = r.reserved_seat_pool - due
      Organization.governance_seats(approving_party) = due

      # conserved quantity, checked after every certify / rescind / supersede:
      seat_ledger_total(r) = r.reserved_seat_pool
                           + SUM of BoardApproval.allocated_seats
                             over rows of this deal with status == CERTIFIED
      # seat_ledger_total(r) == r.combined_board_seats at all times once the
      # letter has been executed.
    input_set: "The one EXECUTED-or-SUPERSEDED LetterOfIntent selected by the pinned rule above, the Restructuring seat pool, and the Organization resolved from approving_party."
    constants: {}
    precision: "integer seats; no rounding, no fractional allocation"
    variants: []

  - name: ag_consideration_and_filing_fee
    trigger: "on POST /ag-filings"
    algorithm: tiered_pricing
    formula: |
      # The fee tier depends on the total, and the total contains the fee. The
      # dependency is broken by pinning the evaluation order: the tier is
      # ALWAYS selected from the fee-EXCLUSIVE provisional total.
      transferred_charitable_asset_value_cents =
            r.unrestricted_transfer_value_cents
          + SUM of f.transferred_amount_cents over RestrictedFund f
            where f.transfer_restructuring_id == r.id AND f.transfer_status == TRANSFERRED

      # step 1 - provisional total, fee excluded
      provisional_consideration_cents = transferred_charitable_asset_value_cents + legal_costs_cents
      # step 2 - tier selection reads ONLY the provisional total
      if   provisional_consideration_cents <  FEE_TIER_1_CEILING_CENTS: ag_filing_fee_cents = FEE_TIER_1_CENTS
      elif provisional_consideration_cents <  FEE_TIER_2_CEILING_CENTS: ag_filing_fee_cents = FEE_TIER_2_CENTS
      else:                                                             ag_filing_fee_cents = FEE_TIER_3_CENTS
      # step 3 - fold the fee in
      closing_costs_cents      = legal_costs_cents + ag_filing_fee_cents
      total_consideration_cents = transferred_charitable_asset_value_cents + closing_costs_cents
    input_set: "The Restructuring unrestricted_transfer_value_cents plus every RestrictedFund with transfer_restructuring_id == this deal AND transfer_status == TRANSFERRED (funds in any other transfer_status contribute nothing), plus the legal_costs_cents supplied on the request."
    constants:
      FEE_TIER_1_CEILING_CENTS: 100000000
      FEE_TIER_2_CEILING_CENTS: 1000000000
      FEE_TIER_1_CENTS: 25000
      FEE_TIER_2_CENTS: 150000
      FEE_TIER_3_CENTS: 500000
    precision: "integer cents; tier comparisons are strictly less-than against the ceilings, so a provisional total exactly equal to a ceiling falls in the HIGHER tier"
    variants: []

  - name: ag_statutory_waiting_period
    trigger: "on POST /ag-filings; the resulting review_deadline_at is consumed by POST /regulatory-sweeps"
    algorithm: threshold
    formula: |
      value = transferred_charitable_asset_value_cents            # from ag_consideration_and_filing_fee
      judicial_basis_present = TRUE when at least one contributing transferred fund
                               has transfer_basis == JUDICIAL_MODIFICATION

      # required filing type - validated, not chosen by the client
      perm_endowment_present = TRUE when at least one contributing transferred fund
                               has fund_type == PERM_ENDOWMENT
      required_type = APPROVAL_PETITION if (value >= AG_PETITION_THRESHOLD_CENTS or perm_endowment_present)
                      else NOTICE
      require filing_type == required_type                       # else ERR_AG_FILING_TYPE_MISMATCH

      statutory_waiting_days = 45 if filing_type == APPROVAL_PETITION else 20
      if r.structure_type == ASSET_ACQUISITION and value >= AG_PETITION_THRESHOLD_CENTS:
          statutory_waiting_days += 15
      if judicial_basis_present:
          statutory_waiting_days += 10

      submitted_at        = current_utc
      review_deadline_at  = submitted_at + statutory_waiting_days calendar days
      # sweep comparison is INCLUSIVE: current_utc >= review_deadline_at deems approval.
    input_set: "Same contributing fund set as ag_consideration_and_filing_fee, plus Restructuring.structure_type and the logical clock at creation."
    constants:
      AG_PETITION_THRESHOLD_CENTS: 500000000
      NOTICE_WAITING_DAYS: 20
      PETITION_WAITING_DAYS: 45
      ASSET_ACQUISITION_SURCHARGE_DAYS: 15
      JUDICIAL_BASIS_SURCHARGE_DAYS: 10
      AG_REVIEW_STATES: ["CA", "NY", "MA", "IL", "WA"]
    precision: "integer days; review_deadline_at is an ISO 8601 UTC timestamp with exactly three fractional digits"
    variants: []

  - name: board_vote_outcome
    trigger: "on POST /board-approvals"
    algorithm: threshold
    formula: |
      eligible_seats  = seats_total - recusals
      quorum_required = ceil(eligible_seats / 2)
      attendance      = votes_for + votes_against + abstentions
      votes_cast      = votes_for + votes_against

      require attendance <= eligible_seats        # else ERR_VOTE_TALLY_EXCEEDS_SEATS
      require attendance >= quorum_required       # else ERR_QUORUM_NOT_MET
      require votes_cast >  0                    # else ERR_NO_ELIGIBLE_VOTES

      required_ratio = 0.6667 if r.structure_type IN {MERGER, ASSET_ACQUISITION}
                       else 0.6000 if r.structure_type == PARENT_SUBSIDIARY
                       else 0.5000                                  # MANAGEMENT_SERVICES_AGREEMENT
      approval_ratio = round_half_up(votes_for / votes_cast, 4)
      decision       = APPROVED if approval_ratio >= required_ratio else REJECTED
      initial status = RECORDED if decision == APPROVED else REJECTED
    input_set: "The single request body plus Restructuring.structure_type, which must already be non-null because POST /board-approvals requires deal status IN {STRUCTURE_SELECTED, BOARD_APPROVAL}."
    constants:
      MERGER_REQUIRED_RATIO: 0.6667
      ASSET_ACQUISITION_REQUIRED_RATIO: 0.6667
      PARENT_SUBSIDIARY_REQUIRED_RATIO: 0.6000
      MSA_REQUIRED_RATIO: 0.5000
    precision: "approval_ratio 4 decimal places round_half_up; the comparison against required_ratio is >= (inclusive), so an exact two-thirds vote of 8 for and 4 against yields 0.6667 and PASSES a MERGER"
    variants: []

  - name: restricted_asset_posture
    trigger: "on every RestrictedFund mutation touching a party of the deal, and read as a gate by POST /integration-tasks and POST /restructurings/{id}/consummate"
    algorithm: constraint_propagation
    formula: |
      party_funds = RestrictedFund rows where org_id IN {r.initiator_org_id, r.target_org_id}
                    OR transferred_to_org_id IN {r.initiator_org_id, r.target_org_id}
      unresolved_restricted_fund_count =
            count of party_funds with transfer_status NOT IN {TRANSFERRED, RETAINED}

      if   count(party_funds) == 0:                                    posture = NOT_ASSESSED
      elif any party_fund has transfer_status == CONSENT_DENIED:       posture = BLOCKED
      elif unresolved_restricted_fund_count > 0:                       posture = RESTRICTED_PENDING
      else:                                                            posture = CLEARED
    input_set: "All RestrictedFund rows attached to either party by org_id or transferred_to_org_id, with no time window; the branch order above is evaluated top to bottom and the first match wins."
    constants: {}
    precision: "exact enumeration; no rounding"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in strict ascending priority order;
# the first violated rule short-circuits and its error_id is returned)
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the supplied X-User-Role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "request body and query parameters parse, required fields are present and non-null, types match, enum values are members of the declared set, integers are within their declared ranges, dates are ISO 8601 calendar dates and timestamps are ISO 8601 UTC, and limit/offset are within 1-100 / >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every Organization referenced by a path segment or by a body FK field (org_id, initiator_org_id, target_org_id, transferred_to_org_id) exists"
    error_id: ERR_ORGANIZATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /organizations/{id}, GET /organizations/{id}/programs, POST /organizations/{id}/financial-restatement, POST /programs, POST /restructurings, POST /restricted-funds, POST /programs/{id}/continuity-decision, POST /restricted-funds/{id}/transfer"

  - priority: 5
    category: existence
    check: "the Restructuring named by the path segment or by the restructuring_id body field exists"
    error_id: ERR_RESTRUCTURING_NOT_FOUND
    http_status: 404
    applies_to: "every /restructurings/{id}/... path, POST /alignment-assessments, POST /letters-of-intent, POST /diligence-requests, POST /board-approvals, POST /ag-filings, POST /integration-tasks, POST /restricted-funds/{id}/transfer"

  - priority: 6
    category: existence
    check: "the Program named by the path segment exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /programs/{id}/continuity-decision"

  - priority: 7
    category: existence
    check: "the LetterOfIntent named by the path segment exists"
    error_id: ERR_LETTER_OF_INTENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /letters-of-intent/{id}/counter, /revise, /execute, /withdraw"

  - priority: 8
    category: existence
    check: "the DiligenceRequest named by the path segment exists"
    error_id: ERR_DILIGENCE_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /diligence-requests/{id}/respond, /clear, /escalate, /waive"

  - priority: 9
    category: existence
    check: "the RestrictedFund named by the path segment exists"
    error_id: ERR_RESTRICTED_FUND_NOT_FOUND
    http_status: 404
    applies_to: "GET /restricted-funds/{id}, POST /restricted-funds/{id}/seek-consent, /record-consent, /file-petition, /record-court-decision, /transfer, /unwind"

  - priority: 10
    category: existence
    check: "the BoardApproval named by the path segment exists"
    error_id: ERR_BOARD_APPROVAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /board-approvals/{id}/certify, /rescind"

  - priority: 11
    category: existence
    check: "the AGFiling named by the path segment exists"
    error_id: ERR_AG_FILING_NOT_FOUND
    http_status: 404
    applies_to: "POST /ag-filings/{id}/decision"

  - priority: 12
    category: existence
    check: "the IntegrationTask named by the path segment exists, and depends_on_task_id when supplied resolves to an existing IntegrationTask"
    error_id: ERR_INTEGRATION_TASK_NOT_FOUND
    http_status: 404
    applies_to: "GET /integration-tasks/{id}, POST /integration-tasks, POST /integration-tasks/{id}/start, /complete"

  - priority: 13
    category: auth
    check: "for an entity_backed role (StrategyOfficer, BoardSecretary) the X-User-Id MUST equal Restructuring.initiator_org_id or Restructuring.target_org_id of the deal being acted on; for POST /organizations/{id}/financial-restatement it MUST equal that organizationId. Where the §1.2 transition names ONE specific party, the X-User-Id MUST equal that party and the other party is refused with this same error: /letters-of-intent/{id}/counter and /execute require target_org_id; /letters-of-intent/{id}/revise and /withdraw, POST /restructurings/{id}/select-structure and /consummate require initiator_org_id; POST /board-approvals and its /certify and /rescind actions require the Organization resolved from approving_party. POST /restructurings/{id}/abandon accepts either party."
    error_id: ERR_NOT_DEAL_PARTY
    http_status: 403
    applies_to: "POST /restructurings/{id}/select-structure, /consummate, /abandon, POST /letters-of-intent and its actions, POST /board-approvals and its actions, POST /organizations/{id}/financial-restatement, POST /programs/{id}/continuity-decision, POST /diligence-requests/{id}/respond (either party may respond, so only the two-party membership is checked)"

  - priority: 14
    category: auth
    check: "segregation of duties: the actor must differ from the actor of the paired earlier step. On clear and waive the acting X-User-Id must differ from DiligenceRequest.raised_by_user_id. On certify the supplied certifying_secretary_ref must differ from the BoardApproval.recording_secretary_ref, because a BoardSecretary X-User-Id is the party Organization id and therefore cannot itself distinguish the two staff members."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /diligence-requests/{id}/clear, POST /diligence-requests/{id}/waive, POST /board-approvals/{id}/certify"

  - priority: 15
    category: state
    check: "expected_restructuring_version equals the current Restructuring.version (see §1.2.1)"
    error_id: ERR_STALE_RESTRUCTURING_VERSION
    http_status: 412
    applies_to: "POST /letters-of-intent, POST /board-approvals"

  - priority: 16
    category: state
    check: "Restructuring.status permits the requested operation per the Restructuring state machine"
    error_id: ERR_INVALID_DEAL_STATE
    http_status: 409
    applies_to: "POST /restructurings/{id}/select-structure, /consummate, /abandon, POST /alignment-assessments, POST /letters-of-intent, POST /diligence-requests, POST /board-approvals, POST /ag-filings, POST /integration-tasks, POST /integration-tasks/{id}/start, POST /restricted-funds/{id}/transfer, POST /restricted-funds/{id}/unwind, POST /programs/{id}/continuity-decision"

  - priority: 17
    category: state
    check: "LetterOfIntent.status permits the requested operation; exclusivity_status must be ACTIVE for /counter, /revise and /execute"
    error_id: ERR_INVALID_LETTER_STATE
    http_status: 409
    applies_to: "POST /letters-of-intent/{id}/counter, /revise, /execute, /withdraw"

  - priority: 18
    category: state
    check: "RestrictedFund.transfer_status permits the requested operation per the RestrictedFund state machine. On POST /restricted-funds/{id}/transfer this rule covers ONLY transfer_status IN {TRANSFERRED, RETAINED} - a fund already moved under a deal, or judicially retained forever; the pre-basis states HELD, CONSENT_SOUGHT, CONSENT_DENIED and PETITION_FILED are refused instead by priority 30 with ERR_DONOR_CONSENT_REQUIRED, which names the missing authority rather than the row status."
    error_id: ERR_INVALID_FUND_STATE
    http_status: 409
    applies_to: "POST /restricted-funds/{id}/seek-consent, /record-consent, /file-petition, /record-court-decision, /transfer, /unwind"

  - priority: 19
    category: state
    check: "BoardApproval.status permits the requested operation - certify requires RECORDED, rescind requires CERTIFIED"
    error_id: ERR_INVALID_APPROVAL_STATE
    http_status: 409
    applies_to: "POST /board-approvals/{id}/certify, /rescind"

  - priority: 20
    category: state
    check: "AGFiling.status is SUBMITTED when a regulator decision is recorded"
    error_id: ERR_INVALID_FILING_STATE
    http_status: 409
    applies_to: "POST /ag-filings/{id}/decision"

  - priority: 21
    category: state
    check: "IntegrationTask.status permits the requested operation - start requires PLANNED, complete requires IN_PROGRESS"
    error_id: ERR_INVALID_TASK_STATE
    http_status: 409
    applies_to: "POST /integration-tasks/{id}/start, /complete"

  - priority: 22
    category: state
    check: "DiligenceRequest.status permits the requested operation per the DiligenceRequest state machine: respond requires OPEN or ESCALATED, clear requires RESPONDED, escalate requires OPEN or RESPONDED, waive requires OPEN, RESPONDED or ESCALATED, and a row already in a terminal status (CLEARED or WAIVED) is refused by all four actions"
    error_id: ERR_INVALID_DILIGENCE_STATE
    http_status: 409
    applies_to: "POST /diligence-requests/{id}/respond, /clear, /escalate, /waive"

  - priority: 23
    category: business_referential
    check: "initiator_org_id and target_org_id are different Organizations"
    error_id: ERR_SELF_RESTRUCTURING
    http_status: 422
    applies_to: "POST /restructurings"

  - priority: 24
    category: business_referential
    check: "neither party Organization has affiliation_role in {DISSOLVED, DIVESTED, SUBSIDIARY} - an organization that has already been dissolved, divested or absorbed as a subsidiary cannot restructure again. Concurrent exploratory conversations with different partners are permitted; they are governed instead by the exclusivity rules at priorities 40 and 41."
    error_id: ERR_ORGANIZATION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /restructurings"

  - priority: 25
    category: business_referential
    check: "the ein is not already registered to another Organization"
    error_id: ERR_EIN_ALREADY_REGISTERED
    http_status: 422
    applies_to: "POST /organizations"

  - priority: 26
    category: business_referential
    check: "the RestrictedFund.org_id is one of the two party Organizations of the supplied restructuring_id, and transferred_to_org_id is the other party"
    error_id: ERR_FUND_NOT_DEAL_PARTY_ASSET
    http_status: 422
    applies_to: "POST /restricted-funds/{id}/transfer"

  - priority: 27
    category: business_referential
    check: "the Program.org_id is one of the two party Organizations of the deal, and transferred_to_org_id when supplied is the other party"
    error_id: ERR_PROGRAM_NOT_DEAL_PARTY_ASSET
    http_status: 422
    applies_to: "POST /programs/{id}/continuity-decision"

  - priority: 28
    category: business_referential
    check: "depends_on_task_id, when supplied, belongs to the same Restructuring as the task being created and is not the task itself"
    error_id: ERR_DEPENDENCY_NOT_IN_SAME_DEAL
    http_status: 422
    applies_to: "POST /integration-tasks"

  - priority: 29
    category: business_safety
    check: "on transfer, a fund whose restriction_conflict is true may not be transferred on transfer_basis DONOR_CONSENT - a conflicting restriction can only be released by a judicial modification, so the fund must travel the petition branch and arrive as MODIFIED. Soliciting donor consent on such a fund is still permitted (the donor may consent or refuse); it is the DONOR_CONSENT transfer that is refused, which is why this rule does not name seek-consent: a fund with an unreachable donor is already refused at priority 18."
    error_id: ERR_JUDICIAL_ORDER_REQUIRED
    http_status: 422
    applies_to: "POST /restricted-funds/{id}/transfer"

  - priority: 30
    category: business_safety
    check: "a fund may only be transferred once it holds a transfer_basis - transfer_status must be CONSENT_GRANTED or MODIFIED; a fund still in HELD, CONSENT_SOUGHT, CONSENT_DENIED or PETITION_FILED has neither donor consent nor a judicial order. The same error refuses POST /restricted-funds/{id}/file-petition directly from HELD when donor_of_record_reachable is true or petition_basis is not DONOR_UNREACHABLE: a reachable donor must be asked before a court is."
    error_id: ERR_DONOR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /restricted-funds/{id}/transfer, POST /restricted-funds/{id}/file-petition"

  - priority: 31
    category: business_safety
    check: "historic_dollar_value_cents may not exceed principal_cents + accumulated_appreciation_cents for a PERM_ENDOWMENT, otherwise the judicial spending-rate slice would be computed against a value the fund does not hold"
    error_id: ERR_HDV_EXCEEDS_FUND_VALUE
    http_status: 422
    applies_to: "POST /restricted-funds"

  - priority: 32
    category: business_safety
    check: "Restructuring.ag_review_required is true - an attorney-general filing may not be created for a transaction that involves no AG_REVIEW_STATES party. Such a deal is only ever observable in INTEGRATION (it passes through REGULATORY_REVIEW inside a single request), which is exactly why POST /ag-filings admits INTEGRATION on deal status and lets this rule speak instead of priority 16."
    error_id: ERR_AG_REVIEW_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /ag-filings"

  - priority: 33
    category: business_safety
    check: "the state_code on the filing is the state_code of one of the two party Organizations and is a member of calculations.ag_statutory_waiting_period constants AG_REVIEW_STATES"
    error_id: ERR_AG_STATE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /ag-filings"

  - priority: 34
    category: business_safety
    check: "filing_type equals the required_type derived in calculations.ag_statutory_waiting_period - a transaction at or above AG_PETITION_THRESHOLD_CENTS, or one that transfers any PERM_ENDOWMENT, requires APPROVAL_PETITION rather than NOTICE"
    error_id: ERR_AG_FILING_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /ag-filings"

  - priority: 35
    category: business_safety
    check: "when Restructuring.ag_review_required is true, consummation requires an AGFiling of this deal in status APPROVED or DEEMED_APPROVED and no AGFiling in status OBJECTED"
    error_id: ERR_AG_APPROVAL_MISSING
    http_status: 422
    applies_to: "POST /restructurings/{id}/consummate"

  - priority: 36
    category: business_safety
    check: "conflict_disclosures_count must be greater than or equal to recusals - every recused seat must be backed by a disclosed conflict in the fiduciary duty record, and fiduciary_memo_ref must be a non-blank reference"
    error_id: ERR_CONFLICT_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /board-approvals"

  - priority: 37
    category: business_safety
    check: "votes_for + votes_against + abstentions must not exceed seats_total - recusals"
    error_id: ERR_VOTE_TALLY_EXCEEDS_SEATS
    http_status: 422
    applies_to: "POST /board-approvals"

  - priority: 38
    category: business_safety
    check: "attendance (votes_for + votes_against + abstentions) must be at least quorum_required = ceil((seats_total - recusals) / 2)"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /board-approvals"

  - priority: 39
    category: business_safety
    check: "votes_cast = votes_for + votes_against must be greater than zero - an all-abstain board records no decision, and the approval ratio has no denominator"
    error_id: ERR_NO_ELIGIBLE_VOTES
    http_status: 422
    applies_to: "POST /board-approvals"

  - priority: 40
    category: business_temporal
    check: "the requested exclusivity window [exclusivity_start_date, exclusivity_end_date] must not overlap an ACTIVE exclusivity window of any other Restructuring in which either party Organization is the initiator or the target; both endpoints are inclusive, so windows sharing a single day conflict"
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /letters-of-intent"

  - priority: 41
    category: business_temporal
    check: "for a party pair DIFFERENT from the one on the most recent RELEASED or EXPIRED exclusivity window, the new exclusivity_start_date must be strictly after that window exclusivity_end_date plus EXCLUSIVITY_COOLING_OFF_DAYS = 30 calendar days; a repeat window with the SAME counterparty is exempt from the cooling-off period"
    error_id: ERR_EXCLUSIVITY_COOLING_OFF
    http_status: 409
    applies_to: "POST /letters-of-intent"

  - priority: 42
    category: business_temporal
    check: "the half-open interval [planned_start_date, planned_end_date) must not overlap the interval of any other IntegrationTask sharing the same crew_code whose status is not CANCELLED; adjacency (one task ending on the day the next begins) is allowed"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /integration-tasks"

  - priority: 43
    category: business_constraint
    check: "when depends_on_task_id is set, the predecessor IntegrationTask.status must be COMPLETE before the dependent task may start"
    error_id: ERR_DEPENDENCY_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /integration-tasks/{id}/start"

  - priority: 44
    category: business_constraint
    check: "the structure_type on the request equals the proposed_structure_type of the EXECUTED LetterOfIntent of the highest round_no for this deal"
    error_id: ERR_STRUCTURE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /restructurings/{id}/select-structure"

  - priority: 45
    category: business_constraint
    check: "board_seat_split_initiator must be at least 1 and at most combined_board_seats - 1, so neither party is left with zero seats on the combined board"
    error_id: ERR_SEAT_SPLIT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /letters-of-intent, POST /letters-of-intent/{id}/revise"

  - priority: 46
    category: business_constraint
    check: "Restructuring.restricted_asset_posture must be NOT_ASSESSED (the deal touches no restricted funds at all) or CLEARED - no party RestrictedFund may remain in HELD, CONSENT_SOUGHT, CONSENT_DENIED, CONSENT_GRANTED, PETITION_FILED or MODIFIED"
    error_id: ERR_RESTRICTED_ASSETS_UNRESOLVED
    http_status: 409
    applies_to: "POST /restructurings/{id}/consummate"

  - priority: 47
    category: business_constraint
    check: "every IntegrationTask of this deal must be in status COMPLETE or CANCELLED before consummation; a task still PLANNED, HELD or IN_PROGRESS blocks the transaction"
    error_id: ERR_INTEGRATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /restructurings/{id}/consummate"

  - priority: 48
    category: business_fiscal
    check: "the latest DILIGENCE_ADJUSTED AlignmentAssessment for this deal must exist and its composite_rating must be STRONG or MODERATE; a WEAK or NOT_VIABLE rating cannot support a fiduciary finding that the transaction advances the mission"
    error_id: ERR_ALIGNMENT_RATING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /restructurings/{id}/select-structure"

  - priority: 49
    category: business_fiscal
    check: "the latest DILIGENCE_ADJUSTED AlignmentAssessment reserve_months must be at least RESERVE_FLOOR_MONTHS = 3.00"
    error_id: ERR_RESERVE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /restructurings/{id}/select-structure"

  - priority: 50
    category: business_fiscal
    check: "legal_costs_cents must be at least 0 and the derived transferred_charitable_asset_value_cents must be greater than 0 - an attorney-general filing must recite some transferred charitable asset value"
    error_id: ERR_NO_CHARITABLE_ASSETS_TRANSFERRED
    http_status: 422
    applies_to: "POST /ag-filings"

  - priority: 51
    category: business_temporal
    check: "the requested current_utc must be greater than or equal to the current logical clock value - the logical clock never moves backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is the empty string, so every path below is the full path.
# 52 endpoints: 16 reads, 35 business writes, 1 logical-clock test endpoint.
# =============================================================================

endpoints:
  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: "/organizations/{id}"
    description: "Fetch one Organization including its computed monthly_expense_cents, restricted_corpus_cents, governance_seats, affiliation_role and parent_org_id"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary, DiligenceLead, CharitableTrustCounsel, StateCharitiesRegulator, IntegrationManager]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: GET
    path: "/organizations"
    description: "List Organizations, filterable by structural role, state of incorporation and parent organization (reverse-reachability for Organization.parent_org_id)"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary, DiligenceLead, CharitableTrustCounsel, StateCharitiesRegulator, IntegrationManager]
    code: 200
    input: ["parent_org_id?", "affiliation_role?", "state_code?", "limit?", "offset?"]
    output: Organization[]
    side_effects: []

  - method: GET
    path: "/organizations/{id}/programs"
    description: "List the Programs of one Organization (reverse-reachability for Program.org_id and Program.transferred_to_org_id)"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary, DiligenceLead, IntegrationManager]
    code: 200
    input: ["service_category?", "continuity_status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}"
    description: "Fetch one Restructuring including status, structure_type, round_no, seat pool, restricted_asset_posture, ag_review_required and version (the OCC token for §1.2.1)"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary, DiligenceLead, CharitableTrustCounsel, StateCharitiesRegulator, IntegrationManager]
    code: 200
    input: []
    output: Restructuring
    side_effects: []

  - method: GET
    path: "/restructurings"
    description: "List Restructurings, filterable by either party organization and status (reverse-reachability for Restructuring.initiator_org_id and Restructuring.target_org_id)"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary, DiligenceLead, CharitableTrustCounsel, StateCharitiesRegulator, IntegrationManager]
    code: 200
    input: ["initiator_org_id?", "target_org_id?", "status?", "structure_type?", "limit?", "offset?"]
    output: Restructuring[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}/alignment-assessments"
    description: "List the immutable AlignmentAssessment snapshots of one deal in ascending sequence_no order (reverse-reachability for AlignmentAssessment.restructuring_id)"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary, DiligenceLead]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: AlignmentAssessment[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}/letters-of-intent"
    description: "List the LetterOfIntent rows of one deal in ascending round_no then created_at order (reverse-reachability for LetterOfIntent.restructuring_id)"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary]
    code: 200
    input: ["status?", "exclusivity_status?", "limit?", "offset?"]
    output: LetterOfIntent[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}/diligence-requests"
    description: "List the DiligenceRequest findings of one deal (reverse-reachability for DiligenceRequest.restructuring_id)"
    roles: [PlatformAdmin, StrategyOfficer, DiligenceLead, CharitableTrustCounsel]
    code: 200
    input: ["workstream?", "severity?", "status?", "limit?", "offset?"]
    output: DiligenceRequest[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}/board-approvals"
    description: "List the BoardApproval rows of one deal (reverse-reachability for BoardApproval.restructuring_id)"
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary]
    code: 200
    input: ["approving_party?", "status?", "limit?", "offset?"]
    output: BoardApproval[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}/ag-filings"
    description: "List the AGFiling rows of one deal (reverse-reachability for AGFiling.restructuring_id)"
    roles: [PlatformAdmin, StrategyOfficer, CharitableTrustCounsel, StateCharitiesRegulator]
    code: 200
    input: ["status?", "filing_type?", "limit?", "offset?"]
    output: AGFiling[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}/restricted-funds"
    description: "List every RestrictedFund attached to either party of one deal by org_id or by transferred_to_org_id"
    roles: [PlatformAdmin, StrategyOfficer, CharitableTrustCounsel, StateCharitiesRegulator]
    code: 200
    input: ["transfer_status?", "fund_type?", "limit?", "offset?"]
    output: RestrictedFund[]
    side_effects: []

  - method: GET
    path: "/restricted-funds/{id}"
    description: "Fetch one RestrictedFund including transferable_amount_cents, transferred_amount_cents, retained_amount_cents and unwind_count"
    roles: [PlatformAdmin, StrategyOfficer, CharitableTrustCounsel, StateCharitiesRegulator]
    code: 200
    input: []
    output: RestrictedFund
    side_effects: []

  - method: GET
    path: "/restricted-funds"
    description: "List RestrictedFunds, filterable by holder, recipient and authorising deal (reverse-reachability for RestrictedFund.org_id, RestrictedFund.transferred_to_org_id and RestrictedFund.transfer_restructuring_id)"
    roles: [PlatformAdmin, StrategyOfficer, CharitableTrustCounsel, StateCharitiesRegulator]
    code: 200
    input: ["org_id?", "transferred_to_org_id?", "transfer_restructuring_id?", "transfer_status?", "fund_type?", "limit?", "offset?"]
    output: RestrictedFund[]
    side_effects: []

  - method: GET
    path: "/integration-tasks/{id}"
    description: "Fetch one IntegrationTask including its crew window, dependency and status"
    roles: [PlatformAdmin, StrategyOfficer, IntegrationManager]
    code: 200
    input: []
    output: IntegrationTask
    side_effects: []

  - method: GET
    path: "/integration-tasks"
    description: "List IntegrationTasks, filterable by deal, predecessor, crew and workstream (reverse-reachability for IntegrationTask.restructuring_id and IntegrationTask.depends_on_task_id)"
    roles: [PlatformAdmin, StrategyOfficer, IntegrationManager]
    code: 200
    input: ["restructuring_id?", "depends_on_task_id?", "crew_code?", "workstream?", "status?", "limit?", "offset?"]
    output: IntegrationTask[]
    side_effects: []

  - method: GET
    path: "/restructurings/{id}/dossier"
    description: "Computed read: the reconciliation dossier for one deal. Exposes the two conserved quantities (pair_restricted_corpus_cents and seat_ledger_total) and the SCREENING vs DILIGENCE_ADJUSTED composite delta in a single response so a test can assert conservation without summing across list endpoints."
    roles: [PlatformAdmin, StrategyOfficer, BoardSecretary, CharitableTrustCounsel, StateCharitiesRegulator]
    code: 200
    input: []
    output: "{ restructuring_id: string, deal_status: string, structure_type: string, round_no: integer, screening_composite_score: number, diligence_adjusted_composite_score: number, composite_delta: number, reserve_months: number, combined_monthly_expense_cents: integer, restricted_asset_posture: string, unresolved_restricted_fund_count: integer, pair_restricted_corpus_cents: integer, reserved_seat_pool: integer, certified_allocated_seats_total: integer, seat_ledger_total: integer, combined_board_seats: integer }"
    side_effects: []

  # --------------------------------------------------- organizations, programs
  - method: POST
    path: "/organizations"
    description: "Register a nonprofit Organization. monthly_expense_cents is computed from annual_expense_cents; restricted_corpus_cents and governance_seats start at 0 and affiliation_role starts at INDEPENDENT."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, ein, state_code, mission_code, annual_expense_cents, unrestricted_net_assets_cents]
    output: Organization
    side_effects:
      - "computes monthly_expense_cents per calculations.combined_operating_reserve_months step 1"
      - "rejects a duplicate ein with ERR_EIN_ALREADY_REGISTERED"

  - method: POST
    path: "/organizations/{id}/financial-restatement"
    description: "Restate an Organization's audited financials. Business endpoint used both by finance staff and by tests that need a specific reserve position."
    roles: [PlatformAdmin, StrategyOfficer]
    code: 200
    input: [annual_expense_cents, unrestricted_net_assets_cents, restatement_reason]
    output: Organization
    side_effects:
      - "recomputes monthly_expense_cents per calculations.combined_operating_reserve_months step 1"
      - "does NOT retroactively change any existing AlignmentAssessment, which is immutable"
      - "increments Organization.version by 1"

  - method: POST
    path: "/programs"
    description: "Register a Program operated by one Organization. Programs are the input set of the program-overlap component."
    roles: [PlatformAdmin, StrategyOfficer, IntegrationManager]
    code: 201
    input: [org_id, name, service_category, county_code, annual_expense_cents, clients_served]
    output: Program
    side_effects:
      - "sets continuity_status = ACTIVE and transferred_to_org_id = null"

  - method: POST
    path: "/programs/{id}/continuity-decision"
    description: "Conditional action: record the integration-planning decision for one Program of a deal party. disposition TRANSFER moves it to PLANNED_TRANSFER, disposition SUNSET moves it to PLANNED_SUNSET (which drops it from the DILIGENCE_ADJUSTED inclusion set)."
    roles: [IntegrationManager]
    code: 200
    input: [restructuring_id, disposition]
    output: Program
    side_effects:
      - "sets continuity_status per the Program state machine"
      - "changes the inclusion set of every LATER AlignmentAssessment with variant DILIGENCE_ADJUSTED"
      - "increments Program.version by 1"

  # -------------------------------------------------------- the deal lifecycle
  - method: POST
    path: "/restructurings"
    description: "Open a confidential exploratory conversation between two Organizations. Created in status EXPLORATORY with round_no 1, reserved_seat_pool 0 and restricted_asset_posture NOT_ASSESSED."
    roles: [StrategyOfficer]
    code: 201
    input: ["initiator_org_id", "target_org_id", "confidentiality_tier?"]
    output: Restructuring
    side_effects:
      - "sets status = EXPLORATORY, round_no = 1, version = 1"
      - "sets ag_review_required = true when either party state_code is in AG_REVIEW_STATES"
      - "rejects initiator_org_id == target_org_id with ERR_SELF_RESTRUCTURING"

  - method: POST
    path: "/alignment-assessments"
    description: "Create an immutable AlignmentAssessment snapshot. variant SCREENING is the pre-diligence rationale; variant DILIGENCE_ADJUSTED is the post-diligence snapshot that gates structure selection. Permitted only while restructuring.status IN {EXPLORATORY, RATIONALE_BUILT, LOI_NEGOTIATION, DILIGENCE, DILIGENCE_CLOSED}, else ERR_INVALID_DEAL_STATE."
    roles: [StrategyOfficer]
    code: 201
    input: [restructuring_id, variant]
    output: AlignmentAssessment
    side_effects:
      - "computes every scoring field per calculations.mission_program_alignment_score and calculations.combined_operating_reserve_months"
      - "assigns sequence_no = 1 + the count of existing assessments for this deal"
      - "advances the Restructuring EXPLORATORY -> RATIONALE_BUILT on the first SCREENING assessment"
      - "the row has no version field and no update endpoint (common_fields: false)"

  - method: POST
    path: "/restructurings/{id}/select-structure"
    description: "Conditional action: commit the deal to one of the four legal structures and record the unrestricted charitable asset value the transaction will move. Permitted only while restructuring.status == DILIGENCE_CLOSED, else ERR_INVALID_DEAL_STATE. Gated on the executed letter's proposed structure, on the latest DILIGENCE_ADJUSTED rating and on the reserve floor."
    roles: [StrategyOfficer]
    code: 200
    input: [structure_type, unrestricted_transfer_value_cents]
    output: Restructuring
    side_effects:
      - "sets structure_type and status = STRUCTURE_SELECTED"
      - "rejects a structure that differs from the executed letter with ERR_STRUCTURE_TYPE_MISMATCH"
      - "rejects a WEAK or NOT_VIABLE latest DILIGENCE_ADJUSTED rating with ERR_ALIGNMENT_RATING_INSUFFICIENT"
      - "rejects reserve_months below 3.00 with ERR_RESERVE_BELOW_FLOOR"
      - "increments Restructuring.version by 1"

  - method: POST
    path: "/restructurings/{id}/consummate"
    description: "Close the transaction. Sets both parties' affiliation_role, resolves every Program continuity decision, and for PARENT_SUBSIDIARY sets target.parent_org_id."
    roles: [StrategyOfficer]
    code: 200
    input: [closing_memo_ref]
    output: Restructuring
    side_effects:
      - "sets status = CONSUMMATED and both parties' affiliation_role per structure_type"
      - "resolves every PLANNED_TRANSFER Program to TRANSFERRED with transferred_to_org_id, and every PLANNED_SUNSET Program to SUNSET"
      - "increments Restructuring.version by 1 and Organization.version by 1 on both parties"

  - method: POST
    path: "/restructurings/{id}/abandon"
    description: "Abandon the deal from any non-terminal status. Withdraws live letters, supersedes live approvals, cancels live integration tasks and unwinds every executed restricted-fund transfer."
    roles: [StrategyOfficer]
    code: 200
    input: [abandonment_reason]
    output: Restructuring
    side_effects:
      - "sets status = ABANDONED and abandonment_reason"
      - "cascades to LetterOfIntent, BoardApproval, IntegrationTask and RestrictedFund exactly as the §1.2 abandon transition describes"
      - "increments Restructuring.version by 1"

  # ------------------------------------------------------- letters of intent --
  - method: POST
    path: "/letters-of-intent"
    description: "Issue the round's letter of intent. Permitted only while restructuring.status IN {RATIONALE_BUILT, LOI_NEGOTIATION}, else ERR_INVALID_DEAL_STATE. OCC-guarded create-with-supersede: expected_restructuring_version must equal the Restructuring's current version, because a new round legitimately supersedes the prior round's letter."
    roles: [StrategyOfficer]
    code: 201
    input: [restructuring_id, expected_restructuring_version, proposed_structure_type, combined_board_seats, board_seat_split_initiator, exclusivity_days, exclusivity_start_date]
    output: LetterOfIntent
    side_effects:
      - "sets round_no = restructuring.round_no, status = ISSUED, exclusivity_status = ACTIVE, counter_round_count = 0"
      - "computes exclusivity_end_date = exclusivity_start_date + exclusivity_days - 1 (both endpoints inclusive)"
      - "computes expires_at = exclusivity_end_date at 00:00:00.000Z"
      - "advances the Restructuring RATIONALE_BUILT -> LOI_NEGOTIATION on the first letter"
      - "supersedes any prior ISSUED or COUNTERED letter of a LOWER round_no to SUPERSEDED with exclusivity_status RELEASED"
      - "rejects a stale expected_restructuring_version with ERR_STALE_RESTRUCTURING_VERSION (412)"
      - "increments Restructuring.version by 1"

  - method: POST
    path: "/letters-of-intent/{id}/counter"
    description: "The non-issuing party counters the letter. Dimension A only: status ISSUED -> COUNTERED with exclusivity_status untouched."
    roles: [StrategyOfficer]
    code: 200
    input: [counter_note]
    output: LetterOfIntent
    side_effects:
      - "sets status = COUNTERED, countered_by_party = TARGET, increments counter_round_count by 1"
      - "leaves exclusivity_status at ACTIVE"
      - "increments LetterOfIntent.version by 1"

  - method: POST
    path: "/letters-of-intent/{id}/revise"
    description: "The issuing party revises the board seat split and re-issues. Completes the ISSUED -> COUNTERED -> ISSUED cycle without resetting the exclusivity window."
    roles: [StrategyOfficer]
    code: 200
    input: [board_seat_split_initiator]
    output: LetterOfIntent
    side_effects:
      - "overwrites board_seat_split_initiator and sets status = ISSUED"
      - "leaves counter_round_count, exclusivity_start_date, exclusivity_end_date and exclusivity_status untouched"
      - "increments LetterOfIntent.version by 1"

  - method: POST
    path: "/letters-of-intent/{id}/execute"
    description: "The counterparty countersigns. Moves the deal into diligence and seeds the seat pool from combined_board_seats."
    roles: [StrategyOfficer]
    code: 200
    input: ["executed_note?"]
    output: LetterOfIntent
    side_effects:
      - "sets status = EXECUTED and executed_at = current_utc"
      - "advances the Restructuring LOI_NEGOTIATION -> DILIGENCE, copying combined_board_seats and setting reserved_seat_pool = combined_board_seats"
      - "increments LetterOfIntent.version by 1 and Restructuring.version by 1"

  - method: POST
    path: "/letters-of-intent/{id}/withdraw"
    description: "The issuing party withdraws the letter from ISSUED or COUNTERED, releasing the exclusivity window."
    roles: [StrategyOfficer]
    code: 200
    input: [withdrawal_reason]
    output: LetterOfIntent
    side_effects:
      - "sets status = WITHDRAWN and exclusivity_status = RELEASED"
      - "increments LetterOfIntent.version by 1"

  # ------------------------------------------------------------ due diligence --
  - method: POST
    path: "/diligence-requests"
    description: "Raise a diligence finding in one of the five workstreams. Permitted while restructuring.status IN {DILIGENCE, DILIGENCE_CLOSED, STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW}, else ERR_INVALID_DEAL_STATE - post-signing findings are a real occurrence and are the entry point of the depth-5 escalation cascade. Creating a finding while the deal is DILIGENCE_CLOSED cycles the deal back to DILIGENCE; from the later statuses the deal status is left untouched until the finding is escalated."
    roles: [DiligenceLead]
    code: 201
    input: [restructuring_id, workstream, severity, summary, exposure_cents]
    output: DiligenceRequest
    side_effects:
      - "sets status = OPEN and raised_by_user_id = X-User-Id"
      - "cycles the Restructuring DILIGENCE_CLOSED -> DILIGENCE when the deal had closed diligence"
      - "changes open_diligence_exposure_cents for every LATER DILIGENCE_ADJUSTED AlignmentAssessment"

  - method: POST
    path: "/diligence-requests/{id}/respond"
    description: "The counterparty answers a finding. Records the response reference and moves OPEN -> RESPONDED."
    roles: [StrategyOfficer, DiligenceLead]
    code: 200
    input: [response_ref]
    output: DiligenceRequest
    side_effects:
      - "sets status = RESPONDED and response_ref"
      - "does NOT mutate the Restructuring row: a response alone never closes diligence"
      - "increments DiligenceRequest.version by 1"

  - method: POST
    path: "/diligence-requests/{id}/clear"
    description: "Segregation of duties: a DiligenceLead other than the one who raised the finding clears it. Clearing the last open finding bubbles the deal DILIGENCE -> DILIGENCE_CLOSED."
    roles: [DiligenceLead]
    code: 200
    input: [clearance_note]
    output: DiligenceRequest
    side_effects:
      - "sets status = CLEARED and cleared_by_user_id = X-User-Id"
      - "rejects X-User-Id == raised_by_user_id with ERR_SEGREGATION_OF_DUTIES"
      - "bubbles the Restructuring DILIGENCE -> DILIGENCE_CLOSED when no finding of this deal remains in OPEN, RESPONDED or ESCALATED"
      - "removes this finding's exposure_cents from open_diligence_exposure_cents for later DILIGENCE_ADJUSTED assessments"
      - "increments DiligenceRequest.version by 1"

  - method: POST
    path: "/diligence-requests/{id}/escalate"
    description: "Conditional action and depth-5 cascade origin. Escalating a CRITICAL finding forces the deal back to LOI_NEGOTIATION, supersedes the executed letter, supersedes every certified board approval and returns their seats."
    roles: [DiligenceLead]
    code: 200
    input: [escalation_reason]
    output: DiligenceRequest
    side_effects:
      - "CASCADE HOP 1: sets status = ESCALATED and escalation_reason"
      - "CASCADE HOP 2: when severity == CRITICAL, sets Restructuring.status = LOI_NEGOTIATION and increments round_no by 1"
      - "CASCADE HOP 3: the EXECUTED LetterOfIntent becomes SUPERSEDED with exclusivity_status RELEASED"
      - "CASCADE HOP 4: every CERTIFIED BoardApproval of the deal becomes SUPERSEDED"
      - "CASCADE HOP 5: each superseded approval returns allocated_seats to reserved_seat_pool and resets Organization.governance_seats to 0"
      - "a non-CRITICAL escalation stops after hop 1 and leaves the Restructuring untouched"
      - "increments DiligenceRequest.version by 1 and, when CRITICAL, Restructuring.version by 1"

  - method: POST
    path: "/diligence-requests/{id}/waive"
    description: "Segregation of duties: a DiligenceLead other than the one who raised the finding waives it with a written justification, taking it to the terminal WAIVED state."
    roles: [DiligenceLead]
    code: 200
    input: [waiver_justification]
    output: DiligenceRequest
    side_effects:
      - "sets status = WAIVED and waiver_justification"
      - "rejects X-User-Id == raised_by_user_id with ERR_SEGREGATION_OF_DUTIES"
      - "bubbles the Restructuring DILIGENCE -> DILIGENCE_CLOSED when no other finding remains open"
      - "increments DiligenceRequest.version by 1"

  # -------------------------------------- restricted gifts and endowment funds --
  - method: POST
    path: "/restricted-funds"
    description: "Register a restricted gift or endowment held by one Organization. transfer_status starts at HELD and the fund's value is added to that Organization's restricted_corpus_cents."
    roles: [PlatformAdmin, CharitableTrustCounsel]
    code: 201
    input: [org_id, fund_name, fund_type, principal_cents, accumulated_appreciation_cents, historic_dollar_value_cents, restriction_purpose_code, restriction_conflict, donor_of_record_reachable]
    output: RestrictedFund
    side_effects:
      - "sets transfer_status = HELD, transferable_amount_cents = 0, transferred_amount_cents = 0, retained_amount_cents = 0, unwind_count = 0"
      - "recomputes the holder Organization.restricted_corpus_cents per calculations.organization_restricted_corpus"
      - "rejects historic_dollar_value_cents above principal_cents + accumulated_appreciation_cents with ERR_HDV_EXCEEDS_FUND_VALUE"

  - method: POST
    path: "/restricted-funds/{id}/seek-consent"
    description: "Open the donor-consent branch. Requires transfer_status HELD and a reachable donor of record, else ERR_INVALID_FUND_STATE; a conflicting restriction does not block the solicitation itself, only a later DONOR_CONSENT transfer (priority 29)."
    roles: [CharitableTrustCounsel]
    code: 200
    input: [consent_method]
    output: RestrictedFund
    side_effects:
      - "sets transfer_status = CONSENT_SOUGHT and consent_method"
      - "increments RestrictedFund.version by 1"

  - method: POST
    path: "/restricted-funds/{id}/record-consent"
    description: "Branch point: decision GRANTED forks to CONSENT_GRANTED and fixes transferable_amount_cents at the full fund value; decision DENIED forks to CONSENT_DENIED, which is the only state from which a judicial petition may be filed."
    roles: [CharitableTrustCounsel]
    code: 200
    input: [decision]
    output: RestrictedFund
    side_effects:
      - "sets consent_signed_at = current_utc regardless of decision; any client-supplied consent_signed_at is ignored"
      - "on GRANTED sets transfer_status = CONSENT_GRANTED, consent_decision = GRANTED, and transferable_amount_cents per the DONOR_CONSENT variant of calculations.restricted_fund_transferable_amount"
      - "on DENIED sets transfer_status = CONSENT_DENIED and leaves transferable_amount_cents at 0"
      - "recomputes Restructuring.restricted_asset_posture on every deal in which the holder is a party, which turns BLOCKED on a denial"
      - "increments RestrictedFund.version by 1"

  - method: POST
    path: "/restricted-funds/{id}/file-petition"
    description: "File a judicial modification petition after a consent denial, on one of the four statutory bases."
    roles: [CharitableTrustCounsel]
    code: 200
    input: [petition_basis, court_docket_no]
    output: RestrictedFund
    side_effects:
      - "sets transfer_status = PETITION_FILED, petition_basis, court_docket_no and petition_filed_at = current_utc"
      - "increments RestrictedFund.version by 1"

  - method: POST
    path: "/restricted-funds/{id}/record-court-decision"
    description: "Join point: GRANTED or GRANTED_WITH_CONDITIONS moves the fund to MODIFIED with the judicially capped transferable amount; DENIED moves it to the terminal RETAINED state."
    roles: [CharitableTrustCounsel]
    code: 200
    input: ["decision", "modified_purpose_code?"]
    output: RestrictedFund
    side_effects:
      - "on GRANTED or GRANTED_WITH_CONDITIONS sets transfer_status = MODIFIED, court_decision, modified_purpose_code, and transferable_amount_cents per the JUDICIAL_MODIFICATION variant of calculations.restricted_fund_transferable_amount"
      - "on DENIED sets transfer_status = RETAINED and retained_amount_cents = principal_cents + accumulated_appreciation_cents"
      - "recomputes Restructuring.restricted_asset_posture on every deal in which the holder is a party"
      - "increments RestrictedFund.version by 1"

  - method: POST
    path: "/restricted-funds/{id}/transfer"
    description: "Depth-4 cascade origin. Executes the charitable asset transfer to the counterparty under the deal's authority, on either transfer_basis."
    roles: [CharitableTrustCounsel]
    code: 200
    input: [restructuring_id, transfer_basis]
    output: RestrictedFund
    side_effects:
      - "CASCADE HOP 1: sets transfer_status = TRANSFERRED, transferred_to_org_id, transfer_restructuring_id, transferred_amount_cents = transferable_amount_cents, retained_amount_cents = fund value - transferred_amount_cents"
      - "CASCADE HOP 2: recomputes restricted_corpus_cents on BOTH party Organizations, conserving their pair total"
      - "CASCADE HOP 3: recomputes Restructuring.unresolved_restricted_fund_count and restricted_asset_posture, flipping RESTRICTED_PENDING -> CLEARED at zero"
      - "CASCADE HOP 4: every PROGRAM_CONTINUITY IntegrationTask of the deal in status HELD becomes PLANNED with held_reason null"
      - "increments RestrictedFund.version by 1, Restructuring.version by 1 and Organization.version by 1 on both parties"

  - method: POST
    path: "/restricted-funds/{id}/unwind"
    description: "Compensating action for a transfer. Conditional return state: back to CONSENT_GRANTED when the basis was DONOR_CONSENT, back to MODIFIED when it was JUDICIAL_MODIFICATION. Restores the pair restricted corpus exactly."
    roles: [CharitableTrustCounsel]
    code: 200
    input: [unwind_reason]
    output: RestrictedFund
    side_effects:
      - "returns transfer_status to CONSENT_GRANTED or MODIFIED depending on the recorded transfer_basis"
      - "clears transferred_to_org_id, transfer_restructuring_id and transfer_basis; zeroes transferred_amount_cents and retained_amount_cents; increments unwind_count by 1"
      - "leaves transferable_amount_cents unchanged so a re-transfer releases the identical amount"
      - "restores restricted_corpus_cents on both parties to their exact pre-transfer values"
      - "reverts Restructuring.restricted_asset_posture CLEARED -> RESTRICTED_PENDING and returns PROGRAM_CONTINUITY tasks PLANNED -> HELD"
      - "increments RestrictedFund.version by 1 and Restructuring.version by 1"

  # ------------------------------------------------- board approvals (SoD) -----
  - method: POST
    path: "/board-approvals"
    description: "Record one organization's board vote with its fiduciary duty documentation. Permitted only while restructuring.status IN {STRUCTURE_SELECTED, BOARD_APPROVAL}, else ERR_INVALID_DEAL_STATE. OCC-guarded create-with-supersede: a re-vote for the same party legitimately supersedes the prior approval, so expected_restructuring_version must be current."
    roles: [BoardSecretary]
    code: 201
    input: [restructuring_id, expected_restructuring_version, approving_party, seats_total, recusals, votes_for, votes_against, abstentions, conflict_disclosures_count, recording_secretary_ref]
    output: BoardApproval
    side_effects:
      - "computes eligible_seats, quorum_required, votes_cast, required_ratio, approval_ratio and decision per calculations.board_vote_outcome"
      - "lands in status RECORDED when decision == APPROVED and directly in the terminal status REJECTED when decision == REJECTED"
      - "supersedes any prior RECORDED or CERTIFIED approval of the same deal and approving_party, returning its allocated_seats to reserved_seat_pool"
      - "advances the Restructuring STRUCTURE_SELECTED -> BOARD_APPROVAL on the first approval of the deal"
      - "rejects a stale expected_restructuring_version with ERR_STALE_RESTRUCTURING_VERSION (412)"
      - "increments Restructuring.version by 1"

  - method: POST
    path: "/board-approvals/{id}/certify"
    description: "Segregation of duties: a board secretary other than the one who recorded the minutes certifies them, pins the composite score that supported the fiduciary finding, and draws the party's seats from the reserved pool. certifying_secretary_ref MUST differ from the recording_secretary_ref stored on the approval."
    roles: [BoardSecretary]
    code: 200
    input: [fiduciary_memo_ref, certifying_secretary_ref]
    output: BoardApproval
    side_effects:
      - "sets status = CERTIFIED, fiduciary_memo_ref and certifying_secretary_ref"
      - "sets pinned_composite_score and pinned_assessment_sequence_no from the latest DILIGENCE_ADJUSTED AlignmentAssessment"
      - "allocates seats per calculations.governance_seat_allocation, decrementing reserved_seat_pool and setting Organization.governance_seats"
      - "bubbles the Restructuring BOARD_APPROVAL -> REGULATORY_REVIEW once BOTH parties hold a CERTIFIED approval"
      - "increments BoardApproval.version by 1, Restructuring.version by 1 and Organization.version by 1"

  - method: POST
    path: "/board-approvals/{id}/rescind"
    description: "Compensating action for certification. Returns the allocated seats to the pool and reverts the deal from REGULATORY_REVIEW to BOARD_APPROVAL."
    roles: [BoardSecretary]
    code: 200
    input: [rescission_reason]
    output: BoardApproval
    side_effects:
      - "sets status = RESCINDED and rescission_reason"
      - "returns allocated_seats to reserved_seat_pool, zeroes allocated_seats and resets Organization.governance_seats to 0"
      - "reverts the Restructuring REGULATORY_REVIEW -> BOARD_APPROVAL"
      - "increments BoardApproval.version by 1, Restructuring.version by 1 and Organization.version by 1"

  # ------------------------------------------- state attorney general filings --
  - method: POST
    path: "/ag-filings"
    description: "Notice or petition the state attorney general for the transfer of charitable assets. Permitted while restructuring.status IN {REGULATORY_REVIEW, INTEGRATION}, else ERR_INVALID_DEAL_STATE. INTEGRATION is admitted deliberately: a deal whose ag_review_required is false never rests in REGULATORY_REVIEW (it continues straight to INTEGRATION in the same request), so refusing it here on deal status would make priority 32 ERR_AG_REVIEW_NOT_REQUIRED unreachable - the substantive rule must be the one that speaks. A late filing on a deal that DOES require review is likewise admitted, and an objection on it blocks consummation per priority 35. Created directly in status SUBMITTED with the fee, consideration and statutory review deadline all computed server-side. Several filings may coexist for one deal (for example a notice per party state)."
    roles: [CharitableTrustCounsel]
    code: 201
    input: [restructuring_id, state_code, filing_type, legal_costs_cents]
    output: AGFiling
    side_effects:
      - "computes transferred_charitable_asset_value_cents, provisional_consideration_cents, ag_filing_fee_cents, closing_costs_cents and total_consideration_cents per calculations.ag_consideration_and_filing_fee"
      - "computes judicial_basis_present, validates filing_type against the required type, and computes statutory_waiting_days and review_deadline_at per calculations.ag_statutory_waiting_period"
      - "sets status = SUBMITTED and submitted_at = current_utc"

  - method: POST
    path: "/ag-filings/{id}/decision"
    description: "Segregation of duties: the StateCharitiesRegulator (never the filing counsel) records the attorney general's decision. APPROVED releases the deal into integration; OBJECTED blocks consummation."
    roles: [StateCharitiesRegulator]
    code: 200
    input: ["decision", "objection_reason?"]
    output: AGFiling
    side_effects:
      - "sets status = APPROVED or OBJECTED, objection_reason when objecting, and decision_recorded_at = current_utc"
      - "on APPROVED advances the Restructuring REGULATORY_REVIEW -> INTEGRATION"
      - "increments AGFiling.version by 1 and, on approval, Restructuring.version by 1"

  # ------------------------------------------------------ integration planning --
  - method: POST
    path: "/integration-tasks"
    description: "Plan an integration task in one of the four workstreams over a half-open crew window [planned_start_date, planned_end_date). Permitted while restructuring.status IN {STRUCTURE_SELECTED, BOARD_APPROVAL, REGULATORY_REVIEW, INTEGRATION}, else ERR_INVALID_DEAL_STATE - integration planning starts once the structure is fixed. Conditional initial state: a PROGRAM_CONTINUITY task is created HELD while the deal restricted_asset_posture is RESTRICTED_PENDING or BLOCKED, otherwise PLANNED."
    roles: [IntegrationManager]
    code: 201
    input: ["restructuring_id", "workstream", "crew_code", "title", "planned_start_date", "planned_end_date", "depends_on_task_id?"]
    output: IntegrationTask
    side_effects:
      - "sets status = HELD with held_reason when workstream == PROGRAM_CONTINUITY and the deal posture is RESTRICTED_PENDING or BLOCKED; otherwise status = PLANNED with held_reason null"
      - "rejects a crew window that overlaps a non-CANCELLED task sharing the same crew_code with ERR_CREW_WINDOW_CONFLICT; windows that merely touch at a single boundary date do not conflict"
      - "rejects a depends_on_task_id belonging to another deal with ERR_DEPENDENCY_NOT_IN_SAME_DEAL"

  - method: POST
    path: "/integration-tasks/{id}/start"
    description: "Begin an integration task. Blocked until its declared predecessor is COMPLETE."
    roles: [IntegrationManager]
    code: 200
    input: ["started_note?"]
    output: IntegrationTask
    side_effects:
      - "sets status = IN_PROGRESS and started_at = current_utc"
      - "rejects a predecessor that is not COMPLETE with ERR_DEPENDENCY_NOT_COMPLETE"
      - "increments IntegrationTask.version by 1"

  - method: POST
    path: "/integration-tasks/{id}/complete"
    description: "Finish an integration task. When every task of the deal is COMPLETE or CANCELLED the deal becomes eligible for consummation."
    roles: [IntegrationManager]
    code: 200
    input: ["completion_note?"]
    output: IntegrationTask
    side_effects:
      - "sets status = COMPLETE and completed_at = current_utc"
      - "increments IntegrationTask.version by 1"

  # ----------------------------------------- operator sweep and logical clock --
  - method: POST
    path: "/regulatory-sweeps"
    description: "Operator checkpoint that applies every time-driven transition at the current logical clock: deems unanswered attorney-general filings approved once the statutory review deadline has arrived, lapses expired letters of intent, and expires elapsed exclusivity windows (dimension B only, leaving the letters' negotiation status untouched)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_at: datetime, deemed_approved_filing_ids: string[], lapsed_letter_of_intent_ids: string[], expired_exclusivity_letter_of_intent_ids: string[] }"
    side_effects:
      - "for every AGFiling in SUBMITTED with current_utc >= review_deadline_at: sets status = DEEMED_APPROVED and advances the deal REGULATORY_REVIEW -> INTEGRATION"
      - "for every LetterOfIntent in ISSUED or COUNTERED with current_utc >= expires_at: sets status = LAPSED and exclusivity_status = RELEASED"
      - "for every LetterOfIntent with exclusivity_status ACTIVE whose exclusivity_end_date is strictly before the calendar date of current_utc: sets exclusivity_status = EXPIRED and leaves status untouched"
      - "is idempotent: a second sweep at the same clock value returns three empty id lists and mutates nothing"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint for the logical clock. The server's startup default clock value is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. The clock is monotonic: a requested value earlier than the current value is rejected with ERR_CLOCK_NOT_MONOTONIC."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "sets the logical clock, which every subsequent current_utc read (submitted_at, executed_at, started_at, completed_at, decision_recorded_at, petition_filed_at, sweep comparisons) observes"
      - "does NOT itself apply any time-driven transition; POST /regulatory-sweeps must be called for that"

# =============================================================================
# §1.6 Error Code Catalog (51 codes, one per §1.4 priority)
# =============================================================================

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Id or X-User-Role header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the supplied role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, unknown enum member, out-of-range integer, malformed date or timestamp, or limit/offset outside 1-100 / >= 0"
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "an Organization referenced by path segment or by org_id / initiator_org_id / target_org_id / transferred_to_org_id does not exist"
  - id: ERR_RESTRUCTURING_NOT_FOUND
    http: 404
    condition: "the Restructuring referenced by path segment or by restructuring_id does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the Program referenced by path segment does not exist"
  - id: ERR_LETTER_OF_INTENT_NOT_FOUND
    http: 404
    condition: "the LetterOfIntent referenced by path segment does not exist"
  - id: ERR_DILIGENCE_REQUEST_NOT_FOUND
    http: 404
    condition: "the DiligenceRequest referenced by path segment does not exist"
  - id: ERR_RESTRICTED_FUND_NOT_FOUND
    http: 404
    condition: "the RestrictedFund referenced by path segment does not exist"
  - id: ERR_BOARD_APPROVAL_NOT_FOUND
    http: 404
    condition: "the BoardApproval referenced by path segment does not exist"
  - id: ERR_AG_FILING_NOT_FOUND
    http: 404
    condition: "the AGFiling referenced by path segment does not exist"
  - id: ERR_INTEGRATION_TASK_NOT_FOUND
    http: 404
    condition: "the IntegrationTask referenced by path segment, or by depends_on_task_id, does not exist"
  - id: ERR_NOT_DEAL_PARTY
    http: 403
    condition: "an entity_backed actor's X-User-Id is neither the initiator nor the target organization of the deal being acted on, or is not the organization named in the path"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-Id equals DiligenceRequest.raised_by_user_id on clear or waive, or the supplied certifying_secretary_ref equals BoardApproval.recording_secretary_ref on certify"
  - id: ERR_STALE_RESTRUCTURING_VERSION
    http: 412
    condition: "expected_restructuring_version does not equal the Restructuring's current version on a create-with-supersede write (§1.2.1)"
  - id: ERR_INVALID_DEAL_STATE
    http: 409
    condition: "Restructuring.status does not permit the requested operation"
  - id: ERR_INVALID_LETTER_STATE
    http: 409
    condition: "LetterOfIntent.status does not permit the operation, or its exclusivity_status is not ACTIVE where the operation requires an active window"
  - id: ERR_INVALID_FUND_STATE
    http: 409
    condition: "RestrictedFund.transfer_status does not permit the requested operation"
  - id: ERR_INVALID_APPROVAL_STATE
    http: 409
    condition: "BoardApproval.status does not permit the requested operation"
  - id: ERR_INVALID_FILING_STATE
    http: 409
    condition: "the AGFiling is no longer SUBMITTED when a regulator decision is recorded"
  - id: ERR_INVALID_TASK_STATE
    http: 409
    condition: "IntegrationTask.status does not permit the requested operation"
  - id: ERR_INVALID_DILIGENCE_STATE
    http: 409
    condition: "DiligenceRequest.status does not permit the requested operation - clear was attempted on a row that is not RESPONDED, escalate on a row that is neither OPEN nor RESPONDED, respond on a row that is neither OPEN nor ESCALATED, or any of the four actions on a row already CLEARED or WAIVED"
  - id: ERR_SELF_RESTRUCTURING
    http: 422
    condition: "initiator_org_id equals target_org_id"
  - id: ERR_ORGANIZATION_NOT_ELIGIBLE
    http: 422
    condition: "a party's affiliation_role is DISSOLVED, DIVESTED or SUBSIDIARY"
  - id: ERR_EIN_ALREADY_REGISTERED
    http: 422
    condition: "another Organization already holds the supplied ein"
  - id: ERR_FUND_NOT_DEAL_PARTY_ASSET
    http: 422
    condition: "the fund's org_id is not one of the two party Organizations of the supplied restructuring_id"
  - id: ERR_PROGRAM_NOT_DEAL_PARTY_ASSET
    http: 422
    condition: "the Program's org_id is not one of the two party Organizations of the supplied restructuring_id"
  - id: ERR_DEPENDENCY_NOT_IN_SAME_DEAL
    http: 422
    condition: "depends_on_task_id names a task belonging to a different Restructuring, or the task itself"
  - id: ERR_JUDICIAL_ORDER_REQUIRED
    http: 422
    condition: "a transfer on transfer_basis DONOR_CONSENT was attempted on a fund with restriction_conflict true, which only a judicial modification can release"
  - id: ERR_DONOR_CONSENT_REQUIRED
    http: 422
    condition: "a transfer was attempted on a fund that holds neither donor consent (CONSENT_GRANTED) nor a judicial modification (MODIFIED), or a judicial petition was filed straight from HELD while donor_of_record_reachable was true or on a petition_basis other than DONOR_UNREACHABLE"
  - id: ERR_HDV_EXCEEDS_FUND_VALUE
    http: 422
    condition: "historic_dollar_value_cents exceeds principal_cents + accumulated_appreciation_cents"
  - id: ERR_AG_REVIEW_NOT_REQUIRED
    http: 422
    condition: "an attorney-general filing was created for a Restructuring whose ag_review_required is false"
  - id: ERR_AG_STATE_NOT_APPLICABLE
    http: 422
    condition: "the filing state_code is not a party's state of incorporation, or is not one of the AG_REVIEW_STATES"
  - id: ERR_AG_FILING_TYPE_MISMATCH
    http: 422
    condition: "filing_type NOTICE was used where the transferred value reaches AG_PETITION_THRESHOLD_CENTS or a PERM_ENDOWMENT was transferred, or APPROVAL_PETITION was used where NOTICE is required"
  - id: ERR_AG_APPROVAL_MISSING
    http: 422
    condition: "consummation was attempted on a deal requiring attorney-general review with no APPROVED or DEEMED_APPROVED filing, or with an OBJECTED filing on record"
  - id: ERR_CONFLICT_DISCLOSURE_MISSING
    http: 422
    condition: "conflict_disclosures_count is lower than recusals, or fiduciary_memo_ref is blank on certification"
  - id: ERR_VOTE_TALLY_EXCEEDS_SEATS
    http: 422
    condition: "votes_for + votes_against + abstentions exceeds seats_total - recusals"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "attendance is below ceil((seats_total - recusals) / 2)"
  - id: ERR_NO_ELIGIBLE_VOTES
    http: 422
    condition: "votes_for + votes_against is zero, leaving the approval ratio with no denominator"
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "the requested inclusive exclusivity window overlaps an ACTIVE window of another Restructuring involving either party"
  - id: ERR_EXCLUSIVITY_COOLING_OFF
    http: 409
    condition: "a window with a DIFFERENT counterparty starts within 30 calendar days after the end of the party's most recent RELEASED or EXPIRED window"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open crew window overlaps a non-CANCELLED IntegrationTask sharing the same crew_code"
  - id: ERR_DEPENDENCY_NOT_COMPLETE
    http: 409
    condition: "the task's declared predecessor is not COMPLETE"
  - id: ERR_STRUCTURE_TYPE_MISMATCH
    http: 422
    condition: "the selected structure_type differs from the executed letter's proposed_structure_type"
  - id: ERR_SEAT_SPLIT_OUT_OF_RANGE
    http: 422
    condition: "board_seat_split_initiator is below 1 or above combined_board_seats - 1"
  - id: ERR_RESTRICTED_ASSETS_UNRESOLVED
    http: 409
    condition: "restricted_asset_posture is RESTRICTED_PENDING or BLOCKED at consummation"
  - id: ERR_INTEGRATION_INCOMPLETE
    http: 409
    condition: "an IntegrationTask of the deal is still PLANNED, HELD or IN_PROGRESS at consummation"
  - id: ERR_ALIGNMENT_RATING_INSUFFICIENT
    http: 422
    condition: "no DILIGENCE_ADJUSTED AlignmentAssessment exists, or the latest one is rated WEAK or NOT_VIABLE"
  - id: ERR_RESERVE_BELOW_FLOOR
    http: 422
    condition: "the latest DILIGENCE_ADJUSTED reserve_months is below RESERVE_FLOOR_MONTHS (3.00)"
  - id: ERR_NO_CHARITABLE_ASSETS_TRANSFERRED
    http: 422
    condition: "the derived transferred_charitable_asset_value_cents on an attorney-general filing is zero"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested logical clock value is earlier than the current value"

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================

roles:
  - name: PlatformAdmin
    description: "Registry operator. Onboards organizations, programs and restricted funds, and runs the regulatory sweep and logical clock. Never a party to a deal and never votes."
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations"
      - "POST /regulatory-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /organizations/{id}/financial-restatement"
      - "POST /programs"
      - "POST /restricted-funds"
      - "every GET endpoint"

  - name: StrategyOfficer
    description: "The acting officer of a party Organization. Opens the exploratory conversation, negotiates letters of intent, selects the structure, and consummates or abandons the deal. X-User-Id is the Organization id, so ownership checks compare it against initiator_org_id and target_org_id."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /restructurings"
      - "POST /alignment-assessments"
      - "POST /letters-of-intent"
      - "POST /letters-of-intent/{id}/counter"
      - "POST /letters-of-intent/{id}/revise"
      - "POST /letters-of-intent/{id}/execute"
      - "POST /letters-of-intent/{id}/withdraw"
      - "POST /restructurings/{id}/select-structure"
      - "POST /restructurings/{id}/consummate"
      - "POST /restructurings/{id}/abandon"
    shared_operations:
      - "POST /organizations/{id}/financial-restatement"
      - "POST /programs"
      - "POST /diligence-requests/{id}/respond"
      - "every GET endpoint except GET /integration-tasks scoped reads it does not need"

  - name: BoardSecretary
    description: "The board secretary function of a party Organization. Records the board vote and certifies the minutes and fiduciary memo. X-User-Id is the party Organization id, so the two-signature control runs on the recording_secretary_ref / certifying_secretary_ref pair rather than on X-User-Id."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /board-approvals"
      - "POST /board-approvals/{id}/certify"
      - "POST /board-approvals/{id}/rescind"
    shared_operations:
      - "GET /restructurings/{id}"
      - "GET /restructurings/{id}/board-approvals"
      - "GET /restructurings/{id}/letters-of-intent"
      - "GET /restructurings/{id}/alignment-assessments"
      - "GET /restructurings/{id}/dossier"

  - name: DiligenceLead
    description: "Independent diligence reviewer across finance, contracts, restricted funds, litigation and workforce. Raises findings, escalates them, and may clear or waive only findings raised by a DIFFERENT user id."
    identity: "opaque"
    exclusive_operations:
      - "POST /diligence-requests"
      - "POST /diligence-requests/{id}/clear"
      - "POST /diligence-requests/{id}/escalate"
      - "POST /diligence-requests/{id}/waive"
    shared_operations:
      - "POST /diligence-requests/{id}/respond"
      - "GET /restructurings/{id}"
      - "GET /restructurings/{id}/diligence-requests"
      - "GET /organizations/{id}/programs"

  - name: CharitableTrustCounsel
    description: "Counsel for restricted gifts and endowments. Runs the donor-consent and judicial-modification branches, executes and unwinds transfers, and submits attorney-general filings. May never record the regulator's own decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /restricted-funds/{id}/seek-consent"
      - "POST /restricted-funds/{id}/record-consent"
      - "POST /restricted-funds/{id}/file-petition"
      - "POST /restricted-funds/{id}/record-court-decision"
      - "POST /restricted-funds/{id}/transfer"
      - "POST /restricted-funds/{id}/unwind"
      - "POST /ag-filings"
    shared_operations:
      - "POST /restricted-funds"
      - "GET /restricted-funds and GET /restricted-funds/{id}"
      - "GET /restructurings/{id}/restricted-funds"
      - "GET /restructurings/{id}/ag-filings"
      - "GET /restructurings/{id}/dossier"

  - name: StateCharitiesRegulator
    description: "The state attorney general's charities bureau. Reads filings and records their decisions. Holds no write access to any other entity, so it can never manufacture the transaction it reviews."
    identity: "opaque"
    exclusive_operations:
      - "POST /ag-filings/{id}/decision"
    shared_operations:
      - "GET /restructurings/{id}"
      - "GET /restructurings/{id}/ag-filings"
      - "GET /restructurings/{id}/restricted-funds"
      - "GET /restricted-funds and GET /restricted-funds/{id}"
      - "GET /restructurings/{id}/dossier"

  - name: IntegrationManager
    description: "Post-close integration lead across staffing, systems, branding and program continuity. Plans and runs integration tasks and records program continuity decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs/{id}/continuity-decision"
      - "POST /integration-tasks"
      - "POST /integration-tasks/{id}/start"
      - "POST /integration-tasks/{id}/complete"
    shared_operations:
      - "POST /programs"
      - "GET /integration-tasks and GET /integration-tasks/{id}"
      - "GET /organizations/{id}/programs"
