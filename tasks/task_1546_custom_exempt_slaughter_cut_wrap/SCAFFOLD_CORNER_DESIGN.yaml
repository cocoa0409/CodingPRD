  # ===================================================================
  # Calculations (Table 3)
  # ===================================================================
  - section: calculations
    instances:
      - name: tier_boundary_above_200lb_uses_marginal_rate
        claim_type: correct_result
        grounds: [calculations.invoice_settlement]
        distinguishing_aspect: "Exactly at 200 lb the whole weight bills at RATE_A; at 201.0 lb the 1.0 lb overflow bills at the lower RATE_B (marginal, not average): HOG 17000 vs 17075 cents."
        test_recipe:
          setup: ["two independent HOG fixtures at finalize: animal A hanging 200.0 lb, animal B hanging 201.0 lb (separate customers, cap-2 day)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { cA: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { cB: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${cA}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${cA}", captures: { apptA: $.data.id } }
