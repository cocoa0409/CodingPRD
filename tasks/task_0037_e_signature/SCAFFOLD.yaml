scenario: |
  Electronic Signature Platform: template management with template upload, variable
  field definition, signature-position pre-configuration, template categorization,
  version control, and template-permission scope; signing workflow orchestration with
  sequential signing/parallel countersigning/seam signing across pages, signer role
  definition, signing order configuration, conditional branching, and workflow
  modification rules; identity authentication with multi-factor authentication
  (SMS/face recognition/CA certificate/bank card), real-name verification,
  organizational identity binding, authorization for legal-representative delegation,
  and authentication record archiving; signing timestamp with trusted timestamp
  authority integration, server-side time anchoring, signing-act timestamp embedding,
  and timestamp verification; contract status tracking with full lifecycle states
  (draft/pending-sign/partially-signed/completed/expired/voided), real-time status
  push to participants, signing-progress query, and historical-version retrieval;
  expiration reminder with reminder rules by interval, multi-channel notification
  (SMS/email/IM), escalation reminder, expiration auto-voiding, and re-initiation
  workflow; evidence preservation with hash-based document fingerprint,
  signing-process log, third-party notary or blockchain evidence, evidence-package
  generation, and judicial-use evidence export; event-driven synchronization with IM,
  identity verification, and contract management systems; audit logging for signing
  actions and template changes.

domain_name: "e-signature"
api_prefix: "/contracts"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_deferred_actions
    - idempotency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # Contract.reinitiated_from_contract_id → Contract.id (re-initiation cycle)
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim per skill spec)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Template
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Template display name (unique within owner_org_id)."
        constraints: "1..120 chars; unique per (owner_org_id, name)."
      - name: category
        type: enum
        source: input
        description: "Business category for filtering."
        constraints: "One of: HR, SALES, PROCUREMENT, LEGAL, FINANCE, OTHER."
      - name: owner_org_id
        type: string
        source: input
        description: "Organization that owns the template."
      - name: permission_scope
        type: enum
        source: input
        description: "Who may instantiate Contracts from this template."
        default: ORG_ONLY
        constraints: "One of: ORG_ONLY, CROSS_ORG, PUBLIC."
      - name: latest_version_number
        type: integer
        source: computed
        description: "Highest TemplateVersion.version_number under this template."
        default: 0
      - name: published_version_number
        type: integer
        source: computed
        description: "Version_number of the most-recently PUBLISHED TemplateVersion. Null if no published version."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Aggregate template status."
        default: ACTIVE
        constraints: "One of: ACTIVE, ARCHIVED."

  - name: TemplateVersion
    parent: Template
    common_fields: true
    fields:
      - name: template_id
        type: string
        source: input
        description: "Foreign key to Template.id."
      - name: version_number
        type: integer
        source: computed
        description: "Monotonically increasing per template, starts at 1."
      - name: document_blob_sha256
        type: string
        source: input
        description: "SHA-256 hex of the uploaded document bytes."
        constraints: "Exactly 64 lowercase hex chars."
      - name: page_count
        type: integer
        source: input
        description: "Number of pages in the uploaded document."
        constraints: "page_count >= 1."
      - name: variable_fields
        type: array
        source: input
        description: "List of {name, type, required} for fillable placeholders."
      - name: signature_positions
        type: array
        source: input
        description: "Pre-configured rectangles {role_key, page, x, y, w, h, kind} where kind is one of NORMAL or SEAM. SEAM positions span page boundaries."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of this version."
        default: DRAFT
        constraints: "One of: DRAFT, PUBLISHED, DEPRECATED."

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: template_version_id
        type: string
        source: input
        description: "FK to TemplateVersion.id (must be PUBLISHED at instantiation time)."
      - name: initiator_user_id
        type: string
        source: system
        description: "Authenticated user that initiated the Contract (org_user, copied from X-User-ID)."
      - name: initiator_org_id
        type: string
        source: system
        description: "Organization the initiator belongs to."
      - name: title
        type: string
        source: input
        description: "Display title for tracking."
        constraints: "1..200 chars."
      - name: variable_values
        type: object
        source: input
        description: "Key-value map matching TemplateVersion.variable_fields."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status."
        default: DRAFT
        constraints: "One of: DRAFT, PENDING_SIGN, PARTIALLY_SIGNED, COMPLETED, EXPIRED, VOIDED."
      - name: expires_at
        type: datetime
        source: input
        description: "Hard deadline; auto-voids on sweep when now() >= expires_at and status NOT IN {COMPLETED, VOIDED}."
      - name: activated_at
        type: datetime
        source: system
        description: "Set when DRAFT → PENDING_SIGN; null in DRAFT."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Set when status flips to COMPLETED."
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: "Set when status flips to VOIDED."
        default: null
      - name: void_reason
        type: enum
        source: system
        description: "Why the contract was voided."
        default: null
        constraints: "One of: MANUAL, EXPIRED_AUTO, REJECTED_BY_PARTY, null."
      - name: reinitiated_from_contract_id
        type: string
        source: input
        description: "Self-referential FK to a previously VOIDED/EXPIRED Contract.id. Null for fresh contracts."
        default: null
      - name: document_fingerprint_sha256
        type: string
        source: computed
        description: "Final document hash computed at PENDING_SIGN entry; pinned for the rest of the lifecycle."
        default: null
      - name: signing_progress_percent
        type: number
        source: computed
        description: "Chronological signed weight as a percent (0..100, 2 decimals)."
        default: 0.00
      - name: evidence_strength_score
        type: number
        source: computed
        description: "Weighted score in [0, 100]; recomputed on every signing event."
        default: 0.00
      - name: evidence_tier
        type: enum
        source: computed
        description: "Banded tier of evidence_strength_score."
        default: BRONZE
        constraints: "One of: BRONZE, SILVER, GOLD, NOTARIZED."

  - name: SigningStep
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK to Contract.id."
      - name: step_index
        type: integer
        source: input
        description: "Order within the contract; starts at 1, strictly increasing."
        constraints: "step_index >= 1; (contract_id, step_index) is unique."
      - name: mode
        type: enum
        source: input
        description: "How parties within the step combine."
        constraints: "One of: SEQUENTIAL, PARALLEL_COUNTERSIGN."
      - name: branch_condition
        type: object
        source: input
        description: "Optional {variable, operator, value, on_false_skip}; if evaluated false, the step is auto-skipped."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Step lifecycle."
        default: PENDING
        constraints: "One of: PENDING, ACTIVE, SIGNED, SKIPPED, REJECTED."
      - name: activated_at
        type: datetime
        source: system
        description: "Set when status flips to ACTIVE."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Set when status flips to SIGNED, SKIPPED, or REJECTED."
        default: null

  - name: SigningParty
    parent: SigningStep
    common_fields: true
    fields:
      - name: signing_step_id
        type: string
        source: input
        description: "FK to SigningStep.id."
      - name: contract_id
        type: string
        source: system
        description: "Denormalized FK to Contract.id (matches SigningStep.contract_id)."
      - name: role_key
        type: string
        source: input
        description: "Stable role key (e.g., 'PARTY_A', 'WITNESS_1') aligned with TemplateVersion.signature_positions."
      - name: signer_type
        type: enum
        source: input
        description: "Who is signing."
        constraints: "One of: INDIVIDUAL, ORG_LEGAL_REP, ORG_DELEGATE."
      - name: signer_user_id
        type: string
        source: input
        description: "FK to OrgUser.id of the actual signer."
      - name: signer_org_id
        type: string
        source: input
        description: "Org the signer represents; required if signer_type IN {ORG_LEGAL_REP, ORG_DELEGATE}, else null."
        default: null
      - name: delegation_authorization_id
        type: string
        source: input
        description: "FK to a notarized delegation record; required if signer_type = ORG_DELEGATE."
        default: null
      - name: required_auth_factors
        type: array
        source: input
        description: "Subset of {SMS, FACE, CA_CERT, BANK_CARD}; multi-factor when length >= 2."
        constraints: "Length 1..4; values unique."
      - name: status
        type: enum
        source: computed
        description: "Party lifecycle."
        default: WAITING
        constraints: "One of: WAITING, AUTHENTICATING, SIGNED, DECLINED, SKIPPED."
      - name: signed_at
        type: datetime
        source: system
        description: "Set when status flips to SIGNED."
        default: null
      - name: timestamp_token_id
        type: string
        source: system
        description: "FK to TimestampToken.id embedded at signing instant."
        default: null
      - name: identity_verification_id
        type: string
        source: system
        description: "FK to the IdentityVerification used to authorize this signature."
        default: null

  - name: IdentityVerification
    parent: null
    common_fields: false   # append-only, immutable record
    fields:
      - name: subject_user_id
        type: string
        source: input
        description: "User being verified."
      - name: contract_id
        type: string
        source: input
        description: "Contract this verification serves; archived alongside Contract."
        default: null
      - name: signing_party_id
        type: string
        source: input
        description: "FK to SigningParty.id this verification was used for; null until consumed."
        default: null
      - name: factors_attempted
        type: array
        source: input
        description: "Ordered list of {factor, outcome} where outcome ∈ {PASS, FAIL}."
      - name: factors_passed
        type: array
        source: computed
        description: "Subset of factors_attempted where outcome = PASS, deduplicated."
      - name: real_name_match
        type: boolean
        source: computed
        description: "Whether the legal name on the verified ID matches subject_user_id's registered legal_name."
      - name: org_binding_verified
        type: boolean
        source: computed
        description: "True iff signer_type ∈ {ORG_LEGAL_REP, ORG_DELEGATE} and the org tie has been confirmed."
        default: false
      - name: identity_strength
        type: enum
        source: computed
        description: "Banded outcome used in evidence scoring."
        constraints: "One of: WEAK, STRONG, EXTRA_STRONG."
      - name: result
        type: enum
        source: computed
        description: "Final verification result."
        constraints: "One of: VERIFIED, FAILED."
      - name: archived_at
        type: datetime
        source: system
        description: "Set on creation; immutable archive marker."

  - name: TimestampToken
    parent: null
    common_fields: false   # immutable TSA artifact
    fields:
      - name: contract_id
        type: string
        source: input
        description: "Contract this token attests to."
      - name: signing_party_id
        type: string
        source: input
        description: "Party whose act is timestamped."
      - name: server_anchor_at
        type: datetime
        source: system
        description: "Server clock at the moment the signing act was recorded."
      - name: tsa_anchor_at
        type: datetime
        source: input
        description: "Trusted Timestamp Authority's signed time."
      - name: tsa_provider
        type: string
        source: input
        description: "Identifier for the TSA provider used."
      - name: tsa_token_value
        type: string
        source: input
        description: "Opaque token string returned by the TSA."
      - name: hash_signed
        type: string
        source: input
        description: "SHA-256 hex of the data the TSA signed (must equal Contract.document_fingerprint_sha256 at the time of issue)."
      - name: drift_seconds
        type: number
        source: computed
        description: "abs(tsa_anchor_at - server_anchor_at) in seconds; computed on insert."
      - name: verification_status
        type: enum
        source: computed
        description: "Result of token verification."
        default: VALID
        constraints: "One of: VALID, INVALID."

  - name: EvidencePackage
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK to Contract.id; one EvidencePackage per Contract."
      - name: status
        type: enum
        source: computed
        description: "Generation lifecycle."
        default: PENDING
        constraints: "One of: PENDING, GENERATING, SEALED, EXPORTED."
      - name: package_sha256
        type: string
        source: computed
        description: "Hex digest over the canonical evidence bundle; set on SEALED."
        default: null
      - name: notary_provider
        type: enum
        source: input
        description: "Third-party preservation channel."
        default: NONE
        constraints: "One of: NONE, NOTARY_PUBLIC, BLOCKCHAIN."
      - name: notary_reference
        type: string
        source: input
        description: "External reference id (notary case number or blockchain tx hash); required when notary_provider != NONE."
        default: null
      - name: sealed_at
        type: datetime
        source: system
        description: "Set when status flips to SEALED."
        default: null
      - name: exported_at
        type: datetime
        source: system
        description: "Set when status flips to EXPORTED (judicial export)."
        default: null

  - name: ReminderRule
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK to Contract.id."
      - name: interval_hours
        type: integer
        source: input
        description: "Cadence between reminders."
        constraints: "1 <= interval_hours <= 168."
      - name: channels
        type: array
        source: input
        description: "Notification channels."
        constraints: "Non-empty subset of {SMS, EMAIL, IM}; values unique."
      - name: escalation_after_misses
        type: integer
        source: input
        description: "After this many unanswered reminders, escalate (extra channel + initiator notification)."
        constraints: "0 <= escalation_after_misses <= 10."
      - name: enabled
        type: boolean
        source: input
        description: "Whether the rule is active."
        default: true
      - name: last_fired_at
        type: datetime
        source: system
        description: "Server time of the most recent ReminderEvent firing."
        default: null
      - name: misses_count
        type: integer
        source: computed
        description: "Number of reminders fired since the last party signed; resets on any SigningParty.SIGNED."
        default: 0

  - name: ReminderEvent
    parent: ReminderRule
    common_fields: false   # append-only log
    fields:
      - name: reminder_rule_id
        type: string
        source: input
        description: "FK to ReminderRule.id."
      - name: contract_id
        type: string
        source: system
        description: "Denormalized FK to Contract.id."
      - name: fired_at
        type: datetime
        source: system
        description: "Server time of the firing."
      - name: channels_used
        type: array
        source: system
        description: "Channels actually invoked (escalation may add INITIATOR_IM)."
      - name: escalated
        type: boolean
        source: system
        description: "Whether this event applied escalation rules."
        default: false
      - name: idempotency_key
        type: string
        source: input
        description: "Caller-provided key (e.g., {rule_id}:{slot}) ensuring at-least-once safety."
        constraints: "Unique per ReminderRule."

  - name: AuditLog
    parent: null
    common_fields: false   # append-only, immutable
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK to Contract.id; null for template-scoped events."
        default: null
      - name: template_id
        type: string
        source: input
        description: "FK to Template.id; null for contract-scoped events."
        default: null
      - name: actor_user_id
        type: string
        source: input
        description: "User performing the action."
      - name: actor_role
        type: string
        source: input
        description: "Role active at the time of the action."
      - name: action
        type: enum
        source: input
        description: "Action category."
        constraints: "One of: TEMPLATE_PUBLISHED, TEMPLATE_DEPRECATED, CONTRACT_INITIATED, CONTRACT_ACTIVATED, PARTY_SIGNED, PARTY_REJECTED, CONTRACT_VOIDED, CONTRACT_EXPIRED_AUTO, CONTRACT_REINITIATED, EVIDENCE_SEALED, EVIDENCE_EXPORTED, REMINDER_FIRED."
      - name: payload_sha256
        type: string
        source: system
        description: "Hex digest of the canonical JSON payload at the time of recording (tamper-evident)."
      - name: prev_log_sha256
        type: string
        source: system
        description: "payload_sha256 of the immediately preceding AuditLog (chained per (contract_id || template_id))."
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: "Server time of the event."

  - name: OrgUser
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal real name on registered ID."
        constraints: "1..120 chars."
      - name: org_id
        type: string
        source: input
        description: "Organization id."
      - name: org_role
        type: enum
        source: input
        description: "Organizational rank within org."
        constraints: "One of: LEGAL_REP, AUTHORIZED_DELEGATE, EMPLOYEE."
      - name: registered_factors
        type: array
        source: input
        description: "Subset of {SMS, FACE, CA_CERT, BANK_CARD} the user has registered."
      - name: status
        type: enum
        source: computed
        description: "Account status."
        default: ACTIVE
        constraints: "One of: ACTIVE, SUSPENDED."

# =============================================================================
# 1.2 State Machines
# =============================================================================
state_machines:
  - entity: TemplateVersion
    initial_state: DRAFT
    terminal_states: [DEPRECATED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /templates/{id}/versions/{vid}/publish"
        actor: TemplateAdmin
        preconditions:
          - "TemplateVersion.status == DRAFT"
          - "TemplateVersion.signature_positions length >= 1"
          - "Acting role is TemplateAdmin (segregation: same user MUST NOT be the actor of any subsequent CONTRACT_INITIATED on this template_version_id — enforced at contract creation)."
        side_effects:
          - "Template.published_version_number := this.version_number"
          - "AuditLog appended (action=TEMPLATE_PUBLISHED)"
      - from: PUBLISHED
        to: DEPRECATED
        trigger: "POST /templates/{id}/versions/{vid}/deprecate"
        actor: TemplateAdmin
        preconditions:
          - "TemplateVersion.status == PUBLISHED"
          - "No Contract in status IN {DRAFT, PENDING_SIGN, PARTIALLY_SIGNED} references this TemplateVersion.id"
        side_effects:
          - "If Template.published_version_number == this.version_number then set Template.published_version_number := null"
          - "AuditLog appended (action=TEMPLATE_DEPRECATED)"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGN
        trigger: "POST /contracts/{id}/activate"
        actor: ContractInitiator
        preconditions:
          - "Contract.status == DRAFT"
          - "Referenced TemplateVersion.status == PUBLISHED"
          - "At least one SigningStep exists with step_index = 1"
          - "Every SigningStep has at least one SigningParty"
          - "All variable_values match TemplateVersion.variable_fields (required-set complete)"
          - "Acting user is NOT the TemplateAdmin who PUBLISHED the referenced TemplateVersion (segregation of duties)"
          - "now() < Contract.expires_at"
        side_effects:
          - "Contract.activated_at := now()"
          - "Contract.document_fingerprint_sha256 := compute_document_fingerprint() [calc: document_fingerprint_hash]"
          - "Earliest-step (step_index=1) SigningStep transitions PENDING → ACTIVE — see SigningStep.PENDING_to_ACTIVE for its own preconditions and side_effects"
          - "AuditLog appended (action=CONTRACT_ACTIVATED)"
      - from: PENDING_SIGN
        to: PARTIALLY_SIGNED
        trigger: "system: first SigningParty.SIGNED while not all signed"
        actor: system
        preconditions:
          - "exists SigningParty with status = SIGNED"
          - "exists SigningParty with status NOT IN {SIGNED, SKIPPED}"
        side_effects:
          - "Contract.signing_progress_percent recomputed [calc: signing_progress_percent]"
          - "Contract.evidence_strength_score and evidence_tier recomputed [calc: evidence_strength_score]"
      - from: PARTIALLY_SIGNED
        to: PARTIALLY_SIGNED
        trigger: "system: any subsequent SigningParty.SIGNED while still incomplete"
        actor: system
        preconditions:
          - "exists SigningParty with status NOT IN {SIGNED, SKIPPED}"
        side_effects:
          - "Contract.signing_progress_percent recomputed"
          - "Contract.evidence_strength_score and evidence_tier recomputed"
      - from: PARTIALLY_SIGNED
        to: COMPLETED
        trigger: "system: last SigningParty.SIGNED with no remaining required parties"
        actor: system
        preconditions:
          - "All SigningParty across all SigningSteps have status IN {SIGNED, SKIPPED}"
          - "All SigningStep with branch_condition evaluated have status IN {SIGNED, SKIPPED}"
        side_effects:
          - "Contract.completed_at := now()"
          - "Contract.signing_progress_percent := 100.00"
          - "Contract.evidence_strength_score and evidence_tier finalized"
          - "EvidencePackage transitions PENDING → GENERATING — see its own row for preconditions and side_effects (Cascade hop 1 of 2 for transitive cascade ‘contract_complete_to_evidence_sealed’)"
          - "AuditLog appended (action=CONTRACT_INITIATED-COMPLETED-marker)"
      - from: PENDING_SIGN
        to: COMPLETED
        trigger: "system: only one party and that party signs"
        actor: system
        preconditions:
          - "All SigningParty have status IN {SIGNED, SKIPPED}"
        side_effects:
          - "Same as PARTIALLY_SIGNED → COMPLETED"
      - from: PENDING_SIGN
        to: VOIDED
        trigger: "POST /_sweep/run with now() >= Contract.expires_at  OR  POST /contracts/{id}/void OR system: any SigningParty.DECLINED"
        actor: system | ContractInitiator
        preconditions:
          - "Contract.status == PENDING_SIGN"
          - "For EXPIRED_AUTO: now() >= Contract.expires_at"
          - "For MANUAL: actor is ContractInitiator AND no SigningParty has status = SIGNED yet"
          - "For REJECTED_BY_PARTY: triggered by a SigningParty.DECLINED side-effect"
        side_effects:
          - "Contract.voided_at := now()"
          - "Contract.void_reason := EXPIRED_AUTO | MANUAL | REJECTED_BY_PARTY"
          - "All non-terminal SigningSteps cascade to status SKIPPED; all non-terminal SigningParty cascade to SKIPPED"
          - "All ReminderRule.enabled := false"
          - "AuditLog appended (action=CONTRACT_VOIDED or CONTRACT_EXPIRED_AUTO)"
      - from: PARTIALLY_SIGNED
        to: VOIDED
        trigger: "POST /_sweep/run with now() >= Contract.expires_at  OR  system: any SigningParty.DECLINED"
        actor: system
        preconditions:
          - "Contract.status == PARTIALLY_SIGNED"
        side_effects:
          - "Same as PENDING_SIGN → VOIDED, but void_reason cannot be MANUAL"

  - entity: SigningStep
    initial_state: PENDING
    terminal_states: [SIGNED, SKIPPED, REJECTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system: prior step terminal OR contract activated and step_index=1"
        actor: system
        preconditions:
          - "All SigningStep with step_index < this.step_index are in terminal states"
          - "Branch condition evaluates true OR branch_condition is null"
          - "Contract.status IN {PENDING_SIGN, PARTIALLY_SIGNED}"
        side_effects:
          - "SigningStep.activated_at := now()"
          - "All child SigningParty.status flips WAITING → AUTHENTICATING (parallel countersign) OR only the next role in sequential order (sequential mode)"
      - from: PENDING
        to: SKIPPED
        trigger: "system: branch condition evaluates false"
        actor: system
        preconditions:
          - "branch_condition is non-null AND evaluates false against Contract.variable_values"
        side_effects:
          - "All child SigningParty cascade to SKIPPED"
          - "Next eligible step transitions PENDING → ACTIVE (Cascade hop 2 of transitive cascade ‘branch_skip_to_next_step_activation’)"
      - from: ACTIVE
        to: SIGNED
        trigger: "system: all required SigningParty have status IN {SIGNED, SKIPPED}"
        actor: system
        preconditions:
          - "Every SigningParty under this step has status IN {SIGNED, SKIPPED}"
        side_effects:
          - "SigningStep.completed_at := now()"
          - "Next SigningStep (lowest step_index with status=PENDING) transitions PENDING → ACTIVE or PENDING → SKIPPED per branch evaluation"
      - from: ACTIVE
        to: REJECTED
        trigger: "system: any SigningParty in this step transitions to DECLINED"
        actor: system
        preconditions:
          - "exists SigningParty under this step with status = DECLINED"
        side_effects:
          - "SigningStep.completed_at := now()"
          - "All other SigningParty under this step cascade to SKIPPED"
          - "Contract transitions {PENDING_SIGN, PARTIALLY_SIGNED} → VOIDED with void_reason=REJECTED_BY_PARTY (Cascade hop final)"

  - entity: SigningParty
    initial_state: WAITING
    terminal_states: [SIGNED, DECLINED, SKIPPED]
    transitions:
      - from: WAITING
        to: AUTHENTICATING
        trigger: "system: parent SigningStep entered ACTIVE (parallel) OR sequential predecessor SIGNED"
        actor: system
        preconditions:
          - "Parent SigningStep.status == ACTIVE"
          - "(Parent.mode == PARALLEL_COUNTERSIGN) OR (Parent.mode == SEQUENTIAL AND no earlier party in this step has status NOT IN {SIGNED, SKIPPED})"
        side_effects: []
      - from: AUTHENTICATING
        to: SIGNED
        trigger: "POST /signing-parties/{id}/sign"
        actor: Signer
        preconditions:
          - "SigningParty.status == AUTHENTICATING"
          - "X-User-ID == SigningParty.signer_user_id (or X-User-ID is the LEGAL_REP delegating to ORG_DELEGATE per delegation_authorization_id)"
          - "Latest IdentityVerification for (subject_user_id, contract_id, signing_party_id=null) has result=VERIFIED with factors_passed ⊇ required_auth_factors"
          - "now() < Contract.expires_at"
          - "Contract.status IN {PENDING_SIGN, PARTIALLY_SIGNED}"
        side_effects:
          - "SigningParty.signed_at := now()"
          - "TimestampToken row created (server_anchor_at=now(), tsa_anchor_at from input, hash_signed=Contract.document_fingerprint_sha256)"
          - "SigningParty.timestamp_token_id := the new token id"
          - "SigningParty.identity_verification_id := the consumed IdentityVerification.id (its signing_party_id is set on this same write)"
          - "Contract.signing_progress_percent recomputed"
          - "Contract.evidence_strength_score and evidence_tier recomputed"
          - "ReminderRule.misses_count := 0 for all rules under this contract"
          - "AuditLog appended (action=PARTY_SIGNED)"
          - "Parent SigningStep re-evaluates ACTIVE → SIGNED — see SigningStep.ACTIVE_to_SIGNED (Cascade hop 1 of transitive cascade ‘party_signed_to_contract_completion’)"
      - from: AUTHENTICATING
        to: DECLINED
        trigger: "POST /signing-parties/{id}/decline"
        actor: Signer
        preconditions:
          - "SigningParty.status == AUTHENTICATING"
          - "X-User-ID matches signer_user_id (or authorized delegate)"
        side_effects:
          - "AuditLog appended (action=PARTY_REJECTED)"
          - "Parent SigningStep transitions ACTIVE → REJECTED (Cascade hop 1)"
      - from: WAITING
        to: SKIPPED
        trigger: "system: parent step transitioned to SKIPPED or REJECTED"
        actor: system
        preconditions:
          - "Parent SigningStep.status IN {SKIPPED, REJECTED}"
        side_effects: []

  - entity: EvidencePackage
    initial_state: PENDING
    terminal_states: [EXPORTED]
    transitions:
      - from: PENDING
        to: GENERATING
        trigger: "system: Contract → COMPLETED OR Contract → VOIDED"
        actor: system
        preconditions:
          - "Contract.status IN {COMPLETED, VOIDED}"
          - "EvidencePackage.status == PENDING"
        side_effects: []
      - from: GENERATING
        to: SEALED
        trigger: "POST /contracts/{id}/evidence/seal"
        actor: EvidenceArchivist
        preconditions:
          - "EvidencePackage.status == GENERATING"
          - "If notary_provider != NONE then notary_reference is non-empty"
          - "Acting user is NOT the same user as Contract.initiator_user_id (segregation of duties)"
        side_effects:
          - "EvidencePackage.package_sha256 computed over {document_fingerprint, all TimestampTokens, all IdentityVerifications, audit_log_chain_tip}"
          - "EvidencePackage.sealed_at := now()"
          - "AuditLog appended (action=EVIDENCE_SEALED)"
      - from: SEALED
        to: EXPORTED
        trigger: "POST /contracts/{id}/evidence/export"
        actor: EvidenceArchivist
        preconditions:
          - "EvidencePackage.status == SEALED"
          - "Acting user is EvidenceArchivist"
        side_effects:
          - "EvidencePackage.exported_at := now()"
          - "AuditLog appended (action=EVIDENCE_EXPORTED)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two simultaneous POST /signing-parties/{id}/sign on the same party id."
    guarantee: "Exactly one signing succeeds; the second is rejected because the party is no longer in AUTHENTICATING."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SigningParty.status."

  - scenario: "POST /signing-parties/{id}/sign and POST /signing-parties/{id}/decline arrive concurrently for the same party."
    guarantee: "Exactly one of {sign, decline} wins; the loser is rejected due to terminal state."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SigningParty.status."

  - scenario: "POST /contracts/{id}/void by the initiator races a system-driven sweep that auto-voids on expiry; both target the same Contract."
    guarantee: "Exactly one void writer succeeds; the second sees a terminal state."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Contract.status; void_reason reflects the winner."

  - scenario: "Two ReminderRule firings under the same rule with the same idempotency_key arrive concurrently."
    guarantee: "Exactly one ReminderEvent row is created; the duplicate is rejected."
    error_id: ERR_DUPLICATE_REMINDER
    http_status: 409
    serialization: "First-writer-wins on (reminder_rule_id, idempotency_key)."

  - scenario: "PATCH /templates/{id}/versions/{vid} on a DRAFT TemplateVersion with stale `version` while another writer modifies the same row."
    guarantee: "One writer succeeds; the stale writer is rejected."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on TemplateVersion.version."

  - scenario: "POST /contracts/{id}/evidence/seal arrives concurrently with POST /contracts/{id}/evidence/export."
    guarantee: "Export only succeeds if Seal has already committed; otherwise the export is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on EvidencePackage.status."

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: signing_progress_percent
    trigger: "On every SigningParty.WAITING_to_AUTHENTICATING, AUTHENTICATING_to_SIGNED, AUTHENTICATING_to_DECLINED, and any cascading SKIPPED side-effect; recomputes Contract.signing_progress_percent. Also recomputed on Contract.PENDING_SIGN_to_VOIDED."
    algorithm: chronological
    formula: |
      # Chronological variant (canonical, the one Contract.signing_progress_percent stores):
      # parties = all SigningParty rows under this contract whose parent SigningStep
      #   has status IN {ACTIVE, SIGNED, REJECTED}. Steps in PENDING or SKIPPED are EXCLUDED.
      # For each such party:
      #   weight = 1                # uniform per party
      # signed_count_chronological = number of parties with status = SIGNED, ordered by signed_at ASC
      # eligible_count_chronological = total weight over the included parties
      # progress = round_half_up( 100 * signed_count_chronological / eligible_count_chronological , 2 )
      # If eligible_count_chronological == 0 then progress = 0.00.
    input_set: |
      SigningParty rows belonging to SigningSteps in status IN {ACTIVE, SIGNED, REJECTED}.
      Steps in PENDING are EXCLUDED (haven't been activated yet).
      Steps in SKIPPED are EXCLUDED (branch evaluated false; they were never required).
    constants:
      WEIGHT_PER_PARTY: 1
    precision: "2 decimal places, round_half_up"
    variants:
      - name: forward_looking_query
        when: "Returned only by GET /contracts/{id}/progress?variant=forward_looking"
        difference: |
          Forward-looking variant ASSUMES every PENDING SigningStep will activate and every
          WAITING SigningParty in those steps will be required. It includes ALL parties under
          ALL non-SKIPPED steps (PENDING + ACTIVE + SIGNED + REJECTED). For identical inputs
          this yields a SMALLER percentage than the chronological variant whenever there exist
          PENDING steps with parties that have no signed members. The two variants differ
          whenever any step is in PENDING and at least one party has SIGNED.

  - name: document_fingerprint_hash
    trigger: "Once on Contract.DRAFT_to_PENDING_SIGN; pinned for the rest of the lifecycle (immutable thereafter)."
    algorithm: chronological
    formula: |
      # Combinatorial mode (b): NESTED ROUNDING / NESTED HASHING ORDER MATTERS.
      # Step 1 — per-page hashes (ordered by page index ASC, 1..page_count):
      #   page_canonical_bytes_i = utf8_canonical_json({
      #       "page_index": i,
      #       "blob_sha256": TemplateVersion.document_blob_sha256,
      #       "variable_values_on_page": variable_values restricted to keys whose
      #          signature_positions.page == i, sorted by key ASC (stable order)
      #   })
      #   page_hash_i = sha256_hex(page_canonical_bytes_i)
      #
      # Step 2 — concat-then-hash (PINNED ORDER: per-page hash first, THEN concatenate, THEN hash):
      #   concat_bytes = page_hash_1 || page_hash_2 || ... || page_hash_n  (ASCII bytes, no separator)
      #   contract_fingerprint = sha256_hex(concat_bytes)
      #
      # Forbidden alternative ("hash-then-concat-then-hash" of variable bodies before per-page
      # hashing) yields a different digest; the scaffold pins the per-page-first order.
      #
      # Result: Contract.document_fingerprint_sha256 = contract_fingerprint
    input_set: |
      Source: TemplateVersion of the Contract (must be PUBLISHED), Contract.variable_values,
      and TemplateVersion.signature_positions (for the page-key partition).
    constants: {}
    precision: "exact (hex)"
    variants: []

  - name: evidence_strength_score
    trigger: "Recomputed on every SigningParty.AUTHENTICATING_to_SIGNED side effect, on Contract auto-void, and on EvidencePackage.GENERATING_to_SEALED. Updates Contract.evidence_strength_score and Contract.evidence_tier."
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (a): formula has 4 weighted inputs with non-linear
      # interactions (min-clamps, conditional zero-outs).
      # Inputs (per Contract):
      #   I = identity_score   = avg over all SIGNED parties of:
      #         50  if any factors_passed == 1
      #         70  if factors_passed >= 2 (multi-factor)
      #         90  if factors_passed includes CA_CERT
      #         100 if factors_passed includes CA_CERT AND BANK_CARD
      #     If no parties signed yet -> I = 0.
      #   T = timestamp_score  = average over all SIGNED parties of:
      #         100 if their TimestampToken.verification_status == VALID AND drift_seconds <= 5
      #         60  if VALID AND 5 < drift_seconds <= 30
      #         0   otherwise
      #     If no signed parties -> T = 0.
      #   H = hash_score        = 100 if Contract.document_fingerprint_sha256 == sha256_hex(canonical TemplateVersion+vars at COMPLETED time) else 0
      #         (computed lazily; defaults to 100 while not COMPLETED).
      #   N = notary_score      = 0   if EvidencePackage.notary_provider == NONE
      #                          60  if NOTARY_PUBLIC
      #                          90  if BLOCKCHAIN
      #
      # Pre-tier raw score:
      #   raw = round_half_up( 0.30*I + 0.30*T + 0.20*H + 0.20*N , 2 )
      #
      # Tier mapping (boundary precision >=):
      #   tier = BRONZE     if raw <  40
      #          SILVER     if 40 <= raw < 70
      #          GOLD       if 70 <= raw < 90
      #          NOTARIZED  if 90 <= raw  AND notary_provider != NONE
      #
      # Combinatorial circular-looking dependency (mode (c) for Rule 2):
      # When tier == NOTARIZED, raw is RE-EVALUATED with N replaced by min(100, N + 10).
      # The scaffold pins evaluation order: tier is decided on the first pass, and the
      # bonus is applied in a SECOND pass that does not re-tier (no cascading).
      # final_score = round_half_up( 0.30*I + 0.30*T + 0.20*H + 0.20*N_final , 2 )
    input_set: |
      All SIGNED SigningParty rows under the Contract; their IdentityVerification.factors_passed and identity_strength;
      their TimestampToken.verification_status and drift_seconds; the Contract's EvidencePackage.notary_provider; the
      Contract.document_fingerprint_sha256.
    constants:
      W_IDENTITY: 0.30
      W_TIMESTAMP: 0.30
      W_HASH: 0.20
      W_NOTARY: 0.20
      DRIFT_TIGHT_SECONDS: 5
      DRIFT_LOOSE_SECONDS: 30
      TIER_SILVER_MIN: 40
      TIER_GOLD_MIN: 70
      TIER_NOTARIZED_MIN: 90
      NOTARIZED_BONUS: 10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_pre_seal
        when: "Returned by GET /contracts/{id}/evidence/preview before EvidencePackage.SEALED."
        difference: |
          Uses notary_provider as configured but assumes notary_score = 0 (no notary commitment yet).
          For the SAME inputs at COMPLETED-but-pre-SEAL state, the provisional final_score is strictly
          less than (or equal to, when notary_provider was already NONE) the post-seal final_score
          when notary_provider != NONE. This dual-variant divergence is the test target.

  - name: reminder_due_decision
    trigger: "Evaluated on every POST /_sweep/run for every Contract.status IN {PENDING_SIGN, PARTIALLY_SIGNED} with at least one ReminderRule.enabled=true."
    algorithm: threshold
    formula: |
      # For each enabled ReminderRule under such a Contract:
      # last = ReminderRule.last_fired_at  (or Contract.activated_at if last_fired_at is null)
      # threshold_at = last + (interval_hours * 3600 seconds)
      # due = (now() >= threshold_at)                        # boundary precision: >= (inclusive)
      # If due:
      #   misses = ReminderRule.misses_count + 1
      #   escalate = (misses > ReminderRule.escalation_after_misses)   # strict >
      #   channels_used = ReminderRule.channels (and add INITIATOR_IM if escalate)
      #   create ReminderEvent with idempotency_key = "{rule_id}:{epoch_floor(now()/interval_hours_seconds)}"
      #   ReminderRule.last_fired_at := now()
      #   ReminderRule.misses_count := misses
      # If a SigningParty signs at any time, ReminderRule.misses_count := 0 (reset).
      # Two boundaries with different operators on different metrics:
      #   - threshold_at uses >= (a moment-on-the-line counts as due)
      #   - escalate uses >  (one more miss than configured triggers; configured count itself does not)
    input_set: |
      All ReminderRule rows with enabled=true under Contracts in PENDING_SIGN or PARTIALLY_SIGNED.
    constants: {}
    precision: "exact (integer counts; datetimes to second precision)"
    variants: []

  - name: identity_strength_band
    trigger: "Computed once on IdentityVerification creation; used by evidence_strength_score and by validation."
    algorithm: threshold
    formula: |
      passed = factors_passed (deduplicated)
      if len(passed) == 0:                                 result = FAILED, identity_strength = WEAK
      elif len(passed) == 1:                               identity_strength = WEAK,        result = VERIFIED if real_name_match else FAILED
      elif len(passed) >= 2 and CA_CERT not in passed:     identity_strength = STRONG,      result = VERIFIED if real_name_match else FAILED
      elif len(passed) >= 2 and CA_CERT in passed and BANK_CARD in passed:
                                                            identity_strength = EXTRA_STRONG, result = VERIFIED if real_name_match else FAILED
      else (CA_CERT in passed and len(passed) >= 2):       identity_strength = STRONG,      result = VERIFIED if real_name_match else FAILED
    input_set: |
      The IdentityVerification.factors_attempted, derived factors_passed, and real_name_match boolean.
    constants: {}
    precision: "exact (enum)"
    variants: []

# =============================================================================
# 1.4 Validation Rules (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/advance and POST /_sweep/run when called by SystemSweeper"

  - priority: 2
    category: auth
    check: "Acting role permitted for the endpoint per RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-id resources exist (Template, TemplateVersion, Contract, SigningStep, SigningParty, EvidencePackage)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: state
    check: "TemplateVersion is in DRAFT for edits; in PUBLISHED for new Contract creation."
    error_id: ERR_TEMPLATE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /contracts (create), PATCH /templates/{id}/versions/{vid}"

  - priority: 5
    category: state
    check: "Contract is in the state the operation requires (DRAFT for activate; PENDING_SIGN/PARTIALLY_SIGNED for sign/decline; COMPLETED|VOIDED for evidence seal)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /contracts/{id}/activate, POST /contracts/{id}/void, POST /signing-parties/{id}/sign, POST /signing-parties/{id}/decline, POST /contracts/{id}/evidence/seal, POST /contracts/{id}/evidence/export"

  - priority: 6
    category: state
    check: "SigningParty is in AUTHENTICATING for sign/decline."
    error_id: ERR_PARTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /signing-parties/{id}/sign, POST /signing-parties/{id}/decline"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the user activating a Contract MUST NOT be the TemplateAdmin who PUBLISHED the referenced TemplateVersion."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contracts/{id}/activate"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the user sealing the EvidencePackage MUST NOT be the same user as Contract.initiator_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contracts/{id}/evidence/seal"

  - priority: 9
    category: business_referential
    check: "On POST /signing-parties/{id}/sign: there exists an IdentityVerification with subject_user_id=signer_user_id, contract_id=Contract.id, signing_party_id=null, result=VERIFIED, archived_at within the last AUTH_TTL_MINUTES, AND factors_passed ⊇ SigningParty.required_auth_factors."
    error_id: ERR_AUTH_FACTORS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /signing-parties/{id}/sign"

  - priority: 10
    category: business_referential
    check: "If signer_type = ORG_DELEGATE then delegation_authorization_id is non-null AND points to an active OrgUser with org_role = AUTHORIZED_DELEGATE in signer_org_id."
    error_id: ERR_DELEGATION_INVALID
    http_status: 422
    applies_to: "POST /contracts/{id}/signing-steps/{sid}/parties (create), POST /signing-parties/{id}/sign"

  - priority: 11
    category: business_temporal
    check: "On POST /contracts/{id}/activate and POST /signing-parties/{id}/sign: now() < Contract.expires_at (boundary: strict less-than)."
    error_id: ERR_CONTRACT_EXPIRED
    http_status: 409
    applies_to: "POST /contracts/{id}/activate, POST /signing-parties/{id}/sign"

  - priority: 12
    category: business_constraint
    check: "For non-empty timestamp tokens: TimestampToken.hash_signed MUST equal Contract.document_fingerprint_sha256 at the moment of issue."
    error_id: ERR_TIMESTAMP_HASH_MISMATCH
    http_status: 422
    applies_to: "POST /signing-parties/{id}/sign (token attached internally)"

  - priority: 13
    category: business_constraint
    check: "TimestampToken.drift_seconds <= MAX_TSA_DRIFT_SECONDS (60). Above this, verification_status is INVALID and the sign call is rejected."
    error_id: ERR_TIMESTAMP_DRIFT_EXCEEDED
    http_status: 422
    applies_to: "POST /signing-parties/{id}/sign"

  - priority: 14
    category: business_constraint
    check: "ReminderEvent (rule_id, idempotency_key) uniqueness."
    error_id: ERR_DUPLICATE_REMINDER
    http_status: 409
    applies_to: "POST /reminder-rules/{rid}/fire"

  - priority: 15
    category: business_constraint
    check: "Optimistic concurrency: provided `version` matches stored `version` on PATCH/PUT."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /templates/{id}, PATCH /templates/{id}/versions/{vid}, PATCH /contracts/{id} (DRAFT only), PATCH /reminder-rules/{rid}"

  - priority: 16
    category: business_constraint
    check: "Workflow modification rules: edits to Contract structure (variable_values, SigningSteps, SigningParties) only allowed in DRAFT."
    error_id: ERR_WORKFLOW_LOCKED
    http_status: 409
    applies_to: "PATCH /contracts/{id}, POST /contracts/{id}/signing-steps, POST /contracts/{id}/signing-steps/{sid}/parties"

  - priority: 17
    category: business_constraint
    check: "Permission scope: instantiating a Contract from a TemplateVersion requires Template.permission_scope == PUBLIC, OR Template.permission_scope == CROSS_ORG (any active org), OR Template.permission_scope == ORG_ONLY AND initiator_org_id == Template.owner_org_id."
    error_id: ERR_TEMPLATE_PERMISSION_DENIED
    http_status: 403
    applies_to: "POST /contracts (create)"

  - priority: 18
    category: business_constraint
    check: "Required factor count: required_auth_factors length must be >= MIN_FACTORS_FOR_LEGAL_REP (2) when signer_type = ORG_LEGAL_REP."
    error_id: ERR_LEGAL_REP_REQUIRES_MFA
    http_status: 422
    applies_to: "POST /contracts/{id}/signing-steps/{sid}/parties"

  - priority: 19
    category: business_referential
    check: "EvidencePackage.notary_provider != NONE requires notary_reference non-empty."
    error_id: ERR_NOTARY_REFERENCE_REQUIRED
    http_status: 422
    applies_to: "POST /contracts/{id}/evidence/seal"

  - priority: 20
    category: business_constraint
    check: "Re-initiation: reinitiated_from_contract_id MUST point to a Contract with status IN {VOIDED, EXPIRED} owned by the same initiator_org_id and only if no successful re-initiation already exists from that source."
    error_id: ERR_REINITIATE_INVALID
    http_status: 409
    applies_to: "POST /contracts (create with reinitiated_from_contract_id)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Templates -------------------------------------------------------------
  - method: POST
    path: "/templates"
    description: "Create a new Template (status=ACTIVE; version=0)."
    roles: [TemplateAdmin]
    code: 201
    input: [name, category, owner_org_id, "permission_scope?"]
    output: Template
    side_effects: []

  - method: GET
    path: "/templates"
    description: "List Templates with optional filter by category, owner_org_id."
    roles: [TemplateAdmin, ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: ["category?", "owner_org_id?", "limit?", "offset?"]
    output: "Template[]"
    side_effects: []

  - method: GET
    path: "/templates/{id}"
    description: "Read a single Template."
    roles: [TemplateAdmin, ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: []
    output: Template
    side_effects: []

  - method: PATCH
    path: "/templates/{id}"
    description: "Update mutable Template fields (name, category, permission_scope) with OCC."
    roles: [TemplateAdmin]
    code: 200
    input: ["name?", "category?", "permission_scope?", version]
    output: Template
    side_effects: []

  - method: POST
    path: "/templates/{id}/versions"
    description: "Upload a new TemplateVersion (status=DRAFT; auto-increments version_number)."
    roles: [TemplateAdmin]
    code: 201
    input: [document_blob_sha256, page_count, variable_fields, signature_positions]
    output: TemplateVersion
    side_effects:
      - "Template.latest_version_number := this.version_number"

  - method: GET
    path: "/templates/{id}/versions"
    description: "List TemplateVersions of a Template."
    roles: [TemplateAdmin, ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TemplateVersion[]"
    side_effects: []

  - method: GET
    path: "/templates/{id}/versions/{vid}"
    description: "Read a single TemplateVersion (historical-version retrieval)."
    roles: [TemplateAdmin, ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: []
    output: TemplateVersion
    side_effects: []

  - method: PATCH
    path: "/templates/{id}/versions/{vid}"
    description: "Edit a DRAFT TemplateVersion (variable_fields, signature_positions, page_count, document_blob_sha256) with OCC."
    roles: [TemplateAdmin]
    code: 200
    input: ["document_blob_sha256?", "page_count?", "variable_fields?", "signature_positions?", version]
    output: TemplateVersion
    side_effects: []

  - method: POST
    path: "/templates/{id}/versions/{vid}/publish"
    description: "Publish a DRAFT TemplateVersion."
    roles: [TemplateAdmin]
    code: 200
    input: []
    output: TemplateVersion
    side_effects:
      - "Template.published_version_number := this.version_number"
      - "AuditLog appended (action=TEMPLATE_PUBLISHED)"

  - method: POST
    path: "/templates/{id}/versions/{vid}/deprecate"
    description: "Deprecate a PUBLISHED TemplateVersion."
    roles: [TemplateAdmin]
    code: 200
    input: []
    output: TemplateVersion
    side_effects:
      - "Maybe clear Template.published_version_number"
      - "AuditLog appended (action=TEMPLATE_DEPRECATED)"

  # --- Contracts -------------------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Create a Contract in DRAFT from a PUBLISHED TemplateVersion."
    roles: [ContractInitiator]
    code: 201
    input: [template_version_id, title, variable_values, expires_at, "reinitiated_from_contract_id?"]
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List Contracts with filter by status, initiator_org_id."
    roles: [ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: ["status?", "initiator_org_id?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []

  - method: GET
    path: "/contracts/{id}"
    description: "Read a single Contract."
    roles: [ContractInitiator, Signer, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: PATCH
    path: "/contracts/{id}"
    description: "Update DRAFT Contract (title, expires_at, variable_values) with OCC."
    roles: [ContractInitiator]
    code: 200
    input: ["title?", "expires_at?", "variable_values?", version]
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{id}/signing-steps"
    description: "Append a SigningStep to a DRAFT Contract."
    roles: [ContractInitiator]
    code: 201
    input: [step_index, mode, "branch_condition?"]
    output: SigningStep
    side_effects: []

  - method: POST
    path: "/contracts/{id}/signing-steps/{sid}/parties"
    description: "Add a SigningParty to a step on a DRAFT Contract."
    roles: [ContractInitiator]
    code: 201
    input: [role_key, signer_type, signer_user_id, "signer_org_id?", "delegation_authorization_id?", required_auth_factors]
    output: SigningParty
    side_effects: []

  - method: POST
    path: "/contracts/{id}/activate"
    description: "Transition Contract DRAFT → PENDING_SIGN; pin document fingerprint; activate step 1."
    roles: [ContractInitiator]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "Compute Contract.document_fingerprint_sha256 [calc: document_fingerprint_hash]"
      - "Cascade: Step 1 PENDING → ACTIVE → child SigningParty WAITING → AUTHENTICATING"
      - "AuditLog appended (action=CONTRACT_ACTIVATED)"

  - method: POST
    path: "/contracts/{id}/void"
    description: "Manually void a Contract (initiator-driven, only while no SIGNED party exists)."
    roles: [ContractInitiator]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "Cascade SigningSteps → SKIPPED, SigningParties → SKIPPED"
      - "ReminderRule.enabled := false for all"
      - "EvidencePackage transitions PENDING → GENERATING (cascade)"
      - "AuditLog appended (action=CONTRACT_VOIDED)"

  - method: GET
    path: "/contracts/{id}/progress"
    description: "Return signing-progress query (chronological by default; ?variant=forward_looking for the alternative variant)."
    roles: [ContractInitiator, Signer, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: ["variant?"]
    output: "object {progress_percent: number, variant: enum, breakdown: array}"
    side_effects: []

  - method: GET
    path: "/contracts/{id}/audit-logs"
    description: "Historical audit-log retrieval, ordered by occurred_at ASC."
    roles: [ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- Signing parties -------------------------------------------------------
  - method: POST
    path: "/signing-parties/{id}/sign"
    description: "Signer commits a signature; embeds TimestampToken; consumes IdentityVerification."
    roles: [Signer]
    code: 200
    input: [tsa_anchor_at, tsa_provider, tsa_token_value, identity_verification_id]
    output: SigningParty
    side_effects:
      - "Create TimestampToken row (drift_seconds computed)"
      - "Recompute Contract.signing_progress_percent and evidence_strength_score"
      - "Cascade: parent step ACTIVE → SIGNED → next step PENDING → ACTIVE; OR contract → COMPLETED → EvidencePackage PENDING → GENERATING"
      - "ReminderRule.misses_count := 0"
      - "AuditLog appended (action=PARTY_SIGNED)"

  - method: POST
    path: "/signing-parties/{id}/decline"
    description: "Signer declines; cascades to step REJECTED and contract VOIDED (REJECTED_BY_PARTY)."
    roles: [Signer]
    code: 200
    input: []
    output: SigningParty
    side_effects:
      - "Cascade: step → REJECTED, sibling parties → SKIPPED, contract → VOIDED, EvidencePackage → GENERATING"
      - "AuditLog appended (action=PARTY_REJECTED)"

  # --- Identity verifications ------------------------------------------------
  - method: POST
    path: "/identity-verifications"
    description: "Create an IdentityVerification record; computes identity_strength and result."
    roles: [Signer, ContractInitiator]
    code: 201
    input: [subject_user_id, "contract_id?", factors_attempted]
    output: IdentityVerification
    side_effects:
      - "AuditLog appended (action=PARTY_SIGNED-related precondition)"

  - method: GET
    path: "/identity-verifications/{id}"
    description: "Read an IdentityVerification (archival access)."
    roles: [Signer, ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: []
    output: IdentityVerification
    side_effects: []

  # --- Reminder rules --------------------------------------------------------
  - method: POST
    path: "/contracts/{id}/reminder-rules"
    description: "Define a ReminderRule for a contract."
    roles: [ContractInitiator]
    code: 201
    input: [interval_hours, channels, escalation_after_misses, "enabled?"]
    output: ReminderRule
    side_effects: []

  - method: PATCH
    path: "/reminder-rules/{rid}"
    description: "Update a ReminderRule (interval_hours, channels, escalation_after_misses, enabled) with OCC."
    roles: [ContractInitiator]
    code: 200
    input: ["interval_hours?", "channels?", "escalation_after_misses?", "enabled?", version]
    output: ReminderRule
    side_effects: []

  - method: POST
    path: "/reminder-rules/{rid}/fire"
    description: "Test-driving endpoint to fire a single reminder slot with idempotency_key (also invoked internally by the sweep)."
    roles: [ContractInitiator, SystemSweeper]
    code: 201
    input: [idempotency_key]
    output: ReminderEvent
    side_effects:
      - "ReminderRule.last_fired_at := now(); misses_count incremented"
      - "AuditLog appended (action=REMINDER_FIRED)"

  - method: GET
    path: "/contracts/{id}/reminder-events"
    description: "List ReminderEvent rows under a contract."
    roles: [ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReminderEvent[]"
    side_effects: []

  # --- Evidence --------------------------------------------------------------
  - method: GET
    path: "/contracts/{id}/evidence"
    description: "Read EvidencePackage (must exist after Contract terminal state)."
    roles: [ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: []
    output: EvidencePackage
    side_effects: []

  - method: GET
    path: "/contracts/{id}/evidence/preview"
    description: "Provisional pre-seal evidence_strength_score (variant=provisional_pre_seal)."
    roles: [ContractInitiator, EvidenceArchivist, PlatformAdmin]
    code: 200
    input: []
    output: "object {provisional_score: number, provisional_tier: enum}"
    side_effects: []

  - method: POST
    path: "/contracts/{id}/evidence/seal"
    description: "Seal the EvidencePackage; computes package_sha256."
    roles: [EvidenceArchivist]
    code: 200
    input: ["notary_provider?", "notary_reference?"]
    output: EvidencePackage
    side_effects:
      - "Recompute Contract.evidence_strength_score (final pass with notary bonus)"
      - "AuditLog appended (action=EVIDENCE_SEALED)"

  - method: POST
    path: "/contracts/{id}/evidence/export"
    description: "Export judicial-use evidence package."
    roles: [EvidenceArchivist]
    code: 200
    input: []
    output: EvidencePackage
    side_effects:
      - "AuditLog appended (action=EVIDENCE_EXPORTED)"

  # --- System / Test-driving (mandatory per §1.5 testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Test hook: advance the server clock to a given ISO 8601 instant (only forward; idempotent if equal)."
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: "object {now: datetime}"
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Test hook: run the periodic sweep (auto-void expired contracts, fire due reminders)."
    roles: [PlatformAdmin, SystemSweeper]
    code: 200
    input: []
    output: "object {auto_voided: integer, reminders_fired: integer}"
    side_effects:
      - "Auto-void all Contracts with status IN {PENDING_SIGN, PARTIALLY_SIGNED} AND now() >= expires_at"
      - "Fire all due ReminderRule slots and create ReminderEvent rows"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-ID / X-User-Role headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for endpoint per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-id resource does not exist."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic-concurrency mismatch on PATCH/PUT."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in a state incompatible with the operation."
  - id: ERR_TEMPLATE_NOT_PUBLISHED
    http: 409
    condition: "Referenced TemplateVersion is not in PUBLISHED."
  - id: ERR_PARTY_NOT_ACTIVE
    http: 409
    condition: "SigningParty is not in AUTHENTICATING."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user violates a segregation-of-duties rule (template publisher activating, or initiator sealing)."
  - id: ERR_AUTH_FACTORS_INSUFFICIENT
    http: 422
    condition: "No fresh VERIFIED IdentityVerification meeting required_auth_factors."
  - id: ERR_DELEGATION_INVALID
    http: 422
    condition: "ORG_DELEGATE signer without a valid delegation_authorization_id."
  - id: ERR_CONTRACT_EXPIRED
    http: 409
    condition: "now() >= Contract.expires_at on a state-changing call."
  - id: ERR_TIMESTAMP_HASH_MISMATCH
    http: 422
    condition: "TimestampToken.hash_signed != Contract.document_fingerprint_sha256."
  - id: ERR_TIMESTAMP_DRIFT_EXCEEDED
    http: 422
    condition: "abs(tsa_anchor_at - server_anchor_at) > MAX_TSA_DRIFT_SECONDS (60)."
  - id: ERR_DUPLICATE_REMINDER
    http: 409
    condition: "ReminderEvent (rule_id, idempotency_key) already exists."
  - id: ERR_WORKFLOW_LOCKED
    http: 409
    condition: "Attempted structural edit on a non-DRAFT Contract."
  - id: ERR_TEMPLATE_PERMISSION_DENIED
    http: 403
    condition: "Initiator's org not permitted by Template.permission_scope."
  - id: ERR_LEGAL_REP_REQUIRES_MFA
    http: 422
    condition: "ORG_LEGAL_REP signer with required_auth_factors length < 2."
  - id: ERR_NOTARY_REFERENCE_REQUIRED
    http: 422
    condition: "Sealing with notary_provider != NONE but missing notary_reference."
  - id: ERR_REINITIATE_INVALID
    http: 409
    condition: "reinitiated_from_contract_id violates re-initiation preconditions."
  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Request body schema or required-field violation."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TemplateAdmin
    description: "Manages Templates and TemplateVersions: upload, edit, publish, deprecate."
    identity: "entity_backed:OrgUser"
    exclusive_operations:
      - "POST /templates"
      - "PATCH /templates/{id}"
      - "POST /templates/{id}/versions"
      - "PATCH /templates/{id}/versions/{vid}"
      - "POST /templates/{id}/versions/{vid}/publish"
      - "POST /templates/{id}/versions/{vid}/deprecate"
    shared_operations:
      - "GET /templates"
      - "GET /templates/{id}"
      - "GET /templates/{id}/versions"
      - "GET /templates/{id}/versions/{vid}"

  - name: ContractInitiator
    description: "Org user who instantiates and orchestrates Contracts; cannot publish templates and cannot seal evidence (segregation)."
    identity: "entity_backed:OrgUser"
    exclusive_operations:
      - "POST /contracts"
      - "PATCH /contracts/{id}"
      - "POST /contracts/{id}/signing-steps"
      - "POST /contracts/{id}/signing-steps/{sid}/parties"
      - "POST /contracts/{id}/activate"
      - "POST /contracts/{id}/void"
      - "POST /contracts/{id}/reminder-rules"
      - "PATCH /reminder-rules/{rid}"
    shared_operations:
      - "GET /contracts"
      - "GET /contracts/{id}"
      - "GET /contracts/{id}/progress"
      - "GET /contracts/{id}/audit-logs"
      - "GET /contracts/{id}/reminder-events"
      - "GET /contracts/{id}/evidence"
      - "GET /contracts/{id}/evidence/preview"
      - "POST /identity-verifications"
      - "GET /identity-verifications/{id}"
      - "POST /reminder-rules/{rid}/fire"
      - "GET /templates"
      - "GET /templates/{id}"
      - "GET /templates/{id}/versions"
      - "GET /templates/{id}/versions/{vid}"

  - name: Signer
    description: "End-user signing on behalf of self, an ORG_LEGAL_REP, or an ORG_DELEGATE; performs sign/decline."
    identity: "entity_backed:OrgUser"
    exclusive_operations:
      - "POST /signing-parties/{id}/sign"
      - "POST /signing-parties/{id}/decline"
    shared_operations:
      - "POST /identity-verifications"
      - "GET /identity-verifications/{id}"
      - "GET /contracts/{id}"
      - "GET /contracts/{id}/progress"

  - name: EvidenceArchivist
    description: "Independent custody role: seals and exports the EvidencePackage; cannot initiate or sign contracts."
    identity: "entity_backed:OrgUser"
    exclusive_operations:
      - "POST /contracts/{id}/evidence/seal"
      - "POST /contracts/{id}/evidence/export"
    shared_operations:
      - "GET /contracts/{id}/evidence"
      - "GET /contracts/{id}/evidence/preview"
      - "GET /contracts"
      - "GET /contracts/{id}"
      - "GET /contracts/{id}/audit-logs"
      - "GET /identity-verifications/{id}"
      - "GET /templates"
      - "GET /templates/{id}"
      - "GET /templates/{id}/versions"
      - "GET /templates/{id}/versions/{vid}"
      - "GET /contracts/{id}/reminder-events"

  - name: PlatformAdmin
    description: "Operational super-user that drives test hooks (clock, sweeps) and reads everything; cannot author contracts or sign."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
    shared_operations:
      - "POST /_sweep/run"
      - "GET /templates"
      - "GET /templates/{id}"
      - "GET /templates/{id}/versions"
      - "GET /templates/{id}/versions/{vid}"
      - "GET /contracts"
      - "GET /contracts/{id}"
      - "GET /contracts/{id}/progress"
      - "GET /contracts/{id}/audit-logs"
      - "GET /contracts/{id}/reminder-events"
      - "GET /contracts/{id}/evidence"
      - "GET /contracts/{id}/evidence/preview"
      - "GET /identity-verifications/{id}"

  - name: SystemSweeper
    description: "Internal driver invoked by the test hook /_sweep/run; runs auto-void and reminder firing."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /_sweep/run"
      - "POST /reminder-rules/{rid}/fire"
