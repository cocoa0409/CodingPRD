              payload: {}
              as: CaseWorker
              captures: { redet_det_id: $.data.id }
            - call: "POST /redeterminations"
              payload: { enrollment_id: "${enr_id}", window_open: "2026-11-01T00:00:00Z", window_close: "2026-12-15T00:00:00Z", new_determination_id: "${redet_det_id}", expected_enrollment_version: "${enr_v}" }
              as: CaseWorker
              captures: { redet_id: $.data.id }
