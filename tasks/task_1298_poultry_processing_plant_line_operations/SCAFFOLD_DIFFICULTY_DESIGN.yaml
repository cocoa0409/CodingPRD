            - "http status == 409"
            - "LineRun.${r1}.current_speed_bpm == 175 unchanged"

      - name: batch_create_window_closed_and_labor_exceeded_temporal_wins
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_ORDER_WINDOW_CLOSED]
          - errors[ERR_LABOR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal: the batch create
          violates BOTH (order due_at 06:00 already passed at 12:00; estimated
          labor 2.0 > budget 1.0). The priority-7 temporal error
