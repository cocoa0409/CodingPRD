  # ===========================================================================
  # Rule 4 — transitive_cascade: depth >= 3 transfer-accept chain vs depth >= 2
  # orientation-completion chain. DIFFERENT triggering transitions.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: transfer_accept_depth3_cascade
        grounds:
          - state_machines.CaseTransfer.INITIATED_to_COMPLETED
          - state_machines.Case.ARRIVED_to_TRANSFERRED_OUT
          - state_machines.OrientationSession.SCHEDULED_to_CANCELLED
          - state_machines.ServiceBenchmark.PENDING_to_WAIVED
          - state_machines.BenefitApplication.FILED_to_WITHDRAWN
          - state_machines.EmploymentPlan.ACTIVE_to_CLOSED_TRANSFERRED
          - state_machines.HousingSetup.OCCUPIED_to_VACATED
        distinguishing_aspect: |
          A depth-4 chain where each link is caused by the previous link, not
          by the original request: respond ACCEPTED -> transfer COMPLETED ->
          Case TRANSFERRED_OUT -> this case's SCHEDULED OrientationSessions
          CANCELLED -> because the sessions were cancelled, the PENDING
          CULTURAL_ORIENTATION benchmark is WAIVED with reason TRANSFER.
          Fan links off the case transition (application WITHDRAWN, plan
          CLOSED_TRANSFERRED, setup VACATED) are asserted separately.
        test_recipe:
          setup:
            - "Case CASE-TC1 (household_size 1) with one work-eligible adult member, OCCUPIED 0-bedroom housing, arrived 2026-08-10"
            - "One SCHEDULED OrientationSession (US_LAWS), one FILED SSN BenefitApplication, one ACTIVE EmploymentPlan"
