            - call: "POST /tprm/due-diligence-packages/${p_pr1}/submit"
              payload: {}
              as: VendorRelationshipManager
              captures: { submitter_check: $.data.submitted_by_user_id }
            - call: "GET /tprm/engagements/${e_pr1}"
              payload: {}
              as: RiskOfficer
              captures: { e_pr1_v: $.data.version }
          trigger:
            - call: "POST /tprm/due-diligence-packages/${p_pr1}/approve"
              payload: { expected_engagement_version: "${e_pr1_v}" }
              as: RiskOfficer
              as_user_id: "${submitter_check}"
              captures: { err1: $.data.error_id }
          assert:
            - "error_id == ERR_DD_NOT_UNDER_REVIEW  # state (p4) beats SoD (p5) and beats OCC (p17)"

