    side_effects: ["filed_at set"]
  - method: GET
    path: "/panel-shop/warranty-claims/{id}"
    description: "Fetch a warranty claim."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/panel-shop/warranty-claims"
    description: "List warranty claims across jobs (FK reverse reachability for panel_id)."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: ["job_id?", "panel_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/panel-shop/warranty-claims/{id}/triage"
    description: "QA triage; computes provisional liability."
    roles: [QAManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["provisional_liability_cents computed (provisional variant)", "WarrantyClaim.version incremented by 1"]
  - method: POST
    path: "/panel-shop/warranty-claims/{id}/accept"
    description: "QA accepts; computes final liability and delta."
    roles: [QAManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["final_liability_cents computed (final variant)", "liability_delta_cents computed", "WarrantyClaim.version incremented by 1"]
  - method: POST
    path: "/panel-shop/warranty-claims/{id}/deny"
    description: "QA denies; reverses provisional accrual."
    roles: [QAManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["final_liability_cents := 0", "liability_delta_cents := -provisional", "WarrantyClaim.version incremented by 1"]
  - method: POST
    path: "/panel-shop/warranty-claims/{id}/settle"
    description: "PM settles an accepted claim."
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.version incremented by 1"]
  - method: POST
    path: "/panel-shop/warranty-claims/{id}/close"
    description: "PM closes a denied claim."
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.version incremented by 1"]

  # --- as-built packages ---
  - method: GET
    path: "/panel-shop/as-built-packages/{id}"
    description: "Fetch an as-built package."
    roles: [ProjectManager, QAManager, DesignEngineer, Customer]
    code: 200
    input: []
    output: AsBuiltPackage
    side_effects: []
  - method: GET
    path: "/panel-shop/panels/{id}/as-built-packages"
    description: "Fetch the as-built package of a panel (FK reverse reachability; 1:1 returns array of 0-1)."
    roles: [ProjectManager, QAManager, DesignEngineer, Customer]
    code: 200
    input: []
    output: AsBuiltPackage[]
    side_effects: []
  - method: PATCH
