        distinguishing_aspect: |
          Bidirectional valid-transition claim: on a GA production the minimums are
          education 10 h/week and trust 0.10, so a packet with 12 h and 0.15 is
          COMPLETE at creation. PATCHing permit_expires_on back to 2026-07-01 — before
          the 2026-08-01 clock — drops it to INCOMPLETE, and PATCHing a future date
          back restores COMPLETE. The permit condition is re-evaluated on every PATCH,
          not only at creation.
        test_recipe:
          setup:
