# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2348 Network Operations Center & Circuit Fault Management
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every formula-derived assert literal below was
# computed by executing the §1.3 formula with its declared constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: restoration_dual_clock_carrier_vs_noc_credit_divergence
        grounds:
          - calculations.restoration_minutes_dual_clock
          - calculations.sla_credit_amount
          - entities.CarrierTicket.fields.restoration_minutes_carrier_clock
          - entities.CarrierTicket.fields.restoration_minutes_noc_clock
          - entities.CarrierTicket.fields.excluded_minutes
          - entities.SlaCreditClaim.fields.basis
          - state_machines.CarrierTicket.RESTORED_PENDING_CONFIRM_to_CLOSED_RESTORED
          - state_machines.SlaCreditClaim.DRAFT_to_SUBMITTED
          - validations[priority=43]
        distinguishing_aspect: |
          One outage, two clocks: the CARRIER_CLOCK variant measures opened_at -> restored_at minus the
          60 excluded minutes of APPROVED carrier maintenance (300.00 min, 1 breach hour, 45999 cents)
          while the NOC_CLOCK variant measures detected_at -> restored_at with no exclusion (390.00 min,
          3 breach hours, 138000 cents); switching basis on submit re-derives every amount and moves the
          carrier's exposure ledger by exactly the delta.
        test_recipe:
          setup:
            - "Carrier NLC with default SLA terms (sla_restore_minutes_critical 240, credit_pct_per_breach_hour 5.0, credit_pct_cap 50.0, min_claim_amount_cents 5000)."
            - "Circuit NLC-CKT-1001, MONITORED, bandwidth_mbps 200, mrc_cents 920000."
            - "Four single-leg ApplicationPaths on that circuit: GOLD, SILVER, SILVER, BRONZE (TIER_WEIGHT sum W = 9)."
            - "A CRITICAL LOSS_OF_SIGNAL alarm at 2026-08-10T00:00:00Z drives the circuit DOWN and opens Incident with impact_score 56 -> SEV1 (sla target 240)."
            - "CarrierTicket opened at 00:30; an APPROVED CARRIER_NOTIFIED maintenance window covers 02:00-03:00 (60 excluded minutes)."
            - "Carrier reports RESTORED at 06:30; the alarm is cleared; restoration is confirmed at 07:00 after the 30-minute soak, which auto-drafts a CARRIER_CLOCK claim of 45999 cents."
            - "The incident is triaged and mitigated so the claim is submittable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "NorthLink Communications", carrier_code: "NLC" }
              as: PlatformAdmin
              captures: { nlc_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${nlc_id}", carrier_circuit_identifier: "NLC-CKT-1001", site_a_code: "NYC01", site_z_code: "BOS01", bandwidth_mbps: 200, mrc_cents: 920000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Trading Gateway", service_tier: "GOLD", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Claims Portal", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Payroll Feed", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps2_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest WiFi", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pg_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps1_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps2_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${pb_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-10T00:00:00Z", source_circuit_id: "${c1_id}" }
              as: NocAnalyst
              captures: { a1_id: $.data.id, i1_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${i1_id}", circuit_id: "${c1_id}", carrier_reference: "NLC-TT-88001" }
              as: NocAnalyst
              captures: { t1_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c1_id}", origin: "CARRIER_NOTIFIED", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T03:00:00Z", suppresses_monitoring: false }
              as: CarrierLiaison
              as_user_id: "${nlc_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /maintenance-windows/${w1_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${t1_id}/carrier-update"
              payload: { update: "RESTORED", restored_at: "2026-08-10T06:30:00Z" }
              as: CarrierLiaison
              as_user_id: "${nlc_id}"
            - call: "POST /alarms/${a1_id}/clear"
              payload: { cleared_at: "2026-08-10T06:30:00Z" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${t1_id}/confirm-restoration"
              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "GET /sla-credit-claims"
              payload: { carrier_ticket_id: "${t1_id}" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { claim1_id: "$.data[0].id" }
            - call: "POST /incidents/${i1_id}/response"
              payload: { target_response_state: "TRIAGED" }
              as: NocAnalyst
            - call: "POST /incidents/${i1_id}/response"
              payload: { target_response_state: "MITIGATED" }
              as: NocAnalyst
          trigger:
            - call: "POST /sla-credit-claims/${claim1_id}/submit"
              payload: { basis: "NOC_CLOCK", attestation_note: "Re-filed on the monitoring clock" }
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "CarrierTicket.${t1_id}.excluded_minutes == 60"
            - "CarrierTicket.${t1_id}.restoration_minutes_carrier_clock == 300.00"
            - "CarrierTicket.${t1_id}.restoration_minutes_noc_clock == 390.00"
            - "SlaCreditClaim.${claim1_id}.basis == NOC_CLOCK"
            - "SlaCreditClaim.${claim1_id}.sla_target_minutes == 240"
            - "SlaCreditClaim.${claim1_id}.breach_minutes == 150.00"
            - "SlaCreditClaim.${claim1_id}.breach_hours == 3"
            - "SlaCreditClaim.${claim1_id}.credit_amount_cents == 138000"
            - "SlaCreditClaim.${claim1_id}.state == SUBMITTED"
            - "SlaCreditClaim.${claim1_id}.origin == AUTO_DRAFT"
            - "Carrier.${nlc_id}.open_credit_exposure_cents == 138000 (it was 45999 while the claim was still on the CARRIER_CLOCK basis)"

      - name: path_availability_intersection_vs_best_leg_basis
        grounds:
          - calculations.path_availability_score
          - entities.ApplicationPath.fields.posture
          - entities.PathSegment.fields.leg_group
          - endpoints["GET /application-paths/{id}/availability"]
        distinguishing_aspect: |
          A different entity domain than the credit clocks: two non-overlapping leg outages (LEG_A down
          120 minutes, LEG_B down 60 minutes) over a 360-minute period give path_down_minutes 0 and
          availability_pct 100.000 under INTERSECTION but path_down_minutes 60 and availability_pct
          83.333 under BEST_LEG, because only INTERSECTION requires every leg to be down at once.
        test_recipe:
          setup:
            - "Carrier EWT with two MONITORED circuits EWT-CKT-2001 and EWT-CKT-2002."
            - "ApplicationPath 'Core Voice Path' GOLD ACTIVE_ACTIVE min_surviving_legs 1 with LEG_A on circuit 2001 and LEG_B on circuit 2002."
            - "A CRITICAL alarm on circuit 2001 raised 00:00 and cleared 02:00 (LEG_A down 120 minutes)."
            - "A CRITICAL alarm on circuit 2002 raised 03:00 and cleared 04:00 (LEG_B down 60 minutes); the two outages never overlap."
            - "The logical clock is advanced to 06:00 before the availability read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Eastward Telecom", carrier_code: "EWT" }
              as: PlatformAdmin
              captures: { ewt_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2001", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c5_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ewt_id}", carrier_circuit_identifier: "EWT-CKT-2002", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c6_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Core Voice Path", service_tier: "GOLD", protection_scheme: "ACTIVE_ACTIVE", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { px_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c5_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${px_id}", leg_group: "LEG_B", sequence_index: 1, circuit_id: "${c6_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-10T00:00:00Z", source_circuit_id: "${c5_id}" }
              as: NocAnalyst
              captures: { a5_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms/${a5_id}/clear"
              payload: { cleared_at: "2026-08-10T02:00:00Z" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T03:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-10T03:00:00Z", source_circuit_id: "${c6_id}" }
              as: NocAnalyst
              captures: { a6_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms/${a6_id}/clear"
              payload: { cleared_at: "2026-08-10T04:00:00Z" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /application-paths/${px_id}/availability"
              payload: { from_iso8601: "2026-08-10T00:00:00Z", to_iso8601: "2026-08-10T06:00:00Z", basis: "INTERSECTION" }
              as: NocShiftLead
            - call: "GET /application-paths/${px_id}/availability"
              payload: { from_iso8601: "2026-08-10T00:00:00Z", to_iso8601: "2026-08-10T06:00:00Z", basis: "BEST_LEG" }
              as: NocShiftLead
          assert:
            - "both reads return period_minutes == 360"
            - "both reads return leg_down_minutes.LEG_A == 120.00 and leg_down_minutes.LEG_B == 60.00"
            - "INTERSECTION read: path_down_minutes == 0.00 and availability_pct == 100.000"
            - "BEST_LEG read: path_down_minutes == 60.00 and availability_pct == 83.333"
            - "ApplicationPath.${px_id}.posture == PROTECTED after both alarms are cleared"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sla_credit_per_path_line_rounding_before_summation
        grounds:
          - calculations.sla_credit_amount
          - entities.SlaCreditClaim.fields.credit_amount_cents
          - entities.ApplicationPath.fields.service_tier
          - state_machines.CarrierTicket.RESTORED_PENDING_CONFIRM_to_CLOSED_RESTORED
        distinguishing_aspect: |
          Multi-step rounding order: with mrc_cents 920000, credit_pct 5 and TIER_WEIGHT sum W = 9
          (GOLD 4 + SILVER 2 + SILVER 2 + BRONZE 1), rounding each path line to whole cents BEFORE
          summing yields 20444 + 10222 + 10222 + 5111 = 45999, whereas summing the unrounded shares and
          rounding once yields 46000 — the two readings differ by exactly 1 cent.
        test_recipe:
          setup:
            - "Identical topology to restoration_dual_clock_carrier_vs_noc_credit_divergence: Carrier NLC, circuit NLC-CKT-1001 (mrc_cents 920000), four single-leg paths GOLD/SILVER/SILVER/BRONZE."
            - "Incident detected 00:00 at SEV1 (sla target 240); ticket opened 00:30; APPROVED CARRIER_NOTIFIED window 02:00-03:00; carrier reports RESTORED 06:30; alarm cleared; clock at 07:00."
            - "No claim exists yet — the AUTO_DRAFT claim is created by the trigger itself."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "NorthLink Communications", carrier_code: "NLC" }
              as: PlatformAdmin
              captures: { nlc_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${nlc_id}", carrier_circuit_identifier: "NLC-CKT-1001", site_a_code: "NYC01", site_z_code: "BOS01", bandwidth_mbps: 200, mrc_cents: 920000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Trading Gateway", service_tier: "GOLD", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Claims Portal", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Payroll Feed", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps2_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest WiFi", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pg_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps1_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${ps2_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${pb_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${c1_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-10T00:00:00Z", source_circuit_id: "${c1_id}" }
              as: NocAnalyst
              captures: { a1_id: $.data.id, i1_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${i1_id}", circuit_id: "${c1_id}", carrier_reference: "NLC-TT-88002" }
              as: NocAnalyst
              captures: { t1_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${c1_id}", origin: "CARRIER_NOTIFIED", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T03:00:00Z", suppresses_monitoring: false }
              as: CarrierLiaison
              as_user_id: "${nlc_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /maintenance-windows/${w1_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${t1_id}/carrier-update"
              payload: { update: "RESTORED", restored_at: "2026-08-10T06:30:00Z" }
              as: CarrierLiaison
              as_user_id: "${nlc_id}"
            - call: "POST /alarms/${a1_id}/clear"
              payload: { cleared_at: "2026-08-10T06:30:00Z" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carrier-tickets/${t1_id}/confirm-restoration"
              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "GET /sla-credit-claims"
              payload: { carrier_ticket_id: "${t1_id}" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { auto_claim_id: "$.data[0].id" }
          assert:
            - "CarrierTicket.${t1_id}.state == CLOSED_RESTORED"
            - "SlaCreditClaim.${auto_claim_id}.origin == AUTO_DRAFT"
            - "SlaCreditClaim.${auto_claim_id}.basis == CARRIER_CLOCK"
            - "SlaCreditClaim.${auto_claim_id}.breach_minutes == 60.00"
            - "SlaCreditClaim.${auto_claim_id}.breach_hours == 1"
            - "SlaCreditClaim.${auto_claim_id}.credit_amount_cents == 45999 (NOT 46000, which is the sum-then-round reading)"
            - "Carrier.${nlc_id}.open_credit_exposure_cents == 45999"

      - name: upgrade_cost_tier_keyed_on_subtotal_not_total
        grounds:
          - calculations.upgrade_order_cost
          - entities.UpgradeOrder.fields.subtotal_cents
          - entities.UpgradeOrder.fields.expedite_fee_cents
          - entities.UpgradeOrder.fields.total_cost_cents
          - concurrency_rules[upgrade-order-create-stale-circuit]
        distinguishing_aspect: |
          Order-of-operations trap rather than a rounding trap: a 100 -> 300 Mbps expedited upgrade has
          subtotal_cents 430000, which selects the 0.25 band (subtotal < 500000) for a fee of 107500 and
          a total of 537500; keying the same lookup on total_cost_cents (537500, which is >= 500000)
          would select 0.15 and produce 494500, so the pinned STEP 3 -> STEP 4 order is observable.
        test_recipe:
          setup:
            - "Carrier WBF with default terms."
            - "Circuit WBF-CKT-4001, MONITORED, bandwidth_mbps 100, mrc_cents 300000, version captured at creation."
            - "The bandwidth ladder is [100, 200, 300, 500, 1000, 10000], so 300 is a legal target above 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Westbound Fiber", carrier_code: "WBF" }
              as: PlatformAdmin
              captures: { wbf_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${wbf_id}", carrier_circuit_identifier: "WBF-CKT-4001", site_a_code: "DEN01", site_z_code: "SLC01", bandwidth_mbps: 100, mrc_cents: 300000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c4_id: $.data.id, c4_v: $.data.version }
          trigger:
            - call: "POST /upgrade-orders"
              payload: { circuit_id: "${c4_id}", target_bandwidth_mbps: 300, expected_circuit_version: "${c4_v}", expedite: true }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { o1_id: $.data.id }
          assert:
            - "UpgradeOrder.${o1_id}.delta_mbps == 200"
            - "UpgradeOrder.${o1_id}.subtotal_cents == 430000"
            - "UpgradeOrder.${o1_id}.expedite_fee_cents == 107500"
            - "UpgradeOrder.${o1_id}.total_cost_cents == 537500 (NOT 494500, which is the tier-keyed-on-total reading)"
            - "UpgradeOrder.${o1_id}.state == DRAFT and origin == MANUAL"
            - "Carrier.${wbf_id}.committed_upgrade_mbps == 200"
            - "Circuit.${c4_id}.bandwidth_mbps == 100 (unchanged until the order completes)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: carrier_ticket_reopened_cycle_reclears_and_recomputes_restoration
        grounds:
          - state_machines.CarrierTicket.RESTORED_PENDING_CONFIRM_to_REOPENED
          - state_machines.CarrierTicket.REOPENED_to_TESTING
          - entities.CarrierTicket.fields.reopen_count
          - entities.CarrierTicket.fields.restored_at
          - calculations.restoration_minutes_dual_clock
          - endpoints["POST /carrier-tickets/{id}/confirm-restoration"]
        distinguishing_aspect: |
          A backward cycle RESTORED_PENDING_CONFIRM -> REOPENED -> TESTING -> RESTORED_PENDING_CONFIRM
          whose loop counter is reopen_count: the failed soak wipes restored_at and both restoration
          clocks back to null/0 and drafts no claim, and the second restoration re-derives them from the
          ORIGINAL opened_at/detected_at (450.00 / 480.00, not the 270.00 / 300.00 of the first attempt),
          so the eventual credit is 184000 rather than 45999.
        test_recipe:
          setup:
