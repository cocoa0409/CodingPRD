  - { method: POST, path: "/noise-program/curfew-rules", description: "Create a curfew rule (closed-interval minute windows; touching = conflict)", roles: [NoiseOfficeAdmin], code: 201, input: [runway_code, season, window_start_minute, window_end_minute, applies_to, "grace_minutes?", effective_from, effective_to], output: CurfewRule, side_effects: ["status=ACTIVE"] }
