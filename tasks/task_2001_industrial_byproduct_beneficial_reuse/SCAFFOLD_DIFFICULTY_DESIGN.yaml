            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 20.5, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v1}" }, as: Generator, as_user_id: "${g_id}", captures: { s1_id: $.data.id } }
