            - call: "POST /sponsorship-deals"
              payload: { organization_id: "${org_id}", sponsor_name: "Volt Surge", exclusivity_category: "ENERGY_DRINK", total_fee_cents: 1000000, deliverable_count_required: 2, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z" }
              as: SponsorshipManager
