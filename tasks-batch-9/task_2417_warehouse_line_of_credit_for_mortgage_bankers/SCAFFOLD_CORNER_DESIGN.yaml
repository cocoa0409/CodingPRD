              payload: { product_code: "SCRATCH_AND_DENT", advance_rate: 0.85, wet_funding_allowed: false, dwell_limit_days: 20 }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${facs_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /facilities/${facs_id}/custodians"
              payload: { custodian_name: "Cornerstone Document Custody NA", wet_receipt_deadline_hours: 48 }
              as: CreditOfficer
