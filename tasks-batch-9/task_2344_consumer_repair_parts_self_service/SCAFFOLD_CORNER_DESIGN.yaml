      - name: acknowledged_order_is_left_in_pending_disclosure_by_the_safety_cascade
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: "transitive_cascade / part_restriction_cascades_to_compatibility_assessment_and_order_hold"
          rationale: |
            That §1.8 instance already drives the full four-hop restrict cascade
            with two sibling orders — one unacknowledged (moved to
            BLOCKED_SAFETY_HOLD by HOP 4) and one acknowledged (deliberately left
            in PENDING_DISCLOSURE and rejected later at confirm), which is exactly
            the conditional-cascade claim. A second recipe would duplicate it.

      - name: order_line_dimensions_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: "non_linear_state_machine / order_line_authentication_and_calibration_dimensions_advance_independently"
          rationale: |
            The parallel-dimension claim for PartsOrderLine (authentication_status
            advancing while calibration_status stays put, and the combined state
            gating the parent rollup) is the entire subject of that §1.8 instance.

      - name: obligation_status_is_recomputed_from_the_parent_posture
        claim_type: compound
        excluded_because:
          difficulty_instance: "transitive_cascade / guide_publication_cascades_through_supersession_posture_and_obligation_recovery"
          rationale: |
            The compound claim — a ComplianceObligation's status being re-derived
            from the parent model's documentation_posture and bubbling back up into
            compliance_posture — is driven end-to-end there, including the recovery
            edge back to OPEN with breach_count preserved.

  - section: calculations
    instances:
      - name: documentation_fee_takes_the_regional_cap_and_the_public_manual_override
        claim_type: constants_applied
        grounds:
          - calculations.parts_order_pricing.formula[step 12]
          - calculations.parts_order_pricing.constants.DOC_FEE_BASE_CENTS
          - calculations.parts_order_pricing.constants.DOC_FEE_PER_WARNING_CENTS
          - entities.RegionalComplianceProfile.fields.requires_public_manual
        distinguishing_aspect: |
          Two orders on the SAME part and the SAME 5-warning guide price the
          documentation fee differently: US-NY charges the capped 600 (not the
          uncapped 1100) while EU-FR charges 0 because the public-manual override
          is evaluated BEFORE the cap.
        test_recipe:
          setup:
            - "Profiles US-NY (max_documentation_fee_cents 600, requires_public_manual false) and EU-FR (max_documentation_fee_cents 600, requires_public_manual true)."
            - "Model CRX-C201 (TIER_A) with part SKU-C201-FAN PUBLISHED (list 1000) and a PUBLISHED DISASSEMBLY_GUIDE carrying safety_warning_count 5."
            - "One consumer order per region, each with a single line of quantity 1."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-NY", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 600, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
