      - name: containment_zone_fail_remediate_pass_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.ContainmentZone.UNTESTED_to_FAIL
          - state_machines.ContainmentZone.FAIL_to_REMEDIATION
          - state_machines.ContainmentZone.REMEDIATION_to_PASS
          - entities.ContainmentZone.fields.test_count
        distinguishing_aspect: "The zone walks UNTESTED -> FAIL -> REMEDIATION -> PASS: remediate clears both measured_* fields to null without decrementing test_count, and the third leakage test leaves test_count == 2 with measured_leakage_pct 4.00."
        test_recipe:
          setup:
            - "Hall CX27 in PLANNING owns containment zone CA-1 (target_leakage_pct 5.00, design_static_pressure_pa 20.0, UNTESTED)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 27", code: "CX27", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "HOT_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
          trigger:
            - call: "POST /containment-zones/${zone1_id}/leakage-test"
              payload: { measured_leakage_pct: 8.00, measured_static_pressure_pa: 20.0 }
              as: MechanicalContractor
            - call: "POST /containment-zones/${zone1_id}/remediate"
              payload: { remediation_note: "Re-sealed roof panels 4-7." }
              as: MechanicalContractor
            - call: "POST /containment-zones/${zone1_id}/leakage-test"
              payload: { measured_leakage_pct: 4.00, measured_static_pressure_pa: 20.0 }
              as: MechanicalContractor
          assert:
            - "after the first leakage test ContainmentZone.${zone1_id}.leakage_status == FAIL, measured_leakage_pct == 8.00 and test_count == 1"
            - "after remediate ContainmentZone.${zone1_id}.leakage_status == REMEDIATION, measured_leakage_pct is null, measured_static_pressure_pa is null and test_count == 1"
            - "after the second leakage test ContainmentZone.${zone1_id}.leakage_status == PASS, measured_leakage_pct == 4.00 and test_count == 2"
            - "Hall.${hall_id}.thermal_posture == NOMINAL throughout (no cooling units and no powered racks, so cooling_margin_kw stays 0.00)"

