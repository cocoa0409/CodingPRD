              captures: { second_processed: $.data.processed_invoice_count }
          assert:
            - "FIRST RUN: HTTP 200"
            - "FIRST RUN: data.processed_invoice_count == 0, data.activated_enrollment_count == 0, data.suspended_enrollment_count == 0, data.lapsed_enrollment_count == 0, data.applied_plan_change_count == 0 and data.recomputed_msp_count == 0"
            - "FIRST RUN: all six keys are present in the body with integer zeros, none omitted or null"
            - "SECOND RUN: HTTP 200 with the same six zero counters"
            - "PlanOption.${po_pre_id}.status is still ACTIVE, not RETIRED, since no change notice was pending"
            - "PlanOption.${po_pre_id}.version is unchanged by both runs"

