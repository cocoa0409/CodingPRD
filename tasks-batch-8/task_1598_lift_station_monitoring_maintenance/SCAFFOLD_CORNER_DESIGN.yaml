      - name: only_assigned_operator_can_arrive
        claim_type: rbac_ownership
        grounds: ["state_machines.AlarmTicket.DISPATCHED_to_ON_SCENE", "roles"]
        distinguishing_aspect: "Operator B cannot call arrive on a ticket assigned to Operator A."
        test_recipe:
