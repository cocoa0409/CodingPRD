              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id, contract_status_before: $.data.status }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-CE1", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
