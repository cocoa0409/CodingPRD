      - name: bed_rest_period_enforced_after_harvest_close
        claim_type: temporal_validation
        grounds: [state_machines.GardenBed.POST_HARVEST_to_FALLOW, "errors[ERR_BED_REST_PERIOD_ACTIVE]", entities.GardenBed.fields.last_harvest_closed_at]
        distinguishing_aspect: "POST_HARVEST -> FALLOW requires now >= last_harvest_closed_at + 14 days: same-day and +13d attempts fail; +15d succeeds. Also asserts the HARVEST_OPEN -> POST_HARVEST guard (crop plan must COMPLETE first)."
        test_recipe:
          setup: ["season HARVESTING; bed HARVEST_OPEN with its plan HARVESTING; clock fixed at 2026-09-15T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
