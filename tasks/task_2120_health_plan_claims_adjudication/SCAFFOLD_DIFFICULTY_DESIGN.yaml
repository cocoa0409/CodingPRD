  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_denies_when_no_member_coverage_interval_contains_service_date
        grounds:
          - calculations.coverage_segment_match
          - calculations.claim_outcome_resolution
          - entities.MemberCoverage.fields.term_date
          - entities.Claim.fields.coverage_id
        distinguishing_aspect: |
          Cross-entity pair (Claim, MemberCoverage): the Claim's adjudicate transition resolves to
          DENIED with DENY_NO_COVERAGE purely because the member's only coverage segment closes at
          2026-02-01 while the line's service date is 2026-02-10.
