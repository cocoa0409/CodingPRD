  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: hardship_score_exactly_at_undue_threshold_is_undue
        grounds:
          - calculations.undue_hardship_assessment
          - entities.UndueHardshipAssessment.fields.hardship_score
          - entities.UndueHardshipAssessment.fields.hardship_verdict
          - state_machines.AccommodationOption.PROPOSED_to_HARDSHIP_BLOCKED
        distinguishing_aspect: |
          The metric is the continuous hardship_score against
          UNDUE_SCORE_THRESHOLD 70.00, reached through POST
          /accommodation-options/{id}/hardship-assessments: exactly 70.00 is
          UNDUE (>= is inclusive) while 69.99 is BORDERLINE, and an eleven-cent
          difference in one_time_cost_cents is what separates them.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "PUBLISHED JobProfile 'MFG-WELD-1' in department MFG with department_annual_budget_cents 2000000, employer_annual_budget_cents 800000000 and one ACTIVE essential function EF-WELD of weight 5."
            - "Employee E-A001 with a case in stage HARDSHIP_REVIEW carrying two PROPOSED options that both cover EF-WELD (coverage_ratio 1.000000) with 60 implementation days and recurring cost 0: OPT-EDGE-HIGH at one_time 121995 and OPT-EDGE-LOW at one_time 121984."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "MFG-WELD-1", title: "Welder", department_code: "MFG", department_annual_budget_cents: 2000000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { jpC_id: $.data.id }
            - call: "POST /job-profiles/${jpC_id}/essential-functions"
              payload: { function_code: "EF-WELD", description: "MIG weld frame subassemblies", criticality_weight: 5, frequency_per_week: 30, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { ef_weld_id: $.data.id }
            - call: "POST /job-profiles/${jpC_id}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "E-A001", full_name: "Cleo Marsh", department_code: "MFG", job_title: "Welder", hire_date: "2018-08-27", job_profile_id: "${jpC_id}", is_people_manager: false, annual_salary_cents: 6600000 }
              as: AccommodationCoordinator
              captures: { empC_id: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "M-A002", full_name: "Dov Aran", department_code: "MFG", job_title: "Fabrication Manager", hire_date: "2013-02-14", job_profile_id: "${jpC_id}", is_people_manager: true, annual_salary_cents: 10800000 }
              as: AccommodationCoordinator
              captures: { mgrC_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${empC_id}", request_channel: "WRITTEN", requested_accommodation_text: "Positioner table to avoid overhead welding", disability_obvious: true }
              as: Employee
              as_user_id: "${empC_id}"
              captures: { reqC_id: $.data.id }
            - call: "POST /accommodation-requests/${reqC_id}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${reqC_id}/function-analyses"
              payload: { essential_function_id: "${ef_weld_id}", can_perform_unaided: false, limitation_severity: 4, proposed_treatment: "PERFORM_WITH_AID" }
              as: Manager
              as_user_id: "${mgrC_id}"
            - call: "POST /accommodation-requests/${reqC_id}/advance"
              payload: { target_stage: "OPTION_EXPLORATION" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${reqC_id}/options"
              payload: { option_code: "OPT-EDGE-HIGH", category: "EQUIPMENT", one_time_cost_cents: 121995, recurring_monthly_cost_cents: 0, implementation_days: 60, coverage_function_ids: ["${ef_weld_id}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { opt_hi_id: $.data.id }
            - call: "POST /accommodation-requests/${reqC_id}/options"
              payload: { option_code: "OPT-EDGE-LOW", category: "EQUIPMENT", one_time_cost_cents: 121984, recurring_monthly_cost_cents: 0, implementation_days: 60, coverage_function_ids: ["${ef_weld_id}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { opt_lo_id: $.data.id }
            - call: "POST /accommodation-requests/${reqC_id}/advance"
              payload: { target_stage: "HARDSHIP_REVIEW" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /accommodation-options/${opt_hi_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { opt_hi_v: $.data.version }
            - call: "GET /accommodation-options/${opt_lo_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { opt_lo_v: $.data.version }
          trigger:
            - call: "POST /accommodation-options/${opt_hi_id}/hardship-assessments"
              payload: { assessment_basis: "SITE_LOCAL", expected_option_version: "${opt_hi_v}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { uha_hi_id: $.data.id, score_hi: $.data.hardship_score }
            - call: "POST /accommodation-options/${opt_lo_id}/hardship-assessments"
              payload: { assessment_basis: "SITE_LOCAL", expected_option_version: "${opt_lo_v}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { uha_lo_id: $.data.id, score_lo: $.data.hardship_score }
          assert:
            - "AccommodationOption.${opt_hi_id}.option_net_cost_cents == 90276 and AccommodationOption.${opt_lo_id}.option_net_cost_cents == 90268"
            - "UndueHardshipAssessment.${uha_hi_id}.budget_ratio == 0.045138 and UndueHardshipAssessment.${uha_hi_id}.budget_ratio_norm == 90.276"
            - "UndueHardshipAssessment.${uha_hi_id}.raw_hardship_score == 73.68 and UndueHardshipAssessment.${uha_hi_id}.mitigation_credit_rate == 0.05"
            - "UndueHardshipAssessment.${uha_hi_id}.hardship_score == 70.00"
            - "UndueHardshipAssessment.${uha_hi_id}.hardship_verdict == UNDUE"
            - "AccommodationOption.${opt_hi_id}.status == HARDSHIP_BLOCKED"
            - "UndueHardshipAssessment.${uha_lo_id}.budget_ratio == 0.045134 and UndueHardshipAssessment.${uha_lo_id}.budget_ratio_norm == 90.268"
            - "UndueHardshipAssessment.${uha_lo_id}.raw_hardship_score == 73.67"
            - "UndueHardshipAssessment.${uha_lo_id}.hardship_score == 69.99"
            - "UndueHardshipAssessment.${uha_lo_id}.hardship_verdict == BORDERLINE"
            - "AccommodationOption.${opt_lo_id}.status == CLEARED"
            - "AccommodationRequest.${reqC_id}.blocked_option_count == 1 and AccommodationRequest.${reqC_id}.cleared_option_count == 1"

      - name: advance_to_hardship_review_with_zero_options_is_rejected
