            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "R7", contact_email: "r7@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
          trigger:
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "http_status == 403"

      - name: ops_manager_cannot_create_standing_order
        claim_type: rbac_denial
        grounds: [roles.OpsManager, roles.Chef]
        distinguishing_aspect: "OpsManager (not Chef) creating a standing order is denied ERR_INSUFFICIENT_PERMISSIONS 403."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /grow/customers", payload: { business_name: "R8", contact_email: "r8@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: OpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "http_status == 403"

  # ===========================================================================
  # Section: cross_cutting — optimistic concurrency stale-version
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: stale_standing_order_version_rejected_on_line_add
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[standing-order-weekly-change-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Adding a line with a stale expected_standing_order_version returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["LISTED variety; customer; DRAFT order; client read version v, then a confirm bumped it"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Thyme", crop_category: "SPECIALTY_HERB", days_to_harvest: 22, expected_yield_grams_per_tray: 3000, listed_price_cents_per_kg: 2800, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "R9", contact_email: "r9@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 1.0, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.0, expected_standing_order_version: "${so_v2} - 1" }, as: Chef, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: stale_crop_plan_version_rejected_on_sow
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[crop-plan-sow-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Sowing with a stale expected_crop_plan_version returns ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["APPROVED FSP; LISTED variety; RELEASED lot; plan whose version advanced after client read"]
          setup_api_calls:
            - { call: "POST /grow/food-safety-plans", payload: { plan_code: "FSP-C10", water_test_current: true, sanitation_sop_version: "SOP-1" }, as: OpsManager, captures: { fsp_id: "$.data.id" } }
            - { call: "POST /grow/food-safety-plans/${fsp_id}/approve", payload: {}, as: OpsManager }
            - { call: "POST /grow/varieties", payload: { name: "Oregano", crop_category: "SPECIALTY_HERB", days_to_harvest: 23, expected_yield_grams_per_tray: 3000, listed_price_cents_per_kg: 2700, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/seed-lots", payload: { variety_id: "${var_id}", supplier_name: "SeedCo", lot_code: "LC10", received_date: "2026-08-01", seeds_on_hand_grams: 500 }, as: Grower, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests", payload: { seed_lot_id: "${lot_id}", seeds_sown_count: 100 }, as: Grower, captures: { gt_id: "$.data.id" } }
            - { call: "POST /grow/germination-tests/${gt_id}/record-result", payload: { germinated_count: 95 }, as: Grower }
            - { call: "POST /grow/crop-plans", payload: { variety_id: "${var_id}", planned_sow_date: "2026-08-03", planned_tray_count: 2, seed_grams_required: 10 }, as: Grower, captures: { plan_id: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower, captures: { plan_v_after: "$.data.version" } }
          trigger:
            - { call: "POST /grow/crop-plans/${plan_id}/sow", payload: { seed_lot_id: "${lot_id}", expected_crop_plan_version: "${plan_v}" }, as: Grower, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION (version advanced by first sow; original expected version now stale)"
            - "http_status == 412"

  # ===========================================================================
  # Section: consistency_model — immediate visibility of mutations
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_immediately_visible_on_read
        claim_type: immediate_consistency
        grounds: ["complexity_profile"]
        distinguishing_aspect: "A mutation is visible in the same workflow: after confirm, GET returns status CONFIRMED and recomputed weekly_subtotal_cents."
        test_recipe:
          setup: ["LISTED variety 800 c/kg; customer; DRAFT order with one 2.4kg line (ext 1920)"]
          setup_api_calls:
            - { call: "POST /grow/varieties", payload: { name: "Borage", crop_category: "EDIBLE_FLOWER", days_to_harvest: 26, expected_yield_grams_per_tray: 2500, listed_price_cents_per_kg: 800, min_order_grams: 100 }, as: Grower, captures: { var_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials", payload: { variety_id: "${var_id}", sow_date: "2026-08-03", chef_panel_size: 1, yield_score: 7.0 }, as: Grower, captures: { trial_id: "$.data.id" } }
            - { call: "POST /grow/variety-trials/${trial_id}/record-panel", payload: { scores: [7.0] }, as: Grower }
            - { call: "POST /grow/variety-trials/${trial_id}/decide", payload: { outcome: "ADOPT" }, as: Grower }
            - { call: "POST /grow/customers", payload: { business_name: "R10", contact_email: "r10@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
            - { call: "POST /grow/standing-orders/${so_id}/lines", payload: { variety_id: "${var_id}", qty_kg: 2.4, expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { so_v2: "$.data.version" } }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v2}" }, as: Chef, as_user_id: "${cust_id}" }
            - { call: "GET /grow/standing-orders/${so_id}", payload: {}, as: Chef, as_user_id: "${cust_id}", captures: { status: "$.data.status", subtotal: "$.data.weekly_subtotal_cents" } }
          assert:
            - "StandingOrder.status == CONFIRMED"
            - "StandingOrder.weekly_subtotal_cents == 1920"

  # ===========================================================================
  # §1.8-covered corners (stubs; no test_recipe)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: variety_listed_after_adopt
        claim_type: valid_transition
        grounds: [state_machines.Variety.EVALUATION_to_LISTED]
        excluded_because:
          difficulty_instance: variety_trial_evaluation_retrial_cycle
          rationale: "The same trial-decide machinery exercises EVALUATION->LISTED (ADOPT) as the sibling of the RETRIAL loop asserted in §1.8."

      - name: seed_lot_released_on_germination_pass
        claim_type: valid_transition
        grounds: [state_machines.SeedLot.QUARANTINE_to_RELEASED]
        excluded_because:
          difficulty_instance: germination_rate_inclusive_threshold
          rationale: "QUARANTINE->RELEASED on PASS is asserted directly by the §1.8 boundary instance (0.875 and 0.85 both RELEASE)."

      - name: delivery_stop_included_on_dispatch
        claim_type: valid_transition
        grounds: [state_machines.DeliveryStop.SCHEDULED_to_INCLUDED]
        excluded_because:
          difficulty_instance: delivery_stop_minimum_inclusive
          rationale: "SCHEDULED->INCLUDED at the exact-minimum boundary is asserted by the §1.8 route-minimum instance."
