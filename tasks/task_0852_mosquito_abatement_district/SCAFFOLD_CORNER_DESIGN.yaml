              payload: { name: "Small Drum", epa_reg_no: "EPA-777", active_ingredient: "METHOPRENE", application_method: "LARVICIDE", label_rate_ml_per_acre: 10.0, reentry_interval_hours: 0, cost_cents_per_liter: 5000, received_total_ml: 100.0 }
              as: DistrictAdmin
              captures: { prod_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /pesticide-products/${prod_id}/adjustments"
              payload: { delta_ml: -200.0, reason: "Spill write-off", expected_product_version: "${v1}" }
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /pesticide-products/${prod_id}/adjustments"
              payload: { delta_ml: -40.0, reason: "Partial spill write-off", expected_product_version: "${v1}" }
              as: DistrictAdmin
              captures: { on_hand_after: $.data.on_hand_ml, v2: $.data.version }
          assert:
            - "${err_id} == ERR_INVENTORY_NEGATIVE"
            - "${on_hand_after} == 60.00"
            - "${v2} == ${v1} + 1"
            - "PesticideProduct.${prod_id}.received_total_ml == 60.00"
            - "PesticideProduct.${prod_id}.committed_ml == 0.00"
            - "PesticideProduct.${prod_id}.applied_ml == 0.00"

