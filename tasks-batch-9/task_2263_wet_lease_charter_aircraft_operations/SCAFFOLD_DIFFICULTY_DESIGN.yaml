# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Domain: wet-lease-charter-operations (task 2263)
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every formula-derived assert literal below was produced by executing the
# §1.3 formulas as code against the pinned fixture inputs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: utilization_charge_provisional_vs_final_diverge_on_identical_legs
        grounds:
          - calculations.monthly_utilization_charge
          - entities.UtilizationPeriod.fields.provisional_charge_cents
          - entities.UtilizationPeriod.fields.final_charge_cents
          - entities.UtilizationPeriod.fields.variant_applied
          - endpoints[GET /wetlease/utilization-periods/{periodId}/settlement-preview]
        distinguishing_aspect: |
          Billing domain. One unchanged set of three legs yields credited_hours 8.5000 under
          PROVISIONAL (a still-SCHEDULED leg contributes its scheduled_block_minutes and the
          lessee-cancelled leg contributes nothing) and 6.5000 under FINAL (the SCHEDULED leg
          drops out entirely and the lessee-cancelled leg earns a 50%-of-scheduled credit),
          driving a different overrun tier split and a 1,296,000-cent charge gap.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on airframe G-ACMI: block_hour_rate_usd_cents 480000, min_guaranteed_block_hours_per_month 5, shortfall_credit_pct 0.60, term 2026-09-01..2026-12-31, so period 2026-09 is fully covered and mgh_effective_hours == 5.0000."
            - "Leg L1 REVENUE COMPLETED with 330 actual block minutes; leg L2 REVENUE still SCHEDULED with 180 scheduled block minutes; leg L3 REVENUE CANCELLED_LESSEE with 120 scheduled block minutes."
            - "No ReliabilityReport has been accepted, so reliability_penalty_cents is 0 in both variants."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "A Hallam", employee_no: "EMP-1001", crew_role: "CAPTAIN", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { cap_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "B Nkosi", employee_no: "EMP-1002", crew_role: "FIRST_OFFICER", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { fo_id: $.data.id }
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_id: $.data.id }
            - call: "POST /wetlease/leases/${lease_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4471" }
              as: LessorOpsController
