            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Cleaning lock probe", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/agency-decision"
              payload: { outcome: "RELEASED_FULL" }
              as: RecordsCoordinator
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Cleaning lock probe", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_id: $.data.id }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "ds-refused", negotiated_format: "CSV", expected_field_count: 2, sensitivity_tier: "PUBLIC" }
              as: DataReporter
