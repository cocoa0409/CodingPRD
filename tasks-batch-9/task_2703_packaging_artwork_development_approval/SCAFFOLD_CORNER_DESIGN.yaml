      - name: submit_reads_three_different_facts_out_of_the_claim_aggregate
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=38]
          - validations[priority=39]
          - validations[priority=44]
          - errors[ERR_CLAIM_NOT_CLEARED]
          - errors[ERR_CLAIM_CLEARANCE_EXPIRED]
          - errors[ERR_CLAIM_MARKET_MISMATCH]
          - entities.ArtworkVersion.fields.claim_ids
          - entities.MarketingClaim.fields.cleared_until_utc
        distinguishing_aspect: |
          Four versions of one asset, identical in every respect except which claim they
          cite, and submit must produce three different errors and one success. The
          facts live in a different aggregate than the version: legal_status (38),
          market_code against the ASSET's market (44), and the clearance window against
          the CURRENT logical clock (39). The expired claim is the discriminator for
          time handling - it was legitimately CLEARED when the version was authored and
          only lapsed because the clock moved to 2026-08-05, past its
          cleared_until_utc of 2026-08-01.
