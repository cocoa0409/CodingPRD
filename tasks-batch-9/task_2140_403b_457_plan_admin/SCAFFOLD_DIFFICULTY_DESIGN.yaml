            - "One participant with a 5000000-cent contract at provider one and a 1000000-cent contract at provider two, both fully vested; INV_BENEFIT is 6000000 cents."
            - "A CONTRACT_EXCHANGE request for 1500000 cents from contract one to contract two, accepted by provider two and APPROVED by compliance officer co-1."
