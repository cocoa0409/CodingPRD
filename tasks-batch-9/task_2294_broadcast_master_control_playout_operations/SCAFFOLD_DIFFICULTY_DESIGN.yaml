# =============================================================================
# task_2294 — Broadcast Master Control & Playout Operations
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
#
# Difficulty target: BEYOND EXPERT. 9 rule_ids, 23 non-stub instances.
# Every instance grounds only in SCAFFOLD.yaml §1.1-§1.7 and is reachable from
# an empty DB through the §1.5 surface. The logical clock starts at exactly
# 2026-08-01T00:00:00Z (POST /_clock/set_current_utc description) and is the
# only source of "now".
#
# Shared bootstrap convention used by every chain below (spelled out per
# instance, never abbreviated): StationAdmin (opaque id "admin-1") mints the
# four entity_backed Operator rows; the ENGINEER operator registers the
# transmitter / multiplex / channels; the QC operator grades assets; the
# PROGRAM_DIRECTOR operator counter-signs; the MASTER_CONTROL operator runs the
# air chain. Every OCC input is captured from a preceding response, never
# written as a literal.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — Dual-variant calculations across different entity domains
  # Domains exercised: Playlist scheduling SECONDS, Asset quality POINTS,
  # Multiplex transport-stream KBPS. Three different subjects, three different
  # units, three different calculations.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: playlist_projected_vs_asrun_variance_diverge_on_short_air
        grounds:
          - calculations.playlist_timing_variance
          - entities.Playlist.fields.projected_end_variance_seconds
          - entities.Playlist.fields.asrun_end_variance_seconds
          - state_machines.PlaylistItem.PLAYING_to_PLAYED
          - entities.PlaylistItem.fields.measured_duration_seconds
        distinguishing_aspect: |
          Dual variant on the Playlist entity domain measured in SECONDS: for one
          identical stored playlist the PROJECTED variant reads
          scheduled_duration_seconds for every non-dropped item and yields
          projected_end_variance_seconds == 0, while the AS_RUN variant reads
          measured_duration_seconds for the single PLAYED item and yields
          asrun_end_variance_seconds == -30; the two fields differ by exactly the
          30 seconds the element aired short.
        test_recipe:
          setup:
            - "One transmitter FAC-1 at FULL_POWER (derate_factor 1.00) carrying multiplex MUX-A (total_capacity_kbps 20000, pilot_reserved_kbps 500, effective_capacity_kbps 19500)."
            - "One PRIMARY channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1) with allocation_state ACTIVE, allocated_bitrate_kbps 6000, air_status ON_AIR, posture NORMAL."
            - "Three assets in status QC_PASSED (A expected 1200 s, B expected 30 s, C expected 540 s), each scored 100 by an INGEST QCReport with no defects."
            - "Playlist for broadcast_day 2026-08-01, schedule_start_utc 12:00:00Z, window_duration_seconds 1800, four contiguous items (PROGRAM 1200 s, COMMERCIAL 30 s, COMMERCIAL 30 s, PROGRAM 540 s) summing to exactly 1800 s; status ON_AIR; every item clearance_status CLEARED."
            - "Item 1 has playout_status PLAYING with actual_start_utc 12:00:00Z; the logical clock stands at 12:19:30Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Mac Control", role_class: "MASTER_CONTROL", override_authority: "CRAWL_AND_CUTIN", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { mco_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Quinn QC", role_class: "QC", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { qc_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id", mux_v1: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v1}", call_sign: "WXYZ-DT1", channel_number: "12.1", service_class: "PRIMARY", resolution_class: "SD_480I", requested_bitrate_kbps: 6000, floor_bitrate_kbps: 2000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /spot-orders"
              payload: { channel_id: "${ch_id}", advertiser_name: "Acme", order_reference: "ORD-1A", ordered_spots: 2, unit_duration_seconds: 30, rate_cents_total: 1000, daypart: "DAYTIME", priority_class: "PREEMPTIBLE", makegood_deadline_utc: "2026-08-10T00:00:00Z" }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { so_id: "$.data.id" }
            - call: "POST /assets"
              payload: { house_number: "HN-A", title: "Feature A", source: "FILE_DELIVERY", expected_duration_seconds: 1200, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { asset_a_id: "$.data.id" }
            - call: "POST /assets/${asset_a_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 1200, video_codec: "H264", delivered_resolution_class: "SD_480I", frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: "STEREO_2_0", caption_present: false }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_a_v: "$.data.version" }
            - call: "POST /assets/${asset_a_id}/qc-reports"
              payload: { expected_asset_version: "${asset_a_v}", inspected_by_operator_id: "${qc_id}", basis: "INGEST", defect_codes: [], measured_duration_seconds: 1200 }
              as: QCTechnician
              as_user_id: "${qc_id}"
            - call: "POST /assets"
              payload: { house_number: "HN-B", title: "Spot B", source: "FILE_DELIVERY", expected_duration_seconds: 30, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { asset_b_id: "$.data.id" }
            - call: "POST /assets/${asset_b_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 30, video_codec: "H264", delivered_resolution_class: "SD_480I", frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: "STEREO_2_0", caption_present: false }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_b_v: "$.data.version" }
            - call: "POST /assets/${asset_b_id}/qc-reports"
              payload: { expected_asset_version: "${asset_b_v}", inspected_by_operator_id: "${qc_id}", basis: "INGEST", defect_codes: [], measured_duration_seconds: 30 }
              as: QCTechnician
              as_user_id: "${qc_id}"
            - call: "POST /assets"
              payload: { house_number: "HN-C", title: "Feature C", source: "FILE_DELIVERY", expected_duration_seconds: 540, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { asset_c_id: "$.data.id" }
            - call: "POST /assets/${asset_c_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 540, video_codec: "H264", delivered_resolution_class: "SD_480I", frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: "STEREO_2_0", caption_present: false }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_c_v: "$.data.version" }
            - call: "POST /assets/${asset_c_id}/qc-reports"
              payload: { expected_asset_version: "${asset_c_v}", inspected_by_operator_id: "${qc_id}", basis: "INGEST", defect_codes: [], measured_duration_seconds: 540 }
              as: QCTechnician
              as_user_id: "${qc_id}"
            - call: "POST /playlists"
              payload:
                channel_id: "${ch_id}"
                broadcast_day: "2026-08-01"
                schedule_start_utc: "2026-08-01T12:00:00Z"
                window_duration_seconds: 1800
                items:
                  - { sequence_number: 1, element_kind: "PROGRAM", asset_id: "${asset_a_id}", scheduled_start_utc: "2026-08-01T12:00:00Z", scheduled_duration_seconds: 1200, max_trim_seconds: 0 }
                  - { sequence_number: 2, element_kind: "COMMERCIAL", asset_id: "${asset_b_id}", spot_order_id: "${so_id}", scheduled_start_utc: "2026-08-01T12:20:00Z", scheduled_duration_seconds: 30, max_trim_seconds: 0 }
                  - { sequence_number: 3, element_kind: "COMMERCIAL", asset_id: "${asset_b_id}", spot_order_id: "${so_id}", scheduled_start_utc: "2026-08-01T12:20:30Z", scheduled_duration_seconds: 30, max_trim_seconds: 0 }
                  - { sequence_number: 4, element_kind: "PROGRAM", asset_id: "${asset_c_id}", scheduled_start_utc: "2026-08-01T12:21:00Z", scheduled_duration_seconds: 540, max_trim_seconds: 0 }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { pl_id: "$.data.id" }
            - call: "GET /playlists/${pl_id}/items"
              payload: {}
              as: MasterControlOperator
              as_user_id: "${mco_id}"
              captures: { it1_id: "$.data[0].id", it2_id: "$.data[1].id", it3_id: "$.data[2].id", it4_id: "$.data[3].id" }
            - call: "POST /playlists/${pl_id}/state"
              payload: { target_status: "VALIDATED" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlists/${pl_id}/state"
              payload: { target_status: "ARMED" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /channels/${ch_id}/air-state"
              payload: { target_air_status: "ON_AIR" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlists/${pl_id}/state"
              payload: { target_status: "ON_AIR" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: "CUE", event_utc: "2026-08-01T12:00:00Z" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: "START", event_utc: "2026-08-01T12:00:00Z" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:19:30Z" }
              as: StationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: "END", event_utc: "2026-08-01T12:19:30Z", measured_duration_seconds: 1170 }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
          assert:
            - "HTTP 201 and the response data is an AsRunEntry with event_kind == END and measured_duration_seconds == 1170"
            - "PlaylistItem.${it1_id}.playout_status == PLAYED"
            - "PlaylistItem.${it1_id}.measured_duration_seconds == 1170"
            - "Playlist.${pl_id}.projected_end_variance_seconds == 0"
            - "Playlist.${pl_id}.asrun_end_variance_seconds == -30"
            - "Playlist.${pl_id}.projected_end_variance_seconds != Playlist.${pl_id}.asrun_end_variance_seconds"
            - "Playlist.${pl_id}.scheduled_total_seconds == 1800"
            - "Playlist.${pl_id}.status == ON_AIR"

      - name: asset_ingest_vs_aircheck_score_diverge_by_fault_penalty
        grounds:
          - calculations.asset_technical_score
          - entities.Asset.fields.technical_score_ingest
          - entities.Asset.fields.technical_score_aircheck
          - entities.QCReport.fields.fault_penalty_points
          - state_machines.TechnicalFault.MITIGATED_to_RESOLVED
          - concurrency_rules[qc-report-stale-asset]
        distinguishing_aspect: |
          Dual variant on the Asset entity domain measured in quality POINTS (a
          different subject and a different unit from the Playlist seconds
          instance): the INGEST variant forces fault_penalty_points to 0 and
          scores the delivered file at 90 (PASS), while the AIR_CHECK variant of
          the same calculation on the same asset adds a capped 18-point
          BLACK_FRAME fault penalty and a 30-point duration penalty for the
          shortened air, scoring 42 (FAIL) without ever changing Asset.status.
        test_recipe:
          setup:
            - "The station of playlist_projected_vs_asrun_variance_diverge_on_short_air is fully built: channel 12.1 ON_AIR, playlist ON_AIR, asset A (expected_duration_seconds 1200) QC_PASSED."
            - "Asset A's governing INGEST QCReport carries defect_codes [VIDEO_ARTIFACT], measured_duration_seconds 1200 and audio_loudness_lkfs -24.0, so defect_penalty_points 10, duration_penalty_points 0, loudness_penalty_points 0, fault_penalty_points 0 and technical_score 90 (PASS)."
            - "Item 1 of the playlist carries asset A and has already reached playout_status PLAYED with measured_duration_seconds 1170."
            - "A BLACK_FRAME TechnicalFault was raised against item 1 on channel 12.1 and has been driven DETECTED -> ACKNOWLEDGED -> MITIGATED -> RESOLVED, so it is linked to an aired element."
            - "The logical clock stands at 2026-08-01T12:20:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Mac Control", role_class: "MASTER_CONTROL", override_authority: "CRAWL_AND_CUTIN", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { mco_id: "$.data.id" }
            - call: "POST /operators"
              payload: { full_name: "Quinn QC", role_class: "QC", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { qc_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id", mux_v1: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v1}", call_sign: "WXYZ-DT1", channel_number: "12.1", service_class: "PRIMARY", resolution_class: "SD_480I", requested_bitrate_kbps: 6000, floor_bitrate_kbps: 2000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /assets"
              payload: { house_number: "HN-A", title: "Feature A", source: "FILE_DELIVERY", expected_duration_seconds: 1200, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { asset_a_id: "$.data.id" }
            - call: "POST /assets/${asset_a_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 1200, video_codec: "H264", delivered_resolution_class: "SD_480I", frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: "STEREO_2_0", caption_present: false }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_a_v: "$.data.version" }
            - call: "POST /assets/${asset_a_id}/qc-reports"
              payload: { expected_asset_version: "${asset_a_v}", inspected_by_operator_id: "${qc_id}", basis: "INGEST", defect_codes: ["VIDEO_ARTIFACT"], measured_duration_seconds: 1200 }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { ing_report_id: "$.data.id" }
            - call: "POST /playlists"
              payload:
                channel_id: "${ch_id}"
                broadcast_day: "2026-08-01"
                schedule_start_utc: "2026-08-01T12:00:00Z"
                window_duration_seconds: 1200
                items:
                  - { sequence_number: 1, element_kind: "PROGRAM", asset_id: "${asset_a_id}", scheduled_start_utc: "2026-08-01T12:00:00Z", scheduled_duration_seconds: 1200, max_trim_seconds: 0 }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { pl_id: "$.data.id" }
            - call: "GET /playlists/${pl_id}/items"
              payload: {}
              as: MasterControlOperator
              as_user_id: "${mco_id}"
              captures: { it1_id: "$.data[0].id" }
            - call: "POST /playlists/${pl_id}/state"
              payload: { target_status: "VALIDATED" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlists/${pl_id}/state"
              payload: { target_status: "ARMED" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /channels/${ch_id}/air-state"
              payload: { target_air_status: "ON_AIR" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlists/${pl_id}/state"
              payload: { target_status: "ON_AIR" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: "CUE", event_utc: "2026-08-01T12:00:00Z" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: "START", event_utc: "2026-08-01T12:00:00Z" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:19:30Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: "END", event_utc: "2026-08-01T12:19:30Z", measured_duration_seconds: 1170 }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /technical-faults"
              payload: { fault_code: "BLACK_FRAME", severity: "MAJOR", detected_utc: "2026-08-01T12:19:30Z", channel_id: "${ch_id}", playlist_item_id: "${it1_id}" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
              captures: { fault_id: "$.data.id" }
            - call: "POST /technical-faults/${fault_id}/state"
              payload: { target_state: "ACKNOWLEDGED" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /technical-faults/${fault_id}/state"
              payload: { target_state: "MITIGATED", mitigation_code: "RESTART_ENCODER" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:20:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /technical-faults/${fault_id}/state"
              payload: { target_state: "RESOLVED", cleared_utc: "2026-08-01T12:20:00Z" }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
            - call: "GET /assets/${asset_a_id}"
              payload: {}
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_a_v2: "$.data.version", score_ingest_before: "$.data.technical_score_ingest" }
          trigger:
            - call: "POST /assets/${asset_a_id}/qc-reports"
              payload: { expected_asset_version: "${asset_a_v2}", inspected_by_operator_id: "${qc_id}", basis: "AIR_CHECK", defect_codes: ["VIDEO_ARTIFACT"], measured_duration_seconds: 1170 }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { air_report_id: "$.data.id" }
          assert:
            - "HTTP 201 and the response data is a QCReport with basis == AIR_CHECK"
            - "${score_ingest_before} == 90"
            - "QCReport.${ing_report_id}.defect_penalty_points == 10"
            - "QCReport.${ing_report_id}.duration_penalty_points == 0"
            - "QCReport.${ing_report_id}.fault_penalty_points == 0"
            - "QCReport.${ing_report_id}.technical_score == 90"
            - "QCReport.${ing_report_id}.verdict == PASS"
            - "QCReport.${air_report_id}.defect_penalty_points == 10"
            - "QCReport.${air_report_id}.duration_penalty_points == 30"
            - "QCReport.${air_report_id}.loudness_penalty_points == 0"
            - "QCReport.${air_report_id}.fault_penalty_points == 18"
            - "QCReport.${air_report_id}.technical_score == 42"
            - "QCReport.${air_report_id}.verdict == FAIL"
            - "Asset.${asset_a_id}.technical_score_ingest == 90"
            - "Asset.${asset_a_id}.technical_score_aircheck == 42"
            - "Asset.${asset_a_id}.status == QC_PASSED"
            - "QCReport.${ing_report_id}.superseded == false"

      - name: multiplex_full_pool_vs_derated_pool_allocations_diverge
        grounds:
          - calculations.multiplex_bitrate_allocation
          - calculations.multiplex_capacity_conservation
          - entities.Channel.fields.allocated_bitrate_kbps
          - entities.Transmitter.fields.derate_factor
