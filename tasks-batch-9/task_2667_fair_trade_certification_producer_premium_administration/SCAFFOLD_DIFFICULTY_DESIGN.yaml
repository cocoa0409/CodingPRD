              as: CommitteeChair
              as_user_id: "chair-1"
            - call: "POST /fairtrade/premium-use-proposals/${p2_id}/votes"
              payload: { ballot: "APPROVE" }
              as: CommitteeMember
              as_user_id: "member-1"
            - call: "POST /fairtrade/premium-use-proposals/${p2_id}/votes"
              payload: { ballot: "APPROVE" }
              as: CommitteeMember
              as_user_id: "member-2"
            - call: "POST /fairtrade/premium-use-proposals/${p2_id}/votes"
              payload: { ballot: "ABSTAIN" }
              as: CommitteeMember
              as_user_id: "member-3"
          trigger:
            - call: "POST /fairtrade/premium-use-proposals/${p2_id}/close-vote"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
          assert:
            - "the close-vote returns 409 with error_id == ERR_FUND_PERIOD_CAPACITY_EXCEEDED, because 1500000 + 950000 == 2450000 exceeds 3000000 * 80 / 100 == 2400000"
            - "PremiumUseProposal.${p2_id}.status is still UNDER_VOTE and approved_at is null, so the refused tally wrote nothing"
            - "PremiumFund.${fund_id}.balance_cents == 1500000 and committed_cents == 1500000 and pending_proposal_count == 1"
            - "the refusal is not a balance failure: balance_cents 1500000 comfortably covers the 950000 request, so ERR_FUND_BALANCE_INSUFFICIENT must not be returned"
            - "control: an identical 950000-cent proposal over the non-overlapping window [2026-11-01, 2026-12-01) closes to APPROVED, since a touching window is outside the overlapping set"

  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_settled_trade_restores_the_conserved_kilograms_on_both_nodes
        grounds:
          - state_machines.TradeTransaction.SETTLED_to_REVERSED
          - calculations.mass_balance_credit_ledger
          - entities.SupplyChainNode.fields.available_credit_kg
        distinguishing_aspect: |
          The conserved quantity is PHYSICAL VOLUME in kilograms: certified_input_kg minus
          claimed_output_kg minus reserved_output_kg on the seller, plus the converted
          certified_input_kg booked into the buyer. Voiding a settled trade must return every one
          of those four numbers to its pre-settlement value, so no certified kilogram is created
          or destroyed by the round trip.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED with a PHYSICAL cooperative node, one harvest declaration of 50000 kg, so certified_input_kg 50000.000 and available_credit_kg 50000.000"
            - "BRAND holder CERTIFIED with a PHYSICAL BRAND_NODE downstream, conversion_ratio 1.000, certified_input_kg 0.000"
            - "a 30000 kg organic coffee trade created, VERIFIED and SETTLED, so the seller shows claimed_output_kg 30000.000, reserved_output_kg 0.000 and available_credit_kg 20000.000, the buyer shows certified_input_kg 30000.000, and the fund holds an ACCRUAL of 3000000 cents"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}", conversion_ratio: 1.0 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
            - call: "POST /fairtrade/premium-committees"
              payload: { holder_id: "${prod_id}", chair_user_id: "chair-1", member_count: 5, approved_use_categories: ["EDUCATION", "INFRASTRUCTURE"] }
              as: CertificationOfficer
              captures: { cmte_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", is_organic: true, volume_kg: 30000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/trade-transactions/${t1_id}/settle"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/certificate-holders/${prod_id}/premium-funds"
              payload: {}
              as: CertificationOfficer
              captures: { fund_id: "$.data[0].id" }
          trigger:
            - call: "POST /fairtrade/trade-transactions/${t1_id}/void"
              payload: { reason: "Buyer returned the lot as non-conforming" }
              as: CertificationOfficer
          assert:
            - "TradeTransaction.${t1_id}.settlement_status == REVERSED and voided_at == 2026-08-01T00:00:00Z, while verification_status is still VERIFIED"
            - "SupplyChainNode.${sell_node_id}.claimed_output_kg == 0.000 and reserved_output_kg == 0.000 and certified_input_kg == 50000.000"
            - "SupplyChainNode.${sell_node_id}.available_credit_kg == 50000.000, exactly the pre-settlement figure"
            - "SupplyChainNode.${buy_node_id}.certified_input_kg == 0.000, so the converted volume was unwound at the same 1.000 ratio it was booked with"
            - "GET /fairtrade/premium-ledger-entries?fund_id=${fund_id} returns 2 rows ordered by created_at ASC: ACCRUAL +3000000 with balance_after_cents 3000000, then REVERSAL 3000000 with balance_after_cents 0"
            - "PremiumFund.${fund_id}.total_accrued_cents == 0 and balance_cents == 0, so the signed ledger sum still equals total_accrued_cents"
            - "PremiumCommittee.${cmte_id}.status == RESTRICTED, since the reversal dropped balance_cents below LOW_BALANCE_THRESHOLD_CENTS"
            - "no kilogram is created or destroyed: certified_input_kg - claimed_output_kg - reserved_output_kg is 50000.000 on the seller both before the settlement and after the void"

      - name: cancel_approved_proposal_restores_the_conserved_money_partition
        grounds:
          - state_machines.PremiumUseProposal.APPROVED_to_CANCELLED
          - state_machines.PremiumCommittee.RESTRICTED_to_ACTIVE
          - calculations.premium_fund_conservation
        distinguishing_aspect: |
          A different conserved quantity: the three-way MONEY partition
          total_accrued_cents == balance_cents + committed_cents + disbursed_cents. Cancelling an
          APPROVED proposal writes a RELEASE entry whose signed amount is zero, so the partition
          must be restored by moving cents between buckets without changing the total, and the
          committee must climb back RESTRICTED -> ACTIVE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED, PHYSICAL cooperative node, 5-member committee chaired by chair-1"
            - "one 30000 kg organic coffee trade VERIFIED and SETTLED, so total_accrued_cents and balance_cents are 3000000 and the committee is ACTIVE"
            - "proposal P1 for 2400000 cents over [2026-09-01, 2026-10-01) APPROVED, leaving balance_cents 600000 and committed_cents 2400000"
            - "proposal P2 for 500000 cents over [2026-10-01, 2026-11-01) APPROVED, leaving balance_cents 100000 and committed_cents 2900000, which put the committee into RESTRICTED"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
