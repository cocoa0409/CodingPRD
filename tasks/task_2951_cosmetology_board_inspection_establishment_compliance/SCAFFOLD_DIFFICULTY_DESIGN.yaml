              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_major_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Chair & Comb", establishment_type: "SALON", county_code: "NCE", station_capacity: 8 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-07T09:00:00Z", window_end_at: "2026-08-07T17:00:00Z", inspector_user_id: "insp-004" }
              as: Inspector
              as_user_id: "insp-004"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-004"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_crit_id}", observed_count: 5, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-004"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_major_id}", observed_count: 1, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-004"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-004"
          trigger:
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "Inspection.${insp_id}.status == FINALIZED"
            - "Inspection.${insp_id}.final_adjusted_score == 115.00"
            - "Inspection.${insp_id}.final_outcome == FAIL"
