          - entities.RateCard.fields.rate_type
        distinguishing_aspect: |
          Two different failure classes on the same endpoint: an enum value
          outside {PER_CASE, PERCENT_OF_SPEND, TIERED_VOLUME} is a priority-7
          400, while a well-typed rate_type whose companion rate fields are
          wrong or whose tier ladder is malformed is the priority-28 422. The
          ladder rules are each independently enforced: >= 2 entries, first
          min_cases == 0, strictly increasing min_cases, every rate >= 1.
        test_recipe:
          setup:
            - "Deal PBC-2026 in DRAFT with item BEEF-PATTY-4OZ-CS40; the item's current version is captured for the OCC token."
          setup_api_calls:
            - call: "POST /manufacturer-deals"
