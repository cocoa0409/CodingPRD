      - name: invoice_period_window_is_half_open_on_the_lending_charge_instant
        claim_type: input_set_filtering
        grounds:
          - calculations.partner_invoice_reconciliation
          - entities.LendingCharge.fields.incurred_at
          - entities.PartnerInvoice.fields.receivable_total_cents
          - endpoints[POST /ill/partners/{id}/invoices]
        distinguishing_aspect: "For period_month 2026-08 the window is [2026-08-01, 2026-09-01): a charge incurred at exactly 2026-08-01 is counted, one at exactly 2026-09-01 is not, and one at 2026-07-31 is not — so lend_line_count is 1 and receivable_total_cents is 2150, the surcharged form of the single 2000-cent line."
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-09-01T00:00:00Z so that period_month 2026-08 is closed."
            - "Partner EASTV ACTIVE with no ReciprocityAgreement, so the invoice takes the default gross_settlement variant."
            - "Three OPEN LendingCharge rows against EASTV with incurred_at 2026-07-31, 2026-08-01 and 2026-09-01 and charge_cents 3000, 2000 and 1200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "EASTV", name: "East Valley College Library", consortium_code: "EASTERN", base_lending_fee_cents: 1750, avg_turnaround_days: 6, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { partner_id: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "Before the window", service_type: "LOAN", charge_cents: 3000, incurred_at: "2026-07-31T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { charge_before: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "On the lower edge", service_type: "LOAN", charge_cents: 2000, incurred_at: "2026-08-01T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { charge_in: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "On the upper edge", service_type: "COPY", charge_cents: 1200, incurred_at: "2026-09-01T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { charge_after: $.data.id }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { pv: $.data.version, receivable_raw: $.data.lend_receivable_cents }
          trigger:
            - call: "POST /ill/partners/${partner_id}/invoices"
              payload: { expected_partner_version: "${pv}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_id: $.data.id, lend_lines: $.data.lend_line_count, borrow_lines: $.data.borrow_line_count, recv: $.data.receivable_total_cents, pay: $.data.payable_total_cents, net: $.data.net_amount_cents, gross: $.data.gross_amount_cents, variant: $.data.settlement_variant, dir: $.data.direction }
          assert:
            - "${receivable_raw} == 6200 — Partner.lend_receivable_cents tracks all three OPEN charges at face value, independently of any invoice period"
            - "${lend_lines} == 1 and ${borrow_lines} == 0 — only the 2026-08-01 charge falls inside [2026-08-01, 2026-09-01)"
            - "${recv} == 2150 — the single 2000-cent line surcharged at CONSORTIUM_SURCHARGE_PCT 0.075"
            - "${pay} == 0 and ${gross} == 0"
            - "${variant} == gross_settlement — no ACTIVE ReciprocityAgreement applies"
            - "${net} == 0 and ${dir} == PAYABLE — the gross variant does not net the lend side off, and a non-negative net does not flip direction"
            - "GET /ill/lending-charges/${charge_before} and GET /ill/lending-charges/${charge_after} both still report status OPEN — an excluded line is untouched, and drafting does not mark anything INVOICED"
            - "PartnerInvoice.${inv_id}.status == DRAFT and period_month == 2026-08"

