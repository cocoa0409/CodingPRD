              captures: { proj_r_id: $.data.id, proj_r_version: $.data.version }
            - call: "POST /model-versions"
              payload: { model_id: "mdl-r", revision_letter: "A", status: "DRAFT" }
              as: ModelCoordinator
              captures: { mv_r_id: $.data.id }
            - call: "POST /takeoff-lines"
              payload: { model_version_id: "${mv_r_id}", zone_code: "Z-1", assembly_code: "A-RACK", conduit_run_type: "RIGID_RACK", conduit_run_type_code: "RC50", quantity: 100, prefab_share_pct: 0.5 }
              as: ModelCoordinator
              captures: { hash_r: $.data.takeoff_hash }
            - call: "POST /model-versions/${mv_r_id}/coordinate"
              payload: {}
              as: ModelCoordinator
            - call: "POST /material-releases"
              payload: { project_id: "${proj_r_id}", model_version_id: "${mv_r_id}", vendor_key: "V-R", material_commodity: "MC_CABLE", quantity: 500, unit_price_cents: 3200, lead_time_days: 7, service_priority: "NEXT_DAY", commitment_mode: "CONFIRMED", planned_release_iso: "2026-09-10T00:00:00Z", receiving_user_id: "op-recv-r" }
              as: ProcurementLead
              captures: { mr_r_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-releases/${mr_r_id}/declare"
              payload: { expected_project_version: "${proj_r_version}", target_status: "RELEASED" }
              as: ProcurementLead
              captures: { proj_r_version2: $.data.project_version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /material-releases/${mr_r_id}/declare"
              payload: { expected_project_version: "${proj_r_version2}", target_status: "RELEASED" }
              as: ProcurementLead
          assert:
            - "the request violates the state row (priority 9, the release is RELEASED rather than PLANNED) and the temporal row (priority 29, the clock is 10 days past planned_release_iso) at once"
            - "the state error wins: error_id == ERR_INVALID_PREFAB_TRANSITION and http_status == 409, not ERR_MATERIAL_RELEASE_DEADLINE"
            - "MaterialRelease.${mr_r_id}.status is still RELEASED and locked_release_iso is unchanged"
      - name: business_constraint_versus_business_fiscal_pair_on_takeoff_extraction
        grounds:
