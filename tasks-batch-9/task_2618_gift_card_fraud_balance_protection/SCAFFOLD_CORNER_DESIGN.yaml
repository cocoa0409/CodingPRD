              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-CS", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-4501" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 9000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-45", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /victim-claims"
              payload: { card_id: "${card_id}", claimant_name: "Dana Whitfield", claimant_contact: "dana@example.test", disputed_amount_cents: 4000, purchased_at: "2026-08-01T00:00:00Z", purchase_receipt_ref: "RCPT-4501" }
              as: FraudAnalyst
              as_user_id: "analyst-45"
              captures: { claim_id: $.data.id, claim_state0: $.data.state, round0: $.data.evidence_round }
          trigger:
            - call: "POST /victim-claims/${claim_id}/resubmit-evidence"
              payload: { packaging_photo_ref: "PHOTO-4501" }
              as: FraudAnalyst
              as_user_id: "analyst-45"
              captures: { err: $.data.error_id }
          assert:
            - "${claim_state0} == SUBMITTED and ${round0} == 0"
