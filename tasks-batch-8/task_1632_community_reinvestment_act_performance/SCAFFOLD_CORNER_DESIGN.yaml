            - "ExamCycle.${ex_id}.status == PRELIMINARY_RATING and appeal_reason == 'new CD evidence submitted'"

      - name: comment_lifecycle_drives_pending_count
        claim_type: side_effect_execution
        grounds: ["state_machines.PublicComment", "entities.PublicFile.fields.pending_comment_count"]
        distinguishing_aspect: "Comment creation increments pending_comment_count and flips posture INCOMPLETE; publish decrements it and restores COMPLETE; respond records response_text and ends at RESPONDED."
        test_recipe:
          setup: ["PublicFile COMPLETE (disclosure refreshed)"]
          setup_api_calls:
            - call: "POST /cra/public-files"
              payload: { bank_name: "Comment Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
          trigger:
            - call: "POST /cra/public-comments"
              payload: { commenter_name: "Jo Public", channel: "WRITTEN_LETTER", subject_area: "SERVICE", content: "More branches needed." }
              as: CRAOfficer
              captures: { c_id: $.data.id }
            - call: "POST /cra/public-comments/${c_id}/publish"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-comments/${c_id}/respond"
              payload: { response_text: "We appreciate the feedback." }
              as: CRAOfficer
          assert:
            - "After create: GET /cra/public-files/${pf_id} pending_comment_count == 1 and posture == INCOMPLETE"
            - "After publish: pending_comment_count == 0 and posture == COMPLETE"
            - "After respond: PublicComment.${c_id}.status == RESPONDED and response_text == 'We appreciate the feedback.'"

      - name: staged_branch_open_blocked_until_application_approved
        claim_type: precondition_enforcement
        grounds: ["state_machines.Branch.PROPOSED_to_OPEN", "errors[ERR_APPLICATION_NOT_APPROVED]"]
        distinguishing_aspect: "A branch staged by a BRANCH_OPENING submission cannot open while its application is SUBMITTED; after decide=APPROVE the same open call succeeds."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; BRANCH_OPENING application SUBMITTED with staged PROPOSED branch; no FINALIZED exam"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-SM8", name: "Staging Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/expansion-applications"
              payload: { application_type: "BRANCH_OPENING", target_assessment_area_id: "${aa_id}", branch_code: "BR-S", branch_census_tract: "T1", branch_tract_income_level: "MODERATE" }
              as: BankExecutive
              captures: { app_id: $.data.id }
            - call: "POST /cra/expansion-applications/${app_id}/submit"
              payload: {}
              as: BankExecutive
              captures: { br_id: $.data.linked_branch_id }
          trigger:
            - call: "POST /cra/branches/${br_id}/open"
              payload: {}
              as: BankExecutive
              captures: { err: $.data.error_id }
            - call: "POST /cra/expansion-applications/${app_id}/decide"
              payload: { decision: "APPROVE", decision_reason: "meets credit needs" }
              as: BankExaminer
            - call: "POST /cra/branches/${br_id}/open"
              payload: {}
              as: BankExecutive
          assert:
            - "First open: error_id == ERR_APPLICATION_NOT_APPROVED with http 422; branch remains PROPOSED"
            - "After APPROVE: Branch.${br_id}.status == OPEN and opened_date == 2026-08-01 (logical clock default)"

  # ----------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: access_score_zero_open_branches_yields_zero
        claim_type: correct_result
        grounds: ["calculations.branch_access_score"]
        distinguishing_aspect: "Empty-set branch of the formula: with no OPEN branches access_score == 0 and lmi_branch_pct == 0 regardless of the demographic benchmark."
        test_recipe:
          setup: ["AssessmentArea ACTIVE with a CURRENT profile (lmi_tract_pct 0.4); no branches"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-C1", name: "Empty Branch Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id, aa_v: $.data.version }
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v}", data_year: 2020, total_tracts: 10, low_income_tracts: 2, moderate_income_tracts: 2, total_population: 10000, lmi_population: 4500, median_family_income: 60000 }
              as: CRAOfficer
          trigger:
            - call: "GET /cra/assessment-areas/${aa_id}/access-analysis"
              as: BankExaminer
          assert:
            - "open_branch_count == 0; lmi_branch_pct == 0; benchmark_lmi_tract_pct == 0.4; access_score == 0"

      - name: access_score_lmi_closure_penalty_applied
        claim_type: constants_applied
        grounds: ["calculations.branch_access_score"]
        distinguishing_aspect: "LMI_CLOSURE_PENALTY 5 per LMI closure in the trailing 365 days: 2 OPEN branches (1 MODERATE -> 0.5), benchmark 0.4, 1 LOW-tract closure gives 50 + 100*(0.5-0.4) - 5 = 55.00."
        test_recipe:
          setup: ["AssessmentArea ACTIVE with profile benchmark 0.4; branches: b1 MODERATE OPEN, b2 UPPER OPEN, b3 LOW opened then closed (closed_date 2026-08-01 within trailing window)"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-C2", name: "Penalty Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1", "T2", "T3"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id, aa_v: $.data.version }
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v}", data_year: 2020, total_tracts: 10, low_income_tracts: 2, moderate_income_tracts: 2, total_population: 10000, lmi_population: 4500, median_family_income: 60000 }
              as: CRAOfficer
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-P1", assessment_area_id: "${aa_id}", census_tract: "T1", tract_income_level: "MODERATE" }
              as: BankExecutive
              captures: { p1: $.data.id }
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-P2", assessment_area_id: "${aa_id}", census_tract: "T2", tract_income_level: "UPPER" }
              as: BankExecutive
              captures: { p2: $.data.id }
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-P3", assessment_area_id: "${aa_id}", census_tract: "T3", tract_income_level: "LOW" }
              as: BankExecutive
              captures: { p3: $.data.id }
            - call: "POST /cra/branches/${p1}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/branches/${p2}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/branches/${p3}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/branches/${p3}/close"
              payload: { notice_posted_date: "2026-04-01" }
              as: BankExecutive
          trigger:
            - call: "GET /cra/assessment-areas/${aa_id}/access-analysis"
              as: CRAOfficer
          assert:
            - "open_branch_count == 2; lmi_branch_pct == 0.5; lmi_closures_12m == 1"
            - "access_score == 55.00"

      - name: composite_outstanding_band_and_finalize_without_cascade
        claim_type: correct_result
        grounds: ["calculations.exam_composite_rating"]
        distinguishing_aspect: "O/O/S gives 9.0 >= 8.50 OUTSTANDING; finalize with a favorable composite runs no denial cascade."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; PublicFile COMPLETE; exam in FIELDWORK"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-C3", name: "Outstanding Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-files"
              payload: { bank_name: "Outstanding Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
          trigger:
            - call: "POST /cra/exam-cycles/${ex_id}/assign-preliminary-rating"
              payload: { lending_test_rating: "OUTSTANDING", investment_test_rating: "OUTSTANDING", service_test_rating: "SATISFACTORY" }
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/finalize"
              payload: {}
              as: BankExaminer
          assert:
            - "composite_points == 9.0 and composite_rating == OUTSTANDING after assignment"
            - "status == FINALIZED after finalize; no expansion applications harmed (none denied)"

      - name: register_total_applies_reportable_cap
        claim_type: constants_applied
        grounds: ["calculations.loan_register_report_totals"]
        distinguishing_aspect: "CRA_REPORTABLE_CAP_CENTS 100000000 caps a 250000000-cent loan before rounding: register total is 100000000 cents, not 250000000."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; one REPORTED SMALL_BUSINESS loan of 250000000 cents in the 2025 window; exam window 2025-01-01..2025-12-31"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-C4", name: "Cap Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 250000000, borrower_gross_annual_revenue_cents: 300000000, action_date: "2025-05-01", census_tract: "T1", tract_income_level: "UPPER" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /cra/loan-records/${l_id}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records/${l_id}/mark-reported"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2025-01-01", evaluation_window_end: "2025-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
          trigger:
            - call: "GET /cra/exam-cycles/${ex_id}/lending-metrics"
              payload: {}
              as: BankExaminer
          assert:
            - "small_business_register_total_cents == 100000000 (cap applied: min(250000000, 100000000) -> round(1000)*100000)"
            - "loan_count == 1; lmi_borrower_pct == 0 (revenue 300000000 > 100000000)"

      - name: lending_metrics_empty_window_yields_zeros
        claim_type: correct_result
        grounds: ["calculations.lending_test_metrics"]
        distinguishing_aspect: "Zero loans in the window: loan_count 0 and every percentage 0 (empty-set edge; no division by zero)."
        test_recipe:
          setup: ["Exam window 2026-01-01..2026-12-31; no loans exist"]
          setup_api_calls:
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "INTERMEDIATE_SMALL_BANK", evaluation_window_start: "2026-01-01", evaluation_window_end: "2026-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
          trigger:
            - call: "GET /cra/exam-cycles/${ex_id}/lending-metrics"
              payload: {}
              as: BankExaminer
          assert:
            - "loan_count == 0; inside_aa_pct == 0; lmi_geography_pct == 0; lmi_borrower_pct == 0; both register totals == 0"

      - name: cd_activity_dual_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.activity_qualified_amount"]
        excluded_because:
          difficulty_instance: cd_activity_full_count_vs_pro_rata_diverge
          rationale: "FULL_COUNT vs PRO_RATA divergence asserted with literal amounts in the named §1.8 instance."

      - name: lending_metrics_basis_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.lending_test_metrics"]
        excluded_because:
          difficulty_instance: lending_metrics_snapshot_vs_current_basis
          rationale: "SNAPSHOT vs CURRENT inclusion-set divergence asserted in the named §1.8 instance."

      - name: register_rounding_order_pinned
        claim_type: precision
        grounds: ["calculations.loan_register_report_totals"]
        excluded_because:
          difficulty_instance: loan_register_per_loan_rounding_order
          rationale: "Per-loan-then-sum rounding order asserted with literal 400000 vs 300000 in the named §1.8 instance."

  # ------------------------------------------------------------ validations
  - section: validations
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected ERR_UNAUTHENTICATED 401 before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-V1", name: "No Auth", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401"

      - name: rbac_exclusive_operations_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", "roles"]
        distinguishing_aspect: "Each role is denied another role's exclusive operation with ERR_FORBIDDEN 403: analyst cannot create areas, reviewer cannot create loans, executive cannot create exams, examiner cannot create branches, CRAOfficer cannot review-decide, PlatformAdmin cannot create public files."
        test_recipe:
          setup: ["AssessmentArea ACTIVE and a SUBMITTED activity exist (targets for the forbidden calls)"]
