            - "Call 1 returns HTTP 409 with error id ERR_RELOCATION_RISK_CEILING because the FINAL score is 30 + 14 + 9 + floor(1750000 / 250000) == 30 + 14 + 9 + 7 == 60, and 60 reaches APPROVAL_RISK_CEILING"
            - "Call 2 returns HTTP 200: RemoteLocationRequest.${r59_id}.status == APPROVED, final_risk_score == 59 (30 + 14 + 9 + 6) and decision_reason == BOTH_REVIEWS_CLEARED"
            - "Call 3 returns HTTP 200: RemoteLocationRequest.${r60_id}.status == DENIED, final_risk_score == 60 and decision_reason == RISK_CEILING_REACHED"
            - "The licensing term is min(21, 7 * 2) == 14, i.e. below LICENSING_PENALTY_CAP, so the one-point difference really comes from the nexus floor division"
            - "Neither final_risk_score was written before the decide call: both were null while status was UNDER_REVIEW"

      - name: neighborhood_capacity_exact_fit_allowed_one_over_refused
        grounds:
          - calculations.neighborhood_peak_load
          - validations[priority=70, ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED]
          - entities.Neighborhood.fields.utilization_pct
          - entities.Neighborhood.fields.allocation_state
        distinguishing_aspect: |
          Usable capacity is seat_count - buffer_seats == 26, and a per-week
          aggregate of exactly 26 is allowed while 27 is refused. The same
          boundary simultaneously drives utilization_pct to exactly 100.00 and
          allocation_state across the inclusive TIGHT threshold of 90.00, and the
          half-open week window makes [2026-W41, 2026-W43) adjacent to
          [2026-W37, 2026-W41) rather than overlapping it.
        test_recipe:
          setup:
            - "One OPEN cycle and team T3-BIG with headcount_planned 125 and expected_days_in_office_per_week 1, so expected_daily_attendance is ceil(125/5) = 25, base_entitlement 25, tier max_base 25 -> buffer_pct 0.12, buffer_seats_entitled 3 and entitled_seats 28 (above every seat count used below, so the entitlement rule is never the binding constraint)."
            - "Neighborhood N-B1 with seat_count 30, buffer_seats 4, desks 1..30, so usable capacity is 26."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-BP3", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 1, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T3-BIG", expected_days_in_office_per_week: 1, core_collaboration_days: ["WED"], headcount_planned: 125, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t3_id: $.data.id }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t3_id}", neighborhood_code: "N-B1", site_code: "NYC-01", seat_count: 30, buffer_seats: 4, desk_index_from: 1, desk_index_to: 30 }
              as: WorkplaceProgramOffice
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 20, window_start_week: "2026-W37", window_end_week: "2026-W41", expected_neighborhood_version: "${n1_v}" }
              as: WorkplaceProgramOffice
              captures: { alloc_a: $.data.id }
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { n1_v2: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 6, window_start_week: "2026-W39", window_end_week: "2026-W43", expected_neighborhood_version: "${n1_v2}" }
              as: WorkplaceProgramOffice
              captures: { alloc_b: $.data.id }
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { n1_v3: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 1, window_start_week: "2026-W40", window_end_week: "2026-W41", expected_neighborhood_version: "${n1_v3}" }
              as: WorkplaceProgramOffice
              captures: { alloc_c: $.data.id }
          trigger:
            - call: "POST /seat-allocations/${alloc_a}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_b}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_c}/commit"
              payload: {}
              as: WorkplaceProgramOffice
          assert:
            - "Team.${t3_id}.expected_daily_attendance == 25, base_entitlement == 25, buffer_seats_entitled == 3, entitled_seats == 28"
            - "After commit A: Neighborhood.${n1_id}.peak_committed_seats == 20, utilization_pct == 76.92 (round_half_up(100 * 20 / 26, 2)) and allocation_state == OPEN, while committed_seats == 0 because committed_seats is the CURRENT-week load and the logical clock sits in 2026-W36, outside every allocation window"
            - "After commit B: weeks 2026-W39 and 2026-W40 carry 20 + 6 == 26, which equals usable capacity exactly, so the commit returns HTTP 200 with status COMMITTED"
            - "After commit B: Neighborhood.${n1_id}.peak_committed_seats == 26, utilization_pct == 100.00 and allocation_state == TIGHT (>= 90.00 is inclusive)"
            - "Commit C returns HTTP 409 with error id ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED because 2026-W40 would carry 27 seats, one above capacity; SeatAllocation.${alloc_c}.status is still RESERVED"
            - "The refused commit left no trace: Neighborhood.${n1_id}.peak_committed_seats is still 26 and utilization_pct is still 100.00"
            - "SeatAllocation.${alloc_a}.weeks_in_window == 4 and SeatAllocation.${alloc_b}.weeks_in_window == 4; the windows are half-open, so 2026-W41 belongs to B only"
            - "2026-W41 and 2026-W42 carry only 6 committed seats, confirming that allocation A's [2026-W37, 2026-W41) window excludes its own end week"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: relocation_requires_approved_and_non_onsite_classification
        grounds:
          - validations[priority=58, ERR_NO_APPROVED_CLASSIFICATION]
          - errors.ERR_CLASS_NOT_REMOTE_ELIGIBLE
          - calculations.current_eligibility_class
          - entities.EligibilityClassification.fields.state
        blocking_entity: EligibilityClassification
        blocking_states: [DRAFT, PENDING_MANAGER, REJECTED, SUPERSEDED]
        distinguishing_aspect: |
          Whether POST /remote-location-requests is accepted depends on the STATE of
          a row in a different aggregate plus the VALUE that row carries: a
          classification that exists but is only PENDING_MANAGER is as good as
          absent, and an APPROVED classification whose class is ONSITE_REQUIRED
          fails a different check than a missing one. The request payload names
          neither the classification nor its state.
        test_recipe:
          setup:
            - "One OPEN cycle, team T1-CORE, three ACTIVE employees: E-1001 with no classification at all, E-1002 with an APPROVED ONSITE_REQUIRED classification, E-1003 with an APPROVED HYBRID classification."
