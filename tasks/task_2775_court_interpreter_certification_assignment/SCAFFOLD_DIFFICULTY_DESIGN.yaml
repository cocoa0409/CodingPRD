  - rule_id: transitive_cascade
    instances:

      - name: substantiated_suspension_cascades_four_hops_to_hearing_and_ledger
        grounds:
          - state_machines.Complaint.REVIEWED_to_SUBSTANTIATED
          - state_machines.DisciplinaryAction.initial_state
          - state_machines.Interpreter.ACTIVE_to_SUSPENDED
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
          - state_machines.PayClaim.ENCUMBERED_to_VOIDED
          - state_machines.Hearing.COVERED_to_SCHEDULED
          - calculations.courthouse_encumbrance_ledger
          - calculations.interpreter_quality_score
        distinguishing_aspect: |
          A single POST /complaints/{id}/adjudicate propagates four hops without any
          further API call: (1) Complaint -> SUBSTANTIATED, (2) a DisciplinaryAction
          row is created IN_EFFECT with 12 points, (3) the Interpreter drops ACTIVE ->
          SUSPENDED with complaint_points 12 and rolling_12_month_score 52, (4) the
          overlapping CONFIRMED Assignment is CANCELLED, which itself VOIDs its
          ENCUMBERED PayClaim, zeroes Courthouse.encumbered_pay_cents and returns the
          Hearing COVERED -> SCHEDULED.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Language spa; courthouse CH_MAIN with a 5,000,000-cent budget; rate schedule effective 2026-01-01."
            - "Interpreter Ana Reyes ACTIVE with an ACTIVE CERTIFIED spa credential and complaint_points 0."
            - "Hearing H1 at CH_MAIN 2026-09-10T09:00-11:00Z, spa, TRIAL, in custody; Assignment A1 CONFIRMED with an ENCUMBERED PayClaim of 22050 cents, so Courthouse.encumbered_pay_cents == 22050."
            - "Complaint C1 about Ana tied to A1, filed by qr-001 and REVIEWED by qr-002 with recommendation SUBSTANTIATE."
