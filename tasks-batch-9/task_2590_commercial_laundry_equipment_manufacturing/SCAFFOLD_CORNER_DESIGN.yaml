      - name: exclusive_territory_blocks_second_distributor_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=51]
          - errors[ERR_TERRITORY_EXCLUSIVITY_CONFLICT]
          - entities.Distributor.fields.territory_exclusive
        distinguishing_aspect: "Exclusivity is enforced in both directions and across ALL non-TERMINATED rows: once D-01 holds TX-CENTRAL exclusively, even a non-exclusive applicant in that territory is 409, while the same applicant in TX-NORTH is created."
        test_recipe:
          setup: ["Distributor D-01 holding TX-CENTRAL with territory_exclusive true"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-02", legal_name: "Gulf Coin Laundry", territory_code: "TX-CENTRAL", territory_exclusive: false }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "${err} == ERR_TERRITORY_EXCLUSIVITY_CONFLICT"
            - "GET /clm/distributors returns exactly 1 item whose id == ${d1}"
            - "the same D-02 body with territory_code TX-NORTH returns HTTP 201"

