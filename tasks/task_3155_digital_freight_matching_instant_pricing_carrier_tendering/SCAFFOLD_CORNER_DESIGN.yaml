  - name: payout_before_the_due_date_returns_settlement_not_due
    claim_type: Violation → Error
    grounds:
    - errors.ERR_SETTLEMENT_NOT_DUE
    - calculations.settlement_payout_due_at
    - state_machines.CarrierSettlement.READY_to_PAID
    distinguishing_aspect: 'The TERMS payout is gated on payout_due_at: with 30-day terms on a load delivered at 2026-10-06T20:00:00Z
      the due instant is 2026-11-05T20:00:00Z, so a TERMS payout one minute before is rejected with ERR_SETTLEMENT_NOT_DUE
      while a QUICK_PAY payout at the same instant succeeds and discounts the gross.'
