  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pickup_window_buffer_overlap
        grounds:
          - calculations.calc_pickup_window_overlap
          - errors[ERR_PICKUP_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = closed intervals with a 15-minute buffer on both
          sides, resource = giver's porch. A new window [11:10, 12:00] conflicts
          with CONFIRMED [10:00, 11:00] (11:10 < 11:15), while [11:15, 12:15]
          is allowed (strict inequality at exactly existing_end + buffer).
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; group with giver G and claimers M1, M2"
            - "Two ACCEPTED claims C1 (M1), C2 (M2) on G's posts; plan for C1 CONFIRMED with window [2026-05-11T10:00:00Z, 11:00:00Z]"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
