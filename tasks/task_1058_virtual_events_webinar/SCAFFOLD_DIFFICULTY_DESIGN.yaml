              payload: { name: "Summit F", timezone: "UTC", starts_at: "2026-09-15T09:00:00Z", ends_at: "2026-09-15T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tracks"
