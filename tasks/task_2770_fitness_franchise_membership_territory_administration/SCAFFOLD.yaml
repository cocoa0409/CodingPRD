    side_effects: []

  # ---- CorporateAccount ----
  - method: POST
    path: "/franchise/corporate-accounts"
    description: "Opens a national/corporate account whose employees enrol as members at a negotiated credit. Created ACTIVE with pool_balance_cents, allocated_cents, lifetime_funded_cents and enrolled_agreement_count all 0."
    roles: [BrandAdministrator]
    code: 201
    input: [name, corporate_credit_pct, allocation_method]
    output: CorporateAccount
    side_effects: ["CorporateAccount created with status ACTIVE and all money counters 0"]

  - method: POST
    path: "/franchise/corporate-accounts/{id}/fund"
    description: "The corporate customer wires subsidy money into the account's undistributed pool."
    roles: [BrandAdministrator]
    code: 200
    input: [amount_cents]
    output: CorporateAccount
    side_effects: ["pool_balance_cents increases by amount_cents", "lifetime_funded_cents increases by amount_cents", "increments CorporateAccount.version by 1"]

  - method: POST
    path: "/franchise/corporate-accounts/{id}/allocate"
    description: "Distributes the whole undistributed pool across eligible franchisees per corporate_allocation, draining pool_balance_cents to 0. Refused when no franchisee is eligible or the pool is already empty."
    roles: [BrandAdministrator]
    code: 200
    input: ["note?"]
    output: CorporateAccount
    side_effects: ["runs corporate_allocation", "increases every eligible Franchisee.corporate_allocation_cents by its share", "allocated_cents increases by the distributed amount", "pool_balance_cents -> 0", "increments CorporateAccount.version by 1"]

  - method: POST
    path: "/franchise/corporate-accounts/{id}/recall-allocation"
    description: "Compensating reversal of the last allocation: every franchisee's corporate_allocation_cents is decreased by exactly the share it received, allocated_cents returns to 0 and the money reappears in pool_balance_cents. Restores pool_balance_cents + allocated_cents == lifetime_funded_cents."
    roles: [BrandAdministrator]
    code: 200
    input: [reason]
    output: CorporateAccount
    side_effects: ["re-runs corporate_allocation to derive the exact shares to reverse", "decreases every affected Franchisee.corporate_allocation_cents by its share", "pool_balance_cents increases by allocated_cents", "allocated_cents -> 0", "increments CorporateAccount.version by 1"]

  - method: POST
    path: "/franchise/corporate-accounts/{id}/suspend"
    description: "Suspends a corporate account (ACTIVE -> SUSPENDED). No new agreement may enrol in it and no allocation may run."
    roles: [BrandAdministrator]
    code: 200
    input: [reason]
    output: CorporateAccount
    side_effects: ["status -> SUSPENDED", "increments CorporateAccount.version by 1"]

  - method: GET
    path: "/franchise/corporate-accounts/{id}"
    description: "Reads one corporate account including pool_balance_cents, allocated_cents, lifetime_funded_cents and enrolled_agreement_count."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: CorporateAccount
    side_effects: []

  - method: GET
    path: "/franchise/corporate-accounts"
    description: "Lists corporate accounts, optionally filtered by status or allocation method."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["status?", "allocation_method?", "limit?", "offset?"]
    output: CorporateAccount[]
    side_effects: []

  # ---- MembershipAgreement ----
  - method: POST
    path: "/franchise/agreements"
    description: "Signs a standardized membership agreement at a home club. Requires expected_club_version, which must equal the home Club's current version (optimistic concurrency, §1.2.1). state_code, monthly_dues_base_cents, initiation_fee_cents and cancellation_notice_days are pinned from the club and the published template; the four discount fields and effective_monthly_dues_cents come from calculations.effective_monthly_dues. term_end_on is signed_on + 30 * term_months days. The agreement is created PENDING / CURRENT and becomes ACTIVE only once its first PAYMENT_RECEIVED billing event lands."
    roles: [ClubManager, BrandAdministrator]
    code: 201
    input: [member_id, home_club_id, plan_template_id, expected_club_version, signed_on, "multi_club_access?", "promotion_id?", "corporate_account_id?"]
    output: MembershipAgreement
    side_effects: ["runs calculations.effective_monthly_dues and stores promo_discount_cents, corporate_credit_cents, multi_club_credit_cents and effective_monthly_dues_cents", "MembershipAgreement created with agreement_status PENDING, dues_status CURRENT, outstanding_balance_cents 0, dues_paid_cents 0, delinquency_days 0, transfer_count 0", "increments Member.agreement_count by 1 and, if the member was INACTIVE, sets Member.status = ACTIVE", "increments CorporateAccount.enrolled_agreement_count by 1 when corporate_account_id is supplied", "increments Club.version by 1", "increments Member.version by 1"]

  - method: POST
    path: "/franchise/agreements/{id}/freeze"
    description: "The home club places an active membership on hold (agreement_status ACTIVE -> FROZEN). Refused once dues_status has reached DELINQUENT or worse. dues_status keeps advancing from billing events while frozen."
    roles: [ClubManager]
    code: 200
    input: ["reason?"]
    output: MembershipAgreement
    side_effects: ["agreement_status -> FROZEN", "recomputes CorporateAccount.enrolled_agreement_count when corporate_account_id is not null", "increments MembershipAgreement.version by 1"]

  - method: POST
    path: "/franchise/agreements/{id}/unfreeze"
    description: "The home club returns a frozen membership to service (agreement_status FROZEN -> ACTIVE), regardless of the dues_status the agreement drifted to while frozen."
    roles: [ClubManager]
    code: 200
    input: ["note?"]
    output: MembershipAgreement
    side_effects: ["agreement_status -> ACTIVE", "recomputes CorporateAccount.enrolled_agreement_count when corporate_account_id is not null", "increments MembershipAgreement.version by 1"]

  - method: POST
    path: "/franchise/agreements/{id}/request-cancellation"
    description: "The member exercises the contract's cancellation right. Runs calculations.cancellation_settlement, which branches on the state health-club statute: inside cooling_off_days the agreement goes straight to CANCELLED with a full refund of initiation fee plus dues paid and no early-termination fee; outside it the agreement goes to CANCELLATION_PENDING with cancellation_effective_on = clock + cancellation_notice_days, a prorated refund only where the statute requires proration, and a capped early-termination fee. Refused while dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}."
    roles: [Member]
    code: 200
    input: ["reason?"]
    output: MembershipAgreement
    side_effects: ["runs calculations.cancellation_settlement and stores refund_cents, early_termination_fee_cents, net_settlement_cents, cancellation_requested_on and cancellation_effective_on", "on the cooling-off branch: agreement_status -> CANCELLED, decrements Club.active_agreement_count, recomputes Club.delinquent_member_count and Club.collections_watch, recomputes Franchisee.compliance_score, decrements Member.agreement_count and sets Member.status = INACTIVE at zero, recomputes CorporateAccount.enrolled_agreement_count", "on the notice branch: agreement_status -> CANCELLATION_PENDING with every club, member and franchisee counter left untouched", "increments MembershipAgreement.version by 1"]

  - method: POST
    path: "/franchise/agreements/{id}/finalize-cancellation"
    description: "The home club closes out a notice-period cancellation once the logical clock has reached cancellation_effective_on (CANCELLATION_PENDING -> CANCELLED). Refused earlier with ERR_NOTICE_PERIOD_NOT_ELAPSED."
    roles: [ClubManager]
    code: 200
    input: ["note?"]
    output: MembershipAgreement
    side_effects: ["agreement_status -> CANCELLED", "decrements Club.active_agreement_count by 1 and recomputes Club.delinquent_member_count and Club.collections_watch", "recomputes Franchisee.compliance_score", "decrements Member.agreement_count by 1 and sets Member.status = INACTIVE at zero", "recomputes CorporateAccount.enrolled_agreement_count when corporate_account_id is not null", "increments MembershipAgreement.version, Club.version and Member.version by 1 each"]

  - method: POST
    path: "/franchise/agreements/{id}/place-in-collections"
    description: "The third-party billing partner places a delinquent account with collections (dues_status DELINQUENT -> IN_COLLECTIONS). Requires delinquency_days >= COLLECTIONS_DAYS_THRESHOLD; refused earlier with ERR_COLLECTIONS_THRESHOLD_NOT_MET. Appends a zero-amount COLLECTION_PLACED billing event."
    roles: [BillingPartner]
    code: 200
    input: [agency_reference]
    output: MembershipAgreement
    side_effects: ["dues_status -> IN_COLLECTIONS", "appends a BillingEvent with event_type COLLECTION_PLACED, amount_cents 0, source SYSTEM", "leaves Club.delinquent_member_count unchanged", "increments MembershipAgreement.version by 1"]

  - method: GET
    path: "/franchise/agreements/{id}"
    description: "Reads one membership agreement including version (for optimistic concurrency on transfer creation), the pinned pricing fields, both status dimensions, outstanding_balance_cents, dues_paid_cents, delinquency_days, transfer_count and the cancellation settlement fields."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: MembershipAgreement
    side_effects: []

  - method: GET
    path: "/franchise/agreements"
    description: "Lists membership agreements, optionally filtered by member, home club, plan template, promotion, corporate account or either status dimension."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["member_id?", "home_club_id?", "plan_template_id?", "promotion_id?", "corporate_account_id?", "agreement_status?", "dues_status?", "limit?", "offset?"]
    output: MembershipAgreement[]
    side_effects: []

  # ---- BillingEvent ----
  - method: POST
    path: "/franchise/billing-events"
    description: "The third-party billing partner appends an immutable dues-ledger entry. DUES_POSTED requires due_on; PAYMENT_RECEIVED, PAYMENT_FAILED and WRITE_OFF do not. Re-runs calculations.dues_ledger_projection over the whole ledger in (occurred_on ASC, created_at ASC) order and re-derives outstanding_balance_cents, dues_paid_cents, delinquency_days and dues_status. The first PAYMENT_RECEIVED with amount_cents > 0 also moves the agreement from PENDING to ACTIVE."
    roles: [BillingPartner, BrandAdministrator]
    code: 201
    input: [agreement_id, event_type, amount_cents, occurred_on, "due_on?"]
    output: BillingEvent
    side_effects: ["BillingEvent created with source BILLING_PARTNER and resulting_outstanding_balance_cents set from the projection", "re-runs calculations.dues_ledger_projection and rewrites MembershipAgreement.outstanding_balance_cents, dues_paid_cents, delinquency_days and dues_status", "moves agreement_status PENDING -> ACTIVE on the first PAYMENT_RECEIVED with amount_cents > 0, incrementing Club.active_agreement_count", "recomputes Club.delinquent_member_count and Club.collections_watch via calculations.club_delinquency_share", "recomputes Franchisee.compliance_score and demotes the franchisee to PROBATION when it falls below PROBATION_SCORE_THRESHOLD", "increments MembershipAgreement.version, Club.version and Franchisee.version by 1 each"]

  - method: GET
    path: "/franchise/billing-events/{id}"
    description: "Reads one immutable billing ledger entry. BillingEvent has no version field and no update endpoint."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: BillingEvent
    side_effects: []

  - method: GET
    path: "/franchise/agreements/{id}/billing-events"
    description: "Lists the full immutable dues ledger of one agreement in (occurred_on ASC, created_at ASC) order, including the system-generated TRANSFER_FEE_POSTED and COLLECTION_PLACED entries that no creation response ever returns."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: BillingEvent[]
    side_effects: []

  # ---- TransferRequest ----
  - method: POST
    path: "/franchise/transfer-requests"
    description: "The releasing club opens a request to move a membership to another club. Requires expected_agreement_version, which must equal the agreement's current version (optimistic concurrency, §1.2.1). from_club_id must equal the agreement's current home_club_id and must differ from to_club_id; a cross-state destination is refused when the agreement's statute forbids it; refused while dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}."
    roles: [ClubManager]
    code: 201
    input: [agreement_id, from_club_id, to_club_id, expected_agreement_version, reason]
    output: TransferRequest
    side_effects: ["TransferRequest created with status REQUESTED and transfer_fee_cents null", "increments MembershipAgreement.version by 1"]

  - method: POST
    path: "/franchise/transfer-requests/{id}/decide"
    description: "The receiving club approves or denies the transfer (REQUESTED -> APPROVED or DENIED). Approval requires the receiving club to be OPEN and not NON_COMPLIANT and the agreement's dues_status to be CURRENT or PAST_DUE, and pins transfer_fee_cents from calculations.transfer_fee (zero for an intra-franchise move)."
    roles: [ClubManager]
    code: 200
    input: [decision, "note?"]
    output: TransferRequest
    side_effects: ["status -> APPROVED or DENIED", "on APPROVE runs calculations.transfer_fee and pins transfer_fee_cents", "decided_by_user_id set to X-User-ID", "increments TransferRequest.version by 1"]

  - method: POST
    path: "/franchise/transfer-requests/{id}/complete"
    description: "The receiving club executes the approved transfer (APPROVED -> COMPLETED), moving the agreement's home club and settling the transfer fee onto the dues ledger. state_code and effective_monthly_dues_cents stay pinned at their signing values."
    roles: [ClubManager]
    code: 200
    input: ["note?"]
    output: TransferRequest
    side_effects: ["status -> COMPLETED and effective_on = clock date", "rewrites MembershipAgreement.home_club_id to to_club_id and increments transfer_count by 1", "recomputes active_agreement_count, delinquent_member_count and collections_watch on both the releasing and the receiving Club via calculations.club_delinquency_share", "recomputes Franchisee.compliance_score for both clubs' franchisees", "when transfer_fee_cents > 0 appends a system BillingEvent with event_type TRANSFER_FEE_POSTED, due_on = clock date + TRANSFER_FEE_DUE_DAYS days and source SYSTEM, then re-runs calculations.dues_ledger_projection", "increments TransferRequest.version, MembershipAgreement.version and both Club.version values by 1 each"]

  - method: GET
    path: "/franchise/transfer-requests/{id}"
    description: "Reads one transfer request including transfer_fee_cents, effective_on and decided_by_user_id."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: TransferRequest
    side_effects: []

  - method: GET
    path: "/franchise/transfer-requests"
    description: "Lists transfer requests, optionally filtered by agreement, releasing club, receiving club or status."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["agreement_id?", "from_club_id?", "to_club_id?", "status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []

  # ---- GuestUsageEvent ----
  - method: POST
    path: "/franchise/guest-usage-events"
    description: "The host club records a batch of cross-club guest visits for one member in one calendar month. The agreement must carry multi_club_access == true and host_club_id must differ from the agreement's current home_club_id. home_club_id_at_visit and guest_fee_cents_at_visit are snapshotted from the agreement and the host club at recording time, and usage_fee_cents = visit_count * guest_fee_cents_at_visit. The row is immutable (no version, no update endpoint) and starts unsettled with settlement_id null."
    roles: [ClubManager, BrandAdministrator]
    code: 201
    input: [agreement_id, host_club_id, period_month, visit_count]
    output: GuestUsageEvent
    side_effects: ["GuestUsageEvent created with settlement_id null", "home_club_id_at_visit snapshotted from MembershipAgreement.home_club_id", "guest_fee_cents_at_visit snapshotted from the host Club.guest_fee_cents", "usage_fee_cents computed as visit_count * guest_fee_cents_at_visit"]

  - method: GET
    path: "/franchise/guest-usage-events/{id}"
    description: "Reads one immutable guest usage batch including its snapshotted home club, snapshotted guest fee, usage_fee_cents and settlement_id."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: GuestUsageEvent
    side_effects: []

  - method: GET
    path: "/franchise/guest-usage-events"
    description: "Lists guest usage batches, optionally filtered by agreement, host club, snapshotted home club, owning settlement or period. Filtering by settlement_id is the only way to see which rows a settlement swept, and re-filtering after a reversal shows them released back to unsettled."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["agreement_id?", "host_club_id?", "home_club_id_at_visit?", "settlement_id?", "period_month?", "limit?", "offset?"]
    output: GuestUsageEvent[]
    side_effects: []

  # ---- UsageSettlement ----
  - method: POST
    path: "/franchise/usage-settlements"
    description: "Sweeps every unsettled guest usage batch for one (period_month, home_club_id, host_club_id) triple and computes the inter-club payable via calculations.usage_settlement_net. Refused with ERR_NO_SETTLEABLE_USAGE when the sweep is empty, and with ERR_DUPLICATE_SETTLEMENT_PERIOD when an OPEN or POSTED settlement already exists for the same triple. Created OPEN; no money moves until it is posted."
    roles: [BrandAdministrator]
    code: 201
    input: [period_month, home_club_id, host_club_id]
    output: UsageSettlement
    side_effects: ["runs calculations.usage_settlement_net and stores event_count, visit_count, gross_fee_cents, admin_hold_cents, net_before_rebate_cents, rebate_pct, volume_rebate_cents and net_payable_cents", "stamps settlement_id onto every swept GuestUsageEvent", "UsageSettlement created with status OPEN"]

  - method: POST
    path: "/franchise/usage-settlements/{id}/post"
    description: "Posts an OPEN settlement to the two clubs' ledgers (OPEN -> POSTED): the home club owes, the host club is credited, so the sum of Club.settlement_ledger_cents over every club stays exactly 0."
    roles: [BrandAdministrator]
    code: 200
    input: ["note?"]
    output: UsageSettlement
    side_effects: ["decrements the home Club.settlement_ledger_cents by net_payable_cents", "increments the host Club.settlement_ledger_cents by net_payable_cents", "status -> POSTED and posted_on = clock date", "increments UsageSettlement.version and both Club.version values by 1 each"]

  - method: POST
    path: "/franchise/usage-settlements/{id}/reverse"
    description: "Compensating reversal of a POSTED settlement (POSTED -> REVERSED): both club ledgers return to their pre-post values and every swept GuestUsageEvent has settlement_id cleared to null so it can be settled again."
    roles: [BrandAdministrator]
    code: 200
    input: [reason]
    output: UsageSettlement
    side_effects: ["increments the home Club.settlement_ledger_cents by net_payable_cents and decrements the host Club's by the same amount", "clears settlement_id back to null on every swept GuestUsageEvent", "status -> REVERSED and reversed_on = clock date", "increments UsageSettlement.version and both Club.version values by 1 each"]

  - method: GET
    path: "/franchise/usage-settlements/{id}"
    description: "Reads one settlement including every waterfall stage: gross_fee_cents, admin_hold_cents, net_before_rebate_cents, rebate_pct, volume_rebate_cents and net_payable_cents."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: UsageSettlement
    side_effects: []

  - method: GET
    path: "/franchise/usage-settlements"
    description: "Lists settlements, optionally filtered by home club, host club, period or status."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["home_club_id?", "host_club_id?", "period_month?", "status?", "limit?", "offset?"]
    output: UsageSettlement[]
    side_effects: []

  # ---- RoyaltyReport ----
  - method: POST
    path: "/franchise/royalty-reports"
    description: "The franchisee self-reports its membership count for a closed month. The server independently derives the verified basis from the ledger and computes both royalty variants via calculations.royalty_due, then auto-accepts the report when abs(variance_pct) <= ROYALTY_VARIANCE_TOLERANCE_PCT and disputes it otherwise. period_month must be strictly earlier than the logical clock's own month. One report per (franchisee_id, period_month)."
    roles: [FranchiseOwner]
    code: 201
    input: [franchisee_id, period_month, reported_member_count]
    output: RoyaltyReport
    side_effects: ["runs calculations.royalty_due and stores verified_member_count, reported_dues_basis_cents, verified_dues_basis_cents, reported_royalty_cents, royalty_due_cents and variance_pct", "status auto-resolves to ACCEPTED or DISPUTED", "on DISPUTED increments Franchisee.disputed_royalty_count by 1, recomputes Franchisee.compliance_score and demotes the franchisee to PROBATION when it falls below PROBATION_SCORE_THRESHOLD", "increments Franchisee.version by 1 on the DISPUTED path"]

  - method: POST
    path: "/franchise/royalty-reports/{id}/adjudicate"
    description: "Brand finance settles a disputed report (DISPUTED -> ADJUSTED) at a negotiated figure that must lie between royalty_due_cents and reported_royalty_cents inclusive. Clearing the dispute releases the compliance penalty."
    roles: [BrandAdministrator]
    code: 200
    input: [adjusted_royalty_cents, "note?"]
    output: RoyaltyReport
    side_effects: ["status -> ADJUSTED, adjusted_royalty_cents stored, adjudicated_by_user_id set to X-User-ID", "decrements Franchisee.disputed_royalty_count by 1 and recomputes Franchisee.compliance_score", "increments RoyaltyReport.version and Franchisee.version by 1 each"]

  - method: GET
    path: "/franchise/royalty-reports/{id}"
    description: "Reads one royalty report including both bases, both royalty variants, variance_pct and adjusted_royalty_cents."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: RoyaltyReport
    side_effects: []

  - method: GET
    path: "/franchise/royalty-reports"
    description: "Lists royalty reports, optionally filtered by franchisee, period or status."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["franchisee_id?", "period_month?", "status?", "limit?", "offset?"]
    output: RoyaltyReport[]
    side_effects: []

  # ---- FacilityInspection ----
  - method: POST
    path: "/franchise/inspections"
    description: "Schedules a facility inspection for a club. inspection_date may not be later than the logical clock date. Created SCHEDULED with score null."
    roles: [ComplianceAuditor, BrandAdministrator]
    code: 201
    input: [club_id, inspection_date]
    output: FacilityInspection
    side_effects: ["FacilityInspection created with status SCHEDULED and score null"]

  - method: POST
    path: "/franchise/inspections/{id}/score"
    description: "The auditor records the four sub-scores and the oldest equipment age. Selects the refresh-cycle variant from the club's opened_on and current equipment_compliance_state, computes the score via calculations.inspection_score, re-derives the club's compliance posture, and auto-resolves the inspection to CLOSED at or above REMEDIATION_SCORE_THRESHOLD or to REMEDIATION_REQUIRED below it. A NON_COMPLIANT result suspends the club, and a sufficiently damaged compliance_score demotes the franchisee, which in turn withdraws its approved promotions."
    roles: [ComplianceAuditor]
    code: 200
    input: [equipment_condition_pts, cleanliness_pts, safety_pts, equipment_age_months_max]
    output: FacilityInspection
    side_effects: ["runs calculations.inspection_score and stores refresh_cycle_months_applied, refresh_pts, score and variant_applied", "scored_by_user_id set to X-User-ID", "sets Club.last_inspection_score and re-derives Club.equipment_compliance_state", "sets Club.status = SUSPENDED when the club became NON_COMPLIANT, or back to OPEN when a suspended club recovered", "recomputes Franchisee.inspection_fail_streak and Franchisee.compliance_score via calculations.franchisee_compliance_score", "sets Franchisee.status = PROBATION when compliance_score fell below PROBATION_SCORE_THRESHOLD, which transitions every APPROVED Promotion of that franchisee to WITHDRAWN_BY_BRAND", "status auto-resolves to CLOSED or REMEDIATION_REQUIRED", "increments FacilityInspection.version, Club.version and Franchisee.version by 1 each"]

  - method: POST
    path: "/franchise/inspections/{id}/waive-remediation"
    description: "A second auditor waives the remediation requirement (REMEDIATION_REQUIRED -> REMEDIATION_WAIVED), lifting the club suspension to WATCH. The X-User-ID that scored the inspection may not waive it. Refused with ERR_REMEDIATION_NOT_REQUIRED when the inspection is not in REMEDIATION_REQUIRED. The franchisee's inspection_fail_streak is deliberately NOT reset."
    roles: [ComplianceAuditor]
    code: 200
    input: [reason]
    output: FacilityInspection
    side_effects: ["status -> REMEDIATION_WAIVED, waived_by_user_id set to X-User-ID, waiver_reason stored", "sets Club.equipment_compliance_state = WATCH and Club.status = OPEN when the club was SUSPENDED", "recomputes Franchisee.compliance_score with the unchanged inspection_fail_streak", "increments FacilityInspection.version and Club.version by 1 each"]

  - method: POST
    path: "/franchise/inspections/{id}/close"
    description: "Brand administration files an inspection away from REMEDIATION_REQUIRED or REMEDIATION_WAIVED (-> CLOSED). Closing a REMEDIATION_REQUIRED inspection does not lift the club suspension."
    roles: [BrandAdministrator]
    code: 200
    input: ["note?"]
    output: FacilityInspection
    side_effects: ["status -> CLOSED", "increments FacilityInspection.version by 1"]

  - method: GET
    path: "/franchise/inspections/{id}"
    description: "Reads one inspection including refresh_cycle_months_applied, refresh_pts, score, variant_applied, scored_by_user_id and waived_by_user_id."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: FacilityInspection
    side_effects: []

  - method: GET
    path: "/franchise/inspections"
    description: "Lists facility inspections, optionally filtered by club, status or applied variant."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["club_id?", "status?", "variant_applied?", "limit?", "offset?"]
    output: FacilityInspection[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth / schema ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role attempts a write on a resource it does not own (franchisee_id, home_club_id, from_club_id, to_club_id, host_club_id or member_id does not equal X-User-ID)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum value, malformed date or period_month, negative money amount, out-of-range coordinate or percentage, non-positive protected_radius_km, visit_count < 1, limit outside 1..100, offset < 0, starts_on after ends_on, adjusted_royalty_cents outside the [royalty_due_cents, reported_royalty_cents] band"

  # --- grouped not-found codes ---
  - id: ERR_FRANCHISEE_NOT_FOUND
    http: 404
    condition: "the referenced Franchisee id does not exist"
  - id: ERR_TERRITORY_NOT_FOUND
    http: 404
    condition: "the referenced Territory id does not exist"
  - id: ERR_CLUB_NOT_FOUND
    http: 404
    condition: "any referenced Club id (club_id, home_club_id, host_club_id, from_club_id, to_club_id) does not exist"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "the referenced Member id does not exist"
  - id: ERR_PLAN_ASSET_NOT_FOUND
    http: 404
    condition: "the referenced MembershipPlanTemplate, Promotion or CorporateAccount id does not exist"
  - id: ERR_MEMBERSHIP_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced MembershipAgreement, TransferRequest, GuestUsageEvent or BillingEvent id does not exist"
  - id: ERR_OPS_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced RelocationRequest, FacilityInspection, UsageSettlement or RoyaltyReport id does not exist"

  # --- optimistic concurrency ---
  - id: ERR_STALE_CLUB_VERSION
    http: 412
    condition: "expected_club_version on POST /franchise/agreements does not equal the home Club's current version"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version on POST /franchise/transfer-requests does not equal the MembershipAgreement's current version"

  # --- state precondition errors ---
  - id: ERR_INVALID_TERRITORY_STATE
    http: 409
    condition: "POST /franchise/clubs names a Territory whose status is already ACTIVE, i.e. its club has opened - a RESERVED Territory is the only state that accepts a new Club shell"
  - id: ERR_CLUB_NOT_OPERATIONAL
    http: 409
    condition: "the Club is not OPEN, or its equipment_compliance_state is NON_COMPLIANT, so it may not host a new agreement, record a guest visit, or receive a transfer"
  - id: ERR_INVALID_RELOCATION_STATE
    http: 409
    condition: "the RelocationRequest is not in a state from which the requested transition is declared (e.g. deciding a DRAFT request, withdrawing a SUBMITTED request, submitting an APPROVED request)"
  - id: ERR_PLAN_NOT_PUBLISHED
    http: 409
    condition: "the referenced MembershipPlanTemplate is still DRAFT, so it may not back an agreement or a promotion"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "POST /franchise/plan-templates/{id}/publish was called on a MembershipPlanTemplate whose status is already PUBLISHED, so the DRAFT -> PUBLISHED transition is not available"
  - id: ERR_INVALID_PROMOTION_STATE
    http: 409
    condition: "the Promotion is not PENDING_REVIEW when reviewed, or is not APPROVED when cited by a new agreement"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "the MembershipAgreement's agreement_status does not permit the requested transition (freezing a PENDING or FROZEN agreement, unfreezing an ACTIVE one, cancelling a CANCELLED one, finalizing an agreement that is not CANCELLATION_PENDING)"
  - id: ERR_INVALID_DUES_STATE
    http: 409
    condition: "the MembershipAgreement's dues_status does not permit the requested transition (placing a CURRENT or PAST_DUE account in collections, writing off an account that is not IN_COLLECTIONS)"
  - id: ERR_INVALID_TRANSFER_STATE
    http: 409
    condition: "the TransferRequest is not REQUESTED when decided, or not APPROVED when completed"
  - id: ERR_INVALID_SETTLEMENT_STATE
    http: 409
    condition: "the UsageSettlement is not OPEN when posted, or not POSTED when reversed"
  - id: ERR_INVALID_INSPECTION_STATE
    http: 409
    condition: "the FacilityInspection is not SCHEDULED when scored, or not in REMEDIATION_REQUIRED / REMEDIATION_WAIVED when closed"
  - id: ERR_INVALID_ROYALTY_STATE
    http: 409
    condition: "the RoyaltyReport is not DISPUTED when adjudicated"
  - id: ERR_INVALID_ALLOCATION_STATE
    http: 409
    condition: "an allocation is requested with pool_balance_cents == 0, or a recall is requested with allocated_cents == 0"
  - id: ERR_CORPORATE_ACCOUNT_SUSPENDED
    http: 409
    condition: "a new MembershipAgreement names a CorporateAccount whose status is SUSPENDED"

  # --- segregation of duties ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already played the incompatible role on this record: it submitted the RelocationRequest it is now deciding, or it scored the FacilityInspection whose remediation it is now waiving"

  # --- statute / safety ---
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "finalize-cancellation was called before the logical clock reached cancellation_effective_on"
  - id: ERR_STATUTE_NOTICE_LIMIT
    http: 409
    condition: "the plan template's cancellation_notice_days exceeds STATE_STATUTES[home club's state_code].max_notice_days"
  - id: ERR_CROSS_STATE_TRANSFER_PROHIBITED
    http: 409
    condition: "the destination club sits in a different state_code and the agreement's own statute sets cross_state_transfer_allowed == false"
  - id: ERR_REMEDIATION_NOT_REQUIRED
    http: 409
    condition: "waive-remediation was called on an inspection whose score is at or above REMEDIATION_SCORE_THRESHOLD, or which is not in REMEDIATION_REQUIRED"

  # --- referential coherence ---
  - id: ERR_HOME_CLUB_MISMATCH
    http: 409
    condition: "from_club_id does not equal the agreement's current home_club_id, or a cited Promotion belongs to a different franchisee or a different plan_template_id than the agreement uses"
  - id: ERR_SAME_CLUB_TRANSFER
    http: 409
    condition: "from_club_id equals to_club_id, or a settlement names the same club as both home and host"
  - id: ERR_GUEST_VISIT_NOT_ALLOWED
    http: 409
    condition: "the agreement does not carry multi_club_access, or host_club_id equals the agreement's current home_club_id"

  # --- constraint / uniqueness / geometry ---
  - id: ERR_TERRITORY_ENCROACHMENT
    http: 409
    condition: "the proposed circle's territory_encroachment_slack against another franchisee's RESERVED or ACTIVE territory is negative"
  - id: ERR_RELOCATION_PENDING
    http: 409
    condition: "the club already has a RelocationRequest in DRAFT, SUBMITTED or CHANGES_REQUESTED, or is being opened while such a request exists"
  - id: ERR_RELOCATION_REVISION_LIMIT
    http: 409
    condition: "resubmitting would push RelocationRequest.revision_count past RELOCATION_REVISION_LIMIT"
  - id: ERR_DISCOUNT_CAP_EXCEEDED
    http: 409
    condition: "Promotion.discount_pct exceeds MAX_FRANCHISE_DISCOUNT_PCT"
  - id: ERR_DUPLICATE_SETTLEMENT_PERIOD
    http: 409
    condition: "an OPEN or POSTED UsageSettlement already exists for the same (period_month, home_club_id, host_club_id)"
  - id: ERR_DUPLICATE_ROYALTY_PERIOD
    http: 409
    condition: "a RoyaltyReport already exists for the same (franchisee_id, period_month)"
  - id: ERR_TERRITORY_OCCUPIED
    http: 409
    condition: "the RESERVED Territory already holds a PRE_OPENING Club, so a second Club shell may not be created in it"
  - id: ERR_FRANCHISEE_ON_PROBATION
    http: 409
    condition: "a Promotion approval was attempted while the owning Franchisee.status == PROBATION"
  - id: ERR_PROMOTION_WINDOW_CLOSED
    http: 409
    condition: "the cited Promotion's closed [starts_on, ends_on] window does not contain the logical clock date"
  - id: ERR_PROMO_WINDOW_CONFLICT
    http: 409
    condition: "the proposed closed promotion window overlaps another PENDING_REVIEW or APPROVED promotion for the same (franchisee_id, plan_template_id), or is separated from it by fewer than PROMO_COOLING_GAP_DAYS whole days - a gap of exactly PROMO_COOLING_GAP_DAYS is accepted, a gap of PROMO_COOLING_GAP_DAYS - 1 is rejected"
  - id: ERR_REPORT_PERIOD_NOT_CLOSED
    http: 409
    condition: "the RoyaltyReport's period_month is the logical clock's own month or later"

  # --- fiscal ---
  - id: ERR_PRICE_BELOW_FLOOR
    http: 409
    condition: "the gross monthly dues after every discount component falls below the plan template's floor_price_cents"
  - id: ERR_CANCELLATION_BLOCKED_BY_ARREARS
    http: 409
    condition: "cancellation was requested while dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}"
  - id: ERR_TRANSFER_BLOCKED_BY_ARREARS
    http: 409
    condition: "a transfer was requested or approved while dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}"
  - id: ERR_COLLECTIONS_THRESHOLD_NOT_MET
    http: 409
    condition: "place-in-collections was called with delinquency_days below COLLECTIONS_DAYS_THRESHOLD"
  - id: ERR_INVALID_DUES_EVENT
    http: 409
    condition: "a PAYMENT_RECEIVED or WRITE_OFF amount exceeds the agreement's current outstanding_balance_cents, a DUES_POSTED event omits due_on, or any dues event is posted against a CANCELLED agreement"
  - id: ERR_NO_SETTLEABLE_USAGE
    http: 409
    condition: "no unsettled GuestUsageEvent matches the requested (period_month, home_club_id, host_club_id) triple"
  - id: ERR_NO_ELIGIBLE_FRANCHISEE
    http: 409
    condition: "no ACTIVE, national_account_eligible Franchisee holds an enrolled agreement for this corporate account, so the pool cannot be allocated"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: BrandAdministrator
    description: "Franchisor headquarters staff: owns the brand's standards, the plan-template library, territory grants, relocation adjudication, promotional-pricing governance, corporate/national accounts and inter-club settlement posting."
    identity: "opaque"
    exclusive_operations:
      - "POST /franchise/franchisees"
      - "POST /franchise/franchisees/{id}/reinstate"
      - "POST /franchise/territories"
      - "POST /franchise/relocation-requests/{id}/request-changes"
      - "POST /franchise/relocation-requests/{id}/decide"
      - "POST /franchise/plan-templates"
      - "POST /franchise/plan-templates/{id}/publish"
      - "POST /franchise/promotions/{id}/review"
      - "POST /franchise/corporate-accounts"
      - "POST /franchise/corporate-accounts/{id}/fund"
      - "POST /franchise/corporate-accounts/{id}/allocate"
      - "POST /franchise/corporate-accounts/{id}/recall-allocation"
      - "POST /franchise/corporate-accounts/{id}/suspend"
      - "POST /franchise/usage-settlements"
      - "POST /franchise/usage-settlements/{id}/post"
      - "POST /franchise/usage-settlements/{id}/reverse"
      - "POST /franchise/royalty-reports/{id}/adjudicate"
      - "POST /franchise/inspections/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /franchise/clubs (with FranchiseOwner)"
      - "POST /franchise/members (with ClubManager)"
      - "POST /franchise/agreements (with ClubManager)"
      - "POST /franchise/billing-events (with BillingPartner)"
      - "POST /franchise/guest-usage-events (with ClubManager)"
      - "POST /franchise/inspections (with ComplianceAuditor)"
      - "every GET endpoint"

  - name: FranchiseOwner
    description: "The franchisee legal entity. Opens clubs inside its granted territory, drafts and submits relocation requests, files promotional pricing for brand review, and self-reports membership counts for royalty."
    identity: "entity_backed:Franchisee"
    exclusive_operations:
      - "POST /franchise/relocation-requests"
      - "POST /franchise/relocation-requests/{id}/submit"
      - "POST /franchise/relocation-requests/{id}/withdraw"
      - "POST /franchise/clubs/{id}/open"
      - "POST /franchise/promotions"
      - "POST /franchise/royalty-reports"
    shared_operations:
      - "POST /franchise/clubs (with BrandAdministrator)"
      - "every GET endpoint"

  - name: ClubManager
    description: "The general manager of one club. Sells and services membership agreements at that club, records cross-club guest usage it hosts, and handles the transfer of memberships into and out of the club."
    identity: "entity_backed:Club"
    exclusive_operations:
      - "POST /franchise/agreements/{id}/freeze"
      - "POST /franchise/agreements/{id}/unfreeze"
      - "POST /franchise/agreements/{id}/finalize-cancellation"
      - "POST /franchise/transfer-requests"
      - "POST /franchise/transfer-requests/{id}/decide"
      - "POST /franchise/transfer-requests/{id}/complete"
    shared_operations:
      - "POST /franchise/members (with BrandAdministrator)"
      - "POST /franchise/agreements (with BrandAdministrator)"
      - "POST /franchise/guest-usage-events (with BrandAdministrator)"
      - "every GET endpoint"

  - name: ComplianceAuditor
    description: "Independent brand-standards inspector. Schedules and scores facility inspections and may waive another auditor's remediation finding, but has no pricing, billing or territory authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /franchise/inspections/{id}/score"
      - "POST /franchise/inspections/{id}/waive-remediation"
    shared_operations:
      - "POST /franchise/inspections (with BrandAdministrator)"
      - "every GET endpoint"

  - name: BillingPartner
    description: "The third-party dues-billing and collections vendor. Appends immutable ledger entries and places delinquent accounts with collections; it can never alter pricing, membership state directly, or franchise records."
    identity: "opaque"
    exclusive_operations:
      - "POST /franchise/agreements/{id}/place-in-collections"
