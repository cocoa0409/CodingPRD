            - { call: "POST /compliance/roles", payload: { code: "R-RW2", name: "RW Two" }, as: ComplianceAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-RW-1", full_name: "RW Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${r1}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${r2}", effective_at: "2026-08-03T09:00:00Z" }, as: HRAdmin, captures: { rc: "$.data.id", rc_st: "$.data.status" } }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/role-changes/${rc}/reverse", payload: {}, as: HRAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "rc_st == \"APPLIED\""
            - "err == \"ERR_RETROACTIVE_LIMIT_EXCEEDED\" (now 2026-08-18T09:00:00Z > applied_at 2026-08-03T09:00:00Z + 14 days = 2026-08-17T09:00:00Z)"

