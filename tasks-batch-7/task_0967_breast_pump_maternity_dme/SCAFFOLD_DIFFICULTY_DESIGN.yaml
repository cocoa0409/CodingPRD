  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: pump_allowance_qualify_cancel_conservation
        grounds:
          - state_machines.PumpOrder
          - entities.InsurancePolicy.fields.pumps_consumed_count
        distinguishing_aspect: |
          Conserved quantity: unit count. Invariant — policy.pumps_consumed_count ==
          |orders of this policy with fulfillment_status IN {QUALIFIED, SHIPPED,
          DELIVERED}|. Forward action qualify moves 0 -> 1; compensating cancel returns
          it to 0 and restores the prescription to VERIFIED.
        test_recipe:
          setup:
            - "Policy pump_allowance_per_period 1; order created and qualified (count 1, prescription CONSUMED)"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Inv Mem", email: "inv@x.com", date_of_birth: "1989-08-18", shipping_address: "20 Dogwood St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", pump_allowance_per_period: 1 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "20 Dogwood St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
          trigger:
            - call: "POST /dme/pump-orders/${o_id}/cancel"
              as: CareCoordinator
          assert:
            - "InsurancePolicy.${pol_id}.pumps_consumed_count == 0 (invariant: equals count of the policy's QUALIFIED/SHIPPED/DELIVERED orders, which is 0)"
            - "Prescription.${rx_id}.status == VERIFIED and consumed_by_order_id == null"
            - "PumpOrder.${o_id}.fulfillment_status == CANCELLED"

      - name: remit_void_monetary_conservation
        grounds:
          - state_machines.Claim
          - entities.Member.fields.out_of_pocket_balance_cents
        distinguishing_aspect: |
          Conserved quantity: money (different type than instance 1's unit count).
          Invariant — member.out_of_pocket_balance_cents == sum of
          patient_responsibility_cents over the member's Claims with status ADJUDICATED.
          Forward remit APPROVED adds 25000; compensating void restores 0 along with
          deductible_met_cents and oop_accumulated_cents.
        test_recipe:
          setup:
            - "Delivered pump order; claim SUBMITTED by ins-1; remit APPROVED with allowed 25000, paid 0 (patient 25000) posted by bill-1"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Mon Mem", email: "mon@x.com", date_of_birth: "1993-09-19", shipping_address: "21 Redwood St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", deductible_cents: 50000, coinsurance_pct: 0.2 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "21 Redwood St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-M" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "POST /dme/claims"
              payload: { pump_order_id: "${o_id}" }
              as: InsuranceSpecialist
              as_user_id: "ins-1"
              captures: { cl_id: $.data.id }
            - call: "POST /dme/claims/${cl_id}/remit"
              payload: { outcome: "APPROVED", adjudicated_allowed_cents: 25000, insurance_paid_cents: 0 }
              as: BillingSpecialist
              as_user_id: "bill-1"
          trigger:
            - call: "POST /dme/claims/${cl_id}/void"
              as: BillingSpecialist
              as_user_id: "bill-2"
          assert:
            - "Claim.${cl_id}.status == VOID"
            - "Member.${m_id}.out_of_pocket_balance_cents == 0 (invariant: equals sum of patient_responsibility_cents over ADJUDICATED claims, which is 0)"
            - "Member.${m_id}.oop_accumulated_cents == 0"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 0"
            - "PumpOrder.${o_id}.billing_status == CLAIM_FILED"
