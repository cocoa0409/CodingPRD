    roles: [RegionalManager]
    code: 200
    input: []
    output: OperatorAgreement
    side_effects: ["status SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/operator-agreements/{agreementId}/terminate"
    description: "Terminate an agreement (terminal); last-ACTIVE termination suspends the stand and drains its queue"
    roles: [RegionalManager]
    code: 200
    input: []
    output: OperatorAgreement
    side_effects: ["status -> TERMINATED", "stand suspension cascade (orders ABANDONED, payments VOIDED, lane slots released)"]

  # --- Recipe ---
  - method: POST
    path: "/recipes"
