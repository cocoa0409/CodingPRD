        distinguishing_aspect: "An EntryFiler posts an importer body that is ALSO malformed (dnb_number missing); the answer must be 403 ERR_ROLE_NOT_PERMITTED, so the implementation must not validate the body before authorizing the caller (which would leak schema detail as a 400)."
        test_recipe:
          setup:
            - "Clock set; no other state is required because the request never reaches the persistence layer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Rogue Filer LLC" }
              as: EntryFiler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with ERR_ROLE_NOT_PERMITTED (NOT 400 ERR_INVALID_REQUEST)"
            - "no Importer row is created"
            - "the same body sent as ComplianceOfficer returns 400 with ERR_INVALID_REQUEST"

