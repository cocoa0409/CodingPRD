            - "one program and one SUBMITTED council request for that program with vote_count 4"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Quorum Quinn", room_number: "504A", admission_date: "2026-07-28" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SPIRITUAL"], preferred_group_size: "LARGE", effective_date: "2026-07-28" }
              as: RecreationTherapist
