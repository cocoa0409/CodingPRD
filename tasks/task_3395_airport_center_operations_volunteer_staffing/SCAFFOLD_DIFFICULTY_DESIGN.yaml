            - "assignment on s3 (11:00-15:00) rejected with ERR_SHIFT_OVERLAP (intersects both under half-open arithmetic)"
      - name: family_room_buffer_gap_semantics
        grounds:
          - calculations.booking_overlap
          - errors[ERR_BOOKING_OVERLAP]
          - "endpoints[POST /centers/{id}/service-bookings]"
        distinguishing_aspect: |
          Buffered interval semantics on a different resource (the physical
          FAMILY_ROOM, not volunteer time): unlike half-open shift adjacency,
          back-to-back room bookings are REJECTED — a 45-minute cleaning buffer
          must separate them, and a gap of exactly 45 minutes passes.
        test_recipe:
          setup:
            - "Clock 2026-09-01; OPEN center (one volunteer confirmed on today's 06:00-10:00 shift, required 1)"
            - "ACTIVE_DUTY guest; FAMILY_ROOM booked 10:00-11:00"
