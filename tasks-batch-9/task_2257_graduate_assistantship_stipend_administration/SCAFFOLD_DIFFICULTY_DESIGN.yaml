  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: remission_chain_ceiling_after_share_and_remainder_to_first_eligible
        grounds:
          - calculations.tuition_remission_entitlement
          - calculations.appointment_effort_profile
          - entities.StipendPolicy.fields.max_remission_cents_per_term
          - entities.FundingSource.fields.allows_tuition_remission
          - entities.FundingAllocation.fields.plan_sequence
        distinguishing_aspect: |
          Mode (a) - a four-step chain (band -> credit cap -> remission-eligible funding share -> policy
          ceiling) whose step ORDER is observable: applying the 350000 ceiling before the 60.00 percent
          eligible share yields 210000, applying it after yields 350000, and only 350000 is correct;
          the truncate-plus-remainder split then puts the odd cent on the 40.00 percent allocation
          (233334 / 116666), never on the 20.00 percent one.
        test_recipe:
          setup:
            - "Term REM2026 (2026-09-01..2026-12-31, CALENDAR_DAY) OPEN with a single pay period [2026-09-01, 2027-01-01)."
            - "StipendPolicy (RESEARCH, DOCTORAL): per_credit_tuition_cents 74500, max_remission_cents_per_term 350000, min_fte_monthly_stipend_cents 400000, term_insurance_premium_cents 0, insurance_min_effort_pct 50, min_insurance_duration_days 90."
            - "DOCTORAL student with enrolled_credit_hours 12, exactly at the doctoral MAX_REMITTED_CREDITS cap."
            - "Three funding sources: NSF grant (allows_tuition_remission true), NIH grant (allows_tuition_remission true) and a departmental budget (allows_tuition_remission false)."
            - "DRAFT appointment: RESEARCH, effort_pct 50, 2026-09-01..2026-12-31, monthly_stipend_cents 200000 (FTE monthly exactly 400000)."
