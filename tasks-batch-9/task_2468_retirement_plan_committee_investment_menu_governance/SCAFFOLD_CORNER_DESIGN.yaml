      - name: notice_issue_one_second_before_the_lead_time_expires_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FundReplacementProposal
          - validations.ERR_NOTICE_PERIOD_NOT_ELAPSED
          - calculations.notice_lead_days
        distinguishing_aspect: "The APPROVED -> NOTICE_ISSUED guard is on the WINDOW START, not on the clock: with notice_delivered_at 2026-08-01T00:00:00Z and a 30-day lead, a blackout starting 2026-08-30T23:59:59Z is one second short and returns 409 ERR_NOTICE_PERIOD_NOT_ELAPSED, and the rejected call must leave notice_delivered_at null so a later correctly-dated notice still measures its lead from the original instant."
        test_recipe:
          setup:
            - "chain_l3 is replayed, then the trigger head replays the chain_l5 calls up to and including the approval (the proposal is APPROVED, the slot is PENDING_REPLACEMENT and notice_delivered_at is still null)."
          setup_api_calls: *chain_l3
          trigger:
            - *b_plan_v_read
            - *b_prop_lc
            - *b_prop_submit
            - *b_meet3
            - *b_meet3_convene
            - *b_motion_prop
            - *b_vote_prop_chair
            - *b_vote_prop_fin
            - *b_vote_prop_hr
            - *b_motion_prop_close
            - *b_meet3_adjourn
            - *b_meet3_minutes
            - *b_prop_approve
            - call: "POST /governance/fund-replacements/${prop_lc_id}/notice-issue"
              payload: { blackout_start_at: "2026-08-30T23:59:59Z", blackout_end_at: "2026-09-15T00:00:00Z" }
              as: Recordkeeper
              as_user_id: "rk-1"
          assert:
            - "the response status is 409 with data.error_id == ERR_NOTICE_PERIOD_NOT_ELAPSED"
            - "FundReplacementProposal.${prop_lc_id}.status is still APPROVED with notice_delivered_at null, blackout_start_at null and blackout_end_at null"
            - "AssetClassSlot.${slot_lc_id}.status is still PENDING_REPLACEMENT and current_fund_id is still ${fund_lc_a_id}"
            - "Plan.${plan_id}.reserved_menu_slots == 1 and available_menu_slots == 0 (the failed notice changed no capacity)"
            - "repeating the call with blackout_start_at 2026-08-31T00:00:00Z succeeds with 200 and status NOTICE_ISSUED, proving the boundary is inclusive"

      - name: execute_between_the_lead_expiry_and_the_window_opening_is_a_blackout_conflict
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FundReplacementProposal
          - validations.ERR_BLACKOUT_WINDOW_CONFLICT
          - endpoints.POST_/governance/fund-replacements/{proposalId}/execute
        distinguishing_aspect: "Execute is guarded twice over the clock and the two guards are separable: at 2026-08-31T00:00:00Z the 30-day notice lead has expired (so ERR_NOTICE_PERIOD_NOT_ELAPSED does NOT fire) but the half-open window [2026-09-01, 2026-09-15) has not opened, so the call must fail with 409 ERR_BLACKOUT_WINDOW_CONFLICT rather than the notice error. The same endpoint at 2026-09-15T00:00:00Z fails identically because the window end is exclusive."
        test_recipe:
          setup:
            - "chain_l3 is replayed, then the trigger head replays the chain_l5 calls up to and including notice-issue, leaving the proposal NOTICE_ISSUED with the window [2026-09-01T00:00:00Z, 2026-09-15T00:00:00Z)."
          setup_api_calls: *chain_l3
          trigger:
            - *b_plan_v_read
            - *b_prop_lc
            - *b_prop_submit
            - *b_meet3
            - *b_meet3_convene
            - *b_motion_prop
            - *b_vote_prop_chair
            - *b_vote_prop_fin
            - *b_vote_prop_hr
            - *b_motion_prop_close
