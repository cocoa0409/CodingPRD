              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-6001", guest_name: "Jo Uribe", room_number: "601", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_r_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_r_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/allowances"
              payload: { folio_id: "${folio_r_id}", business_date_id: "${bd1_id}", requested_amount: 300.00, reason_code: "MANAGER_DISCRETION", narrative: "Goodwill for a construction-noise complaint." }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { alw_cycle_id: "$.data.id" }
            - call: "POST /night-audit/allowances/${alw_cycle_id}/submit"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/allowances/${alw_cycle_id}/return-for-revision"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
            - call: "POST /night-audit/allowances/${alw_cycle_id}/submit"
              payload: { narrative: "Revision 1 - engineering ticket attached." }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/allowances/${alw_cycle_id}/return-for-revision"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
            - call: "POST /night-audit/allowances/${alw_cycle_id}/submit"
              payload: { narrative: "Revision 2 - guest statement attached." }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/allowances/${alw_cycle_id}/return-for-revision as RevenueManager (X-User-ID u_rm_1) for the third time."
          assert:
            - "The trigger fails with HTTP 409 and error code ERR_REVISION_LIMIT_REACHED, because revision_round has already reached ALLOWANCE_REVISION_LIMIT 2."
            - "GET /night-audit/allowances/${alw_cycle_id} returns revision_round == 2 - the refused transition did not increment it - and status == SUBMITTED, not RETURNED_FOR_REVISION."
            - "The same read returns required_approval_role == RevenueManager; neither submit nor either return-for-revision re-derived the tier."
            - "A follow-up POST /night-audit/allowances/${alw_cycle_id}/approve with approved_amount 10.00 as RevenueManager (X-User-ID u_rm_2) succeeds and returns status == POSTED with required_approval_role still RevenueManager, proving the frozen tier survives an approval far below the 250.00 manager threshold."
            - "The same follow-up as NightAuditor would instead fail 403 ERR_APPROVAL_TIER_INSUFFICIENT; an implementation that re-derives the tier from approved_amount 10.00 would wrongly let a NightAuditor through."

  - rule_id: transitive_cascade
