          trigger:
            - call: "POST /employers/${e2}/contribution-reports"
              payload: { period_start: "2024-01-01", period_end: "2025-01-01", declared_total_cents: 100 }
              as: EmployerClerk
              as_user_id: "${e1}"
              captures: { err1: $.data.error_id }
            - call: "POST /contribution-reports/${rep_e2}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 1250, contribution_amount_cents: 100 }
              as: EmployerClerk
              as_user_id: "${e1}"
              captures: { err2: $.data.error_id }
          assert:
            - "Both calls fail with ERR_FORBIDDEN (403): clerk X-User-ID must equal the owning employer id"

      - name: retirement_approve_same_user_as_reviewer_returns_segregation
        claim_type: violation_to_error
        grounds:
          - validations[priority=2.5]
