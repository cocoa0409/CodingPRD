              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
          trigger:
            # Open deviation A (approval_status -> DEVIATIONS_PENDING)
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_a}", proposed_text: "altA", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_a: $.data.id }
            # Open deviation B (still DEVIATIONS_PENDING)
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_b}", proposed_text: "altB", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_b: $.data.id }
