          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE  # depends on Booking.status being IN_PROGRESS/COMPLETED/EMERGENCY_TERMINATED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: sitter_calendar_half_open_with_thirty_minute_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_SITTER_TIME_CONFLICT]
        distinguishing_aspect: |
          Sitter resource overlap with half-open [start, end + 30min)
          interval semantics — a 30-minute trailing buffer for travel time
          is added to existing bookings before comparing. A second booking
          on the same Sitter starting exactly at the prior end_at (i.e., no
          gap) collides because the buffer pushes the prior window 30 min
          past end_at. The half-open + buffer distinguishes this from the
          Pet overlap rule.
        test_recipe:
          setup:
            - "Owner o11, Sitter s11 ACTIVE CLEARED, Pet p11_a and p11_b (two different pets, same owner)."
            - "MGs approved for both pets."
            - "Booking b11_a CONFIRMED on s11 covering [09:00, 10:00) on 2026-06-13."
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "o11@example.com", full_name: "O Eleven", phone: "+12025551401" }
              as: Anonymous
              captures: { o11_id: $.data.id }
            - call: "POST /api/v1/sitters/register"
              payload: { email: "s11@example.com", full_name: "S Eleven", phone: "+12025551402" }
              as: Anonymous
              captures: { s11_id: $.data.id }
