              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { total_a: $.total_count }
          assert:
            - "HTTP status is 403 on B locking A's loan, ${err1} == ERR_ORIGINATOR_IDENTITY_MISMATCH"
            - "HTTP status is 403 on B posting an application with A's originator_id in the body,
               ${err2} == ERR_ORIGINATOR_IDENTITY_MISMATCH"
            - "HTTP status is 403 on B requesting a pricing exception on A's loan,
               ${err3} == ERR_ORIGINATOR_IDENTITY_MISMATCH"
            - "HTTP status is 200 on B reading A's loan: ${read_st} == TAKEN and
               ${read_owner} == ${orig_a} (shared reads are not ownership-scoped)"
            - "HTTP status is 200 on A locking his own loan and ${st} == LOCKED"
            - "${total_a} == 1 (B's rejected POST created nothing)"

      - name: same_user_id_cannot_draft_and_approve_nor_request_and_decide
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=17]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.PricingException.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          role_model = segregation_of_duties is enforced on the USER, not on the role. The user
          dual-1 legitimately holds CompensationDesigner and ComplianceOfficer, yet approving the
          plan it drafted is 422 ERR_SEGREGATION_OF_DUTIES; and a ComplianceOfficer presenting
          X-User-ID equal to the exception's requested_by_user_id (the originator's own id) is
          refused on the same rule. A different user id clears both gates with no other change to
          the request, and neither refusal advances the plan out of DRAFT or the exception out of
          SUBMITTED.
