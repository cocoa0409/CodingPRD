  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: if_match_wave_activation_requires_territory_active
        grounds:
          - state_machines.DeploymentWave.transitions.PLANNED_to_ACTIVE
          - state_machines.ServiceTerritory.transitions.ACTIVE_to_RESTRICTED
          - calculations.territory_posture
          - errors[ERR_TERRITORY_NOT_ACTIVE]
        distinguishing_aspect: "The dependency crosses DeploymentWave to ServiceTerritory: a PLANNED wave is otherwise perfectly valid, but activating three exclusion zones moves the territory to RESTRICTED and the identical activation call is rejected with ERR_TERRITORY_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE (mapped_pct 100, validation_hours 120), Depot A, one service-ready AT_DEPOT vehicle, one DeploymentWave W1 for MIDDAY with planned_vehicle_count 1, and three FREEWAY exclusion zones Z1/Z2/Z3 in status SCHEDULED."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - *depot_call
            - *vehicle1_call
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/territories/${t_id}/deployment-waves"
              payload: { window_code: "MIDDAY", planned_vehicle_count: 1 }
              as: TerritoryPlanner
              captures: { w_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "CONSTRUCTION", route_class: "FREEWAY", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "EVENT", route_class: "FREEWAY", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z2_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "EMERGENCY", route_class: "FREEWAY", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z3_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z1_id}/activate"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z2_id}/activate"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z3_id}/activate"
              payload: {}
              as: SafetyReviewer
          trigger:
            - call: "POST /fleet/territories/${t_id}/deployment-waves/${w_id}/activate"
              payload: {}
              as: TerritoryPlanner
              captures: { err: $.data.error_id }
          assert:
            - "GET /fleet/territories/${t_id} returns posture == RESTRICTED and active_zone_count == 3"
            - "the activate response error_id == ERR_TERRITORY_NOT_ACTIVE and http == 409"
            - "DeploymentWave.${w_id}.status remains PLANNED and deployed_vehicle_count == 0"
      - name: if_match_cycle_start_requires_depot_not_lockdown
        grounds:
          - state_machines.DepotCycle.transitions.STAGED_to_IN_PROGRESS
          - state_machines.DepotSite.transitions.CONGESTED_to_LOCKDOWN
          - calculations.depot_posture
          - errors[ERR_POSTURE_LOCKDOWN]
        distinguishing_aspect: "The dependency crosses DepotCycle to DepotSite rather than wave to territory: a scheduled, otherwise valid cycle is rejected with ERR_POSTURE_LOCKDOWN exactly when the depot's occupancy reaches 100 percent, a different entity pair from the territory-posture gate."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot S with one SOFTWARE bay position, two DRAFT vehicles V1 and V2, two SOFTWARE cycles CY1 (V1) and CY2 (V2), each holding a RESERVED slot on the single SOFTWARE bay, and CY1 already scheduled."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - call: "POST /fleet/territories/${t_id}/depots"
              payload: { name: "Depot S", charge_positions: 0, cleaning_positions: 0, calib_positions: 0, software_positions: 1 }
              as: TerritoryPlanner
              captures: { ds_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0002", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v2_id: $.data.id }
            - call: "POST /fleet/depots/${ds_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "SOFTWARE" }
              as: DepotTechnician
              captures: { cy1_id: $.data.id }
            - call: "POST /fleet/depots/${ds_id}/cycles"
              payload: { vehicle_id: "${v2_id}", service_kind: "SOFTWARE" }
              as: DepotTechnician
              captures: { cy2_id: $.data.id }
            - call: "POST /fleet/depots/${ds_id}/bay-slots"
              payload: { service_type: "SOFTWARE", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${cy1_id}" }
              as: DepotTechnician
              captures: { sl1_id: $.data.id }
            - call: "POST /fleet/depots/${ds_id}/cycles/${cy1_id}/schedule"
              payload: { bay_slot_id: "${sl1_id}" }
              as: DepotTechnician
          trigger:
            - call: "POST /fleet/depots/${ds_id}/bay-slots"
              payload: { service_type: "SOFTWARE", bay_index: 1, start_utc: "2026-06-01T02:00:00Z", duration_seconds: 1800, vehicle_id: "${v2_id}", cycle_id: "${cy2_id}" }
              as: DepotTechnician
              captures: { sl2_id: $.data.id }
            - call: "GET /fleet/depots/${ds_id}"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${ds_id}/cycles/${cy1_id}/start"
              payload: {}
              as: DepotTechnician
              captures: { err: $.data.error_id }
          assert:
            - "DepotSite.${ds_id}.occupancy_pct == 100 and DepotSite.${ds_id}.posture == LOCKDOWN"
            - "DepotCycle.${cy1_id}.is_scheduled == true and DepotCycle.${cy1_id}.status == STAGED"
            - "the start response error_id == ERR_POSTURE_LOCKDOWN and http == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: if_match_bayslot_half_open_window_conflict
        grounds:
          - validations[priority=9]
          - entities.BaySlot.fields.end_utc
          - errors[ERR_BAY_SLOT_CONFLICT]
        distinguishing_aspect: "Half-open interval semantics on a depot bay: [start_utc, end_utc) means a window starting exactly at another slot's end_utc is admitted, while a window starting one second inside it collides — geometry that differs from the closed-interval exclusion-zone rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot C with one SOFTWARE bay position, two DRAFT vehicles V1 and V2, SOFTWARE cycle CX1 (V1) holding RESERVED slot S1 on bay 1 for [2026-06-01T00:00:00Z, +3600s), and SOFTWARE cycle CX2 (V2) with no slot yet."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - call: "POST /fleet/territories/${t_id}/depots"
              payload: { name: "Depot C", charge_positions: 0, cleaning_positions: 0, calib_positions: 0, software_positions: 1 }
              as: TerritoryPlanner
              captures: { dc_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0002", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v2_id: $.data.id }
            - call: "POST /fleet/depots/${dc_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "SOFTWARE" }
              as: DepotTechnician
              captures: { cx1_id: $.data.id }
            - call: "POST /fleet/depots/${dc_id}/cycles"
              payload: { vehicle_id: "${v2_id}", service_kind: "SOFTWARE" }
              as: DepotTechnician
              captures: { cx2_id: $.data.id }
            - call: "POST /fleet/depots/${dc_id}/bay-slots"
              payload: { service_type: "SOFTWARE", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v1_id}", cycle_id: "${cx1_id}" }
              as: DepotTechnician
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /fleet/depots/${dc_id}/bay-slots"
              payload: { service_type: "SOFTWARE", bay_index: 1, start_utc: "2026-06-01T00:31:00Z", duration_seconds: 3600, vehicle_id: "${v2_id}", cycle_id: "${cx2_id}" }
              as: DepotTechnician
              captures: { err: $.data.error_id }
            - call: "POST /fleet/depots/${dc_id}/bay-slots"
              payload: { service_type: "SOFTWARE", bay_index: 1, start_utc: "2026-06-01T01:00:00Z", duration_seconds: 3600, vehicle_id: "${v2_id}", cycle_id: "${cx2_id}" }
              as: DepotTechnician
              captures: { s2_id: $.data.id }
          assert:
            - "the 00:31:00Z create returns error_id ERR_BAY_SLOT_CONFLICT and http 409"
            - "BaySlot.${s1_id}.end_utc == 2026-06-01T01:00:00Z"
            - "BaySlot.${s2_id}.status == RESERVED and BaySlot.${s2_id}.start_utc == 2026-06-01T01:00:00Z"
      - name: if_match_exclusion_zone_closed_window_boundary
        grounds:
          - validations[priority=6]
          - entities.ExclusionZone.fields.end_utc
          - errors[ERR_EXCLUSION_ZONE_ACTIVE]
        distinguishing_aspect: "Closed, inclusive interval semantics on a route-class exclusion: a reference time exactly equal to end_utc still collides and returns ERR_EXCLUSION_ZONE_ACTIVE, one second later it does not — the opposite adjacency treatment from the half-open bay-slot rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot A, one service-ready IN_SERVICE vehicle, one SAFE curb with an ACTIVE STANDARD curb rule, one ACTIVE FREEWAY ExclusionZone Z1 with window [2026-06-01T00:00:00Z, +86400s] (end 2026-06-02T00:00:00Z), and RideRequest R1 in REQUESTED."
