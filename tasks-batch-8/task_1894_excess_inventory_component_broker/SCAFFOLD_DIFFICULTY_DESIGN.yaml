          setup:
            - "BROKER_OWNED lot cost 4000 qty 4 received 2026-08-01T00:00:00Z; listing asking 5000 ACTIVE; STANDARD customer; order qty 2 escrowed (10000) and DELIVERED; no snapshots (volatility 0)"
