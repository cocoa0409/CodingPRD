        grounds:
          - state_machines.Registration.WAIVER_VERIFIED_to_WAIVER_VOIDED
          - state_machines.Registration.CONFIRMED_to_REGISTERED
          - state_machines.ServiceProject.LOCKED_to_MATCHED
          - calculations.event_readiness_posture
        distinguishing_aspect: |
          Depth-4 chain from trigger POST /service-events/{id}/bump-waiver-version:
          bump voids the registration's VERIFIED waiver (link 1: event -> registration waiver
          dimension); the voided waiver demotes rsvp CONFIRMED -> REGISTERED (link 2: waiver ->
          rsvp, caused by link 1); the demotion drops project.confirmed_volunteer_count below
          min_volunteers so the LOCKED project auto-demotes to MATCHED (link 3, caused by link 2);
          the project demotion recomputes event.readiness_posture READY -> PARTIAL (link 4,
          caused by link 3). Each link is caused by the previous link, not by the bump directly.
