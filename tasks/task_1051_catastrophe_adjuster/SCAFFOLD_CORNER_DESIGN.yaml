scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_adjuster_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.Adjuster
          - endpoints
        distinguishing_aspect: "POST /adjusters with all required fields returns 201 and echoes full_name/email/adjuster_type/home_state with status defaulted ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /adjusters", payload: { full_name: "Casey", email: "c@x.com", adjuster_type: "CAT", home_state: "TX" }, as: LicensingAdmin, captures: { aid: $.data.id, st: $.data.status } }
          assert:
            - "response_type == object AND http 201"
            - "Adjuster(${aid}).full_name == 'Casey' AND Adjuster(${aid}).home_state == 'TX'"
            - "Adjuster(${aid}).status == ACTIVE (default)"

      - name: get_claim_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Claim
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "GET /claims/{unknown-uuid} returns ERR_CLAIM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /claims/00000000-0000-4000-8000-000000000000", payload: {}, as: DeskExaminer, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_CLAIM_NOT_FOUND (http 404)"

      - name: create_claim_missing_loss_state_returns_invalid
        claim_type: Required Fields
        grounds:
          - entities.Claim.fields.loss_state
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /claims omitting the required loss_state returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /claims", payload: { claim_number: "C-X", policyholder_name: "PH", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_INVALID_REQUEST (http 400)"

      - name: create_report_omits_photo_count_defaults_zero
        claim_type: Defaults
        grounds:
          - entities.Report.fields.photo_count
        distinguishing_aspect: "POST /reports without photo_count stores the declared default 0."
        test_recipe:
          setup: ["Accepted FL/HAIL/ACV assignment with a SCHEDULED inspection (report can be drafted anytime)"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "Dana", email: "d@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-D", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-D", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
          trigger:
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id, pc: $.data.photo_count } }
          assert:
            - "Report(${rpt_id}).photo_count == 0"

      - name: list_adjusters_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Adjuster
          - endpoints
        distinguishing_aspect: "GET /adjusters returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two adjusters exist"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "P1", email: "p1@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin }
            - { call: "POST /adjusters", payload: { full_name: "P2", email: "p2@x.com", adjuster_type: "STAFF", home_state: "GA" }, as: LicensingAdmin }
          trigger:
            - { call: "GET /adjusters", payload: {}, as: DeskExaminer, captures: { tc: $.data } }
          assert:
            - "response_type == array AND meta.total_count == 2 AND meta.has_more == false"

      - name: system_fields_minted_on_adjuster
        claim_type: System Fields
        grounds:
          - entities.Adjuster
        distinguishing_aspect: "id/created_at/updated_at/version are server-minted; version starts at 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /adjusters", payload: { full_name: "Sys", email: "s@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin, captures: { aid: $.data.id, v: $.data.version } }
          assert:
            - "Adjuster(${aid}).version == 1 AND Adjuster(${aid}).id is a UUID without a type prefix"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_active_license_returns_not_pending
        claim_type: invalid_transition
        grounds:
          - state_machines.AdjusterLicense.PENDING_to_ACTIVE
          - errors[ERR_LICENSE_NOT_PENDING]
        distinguishing_aspect: "Activating an already ACTIVE license returns ERR_LICENSE_NOT_PENDING (409)."
        test_recipe:
          setup: ["A license activated once (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "L1", email: "l1@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-L1", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
          trigger:
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_LICENSE_NOT_PENDING (http 409)"

      - name: claim_starts_in_intake
        claim_type: Initial State
        grounds:
          - state_machines.Claim
          - entities.Claim.fields.status
        distinguishing_aspect: "A newly created claim has status INTAKE, rcv_cents 0 and reserve_consumed_cents 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /claims", payload: { claim_number: "C-I", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { cid: $.data.id, s: $.data.status } }
          assert:
            - "Claim(${cid}).status == INTAKE AND Claim(${cid}).rcv_cents == 0 AND Claim(${cid}).reserve_consumed_cents == 0"

      - name: pay_unapproved_bill_returns_not_approved
        claim_type: invalid_transition
        grounds:
          - state_machines.FeeBill.APPROVED_to_PAID
          - errors[ERR_FEE_BILL_NOT_APPROVED]
        distinguishing_aspect: "Paying a DRAFT (never-approved) fee bill returns ERR_FEE_BILL_NOT_APPROVED (409)."
        test_recipe:
          setup: ["Work-complete FL/HAIL/RCV assignment with a DRAFT FEE_SCHEDULE bill (not submitted/approved)"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "PB", email: "pb@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-PB", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /fee-schedules", payload: { name: "STD", tier1_max_rcv_cents: 5000000, tier2_max_rcv_cents: 25000000, tier1_flat_fee_cents: 30000, tier2_flat_fee_cents: 60000, tier3_flat_fee_cents: 100000, rcv_pct_bps: 250, pct_cap_cents: 20000000, hourly_rate_cents: 8500, cat_peril_multiplier_bps: 12500 }, as: BillingManager, captures: { fs_id: $.data.id } }
            - { call: "POST /claims", payload: { claim_number: "C-PB", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "RCV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "Roof", rcv_cents: 4000000, depreciation_pct: 0 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s", photo_count: 2 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { asg_ver: $.data.version } }
            - { call: "POST /fee-bills", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", fee_schedule_id: "${fs_id}", billing_method: "FEE_SCHEDULE", expected_assignment_version: "${asg_ver}" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { bill_id: $.data.id } }
          trigger:
            - { call: "POST /fee-bills/${bill_id}/pay", payload: { method: "ACH" }, as: BillingManager, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_FEE_BILL_NOT_APPROVED (http 409)"

      - name: license_expired_on_activate_after_clock_advance
        claim_type: guarded transitions
        grounds:
          - state_machines.AdjusterLicense.PENDING_to_ACTIVE
          - errors[ERR_LICENSE_EXPIRED]
        distinguishing_aspect: "With the logical clock set to 2027-02-01 (>= expires_at 2027-01-01), activating a PENDING license returns ERR_LICENSE_EXPIRED (409)."
        test_recipe:
          setup: ["Clock advanced past the license expiry; a PENDING license"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "EX", email: "ex@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-EX", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: LicensingAdmin }
          trigger:
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_LICENSE_EXPIRED (http 409)"

      - name: complete_already_completed_inspection
        claim_type: Idempotency
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INSPECTION_NOT_IN_PROGRESS]
        distinguishing_aspect: "Completing an already COMPLETED inspection returns ERR_INSPECTION_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["Accepted assignment with a COMPLETED inspection"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "IC", email: "ic@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-IC", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-IC", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_INSPECTION_NOT_IN_PROGRESS (http 409)"

      - name: close_cat_event_with_confirmed_deployment
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CatEvent.OPEN_to_CLOSED
          - errors[ERR_ROSTER_NOT_EMPTY]
        distinguishing_aspect: "Closing a cat event that still has a CONFIRMED deployment returns ERR_ROSTER_NOT_EMPTY (409)."
        test_recipe:
          setup: ["CatEvent OPEN with one CONFIRMED deployment"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "CE", email: "ce@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /cat-events", payload: { name: "Golf", peril_type: "WILDFIRE", affected_states: ["CA"], roster_capacity: 3 }, as: LicensingAdmin, captures: { ce_id: $.data.id } }
            - { call: "POST /deployments", payload: { adjuster_id: "${adj_id}", cat_event_id: "${ce_id}", start_at: "2026-07-20T09:00:00Z", end_at: "2026-07-20T17:00:00Z" }, as: LicensingAdmin, captures: { d1: $.data.id } }
            - { call: "POST /deployments/${d1}/confirm", payload: {}, as: LicensingAdmin }
          trigger:
            - { call: "POST /cat-events/${ce_id}/close", payload: {}, as: LicensingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_ROSTER_NOT_EMPTY (http 409)"

      - name: activate_deployment_before_window_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Deployment.CONFIRMED_to_ACTIVE
          - errors[ERR_DEPLOYMENT_WINDOW_NOT_OPEN]
        distinguishing_aspect: "Activating a CONFIRMED deployment while the clock (default 2026-07-01) is before start_at 2026-07-20 returns ERR_DEPLOYMENT_WINDOW_NOT_OPEN (409)."
        test_recipe:
          setup: ["CatEvent OPEN; a CONFIRMED deployment whose window starts 2026-07-20; clock at default 2026-07-01"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "DW", email: "dw@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /cat-events", payload: { name: "Hotel", peril_type: "HURRICANE", affected_states: ["FL"], roster_capacity: 3 }, as: LicensingAdmin, captures: { ce_id: $.data.id } }
            - { call: "POST /deployments", payload: { adjuster_id: "${adj_id}", cat_event_id: "${ce_id}", start_at: "2026-07-20T09:00:00Z", end_at: "2026-07-20T17:00:00Z" }, as: LicensingAdmin, captures: { d1: $.data.id } }
            - { call: "POST /deployments/${d1}/confirm", payload: {}, as: LicensingAdmin }
          trigger:
            - { call: "POST /deployments/${d1}/activate", payload: {}, as: LicensingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_DEPLOYMENT_WINDOW_NOT_OPEN (http 409)"

  # =========================================================================
  - section: validations
    instances:
      - name: sod_self_review_returns_segregation
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "A QA decision issued by the authoring FieldAdjuster (X-User-ID == assignment.adjuster_id, acting as QAReviewer) returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Field adjuster A submitted a report; A also holds the QAReviewer role and attempts to review it"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "SoD", email: "sod@x.com", adjuster_type: "STAFF", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-SoD", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-SoD", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "L1", rcv_cents: 50000, depreciation_pct: 10 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s", photo_count: 3 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /reports/${rpt_id}/qa-decision", payload: { decision: "APPROVED" }, as: QAReviewer, as_user_id: "${adj_id}", captures: { err: $.data.error_id } }
          assert:
            - "response_type == error AND data.error_id == ERR_SEGREGATION_OF_DUTIES (http 403)"
            - "Report(${rpt_id}).status == SUBMITTED (unchanged)"

      - name: te_bill_zero_time_entries_returns_no_time_entries
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_NO_TIME_ENTRIES]
        distinguishing_aspect: "Creating a TIME_AND_EXPENSE fee bill for a work-complete assignment with zero TimeEntry rows returns ERR_NO_TIME_ENTRIES (422)."
        test_recipe:
          setup: ["Work-complete FL/HAIL/RCV assignment with NO time entries; canonical FeeSchedule; Claim.rcv_cents approved"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "TE0", email: "te0@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-TE0", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /fee-schedules", payload: { name: "STD", tier1_max_rcv_cents: 5000000, tier2_max_rcv_cents: 25000000, tier1_flat_fee_cents: 30000, tier2_flat_fee_cents: 60000, tier3_flat_fee_cents: 100000, rcv_pct_bps: 250, pct_cap_cents: 20000000, hourly_rate_cents: 8500, cat_peril_multiplier_bps: 12500 }, as: BillingManager, captures: { fs_id: $.data.id } }
            - { call: "POST /claims", payload: { claim_number: "C-TE0", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "RCV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
