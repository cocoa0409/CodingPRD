            - call: "POST /batches/${batch_id}/dump"
              payload: { reason: "diacetyl off-flavour confirmed by the lab" }
              as: CellarOperator
              captures: { err_planned: $.data.error_id }
            - call: "POST /distribution-orders/${order_id}/cancel"
              payload: { reason: "buyer withdrew the purchase order" }
              as: BreweryAdmin
            - call: "POST /packaging-runs/${run1_id}/void"
              payload: {}
              as: CellarOperator
            - call: "POST /packaging-runs/${run2_id}/void"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/dump"
              payload: { reason: "diacetyl off-flavour confirmed by the lab" }
              as: CellarOperator
          assert:
            - "Void of the allocated run: HTTP 409 with error_id == ERR_RUN_HAS_ALLOCATIONS; the run stays COMPLETED with allocated_bbl 5.000"
            - "Dump with R-2 still PLANNED: HTTP 409 with error_id == ERR_BATCH_HAS_PLANNED_RUNS; the batch stays CONDITIONING"
            - "Cancel: HTTP 200, order CANCELLED, PackagingRun.${run1_id}.allocated_bbl == 0.000 and available_bbl == 5.000"
            - "Void of R-1 after the cancel: HTTP 200, state VOIDED, bbl_removed == 0.000, available_bbl == 0.000, loss_share_bbl null"
            - "Void of R-2: HTTP 200, state VOIDED"
            - "Dump after both voids: HTTP 200, Batch.${batch_id}.state == DUMPED with packaged_bbl 0.000 and remaining_bbl 0.000"
            - "Tank.${tank_id}.status == DIRTY and occupying_batch_id is null"

      - name: completing_a_run_after_the_batch_auto_closes_reports_batch_not_conditioning
        claim_type: Triggerable
        grounds:
          - errors.ERR_BATCH_NOT_CONDITIONING
          - state_machines.Batch.CONDITIONING_to_PACKAGED
          - calculations.packaging_loss_allocation
        distinguishing_aspect: "The batch closes itself the moment remaining_bbl falls to 1.000 or less, so a run that was legally PLANNED while the batch was open becomes uncompletable a request later - and the error is the cross-entity ERR_BATCH_NOT_CONDITIONING, not the volume error, even though 1.000 bbl of intent would also have fitted exactly."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; batch B-1001 CONDITIONING at 16.000 bbl on tank FV-01."
            - "Run R-A (HALF_BBL_KEG, 30 units = 15.000 bbl) and run R-B (HALF_BBL_KEG, 2 units = 1.000 bbl) are both created while the batch is still CONDITIONING."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-A", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 30, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_a_id: $.data.id }
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_v2: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-B", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 2, expected_batch_version: "${batch_v2}" }
              as: CellarOperator
              captures: { run_b_id: $.data.id }
          trigger:
            - call: "POST /packaging-runs/${run_a_id}/complete"
              payload: { units_produced: 30 }
              as: CellarOperator
            - call: "POST /packaging-runs/${run_b_id}/complete"
              payload: { units_produced: 2 }
              as: CellarOperator
              captures: { err_batch: $.data.error_id }
          assert:
            - "Completing R-A: HTTP 200, bbl_removed == 15.000"
            - "Batch.${batch_id}.state == PACKAGED with packaged_bbl 15.000 and remaining_bbl 1.000 (the 1.000 bbl auto-close threshold is inclusive)"
            - "Tank.${tank_id}.status == DIRTY and occupying_batch_id is null"
            - "PackagingRun.${run_a_id}.loss_share_bbl == 1.000 (the only COMPLETED run absorbs the whole 1.000 bbl loss)"
            - "Completing R-B: HTTP 409 with error_id == ERR_BATCH_NOT_CONDITIONING"
            - "PackagingRun.${run_b_id}.state == PLANNED with bbl_removed 0.000 and loss_share_bbl null"
            - "Batch.${batch_id}.packaged_bbl stays 15.000"
  # ERR_POUR_EXCEEDS_KEG_VOLUME is reachable only from a nearly-drained keg
  # (POUR_OZ[container_type] > remaining_volume_oz); the cheapest fixture is a
  # QUARTER_BBL_KEG drained by repeated PINT_16OZ pours, which the unit-test layer
  # builds directly rather than through this API-level recipe.

  - section: rbac
    instances:
      - name: every_role_can_drive_its_own_exclusive_operations_end_to_end
        claim_type: "Can perform all exclusive_operations and shared_operations"
        grounds:
          - roles.BreweryAdmin
          - roles.ComplianceOfficer
          - roles.CellarOperator
          - roles.TaproomStaff
          - roles.StateRegulator
        distinguishing_aspect: "One chain from an empty database to a filed excise return in which no single role could have made the next call: the regulator alone activates the notice and decides filings and permits, the compliance officer alone submits filings and licenses, the cellar operator alone brews and packages, the taproom staff alone pours, and the admin alone orders and prepares returns. The appointment pair is exercised in franchise_guards_reject_a_double_scope_a_bare_withdraw_and_an_early_finalize."
