# =============================================================================
# SCAFFOLD.yaml — Audio Post-Production & Sound Design (task 2947)
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2947. Audio Post-Production & Sound Design (audio post-production facility): project intake with
  picture lock status, deliverable specifications and turnaround requirements, dialogue editing, noise
  reduction and automated dialogue replacement session scheduling with talent, sound design and effects
  creation with library management and licensed material tracking, music editing, conforming and stem
  preparation coordinated with the composer, mix stage booking with mixer assignment and client
  attendance or remote review, deliverable creation across theatrical, broadcast, streaming and
  international mix requirements with loudness specifications, quality control against platform
  delivery specifications with rejection remediation, archival of session files and stems for future
  versions

domain_name: audio-post-production
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Flat, peer-level collections joined by explicit foreign keys, plus a genuine
  # many-to-many junction (AssetUsage links LibraryAsset <-> StemPackage). Only two
  # nested URL segments exist (music-cues under a stem package, qc-reports and
  # archive-packages as read-side sub-resources); every other resource is addressed
  # at its own top-level collection with FK fields in the body.

  state_machine_shape: parallel
  # Project carries two INDEPENDENT state dimensions on one row:
  #   picture_status  : NOT_LOCKED -> LOCKED -> LOCK_BROKEN -> LOCKED (cyclic)
  #   pipeline_stage  : INTAKE -> EDITORIAL -> PREMIX -> FINAL_MIX -> QC -> DELIVERED -> ARCHIVED
  # plus a derived third field `posture` (OPEN/RESTRICTED/FROZEN) computed from children.
  # Deliverable is cyclic + branching (QC loop), StemPackage is cyclic (CONFORMED<->STALE),
  # MixStageBooking is branching (RESERVED -> {CONFIRMED, RELEASED, SUPERSEDED}).

  relationship_patterns:
    - one_to_many        # Project -> StemPackage / AdrSession / MixStageBooking / Deliverable
    - many_to_many       # LibraryAsset <-> StemPackage via AssetUsage
    - cross_aggregate    # Deliverable -> PlatformSpec, MixStageBooking -> MixStage / Mixer
    - polymorphic: false

  role_model: segregation_of_duties
  # peer_roles overlay: FacilityAdmin owns facility configuration, PostSupervisor owns the
  # project/deliverable spine, SoundEditor owns editorial artefacts, Mixer owns stage sessions
  # (ownership-checked against MixStageBooking.mixer_id), QcOperator owns QC, ClientReviewer
  # owns remote-review sign-off (ownership-checked against Project.client_user_id).
  # Segregation of duties: the QcOperator user id submitting QC MUST NOT equal the user id that
  # prepared the deliverable (Deliverable.prepared_by_user_id).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Project
    parent: null
    common_fields: true
    description: "A title in post at the facility; the ledger root for stage hours, licence money and risk."
    fields:
      - name: title
        type: string
        source: input
        description: "Title of the picture in post."
        constraints: "1..200 chars, required"
      - name: client_name
        type: string
        source: input
        description: "Distributor / production company name."
        constraints: "1..200 chars, required"
      - name: client_user_id
        type: string
        source: input
        description: "Opaque X-User-ID authorised to act as ClientReviewer on this project. NOT a foreign key — no entity has this id."
        constraints: "1..64 chars, required"
      - name: delivery_deadline_utc
        type: datetime
        source: input
        description: "Contractual delivery instant. Every instant in this API is ISO-8601 UTC at whole-second precision with a trailing Z (e.g. 2026-09-14T10:00:00Z); fractional seconds are neither required nor emitted."
        constraints: "required"
      - name: turnaround_class
        type: enum
        source: input
        default: STANDARD
        description: "Turnaround band driving the stage-rate multiplier and the rush surcharge."
        constraints: "STANDARD | EXPEDITED | RUSH"
      - name: stage_hours_authorized
        type: number
        source: input
        default: 40.00
        description: "Mix-stage hours the client has authorised for this project."
        constraints: "> 0, 2 decimal places"
      - name: picture_status
        type: enum
        source: system
        default: NOT_LOCKED
        description: "Picture-lock dimension; independent of pipeline_stage."
        constraints: "NOT_LOCKED | LOCKED | LOCK_BROKEN"
      - name: picture_locked_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent successful picture lock; null while NOT_LOCKED."
      - name: picture_lock_revision
        type: integer
        source: system
        default: 0
        description: "Count of successful picture locks; increments on every NOT_LOCKED->LOCKED and LOCK_BROKEN->LOCKED transition."
        constraints: ">= 0"
      - name: pipeline_stage
        type: enum
        source: system
        default: INTAKE
        description: "Production-progress dimension; advances only forward and never regresses when picture lock breaks."
        constraints: "INTAKE | EDITORIAL | PREMIX | FINAL_MIX | QC | DELIVERED | ARCHIVED"
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over all child writes; see calculations.project_posture."
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: stage_hours_reserved
        type: number
        source: computed
        description: "Sum of reserved_hours over this project's MixStageBookings in status IN {RESERVED, CONFIRMED, IN_PROGRESS}."
        constraints: ">= 0, 2 decimal places"
      - name: stage_hours_consumed
        type: number
        source: computed
        description: "Sum of billable_hours_final over this project's MixStageBookings in status == COMPLETED."
        constraints: ">= 0, 2 decimal places"
      - name: stage_hours_available
        type: number
        source: computed
        description: "stage_hours_authorized - stage_hours_reserved - stage_hours_consumed; MAY be negative once final billing exceeds the reservation."
        constraints: "2 decimal places"
      - name: license_fee_accrued_cents
        type: integer
        source: computed
        description: "Sum of AssetUsage.accrued_fee_cents over usages whose clearance_status == CLEARED and whose StemPackage belongs to this project with status IN {DRAFT, CONFORMED, STALE} (RETIRED excluded). This exact value is step 4 of calculations.project_billing_total."
        constraints: ">= 0"
      - name: license_risk_score_intake
        type: number
        source: computed
        description: "Variant INTAKE_SNAPSHOT of calculations.license_risk_score (cleared usages only)."
        constraints: "0.00..100.00, 2 decimal places"
      - name: license_risk_score_audit
        type: number
        source: computed
        description: "Variant DELIVERY_AUDIT of calculations.license_risk_score (all usages, penalties included)."
        constraints: "0.00..100.00, 2 decimal places"
      - name: unlicensed_usage_count
        type: integer
        source: computed
        description: "Count of AssetUsage rows on this project's stem packages with clearance_status == UNLICENSED."
        constraints: ">= 0"
      - name: stale_stem_count
        type: integer
        source: computed
        description: "Count of this project's StemPackages with status == STALE."
        constraints: ">= 0"
      - name: conformed_stem_count
        type: integer
        source: computed
        description: "Count of this project's StemPackages with status == CONFORMED."
        constraints: ">= 0"
      - name: adr_cost_cents
        type: integer
        source: computed
        description: "Sum of AdrSession.session_cost_cents over this project's sessions in status IN {CONFIRMED, RECORDED, NO_SHOW}."
        constraints: ">= 0"
      - name: stage_cost_subtotal_cents
        type: integer
        source: computed
        description: "Step 1 of calculations.project_billing_total."
        constraints: ">= 0"
      - name: billing_total_cents
        type: integer
        source: computed
        description: "Step 7 of calculations.project_billing_total."
        constraints: ">= 0"

  - name: PlatformSpec
    parent: null
    common_fields: false
    description: "Immutable facility-wide delivery specification for one distribution platform (configuration; no version field, no update endpoint)."
    fields:
      - name: platform
        type: enum
        source: input
        description: "Distribution platform this spec governs."
        constraints: "THEATRICAL | BROADCAST | STREAMING | INTERNATIONAL_ME"
      - name: spec_label
        type: string
        source: input
        description: "Human label, e.g. 'ATSC A/85 5.1'."
        constraints: "1..120 chars, required"
      - name: target_lufs
        type: number
        source: input
        description: "Target integrated loudness in LUFS (negative)."
        constraints: "-40.00..0.00, 2 decimal places"
      - name: tolerance_lu
        type: number
        source: input
        description: "Permitted absolute deviation from target_lufs in LU; deviation exactly equal to this value PASSES."
        constraints: ">= 0, 2 decimal places"
      - name: true_peak_max_dbtp
        type: number
        source: input
        description: "Maximum permitted true peak in dBTP; measured value exactly equal to this value PASSES."
        constraints: "-20.00..0.00, 2 decimal places"
      - name: channel_layout
        type: enum
        source: input
        description: "Required channel layout of the delivered mix."
        constraints: "STEREO | 5_1 | 7_1 | ATMOS"
      - name: requires_me_stems
        type: boolean
        source: input
        default: false
        description: "When true, QC fails with ME_STEMS_MISSING unless the submitted measurement declares me_stems_present == true."
      - name: max_remediation_rounds
        type: integer
        source: input
        default: 2
        description: "Maximum number of remediation rounds permitted on a Deliverable governed by this spec."
        constraints: ">= 0"
      - name: qc_turnaround_hours
        type: integer
        source: input
        default: 24
        description: "Contractual QC turnaround in hours (informational; surfaced in the deliverable specification)."
        constraints: "> 0"

  - name: MixStage
    parent: null
    common_fields: true
    description: "A physical mix stage (dub stage) that can be occupied by at most one booking at a time, plus a changeover buffer."
    fields:
      - name: room_code
        type: string
        source: input
        description: "Short unique room code, e.g. 'STAGE_A'."
        constraints: "unique across MixStage, 1..32 chars, required"
      - name: display_name
        type: string
        source: input
        description: "Human name of the stage."
        constraints: "1..120 chars, required"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Stage rate in cents per billable hour, before turnaround multiplier."
        constraints: "> 0"
      - name: supports_remote_review
        type: boolean
        source: input
        default: false
        description: "When false, a booking on this stage may not be created with client_attendance == REMOTE."
      - name: changeover_minutes
        type: integer
        source: input
        default: 45
        description: "Mandatory changeover buffer in minutes applied on BOTH sides of every occupied window on this stage."
        constraints: ">= 0"

  - name: Mixer
    parent: null
    common_fields: true
    description: "Re-recording mixer who may be assigned to stage bookings. Backing entity for the Mixer role."
    fields:
      - name: full_name
        type: string
        source: input
        description: "Mixer's name."
        constraints: "1..120 chars, required"
      - name: certified_platforms
        type: array
        source: input
        description: "Platforms this mixer is certified to mix for; a booking whose platform is absent from this array is rejected."
        constraints: "non-empty array of THEATRICAL | BROADCAST | STREAMING | INTERNATIONAL_ME"
      - name: max_daily_hours
        type: number
        source: input
        default: 10.00
        description: "Maximum reserved_hours this mixer may hold across all CONFIRMED/IN_PROGRESS/COMPLETED bookings that start on one UTC calendar day."
        constraints: "> 0, 2 decimal places"

  - name: VoiceTalent
    parent: null
    common_fields: true
    description: "ADR talent bookable into recording sessions, with union minimum-call and daily-capacity terms."
    fields:
      - name: full_name
        type: string
        source: input
        description: "Talent's name."
        constraints: "1..120 chars, required"
      - name: union_status
        type: enum
        source: input
        description: "UNION talent bill at the minimum call; NON_UNION bill actual scheduled minutes."
        constraints: "UNION | NON_UNION"
      - name: daily_cap_minutes
        type: integer
        source: input
        default: 240
        description: "Maximum total billable_minutes this talent may carry across sessions whose window_start_utc falls on one UTC calendar day."
        constraints: "> 0"
      - name: min_call_minutes
        type: integer
        source: input
        default: 60
        description: "Union minimum call in minutes; ignored for NON_UNION talent."
        constraints: "> 0"

  - name: LibraryAsset
    parent: null
    common_fields: true
    description: "A licensed sound-effects / foley / library-music asset in the facility library."
    fields:
      - name: asset_code
        type: string
        source: input
        description: "Library catalogue code."
        constraints: "unique across LibraryAsset, 1..64 chars, required"
      - name: kind
        type: enum
        source: input
        description: "Asset family."
        constraints: "SFX | FOLEY | MUSIC_LIBRARY"
      - name: license_type
        type: enum
        source: input
        description: "ROYALTY_FREE accrues a flat fee per usage; RIGHTS_MANAGED accrues fee_cents per 30-second billable unit."
        constraints: "ROYALTY_FREE | RIGHTS_MANAGED"
      - name: territory_scope
        type: enum
        source: input
        description: "Licensed territory. DOMESTIC assets may only be used with territory_declared == DOMESTIC."
        constraints: "WORLDWIDE | DOMESTIC"
      - name: fee_cents
        type: integer
        source: input
        description: "Licence fee in cents (flat for ROYALTY_FREE, per 30s unit for RIGHTS_MANAGED)."
        constraints: ">= 0"
      - name: expires_at_utc
        type: datetime
        source: input
        default: null
        description: "Licence expiry instant; null means perpetual."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE until revoked. Expiry is evaluated lazily against expires_at_utc and never changes this field."
        constraints: "ACTIVE | REVOKED"
      - name: revocation_reason
        type: string
        source: system
        default: null
        description: "Reason captured at revocation; null while ACTIVE."

  - name: AssetUsage
    parent: null
    common_fields: true
    description: "Junction row recording that one LibraryAsset is used inside one StemPackage, with its clearance verdict and accrued fee."
    fields:
      - name: library_asset_id
        type: string
        source: input
        description: "FK -> LibraryAsset.id; the licensed asset being used."
      - name: stem_package_id
        type: string
        source: input
        description: "FK -> StemPackage.id; the stem package the asset is cut into."
      - name: usage_seconds
        type: integer
        source: input
        description: "On-screen usage duration in seconds; drives 30-second billable units for RIGHTS_MANAGED assets."
        constraints: "> 0"
      - name: territory_declared
        type: enum
        source: input
        description: "Territory the deliverable will be exploited in for this usage."
        constraints: "WORLDWIDE | DOMESTIC"
      - name: clearance_status
        type: enum
        source: computed
        description: "Verdict pinned at creation by calculations.asset_usage_clearance and flipped to UNLICENSED by the revocation cascade."
        constraints: "CLEARED | UNLICENSED"
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: "Licence money accrued by this usage; 0 whenever clearance_status == UNLICENSED."
        constraints: ">= 0"
      - name: cleared_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the usage was cleared; null when clearance_status == UNLICENSED."
      - name: unlicensed_reason
        type: enum
        source: system
        default: null
        description: "Why the usage is unlicensed; null when CLEARED."
        constraints: "ASSET_REVOKED | ASSET_EXPIRED | TERRITORY_OUT_OF_SCOPE | null"

  - name: StemPackage
    parent: Project
    common_fields: true
    description: "One reel's conform + stem set, coordinated with the composer; goes STALE whenever its inputs change under it."
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: reel_label
        type: string
        source: input
        description: "Reel identifier, e.g. 'R1'."
        constraints: "1..32 chars, required, unique per project_id"
      - name: stem_layout
        type: enum
        source: input
        description: "Channel layout the stems are laid out in."
        constraints: "STEREO | 5_1 | 7_1 | ATMOS"
      - name: includes_me_stems
        type: boolean
        source: input
        default: false
        description: "Whether an M&E (music & effects) stem set is prepared for international delivery."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Conform lifecycle; CONFORMED <-> STALE is a cycle, RETIRED is terminal."
        constraints: "DRAFT | CONFORMED | STALE | RETIRED"
      - name: conform_round
        type: integer
        source: system
        default: 0
        description: "Number of successful conforms; increments on every transition into CONFORMED."
        constraints: ">= 0"
      - name: cue_count
        type: integer
        source: computed
        default: 0
        description: "Count of MusicCues with status == ACTIVE at the last conform."
        constraints: ">= 0"
      - name: total_stem_minutes
        type: number
        source: computed
        default: 0.00
        description: "Per-cue-rounded minute total pinned at the last conform; see calculations.stem_conform_totals."
        constraints: ">= 0, 2 decimal places"
      - name: conform_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Conform labour charge pinned at the last conform."
        constraints: ">= 0"
      - name: conformed_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the last successful conform; null while DRAFT."
      - name: stale_reason
        type: enum
        source: system
        default: null
        description: "Why the conform was invalidated; null unless status == STALE."
        constraints: "PICTURE_LOCK_BROKEN | LICENSE_REVOKED | CUE_REVISED | null"

  - name: MusicCue
    parent: StemPackage
    common_fields: true
    description: "One music cue delivered by the composer or pulled from library music, edited into a stem package."
    fields:
      - name: stem_package_id
        type: string
        source: input
        description: "FK -> StemPackage.id; the stem package this cue is edited into (supplied by the URL path)."
      - name: cue_number
        type: string
        source: input
        description: "Composer cue number, e.g. '1M3'. A new cue at an existing cue_number supersedes the prior ACTIVE cue."
        constraints: "1..32 chars, required"
      - name: duration_seconds
        type: integer
        source: input
        description: "Cue duration in seconds."
        constraints: "> 0"
      - name: source
        type: enum
        source: input
        description: "Whether the cue is original score or library music."
        constraints: "COMPOSER_ORIGINAL | LIBRARY"
      - name: composer_delivery_ref
        type: string
        source: input
        default: null
        description: "Composer delivery reference (session/stem name) for original score."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE cues participate in the conform; SUPERSEDED is terminal."
        constraints: "ACTIVE | SUPERSEDED"

  - name: AdrSession
    parent: Project
    common_fields: true
    description: "An automated-dialogue-replacement recording session booked against one voice talent."
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: voice_talent_id
        type: string
        source: input
        description: "FK -> VoiceTalent.id; the talent booked for this session."
      - name: window_start_utc
        type: datetime
        source: input
        description: "Session start (inclusive)."
      - name: window_end_utc
        type: datetime
        source: input
        description: "Session end (exclusive)."
      - name: lines_scheduled
        type: integer
        source: input
        description: "Number of ADR lines scheduled."
        constraints: "> 0"
      - name: lines_recorded
        type: integer
        source: system
        default: 0
        description: "Lines actually recorded; set at RECORDED."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Session lifecycle."
        constraints: "PROPOSED | CONFIRMED | RECORDED | CANCELLED | NO_SHOW"
      - name: scheduled_minutes
        type: number
        source: computed
        description: "(window_end_utc - window_start_utc) in minutes, 2 decimal places."
        constraints: "> 0"
      - name: billable_minutes
        type: number
        source: computed
        description: "Union minimum call applied; see calculations.adr_session_cost."
        constraints: "> 0, 2 decimal places"
      - name: session_cost_cents
        type: integer
        source: computed
        description: "Talent charge for the session."
        constraints: ">= 0"
      - name: cancellation_reason
        type: enum
        source: system
        default: null
        description: "Reason recorded at cancellation; null while not cancelled."
        constraints: "CLIENT_REQUEST | SCHEDULE_CONFLICT | TALENT_NO_SHOW | null"

  - name: MixStageBooking
    parent: Project
    common_fields: true
    description: "A booked occupation of one mix stage by one mixer for one project, with client attendance / remote review terms."
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: mix_stage_id
        type: string
        source: input
        description: "FK -> MixStage.id; the stage occupied."
      - name: mixer_id
        type: string
        source: input
        description: "FK -> Mixer.id; the assigned re-recording mixer; only this Mixer may confirm/start/complete the booking."
      - name: booking_type
        type: enum
        source: input
        description: "PREMIX may be booked before picture lock; FINAL_MIX and PRINTMASTER require picture_status == LOCKED (validation priority 18)."
        constraints: "PREMIX | FINAL_MIX | PRINTMASTER"
      - name: platform
        type: enum
        source: input
        description: "Platform this session mixes for; must appear in Mixer.certified_platforms."
        constraints: "THEATRICAL | BROADCAST | STREAMING | INTERNATIONAL_ME"
      - name: window_start_utc
        type: datetime
        source: input
        description: "Booked stage occupation start (inclusive)."
      - name: window_end_utc
        type: datetime
        source: input
        description: "Booked stage occupation end (exclusive)."
      - name: client_attendance
        type: enum
        source: input
        default: NONE
        description: "ONSITE / REMOTE / NONE. REMOTE requires MixStage.supports_remote_review == true and a ClientReviewer sign-off before completion."
        constraints: "ONSITE | REMOTE | NONE"
      - name: client_signoff_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the project's ClientReviewer signed off the remote review; null until then."
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: "Booking lifecycle; RELEASED, COMPLETED and SUPERSEDED are terminal."
        constraints: "RESERVED | CONFIRMED | IN_PROGRESS | COMPLETED | RELEASED | SUPERSEDED"
      - name: reserved_hours
        type: number
        source: computed
        description: "Booked window length in hours, 2 decimal places."
        constraints: "> 0"
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: "Variant PROVISIONAL of calculations.stage_booking_cost, pinned at creation."
        constraints: ">= 0"
      - name: actual_start_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the mixer started the session."
      - name: actual_end_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the mixer completed the session."
      - name: billable_hours_final
        type: number
        source: computed
        default: null
        description: "Variant FINAL billable hours (0.25h ceiling, 2h floor); null until COMPLETED."
        constraints: ">= 0, 2 decimal places"
      - name: overtime_hours
        type: number
        source: computed
        default: null
        description: "Final billable hours beyond reserved_hours; null until COMPLETED."
        constraints: ">= 0, 2 decimal places"
      - name: final_cost_cents
        type: integer
        source: computed
        default: null
        description: "Variant FINAL of calculations.stage_booking_cost; null until COMPLETED."
        constraints: ">= 0"
      - name: release_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on release; null unless status == RELEASED."

  - name: Deliverable
    parent: Project
    common_fields: true
    description: "One platform deliverable cut from one stem package off one stage session, carried through the QC loop."
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: platform_spec_id
        type: string
        source: input
        description: "FK -> PlatformSpec.id; the delivery specification this deliverable is measured against."
      - name: stem_package_id
        type: string
        source: input
        description: "FK -> StemPackage.id; the conformed stem package the deliverable is built from."
      - name: mix_booking_id
        type: string
        source: input
        description: "FK -> MixStageBooking.id; the stage session that produced the mix."
      - name: status
        type: enum
        source: system
        default: PREPARED
        description: "QC lifecycle; DELIVERED, INVALIDATED and SUPERSEDED are terminal."
        constraints: "PREPARED | QC_SUBMITTED | QC_REJECTED | REMEDIATION | QC_PASSED | DELIVERED | INVALIDATED | SUPERSEDED"
      - name: measured_integrated_lufs
        type: number
        source: system
        default: null
        description: "Integrated loudness measured for the current QC round; captured at qc-submit."
        constraints: "-40.00..0.00, 2 decimal places"
      - name: measured_true_peak_dbtp
        type: number
        source: system
        default: null
        description: "True peak measured for the current QC round; captured at qc-submit."
        constraints: "-20.00..0.00, 2 decimal places"
      - name: me_stems_present
        type: boolean
        source: system
        default: null
        description: "Whether an M&E stem set accompanied the submission; captured at qc-submit."
      - name: deviation_lu
        type: number
        source: computed
        default: null
        description: "abs(measured_integrated_lufs - PlatformSpec.target_lufs), 2 decimal places; recomputed at every qc-submit."
        constraints: ">= 0"
      - name: remediation_round
        type: integer
        source: system
        default: 0
        description: "Number of remediation rounds consumed; bounded by PlatformSpec.max_remediation_rounds."
        constraints: ">= 0"
      - name: qc_rejection_codes
        type: array
        source: computed
        default: []
        description: "Ordered rejection codes from the latest evaluation; empty on PASS."
        constraints: "ordered subset of [LOUDNESS_OUT_OF_TOLERANCE, TRUE_PEAK_EXCEEDED, ME_STEMS_MISSING]"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PostSupervisor who created this deliverable; the segregation-of-duties comparand at qc-submit. NOT a foreign key."
      - name: delivery_reference
        type: string
        source: system
        default: null
        description: "Client-side delivery reference captured at delivery; null until DELIVERED."
      - name: delivered_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of delivery; null until DELIVERED."
      - name: invalidation_reason
        type: enum
        source: system
        default: null
        description: "Why the deliverable was invalidated; null unless status == INVALIDATED."
        constraints: "STEM_STALE | null"

  - name: QcReport
    parent: Deliverable
    common_fields: false
    description: "Append-only QC evaluation record; one row per evaluated round. Immutable — no version field and no update endpoint."
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; the deliverable evaluated (supplied by the URL path)."
      - name: round
        type: integer
        source: system
        description: "Deliverable.remediation_round at evaluation time; 0 for the first evaluation."
        constraints: ">= 0"
      - name: verdict
        type: enum
        source: computed
        description: "PASS when rejection_codes is empty, else FAIL."
        constraints: "PASS | FAIL"
      - name: rejection_codes
        type: array
        source: computed
        description: "Ordered codes produced by calculations.loudness_qc_verdict."
        constraints: "ordered subset of [LOUDNESS_OUT_OF_TOLERANCE, TRUE_PEAK_EXCEEDED, ME_STEMS_MISSING]"
      - name: measured_integrated_lufs
        type: number
        source: system
        description: "Snapshot of the submitted integrated loudness."
      - name: measured_true_peak_dbtp
        type: number
        source: system
        description: "Snapshot of the submitted true peak."
      - name: target_lufs
        type: number
        source: system
        description: "Snapshot of PlatformSpec.target_lufs at evaluation time."
      - name: deviation_lu
        type: number
        source: computed
        description: "Snapshot of the computed deviation."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID that submitted the measurements. NOT a foreign key."
      - name: evaluated_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID that evaluated the round. NOT a foreign key."
      - name: evaluated_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the evaluation."

  - name: ArchivePackage
    parent: Project
    common_fields: false
    description: "Immutable seal of session files and conformed stems for future versions. No version field, no update endpoint."
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the archived project (supplied by the URL path)."
      - name: session_file_count
        type: integer
        source: input
        description: "Number of DAW session files handed to the archive."
        constraints: "> 0"
      - name: retention_years
        type: integer
        source: input
        default: 10
        description: "Retention term in years."
        constraints: "> 0"
      - name: stem_manifest_count
        type: integer
        source: computed
        description: "Count of the project's StemPackages with status == CONFORMED at seal time."
        constraints: ">= 1"
      - name: archived_stem_package_ids
        type: array
        source: computed
        description: "Ids of the sealed stem packages, ordered by StemPackage.created_at ASC."
      - name: delivered_deliverable_count
        type: integer
        source: computed
        description: "Count of the project's Deliverables with status == DELIVERED at seal time."
        constraints: ">= 1"
      - name: sealed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the seal."
      - name: sealed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the sealing PostSupervisor. NOT a foreign key."

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
#
# SHARED RULE R-STALE (referenced by every transition that makes a StemPackage
# STALE). It is a two-hop propagation and is spelled out in full at each call
# site so a PRD reader can follow every hop:
#   hop A: StemPackage.status -> STALE, stale_reason set, Project.stale_stem_count
#          recomputed, Project.posture recomputed.
#   hop B: BECAUSE that stem package became STALE, every Deliverable whose
#          stem_package_id == that package and whose status IN
#          {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED}
#          -> INVALIDATED with invalidation_reason = STEM_STALE.
#   hop C: BECAUSE that deliverable became INVALIDATED, the MixStageBooking
#          identified by its mix_booking_id, if its status IN {RESERVED, CONFIRMED},
#          -> RELEASED with release_reason = "DELIVERABLE_INVALIDATED", which
#          recomputes Project.stage_hours_reserved / stage_hours_available /
#          stage_cost_subtotal_cents / billing_total_cents.
# Deliverables in DELIVERED / INVALIDATED / SUPERSEDED and bookings in
# IN_PROGRESS / COMPLETED / RELEASED / SUPERSEDED are NOT touched (conditional cascade).
# -----------------------------------------------------------------------------
state_machines:

  - entity: Project
    dimension: picture_status
    initial_state: NOT_LOCKED
    terminal_states: []
    note: "Cyclic dimension. Evolves independently of pipeline_stage; breaking picture lock never regresses pipeline_stage."
    transitions:
      - from: NOT_LOCKED
        to: LOCKED
        trigger: "POST /projects/{id}/picture-lock"
        actor: PostSupervisor
        preconditions:
          - "picture_status == NOT_LOCKED"
          - "pipeline_stage != ARCHIVED"
        side_effects:
          - "picture_locked_at_utc = logical clock now"
          - "picture_lock_revision += 1"
          - "when pipeline_stage == INTAKE it advances to EDITORIAL (parallel-dimension bubble)"
          - "posture recomputed by calculations.project_posture"
          - "Project.version += 1"
      - from: LOCKED
        to: LOCK_BROKEN
        trigger: "POST /projects/{id}/break-picture-lock"
        actor: PostSupervisor
        preconditions:
          - "picture_status == LOCKED"
          - "pipeline_stage != ARCHIVED"
        side_effects:
          - "CASCADE hop 1: picture_status = LOCK_BROKEN; posture recomputed to FROZEN (picture_status == LOCK_BROKEN dominates); Project.version += 1"
          - "CASCADE hop 2: BECAUSE picture_status became LOCK_BROKEN, every StemPackage of this project with status == CONFORMED -> STALE with stale_reason = PICTURE_LOCK_BROKEN; Project.stale_stem_count / conformed_stem_count recomputed"
          - "CASCADE hop 3: BECAUSE those stem packages became STALE, every Deliverable whose stem_package_id is one of them and whose status IN {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED} -> INVALIDATED with invalidation_reason = STEM_STALE (shared rule R-STALE hop B)"
          - "CASCADE hop 4: BECAUSE those deliverables became INVALIDATED, each one's MixStageBooking (mix_booking_id) with status IN {RESERVED, CONFIRMED} -> RELEASED with release_reason = 'DELIVERABLE_INVALIDATED'; Project.stage_hours_reserved, stage_hours_available, stage_cost_subtotal_cents and billing_total_cents recomputed (shared rule R-STALE hop C)"
          - "pipeline_stage is NOT changed (independent dimension)"
      - from: LOCK_BROKEN
        to: LOCKED
        trigger: "POST /projects/{id}/picture-lock (re-lock after a new cut)"
        actor: PostSupervisor
        preconditions:
          - "picture_status == LOCK_BROKEN"
          - "pipeline_stage != ARCHIVED"
        side_effects:
          - "picture_locked_at_utc = logical clock now"
          - "picture_lock_revision += 1"
          - "posture recomputed: FROZEN -> RESTRICTED when stale_stem_count >= 1 or unlicensed_usage_count >= 1, else OPEN"
          - "pipeline_stage unchanged"
          - "Project.version += 1"
        note: "Re-locking does NOT re-conform stem packages; they stay STALE until POST /stem-packages/{id}/conform runs again."

  - entity: Project
    dimension: pipeline_stage
    initial_state: INTAKE
    terminal_states: [ARCHIVED]
    note: "Monotonic forward dimension. Each transition fires only when pipeline_stage currently equals its `from:` value; otherwise the triggering event leaves pipeline_stage untouched (no regression, no skipping)."
    transitions:
      - from: INTAKE
        to: EDITORIAL
        trigger: "system — first successful picture lock (NOT_LOCKED -> LOCKED)"
        actor: system
        preconditions: ["pipeline_stage == INTAKE"]
        side_effects: ["Project.version += 1 (same mutation as the picture-lock transition)"]
      - from: EDITORIAL
        to: PREMIX
        trigger: "system — a StemPackage of this project transitions into CONFORMED and conformed_stem_count goes 0 -> 1"
        actor: system
        preconditions: ["pipeline_stage == EDITORIAL", "conformed_stem_count == 1 after the conform"]
        side_effects: ["Project.version += 1"]
      - from: PREMIX
        to: FINAL_MIX
        trigger: "system — a MixStageBooking of this project with booking_type == FINAL_MIX reaches CONFIRMED"
        actor: system
        preconditions: ["pipeline_stage == PREMIX"]
        side_effects: ["Project.version += 1"]
      - from: FINAL_MIX
        to: QC
        trigger: "system — a MixStageBooking of this project with booking_type == FINAL_MIX reaches COMPLETED"
        actor: system
        preconditions: ["pipeline_stage == FINAL_MIX"]
        side_effects: ["Project.version += 1"]
      - from: QC
        to: DELIVERED
        trigger: "system — the first Deliverable of this project reaches DELIVERED"
        actor: system
        preconditions: ["pipeline_stage == QC"]
        side_effects: ["Project.version += 1"]
      - from: DELIVERED
        to: ARCHIVED
        trigger: "POST /projects/{id}/archive-packages"
        actor: PostSupervisor
        preconditions:
          - "pipeline_stage == DELIVERED"
          - "posture == OPEN"
          - "count(Deliverable where project_id == this AND status == DELIVERED) >= 1"
          - "count(Deliverable where project_id == this AND status IN {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED}) == 0"
          - "no ArchivePackage already exists for this project"
        side_effects:
          - "ArchivePackage created with stem_manifest_count / archived_stem_package_ids (ordered by StemPackage.created_at ASC) / delivered_deliverable_count / sealed_at_utc = clock"
          - "every StemPackage of this project with status == CONFORMED -> RETIRED"
          - "pipeline_stage = ARCHIVED; all further child writes on this project are rejected with ERR_PROJECT_ARCHIVED"
          - "Project.version += 1"

  - entity: StemPackage
    initial_state: DRAFT
    terminal_states: [RETIRED]
    note: "Cyclic: CONFORMED <-> STALE, with conform_round incrementing on every entry into CONFORMED."
    transitions:
      - from: DRAFT
        to: CONFORMED
        trigger: "POST /stem-packages/{id}/conform"
        actor: SoundEditor
        preconditions:
          - "status == DRAFT"
          - "count(MusicCue where stem_package_id == this AND status == ACTIVE) >= 1"
          - "project.posture != FROZEN"
          - "project.pipeline_stage != ARCHIVED"
        side_effects:
          - "cue_count, total_stem_minutes and conform_fee_cents pinned per calculations.stem_conform_totals"
          - "conform_round += 1; conformed_at_utc = clock; stale_reason = null"
          - "Project.conformed_stem_count recomputed; when it goes 0 -> 1 and pipeline_stage == EDITORIAL, pipeline_stage advances to PREMIX"
          - "Project.posture recomputed; Project.version += 1"
      - from: STALE
        to: CONFORMED
        trigger: "POST /stem-packages/{id}/conform (re-conform)"
        actor: SoundEditor
        preconditions:
          - "status == STALE"
          - "count(MusicCue where stem_package_id == this AND status == ACTIVE) >= 1"
          - "project.posture != FROZEN  (a LOCK_BROKEN project must be re-locked first)"
          - "project.pipeline_stage != ARCHIVED"
        side_effects:
          - "cue_count, total_stem_minutes and conform_fee_cents recomputed and re-pinned"
          - "conform_round += 1; conformed_at_utc = clock; stale_reason = null"
          - "Project.stale_stem_count decremented and conformed_stem_count incremented; posture recomputed (RESTRICTED -> OPEN once stale_stem_count == 0 and unlicensed_usage_count == 0)"
          - "Project.version += 1"
        note: "Re-conform does NOT resurrect deliverables invalidated by rule R-STALE; a fresh Deliverable must be created."
      - from: CONFORMED
        to: STALE
        trigger: "system — (a) the project's picture lock breaks, (b) a CLEARED AssetUsage on this package flips to UNLICENSED, or (c) a MusicCue on this package is revised (superseded)"
        actor: system
        preconditions: ["status == CONFORMED"]
        side_effects:
          - "stale_reason = PICTURE_LOCK_BROKEN | LICENSE_REVOKED | CUE_REVISED per trigger"
          - "shared rule R-STALE hop B: every Deliverable whose stem_package_id == this and whose status IN {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED} -> INVALIDATED (invalidation_reason = STEM_STALE)"
          - "shared rule R-STALE hop C: BECAUSE each of those deliverables became INVALIDATED, its MixStageBooking with status IN {RESERVED, CONFIRMED} -> RELEASED (release_reason = 'DELIVERABLE_INVALIDATED') and the project's stage-hour ledger is recomputed"
          - "Project.stale_stem_count / conformed_stem_count / posture recomputed; Project.version += 1"
      - from: CONFORMED
        to: RETIRED
        trigger: "system — POST /projects/{id}/archive-packages seals the project"
        actor: system
        preconditions: ["status == CONFORMED", "project archive seal succeeded"]
        side_effects: ["ids recorded in ArchivePackage.archived_stem_package_ids", "Project.conformed_stem_count recomputed"]

  - entity: MusicCue
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — POST /stem-packages/{id}/music-cues creates a cue whose cue_number equals this cue's cue_number"
        actor: system
        preconditions: ["status == ACTIVE", "same stem_package_id and same cue_number as the incoming cue"]
        side_effects:
          - "the incoming cue is created ACTIVE; StemPackage.version += 1"
          - "when the stem package's status == CONFORMED it transitions to STALE with stale_reason = CUE_REVISED, which fires shared rule R-STALE hops B and C"

  - entity: AdrSession
    initial_state: PROPOSED
    terminal_states: [RECORDED, CANCELLED, NO_SHOW]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /adr-sessions/{id}/confirm"
        actor: SoundEditor
        preconditions:
          - "status == PROPOSED"
          - "project.posture != FROZEN"
          - "project.pipeline_stage != ARCHIVED"
        side_effects:
          - "Project.adr_cost_cents recomputed (this session's session_cost_cents enters the set)"
          - "Project.billing_total_cents recomputed; Project.version += 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /adr-sessions/{id}/cancel with cancellation_reason IN {CLIENT_REQUEST, SCHEDULE_CONFLICT}"
        actor: SoundEditor | PostSupervisor
        preconditions: ["status == PROPOSED", "project.pipeline_stage != ARCHIVED"]
        side_effects:
          - "cancellation_reason recorded; the session leaves both the talent overlap set and the talent daily-cap set"
      - from: CONFIRMED
        to: RECORDED
        trigger: "POST /adr-sessions/{id}/record"
        actor: SoundEditor
        preconditions:
          - "status == CONFIRMED"
          - "lines_recorded <= lines_scheduled"
          - "logical clock >= window_start_utc"
          - "project.posture != FROZEN"
        side_effects: ["lines_recorded stored", "session stays inside Project.adr_cost_cents (already counted at CONFIRMED)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /adr-sessions/{id}/cancel with cancellation_reason IN {CLIENT_REQUEST, SCHEDULE_CONFLICT}"
        actor: SoundEditor | PostSupervisor
        preconditions: ["status == CONFIRMED", "project.pipeline_stage != ARCHIVED"]
        side_effects:
          - "Project.adr_cost_cents recomputed (this session leaves the set); Project.billing_total_cents recomputed; Project.version += 1"
          - "the session leaves both the talent overlap set and the talent daily-cap set"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /adr-sessions/{id}/cancel with cancellation_reason == TALENT_NO_SHOW"
        actor: SoundEditor | PostSupervisor
        preconditions:
          - "status == CONFIRMED"
          - "logical clock >= window_start_utc"
        side_effects:
          - "session_cost_cents STAYS inside Project.adr_cost_cents (the day is still billed)"
          - "the session leaves the talent overlap set but REMAINS in the talent daily-cap set"

  - entity: MixStageBooking
    initial_state: RESERVED
    terminal_states: [COMPLETED, RELEASED, SUPERSEDED]
    note: "Branching: RESERVED -> {CONFIRMED, RELEASED, SUPERSEDED}; CONFIRMED -> {IN_PROGRESS, RELEASED, SUPERSEDED}."
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /mix-bookings/{id}/confirm"
        actor: Mixer
        preconditions:
          - "status == RESERVED"
          - "X-User-ID == mixer_id"
          - "sum(reserved_hours) over this mixer's bookings in status IN {CONFIRMED, IN_PROGRESS, COMPLETED} whose window_start_utc falls on the same UTC calendar day, plus this booking's reserved_hours, <= Mixer.max_daily_hours"
          - "project.posture != FROZEN"
          - "project.pipeline_stage != ARCHIVED"
        side_effects:
          - "when booking_type == FINAL_MIX and project.pipeline_stage == PREMIX, pipeline_stage advances to FINAL_MIX; Project.version += 1"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /mix-bookings/{id}/client-signoff"
        actor: ClientReviewer
        preconditions:
          - "status IN {CONFIRMED, IN_PROGRESS}"
          - "client_attendance == REMOTE"
          - "X-User-ID == project.client_user_id"
          - "MixStage.supports_remote_review == true"
        side_effects: ["client_signoff_at_utc = logical clock now (field mutation only; status unchanged)"]
        note: "Idempotent-looking but not idempotent: a second sign-off on an already-signed booking is rejected with ERR_ALREADY_SIGNED_OFF."
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /mix-bookings/{id}/client-signoff"
        actor: ClientReviewer
        preconditions:
          - "status IN {CONFIRMED, IN_PROGRESS}"
          - "client_attendance == REMOTE"
          - "X-User-ID == project.client_user_id"
          - "MixStage.supports_remote_review == true"
        side_effects: ["client_signoff_at_utc = logical clock now (field mutation only; status unchanged)"]
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /mix-bookings/{id}/start"
        actor: Mixer
        preconditions:
          - "status == CONFIRMED"
          - "X-User-ID == mixer_id"
          - "logical clock < window_end_utc"
          - "project.posture != FROZEN"
        side_effects: ["actual_start_utc = logical clock now"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /mix-bookings/{id}/complete"
        actor: Mixer
        preconditions:
          - "status == IN_PROGRESS"
          - "X-User-ID == mixer_id"
          - "client_attendance != REMOTE OR client_signoff_at_utc != null"
          - "project.posture != FROZEN"
        side_effects:
          - "actual_end_utc = logical clock now"
          - "billable_hours_final, overtime_hours and final_cost_cents pinned per calculations.stage_booking_cost variant FINAL"
          - "the booking leaves Project.stage_hours_reserved and enters Project.stage_hours_consumed; stage_hours_available recomputed"
          - "Project.stage_cost_subtotal_cents and billing_total_cents recomputed"
          - "when booking_type == FINAL_MIX and project.pipeline_stage == FINAL_MIX, pipeline_stage advances to QC"
          - "Project.version += 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /mix-bookings/{id}/release"
        actor: PostSupervisor
        preconditions: ["status == RESERVED", "project.pipeline_stage != ARCHIVED"]
        side_effects:
          - "release_reason stored"
          - "COMPENSATION: reserved_hours leave Project.stage_hours_reserved; stage_hours_available returns to its pre-booking value; stage_cost_subtotal_cents and billing_total_cents recomputed; Project.version += 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /mix-bookings/{id}/release"
        actor: PostSupervisor
        preconditions: ["status == CONFIRMED", "project.pipeline_stage != ARCHIVED"]
        side_effects:
          - "release_reason stored"
          - "COMPENSATION: reserved_hours leave Project.stage_hours_reserved; stage_hours_available returns to its pre-booking value; Project.version += 1"
          - "pipeline_stage is NOT regressed"
      - from: RESERVED
        to: SUPERSEDED
        trigger: "system — POST /mix-bookings creates a booking with the same (project_id, booking_type)"
        actor: system
        preconditions: ["status == RESERVED", "same project_id and booking_type as the incoming booking"]
        side_effects:
          - "reserved_hours leave Project.stage_hours_reserved; stage_hours_available and stage_cost_subtotal_cents recomputed"
          - "this booking is excluded from the incoming request's stage-overlap and stage-hours checks (see validations priority 33 and 42)"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system — POST /mix-bookings creates a booking with the same (project_id, booking_type)"
        actor: system
        preconditions: ["status == CONFIRMED", "same project_id and booking_type as the incoming booking"]
        side_effects:
          - "reserved_hours leave Project.stage_hours_reserved; stage_hours_available and stage_cost_subtotal_cents recomputed"
          - "this booking is excluded from the incoming request's stage-overlap and stage-hours checks"
      - from: RESERVED
        to: RELEASED
        trigger: "system — shared rule R-STALE hop C (a Deliverable pointing at this booking became INVALIDATED)"
        actor: system
        preconditions: ["status IN {RESERVED, CONFIRMED}", "a Deliverable with mix_booking_id == this booking just became INVALIDATED"]
        side_effects:
          - "release_reason = 'DELIVERABLE_INVALIDATED'"
          - "reserved_hours leave Project.stage_hours_reserved; stage_hours_available recomputed; Project.version += 1"

  - entity: Deliverable
    initial_state: PREPARED
    terminal_states: [DELIVERED, INVALIDATED, SUPERSEDED]
    note: "Cyclic QC loop (REMEDIATION -> QC_SUBMITTED -> QC_REJECTED -> REMEDIATION) with a branching evaluation (QC_SUBMITTED -> {QC_PASSED, QC_REJECTED})."
    transitions:
      - from: PREPARED
        to: QC_SUBMITTED
        trigger: "POST /deliverables/{id}/qc-submit"
        actor: QcOperator
        preconditions:
          - "status == PREPARED"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
          - "MixStageBooking(mix_booking_id).status == COMPLETED"
          - "StemPackage(stem_package_id).status == CONFORMED"
          - "project.posture == OPEN"
        side_effects:
          - "measured_integrated_lufs, measured_true_peak_dbtp and me_stems_present stored"
          - "deviation_lu recomputed per calculations.loudness_qc_verdict"
      - from: REMEDIATION
        to: QC_SUBMITTED
        trigger: "POST /deliverables/{id}/qc-submit (next round of the cycle)"
        actor: QcOperator
        preconditions:
          - "status == REMEDIATION"
          - "X-User-ID != prepared_by_user_id"
          - "MixStageBooking(mix_booking_id).status == COMPLETED"
          - "StemPackage(stem_package_id).status == CONFORMED"
          - "project.posture == OPEN"
        side_effects: ["new measurements overwrite the previous round's values", "deviation_lu recomputed"]
      - from: QC_SUBMITTED
        to: QC_PASSED
        trigger: "POST /deliverables/{id}/qc-evaluate — calculations.loudness_qc_verdict yields an empty rejection-code list"
        actor: QcOperator
        preconditions: ["status == QC_SUBMITTED", "rejection code list computes to []"]
        side_effects:
          - "QcReport appended (verdict PASS, round = remediation_round, rejection_codes = [])"
          - "qc_rejection_codes = []"
      - from: QC_SUBMITTED
        to: QC_REJECTED
        trigger: "POST /deliverables/{id}/qc-evaluate — calculations.loudness_qc_verdict yields a non-empty rejection-code list"
        actor: QcOperator
        preconditions: ["status == QC_SUBMITTED", "rejection code list computes to a non-empty ordered list"]
        side_effects:
          - "QcReport appended (verdict FAIL, round = remediation_round, ordered rejection_codes)"
          - "qc_rejection_codes = the same ordered list"
      - from: QC_REJECTED
        to: REMEDIATION
        trigger: "POST /deliverables/{id}/remediate"
        actor: PostSupervisor
        preconditions:
          - "status == QC_REJECTED"
          - "remediation_round < PlatformSpec(platform_spec_id).max_remediation_rounds"
          - "project.pipeline_stage != ARCHIVED"
        side_effects: ["remediation_round += 1", "qc_rejection_codes = []"]
      - from: QC_PASSED
        to: DELIVERED
        trigger: "POST /deliverables/{id}/deliver"
        actor: PostSupervisor
        preconditions:
          - "status == QC_PASSED"
          - "project.posture == OPEN"
          - "project.unlicensed_usage_count == 0"
          - "project.license_risk_score_audit < 50.00 (RISK_BLOCK_THRESHOLD)"
          - "StemPackage(stem_package_id).status == CONFORMED"
        side_effects:
          - "delivery_reference and delivered_at_utc stored"
          - "when project.pipeline_stage == QC it advances to DELIVERED"
          - "Project.version += 1"
      - from: PREPARED
        to: INVALIDATED
        trigger: "system — shared rule R-STALE hop B"
        actor: system
        preconditions: ["status IN {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED}", "StemPackage(stem_package_id) just became STALE"]
        side_effects:
          - "invalidation_reason = STEM_STALE"
          - "hop C: the MixStageBooking(mix_booking_id) with status IN {RESERVED, CONFIRMED} -> RELEASED"
      - from: QC_PASSED
        to: INVALIDATED
        trigger: "system — shared rule R-STALE hop B"
        actor: system
        preconditions: ["status IN {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED}", "StemPackage(stem_package_id) just became STALE"]
        side_effects:
          - "invalidation_reason = STEM_STALE"
          - "hop C: the MixStageBooking(mix_booking_id) with status IN {RESERVED, CONFIRMED} -> RELEASED"
      - from: PREPARED
        to: SUPERSEDED
        trigger: "system — POST /deliverables creates a deliverable with the same (project_id, platform_spec_id)"
        actor: system
        preconditions: ["status IN {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED}", "same (project_id, platform_spec_id) as the incoming deliverable"]
        side_effects: ["the prior deliverable is frozen out of the QC loop; its QcReports remain readable"]

  - entity: AssetUsage
    initial_state: CLEARED
    terminal_states: [UNLICENSED]
    note: "Creation lands in CLEARED or directly in UNLICENSED depending on calculations.asset_usage_clearance; only CLEARED -> UNLICENSED exists afterwards."
    transitions:
      - from: CLEARED
        to: UNLICENSED
        trigger: "system — POST /library-assets/{id}/revoke revokes the referenced asset"
        actor: system
        preconditions: ["clearance_status == CLEARED", "library_asset_id == the revoked asset"]
        side_effects:
          - "CASCADE hop 2: accrued_fee_cents = 0; unlicensed_reason = ASSET_REVOKED; cleared_at_utc = null"
          - "Project.license_fee_accrued_cents, unlicensed_usage_count, billing_total_cents, license_risk_score_intake and license_risk_score_audit recomputed; posture recomputed"
          - "CASCADE hop 3: BECAUSE this usage became UNLICENSED, StemPackage(stem_package_id) with status == CONFORMED -> STALE with stale_reason = LICENSE_REVOKED, which fires shared rule R-STALE hops B and C"

  - entity: LibraryAsset
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /library-assets/{id}/revoke"
        actor: FacilityAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "CASCADE hop 1: status = REVOKED; revocation_reason stored; LibraryAsset.version += 1"
          - "CASCADE hop 2: BECAUSE the asset became REVOKED, every AssetUsage with library_asset_id == this asset and clearance_status == CLEARED -> UNLICENSED (accrued_fee_cents = 0)"
          - "CASCADE hop 3: BECAUSE those usages became UNLICENSED, each one's StemPackage with status == CONFORMED -> STALE (stale_reason = LICENSE_REVOKED)"
          - "CASCADE hop 4: BECAUSE those stem packages became STALE, shared rule R-STALE hops B and C run (deliverables INVALIDATED, their RESERVED/CONFIRMED bookings RELEASED, stage-hour ledger recomputed)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /mix-bookings"
    occ_field: "expected_project_version"
    description: |
      Creating a MixStageBooking against a Project whose version has advanced since the
      client last observed it is rejected. Booking creation legitimately supersedes the
      project's prior non-terminal booking of the same booking_type (§1.2
      MixStageBooking RESERVED -> SUPERSEDED), so a second create against the same
      project would otherwise silently discard a reservation the client never saw.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: deliverable-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /deliverables"
    occ_field: "expected_project_version"
    description: |
      Creating a Deliverable against a Project whose version has advanced since the client
      last observed it is rejected. A new deliverable for an existing (project_id,
      platform_spec_id) pair legitimately supersedes the prior non-terminal deliverable for
      that platform spec, so a stale-view create would discard QC progress the client has
      not observed.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: cue-create-stale-stem-package
    parent_entity: StemPackage
    write_endpoint: "POST /stem-packages/{id}/music-cues"
    occ_field: "expected_stem_package_version"
    description: |
      Adding a MusicCue to a StemPackage whose version has advanced since the client last
      observed it is rejected. A cue carrying an existing cue_number legitimately supersedes
      the prior ACTIVE cue at that number and can push a CONFORMED package back to STALE, so
      a stale-view create would revise a cue set the client never saw.
    error_id: ERR_STALE_STEM_PACKAGE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules
# All money is integer cents. All decimal quantities use round_half_up at the
# stated precision. Every multi-step formula pins its evaluation order and names
# the forbidden alternative order so no implementation choice is left open.
# -----------------------------------------------------------------------------
calculations:

  - name: stage_booking_cost
    description: |
      Cost of a mix stage booking. Two variants: PROVISIONAL is pinned at reservation time from
      the requested window; FINAL is pinned at COMPLETED from the actual occupied window and may
      add overtime. Both apply the project's turnaround multiplier.
    algorithm_type: threshold
    dual_variant: true
    precision: "hours to 2 decimal places; money to integer cents"
    rounding: round_half_up
    constants:
      MIN_SESSION_HOURS: 2.00
      BILLING_INCREMENT_HOURS: 0.25
      OVERTIME_RATE_FACTOR: 1.5
      TURNAROUND_MULTIPLIER: { STANDARD: 1.00, EXPEDITED: 1.25, RUSH: 1.60 }
    variants:
      - name: PROVISIONAL
        applied_when: "MixStageBooking is created (status RESERVED) — stored in provisional_cost_cents; also the value carried while the booking is CONFIRMED or IN_PROGRESS"
        formula: |
          requested_hours = (window_end_utc - window_start_utc) in hours, rounded half-up to 2dp
          reserved_hours  = max(requested_hours, MIN_SESSION_HOURS)          # stored on the booking
          base_cents      = round_half_up(reserved_hours * MixStage.hourly_rate_cents)
          provisional_cost_cents =
              round_half_up(base_cents * TURNAROUND_MULTIPLIER[Project.turnaround_class])
        notes:
          - "PROVISIONAL never contains overtime: overtime is a FINAL-only concept."
          - "reserved_hours is what enters Project.stage_hours_reserved (see stage_hours_ledger)."
      - name: FINAL
        applied_when: "MixStageBooking transitions IN_PROGRESS -> COMPLETED — stored in billable_hours_final / overtime_hours / final_cost_cents"
        formula: |
          elapsed_hours   = (actual_end_utc - actual_start_utc) in hours, exact
          incremented     = ceiling(elapsed_hours / BILLING_INCREMENT_HOURS) * BILLING_INCREMENT_HOURS
          billable_hours_final = max(incremented, MIN_SESSION_HOURS)        # 2dp
          overtime_hours  = max(billable_hours_final - reserved_hours, 0.00) # 2dp
          regular_hours   = billable_hours_final - overtime_hours
          base_cents      = round_half_up(regular_hours * MixStage.hourly_rate_cents)
                          + round_half_up(overtime_hours * MixStage.hourly_rate_cents * OVERTIME_RATE_FACTOR)
          final_cost_cents =
              round_half_up(base_cents * TURNAROUND_MULTIPLIER[Project.turnaround_class])
        notes:
          - "Ceiling is applied to the 0.25h increment BEFORE the MIN_SESSION_HOURS floor; the reverse order is forbidden."
          - "The turnaround multiplier is applied ONCE, to the regular+overtime sum; multiplying each component separately and then summing is forbidden."
    variant_divergence_example: |
      MixStage.hourly_rate_cents = 120000, Project.turnaround_class = STANDARD.
      Requested window 10:00:00Z -> 13:00:00Z: requested_hours = 3.00, reserved_hours = 3.00,
        provisional_cost_cents = 360000.
      Actual window 10:00:00Z -> 13:10:00Z: elapsed 3.1667h -> incremented 3.25 ->
        billable_hours_final = 3.25, overtime_hours = 0.25, regular_hours = 3.00,
        base = 360000 + 45000 = 405000, final_cost_cents = 405000  (delta +45000).
      Same requested window with turnaround_class = RUSH: provisional_cost_cents = 576000.
      A 1-hour window: requested 1.00 -> reserved_hours 2.00 -> provisional 240000.
      Start and complete at the same instant: elapsed 0.0000 -> incremented 0.00 ->
        billable_hours_final = 2.00, overtime_hours = 0.00, final_cost_cents = 240000.

  - name: license_risk_score
    description: |
      Licensing exposure score for a project, 0.00–100.00. Two variants over the SAME asset
      usages: INTAKE_SNAPSHOT ignores expiry proximity and unlicensed penalties (it scores the
      material mix only); DELIVERY_AUDIT adds the unlicensed penalty and the near-expiry weight.
      Stored in Project.license_risk_score_intake and Project.license_risk_score_audit.
    algorithm_type: weighted_scoring
    dual_variant: true
    precision: "2 decimal places"
    rounding: round_half_up
    constants:
      RM_WEIGHT: 20
      RF_WEIGHT: 5
      UNLICENSED_PENALTY: 30
      NEAR_EXPIRY_WEIGHT: 10
      NEAR_EXPIRY_WINDOW_DAYS: 30
      RISK_BLOCK_THRESHOLD: 50.00
      SCORE_CAP: 100.00
    input_set: "every AssetUsage whose stem_package_id belongs to a StemPackage of this project and whose StemPackage.status IN {DRAFT, CONFORMED, STALE} (RETIRED packages are excluded)"
    variants:
      - name: INTAKE_SNAPSHOT
        applied_when: "recomputed on every AssetUsage create and on every LibraryAsset revoke; stored in license_risk_score_intake"
        formula: |
          CLEARED usages only — the snapshot scores the licensed material mix:
          rm_count = count(usages whose clearance_status == CLEARED and whose
              LibraryAsset.license_type == RIGHTS_MANAGED)
          rf_count = count(usages whose clearance_status == CLEARED and whose
              LibraryAsset.license_type == ROYALTY_FREE)
          raw = rm_count * RM_WEIGHT + rf_count * RF_WEIGHT
          license_risk_score_intake = min(round_half_up(raw), SCORE_CAP)
      - name: DELIVERY_AUDIT
        applied_when: "recomputed on the same events; stored in license_risk_score_audit; gate for POST /deliverables/{id}/deliver"
        formula: |
          rm_count / rf_count counted over ALL usages in the input set (cleared OR unlicensed) —
              this is the first divergence from INTAKE_SNAPSHOT, which counts cleared usages only
          unlicensed_count = count(usages whose clearance_status == UNLICENSED)
          near_expiry_count = count(usages whose clearance_status == CLEARED and whose
              LibraryAsset.expires_at_utc is not null and
              0 < (expires_at_utc - logical clock now) <= NEAR_EXPIRY_WINDOW_DAYS days)
          raw = rm_count * RM_WEIGHT + rf_count * RF_WEIGHT
              + unlicensed_count * UNLICENSED_PENALTY
              + near_expiry_count * NEAR_EXPIRY_WEIGHT
          license_risk_score_audit = min(round_half_up(raw), SCORE_CAP)
    variant_divergence_example: |
      One RIGHTS_MANAGED usage that is CLEARED and expires 10 days after the clock, plus one
      ROYALTY_FREE usage that is UNLICENSED:
        INTAKE_SNAPSHOT = 20 (the cleared RM usage only)                        = 20.00
        DELIVERY_AUDIT  = 20 + 5 + 30 (unlicensed) + 10 (near expiry)           = 65.00
                          -> >= RISK_BLOCK_THRESHOLD 50.00, so delivery is blocked while the
                             intake snapshot still reads a comfortable 20.00.
    notes:
      - "Both variants read the same usage rows; only the weight set differs. A delivery gate that reads the INTAKE variant is wrong."
      - "The cap is applied after summing, never per term."

  - name: stem_conform_totals
    description: |
      Stem package totals pinned when a StemPackage enters CONFORMED. The rounding ORDER is
      load-bearing: each ACTIVE cue's minutes are rounded to 2dp FIRST, and the rounded values
      are then summed.
    algorithm_type: aggregation
    precision: "minutes to 2 decimal places; money to integer cents"
    rounding: round_half_up
    constants:
      CONFORM_RATE_CENTS_PER_MINUTE: 1500
    input_set: "every MusicCue with stem_package_id == this package and status == ACTIVE (SUPERSEDED cues are excluded)"
    formula: |
      PINNED ORDER (per-item rounding, then summation):
        step 1: cue_count = count(input set)
        step 2: for each cue: cue_minutes[i] = round_half_up(cue.duration_seconds / 60, 2)
        step 3: total_stem_minutes = sum(cue_minutes[i])            # already 2dp, no re-rounding
        step 4: conform_fee_cents = round_half_up(total_stem_minutes * CONFORM_RATE_CENTS_PER_MINUTE)
    forbidden_alternative: |
      Summing raw seconds first and dividing once
      (total_stem_minutes = round_half_up(sum(duration_seconds) / 60, 2)) is FORBIDDEN.
      For three 95-second cues the pinned order gives 1.58 + 1.58 + 1.58 = 4.74 minutes and
      conform_fee_cents = 7110, whereas the forbidden order gives 285/60 = 4.75 minutes and
      7125 cents. The 15-cent divergence is the observable difference.
    worked_example: |
      Cues of 95s, 95s, 95s -> cue_count 3, total_stem_minutes 4.74, conform_fee_cents 7110.
      A single 90s cue -> total_stem_minutes 1.50, conform_fee_cents 2250.

  - name: project_billing_total
    description: |
      Project billing roll-up. Reads four component ledgers, applies a volume discount whose tier
      is keyed on the PRE-surcharge subtotal, then applies the rush surcharge to the POST-discount
      base. The apparent circularity (which of discount/surcharge sees the other) is resolved by
      the pinned step order below.
    algorithm_type: tiered_pricing
    precision: "integer cents at every step"
    rounding: round_half_up
    constants:
      VOLUME_DISCOUNT_TIERS:
        - { min_cents: 0,       max_cents: 499999,   rate: 0.00 }
        - { min_cents: 500000,  max_cents: 999999,   rate: 0.05 }
        - { min_cents: 1000000, max_cents: null,     rate: 0.08 }
      RUSH_SURCHARGE_PCT: { STANDARD: 0.00, EXPEDITED: 0.10, RUSH: 0.20 }
    formula: |
      PINNED ORDER:
        step 1: stage_cost_subtotal_cents = sum over this project's MixStageBookings of
                  final_cost_cents       when status == COMPLETED
                  provisional_cost_cents when status IN {RESERVED, CONFIRMED, IN_PROGRESS}
                  (RELEASED and SUPERSEDED bookings contribute 0)
        step 2: adr_cost_cents = sum of session_cost_cents over this project's AdrSessions with
                  status IN {CONFIRMED, RECORDED, NO_SHOW}
                  (PROPOSED and CANCELLED sessions contribute 0)
        step 3: conform_fee_total_cents = sum of conform_fee_cents over this project's StemPackages
                  with status IN {CONFORMED, STALE}
                  (DRAFT and RETIRED packages contribute 0)
        step 4: license_fee_accrued_cents = sum of accrued_fee_cents over the AssetUsages with
                  clearance_status == CLEARED whose StemPackage belongs to this project with
                  status IN {DRAFT, CONFORMED, STALE}
                  (RETIRED packages contribute 0; unlike step 3, a DRAFT package's cleared
                   licence fees DO accrue — the licence is owed the moment the material is cut in)
        step 5: pre_discount_total_cents = step1 + step2 + step3 + step4
        step 6: tier_rate = the VOLUME_DISCOUNT_TIERS rate whose [min_cents, max_cents] contains
                  pre_discount_total_cents  (tier is keyed on the PRE-surcharge subtotal)
                volume_discount_cents = round_half_up(pre_discount_total_cents * tier_rate)
        step 7: discounted_base_cents = pre_discount_total_cents - volume_discount_cents
        step 8: rush_surcharge_cents =
                  round_half_up(discounted_base_cents * RUSH_SURCHARGE_PCT[Project.turnaround_class])
                  (surcharge is computed on the POST-discount base)
        step 9: billing_total_cents = discounted_base_cents + rush_surcharge_cents
    forbidden_alternative: |
      Applying the rush surcharge before the discount, or selecting the discount tier from the
      post-surcharge total, is FORBIDDEN. Both alternatives change the result whenever the
      surcharge would push the subtotal across a tier boundary.
    worked_example: |
      stage_cost_subtotal 720000 + adr 54000 + conform 7110 + license 17890
        -> pre_discount_total_cents = 799000
        -> tier 500000..999999 rate 0.05 -> volume_discount_cents = 39950
        -> discounted_base_cents = 759050
        turnaround_class STANDARD: rush_surcharge_cents = 0     -> billing_total_cents = 759050
        turnaround_class RUSH:     rush_surcharge_cents = 151810 -> billing_total_cents = 910860

  - name: adr_session_cost
    description: |
      Cost of an ADR session. Union talent bills a minimum call; non-union talent bills the
      scheduled minutes exactly.
    algorithm_type: threshold
    precision: "integer minutes; money in integer cents"
    rounding: round_half_up
    constants:
      ADR_UNION_RATE_CENTS_PER_MINUTE: 900
      ADR_NON_UNION_RATE_CENTS_PER_MINUTE: 600
    formula: |
      scheduled_minutes = (window_end_utc - window_start_utc) in whole minutes
      if VoiceTalent.union_status == UNION:
          billable_minutes = max(scheduled_minutes, VoiceTalent.min_call_minutes)
          rate = ADR_UNION_RATE_CENTS_PER_MINUTE
      else:
          billable_minutes = scheduled_minutes
          rate = ADR_NON_UNION_RATE_CENTS_PER_MINUTE
      session_cost_cents = billable_minutes * rate
    worked_example: |
      UNION talent (min_call_minutes 60), 45-minute window -> billable_minutes 60, cost 54000.
      NON_UNION talent, 45-minute window                   -> billable_minutes 45, cost 27000.
      UNION talent, 15-minute window                        -> billable_minutes 60, cost 54000.
      billable_minutes (not scheduled_minutes) is what counts against VoiceTalent.daily_cap_minutes.

  - name: loudness_qc_verdict
    description: |
      Deliverable QC verdict against its PlatformSpec. Produces deviation_lu and an ORDERED
      rejection-code list; an empty list means PASS.
    algorithm_type: threshold
    precision: "LUFS / dBTP / LU to 2 decimal places"
    rounding: round_half_up
    constants:
      REJECTION_CODE_ORDER: [LOUDNESS_OUT_OF_TOLERANCE, TRUE_PEAK_EXCEEDED, ME_STEMS_MISSING]
    formula: |
      deviation_lu = round_half_up(absolute_value(measured_integrated_lufs - PlatformSpec.target_lufs), 2)
      codes = []
      if deviation_lu > PlatformSpec.tolerance_lu:            codes += [LOUDNESS_OUT_OF_TOLERANCE]
      if measured_true_peak_dbtp > PlatformSpec.true_peak_max_dbtp: codes += [TRUE_PEAK_EXCEEDED]
      if PlatformSpec.requires_me_stems == true and me_stems_present == false: codes += [ME_STEMS_MISSING]
      verdict = PASS when codes == [] else FAIL
      codes are emitted in REJECTION_CODE_ORDER regardless of evaluation order.
    boundary_rules:
      - "deviation_lu EXACTLY equal to tolerance_lu PASSES (the comparison is strictly greater-than)."
      - "measured_true_peak_dbtp EXACTLY equal to true_peak_max_dbtp PASSES."
    worked_example: |
      target_lufs -24.00, tolerance_lu 0.50, true_peak_max_dbtp -2.00, requires_me_stems true.
      measured -24.50 / -2.00 / me_stems_present true -> deviation_lu 0.50 -> codes [] -> PASS.
      measured -24.51 / -2.00 / me_stems_present true -> deviation_lu 0.51 -> codes [LOUDNESS_OUT_OF_TOLERANCE] -> FAIL.
      measured -23.49 / -1.99 / me_stems_present false -> deviation_lu 0.51 -> codes
        [LOUDNESS_OUT_OF_TOLERANCE, TRUE_PEAK_EXCEEDED, ME_STEMS_MISSING] -> FAIL.

  - name: stage_hours_ledger
    description: |
      Project stage-hour ledger over MixStageBookings. Maintains the identity
      stage_hours_reserved + stage_hours_consumed + stage_hours_available == stage_hours_authorized
      at all times, including after releases and supersessions (compensating invariant).
    algorithm_type: aggregation
    precision: "hours to 2 decimal places"
    rounding: round_half_up
    formula: |
      stage_hours_reserved = sum(reserved_hours) over bookings with status IN {RESERVED, CONFIRMED, IN_PROGRESS}
      stage_hours_consumed = sum(billable_hours_final) over bookings with status == COMPLETED
      stage_hours_available = stage_hours_authorized - stage_hours_reserved - stage_hours_consumed
      RELEASED and SUPERSEDED bookings contribute 0.00 to every term.
    invariant: |
      stage_hours_reserved + stage_hours_consumed + stage_hours_available == stage_hours_authorized
      holds after every mutation. Releasing a booking must return stage_hours_available to exactly
      its pre-create value (no drift), and completing a booking moves hours from reserved to
      consumed — never adds them twice.
    notes:
      - "On COMPLETED the consumed term uses billable_hours_final, which may exceed reserved_hours (overtime), so stage_hours_available can legitimately shrink at completion."
      - "stage_hours_available may go negative only through overtime at completion; validation priority 42 prevents reservations from driving it negative."

  - name: project_posture
    description: |
      Derived write-gate for a project. Recomputed after every mutation that can change
      picture_status, stale_stem_count or unlicensed_usage_count.
    algorithm_type: threshold
    precision: "enum"
    rounding: not_applicable
    formula: |
      stale_stem_count      = count(StemPackage where project_id == this AND status == STALE)
      unlicensed_usage_count = count(AssetUsage with clearance_status == UNLICENSED whose
                                     StemPackage belongs to this project and whose
                                     StemPackage.status IN {DRAFT, CONFORMED, STALE})
      if picture_status == LOCK_BROKEN:                              posture = FROZEN
      elif unlicensed_usage_count >= 1 or stale_stem_count >= 1:     posture = RESTRICTED
      else:                                                          posture = OPEN
    gate_semantics:
      FROZEN: "rejects EVERY child write on the project (conform, cue create, ADR confirm/record, booking create/confirm/start/complete, deliverable create, qc-submit, qc-evaluate, remediate, deliver, archive) with ERR_PROJECT_FROZEN"
      RESTRICTED: "permits conform, cue create, ADR operations and booking operations, but rejects qc-submit, qc-evaluate, deliver and archive with ERR_PROJECT_FROZEN"
      OPEN: "no posture gate"
    notes:
      - "LOCK_BROKEN dominates: a project with both a broken lock and stale stems is FROZEN, not RESTRICTED."
      - "Posture is derived, never written directly; input values for posture are ignored."

  - name: asset_usage_clearance
    description: |
      Clearance decision and licence accrual for a single AssetUsage at creation time.
    algorithm_type: threshold
    precision: "integer units; money in integer cents"
    rounding: round_half_up
    constants:
      BILLABLE_UNIT_SECONDS: 30
    formula: |
      billable_units = ceiling(usage_seconds / BILLABLE_UNIT_SECONDS)
      cleared = LibraryAsset.status == ACTIVE
                AND (LibraryAsset.expires_at_utc is null OR expires_at_utc > logical clock now)
                AND (LibraryAsset.territory_scope == WORLDWIDE OR
                     LibraryAsset.territory_scope == territory_declared)
      if cleared:
          clearance_status = CLEARED; cleared_at_utc = logical clock now; unlicensed_reason = null
          accrued_fee_cents = LibraryAsset.fee_cents * billable_units  when license_type == RIGHTS_MANAGED
          accrued_fee_cents = LibraryAsset.fee_cents                   when license_type == ROYALTY_FREE
      else:
          clearance_status = UNLICENSED; cleared_at_utc = null; accrued_fee_cents = 0
          unlicensed_reason = ASSET_REVOKED           when LibraryAsset.status == REVOKED
                            = ASSET_EXPIRED           when expires_at_utc <= logical clock now
                            = TERRITORY_OUT_OF_SCOPE  otherwise
          (evaluated in that order — a revoked AND expired asset reports ASSET_REVOKED)
    worked_example: |
      RIGHTS_MANAGED asset, fee_cents 25000, usage_seconds 100 -> billable_units 4 -> accrued_fee_cents 100000.
      ROYALTY_FREE asset, fee_cents 17890, usage_seconds 100   -> accrued_fee_cents 17890 (flat, units ignored).
      An asset whose expires_at_utc is exactly the logical clock now is EXPIRED (strict greater-than required).
    notes:
      - "territory_scope DOMESTIC with territory_declared INTERNATIONAL is out of scope; WORLDWIDE clears both."
      - "Accrual reversal on revoke sets accrued_fee_cents back to 0 and re-derives Project.license_fee_accrued_cents (compensating invariant)."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules — evaluated in ascending `priority`, first violation wins.
# Priorities are globally unique. When two rules are violated by the same request
# the LOWER priority number's error_id is returned, even when that means a 422 is
# returned in preference to a 409 (see priorities 24 vs 42).
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: authentication
    rule: "X-User-ID header is absent or empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all_endpoints_except_clock

  - priority: 2
    category: authorization
    rule: "X-User-Role header is absent, is not one of the six declared roles, or the role is not listed for the endpoint in §1.5/§1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all_endpoints_except_clock

  - priority: 3
    category: existence
    rule: "the /projects/{id} path parameter does not resolve to a Project"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: ["every path of the form /projects/{id} or /projects/{id}/..."]

  - priority: 4
    category: existence
    rule: "the /stem-packages/{id} path parameter does not resolve to a StemPackage"
    error_id: ERR_STEM_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: ["every path of the form /stem-packages/{id} or /stem-packages/{id}/..."]

  - priority: 5
    category: existence
    rule: "the /deliverables/{id} path parameter does not resolve to a Deliverable"
    error_id: ERR_DELIVERABLE_NOT_FOUND
    http_status: 404
    applies_to: ["every path of the form /deliverables/{id} or /deliverables/{id}/..."]

  - priority: 6
    category: existence
    rule: "the /mix-bookings/{id} path parameter does not resolve to a MixStageBooking"
    error_id: ERR_MIX_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: ["every path of the form /mix-bookings/{id}/..."]

  - priority: 7
    category: existence
    rule: "the /adr-sessions/{id} path parameter does not resolve to an AdrSession"
    error_id: ERR_ADR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: ["every path of the form /adr-sessions/{id}/..."]

  - priority: 8
    category: existence
    rule: "the /library-assets/{id} path parameter does not resolve to a LibraryAsset"
    error_id: ERR_LIBRARY_ASSET_NOT_FOUND
    http_status: 404
    applies_to: ["every path of the form /library-assets/{id}/..."]

  - priority: 9
    category: existence
    rule: |
      A foreign key supplied in the REQUEST BODY does not resolve to an existing entity. Path
      parameters are checked first (priorities 3–8, left to right in the path), then body foreign
      keys in the order they are declared in the endpoint's `input:` list.
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /stem-packages", "POST /stem-packages/{id}/music-cues", "POST /asset-usages", "POST /adr-sessions", "POST /mix-bookings", "POST /deliverables"]

  - priority: 10
    category: ownership
    rule: "the acting Mixer's X-User-ID does not equal MixStageBooking.mixer_id"
    error_id: ERR_NOT_ASSIGNED_MIXER
    http_status: 403
    applies_to: ["POST /mix-bookings/{id}/confirm", "POST /mix-bookings/{id}/start", "POST /mix-bookings/{id}/complete"]

  - priority: 11
    category: ownership
    rule: "the acting ClientReviewer's X-User-ID does not equal Project.client_user_id for the project reached through the booking"
    error_id: ERR_NOT_PROJECT_CLIENT
    http_status: 403
    applies_to: ["POST /mix-bookings/{id}/client-signoff", "GET /projects/{id}", "GET /projects/{id}/ledger"]

  - priority: 12
    category: schema
    rule: "a required input field is missing, null, of the wrong type, an unknown enum member, a negative quantity where non-negative is required, or a malformed ISO-8601 instant"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: ["every endpoint with a request body"]

  - priority: 13
    category: schema
    rule: "limit is not an integer in 1..100 or offset is not an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: ["every list endpoint"]

  - priority: 14
    category: concurrency
    rule: "expected_project_version does not equal the current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: ["POST /mix-bookings", "POST /deliverables"]

  - priority: 15
    category: concurrency
    rule: "expected_stem_package_version does not equal the current StemPackage.version"
    error_id: ERR_STALE_STEM_PACKAGE_VERSION
    http_status: 412
    applies_to: ["POST /stem-packages/{id}/music-cues"]

  - priority: 16
    category: posture
    rule: |
      The project's derived posture blocks the operation: posture == FROZEN blocks every child
      write; posture == RESTRICTED blocks qc-submit, qc-evaluate, deliver and archive.
    error_id: ERR_PROJECT_FROZEN
    http_status: 409
    applies_to: ["every child write on a Project"]

  - priority: 17
    category: posture
    rule: "Project.pipeline_stage == ARCHIVED and the request is any write beneath that project"
    error_id: ERR_PROJECT_ARCHIVED
    http_status: 409
    applies_to: ["every child write on a Project"]

  - priority: 18
    category: cross_entity_state
    rule: |
      The project's picture_status != LOCKED and the operation requires a locked picture. The
      requiring operations are exactly: POST /adr-sessions, POST /adr-sessions/{id}/confirm,
      POST /mix-bookings with booking_type IN {FINAL_MIX, PRINTMASTER}, and POST /deliverables.
      POST /mix-bookings with booking_type == PREMIX is exempt (premixing precedes picture lock).
    error_id: ERR_PICTURE_NOT_LOCKED
    http_status: 409
    applies_to: ["POST /adr-sessions", "POST /adr-sessions/{id}/confirm", "POST /mix-bookings", "POST /deliverables"]

  - priority: 19
    category: state_machine
    rule: "the entity's current status has no transition for this trigger (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["every action endpoint"]

  - priority: 20
    category: cross_entity_state
    rule: "the referenced StemPackage.status != CONFORMED"
    error_id: ERR_STEM_NOT_CONFORMED
    http_status: 409
    applies_to: ["POST /deliverables", "POST /deliverables/{id}/qc-submit", "POST /deliverables/{id}/deliver"]

  - priority: 21
    category: cross_entity_state
    rule: "the referenced MixStageBooking.status != COMPLETED"
    error_id: ERR_BOOKING_NOT_COMPLETED
    http_status: 409
    applies_to: ["POST /deliverables/{id}/qc-submit"]

  - priority: 22
    category: cross_entity_state
    rule: "MixStageBooking.client_attendance == REMOTE and client_signoff_at_utc is null"
    error_id: ERR_CLIENT_SIGNOFF_REQUIRED
    http_status: 409
    applies_to: ["POST /mix-bookings/{id}/complete"]

  - priority: 23
    category: segregation_of_duties
    rule: "the acting QcOperator's X-User-ID equals Deliverable.prepared_by_user_id, or the acting user equals QcReport.submitted_by_user_id of the round being evaluated"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /deliverables/{id}/qc-submit", "POST /deliverables/{id}/qc-evaluate"]

  - priority: 24
    category: capability
    rule: "the requested booking platform is not present in Mixer.certified_platforms"
    error_id: ERR_MIXER_NOT_CERTIFIED
    http_status: 422
    applies_to: ["POST /mix-bookings"]
    note: "Deliberately ordered BEFORE the fiscal check at priority 42: an uncertified mixer is a capability defect and must be reported even when the reservation would also blow the hour budget."

  - priority: 25
    category: licensing
    rule: "Project.unlicensed_usage_count >= 1"
    error_id: ERR_UNLICENSED_MATERIAL_PRESENT
    http_status: 409
    applies_to: ["POST /deliverables"]
    note: |
      Scoped to deliverable PREPARATION on purpose. An unlicensed usage on a live stem package
      already drives posture to RESTRICTED, and priority 16 (which is evaluated first) blocks
      qc-submit, qc-evaluate, deliver and archive on a RESTRICTED project — so this rule would be
      permanently shadowed if it were attached to those operations. Deliverable creation is NOT
      blocked by RESTRICTED, which is exactly where the licensing guard has to bite.

  - priority: 26
    category: licensing
    rule: "Project.license_risk_score_audit >= RISK_BLOCK_THRESHOLD (50.00)"
    error_id: ERR_LICENSE_RISK_TOO_HIGH
    http_status: 409
    applies_to: ["POST /deliverables/{id}/deliver"]

  - priority: 27
    category: limit
    rule: "Deliverable.remediation_round >= PlatformSpec.max_remediation_rounds"
    error_id: ERR_REMEDIATION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /deliverables/{id}/remediate"]

  - priority: 28
    category: consistency
    rule: "PlatformSpec.platform != MixStageBooking.platform for the booking referenced by the deliverable"
    error_id: ERR_SPEC_PLATFORM_MISMATCH
    http_status: 422
    applies_to: ["POST /deliverables"]

  - priority: 29
    category: consistency
    rule: "a referenced StemPackage or MixStageBooking belongs to a different project than the one named in the request"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 422
    applies_to: ["POST /deliverables", "POST /asset-usages"]

  - priority: 30
    category: capability
    rule: "client_attendance == REMOTE and MixStage.supports_remote_review == false"
    error_id: ERR_STAGE_NO_REMOTE_REVIEW
    http_status: 422
    applies_to: ["POST /mix-bookings", "POST /mix-bookings/{id}/client-signoff"]

  - priority: 31
    category: temporal
    rule: "window_end_utc <= window_start_utc"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: ["POST /mix-bookings", "POST /adr-sessions"]

  - priority: 32
    category: temporal
    rule: "window_end_utc > Project.delivery_deadline_utc"
    error_id: ERR_WINDOW_AFTER_DEADLINE
    http_status: 422
    applies_to: ["POST /mix-bookings", "POST /adr-sessions"]

  - priority: 33
    category: temporal_overlap
    rule: |
      The requested [window_start_utc, window_end_utc) plus the stage's changeover buffer overlaps
      an existing booking on the same mix_stage_id whose status IS IN
      {RESERVED, CONFIRMED, IN_PROGRESS, COMPLETED}. Half-open comparison: a new window that
      starts exactly at (existing window_end_utc + MixStage.changeover_minutes) does NOT conflict.
      Bookings in RELEASED or SUPERSEDED status — including a booking superseded by THIS request
      (§1.2.1 booking-create-stale-project) — are excluded from the occupancy set.
    error_id: ERR_STAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /mix-bookings"]

  - priority: 34
    category: temporal_overlap
    rule: |
      The requested [window_start_utc, window_end_utc) strictly overlaps an existing AdrSession on
      the same voice_talent_id whose status IS IN {PROPOSED, CONFIRMED, RECORDED}. Adjacency is
      allowed: a session starting exactly at another's window_end_utc does NOT conflict (no buffer
      for talent). CANCELLED and NO_SHOW sessions are excluded from the overlap set.
    error_id: ERR_TALENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /adr-sessions"]

  - priority: 35
    category: aggregate
    rule: |
      sum(billable_minutes) over the talent's AdrSessions with status IN
      {PROPOSED, CONFIRMED, RECORDED, NO_SHOW} whose window_start_utc falls on the same UTC
      calendar day, plus this request's billable_minutes, exceeds VoiceTalent.daily_cap_minutes.
      Note the cap set INCLUDES NO_SHOW (the day was consumed) while the overlap set at
      priority 34 does not.
    error_id: ERR_TALENT_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: ["POST /adr-sessions"]

  - priority: 36
    category: aggregate
    rule: |
      sum(reserved_hours) over the mixer's MixStageBookings with status IN
      {CONFIRMED, IN_PROGRESS, COMPLETED} whose window_start_utc falls on the same UTC calendar
      day, plus this booking's reserved_hours, exceeds Mixer.max_daily_hours.
    error_id: ERR_MIXER_DAILY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /mix-bookings/{id}/confirm"]

  - priority: 37
    category: temporal
    rule: "the logical clock is already at or past MixStageBooking.window_end_utc"
    error_id: ERR_WINDOW_ELAPSED
    http_status: 409
    applies_to: ["POST /mix-bookings/{id}/start"]

  - priority: 38
    category: emptiness
    rule: "the StemPackage has zero MusicCues with status == ACTIVE"
    error_id: ERR_EMPTY_STEM_SET
    http_status: 422
    applies_to: ["POST /stem-packages/{id}/conform"]

  - priority: 39
    category: limit
    rule: "lines_recorded > AdrSession.lines_scheduled"
    error_id: ERR_ADR_LINES_EXCEEDED
    http_status: 422
    applies_to: ["POST /adr-sessions/{id}/record"]

  - priority: 40
    category: aggregate
    rule: "the project has zero Deliverables with status == DELIVERED"
    error_id: ERR_NO_DELIVERED_DELIVERABLE
    http_status: 409
    applies_to: ["POST /projects/{id}/archive-packages"]

  - priority: 41
    category: aggregate
    rule: "the project still has at least one Deliverable with status IN {PREPARED, QC_SUBMITTED, QC_REJECTED, REMEDIATION, QC_PASSED}"
    error_id: ERR_DELIVERABLE_STILL_OPEN
    http_status: 409
    applies_to: ["POST /projects/{id}/archive-packages"]

  - priority: 42
    category: fiscal
    rule: |
      reserved_hours for the requested booking exceeds Project.stage_hours_available computed AFTER
      excluding any booking superseded by this request (§1.2.1 booking-create-stale-project).
    error_id: ERR_STAGE_HOURS_EXCEEDED
    http_status: 409
    applies_to: ["POST /mix-bookings"]
    note: "Deliberately ordered AFTER the capability check at priority 24."

  - priority: 43
    category: idempotency
    rule: "an ArchivePackage already exists for this project"
    error_id: ERR_ALREADY_ARCHIVED
    http_status: 409
    applies_to: ["POST /projects/{id}/archive-packages"]

  - priority: 44
    category: idempotency
    rule: "MixStageBooking.client_signoff_at_utc is already set"
    error_id: ERR_ALREADY_SIGNED_OFF
    http_status: 409
    applies_to: ["POST /mix-bookings/{id}/client-signoff"]

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# api_prefix is "/" — every collection is a flat top-level segment and every
# path parameter is written {id} (the id of the collection's own resource).
# All responses use the §1.0 envelope; `output:` names the payload under `data`.
# List endpoints return the paginated envelope (items/total_count/has_more).
# -----------------------------------------------------------------------------
endpoints:

  # ---- logical clock (test-driving namespace) -------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock. The clock's startup default is exactly
      2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that
      instant and MUST NOT fall back to real wall-clock time. Every deadline, expiry,
      window and "now" comparison in this API reads the logical clock.
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator, ClientReviewer]
    code: 200
    input: ["current_utc"]
    output: { current_utc: string }
    side_effects:
      - "the logical clock is set to current_utc; no entity is mutated and no derived field is recomputed"
  - method: GET
    path: "/_clock"
    description: "Reads the logical clock. Returns 2026-08-01T00:00:00Z when it has never been set."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator, ClientReviewer]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

  # ---- platform specs ------------------------------------------------------
  - method: POST
    path: "/platform-specs"
    description: "Registers an immutable delivery specification for a platform (theatrical, broadcast, streaming or international)."
    roles: [FacilityAdmin]
    code: 201
    input: ["platform", "spec_label", "target_lufs", "tolerance_lu", "true_peak_max_dbtp", "channel_layout", "requires_me_stems", "max_remediation_rounds?", "qc_turnaround_hours?"]
    output: PlatformSpec
    side_effects:
      - "max_remediation_rounds defaults to 2 and qc_turnaround_hours to 24 when omitted"
      - "the spec is immutable: no update endpoint exists and no version field is exposed"
  - method: GET
    path: "/platform-specs/{id}"
    description: "Reads one platform specification."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: []
    output: PlatformSpec
    side_effects: []

  # ---- mix stages ----------------------------------------------------------
  - method: POST
    path: "/mix-stages"
    description: "Registers a mix stage (room) with its hourly rate, remote-review capability and changeover buffer."
    roles: [FacilityAdmin]
    code: 201
    input: ["room_code", "display_name", "hourly_rate_cents", "supports_remote_review", "changeover_minutes?"]
    output: MixStage
    side_effects: ["changeover_minutes defaults to 45 when omitted"]
  - method: GET
    path: "/mix-stages/{id}"
    description: "Reads one mix stage."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: []
    output: MixStage
    side_effects: []

  # ---- mixers --------------------------------------------------------------
  - method: POST
    path: "/mixers"
    description: "Registers a re-recording mixer. The returned id is the Mixer's X-User-ID for every Mixer-role call."
    roles: [FacilityAdmin]
    code: 201
    input: ["full_name", "certified_platforms", "max_daily_hours?"]
    output: Mixer
    side_effects: ["max_daily_hours defaults to 10.00 when omitted"]
  - method: GET
    path: "/mixers/{id}"
    description: "Reads one mixer."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: []
    output: Mixer
    side_effects: []

  # ---- voice talent --------------------------------------------------------
  - method: POST
    path: "/voice-talents"
    description: "Registers ADR voice talent with union status, daily cap and minimum call."
    roles: [FacilityAdmin]
    code: 201
    input: ["full_name", "union_status", "daily_cap_minutes?", "min_call_minutes?"]
    output: VoiceTalent
    side_effects: ["daily_cap_minutes defaults to 240 and min_call_minutes to 60 when omitted"]
  - method: GET
    path: "/voice-talents/{id}"
    description: "Reads one voice talent record."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: []
    output: VoiceTalent
    side_effects: []

  # ---- library assets ------------------------------------------------------
  - method: POST
    path: "/library-assets"
    description: "Registers a sound-library or licensed-music asset with its licence type, territory scope, fee and optional expiry."
    roles: [FacilityAdmin]
    code: 201
    input: ["asset_code", "kind", "license_type", "territory_scope", "fee_cents", "expires_at_utc?"]
    output: LibraryAsset
    side_effects: ["status is set to ACTIVE; revocation_reason is null"]
  - method: GET
    path: "/library-assets/{id}"
    description: "Reads one library asset."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: []
    output: LibraryAsset
    side_effects: []
  - method: GET
    path: "/library-assets"
    description: "Lists library assets, newest first by created_at, with optional status filter."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: ["status?", "license_type?", "limit?", "offset?"]
    output: LibraryAsset[]
    side_effects: []
  - method: POST
    path: "/library-assets/{id}/revoke"
    description: "Revokes a library asset and cascades the licence withdrawal through usages, stem packages, deliverables and bookings (§1.2 LibraryAsset ACTIVE -> REVOKED)."
    roles: [FacilityAdmin]
    code: 200
    input: ["revocation_reason"]
    output: LibraryAsset
    side_effects:
      - "status = REVOKED; increments LibraryAsset.version by 1"
      - "every CLEARED AssetUsage of this asset -> UNLICENSED with accrued_fee_cents = 0 and unlicensed_reason = ASSET_REVOKED"
      - "every CONFORMED StemPackage holding such a usage -> STALE with stale_reason = LICENSE_REVOKED"
      - "shared rule R-STALE hops B and C: the affected non-terminal Deliverables -> INVALIDATED and their RESERVED/CONFIRMED MixStageBookings -> RELEASED"
      - "affected Projects: license_fee_accrued_cents, unlicensed_usage_count, stale_stem_count, license_risk_score_intake, license_risk_score_audit, stage_hours_reserved, stage_hours_available, stage_cost_subtotal_cents, billing_total_cents and posture recomputed"

  # ---- projects ------------------------------------------------------------
  - method: POST
    path: "/projects"
    description: "Creates a post-production project at INTAKE with picture NOT_LOCKED."
    roles: [FacilityAdmin, PostSupervisor]
    code: 201
    input: ["title", "client_name", "client_user_id", "delivery_deadline_utc", "turnaround_class?", "stage_hours_authorized?"]
    output: Project
    side_effects:
      - "turnaround_class defaults to STANDARD; stage_hours_authorized defaults to 40.00"
      - "picture_status = NOT_LOCKED, pipeline_stage = INTAKE, posture = OPEN"
      - "stage_hours_reserved = 0.00, stage_hours_consumed = 0.00, stage_hours_available = stage_hours_authorized"
      - "all money and score ledgers initialise to 0 / 0.00"
  - method: GET
    path: "/projects/{id}"
    description: "Reads one project including its derived posture, ledgers and version (the OCC token for POST /mix-bookings and POST /deliverables)."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator, ClientReviewer]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "Lists projects, newest first by created_at, with optional pipeline_stage and posture filters."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: ["pipeline_stage?", "posture?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/picture-lock"
    description: "Declares picture lock (or re-locks after a broken lock) — §1.2 Project.picture_status NOT_LOCKED -> LOCKED and LOCK_BROKEN -> LOCKED."
    roles: [PostSupervisor]
    code: 200
    input: ["picture_lock_note?"]
    output: Project
    side_effects:
      - "picture_status = LOCKED; picture_locked_at_utc = logical clock now; picture_lock_revision += 1"
      - "pipeline_stage advances INTAKE -> EDITORIAL on the first lock only"
      - "posture recomputed by calculations.project_posture"
      - "increments Project.version by 1"
  - method: POST
    path: "/projects/{id}/break-picture-lock"
    description: "Breaks picture lock after a new cut arrives — §1.2 Project.picture_status LOCKED -> LOCK_BROKEN, the depth-4 invalidation cascade."
    roles: [PostSupervisor]
    code: 200
    input: ["break_reason"]
    output: Project
    side_effects:
      - "picture_status = LOCK_BROKEN; posture = FROZEN; increments Project.version by 1"
      - "every CONFORMED StemPackage of this project -> STALE with stale_reason = PICTURE_LOCK_BROKEN"
      - "shared rule R-STALE hop B: their non-terminal Deliverables -> INVALIDATED (invalidation_reason = STEM_STALE)"
      - "shared rule R-STALE hop C: those deliverables' RESERVED/CONFIRMED MixStageBookings -> RELEASED with release_reason = 'DELIVERABLE_INVALIDATED'"
      - "stale_stem_count, conformed_stem_count, stage_hours_reserved, stage_hours_available, stage_cost_subtotal_cents and billing_total_cents recomputed"
      - "pipeline_stage is NOT regressed"
  - method: GET
    path: "/projects/{id}/ledger"
    description: "Computed read: the project's stage-hour ledger, the pinned billing roll-up steps and both licence-risk variants."
    roles: [FacilityAdmin, PostSupervisor, ClientReviewer]
    code: 200
    input: []
    output:
      stage_hours_authorized: number
      stage_hours_reserved: number
      stage_hours_consumed: number
      stage_hours_available: number
      stage_cost_subtotal_cents: integer
      adr_cost_cents: integer
      conform_fee_total_cents: integer
      license_fee_accrued_cents: integer
      pre_discount_total_cents: integer
      volume_discount_cents: integer
      discounted_base_cents: integer
      rush_surcharge_cents: integer
      billing_total_cents: integer
      license_risk_score_intake: number
      license_risk_score_audit: number
      unlicensed_usage_count: integer
      stale_stem_count: integer
      conformed_stem_count: integer
      posture: string
      pipeline_stage: string
      picture_status: string
    side_effects: []
  - method: POST
    path: "/projects/{id}/archive-packages"
    description: "Seals the project: creates the immutable ArchivePackage of session files and stems and drives pipeline_stage DELIVERED -> ARCHIVED."
    roles: [PostSupervisor]
    code: 201
    input: ["session_file_count", "retention_years?"]
    output: ArchivePackage
    side_effects:
      - "retention_years defaults to 10; sealed_at_utc = logical clock now; sealed_by_user_id = X-User-ID"
      - "stem_manifest_count and archived_stem_package_ids (ordered by StemPackage.created_at ASC) pinned from the project's CONFORMED stem packages, which all transition to RETIRED"
      - "delivered_deliverable_count pinned from the project's DELIVERED deliverables"
      - "Project.pipeline_stage = ARCHIVED; increments Project.version by 1; all later child writes fail with ERR_PROJECT_ARCHIVED"
  - method: GET
    path: "/projects/{id}/archive-packages"
    description: "Sub-resource list: the archive package(s) sealed for this project (array of 0 or 1)."
    roles: [FacilityAdmin, PostSupervisor, QcOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ArchivePackage[]
    side_effects: []

  # ---- stem packages and music cues ---------------------------------------
  - method: POST
    path: "/stem-packages"
    description: "Creates a DRAFT stem package (one reel) for a project."
    roles: [SoundEditor, PostSupervisor]
    code: 201
    input: ["project_id", "reel_label", "stem_layout", "includes_me_stems?"]
    output: StemPackage
    side_effects:
      - "status = DRAFT, conform_round = 0, cue_count = 0, total_stem_minutes = 0.00, conform_fee_cents = 0, stale_reason = null"
      - "includes_me_stems defaults to false"
  - method: GET
    path: "/stem-packages/{id}"
    description: "Reads one stem package including its version (the OCC token for cue creation)."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: []
    output: StemPackage
    side_effects: []
  - method: GET
    path: "/stem-packages"
    description: "Filtered list of stem packages, newest first by created_at."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: StemPackage[]
    side_effects: []
  - method: POST
    path: "/stem-packages/{id}/music-cues"
    description: "Adds (or revises) a music cue on a stem package. Guarded by OCC rule cue-create-stale-stem-package (§1.2.1)."
    roles: [SoundEditor]
    code: 201
    input: ["expected_stem_package_version", "cue_number", "duration_seconds", "source", "composer_delivery_ref?"]
    output: MusicCue
    side_effects:
      - "increments StemPackage.version by 1"
      - "any ACTIVE MusicCue on this package with the same cue_number -> SUPERSEDED"
      - "when the package's status == CONFORMED it -> STALE with stale_reason = CUE_REVISED, firing shared rule R-STALE hops B and C"
      - "Project.stale_stem_count, conformed_stem_count, posture, stage ledger and billing_total_cents recomputed when the package went STALE"
  - method: GET
    path: "/stem-packages/{id}/music-cues"
    description: "Sub-resource list: the cues of one stem package, ordered by cue_number ASC then created_at ASC."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MusicCue[]
    side_effects: []
  - method: POST
    path: "/stem-packages/{id}/conform"
    description: "Conforms (or re-conforms) the stem package against the locked picture — §1.2 StemPackage DRAFT|STALE -> CONFORMED."
    roles: [SoundEditor]
    code: 200
    input: []
    output: StemPackage
    side_effects:
      - "cue_count, total_stem_minutes and conform_fee_cents pinned per calculations.stem_conform_totals (per-cue rounding, then summation)"
      - "status = CONFORMED, conform_round += 1, conformed_at_utc = logical clock now, stale_reason = null"
      - "Project.conformed_stem_count / stale_stem_count / posture / conform-fee component of billing_total_cents recomputed"
      - "pipeline_stage advances EDITORIAL -> PREMIX when conformed_stem_count goes 0 -> 1"
      - "increments Project.version by 1"

  # ---- asset usages --------------------------------------------------------
  - method: POST
    path: "/asset-usages"
    description: "Records use of a library or licensed asset inside a stem package and clears it (or flags it unlicensed) per calculations.asset_usage_clearance."
    roles: [SoundEditor]
    code: 201
    input: ["library_asset_id", "stem_package_id", "usage_seconds", "territory_declared"]
    output: AssetUsage
    side_effects:
      - "clearance_status, cleared_at_utc, unlicensed_reason and accrued_fee_cents pinned per calculations.asset_usage_clearance"
      - "Project.license_fee_accrued_cents, unlicensed_usage_count, license_risk_score_intake, license_risk_score_audit, billing_total_cents and posture recomputed"
      - "increments Project.version by 1"
  - method: GET
    path: "/asset-usages/{id}"
    description: "Reads one asset usage."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: []
    output: AssetUsage
    side_effects: []
  - method: GET
    path: "/asset-usages"
    description: "Filtered list of asset usages, newest first by created_at."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: ["library_asset_id?", "stem_package_id?", "clearance_status?", "limit?", "offset?"]
    output: AssetUsage[]
    side_effects: []

  # ---- ADR sessions --------------------------------------------------------
  - method: POST
    path: "/adr-sessions"
    description: "Schedules an ADR session with talent against a picture-locked project."
    roles: [SoundEditor, PostSupervisor]
    code: 201
    input: ["project_id", "voice_talent_id", "window_start_utc", "window_end_utc", "lines_scheduled"]
    output: AdrSession
    side_effects:
      - "status = PROPOSED, lines_recorded = 0, cancellation_reason = null"
      - "scheduled_minutes, billable_minutes and session_cost_cents pinned per calculations.adr_session_cost"
      - "no project ledger change yet: a PROPOSED session contributes 0 to adr_cost_cents"
  - method: GET
    path: "/adr-sessions/{id}"
    description: "Reads one ADR session."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: []
    output: AdrSession
    side_effects: []
  - method: GET
    path: "/adr-sessions"
    description: "Filtered list of ADR sessions, newest first by created_at."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, QcOperator]
    code: 200
    input: ["project_id?", "voice_talent_id?", "status?", "limit?", "offset?"]
    output: AdrSession[]
    side_effects: []
  - method: POST
    path: "/adr-sessions/{id}/confirm"
    description: "Confirms a proposed ADR session — §1.2 AdrSession PROPOSED -> CONFIRMED."
    roles: [SoundEditor]
    code: 200
    input: []
    output: AdrSession
    side_effects:
      - "status = CONFIRMED"
      - "Project.adr_cost_cents and billing_total_cents recomputed (this session's session_cost_cents enters the set)"
      - "increments Project.version by 1"
  - method: POST
    path: "/adr-sessions/{id}/record"
    description: "Records the session's line count — §1.2 AdrSession CONFIRMED -> RECORDED."
    roles: [SoundEditor]
    code: 200
    input: ["lines_recorded"]
    output: AdrSession
    side_effects:
      - "status = RECORDED; lines_recorded stored"
      - "Project.adr_cost_cents unchanged (already counted at CONFIRMED)"
  - method: POST
    path: "/adr-sessions/{id}/cancel"
    description: "Cancels a session, or marks talent no-show — §1.2 AdrSession -> CANCELLED | NO_SHOW depending on cancellation_reason."
    roles: [SoundEditor, PostSupervisor]
    code: 200
    input: ["cancellation_reason"]
    output: AdrSession
    side_effects:
      - "cancellation_reason CLIENT_REQUEST|SCHEDULE_CONFLICT -> status = CANCELLED and the session leaves adr_cost_cents, the talent overlap set and the talent daily-cap set"
      - "cancellation_reason TALENT_NO_SHOW -> status = NO_SHOW; session_cost_cents STAYS in adr_cost_cents and the session STAYS in the talent daily-cap set while leaving the overlap set"
      - "Project.adr_cost_cents and billing_total_cents recomputed; increments Project.version by 1"

  # ---- mix stage bookings --------------------------------------------------
  - method: POST
    path: "/mix-bookings"
    description: "Reserves a mix stage with a mixer for a premix, final mix or printmaster. Guarded by OCC rule booking-create-stale-project (§1.2.1)."
    roles: [PostSupervisor]
    code: 201
    input: ["expected_project_version", "project_id", "mix_stage_id", "mixer_id", "booking_type", "platform", "window_start_utc", "window_end_utc", "client_attendance?"]
    output: MixStageBooking
    side_effects:
      - "increments Project.version by 1"
      - "any non-terminal MixStageBooking of the same (project_id, booking_type) -> SUPERSEDED; it is excluded from this request's stage-overlap (priority 33) and stage-hours (priority 42) checks"
      - "status = RESERVED; client_attendance defaults to NONE; reserved_hours and provisional_cost_cents pinned per calculations.stage_booking_cost variant PROVISIONAL"
      - "Project.stage_hours_reserved, stage_hours_available, stage_cost_subtotal_cents and billing_total_cents recomputed"
  - method: GET
    path: "/mix-bookings/{id}"
    description: "Reads one mix stage booking."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator, ClientReviewer]
    code: 200
    input: []
    output: MixStageBooking
    side_effects: []
  - method: GET
    path: "/mix-bookings"
    description: "Filtered list of mix stage bookings, newest first by created_at."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: ["project_id?", "mix_stage_id?", "mixer_id?", "status?", "limit?", "offset?"]
    output: MixStageBooking[]
    side_effects: []
  - method: POST
    path: "/mix-bookings/{id}/confirm"
    description: "The assigned mixer accepts the booking — §1.2 MixStageBooking RESERVED -> CONFIRMED."
    roles: [Mixer]
    code: 200
    input: []
    output: MixStageBooking
    side_effects:
      - "status = CONFIRMED"
      - "pipeline_stage advances PREMIX -> FINAL_MIX when booking_type == FINAL_MIX; increments Project.version by 1"
  - method: POST
    path: "/mix-bookings/{id}/start"
    description: "The assigned mixer opens the stage — §1.2 MixStageBooking CONFIRMED -> IN_PROGRESS."
    roles: [Mixer]
    code: 200
    input: []
    output: MixStageBooking
    side_effects: ["status = IN_PROGRESS; actual_start_utc = logical clock now"]
  - method: POST
    path: "/mix-bookings/{id}/complete"
    description: "The assigned mixer closes the stage — §1.2 MixStageBooking IN_PROGRESS -> COMPLETED, pinning the FINAL cost variant."
    roles: [Mixer]
    code: 200
    input: []
    output: MixStageBooking
    side_effects:
      - "status = COMPLETED; actual_end_utc = logical clock now"
      - "billable_hours_final, overtime_hours and final_cost_cents pinned per calculations.stage_booking_cost variant FINAL"
      - "hours move from Project.stage_hours_reserved to Project.stage_hours_consumed; stage_hours_available recomputed"
      - "Project.stage_cost_subtotal_cents and billing_total_cents recomputed (provisional replaced by final)"
      - "pipeline_stage advances FINAL_MIX -> QC when booking_type == FINAL_MIX; increments Project.version by 1"
  - method: POST
    path: "/mix-bookings/{id}/client-signoff"
    description: "The project's client records remote-review sign-off. Field mutation only; the booking's status does not change."
    roles: [ClientReviewer]
    code: 200
    input: []
    output: MixStageBooking
    side_effects: ["client_signoff_at_utc = logical clock now; a second sign-off is rejected with ERR_ALREADY_SIGNED_OFF"]
  - method: POST
    path: "/mix-bookings/{id}/release"
    description: "Releases a reserved or confirmed stage slot — §1.2 MixStageBooking RESERVED|CONFIRMED -> RELEASED (compensating ledger reversal)."
    roles: [PostSupervisor]
    code: 200
    input: ["release_reason"]
    output: MixStageBooking
    side_effects:
      - "status = RELEASED; release_reason stored"
      - "reserved_hours leave Project.stage_hours_reserved; stage_hours_available returns to exactly its pre-create value"
      - "provisional_cost_cents leaves Project.stage_cost_subtotal_cents; billing_total_cents recomputed"
      - "the booking leaves the stage occupancy set, freeing the window for a new reservation"
      - "increments Project.version by 1"

  # ---- deliverables and QC -------------------------------------------------
  - method: POST
    path: "/deliverables"
    description: "Prepares a deliverable for one platform spec from a conformed stem package and a completed mix. Guarded by OCC rule deliverable-create-stale-project (§1.2.1)."
    roles: [PostSupervisor]
    code: 201
    input: ["expected_project_version", "project_id", "platform_spec_id", "stem_package_id", "mix_booking_id"]
    output: Deliverable
    side_effects:
      - "increments Project.version by 1"
      - "any non-terminal Deliverable of the same (project_id, platform_spec_id) -> SUPERSEDED"
      - "status = PREPARED, remediation_round = 0, qc_rejection_codes = [], prepared_by_user_id = X-User-ID (the segregation-of-duties anchor)"
      - "measured_integrated_lufs, measured_true_peak_dbtp, deviation_lu and me_stems_present are null until qc-submit"
  - method: GET
    path: "/deliverables/{id}"
    description: "Reads one deliverable."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator, ClientReviewer]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/deliverables"
    description: "Filtered list of deliverables, newest first by created_at."
    roles: [FacilityAdmin, PostSupervisor, SoundEditor, Mixer, QcOperator]
    code: 200
    input: ["project_id?", "platform_spec_id?", "stem_package_id?", "mix_booking_id?", "status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: "/deliverables/{id}/qc-submit"
    description: "Submits measured loudness for QC — §1.2 Deliverable PREPARED|REMEDIATION -> QC_SUBMITTED."
    roles: [QcOperator]
    code: 200
    input: ["measured_integrated_lufs", "measured_true_peak_dbtp", "me_stems_present"]
    output: Deliverable
    side_effects:
      - "status = QC_SUBMITTED; measurements stored; deviation_lu recomputed per calculations.loudness_qc_verdict"
      - "the acting X-User-ID is remembered as the round's submitter for the priority-23 segregation check at qc-evaluate"
  - method: POST
    path: "/deliverables/{id}/qc-evaluate"
    description: "Evaluates the submitted measurements against the platform spec and appends the immutable QcReport — §1.2 Deliverable QC_SUBMITTED -> QC_PASSED | QC_REJECTED."
    roles: [QcOperator]
    code: 201
    input: []
    output: QcReport
    side_effects:
      - "an append-only QcReport is created with round = Deliverable.remediation_round, verdict, ordered rejection_codes, both measurements, target_lufs, deviation_lu, submitted_by_user_id, evaluated_by_user_id = X-User-ID and evaluated_at_utc = logical clock now"
      - "the deliverable moves to QC_PASSED when rejection_codes == [], else to QC_REJECTED with qc_rejection_codes set to the same ordered list"
  - method: GET
    path: "/deliverables/{id}/qc-reports"
    description: "Sub-resource list: every QC round recorded for this deliverable, ordered by round ASC then created_at ASC."
    roles: [FacilityAdmin, PostSupervisor, QcOperator, ClientReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: QcReport[]
    side_effects: []
  - method: POST
    path: "/deliverables/{id}/remediate"
    description: "Opens a remediation round after a QC rejection — §1.2 Deliverable QC_REJECTED -> REMEDIATION."
    roles: [PostSupervisor]
    code: 200
    input: ["remediation_note?"]
    output: Deliverable
    side_effects: ["status = REMEDIATION; remediation_round += 1; qc_rejection_codes = []"]
  - method: POST
    path: "/deliverables/{id}/deliver"
    description: "Delivers a passed deliverable to the platform — §1.2 Deliverable QC_PASSED -> DELIVERED."
    roles: [PostSupervisor]
    code: 200
    input: ["delivery_reference"]
    output: Deliverable
    side_effects:
      - "status = DELIVERED; delivery_reference stored; delivered_at_utc = logical clock now"
      - "pipeline_stage advances QC -> DELIVERED for the first delivered deliverable"
      - "increments Project.version by 1"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog — every code is triggerable by at least one §1.5 endpoint.
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent or empty on any business endpoint"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role absent, unknown, or not listed in the endpoint's roles"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "/projects/{id} does not resolve to a Project"
  - id: ERR_STEM_PACKAGE_NOT_FOUND
    http: 404
    condition: "/stem-packages/{id} does not resolve to a StemPackage"
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "/deliverables/{id} does not resolve to a Deliverable"
  - id: ERR_MIX_BOOKING_NOT_FOUND
    http: 404
    condition: "/mix-bookings/{id} does not resolve to a MixStageBooking"
  - id: ERR_ADR_SESSION_NOT_FOUND
    http: 404
    condition: "/adr-sessions/{id} does not resolve to an AdrSession"
  - id: ERR_LIBRARY_ASSET_NOT_FOUND
    http: 404
    condition: "/library-assets/{id} does not resolve to a LibraryAsset"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a foreign key in the request body (project_id, stem_package_id, library_asset_id, voice_talent_id, mix_stage_id, mixer_id, platform_spec_id, mix_booking_id) does not resolve"
  - id: ERR_NOT_ASSIGNED_MIXER
    http: 403
    condition: "a Mixer acts on a booking whose mixer_id is a different mixer"
  - id: ERR_NOT_PROJECT_CLIENT
    http: 403
    condition: "a ClientReviewer acts on a project (or a booking's project) whose client_user_id is a different user"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing/null required field, wrong type, unknown enum member, negative quantity, or malformed ISO-8601 instant"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative / non-integer"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version != Project.version on POST /mix-bookings or POST /deliverables"
  - id: ERR_STALE_STEM_PACKAGE_VERSION
    http: 412
    condition: "expected_stem_package_version != StemPackage.version on POST /stem-packages/{id}/music-cues"
  - id: ERR_PROJECT_FROZEN
    http: 409
    condition: "posture == FROZEN on any child write, or posture == RESTRICTED on qc-submit / qc-evaluate / deliver / archive"
  - id: ERR_PROJECT_ARCHIVED
    http: 409
    condition: "any write beneath a project whose pipeline_stage == ARCHIVED"
  - id: ERR_PICTURE_NOT_LOCKED
    http: 409
    condition: "picture_status != LOCKED on ADR scheduling/confirmation, booking creation or deliverable creation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the entity's current status has no §1.2 transition for the requested trigger"
  - id: ERR_STEM_NOT_CONFORMED
    http: 409
    condition: "the referenced StemPackage.status != CONFORMED on deliverable create, qc-submit or deliver"
  - id: ERR_BOOKING_NOT_COMPLETED
    http: 409
    condition: "the deliverable's MixStageBooking.status != COMPLETED at qc-submit"
  - id: ERR_CLIENT_SIGNOFF_REQUIRED
    http: 409
    condition: "completing a booking with client_attendance == REMOTE and client_signoff_at_utc null"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the QC actor equals the deliverable's prepared_by_user_id, or the evaluator equals the round's submitted_by_user_id"
  - id: ERR_MIXER_NOT_CERTIFIED
    http: 422
    condition: "the booking's platform is not in Mixer.certified_platforms"
  - id: ERR_UNLICENSED_MATERIAL_PRESENT
    http: 409
    condition: "Project.unlicensed_usage_count >= 1 at deliverable creation (POST /deliverables)"
  - id: ERR_LICENSE_RISK_TOO_HIGH
    http: 409
    condition: "Project.license_risk_score_audit >= 50.00 at deliver"
  - id: ERR_REMEDIATION_LIMIT_EXCEEDED
    http: 409
    condition: "remediation_round already equals PlatformSpec.max_remediation_rounds"
  - id: ERR_SPEC_PLATFORM_MISMATCH
    http: 422
    condition: "PlatformSpec.platform != MixStageBooking.platform at deliverable create"
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 422
    condition: "a referenced stem package or booking belongs to another project"
  - id: ERR_STAGE_NO_REMOTE_REVIEW
    http: 422
    condition: "client_attendance == REMOTE on a stage whose supports_remote_review == false"
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "window_end_utc <= window_start_utc"
  - id: ERR_WINDOW_AFTER_DEADLINE
    http: 422
    condition: "window_end_utc > Project.delivery_deadline_utc"
  - id: ERR_STAGE_WINDOW_CONFLICT
    http: 409
    condition: "the requested stage window plus the changeover buffer overlaps an occupying booking on the same stage"
  - id: ERR_TALENT_WINDOW_CONFLICT
    http: 409
    condition: "the requested ADR window strictly overlaps a PROPOSED/CONFIRMED/RECORDED session of the same talent"
  - id: ERR_TALENT_DAILY_CAP_EXCEEDED
    http: 409
    condition: "the talent's same-UTC-day billable_minutes (including NO_SHOW sessions) would exceed daily_cap_minutes"
  - id: ERR_MIXER_DAILY_LIMIT_EXCEEDED
    http: 409
    condition: "the mixer's same-UTC-day reserved_hours would exceed max_daily_hours at confirm"
  - id: ERR_WINDOW_ELAPSED
    http: 409
    condition: "the logical clock is at or past window_end_utc at booking start"
  - id: ERR_EMPTY_STEM_SET
    http: 422
    condition: "conforming a stem package with zero ACTIVE music cues"
  - id: ERR_ADR_LINES_EXCEEDED
    http: 422
    condition: "lines_recorded > lines_scheduled at record"
  - id: ERR_NO_DELIVERED_DELIVERABLE
    http: 409
    condition: "archiving a project with zero DELIVERED deliverables"
  - id: ERR_DELIVERABLE_STILL_OPEN
    http: 409
    condition: "archiving a project that still has a non-terminal deliverable"
  - id: ERR_STAGE_HOURS_EXCEEDED
    http: 409
    condition: "reserved_hours exceed Project.stage_hours_available"
  - id: ERR_ALREADY_ARCHIVED
    http: 409
    condition: "an ArchivePackage already exists for the project"
  - id: ERR_ALREADY_SIGNED_OFF
    http: 409
    condition: "client_signoff_at_utc is already set on the booking"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties (with peer ownership)
# -----------------------------------------------------------------------------
roles:
  - name: FacilityAdmin
    description: "Facility operations: registers platform specs, stages, mixers, talent and library assets, and revokes licences."
    identity: "opaque"
    exclusive_operations:
      - "POST /platform-specs"
      - "POST /mix-stages"
      - "POST /mixers"
      - "POST /voice-talents"
      - "POST /library-assets"
      - "POST /library-assets/{id}/revoke"
    shared_operations:
      - "POST /projects (with PostSupervisor)"
      - "every registry and business GET except GET /projects/{id}/ledger's client view"
      - "POST /_clock/set_current_utc and GET /_clock"
  - name: PostSupervisor
    description: "Owns the project timeline: picture lock, stem packages, mix bookings, deliverable preparation, remediation, delivery and archival."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/picture-lock"
      - "POST /projects/{id}/break-picture-lock"
      - "POST /projects/{id}/archive-packages"
      - "POST /mix-bookings"
      - "POST /mix-bookings/{id}/release"
      - "POST /deliverables"
      - "POST /deliverables/{id}/remediate"
      - "POST /deliverables/{id}/deliver"
    shared_operations:
      - "POST /projects (with FacilityAdmin)"
      - "POST /stem-packages (with SoundEditor)"
      - "POST /adr-sessions and POST /adr-sessions/{id}/cancel (with SoundEditor)"
      - "GET /projects/{id}/ledger (with FacilityAdmin and the project's ClientReviewer)"
      - "every business GET"
    notes:
      - "Cannot perform QC: qc-submit and qc-evaluate are QcOperator-exclusive, and the deliverable's preparer is additionally barred by validation priority 23."
  - name: SoundEditor
    description: "Dialogue editing, sound design, library usage, cue conforming and ADR session handling."
    identity: "opaque"
    exclusive_operations:
      - "POST /stem-packages/{id}/music-cues"
      - "POST /stem-packages/{id}/conform"
      - "POST /asset-usages"
      - "POST /adr-sessions/{id}/confirm"
      - "POST /adr-sessions/{id}/record"
    shared_operations:
      - "POST /stem-packages (with PostSupervisor)"
      - "POST /adr-sessions and POST /adr-sessions/{id}/cancel (with PostSupervisor)"
      - "every business GET except GET /projects/{id}/ledger and GET /deliverables/{id}/qc-reports"
  - name: Mixer
    description: "The re-recording mixer assigned to a stage booking; accepts, opens and closes their own bookings."
    identity: "entity_backed:Mixer"
    exclusive_operations:
      - "POST /mix-bookings/{id}/confirm"
      - "POST /mix-bookings/{id}/start"
      - "POST /mix-bookings/{id}/complete"
    shared_operations:
      - "GET /projects/{id}, GET /stem-packages, GET /stem-packages/{id}, GET /stem-packages/{id}/music-cues, GET /mix-bookings, GET /mix-bookings/{id}, GET /deliverables, GET /deliverables/{id}"
    ownership_rule: "X-User-ID MUST equal MixStageBooking.mixer_id (the id returned by POST /mixers); otherwise ERR_NOT_ASSIGNED_MIXER (priority 10)."
  - name: QcOperator
    description: "Quality control against platform delivery specifications; submits measurements and evaluates rounds."
    identity: "opaque"
    exclusive_operations:
      - "POST /deliverables/{id}/qc-submit"
      - "POST /deliverables/{id}/qc-evaluate"
    shared_operations:
      - "GET /deliverables/{id}/qc-reports (with FacilityAdmin, PostSupervisor and the project's ClientReviewer)"
      - "every business GET except GET /projects/{id}/ledger"
    notes:
      - "Segregation of duties: the QC actor's X-User-ID must differ from Deliverable.prepared_by_user_id, and an evaluator must differ from the round's submitter (priority 23)."
  - name: ClientReviewer
    description: "The client-side reviewer named on the project; attends remotely and signs off remote reviews."
    identity: "opaque"
    exclusive_operations:
      - "POST /mix-bookings/{id}/client-signoff"
    shared_operations:
      - "GET /projects/{id}, GET /projects/{id}/ledger, GET /mix-bookings/{id}, GET /deliverables/{id}, GET /deliverables/{id}/qc-reports"
    ownership_rule: "X-User-ID MUST equal Project.client_user_id (an opaque identifier stored on the project, never an entity id); otherwise ERR_NOT_PROJECT_CLIENT (priority 11)."
