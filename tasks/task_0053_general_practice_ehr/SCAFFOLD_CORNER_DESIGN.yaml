scaffold_corner_design:

  # ===================================================================
  # Entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /patients with first_name/last_name/date_of_birth/sex returns 201 with status==ACTIVE, pcp_id==null, lifetime_charges_cents==0, version==1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { first_name: "New", last_name: "Patient", date_of_birth: "1990-04-04", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          assert:
            - "HTTP 201; Patient.status == ACTIVE; pcp_id == null; lifetime_charges_cents == 0; version == 1"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Patient
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /patients/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"

      - name: create_patient_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.date_of_birth
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST /patients omitting date_of_birth returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { first_name: "No", last_name: "Dob", sex: "M" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"
        # NOTE: trigger path is the real POST /patients; suffix in name marks negative intent.

      - name: create_provider_default_specialty_applied
        claim_type: Defaults
        grounds: [entities.Provider.fields.specialty]
        distinguishing_aspect: "POST /providers omitting specialty applies default FAMILY_MEDICINE; epcs_enrolled defaults false; panel_capacity defaults 2000."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { npi: "2000000001", full_name: "Default Doc" }
              as: FrontDesk
              captures: { prov_id: $.data.id, spec: $.data.specialty }
          assert:
            - "Provider.specialty == FAMILY_MEDICINE; epcs_enrolled == false; panel_capacity == 2000; status == ACTIVE"

      - name: charge_line_amount_input_ignored_computed
        claim_type: Computed Fields
        grounds: [entities.ChargeLine.fields.amount_cents, calculations.charge_line_amount]
        distinguishing_aspect: "ChargeLine.amount_cents is computed (base 5000 * 1.0 * units 2 = 10000); even though amount_cents is not an input field, the server-computed value is returned, not anything client-supplied."
        test_recipe:
          setup: ["Visit IN_PROGRESS; CptCode VAC01 base_fee_cents=5000 requires_em_level=false"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000002", full_name: "Dr Q", specialty: "PEDIATRICS" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "C", last_name: "F", date_of_birth: "2020-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /cpt-codes"
              payload: { code: "VAC01", short_description: "Vaccine admin", category: "VACCINE_ADMIN", base_fee_cents: 5000 }
              as: Biller
              captures: { cpt_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T08:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${visit_id}/charge-lines"
              payload: { cpt_code: "VAC01", units: 2 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { amt: $.data.amount_cents }
          assert:
            - "ChargeLine.amount_cents == 10000 (5000 * 1.0 * 2)"

      - name: cpt_code_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.CptCode]
        distinguishing_aspect: "CptCode has common_fields:false: it exposes id and created_at but no version/updated_at, and there is no update or transition endpoint for it."
        test_recipe:
          setup: ["One CptCode created"]
          setup_api_calls:
            - call: "POST /cpt-codes"
              payload: { code: "IMM01", short_description: "Immutable code", category: "PROCEDURE", base_fee_cents: 3000 }
              as: Biller
              captures: { cpt_id: $.data.id }
          trigger:
            - call: "GET /cpt-codes/${cpt_id}"
              payload: {}
              as: Biller
              captures: { code_val: $.data.code }
          assert:
            - "GET returns code IMM01 with id and created_at present; no version field; no mutation endpoint exists for CptCode"

      - name: create_provider_invalid_specialty_enum_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.Provider.fields.specialty
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /providers with specialty not in {FAMILY_MEDICINE, INTERNAL_MEDICINE, PEDIATRICS} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { npi: "2000000003", full_name: "Bad Spec", specialty: "SURGERY" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"

      - name: create_visit_unknown_patient_fk_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Visit.fields.patient_id
          - errors[ERR_REFERENCE_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "POST /visits with a non-existent patient_id returns ERR_REFERENCE_NOT_FOUND (404) — body FK existence check."
        test_recipe:
          setup: ["A provider exists; patient_id is a non-existent UUID"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000004", full_name: "Dr R", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "00000000-0000-4000-8000-000000000001", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_REFERENCE_NOT_FOUND"

  # ===================================================================
  # State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: visit_initial_state_is_scheduled
        claim_type: Initial State
        grounds: [state_machines.Visit, entities.Visit.fields.status]
        distinguishing_aspect: "A newly created Visit starts in SCHEDULED with billed_total_cents 0 and version 1."
        test_recipe:
          setup: ["Provider and Patient exist"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000010", full_name: "Dr S", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Init", last_name: "Visit", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FrontDesk
              captures: { st: $.data.status }
          assert:
            - "Visit.status == SCHEDULED; billed_total_cents == 0; version == 1"

      - name: visit_start_from_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Visit.CHECKED_IN_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /visits/{id}/start while the visit is still SCHEDULED (not CHECKED_IN) returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["Visit SCHEDULED (never checked in)"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000011", full_name: "Dr T", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Bad", last_name: "Start", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE; visit still SCHEDULED"

      - name: visit_cancel_then_cancel_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After a Visit is CANCELLED (terminal), a second cancel returns ERR_INVALID_STATE (409); no transitions leave CANCELLED."
        test_recipe:
          setup: ["Visit CANCELLED"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000012", full_name: "Dr U", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { first_name: "Term", last_name: "Cancel", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "CONSULTATION", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z" }
              as: FrontDesk
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /visits/${visit_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE on second cancel"

      - name: portal_active_suspend_reinstate_cycle
        claim_type: cyclic
        grounds: [state_machines.PortalAccount.ACTIVE_to_SUSPENDED, state_machines.PortalAccount.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "PortalAccount cycles ACTIVE->SUSPENDED->ACTIVE; after reinstate the status is ACTIVE again and failed_login_count is 0."
        test_recipe:
          setup: ["PortalAccount ACTIVE for a patient"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { first_name: "Portal", last_name: "Cycle", date_of_birth: "1980-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /portal-accounts"
              payload: { patient_id: "${pat_id}", login_email: "cycle@example.com" }
              as: FrontDesk
              captures: { pa_id: $.data.id, tok: $.data.activation_token }
            - call: "POST /portal-accounts/${pa_id}/activate"
              payload: { activation_token: "${tok}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /portal-accounts/${pa_id}/suspend"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /portal-accounts/${pa_id}/reinstate"
              payload: {}
              as: FrontDesk
              captures: { st: $.data.status }
          assert:
            - "PortalAccount.status == ACTIVE after reinstate; failed_login_count == 0"

      - name: portal_wrong_token_auto_suspends_at_threshold
        claim_type: Side Effect Execution
        grounds: [state_machines.PortalAccount.INVITED_to_SUSPENDED, entities.PortalAccount.fields.failed_login_count]
        distinguishing_aspect: "Three wrong-token activation attempts push failed_login_count to PORTAL_LOCKOUT_THRESHOLD (3) and auto-SUSPEND the INVITED account on the third attempt."
        test_recipe:
          setup: ["PortalAccount INVITED for a patient"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { first_name: "Lock", last_name: "Out", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /portal-accounts"
              payload: { patient_id: "${pat_id}", login_email: "lock@example.com" }
              as: FrontDesk
              captures: { pa_id: $.data.id }
            - call: "POST /portal-accounts/${pa_id}/activate"
              payload: { activation_token: "WRONG-1" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /portal-accounts/${pa_id}/activate"
              payload: { activation_token: "WRONG-2" }
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /portal-accounts/${pa_id}/activate"
              payload: { activation_token: "WRONG-3" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { st: $.data.status }
          assert:
            - "After third wrong token, PortalAccount.status == SUSPENDED; failed_login_count == 3"

      - name: referral_authorize_idempotency_second_call_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Referral.REQUESTED_to_AUTHORIZED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Authorizing an already-AUTHORIZED referral a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Referral AUTHORIZED (patient has bound PCP)"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000013", full_name: "Dr V", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
            - call: "POST /patients"
              payload: { first_name: "Ref", last_name: "Idem", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat_id}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_id: "${prov_id}", target_specialty: "DERMATOLOGY", priority: "ROUTINE" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/authorize"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /referrals/${ref_id}/authorize"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_INVALID_STATE on second authorize"

      - name: provider_deactivate_unbinds_panel_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Provider.ACTIVE_to_INACTIVE, entities.Patient.fields.pcp_id]
        distinguishing_aspect: "Deactivating a Provider clears pcp_id on every bound Patient and recomputes panel_size to 0."
        test_recipe:
          setup: ["Provider ACTIVE with one bound patient (panel_size 1)"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "2000000014", full_name: "Dr W", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
            - call: "POST /patients"
              payload: { first_name: "Bound", last_name: "Pat", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat_id}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
          trigger:
            - call: "POST /providers/${prov_id}/deactivate"
              payload: {}
              as: FrontDesk
              captures: { size: $.data.panel_size }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: FrontDesk
              captures: { pcp: $.data.pcp_id }
          assert:
            - "Provider.panel_size == 0 after deactivate; Patient.pcp_id == null"

      - name: referral_schedule_after_window_expired
        claim_type: guarded transitions
        grounds:
          - state_machines.Referral.AUTHORIZED_to_SCHEDULED
          - errors[ERR_REFERRAL_EXPIRED]
          - validations[priority=15]
        distinguishing_aspect: "Scheduling a ROUTINE referral authorized at 2026-06-01 after the clock advances past 2026-08-30 expiry returns ERR_REFERRAL_EXPIRED (409)."
        test_recipe:
          setup: ["Referral AUTHORIZED at 2026-06-01 (expiry 2026-08-30); clock advanced to 2026-09-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { npi: "2000000015", full_name: "Dr X", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
            - call: "POST /patients"
              payload: { first_name: "Exp", last_name: "Ref", date_of_birth: "1980-01-01", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers/${prov_id}/panel"
              payload: { patient_id: "${pat_id}", expected_provider_version: "${prov_v}" }
              as: FrontDesk
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_id: "${prov_id}", target_specialty: "ORTHOPEDICS", priority: "ROUTINE" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/authorize"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FrontDesk
          trigger:
            - call: "POST /referrals/${ref_id}/schedule"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_REFERRAL_EXPIRED"

      - name: prescription_sign_state_beats_epcs_dup
        claim_type: Invalid Transitions
        grounds: [state_machines.Prescription.PENDING_SIGNATURE_to_SIGNED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sign_state_beats_epcs_safety
          rationale: "Signing from a non-PENDING_SIGNATURE state returning ERR_INVALID_STATE is the asserted outcome of the named §1.8 priority-conflict instance."

  # ===================================================================
  # Calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: hedis_eligibility_age_below_window_excluded
        claim_type: Constants Applied
        grounds: [calculations.hedis_eligibility, entities.HedisMeasure.fields.eligible]
        distinguishing_aspect: "BCS_MAMMOGRAM eligibility window is 50-74 inclusive; a female aged 49 at Dec 31 2026 (DOB 1977-01-01) is NOT eligible, so eligible==false and the row does not enter the denominator."
        test_recipe:
          setup: ["Female patient DOB 1977-01-01 (age 49 at Dec 31 2026)"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { first_name: "Young", last_name: "F", date_of_birth: "1977-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /hedis-measures"
              payload: { patient_id: "${pat_id}", measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "ADMINISTRATIVE" }
              as: QualityAnalyst
              captures: { elig: $.data.eligible }
          assert:
            - "HedisMeasure.eligible == false (age 49 below min_age 50)"

      - name: hedis_eligibility_age_at_max_boundary_eligible
        claim_type: Correct Result
        grounds: [calculations.hedis_eligibility]
        distinguishing_aspect: "Age exactly 74 at Dec 31 2026 (DOB 1952-01-01) is eligible for BCS_MAMMOGRAM (max_age 74 inclusive); eligible==true."
        test_recipe:
          setup: ["Female patient DOB 1952-01-01 (age 74 at Dec 31 2026)"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { first_name: "Edge", last_name: "F", date_of_birth: "1952-01-01", sex: "F" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /hedis-measures"
              payload: { patient_id: "${pat_id}", measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "ADMINISTRATIVE" }
              as: QualityAnalyst
              captures: { elig: $.data.eligible }
          assert:
            - "HedisMeasure.eligible == true (age 74 == max_age 74, inclusive)"

      - name: bcs_mammogram_male_sex_ineligible
        claim_type: Input Set Filtering
        grounds: [calculations.hedis_eligibility, entities.Patient.fields.sex]
        distinguishing_aspect: "BCS_MAMMOGRAM requires sex==F; a male patient aged 60 is ineligible (sex_ok false) regardless of age window."
        test_recipe:
          setup: ["Male patient DOB 1966-03-10 (age 60)"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { first_name: "Male", last_name: "Sixty", date_of_birth: "1966-03-10", sex: "M" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /hedis-measures"
              payload: { patient_id: "${pat_id}", measure_type: "BCS_MAMMOGRAM", measurement_year: 2026, method: "ADMINISTRATIVE" }
              as: QualityAnalyst
              captures: { elig: $.data.eligible }
          assert:
            - "HedisMeasure.eligible == false (male excluded from BCS_MAMMOGRAM)"

      - name: referral_auth_window_urgent_vs_routine
        claim_type: Constants Applied
        grounds: [calculations.referral_auth_window, entities.Referral.fields.priority]
        distinguishing_aspect: "URGENT priority sets authorization_expires_at = authorize_time + 14 days (2026-06-15) vs ROUTINE 90 days; here URGENT authorized at 2026-06-01 yields expiry 2026-06-15T00:00:00Z."
        test_recipe:
          setup: ["URGENT referral for a PCP-bound patient, authorized at 2026-06-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { npi: "2000000020", full_name: "Dr Y", specialty: "FAMILY_MEDICINE" }
              as: FrontDesk
              captures: { prov_id: $.data.id, prov_v: $.data.version }
