              captures: { b_expiry: $.data.expiry_date, b_months: $.data.assigned_shelf_life_months, b_basis: $.data.shelf_life_basis, b_study: $.data.shelf_life_basis_study_id, b_fill: $.data.fill_completed_at }
            - call: "POST /reagent-lots/${rla_id}/disposition"
              payload: { decision: "RELEASE", shelf_life_basis: "CLAIM" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { a_expiry: $.data.expiry_date, a_months: $.data.assigned_shelf_life_months, a_fill: $.data.fill_completed_at, a_dist: $.data.distribution_status }
          assert:
            - "lot CA-LOT-7B carries fill_completed_at 2026-08-28T10:30:00.000Z and expiry_date 2027-02-28T10:30:00.000Z — six calendar months later, day of month preserved"
            - "lot CA-LOT-7A carries fill_completed_at 2026-08-31T10:30:00.000Z and expiry_date 2027-02-28T10:30:00.000Z as well, because 2027-02-31 does not exist and the day of month clamps to the end of the shorter month"
            - "both expiry instants keep the 10:30:00 wall time and are serialised with exactly three fractional digits; the shelf life is NOT 6 x 30 days, which would have produced 2027-02-24 and 2027-02-27 instead"
            - "assigned_shelf_life_months is 6 on both lots, shelf_life_basis is CLAIM and shelf_life_basis_study_id is null, since the CLAIM variant reads the product specification and never touches a stability study"
            - "the RELEASE also flips distribution_status from WITHHELD to AVAILABLE on both lots"

      - name: reagent_lot_release_bias_aggregation_across_three_release_tests
        claim_type: Correct Result
        grounds:
          - calculations.lot_release_reference_bias
        excluded_because:
          difficulty_instance: release_bias_rounding_order_pinned_per_test_then_sum
          rationale: "That §1.8 instance already records three ACTIVITY/CALIBRATION_SLOPE/PRECISION results of 101.004 against a reference of 100.0 and pins release_bias_max_pct to 1.00 and release_bias_sum_pct to 3.00, proving the per-test rounding happens before the summation. A separate correct-result corner would repeat the identical fixture."

      - name: fefo_allocation_draw_order_and_shortfall
        claim_type: Correct Result
        grounds:
          - calculations.fefo_allocation
        excluded_because:
          difficulty_instance: fefo_waterfall_four_phase_order_with_filtered_earliest_lot
          rationale: "The §1.8 instance already walks all four pinned phases with four candidate lots at remaining_days 118, 120, 122 and 179 against a floor of 120 days, drawing 100 + 200 + 200 of a 500-unit request, so it covers first-bucket-before-second, the filtered earliest lot and the remainder in one fixture."

      - name: material_lot_acceptance_weighted_score_present_set_denominator
        claim_type: Correct Result
        grounds:
          - calculations.material_lot_acceptance_decision
        excluded_because:
          difficulty_instance: acceptance_score_present_set_denominator_and_zero_subscore_veto
          rationale: "That §1.8 instance already derives 91.60 from a partial test set, showing the weights are renormalised over the PRESENT subscores rather than over all four, and it also covers the zero-subscore veto that overrides an otherwise passing score."

      - name: material_lot_acceptance_score_threshold_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.material_lot_acceptance_decision
        excluded_because:
          difficulty_instance: acceptance_score_inclusive_at_exactly_85_00_and_unrounded_subscores_at_84_88
          rationale: "ACCEPTANCE_SCORE_MIN 85.0 is already probed at exactly 85.00 (QUALIFY) and at 84.88 (REJECT) there, including the claim that the comparison uses the unrounded subscores; duplicating it here would add no distinct failure mode."

      - name: environmental_state_derivation_from_monitoring_samples
        claim_type: Correct Result
        grounds:
          - calculations.environmental_state
        excluded_because:
          difficulty_instance: environmental_limit_equality_conforming_double_limit_major_and_third_minor_disqualifies
          rationale: "That §1.8 instance already covers every branch of the derivation: equality at the limit is CONFORMING, a value at twice the limit is a MAJOR excursion, and the third MINOR excursion tips environmental_state to DISQUALIFIED."

      - name: stability_shelf_life_two_variants_on_the_same_data
        claim_type: Variant Divergence
        grounds:
          - calculations.stability_shelf_life
        excluded_because:
          difficulty_instance: stability_shelf_life_real_time_versus_accelerated_divergence
          rationale: "The §1.8 instance already runs both declared variants over the same product and asserts the divergent outputs 9 months (REAL_TIME_LAST_CONFORMING) versus floor(2 * 2 ** 3.2) == 18 months (ACCELERATED_Q10), which is exactly the Variant Divergence claim."

      - name: material_lot_acceptance_variant_selected_by_specification_mode
        claim_type: Variant Selection
        grounds:
          - calculations.material_lot_acceptance_decision
        excluded_because:
          difficulty_instance: material_acceptance_all_pass_versus_weighted_score_divergence
          rationale: "That §1.8 instance already qualifies one lot and rejects an identically-tested lot purely because their specifications declare acceptance_mode WEIGHTED_SCORE versus ALL_PASS, which is the Variant Selection claim for this rule."

      - name: material_quantity_conservation_after_a_returned_component
        claim_type: Correct Result
        grounds:
          - calculations.material_quantity_conservation
        excluded_because:
          difficulty_instance: fill_run_abort_restores_material_quantity_conservation_over_two_cycles
          rationale: "The §1.8 compensating-invariant instance already replays consume-abort-consume over two cycles and asserts received == available + consumed at every step, including the RETURNED rows being excluded from consumed_quantity_units without being deleted."

      - name: reagent_lot_unit_conservation_after_allocation_changes
        claim_type: Correct Result
        grounds:
          - calculations.reagent_lot_unit_conservation
        excluded_because:
          difficulty_instance: allocation_cancel_restores_reagent_lot_unit_conservation_with_replay
          rationale: "The §1.8 compensating-invariant instance already reconciles filled == available + allocated + shipped + quarantined across allocate, cancel and re-allocate, so a standalone correct-result corner would repeat that ledger walk verbatim."

  # ===========================================================================
  - section: validations
    instances:

      - name: priority_10_unauthenticated_wins_over_role_existence_and_body_checks
        claim_type: Priority Ordering
        grounds:
          - validations.priority_10_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 10 is the outermost gate: a single request that is unauthenticated AND aimed at a role-restricted endpoint AND pointed at a non-existent id AND carrying an unparseable body must still answer 401 and nothing else. Frameworks that validate the body or resolve the path id before the auth filter leak 400 or 404 here."
        test_recipe:
          setup:
            - "No fixtures at all: every call below is rejected before any row is read."
          setup_api_calls: []
          trigger:
            - call: "POST /material-lots"
              payload: { material_specification_id: "00000000-0000-0000-0000-0000000000b1", vendor_lot_code: "V-CA-8", received_quantity_units: -5.0, expiry_date: "2027-01-01T00:00:00Z" }
              as: ""
              as_user_id: ""
              captures: { err_post: $.data.error_id, msg_post: $.data.message }
            - call: "GET /material-lots/00000000-0000-0000-0000-0000000000b1"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { err_get: $.data.error_id }
            - call: "POST /reagent-lots/00000000-0000-0000-0000-0000000000b2/disposition"
              payload: { decision: "RELEASE", shelf_life_basis: "CLAIM" }
              as: "QAReleaser"
              as_user_id: ""
              captures: { err_no_user: $.data.error_id }
            - call: "GET /reagent-lots"
              payload: {}
              as: ""
              as_user_id: "qa-01"
              captures: { err_no_role: $.data.error_id }
          assert:
            - "the write with a missing role header, a non-existent foreign key and a negative received_quantity_units returns HTTP 401 ERR_UNAUTHENTICATED — not 400 and not 404"
            - "a plain GET on a non-existent id with no headers also returns 401, so priority 10 precedes the priority 40 path-existence check"
            - "an empty X-User-ID with a valid X-User-Role returns 401, and an empty X-User-Role with a valid X-User-ID returns 401: the rule demands BOTH headers present and non-empty"
            - "every 401 body carries the standard error envelope with data.error_id and a non-empty data.message"

      - name: priority_20_forbidden_role_wins_over_not_found_and_invalid_request
        claim_type: Priority Ordering
        grounds:
          - validations.priority_20_ERR_FORBIDDEN_ROLE
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Priority 20 sits between authentication and body validation, so an authenticated caller with the wrong role must be told 403 even when the body is invalid (priority 30) and the path id does not exist (priority 40). It also covers the second half of the rule: a role string that is not one of the six declared roles is a 403, not a 401 and not a 400."
        test_recipe:
          setup:
            - "No fixtures: every call is rejected on the role check before any row is read."
          setup_api_calls: []
          trigger:
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CA-9", material_type: "NOT_A_TYPE", potency_min_pct: 110.0, potency_max_pct: 90.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_role_over_body: $.data.error_id }
            - call: "POST /material-lots/00000000-0000-0000-0000-0000000000b3/disposition"
              payload: { decision: "QUALIFY" }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { err_role_over_404: $.data.error_id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "00000000-0000-0000-0000-0000000000b4", lot_code: "CA-LOT-9", planned_units: 10 }
              as: "Auditor"
              as_user_id: "au-01"
              captures: { err_undeclared_role: $.data.error_id }
          assert:
            - "a QCAnalyst creating a material specification gets HTTP 403 ERR_FORBIDDEN_ROLE even though the body carries an undeclared material_type and potency_min_pct > potency_max_pct, so priority 20 precedes priority 30"
            - "a DistributionPlanner dispositioning a non-existent material lot gets 403, not 404, so priority 20 precedes priority 40"
            - "an X-User-Role of Auditor, which is not one of the six declared roles, gets 403 ERR_FORBIDDEN_ROLE — the header is present and non-empty, so it is not a 401"

      - name: priority_30_invalid_request_wins_over_foreign_key_existence
        claim_type: Priority Ordering
        grounds:
          - validations.priority_30_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Every numeric and ordering bound named by priority 30 is checked BEFORE the priority 45 body-foreign-key lookup, so a request that violates a bound and names a non-existent parent must answer 400. The instance walks the bounds that are easiest to leave out: the strict quantity bounds, the two interval orderings, and the planned_timepoints_months shape rule that must start at 0 and strictly increase."
        test_recipe:
          setup:
            - "No fixtures: every foreign key below is deliberately a non-existent UUID, and the bound violation must be reported first."
          setup_api_calls: []
          trigger:
            - call: "POST /material-lots"
              payload: { material_specification_id: "00000000-0000-0000-0000-0000000000b5", vendor_lot_code: "V-CA-10", received_quantity_units: 0.0, expiry_date: "2027-01-01T00:00:00Z" }
              as: ProductionOperator
              captures: { err_qty: $.data.error_id }
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CA-10", material_type: "ENZYME", potency_min_pct: 110.0, potency_max_pct: 90.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_potency: $.data.error_id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "00000000-0000-0000-0000-0000000000b6", line_code: "LINE-CA10", formulation_batch_code: "FB-CA10", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T06:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { err_window: $.data.error_id }
            - call: "POST /stability-studies"
              payload: { product_specification_id: "00000000-0000-0000-0000-0000000000b7", reagent_lot_id: "00000000-0000-0000-0000-0000000000b8", study_type: "REAL_TIME", chamber_code: "CH-CA10", storage_temp_c: 5.0, protocol_start: "2026-08-20T00:00:00Z", protocol_end: "2027-08-20T00:00:00Z", planned_timepoints_months: [3, 6, 6], baseline_value: 100.0 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_timepoints: $.data.error_id }
            - call: "POST /distribution-orders"
              payload: { product_specification_id: "00000000-0000-0000-0000-0000000000b9", customer_code: "CUST-CA10", requested_units: 0, required_min_shelf_life_days: -1, ship_by: "2026-12-01T00:00:00Z" }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { err_order: $.data.error_id }
          assert:
            - "received_quantity_units 0.0 returns HTTP 400 ERR_INVALID_REQUEST — the bound is strictly greater than zero — and the non-existent material_specification_id is never reported"
            - "potency_min_pct 110.0 with potency_max_pct 90.0 returns 400: the ordering bound is strict, so equal values are rejected too"
            - "scheduled_end before scheduled_start returns 400 rather than the non-existent reagent lot's 404"
            - "planned_timepoints_months [3, 6, 6] returns 400 on two counts: it does not start at 0 and it is not strictly increasing"
            - "requested_units 0 and required_min_shelf_life_days -1 return 400; the shelf-life floor bound is >= 0 while the unit bound is > 0, so 0 is legal for one field and illegal for the other"

      - name: priority_35_subject_field_mismatch_rejects_each_wrong_test_result_shape
        claim_type: Violation → Error
        grounds:
          - validations.priority_35_ERR_SUBJECT_FIELD_MISMATCH
          - errors.ERR_SUBJECT_FIELD_MISMATCH
        distinguishing_aspect: "TestResult is one table serving three subjects, so the shape rule is both positive (the subject's own ids are required) and negative (the other subjects' ids are forbidden). A permissive implementation that only checks the required half silently accepts a MATERIAL_LOT row carrying a reagent_lot_id and then mis-files it. Priority 35 also precedes existence, so fake ids must not turn these into 404s."
        test_recipe:
          setup:
            - "No fixtures: every subject id below is a non-existent UUID, because priority 35 is evaluated before priorities 40 and 45."
          setup_api_calls: []
          trigger:
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "00000000-0000-0000-0000-0000000000c1", reagent_lot_id: "00000000-0000-0000-0000-0000000000c2", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_extra_lot: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "00000000-0000-0000-0000-0000000000c1", test_code: "POTENCY", measured_value: 100.0, reference_measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_extra_ref: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "REAGENT_LOT", reagent_lot_id: "00000000-0000-0000-0000-0000000000c2", test_code: "ACTIVITY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_missing_ref: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "00000000-0000-0000-0000-0000000000c3", test_code: "ACTIVITY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_missing_month: $.data.error_id }
            - call: "POST /test-results"
              payload: { subject_type: "STABILITY_TIMEPOINT", stability_study_id: "00000000-0000-0000-0000-0000000000c3", month_index: 0, test_code: "ACTIVITY", measured_value: 100.0, material_lot_id: "00000000-0000-0000-0000-0000000000c1" }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_cross_subject: $.data.error_id }
          assert:
            - "a MATERIAL_LOT result carrying a reagent_lot_id returns HTTP 400 ERR_SUBJECT_FIELD_MISMATCH, even though the forbidden field is a well-formed UUID"
            - "a MATERIAL_LOT result carrying reference_measured_value returns 400: the reference comparison belongs to REAGENT_LOT results only"
            - "a REAGENT_LOT result without reference_measured_value returns 400, because the bias calculation has no divisor without it"
            - "a STABILITY_TIMEPOINT result without month_index returns 400, and one that also carries material_lot_id returns 400"
            - "all five answers are 400 rather than 404, so priority 35 is evaluated before the priority 40 and 45 existence checks"

      - name: priority_50_segregation_of_duties_blocks_the_tester_from_releasing_and_the_author_from_approving
        claim_type: Violation → Error
        grounds:
          - validations.priority_50_ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The rule compares X-User-ID values, not roles, so it can only be caught by a fixture where the SAME user id appears in two compatible roles. Priority 50 also sits ahead of every business gate: the release attempt below is blocked on segregation while the product is still uncleared, and switching to a different user id surfaces the priority 130 clearance error instead — proving the ordering rather than the mere existence of both rules."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z. ProductSpecification IVD-CA-11 left in clearance_status DESIGN on purpose."
            - "One QUALIFIED material lot of the non-critical specification AB-CA-11, and one FILLED ReagentLot CA-LOT-11 whose single ACTIVITY release result was performed by user qa-01."
            - "One DRAFT DesignControlRecord authored by user ra-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CA-11", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-CA-11", received_quantity_units: 500.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-CA-11", reference_material_code: "REF-CA11", required_material_codes: ["AB-CA-11"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id, ps_v1: $.data.version }
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "DESIGN_INPUT", document_ref: "DHF-IN-CA11", expected_product_specification_version: "${ps_v1}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { dcr_id: $.data.id, author: $.data.authored_by_user_id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "CA-LOT-11", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_id: $.data.id, rl_v: $.data.version }
            - call: "POST /reagent-lots/${rl_id}/components"
              payload: { material_lot_id: "${ml_id}", component_role: "ANTIBODY", quantity_used: 200.0, expected_reagent_lot_version: "${rl_v}" }
              as: ProductionOperator
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-CA11", formulation_batch_code: "FB-CA11", scheduled_start: "2026-08-20T06:00:00Z", scheduled_end: "2026-08-20T10:00:00Z", planned_fill_units: 100 }
              as: ProductionOperator
              captures: { fr_id: $.data.id }
            - call: "POST /fill-runs/${fr_id}/samples"
              payload: { sample_type: "BIOBURDEN_BULK", location_code: "BULK-TANK-1", result_value: 2.0, sampled_at: "2026-08-20T07:00:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /fill-runs/${fr_id}/start"
              payload: {}
              as: ProductionOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fill-runs/${fr_id}/complete"
              payload: { filled_units: 100 }
              as: ProductionOperator
            - call: "POST /test-results"
              payload: { subject_type: "REAGENT_LOT", reagent_lot_id: "${rl_id}", test_code: "ACTIVITY", measured_value: 100.0, reference_measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qa-01"
              captures: { performer: $.data.performed_by_user_id }
          trigger:
            - call: "POST /reagent-lots/${rl_id}/disposition"
              payload: { decision: "RELEASE", shelf_life_basis: "CLAIM" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_sod: $.data.error_id }
            - call: "POST /reagent-lots/${rl_id}/disposition"
              payload: { decision: "RELEASE", shelf_life_basis: "CLAIM" }
              as: QAReleaser
              as_user_id: "qa-02"
              captures: { err_next_gate: $.data.error_id }
            - call: "POST /design-control-records/${dcr_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "ra-01"
              captures: { err_author: $.data.error_id }
            - call: "POST /design-control-records/${dcr_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { approved_status: $.data.status, approver: $.data.approved_by_user_id }
          assert:
            - "the ACTIVITY release result stores performed_by_user_id qa-01, recorded under the QCAnalyst role — the rule keys on the user id, not the role"
            - "releasing as user qa-01 returns HTTP 403 ERR_SEGREGATION_OF_DUTIES, because that user performed a REAGENT_LOT test on the lot"
            - "releasing as user qa-02 gets past priority 50 and now returns HTTP 409 ERR_PRODUCT_NOT_CLEARED, which proves priority 50 was evaluated ahead of the priority 130 clearance gate"
            - "approving the design record as its author ra-01 returns 403 ERR_SEGREGATION_OF_DUTIES"
            - "approving the same record as qa-01 succeeds with status APPROVED and approved_by_user_id qa-01"

      - name: priority_70_duplicate_business_keys_are_rejected_in_their_declared_scopes
        claim_type: Violation → Error
        grounds:
          - validations.priority_70
          - errors.ERR_DUPLICATE_MATERIAL_CODE
          - errors.ERR_DUPLICATE_PRODUCT_CODE
          - errors.ERR_DUPLICATE_VENDOR_LOT
          - errors.ERR_DUPLICATE_LOT_CODE
        distinguishing_aspect: "Two of the four keys are GLOBAL (material_code, product_code) and two are SCOPED to a parent (vendor_lot_code per specification, lot_code per product). The instance therefore proves both halves: the same vendor_lot_code under a different specification and the same lot_code under a different product must both be accepted, which a global unique index would wrongly reject."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z. Two MaterialSpecifications AB-CA-12 and AB-CA-12B, two ProductSpecifications IVD-CA-12 and IVD-CA-12B, one MaterialLot V-CA-12 under AB-CA-12 and one ReagentLot CA-LOT-12 under IVD-CA-12."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
