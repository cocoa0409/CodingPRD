            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 1 }, as: QALead }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 15 }
              as: VendorManager
              captures: { a1: $.data.id }
          trigger:
            - call: "GET /qa-cert/vendors/${vid}"
              as: Any
              captures: { c1: $.data.committed_hours_current_week, av1: $.data.available_hours_current_week }
            - { call: "POST /qa-cert/assignments/${a1}/transition", payload: { to_status: "CANCELLED" }, as: VendorManager }
            - call: "GET /qa-cert/vendors/${vid}"
              as: Any
              captures: { c2: $.data.committed_hours_current_week, av2: $.data.available_hours_current_week }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 20 }
              as: VendorManager
              captures: { a2: $.data.id }
            - { call: "POST /qa-cert/assignments/${a2}/transition", payload: { to_status: "IN_PROGRESS" }, as: VendorManager }
            - { call: "POST /qa-cert/assignments/${a2}/transition", payload: { to_status: "DONE", actual_hours: 18 }, as: VendorManager }
            - call: "GET /qa-cert/vendors/${vid}"
              as: Any
              captures: { c3: $.data.committed_hours_current_week, av3: $.data.available_hours_current_week }
          assert:
            - "after create 15h: committed == 15, available == 25 (sum 40)"
            - "after cancel: committed == 0, available == 40 — forward + compensating action leaves the bucket unchanged"
            - "after create 20h + complete (DONE frees the reservation): committed == 0, available == 40 (sum 40)"
            - "no drift across the full cycle: committed + available == 40 at every checkpoint"

      - name: cert_budget_submit_decide_withdraw_conservation
        grounds:
          - calculations.cert_budget_ledger
          - calculations.submission_fee
          - state_machines.SubmissionPackage
          - entities.GameTitle.fields.cert_budget_escrow_cents
        distinguishing_aspect: |
          Conserved quantity = title cert-budget CENTS across the submit (available
          -> escrow), decide-REJECTED (escrow -> spent), resubmit (escrow again) and
          withdraw (escrow -> available at 100%) sequence: available + escrow + spent
          == 1000000 at every checkpoint with the exact literals pinned. Different
          conserved quantity from vendor_hours_cancel_conservation (hours).
        test_recipe:
          setup:
            - "Title T (PS5), budget 1000000, IN_DEVELOPMENT; plan APPROVED->LOCKED; build B1 CANDIDATE; ESRB GRANTED (spent 40000)"
            - "Clock Monday 2026-08-03T10:00:00Z for all submits (weekday)"
            - "PKG1 round 1 (fee 120000); PKG2 round 2 on the same still-CANDIDATE build (fee 60000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "INV-BGT", name: "Inv Bgt", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorM", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
