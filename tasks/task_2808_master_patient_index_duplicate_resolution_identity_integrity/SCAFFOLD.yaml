# =============================================================================
# 1.7 RBAC Table
#     role_model: segregation_of_duties — the same X-User-ID may not both
#     recommend and approve the resolution of a candidate pair.
# =============================================================================
roles:

  - role: SiteRegistrar
    identity: "entity_backed:RegistrationSite — X-User-ID is the id of the RegistrationSite the registrar desk belongs to. Every write is scoped to that site (§1.4 priority 3)."
    description: "Front-desk registration clerk. Can search the index and create records at its own site only, and must cite a fresh non-blocking search attempt to do so."
    exclusive_operations: []
    shared_operations:
      - "POST /mpi/registration-sites/{id}/search-attempts (shared with IdentityAnalyst; site-scoped)"
      - "POST /mpi/patient-records (shared with IdentityAnalyst; site-scoped and search-attempt-gated)"
      - "All GET endpoints"
    cannot:
      - "Create or rescore candidate pairs, attach evidence, recommend, approve, merge, unmerge, correct overlays, remediate contamination, open investigations, submit external matches, or run metrics."

  - role: IdentityAnalyst
    identity: "opaque — X-User-ID is an arbitrary analyst identifier, tracked so segregation of duties can be enforced against approvals."
    description: "Identity integrity analyst. Owns the detection and manual-review half of the workflow."
    exclusive_operations:
      - "POST /mpi/candidate-pairs/{id}/triage"
      - "POST /mpi/candidate-pairs/{id}/start-review"
      - "POST /mpi/candidate-pairs/{id}/evidence"
      - "POST /mpi/candidate-pairs/{id}/recommend"
      - "POST /mpi/external-match-requests"
    shared_operations:
      - "POST /mpi/candidate-pairs and POST /mpi/candidate-pairs/{id}/rescore (shared with MpiAdmin)"
      - "POST /mpi/overlay-corrections (shared with IdentityStewardApprover)"
      - "POST /mpi/contamination-remediations/{id}/quarantine (shared with PrivacyOfficer)"
      - "POST /mpi/propagation-tasks/{id}/send and POST /mpi/registration-sites/{id}/duplicate-metric-runs (shared with MpiAdmin)"
      - "POST /mpi/registration-sites/{id}/search-attempts and POST /mpi/patient-records (shared with SiteRegistrar; not site-scoped for this role)"
      - "All GET endpoints"
    cannot:
      - "Approve a merge, unmerge, resolve a pair as distinct, return a recommendation to review, apply or complete an overlay, reassign or close a remediation, open or adjudicate a fraud investigation, or configure sites, rule sets and downstream systems."

  - role: IdentityStewardApprover
    identity: "opaque — X-User-ID is the approver identifier compared against pair.recommended_by_user_id for the segregation-of-duties check."
    description: "Data steward with approval authority over identity-changing operations."
    exclusive_operations:
      - "POST /mpi/candidate-pairs/{id}/return-to-review"
      - "POST /mpi/candidate-pairs/{id}/resolve-distinct"
      - "POST /mpi/merge-operations"
      - "POST /mpi/overlay-corrections/{id}/apply"
      - "POST /mpi/overlay-corrections/{id}/complete"
    shared_operations:
      - "POST /mpi/merge-operations/{id}/unmerge (shared with MpiAdmin)"
      - "POST /mpi/overlay-corrections (shared with IdentityAnalyst)"
      - "All GET endpoints"
    cannot:
      - "Triage, start review, attach evidence or recommend (that is the analyst half of the duty split); create or rescore pairs; adjudicate fraud; quarantine, reassign or close remediations; configure sites, rule sets or downstream systems."

  - role: PrivacyOfficer
    identity: "opaque — X-User-ID is the privacy officer identifier recorded on investigations they open."
    description: "Privacy and identity-fraud officer. Owns fraud adjudication and clinical cross-contamination remediation."
    exclusive_operations:
      - "POST /mpi/fraud-investigations"
      - "POST /mpi/fraud-investigations/{id}/substantiate"
      - "POST /mpi/fraud-investigations/{id}/unsubstantiate"
      - "POST /mpi/fraud-investigations/{id}/refer"
      - "POST /mpi/contamination-remediations/{id}/reassign"
      - "POST /mpi/contamination-remediations/{id}/close"
    shared_operations:
      - "POST /mpi/contamination-remediations/{id}/quarantine (shared with IdentityAnalyst)"
      - "All GET endpoints"
    cannot:
      - "Create records or search attempts, create/rescore/triage/review/recommend pairs, approve or reverse merges, create/apply/complete overlay corrections, submit external matches, or configure sites, rule sets and downstream systems."

  - role: MpiAdmin
    identity: "opaque — X-User-ID is the administrator identifier; admins are peers of the other roles, not a superset of them."
    description: "MPI platform administrator. Owns configuration (sites, rule sets, downstream systems) and propagation operations."
    exclusive_operations:
      - "POST /mpi/registration-sites"
      - "PATCH /mpi/registration-sites/{id}"
      - "POST /mpi/match-rule-sets"
      - "POST /mpi/match-rule-sets/{id}/activate"
      - "POST /mpi/downstream-systems"
      - "PATCH /mpi/downstream-systems/{id}"
      - "POST /mpi/propagation-tasks/{id}/ack"
      - "POST /mpi/propagation-tasks/{id}/fail"
    shared_operations:
      - "POST /mpi/candidate-pairs and POST /mpi/candidate-pairs/{id}/rescore (shared with IdentityAnalyst)"
      - "POST /mpi/merge-operations/{id}/unmerge (shared with IdentityStewardApprover)"
      - "POST /mpi/propagation-tasks/{id}/send and POST /mpi/registration-sites/{id}/duplicate-metric-runs (shared with IdentityAnalyst)"
      - "All GET endpoints"
    cannot:
      - "Create patient records or search attempts, triage/review/recommend pairs, approve a merge, resolve a pair as distinct, create/apply/complete overlay corrections, remediate contamination, adjudicate fraud, or submit external matches."
