# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Dairy Distribution & DSD Route — 9 rules x 2 instances (18 instances)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_true_up
        grounds:
          - calculations.regulated_milk_unit_price
          - calculations.invoice_true_up
          - entities.Invoice.fields.true_up_delta_cents
          - state_machines.PriceAnnouncement.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Entity domain = Invoice/pricing: the SAME 10-unit delivery is priced
          2102 cents under the PROVISIONAL announcement (210.170/unit) and 2188
          cents under the FINAL announcement (218.770/unit); publishing FINAL
          reprices the OPEN invoice and pins true_up_delta_cents == 86. Paired
          instance return_credit_original_vs_current_basis lives in the Return
          domain, so the two dual-variant logics operate on different entities.
        test_recipe:
          setup:
            - "Clock at 2026-08-01; distributor D1; route R1 (ACTIVE, basis ORIGINAL); store S1 (ACTIVE, credit_limit 100000000)"
            - "Regulated product P1 (weight 8.6 lb, margin 30c, units_per_case 1); driver DR1"
            - "Pricing period 2026-08 with PROVISIONAL announcement base=2000, assessment=35, hauling=60, diesel=299 -> unit price 210.170c"
            - "Trip T1 on 2026-08-10; order O1 of 10 units CONFIRMED then DELIVERED (code date 2026-08-20); invoice INV1 OPEN, PROVISIONAL basis, total 2102"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist A", license_number: "LIC-A-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-1", name: "Route 1", service_weekdays: ["MON"], credit_price_basis: "ORIGINAL" }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-1", name: "Store 1", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "MILK-GAL-1", name: "Whole Milk Gal", units_per_case: 1, shelf_life_days: 14, regulated: true, weight_lbs_per_unit: 8.6, margin_cents_per_unit: 30 }
              as: TerritoryManager
              captures: { p1: "$.data.id" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Dan Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-08" }
              as: MarketAdministrator
              captures: { per1: "$.data.id" }
            - { call: "GET /dairy/pricing-periods/${per1}", as: Any, captures: { per1_v: "$.data.version" } }
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2000, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per1_v}" }
              as: MarketAdministrator
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: "$.data.id" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${p1}", quantity_units: 10 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: "$.data.id" }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${t1}/temperature-readings"
              payload: { recorded_at: "2026-08-10T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /dairy/trips/${t1}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${o1}/deliver"
              payload: { delivered_lines: [{ product_id: "${p1}", delivered_units: 10, scanned_code_date: "2026-08-20" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "GET /dairy/invoices?order_id=${o1}", as: Any, captures: { inv1: "$.data[0].id", inv1_total_pre: "$.data[0].total_cents", inv1_basis_pre: "$.data[0].pricing_basis" } }
            - { call: "GET /dairy/pricing-periods/${per1}", as: Any, captures: { per1_v2: "$.data.version" } }
          trigger:
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "FINAL", class_i_base_cents_per_cwt: 2100, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per1_v2}" }
              as: MarketAdministrator
            - { call: "GET /dairy/invoices/${inv1}", as: Any, captures: { inv1_due_post: "$.data.amount_due_cents" } }
          assert:
            - "Setup capture inv1_total_pre == 2102 and inv1_basis_pre == PROVISIONAL (provisional variant: round(10 x 210.170) = 2102)"
            - "Invoice.${inv1}.pricing_basis == FINAL after FINAL publish"
            - "Invoice.${inv1}.true_up_delta_cents == 86 (2188 - 2102)"
            - "Invoice.${inv1}.subtotal_cents == 2188 and discount_cents == 0 and total_cents == 2188"
            - "Invoice.${inv1}.amount_due_cents == 2188 and status == OPEN"

      - name: return_credit_original_vs_current_basis
        grounds:
          - calculations.return_credit_amount
          - entities.Route.fields.credit_price_basis
          - entities.Return.fields.unit_credit_cents
        distinguishing_aspect: |
          Entity domain = Return: identical 10-unit OUT_OF_CODE returns of the
          same product credit 2102 cents on an ORIGINAL-basis route (price paid
          in July, 210.170/unit) but 2188 cents on a CURRENT-basis route (price
          at scan date in August, 218.770/unit). Differs from
          invoice_provisional_vs_final_true_up which operates on Invoices.
        test_recipe:
          setup:
            - "Clock 2026-07-01; distributor D1; route RA (basis ORIGINAL) with store SA, route RB (basis CURRENT) with store SB; both ACTIVE; credit limits 100000000"
            - "Regulated product P1 (8.6 lb, margin 30c); driver DR1"
            - "Period 2026-07 PROVISIONAL base 2000/35/60 diesel 299 -> 210.170c; both orders of 10 units DELIVERED on 2026-07-15 (code 2026-07-25)"
            - "Clock advanced to 2026-08-05; period 2026-08 PROVISIONAL base 2100/35/60 diesel 299 -> current price 218.770c"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist B", license_number: "LIC-B-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-A", name: "Route A", service_weekdays: ["WED"], credit_price_basis: "ORIGINAL" }
              as: TerritoryManager
              captures: { ra: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-B", name: "Route B", service_weekdays: ["WED"], credit_price_basis: "CURRENT" }
              as: TerritoryManager
              captures: { rb: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${ra}", store_code: "S-A", name: "Store A", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { sa: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${rb}", store_code: "S-B", name: "Store B", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { sb: "$.data.id" }
            - { call: "POST /dairy/routes/${ra}/activate", payload: {}, as: TerritoryManager }
            - { call: "POST /dairy/routes/${rb}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "MILK-GAL-2", name: "Whole Milk Gal", units_per_case: 1, shelf_life_days: 14, regulated: true, weight_lbs_per_unit: 8.6, margin_cents_per_unit: 30 }
              as: TerritoryManager
              captures: { p1: "$.data.id" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Dee Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-07" }
              as: MarketAdministrator
              captures: { per7: "$.data.id" }
            - { call: "GET /dairy/pricing-periods/${per7}", as: Any, captures: { per7_v: "$.data.version" } }
            - call: "POST /dairy/pricing-periods/${per7}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2000, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per7_v}" }
              as: MarketAdministrator
            - call: "POST /dairy/trips"
              payload: { route_id: "${ra}", driver_id: "${dr1}", service_date: "2026-07-15", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-07-15T05:00:00Z", planned_return_at: "2026-07-15T08:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { ta: "$.data.id" }
            - call: "POST /dairy/trips"
              payload: { route_id: "${rb}", driver_id: "${dr1}", service_date: "2026-07-15", truck_plate: "TK-2", case_capacity: 1000, planned_depart_at: "2026-07-15T09:00:00Z", planned_return_at: "2026-07-15T12:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { tb: "$.data.id" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${sa}", trip_id: "${ta}", lines: [{ product_id: "${p1}", quantity_units: 10 }], delivery_window_start: "2026-07-15T06:00:00Z", delivery_window_end: "2026-07-15T06:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { oa: "$.data.id" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${sb}", trip_id: "${tb}", lines: [{ product_id: "${p1}", quantity_units: 10 }], delivery_window_start: "2026-07-15T10:00:00Z", delivery_window_end: "2026-07-15T10:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { ob: "$.data.id" }
            - { call: "POST /dairy/orders/${oa}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /dairy/orders/${ob}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${ta}/temperature-readings"
              payload: { recorded_at: "2026-07-15T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - call: "POST /dairy/trips/${tb}/temperature-readings"
              payload: { recorded_at: "2026-07-15T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /dairy/trips/${ta}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /dairy/trips/${tb}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T06:15:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${oa}/deliver"
              payload: { delivered_lines: [{ product_id: "${p1}", delivered_units: 10, scanned_code_date: "2026-07-25" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T10:15:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${ob}/deliver"
              payload: { delivered_lines: [{ product_id: "${p1}", delivered_units: 10, scanned_code_date: "2026-07-25" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-08" }
              as: MarketAdministrator
              captures: { per8: "$.data.id" }
            - { call: "GET /dairy/pricing-periods/${per8}", as: Any, captures: { per8_v: "$.data.version" } }
            - call: "POST /dairy/pricing-periods/${per8}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2100, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per8_v}" }
              as: MarketAdministrator
          trigger:
            - call: "POST /dairy/returns"
              payload: { order_id: "${oa}", store_id: "${sa}", pickup_trip_id: "${ta}", product_id: "${p1}", quantity_units: 10, reason_code: "OUT_OF_CODE", scanned_code_date: "2026-07-25" }
              as: RouteDriver
              as_user_id: "${dr1}"
              captures: { ret_a: "$.data.id" }
            - call: "POST /dairy/returns"
              payload: { order_id: "${ob}", store_id: "${sb}", pickup_trip_id: "${tb}", product_id: "${p1}", quantity_units: 10, reason_code: "OUT_OF_CODE", scanned_code_date: "2026-07-25" }
              as: RouteDriver
              as_user_id: "${dr1}"
              captures: { ret_b: "$.data.id" }
            - { call: "GET /dairy/returns/${ret_a}", as: Any, captures: { ret_a_amt: "$.data.credit_amount_cents", ret_a_unit: "$.data.unit_credit_cents" } }
            - { call: "GET /dairy/returns/${ret_b}", as: Any, captures: { ret_b_amt: "$.data.credit_amount_cents", ret_b_unit: "$.data.unit_credit_cents" } }
          assert:
            - "Return.${ret_a}.days_to_expiry_at_scan == -11 and credit_pct == 1.0"
            - "Return.${ret_a}.unit_credit_cents == 210.170 and credit_amount_cents == 2102 (ORIGINAL basis: July delivery price)"
            - "Return.${ret_b}.unit_credit_cents == 218.770 and credit_amount_cents == 2188 (CURRENT basis: August scan-month price)"
            - "ret_b_amt - ret_a_amt == 86 (same data, two basis variants, different results)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: milk_price_tiered_surcharge_boundary
        grounds:
          - calculations.regulated_milk_unit_price
          - entities.PriceAnnouncement.fields.diesel_index_cents
        distinguishing_aspect: |
          Mode (a) tiered/non-linear formula with >= 3 inputs (cwt components,
          diesel tier, margin): diesel_index 299 yields NO surcharge (unit
          210.170c) while 300 crosses into the 1.5% tier (unit 212.873c) —
          the tier boundary is inclusive at 300. Companion instances cover mode
          (b) rounding order and mode (c) circular-looking evaluation order.
        test_recipe:
          setup:
            - "Distributor D1; route R1 ACTIVE; store S1; regulated product P1 (8.6 lb, margin 30c); driver DR1; period 2026-08"
            - "PROVISIONAL announcement A1 with diesel 299 published; order O1 of 1 unit DELIVERED on 2026-08-10 (price snapshot 210.170)"
            - "A1 then superseded by PROVISIONAL A2 with diesel 300 (same cwt components)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist C", license_number: "LIC-C-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-C", name: "Route C", service_weekdays: ["MON", "TUE"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-C", name: "Store C", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "MILK-GAL-3", name: "Whole Milk Gal", units_per_case: 1, shelf_life_days: 14, regulated: true, weight_lbs_per_unit: 8.6, margin_cents_per_unit: 30 }
              as: TerritoryManager
              captures: { p1: "$.data.id" }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Cal Driver", cdl_class: "B" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: "$.data.id" }
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-08" }
              as: MarketAdministrator
              captures: { per1: "$.data.id" }
            - { call: "GET /dairy/pricing-periods/${per1}", as: Any, captures: { per1_v: "$.data.version" } }
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2000, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${per1_v}" }
              as: MarketAdministrator
              captures: { ann1: "$.data.id" }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: "$.data.id" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${p1}", quantity_units: 1 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: "$.data.id" }
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${t1}/temperature-readings"
              payload: { recorded_at: "2026-08-10T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /dairy/trips/${t1}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${o1}/deliver"
              payload: { delivered_lines: [{ product_id: "${p1}", delivered_units: 1, scanned_code_date: "2026-08-20" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "GET /dairy/invoices?order_id=${o1}", as: Any, captures: { inv1: "$.data[0].id", inv1_sub: "$.data[0].subtotal_cents" } }
            - { call: "GET /dairy/pricing-periods/${per1}", as: Any, captures: { per1_v2: "$.data.version" } }
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2000, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 300, expected_pricing_period_version: "${per1_v2}" }
              as: MarketAdministrator
              captures: { ann2: "$.data.id" }
          trigger:
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-11", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-11T05:00:00Z", planned_return_at: "2026-08-11T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t2: "$.data.id" }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t2}", lines: [{ product_id: "${p1}", quantity_units: 1 }], delivery_window_start: "2026-08-11T08:00:00Z", delivery_window_end: "2026-08-11T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o2: "$.data.id" }
            - { call: "POST /dairy/orders/${o2}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${t2}/temperature-readings"
              payload: { recorded_at: "2026-08-11T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /dairy/trips/${t2}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${o2}/deliver"
              payload: { delivered_lines: [{ product_id: "${p1}", delivered_units: 1, scanned_code_date: "2026-08-21" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
