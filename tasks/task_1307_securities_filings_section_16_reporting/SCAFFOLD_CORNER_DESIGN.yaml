              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-20", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /transactions/${t_id}/confirm"
