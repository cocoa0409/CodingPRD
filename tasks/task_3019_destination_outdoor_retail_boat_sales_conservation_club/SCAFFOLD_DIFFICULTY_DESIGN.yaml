            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-PC", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "USED", hull_id_no: "HINPC0000001" }
              as: DealDeskClerk
