# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_create_returns_system_fields
        claim_type: creation
        grounds: ["entities.Customer"]
        distinguishing_aspect: "POST /customers returns 201 with server-minted id, version == 1, and created_at == logical clock default 2026-05-01T00:00:00Z when the clock was never set."
        test_recipe:
          setup: ["empty database; logical clock untouched (default 2026-05-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Warmup Customer", contact_email: "warmup@example.com" }, as: TerminalManager }
          trigger:
            - { call: "POST /customers", payload: { name: "System Fields Co", contact_email: "sys@example.com" }, as: TerminalManager, captures: { c_id: $.data.id, c_v: $.data.version, c_created: $.data.created_at } }
          assert:
            - "c_id is a non-null UUID"
            - "c_v == 1"
            - "c_created starts with 2026-05-01T00:00:00 (logical clock default stamps created_at; three-fractional-digit ISO 8601 UTC)"

      - name: tank_computed_working_capacity_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Tank.fields.working_capacity_bbl", "calculations.tank_working_capacity"]
        distinguishing_aspect: "Client-supplied working_capacity_bbl in the create payload is ignored; the server computes floor(200000*0.95) - 100 == 189900."
        test_recipe:
          setup: ["no tank T-9001 exists yet"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tanks", payload: { tank_code: "T-9001", product_grade: "DIESEL", capacity_bbl: 200000, heel_bbl: 100, working_capacity_bbl: 1 }, as: TerminalOperator, captures: { wc: $.data.working_capacity_bbl } }
          assert:
            - "wc == 189900 (computed value; injected 1 ignored)"
            - "response status == 201"

      - name: tank_default_safe_fill_pct_applied
        claim_type: defaults
        grounds: ["entities.Tank.fields.safe_fill_pct", "calculations.tank_working_capacity"]
        distinguishing_aspect: "Omitting safe_fill_pct applies the 0.95 default, so working_capacity_bbl == floor(200000*0.95) - 100 == 189900 on a different tank."
        test_recipe:
          setup: ["no tank T-9002 exists yet"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tanks", payload: { tank_code: "T-9002", product_grade: "DIESEL", capacity_bbl: 200000, heel_bbl: 100 }, as: TerminalOperator, captures: { wc: $.data.working_capacity_bbl, sfp: $.data.safe_fill_pct } }
          assert:
            - "sfp == 0.95 (default applied)"
            - "wc == 189900"

      - name: gauge_ticket_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.GaugeTicket"]
        distinguishing_aspect: "GaugeTicket is common_fields:false: its response carries id and created_at but no version or updated_at keys, and no update/delete endpoint exists."
        test_recipe:
          setup:
            - "ACTIVE lease/allocation/tank/resource; movement ARRIVED"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Immutable Gauge Co", contact_email: "g@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9101", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-91", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1", captures: { gt_id: $.data.id } }
          assert:
            - "response status == 201 and gt_id is a non-null UUID"
            - "response data contains no 'version' key and no 'updated_at' key (immutable event entity)"
            - "GaugeTicket.${gt_id}.recorded_by_user_id == gauger-1"

      - name: movement_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MOVEMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown movement UUID returns 404 with error_id ERR_MOVEMENT_NOT_FOUND."
        test_recipe:
          setup: ["database contains one unrelated customer record"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ghost Reference Co", contact_email: "ghost@example.com" }, as: TerminalManager }
          trigger:
            - { call: "GET /movements/11111111-2222-3333-4444-555555555555", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MOVEMENT_NOT_FOUND"
            - "response status == 404"

      - name: lease_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "entities.LeaseAgreement"]
        distinguishing_aspect: "GET /lease-agreements with limit=1 over 2 leases returns exactly 1 row with meta.total_count == 2 and meta.has_more == true."
        test_recipe:
          setup: ["one customer owning two DRAFT leases"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Paged Customer", contact_email: "paged@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 10000, min_monthly_throughput_bbl: 10, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l1_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 20000, min_monthly_throughput_bbl: 20, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l2_id: $.data.id } }
          trigger:
            - { call: "GET /lease-agreements", payload: { customer_id: "${c_id}", limit: 1, offset: 0 }, as: TerminalManager }
          assert:
            - "response.data length == 1"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"
            - "response.response_type == array"

      - name: permit_missing_required_valid_until_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "POST /permits without the required valid_until field is rejected 400 ERR_VALIDATION before any business rule runs (tank exists and is valid)."
        test_recipe:
          setup: ["one DIESEL tank exists"]
          setup_api_calls:
            - { call: "POST /tanks", payload: { tank_code: "T-9201", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /permits", payload: { permit_type: "VAPOR_CONTROL", tank_id: "${t_id}", valid_from: "2026-05-01T00:00:00Z" }, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION"
            - "response status == 400"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: movement_arrive_from_nominated_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Movement", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "arrive is only valid from SCHEDULED; from NOMINATED it fails ERR_INVALID_STATE and no actual_arrival_at is stamped."
        test_recipe:
          setup: ["ACTIVE lease/allocation/tank; movement created but never scheduled"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Transition Co", contact_email: "t@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9301", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Movement.${m_id}.status remains NOMINATED (re-readable via GET /movements/${m_id})"

      - name: allocation_release_twice_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.TankAllocation", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RELEASED is terminal for TankAllocation; a second release fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT lease with one allocation activated then released"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Release Co", contact_email: "r@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9302", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 10000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /tank-allocations/${a_id}/release", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /tank-allocations/${a_id}/release", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "TankAllocation.${a_id}.status remains RELEASED"

      - name: lease_suspend_from_terminated_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.LeaseAgreement", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal for LeaseAgreement; suspend from TERMINATED fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE lease with one ACTIVE allocation, no movements; lease terminated"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Terminal Co", contact_email: "term@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9303", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 10000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /lease-agreements/${l_id}/terminate", payload: {}, as: TerminalManager }
          trigger:
            - { call: "POST /lease-agreements/${l_id}/suspend", payload: {}, as: TerminalManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "LeaseAgreement.${l_id}.status remains TERMINATED"
            - "after terminate, the allocation was cascade-released: TankAllocation.${a_id}.status == RELEASED"

      - name: tank_auto_restricted_when_certified_over_working_capacity
        claim_type: side_effect_execution
        grounds: ["state_machines.Tank.AVAILABLE_to_RESTRICTED", "calculations.tank_inventory_reconciliation"]
        distinguishing_aspect: "Certifying a transfer that pushes current_inventory_bbl (4751) above working_capacity_bbl (4750) auto-flips the tank to RESTRICTED without any direct tank-status call."
        test_recipe:
          setup:
            - "Tank cap 5000 heel 0 -> working 4750; ACTIVE lease with allocation 4750"
            - "RECEIPT movement declared 4750 (<= allocation), gauges 0 -> 4751 @60F, sample sg 0.85 -> certified 4751"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Overfill Co", contact_email: "of@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9304", product_grade: "DIESEL", capacity_bbl: 5000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 10000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 4750, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-93", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 4750, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 4751, observed_temp_f: 60, observed_at: "2026-05-10T10:00:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:05:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/samples", payload: { sample_type: "INLINE" }, as: QualityInspector, as_user_id: "qi-1", captures: { s_id: $.data.id } }
            - { call: "POST /quality-samples/${s_id}/record-result", payload: { lab_result: "PASSED", specific_gravity: 0.85 }, as: QualityInspector, as_user_id: "qi-2" }
            - { call: "GET /movements/${m_id}/custody-transfers", payload: {}, as: TerminalManager, captures: { ct_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /custody-transfers/${ct_id}/certify", payload: {}, as: TerminalManager, as_user_id: "tm-1" }
            - { call: "GET /tanks/${t_id}", payload: {}, as: TerminalManager }
          assert:
            - "Tank.${t_id}.current_inventory_bbl == 4751"
            - "Tank.${t_id}.status == RESTRICTED (auto-transition; 4751 > working_capacity_bbl 4750)"

      - name: statement_close_marks_movements_accrued
        claim_type: side_effect_execution
        grounds: ["state_machines.MonthlyStatement.OPEN_to_CLOSED", "entities.Movement.fields.billing_status"]
        distinguishing_aspect: "Statement close flips the parallel billing dimension of the period's COMPLETED movement UNBILLED -> ACCRUED while the ops dimension stays COMPLETED."
        test_recipe:
          setup:
            - "ACTIVE lease (min commitment 100); movement COMPLETED in 2026-05 (uncertified is fine for billing flip)"
            - "OPEN statement 2026-05; clock at 2026-06-01"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Accrual Co", contact_email: "ac@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-9305", product_grade: "DIESEL", capacity_bbl: 100000, heel_bbl: 0 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.75, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 20000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /lease-agreements/${l_id}/statements", payload: { period: "2026-05" }, as: BillingClerk, captures: { st_id: $.data.id } }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-94", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 100, observed_temp_f: 60, observed_at: "2026-05-10T10:00:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:05:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: TerminalManager }
          trigger:
