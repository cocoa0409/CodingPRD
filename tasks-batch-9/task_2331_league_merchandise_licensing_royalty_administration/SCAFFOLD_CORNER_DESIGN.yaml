            - call: "POST /licensing/licensees/${lic_s3}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: false, expected_licensee_version: "${lic_s3_v1}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_s3: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_s3}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_s3}"
              as: FinanceController
              captures: { agr_s3_v1: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_s3}", period_quarter: "2026Q2", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_s3}", gross_sales_cents: 1000000, units: 5000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_s3_v1}" }
              as: Licensee
