# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Logical clock default is 2026-08-01T00:00:00Z unless a call sets it.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: unit_creation_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Unit.fields.square_feet, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /units without required square_feet → 400 ERR_INVALID_REQUEST (validated before any FK existence check result matters — property exists here)."
        test_recipe:
          setup: ["Property exists"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
          trigger:
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400); no unit persisted"

      - name: unit_created_with_initial_state_and_system_fields
        claim_type: defaults
        grounds: [entities.Unit.fields.status, state_machines.Unit]
        distinguishing_aspect: "Newly created unit starts OCCUPIED with server-minted id, version == 1, created_at stamped; client input cannot set status."
        test_recipe:
          setup: ["Property exists"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
          trigger:
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
          assert:
            - "Unit.${u}.status == OCCUPIED (initial state), version == 1, id and created_at present"

      - name: turn_create_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.Turn.fields.estimated_cost_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "estimated_cost_cents is computed; passing it in POST /turns is an unknown field → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Property and OCCUPIED unit exist"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
          trigger:
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31", estimated_cost_cents: 999 }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400); unit remains OCCUPIED (no turn created)"

      - name: get_unit_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID → 404 ERR_NOT_FOUND with error envelope carrying error_id and message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /make-ready/units/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404); error envelope has data.error_id and data.message; response_type == error"

      - name: scope_item_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ScopeItem.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category 'DEEP_CLEAN' is outside the declared enum → 400 ERR_INVALID_REQUEST before any state or tier logic runs."
        test_recipe:
          setup: ["Property, unit, OPEN turn exist"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
          trigger:
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "DEEP_CLEAN", description: "bad enum", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: inspection_immutable_entity_has_no_version
        claim_type: immutability
        grounds: [entities.Inspection]
        distinguishing_aspect: "Inspection declares common_fields: false — its response carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "Turn IN_PROGRESS with one COMPLETED REPAIR item (assignment [2026-08-01, 2026-08-03) accepted then completed at 4000)"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 4000 }
              as: Vendor
              as_user_id: "${v}"
          trigger:
            - call: "POST /make-ready/turns/${t}/inspections"
              payload: { result: "PASS" }
              as: Inspector
              captures: { insp: $.data.id }
          assert:
            - "Inspection.${insp} response contains id, created_at, turn_id, result == PASS"
            - "Inspection.${insp} response contains no version and no updated_at field"

  # ------------------------------------------------------- state machines
  - section: state_machines
    instances:
      - name: complete_unaccepted_assignment_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.VendorAssignment.ACCEPTED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is only declared from ACCEPTED; from SCHEDULED it must fail with ERR_INVALID_STATE and record no actual cost."
        test_recipe:
          setup: ["Turn SCOPED with REPAIR item; assignment [2026-08-01, 2026-08-03) created (SCHEDULED, never accepted)"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 4000 }
              as: Vendor
              as_user_id: "${v}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "VendorAssignment.${asg}.status remains SCHEDULED and ScopeItem.${it}.actual_cost_cents remains null"

      - name: cancel_closed_turn_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Turn, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: POST /turns/{id}/cancel on a CLOSED turn fails with ERR_INVALID_STATE and nothing else changes."
        test_recipe:
          setup:
            - "Turn fully processed to CLOSED: REPAIR item completed at 4000, inspection PASS, PM close"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 4000 }
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /make-ready/turns/${t}/inspections"
              payload: { result: "PASS" }
              as: Inspector
            - call: "POST /make-ready/turns/${t}/close"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /make-ready/turns/${t}/cancel"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409); Turn.${t}.status remains CLOSED"

      - name: move_in_resolves_commitment_fulfilled
        claim_type: side_effect_execution
        grounds: [state_machines.Unit.READY_to_OCCUPIED, state_machines.LeaseCommitment.ACTIVE_to_FULFILLED]
        distinguishing_aspect: "Move-in on/before the committed date resolves the ACTIVE commitment to FULFILLED and returns the unit to OCCUPIED, closing the unit lifecycle loop."
        test_recipe:
          setup:
            - "Turn READY (REPAIR item completed 4000, inspection PASS at default clock → actual_ready_date 2026-08-01)"
            - "LeaseCommitment ACTIVE with committed_delivery_date 2026-08-06 (created while IN_PROGRESS; projected was 2026-08-03 at finalize)"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /make-ready/lease-commitments"
              payload: { unit_id: "${u}", applicant_name: "A Lee", committed_delivery_date: "2026-08-06" }
              as: TurnCoordinator
              captures: { lc: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 4000 }
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /make-ready/turns/${t}/inspections"
              payload: { result: "PASS" }
              as: Inspector
          trigger:
            - call: "POST /make-ready/units/${u}/record-move-in"
              payload: { move_in_date: "2026-08-05" }
              as: TurnCoordinator
            - call: "GET /make-ready/units/${u}/lease-commitments"
              payload: {}
              as: TurnCoordinator
          assert:
            - "Unit.${u}.status == OCCUPIED"
            - "LeaseCommitment.${lc}.status == FULFILLED (move_in 2026-08-05 <= committed 2026-08-06)"

      - name: move_in_late_marks_commitment_breached
        claim_type: side_effect_execution
        grounds: [state_machines.LeaseCommitment.ACTIVE_to_BREACHED]
        distinguishing_aspect: "The mirror resolution: move_in_date strictly after committed_delivery_date resolves the commitment to BREACHED instead of FULFILLED."
        test_recipe:
          setup:
            - "Turn READY (same minimal flow); commitment ACTIVE with committed_delivery_date 2026-08-04"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /make-ready/lease-commitments"
              payload: { unit_id: "${u}", applicant_name: "B Kay", committed_delivery_date: "2026-08-04" }
              as: TurnCoordinator
              captures: { lc: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 4000 }
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /make-ready/turns/${t}/inspections"
              payload: { result: "PASS" }
              as: Inspector
          trigger:
            - call: "POST /make-ready/units/${u}/record-move-in"
              payload: { move_in_date: "2026-08-09" }
              as: TurnCoordinator
            - call: "GET /make-ready/units/${u}/lease-commitments"
              payload: {}
              as: TurnCoordinator
          assert:
            - "Unit.${u}.status == OCCUPIED"
            - "LeaseCommitment.${lc}.status == BREACHED (move_in 2026-08-09 > committed 2026-08-04)"

      - name: finalize_scope_clock_stamping_covered
        claim_type: side_effect_execution
        grounds: [state_machines.Turn.OPEN_to_SCOPED]
        excluded_because:
          difficulty_instance: finalize_scope_requires_planned_scope_item
          rationale: "That instance asserts started_on == 2026-08-01 (default clock) and target_ready_date == 2026-08-06 as the success-path outcome."

      - name: turn_rework_loop_covered
        claim_type: valid_transition
        grounds: [state_machines.Turn.IN_PROGRESS_to_REWORK, state_machines.Turn.REWORK_to_IN_PROGRESS]
        excluded_because:
          difficulty_instance: turn_rework_loop_inprogress_to_ready_cycle
          rationale: "The full rework cycle including the REWORK → IN_PROGRESS re-entry is asserted there."

      - name: commitment_risk_cycle_covered
        claim_type: valid_transition
        grounds: [state_machines.LeaseCommitment.ACTIVE_to_AT_RISK, state_machines.LeaseCommitment.AT_RISK_to_ACTIVE]
        excluded_because:
          difficulty_instance: lease_commitment_active_at_risk_cycle
          rationale: "ACTIVE → AT_RISK → ACTIVE flips are asserted there."

      - name: decline_returns_item_to_planned_covered
        claim_type: side_effect_execution
        grounds: [state_machines.ScopeItem.SCHEDULED_to_PLANNED]
        excluded_because:
          difficulty_instance: vendor_open_assignment_create_decline_conservation
          rationale: "That instance asserts ScopeItem returns to PLANNED after the vendor decline."

  # ---------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: property_benchmark_counts_closed_turns_only
        claim_type: input_set_filtering
        grounds: [calculations.property_benchmark, entities.Property.fields.benchmark_turn_count]
        distinguishing_aspect: "Only CLOSED turns enter the benchmark: a READY-but-unclosed turn leaves all aggregates at 0; closing two turns yields count 2, avg_booked_expense_cents 2593, avg_days_to_ready 4 (round_half_up of 3.5)."
        test_recipe:
          setup:
            - "Both turns are fully built through work completion at the default clock 2026-08-01 (started_on == 2026-08-01 for both)"
            - "T1 (unit 101): REPAIR actual 1010 [2026-08-01,2026-08-03) + CLEAN actual 1010 [2026-08-03,2026-08-04); booked_expense 2070; PASS at clock 2026-08-04 → 3 days"
            - "T2 (unit 102): REPAIR actual 2030 + CLEAN actual 1010, same windows; booked_expense 3116; PASS at clock 2026-08-05 → 4 days"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "102", square_feet: 800 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v_r: $.data.id }
            - call: "POST /make-ready/vendors"
              payload: { name: "CleanCo", trade: "CLEAN" }
              as: PropertyManager
              captures: { v_c: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u1}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t1: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t1}", category: "REPAIR", description: "repair t1", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { r1: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t1}", category: "CLEAN", description: "clean t1", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { c1: $.data.id }
            - call: "POST /make-ready/turns/${t1}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${r1}", vendor_id: "${v_r}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { ar1: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${ar1}/accept"
              payload: {}
              as: Vendor
