  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: funding_cost_interpolates_between_tenors
        claim_type: correct_result
        grounds: [calculations.funding_cost_at_term, "errors[ERR_NO_FUNDING_CURVE]"]
        distinguishing_aspect: "Exact-tenor match returns the point value unmodified (term 12 -> 270); a term between points interpolates linearly with round_half_up (term 9 -> 263 from 255 + (270-255)*(9-6)/(12-6) = 262.5); a term beyond the curve maximum errors ERR_NO_FUNDING_CURVE."
        test_recipe:
          setup:
            - "FundingCurve dated 2026-08-01 with points (0,210), (3,235), (6,255), (12,270)"
            - "P-F9 (CD, term 9) sheet single tier @300 floor 0 in US-W9 (DRAFT suffices for margin-analysis); P-F12 (CD, term 12) sheet single tier @300 in US-W12; P-F18 (CD, term 18) sheet single tier @300 in US-W18"
          setup_api_calls:
            - { call: "POST /funding-curves", payload: { curve_date: "2026-08-01", points: [ { tenor_months: 0, cost_bp: 210 }, { tenor_months: 3, cost_bp: 235 }, { tenor_months: 6, cost_bp: 255 }, { tenor_months: 12, cost_bp: 270 } ] }, as: TreasuryOfficer }
            - { call: "POST /deposit-products", payload: { product_code: "F9", product_class: "CD", term_months: 9, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: false }, as: OperationsAdmin, captures: { p_f9: $.data.id } }
            - { call: "POST /deposit-products", payload: { product_code: "F12", product_class: "CD", term_months: 12, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: false }, as: OperationsAdmin, captures: { p_f12: $.data.id } }
            - { call: "POST /deposit-products", payload: { product_code: "F18", product_class: "CD", term_months: 18, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: false }, as: OperationsAdmin, captures: { p_f18: $.data.id } }
