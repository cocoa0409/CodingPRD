              captures: { inst_id: $.data.id, inst_v: $.data.version }
          trigger:
            - call: "PATCH /institutions/${inst_id}/capital-category"
              payload: { capital_category: "ADEQUATELY_CAPITALIZED", expected_institution_version: "${inst_v}" }
              as: Examiner
              as_user_id: "op_exam"
            - call: "PATCH /institutions/${inst_id}/capital-category"
              payload: { capital_category: "WELL_CAPITALIZED", expected_institution_version: "${inst_v}" }
              as: Examiner
              as_user_id: "op_exam"
              captures: { e1: $.data.error_id }
            - call: "GET /institutions/${inst_id}"
              as: Examiner
              as_user_id: "op_exam"
              captures: { inst_v2: $.data.version }
            - call: "PATCH /institutions/${inst_id}/capital-category"
              payload: { capital_category: "UNDERCAPITALIZED", expected_institution_version: "${inst_v2}" }
              as: Examiner
              as_user_id: "op_exam"
          assert:
            - "${inst_v} == 1; the first PATCH returns 200 with capital_category == ADEQUATELY_CAPITALIZED, rate_cap_regime == CAPPED and version == 2"
            - "second trigger: HTTP 412 with ${e1} == ERR_STALE_INSTITUTION_VERSION - the replayed version 1 is stale"
            - "the refused revert leaves capital_category == ADEQUATELY_CAPITALIZED: the downgrade is not silently undone"
            - "${inst_v2} == 2 and the retried PATCH returns 200 with capital_category == UNDERCAPITALIZED, rate_cap_regime == CAPPED and version == 3"
            - "the 412 body carries no partial mutation - version does not increment on a rejected write"

      - name: corner_four_level_cascade_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: "transitive_cascade / exception_revoke_four_hop_to_contingency_activation"
          rationale: "The N-level chain claim for this layer is exactly what the difficulty instance already walks: a single PrimaryPurposeException REVOKE is followed through reclassification of the reliant program, re-bucketing of its ACTIVE placements' balances, the resulting concentration re-posture and the automatic contingency-plan activation with its recomputed buffer, asserting the state and derived fields at every hop as well as the ordering. Repeating a shorter chain here would test a strict subset."

      - name: corner_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: "dual_variant_calc / wholesale_ratio_point_in_time_versus_average_daily"
          rationale: "That instance already computes both wholesale_funding_ratio variants over the same placement book, pins the two-step floor order of AVERAGE_DAILY, and asserts the exact delta against the POINT_IN_TIME snapshot plus which variant drives concentration_posture - the full set of claims this layer asks for."

      - name: corner_rate_threshold_boundary_breach_and_reset
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.effective_rate_cap
          - state_machines[DepositPlacement.compliance_status]
          - validations[priority 31 ERR_RATE_CAP_EXCEEDED]
        distinguishing_aspect: "The threshold moves under a placement whose own rate never changes: three successive publications shift the ceiling from 475 to 375 and back to 525, and the surveillance dimension walks RATE_CHECKED -> FLAGGED -> REMEDIATED off the same unchanged 470 bps offer, with the effective_date edge tested one day either side."
        test_recipe:
          setup:
            - "An ADEQUATELY_CAPITALIZED (CAPPED) bank with a DAYS_31_90 benchmark of 400 bps effective 2026-07-01, an OPEN_FOR_PLACEMENT brokered program offering 470 bps and one PENDING placement of 1,000,000,000 at 470 bps issued 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "op_admin"
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90", published_national_rate_bps: 400, effective_date: "2026-07-01" }
              as: SystemAdmin
              as_user_id: "op_admin"
            - call: "POST /institutions"
              payload: { legal_name: "Threshold Bank NA", cert_id: "CERT-9085", capital_category: "ADEQUATELY_CAPITALIZED", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              as_user_id: "op_admin"
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Threshold Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 10000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-9085", fee_structure: "FLAT_FEE", fee_flat_cents: 10000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Threshold Brokered CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 1000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /deposit-placements/${pl_id}/rate-cap-checks"
              payload: { check_date: "2026-08-01" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { chk_1: $.data.id }
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90", published_national_rate_bps: 300, effective_date: "2026-08-15" }
              as: SystemAdmin
              as_user_id: "op_admin"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 100000000, rate_bps: 470, issue_date: "2026-08-14", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_edge_id: $.data.id }
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 100000000, rate_bps: 470, issue_date: "2026-08-15", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e1: $.data.error_id }
            - call: "POST /deposit-placements/${pl_id}/rate-cap-checks"
              payload: { check_date: "2026-08-15" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { chk_2: $.data.id }
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90", published_national_rate_bps: 450, effective_date: "2026-09-01" }
              as: SystemAdmin
              as_user_id: "op_admin"
            - call: "POST /deposit-placements/${pl_id}/rate-cap-checks"
              payload: { check_date: "2026-09-01" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { chk_3: $.data.id }
          assert:
            - "RateCapCheck.${chk_1}: national_rate_bps_snapshot == 400, effective_cap_bps == 475 (400 + NATIONAL_SPREAD_BPS 75, no local leg), breach_bps == 0, outcome == PASS; DepositPlacement.${pl_id}.compliance_status == RATE_CHECKED"
            - "the 2026-08-14 placement is accepted: the 300 bps publication has effective_date 2026-08-15, so the selector still ranks the 400 bps row first and the ceiling is 475 >= 470 - DepositPlacement.${pl_edge_id} exists with funding_status PENDING"
            - "the 2026-08-15 placement is refused with HTTP 422 and ${e1} == ERR_RATE_CAP_EXCEEDED: on the effective_date itself the 300 bps row governs, so the ceiling is 375 and 470 is 95 bps above it"
            - "RateCapCheck.${chk_2}: national_rate_bps_snapshot == 300, effective_cap_bps == 375, breach_bps == 95 (470 - 375), outcome == BREACH; DepositPlacement.${pl_id}.compliance_status == FLAGGED"
            - "RateCapCheck.${chk_3}: national_rate_bps_snapshot == 450, effective_cap_bps == 525, breach_bps == 0, outcome == PASS; DepositPlacement.${pl_id}.compliance_status == REMEDIATED - the reset closes the surveillance cycle"
            - "DepositPlacement.${pl_id}.rate_bps is 470 throughout: only the published threshold moved, and GET /deposit-placements/${pl_id}/rate-cap-checks returns total_count == 3 in check_date order"
            - "the three checks never touch funding_status: DepositPlacement.${pl_id} is still PENDING at the end"

  - section: consistency_model
    instances:
      - name: corner_every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model == immediate
          - calculations.wholesale_balance_rollup
          - calculations.concentration_posture
          - calculations.broker_fee_settlement
          - endpoints[POST /deposit-placements/{id}/funding-actions]
        distinguishing_aspect: "A single ACTIVATE is the only observation point: the placement response, the institution row, the program row, the agreement mirror and the board limit are all read immediately afterwards with no intervening write, and every derived number already reflects the activation - nothing lags, and nothing needs a second read to settle."
        test_recipe:
          setup:
            - "A WELL_CAPITALIZED bank with core 30,000,000,000, one approved VOLUME_TIERED-free FLAT_FEE agreement, one OPEN_FOR_PLACEMENT brokered program, a board limit at warning 2000 / breach 4000 and one PENDING placement of 1,000,000,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "op_admin"
            - call: "POST /institutions"
              payload: { legal_name: "Immediate Bank NA", cert_id: "CERT-9086", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              as_user_id: "op_admin"
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Immediate Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 25000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-9086", fee_structure: "FLAT_FEE", fee_flat_cents: 25000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Immediate Brokered CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /institutions/${inst_id}/concentration-limits"
              payload: { metric: "BROKERED_TO_TOTAL_DEPOSITS", warning_threshold_bps: 2000, breach_threshold_bps: 4000 }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { lim_id: $.data.id }
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 1000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /deposit-placements/${pl_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "GET /institutions/${inst_id}"
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "GET /deposit-programs/${prog_id}"
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "GET /broker-agreements/${agr_id}"
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "GET /institutions/${inst_id}/concentration-limits"
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "GET /institutions/${inst_id}/wholesale-funding-summary"
              as: TreasuryController
              as_user_id: "op_alm"
          assert:
            - "the ACTIVATE response itself already carries funding_status == ACTIVE and classified_as == BROKERED and fee_accrual_cents == 25000"
            - "the immediately following institution read shows brokered_deposits_cents == 1000000000, total_deposits_cents == 31000000000, wholesale_funding_ratio_bps == 322 (floor(1000000000 * 10000 / 31000000000)) and concentration_posture == OPEN"
            - "the program read shows outstanding_principal_cents == 1000000000 with no second read required"
            - "the agreement read shows accrued_fee_cents == 25000 - the FLAT_FEE mirror is already reconciled"
            - "the limit read shows ConcentrationLimit.${lim_id}.current_value_bps == 322 with breach_state == NONE, computed from the post-activation balances"
            - "the wholesale funding summary (POINT_IN_TIME, no basis supplied) reports the same 322 bps and single_broker_max_ratio_bps == 322, so the read-only projection agrees with the persisted fields in the same instant"
            - "no value anywhere is the pre-activation zero: there is no window in which a caller can observe a stale derived field"
