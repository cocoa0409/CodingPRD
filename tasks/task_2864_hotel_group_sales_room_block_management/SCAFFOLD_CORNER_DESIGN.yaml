    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    - roles
    distinguishing_aspect: |
      Priority 1 separates 'no credentials' from 'wrong credentials': omitting the headers and naming a role outside the seven declared (GeneralManager) are both 401 ERR_UNAUTHENTICATED, while a declared role that simply is not on the endpoint's list is the 403 covered by the sibling instance. An implementation that resolves unknown roles to a default, or that answers 403 for a missing header, fails.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; empty database — the calls never get far enough to need one
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
