          - errors.ERR_WAVE_CAPACITY_FULL
        distinguishing_aspect: |
          state (priority 5, ERR_INVALID_STATE) vs business_constraint
          (priority 11, ERR_WAVE_CAPACITY_FULL): when the wave is SCHEDULED
          (wrong from-state for assign) AND capacity is already full, the
          state error wins because priority 5 < priority 11.
        test_recipe:
          setup:
