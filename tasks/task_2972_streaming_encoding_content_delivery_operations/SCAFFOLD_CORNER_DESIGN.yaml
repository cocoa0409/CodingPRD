            - call: "POST /drm-packages/${pk_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "ANY", device_class_scope: "TV_ONLY", max_concurrent_streams: 5, max_playback_height_px: 720, hdcp_level: "NONE", priority: 80 }
