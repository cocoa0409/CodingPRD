scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (≥ 2 instances on DIFFERENT entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: small_vs_micro_filing_fee_on_application
        grounds:
          - calculations.filing_fee
          - calculations.filing_fee.variants.small_entity_filing
          - calculations.filing_fee.variants.micro_entity_filing
          - entities.Applicant.fields.entity_size
          - entities.Application.fields.application_type
          - validations[priority=13]
          - errors.ERR_FEE_AMOUNT_MISMATCH
        distinguishing_aspect: |
          Domain = Application/Applicant fee schedule. The SAME UTILITY application by the SAME-shape applicant
          requires a 16000c filing fee when entity_size==SMALL and 8000c when entity_size==MICRO; the divergence
          is purely from the entity_multiplier variant chosen, with both being valid filing-fee algorithms.
        test_recipe:
          setup:
            - "POST /applicants {name:'A1', entity_size:'SMALL'} as USPTOAdmin -> applicant_small"
            - "POST /applicants {name:'A2', entity_size:'MICRO', gross_income_cents: 5000000000, prior_filings_count: 0} as USPTOAdmin -> applicant_micro"
            - "POST /applications {applicant_id: applicant_small.id, application_type:'UTILITY', title:'t', claim_count:1, independent_claim_count:1} as Applicant(small) -> app_s"
            - "POST /applications {applicant_id: applicant_micro.id, application_type:'UTILITY', title:'t', claim_count:1, independent_claim_count:1} as Applicant(micro) -> app_m"
          trigger:
            - "POST /applications/{app_s.id}/fees {fee_category:'FILING', amount_cents: 16000} as Applicant(small) -> 201"
            - "POST /applications/{app_s.id}/fees {fee_category:'FILING', amount_cents: 8000} as Applicant(small) -> 422 ERR_FEE_AMOUNT_MISMATCH"
            - "POST /applications/{app_m.id}/fees {fee_category:'FILING', amount_cents: 8000} as Applicant(micro) -> 201"
            - "POST /applications/{app_m.id}/fees {fee_category:'FILING', amount_cents: 16000} as Applicant(micro) -> 422 ERR_FEE_AMOUNT_MISMATCH"
          assert:
            - "FeeTransaction for app_s has amount_cents == 16000"
            - "FeeTransaction for app_m has amount_cents == 8000"
            - "Mismatched amounts produce ERR_FEE_AMOUNT_MISMATCH (422) on both directions"

      - name: forward_term_vs_lapse_truncated_expiration_on_application
        grounds:
          - calculations.application_expiration
          - calculations.application_expiration.variants.forward_looking_term
          - calculations.application_expiration.variants.lapse_truncated
          - state_machines.MaintenanceFee.SCHEDULED_to_LAPSED
          - state_machines.Application.GRANTED_to_EXPIRED
          - entities.Application.fields.expires_at
        distinguishing_aspect: |
          Domain = Application lifetime expiration. With identical UTILITY grant on 2024-01-01, two valid expiration
          algorithms diverge: forward_looking_term => 2044-01-01 (granted_at + 20y), lapse_truncated => the earliest
          LAPSED MaintenanceFee.grace_period_end_at (~2028-07-01 for STAGE_3_5). The two variants live on a DIFFERENT
          entity domain than instance 1 (filing fees on Application/Applicant) — this one is the Application term
          algorithm, not the Application fee algorithm.
        test_recipe:
          setup:
            - "Create applicant_small (SMALL) and grant a UTILITY application app1 at SystemClock.now = 2024-01-01T00:00:00Z (file, examine, allow, pay issue fee, grant)"
            - "MaintenanceFee STAGE_3_5 row exists with due_at=2027-07-01, grace_period_end_at=2028-01-01"
          trigger:
            - "POST /_clock/advance {to:'2028-01-02T00:00:00Z'} as USPTOAdmin"
            - "GET /applications/{app1.id} as Examiner"
          assert:
            - "After clock advance past grace_period_end_at without MAINTENANCE FeeTransaction, MaintenanceFee.status == LAPSED"
            - "Application.status == EXPIRED"
            - "Application.expires_at when effective (lapse_truncated) == 2028-01-01T00:00:00Z, NOT 2044-01-01 (forward_looking_term would yield 2044-01-01)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (≥ 2 instances across DIFFERENT modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: maintenance_fee_three_inputs_threshold_branching   # mode (a): ≥3 inputs with non-linear interaction
        grounds:
          - calculations.maintenance_fee
          - calculations.maintenance_fee.variants.timely
          - calculations.maintenance_fee.variants.grace
          - entities.MaintenanceFee.fields.stage
          - entities.MaintenanceFee.fields.due_at
          - entities.MaintenanceFee.fields.grace_period_end_at
          - entities.Applicant.fields.entity_size
        distinguishing_aspect: |
          Mode (a): formula has 4 inputs — stage (tiered lookup), entity_size (multiplier), SystemClock.now
          relative to due_at (threshold branch), and a flat SURCHARGE_CENTS. Non-linear interaction: the surcharge
          is NOT multiplied by entity_multiplier — it's added flat AFTER rounding. So a MICRO applicant in grace
          pays round(160000*0.25) + 16000 = 40000 + 16000 = 56000c (NOT round((160000+16000)*0.25)=44000).
        test_recipe:
          setup:
            - "Grant a UTILITY app for applicant_micro at SystemClock=2024-01-01; MaintenanceFee STAGE_3_5 due_at=2027-07-01, grace_period_end_at=2028-01-01"
            - "POST /_clock/advance {to:'2027-08-01T00:00:00Z'} as USPTOAdmin (within grace window)"
          trigger:
            - "POST /applications/{app.id}/fees {fee_category:'MAINTENANCE', amount_cents: 56000, maintenance_fee_id: mf.id} as Applicant(micro) -> 201"
            - "POST /maintenance-fees/{mf.id}/pay as Applicant(micro) -> 200"
          assert:
            - "Maintenance fee charged == 56000c (40000 + 16000 surcharge), NOT 44000c"
            - "MaintenanceFee.status == PAID"
            - "Submitting 44000c instead produces ERR_FEE_AMOUNT_MISMATCH (422)"

      - name: excess_claim_per_component_rounding_order             # mode (b): nested rounding where order matters
        grounds:
          - calculations.excess_claim_fee
          - calculations.excess_claim_fee.variants.per_component_rounding
          - entities.Application.fields.claim_count
          - entities.Application.fields.independent_claim_count
          - entities.Applicant.fields.entity_size
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to "round per-component THEN sum" rather than "sum THEN round".
          With EXCESS_TOTAL_CLAIM_UNIT_CENTS=10001 and EXCESS_INDEP_CLAIM_UNIT_CENTS=48003, SMALL applicant with
          excess_total=1 and excess_indep=1:
            per-component: round(1*10001*0.5) + round(1*48003*0.5) = round(5000.5)+round(24001.5) = 5001+24002 = 29003c
            sum-then-round: round((10001+48003)*0.5) = round(29002) = 29002c
          The pinned order yields 29003c (1 cent higher); a sum-first implementation gives 29002c.
        test_recipe:
          setup:
            - "POST /applicants {name:'A3', entity_size:'SMALL'} as USPTOAdmin -> applicant_small"
            - "POST /applications {applicant_id: applicant_small.id, application_type:'UTILITY', title:'t', claim_count: 21, independent_claim_count: 4} as Applicant -> app2"
          trigger:
            - "POST /applications/{app2.id}/fees {fee_category:'FILING', amount_cents: 16000} as Applicant -> 201"
            - "POST /applications/{app2.id}/fees {fee_category:'EXCESS_CLAIM', amount_cents: 29003} as Applicant -> 201"
            - "POST /applications/{app2.id}/fees {fee_category:'EXCESS_CLAIM', amount_cents: 29002} as Applicant -> 422 ERR_FEE_AMOUNT_MISMATCH (when retried in a sibling app)"
          assert:
            - "Server accepts EXCESS_CLAIM amount_cents == 29003 (per-component rounding result)"
            - "Server rejects EXCESS_CLAIM amount_cents == 29002 with ERR_FEE_AMOUNT_MISMATCH (sum-then-round result is wrong)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (≥ 2 instances on DIFFERENT entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_cycle_examination_to_office_action_to_examination  # cycle on Application entity
        grounds:
          - state_machines.Application
          - state_machines.Application.UNDER_EXAMINATION_to_OFFICE_ACTION_PENDING
          - state_machines.Application.OFFICE_ACTION_PENDING_to_UNDER_EXAMINATION
          - state_machines.Application.UNDER_EXAMINATION_to_ALLOWED
          - entities.OfficeAction.fields.action_number
        distinguishing_aspect: |
          Non-linear shape = CYCLE on the Application entity: UNDER_EXAMINATION -> OFFICE_ACTION_PENDING ->
          UNDER_EXAMINATION may repeat multiple times with each loop creating a new OfficeAction whose
          action_number = previous+1. This is a cycle (A->B->A), not a linear pipeline.
        test_recipe:
          setup:
            - "Bring an Application to UNDER_EXAMINATION (file + begin-examination + EXAMINATION fee)"
          trigger:
            - "POST /applications/{app.id}/office-actions {action_type:'NON_FINAL'} as Examiner -> oa1 (action_number=1)"
            - "POST /office-actions/{oa1.id}/responses as Applicant -> 201 (Application back to UNDER_EXAMINATION)"
            - "POST /applications/{app.id}/office-actions {action_type:'NON_FINAL'} as Examiner -> oa2 (action_number=2)"
            - "POST /office-actions/{oa2.id}/responses as Applicant -> 201"
            - "POST /applications/{app.id}/office-actions {action_type:'FINAL'} as Examiner -> oa3 (action_number=3)"
            - "POST /office-actions/{oa3.id}/responses as Applicant -> 201"
            - "POST /applications/{app.id}/allow as Examiner -> 200"
          assert:
            - "Application.status oscillated UNDER_EXAMINATION -> OFFICE_ACTION_PENDING -> UNDER_EXAMINATION three times"
            - "OfficeAction.action_number values are 1, 2, 3 in order"
            - "Application eventually reached ALLOWED"

      - name: pct_phase_branching_terminal_dimensions   # branching fork on PCTPhase entity (different entity than instance 1)
        grounds:
          - state_machines.PCTPhase
          - state_machines.PCTPhase.INTERNATIONAL_to_NATIONAL_ENTERED
          - state_machines.PCTPhase.INTERNATIONAL_to_LAPSED
          - entities.PCTPhase.fields.national_phase_deadline_at
        distinguishing_aspect: |
          Non-linear shape = BRANCHING fork-join on PCTPhase entity (different entity than instance 1's
          Application): INTERNATIONAL branches into either NATIONAL_ENTERED (applicant-driven) or LAPSED
          (clock-driven) with DIVERGENT side-effect sets — one creates a FeeTransaction and timestamps
          national_entered_at, the other does not. Two competing branches share an antecedent.
        test_recipe:
          setup:
            - "Set up two UTILITY applications (app_a, app_b) both at SystemClock=2024-01-01, both with PCTPhase initiated immediately after filing; both PCTPhases have priority_date=2024-01-01 and national_phase_deadline_at=2026-07-01"
          trigger:
            - "POST /_clock/advance {to:'2025-06-01T00:00:00Z'} as USPTOAdmin"
            - "POST /applications/{app_a.id}/fees {fee_category:'PCT_NATIONAL', amount_cents: 25500} as Applicant -> 201 (SMALL)"
            - "POST /pct-phases/{pct_a.id}/enter-national as Applicant -> 200 NATIONAL_ENTERED branch"
            - "POST /_clock/advance {to:'2026-07-02T00:00:00Z'} as USPTOAdmin -> auto-LAPSE branch"
          assert:
            - "PCTPhase pct_a.status == NATIONAL_ENTERED, national_entered_at is set"
            - "PCTPhase pct_b.status == LAPSED, national_entered_at is null"
            - "Both branches originated from INTERNATIONAL state — divergent side effects: pct_a has a PCT_NATIONAL FeeTransaction, pct_b does not"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (≥ 2 instances; one depth ≥ 3, other depth ≥ 2; DIFFERENT triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: maintenance_lapse_triggers_application_expiration_triggers_pct_lapse   # depth 3
        grounds:
          - state_machines.MaintenanceFee.SCHEDULED_to_LAPSED
          - state_machines.Application.GRANTED_to_EXPIRED
          - state_machines.PCTPhase.INTERNATIONAL_to_LAPSED
          - entities.Application.fields.expires_at
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by a clock advance crossing MaintenanceFee.grace_period_end_at:
          (1) MaintenanceFee SCHEDULED->LAPSED happens because grace_period_end_at passed;
          (2) that lapse is the CAUSE of Application GRANTED->EXPIRED via the precondition "any MaintenanceFee
              with status==LAPSED";
          (3) the EXPIRED Application transition is then the CAUSE of PCTPhase INTERNATIONAL->LAPSED
              because the side_effect of step 2 explicitly cascades any PCT in INTERNATIONAL whose
              national_phase_deadline_at is also passed.
          Each link is caused by the previous link, not by the original clock-advance.
        test_recipe:
          setup:
            - "Grant a UTILITY app at SystemClock=2024-01-01; STAGE_3_5 MaintenanceFee has due_at=2027-07-01, grace_period_end_at=2028-01-01"
            - "Initiate PCT on that same UTILITY app right after grant; PCTPhase.national_phase_deadline_at = 2029-07-01 (later than the grace period)"
          trigger:
            - "POST /_clock/advance {to:'2029-07-02T00:00:00Z'} as USPTOAdmin (one clock advance crossing both deadlines)"
          assert:
            - "MaintenanceFee.status == LAPSED (link 1)"
            - "Application.status == EXPIRED (link 2, caused by link 1, NOT by the clock)"
            - "PCTPhase.status == LAPSED (link 3, caused by link 2's side_effect)"
            - "AuditEvent stream contains MAINTENANCE_FEE_LAPSED then APPLICATION_EXPIRED then PCT_LAPSED in causal order"

      - name: application_abandon_triggers_office_action_close_triggers_maintenance_purge  # depth 3, DIFFERENT trigger
        grounds:
          - state_machines.Application.FILED_to_ABANDONED
          - state_machines.Application
          - entities.OfficeAction.fields.status
          - entities.MaintenanceFee.fields.status
        distinguishing_aspect: |
          Different originating trigger: POST /applications/{id}/abandon (NOT a clock sweep, NOT a maintenance
          lapse). Cascade chain: (1) Application FILED->ABANDONED. (2) The application's PENDING OfficeActions
          transition to ABANDONED_BY_DEFAULT BECAUSE the parent abandonment closed them. (3) Any SCHEDULED
          MaintenanceFee rows for that application are deleted BECAUSE step 2 left the application in a terminal
          ABANDONED state.
        test_recipe:
          setup:
            - "Reach OFFICE_ACTION_PENDING on app_x; precondition: pretend grant has already issued a STAGE_3_5 MaintenanceFee row for a sibling test using a hypothetically-granted-then-reopened case is NOT realistic; instead use OFFICE_ACTION_PENDING with a synthetic SCHEDULED MaintenanceFee in test fixture only if app reached GRANTED; for this recipe, use an app that has reached OFFICE_ACTION_PENDING with at least one PENDING OfficeAction"
          trigger:
            - "POST /applications/{app_x.id}/abandon as Applicant -> 200"
          assert:
            - "Application.status == ABANDONED (link 1)"
            - "OfficeAction.status == ABANDONED_BY_DEFAULT for every previously PENDING action on app_x (link 2)"
            - "Any SCHEDULED MaintenanceFee rows for app_x are deleted (link 3)"
            - "AuditEvent action == APPLICATION_ABANDONED_VOLUNTARY"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (≥ 2 instances; DIFFERENT error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_conflict_on_maintenance_pay
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - validations[priority=13]
          - errors.ERR_INVALID_STATE
          - errors.ERR_MAINTENANCE_WINDOW_CLOSED
          - errors.ERR_FEE_AMOUNT_MISMATCH
        distinguishing_aspect: |
          Category pair = `state` (priority 6) vs `business_fiscal` (priority 13). A MaintenanceFee that is
          ALREADY PAID (state violation) AND submitted with a wrong amount_cents must return ERR_INVALID_STATE
          (priority 6, 409) — NOT ERR_FEE_AMOUNT_MISMATCH (priority 13, 422). Priority ordering picks state.
        test_recipe:
          setup:
            - "Pay a MaintenanceFee mf1 in timely window, status becomes PAID"
          trigger:
            - "POST /applications/{app.id}/fees {fee_category:'MAINTENANCE', amount_cents: 1, maintenance_fee_id: mf1.id} as Applicant"
          assert:
            - "Server returns 409 ERR_INVALID_STATE (state wins over fiscal mismatch), NOT 422 ERR_FEE_AMOUNT_MISMATCH"

      - name: business_safety_vs_business_constraint_conflict_on_applicant_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_MICRO_INELIGIBLE
          - errors.ERR_CLAIM_SHAPE_INVALID
        distinguishing_aspect: |
          DIFFERENT category pair = `business_safety` (priority 8: ERR_MICRO_INELIGIBLE) vs `business_constraint`
          (priority 9: ERR_CLAIM_SHAPE_INVALID). When an applicant declares MICRO without meeting eligibility AND
          submits an application with claim_count=0 for a UTILITY type, the safety violation (priority 8) wins
          over the constraint violation (priority 9). Demonstrates a SECOND priority pair distinct from instance 1.
        test_recipe:
          setup:
            - "POST /applicants {name:'A', entity_size:'MICRO', gross_income_cents: 99999999999, prior_filings_count: 99} as USPTOAdmin -> 422 ERR_MICRO_INELIGIBLE"
            - "POST /applicants {name:'A', entity_size:'MICRO', gross_income_cents: 1000000, prior_filings_count: 0} as USPTOAdmin -> applicant_micro"
            - "Apply a sequence demonstrating: PATCH /applicants/{id} {entity_size:'MICRO', gross_income_cents: 99999999999, prior_filings_count: 99} would-violate-safety while a separate concurrent POST /applications would-violate-constraint; for assertion, focus on individual prioritization via the validation table priority order"
          trigger:
            - "POST /applicants {name:'B', entity_size:'MICRO', gross_income_cents: 99999999999, prior_filings_count: 99} as USPTOAdmin"
            - "POST /applications {applicant_id: applicant_micro.id, application_type:'UTILITY', title:'t', claim_count: 0, independent_claim_count: 0} as Applicant(micro)"
          assert:
            - "First call returns 422 ERR_MICRO_INELIGIBLE (priority 8 / business_safety)"
            - "Second call returns 422 ERR_CLAIM_SHAPE_INVALID (priority 9 / business_constraint) because the applicant is already valid"
            - "Category pair {business_safety, business_constraint} is structurally distinct from instance 1's {state, business_fiscal}"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (≥ 2 instances; DIFFERENT metrics; DIFFERENT endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: office_action_extended_deadline_inclusive_boundary   # >= boundary on temporal metric
        grounds:
          - validations[priority=10]
          - entities.OfficeAction.fields.extended_deadline_at
          - errors.ERR_OFFICE_ACTION_DEADLINE_PASSED
          - state_machines.Application.OFFICE_ACTION_PENDING_to_UNDER_EXAMINATION
        distinguishing_aspect: |
          Metric = OfficeAction temporal deadline. Endpoint = POST /office-actions/{id}/responses.
          Boundary = `<=`: a response filed EXACTLY at SystemClock.now == extended_deadline_at MUST be accepted;
          one second past MUST be rejected. Distinguishes `<` vs `<=`.
        test_recipe:
          setup:
            - "Create OA at SystemClock=2024-01-01; extended_deadline_at = 2024-06-29T00:00:00Z (issued_at + 180 days)"
          trigger:
            - "POST /_clock/advance {to:'2024-06-29T00:00:00Z'} as USPTOAdmin"
            - "POST /applications/{app.id}/fees {fee_category:'EXTENSION', amount_cents: ..., office_action_id: oa.id} as Applicant"
            - "POST /office-actions/{oa.id}/responses as Applicant -> expect 201"
            - "Then later, repeat with a SECOND OA on a SECOND app and advance to 2024-06-29T00:00:01Z; expect 409 ERR_OFFICE_ACTION_DEADLINE_PASSED"
          assert:
            - "Response at exactly extended_deadline_at succeeds (boundary inclusive)"
            - "Response at extended_deadline_at + 1s fails with ERR_OFFICE_ACTION_DEADLINE_PASSED"

      - name: provisional_with_zero_claims_empty_set_boundary   # zero-count edge on count metric, DIFFERENT endpoint
        grounds:
          - validations[priority=9]
          - entities.Application.fields.claim_count
          - entities.Application.fields.independent_claim_count
          - errors.ERR_CLAIM_SHAPE_INVALID
        distinguishing_aspect: |
          DIFFERENT metric = integer claim_count (NOT a datetime). DIFFERENT endpoint = POST /applications (NOT
          POST /office-actions/{id}/responses). Boundary semantics = exact-zero edge: PROVISIONAL REQUIRES
          claim_count==0 AND independent_claim_count==0; UTILITY/DESIGN REQUIRE claim_count>=1 AND
          independent_claim_count>=1. claim_count==0 on UTILITY fails; claim_count==1 on UTILITY succeeds; the
          edge value 0 vs 1 is the boundary.
        test_recipe:
          setup:
            - "POST /applicants {name:'A', entity_size:'SMALL'} -> applicant"
          trigger:
            - "POST /applications {applicant_id, application_type:'UTILITY', title:'t', claim_count: 0, independent_claim_count: 0} as Applicant -> 422 ERR_CLAIM_SHAPE_INVALID"
            - "POST /applications {applicant_id, application_type:'UTILITY', title:'t', claim_count: 1, independent_claim_count: 1} as Applicant -> 201"
            - "POST /applications {applicant_id, application_type:'PROVISIONAL', title:'t', claim_count: 0, independent_claim_count: 0} as Applicant -> 201"
            - "POST /applications {applicant_id, application_type:'PROVISIONAL', title:'t', claim_count: 1, independent_claim_count: 0} as Applicant -> 422 ERR_CLAIM_SHAPE_INVALID"
          assert:
            - "UTILITY with claim_count=0 fails; UTILITY with claim_count=1 succeeds"
            - "PROVISIONAL with claim_count=0 succeeds; PROVISIONAL with claim_count=1 fails"
            - "Boundary at exact 0 vs 1 is precisely enforced"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (≥ 2 instances; DIFFERENT entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_allow_depends_on_office_action_status   # Pair = (Application, OfficeAction)
        grounds:
          - state_machines.Application.UNDER_EXAMINATION_to_ALLOWED
          - entities.OfficeAction.fields.status
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair = (Application, OfficeAction). Application can transition UNDER_EXAMINATION->ALLOWED ONLY
          IF every OfficeAction for that application has status != PENDING. Application's valid next-state set
          depends on the child entity OfficeAction's state.
        test_recipe:
          setup:
            - "Bring application to UNDER_EXAMINATION"
            - "Issue an OfficeAction oa1 (status becomes PENDING) -> Application now OFFICE_ACTION_PENDING"
            - "Reset for an explicit scenario: ensure application has at least one OfficeAction in PENDING when /allow is called"
          trigger:
            - "POST /applications/{app.id}/allow as Examiner"
          assert:
            - "Returns 409 ERR_INVALID_STATE because Application.status != UNDER_EXAMINATION when a PENDING OA exists; or, if forced to UNDER_EXAMINATION via response, allow succeeds only after OA.status == RESPONDED"
            - "Allow succeeds (200) ONLY after every OfficeAction.status IN {RESPONDED, ABANDONED_BY_DEFAULT}"

      - name: pct_initiation_depends_on_application_status_and_type   # Pair = (PCTPhase, Application) — DIFFERENT pair
        grounds:
          - validations[priority=16]
          - entities.Application.fields.application_type
          - entities.Application.fields.status
          - errors.ERR_PCT_INELIGIBLE
        distinguishing_aspect: |
          DIFFERENT entity pair = (PCTPhase, Application). A PCTPhase creation depends on the parent Application
          being UTILITY AND in {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING}. Distinct from instance 1 which
          involves Application↔OfficeAction. PCTPhase's valid creation is gated by Application state+type.
        test_recipe:
          setup:
            - "Create a DESIGN app (filed)"
            - "Create a UTILITY app (filed)"
            - "Create a UTILITY app and grant it"
          trigger:
            - "POST /applications/{design_app.id}/pct-phases as Applicant -> 422 ERR_PCT_INELIGIBLE"
            - "POST /applications/{util_filed.id}/pct-phases as Applicant -> 201"
            - "POST /applications/{util_granted.id}/pct-phases as Applicant -> 422 ERR_PCT_INELIGIBLE"
          assert:
            - "PCT initiation succeeds only when parent Application.application_type == UTILITY AND status IN {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING}"
            - "DESIGN parent fails; GRANTED parent fails; both return ERR_PCT_INELIGIBLE"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (≥ 2 instances; DIFFERENT interval semantics; DIFFERENT resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_fee_window_half_open_with_grace_extension   # closed-on-both-ends window with surcharge band
        grounds:
          - validations[priority=11]
          - entities.MaintenanceFee.fields.window_open_at
          - entities.MaintenanceFee.fields.due_at
          - entities.MaintenanceFee.fields.grace_period_end_at
          - calculations.maintenance_fee.variants.timely
          - calculations.maintenance_fee.variants.grace
        distinguishing_aspect: |
          Resource = MaintenanceFee. Interval semantics = a TWO-BAND CLOSED interval
          [window_open_at, due_at] (no surcharge) extended by (due_at, grace_period_end_at] (surcharge applies).
          A payment SystemClock.now == window_open_at is accepted (inclusive left); SystemClock.now ==
          grace_period_end_at is accepted (inclusive right); SystemClock.now == due_at is the TIMELY/GRACE band
          boundary that switches surcharge on. Outside the union, ERR_MAINTENANCE_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Grant UTILITY app at 2024-01-01; STAGE_3_5 MaintenanceFee: window_open_at=2027-01-01, due_at=2027-07-01, grace_period_end_at=2028-01-01"
          trigger:
            - "POST /_clock/advance {to:'2026-12-31T23:59:59Z'} -> pay -> 409 ERR_MAINTENANCE_WINDOW_CLOSED (before window)"
            - "POST /_clock/advance {to:'2027-01-01T00:00:00Z'} -> pay -> 200 (left-inclusive)"
            - "POST /_clock/advance {to:'2028-01-01T00:00:00Z'} -> pay -> 200 (right-inclusive grace, with surcharge)"
            - "POST /_clock/advance {to:'2028-01-01T00:00:01Z'} -> pay -> 409 ERR_MAINTENANCE_WINDOW_CLOSED"
          assert:
            - "Payment at window_open_at exactly: succeeds, no surcharge"
            - "Payment at grace_period_end_at exactly: succeeds, with flat surcharge (timely vs grace band switch at due_at)"
            - "Payment 1 second after grace_period_end_at: rejected ERR_MAINTENANCE_WINDOW_CLOSED"

      - name: pct_national_phase_single_deadline_inclusive   # single-deadline inclusive interval — DIFFERENT semantics
        grounds:
          - validations[priority=12]
          - entities.PCTPhase.fields.national_phase_deadline_at
          - errors.ERR_PCT_DEADLINE_PASSED
        distinguishing_aspect: |
          DIFFERENT resource = PCTPhase. DIFFERENT interval semantics = a SINGLE-DEADLINE inclusive bound (no
          surcharge band, no grace extension): national entry is permitted iff SystemClock.now <=
          national_phase_deadline_at — a single half-line (-∞, deadline] rather than MaintenanceFee's two-band
          [open, due] ∪ (due, grace]. No multi-band geometry; no surcharge step.
        test_recipe:
          setup:
            - "Create UTILITY app, initiate PCTPhase; national_phase_deadline_at = priority_date + 30 months"
          trigger:
            - "POST /_clock/advance to exactly national_phase_deadline_at -> enter-national -> 200"
            - "Reset with a sibling PCTPhase; advance to national_phase_deadline_at + 1s -> enter-national -> 409 ERR_PCT_DEADLINE_PASSED"
          assert:
            - "Entry at exactly the deadline succeeds (inclusive)"
            - "Entry 1 second after fails ERR_PCT_DEADLINE_PASSED"
            - "Interval shape differs from MaintenanceFee: no opening boundary, no surcharge band — a single right-bounded inclusive interval"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (≥ 2 instances on DIFFERENT conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_invariant_under_abandon_after_filing
        grounds:
          - entities.FeeTransaction
          - entities.Application.fields.total_fees_paid_cents
          - calculations.total_fees_paid
          - state_machines.Application.FILED_to_ABANDONED
        distinguishing_aspect: |
          Conserved quantity = `sum(FeeTransaction.amount_cents WHERE application_id == app.id)` (the
          ledger total). Pinned invariant: for any application app,
            sum(FeeTransaction.amount_cents WHERE application_id == app.id) == Application.total_fees_paid_cents
          ALWAYS holds — including after a FILED->ABANDONED transition. Filing fees are NEVER refunded by the
          abandon transition (USPTO fees are non-refundable). The forward action FILE deposits N cents; the
          compensating action ABANDON leaves N cents in place. Drift in either direction is a violation.
        test_recipe:
          setup:
            - "Create applicant_small; create UTILITY application app1; pay FILING fee 16000c; file"
            - "Snapshot total_fees_paid_cents = 16000c, sum(FeeTransaction.amount_cents)=16000c"
          trigger:
            - "POST /applications/{app1.id}/abandon as Applicant -> 200"
          assert:
            - "Application.total_fees_paid_cents == 16000 after abandon (UNCHANGED)"
            - "sum(FeeTransaction.amount_cents WHERE application_id == app1.id) == 16000 (UNCHANGED, no refund row inserted)"
            - "Ledger invariant: total_fees_paid_cents == sum(FeeTransaction.amount_cents) BEFORE and AFTER abandon"

      - name: office_action_count_invariant_under_response_cycle
        grounds:
          - entities.OfficeAction
          - entities.OfficeAction.fields.action_number
          - state_machines.Application.UNDER_EXAMINATION_to_OFFICE_ACTION_PENDING
          - state_machines.Application.OFFICE_ACTION_PENDING_to_UNDER_EXAMINATION
        distinguishing_aspect: |
          DIFFERENT conserved quantity = `count(OfficeAction WHERE application_id == app.id)` (the OA cardinality)
          AND `max(OfficeAction.action_number) == count(OfficeAction)`. Pinned invariant: for any application,
            count(OfficeAction WHERE application_id == app.id) == max(OfficeAction.action_number for app.id)
          after every response transition. The forward action ISSUE_OA increments count by 1 and assigns
          action_number = previous_max + 1; the compensating action RESPONSE consumes the OA (status->RESPONDED)
          but DOES NOT delete the row, so count and max action_number remain equal — never gaps, never collisions.
        test_recipe:
          setup:
            - "Bring application to UNDER_EXAMINATION"
          trigger:
            - "Issue OA1 (action_number=1), respond, issue OA2 (action_number=2), respond, issue OA3 (action_number=3)"
          assert:
            - "After each cycle: count(OfficeAction WHERE application_id == app.id) == max(OfficeAction.action_number)"
            - "Conserved quantity is OA cardinality (distinct from instance 1's fee-cents ledger)"
            - "No deletions; action_number is dense [1..N] with no gaps"
