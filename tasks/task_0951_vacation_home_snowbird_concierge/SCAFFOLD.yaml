    side_effects: ["re-runs the whole cost chain", "continues to APPROVED inside the same request with approved_by_user_id 'system' when approval_required is false"]
    gates: [G1, G2, G3, G5, G10]
  - method: POST
    path: "/property-care/work-orders/{id}/approve"
    description: "Approves a pending work order. On the ROUTINE pipeline the approver must be the Owner; on the STORM pipeline it is the StormCoordinator and the Owner rung is not consulted."
    roles: [Owner, StormCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["sets approved_by_user_id to X-User-ID"]
    gates: [G1, G2, G3, G5]
  - method: POST
    path: "/property-care/work-orders/{id}/reject"
    description: "Rejects a pending work order and returns the finding to TRIAGED."
    roles: [Owner, StormCoordinator, PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: WorkOrder
    side_effects: ["Finding WORK_ORDERED -> TRIAGED"]
    gates: [G1, G2, G3, G5, G10]
  - method: POST
    path: "/property-care/work-orders/{id}/dispatch"
    description: "Selects a vendor and creates the offer, then chains a key issuance, an access grant and a code rotation."
    roles: [Dispatcher, StormCoordinator]
    code: 200
    input: [window_start_at, window_end_at]
    output: WorkOrder
    side_effects: ["runs calculation vendor_selection", "increments dispatch_attempt_count", "creates a VendorAssignment OFFERED", "runs calculation key_selection and creates a KeyIssuance, or stamps access_blocked_flag true when the pool is empty", "the issuance creates an AccessGrant, which rotates a LOCKBOX code and invalidates earlier grants", "freezes StormResponse.surcharge_pct_at_dispatch and WorkOrder.surcharge_pct_applied on the STORM pipeline"]
    gates: [G1, G2, G3, G5, G7, G8, G10]
  - method: POST
    path: "/property-care/work-orders/{id}/complete"
    description: "Records actuals and recomputes the cost chain."
    roles: [Vendor, Dispatcher]
    code: 200
    input: [actual_labour_hours, actual_parts_cents]
    output: WorkOrder
    side_effects: ["re-runs labour_cost, vendor_markup, work_order_storm_surcharge and work_order_total from the actuals", "clears KeyAsset.rekey_pending_flag on a REKEY work order"]
    gates: [G1, G2, G3, G5, G10]
  - method: POST
    path: "/property-care/work-orders/{id}/invoice"
    description: "Appends the work order's total to a draft invoice."
    roles: [AccountManager, PlatformAdmin]
    code: 200
    input: [invoice_id]
    output: WorkOrder
    side_effects: ["creates one ACTIVE InvoiceLine with line_type WORK_ORDER and amount_cents equal to WorkOrder.total_cents", "re-derives Invoice.storm_surcharge_pct and every step of calculation invoice_total"]
    gates: [G1, G2, G3, G5, G10]

