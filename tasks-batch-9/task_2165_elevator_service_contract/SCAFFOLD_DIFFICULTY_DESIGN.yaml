      - name: renegotiation_round_cycles_open_countered_open_countered_open
        grounds:
          - state_machines.RenegotiationRound.status.OPEN_to_COUNTERED
          - state_machines.ServiceContract.status.ACTIVE_to_UNDER_RENEGOTIATION
          - calculations.contract_performance_score
          - entities.RenegotiationRound.fields.round_number
          - endpoints[POST /elevator-program/renegotiations/{roundId}/counter]
        distinguishing_aspect: |
          Non-linearity on ENTITY RenegotiationRound takes the CYCLE form: OPEN -> COUNTERED spawns a
          fresh OPEN successor, so the negotiation returns to the same state shape twice in a row
