            - call: "POST /water/transfer-requests/${tr1_id}/decide"
              payload: { decision: "APPROVE" }
              as: RegionalDirector
          assert:
            - "the first approve returns 409 with error_id == ERR_REVIEW_PENDING"
            - "after DISMISSED the retry succeeds: TransferRequest.${tr1_id}.status == APPROVED and objection_window_end is 72h after the clock"

      - name: review_filed_after_window_closed_rejected
