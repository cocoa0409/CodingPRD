scaffold_corner_design:
- section: entities
  instances:
  - name: employer_create_returns_all_fields_and_active_status
    claim_type: Creation
    grounds:
    - entities.Employer
    - endpoints.POST_/employers
    distinguishing_aspect: Creating an employer returns 201 with status ACTIVE, version 1, system id/created_at/updated_at, and the baseline_rate_book echoed exactly.
    test_recipe:
      setup:
      - Clock 2026-09-01T00:00:00Z. Empty database. One rate book.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-EN1
          rates:
            ORTHO_JOINT: 2500000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      trigger:
      - call: POST /coe/employers
        payload:
          legal_name: Acme Corp
          ein: E-EN1
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      assert:
      - response 201, response_type object
      - Employer.${emp}.legal_name == "Acme Corp" and ein == "E-EN1"
      - Employer.${emp}.baseline_rate_book == ${rb}
      - Employer.${emp}.status == ACTIVE and version == 1
      - id, created_at, updated_at are non-null; meta.api_request_id present
  - name: episode_get_not_found_returns_404
    claim_type: Not Found
    grounds:
    - endpoints.GET_/episodes/{episode_id}
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but non-existent episode UUID returns 404 ERR_NOT_FOUND, not a 500 or empty object.
    test_recipe:
      setup:
      - Clock at default. Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /coe/episodes/11111111-2222-3333-4444-555555555555
        payload: {}
        as: ProgramAdmin
        captures:
          err: $.data.error_id
      assert:
      - response 404 with error_id ERR_NOT_FOUND
      - response_type == error and data.message is non-empty
  - name: episode_create_missing_patient_id_returns_invalid_request
    claim_type: Required Fields
    grounds:
    - endpoints.POST_/episodes
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required field patient_id from intake yields 400 ERR_INVALID_REQUEST before any state or FK check runs.
    test_recipe:
      setup:
      - Clock 2026-09-01. Empty database.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: POST /coe/episodes
        payload:
          contract_id: 11111111-2222-3333-4444-555555555555
          intake_request_id: IR-EN3
        as: CareCoordinator
        captures:
          err: $.data.error_id
      assert:
      - response 400 with error_id ERR_INVALID_REQUEST
  - name: episode_triage_rank_defaults_to_zero
    claim_type: Defaults
    grounds:
    - entities.Episode.fields.triage_rank
    distinguishing_aspect: An intake that omits triage_rank stores 0 (elective); the field is never null.
    test_recipe:
      setup:
      - Clock 2026-09-01. Employer + ACTIVE contract + patient.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-EN4
          rates:
            ORTHO_JOINT: 2500000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Tau
          ein: E-EN4
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      - call: POST /coe/bundle-templates
        payload:
          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 3000000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 0
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          ctr: $.data.id
      - call: POST /coe/patients
        payload:
          employer_id: ${emp}
          full_name: Pat S
          dob: '1970-01-01'
          member_id: M-EN4
        as: CareCoordinator
        captures:
          pa: $.data.id
      trigger:
      - call: POST /coe/episodes
        payload:
          patient_id: ${pa}
          contract_id: ${ctr}
          intake_request_id: IR-EN4
        as: CareCoordinator
        captures:
          ep: $.data.id
      assert:
      - Episode.${ep}.triage_rank == 0 (default applied; elective)
      - Episode.${ep}.status == INTAKE_PENDING and version == 1
  - name: episode_estimated_total_billed_is_computed_not_stored
    claim_type: Computed Fields
    grounds:
    - entities.Episode.fields.estimated_total_billed_cents
    - calculations.estimated_total_billed
    distinguishing_aspect: After an ADMINISTERED travel benefit of 70000, the employer-view estimate rises by exactly the unreleased accrual — the field reflects live cross-entity data, not a value stored
      at intake.
    test_recipe:
      setup:
      - Clock 2026-09-01. Baseline ORTHO_JOINT rate 2500000. Episode approved with one ADMINISTERED benefit of 70000.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-EN5
          rates:
            ORTHO_JOINT: 2500000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Upsilon
          ein: E-EN5
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      - call: POST /coe/bundle-templates
        payload:
          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 3000000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 500000
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          ctr: $.data.id
      - call: POST /coe/contracts/${ctr}/activate
        payload: {}
        as: ProgramAdmin
      - call: POST /coe/patients
        payload:
          employer_id: ${emp}
          full_name: Pat T
          dob: '1970-02-02'
          member_id: M-EN5
        as: CareCoordinator
        captures:
          pa: $.data.id
      - call: POST /coe/episodes
        payload:
          patient_id: ${pa}
          contract_id: ${ctr}
          intake_request_id: IR-EN5
        as: CareCoordinator
        captures:
          ep: $.data.id
          ep_v: $.data.version
      - call: POST /coe/episodes/${ep}/screenings
        payload:
          doc_type: LAB
          result: CANDIDATE
        as: CareCoordinator
      - call: POST /coe/episodes/${ep}/reviews
        payload:
          conclusion: SURGERY_INDICATED
          expected_episode_version: ${ep_v}
        captures:
          occ_v77: $.data.version
        as: PhysicianReviewer
      trigger:
      - call: POST /coe/episodes/${ep}/benefits
        payload:
          kind: TRAVEL
          traveler: PATIENT
          amount_cents: 70000
          expected_episode_version: ${occ_v77}
        captures:
          occ_v78: $.data.version
        as: CareCoordinator
      - call: GET /coe/episodes/${ep}
        payload: {}
        as: ProgramAdmin
      assert:
      - Episode.${ep}.estimated_total_billed_cents == 2570000 (2500000 baseline + 70000 unreleased accrual)
  - name: screening_record_is_immutable_no_update_endpoint
    claim_type: Immutability
    grounds:
    - state_machines.Screening
    distinguishing_aspect: 'Screening has no update or delete endpoint (common_fields: false); after creation only list/read via the episode sub-resource is possible, and the recorded row never changes.'
    test_recipe:
      setup:
      - Clock 2026-09-01. Episode in SCREENING with one LAB screening recorded.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-EN6
          rates:
            ORTHO_JOINT: 2500000
