        distinguishing_aspect: "The floor and the tally are computed by different rules and can disagree. BOUNDARY_VIOLATION has base index 4 and mitigation 3 (clean ATD record plus fully produced evidence), so ceil(-3/2) = -1 freezes the floor at PROBATION (3); two FINE votes out of three seats clear the 5001 bp majority for tier 2 but no seat supports tier 3, so the tally adopts FINE and the order is refused, leaving the proceeding in DELIBERATION rather than rolling back the adopted tier."
