            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "SERVICE", description: "stale" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c_old_id: $.data.id }
            - call: "POST /complaints/${c_old_id}/forward"
              payload: {}
