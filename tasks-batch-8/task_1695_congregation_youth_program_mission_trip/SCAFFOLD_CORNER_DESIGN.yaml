        grounds:
          - state_machines.Trip.IN_PROGRESS_to_DEBRIEFED
          - state_machines.Registration.CONFIRMED_to_COMPLETED
          - state_machines.Program.OPEN_to_CLOSED
        distinguishing_aspect: "The full happy-path lifecycle closes the loop: debrief records the report payload, cascades CONFIRMED registrations to COMPLETED and closes their accounts, and only then does program close succeed — the post-trip reporting requirement gates program closure."
