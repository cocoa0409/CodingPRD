# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0667 — Pre-Purchase Vehicle Inspection & VIN History
# 9 rule_ids × ≥2 instances = 18 instances total
# All formula-derived asserts are precomputed literals (see contract item 7).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_estimated_vs_final_late_credit_on_order
        grounds:
          - calculations.fee_estimated
          - calculations.fee_final
          - entities.InspectionOrder.fields.estimated_fee_cents
          - entities.InspectionOrder.fields.fee_total_cents
          - state_machines.InspectionOrder.REPORTED_to_DELIVERED
        distinguishing_aspect: |
          Same EXPRESS order (subtotal 35000, rush_after 6300): the estimated variant bills the full
          discounted rush surcharge (41300) while the final variant credits the entire surcharge when
          delivered late (35000); both calculations operate on the InspectionOrder fee domain.
        test_recipe:
          setup:
            - "FeeSchedule PREMIUM base=25000 vin_history=4000 per_mile=150 created."
            - "Account DEALER net_terms_days=30 rush_discount_pct=0.10 created (ACTIVE)."
            - "Clock at 2026-06-01T00:00:00Z; EXPRESS order created -> estimated 34220 (no dispatch yet), sla_deadline 2026-06-03T00:00:00Z."
            - "Dispatch offer with dispatch_miles=40 re-quotes estimated to 41300; inspector (certified PREMIUM) accepts -> order DISPATCHED."
            - "Report created, submitted (PASS); order PAID; clock advanced to 2026-06-05T00:00:00Z (past deadline) before delivery."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "PREMIUM", base_fee_cents: 25000, vin_history_fee_cents: 4000, per_mile_dispatch_cents: 150 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "DEALER", legal_name: "Acme Motors", email: "ops@acme.test", net_terms_days: 30, rush_discount_pct: 0.10 }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Pat Inspector", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["PREMIUM"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.05, location_lng: -118.25, include_vin_history: true, rush_tier: "EXPRESS" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 40, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 60000, points_total: 120, points_failed: 2, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /vin-reports"
              payload: { order_id: "${ord_id}" }
              as: OpsAdmin
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: OpsAdmin
          assert:
            - "InspectionOrder.${ord_id}.estimated_fee_cents == 41300"
            - "InspectionOrder.${ord_id}.fee_total_cents == 35000"
            - "InspectionOrder.${ord_id}.late_delivery == true"

      - name: vin_risk_clean_vs_branded_on_vehicle
        grounds:
          - calculations.vin_risk_score
          - entities.VinReport.fields.risk_score
          - entities.VinReport.fields.worst_branding
          - entities.VinHistoryRecord.fields.branding_code
        distinguishing_aspect: |
          The vin_risk_score calculation diverges on the Vehicle/VIN domain (not the Order fee domain):
          a clean-title vehicle (NONE branding, 2 titles, 1 open recall) scores 17 while a branded one
          (SALVAGE, 3 titles, rollback, 2 open recalls) clamps to 100.
        test_recipe:
          setup:
            - "Vehicle V_BRANDED registered with SALVAGE branding record, 3 TITLE records, two ODOMETER records showing rollback, and matching open recalls."
            - "Order O_BRANDED created against V_BRANDED with include_vin_history (so a VinReport can compile)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer One", email: "b1@x.test", net_terms_days: 0 }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "2T1BURHE0JC014598", year: 2018, make: "Toyota", model: "Corolla" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /vehicles/${veh_id}/history-records"
              payload: { record_type: "BRANDING", event_date: "2021-05-01T00:00:00Z", branding_code: "SALVAGE" }
              as: OpsAdmin
            - call: "POST /vehicles/${veh_id}/history-records"
              payload: { record_type: "TITLE", event_date: "2019-01-01T00:00:00Z", title_state: "CA" }
              as: OpsAdmin
            - call: "POST /vehicles/${veh_id}/history-records"
              payload: { record_type: "TITLE", event_date: "2020-01-01T00:00:00Z", title_state: "NV" }
              as: OpsAdmin
            - call: "POST /vehicles/${veh_id}/history-records"
              payload: { record_type: "TITLE", event_date: "2021-06-01T00:00:00Z", title_state: "TX" }
              as: OpsAdmin
            - call: "POST /vehicles/${veh_id}/history-records"
              payload: { record_type: "ODOMETER", event_date: "2020-02-01T00:00:00Z", odometer_value: 50000 }
              as: OpsAdmin
            - call: "POST /vehicles/${veh_id}/history-records"
              payload: { record_type: "ODOMETER", event_date: "2021-02-01T00:00:00Z", odometer_value: 49800 }
              as: OpsAdmin
            - call: "POST /recall-records"
              payload: { campaign_id: "RC-1", year: 2018, make: "Toyota", model: "Corolla", severity: "HIGH" }
              as: OpsAdmin
            - call: "POST /recall-records"
              payload: { campaign_id: "RC-2", year: 2018, make: "Toyota", model: "Corolla", severity: "MEDIUM" }
              as: OpsAdmin
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, include_vin_history: true, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /vin-reports"
              payload: { order_id: "${ord_id}" }
              as: OpsAdmin
              captures: { vr_id: $.data.id }
          assert:
            - "VinReport.${vr_id}.worst_branding == SALVAGE"
            - "VinReport.${vr_id}.title_count == 3"
            - "VinReport.${vr_id}.odometer_rollback == true"
            - "VinReport.${vr_id}.open_recall_count == 2"
            - "VinReport.${vr_id}.risk_score == 100"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: condition_score_multi_input_nonlinear      # mode (a)
        grounds:
          - calculations.condition_score
          - entities.InspectionReport.fields.condition_score
          - entities.InspectionReport.fields.outcome
          - state_machines.InspectionReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          condition_score combines ≥3 inputs with non-linear interaction (pass-ratio, road-test +5 bonus,
          and a per-critical-photo penalty capped at 40) — 95 raw + 5 bonus - 15 critical = 85, yet the
          critical-photo presence forces outcome FAIL regardless of score. Mode (a) multi-input non-linear.
        test_recipe:
          setup:
            - "Order dispatched & in-progress with an ACCEPTED assignment; a DRAFT report with points_total=100, points_failed=5, road_test_done=true and exactly ONE critical photo."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer Two", email: "b2@x.test", net_terms_days: 0 }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1FA6P8TH5J5101234", year: 2018, make: "Ford", model: "Mustang" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Sam Field", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["STANDARD"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 10, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 30000, points_total: 100, points_failed: 5, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/photos"
              payload: { caption: "cracked frame", is_critical: true, url: "http://x/1.jpg" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspection-reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "InspectionReport.${rep_id}.condition_score == 85.0"
            - "InspectionReport.${rep_id}.outcome == FAIL"

      - name: dispute_refund_pinned_eval_order            # mode (c)
        grounds:
          - calculations.dispute_refund
          - entities.Dispute.fields.approved_cents
          - entities.InspectionOrder.fields.fee_total_cents
          - entities.InspectionOrder.fields.refunded_cents
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED
        distinguishing_aspect: |
          approved_cents resolves a circular-looking dependency by PINNED order: reason_cap (floor(fee_total*0.50)),
          refundable_ceiling (fee_total - prior refunded), and claimed are reconciled by min(); for a MISSED_DEFECT
          on a 41300 on-time order with claimed 30000 the cap floor(20650)=20650 wins. Mode (c) pinned evaluation order.
        test_recipe:
          setup:
            - "Same delivered ON-TIME EXPRESS order as fee dual-variant but delivered before deadline -> fee_total 41300, late_delivery false, refunded 0."
            - "AccountHolder files a MISSED_DEFECT dispute claiming 30000; ops starts review."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "PREMIUM", base_fee_cents: 25000, vin_history_fee_cents: 4000, per_mile_dispatch_cents: 150 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "DEALER", legal_name: "Acme Motors", email: "ops2@acme.test", net_terms_days: 30, rush_discount_pct: 0.10 }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Pat Inspector", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["PREMIUM"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.05, location_lng: -118.25, include_vin_history: true, rush_tier: "EXPRESS" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 40, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 60000, points_total: 120, points_failed: 2, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /vin-reports"
              payload: { order_id: "${ord_id}" }
              as: OpsAdmin
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T12:00:00Z" }
              as: OpsAdmin
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: OpsAdmin
            - call: "POST /disputes"
              payload: { order_id: "${ord_id}", report_id: "${rep_id}", reason: "MISSED_DEFECT", claimed_cents: 30000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /disputes/${dsp_id}/start-review"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /disputes/${dsp_id}/resolve"
              payload: {}
              as: OpsAdmin
          assert:
            - "InspectionOrder.${ord_id}.fee_total_cents == 41300"
            - "Dispute.${dsp_id}.approved_cents == 20650"
            - "InspectionOrder.${ord_id}.refunded_cents == 20650"
            - "InspectionOrder.${ord_id}.payment_status == REFUNDED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_workflow_and_payment_axes
        grounds:
          - state_machines.InspectionOrder.UNPAID_to_PAID
          - state_machines.InspectionOrder.DRAFT_to_DISPATCHED
          - entities.InspectionOrder.fields.workflow_status
          - entities.InspectionOrder.fields.payment_status
        distinguishing_aspect: |
          InspectionOrder carries two independent state axes: paying an order (UNPAID->PAID) while it is
          still DRAFT advances payment_status without touching workflow_status, proving the two dimensions
          evolve independently on the same row. Parallel-dimension non-linear shape on InspectionOrder.
        test_recipe:
          setup:
            - "A DRAFT order exists (UNPAID, workflow DRAFT)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer Three", email: "b3@x.test", net_terms_days: 0 }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "3VWLL7AJ9BM012345", year: 2017, make: "VW", model: "Jetta" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "InspectionOrder.${ord_id}.payment_status == PAID"
            - "InspectionOrder.${ord_id}.workflow_status == DRAFT"

      - name: dispute_cyclic_needs_info_loop
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Dispute.NEEDS_INFO_to_OPEN
          - state_machines.Dispute.OPEN_to_UNDER_REVIEW
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          Dispute is cyclic: OPEN->UNDER_REVIEW->NEEDS_INFO->OPEN returns the dispute to OPEN for another
          review round (a true A->B->C->A loop), distinct from the InspectionOrder parallel machine.
        test_recipe:
          setup:
            - "A dispute on a delivered order is OPEN; ops starts review then requests info; account supplies info."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer Four", email: "b4@x.test", net_terms_days: 0 }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "5YJ3E1EA7KF317001", year: 2019, make: "Tesla", model: "Model3" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Lee Field", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["STANDARD"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 10, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 20000, points_total: 100, points_failed: 10, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: OpsAdmin
            - call: "POST /disputes"
              payload: { order_id: "${ord_id}", report_id: "${rep_id}", reason: "LATE_DELIVERY", claimed_cents: 1000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /disputes/${dsp_id}/start-review"
              payload: {}
              as: OpsAdmin
            - call: "POST /disputes/${dsp_id}/request-info"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /disputes/${dsp_id}/supply-info"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "Dispute.${dsp_id}.status == OPEN"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_resolve_refund_chain_depth3
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED
          - entities.InspectionOrder.fields.refunded_cents
          - entities.InspectionOrder.fields.payment_status
          - entities.InspectionReport.fields.status
          - calculations.dispute_refund
        distinguishing_aspect: |
          Resolving a MISSED_DEFECT dispute triggers a depth-3 chain originating from the dispute resolve
          transition: resolve sets Dispute.approved_cents (link1) -> that approval mutates Order.refunded_cents
          and flips Order.payment_status PAID->REFUNDED (link2 caused by link1) -> the REFUNDED payment plus
          MISSED_DEFECT reason flips the linked InspectionReport SUBMITTED->AMENDED (link3 caused by link2's reason path).
        test_recipe:
          setup:
            - "Delivered ON-TIME EXPRESS order (fee_total 41300, PAID, refunded 0); MISSED_DEFECT dispute claiming 30000 is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "PREMIUM", base_fee_cents: 25000, vin_history_fee_cents: 4000, per_mile_dispatch_cents: 150 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
