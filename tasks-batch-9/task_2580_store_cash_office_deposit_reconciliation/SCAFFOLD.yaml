scenario: |
  Generate task harder than expert level!

  2580. Store Cash Office & Deposit Reconciliation (retail chain cash operations): register till assignment,
  starting bank issuance and blind count procedures at shift end, over-and-short tracking by cashier with
  thresholds triggering coaching and investigation, safe management with drop procedures, dual control and
  time-delay device policies, deposit preparation, armored carrier pickup scheduling and provisional credit
  timing, smart safe deployment with provisional credit and bank reconciliation of expected versus credited
  amounts, change order forecasting and denomination planning around seasonal demand, cash variance research
  across register, safe and bank with escalation for suspected theft, cashless and card settlement
  reconciliation to the daily sales journal

domain_name: store-cash-office-deposit-reconciliation
api_prefix: /cash-ops

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Eleven peer entities linked purely by foreign keys carried in request bodies. No parent id ever
  # appears in a URL path segment: `POST /cash-ops/cashiers` takes `store_id` in the body, never
  # `POST /cash-ops/stores/{id}/cashiers`. Templated path segments appear only for the acted-on
  # resource itself and its own action sub-paths (e.g. `POST /cash-ops/till-sessions/{id}/reconcile`).

  state_machine_shape: compound
  # SalesJournal.status is derived from the aggregate state of its TillSession, CardSettlement,
  # Deposit and VarianceCase children (compound), and the surface additionally carries a cyclic
  # machine (TillSession COUNTED -> PENDING_COUNT -> COUNTED via recount; Safe LOCKED ->
  # OPEN_REQUESTED -> UNLOCKED -> LOCKED), a parallel-dimension machine (Cashier till_eligibility
  # x coaching_state) and branching machines (Deposit -> {RECONCILED, DISCREPANT},
  # VarianceCase -> {EXPLAINED, ESCALATED}).

  relationship_patterns:
    - one_to_many          # Store -> Cashier/Safe/SalesJournal/ChangeOrder/BankCreditRecord
    - cross_aggregate      # SafeTransaction references Safe, TillSession, Deposit and ChangeOrder;
                           # VarianceCase references SalesJournal, Cashier and Deposit
    - polymorphic          # SafeTransaction.txn_type selects which of its three optional FK slots is populated

  role_model: segregation_of_duties
  # The blind counter may not reconcile the count; the safe-open requester may not execute the open;
  # the deposit preparer may not seal the bag; only LossPreventionInvestigator closes an escalated case.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_code
        type: string
        source: input
        description: "Chain-unique store number, e.g. S-1001"
        constraints: "unique across Store; 1-16 chars"
      - name: name
        type: string
        source: input
        description: "Store display name"
      - name: region_code
        type: string
        source: input
        description: "Chain region the store reports into"
      - name: safe_time_delay_minutes
        type: integer
        source: input
        description: "Time-delay device setting: minutes that must elapse between an open request and the open"
        default: 5
        constraints: ">= 0, <= 120"
      - name: safe_open_window_minutes
        type: integer
        source: input
        description: "Minutes after the delay elapses during which the open request stays executable"
        default: 10
        constraints: ">= 1, <= 240"
      - name: dual_control_required
        type: boolean
        source: input
        description: "When true, safe opens and deposit seals require a second, different X-User-ID"
        default: true
      - name: pickup_buffer_minutes
        type: integer
        source: input
        description: "Buffer applied to BOTH sides of an already-scheduled armored pickup window before overlap testing"
        default: 30
        constraints: ">= 0, <= 240"
      - name: max_daily_pickups
        type: integer
        source: input
        description: "Maximum armored pickups the store may have scheduled or in transit for one business_date"
        default: 2
        constraints: ">= 1, <= 6"
      - name: single_event_variance_threshold_cents
        type: integer
        source: input
        description: "Absolute per-session over/short at or above which the cashier is flagged for coaching"
        default: 2500
        constraints: ">= 0"
      - name: rolling_variance_threshold_cents
        type: integer
        source: input
        description: "Rolling absolute over/short at or above which the cashier is restricted and investigated"
        default: 10000
        constraints: ">= 0"
      - name: rolling_window_days
        type: integer
        source: input
        description: "Length in days of the rolling over/short window used for the rolling threshold"
        default: 30
        constraints: ">= 1, <= 365"
      - name: theft_escalation_threshold_cents
        type: integer
        source: input
        description: "Case total at or above which a VarianceCase is marked suspected_theft and can only end via loss-prevention escalation"
        default: 50000
        constraints: ">= 0"
      - name: provisional_credit_cap_cents
        type: integer
        source: input
        description: "Per-deposit ceiling on provisional credit, applied to both the smart-safe and carrier variants"
        default: 500000
        constraints: ">= 0"
      - name: seasonal_profile
        type: enum
        source: input
        description: "Default seasonal demand profile used by change-order forecasting"
        default: BASELINE
        constraints: "BASELINE | BACK_TO_SCHOOL | HOLIDAY"

  - name: Cashier
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store whose registers this cashier may be assigned to"
      - name: employee_code
        type: string
        source: input
        description: "Store-unique employee number"
        constraints: "unique within store_id"
      - name: display_name
        type: string
        source: input
        description: "Cashier display name"
      - name: till_eligibility
        type: enum
        source: system
        description: "Assignment dimension, independent of coaching_state: ELIGIBLE -> RESTRICTED on rolling-threshold breach, -> BARRED on loss-prevention escalation"
        default: ELIGIBLE
        constraints: "ELIGIBLE | RESTRICTED | BARRED"
      - name: coaching_state
        type: enum
        source: system
        description: "Coaching dimension, independent of till_eligibility: NONE -> COACHING_DUE on single-event breach -> COACHING_ACKNOWLEDGED at the next assignment"
        default: NONE
        constraints: "NONE | COACHING_DUE | COACHING_ACKNOWLEDGED"
      - name: coaching_due_at
        type: datetime
        source: computed
        description: "Deadline by which the coaching must be acknowledged: the single-event breach instant plus COACHING_GRACE_HOURS; null while coaching_state == NONE"
        default: null
      - name: rolling_absolute_variance_cents
        type: integer
        source: computed
        description: "Sum of abs(TillSession.variance_cents) over this cashier's RECONCILED sessions inside the rolling window"
        default: 0
      - name: rolling_net_variance_cents
        type: integer
        source: computed
        description: "Signed sum of TillSession.variance_cents over the same session set as rolling_absolute_variance_cents"
        default: 0
      - name: reconciled_session_count
        type: integer
        source: computed
        description: "Count of this cashier's sessions with status == RECONCILED inside the rolling window"
        default: 0
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of VarianceCase rows with cashier_id == this cashier and status IN {OPEN, RESEARCHING, ESCALATED}"
        default: 0

  - name: Safe
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store the safe physically sits in"
      - name: safe_code
        type: string
        source: input
        description: "Store-unique safe identifier, e.g. SAFE-A"
        constraints: "unique within store_id"
      - name: safe_type
        type: enum
        source: input
        description: "MANUAL = conventional drop safe; SMART = note-validating smart safe eligible for insertion-time provisional credit"
        constraints: "MANUAL | SMART"
      - name: open_state
        type: enum
        source: system
        description: "Time-delay device dimension, cyclic: LOCKED -> OPEN_REQUESTED -> UNLOCKED -> LOCKED"
        default: LOCKED
        constraints: "LOCKED | OPEN_REQUESTED | UNLOCKED"
      - name: posture
        type: enum
        source: system
        description: "Risk dimension, independent of open_state: OPEN -> FROZEN while any VarianceCase at this store is ESCALATED, back to OPEN when it closes"
        default: OPEN
        constraints: "OPEN | FROZEN"
      - name: open_requested_at
        type: datetime
        source: system
        description: "Logical clock at the open request; null while open_state == LOCKED"
        default: null
      - name: open_requested_by_user_id
        type: string
        source: system
        description: "X-User-ID that filed the still-pending open request; null while open_state == LOCKED"
        default: null
      - name: unlocked_at
        type: datetime
        source: system
        description: "Logical clock at which open_state became UNLOCKED; null unless open_state == UNLOCKED"
        default: null
      - name: balance_cents
        type: integer
        source: computed
        description: "Sum of SafeTransaction.effective_amount_cents for all rows with safe_id == this safe"
        default: 0
      - name: provisional_credit_balance_cents
        type: integer
        source: computed
        description: "Sum of BankCreditRecord.amount_cents with credit_type == PROVISIONAL for deposits whose safe_id == this safe and whose status is not RECONCILED"
        default: 0
      - name: suspect_note_cents
        type: integer
        source: computed
        description: "Sum of Deposit.suspect_note_cents over this safe's SMART_SAFE deposits that are not yet RECONCILED"
        default: 0

  - name: SalesJournal
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this daily journal belongs to"
      - name: business_date
        type: string
        source: input
        description: "Business date in YYYY-MM-DD; one journal per (store_id, business_date)"
        constraints: "unique with store_id; ISO calendar date"
      - name: status
        type: enum
        source: system
        description: "Compound state derived from child TillSession / CardSettlement / Deposit / VarianceCase rows; see state_machines.SalesJournal"
        default: OPEN
        constraints: "OPEN | TENDERS_POSTED | OUT_OF_BALANCE | BALANCED"
      - name: journal_cash_sales_cents
        type: integer
        source: input
        description: "Store-level POS cash sales for the day, posted once by post-tenders; null while status == OPEN"
        default: null
      - name: journal_card_sales_cents
        type: integer
        source: input
        description: "Store-level POS card sales for the day, posted once by post-tenders; null while status == OPEN"
        default: null
      - name: session_count
        type: integer
        source: computed
        description: "Count of TillSession rows with sales_journal_id == this journal"
        default: 0
      - name: reconciled_session_count
        type: integer
        source: computed
        description: "Count of this journal's TillSession rows with status == RECONCILED"
        default: 0
      - name: settlement_count
        type: integer
        source: computed
        description: "Count of CardSettlement rows with sales_journal_id == this journal"
        default: 0
      - name: register_cash_tieout_cents
        type: integer
        source: computed
        description: "Sum of TillSession.pos_cash_sales_cents over this journal's RECONCILED sessions minus journal_cash_sales_cents; 0 when the registers tie to the journal"
        default: 0
      - name: settlement_variance_total_cents
        type: integer
        source: computed
        description: "Sum of abs(CardSettlement.settlement_variance_cents) over this journal's settlements"
        default: 0
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of VarianceCase rows with sales_journal_id == this journal and status IN {OPEN, RESEARCHING, ESCALATED}"
        default: 0
      - name: net_unexplained_cents
        type: integer
        source: computed
        description: "Sum of VarianceCase.unexplained_cents over the same case set as open_case_count"
        default: 0

  - name: TillSession
    parent: null
    common_fields: true
    fields:
      - name: sales_journal_id
        type: string
        source: input
        description: "FK -> SalesJournal.id; the business day this till session is accounted in"
      - name: cashier_id
        type: string
        source: input
        description: "FK -> Cashier.id; the cashier the till is issued to"
      - name: safe_id
        type: string
        source: input
        description: "FK -> Safe.id; the safe the starting bank was issued from and the safe every drop of this session lands in. Fixed at assignment and never changed"
      - name: register_number
        type: integer
        source: input
        description: "Physical register the till is mounted on for this shift"
        constraints: ">= 1, <= 99"
      - name: shift_start_at
        type: datetime
        source: input
        description: "Planned shift window start; overlap arithmetic treats the window as half-open [shift_start_at, shift_end_at)"
      - name: shift_end_at
        type: datetime
        source: input
        description: "Planned shift window end, exclusive; must be strictly after shift_start_at"
      - name: status
        type: enum
        source: system
        description: "ACTIVE -> PENDING_COUNT -> COUNTED -> RECONCILED, with COUNTED -> PENDING_COUNT on recount"
        default: ACTIVE
        constraints: "ACTIVE | PENDING_COUNT | COUNTED | RECONCILED"
      - name: starting_bank_cents
        type: integer
        source: input
        description: "Starting bank issued out of the safe at assignment"
        constraints: ">= 0"
      - name: pos_cash_sales_cents
        type: integer
        source: input
        description: "Register POS cash sales, supplied at close; null while status == ACTIVE"
        default: null
      - name: pos_card_sales_cents
        type: integer
        source: input
        description: "Register POS card sales, supplied at close; null while status == ACTIVE"
        default: null
      - name: pos_paid_out_cents
        type: integer
        source: input
        description: "Register POS paid-outs (refunds, vendor payouts) taken from the till, supplied at close"
        default: null
      - name: dropped_declared_cents
        type: integer
        source: computed
        description: "Sum of SafeTransaction.declared_amount_cents for rows with till_session_id == this session and txn_type IN {MID_SHIFT_DROP, CLOSING_DROP}"
        default: 0
      - name: dropped_verified_cents
        type: integer
        source: computed
        description: "Sum of SafeTransaction.verified_amount_cents over the same rows as dropped_declared_cents; null while any of those rows has verified_amount_cents == null"
        default: null
      - name: counted_lines
        type: array
        source: input
        description: "Blind-count denomination lines, each { denomination_cents, quantity }; replaced wholesale by every blind-count call and emptied by recount"
        default: []
      - name: counted_cash_cents
        type: integer
        source: computed
        description: "Sum of denomination_cents * quantity over counted_lines; null while status == ACTIVE"
        default: null
      - name: expected_cash_cents
        type: integer
        source: computed
        description: "Expected till contents at close per calculations.till_over_short; null until status == RECONCILED"
        default: null
      - name: variance_cents
        type: integer
        source: computed
        description: "counted_cash_cents - expected_cash_cents; positive == OVER, negative == SHORT; null until status == RECONCILED"
        default: null
      - name: variance_basis
        type: enum
        source: computed
        description: "Which drop total the reconcile used: VERIFIED_DROPS when dropped_verified_cents is non-null at reconcile time, else DECLARED_DROPS; null until RECONCILED"
        default: null
        constraints: "DECLARED_DROPS | VERIFIED_DROPS"
      - name: recount_count
        type: integer
        source: computed
        description: "Number of times this session has been sent back from COUNTED to PENDING_COUNT"
        default: 0
      - name: counted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the most recent blind count; the reconcile actor must differ from it"
        default: null
      - name: forced_close
        type: boolean
        source: input
        description: "True when the session was closed by a StoreManager or by the loss-prevention cascade rather than by its own cashier; a forced-closed session carries null pos_* figures and is not reconcilable"
        default: false

  - name: SafeTransaction
    parent: null
    common_fields: false
    fields:
      - name: safe_id
        type: string
        source: input
        description: "FK -> Safe.id; the safe whose balance this row moves"
      - name: till_session_id
        type: string
        source: input
        description: "FK -> TillSession.id; populated only for STARTING_BANK_ISSUE, MID_SHIFT_DROP and CLOSING_DROP rows"
        default: null
      - name: deposit_id
        type: string
        source: input
        description: "FK -> Deposit.id; populated only for SMART_DEPOSIT, DEPOSIT_REMOVAL and DEPOSIT_RETURN rows"
        default: null
      - name: change_order_id
        type: string
        source: input
        description: "FK -> ChangeOrder.id; populated only for CHANGE_ORDER_RECEIPT rows"
        default: null
      - name: txn_type
        type: enum
        source: system
        description: "Ledger row kind; the sign column DIRECTION_SIGN in calculations.safe_balance maps each kind to +1 or -1"
        constraints: "OPENING_BALANCE | STARTING_BANK_ISSUE | MID_SHIFT_DROP | CLOSING_DROP | SMART_DEPOSIT | DEPOSIT_REMOVAL | DEPOSIT_RETURN | CHANGE_ORDER_RECEIPT | VARIANCE_ADJUSTMENT"
      - name: declared_amount_cents
        type: integer
        source: system
        description: "Unsigned amount as declared by the actor who created the row"
        constraints: ">= 0"
      - name: verified_amount_cents
        type: integer
        source: system
        description: "Unsigned amount as re-counted in the cash office during deposit preparation; null until verified"
        default: null
      - name: effective_amount_cents
        type: integer
        source: computed
        description: "DIRECTION_SIGN[txn_type] * (verified_amount_cents if verified_amount_cents is not null else declared_amount_cents)"
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID of the request that produced this row; 'system' for cascade-produced rows"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical clock reading when the row was written"
      - name: memo
        type: string
        source: system
        description: "Server-authored one-line provenance note, e.g. 'closing drop for session <id>'"
        default: null

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - name: safe_id
        type: string
        source: input
        description: "FK -> Safe.id; the safe the cash was drawn from (MANUAL_ARMORED) or inserted into (SMART_SAFE)"
      - name: sales_journal_id
        type: string
        source: input
        description: "FK -> SalesJournal.id; the business day the deposit settles against"
      - name: deposit_type
        type: enum
        source: system
        description: "MANUAL_ARMORED for bags prepared in the cash office; SMART_SAFE for smart-safe insertions"
        constraints: "MANUAL_ARMORED | SMART_SAFE"
      - name: status
        type: enum
        source: system
        description: "PREPARING -> SEALED -> SCHEDULED -> IN_TRANSIT -> {RECONCILED | DISCREPANT}, DISCREPANT -> RECONCILED, {PREPARING, SEALED} -> VOIDED"
        default: PREPARING
        constraints: "PREPARING | SEALED | SCHEDULED | IN_TRANSIT | RECONCILED | DISCREPANT | VOIDED"
      - name: business_date
        type: string
        source: input
        description: "Business date the deposit is banked under, YYYY-MM-DD; used for the store's daily pickup capacity count"
      - name: counted_lines
        type: array
        source: input
        description: "Bag denomination lines, each { denomination_cents, quantity }; immutable after creation"
      - name: declared_total_cents
        type: integer
        source: computed
        description: "Sum of denomination_cents * quantity over counted_lines"
      - name: suspect_note_cents
        type: integer
        source: input
        description: "Value of notes the smart safe's validator rejected as suspect; always 0 for MANUAL_ARMORED deposits"
        default: 0
        constraints: ">= 0"
      - name: credit_basis
        type: enum
        source: system
        description: "SMART_PROVISIONAL for smart-safe insertions (credited at insertion), CARRIER_PROVISIONAL for armored bags (credited at pickup)"
        constraints: "SMART_PROVISIONAL | CARRIER_PROVISIONAL"
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: "Provisional credit granted per calculations.provisional_credit; 0 until the credit event for this credit_basis fires"
        default: 0
      - name: carrier_fee_cents
        type: integer
        source: computed
        description: "Armored-carrier fee per calculations.bank_credit_reconciliation, keyed on declared_total_cents"
        default: 0
      - name: expected_credit_cents
        type: integer
        source: computed
        description: "declared_total_cents - carrier_fee_cents; the amount the bank is expected to credit finally"
        default: 0
      - name: credited_total_cents
        type: integer
        source: computed
        description: "Sum of BankCreditRecord.amount_cents with deposit_id == this deposit and credit_type IN {FINAL, ADJUSTMENT}"
        default: 0
      - name: credit_variance_cents
        type: integer
        source: computed
        description: "credited_total_cents - expected_credit_cents, evaluated by reconcile-bank; null until then"
        default: null
      - name: pickup_window_start
        type: datetime
        source: input
        description: "Requested armored pickup window start; null until scheduled"
        default: null
      - name: pickup_window_end
        type: datetime
        source: input
        description: "Requested armored pickup window end; null until scheduled"
        default: null
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID that prepared the bag; the sealing actor must differ when dual_control_required"
        default: null
      - name: sealed_by_user_id
        type: string
        source: system
        description: "X-User-ID that sealed the bag"
        default: null
      - name: seal_number
        type: string
        source: input
        description: "Tamper-evident seal number recorded at seal time; null until SEALED"
        default: null
      - name: carrier_reference
        type: string
        source: input
        description: "Armored carrier's pickup receipt reference, recorded at pickup"
        default: null

  - name: BankCreditRecord
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store whose bank account was credited"
      - name: deposit_id
        type: string
        source: input
        description: "FK -> Deposit.id; null for a bank credit that could not be matched to a deposit"
        default: null
      - name: credit_type
        type: enum
        source: input
        description: "PROVISIONAL rows are system-written at the credit event; FINAL and ADJUSTMENT rows are posted from the bank statement"
        constraints: "PROVISIONAL | FINAL | ADJUSTMENT"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed credit amount; ADJUSTMENT rows may be negative, PROVISIONAL and FINAL rows must be > 0"
      - name: value_date
        type: string
        source: input
        description: "Bank value date in YYYY-MM-DD"
      - name: bank_reference
        type: string
        source: input
        description: "Bank statement line reference"
      - name: match_state
        type: enum
        source: computed
        description: "UNMATCHED at creation, even when deposit_id is supplied; set to MATCHED only when POST /cash-ops/deposits/{id}/reconcile-bank consumes the record"
        constraints: "MATCHED | UNMATCHED"

  - name: CardSettlement
    parent: null
    common_fields: true
    fields:
      - name: sales_journal_id
        type: string
        source: input
        description: "FK -> SalesJournal.id; the business day whose card sales this batch settles"
      - name: card_network
        type: enum
        source: input
        description: "Settlement network; one settlement per (sales_journal_id, card_network)"
        constraints: "VISA_MC | AMEX"
      - name: gross_card_sales_cents
        type: integer
        source: input
        description: "Gross card sales the processor reports for the batch"
        constraints: ">= 0"
      - name: txn_count
        type: integer
        source: input
        description: "Number of card transactions in the batch, used for the per-transaction fee"
        constraints: ">= 0"
      - name: chargeback_cents
        type: integer
        source: input
        description: "Chargebacks withheld from this batch"
        default: 0
        constraints: ">= 0"
      - name: monthly_volume_cents
        type: integer
        source: input
        description: "Month-to-date processed volume that selects the discount-rate tier"
        constraints: ">= 0"
      - name: funded_amount_cents
        type: integer
        source: input
        description: "Amount the processor actually funded to the bank account"
      - name: expected_fee_cents
        type: integer
        source: computed
        description: "Fee per calculations.card_settlement_reconciliation"
      - name: expected_funded_cents
        type: integer
        source: computed
        description: "gross_card_sales_cents - expected_fee_cents - chargeback_cents"
      - name: settlement_variance_cents
        type: integer
        source: computed
        description: "funded_amount_cents - expected_funded_cents"
      - name: settlement_status
        type: enum
        source: computed
        description: "MATCHED when settlement_variance_cents == 0, else VARIANCE"
        constraints: "MATCHED | VARIANCE"

  - name: VarianceCase
    parent: null
    common_fields: true
    fields:
      - name: sales_journal_id
        type: string
        source: input
        description: "FK -> SalesJournal.id; the business day the case is researched under"
      - name: cashier_id
        type: string
        source: input
        description: "FK -> Cashier.id; null for cases that are not attributable to one cashier"
        default: null
      - name: deposit_id
        type: string
        source: input
        description: "FK -> Deposit.id; null unless the case originated from a bank-credit discrepancy"
        default: null
      - name: case_type
        type: enum
        source: system
        description: "SESSION_VARIANCE from a single-session breach, ROLLING_PATTERN from a rolling-threshold breach, DEPOSIT_CREDIT from a bank-credit discrepancy"
        constraints: "SESSION_VARIANCE | ROLLING_PATTERN | DEPOSIT_CREDIT"
      - name: status
        type: enum
        source: system
        description: "OPEN -> RESEARCHING -> {EXPLAINED | ESCALATED}, ESCALATED -> {CLOSED_SUBSTANTIATED | CLOSED_UNSUBSTANTIATED}"
        default: OPEN
        constraints: "OPEN | RESEARCHING | EXPLAINED | ESCALATED | CLOSED_SUBSTANTIATED | CLOSED_UNSUBSTANTIATED"
      - name: total_variance_cents
        type: integer
        source: computed
        description: "Unsigned case magnitude fixed at creation per calculations.variance_case_opening"
        constraints: ">= 0"
      - name: attributions
        type: array
        source: computed
        description: "Append-only research entries, each { bucket, amount_cents, note, recorded_at }; bucket IN {REGISTER, SAFE, BANK}"
        default: []
      - name: attributed_register_cents
        type: integer
        source: computed
        description: "Sum of attributions[].amount_cents where bucket == REGISTER"
        default: 0
      - name: attributed_safe_cents
        type: integer
        source: computed
        description: "Sum of attributions[].amount_cents where bucket == SAFE"
        default: 0
      - name: attributed_bank_cents
        type: integer
        source: computed
        description: "Sum of attributions[].amount_cents where bucket == BANK"
        default: 0
      - name: unexplained_cents
        type: integer
        source: computed
        description: "total_variance_cents - (attributed_register_cents + attributed_safe_cents + attributed_bank_cents)"
      - name: suspected_theft
        type: boolean
        source: computed
        description: "True when total_variance_cents >= Store.theft_escalation_threshold_cents at creation; such a case can never reach EXPLAINED"
        default: false
      - name: escalated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager that escalated the case to loss prevention"
        default: null
      - name: disposition
        type: enum
        source: input
        description: "Loss-prevention finding recorded at close: SUBSTANTIATED | UNSUBSTANTIATED; null until the case is closed"
        default: null
      - name: closing_note
        type: string
        source: input
        description: "Free-text loss-prevention narrative recorded alongside the disposition; null until the case is closed"
        default: null

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store ordering change from the bank"
      - name: target_week_start
        type: string
        source: input
        description: "First business date the order covers, YYYY-MM-DD"
      - name: days_covered
        type: integer
        source: input
        description: "Number of days of demand the order must cover"
        constraints: ">= 1, <= 31"
      - name: baseline_daily_cash_demand_cents
        type: integer
        source: input
        description: "Store's baseline daily change demand before seasonal and growth adjustment"
        constraints: ">= 0"
      - name: growth_pct
        type: number
        source: input
        description: "Year-over-year growth adjustment as a decimal fraction, e.g. 0.05"
        default: 0
        constraints: ">= -0.5, <= 2"
      - name: seasonal_profile_override
        type: enum
        source: input
        description: "Overrides Store.seasonal_profile for this order when supplied"
        default: null
        constraints: "BASELINE | BACK_TO_SCHOOL | HOLIDAY"
      - name: applied_seasonal_profile
        type: enum
        source: computed
        description: "seasonal_profile_override when non-null, else the Store.seasonal_profile read at creation"
        constraints: "BASELINE | BACK_TO_SCHOOL | HOLIDAY"
      - name: forecast_demand_cents
        type: integer
        source: computed
        description: "Seasonally adjusted demand per calculations.change_order_denomination_plan step 1"
      - name: planned_lines
        type: array
        source: computed
        description: "Denomination plan, one entry per DENOM_MIX row in descending denomination order, each { denomination_cents, strap_count, units, planned_cents }"
      - name: total_planned_cents
        type: integer
        source: computed
        description: "Sum of planned_lines[].planned_cents (per-line strap rounding first, then summation)"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> {APPROVED | REJECTED}, APPROVED -> RECEIVED"
        default: DRAFT
        constraints: "DRAFT | APPROVED | REJECTED | RECEIVED"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager that decided the order"
        default: null
      - name: received_amount_cents
        type: integer
        source: input
        description: "Cash actually received from the bank and booked into the safe; null until RECEIVED"
        default: null

state_machines:
  - entity: TillSession
    initial_state: ACTIVE
    terminal_states: [RECONCILED]
    shape: "cyclic — COUNTED -> PENDING_COUNT -> COUNTED may repeat without bound"
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /cash-ops/till-sessions"
        actor: StoreManager | CashOfficeClerk
        preconditions:
          - "SalesJournal.status == OPEN or TENDERS_POSTED"
          - "Cashier.store_id == SalesJournal.store_id and Safe.store_id == SalesJournal.store_id (else ERR_CASHIER_NOT_FOUND / ERR_SAFE_NOT_FOUND per validations[priority=35])"
          - "Cashier.till_eligibility != BARRED (else ERR_CASHIER_BARRED)"
          - "Cashier.till_eligibility != RESTRICTED unless Cashier.coaching_state == COACHING_ACKNOWLEDGED (else ERR_CASHIER_RESTRICTED)"
          - "when Cashier.till_eligibility == ELIGIBLE and Cashier.coaching_state == COACHING_DUE: clock <= Cashier.coaching_due_at, the boundary instant itself being permitted (else ERR_COACHING_NOT_ACKNOWLEDGED)"
          - "no other TillSession with the same cashier_id has a shift window overlapping [shift_start_at, shift_end_at) per validations[priority=58]"
          - "no other TillSession with the same sales_journal_id and register_number has an overlapping shift window (else ERR_REGISTER_OCCUPIED)"
          - "the Safe named by the request's safe_id has posture == OPEN and balance_cents >= starting_bank_cents"
        side_effects:
          - "writes SafeTransaction { txn_type: STARTING_BANK_ISSUE, safe_id: the safe_id supplied in the request, till_session_id: this session, declared_amount_cents: starting_bank_cents }"
          - "recomputes Safe.balance_cents (decreases by starting_bank_cents) and increments Safe.version by 1"
          - "leaves Cashier.coaching_state and Cashier.till_eligibility untouched — coaching is acknowledged only through POST /cash-ops/cashiers/{id}/acknowledge-coaching"
          - "increments SalesJournal.session_count by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /cash-ops/till-sessions/{id}/drops"
        actor: Cashier
        preconditions:
          - "TillSession.status == ACTIVE"
          - "when X-User-Role == Cashier: X-User-ID == TillSession.cashier_id (else ERR_UNAUTHORIZED)"
          - "Safe.posture == OPEN (else ERR_SAFE_FROZEN)"
          - "Safe.open_state == UNLOCKED when Safe.safe_type == MANUAL (else ERR_SAFE_NOT_UNLOCKED)"
        side_effects:
          - "writes SafeTransaction { txn_type: the request's txn_type (MID_SHIFT_DROP or CLOSING_DROP), declared_amount_cents: the request's declared_amount_cents, verified_amount_cents: null }"
          - "recomputes TillSession.dropped_declared_cents and Safe.balance_cents; increments TillSession.version by 1"
        note: "A drop does not change TillSession.status; the row is self-looping on ACTIVE, and both MID_SHIFT_DROP and CLOSING_DROP use this same edge."
      - from: ACTIVE
        to: PENDING_COUNT
        trigger: "POST /cash-ops/till-sessions/{id}/close"
        actor: Cashier | StoreManager
        preconditions:
          - "TillSession.status == ACTIVE"
          - "when X-User-Role == Cashier: X-User-ID == TillSession.cashier_id"
          - "Safe.posture == OPEN (else ERR_SAFE_FROZEN)"
        side_effects:
          - "stores pos_cash_sales_cents, pos_card_sales_cents, pos_paid_out_cents"
          - "writes NO SafeTransaction row — cash leaves the till only through POST /cash-ops/till-sessions/{id}/drops"
          - "increments TillSession.version by 1"
      - from: ACTIVE
        to: PENDING_COUNT
        trigger: "POST /cash-ops/till-sessions/{id}/close with forced_close == true"
        actor: StoreManager
        preconditions:
          - "TillSession.status == ACTIVE"
        side_effects:
          - "sets forced_close = true; leaves pos_cash_sales_cents, pos_card_sales_cents, pos_paid_out_cents null"
          - "writes NO SafeTransaction row — no cash moves during a forced close"
      - from: PENDING_COUNT
        to: COUNTED
        trigger: "POST /cash-ops/till-sessions/{id}/blind-count"
        actor: CashOfficeClerk
        preconditions:
          - "TillSession.status == PENDING_COUNT"
        side_effects:
          - "replaces counted_lines wholesale; recomputes counted_cash_cents (0 when counted_lines is empty)"
          - "sets counted_by_user_id = X-User-ID"
          - "does NOT compute expected_cash_cents or variance_cents — the count is blind"
      - from: COUNTED
        to: PENDING_COUNT
        trigger: "POST /cash-ops/till-sessions/{id}/recount"
        actor: CashOfficeClerk
        preconditions:
          - "TillSession.status == COUNTED"
        side_effects:
          - "increments recount_count by 1; clears counted_lines to [] and counted_cash_cents to null; clears counted_by_user_id"
          - "leaves dropped_declared_cents, dropped_verified_cents, Cashier.rolling_absolute_variance_cents and Safe.balance_cents unchanged"
        note: "Cycle edge. The next blind-count fully supersedes the discarded count."
      - from: COUNTED
        to: RECONCILED
        trigger: "POST /cash-ops/till-sessions/{id}/reconcile"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "TillSession.status == COUNTED"
          - "X-User-ID != TillSession.counted_by_user_id when Store.dual_control_required == true (else ERR_DUAL_CONTROL_VIOLATION)"
        side_effects:
          - "cascade link 1: computes variance_basis, expected_cash_cents and variance_cents per calculations.till_over_short and sets status = RECONCILED"
          - "cascade link 2: because variance_cents was written, recomputes Cashier.rolling_absolute_variance_cents / rolling_net_variance_cents / reconciled_session_count; when abs(variance_cents) >= Store.single_event_variance_threshold_cents also sets Cashier.coaching_state = COACHING_DUE and Cashier.coaching_due_at = clock + COACHING_GRACE_HOURS, and opens VarianceCase { case_type: SESSION_VARIANCE, cashier_id, sales_journal_id }"
          - "cascade link 3: because rolling_absolute_variance_cents was recomputed in link 2, when it is >= Store.rolling_variance_threshold_cents sets Cashier.till_eligibility = RESTRICTED and opens VarianceCase { case_type: ROLLING_PATTERN, cashier_id, sales_journal_id }"
          - "cascade link 4: because links 2/3 created VarianceCase rows, recomputes SalesJournal.open_case_count and SalesJournal.net_unexplained_cents, then re-evaluates the SalesJournal compound derivation"
          - "increments SalesJournal.reconciled_session_count and recomputes SalesJournal.register_cash_tieout_cents"

  - entity: Safe
    initial_state: LOCKED
    terminal_states: []
    shape: "cyclic on open_state (LOCKED -> OPEN_REQUESTED -> UNLOCKED -> LOCKED) with an independent posture dimension (OPEN <-> FROZEN)"
    transitions:
      - from: LOCKED
        to: OPEN_REQUESTED
        trigger: "POST /cash-ops/safes/{id}/open-requests"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "Safe.open_state == LOCKED (else ERR_SAFE_OPEN_REQUEST_ACTIVE)"
          - "Safe.posture == OPEN (else ERR_SAFE_FROZEN)"
        side_effects:
          - "sets open_requested_at = logical clock, open_requested_by_user_id = X-User-ID; increments version by 1"
      - from: OPEN_REQUESTED
        to: UNLOCKED
        trigger: "POST /cash-ops/safes/{id}/open"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "Safe.open_state == OPEN_REQUESTED (else ERR_SAFE_NOT_UNLOCKED)"
          - "X-User-ID != open_requested_by_user_id when Store.dual_control_required == true (else ERR_DUAL_CONTROL_VIOLATION)"
          - "clock >= open_requested_at + Store.safe_time_delay_minutes (else ERR_TIME_DELAY_NOT_ELAPSED)"
          - "clock < open_requested_at + Store.safe_time_delay_minutes + Store.safe_open_window_minutes (else ERR_SAFE_OPEN_REQUEST_EXPIRED)"
        side_effects:
          - "sets unlocked_at = logical clock; leaves open_requested_at and open_requested_by_user_id populated for audit; increments version by 1"
      - from: OPEN_REQUESTED
        to: LOCKED
        trigger: "POST /cash-ops/safes/{id}/open (rejected with ERR_SAFE_OPEN_REQUEST_EXPIRED)"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "Safe.open_state == OPEN_REQUESTED"
          - "clock >= open_requested_at + Store.safe_time_delay_minutes + Store.safe_open_window_minutes"
        side_effects:
          - "clears open_requested_at and open_requested_by_user_id, sets open_state = LOCKED, increments version by 1, and returns ERR_SAFE_OPEN_REQUEST_EXPIRED (409) — the expiry is recorded even though the request fails"
        note: "The only transition in the scaffold whose HTTP response is an error while state still advances; the expired request must not remain pending."
      - from: UNLOCKED
        to: LOCKED
        trigger: "POST /cash-ops/deposits/{id}/seal"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "Deposit.safe_id == this safe and Deposit.status == PREPARING"
        side_effects:
          - "clears open_requested_at, open_requested_by_user_id and unlocked_at; increments version by 1"
        note: "Sealing the bag ends the cash-office opening; preparing a deposit does NOT relock, so several bags may be prepared in one opening."
      - from: OPEN
        to: FROZEN
        trigger: "POST /cash-ops/variance-cases/{id}/escalate (posture dimension)"
        actor: system
        preconditions:
          - "a VarianceCase whose SalesJournal.store_id == Safe.store_id has just become ESCALATED"
        side_effects:
          - "sets posture = FROZEN for every Safe of that store; increments each Safe.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /cash-ops/safes/{id}/restore-posture (posture dimension)"
        actor: LossPreventionInvestigator | system
        preconditions:
          - "no VarianceCase with status == ESCALATED remains for that store"
        side_effects:
          - "sets posture = OPEN for every Safe of that store; increments each Safe.version by 1"

  - entity: Deposit
    initial_state: PREPARING
    terminal_states: [RECONCILED, VOIDED]
    shape: "branching — IN_TRANSIT forks to RECONCILED or DISCREPANT with divergent side-effect sets, and DISCREPANT rejoins RECONCILED"
    transitions:
      - from: null
        to: PREPARING
        trigger: "POST /cash-ops/deposits"
        actor: CashOfficeClerk
        preconditions:
          - "Safe.open_state == UNLOCKED (else ERR_SAFE_NOT_UNLOCKED)"
          - "Safe.posture == OPEN (else ERR_SAFE_FROZEN)"
          - "Safe.safe_type == MANUAL"
          - "SalesJournal.store_id == Safe.store_id (else ERR_SAFE_NOT_FOUND per validations[priority=35])"
          - "Safe.balance_cents >= sum(counted_lines) (else ERR_INSUFFICIENT_SAFE_BALANCE)"
          - "expected_safe_version == Safe.version (else ERR_SAFE_VERSION_STALE, 412) — see concurrency_rules[deposit-prepare-stale-safe]"
        side_effects:
          - "sets deposit_type = MANUAL_ARMORED, credit_basis = CARRIER_PROVISIONAL, prepared_by_user_id = X-User-ID, declared_total_cents = sum(counted_lines)"
          - "computes carrier_fee_cents and expected_credit_cents per calculations.bank_credit_reconciliation"
          - "for each verified_drops entry: sets verified_amount_cents on that TillSession's CLOSING_DROP row so the session's verified drop rows total verified_total_cents, then recomputes TillSession.dropped_verified_cents"
          - "writes SafeTransaction { txn_type: DEPOSIT_REMOVAL, deposit_id, declared_amount_cents: declared_total_cents }"
          - "recomputes Safe.balance_cents (reflecting both the removal and any newly verified drop amounts) and increments Safe.version by 1"
      - from: PREPARING
        to: SEALED
        trigger: "POST /cash-ops/deposits/{id}/seal"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "Deposit.status == PREPARING (else ERR_DEPOSIT_INVALID_STATE)"
          - "X-User-ID != Deposit.prepared_by_user_id when Store.dual_control_required == true (else ERR_DUAL_CONTROL_VIOLATION)"
        side_effects:
          - "sets seal_number and sealed_by_user_id = X-User-ID"
          - "relocks the parent Safe (open_state = LOCKED) and increments Safe.version by 1"
          - "re-evaluates the SalesJournal compound derivation, because a sealed deposit satisfies the journal's deposit-present condition"
      - from: null
        to: SEALED
        trigger: "POST /cash-ops/safes/{id}/smart-deposits"
        actor: Cashier | CashOfficeClerk
        preconditions:
          - "Safe.safe_type == SMART (else ERR_SMART_SAFE_REQUIRED)"
          - "Safe.posture == OPEN (else ERR_SAFE_FROZEN)"
          - "SalesJournal.store_id == Safe.store_id (else ERR_SAFE_NOT_FOUND per validations[priority=35])"
          - "suspect_note_cents <= sum(counted_lines)"
        side_effects:
          - "creates the Deposit already SEALED with deposit_type = SMART_SAFE, credit_basis = SMART_PROVISIONAL, seal_number = 'SMART-' + the safe's safe_code"
          - "writes SafeTransaction { txn_type: SMART_DEPOSIT, deposit_id, declared_amount_cents: declared_total_cents }; recomputes Safe.balance_cents; increments Safe.version by 1"
          - "computes provisional_credit_cents by the smart_safe_insertion variant of calculations.provisional_credit and writes BankCreditRecord { credit_type: PROVISIONAL, amount_cents: provisional_credit_cents, deposit_id, store_id }"
          - "recomputes Safe.provisional_credit_balance_cents and Safe.suspect_note_cents"
        note: "No safe opening is needed: cash goes in through the validator, never out."
      - from: SEALED
        to: SCHEDULED
        trigger: "POST /cash-ops/deposits/{id}/schedule-pickup"
        actor: CashOfficeClerk
        preconditions:
          - "Deposit.status == SEALED (else ERR_DEPOSIT_INVALID_STATE)"
          - "pickup_window_end > pickup_window_start"
          - "no buffered-window collision with another SCHEDULED/IN_TRANSIT deposit of the same store per validations[priority=58b] (else ERR_PICKUP_WINDOW_CONFLICT)"
          - "count of the store's deposits with the same business_date and status IN {SCHEDULED, IN_TRANSIT} < Store.max_daily_pickups (else ERR_PICKUP_CAPACITY_EXCEEDED)"
        side_effects:
          - "stores pickup_window_start and pickup_window_end"
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /cash-ops/deposits/{id}/pickup"
        actor: ArmoredCarrier
        preconditions:
          - "Deposit.status == SCHEDULED (else ERR_DEPOSIT_INVALID_STATE)"
        side_effects:
          - "stores carrier_reference"
          - "computes provisional_credit_cents by the carrier_receipt variant of calculations.provisional_credit and writes BankCreditRecord { credit_type: PROVISIONAL, amount_cents: provisional_credit_cents, deposit_id, store_id }"
          - "recomputes Safe.provisional_credit_balance_cents"
      - from: IN_TRANSIT
        to: RECONCILED
        trigger: "POST /cash-ops/deposits/{id}/reconcile-bank"
        actor: TreasuryAnalyst
        preconditions:
          - "Deposit.status IN {IN_TRANSIT, SEALED, DISCREPANT} — SEALED is reachable only for SMART_SAFE deposits, which are never picked up"
          - "at least one BankCreditRecord with credit_type IN {FINAL, ADJUSTMENT} exists for the deposit"
          - "credit_variance_cents computes to 0"
        side_effects:
          - "sets credited_total_cents, credit_variance_cents = 0 and status = RECONCILED"
          - "recomputes Safe.provisional_credit_balance_cents (the deposit leaves the provisional pool)"
          - "re-evaluates the SalesJournal compound derivation"
      - from: IN_TRANSIT
        to: DISCREPANT
        trigger: "POST /cash-ops/deposits/{id}/reconcile-bank"
        actor: TreasuryAnalyst
        preconditions:
          - "same as IN_TRANSIT -> RECONCILED except credit_variance_cents computes to a non-zero value"
        side_effects:
          - "sets credited_total_cents and credit_variance_cents (non-zero) and status = DISCREPANT"
          - "opens VarianceCase { case_type: DEPOSIT_CREDIT, deposit_id, sales_journal_id, cashier_id: null, total_variance_cents: abs(credit_variance_cents) }"
          - "recomputes SalesJournal.open_case_count and SalesJournal.net_unexplained_cents, then re-evaluates the SalesJournal compound derivation"
        note: "Divergent branch: the RECONCILED edge opens no case and releases the provisional pool; the DISCREPANT edge opens a case and keeps the provisional credit outstanding."
      - from: DISCREPANT
        to: RECONCILED
        trigger: "POST /cash-ops/deposits/{id}/reconcile-bank"
        actor: TreasuryAnalyst
        preconditions:
          - "Deposit.status == DISCREPANT"
          - "credit_variance_cents recomputes to 0 after further ADJUSTMENT rows were posted"
          - "the deposit's VarianceCase has status IN {EXPLAINED, CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED} (else ERR_VARIANCE_CASE_INVALID_STATE)"
        side_effects:
          - "sets credit_variance_cents = 0 and status = RECONCILED; recomputes Safe.provisional_credit_balance_cents; re-evaluates the SalesJournal compound derivation"
      - from: PREPARING
        to: VOIDED
        trigger: "POST /cash-ops/deposits/{id}/void"
        actor: StoreManager
        preconditions:
          - "Deposit.status IN {PREPARING, SEALED} (else ERR_DEPOSIT_INVALID_STATE)"
          - "Deposit.deposit_type == MANUAL_ARMORED"
        side_effects:
          - "writes SafeTransaction { txn_type: DEPOSIT_RETURN, deposit_id, declared_amount_cents: declared_total_cents }"
          - "recomputes Safe.balance_cents (restored to its pre-preparation value) and increments Safe.version by 1"
          - "sets status = VOIDED; leaves declared_total_cents, carrier_fee_cents and expected_credit_cents untouched for audit"
      - from: SEALED
        to: VOIDED
        trigger: "POST /cash-ops/deposits/{id}/void"
        actor: StoreManager
        preconditions:
          - "Deposit.status == SEALED and deposit_type == MANUAL_ARMORED"
        side_effects:
          - "identical to the PREPARING -> VOIDED edge"

  - entity: SalesJournal
    initial_state: OPEN
    terminal_states: [BALANCED]
    shape: "compound — the fork to BALANCED vs OUT_OF_BALANCE is derived from child rows, and OUT_OF_BALANCE -> BALANCED is a recovery edge"
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /cash-ops/sales-journals"
        actor: CashOfficeClerk
        preconditions:
          - "no SalesJournal exists with the same (store_id, business_date) (else ERR_DUPLICATE_BUSINESS_DATE)"
        side_effects: ["none beyond creation"]
      - from: OPEN
        to: TENDERS_POSTED
        trigger: "POST /cash-ops/sales-journals/{id}/post-tenders"
        actor: CashOfficeClerk
        preconditions:
          - "SalesJournal.status == OPEN (else ERR_TENDERS_ALREADY_POSTED)"
        side_effects:
          - "stores journal_cash_sales_cents and journal_card_sales_cents; recomputes register_cash_tieout_cents"
          - "re-evaluates the compound derivation below"
      - from: TENDERS_POSTED
        to: BALANCED
        trigger: "system event: compound re-evaluation"
        actor: system
        preconditions:
          - "structural_complete: status IN {TENDERS_POSTED, OUT_OF_BALANCE} AND session_count >= 1 AND reconciled_session_count == session_count AND settlement_count >= 1 AND at least one Deposit with this sales_journal_id has status IN {SEALED, SCHEDULED, IN_TRANSIT, RECONCILED}"
          - "balanced_condition: register_cash_tieout_cents == 0 AND settlement_variance_total_cents == 0 AND open_case_count == 0"
        side_effects: ["sets status = BALANCED (terminal)"]
        note: "Re-evaluated after every TillSession reconcile, CardSettlement post, Deposit seal/reconcile-bank, and VarianceCase status change."
      - from: TENDERS_POSTED
        to: OUT_OF_BALANCE
        trigger: "system event: compound re-evaluation"
        actor: system
        preconditions:
          - "structural_complete holds (same clause as the BALANCED edge)"
          - "balanced_condition does NOT hold"
        side_effects: ["sets status = OUT_OF_BALANCE"]
      - from: OUT_OF_BALANCE
        to: BALANCED
        trigger: "system event: compound re-evaluation after the last VarianceCase reaches EXPLAINED / CLOSED_* or the last settlement variance is corrected"
        actor: system
        preconditions:
          - "structural_complete holds AND balanced_condition now holds"
        side_effects: ["sets status = BALANCED (terminal)"]
        note: "Recovery edge — an out-of-balance day can still close once research finishes."

  - entity: VarianceCase
    initial_state: OPEN
    terminal_states: [EXPLAINED, CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED]
    shape: "branching — RESEARCHING forks to EXPLAINED or ESCALATED, and ESCALATED forks again on disposition"
    transitions:
      - from: null
        to: OPEN
        trigger: "system event: TillSession COUNTED -> RECONCILED (cascade links 2 and 3) or Deposit IN_TRANSIT -> DISCREPANT"
        actor: system
        preconditions:
          - "the originating threshold or discrepancy condition held"
        side_effects:
          - "sets total_variance_cents and suspected_theft per calculations.variance_case_opening"
          - "increments SalesJournal.open_case_count and adds total_variance_cents to SalesJournal.net_unexplained_cents"
          - "increments Cashier.open_case_count when cashier_id is non-null"
      - from: OPEN
        to: RESEARCHING
        trigger: "POST /cash-ops/variance-cases/{id}/attributions"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "VarianceCase.status IN {OPEN, RESEARCHING} (else ERR_VARIANCE_CASE_INVALID_STATE)"
          - "expected_variance_case_version == VarianceCase.version (else ERR_CASE_VERSION_STALE, 412) — see concurrency_rules[attribution-stale-case]"
          - "0 <= (attributed_register_cents + attributed_safe_cents + attributed_bank_cents + amount_cents) <= total_variance_cents (else ERR_ATTRIBUTION_EXCEEDS_VARIANCE)"
        side_effects:
          - "appends { bucket, amount_cents, note, recorded_at: logical clock } to attributions and recomputes the three bucket totals and unexplained_cents"
          - "recomputes SalesJournal.net_unexplained_cents"
          - "increments version by 1"
      - from: RESEARCHING
        to: RESEARCHING
        trigger: "POST /cash-ops/variance-cases/{id}/attributions (correcting entry)"
        actor: CashOfficeClerk | StoreManager
        preconditions:
          - "same as the OPEN -> RESEARCHING edge; amount_cents may be negative to reverse an earlier attribution"
        side_effects:
          - "same as the OPEN -> RESEARCHING edge; the conservation identity total_variance_cents == attributed_register_cents + attributed_safe_cents + attributed_bank_cents + unexplained_cents holds after every entry"
      - from: RESEARCHING
        to: EXPLAINED
        trigger: "POST /cash-ops/variance-cases/{id}/attributions (auto-transition when the case becomes fully attributed)"
        actor: system
        preconditions:
          - "unexplained_cents == 0 after appending the entry"
          - "suspected_theft == false"
        side_effects:
          - "sets status = EXPLAINED (terminal); decrements SalesJournal.open_case_count and Cashier.open_case_count"
          - "recomputes SalesJournal.net_unexplained_cents, then re-evaluates the SalesJournal compound derivation"
        note: "A suspected_theft case that reaches unexplained_cents == 0 stays RESEARCHING — only loss prevention may end it."
      - from: RESEARCHING
        to: ESCALATED
        trigger: "POST /cash-ops/variance-cases/{id}/escalate"
        actor: StoreManager
        preconditions:
          - "VarianceCase.status == RESEARCHING (else ERR_VARIANCE_CASE_INVALID_STATE)"
          - "total_variance_cents >= Store.theft_escalation_threshold_cents OR the case's Cashier has >= 2 other VarianceCase rows created within ESCALATION_PATTERN_DAYS (else ERR_ESCALATION_THRESHOLD_NOT_MET)"
        side_effects:
          - "cascade link 1: sets status = ESCALATED, escalated_by_user_id = X-User-ID, suspected_theft = true"
          - "cascade link 2: because the case became ESCALATED, sets Cashier.till_eligibility = BARRED (when cashier_id is non-null)"
          - "cascade link 3: because that cashier became BARRED, force-closes every TillSession of that cashier whose status == ACTIVE (ACTIVE -> PENDING_COUNT with forced_close = true, no SafeTransaction written)"
          - "sets posture = FROZEN on every Safe of the case's store (direct fan-out of link 1, not part of the link chain)"
      - from: ESCALATED
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /cash-ops/variance-cases/{id}/close"
        actor: LossPreventionInvestigator
        preconditions:
          - "VarianceCase.status == ESCALATED (else ERR_VARIANCE_CASE_INVALID_STATE)"
          - "closing_note, when supplied, is a non-empty string"
          - "disposition == SUBSTANTIATED"
        side_effects:
          - "sets status = CLOSED_SUBSTANTIATED; leaves Cashier.till_eligibility == BARRED"
          - "writes SafeTransaction { txn_type: VARIANCE_ADJUSTMENT, safe_id: the case's store's lowest-created_at Safe, declared_amount_cents: unexplained_cents } to write the confirmed loss off the safe ledger"
          - "decrements SalesJournal.open_case_count; recomputes net_unexplained_cents; restores Safe.posture = OPEN when no ESCALATED case remains for the store; re-evaluates the SalesJournal compound derivation"
      - from: ESCALATED
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /cash-ops/variance-cases/{id}/close"
        actor: LossPreventionInvestigator
        preconditions:
          - "same as the CLOSED_SUBSTANTIATED edge except disposition == UNSUBSTANTIATED, and no VARIANCE_ADJUSTMENT SafeTransaction is written"
        side_effects:
          - "sets status = CLOSED_UNSUBSTANTIATED; restores Cashier.till_eligibility to RESTRICTED when rolling_absolute_variance_cents >= Store.rolling_variance_threshold_cents, else to ELIGIBLE"
          - "writes NO SafeTransaction — an unsubstantiated case moves no cash"
          - "decrements SalesJournal.open_case_count; recomputes net_unexplained_cents; restores Safe.posture = OPEN when no ESCALATED case remains for the store; re-evaluates the SalesJournal compound derivation"
        note: "Divergent branch: SUBSTANTIATED writes the loss to the safe ledger and keeps the cashier BARRED; UNSUBSTANTIATED moves no cash and reinstates the cashier."

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, RECEIVED]
    shape: "branching — DRAFT forks to APPROVED or REJECTED"
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /cash-ops/change-orders"
        actor: CashOfficeClerk
        preconditions: ["Store exists"]
        side_effects:
          - "computes applied_seasonal_profile, forecast_demand_cents, planned_lines and total_planned_cents per calculations.change_order_denomination_plan"
      - from: DRAFT
        to: APPROVED
        trigger: "POST /cash-ops/change-orders/{id}/approve"
        actor: StoreManager
        preconditions: ["ChangeOrder.status == DRAFT (else ERR_CHANGE_ORDER_INVALID_STATE)"]
        side_effects: ["sets approved_by_user_id = X-User-ID"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /cash-ops/change-orders/{id}/reject"
        actor: StoreManager
        preconditions: ["ChangeOrder.status == DRAFT"]
        side_effects: ["sets approved_by_user_id = X-User-ID; the order is terminal and cannot be received"]
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /cash-ops/change-orders/{id}/receive"
        actor: CashOfficeClerk
        preconditions:
          - "ChangeOrder.status == APPROVED (else ERR_CHANGE_ORDER_INVALID_STATE)"
          - "the target Safe is the ChangeOrder store's lowest-created_at Safe and its posture == OPEN (else ERR_SAFE_FROZEN)"
        side_effects:
          - "stores received_amount_cents"
          - "writes SafeTransaction { txn_type: CHANGE_ORDER_RECEIPT, change_order_id, safe_id, declared_amount_cents: received_amount_cents }"
          - "recomputes Safe.balance_cents and increments Safe.version by 1"

  - entity: Cashier
    initial_state: "ELIGIBLE x NONE"
    terminal_states: []
    shape: "parallel dimensions — till_eligibility and coaching_state advance on different triggers and never constrain each other"
    transitions:
      - from: "till_eligibility: ELIGIBLE"
        to: "till_eligibility: RESTRICTED"
        trigger: "system event: TillSession reconcile cascade link 3"
        actor: system
        preconditions: ["rolling_absolute_variance_cents >= Store.rolling_variance_threshold_cents"]
        side_effects: ["leaves coaching_state untouched; a RESTRICTED cashier can only be assigned a till again once coaching_state == COACHING_ACKNOWLEDGED"]
      - from: "till_eligibility: ELIGIBLE | RESTRICTED"
        to: "till_eligibility: BARRED"
        trigger: "system event: VarianceCase RESEARCHING -> ESCALATED cascade link 2"
        actor: system
        preconditions: ["the escalated case's cashier_id == this cashier"]
        side_effects: ["leaves coaching_state untouched; force-closes the cashier's ACTIVE sessions (cascade link 3)"]
      - from: "till_eligibility: BARRED"
        to: "till_eligibility: RESTRICTED | ELIGIBLE"
        trigger: "POST /cash-ops/variance-cases/{id}/close with disposition == UNSUBSTANTIATED"
        actor: LossPreventionInvestigator
        preconditions: ["no other VarianceCase with this cashier_id has status == ESCALATED"]
        side_effects: ["RESTRICTED when rolling_absolute_variance_cents >= Store.rolling_variance_threshold_cents, else ELIGIBLE; coaching_state untouched"]
      - from: "coaching_state: NONE"
        to: "coaching_state: COACHING_DUE"
        trigger: "system event: TillSession reconcile cascade link 2"
        actor: system
        preconditions: ["abs(TillSession.variance_cents) >= Store.single_event_variance_threshold_cents"]
        side_effects: ["sets coaching_due_at = clock + COACHING_GRACE_HOURS; leaves till_eligibility untouched"]
      - from: "coaching_state: COACHING_DUE"
        to: "coaching_state: COACHING_ACKNOWLEDGED"
        trigger: "POST /cash-ops/cashiers/{id}/acknowledge-coaching"
        actor: Cashier | StoreManager
        preconditions: ["coaching_state == COACHING_DUE"]
        side_effects: ["leaves till_eligibility untouched; a RESTRICTED cashier becomes assignable again only through this acknowledgement, never through an override field on the assignment call"]
      - from: "coaching_state: COACHING_ACKNOWLEDGED"
        to: "coaching_state: COACHING_DUE"
        trigger: "system event: TillSession reconcile cascade link 2 on a later breach"
        actor: system
        preconditions: ["abs(TillSession.variance_cents) >= Store.single_event_variance_threshold_cents"]
        side_effects: ["resets coaching_due_at; leaves till_eligibility untouched"]

concurrency_rules:
  - rule_id: deposit-prepare-stale-safe
    parent_entity: Safe
    write_endpoint: "POST /cash-ops/deposits"
    occ_field: "expected_safe_version"
    description: |
      Preparing a deposit against a Safe whose version has advanced since the client last read it is
      rejected. A single safe opening legitimately supports several bags, so a second preparation is
      not blocked by any state precondition: the safe is still UNLOCKED and the operation is a valid
      product action. The stale-version check is what stops a clerk who is working from an out-of-date
      view of balance_cents and of which drops have already been verified from removing cash twice.
    error_id: ERR_SAFE_VERSION_STALE
    http_status: 412
  - rule_id: attribution-stale-case
    parent_entity: VarianceCase
    write_endpoint: "POST /cash-ops/variance-cases/{id}/attributions"
    occ_field: "expected_variance_case_version"
    description: |
      Appending a research attribution to a VarianceCase whose version has advanced since the client
      last read it is rejected. Attributions legitimately accumulate, so a later entry observing the
      same status would itself succeed; the stale-version check is what prevents a researcher whose
      view of unexplained_cents predates another entry from over-attributing the case.
    error_id: ERR_CASE_VERSION_STALE
    http_status: 412

calculations:
  - name: safe_balance
    trigger: "recomputed on every SafeTransaction write (till assignment, drop, close, smart deposit, deposit prepare/void, change-order receipt, substantiated case close) and on every drop verification"
    algorithm: aggregation
    formula: |
      DIRECTION_SIGN = {
        OPENING_BALANCE:      +1,
        STARTING_BANK_ISSUE:  -1,
        MID_SHIFT_DROP:       +1,
        CLOSING_DROP:         +1,
        SMART_DEPOSIT:        +1,
        DEPOSIT_REMOVAL:      -1,
        DEPOSIT_RETURN:       +1,
        CHANGE_ORDER_RECEIPT: +1,
        VARIANCE_ADJUSTMENT:  -1,
      }
      for each row r with r.safe_id == safe.id:
          basis = r.verified_amount_cents if r.verified_amount_cents is not null else r.declared_amount_cents
          r.effective_amount_cents = DIRECTION_SIGN[r.txn_type] * basis
      safe.balance_cents = sum(r.effective_amount_cents)   # full recompute, never incremental
    input_set: "every SafeTransaction row for the safe, with no status filter — the ledger is append-only and has no void rows; a voided Deposit is represented by a compensating DEPOSIT_RETURN row, not by removing the DEPOSIT_REMOVAL row"
    constants:
      RECOMPUTE_MODE: full_recompute
    precision: "integer cents, exact"
    variants: []

  - name: till_over_short
    trigger: "POST /cash-ops/till-sessions/{id}/reconcile (COUNTED -> RECONCILED)"
    algorithm: chronological
    formula: |
      # Step 1 — pick the drop basis. This is the ONLY branch and it is decided by
      # whether deposit preparation has already re-counted this session's drop bags.
      if session.dropped_verified_cents is not null:
          basis      = VERIFIED_DROPS
          drop_total = session.dropped_verified_cents
      else:
          basis      = DECLARED_DROPS
          drop_total = session.dropped_declared_cents

      # Step 2 — expected till contents at count time.
      expected_cash_cents = session.starting_bank_cents
                          + session.pos_cash_sales_cents
                          - session.pos_paid_out_cents
                          - drop_total

      # Step 3 — variance. Positive == OVER, negative == SHORT.
      variance_cents = session.counted_cash_cents - expected_cash_cents

      # Step 4 — threshold evaluation (see cashier_rolling_variance for the rolling arm).
      if abs(variance_cents) >= store.single_event_variance_threshold_cents:
          coaching fires and a SESSION_VARIANCE case opens
    input_set: |
      session.counted_cash_cents comes from the MOST RECENT blind count only (a recount discards the
      previous lines entirely). dropped_declared_cents sums SafeTransaction rows with
      txn_type IN {MID_SHIFT_DROP, CLOSING_DROP} and till_session_id == this session, using
      declared_amount_cents. dropped_verified_cents sums the SAME row set using
      verified_amount_cents and is null while any of those rows is unverified.
      A forced-closed session (forced_close == true, pos_* null) is not reconcilable: reconcile of a
      session whose pos_cash_sales_cents is null returns ERR_INVALID_REQUEST.
    constants:
      COACHING_GRACE_HOURS: 72
    precision: "integer cents, exact; no rounding occurs"
    variants:
      - name: declared_drops
        when: "at least one of the session's drop rows still has verified_amount_cents == null at the moment reconcile runs"
        difference: "trusts the cashier's declared drop amount; expected_cash_cents is lower by (declared - verified) than under the verified variant, so a drop bag that was over-declared reports a SMALLER short"
      - name: verified_drops
        when: "every drop row of the session carries a verified_amount_cents, i.e. POST /cash-ops/deposits already re-counted the bags"
        difference: "trusts the cash office's re-count; expected_cash_cents rises by (declared - verified) and the reported variance moves by the same amount, which can push abs(variance_cents) across single_event_variance_threshold_cents for an otherwise identical reconcile call"

  - name: cashier_rolling_variance
    trigger: "recomputed inside the TillSession reconcile cascade (link 2) immediately after variance_cents is written"
    algorithm: threshold
    formula: |
      window_start = clock - store.rolling_window_days days      # inclusive
      window_end   = clock                                       # inclusive
      S = { t : t.cashier_id == cashier.id
                AND t.status == RECONCILED
                AND window_start <= t.updated_at <= window_end }
      cashier.reconciled_session_count        = count(S)
      cashier.rolling_absolute_variance_cents = sum(abs(t.variance_cents) for t in S)
      cashier.rolling_net_variance_cents      = sum(t.variance_cents      for t in S)
      if cashier.rolling_absolute_variance_cents >= store.rolling_variance_threshold_cents:
          cashier.till_eligibility = RESTRICTED   # coaching_state is NOT touched
          open VarianceCase { case_type: ROLLING_PATTERN }
    input_set: "RECONCILED sessions only; ACTIVE / PENDING_COUNT / COUNTED sessions are excluded even when a discarded count exists. Window boundaries are inclusive on BOTH ends, so a session whose updated_at equals exactly clock - rolling_window_days is still counted. Sessions are summed in t.created_at ASC order; the sum is order-independent, and no tie-break is required."
    constants:
      ESCALATION_PATTERN_DAYS: 90
    precision: "integer cents, exact"
    variants: []

  - name: provisional_credit
    trigger: "POST /cash-ops/safes/{id}/smart-deposits (smart_safe_insertion variant) and POST /cash-ops/deposits/{id}/pickup (carrier_receipt variant)"
    algorithm: threshold
    formula: |
      declared_total_cents = sum(line.denomination_cents * line.quantity for line in deposit.counted_lines)

      # smart_safe_insertion — only note-validator-readable denominations earn credit,
      # and validator-rejected notes are deducted.
      validated_cents      = sum(line.denomination_cents * line.quantity
                                 for line in deposit.counted_lines
                                 if line.denomination_cents >= VALIDATED_MIN_DENOMINATION_CENTS)
      smart_provisional    = min(validated_cents - deposit.suspect_note_cents,
                                 store.provisional_credit_cap_cents)

      # carrier_receipt — the carrier signs for the sealed bag as declared, coin included,
      # and the store's own suspect-note tally is irrelevant to the carrier.
      carrier_provisional  = min(declared_total_cents, store.provisional_credit_cap_cents)
    input_set: "deposit.counted_lines exactly as supplied at creation; the cap comparison uses the Store row read at credit time"
    constants:
      VALIDATED_MIN_DENOMINATION_CENTS: 500
    precision: "integer cents, exact; min() never rounds"
    variants:
      - name: smart_safe_insertion
        when: "deposit.credit_basis == SMART_PROVISIONAL (created by POST /cash-ops/safes/{id}/smart-deposits)"
        difference: "excludes every line whose denomination_cents < 500 and subtracts suspect_note_cents, so a bag of 100 x $20 + 400 x $1 + 80 x quarters with $40 suspect earns 196000, not 242000"
      - name: carrier_receipt
        when: "deposit.credit_basis == CARRIER_PROVISIONAL (granted at SCHEDULED -> IN_TRANSIT)"
        difference: "credits the whole declared bag including coin and $1 notes and ignores suspect_note_cents, so the identical bag earns 242000 — a 46000 divergence on the same physical cash"

  - name: bank_credit_reconciliation
    trigger: "carrier_fee_cents / expected_credit_cents at POST /cash-ops/deposits and POST /cash-ops/safes/{id}/smart-deposits; credit_variance_cents at POST /cash-ops/deposits/{id}/reconcile-bank"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. The fee tier is keyed on declared_total_cents (the amount the
      # store hands over), NOT on expected_credit_cents. Keying the ceil() on expected_credit_cents
      # would be self-referential (expected_credit_cents already has the fee subtracted) and yields a
      # different number whenever the fee straddles a $1000 boundary: for declared_total_cents 200500
      # the pinned order gives fee 1305 / expected 199195, while the self-referential order gives
      # fee 1270 / expected 199230.
      step 1: carrier_fee_cents   = CARRIER_BASE_FEE_CENTS
                                  + CARRIER_PER_THOUSAND_FEE_CENTS * ceil(declared_total_cents / 100000)
      step 2: expected_credit_cents = declared_total_cents - carrier_fee_cents
      step 3: credited_total_cents  = sum(b.amount_cents for b in BankCreditRecord
                                          if b.deposit_id == deposit.id
                                          AND b.credit_type IN {FINAL, ADJUSTMENT})
      step 4: credit_variance_cents = credited_total_cents - expected_credit_cents
      step 5: status = RECONCILED if credit_variance_cents == 0 else DISCREPANT
    input_set: "step 3 deliberately EXCLUDES credit_type == PROVISIONAL rows: provisional credit is a float the bank later reverses, so counting it would double-count the deposit. ADJUSTMENT rows may be negative and are included. Rows are summed in created_at ASC order; the sum is order-independent."
    constants:
      CARRIER_BASE_FEE_CENTS: 1200
      CARRIER_PER_THOUSAND_FEE_CENTS: 35
    precision: "integer cents; ceil() on the thousand-dollar count, no other rounding"
    variants: []

  - name: card_settlement_reconciliation
    trigger: "POST /cash-ops/card-settlements"
    algorithm: tiered_pricing
    formula: |
      # Three interacting inputs: monthly_volume_cents selects the tier, card_network adds a
      # network adder, txn_count drives a flat per-transaction component. The percentage component
      # is rounded BEFORE the per-transaction component is added — rounding the combined figure
      # instead changes the cents on many batches.
      tier_rate = 0.0250 if monthly_volume_cents <  5000000
                  else 0.0220 if monthly_volume_cents < 20000000
                  else 0.0195
      network_adder = 0.0035 if card_network == AMEX else 0.0000
      expected_fee_cents    = round_half_up(gross_card_sales_cents * (tier_rate + network_adder))
                            + PER_TXN_FEE_CENTS * txn_count
      expected_funded_cents = gross_card_sales_cents - expected_fee_cents - chargeback_cents
      settlement_variance_cents = funded_amount_cents - expected_funded_cents
      settlement_status = MATCHED if settlement_variance_cents == 0 else VARIANCE
    input_set: "one settlement row per (sales_journal_id, card_network); the tier is selected from the monthly_volume_cents supplied on the row, never recomputed from stored settlements. Tier boundaries are inclusive at the lower edge: monthly_volume_cents == 5000000 selects 0.0220."
    constants:
      PER_TXN_FEE_CENTS: 12
      TIER_1_RATE: 0.0250
      TIER_2_RATE: 0.0220
      TIER_3_RATE: 0.0195
      TIER_2_FLOOR_CENTS: 5000000
      TIER_3_FLOOR_CENTS: 20000000
      AMEX_ADDER: 0.0035
    precision: "round_half_up to whole cents on the percentage component only"
    variants: []

  - name: change_order_denomination_plan
    trigger: "POST /cash-ops/change-orders"
    algorithm: waterfall_allocation
    formula: |
      applied_seasonal_profile = seasonal_profile_override or store.seasonal_profile
      multiplier               = SEASONAL_MULTIPLIER[applied_seasonal_profile]

      step 1: forecast_demand_cents = round_half_up(baseline_daily_cash_demand_cents
                                                   * days_covered * multiplier * (1 + growth_pct))

      # ROUNDING ORDER IS PINNED: round each denomination line UP to a whole strap/roll FIRST,
      # then sum the lines. Summing the exact per-line targets first and rounding the total once
      # gives a different answer: for forecast_demand_cents 1008000 the pinned per-line order
      # totals 1106000 while sum-then-round totals 1007200.
      step 2: for (denomination_cents, mix_pct, strap_units) in DENOM_MIX (descending denomination):
                  raw_units     = (forecast_demand_cents * mix_pct) / denomination_cents
                  strap_count   = ceil(raw_units / strap_units)
                  units         = strap_count * strap_units
                  planned_cents = units * denomination_cents
                  append { denomination_cents, strap_count, units, planned_cents } to planned_lines
      step 3: total_planned_cents = sum(line.planned_cents for line in planned_lines)
    input_set: "DENOM_MIX is fixed and complete — every one of the five rows always produces a planned_lines entry, including when raw_units rounds up from a fractional value; lines are emitted in descending denomination_cents order"
    constants:
      SEASONAL_MULTIPLIER: { BASELINE: 1.00, BACK_TO_SCHOOL: 1.35, HOLIDAY: 1.80 }
      DENOM_MIX:
        - { denomination_cents: 2000, mix_pct: 0.50, strap_units: 25 }
        - { denomination_cents: 1000, mix_pct: 0.20, strap_units: 25 }
        - { denomination_cents: 500,  mix_pct: 0.15, strap_units: 50 }
        - { denomination_cents: 100,  mix_pct: 0.10, strap_units: 50 }
        - { denomination_cents: 25,   mix_pct: 0.05, strap_units: 40 }
    precision: "round_half_up to whole cents in step 1; ceil to whole straps per line in step 2; no rounding in step 3"
    variants: []

  - name: variance_case_opening
    trigger: "system event: TillSession reconcile cascade links 2 and 3, and Deposit IN_TRANSIT -> DISCREPANT"
    algorithm: aggregation
    formula: |
      total_variance_cents =
          abs(session.variance_cents)                        if case_type == SESSION_VARIANCE
          cashier.rolling_absolute_variance_cents            if case_type == ROLLING_PATTERN
          abs(deposit.credit_variance_cents)                 if case_type == DEPOSIT_CREDIT
      suspected_theft = total_variance_cents >= store.theft_escalation_threshold_cents

      # Conservation identity, enforced after every attribution:
      total_variance_cents == attributed_register_cents
                            + attributed_safe_cents
                            + attributed_bank_cents
                            + unexplained_cents
      unexplained_cents = total_variance_cents - (attributed_register_cents
                                                  + attributed_safe_cents
                                                  + attributed_bank_cents)
    input_set: "total_variance_cents is an unsigned magnitude frozen at case creation and never recomputed, so later attributions and later sessions cannot move the denominator of the research"
    constants:
      ATTRIBUTION_BUCKETS: [REGISTER, SAFE, BANK]
    precision: "integer cents, exact"
    variants: []

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list; additionally, when X-User-Role is Cashier the acting X-User-ID must equal the target TillSession's cashier_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "request body shape: required fields present, enum members valid, integer cents fields are integers and non-negative EXCEPT BankCreditRecord.amount_cents with credit_type ADJUSTMENT and attribution amount_cents, both of which may be negative so a researcher can correct an earlier over-attribution; counted_lines entries carry denomination_cents in {2000,1000,500,100,25,10,5,1} with quantity >= 0, shift_end_at > shift_start_at, pickup_window_end > pickup_window_start, days_covered in 1..14, growth_pct in -0.50..2.00; POST /cash-ops/till-sessions/{id}/close requires pos_cash_sales_cents and pos_card_sales_cents unless forced_close == true. A reconcile of a session whose pos_cash_sales_cents is null (forced_close) also fails here."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 30
    category: existence
    check: "every {id} path segment resolves, validated left-to-right"
    error_id: "ERR_STORE_NOT_FOUND | ERR_CASHIER_NOT_FOUND | ERR_SAFE_NOT_FOUND | ERR_SALES_JOURNAL_NOT_FOUND | ERR_TILL_SESSION_NOT_FOUND | ERR_SAFE_TRANSACTION_NOT_FOUND | ERR_DEPOSIT_NOT_FOUND | ERR_BANK_CREDIT_RECORD_NOT_FOUND | ERR_CARD_SETTLEMENT_NOT_FOUND | ERR_VARIANCE_CASE_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 35
    category: existence
    check: "every FK supplied in the request body resolves (store_id, safe_id, cashier_id, sales_journal_id, till_session_id, deposit_id, change_order_id). Store scoping is part of resolution: a Cashier or Safe whose store_id differs from the SalesJournal's store_id on POST /cash-ops/till-sessions, POST /cash-ops/deposits or POST /cash-ops/safes/{id}/smart-deposits is treated as non-existent for that request (ERR_CASHIER_NOT_FOUND / ERR_SAFE_NOT_FOUND), so no caller can enumerate another store's rows"
    error_id: "ERR_STORE_NOT_FOUND | ERR_SAFE_NOT_FOUND | ERR_CASHIER_NOT_FOUND | ERR_SALES_JOURNAL_NOT_FOUND | ERR_TILL_SESSION_NOT_FOUND | ERR_DEPOSIT_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 40
    category: state
    check: "the target aggregate is in a state from which this transition is declared in §1.2 — TillSession status, Deposit status, VarianceCase status, ChangeOrder status, SalesJournal status, and Safe.open_state (a deposit prepare, deposit removal or manual drop requires Safe.open_state == UNLOCKED)"
    error_id: "ERR_TILL_SESSION_INVALID_STATE | ERR_DEPOSIT_INVALID_STATE | ERR_VARIANCE_CASE_INVALID_STATE | ERR_CHANGE_ORDER_INVALID_STATE | ERR_TENDERS_ALREADY_POSTED | ERR_SAFE_NOT_UNLOCKED | ERR_SAFE_OPEN_REQUEST_ACTIVE | ERR_SMART_SAFE_REQUIRED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 45
    category: business_safety
    check: "the safe's posture is not FROZEN — while a suspected-theft investigation has frozen the safe, no cash may enter or leave it (drops, starting-bank issues, deposit preparation, smart deposits, change-order receipts are all refused); only GET reads and posture restoration are permitted"
    error_id: ERR_SAFE_FROZEN
    http_status: 409
    applies_to: "POST /cash-ops/till-sessions, /cash-ops/till-sessions/{id}/drops, /cash-ops/safes/{id}/smart-deposits, /cash-ops/deposits, /cash-ops/change-orders/{id}/receive"
    notes: "checked before dual control and before the time-delay clock so that a frozen safe cannot be probed for its unlock timing"

  - priority: 50
    category: business_safety
    check: "the cashier's till_eligibility is not BARRED — a barred cashier may never be assigned a till"
    error_id: ERR_CASHIER_BARRED
    http_status: 403
    applies_to: "POST /cash-ops/till-sessions"

  - priority: 52
    category: business_safety
    check: "dual control: when store.dual_control_required is true, the X-User-ID opening the safe must differ from Safe.open_requested_by_user_id, and the X-User-ID sealing a deposit must differ from Deposit.prepared_by_user_id. One person may never both request and open, nor both prepare and seal."
    error_id: ERR_DUAL_CONTROL_VIOLATION
    http_status: 403
    applies_to: "POST /cash-ops/safes/{id}/open, POST /cash-ops/deposits/{id}/seal"
    notes: "deliberately ordered BEFORE the priority-56 time-delay check: a lone operator is turned away on the segregation-of-duties ground even when the delay has not yet elapsed, so the response never reveals whether the delay was satisfied"

  - priority: 54
    category: business_safety
    check: "till assignment gating on the cashier's variance record: a RESTRICTED cashier may only be assigned a till when coaching_state == COACHING_ACKNOWLEDGED (ERR_CASHIER_RESTRICTED otherwise); an ELIGIBLE cashier whose coaching_state == COACHING_DUE may only be assigned while clock <= coaching_due_at, which is the breach instant plus COACHING_GRACE_HOURS (72h) and is itself permitted (ERR_COACHING_NOT_ACKNOWLEDGED once that deadline has passed)"
    error_id: "ERR_CASHIER_RESTRICTED | ERR_COACHING_NOT_ACKNOWLEDGED"
    http_status: 409
    applies_to: "POST /cash-ops/till-sessions"

  - priority: 56
    category: business_temporal
    check: "time-delay device policy: an open of a MANUAL safe is permitted only when clock >= open_requested_at + store.safe_time_delay_minutes (ERR_TIME_DELAY_NOT_ELAPSED) and only while clock < open_requested_at + safe_time_delay_minutes + safe_open_window_minutes (ERR_SAFE_OPEN_REQUEST_EXPIRED, which also lapses the request back to LOCKED). The lower bound is inclusive; the upper bound is exclusive."
    error_id: "ERR_TIME_DELAY_NOT_ELAPSED | ERR_SAFE_OPEN_REQUEST_EXPIRED"
    http_status: 409
    applies_to: "POST /cash-ops/safes/{id}/open"

  - priority: 58
    category: business_constraint
    check: "temporal-overlap and uniqueness constraints. (a) Cashier shift overlap: the new TillSession's [shift_start_at, shift_end_at) must not overlap any non-terminal session of the same cashier — the interval is half-open, so back-to-back shifts touching at an instant are allowed (ERR_CASHIER_SHIFT_OVERLAP). (b) Pickup window conflict: the new Deposit's [pickup_window_start, pickup_window_end] expanded by store.pickup_buffer_minutes on BOTH sides must not intersect the identically expanded window of any SCHEDULED or IN_TRANSIT deposit of the same store — the interval is closed, so windows that merely touch after expansion DO conflict (ERR_PICKUP_WINDOW_CONFLICT). (c) One ACTIVE/PENDING_COUNT session per (sales_journal, register_number) (ERR_REGISTER_OCCUPIED). (d) One SalesJournal per (store_id, business_date) (ERR_DUPLICATE_BUSINESS_DATE). (e) One CardSettlement per (sales_journal_id, card_network) (ERR_SETTLEMENT_ALREADY_POSTED). (f) A BankCreditRecord already in match_state MATCHED cannot be re-matched (ERR_BANK_CREDIT_ALREADY_MATCHED). (g) The clock may only move forward (ERR_CLOCK_MONOTONIC)."
    error_id: "ERR_CASHIER_SHIFT_OVERLAP | ERR_PICKUP_WINDOW_CONFLICT | ERR_REGISTER_OCCUPIED | ERR_DUPLICATE_BUSINESS_DATE | ERR_SETTLEMENT_ALREADY_POSTED | ERR_BANK_CREDIT_ALREADY_MATCHED | ERR_CLOCK_MONOTONIC"
    http_status: 409
    applies_to: "POST /cash-ops/till-sessions, /cash-ops/deposits/{id}/schedule-pickup, /cash-ops/sales-journals, /cash-ops/card-settlements, /cash-ops/deposits/{id}/reconcile-bank, POST /_clock/set_current_utc"

  - priority: 60
    category: business_referential
    check: "cross-entity referential coherence. (a) A BankCreditRecord matched to a deposit must have credit_type FINAL or ADJUSTMENT for bank reconciliation and must belong to the deposit's store (ERR_CREDIT_TYPE_INVALID). (b) An attribution's amount_cents may not push attributed_register + attributed_safe + attributed_bank above the case's total_variance_cents (ERR_ATTRIBUTION_EXCEEDS_VARIANCE). (c) Escalation for suspected theft requires the case's total_variance_cents >= store.theft_escalation_threshold_cents OR case_type == ROLLING_PATTERN with a second RESTRICTED-triggering case inside ESCALATION_PATTERN_DAYS (ERR_ESCALATION_THRESHOLD_NOT_MET)."
    error_id: "ERR_CREDIT_TYPE_INVALID | ERR_ATTRIBUTION_EXCEEDS_VARIANCE | ERR_ESCALATION_THRESHOLD_NOT_MET"
    http_status: 422
    applies_to: "POST /cash-ops/deposits/{id}/reconcile-bank, /cash-ops/variance-cases/{id}/attributions, /cash-ops/variance-cases/{id}/escalate"

  - priority: 62
    category: business_fiscal
    check: "fiscal capacity. (a) A withdrawal from the safe (starting-bank issuance, deposit removal) may not drive Safe.balance_cents below zero (ERR_INSUFFICIENT_SAFE_BALANCE). (b) A store may not exceed store.max_daily_pickups SCHEDULED-or-later deposits whose pickup_window_start falls on the same calendar date (ERR_PICKUP_CAPACITY_EXCEEDED)."
    error_id: "ERR_INSUFFICIENT_SAFE_BALANCE | ERR_PICKUP_CAPACITY_EXCEEDED"
    http_status: 422
    applies_to: "POST /cash-ops/till-sessions, /cash-ops/deposits, /cash-ops/deposits/{id}/schedule-pickup"
    notes: "deliberately ordered AFTER the priority-40 Safe.open_state check: preparing a deposit that exceeds the safe balance while the safe is still LOCKED returns ERR_SAFE_NOT_UNLOCKED, not ERR_INSUFFICIENT_SAFE_BALANCE — the physical-control failure outranks the arithmetic one"

  - priority: 68
    category: business_constraint
    check: "optimistic concurrency: expected_safe_version must equal Safe.version at POST /cash-ops/deposits, and expected_variance_case_version must equal VarianceCase.version at POST /cash-ops/variance-cases/{id}/attributions"
    error_id: "ERR_SAFE_VERSION_STALE | ERR_CASE_VERSION_STALE"
    http_status: 412
    applies_to: "POST /cash-ops/deposits, POST /cash-ops/variance-cases/{id}/attributions"

endpoints:
  # ---------- test-driving clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the server reads that instant and never falls back to wall-clock time. The clock may only move forward."
    roles: [TreasuryAnalyst, CashOfficeClerk, StoreManager, ArmoredCarrier, LossPreventionInvestigator, Cashier]
    code: 200
    input: [current_utc]
    output: "{ current_utc }"
    side_effects: ["advances the logical clock used by time-delay, coaching-grace, rolling-window and pickup-window evaluation", "rejects a non-monotonic value with ERR_CLOCK_MONOTONIC"]

  # ---------- store & cashier master data ----------
  - method: POST
    path: "/cash-ops/stores"
    description: "Registers a store with its cash-office policy parameters."
    roles: [TreasuryAnalyst]
    code: 201
    input: [store_code, name, region_code, "safe_time_delay_minutes?", "safe_open_window_minutes?", "dual_control_required?", "pickup_buffer_minutes?", "max_daily_pickups?", "single_event_variance_threshold_cents?", "rolling_variance_threshold_cents?", "rolling_window_days?", "theft_escalation_threshold_cents?", "provisional_credit_cap_cents?", "seasonal_profile?"]
    output: Store
    side_effects: ["applies policy defaults for every omitted parameter"]

  - method: GET
    path: "/cash-ops/stores/{id}"
    description: "Reads one store with its policy parameters."
    roles: [TreasuryAnalyst, CashOfficeClerk, StoreManager, LossPreventionInvestigator]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/cash-ops/cashiers"
    description: "Enrolls a cashier at a store."
    roles: [StoreManager]
    code: 201
    input: [store_id, employee_code, display_name, "till_eligibility?"]
    output: Cashier
    side_effects: ["initialises coaching_state NONE, rolling_absolute_variance_cents 0, rolling_net_variance_cents 0, reconciled_session_count 0, open_case_count 0"]

  - method: POST
    path: "/cash-ops/cashiers/{id}/acknowledge-coaching"
    description: "Records that the cashier has sat the coaching conversation."
    roles: [Cashier, StoreManager]
    code: 200
    input: ["acknowledgement_note?"]
    output: Cashier
    side_effects: ["coaching_state COACHING_DUE -> COACHING_ACKNOWLEDGED", "clears the 72-hour grace deadline effect on till assignment", "increments Cashier.version by 1"]

  - method: GET
    path: "/cash-ops/cashiers/{id}"
    description: "Reads one cashier including rolling variance totals and coaching state."
    roles: [Cashier, StoreManager, CashOfficeClerk, LossPreventionInvestigator]
    code: 200
    input: []
    output: Cashier
    side_effects: []

  - method: GET
    path: "/cash-ops/cashiers"
    description: "Lists cashiers, filterable by store and eligibility."
    roles: [StoreManager, CashOfficeClerk, LossPreventionInvestigator, TreasuryAnalyst]
    code: 200
    input: ["store_id?", "till_eligibility?", "coaching_state?"]
    output: Cashier[]
    side_effects: []

  # ---------- safe ----------
  - method: POST
    path: "/cash-ops/safes"
    description: "Commissions a safe at a store and seeds its opening balance."
    roles: [TreasuryAnalyst]
    code: 201
    input: [store_id, safe_code, safe_type, opening_balance_cents]
    output: Safe
    side_effects: ["writes a SafeTransaction { txn_type: OPENING_BALANCE, declared_amount_cents: opening_balance_cents }", "recomputes safe_balance", "open_state LOCKED, posture OPEN"]

  - method: POST
    path: "/cash-ops/safes/{id}/open-requests"
    description: "Arms the time-delay device on a MANUAL safe. The safe becomes openable only after safe_time_delay_minutes and only for safe_open_window_minutes thereafter."
    roles: [CashOfficeClerk, StoreManager]
    code: 200
    input: ["reason?"]
    output: Safe
    side_effects: ["open_state LOCKED -> OPEN_REQUESTED", "sets open_requested_at = clock and open_requested_by_user_id = X-User-ID", "increments Safe.version by 1"]

  - method: POST
    path: "/cash-ops/safes/{id}/open"
    description: "Opens the safe once the time delay has elapsed. Under dual control the opener must not be the requester."
    roles: [CashOfficeClerk, StoreManager]
    code: 200
    input: []
    output: Safe
    side_effects: ["open_state OPEN_REQUESTED -> UNLOCKED and sets unlocked_at = clock", "on an expired request instead sets open_state OPEN_REQUESTED -> LOCKED, clears open_requested_at, increments Safe.version by 1 and returns ERR_SAFE_OPEN_REQUEST_EXPIRED", "increments Safe.version by 1"]

  - method: POST
    path: "/cash-ops/safes/{id}/smart-deposits"
    description: "Inserts a sealed bag into a SMART safe. The note validator grants provisional credit immediately; the safe never has to be opened."
    roles: [CashOfficeClerk, Cashier]
    code: 201
    input: [sales_journal_id, business_date, counted_lines, "suspect_note_cents?", "till_session_id?"]
    output: Deposit
    side_effects: ["creates a Deposit { deposit_type: SMART_SAFE, status: SEALED, credit_basis: SMART_PROVISIONAL }", "runs provisional_credit variant smart_safe_insertion and bank_credit_reconciliation steps 1-2", "writes a SafeTransaction { txn_type: SMART_DEPOSIT }", "adds provisional_credit_cents to Safe.provisional_credit_balance_cents and suspect_note_cents to Safe.suspect_note_cents", "recomputes safe_balance", "requires safe_type == SMART (ERR_SMART_SAFE_REQUIRED)", "increments Safe.version by 1"]

  - method: POST
    path: "/cash-ops/safes/{id}/restore-posture"
    description: "Lifts an investigation freeze on the safe once loss prevention has finished with it."
    roles: [LossPreventionInvestigator]
    code: 200
    input: ["investigation_note?"]
    output: Safe
    side_effects: ["posture FROZEN -> OPEN", "increments Safe.version by 1"]

  - method: GET
    path: "/cash-ops/safes/{id}"
    description: "Reads one safe including balance, provisional credit balance and open_state."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, LossPreventionInvestigator]
    code: 200
    input: []
    output: Safe
    side_effects: []

  - method: GET
    path: "/cash-ops/safes"
    description: "Lists safes, filterable by store."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, LossPreventionInvestigator]
    code: 200
    input: ["store_id?", "safe_type?"]
    output: Safe[]
    side_effects: []

  - method: GET
    path: "/cash-ops/safe-transactions/{id}"
    description: "Reads one immutable safe ledger row."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, LossPreventionInvestigator]
    code: 200
    input: []
    output: SafeTransaction
    side_effects: []

  - method: GET
    path: "/cash-ops/safe-transactions"
    description: "Lists safe ledger rows, filterable by safe, till session, deposit or change order."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, LossPreventionInvestigator]
    code: 200
    input: ["safe_id?", "till_session_id?", "deposit_id?", "change_order_id?", "txn_type?"]
    output: SafeTransaction[]
    side_effects: []

  # ---------- sales journal & card settlement ----------
  - method: POST
    path: "/cash-ops/sales-journals"
    description: "Opens the daily sales journal for a store and business date."
    roles: [CashOfficeClerk]
    code: 201
    input: [store_id, business_date]
    output: SalesJournal
    side_effects: ["status OPEN, all money and count fields 0", "enforces uniqueness on (store_id, business_date)"]

  - method: POST
    path: "/cash-ops/sales-journals/{id}/post-tenders"
    description: "Posts the POS tender totals for the day, which the cash office then ties out against register counts, deposits and card settlements."
    roles: [CashOfficeClerk]
    code: 200
    input: [journal_cash_sales_cents, journal_card_sales_cents]
    output: SalesJournal
    side_effects: ["status OPEN -> TENDERS_POSTED", "a second call returns ERR_TENDERS_ALREADY_POSTED", "increments SalesJournal.version by 1"]

  - method: GET
    path: "/cash-ops/sales-journals/{id}"
    description: "Reads one sales journal with its derived tie-out fields."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, LossPreventionInvestigator]
    code: 200
    input: []
    output: SalesJournal
    side_effects: []

  - method: GET
    path: "/cash-ops/sales-journals"
    description: "Lists sales journals, filterable by store, business date and status."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, LossPreventionInvestigator]
    code: 200
    input: ["store_id?", "business_date?", "status?"]
    output: SalesJournal[]
    side_effects: []

  - method: POST
    path: "/cash-ops/card-settlements"
    description: "Records the acquirer's settlement advice for one card network and reconciles it to the day's card sales."
    roles: [TreasuryAnalyst]
    code: 201
    input: [sales_journal_id, card_network, gross_card_sales_cents, txn_count, monthly_volume_cents, funded_amount_cents, "chargeback_cents?"]
    output: CardSettlement
    side_effects: ["runs card_settlement_reconciliation to derive expected_fee_cents, expected_funded_cents, settlement_variance_cents and settlement_status", "adds settlement_variance_cents into SalesJournal.settlement_variance_total_cents and increments SalesJournal.settlement_count", "re-derives the SalesJournal balanced_condition", "enforces uniqueness on (sales_journal_id, card_network)", "increments SalesJournal.version by 1"]

  - method: GET
    path: "/cash-ops/card-settlements/{id}"
    description: "Reads one card settlement with its derived fee and variance."
    roles: [TreasuryAnalyst, CashOfficeClerk, StoreManager]
    code: 200
    input: []
    output: CardSettlement
    side_effects: []

  - method: GET
    path: "/cash-ops/card-settlements"
    description: "Lists card settlements, filterable by sales journal and network."
    roles: [TreasuryAnalyst, CashOfficeClerk, StoreManager]
    code: 200
    input: ["sales_journal_id?", "card_network?", "settlement_status?"]
    output: CardSettlement[]
    side_effects: []

  # ---------- till session lifecycle ----------
  - method: POST
    path: "/cash-ops/till-sessions"
    description: "Assigns a register till to a cashier and issues the starting bank out of the safe."
    roles: [StoreManager, CashOfficeClerk]
    code: 201
    input: [sales_journal_id, cashier_id, safe_id, register_number, shift_start_at, shift_end_at, starting_bank_cents]
    output: TillSession
    side_effects: ["status ACTIVE, counted_lines null, expected_cash_cents null, variance_cents null, recount_count 0", "writes a SafeTransaction { txn_type: STARTING_BANK_ISSUE, declared_amount_cents: starting_bank_cents } and recomputes safe_balance", "increments SalesJournal.session_count", "enforces the half-open cashier shift overlap check, the (sales_journal, register_number) occupancy check, cashier eligibility gating and the safe balance floor", "increments Safe.version by 1"]

  - method: POST
    path: "/cash-ops/till-sessions/{id}/drops"
    description: "Records a mid-shift or closing drop of cash from the till into the safe, at the amount the cashier declares."
    roles: [Cashier]
    code: 201
    input: [txn_type, declared_amount_cents, "memo?"]
    output: SafeTransaction
    side_effects: ["writes a SafeTransaction with verified_amount_cents null and till_session_id set", "adds declared_amount_cents to TillSession.dropped_declared_cents", "recomputes safe_balance from declared amounts", "requires TillSession.status ACTIVE and Safe.open_state UNLOCKED for a MANUAL safe", "increments TillSession.version by 1"]

  - method: POST
    path: "/cash-ops/till-sessions/{id}/close"
    description: "Closes the register at shift end and freezes the POS tender totals. The response deliberately omits expected_cash_cents so the count that follows is blind. pos_cash_sales_cents and pos_card_sales_cents are required unless forced_close == true, in which case any POS figures supplied are ignored; forced_close == true is reserved to StoreManager."
    roles: [Cashier, StoreManager]
    code: 200
    input: ["pos_cash_sales_cents?", "pos_card_sales_cents?", "pos_paid_out_cents?", "forced_close?"]
    output: "{ id, status, register_number, shift_end_at, dropped_declared_cents, version }"
    side_effects: ["status ACTIVE -> PENDING_COUNT", "stores pos_cash_sales_cents, pos_card_sales_cents, pos_paid_out_cents", "with forced_close true the POS totals are left null and every later reconcile of the session returns ERR_INVALID_REQUEST", "increments TillSession.version by 1"]

  - method: POST
    path: "/cash-ops/till-sessions/{id}/blind-count"
    description: "Records the cash office's blind count of the till. The counter never sees the expected figure; the response returns only the counted total."
    roles: [CashOfficeClerk]
    code: 200
    input: [counted_lines]
    output: "{ id, status, counted_cash_cents, recount_count, version }"
    side_effects: ["status PENDING_COUNT -> COUNTED", "counted_cash_cents = sum(denomination_cents * quantity) over counted_lines; an empty list yields 0", "sets counted_by_user_id = X-User-ID", "expected_cash_cents and variance_cents remain null and are masked on read until reconcile", "increments TillSession.version by 1"]

  - method: POST
    path: "/cash-ops/till-sessions/{id}/recount"
    description: "Sends a counted till back for a second blind count, discarding the previous lines."
    roles: [CashOfficeClerk]
    code: 200
    input: [recount_reason]
    output: TillSession
    side_effects: ["status COUNTED -> PENDING_COUNT", "increments recount_count by 1", "clears counted_lines, counted_cash_cents and counted_by_user_id", "increments TillSession.version by 1"]

  - method: POST
    path: "/cash-ops/till-sessions/{id}/reconcile"
    description: "Reconciles the counted till: derives expected cash and the over/short, rolls the cashier's variance window, and opens variance cases where thresholds are met."
    roles: [CashOfficeClerk]
    code: 200
    input: []
    output: TillSession
    side_effects: ["status COUNTED -> RECONCILED", "runs till_over_short (declared_drops or verified_drops variant) to set variance_basis, expected_cash_cents and variance_cents", "cascade link 2: recomputes cashier_rolling_variance and may set Cashier.till_eligibility RESTRICTED", "cascade link 3: opens a SESSION_VARIANCE VarianceCase when abs(variance_cents) >= single_event_variance_threshold_cents and a ROLLING_PATTERN case when the rolling threshold is met, incrementing Cashier.open_case_count and SalesJournal.open_case_count", "cascade link 4: increments SalesJournal.reconciled_session_count, adds variance_cents into register_cash_tieout_cents and re-derives the journal's balanced_condition", "sets Cashier.coaching_state COACHING_DUE and coaching_due_at = clock + COACHING_GRACE_HOURS (72h) when the single-event threshold is met", "unmasks expected_cash_cents and variance_cents on subsequent reads", "increments TillSession.version, Cashier.version and SalesJournal.version by 1"]

  - method: GET
    path: "/cash-ops/till-sessions/{id}"
    description: "Reads one till session. While status is PENDING_COUNT or COUNTED the fields expected_cash_cents and variance_cents are returned as null so the blind count cannot be back-solved."
    roles: [Cashier, CashOfficeClerk, StoreManager, LossPreventionInvestigator]
    code: 200
    input: []
    output: TillSession
    side_effects: []

  - method: GET
    path: "/cash-ops/till-sessions"
    description: "Lists till sessions, filterable by sales journal, cashier, safe and status."
    roles: [Cashier, CashOfficeClerk, StoreManager, LossPreventionInvestigator]
    code: 200
    input: ["sales_journal_id?", "cashier_id?", "safe_id?", "status?"]
    output: TillSession[]
    side_effects: []

  # ---------- deposit preparation, pickup and bank reconciliation ----------
  - method: POST
    path: "/cash-ops/deposits"
    description: "Prepares a manual armored deposit: the cash office re-counts the drop bags out of the open safe, seals the value into a deposit and prices the carrier fee. Requires expected_safe_version, the Safe.version the clerk last observed."
    roles: [CashOfficeClerk]
    code: 201
    input: [safe_id, sales_journal_id, business_date, counted_lines, expected_safe_version, "verify_till_session_ids?", "suspect_note_cents?"]
    output: Deposit
    side_effects: ["creates a Deposit { deposit_type: MANUAL_ARMORED, status: PREPARING, credit_basis: CARRIER_PROVISIONAL }", "declared_total_cents = sum(denomination_cents * quantity) over counted_lines", "runs bank_credit_reconciliation steps 1-2 to set carrier_fee_cents and expected_credit_cents from declared_total_cents", "sets verified_amount_cents on every drop SafeTransaction of each session in verify_till_session_ids, using that session's share of the re-count, and populates TillSession.dropped_verified_cents — this is what flips till_over_short to the verified_drops variant", "writes a SafeTransaction { txn_type: DEPOSIT_REMOVAL, declared_amount_cents: declared_total_cents } and recomputes safe_balance", "requires Safe.open_state == UNLOCKED and Safe.posture != FROZEN; does NOT relock the safe", "rejects a stale expected_safe_version with ERR_SAFE_VERSION_STALE (412)", "increments Safe.version by 1"]

  - method: POST
    path: "/cash-ops/deposits/{id}/seal"
    description: "Seals the prepared deposit bag under dual control and relocks the safe. The sealer must not be the preparer."
    roles: [CashOfficeClerk, StoreManager]
    code: 200
    input: [seal_number]
    output: Deposit
    side_effects: ["status PREPARING -> SEALED", "sets sealed_by_user_id = X-User-ID", "sets Safe.open_state UNLOCKED -> LOCKED and clears open_requested_at / open_requested_by_user_id", "increments Deposit.version and Safe.version by 1"]

  - method: POST
    path: "/cash-ops/deposits/{id}/void"
    description: "Voids a deposit that has not yet left the store and returns the cash to the safe."
    roles: [StoreManager]
    code: 200
    input: [void_reason]
    output: Deposit
    side_effects: ["status PREPARING or SEALED -> VOIDED", "writes a compensating SafeTransaction { txn_type: DEPOSIT_RETURN, declared_amount_cents: declared_total_cents } and recomputes safe_balance", "for a SMART_SAFE deposit also subtracts provisional_credit_cents from Safe.provisional_credit_balance_cents and suspect_note_cents from Safe.suspect_note_cents", "leaves the drop rows' verified_amount_cents untouched — verification is a counting fact, not a cash movement", "increments Deposit.version and Safe.version by 1"]

  - method: POST
    path: "/cash-ops/deposits/{id}/schedule-pickup"
    description: "Books the sealed deposit onto an armored carrier pickup window. Windows are compared closed and expanded by the store's pickup buffer on both sides."
    roles: [CashOfficeClerk]
    code: 200
    input: [pickup_window_start, pickup_window_end, carrier_reference]
    output: Deposit
    side_effects: ["status SEALED -> SCHEDULED", "enforces the buffered pickup-window conflict check against other SCHEDULED / IN_TRANSIT deposits of the store and the max_daily_pickups aggregate", "increments Deposit.version by 1"]

  - method: POST
    path: "/cash-ops/deposits/{id}/pickup"
    description: "Records the carrier signing for the bag. Provisional credit is granted at the declared amount on the carrier's receipt."
    roles: [ArmoredCarrier]
    code: 200
    input: [picked_up_at, carrier_signature]
    output: Deposit
    side_effects: ["status SCHEDULED -> IN_TRANSIT", "runs provisional_credit variant carrier_receipt to set provisional_credit_cents", "adds provisional_credit_cents to Safe.provisional_credit_balance_cents for a MANUAL_ARMORED deposit", "increments Deposit.version and Safe.version by 1"]

  - method: POST
    path: "/cash-ops/deposits/{id}/reconcile-bank"
    description: "Matches posted bank credit records against the deposit's expected credit and settles the difference."
    roles: [TreasuryAnalyst]
    code: 200
    input: [bank_credit_record_ids]
    output: Deposit
    side_effects: ["runs bank_credit_reconciliation steps 3-5 over FINAL and ADJUSTMENT records only, setting credited_total_cents and credit_variance_cents", "status IN_TRANSIT -> RECONCILED when credit_variance_cents == 0, otherwise IN_TRANSIT -> DISCREPANT; DISCREPANT -> RECONCILED once a later ADJUSTMENT closes the gap", "sets each supplied BankCreditRecord.match_state to MATCHED and its deposit_id to this deposit", "on DISCREPANT opens a DEPOSIT_CREDIT VarianceCase and increments SalesJournal.open_case_count", "subtracts provisional_credit_cents from Safe.provisional_credit_balance_cents", "rejects PROVISIONAL credit_type with ERR_CREDIT_TYPE_INVALID and an already-matched record with ERR_BANK_CREDIT_ALREADY_MATCHED", "increments Deposit.version, Safe.version and SalesJournal.version by 1"]

  - method: GET
    path: "/cash-ops/deposits/{id}"
    description: "Reads one deposit including credit basis, expected credit and credit variance."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, ArmoredCarrier, LossPreventionInvestigator]
    code: 200
    input: []
    output: Deposit
    side_effects: []

  - method: GET
    path: "/cash-ops/deposits"
    description: "Lists deposits, filterable by safe, sales journal and status."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst, ArmoredCarrier, LossPreventionInvestigator]
    code: 200
    input: ["safe_id?", "sales_journal_id?", "status?", "business_date?"]
    output: Deposit[]
    side_effects: []

  - method: POST
    path: "/cash-ops/bank-credit-records"
    description: "Posts a credit line from the bank statement: a provisional float, a final credit, or a later adjustment."
    roles: [TreasuryAnalyst]
    code: 201
    input: [store_id, credit_type, amount_cents, value_date, bank_reference, "deposit_id?"]
    output: BankCreditRecord
    side_effects: ["match_state starts UNMATCHED unless deposit_id is supplied at creation, in which case the record is still UNMATCHED until reconcile-bank consumes it"]

  - method: GET
    path: "/cash-ops/bank-credit-records/{id}"
    description: "Reads one bank credit record."
    roles: [TreasuryAnalyst, CashOfficeClerk, StoreManager]
    code: 200
    input: []
    output: BankCreditRecord
    side_effects: []

  - method: GET
    path: "/cash-ops/bank-credit-records"
    description: "Lists bank credit records, filterable by store, deposit, credit type and match state."
    roles: [TreasuryAnalyst, CashOfficeClerk, StoreManager]
    code: 200
    input: ["store_id?", "deposit_id?", "credit_type?", "match_state?"]
    output: BankCreditRecord[]
    side_effects: []

  # ---------- variance research ----------
  - method: POST
    path: "/cash-ops/variance-cases/{id}/attributions"
    description: "Records where a slice of the variance was found — register, safe or bank. Requires expected_variance_case_version, the VarianceCase.version the researcher last observed."
    roles: [CashOfficeClerk, StoreManager]
    code: 200
    input: [bucket, amount_cents, note, expected_variance_case_version]
    output: VarianceCase
    side_effects: ["status OPEN -> RESEARCHING on the first attribution", "appends { bucket, amount_cents, note, recorded_at } to attributions and adds amount_cents into the matching attributed_*_cents field", "recomputes unexplained_cents so that total_variance_cents == attributed_register_cents + attributed_safe_cents + attributed_bank_cents + unexplained_cents always holds", "status RESEARCHING -> EXPLAINED and SalesJournal.net_unexplained_cents adjustment once unexplained_cents reaches 0", "rejects an over-attribution with ERR_ATTRIBUTION_EXCEEDS_VARIANCE and a stale expected_variance_case_version with ERR_CASE_VERSION_STALE (412)", "increments VarianceCase.version by 1"]

  - method: POST
    path: "/cash-ops/variance-cases/{id}/escalate"
    description: "Escalates a case as suspected theft, which freezes the safe and bars the cashier."
    roles: [StoreManager, LossPreventionInvestigator]
    code: 200
    input: [escalation_reason]
    output: VarianceCase
    side_effects: ["status OPEN or RESEARCHING -> ESCALATED and sets suspected_theft true and escalated_by_user_id = X-User-ID", "cascade link 2: sets Cashier.till_eligibility BARRED for the case's cashier", "cascade link 3: sets Safe.posture FROZEN for every safe of the case's store, blocking all cash movement", "requires the escalation threshold or the 90-day rolling pattern (ERR_ESCALATION_THRESHOLD_NOT_MET)", "increments VarianceCase.version, Cashier.version and Safe.version by 1"]

  - method: POST
    path: "/cash-ops/variance-cases/{id}/close"
    description: "Closes an ESCALATED case. disposition is SUBSTANTIATED or UNSUBSTANTIATED; any other status returns ERR_VARIANCE_CASE_INVALID_STATE."
    roles: [LossPreventionInvestigator]
    code: 200
    input: [disposition, "closing_note?"]
    output: VarianceCase
    side_effects: ["status ESCALATED -> CLOSED_SUBSTANTIATED when disposition == SUBSTANTIATED, ESCALATED -> CLOSED_UNSUBSTANTIATED when disposition == UNSUBSTANTIATED", "on CLOSED_SUBSTANTIATED writes a SafeTransaction { txn_type: VARIANCE_ADJUSTMENT, declared_amount_cents: unexplained_cents } against the store's lowest-created_at safe, recomputes safe_balance, and leaves Cashier.till_eligibility == BARRED", "on CLOSED_UNSUBSTANTIATED writes no SafeTransaction and restores Cashier.till_eligibility to RESTRICTED when rolling_absolute_variance_cents >= Store.rolling_variance_threshold_cents, else to ELIGIBLE", "restores Safe.posture to OPEN for every safe of the store when no ESCALATED case remains", "decrements Cashier.open_case_count and SalesJournal.open_case_count and re-derives the journal's balanced_condition", "increments VarianceCase.version by 1"]

  - method: GET
    path: "/cash-ops/variance-cases/{id}"
    description: "Reads one variance case including its attribution list and unexplained remainder."
    roles: [CashOfficeClerk, StoreManager, LossPreventionInvestigator, TreasuryAnalyst]
    code: 200
    input: []
    output: VarianceCase
    side_effects: []

  - method: GET
    path: "/cash-ops/variance-cases"
    description: "Lists variance cases, filterable by sales journal, cashier, deposit, case type and status."
    roles: [CashOfficeClerk, StoreManager, LossPreventionInvestigator, TreasuryAnalyst]
    code: 200
    input: ["sales_journal_id?", "cashier_id?", "deposit_id?", "case_type?", "status?"]
    output: VarianceCase[]
    side_effects: []

  # ---------- change order forecasting ----------
  - method: POST
    path: "/cash-ops/change-orders"
    description: "Forecasts the coming week's cash demand and plans the denomination mix in whole straps and rolls."
    roles: [CashOfficeClerk]
    code: 201
    input: [store_id, target_week_start, days_covered, baseline_daily_cash_demand_cents, "growth_pct?", "seasonal_profile_override?"]
    output: ChangeOrder
    side_effects: ["status DRAFT", "runs change_order_denomination_plan to set applied_seasonal_profile, forecast_demand_cents, planned_lines and total_planned_cents"]

  - method: POST
    path: "/cash-ops/change-orders/{id}/approve"
    description: "Approves the change order for transmission to the bank."
    roles: [StoreManager]
    code: 200
    input: ["approval_note?"]
    output: ChangeOrder
    side_effects: ["status DRAFT -> APPROVED and sets approved_by_user_id = X-User-ID", "increments ChangeOrder.version by 1"]

  - method: POST
    path: "/cash-ops/change-orders/{id}/reject"
    description: "Rejects the change order."
    roles: [StoreManager]
    code: 200
    input: [rejection_reason]
    output: ChangeOrder
    side_effects: ["status DRAFT -> REJECTED (terminal)", "increments ChangeOrder.version by 1"]

  - method: POST
    path: "/cash-ops/change-orders/{id}/receive"
    description: "Receives the delivered change order into the safe."
    roles: [CashOfficeClerk]
    code: 200
    input: [received_amount_cents]
    output: ChangeOrder
    side_effects: ["status APPROVED -> RECEIVED (terminal)", "writes a SafeTransaction { txn_type: CHANGE_ORDER_RECEIPT, declared_amount_cents: received_amount_cents } against the store's lowest-created_at safe and recomputes safe_balance", "requires Safe.posture != FROZEN", "increments ChangeOrder.version and Safe.version by 1"]

  - method: GET
    path: "/cash-ops/change-orders/{id}"
    description: "Reads one change order with its forecast and denomination plan."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/cash-ops/change-orders"
    description: "Lists change orders, filterable by store and status."
    roles: [CashOfficeClerk, StoreManager, TreasuryAnalyst]
    code: 200
    input: ["store_id?", "status?", "target_week_start?"]
    output: ChangeOrder[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, or a Cashier acts on a till session that is not their own"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum member, negative cents where non-negative is required, unknown denomination in counted_lines, shift_end_at <= shift_start_at, pickup_window_end <= pickup_window_start, days_covered outside 1..14, growth_pct outside -0.50..2.00, or reconcile of a forced-closed session whose pos_cash_sales_cents is null"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "no Store with the given id"
  - id: ERR_CASHIER_NOT_FOUND
    http: 404
    condition: "no Cashier with the given id"
  - id: ERR_SAFE_NOT_FOUND
    http: 404
    condition: "no Safe with the given id"
  - id: ERR_SALES_JOURNAL_NOT_FOUND
    http: 404
    condition: "no SalesJournal with the given id"
  - id: ERR_TILL_SESSION_NOT_FOUND
    http: 404
    condition: "no TillSession with the given id"
  - id: ERR_SAFE_TRANSACTION_NOT_FOUND
    http: 404
    condition: "no SafeTransaction with the given id"
  - id: ERR_DEPOSIT_NOT_FOUND
    http: 404
    condition: "no Deposit with the given id"
  - id: ERR_BANK_CREDIT_RECORD_NOT_FOUND
    http: 404
    condition: "no BankCreditRecord with one of the given ids"
  - id: ERR_CARD_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "no CardSettlement with the given id"
  - id: ERR_VARIANCE_CASE_NOT_FOUND
    http: 404
    condition: "no VarianceCase with the given id"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "no ChangeOrder with the given id"
  - id: ERR_DUPLICATE_BUSINESS_DATE
    http: 409
    condition: "a SalesJournal already exists for this (store_id, business_date)"
  - id: ERR_TENDERS_ALREADY_POSTED
    http: 409
    condition: "post-tenders called on a SalesJournal whose status is not OPEN"
  - id: ERR_SETTLEMENT_ALREADY_POSTED
    http: 409
    condition: "a CardSettlement already exists for this (sales_journal_id, card_network)"
  - id: ERR_TILL_SESSION_INVALID_STATE
    http: 409
    condition: "the till session is not in a state from which the requested transition is declared — e.g. blind-count on an ACTIVE session, reconcile on a PENDING_COUNT session, recount on a RECONCILED session, or a drop on a session that is no longer ACTIVE"
  - id: ERR_REGISTER_OCCUPIED
    http: 409
    condition: "an ACTIVE or PENDING_COUNT session already holds this register_number on this sales journal"
  - id: ERR_CASHIER_SHIFT_OVERLAP
    http: 409
    condition: "the requested [shift_start_at, shift_end_at) half-open interval overlaps another non-terminal session of the same cashier; intervals that merely touch at an instant do not conflict"
  - id: ERR_CASHIER_BARRED
    http: 403
    condition: "till assignment attempted for a cashier whose till_eligibility is BARRED"
  - id: ERR_CASHIER_RESTRICTED
    http: 409
    condition: "till assignment attempted for a RESTRICTED cashier whose coaching_state is not COACHING_ACKNOWLEDGED"
  - id: ERR_COACHING_NOT_ACKNOWLEDGED
    http: 409
    condition: "till assignment attempted after Cashier.coaching_due_at (the single-event breach instant plus COACHING_GRACE_HOURS = 72) while coaching_state is still COACHING_DUE"
  - id: ERR_SAFE_NOT_UNLOCKED
    http: 409
    condition: "a cash movement requiring physical access (manual drop, deposit preparation) attempted while Safe.open_state is not UNLOCKED"
  - id: ERR_SAFE_OPEN_REQUEST_ACTIVE
    http: 409
    condition: "an open request was armed while Safe.open_state is already OPEN_REQUESTED or UNLOCKED"
  - id: ERR_TIME_DELAY_NOT_ELAPSED
    http: 409
    condition: "open attempted before open_requested_at + safe_time_delay_minutes; the boundary instant itself is permitted"
  - id: ERR_SAFE_OPEN_REQUEST_EXPIRED
    http: 409
    condition: "open attempted at or after open_requested_at + safe_time_delay_minutes + safe_open_window_minutes; the request lapses back to LOCKED as part of returning this error"
  - id: ERR_DUAL_CONTROL_VIOLATION
    http: 403
    condition: "the same X-User-ID both requested and opened the safe, or both prepared and sealed a deposit, while store.dual_control_required is true"
  - id: ERR_SAFE_FROZEN
    http: 409
    condition: "any cash movement attempted while Safe.posture is FROZEN by an active theft investigation"
  - id: ERR_INSUFFICIENT_SAFE_BALANCE
    http: 422
    condition: "a starting-bank issuance or deposit removal would drive Safe.balance_cents below zero"
  - id: ERR_SMART_SAFE_REQUIRED
    http: 409
    condition: "a smart-safe insertion attempted against a safe whose safe_type is MANUAL"
  - id: ERR_DEPOSIT_INVALID_STATE
    http: 409
    condition: "the deposit is not in a state from which the requested transition is declared — e.g. sealing a SEALED deposit, scheduling a PREPARING deposit, picking up a deposit that is not SCHEDULED, reconciling one that is not IN_TRANSIT or DISCREPANT, or voiding one that has already left the store"
  - id: ERR_PICKUP_WINDOW_CONFLICT
    http: 409
    condition: "the requested pickup window, expanded by pickup_buffer_minutes on both sides, intersects the identically expanded window of another SCHEDULED or IN_TRANSIT deposit of the same store; touching counts as intersecting"
  - id: ERR_PICKUP_CAPACITY_EXCEEDED
    http: 422
    condition: "the store already has max_daily_pickups deposits scheduled with a pickup_window_start on the same calendar date"
  - id: ERR_CREDIT_TYPE_INVALID
    http: 422
    condition: "a PROVISIONAL bank credit record was submitted for bank reconciliation, or a record belonging to another store was submitted"
  - id: ERR_BANK_CREDIT_ALREADY_MATCHED
    http: 409
    condition: "a bank credit record whose match_state is already MATCHED was submitted again"
  - id: ERR_VARIANCE_CASE_INVALID_STATE
    http: 409
    condition: "the variance case is not in a state from which the requested transition is declared — e.g. attributing to a CLOSED case, escalating an EXPLAINED case, or closing an OPEN case"
  - id: ERR_ATTRIBUTION_EXCEEDS_VARIANCE
    http: 422
    condition: "the attribution would push attributed_register_cents + attributed_safe_cents + attributed_bank_cents above total_variance_cents"
  - id: ERR_ESCALATION_THRESHOLD_NOT_MET
    http: 422
    condition: "escalation attempted on a case whose total_variance_cents is below theft_escalation_threshold_cents and which is not a ROLLING_PATTERN case with a second qualifying case inside ESCALATION_PATTERN_DAYS"
  - id: ERR_CHANGE_ORDER_INVALID_STATE
    http: 409
    condition: "the change order is not in a state from which the requested transition is declared — e.g. approving a RECEIVED order, receiving a DRAFT order, or rejecting an APPROVED order"
  - id: ERR_SAFE_VERSION_STALE
    http: 412
    condition: "expected_safe_version does not equal the Safe's current version at POST /cash-ops/deposits"
  - id: ERR_CASE_VERSION_STALE
    http: 412
    condition: "expected_variance_case_version does not equal the VarianceCase's current version at POST /cash-ops/variance-cases/{id}/attributions"
  - id: ERR_CLOCK_MONOTONIC
    http: 422
    condition: "the requested current_utc is earlier than the clock's present value"

roles:
  - name: Cashier
    description: "Operates a register till: takes the starting bank, makes mid-shift and closing drops, closes the register at shift end, and inserts sealed bags into a smart safe. Never sees the expected-cash figure and never counts their own till."
    identity: "entity_backed:Cashier"
    exclusive_operations: ["record a till drop"]
    shared_operations: ["close a till session", "insert a smart-safe deposit", "acknowledge coaching", "read own till sessions and own cashier record", "set the logical clock"]

  - name: CashOfficeClerk
    description: "Runs the back-office cash room: opens the day's journal, blind-counts tills, reconciles over/short, prepares and seals armored deposits, books carrier pickups, and files change orders. Cannot approve, void, or investigate."
    identity: opaque
    exclusive_operations: ["open a sales journal", "post POS tender totals", "blind-count a till", "order a recount", "reconcile a till session", "prepare an armored deposit", "book a carrier pickup window", "create a change order", "receive a change order into the safe"]
    shared_operations: ["arm a safe open request", "open the safe", "seal a deposit", "assign a till session", "insert a smart-safe deposit", "record a variance attribution", "read stores, cashiers, safes, journals, sessions, deposits, cases and change orders"]

  - name: StoreManager
    description: "Accountable store officer: enrolls cashiers, assigns tills, provides the second pair of hands for dual control, voids deposits that never left the store, approves or rejects change orders, and escalates suspected theft."
    identity: opaque
    exclusive_operations: ["enroll a cashier", "void a deposit", "approve a change order", "reject a change order"]
    shared_operations: ["arm a safe open request", "open the safe", "seal a deposit", "assign a till session", "close a till session", "acknowledge coaching on a cashier's behalf", "record a variance attribution", "escalate a variance case", "read stores, cashiers, safes, journals, sessions, deposits, settlements, cases and change orders"]

  - name: ArmoredCarrier
    description: "External carrier crew. Sees only the sealed deposits booked for pickup and signs for them, which starts the provisional-credit clock."
    identity: opaque
    exclusive_operations: ["record a carrier pickup"]
    shared_operations: ["read deposits", "set the logical clock"]

  - name: TreasuryAnalyst
    description: "Central treasury: commissions stores and safes, posts bank statement credits and acquirer settlement advices, and reconciles expected versus credited amounts. Never touches physical cash and never counts a till."
    identity: opaque
    exclusive_operations: ["register a store", "commission a safe", "post a bank credit record", "post a card settlement", "reconcile a deposit against the bank"]
    shared_operations: ["read stores, cashiers, safes, journals, deposits, bank credits, settlements, cases and change orders", "set the logical clock"]

  - name: LossPreventionInvestigator
    description: "Investigates suspected theft. Can escalate and close cases and lift a safe's investigation freeze, but has no authority to move cash, count a till, or prepare a deposit."
    identity: opaque
    exclusive_operations: ["restore a frozen safe's posture", "close a variance case with a disposition"]
    shared_operations: ["escalate a variance case", "read stores, cashiers, safes, journals, sessions, deposits, cases and safe transactions", "set the logical clock"]
