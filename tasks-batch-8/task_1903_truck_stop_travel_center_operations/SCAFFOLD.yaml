scenario: |
  1903. Truck Stop & Travel Center Operations (Pilot/Love's travel center): fuel pricing (retail vs contract) & discount networks, parking capacity & paid reservation mix, shower/laundry/scale service queueing, restaurant & retail inventory, loyalty program points & fuel discount stacking, maintenance shop & road service dispatch, cash handling & security across 24-hour ops, DEF/oil bulk supply

domain_name: truck-stop-travel-center
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine            # retail vs contract quoting, tiered contract rates, points/discount stacking
  secondary_archetype: quota_allocation        # parking capacity, shower/laundry queueing, bay scheduling
  complexity_layers:
    - optimistic_concurrency                   # OCC on TravelCenterSite.version (price supersede) and FleetContract.version (amendments)
    - cascading_side_effects                   # payout -> shift expected -> register posture -> close gating; delivery -> tank -> reorder -> rack -> contract quote
    - dual_variant_calculation                 # provisional-vs-final fuel amounts; provisional-vs-confirmed contract tier
    - rate_threshold_triggers                  # tier breakpoints (5000/20000 gal rolling), register NEEDS_DROP/LOW_FLOAT triggers, reorder thresholds
    - derived_field_reconciliation             # site retail price mirrors, stock is_low_stock, tank projections, member points balance
    - scheduled_actions                        # future-effective fuel prices become the selected quote as the logical clock advances
    - pagination_with_filtering                # list endpoints with filters
  entity_topology: flat                        # peer entities with FK references; no nested creation paths
  state_machine_shape: parallel                # FuelSale carries status x payment_status; several other machines are cyclic/branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override            # GeneralManager superset; ShiftManager/FuelDeskLead mid-tier; segregation_of_duties on shift cash
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
