scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Customer.fields.full_name, entities.Customer.fields.store_credit_cents, entities.Customer.fields.loyalty_tier]
        distinguishing_aspect: "POST /customers with full_name+phone returns 201; store_credit_cents defaults 0 and loyalty_tier defaults STANDARD."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "New Customer", phone: "555-1000" }
              as: CounterClerk
              captures: { cid: "$.data.id", tier: "$.data.loyalty_tier", credit: "$.data.store_credit_cents" }
          assert:
            - "Customer.${cid}.store_credit_cents == 0"
            - "Customer.${cid}.loyalty_tier == STANDARD"

      - name: get_customer_not_found
        claim_type: Not Found
        grounds: [entities.Customer]
        distinguishing_aspect: "GET /customers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShiftManager
              captures: { err: "$.data.error_id" }
          assert:
            - "GET customer response error_id == ERR_NOT_FOUND"

      - name: create_cut_type_missing_required_field
        claim_type: Required Fields
        grounds: [entities.CutType.fields.base_price_cents_per_kg]
        distinguishing_aspect: "POST /cut-types omitting base_price_cents_per_kg returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cut-types"
              payload: { code: "BAD", species: "BEEF" }
              as: ShiftManager
              captures: { err: "$.data.error_id" }
          assert:
            - "POST cut-types response error_id == ERR_INVALID_REQUEST"

      - name: create_cut_type_invalid_enum_species
        claim_type: Type Constraints
        grounds: [entities.CutType.fields.species]
        distinguishing_aspect: "POST /cut-types with species not in {BEEF,PORK,LAMB,POULTRY} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cut-types"
              payload: { code: "FISHY", species: "FISH", base_price_cents_per_kg: 1000 }
              as: ShiftManager
              captures: { err: "$.data.error_id" }
          assert:
            - "POST cut-types response error_id == ERR_INVALID_REQUEST"

      - name: inventory_lot_computed_remaining_weight_initialized
        claim_type: Computed Fields
        grounds: [entities.InventoryLot.fields.remaining_weight_g, entities.InventoryLot.fields.received_weight_g]
        distinguishing_aspect: "POST /inventory-lots sets remaining_weight_g equal to received_weight_g and lot_status AVAILABLE; any client-sent remaining ignored."
        test_recipe:
          setup: ["A RIBEYE cut type."]
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
          trigger:
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${ribeye_id}", received_weight_g: 3000 }
              as: Butcher
              captures: { lot_id: "$.data.id", rem: "$.data.remaining_weight_g", st: "$.data.lot_status" }
          assert:
            - "InventoryLot.${lot_id}.remaining_weight_g == 3000"
            - "InventoryLot.${lot_id}.lot_status == AVAILABLE"

      - name: tempreading_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TempReading]
        distinguishing_aspect: "TempReading has common_fields:false; the create response carries id and created_at but no version field (append-only log)."
        test_recipe:
          setup: ["An OPERATIONAL locker band [0,4]C."]
          setup_api_calls:
            - call: "POST /dry-age-lockers"
              payload: { name: "LOCKER-IMM", capacity_g: 10000, min_temp_c: 0, max_temp_c: 4 }
              as: ShiftManager
              captures: { locker_id: "$.data.id" }
          trigger:
            - call: "POST /dry-age-lockers/${locker_id}/temp-readings"
              payload: { temp_c: 2.0, reading_at: "2026-06-02T00:00:00Z" }
              as: SafetyOfficer
              captures: { in_band: "$.data.in_band" }
          assert:
            - "TempReading.in_band == true"
            - "TempReading.triggered_quarantine == false"

      - name: list_cut_types_pagination_envelope
        claim_type: Listing
        grounds: [entities.CutType]
        distinguishing_aspect: "GET /cut-types returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two cut types created."]
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "BRISKET", species: "BEEF", base_price_cents_per_kg: 2500 }
              as: ShiftManager
          trigger:
            - call: "GET /cut-types"
              payload: { limit: 1, offset: 0 }
              as: CounterClerk
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_order_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.CustomOrder.PLACED_to_CONFIRMED]
        distinguishing_aspect: "Confirming a CONFIRMED order (no PLACED->CONFIRMED available) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CONFIRMED STANDARD order with one RIBEYE line."]
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /customers"
              payload: { full_name: "Ida Invalid", phone: "555-1001" }
              as: CounterClerk
              captures: { ida_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${ida_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 1000 } ] }
              as: CounterClerk
              as_user_id: "${ida_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
          trigger:
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "second confirm response error_id == ERR_INVALID_STATE"

      - name: cancel_filled_order_from_terminal_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CustomOrder.CONFIRMED_to_FILLED, state_machines.CustomOrder.PLACED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a FILLED order (terminal) returns ERR_INVALID_STATE (409); no refund fires."
        test_recipe:
          setup: ["A FILLED STANDARD order: one RIBEYE line drawn at catch 1000g (final 3840c), from a 2000g lot."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Tom Terminal", phone: "555-1002" }
              as: CounterClerk
              captures: { tt_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${tt_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 1000 } ] }
              as: CounterClerk
              as_user_id: "${tt_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /custom-orders/${order_id}/order-lines"
              payload: {}
              as: CounterClerk
              captures: { line_id: "$.data[0].id" }
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${ribeye_id}", received_weight_g: 2000 }
              as: Butcher
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /order-lines/${line_id}/draw"
              payload: { drawn_lot_id: "${lot_id}", catch_weight_g: 1000, expected_inventory_lot_version: "${lot_v}" }
              as: Butcher
            - call: "POST /custom-orders/${order_id}/fill"
              payload: {}
              as: Butcher
              captures: { st: "$.data.order_status", ft: "$.data.final_total_cents" }
          trigger:
            - call: "POST /custom-orders/${order_id}/cancel"
              payload: {}
              as: CounterClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "CustomOrder.${order_id}.order_status == FILLED before cancel"
            - "CustomOrder.${order_id}.final_total_cents == 3840"
            - "cancel response error_id == ERR_INVALID_STATE"

      - name: lot_bubbles_to_depleted_when_remaining_hits_zero
        claim_type: Side Effect Execution
        grounds: [state_machines.InventoryLot.AVAILABLE_to_DEPLETED, state_machines.OrderLine.PENDING_to_DRAWN]
        distinguishing_aspect: "Drawing a line at a catch weight equal to the lot's full remaining bubbles the lot AVAILABLE -> DEPLETED (remaining 0)."
        test_recipe:
          setup: ["A 2000g RIBEYE lot; a CONFIRMED order line; draw the full 2000g."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Della Deplete", phone: "555-1003" }
              as: CounterClerk
              captures: { dd_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${dd_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 2000 } ] }
              as: CounterClerk
              as_user_id: "${dd_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /custom-orders/${order_id}/order-lines"
              payload: {}
              as: CounterClerk
              captures: { line_id: "$.data[0].id" }
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${ribeye_id}", received_weight_g: 2000 }
              as: Butcher
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
          trigger:
            - call: "POST /order-lines/${line_id}/draw"
              payload: { drawn_lot_id: "${lot_id}", catch_weight_g: 2000, expected_inventory_lot_version: "${lot_v}" }
              as: Butcher
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: Butcher
              captures: { st: "$.data.lot_status", rem: "$.data.remaining_weight_g" }
          assert:
            - "InventoryLot.${lot_id}.remaining_weight_g == 0"
            - "InventoryLot.${lot_id}.lot_status == DEPLETED"

      - name: locker_release_resumes_held_lots
        claim_type: Compensation
        grounds: [state_machines.DryAgeLocker.QUARANTINED_to_OPERATIONAL, state_machines.InventoryLot.ON_HOLD_to_AGING]
        distinguishing_aspect: "Releasing a QUARANTINED locker flips its ON_HOLD lots back to AGING and bumps locker.version; aging_started_at unchanged."
        test_recipe:
          setup: ["A QUARANTINED locker (out-of-band reading) holding one previously-AGING DRY_RIBEYE lot now ON_HOLD."]
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "DRY_RIBEYE", species: "BEEF", base_price_cents_per_kg: 6000, requires_dry_age: true }
              as: ShiftManager
              captures: { dr_id: "$.data.id" }
            - call: "POST /dry-age-lockers"
              payload: { name: "LOCKER-REL", capacity_g: 20000, min_temp_c: 0, max_temp_c: 4 }
              as: ShiftManager
              captures: { locker_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShiftManager
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 5000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_id: "$.data.id" }
            - call: "POST /inventory-lots/${lot_id}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
            - call: "POST /dry-age-lockers/${locker_id}/temp-readings"
              payload: { temp_c: 10.0, reading_at: "2026-06-02T00:00:00Z" }
              as: SafetyOfficer
            - call: "GET /dry-age-lockers/${locker_id}"
              payload: {}
              as: ShiftManager
              captures: { lv: "$.data.version" }
          trigger:
            - call: "POST /dry-age-lockers/${locker_id}/release"
              payload: { expected_dry_age_locker_version: "${lv}" }
              as: ShiftManager
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: Butcher
              captures: { st: "$.data.lot_status" }
          assert:
            - "DryAgeLocker.${locker_id}.locker_status == OPERATIONAL"
            - "InventoryLot.${lot_id}.lot_status == AGING"

      - name: order_fill_filled_branch_all_lines_drawn
        claim_type: Valid Transition
        grounds: [state_machines.CustomOrder.CONFIRMED_to_FILLED]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / order_fork_filled_vs_short_filled_divergent_side_effects"
          rationale: "The FILLED-vs-SHORT_FILLED fork (including the all-lines-drawn FILLED branch's final_total_cents) is exercised by that §1.8 instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: preferred_tier_discount_applied_on_estimate
        claim_type: Correct Result
        grounds: [calculations.estimated_line_price, entities.Customer.fields.loyalty_tier, entities.PricingPolicy.fields.preferred_discount_pct]
        distinguishing_aspect: "A PREFERRED customer's 2000g RIBEYE estimate applies preferred_discount_pct 0.10: 2000g*4.0c*0.9 = 7200c."
        test_recipe:
          setup: ["Active PricingPolicy (preferred 0.10); RIBEYE base 4000; a PREFERRED customer."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Petra Preferred", phone: "555-1004", loyalty_tier: "PREFERRED" }
              as: CounterClerk
              captures: { pp_id: "$.data.id" }
          trigger:
            - call: "POST /custom-orders"
              payload: { customer_id: "${pp_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 2000 } ] }
              as: CounterClerk
              as_user_id: "${pp_id}"
              captures: { order_id: "$.data.id", est: "$.data.estimated_total_cents" }
          assert:
            - "CustomOrder.${order_id}.estimated_total_cents == 7200"

      - name: holiday_deposit_quarter_of_estimate
        claim_type: Constants Applied
        grounds: [calculations.holiday_deposit, entities.CustomOrder.fields.deposit_cents]
        distinguishing_aspect: "HOLIDAY_DEPOSIT_RATE 0.25 applied once on the order total: estimate 8000c -> deposit 2000c, charged on placement."
        test_recipe:
          setup: ["A HolidayWindow before cutoff; RIBEYE cut; a HOLIDAY order of one 2000g RIBEYE line (estimate 8000c)."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-19T00:00:00Z" }
              as: ShiftManager
            - call: "POST /holiday-windows"
              payload: { name: "THANKSGIVING_2026", pickup_date: "2026-11-26T00:00:00Z", capacity_g: 100000, cutoff_at: "2026-11-20T00:00:00Z" }
              as: ShiftManager
              captures: { win_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Holly Deposit", phone: "555-1005" }
              as: CounterClerk
              captures: { hd_id: "$.data.id" }
          trigger:
            - call: "POST /custom-orders"
              payload: { customer_id: "${hd_id}", order_kind: "HOLIDAY", holiday_window_id: "${win_id}", pickup_date: "2026-11-26T00:00:00Z", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 2000 } ] }
              as: CounterClerk
              as_user_id: "${hd_id}"
              captures: { order_id: "$.data.id", dep: "$.data.deposit_cents" }
            - call: "GET /customers/${hd_id}"
              payload: {}
              as: ShiftManager
              captures: { credit: "$.data.store_credit_cents" }
          assert:
            - "CustomOrder.${order_id}.estimated_total_cents == 8000"
            - "CustomOrder.${order_id}.deposit_cents == 2000"

      - name: share_remaining_after_single_quarter_claim
        claim_type: Correct Result
        grounds: [calculations.share_remaining_carcass, entities.AnimalShare.fields.remaining_carcass_g]
        distinguishing_aspect: "A single QUARTER claim on a 100000g carcass sets claimed_fraction_x4 1 and remaining_carcass_g floor(100000*3/4)=75000."
        test_recipe:
          setup: ["An OPEN AnimalShare carcass 100000g, deposit 8000c; a customer."]
          setup_api_calls:
            - call: "POST /animal-shares"
              payload: { species: "BEEF", carcass_weight_g: 100000, deposit_cents: 8000 }
              as: ShiftManager
              captures: { share_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Quincy Quarter", phone: "555-1006" }
              as: CounterClerk
              captures: { q_id: "$.data.id" }
          trigger:
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${q_id}", fraction: "QUARTER" }
              as: CounterClerk
              as_user_id: "${q_id}"
              captures: { claim_id: "$.data.id", dep: "$.data.deposit_paid_cents" }
            - call: "GET /animal-shares/${share_id}"
              payload: {}
              as: ShiftManager
              captures: { rem: "$.data.remaining_carcass_g", x4: "$.data.claimed_fraction_x4" }
          assert:
            - "ShareClaim.${claim_id}.deposit_paid_cents == 8000"
            - "AnimalShare.${share_id}.claimed_fraction_x4 == 1"
            - "AnimalShare.${share_id}.remaining_carcass_g == 75000"

      - name: dual_variant_divergence_estimate_vs_final
        claim_type: Variant Divergence
        grounds: [calculations.estimated_line_price, calculations.final_line_price]
        excluded_because:
          difficulty_instance: "dual_variant_calc / orderline_estimate_vs_final_catch_weight_price"
          rationale: "Estimate-vs-final divergence on the same OrderLine is the named §1.8 dual-variant instance."

  # =========================================================================
  - section: validations
    instances:
      - name: cut_type_mismatch_on_draw
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_CUT_TYPE_MISMATCH]"]
        distinguishing_aspect: "Drawing a RIBEYE line from a BRISKET lot returns ERR_CUT_TYPE_MISMATCH (422)."
        test_recipe:
          setup: ["A CONFIRMED order line for RIBEYE; an AVAILABLE BRISKET lot of 3000g."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /cut-types"
              payload: { code: "BRISKET", species: "BEEF", base_price_cents_per_kg: 2500 }
              as: ShiftManager
              captures: { brisket_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Moe Mismatch", phone: "555-1007" }
              as: CounterClerk
              captures: { mm_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${mm_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 1000 } ] }
              as: CounterClerk
              as_user_id: "${mm_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /custom-orders/${order_id}/order-lines"
              payload: {}
              as: CounterClerk
              captures: { line_id: "$.data[0].id" }
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${brisket_id}", received_weight_g: 3000 }
              as: Butcher
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
          trigger:
            - call: "POST /order-lines/${line_id}/draw"
              payload: { drawn_lot_id: "${lot_id}", catch_weight_g: 1000, expected_inventory_lot_version: "${lot_v}" }
              as: Butcher
              captures: { err: "$.data.error_id" }
          assert:
            - "draw response error_id == ERR_CUT_TYPE_MISMATCH"

      - name: output_not_grind_on_batch_create
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_OUTPUT_NOT_GRIND]"]
        distinguishing_aspect: "Creating a SausageBatch whose output_cut_type_id is a non-grind cut returns ERR_OUTPUT_NOT_GRIND (422)."
