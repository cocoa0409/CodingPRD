          - endpoints.POST_/ppa/deals
          - entities.Project.fields.available_mw
        distinguishing_aspect: |
          The capacity pool is consumed at deal CREATION, not at execution, and it counts
          every non-TERMINATED deal regardless of status - so two DRAFT deals that will
          never be signed still exhaust a project. Equality is admitted (the last
          20.000 MW of a 50.000 MW project books exactly), and once available_mw reaches
          0.000 even a small deal is refused, which distinguishes an exhausted pool from
          an oversized single request.
