# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1654: Long-Haul Trucking Carrier Operations
# All arithmetic precomputed. Canonical refdata: clock 2026-08-01T06:00:00Z,
# lane TX->GA 900mi floor 200, US-NATIONAL pump 450 (FSC 20769 on 900mi),
# MILEAGE driver 62cpm last_home 2026-07-28, tractor odo 100000 fuel 150/200,
# load rate 250000 pickup 2026-08-02T08:00Z delivery 2026-08-03T18:00Z.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: driver_create_applies_defaults
        claim_type: creation
        grounds: ["entities.Driver", "endpoints[POST /drivers]"]
        distinguishing_aspect: "Creation succeeds with server defaults: employment_status ACTIVE, duty_status OFF_DUTY, safety_score 100, version 1."
        test_recipe:
          setup: ["Clock at default or set; empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
          trigger:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C1", full_name: "C One", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { d_id: $.data.id, d_emp: $.data.employment_status, d_duty: $.data.duty_status, d_score: $.data.safety_score, d_ver: $.data.version } }
          assert:
            - "${d_emp} == ACTIVE, ${d_duty} == OFF_DUTY, ${d_score} == 100, ${d_ver} == 1, ${d_id} present"

      - name: driver_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Driver", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required cdl_number -> 400 ERR_INVALID_REQUEST (no resource created)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drivers", payload: { full_name: "No Cdl", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"

      - name: driver_create_invalid_pay_model_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Driver.fields.pay_model", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pay_model outside {MILEAGE, PERCENTAGE} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C3", full_name: "C Three", home_terminal: "DAL", pay_model: "WEEKLY", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"

      - name: driver_percentage_model_requires_percentage_bp
        claim_type: type_constraints
        grounds: ["entities.Driver.fields.pay_percentage_bp", "errors[ERR_PAY_CONFIG_INCOMPLETE]", "validations[priority=10]"]
        distinguishing_aspect: "Conditional constraint: pay_model PERCENTAGE without pay_percentage_bp -> 422 ERR_PAY_CONFIG_INCOMPLETE (symmetrically MILEAGE without pay_rate_cents_per_mile)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C4", full_name: "C Four", home_terminal: "DAL", pay_model: "PERCENTAGE", hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_PAY_CONFIG_INCOMPLETE"

      - name: driver_create_computed_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Driver.fields.safety_score"]
        distinguishing_aspect: "Client-sent safety_score is ignored; server computes 100."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C5", full_name: "C Five", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z", safety_score: 5 }, as: FleetAdmin, captures: { d_score: $.data.safety_score } }
          assert:
            - "captured ${d_score} == 100 (client input 5 ignored)"

      - name: driver_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_DRIVER_NOT_FOUND]", "endpoints[GET /drivers/{id}]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> 404 ERR_DRIVER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /drivers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_DRIVER_NOT_FOUND"

      - name: drivers_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /drivers]"]
        distinguishing_aspect: "List endpoint paginates: limit 2 over 3 rows -> 2 items + total_count 3 + has_more true; offset 2 -> 1 item + has_more false; order is created_at ASC."
        test_recipe:
          setup: ["three drivers created in order"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-P1", full_name: "P One", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { p1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-P2", full_name: "P Two", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { p2: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-P3", full_name: "P Three", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { p3: $.data.id } }
          trigger:
            - { call: "GET /drivers", payload: { limit: 2, offset: 0 }, as: Dispatcher, captures: { f0: "$.data[0].id", f1: "$.data[1].id" } }
            - { call: "GET /drivers", payload: { limit: 2, offset: 2 }, as: Dispatcher, captures: { f2: "$.data[0].id" } }
          assert:
            - "page 1: ${f0} == ${p1}, ${f1} == ${p2}; pagination block shows total_count 3, has_more true"
            - "page 2: ${f2} == ${p3}; pagination block shows total_count 3, has_more false"

      - name: tractor_create_get_roundtrip
        claim_type: retrieval
        grounds: ["entities.Tractor", "endpoints[GET /tractors/{id}]"]
        distinguishing_aspect: "GET returns exactly the stored fields."
        test_recipe:
          setup: ["one tractor"]
          setup_api_calls:
            - { call: "POST /tractors", payload: { unit_number: "T-C1", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
          trigger:
            - { call: "GET /tractors/${tr}", payload: {}, as: Dispatcher, captures: { unit: $.data.unit_number, st: $.data.status, odo: $.data.odometer_miles, fuel: $.data.current_fuel_gallons } }
          assert:
            - "${unit} == T-C1, ${st} == AVAILABLE, ${odo} == 100000, ${fuel} == 150"

      - name: tractor_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Tractor"]
        distinguishing_aspect: "Client-sent id/version are ignored; server mints UUID id and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tractors", payload: { unit_number: "T-C2", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150, id: "11111111-2222-4333-8444-555555555555", version: 9 }, as: FleetAdmin, captures: { tr_id: $.data.id, tr_ver: $.data.version } }
          assert:
            - "captured ${tr_id} != 11111111-2222-4333-8444-555555555555 and ${tr_ver} == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: load_initial_state_tendered
        claim_type: initial_state
        grounds: ["state_machines.Load"]
        distinguishing_aspect: "Newly tendered load starts in TENDERED with null computed fields."
        test_recipe:
          setup: ["customer and lane exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
          trigger:
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { st: $.data.status, fm: $.data.final_margin_cents } }
          assert:
            - "captured ${st} == TENDERED and ${fm} == null"

      - name: load_rescreen_after_screen_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Load.TENDERED_to_SCREENED", "errors[ERR_LOAD_NOT_TENDERED]"]
        distinguishing_aspect: "Screen is TENDERED-only; a second screen hits ERR_LOAD_NOT_TENDERED (idempotency-by-rejection)."
        test_recipe:
          setup: ["load already SCREENED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
          trigger:
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_LOAD_NOT_TENDERED"

      - name: load_cancel_in_transit_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Load.DISPATCHED_to_IN_TRANSIT", "errors[ERR_LOAD_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancellation is locked once IN_TRANSIT (DEPARTED_PICKUP observed); cancel -> ERR_LOAD_NOT_CANCELLABLE."
        test_recipe:
          setup: ["F1 chain to DISPATCHED, clock 2026-08-02T10:00Z, ARRIVED_PICKUP + DEPARTED_PICKUP recorded (load IN_TRANSIT)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C12", full_name: "C Twelve", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-C12", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id } }
            - { call: "POST /trips/${trip}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: FleetAdmin }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_PICKUP", occurred_at: "2026-08-02T07:50:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DEPARTED_PICKUP", occurred_at: "2026-08-02T10:00:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /loads/${load}/cancel", payload: {}, as: LoadPlanner, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_LOAD_NOT_CANCELLABLE (IN_TRANSIT is beyond the cancellable set)"

      - name: load_cancel_accepted_flat_fee_tier
        claim_type: valid_transition
        grounds: ["state_machines.Load.ACCEPTED_to_CANCELLED", "calculations.cancellation_fee_tiers"]
        distinguishing_aspect: "Cancel from ACCEPTED applies the flat 15000 tier; TENDERED cancel is 0."
        test_recipe:
          setup: ["load1 ACCEPTED; load2 TENDERED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load1: $.data.id } }
            - { call: "POST /loads/${load1}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load1}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load2: $.data.id } }
          trigger:
            - { call: "POST /loads/${load1}/cancel", payload: {}, as: LoadPlanner, captures: { fee1: $.data.cancellation_fee_cents, st1: $.data.status } }
            - { call: "POST /loads/${load2}/cancel", payload: {}, as: LoadPlanner, captures: { fee2: $.data.cancellation_fee_cents } }
          assert:
            - "ACCEPTED cancel: ${st1} == CANCELLED, ${fee1} == 15000"
            - "TENDERED cancel: ${fee2} == 0"

      - name: load_cancel_tonu_greater_of_tier
        claim_type: side_effect_execution
        grounds: ["state_machines.Load.ASSIGNED_to_CANCELLED", "calculations.cancellation_fee_tiers", "state_machines.Trip.PLANNED_to_CANCELLED"]
        distinguishing_aspect: "TONU tier: fee = max(25000, round_half_up(300000*0.10)) = 30000 (percentage tier wins over flat); the ASSIGNED trip is cancelled (reason CUSTOMER) and the tractor released."
        test_recipe:
          setup: ["load rate 300000 ACCEPTED with PLANNED trip (tractor ASSIGNED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C14", full_name: "C Fourteen", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-C14", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 300000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id } }
          trigger:
            - { call: "POST /loads/${load}/cancel", payload: {}, as: LoadPlanner, captures: { fee: $.data.cancellation_fee_cents, lst: $.data.status } }
            - { call: "GET /trips/${trip}", payload: {}, as: Dispatcher, captures: { tst: $.data.status, treason: $.data.cancel_reason } }
            - { call: "GET /tractors/${tr}", payload: {}, as: Dispatcher, captures: { trst: $.data.status } }
          assert:
            - "${lst} == CANCELLED, ${fee} == 30000 (max(25000, 30000): percentage tier wins)"
            - "${tst} == CANCELLED, ${treason} == CUSTOMER, ${trst} == AVAILABLE"

      - name: trip_redispatch_rejected
        claim_type: idempotency
        grounds: ["state_machines.Trip.PLANNED_to_DISPATCHED", "errors[ERR_TRIP_NOT_PLANNED]"]
        distinguishing_aspect: "Second dispatch of the same trip is rejected (ERR_TRIP_NOT_PLANNED); no duplicate side effects."
        test_recipe:
          setup: ["F1 chain through trip creation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-C15", full_name: "C Fifteen", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-C15", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id } }
          trigger:
            - { call: "POST /trips/${trip}/dispatch", payload: {}, as: Dispatcher, captures: { st1: $.data.status } }
