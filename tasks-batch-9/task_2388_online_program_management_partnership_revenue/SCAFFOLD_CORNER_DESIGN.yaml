              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { c2_id: $.data.id }
          trigger:
            - call: "PATCH /courses/${c1_id}"
              payload: { prerequisite_course_id: "${c2_id}" }
              as: FacultyChair
              as_user_id: "chair-1"
              captures: { e9: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e9} == ERR_PREREQUISITE_CYCLE"
            - "Course.${c1_id}.prerequisite_course_id == null"

      - name: marketing_spend_over_the_remaining_budget_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 45 ERR_MARKETING_BUDGET_EXCEEDED]
          - entities.Partnership.fields.marketing_budget_remaining_cents
        distinguishing_aspect: "The budget guard compares against the live remaining balance, not the original budget: with 4000000 remaining, a single SPEND of 4000001 cents is refused by one cent and the balance is untouched."
        test_recipe:
          setup:
            - "EXECUTED Partnership with marketing_budget_cents 4000000 and no spend posted yet, and a DRAFT Program under it."
          setup_api_calls:
            - *k_clock
