        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          PAIR {state (prio 5: plan not ACTIVE), business_fiscal (prio 14: overpayment)}:
          a POST /payments to a REFUNDED plan with amount 9999999 (> balance) returns the
          lower-priority-number error ERR_INVALID_STATE, NOT ERR_PAYMENT_EXCEEDS_BALANCE.
        test_recipe:
          setup:
            - "Clock 2026-08-18. OPEN departure; enrollment; deposit 30000 paid; enrollment cancelled -> plan status REFUNDED."
