  # ===========================================================================
  # Rule 2 - combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cut_to_length_per_segment_rounding_order_mode_b
        grounds:
          - calculations.shipment_invoice_amount
          - calculations.order_quoted_total
          - entities.CustomerOrder.fields.requested_cut_lengths_ft
          - entities.Shipment.fields.cuts_count
          - entities.Shipment.fields.extended_amount_usd
        distinguishing_aspect: |
          Mode (b) nested-rounding order: three 1250 ft cuts at 106.7800 USD/kft
          round to 133.48 each and sum to 400.44, whereas summing the unrounded
          segment amounts and rounding once yields 400.43 - the scaffold pins
          round-per-segment-then-sum, so a one-cent difference falsifies the
          wrong order on both the quote and the invoice.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; single copper settlement 2026-07-30 at 4.10 USD/lb."
            - "QUALIFIED compounds, ACTIVE UL file E12345, RELEASED SKU THHN-12-CU (conductor_lbs_per_kft 19.8)."
            - "Customer ACME, credit_limit_usd 100000.00, pass_through_enabled true."
            - "Order SO-CUT with cut_to_length_service true, requested_cut_lengths_ft [1250, 1250, 1250], ordered_kft 3.750, conversion 85.00, ORDER_DATE_LOCK, order_date 2026-07-30."
            - "One 3750 ft packaged lot on reel R-CUT, shipment STAGED with cuts_count 3 and ship_date 2026-08-05."
