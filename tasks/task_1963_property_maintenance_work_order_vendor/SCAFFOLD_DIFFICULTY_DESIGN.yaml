# =============================================================================
# Task 1963: Scaffold Difficulty Design (§1.8 Test Targeting Index)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two calculations, different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: sla_report_open_inclusive_vs_closed_only
        grounds:
          - calculations.sla_compliance_report
          - entities.WorkOrder.fields.response_sla_breached
          - entities.WorkOrder.fields.completion_sla_breached
        distinguishing_aspect: |
          SLA reporting domain (WorkOrder/Property aggregate): identical data set
          (one compliant COMPLETED order + one open breached ROUTINE order) yields
          100.00 under basis=CLOSED_ONLY but 50.00 under basis=OPEN_INCLUSIVE.
        test_recipe:
          setup:
            - "Property with default SLA config (routine_response_hours=72, routine_completion_hours=168)"
            - "Work order A (ROUTINE): created 2026-08-01T00:00:00Z, dispatched/started/signed-off, completed 2026-08-02T00:00:00Z — compliant on both SLAs"
            - "Work order B (ROUTINE): created 2026-08-02T00:00:00Z, never dispatched"
            - "Logical clock at 2026-08-11T00:00:00Z — B is past response_due_at (2026-08-05) and completion_due_at (2026-08-09)"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "SLA Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "101", full_name: "R One", email: "r1@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak A" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_a: $.data.id }
            - call: "POST /work-orders/${wo_a}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_a}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PropertyManager
            - call: "POST /work-orders/${wo_a}/complete"
              payload: { photo_urls: ["https://x/a1.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak B" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "GET /properties/${prop_id}/sla-report"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-12T00:00:00Z", basis: "CLOSED_ONLY" }
              as: PropertyManager
            - call: "GET /properties/${prop_id}/sla-report"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-12T00:00:00Z", basis: "OPEN_INCLUSIVE" }
              as: PropertyManager
          assert:
            - "CLOSED_ONLY report: ROUTINE metrics response_compliance_pct == 100.00 and completion_compliance_pct == 100.00 (eligible set is work order A only)"
            - "OPEN_INCLUSIVE report: ROUTINE metrics response_compliance_pct == 50.00 and completion_compliance_pct == 50.00 (eligible set is A and B; B breached both)"
            - "The two bases disagree on identical underlying data (100.00 vs 50.00)"

      - name: chargeback_provisional_vs_final_amount
        grounds:
          - calculations.chargeback_amount
          - entities.Chargeback.fields.provisional_amount_cents
          - entities.Chargeback.fields.final_amount_cents
        distinguishing_aspect: |
          Chargeback/Resident fiscal domain (different entity domain from the SLA
          report instance): the same damage event carries provisional_amount_cents
          == 4999 (raw technician estimate) but final_amount_cents == 5000 after
          per-line round_half_up of 3 * 3333 * 0.5 = 4999.5.
        test_recipe:
          setup:
            - "Property (defaults), Resident R, Technician T (PLUMBING)"
            - "Work order (PLUMBING, ROUTINE) taken to IN_PROGRESS with resident sign-off"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "CB Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "102", full_name: "R Two", email: "r2@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Broken tile" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/d1.jpg"], damage_reported: true, estimated_damage_cost_cents: 4999 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: PropertyManager
              captures: {cb_id: "$.data[0].id"}
          trigger:
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "BILL", line_items: [{ description: "Drywall patch", quantity: 3, unit_cost_cents: 3333, resident_share_pct: 0.5 }] }
              as: PropertyManager
            - call: "GET /residents/${res_id}"
              payload: {}
              as: PropertyManager
          assert:
            - "Chargeback.${cb_id}.provisional_amount_cents == 4999 (unchanged raw estimate)"
            - "Chargeback.${cb_id}.final_amount_cents == 5000 (per-line round_half_up of 4999.5)"
            - "provisional_amount_cents != final_amount_cents for the same damage event"
            - "Resident.${res_id}.chargeback_balance_cents == 5000"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — different modes (a) and (b)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: purchase_total_handling_branch_and_threshold
        grounds:
          - calculations.purchase_request_total
          - entities.PurchaseRequest.fields.handling_fee_cents
          - entities.PurchaseRequest.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (a) — a >=3-input non-linear formula: handling fee branches on
          quantity (>=10 exempts), then the total branches on the property
          threshold; qty 3 x 12000 + 2000 shipping yields handling 2880 and total
          40880 (auto-APPROVED), while qty 12 yields handling 0 and total 144000
          (PENDING).
        test_recipe:
          setup:
            - "Property with default purchase_auto_approve_threshold_cents=50000; work order IN_PROGRESS assigned to technician; stocked part exists"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "PR Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "103", full_name: "R Three", email: "r3@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "VLV-1", name: "Valve", unit_cost_cents: 12000, reorder_level: 0, initial_stock: 0 }
              as: PropertyManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Pipe work" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v3: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 3, quoted_unit_cost_cents: 12000, shipping_fee_cents: 2000, expected_work_order_version: "${wo_v3}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr_a: $.data.id }
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Dispatcher
              captures: { wo_v4: $.data.version }
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 12, quoted_unit_cost_cents: 12000, shipping_fee_cents: 0, expected_work_order_version: "${wo_v4}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr_b: $.data.id }
          assert:
            - "PurchaseRequest.${pr_a}: items_subtotal_cents == 36000, handling_fee_cents == 2880 (round_half_up(36000*0.08)), estimated_total_cents == 40880"
            - "PurchaseRequest.${pr_a}: status == APPROVED and auto_approved == true (40880 <= 50000)"
            - "PurchaseRequest.${pr_b}: items_subtotal_cents == 144000, handling_fee_cents == 0 (quantity 12 >= 10 exempts), estimated_total_cents == 144000"
            - "PurchaseRequest.${pr_b}: status == PENDING and auto_approved == false (144000 > 50000)"

      - name: chargeback_per_line_round_then_sum
        grounds:
          - calculations.chargeback_amount
          - entities.Chargeback.fields.final_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: two identical lines of
          3 * 3333 * 0.5 = 4999.5 are rounded PER LINE then summed giving 10000;
          the alternative sum-then-round order would give 9999. The scaffold pins
          per-line-then-sum.
        test_recipe:
          setup:
            - "Completed work order with damage (estimate 9999); PENDING chargeback exists"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Round Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "104", full_name: "R Four", email: "r4@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Wall damage" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/w1.jpg"], damage_reported: true, estimated_damage_cost_cents: 9999 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: PropertyManager
              captures: {cb_id: "$.data[0].id"}
          trigger:
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "BILL", line_items: [{ description: "Patch A", quantity: 3, unit_cost_cents: 3333, resident_share_pct: 0.5 }, { description: "Patch B", quantity: 3, unit_cost_cents: 3333, resident_share_pct: 0.5 }] }
              as: PropertyManager
          assert:
            - "Chargeback.${cb_id}.final_amount_cents == 10000 (5000 per line after round_half_up, then summed)"
            - "final_amount_cents != 9999 (the sum-then-round alternative is NOT used)"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — cyclic machines on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_reopen_cycle
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_REOPENED
          - state_machines.WorkOrder.REOPENED_to_ASSIGNED
          - entities.WorkOrder.fields.recall_count
        distinguishing_aspect: |
          WorkOrder is cyclic: COMPLETED -> REOPENED -> ASSIGNED -> IN_PROGRESS ->
          COMPLETED loops with recall_count incrementing and resident_signoff
          reset forcing a fresh sign-off on the second pass.
        test_recipe:
          setup:
            - "Work order completed once at 2026-08-01T00:00:00Z (default clock), within the 30-day recall window"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cycle Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "105", full_name: "R Five", email: "r5@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Recurring leak" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T08:00:00Z", scheduled_end_at: "2026-08-01T10:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/c1.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/reopen"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
              captures: { ro_status: $.data.status, ro_count: $.data.recall_count, ro_signoff: $.data.resident_signoff }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T14:00:00Z", scheduled_end_at: "2026-08-01T16:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/c2.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { fin_status: $.data.status, fin_count: $.data.recall_count }
          assert:
            - "After reopen: status == REOPENED, recall_count == 1, resident_signoff == false"
            - "Re-dispatch from REOPENED succeeds (cyclic re-entry into ASSIGNED)"
            - "Second completion requires a fresh sign-off (succeeds only after the second sign-off call)"
            - "After second complete: status == COMPLETED and recall_count == 1"

      - name: chargeback_dispute_loop
        grounds:
          - state_machines.Chargeback.BILLED_to_DISPUTED
          - state_machines.Chargeback.DISPUTED_to_BILLED
          - state_machines.Chargeback.DISPUTED_to_WAIVED
          - calculations.resident_chargeback_balance
        distinguishing_aspect: |
          Chargeback is cyclic: BILLED -> DISPUTED -> BILLED (UPHOLD) -> DISPUTED
          -> WAIVED; the dispute loop leaves Resident.chargeback_balance_cents
          unchanged (DISPUTED stays in the balance input set) while WAIVE zeroes it.
        test_recipe:
          setup:
            - "BILLED chargeback of final_amount_cents == 10000 for resident R (balance 10000)"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Loop Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "106", full_name: "R Six", email: "r6@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Cabinet damage" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/d2.jpg"], damage_reported: true, estimated_damage_cost_cents: 10000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: PropertyManager
              captures: {cb_id: "$.data[0].id"}
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "BILL", line_items: [{ description: "Cabinet", quantity: 1, unit_cost_cents: 10000, resident_share_pct: 1.0 }] }
              as: PropertyManager
          trigger:
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "DISPUTE", dispute_reason: "pre-existing damage" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { st1: $.data.status }
            - call: "GET /residents/${res_id}"
              payload: {}
              as: PropertyManager
              captures: { bal_disputed: $.data.chargeback_balance_cents }
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "UPHOLD" }
              as: PropertyManager
              captures: { st2: $.data.status }
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "DISPUTE", dispute_reason: "second dispute" }
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "WAIVE" }
              as: PropertyManager
              captures: { st3: $.data.status }
            - call: "GET /residents/${res_id}"
              payload: {}
              as: PropertyManager
              captures: { bal_waived: $.data.chargeback_balance_cents }
          assert:
            - "After DISPUTE: status == DISPUTED and Resident.chargeback_balance_cents == 10000 (dispute does not reduce balance)"
            - "After UPHOLD: status == BILLED (cycle DISPUTED -> BILLED traversed)"
            - "Second DISPUTE succeeds from BILLED (loop repeats)"
            - "After WAIVE from DISPUTED: status == WAIVED and Resident.chargeback_balance_cents == 0"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade — depth >= 3 and depth >= 2, different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: vendor_suspend_cascade_depth3
        grounds:
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
          - state_machines.WorkOrder.ASSIGNED_to_TRIAGED
          - state_machines.WorkOrderPart.RESERVED_to_RELEASED
          - calculations.part_stock_ledger
        distinguishing_aspect: |
          Trigger POST /vendors/{id}/events (SUSPEND), depth 3: vendor suspension
          reverts its ASSIGNED work order to TRIAGED (link 1); that reversion
          releases the work order's RESERVED parts (link 2); each release restores
          Part.quantity_on_hand/reserved_quantity and flips restock_status from
          LOW_STOCK back to IN_STOCK (link 3).
        test_recipe:
          setup:
            - "Vendor V (ACTIVE, PLUMBING, insured until 2027-01-01) assigned to a work order (window 10:00-12:00)"
            - "Part P initial_stock 5, reorder_level 2; 3 units reserved on the work order -> quantity_on_hand 2, reserved_quantity 3, restock_status LOW_STOCK"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cascade Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "107", full_name: "R Seven", email: "r7@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /vendors"
