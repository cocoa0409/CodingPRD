        distinguishing_aspect: "With EQUIFAX 700, EXPERIAN 720, TRANSUNION 660 and weights 0.35/0.35/0.30, composite_credit_score == 695 exactly."
        test_recipe:
          setup: ["Verified subscriber on a TRI plan; all three bureaus refreshed in EQUIFAX, EXPERIAN, TRANSUNION order."]
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
