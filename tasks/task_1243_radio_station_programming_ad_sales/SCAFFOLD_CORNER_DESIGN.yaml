        distinguishing_aspect: "With separations at 0 the temporal checks pass and the pure quota check fires: 2nd placement of the same song with max_spins_per_day == 1 -> 422."
        test_recipe:
          setup: ["station; category sep 0/0 cap 1; song S1; log 2026-05-04 LOCKED (MON clock); S1 placed at hour 8"]
          setup_api_calls:
            - { call: "POST /stations", payload: { call_sign: "KAAA", market_name: "Metro" }, as: SalesManager, captures: { st: $.data.id } }
