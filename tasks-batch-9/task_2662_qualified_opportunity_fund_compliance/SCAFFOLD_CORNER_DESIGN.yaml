              as: FundManager
              as_user_id: "mgr-fund-2"
              captures: { err_cross_fund: $.data.error_id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_a2}", window_start: "2026-02-01T00:00:00Z", aggregation_method: "AGGREGATED_GROUP", group_key: "GRP-2662-A" }
              as: FundManager
