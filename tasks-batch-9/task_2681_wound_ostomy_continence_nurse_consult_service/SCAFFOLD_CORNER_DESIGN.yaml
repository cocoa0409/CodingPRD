              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-081", surface_class: "ALTERNATING_PRESSURE", daily_rate_cents: 10000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-04T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v: "$.data.version" }
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${u1_v}" }
              as: MaterialsCoordinator
          trigger:
            - call: "POST /support-surface-orders/${o1_id}/reconcile"
              payload: {}
              as: MaterialsCoordinator
              captures: { err_id: "$.data.error_id" }
            - call: "POST /support-surface-orders/${o1_id}/deliver"
              payload: { delivered_at: "2026-08-01T00:00:00Z" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o1_id}/reconcile"
              payload: {}
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o1_id}/return"
              payload: { actual_return_at: "2026-08-04T00:00:00Z" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o1_id}/reconcile"
              payload: {}
              as: MaterialsCoordinator
          assert:
            - "SupportSurfaceOrder.${o1_id}.projected_cost_cents == 30000 (3 tier-1 days at 10000) and authorized_cost_cents == 32400 (fee 2400 at FEE_PCT_TIER_1 0.08, because 30000 < FEE_TIER_2_FLOOR 50000)"
            - "Reconcile attempt 1 (at APPROVED / ENCUMBERED) returns HTTP 409 with data.error_id == ERR_ORDER_INVALID_BILLING_STATE"
            - "Reconcile attempt 2 (at DELIVERED / ENCUMBERED) returns HTTP 409 with the same data.error_id == ERR_ORDER_INVALID_BILLING_STATE — fulfillment progress does not satisfy the billing guard"
            - "After return: SupportSurfaceOrder.${o1_id}.fulfillment_status == RETURNED, billing_status == COMMITTED, actual_cost_cents == 32400"
            - "Reconcile attempt 3 returns HTTP 200 with billing_status == RECONCILED and fulfillment_status still == RETURNED — reconcile moves the billing dimension only"
            - "Unit.${u1_id}.rental_encumbered_cents == 0, rental_committed_cents == 32400, rental_released_cents == 0, rental_available_cents == 467600 — reconcile moves no money"
            - "SupportSurface.${s1_id}.status == CLEANING after reconcile, because the logical clock 2026-08-01T00:00:00Z is still before available_from 2026-08-04T12:00:00Z"

