  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: resident_opt_out_cascades_five_levels_to_agency_open_request_counter
        grounds:
          - endpoints[POST /neighborhood-safety/residents/{id}/data-controls]
          - entities.DataControlAction.fields.affected_device_count
          - entities.DataControlAction.fields.affected_solicitation_count
          - entities.DataControlAction.fields.affected_request_count
          - state_machines.ConsentSolicitation.status.SOLICITED_to_DECLINED
          - state_machines.VideoRequest.lifecycle_state.SOLICITING_to_EXHAUSTED
          - state_machines.RequestArea.status.LOCKED_to_INVALIDATED
          - entities.Agency.fields.open_request_count
        distinguishing_aspect: |
          Depth 5, triggered from the resident-privacy surface. Each link is caused strictly by
          the previous one: the opt-out flag on the Resident (L1) is what flips the Devices'
          auto_decline posture (L2); the flipped Devices are what force their SOLICITED
          solicitations to DECLINED (L3); the newly declined solicitations are what drop the
          VideoRequest's pending_count to zero and drive SOLICITING -> EXHAUSTED (L4); and the
          request leaving SOLICITING is what decrements the Agency's open_request_count (L5).
          A sixth, lateral branch hangs off L2 — the recomputed eligible_device_count drops
          below the frozen effective_min_devices and the LOCKED RequestArea is INVALIDATED with
          reason ELIGIBILITY_BELOW_THRESHOLD — so the cascade fans out as well as descends, and
          the DataControlAction receipt has to report a per-level count for each depth.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3 and max_open_requests 3; officer OT with duty_role REQUESTER."
            - "One resident RT at (0,0) with alert_radius_m 0 owning three ACTIVE cameras at (0,10), (0,20), (0,30); no other residents and no other devices exist."
            - "RequestArea (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z is LOCKED with effective_min_devices 3 and eligible_device_count 3."
            - "The VideoRequest is justified and SUBMITTED, so three solicitations are SOLICITED, lifecycle_state is SOLICITING and Agency.open_request_count is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
