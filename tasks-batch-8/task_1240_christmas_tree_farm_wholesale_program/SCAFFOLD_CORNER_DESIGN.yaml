        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected before any role or existence check with ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["one season exists"]
          setup_api_calls:
