  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: tank_closed_interval_flat_gap
        grounds:
          - calculations.tank_occupancy
          - errors[ERR_TANK_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: CLOSED windows + flat 3h gap on BlendingTank.
          Occupying batch E [08:00, 12:00]: a new batch touching at 12:00
          conflicts (closed intervals share the endpoint); exactly 3h gap
          (start 15:00) is allowed; 1 minute short (14:59) conflicts.
        test_recipe:
          setup:
            - "ACTIVE customer; DRAFT formula; tank T-OV; batch E occupying [2026-08-10T08:00Z, 2026-08-10T12:00Z] in PLANNED"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "TankOver", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "TO-1", name: "Tank Overlap", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-OV", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_e: $.data.id } }
          trigger:
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T12:00:00Z", planned_end_at: "2026-08-10T16:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { err_touch: $.data.error_id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T14:59:00Z", planned_end_at: "2026-08-10T18:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { err_short: $.data.error_id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T15:00:00Z", planned_end_at: "2026-08-10T18:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_n: $.data.id } }
          assert:
            - "err_touch == ERR_TANK_WINDOW_CONFLICT (closed intervals: start == E.end still collides)"
            - "err_short == ERR_TANK_WINDOW_CONFLICT (gap 2h59m < TANK_GAP_HOURS 3h)"
            - "batch_n created (gap exactly 3h satisfies E.end + 3h <= N.start, equality allowed)"
            - "BlendingTank.${tank_id}.posture == OCCUPIED (two PLANNED batches coexist on the tank's calendar)"

      - name: line_half_open_directional_changeover
        grounds:
          - calculations.changeover_matrix
          - errors[ERR_LINE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN windows + DIRECTIONAL changeover matrix
          on BottlingLine (different resource and different semantics from the
          tank instance). Washing OUT of a TREE_NUT run into a NONE run costs
          15+60=75 min; starting a TREE_NUT run after a NONE run costs only
          15+0=15 min — the same physical gap requirement is asymmetric by
          direction, and equality to the buffered boundary is allowed.
        test_recipe:
          setup:
            - "ACTIVE customer; APPROVED formula FN (allergen TREE_NUT) and FP (allergen NONE)"
            - "Four RELEASED batches B1(FN/T1), B2(FP/T2), B3(FP/T3), B4(FN/T4); line L-DIR supporting PET_473; container lot 20000 QC_PASSED"
            - "Four CONFIRMED runs RA(FN), RB(FP), RC(FP), RD(FN), all planned 1000"
