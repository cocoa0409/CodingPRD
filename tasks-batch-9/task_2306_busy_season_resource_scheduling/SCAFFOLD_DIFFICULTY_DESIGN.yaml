              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Robin Castellanos", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 20.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s5_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 9000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "INTERIM", expected_hours: 22.00, window_start_date: "2026-07-27", window_end_date: "2026-08-31", required_level: "SENIOR" }
              as: SchedulingManager
              captures: { ph_a_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph_a_id}", staff_member_id: "${s5_id}", start_date: "2026-07-27", end_date: "2026-08-01", allocated_hours: 22.00 }
              as: SchedulingManager
              captures: { a_prior_id: $.data.id }
            - call: "POST /scheduling/engagements/${e1_id}/schedule"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagements/${e1_id}/start-fieldwork"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a_prior_id}/confirm"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/engagement-phases/${ph_a_id}/start"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/assignments/${a_prior_id}/activate"
              payload: {}
              as: SchedulingManager
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a_prior_id}", work_date: "2026-07-27", hours: 5.50, entry_type: "EXECUTION" }
              as: EngagementStaff
              as_user_id: "${s5_id}"
            - call: "POST /scheduling/time-entries"
              payload: { assignment_id: "${a_prior_id}", work_date: "2026-07-28", hours: 5.50, entry_type: "EXECUTION" }
              as: EngagementStaff
