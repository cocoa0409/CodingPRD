      - name: guarded_transition_deployment_needs_cut_release_covered_by_difficulty_instance
        claim_type: guarded_transitions
        grounds:
          - validations[priority=9]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / deployment_creation_requires_release_phase_cut_or_later
          rationale: "The named §1.8 instance asserts the cross-entity guard in both directions with an unchanged payload."

      - name: cascade_down_code_freeze_covered_by_difficulty_instance
        claim_type: cascade_down
        grounds:
          - state_machines.ReleaseTrain.ACTIVE_to_FROZEN
        excluded_because:
          difficulty_instance: transitive_cascade / train_code_freeze_cascades_release_changes_dependents_and_budget
          rationale: "The named §1.8 instance asserts all five freeze cascade hops including the untouched terminal changes."

      - name: conditional_cascade_incident_rollback_covered_by_difficulty_instance
        claim_type: conditional_cascade
        grounds:
          - state_machines.Incident.OPEN_to_DECIDED
        excluded_because:
          difficulty_instance: transitive_cascade / incident_rollback_cascades_deployment_release_flag_steps_and_changes
          rationale: "The named §1.8 instance asserts the state-conditional arms of the rollback cascade (SOAKING -> ABORTED versus PLANNED -> VOIDED, APPLIED untouched)."

      - name: ledger_sync_risk_budget_covered_by_difficulty_instance
        claim_type: ledger_sync
        grounds:
          - entities.Release.fields.risk_budget_consumed_points
        excluded_because:
          difficulty_instance: compensating_invariant / change_withdraw_restores_release_risk_budget_and_committed_count
          rationale: "The named §1.8 instance reconciles the release ledger before and after the withdraw with literal before/after values."

  # =======================================================================
  - section: calculations
    instances:

      - name: customer_release_notes_filter_drops_internal_and_summaryless_changes
        claim_type: correct_result
        grounds:
          - calculations.release_note_generation
          - endpoints[POST /releases/{id}/release-notes]
          - entities.ReleaseNoteDocument.fields.included_change_ids
        distinguishing_aspect: "From the same three merged changes the CUSTOMER document keeps only the one that is both customer_facing and has a non-empty summary_customer_facing (entry_count 1, excluded_change_count 2) while the INTERNAL document keeps all three in merged_at then created_at order."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; train core-train; Release 2026.08.1 with cut_at 2026-08-10T00:00:00Z."
            - "CR_A is customer_facing true with a summary; CR_B is customer_facing true with summary_customer_facing omitted; CR_C omits customer_facing (false) but has a summary."
            - "Three LOW changes (40 lines, 1 subsystem, INTERNAL -> score 9) created in the order A, B, C, each submitted (auto-APPROVED) and merged at 2026-08-01T00:00:00Z."
            - "Clock advanced to 2026-08-08T00:00:00Z and the release cut."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Faster checkout", summary_internal: "internal A", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL", customer_facing: true, summary_customer_facing: "Checkout is now faster" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_a: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Marked customer facing but unwritten", summary_internal: "internal B", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL", customer_facing: true }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_b: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Internal refactor with a blurb", summary_internal: "internal C", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL", summary_customer_facing: "Reliability improvements" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_c: $.data.id }
            - call: "POST /change-requests/${cr_a}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_b}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_c}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_a}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_b}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_c}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
