# =============================================================================
# PRD Benchmark Seed Tables — Group Home & IDD Residential (HCBS Waiver)
# =============================================================================

scenario: |
  generate task hard than expert level! 972. Group Home & IDD Residential (waiver): individual & person-centered plan (ISP), bed/house & DSP staffing ratio, waiver service authorization & units, med & behavior-support plan, incident/EVV & compliance, day-program transport, billing, review

domain_name: group-home-idd-waiver
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # all resources top-level; FK links in bodies
  state_machine_shape: cyclic      # plus one parallel-dimension machine (EVVVisit)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (15 entities; flat topology)
# =============================================================================
entities:
  - name: ProviderAgency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency legal name" }
      - { name: day_staff_ratio, type: integer, source: input, default: 4, description: "Individuals per DSP on DAY shifts (1:4); integer > 0" }
      - { name: night_staff_ratio, type: integer, source: input, default: 8, description: "Individuals per DSP on NIGHT shifts (1:8); integer > 0" }
      - { name: evv_grace_minutes, type: integer, source: input, default: 15, description: "Allowed clock drift minutes between EVV visit and linked shift window" }
      - { name: cash_collected_cents, type: integer, source: computed, default: 0, description: "Running net cash ledger: += claim.posted_net_cents on post-payment; -= claim.posted_net_cents on void" }
      - { name: recoupment_balance_cents, type: integer, source: computed, default: 0, description: "Un-recouped clawback balance: += posted_net on void; -= recouped portion on later full payments" }
      - { name: held_claims_count, type: integer, source: computed, default: 0, description: "Count of BillingClaims in HOLD status across this agency" }

  - name: GroupHome
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> ProviderAgency.id; owning agency" }
      - { name: name, type: string, source: input, description: "Home display name" }
      - { name: license_number, type: string, source: input, description: "State license number; unique per agency" }
      - { name: certified_bed_count, type: integer, source: input, description: "Licensed maximum resident capacity; integer >= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: compliance_posture, type: enum, source: computed, default: GOOD_STANDING, description: "GOOD_STANDING | PROVISIONAL | CRITICAL; derived from open incidents (see calculation home_compliance_posture)" }
      - { name: current_occupancy, type: integer, source: computed, default: 0, description: "Count of BedAssignments with status ACTIVE for this home" }

  - name: Individual
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> ProviderAgency.id; managing agency" }
      - { name: legal_name, type: string, source: input, description: "Individual legal name" }
      - { name: medicaid_id, type: string, source: input, description: "State Medicaid ID; unique across the system" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: mobility_level, type: enum, source: input, description: "AMBULATORY | ASSIST | WHEELCHAIR; feeds staffing weighting" }
      - { name: status, type: enum, source: system, description: "APPLICANT | ENROLLED | DISCHARGED" }
      - { name: enrolled_at, type: datetime, source: system, description: "Set on enroll transition", default: null }

  - name: ISP
    parent: null
    common_fields: true
    fields:
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id; plan owner" }
      - { name: authored_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; taken from X-User-ID of the CaseManager creator" }
      - { name: plan_year_start, type: string, source: input, description: "ISO date; plan effective start" }
      - { name: plan_year_end, type: string, source: input, description: "ISO date; plan effective end; must be > plan_year_start" }
      - { name: goals_summary, type: string, source: input, description: "Person-centered goals narrative (>= 10 chars)" }
      - { name: meeting_date, type: string, source: input, description: "ISO date of the person-centered planning meeting", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | APPROVED | ACTIVE | AMENDMENT_DRAFT | SUPERSEDED | EXPIRED | DISCONTINUED" }
      - { name: amendment_count, type: integer, source: computed, default: 0, description: "Increments by 1 on every successful amend transition" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Set on each APPROVED -> ACTIVE transition" }
      - { name: approved_by_staff_id, type: string, source: system, default: null, description: "FK -> StaffMember.id; QIDP who approved the current revision" }

  - name: ServiceAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id" }
      - { name: isp_id, type: string, source: input, description: "FK -> ISP.id; the ACTIVE ISP this authorization is anchored to" }
      - { name: service_code, type: enum, source: input, description: "RES_HAB | DAY_PROG | RESPITE | SUPPORTED_EMPLOYMENT" }
      - { name: unit_type, type: enum, source: input, description: "FIFTEEN_MIN | DAY" }
      - { name: authorized_units, type: integer, source: input, description: "Total units authorized for the span; integer >= 1" }
      - { name: rate_cents, type: integer, source: input, description: "Reimbursement per unit; integer >= 1" }
      - { name: span_start, type: string, source: input, description: "ISO date; must be >= linked ISP plan_year_start" }
      - { name: span_end, type: string, source: input, description: "ISO date; must be >= span_start and <= linked ISP plan_year_end" }
      - { name: consumed_units, type: integer, source: computed, default: 0, description: "Units consumed by VERIFIED EVV allocations (waterfall); released LIFO on claim void" }
      - { name: remaining_units, type: integer, source: computed, description: "= authorized_units - consumed_units" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | ACTIVE | SUSPENDED | EXHAUSTED | EXPIRED | CANCELLED" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> ProviderAgency.id" }
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: staff_role, type: enum, source: input, description: "DSP | CASE_MANAGER | QIDP; must match X-User-Role for entity-backed calls" }
      - { name: certifications, type: array, source: input, description: "Subset of [MED_CERT, BEHAVIOR_CERT, CPR, CDL]" }
      - { name: hire_date, type: string, source: input, description: "ISO date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> GroupHome.id; where coverage is provided" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; assigned DSP" }
      - { name: window_start, type: datetime, source: input, description: "Shift start ISO datetime; must be < window_end" }
      - { name: window_end, type: datetime, source: input, description: "Shift end ISO datetime" }
      - { name: shift_type, type: enum, source: input, description: "DAY | NIGHT; selects staffing ratio" }
      - { name: requires_med_pass, type: boolean, source: input, default: false, description: "If true, assigned staff must hold MED_CERT" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED" }

  - name: BedAssignment
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> GroupHome.id" }
      - { name: bed_label, type: string, source: input, description: "Bed identifier within the home (e.g. 'Room2-B'); overlap resource key = (home_id, bed_label)" }
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id; resident" }
      - { name: move_in_date, type: string, source: input, description: "ISO date; half-open interval start [move_in_date, move_out_date)" }
      - { name: move_out_date, type: string, source: system, default: null, description: "ISO date; half-open interval end; set at move-out" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | ENDED | CANCELLED" }

  - name: MedicationOrder
    parent: null
    common_fields: true
    fields:
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id" }
      - { name: drug_name, type: string, source: input, description: "Medication name" }
      - { name: dosage, type: string, source: input, description: "Dosage text (e.g. '500mg')" }
      - { name: schedule_times, type: array, source: input, description: "Array of 'HH:MM' 24h strings; non-empty" }
      - { name: requires_witness, type: boolean, source: input, default: false, description: "True for controlled meds: GIVEN events need a witness" }
      - { name: start_date, type: string, source: input, description: "ISO date" }
      - { name: end_date, type: string, source: input, default: null, description: "ISO date; null = open-ended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: MedAdminEvent
    parent: null
    common_fields: false   # append-only MAR event: id + created_at only; immutable
    fields:
      - { name: medication_order_id, type: string, source: input, description: "FK -> MedicationOrder.id" }
      - { name: administered_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; taken from X-User-ID of the recording DSP" }
      - { name: witness_staff_id, type: string, source: input, default: null, description: "FK -> StaffMember.id; required when order.requires_witness and outcome=GIVEN" }
      - { name: scheduled_time, type: datetime, source: input, description: "Scheduled administration datetime" }
      - { name: administered_time, type: datetime, source: input, default: null, description: "Actual administration datetime; required unless outcome=MISSED; must be within +/- 60 min of scheduled_time" }
      - { name: outcome, type: enum, source: input, description: "GIVEN | REFUSED | HELD | MISSED" }

  - name: BehaviorSupportPlan
    parent: null
    common_fields: true
    fields:
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id" }
      - { name: authored_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; CaseManager creator (X-User-ID)" }
      - { name: level, type: enum, source: input, description: "LEVEL_1 (non-restrictive) | LEVEL_2 (restrictive)" }
      - { name: restrictive_interventions, type: array, source: input, description: "Array of intervention strings; MUST be empty for LEVEL_1 and non-empty for LEVEL_2" }
      - { name: status, type: enum, source: system, description: "DRAFT | HRC_REVIEW | APPROVED | ACTIVE | SUPERSEDED | EXPIRED" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Set on HRC_REVIEW -> APPROVED" }
      - { name: review_due_at, type: datetime, source: system, default: null, description: "Set on activate: approved_at + 180 days (LEVEL_2) or + 365 days (LEVEL_1)" }
      - { name: approved_by_staff_id, type: string, source: system, default: null, description: "FK -> StaffMember.id; QIDP approver" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id" }
      - { name: home_id, type: string, source: input, description: "FK -> GroupHome.id; where the incident occurred" }
      - { name: submitted_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; DSP creator (X-User-ID)" }
      - { name: category, type: enum, source: input, description: "MED_ERROR | INJURY | ABUSE_ALLEGATION | BEHAVIOR | ELOPEMENT" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: occurred_at, type: datetime, source: input, description: "When the incident occurred" }
      - { name: discovered_at, type: datetime, source: input, description: "When staff became aware; must be >= occurred_at" }
      - { name: description, type: string, source: input, description: "Narrative (>= 10 chars)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | NEEDS_INFO | CLOSED" }
      - { name: report_due_at, type: datetime, source: computed, default: null, description: "discovered_at + severity window (CRITICAL 24h / HIGH 48h / else 72h); set at submit" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Server clock at submit/resubmit" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "submitted_at > report_due_at (strictly greater; equality is NOT late)" }

  - name: EVVVisit
    parent: null
    common_fields: true
    fields:
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id; recipient of service" }
      - { name: authorization_id, type: string, source: input, description: "FK -> ServiceAuthorization.id; must belong to the same individual" }
      - { name: staff_member_id, type: string, source: system, description: "FK -> StaffMember.id; the visiting DSP (X-User-ID)" }
      - { name: shift_id, type: string, source: input, default: null, description: "FK -> ShiftAssignment.id; optional linked shift" }
      - { name: service_date, type: string, source: input, description: "ISO date; must fall inside authorization [span_start, span_end] (inclusive both ends)" }
      - { name: check_in_at, type: datetime, source: input, description: "EVV clock-in" }
      - { name: check_out_at, type: datetime, source: input, description: "EVV clock-out; must be > check_in_at" }
      - { name: geo_within_radius, type: boolean, source: input, description: "False -> visit starts in EXCEPTION instead of PENDING" }
      - { name: provisional_units, type: integer, source: computed, description: "Units from raw check-in/out per billable_unit_calculation (provisional variant)" }
      - { name: final_units, type: integer, source: computed, default: null, description: "Units locked at verify / resolve-exception (final variant)" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | EXCEPTION | VERIFIED | REJECTED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | BILLED; independent parallel dimension" }
      - { name: billed_claim_id, type: string, source: system, default: null, description: "FK -> BillingClaim.id; set when swept into a claim" }
      - { name: allocated_units_entries, type: array, source: computed, default: [], description: "Waterfall allocation log: [{authorization_id, units}] in allocation order; released in reverse (LIFO) on claim void" }

  - name: TransportTrip
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> GroupHome.id; home running the trip" }
      - { name: vehicle_id, type: string, source: input, description: "Vehicle identifier (fleet reference string, e.g. 'VAN-1'); overlap resource key = (vehicle_id, trip_date)" }
      - { name: trip_date, type: string, source: input, description: "ISO date of the trip" }
      - { name: depart_at, type: datetime, source: input, description: "Departure datetime; half-open window start" }
      - { name: return_at, type: datetime, source: input, description: "Return datetime; half-open window end; must be > depart_at" }
      - { name: legs, type: array, source: input, description: "Array of {individual_id, wheelchair_seat (boolean), pickup_at, dropoff_at}; each leg individual must be ENROLLED, resident at this home on trip_date, and hold an ACTIVE DAY_PROG authorization covering trip_date; pickup_at < dropoff_at; leg times inside [depart_at, return_at]" }
      - { name: occupied_slots, type: integer, source: computed, description: "Sum over legs of (wheelchair_seat ? 2 : 1); must be <= 8" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: BillingClaim
    parent: null
    common_fields: true
    fields:
      - { name: individual_id, type: string, source: input, description: "FK -> Individual.id" }
      - { name: service_period_start, type: string, source: input, description: "ISO date; inclusive" }
      - { name: service_period_end, type: string, source: input, description: "ISO date; inclusive; must be >= service_period_start" }
      - { name: lines, type: array, source: computed, description: "Computed at generation/correction: [{authorization_id, service_code, units, rate_cents, amount_cents}] grouped by authorization" }
      - { name: total_units, type: integer, source: computed, description: "Sum of line units" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of line amount_cents" }
      - { name: paid_amount_cents, type: integer, source: system, default: null, description: "Payer-paid gross recorded at post-payment" }
      - { name: posted_net_cents, type: integer, source: system, default: null, description: "Net posted to agency cash ledger after recoupment netting" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the BillingSpecialist who submitted" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Server clock at submit" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Required on deny" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DENIED | CORRECTED | PAID | PARTIALLY_PAID | HOLD | VOIDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GroupHome
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /homes/{homeId}/suspend
        actor: ComplianceOfficer
        preconditions:
          - "Home must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All PENDING BedAssignments for this home are CANCELLED (conditional cascade: PENDING only)"
          - "increments GroupHome.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /homes/{homeId}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - "Home must be SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "increments GroupHome.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: POST /homes/{homeId}/close
        actor: AgencyAdmin
        preconditions:
          - "current_occupancy == 0 and zero PENDING BedAssignments (ERR_HOME_OCCUPIED)"
        side_effects:
          - "increments GroupHome.version by 1"

  - entity: Individual
    initial_state: APPLICANT
    terminal_states: [DISCHARGED]
    transitions:
      - from: APPLICANT
        to: ENROLLED
        trigger: POST /individuals/{individualId}/enroll
        actor: QIDP
        preconditions:
          - "Individual must be APPLICANT (ERR_INVALID_STATE)"
        side_effects:
          - "enrolled_at = now"
          - "increments Individual.version by 1"
      - from: ENROLLED
        to: DISCHARGED
        trigger: POST /individuals/{individualId}/discharge
        actor: QIDP
        preconditions:
          - "Individual must be ENROLLED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade 1: every ACTIVE BedAssignment -> ENDED with move_out_date = today (each ending assignment itself sets its bed_label free and recomputes GroupHome.current_occupancy)"
          - "Cascade 1: every PENDING BedAssignment -> CANCELLED"
          - "Cascade 1: every ServiceAuthorization in {PENDING, APPROVED, ACTIVE, SUSPENDED} -> CANCELLED (consumed_units frozen as history)"
          - "Cascade 1: every ACTIVE ISP -> DISCONTINUED; every ACTIVE BehaviorSupportPlan -> EXPIRED"
          - "increments Individual.version by 1"

  - entity: ISP
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, DISCONTINUED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: POST /isps/{ispId}/submit-review
        actor: CaseManager | QIDP
        preconditions:
          - "ISP must be DRAFT or AMENDMENT_DRAFT (ERR_INVALID_STATE)"
          - "goals_summary length >= 10 (ERR_INVALID_REQUEST)"
        side_effects:
          - "increments ISP.version by 1"
      - from: AMENDMENT_DRAFT
        to: PENDING_REVIEW
        trigger: POST /isps/{ispId}/submit-review
        actor: CaseManager | QIDP
        preconditions:
          - "ISP must be DRAFT or AMENDMENT_DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "increments ISP.version by 1"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: POST /isps/{ispId}/approve
        actor: QIDP
        preconditions:
          - "ISP must be PENDING_REVIEW (ERR_INVALID_STATE)"
          - "Segregation of duties: approved_by (X-User-ID) != authored_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_staff_id = X-User-ID"
          - "increments ISP.version by 1"
      - from: PENDING_REVIEW
        to: DRAFT
        trigger: POST /isps/{ispId}/return
        actor: QIDP
        preconditions:
          - "ISP must be PENDING_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "increments ISP.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: POST /isps/{ispId}/activate
        actor: QIDP
        preconditions:
          - "ISP must be APPROVED (ERR_INVALID_STATE)"
          - "Individual must be ENROLLED (ERR_INDIVIDUAL_NOT_ENROLLED)"
        side_effects:
          - "activated_at = now"
          - "If another ISP for the same individual is ACTIVE, that ISP -> SUPERSEDED (create-with-supersede at activation)"
          - "increments ISP.version by 1"
      - from: ACTIVE
        to: AMENDMENT_DRAFT
        trigger: POST /isps/{ispId}/amend (OCC-guarded)
        actor: CaseManager | QIDP
        preconditions:
          - "ISP must be ACTIVE or AMENDMENT_DRAFT (ERR_INVALID_STATE)"
          - "OCC: expected_isp_version == ISP.version (ERR_STALE_VERSION)"
        side_effects:
          - "amendment_count += 1"
          - "Amend from AMENDMENT_DRAFT supersedes the in-flight amendment content (stays AMENDMENT_DRAFT)"
          - "increments ISP.version by 1"
      - from: AMENDMENT_DRAFT
        to: AMENDMENT_DRAFT
        trigger: POST /isps/{ispId}/amend (OCC-guarded)
        actor: CaseManager | QIDP
        preconditions:
          - "ISP must be ACTIVE or AMENDMENT_DRAFT (ERR_INVALID_STATE)"
          - "OCC: expected_isp_version == ISP.version (ERR_STALE_VERSION)"
        side_effects:
          - "amendment_count += 1"
          - "increments ISP.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: system (logical clock advances past plan_year_end)
        actor: system
        preconditions:
          - "now > plan_year_end"
        side_effects:
          - "Cascade link 1 -> every ACTIVE ServiceAuthorization of this individual -> SUSPENDED"
          - "Each SUSPENDED authorization itself -> all its EVVVisits in {PENDING, EXCEPTION} -> REJECTED (link 2)"
          - "increments ISP.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: system (a new ISP draft created for the same individual supersedes the existing DRAFT)
        actor: system
        preconditions:
          - "Another ISP of the same individual was just created in DRAFT"
        side_effects:
          - "increments ISP.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: system (another ISP of the same individual is activated)
        actor: system
        preconditions:
          - "POST /isps/{otherIspId}/activate succeeded for the same individual"
        side_effects:
          - "increments ISP.version by 1"
      - from: DRAFT
        to: DISCONTINUED
        trigger: POST /individuals/{individualId}/discharge (cascade)
        actor: system
        preconditions: ["Individual discharge cascade; also APPROVED/ACTIVE/PENDING_REVIEW/AMENDMENT_DRAFT -> DISCONTINUED"]
        side_effects: []

  - entity: ServiceAuthorization
    initial_state: PENDING
    terminal_states: [EXHAUSTED, EXPIRED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /authorizations/{authId}/approve
        actor: QIDP
        preconditions:
          - "Authorization must be PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "If span_start <= today <= span_end, transition continues immediately to ACTIVE"
          - "increments ServiceAuthorization.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: system (logical clock reaches span_start)
        actor: system
        preconditions:
          - "span_start <= today <= span_end"
        side_effects:
          - "increments ServiceAuthorization.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: system (anchored ISP expires — cascade link 1)
        actor: system
        preconditions:
          - "ISP of this authorization transitioned ACTIVE -> EXPIRED"
        side_effects:
          - "Cascade link 2: this authorization's EVVVisits in {PENDING, EXCEPTION} -> REJECTED"
          - "increments ServiceAuthorization.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /authorizations/{authId}/resume
        actor: QIDP
        preconditions:
          - "Authorization must be SUSPENDED (ERR_INVALID_STATE)"
          - "Linked ISP must be ACTIVE (ERR_ISP_NOT_ACTIVE)"
          - "today must be within [span_start, span_end] (ERR_OUT_OF_SPAN)"
        side_effects:
          - "increments ServiceAuthorization.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: system (consumed_units >= authorized_units after an EVV allocation)
        actor: system
        preconditions:
          - "consumed_units >= authorized_units (equality triggers)"
        side_effects:
          - "increments ServiceAuthorization.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: system (logical clock advances past span_end)
        actor: system
        preconditions:
          - "today > span_end"
        side_effects:
          - "increments ServiceAuthorization.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: POST /authorizations/{authId}/cancel
        actor: CaseManager
        preconditions:
          - "Authorization must be in {PENDING, APPROVED, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "increments ServiceAuthorization.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: POST /authorizations/{authId}/cancel
        actor: CaseManager
        preconditions:
          - "Authorization must be in {PENDING, APPROVED, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /authorizations/{authId}/cancel
        actor: CaseManager
        preconditions:
          - "Authorization must be in {PENDING, APPROVED, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: CANCELLED
        trigger: POST /authorizations/{authId}/cancel
        actor: CaseManager
        preconditions:
          - "Authorization must be in {PENDING, APPROVED, ACTIVE, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: StaffMember
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /staff/{staffId}/terminate
        actor: AgencyAdmin
        preconditions:
          - "StaffMember must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All ShiftAssignments for this staff member in {SCHEDULED, CONFIRMED} with window_start > now -> CANCELLED"
          - "increments StaffMember.version by 1"

  - entity: ShiftAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: POST /shifts/{shiftId}/confirm
        actor: DSP
        preconditions:
          - "Shift must be SCHEDULED (ERR_INVALID_STATE)"
          - "Ownership: X-User-ID == shift.staff_member_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "increments ShiftAssignment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /shifts/{shiftId}/cancel
        actor: AgencyAdmin
        preconditions:
          - "Shift must be SCHEDULED or CONFIRMED (ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /shifts/{shiftId}/cancel
        actor: AgencyAdmin
        preconditions:
          - "Shift must be SCHEDULED or CONFIRMED (ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: system (a linked EVVVisit with shift_id == this shift reaches VERIFIED)
        actor: system
        preconditions:
          - "EVV visit verify or resolve-exception succeeds with shift_id set"
        side_effects:
          - "increments ShiftAssignment.version by 1"

  - entity: BedAssignment
    initial_state: PENDING
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: POST /bed-assignments/{baId}/move-in
        actor: QIDP
        preconditions:
          - "Assignment must be PENDING (ERR_INVALID_STATE)"
          - "move_in_date <= today (ERR_MOVE_IN_FUTURE)"
          - "No overlapping ACTIVE assignment on the same (home_id, bed_label): half-open [move_in_date, move_out_date) intersection (ERR_BED_OVERLAP)"
          - "Home must be ACTIVE (ERR_HOME_NOT_ACTIVE)"
        side_effects:
          - "GroupHome.current_occupancy recomputed"
          - "increments BedAssignment.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: POST /bed-assignments/{baId}/move-out
        actor: QIDP
        preconditions:
          - "Assignment must be ACTIVE (ERR_INVALID_STATE)"
          - "move_out_date > move_in_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "move_out_date set (from input or today)"
          - "GroupHome.current_occupancy recomputed (decrement)"
          - "increments BedAssignment.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: POST /bed-assignments/{baId}/cancel
        actor: CaseManager
        preconditions:
          - "Assignment must be PENDING (ERR_INVALID_STATE)"
        side_effects: []

  - entity: MedicationOrder
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: POST /medication-orders/{moId}/discontinue
        actor: QIDP
        preconditions:
          - "Order must be ACTIVE (ERR_MED_ORDER_DISCONTINUED)"
        side_effects:
          - "increments MedicationOrder.version by 1"

  - entity: BehaviorSupportPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: HRC_REVIEW
        trigger: POST /behavior-plans/{bpId}/submit-hrc
        actor: CaseManager | QIDP
        preconditions:
          - "Plan must be DRAFT (ERR_INVALID_STATE)"
          - "LEVEL_2 requires non-empty restrictive_interventions; LEVEL_1 requires empty (ERR_RESTRICTIVE_INTERVENTION_MISMATCH)"
        side_effects:
          - "increments BehaviorSupportPlan.version by 1"
      - from: HRC_REVIEW
        to: APPROVED
        trigger: POST /behavior-plans/{bpId}/hrc-approve
        actor: QIDP
        preconditions:
          - "Plan must be HRC_REVIEW (ERR_INVALID_STATE)"
          - "Segregation of duties: approver X-User-ID != authored_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_at = now; approved_by_staff_id = X-User-ID"
          - "increments BehaviorSupportPlan.version by 1"
      - from: HRC_REVIEW
        to: DRAFT
        trigger: POST /behavior-plans/{bpId}/hrc-reject
        actor: QIDP
        preconditions:
          - "Plan must be HRC_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "increments BehaviorSupportPlan.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: POST /behavior-plans/{bpId}/activate
        actor: QIDP
        preconditions:
          - "Plan must be APPROVED (ERR_INVALID_STATE)"
          - "Individual must be ENROLLED (ERR_INDIVIDUAL_NOT_ENROLLED)"
        side_effects:
          - "review_due_at = approved_at + 180 days (LEVEL_2) or + 365 days (LEVEL_1)"
          - "Any other ACTIVE BehaviorSupportPlan for this individual -> SUPERSEDED"
          - "increments BehaviorSupportPlan.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: system (another BehaviorSupportPlan of the same individual is activated)
        actor: system
        preconditions:
          - "POST /behavior-plans/{otherBpId}/activate succeeded for the same individual"
        side_effects:
          - "increments BehaviorSupportPlan.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: system (logical clock advances past review_due_at)
        actor: system
        preconditions:
          - "now > review_due_at (strictly greater; on the due date itself the plan remains ACTIVE)"
        side_effects:
          - "increments BehaviorSupportPlan.version by 1"

  - entity: Incident
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /incidents/{incidentId}/submit
        actor: DSP | QIDP
        preconditions:
          - "Incident must be DRAFT (ERR_INVALID_STATE)"
          - "Ownership: X-User-ID == submitted_by_staff_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "submitted_at = now; report_due_at = discovered_at + severity window; is_late computed (submitted_at > report_due_at)"
          - "Cascade link 1 (if severity == CRITICAL): GroupHome.compliance_posture recomputed"
          - "Cascade link 2 (if posture became CRITICAL): every DRAFT BillingClaim of every individual with an ACTIVE BedAssignment at this home -> HOLD"
          - "Cascade link 3: ProviderAgency.held_claims_count recomputed from claim HOLD transitions"
          - "increments Incident.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /incidents/{incidentId}/start-review
        actor: QIDP
        preconditions:
          - "Incident must be SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "increments Incident.version by 1"
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: POST /incidents/{incidentId}/request-info
        actor: QIDP
        preconditions:
          - "Incident must be UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "increments Incident.version by 1"
      - from: NEEDS_INFO
        to: SUBMITTED
        trigger: POST /incidents/{incidentId}/resubmit
        actor: DSP | QIDP
        preconditions:
          - "Incident must be NEEDS_INFO (ERR_INVALID_STATE)"
          - "Ownership: X-User-ID == submitted_by_staff_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "submitted_at = now; is_late recomputed against the original report_due_at"
          - "increments Incident.version by 1"
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: POST /incidents/{incidentId}/close
        actor: QIDP
        preconditions:
          - "Incident must be UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Segregation of duties: closer X-User-ID != submitted_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "GroupHome.compliance_posture recomputed"
          - "Cascade (if posture fell below CRITICAL): every HOLD BillingClaim of residents of this home -> DRAFT; ProviderAgency.held_claims_count recomputed"
          - "increments Incident.version by 1"

  - entity: EVVVisit
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    note: "Two parallel state dimensions: verification_status (PENDING|EXCEPTION|VERIFIED|REJECTED) x billing_status (UNBILLED|BILLED). geo_within_radius=false at creation starts the visit in EXCEPTION instead of PENDING."
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: POST /evv-visits/{visitId}/verify
        actor: QIDP
        preconditions:
          - "verification_status must be PENDING (ERR_INVALID_STATE)"
          - "Waterfall allocation must fully place final_units (ERR_AUTHORIZATION_UNITS_EXHAUSTED)"
        side_effects:
          - "final_units = provisional_units; waterfall allocation debits consumed_units on the primary then successor authorizations"
          - "Any authorization reaching consumed_units >= authorized_units -> EXHAUSTED"
          - "If shift_id set and that ShiftAssignment is CONFIRMED -> COMPLETED"
          - "increments EVVVisit.version by 1"
      - from: PENDING
        to: EXCEPTION
        trigger: POST /evv-visits/{visitId}/flag-exception
        actor: QIDP
        preconditions:
          - "verification_status must be PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "increments EVVVisit.version by 1"
      - from: EXCEPTION
        to: VERIFIED
        trigger: POST /evv-visits/{visitId}/resolve-exception
        actor: QIDP
        preconditions:
          - "verification_status must be EXCEPTION (ERR_INVALID_STATE)"
          - "adjusted_minutes must be a positive multiple of 15 (ERR_INVALID_REQUEST)"
          - "Waterfall allocation must fully place final_units (ERR_AUTHORIZATION_UNITS_EXHAUSTED)"
        side_effects:
          - "final_units = adjusted_minutes / 15 (exact division)"
          - "Waterfall allocation as in verify; exhaustion auto-transition applies"
          - "If shift_id set and that ShiftAssignment is CONFIRMED -> COMPLETED"
          - "increments EVVVisit.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: POST /evv-visits/{visitId}/reject
        actor: QIDP
        preconditions:
          - "verification_status must be PENDING or EXCEPTION (ERR_INVALID_STATE)"
        side_effects:
          - "increments EVVVisit.version by 1"
      - from: EXCEPTION
        to: REJECTED
        trigger: POST /evv-visits/{visitId}/reject
        actor: QIDP
        preconditions:
          - "verification_status must be PENDING or EXCEPTION (ERR_INVALID_STATE)"
        side_effects: []
      - from: VERIFIED
        to: VERIFIED
        trigger: POST /claims (billing sweep flips billing_status UNBILLED -> BILLED) and POST /claims/{claimId}/void (flips BILLED -> UNBILLED)
        actor: system
        preconditions: []
        side_effects:
          - "billing_status transitions independently of verification_status (parallel dimension)"
          - "billed_claim_id set on sweep; cleared on void"
          - "increments EVVVisit.version by 1 on each billing_status mutation"

  - entity: TransportTrip
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /transport-trips/{tripId}/cancel
        actor: AgencyAdmin
        preconditions:
          - "Trip must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "increments TransportTrip.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: system (logical clock advances past return_at)
        actor: system
        preconditions:
          - "now > return_at"
        side_effects:
          - "increments TransportTrip.version by 1"

  - entity: BillingClaim
    initial_state: DRAFT
    terminal_states: [PAID, PARTIALLY_PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /claims/{claimId}/submit
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DRAFT or CORRECTED (ERR_INVALID_STATE)"
          - "Resident's home compliance_posture != CRITICAL (ERR_HOME_POSTURE_CRITICAL)"
          - "lines non-empty (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at = now; submitted_by_user_id = X-User-ID"
          - "increments BillingClaim.version by 1"
      - from: CORRECTED
        to: SUBMITTED
        trigger: POST /claims/{claimId}/submit
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DRAFT or CORRECTED (ERR_INVALID_STATE)"
          - "Resident's home compliance_posture != CRITICAL (ERR_HOME_POSTURE_CRITICAL)"
        side_effects:
          - "submitted_at = now; submitted_by_user_id = X-User-ID"
          - "increments BillingClaim.version by 1"
      - from: SUBMITTED
        to: PAID
        trigger: POST /claims/{claimId}/post-payment
        actor: BillingSpecialist
        preconditions:
          - "Claim must be SUBMITTED (ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "paid_amount_cents <= total_amount_cents (ERR_OVERPAYMENT); == total -> PAID, < total -> PARTIALLY_PAID"
        side_effects:
          - "Recoupment netting (calculation recoupment_netting) sets posted_net_cents"
          - "ProviderAgency.cash_collected_cents += posted_net_cents; recoupment_balance_cents -= recouped portion"
          - "increments BillingClaim.version by 1"
      - from: SUBMITTED
        to: PARTIALLY_PAID
        trigger: POST /claims/{claimId}/post-payment
        actor: BillingSpecialist
        preconditions:
          - "Same as PAID transition; paid_amount_cents < total_amount_cents"
        side_effects:
          - "posted_net_cents = paid_amount_cents (no recoupment on partial payments)"
          - "ProviderAgency.cash_collected_cents += posted_net_cents"
          - "increments BillingClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: POST /claims/{claimId}/deny
        actor: BillingSpecialist
        preconditions:
          - "Claim must be SUBMITTED (ERR_INVALID_STATE)"
          - "denial_reason required (ERR_INVALID_REQUEST)"
        side_effects:
          - "increments BillingClaim.version by 1"
      - from: DENIED
        to: CORRECTED
        trigger: POST /claims/{claimId}/correct
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DENIED (ERR_INVALID_STATE)"
          - "Each lines_override entry references an authorization on this claim and units >= 0 (ERR_INVALID_REQUEST)"
          - "Corrected units per line must be <= that authorization's remaining_units + units already billed on this claim line (ERR_AUTHORIZATION_UNITS_EXHAUSTED)"
        side_effects:
          - "lines recomputed: units from lines_override, amount_cents = units * rate_cents; totals recomputed"
          - "increments BillingClaim.version by 1"
      - from: PAID
        to: VOIDED
        trigger: POST /claims/{claimId}/void
        actor: BillingSpecialist
        preconditions:
          - "Claim must be PAID or PARTIALLY_PAID (ERR_INVALID_STATE)"
        side_effects:
          - "Compensation: ProviderAgency.cash_collected_cents -= posted_net_cents; recoupment_balance_cents += posted_net_cents"
          - "Each swept EVVVisit: billing_status BILLED -> UNBILLED; billed_claim_id cleared"
          - "Each visit's allocated_units_entries released in reverse order (LIFO): authorization.consumed_units -= entry.units (compensating invariant on units)"
          - "increments BillingClaim.version by 1"
      - from: PARTIALLY_PAID
        to: VOIDED
        trigger: POST /claims/{claimId}/void
        actor: BillingSpecialist
        preconditions:
          - "Claim must be PAID or PARTIALLY_PAID (ERR_INVALID_STATE)"
        side_effects:
          - "Same compensation as PAID -> VOIDED"
      - from: DRAFT
        to: HOLD
        trigger: system (resident's GroupHome posture became CRITICAL — incident cascade link 2)
        actor: system
        preconditions:
          - "Home posture transitioned to CRITICAL"
        side_effects:
          - "Cascade link 3: ProviderAgency.held_claims_count recomputed"
          - "increments BillingClaim.version by 1"
      - from: HOLD
        to: DRAFT
        trigger: system (resident's GroupHome posture fell below CRITICAL — incident close cascade)
        actor: system
        preconditions:
          - "Home posture no longer CRITICAL"
        side_effects:
          - "ProviderAgency.held_claims_count recomputed"
          - "increments BillingClaim.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: isp-create-stale-individual
    parent_entity: Individual
    write_endpoint: "POST /isps"
    occ_field: expected_individual_version
    description: |
      Creating an ISP against an Individual whose version has advanced since the
      client last observed it is rejected. Product semantics allow a new DRAFT
      ISP to legitimately supersede an existing DRAFT ISP (old DRAFT ->
      SUPERSEDED), so a writer holding a stale Individual.version would otherwise
      silently overwrite another writer's fresh draft.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: isp-amend-stale-isp
    parent_entity: ISP
    write_endpoint: "POST /isps/{ispId}/amend"
    occ_field: expected_isp_version
    description: |
      Amending an ISP whose version has advanced since the client last observed
      it is rejected. Product semantics allow amending while an amendment is
      already in flight (AMENDMENT_DRAFT -> AMENDMENT_DRAFT supersedes the
      in-flight amendment content), so a stale expected_isp_version would
      silently discard another writer's amendment.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: weighted_staffing_requirement
    trigger: "GET /homes/{homeId}/staffing-check"
    algorithm: threshold
    formula: |
      weight(resident) = 2 if mobility_level == WHEELCHAIR else 1
      weighted_census = sum of weight over individuals with an ACTIVE BedAssignment
                        at this home (move_in_date <= shift_date AND (move_out_date IS NULL OR move_out_date > shift_date))
      ratio = agency.day_staff_ratio if shift_type == DAY else agency.night_staff_ratio
      required_dsps = ceil(weighted_census / ratio)   # integer ceiling; 0 residents -> 0
      scheduled_dsps = count of ShiftAssignments for this home on shift_date with
                       shift_type matching and status IN {SCHEDULED, CONFIRMED, COMPLETED}
      actual_dsps = count of DISTINCT staff_member_id on EVVVisits with shift_id
                    pointing at one of this home's shifts on shift_date (matching shift_type)
                    and verification_status == VERIFIED
      compliant_scheduled = (scheduled_dsps >= required_dsps)   # equality is compliant
      compliant_actual = (actual_dsps >= required_dsps)
    input_set: "ACTIVE BedAssignments at the home on shift_date; shifts in {SCHEDULED, CONFIRMED, COMPLETED} (CANCELLED excluded); VERIFIED EVV visits only"
    constants:
      WHEELCHAIR_WEIGHT: 2
      DEFAULT_WEIGHT: 1
      DAY_RATIO_DEFAULT: 4
      NIGHT_RATIO_DEFAULT: 8
    precision: "integer ceiling division"
    variants:
      - name: scheduled_variant
        when: "prospective coverage view"
        difference: "uses ShiftAssignment counts (plan)"
      - name: actual_variant
        when: "retrospective coverage view"
        difference: "uses verified EVV attendance (reality); can differ from plan"

  - name: census_variants
    trigger: "GET /homes/{homeId}/census and POST /bed-assignments (capacity gate)"
    algorithm: chronological
    formula: |
      current_census(d) = count of BedAssignments with home_id = home, status == ACTIVE,
                          move_in_date <= d, AND (move_out_date IS NULL OR move_out_date > d)
      projected_census(d) = current_census(d) + count of BedAssignments with home_id = home,
                            status == PENDING, move_in_date <= d + PROJECTION_DAYS
    input_set: "BedAssignments of the home; statuses ACTIVE (current) and PENDING (projected only)"
    constants:
      PROJECTION_DAYS: 14
    precision: "integer counts; dates compared as whole days (half-open intervals)"
    variants:
      - name: current_variant
        when: "chronological view as of date d"
        difference: "counts only ACTIVE assignments (moved-in)"
      - name: projected_variant
        when: "forward-looking admission gate"
        difference: "adds PENDING assignments whose move_in_date <= d + 14; differs whenever pending admissions exist inside the projection window"

  - name: billable_unit_calculation
    trigger: "EVVVisit creation (provisional), verify / resolve-exception (final), claim generation (aggregation)"
    algorithm: aggregation
    formula: |
      Per visit (provisional at create, from raw check_in_at/check_out_at):
        duration_min = minutes between check_in_at and check_out_at
        FIFTEEN_MIN: provisional_units = max(1, round_half_up(duration_min / 15))
        DAY:         provisional_units = 1 if duration_min >= 360 else 0
      Final (at verify):   final_units = provisional_units
      Final (at resolve):  final_units = adjusted_minutes / 15   # exact; adjusted_minutes multiple of 15
      Claim aggregation (ROUNDING ORDER PINNED): round per visit FIRST, then sum
      the integer per-visit units into the claim line. Summing minutes then
      rounding is FORBIDDEN and produces different totals.
    input_set: "The visit itself; claim sweep uses EVVVisits with verification_status == VERIFIED and billing_status == UNBILLED and service_date inside the claim period (inclusive)"
    constants:
      UNIT_MINUTES: 15
      DAY_UNIT_MIN_MINUTES: 360
    precision: "integer units; round_half_up per visit"
    variants:
      - name: provisional_variant
        when: "at visit creation, before review"
        difference: "computed from raw EVV timestamps; may be overridden"
      - name: final_variant
        when: "at verify / resolve-exception"
        difference: "locked units that debit authorizations; resolve-exception uses adjusted_minutes and can differ from provisional"

  - name: authorization_waterfall_allocation
    trigger: "EVVVisit verify / resolve-exception; release on claim void"
    algorithm: waterfall_allocation
    formula: |
      Candidates: the visit's own authorization first, then successor authorizations
      of the same individual with the same service_code, status == ACTIVE, and
      service_date inside [span_start, span_end], ordered by span_start ASC,
      tie-break created_at ASC (never id).
      remaining(auth) = authorized_units - consumed_units
      allocate = min(remaining(candidate), unallocated_units) per candidate in order
      If unallocated_units > 0 after all candidates -> reject ENTIRE allocation
      with ERR_AUTHORIZATION_UNITS_EXHAUSTED (no partial debit).
      On success: record allocated_units_entries in allocation order; each
      candidate consumed_units += alloc; candidate with consumed_units >=
      authorized_units -> EXHAUSTED (equality triggers).
      Release (claim void): iterate allocated_units_entries in REVERSE order
      (LIFO), consumed_units -= entry.units; an EXHAUSTED authorization whose
      consumed drops below authorized -> ACTIVE.
    input_set: "EVV visit final_units; the individual's ACTIVE authorizations for the same service_code covering service_date"
    precision: "integer units"
    constants:
      TIE_BREAK: "span_start ASC, then created_at ASC"

  - name: claim_amount_aggregation
    trigger: "POST /claims (generation) and POST /claims/{claimId}/correct"
    algorithm: aggregation
    formula: |
      Sweep: visits VERIFIED + UNBILLED, service_date in [period_start, period_end] inclusive,
      ordered by service_date ASC, then created_at ASC (never id).
      One line per distinct ALLOCATED authorization: each swept visit contributes its
      allocated_units_entries (waterfall output) to the entry's authorization_id, so a
      visit whose units spilled to a successor authorization lands on the successor's line:
        line.units = sum of allocated entry units for that authorization across swept visits
        line.amount_cents = line.units * authorization.rate_cents   # exact integer multiply
      total_units = sum(line.units); total_amount_cents = sum(line.amount_cents)
      All swept visits: billing_status UNBILLED -> BILLED, billed_claim_id = claim.id
      If the sweep set is empty -> ERR_NO_BILLABLE_VISITS (no claim created).
    input_set: "EVVVisits of the individual: verification_status == VERIFIED, billing_status == UNBILLED, service_date in period"
    precision: "integer cents; no rounding (units already integers)"

  - name: recoupment_netting
    trigger: "POST /claims/{claimId}/post-payment with paid_amount_cents == total_amount_cents (full payment)"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
        1. gross = claim.total_amount_cents
        2. recoup = min(floor(gross * RECOUP_RATE), agency.recoupment_balance_cents_PRE-payment)
        3. posted_net_cents = gross - recoup
        4. agency.cash_collected_cents += posted_net_cents
        5. agency.recoupment_balance_cents = balance_PRE - recoup
      Partial payments (paid_amount_cents < total): posted_net_cents = paid_amount_cents,
      recoup = 0, balance unchanged. RECOUP_RATE applies to gross, never to net.
    input_set: "The claim; agency recoupment_balance_cents before this payment"
    constants:
      RECOUP_RATE: 0.10
    precision: "integer cents; floor for the recoup portion"

  - name: incident_reporting_deadline
    trigger: "POST /incidents/{incidentId}/submit and /resubmit"
    algorithm: threshold
    formula: |
      window_hours = 24 if severity == CRITICAL else 48 if severity == HIGH else 72
      report_due_at = discovered_at + window_hours   # set once at first submit
      is_late = (submitted_at > report_due_at)        # STRICTLY greater: submission
                                                    # exactly at report_due_at is NOT late
      On resubmit, submitted_at updates and is_late recomputes against the
      ORIGINAL report_due_at.
    input_set: "The incident's severity, discovered_at, and the server clock at submit"
    constants:
      CRITICAL_WINDOW_HOURS: 24
      HIGH_WINDOW_HOURS: 48
      OTHER_WINDOW_HOURS: 72
    precision: "minute granularity; strict > comparison"

  - name: med_adherence_rate
    trigger: "GET /individuals/{individualId}/med-adherence"
    algorithm: aggregation
    formula: |
      window = [as_of - 30 days, as_of]  # CLOSED both ends: an event exactly at
                                         # as_of - 30d IS included
      events = MedAdminEvents for the individual (via medication_order_id ->
      MedicationOrder.individual_id) with scheduled_time inside window
      given = count(outcome == GIVEN); total = count(all outcomes)
      adherence_pct = if total == 0 then null else floor(100 * given / total)
    input_set: "MedAdminEvents whose order belongs to the individual; all outcomes count toward the denominator"
    constants:
      ADHERENCE_WINDOW_DAYS: 30
    precision: "integer percent, floor"

  - name: home_compliance_posture
    trigger: "incident submit / close; home read; claim submit gate; bed-assignment gate"
    algorithm: threshold
    formula: |
      open_incidents = Incidents with home_id = home and status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO}
      posture = CRITICAL    if any open incident with severity == CRITICAL
              = PROVISIONAL else if any open incident with severity == HIGH
              = GOOD_STANDING otherwise
      Recomputed immediately on incident submit (cascade link 1) and close.
      Gates: POST /bed-assignments and POST /claims/{id}/submit reject with
      ERR_HOME_POSTURE_CRITICAL when the relevant home's posture == CRITICAL.
    input_set: "Open incidents of the home (statuses SUBMITTED, UNDER_REVIEW, NEEDS_INFO; DRAFT and CLOSED excluded)"
    precision: "enum"
    constants:
      CRITICAL_SEVERITY: CRITICAL
      HIGH_SEVERITY: HIGH

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 2.5
    category: auth
    check: "Entity-backed roles (DSP/CaseManager/QIDP): X-User-ID must resolve to an ACTIVE StaffMember whose staff_role matches X-User-Role"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: all endpoints called with entity-backed roles
  - priority: 3
    category: existence
    check: "Path ids must exist; body FK ids must exist (ERR_NOT_FOUND or resource-specific variant)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 3.5
    category: existence
    check: "OCC version check, when the endpoint declares expected_*_version, runs BEFORE business logic"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /isps, POST /isps/{ispId}/amend"
  - priority: 4
    category: state
    check: "Target resource must be in a state that permits the transition (generic invalid-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 4.1
    category: state
    check: "Individual must be ENROLLED for ISP activation, BSP activation, authorizations, bed-assignments, med orders, incidents, EVV, transport legs, claims"
    error_id: ERR_INDIVIDUAL_NOT_ENROLLED
    http_status: 409
    applies_to: "create/activate endpoints referencing an individual"
  - priority: 4.2
    category: state
    check: "ISP anchored by a new ServiceAuthorization must be ACTIVE"
    error_id: ERR_ISP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /authorizations, POST /authorizations/{authId}/resume"
  - priority: 4.3
    category: state
    check: "Home must be ACTIVE for new shifts, bed-assignments, move-in, incidents, transport"
    error_id: ERR_HOME_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /shifts, POST /bed-assignments, POST /bed-assignments/{baId}/move-in, POST /incidents, POST /transport-trips"
  - priority: 4.4
    category: state
    check: "Authorization must be ACTIVE for EVV visit creation"
    error_id: ERR_AUTHORIZATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /evv-visits"
  - priority: 4.5
    category: state
    check: "MedicationOrder must be ACTIVE for admin events"
    error_id: ERR_MED_ORDER_DISCONTINUED
    http_status: 409
    applies_to: "POST /admin-events"
  - priority: 5
    category: business_safety
    check: "requires_med_pass shift: assigned staff must hold MED_CERT; admin events: recording DSP must hold MED_CERT"
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 403
    applies_to: "POST /shifts, POST /admin-events"
  - priority: 5.1
    category: business_safety
    check: "Witness required: order.requires_witness and outcome=GIVEN -> witness_staff_id present and != administered_by_staff_id"
    error_id: ERR_WITNESS_REQUIRED
    http_status: 400
    applies_to: "POST /admin-events"
  - priority: 6
    category: business_temporal
    check: "Shift overlap: same staff member; new [window_start, window_end) must satisfy start >= prior.window_end + 8h AND end + 8h <= next.window_start for every existing non-CANCELLED shift"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /shifts"
  - priority: 6.1
    category: business_temporal
    check: "Bed overlap: same (home_id, bed_label); half-open [move_in_date, move_out_date) intersection with any assignment in {PENDING, ACTIVE} is rejected; adjacency (touching endpoints) is allowed"
    error_id: ERR_BED_OVERLAP
    http_status: 409
    applies_to: "POST /bed-assignments, POST /bed-assignments/{baId}/move-in"
  - priority: 6.2
    category: business_temporal
    check: "Vehicle overlap: same vehicle_id and trip_date; half-open [depart_at, return_at) intersection with a non-CANCELLED trip is rejected; touching endpoints allowed"
    error_id: ERR_VEHICLE_OVERLAP
    http_status: 409
    applies_to: "POST /transport-trips"
  - priority: 6.3
    category: business_temporal
    check: "Span containment: authorization span must lie inside the linked ISP plan year; EVV service_date must lie inside authorization span (inclusive); admin event administered_time within +/- 60 minutes of scheduled_time"
    error_id: ERR_OUT_OF_SPAN
    http_status: 422
    applies_to: "POST /authorizations, POST /evv-visits, POST /admin-events"
  - priority: 7
    category: business_referential
    check: "Body FK coherence: authorization belongs to the stated individual; shift belongs to the stated home; visit's shift (if given) belongs to the visit's staff member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /evv-visits, POST /shifts"
  - priority: 7.1
    category: business_referential
    check: "Ownership: DSP may confirm only own shifts; DSP may submit/resubmit only own incidents"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /shifts/{shiftId}/confirm, POST /incidents/{incidentId}/submit, POST /incidents/{incidentId}/resubmit"
  - priority: 7.2
    category: business_referential
    check: "Segregation of duties: ISP approver != author; BSP approver != author; incident closer != submitter; claim payment poster != claim submitter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /isps/{ispId}/approve, POST /behavior-plans/{bpId}/hrc-approve, POST /incidents/{incidentId}/close, POST /claims/{claimId}/post-payment"
  - priority: 8
    category: business_constraint
    check: "Home posture gate: POST /bed-assignments and claim submit reject when home compliance_posture == CRITICAL"
    error_id: ERR_HOME_POSTURE_CRITICAL
    http_status: 409
    applies_to: "POST /bed-assignments, POST /claims/{claimId}/submit"
  - priority: 8.1
    category: business_constraint
    check: "Capacity: projected_census(move_in_date) + 1 must be <= certified_bed_count (filling the last bed exactly is allowed)"
    error_id: ERR_HOME_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bed-assignments"
  - priority: 8.2
    category: business_constraint
    check: "Vehicle capacity: sum of leg slots (wheelchair_seat ? 2 : 1) must be <= 8"
    error_id: ERR_VEHICLE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /transport-trips"
  - priority: 8.3
    category: business_constraint
    check: "Every transport leg individual must have an ACTIVE DAY_PROG authorization covering trip_date"
    error_id: ERR_NO_DAY_PROG_AUTHORIZATION
    http_status: 409
    applies_to: "POST /transport-trips"
  - priority: 9
    category: business_fiscal
    check: "Per-authorization cap: authorized_units * rate_cents <= 5000000 cents"
    error_id: ERR_UNIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /authorizations"
  - priority: 9.1
    category: business_fiscal
    check: "Per-individual annual cap: sum over the individual's non-CANCELLED authorizations of (authorized_units * rate_cents) including the new one <= 20000000 cents"
    error_id: ERR_INDIVIDUAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /authorizations"
  - priority: 9.2
    category: business_fiscal
    check: "Waterfall must fully place a visit's final_units across candidate authorizations; partial placement rejects the whole operation"
    error_id: ERR_AUTHORIZATION_UNITS_EXHAUSTED
    http_status: 409
    applies_to: "POST /evv-visits/{visitId}/verify, POST /evv-visits/{visitId}/resolve-exception, POST /claims/{claimId}/correct"
  - priority: 9.3
    category: business_fiscal
    check: "Claim generation requires at least one VERIFIED+UNBILLED visit in the period"
    error_id: ERR_NO_BILLABLE_VISITS
    http_status: 422
    applies_to: "POST /claims"
  - priority: 9.4
    category: business_fiscal
    check: "paid_amount_cents must be <= total_amount_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 400
    applies_to: "POST /claims/{claimId}/post-payment"
  - priority: 9.25
    category: business_fiscal
    check: "Claim period: service_period_end >= service_period_start (checked before sweep emptiness)"
    error_id: ERR_CLAIM_PERIOD_INVALID
    http_status: 400
    applies_to: "POST /claims"
  - priority: 10
    category: business_constraint
    check: "Input shape: required fields present; unknown request fields rejected; enums valid; dates parse; move_in_date <= today at move-in; goals_summary/description >= 10 chars; LEVEL_2 restrictive_interventions non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 10.1
    category: business_temporal
    check: "Move-in date must not be in the future at move-in time"
    error_id: ERR_MOVE_IN_FUTURE
    http_status: 422
    applies_to: "POST /bed-assignments/{baId}/move-in"
  - priority: 10.2
    category: business_constraint
    check: "BSP level vs restrictive_interventions consistency"
    error_id: ERR_RESTRICTIVE_INTERVENTION_MISMATCH
    http_status: 400
    applies_to: "POST /behavior-plans/{bpId}/submit-hrc"
  - priority: 10.3
    category: business_constraint
    check: "Home close requires zero ACTIVE residents and zero PENDING assignments"
    error_id: ERR_HOME_OCCUPIED
    http_status: 409
    applies_to: "POST /homes/{homeId}/close"

# =============================================================================
# 1.5 API Endpoint Table (80 endpoints, flat)
# =============================================================================
endpoints:
  # --- Agency bootstrap & clock ---
  - { method: POST, path: "/agencies", description: "Create a provider agency (bootstrap)", roles: [AgencyAdmin], code: 201, input: [name, "day_staff_ratio?", "night_staff_ratio?", "evv_grace_minutes?"], output: ProviderAgency, side_effects: ["cash_collected_cents=0, recoupment_balance_cents=0, held_claims_count=0"] }
  - { method: GET, path: "/agencies/{agencyId}", description: "Get agency incl. computed ledger fields", roles: [Any], code: 200, input: [], output: ProviderAgency, side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Startup default is exactly 2026-05-01T00:00:00Z (never wall-clock). Setting the clock fires time-based auto-transitions: ISP ACTIVE->EXPIRED, authorization APPROVED->ACTIVE / ACTIVE->EXPIRED, BSP ACTIVE->EXPIRED (with cascades)", roles: [AgencyAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["time-based auto-transitions evaluated"] }

  # --- Homes ---
  - { method: POST, path: "/homes", description: "Create a group home", roles: [AgencyAdmin], code: 201, input: [agency_id, name, license_number, certified_bed_count], output: GroupHome, side_effects: ["status=ACTIVE, compliance_posture=GOOD_STANDING, current_occupancy=0"] }
  - { method: GET, path: "/homes", description: "List homes (filtered)", roles: [Any], code: 200, input: ["agency_id?", "status?", "limit?", "offset?"], output: "GroupHome[]", side_effects: [] }
  - { method: GET, path: "/homes/{homeId}", description: "Get home incl. compliance_posture and current_occupancy", roles: [Any], code: 200, input: [], output: GroupHome, side_effects: [] }
  - { method: POST, path: "/homes/{homeId}/suspend", description: "Suspend home admissions and operations", roles: [ComplianceOfficer], code: 200, input: [], output: GroupHome, side_effects: ["PENDING BedAssignments -> CANCELLED", "increments GroupHome.version by 1"] }
  - { method: POST, path: "/homes/{homeId}/reinstate", description: "Reinstate suspended home", roles: [ComplianceOfficer], code: 200, input: [], output: GroupHome, side_effects: ["increments GroupHome.version by 1"] }
  - { method: POST, path: "/homes/{homeId}/close", description: "Close home (requires zero ACTIVE residents and zero PENDING assignments)", roles: [AgencyAdmin], code: 200, input: [], output: GroupHome, side_effects: ["increments GroupHome.version by 1"] }
  - { method: GET, path: "/homes/{homeId}/census", description: "Computed read: current vs projected census for a date", roles: [Any], code: 200, input: [as_of_date], output: "{ as_of_date: string, current_census: integer, projected_census: integer, certified_bed_count: integer, current_occupancy: integer }", side_effects: [] }
  - { method: GET, path: "/homes/{homeId}/staffing-check", description: "Computed read: weighted staffing requirement vs scheduled/actual coverage", roles: [Any], code: 200, input: [shift_date, shift_type], output: "{ shift_date: string, shift_type: string, weighted_census: integer, required_dsps: integer, scheduled_dsps: integer, actual_dsps: integer, compliant_scheduled: boolean, compliant_actual: boolean }", side_effects: [] }

  # --- Individuals ---
  - { method: POST, path: "/individuals", description: "Register an individual (APPLICANT)", roles: [CaseManager], code: 201, input: [agency_id, legal_name, medicaid_id, date_of_birth, mobility_level], output: Individual, side_effects: ["status=APPLICANT"] }
  - { method: GET, path: "/individuals", description: "List individuals (filtered)", roles: [Any], code: 200, input: ["agency_id?", "status?", "mobility_level?", "limit?", "offset?"], output: "Individual[]", side_effects: [] }
  - { method: GET, path: "/individuals/{individualId}", description: "Get individual", roles: [Any], code: 200, input: [], output: Individual, side_effects: [] }
  - { method: POST, path: "/individuals/{individualId}/enroll", description: "Enroll applicant into waiver services", roles: [QIDP], code: 200, input: [], output: Individual, side_effects: ["enrolled_at=now", "increments Individual.version by 1"] }
  - { method: POST, path: "/individuals/{individualId}/discharge", description: "Discharge individual; cascades to bed assignments, authorizations, ISP, BSP", roles: [QIDP], code: 200, input: [], output: Individual, side_effects: ["BedAssignments ACTIVE->ENDED / PENDING->CANCELLED", "authorizations -> CANCELLED", "ACTIVE ISP -> DISCONTINUED", "ACTIVE BSP -> EXPIRED", "GroupHome.current_occupancy recomputed", "increments Individual.version by 1"] }

  # --- ISP ---
  - { method: POST, path: "/isps", description: "Create ISP draft (OCC on Individual; supersedes existing DRAFT)", roles: [CaseManager, QIDP], code: 201, input: [individual_id, plan_year_start, plan_year_end, goals_summary, expected_individual_version, "meeting_date?"], output: ISP, side_effects: ["existing DRAFT ISP of the individual -> SUPERSEDED", "authored_by_staff_id = X-User-ID", "increments Individual.version by 1"] }
  - { method: GET, path: "/isps", description: "List ISPs (filtered)", roles: [Any], code: 200, input: ["individual_id?", "status?", "authored_by_staff_id?", "approved_by_staff_id?", "limit?", "offset?"], output: "ISP[]", side_effects: [] }
  - { method: GET, path: "/isps/{ispId}", description: "Get ISP", roles: [Any], code: 200, input: [], output: ISP, side_effects: [] }
  - { method: POST, path: "/isps/{ispId}/submit-review", description: "Submit draft or amendment for review", roles: [CaseManager, QIDP], code: 200, input: [], output: ISP, side_effects: ["increments ISP.version by 1"] }
  - { method: POST, path: "/isps/{ispId}/approve", description: "QIDP approves (segregation of duties vs author)", roles: [QIDP], code: 200, input: [], output: ISP, side_effects: ["approved_by_staff_id = X-User-ID", "increments ISP.version by 1"] }
  - { method: POST, path: "/isps/{ispId}/return", description: "Return plan to DRAFT for revision", roles: [QIDP], code: 200, input: ["return_reason?"], output: ISP, side_effects: ["increments ISP.version by 1"] }
  - { method: POST, path: "/isps/{ispId}/activate", description: "Activate approved plan; supersedes currently ACTIVE plan", roles: [QIDP], code: 200, input: [], output: ISP, side_effects: ["prior ACTIVE ISP -> SUPERSEDED", "activated_at=now", "increments ISP.version by 1"] }
  - { method: POST, path: "/isps/{ispId}/amend", description: "Amend ACTIVE plan (OCC on ISP); re-amend supersedes in-flight amendment", roles: [CaseManager, QIDP], code: 200, input: [expected_isp_version, "goals_summary?", "plan_year_end?"], output: ISP, side_effects: ["amendment_count += 1", "increments ISP.version by 1"] }

  # --- Service authorizations ---
  - { method: POST, path: "/authorizations", description: "Create waiver service authorization anchored to an ACTIVE ISP", roles: [CaseManager], code: 201, input: [individual_id, isp_id, service_code, unit_type, authorized_units, rate_cents, span_start, span_end], output: ServiceAuthorization, side_effects: ["status=PENDING, consumed_units=0"] }
  - { method: GET, path: "/authorizations", description: "List authorizations (filtered)", roles: [Any], code: 200, input: ["individual_id?", "isp_id?", "service_code?", "status?", "limit?", "offset?"], output: "ServiceAuthorization[]", side_effects: [] }
  - { method: GET, path: "/authorizations/{authId}", description: "Get authorization incl. consumed/remaining units", roles: [Any], code: 200, input: [], output: ServiceAuthorization, side_effects: [] }
  - { method: POST, path: "/authorizations/{authId}/approve", description: "Approve authorization; immediately ACTIVE when today is inside span", roles: [QIDP], code: 200, input: [], output: ServiceAuthorization, side_effects: ["increments ServiceAuthorization.version by 1"] }
  - { method: POST, path: "/authorizations/{authId}/cancel", description: "Cancel authorization (from PENDING/APPROVED/ACTIVE/SUSPENDED)", roles: [CaseManager], code: 200, input: [], output: ServiceAuthorization, side_effects: ["increments ServiceAuthorization.version by 1"] }
  - { method: POST, path: "/authorizations/{authId}/resume", description: "Resume suspended authorization (requires ACTIVE ISP and in-span)", roles: [QIDP], code: 200, input: [], output: ServiceAuthorization, side_effects: ["increments ServiceAuthorization.version by 1"] }

  # --- Staff ---
  - { method: POST, path: "/staff", description: "Hire staff member", roles: [AgencyAdmin], code: 201, input: [agency_id, full_name, staff_role, certifications, hire_date], output: StaffMember, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/staff", description: "List staff (filtered)", roles: [Any], code: 200, input: ["agency_id?", "staff_role?", "status?", "limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: GET, path: "/staff/{staffId}", description: "Get staff member", roles: [Any], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: POST, path: "/staff/{staffId}/terminate", description: "Terminate staff; future SCHEDULED/CONFIRMED shifts cancelled", roles: [AgencyAdmin], code: 200, input: [], output: StaffMember, side_effects: ["future shifts -> CANCELLED", "increments StaffMember.version by 1"] }

  # --- Shifts ---
  - { method: POST, path: "/shifts", description: "Assign DSP shift to a home (cert check, 8h rest buffer overlap)", roles: [AgencyAdmin], code: 201, input: [home_id, staff_member_id, window_start, window_end, shift_type, "requires_med_pass?"], output: ShiftAssignment, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/shifts", description: "List shifts (filtered)", roles: [Any], code: 200, input: ["home_id?", "staff_member_id?", "status?", "limit?", "offset?"], output: "ShiftAssignment[]", side_effects: [] }
  - { method: GET, path: "/shifts/{shiftId}", description: "Get shift", roles: [Any], code: 200, input: [], output: ShiftAssignment, side_effects: [] }
  - { method: POST, path: "/shifts/{shiftId}/confirm", description: "Assigned DSP confirms own shift", roles: [DSP], code: 200, input: [], output: ShiftAssignment, side_effects: ["increments ShiftAssignment.version by 1"] }
  - { method: POST, path: "/shifts/{shiftId}/cancel", description: "Cancel a SCHEDULED or CONFIRMED shift", roles: [AgencyAdmin], code: 200, input: [], output: ShiftAssignment, side_effects: ["increments ShiftAssignment.version by 1"] }

  # --- Bed assignments ---
  - { method: POST, path: "/bed-assignments", description: "Create admission (PENDING): posture gate, capacity gate, bed overlap (half-open)", roles: [CaseManager], code: 201, input: [home_id, bed_label, individual_id, move_in_date], output: BedAssignment, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/bed-assignments/{baId}", description: "Get a bed assignment", roles: [Any], code: 200, input: [], output: BedAssignment, side_effects: [] }
  - { method: GET, path: "/bed-assignments", description: "List bed assignments (filtered)", roles: [Any], code: 200, input: ["home_id?", "bed_label?", "individual_id?", "status?", "limit?", "offset?"], output: "BedAssignment[]", side_effects: [] }
  - { method: POST, path: "/bed-assignments/{baId}/move-in", description: "Execute move-in (date reached, no overlap)", roles: [QIDP], code: 200, input: [], output: BedAssignment, side_effects: ["GroupHome.current_occupancy recomputed", "increments BedAssignment.version by 1"] }
  - { method: POST, path: "/bed-assignments/{baId}/move-out", description: "Execute move-out; frees the bed", roles: [QIDP], code: 200, input: ["move_out_date?"], output: BedAssignment, side_effects: ["move_out_date = input or today", "GroupHome.current_occupancy recomputed", "increments BedAssignment.version by 1"] }
  - { method: POST, path: "/bed-assignments/{baId}/cancel", description: "Cancel a PENDING assignment", roles: [CaseManager], code: 200, input: [], output: BedAssignment, side_effects: ["increments BedAssignment.version by 1"] }

  # --- Medication orders & MAR events ---
  - { method: POST, path: "/medication-orders", description: "Create medication order (ACTIVE)", roles: [QIDP], code: 201, input: [individual_id, drug_name, dosage, schedule_times, start_date, "requires_witness?", "end_date?"], output: MedicationOrder, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/medication-orders", description: "List medication orders (filtered)", roles: [Any], code: 200, input: ["individual_id?", "status?", "limit?", "offset?"], output: "MedicationOrder[]", side_effects: [] }
  - { method: GET, path: "/medication-orders/{moId}", description: "Get medication order", roles: [Any], code: 200, input: [], output: MedicationOrder, side_effects: [] }
  - { method: POST, path: "/medication-orders/{moId}/discontinue", description: "Discontinue an order", roles: [QIDP], code: 200, input: [], output: MedicationOrder, side_effects: ["increments MedicationOrder.version by 1"] }
  - { method: POST, path: "/admin-events", description: "Record a MAR event (immutable; witness and window rules)", roles: [DSP], code: 201, input: [medication_order_id, scheduled_time, outcome, "administered_time?", "witness_staff_id?"], output: MedAdminEvent, side_effects: ["administered_by_staff_id = X-User-ID"] }
  - { method: GET, path: "/admin-events/{eventId}", description: "Get a MAR event", roles: [Any], code: 200, input: [], output: MedAdminEvent, side_effects: [] }
  - { method: GET, path: "/admin-events", description: "List MAR events (filtered)", roles: [Any], code: 200, input: ["medication_order_id?", "administered_by_staff_id?", "witness_staff_id?", "outcome?", "limit?", "offset?"], output: "MedAdminEvent[]", side_effects: [] }
  - { method: GET, path: "/individuals/{individualId}/med-adherence", description: "Computed read: 30-day closed-window adherence rate", roles: [Any], code: 200, input: [as_of], output: "{ window_start: datetime, window_end: datetime, total_events: integer, given_count: integer, adherence_pct: integer }", side_effects: [] }

  # --- Behavior support plans ---
  - { method: POST, path: "/behavior-plans", description: "Create BSP draft", roles: [CaseManager, QIDP], code: 201, input: [individual_id, level, restrictive_interventions], output: BehaviorSupportPlan, side_effects: ["status=DRAFT", "authored_by_staff_id = X-User-ID"] }
  - { method: GET, path: "/behavior-plans/{bpId}", description: "Get a behavior support plan", roles: [Any], code: 200, input: [], output: BehaviorSupportPlan, side_effects: [] }
  - { method: GET, path: "/behavior-plans", description: "List BSPs (filtered)", roles: [Any], code: 200, input: ["individual_id?", "status?", "level?", "authored_by_staff_id?", "approved_by_staff_id?", "limit?", "offset?"], output: "BehaviorSupportPlan[]", side_effects: [] }
  - { method: POST, path: "/behavior-plans/{bpId}/submit-hrc", description: "Submit plan to Human Rights Committee review", roles: [CaseManager, QIDP], code: 200, input: [], output: BehaviorSupportPlan, side_effects: ["increments BehaviorSupportPlan.version by 1"] }
  - { method: POST, path: "/behavior-plans/{bpId}/hrc-approve", description: "HRC approval (segregation of duties vs author)", roles: [QIDP], code: 200, input: [], output: BehaviorSupportPlan, side_effects: ["approved_at=now", "approved_by_staff_id = X-User-ID", "increments BehaviorSupportPlan.version by 1"] }
  - { method: POST, path: "/behavior-plans/{bpId}/hrc-reject", description: "HRC rejection back to DRAFT", roles: [QIDP], code: 200, input: [], output: BehaviorSupportPlan, side_effects: ["increments BehaviorSupportPlan.version by 1"] }
  - { method: POST, path: "/behavior-plans/{bpId}/activate", description: "Activate approved plan; supersedes prior ACTIVE; sets review_due_at", roles: [QIDP], code: 200, input: [], output: BehaviorSupportPlan, side_effects: ["prior ACTIVE BSP -> SUPERSEDED", "review_due_at = approved_at + 180d (LEVEL_2) or +365d (LEVEL_1)", "increments BehaviorSupportPlan.version by 1"] }

  # --- Incidents ---
  - { method: POST, path: "/incidents", description: "Draft an incident report", roles: [DSP, QIDP], code: 201, input: [individual_id, home_id, category, severity, occurred_at, discovered_at, description], output: Incident, side_effects: ["status=DRAFT", "submitted_by_staff_id = X-User-ID"] }
  - { method: GET, path: "/incidents/{incidentId}", description: "Get an incident", roles: [Any], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: GET, path: "/incidents", description: "List incidents (filtered)", roles: [Any], code: 200, input: ["individual_id?", "home_id?", "severity?", "status?", "submitted_by_staff_id?", "limit?", "offset?"], output: "Incident[]", side_effects: [] }
  - { method: POST, path: "/incidents/{incidentId}/submit", description: "Submit incident; computes report_due_at and is_late; CRITICAL triggers posture cascade", roles: [DSP, QIDP], code: 200, input: [], output: Incident, side_effects: ["submitted_at=now", "report_due_at computed", "is_late computed", "posture cascade (CRITICAL)", "increments Incident.version by 1"] }
  - { method: POST, path: "/incidents/{incidentId}/start-review", description: "QIDP begins review", roles: [QIDP], code: 200, input: [], output: Incident, side_effects: ["increments Incident.version by 1"] }
  - { method: POST, path: "/incidents/{incidentId}/request-info", description: "Send incident back for more information", roles: [QIDP], code: 200, input: [], output: Incident, side_effects: ["increments Incident.version by 1"] }
  - { method: POST, path: "/incidents/{incidentId}/resubmit", description: "DSP resubmits after NEEDS_INFO; is_late recomputed against original due", roles: [DSP, QIDP], code: 200, input: [], output: Incident, side_effects: ["submitted_at=now", "is_late recomputed", "increments Incident.version by 1"] }
  - { method: POST, path: "/incidents/{incidentId}/close", description: "Close incident (segregation of duties vs submitter); posture recompute may release HOLD claims", roles: [QIDP], code: 200, input: [], output: Incident, side_effects: ["posture recompute", "HOLD claims -> DRAFT if posture < CRITICAL", "held_claims_count recomputed", "increments Incident.version by 1"] }

  # --- EVV visits ---
  - { method: POST, path: "/evv-visits", description: "Create EVV visit (provisional units; EXCEPTION if geo fails)", roles: [DSP], code: 201, input: [individual_id, authorization_id, service_date, check_in_at, check_out_at, geo_within_radius, "shift_id?"], output: EVVVisit, side_effects: ["provisional_units computed", "staff_member_id = X-User-ID", "verification_status = PENDING or EXCEPTION"] }
  - { method: GET, path: "/evv-visits/{visitId}", description: "Get an EVV visit", roles: [Any], code: 200, input: [], output: EVVVisit, side_effects: [] }
  - { method: GET, path: "/evv-visits", description: "List EVV visits (filtered)", roles: [Any], code: 200, input: ["individual_id?", "authorization_id?", "staff_member_id?", "shift_id?", "verification_status?", "billing_status?", "billed_claim_id?", "limit?", "offset?"], output: "EVVVisit[]", side_effects: [] }
  - { method: POST, path: "/evv-visits/{visitId}/verify", description: "Verify pending visit: final units locked, waterfall allocation debits authorizations", roles: [QIDP], code: 200, input: [], output: EVVVisit, side_effects: ["final_units = provisional_units", "waterfall allocation", "EXHAUSTED auto-transition", "linked CONFIRMED shift -> COMPLETED", "increments EVVVisit.version by 1"] }
  - { method: POST, path: "/evv-visits/{visitId}/flag-exception", description: "Flag a pending visit as exception", roles: [QIDP], code: 200, input: [], output: EVVVisit, side_effects: ["increments EVVVisit.version by 1"] }
  - { method: POST, path: "/evv-visits/{visitId}/resolve-exception", description: "Resolve exception with adjusted minutes (multiple of 15); final units = adjusted/15", roles: [QIDP], code: 200, input: [adjusted_minutes, resolution_note], output: EVVVisit, side_effects: ["final_units = adjusted_minutes/15", "waterfall allocation", "increments EVVVisit.version by 1"] }
  - { method: POST, path: "/evv-visits/{visitId}/reject", description: "Reject a PENDING or EXCEPTION visit", roles: [QIDP], code: 200, input: [reason], output: EVVVisit, side_effects: ["increments EVVVisit.version by 1"] }

  # --- Day-program transport ---
  - { method: POST, path: "/transport-trips", description: "Schedule day-program transport trip (vehicle overlap half-open, capacity with wheelchair double slots, DAY_PROG authorization per leg)", roles: [AgencyAdmin], code: 201, input: [home_id, vehicle_id, trip_date, depart_at, return_at, legs], output: TransportTrip, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/transport-trips/{tripId}", description: "Get a transport trip", roles: [Any], code: 200, input: [], output: TransportTrip, side_effects: [] }
  - { method: GET, path: "/transport-trips", description: "List transport trips (filtered)", roles: [Any], code: 200, input: ["home_id?", "vehicle_id?", "trip_date?", "status?", "limit?", "offset?"], output: "TransportTrip[]", side_effects: [] }
  - { method: POST, path: "/transport-trips/{tripId}/cancel", description: "Cancel a scheduled trip", roles: [AgencyAdmin], code: 200, input: [], output: TransportTrip, side_effects: ["increments TransportTrip.version by 1"] }

  # --- Billing claims ---
  - { method: POST, path: "/claims", description: "Generate claim: sweep VERIFIED+UNBILLED visits in period into lines grouped by authorization", roles: [BillingSpecialist], code: 201, input: [individual_id, service_period_start, service_period_end], output: BillingClaim, side_effects: ["lines/totals computed", "swept visits UNBILLED -> BILLED with billed_claim_id"] }
  - { method: GET, path: "/claims/{claimId}", description: "Get a claim", roles: [Any], code: 200, input: [], output: BillingClaim, side_effects: [] }
  - { method: GET, path: "/claims", description: "List claims (filtered)", roles: [Any], code: 200, input: ["individual_id?", "status?", "limit?", "offset?"], output: "BillingClaim[]", side_effects: [] }
  - { method: POST, path: "/claims/{claimId}/submit", description: "Submit claim (posture gate; from DRAFT or CORRECTED)", roles: [BillingSpecialist], code: 200, input: [], output: BillingClaim, side_effects: ["submitted_at=now", "submitted_by_user_id = X-User-ID", "increments BillingClaim.version by 1"] }
  - { method: POST, path: "/claims/{claimId}/post-payment", description: "Post remittance: full payment -> recoupment netting; partial -> no recoupment", roles: [BillingSpecialist], code: 200, input: [paid_amount_cents], output: BillingClaim, side_effects: ["recoupment_netting", "agency cash/recoupment ledgers updated", "increments BillingClaim.version by 1"] }
  - { method: POST, path: "/claims/{claimId}/deny", description: "Record payer denial", roles: [BillingSpecialist], code: 200, input: [denial_reason], output: BillingClaim, side_effects: ["increments BillingClaim.version by 1"] }
  - { method: POST, path: "/claims/{claimId}/correct", description: "Correct a denied claim's lines (units per authorization)", roles: [BillingSpecialist], code: 200, input: [lines_override], output: BillingClaim, side_effects: ["lines and totals recomputed", "increments BillingClaim.version by 1"] }
  - { method: POST, path: "/claims/{claimId}/void", description: "Void a paid claim: cash reversal, visits UNBILLED, units released LIFO", roles: [BillingSpecialist], code: 200, input: [], output: BillingClaim, side_effects: ["cash_collected_cents -= posted_net_cents", "recoupment_balance_cents += posted_net_cents", "visits BILLED -> UNBILLED", "unit release LIFO", "increments BillingClaim.version by 1"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_ROLE_IDENTITY_MISMATCH, http: 403, condition: "Entity-backed role: X-User-ID does not resolve to an ACTIVE StaffMember with matching staff_role" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or body FK) does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the requested transition; includes terminal-state lockdown" }
  - { id: ERR_INDIVIDUAL_NOT_ENROLLED, http: 409, condition: "Operation requires an ENROLLED individual" }
  - { id: ERR_ISP_NOT_ACTIVE, http: 409, condition: "Anchored ISP is not ACTIVE" }
  - { id: ERR_HOME_NOT_ACTIVE, http: 409, condition: "Home is SUSPENDED or CLOSED" }
  - { id: ERR_AUTHORIZATION_NOT_ACTIVE, http: 409, condition: "Authorization not ACTIVE (PENDING/APPROVED/SUSPENDED/EXHAUSTED/EXPIRED/CANCELLED)" }
  - { id: ERR_MED_ORDER_DISCONTINUED, http: 409, condition: "Medication order is DISCONTINUED" }
  - { id: ERR_CERTIFICATION_MISSING, http: 403, condition: "Staff lacks MED_CERT required for a med-pass shift or for recording a MAR event" }
  - { id: ERR_WITNESS_REQUIRED, http: 400, condition: "Witnessed administration: witness_staff_id missing or equals administered_by_staff_id" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift violates the 8-hour rest buffer against an existing non-CANCELLED shift of the same staff member" }
  - { id: ERR_BED_OVERLAP, http: 409, condition: "Half-open move-in interval intersects an existing PENDING/ACTIVE assignment on the same (home_id, bed_label)" }
  - { id: ERR_VEHICLE_OVERLAP, http: 409, condition: "Trip window intersects a non-CANCELLED trip for the same vehicle_id and trip_date" }
  - { id: ERR_OUT_OF_SPAN, http: 422, condition: "Date outside the allowed span: authorization outside ISP plan year; EVV service_date outside authorization span; MAR administered_time outside +/- 60 min window" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Actor does not own the resource (shift confirm, incident submit/resubmit)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same person cannot author and approve (ISP/BSP), submit and close (incident), or submit and pay (claim)" }
  - { id: ERR_HOME_POSTURE_CRITICAL, http: 409, condition: "Home compliance_posture == CRITICAL blocks admissions and claim submission" }
  - { id: ERR_HOME_CAPACITY_EXCEEDED, http: 409, condition: "Projected census plus the new admission would exceed certified_bed_count" }
  - { id: ERR_VEHICLE_CAPACITY_EXCEEDED, http: 409, condition: "Leg slots (wheelchair=2) exceed vehicle capacity 8" }
  - { id: ERR_NO_DAY_PROG_AUTHORIZATION, http: 409, condition: "A leg's individual lacks an ACTIVE DAY_PROG authorization covering trip_date" }
  - { id: ERR_UNIT_CAP_EXCEEDED, http: 422, condition: "authorized_units * rate_cents exceeds the per-authorization cap of 5000000 cents" }
  - { id: ERR_INDIVIDUAL_CAP_EXCEEDED, http: 422, condition: "Aggregate authorized value for the individual exceeds the annual cap of 20000000 cents" }
  - { id: ERR_AUTHORIZATION_UNITS_EXHAUSTED, http: 409, condition: "Waterfall cannot fully place units; no partial allocation" }
  - { id: ERR_NO_BILLABLE_VISITS, http: 422, condition: "Claim period contains no VERIFIED + UNBILLED visits" }
  - { id: ERR_OVERPAYMENT, http: 400, condition: "paid_amount_cents exceeds claim total_amount_cents" }
  - { id: ERR_CLAIM_PERIOD_INVALID, http: 400, condition: "service_period_end earlier than service_period_start" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum, unparseable date, narrative too short, FK incoherence" }
  - { id: ERR_MOVE_IN_FUTURE, http: 422, condition: "move_in_date is after today at move-in time" }
  - { id: ERR_RESTRICTIVE_INTERVENTION_MISMATCH, http: 400, condition: "LEVEL_2 plan without restrictive interventions, or LEVEL_1 plan with them" }
  - { id: ERR_HOME_OCCUPIED, http: 409, condition: "Close requested while the home has ACTIVE residents or PENDING assignments" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Provider agency administrator: org bootstrap, homes, staff, shifts, transport, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /agencies"
      - "POST /_clock/set_current_utc"
      - "POST /homes, POST /homes/{id}/close"
      - "POST /staff, POST /staff/{id}/terminate"
      - "POST /shifts, POST /shifts/{id}/cancel"
      - "POST /transport-trips, POST /transport-trips/{id}/cancel"
    shared_operations: ["All GET endpoints"]
  - name: CaseManager
    description: "Case manager: authors ISPs, service authorizations, behavior plans, admissions"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /individuals"
      - "POST /isps, POST /isps/{id}/submit-review, POST /isps/{id}/amend (shared with QIDP)"
      - "POST /authorizations, POST /authorizations/{id}/cancel"
      - "POST /bed-assignments, POST /bed-assignments/{id}/cancel"
      - "POST /behavior-plans, POST /behavior-plans/{id}/submit-hrc (shared with QIDP)"
    shared_operations: ["All GET endpoints"]
  - name: QIDP
    description: "Qualified IDD professional: clinical/program approval authority"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /individuals/{id}/enroll, POST /individuals/{id}/discharge"
      - "POST /isps, POST /isps/{id}/submit-review, POST /isps/{id}/amend (shared with CaseManager)"
      - "POST /isps/{id}/approve, /return, /activate"
      - "POST /authorizations/{id}/approve, /resume"
      - "POST /medication-orders, POST /medication-orders/{id}/discontinue"
      - "POST /behavior-plans, POST /behavior-plans/{id}/submit-hrc (shared with CaseManager)"
      - "POST /behavior-plans/{id}/hrc-approve, /hrc-reject, /activate"
      - "POST /incidents, POST /incidents/{id}/submit, /resubmit (shared with DSP)"
      - "POST /incidents/{id}/start-review, /request-info, /close"
      - "POST /evv-visits/{id}/verify, /flag-exception, /resolve-exception, /reject"
      - "POST /bed-assignments/{id}/move-in, /move-out"
    shared_operations: ["All GET endpoints"]
  - name: DSP
    description: "Direct support professional: shift confirmation, MAR recording, incident drafting, EVV"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /shifts/{id}/confirm"
      - "POST /admin-events"
      - "POST /incidents, POST /incidents/{id}/submit, /resubmit (shared with QIDP)"
      - "POST /evv-visits"
    shared_operations: ["All GET endpoints"]
  - name: BillingSpecialist
    description: "Billing office: claim generation, submission, remittance, denial, correction, void"
    identity: opaque
    exclusive_operations:
      - "POST /claims, POST /claims/{id}/submit, /post-payment, /deny, /correct, /void"
    shared_operations: ["All GET endpoints"]
  - name: ComplianceOfficer
    description: "Compliance authority: home suspension and reinstatement"
    identity: opaque
    exclusive_operations:
      - "POST /homes/{id}/suspend, POST /homes/{id}/reinstate"
    shared_operations: ["All GET endpoints"]
  - name: Any
    description: "Any authenticated role (AgencyAdmin, CaseManager, QIDP, DSP, BillingSpecialist, ComplianceOfficer) may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
