              captures: { cell2_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 3, window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: ComplianceEngineer
              captures: { e1_id: $.data.id }
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m2_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 2, window_start: "2026-08-02T07:00:00Z", window_end: "2026-08-02T11:00:00Z" }
              as: ComplianceEngineer
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m3_id}", test_cell_id: "${cell1_id}", test_type: "UEF", sample_size: 3, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T09:00:00Z" }
              as: ComplianceEngineer
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "FIRST_HOUR_RATING", sample_size: 3, window_start: "2026-08-02T12:00:00Z", window_end: "2026-08-02T16:00:00Z" }
              as: ComplianceEngineer
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m3_id}", test_cell_id: "${cell1_id}", test_type: "FIRST_HOUR_RATING", sample_size: 3, window_start: "2026-08-02T12:00:00Z", window_end: "2026-08-02T16:00:00Z" }
              as: ComplianceEngineer
            - call: "POST /mfg/efficiency-tests"
              payload: { product_model_id: "${m1_id}", test_cell_id: "${cell1_id}", test_type: "FIRST_HOUR_RATING", sample_size: 3, window_start: "2026-08-02T22:00:00Z", window_end: "2026-08-03T02:00:00Z" }
              as: ComplianceEngineer
          assert:
            - "the contained 08:00-09:00 window returns 409 with error_id == 'ERR_TEST_CELL_CAPACITY_CONFLICT' (both slots are busy at 08:00)"
            - "the GX50-T 12:00-16:00 window returns 409 with error_id == 'ERR_TEST_CELL_COOLDOWN_VIOLATION' although it overlaps no other window (12:00 is only 2 hours after that model's 10:00 end)"
            - "the GX75-R 12:00-16:00 window returns 201, proving the cooldown tail is scoped to one ProductModel while the slot count is not"
            - "the GX50-T 22:00-02:00 window returns 201 (exactly 12 hours after the 10:00 end satisfies the cooldown)"
            - "EfficiencyTest.${e1_id}.status and EfficiencyTest.${e2_id}.status are both still SCHEDULED with unchanged windows"
            - "no EfficiencyTest row was created for either rejected call"

  - rule_id: compensating_invariant
    instances:
      - name: rework_reversal_restores_tank_count_ledger
        grounds:
          - state_machines.TankLot.LINING_REJECTED_to_LINED
          - calculations.tank_lot_quantity_ledger
          - entities.TankLot.fields.scrapped_quantity
          - entities.TankLot.fields.rework_count
          - entities.GlassLiningBatch.fields.rejected_lot_count
          - endpoints[POST /mfg/tank-lots/{id}/rework-reversal]
        distinguishing_aspect: >
          Conserved quantity: the physical tank count ledger planned == wip + good + scrapped, plus the two
          counters the rejection incremented. The reversal is the exact inverse of hop 1 AND hop 2 of the
          rejection - 10 tanks move back from scrapped to wip, rework_count returns to 0 and the batch's
          rejected_lot_count returns to 0 - so the lot becomes indistinguishable from its pre-inspection field
          vector while the FAIL inspection record deliberately REMAINS CURRENT. Restoring only the lot and
          leaving rejected_lot_count at 1 would silently arm the batch-quarantine threshold.
        test_recipe:
          setup:
            - "Tank lot TL-001 has planned_quantity 120 and was lined from fired batch GLB-001."
            - "A holiday inspection with 4 holidays in a sample of 6 failed the lot and scrapped 10 tanks."
            - "The lot is therefore LINING_REJECTED with wip_quantity 110, scrapped_quantity 10, last_scrap_quantity 10, rework_count 1 and cascade_rejected false."
            - "Batch GLB-001 is FIRED with rejected_lot_count 1, one short of BATCH_QUARANTINE_THRESHOLD 2."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlantAdmin

            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-A", max_firing_temp_c: 900 }
              as: PlantAdmin
              captures: { furn_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_id}", batch_code: "GLB-001", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T06:00:00Z", firing_end: "2026-08-02T10:00:00Z" }
              as: PlantOperator
              captures: { glb_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches/${glb_id}/fire"
              payload: {}
              as: PlantOperator

            - call: "POST /mfg/tank-lots"
              payload: { product_model_id: "${m1_id}", lot_code: "TL-001", planned_quantity: 120 }
              as: PlantOperator
              captures: { tl_id: $.data.id }
            - call: "POST /mfg/tank-lots/${tl_id}/weld"
              payload: {}
              as: PlantOperator
              as_user_id: "op-weld-1"
            - call: "POST /mfg/tank-lots/${tl_id}/apply-lining"
              payload: { glass_lining_batch_id: "${glb_id}" }
              as: PlantOperator

            - call: "GET /mfg/tank-lots/${tl_id}"
              payload: {}
              as: QualityInspector
              captures: { tl_vr: $.data.version }
            - call: "POST /mfg/lining-inspections"
              payload: { tank_lot_id: "${tl_id}", inspection_type: "HOLIDAY", sample_size: 6, holiday_count: 4, scrap_quantity: 10, expected_tank_lot_version: "${tl_vr}" }
              as: QualityInspector
              as_user_id: "insp-1"
          trigger:
            - call: "POST /mfg/tank-lots/${tl_id}/rework-reversal"
              payload: { reason_code: "GAUGE_MISREAD" }
              as: QualityInspector
              as_user_id: "insp-2"
          assert:
            - "TankLot.${tl_id}.status == LINED"
            - "TankLot.${tl_id}.wip_quantity == 120, scrapped_quantity == 0, good_quantity == 0 and last_scrap_quantity == null"
            - "TankLot.${tl_id}.planned_quantity == wip_quantity + good_quantity + scrapped_quantity == 120"
            - "TankLot.${tl_id}.rework_count == 0, so a later authorize-reline is not consumed by the reversed cycle"
            - "GlassLiningBatch.${glb_id}.rejected_lot_count == 0 and status == FIRED"
            - "the FAIL LiningInspection row still has record_status == CURRENT and result == FAIL (the reversal compensates quantities, not history)"
            - "TankLot.${tl_id}.version is strictly greater than the version captured before the inspection (compensation is a new write, not a rollback)"
      - name: payment_reversal_restores_warranty_reserve_ledger
        grounds:
          - state_machines.WarrantyClaim.PAID_to_VALIDATED
          - calculations.warranty_reserve_ledger
          - calculations.warranty_payout_proration
          - entities.ProductModel.fields.warranty_reserve_balance_cents
          - entities.ProductModel.fields.warranty_paid_cents
          - endpoints[POST /mfg/warranty-claims/{id}/reverse-payment]
        distinguishing_aspect: >
          A different conserved quantity - money, under the standing invariant balance == accrued - paid - and a
          different compensation shape: the credit-back must move warranty_paid_cents down and
          warranty_reserve_balance_cents up by exactly the SAME 20050 cents while warranty_reserve_accrued_cents
          stays frozen at 84000, because a reversal is not a de-shipment. The claim keeps its
          approved_payout_cents and coverage_pct so the same amount can be re-paid, which distinguishes the
          compensation from a denial.
        test_recipe:
          setup:
            - "Two GAS units of model GX50-T are SHIPPED, so warranty_reserve_accrued_cents is 2 * 42000 == 84000."
            - "The logical clock is 2027-02-01T00:00:00Z, so each unit has 5 months in service."
            - "A THERMOSTAT claim on the first unit was validated at coverage_pct 1.00 and approved_payout_cents 20050, then PAID."
            - "After the payment warranty_paid_cents is 20050 and warranty_reserve_balance_cents is 63950."
