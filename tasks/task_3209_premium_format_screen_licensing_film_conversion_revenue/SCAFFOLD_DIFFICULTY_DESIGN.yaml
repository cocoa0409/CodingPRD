        grounds:
          - state_machines.ScreenSlot.CONFIRMED_to_HELD_OVER
          - state_machines.ScreenSlot.HELD_OVER_to_CONFIRMED
        distinguishing_aspect: |
          ScreenSlot exhibits a cycle: CONFIRMED → HELD_OVER → CONFIRMED for
          next-window extension. This is on a different entity than
          ConversionOrder's rework cycle, and the trigger condition
          (per_screen_attendance_ratio ≥ 0.65) exercises the auto-transition.
