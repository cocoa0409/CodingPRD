              as: IntakeCounselor
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/cases/${case_id}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /compensation/claims"
              payload: { case_id: "${case_id}", category: "MEDICAL", claimed_amount_cents: 1000000 }
              as: IntakeCounselor
              captures: { claim_id: $.data.id }
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: IntakeCounselor
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Adjudicator
            - call: "POST /compensation/claims/${claim_id}/transition"
              payload: { to_status: "APPROVED", verified_amount_cents: 1000000 }
              as: Adjudicator
            - call: "POST /compensation/awards"
              payload: { case_id: "${case_id}", expected_program_version: "${prog_v}" }
              as: Adjudicator
              captures: { award_id: $.data.id }
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjudicator
            - call: "POST /compensation/awards/${award_id}/transition"
              payload: { to_status: "FINALIZED" }
              as: FinanceOfficer
            - call: "POST /compensation/disbursements"
              payload: { award_id: "${award_id}", payee_type: "MEDICAL_PROVIDER", amount_cents: 1000000, pay_run_date: "2026-05-10" }
              as: FinanceOfficer
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /compensation/disbursements/${disb_id}/transition"
              payload: { to_status: "PAID" }
              as: FinanceOfficer
            - call: "GET /compensation/awards/${award_id}"
              payload: {}
              as: FinanceOfficer
              captures: { pay: $.data.payment_status, paid: $.data.amount_paid_cents }
            - call: "GET /compensation/programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { disbursed: $.data.budget_disbursed_cents }
          assert:
            - "${pay} == FULLY_PAID"
            - "${paid} == 1000000"
            - "${disbursed} == 1000000"

