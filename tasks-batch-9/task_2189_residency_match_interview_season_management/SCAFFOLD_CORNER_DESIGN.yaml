      - name: faculty_member_create_and_read_back_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST /faculty-members
          - endpoints.GET /faculty-members/{id}
          - endpoints.GET /faculty-members
        distinguishing_aspect: >
          The create/read/list triple over one row: the committee flag survives the round trip, the two load
          variants are initialised to 0.00 rather than null, conflict_applicant_ids comes back as the empty
          array the default declares, and the boolean filter on the list endpoint actually selects.
        test_recipe:
          setup:
            - "one Program in PRE_SEASON with no faculty members"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
