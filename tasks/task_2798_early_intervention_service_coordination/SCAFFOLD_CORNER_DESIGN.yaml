              as: IntakeSpecialist
              captures: { child_c: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Diego", last_name: "Marin", date_of_birth: "2024-08-01", county_code: "CNT_A", primary_language: "ES" }
              as: IntakeSpecialist
              captures: { child_d: $.data.id }
            - call: "POST /ei/referrals"
