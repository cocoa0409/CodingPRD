              captures: { p_id: $.data.id }
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /coop/enrollments"
              payload: { member_id: "00000000-0000-0000-0000-000000000000", program_id: "${p_id}" }
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND"
            - "HTTP status == 422"

      - name: err_forbidden_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
        distinguishing_aspect: |
          MemberRep calling POST /coop/members (a CoopAdmin-exclusive endpoint)
          returns ERR_FORBIDDEN (403).
        test_recipe:
          setup: ["Co-op bootstrapped; Member M exists"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /coop/members"
              payload: { legal_name: "BadActor", commitment_level: "STANDARD" }
              as: MemberRep
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN"
            - "HTTP status == 403"

  # ===========================================================================
