              payload: { email: "lead10b@x.com", full_name: "Lead 10B", skills: ["PHOTO"], hourly_rate_cents: 12000 }
              as: StudioAdmin
              captures: { lead10b: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "second10@x.com", full_name: "Second 10", skills: ["PHOTO"], hourly_rate_cents: 8000 }
              as: StudioAdmin
              captures: { second10: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Wedding Std 10", session_type: "WEDDING", tier: "STANDARD", base_fee_cents: 200000, included_shoot_hours: 6, overage_hourly_rate_cents: 15000, included_edited_images: 100, deposit_pct: 0.30, requires_model_release: true, active: true }
              as: StudioAdmin
              captures: { pkg10: $.data.id }
            # Booking A whose schedule already has second10 assigned over an overlapping window
            - call: "POST /studio/bookings"
              payload: { client_id: "${c10}", package_id: "${pkg10}", lead_photographer_id: "${lead10b}", requested_shoot_hours: 6 }
              as: Client
              as_user_id: "${c10}"
              captures: { bkA: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bkA}", includes_model_release: true }
              as: StudioAdmin
              captures: { ctA: $.data.id }
            - call: "POST /studio/contracts/${ctA}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ctA}/sign"
              payload: {}
              as: Client
              as_user_id: "${c10}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bkA}", start_utc: "2026-08-01T14:00:00Z", end_utc: "2026-08-01T18:00:00Z" }
              as: StudioAdmin
              captures: { schA: $.data.id, schA_v: $.data.version }
            - call: "POST /studio/bookings/${bkA}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c10}"
            - call: "POST /studio/shoot-schedules/${schA}/second-shooter-assignments"
              payload: { photographer_id: "${second10}", expected_shoot_schedule_version: "${schA_v}" }
              as: StudioAdmin
              captures: { asgA: $.data.id }
            # Booking B with schedule S that overlaps A's window; reschedule bumps S.version so a stale value exists
            - call: "POST /studio/bookings"
              payload: { client_id: "${c10}", package_id: "${pkg10}", lead_photographer_id: "${lead10}", requested_shoot_hours: 6 }
              as: Client
              as_user_id: "${c10}"
              captures: { bkB: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bkB}", includes_model_release: true }
              as: StudioAdmin
              captures: { ctB: $.data.id }
            - call: "POST /studio/contracts/${ctB}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ctB}/sign"
              payload: {}
              as: Client
              as_user_id: "${c10}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bkB}", start_utc: "2026-08-10T09:00:00Z", end_utc: "2026-08-10T11:00:00Z" }
              as: StudioAdmin
              captures: { schS: $.data.id, schS_v0: $.data.version }
            - call: "POST /studio/bookings/${bkB}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c10}"
            # reschedule S into the window that overlaps A (14:00-18:00 on 08-01) -> bumps schS.version
            - call: "POST /studio/shoot-schedules/${schS}/reschedule"
              payload: { new_start_utc: "2026-08-01T15:00:00Z", new_end_utc: "2026-08-01T17:00:00Z", reason: "CLIENT_REQUEST" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/shoot-schedules/${schS}/second-shooter-assignments"
              payload: { photographer_id: "${second10}", expected_shoot_schedule_version: "${schS_v0}" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_SCHEDULE_VERSION"

