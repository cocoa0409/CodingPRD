        distinguishing_aspect: "The READINESS_SCORE_FLOOR_BPS = 9800 gate is re-armed by every new package: a second submission revokes the standing attestation (readiness_standardized back to false, status back to READINESS_COLLECTION) before it is even standardized, a 9700-bps package is REJECTED with SCORE_BELOW_FLOOR and leaves the institution un-closeable, and only a package at exactly 9800 bps re-earns RESOLUTION_READY."
