          - errors.ERR_PENALTY_UNPAID
          - errors.ERR_REINSTATEMENT_WINDOW_EXPIRED
          - validations[priority=39]
          - validations[priority=40]
        distinguishing_aspect: "Four graded refusals on one EXPIRED licence: renew is a state error (409), 10 makeup PDH is 422, a 30000-cent fee is 402 (fiscal, not validation), and once the clock passes reinstatement_eligible_until 2030-01-14 the priority-39 window guard pre-empts both of the later checks with 409."
        test_recipe:
          setup:
            - "Engineer 'Zeb Kort' held an ACTIVE licence issued 2026-01-15; the clock has been advanced to 2028-02-01T00:00:00Z so the sweep left it EXPIRED with reinstatement_eligible_until 2030-01-14T00:00:00.000Z."
