              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Seat Co", contact_email: "se@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
