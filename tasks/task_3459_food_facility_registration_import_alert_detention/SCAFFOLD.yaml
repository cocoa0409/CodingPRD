# =============================================================================
# SCAFFOLD: Food Facility Registration & Import Alert Detention
# (FDA human foods program)
# =============================================================================

scenario: |
  Food Facility Registration & Import Alert Detention (Food and Drug
  Administration human foods program): domestic and foreign facility
  registration with biennial renewal and unique identifier assignment, prior
  notice requirements for imported food shipments with data elements and
  timing before arrival, entry review screening shipments against risk
  factors, firm history and product codes with examination and sampling
  decisions, import alert placement subjecting a firm or country-product
  combination to detention without physical examination, petition process for
  removal from an alert requiring consecutive compliant shipments and
  corrective evidence, refusal, reconditioning and export options for
  detained shipments with time limits, foreign facility inspection scheduling
  and refusal to permit inspection consequences, recall classification and
  effectiveness verification for products already distributed

domain_name: food-facility-import-detention
api_prefix: /registry

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: compound   # cyclic (Facility, AlertPetition loop family) + parallel dims (ImportEntry)
  relationship_patterns:
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  sizing:
    entity_count: 10
    endpoint_count: 40
    error_code_count: 39
    calculation_count: 7
    state_machine_count: 8
    role_count: 7
  difficulty_target: beyond_expert

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the food facility" }
      - { name: facility_kind, type: enum, source: input, description: "DOMESTIC | FOREIGN" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the facility" }
      - { name: ufi, type: string, source: input, description: "Unique Facility Identifier supplied by the registrant; unique across all facilities (ERR_DUPLICATE_UFI)" }
      - { name: registration_number, type: string, source: system, description: "Server-minted registration number, format FFR-NNNNNN, zero-padded monotonic sequence starting FFR-000001" }
      - { name: registration_status, type: enum, source: system, description: "REGISTERED | EXPIRED | SUSPENDED" }
      - { name: registered_at, type: datetime, source: system, description: "Logical-clock instant of most recent initial registration" }
      - { name: expires_at, type: datetime, source: computed, description: "= registered_at + 730 days on creation; renewal rules in calculations.facility_registration_expiry" }
      - { name: violation_count, type: integer, source: computed, default: 0, description: "+1 per entry of this facility reaching disposition REFUSED; +N findings on inspection completion" }
      - { name: open_detention_count, type: integer, source: computed, default: 0, description: "Count of this facility's ImportEntry rows with disposition_status == DETAINED" }

  - name: ImporterFirm
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Importer firm legal name" }
      - { name: account_code, type: string, source: input, description: "Importer account code; unique across importers (ERR_DUPLICATE_ACCOUNT_CODE)" }
      - { name: standing, type: enum, source: computed, default: GOOD_STANDING, description: "GOOD_STANDING | PROBATION | REVOKED; see calculations.importer_standing_recompute" }
      - { name: refusal_count, type: integer, source: computed, default: 0, description: "Count of this importer's entries reaching terminal disposition REFUSED" }
      - { name: terminal_entry_count, type: integer, source: computed, default: 0, description: "Count of this importer's entries in any terminal disposition (RELEASED | REFUSED | EXPORTED | RECONDITIONED)" }

  - name: Laboratory
    parent: null
    common_fields: true
    fields:
      - { name: lab_code, type: string, source: input, description: "Lab business code; unique across laboratories (ERR_DUPLICATE_LAB_CODE)" }
      - { name: daily_sample_capacity, type: integer, source: input, description: "Maximum total sample_units schedulable per UTC calendar day; > 0" }

  - name: PriorNotice
    parent: null
    common_fields: true
    fields:
      - { name: importer_id, type: string, source: input, description: "FK -> ImporterFirm.id; must equal caller X-User-ID" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the foreign manufacturing facility" }
      - { name: product_code, type: string, source: input, description: "FDA product code string for the article" }
      - { name: product_risk_class, type: enum, source: input, description: "LOW | STANDARD | HIGH" }
      - { name: transport_mode, type: enum, source: input, description: "VESSEL | AIR | RAIL | ROAD" }
      - { name: arrival_eta, type: datetime, source: input, description: "Expected arrival instant; timing window per calculations.prior_notice_window_check" }
      - { name: declared_units, type: integer, source: input, description: "Declared article units; > 0" }
      - { name: unit_value_cents, type: integer, source: input, description: "Declared value per unit in cents; >= 0" }
      - { name: port_code, type: string, source: input, description: "Port of entry code" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | SUPERSEDED | COMPROMISED | CONSUMED" }
      - { name: is_amendment, type: boolean, source: system, default: false, description: "True when created by the amend endpoint" }
      - { name: parent_pn_id, type: string, source: system, description: "FK -> PriorNotice.id; null on initial filings, set to the superseded notice on amendments" }

  - name: ImportEntry
    parent: null
    common_fields: true
    fields:
      - { name: prior_notice_id, type: string, source: input, description: "FK -> PriorNotice.id; one entry per notice (notice flips to CONSUMED)" }
      - { name: importer_id, type: string, source: system, description: "FK -> ImporterFirm.id; copied from the prior notice" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; copied from the prior notice" }
      - { name: product_code, type: string, source: system, description: "Copied from the prior notice" }
      - { name: product_risk_class, type: enum, source: system, description: "LOW | STANDARD | HIGH; copied from the prior notice" }
      - { name: declared_units, type: integer, source: system, description: "Copied from the prior notice; immutable conserved total (see calculations.entry_units_conservation)" }
      - { name: unit_value_cents, type: integer, source: system, description: "Copied from the prior notice" }
      - { name: is_amendment_pn, type: boolean, source: system, description: "Copied from the prior notice's is_amendment" }
      - { name: review_status, type: enum, source: system, description: "PENDING_SCREENING | SCREENED — independent dimension 1" }
      - { name: disposition_status, type: enum, source: system, description: "PENDING | DETAINED | RELEASED | REFUSED | EXPORTED | RECONDITIONED — independent dimension 2; terminal set RELEASED|REFUSED|EXPORTED|RECONDITIONED" }
      - { name: screening_decision, type: enum, source: system, default: NONE, description: "NONE | RELEASE | SAMPLE | DETAIN" }
      - { name: screening_score, type: integer, source: computed, description: "Null until screened; then calculations.entry_screening_score" }
      - { name: scoring_variant_applied, type: enum, source: system, description: "BASE | HISTORY_WEIGHTED; null until screened" }
      - { name: probation_adjustment_applied, type: integer, source: computed, default: 0, description: "0 or 15; the PROBATION uplift added into screening_score" }
      - { name: detained_at, type: datetime, source: system, description: "Logical-clock instant detention began; null unless DETAINED" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "= detained_at + 240 hours; null unless DETAINED" }
      - { name: detained_under_alert_id, type: string, source: system, description: "FK -> ImportAlert.id; null for for-cause detentions (violative sample, inspection cascade)" }
      - { name: units_held, type: integer, source: computed, description: "Units currently detained; = declared_units at detention, drained by resolution actions" }
      - { name: units_released, type: integer, source: computed, default: 0, description: "Cumulative units released" }
      - { name: units_refused, type: integer, source: computed, default: 0, description: "Cumulative units refused" }
      - { name: units_exported, type: integer, source: computed, default: 0, description: "Cumulative units exported" }
      - { name: units_destroyed, type: integer, source: computed, default: 0, description: "Cumulative units destroyed after failed reconditioning" }
      - { name: bond_amount_cents, type: integer, source: computed, description: "Set by calculations.reconditioning_bond on request-reconditioning; null otherwise" }
      - { name: disposition_completed_at, type: datetime, source: system, description: "Logical-clock instant the entry first reached a terminal disposition; null while non-terminal" }

  - name: SampleAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: system, description: "FK -> ImportEntry.id; set at record-sample" }
      - { name: lab_code, type: string, source: input, description: "Business code of an existing Laboratory (not a UUID FK)" }
      - { name: sample_units, type: integer, source: input, description: "Units drawn for analysis; > 0" }
      - { name: analysis_date, type: string, source: input, description: "UTC calendar date YYYY-MM-DD the analysis is scheduled for; must not be before the current logical date (ERR_SAMPLE_DATE_PAST)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RESULT_RECORDED" }
      - { name: result, type: enum, source: system, description: "PENDING | COMPLIANT | VIOLATIVE" }

  - name: ImportAlert
    parent: null
    common_fields: true
    fields:
      - { name: scope_type, type: enum, source: input, description: "FIRM | COUNTRY_PRODUCT" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; required iff scope_type == FIRM, must be absent otherwise (ERR_INVALID_REQUEST)" }
      - { name: country_code, type: string, source: input, description: "Required iff scope_type == COUNTRY_PRODUCT" }
      - { name: product_code, type: string, source: input, description: "Required iff scope_type == COUNTRY_PRODUCT" }
      - { name: reason, type: string, source: input, description: "Free-text basis for the alert", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED; created ACTIVE" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating ComplianceOfficer; adjudication segregation-of-duties key" }
      - { name: lifted_at, type: datetime, source: system, description: "Logical-clock instant of lifting; null while ACTIVE" }

  - name: AlertPetition
    parent: null
    common_fields: true
    fields:
      - { name: alert_id, type: string, source: system, description: "FK -> ImportAlert.id; taken from the creation path" }
      - { name: filed_by_facility_id, type: string, source: system, description: "FK -> Facility.id; equals caller X-User-ID" }
      - { name: evidence_links, type: array, source: input, description: "List of corrective-evidence document references; may be empty at filing, extended by submit-evidence" }
      - { name: status, type: enum, source: system, description: "EVIDENCE_REVIEW | APPROVED | DENIED; created EVIDENCE_REVIEW" }
      - { name: consecutive_compliant_count, type: integer, source: computed, description: "Trailing compliant streak per calculations.petition_compliance_streak; computed at adjudication time, null until then" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; must be a FOREIGN facility" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the scheduling FieldInspector" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Half-open interval start" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Half-open interval end; must be strictly after start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | REFUSED_BY_FACILITY" }
      - { name: findings_violation_count, type: integer, source: input, description: "Set at completion; >= 0; added to Facility.violation_count" }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the recalling firm" }
      - { name: product_code, type: string, source: input, description: "Product code under recall" }
      - { name: quantity_distributed, type: integer, source: input, description: "Total units already distributed; > 0" }
      - { name: classification, type: enum, source: system, default: NONE, description: "NONE | CLASS_I | CLASS_II | CLASS_III" }
      - { name: status, type: enum, source: system, description: "INITIATED | CLASSIFIED | TERMINATED" }
      - { name: quantity_recovered, type: integer, source: computed, default: 0, description: "Cumulative units recovered" }
      - { name: quantity_corrected, type: integer, source: computed, default: 0, description: "Cumulative units corrected in place" }
      - { name: quantity_destroyed, type: integer, source: computed, default: 0, description: "Cumulative units destroyed" }
      - { name: quantity_outstanding, type: integer, source: computed, description: "= quantity_distributed - quantity_recovered - quantity_corrected - quantity_destroyed" }
      - { name: effectiveness_pct, type: number, source: computed, description: "calculations.recall_effectiveness; 1 decimal place, round_half_up" }
      - { name: consignees_contacted, type: integer, source: computed, default: 0, description: "Cumulative consignees contacted across effectiveness records" }
      - { name: consignees_total, type: integer, source: computed, default: 0, description: "Latest reported total consignee count" }
      - { name: consignee_contact_pct, type: number, source: computed, description: "100 * contacted / total; 1 decimal place, round_half_up; 0.0 when total == 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: REGISTERED
    terminal_states: [SUSPENDED]
    transitions:
      - from: REGISTERED
        to: EXPIRED
        trigger: "system — POST /_clock/set_current_utc sweep flips every REGISTERED facility with expires_at < new clock value"
        actor: system
        preconditions:
          - "registration_status == REGISTERED and expires_at < current logical time"
        side_effects:
          - "registration_status := EXPIRED; increments version by 1"
        note: "Expiry is strictly-less-than: at current time == expires_at the facility is still REGISTERED."
      - from: EXPIRED
        to: REGISTERED
        trigger: "POST /registry/facilities/{id}/renew"
        actor: FacilityOwner
        preconditions:
          - "registration_status IN {REGISTERED, EXPIRED} (else ERR_FACILITY_NOT_RENEWABLE)"
          - "renewal window open: expires_at - 90 days <= now <= expires_at + 30 days (else ERR_RENEWAL_WINDOW_CLOSED)"
          - "expected_facility_version == facility.version (else ERR_STALE_VERSION)"
        side_effects:
          - "registration_status := REGISTERED; expires_at recomputed per calculations.facility_registration_expiry; increments version by 1"
      - from: REGISTERED
        to: REGISTERED
        trigger: "POST /registry/facilities/{id}/renew"
        actor: FacilityOwner
        preconditions:
          - "registration_status IN {REGISTERED, EXPIRED} (else ERR_FACILITY_NOT_RENEWABLE)"
          - "renewal window open: expires_at - 90 days <= now <= expires_at + 30 days (else ERR_RENEWAL_WINDOW_CLOSED)"
          - "expected_facility_version == facility.version (else ERR_STALE_VERSION)"
        side_effects:
          - "expires_at := expires_at + 730 days (renewal before expiry extends from the old expiry); increments version by 1"
      - from: REGISTERED
        to: SUSPENDED
        trigger: "system — cascade of POST /registry/inspections/{id}/refuse-entry (see Inspection REFUSED_BY_FACILITY)"
        actor: system
        preconditions:
          - "registration_status == REGISTERED"
        side_effects:
          - "registration_status := SUSPENDED; increments version by 1; then fires cascade link 2 below"
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "(none — SUSPENDED is absorbing in this revision)"
        actor: system
        preconditions: []
        side_effects: []
        note: "No reinstatement path exists; SUSPENDED is terminal. Renew from SUSPENDED fails with ERR_FACILITY_NOT_RENEWABLE."

  - entity: PriorNotice
    initial_state: CONFIRMED
    terminal_states: [SUPERSEDED, COMPROMISED, CONSUMED]
    transitions:
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "POST /registry/prior-notices/{id}/amend"
        actor: Importer
        preconditions:
          - "status == CONFIRMED (else ERR_PN_NOT_CONFIRMED)"
          - "caller X-User-ID == prior_notice.importer_id (else ERR_OWNERSHIP_VIOLATION)"
          - "amendment timing window per calculations.prior_notice_window_check amendment variant"
        side_effects:
          - "this notice := SUPERSEDED; a new PriorNotice is created CONFIRMED with is_amendment = true and parent_pn_id = this notice's id"
      - from: CONFIRMED
        to: CONSUMED
        trigger: "POST /registry/entries"
        actor: Importer
        preconditions:
          - "status == CONFIRMED (else ERR_PN_NOT_CONFIRMED)"
        side_effects:
          - "status := CONSUMED; exactly one ImportEntry may consume a notice"
      - from: CONFIRMED
        to: COMPROMISED
        trigger: "system — cascade link 3 of inspection refusal (facility suspension compromises the facility's unconsumed notices)"
        actor: system
        preconditions:
          - "this notice has facility_id == the suspended facility and status == CONFIRMED (unconsumed)"
        side_effects:
          - "status := COMPROMISED"

  - entity: ImportEntry
    initial_state: "review_status = PENDING_SCREENING, disposition_status = PENDING (parallel dimensions)"
    terminal_states: [RELEASED, REFUSED, EXPORTED, RECONDITIONED]
    transitions:
      - from: "review PENDING_SCREENING / disposition PENDING"
        to: "review SCREENED / disposition RELEASED"
        trigger: "POST /registry/entries/{id}/screen with computed decision RELEASE"
        actor: EntryReviewer
        preconditions:
          - "review_status == PENDING_SCREENING (else ERR_ENTRY_INVALID_STATE)"
          - "no active ImportAlert scope match (a match forces decision DETAIN instead)"
          - "calculations.entry_screening_score < SAMPLE_THRESHOLD (40)"
        side_effects:
          - "stores screening_score, scoring_variant_applied, probation_adjustment_applied; disposition RELEASED; units_released := declared_units; disposition_completed_at := now; importer standing recompute (calculations.importer_standing_recompute)"
      - from: "review PENDING_SCREENING / disposition PENDING"
        to: "review SCREENED / disposition PENDING (decision SAMPLE)"
        trigger: "POST /registry/entries/{id}/screen with computed decision SAMPLE"
        actor: EntryReviewer
        preconditions:
          - "review_status == PENDING_SCREENING (else ERR_ENTRY_INVALID_STATE)"
          - "no active ImportAlert scope match"
          - "screening_score >= SAMPLE_THRESHOLD (40)"
        side_effects:
          - "stores screening_score, scoring_variant_applied, probation_adjustment_applied; disposition stays PENDING awaiting sample result"
      - from: "review PENDING_SCREENING / disposition PENDING"
        to: "review SCREENED / disposition DETAINED"
        trigger: "POST /registry/entries/{id}/screen when an ACTIVE ImportAlert matches the entry scope (detention without physical examination)"
        actor: EntryReviewer
        preconditions:
          - "review_status == PENDING_SCREENING (else ERR_ENTRY_INVALID_STATE)"
        side_effects:
          - "decision DETAIN; disposition DETAINED; detained_at := now; response_deadline_at := now + 240h; units_held := declared_units; detained_under_alert_id := matching alert id; facility.open_detention_count += 1"
      - from: "review * / disposition PENDING"
        to: "review * / disposition DETAINED"
        trigger: "system — (a) ACTIVE ImportAlert creation matching this entry's scope, or (b) inspection-refusal cascade, or (c) VIOLATIVE sample result"
        actor: system
        preconditions:
          - "disposition_status == PENDING"
        side_effects:
          - "disposition DETAINED; detained_at := now; response_deadline_at := now + 240h; units_held := declared_units; detained_under_alert_id := alert id for (a), null for (b)/(c); facility.open_detention_count += 1; for (b) cascade link 3 then flips every CONFIRMED (unconsumed) PriorNotice of the facility to COMPROMISED"
        note: "review_status is unchanged by detention — parallel dimensions evolve independently. If several ACTIVE alerts match the entry scope, the entry is detained once and detained_under_alert_id records the matching alert that was created first (earliest created_at; ties broken by creation order, which is server-recorded and total). An entry already DETAINED is not re-detained by a second matching alert."
      - from: "review SCREENED / disposition PENDING (decision SAMPLE)"
        to: "review SCREENED / disposition PENDING (decision SAMPLE)"
        trigger: "POST /registry/entries/{id}/record-sample"
        actor: EntryReviewer
        preconditions:
          - "review_status == SCREENED and screening_decision == SAMPLE and disposition_status == PENDING (else ERR_ENTRY_INVALID_STATE)"
          - "lab exists (else ERR_LAB_NOT_FOUND); analysis_date >= current logical date (else ERR_SAMPLE_DATE_PAST); lab-day capacity (else ERR_LAB_CAPACITY_EXCEEDED)"
        side_effects:
          - "creates SampleAnalysis(status SCHEDULED, result PENDING) linked to this entry"
      - from: "review SCREENED / disposition PENDING (decision SAMPLE)"
        to: "review SCREENED / disposition DETAINED"
        trigger: "POST /registry/samples/{id}/record-result with result VIOLATIVE"
        actor: EntryReviewer
        preconditions:
          - "sample.status == SCHEDULED (else ERR_ENTRY_INVALID_STATE)"
        side_effects:
          - "sample := RESULT_RECORDED/VIOLATIVE; entry disposition DETAINED (for-cause; detained_under_alert_id null; deadline now+240h; units_held := declared_units; facility.open_detention_count += 1)"
      - from: "review SCREENED / disposition PENDING (decision SAMPLE)"
        to: "review SCREENED / disposition RELEASED"
        trigger: "POST /registry/entries/{id}/release after a COMPLIANT sample result"
        actor: EntryReviewer
        preconditions:
          - "disposition_status == PENDING (else ERR_ENTRY_INVALID_STATE)"
          - "decision == SAMPLE and at least one linked sample has result COMPLIANT and none VIOLATIVE-pending unreconciled (else ERR_ENTRY_INVALID_STATE)"
        side_effects:
          - "disposition RELEASED; units_released += declared_units - units_released; disposition_completed_at := now; importer standing recompute"
      - from: "review SCREENED / disposition PENDING (decision RELEASE)"
        to: "review SCREENED / disposition RELEASED"
        trigger: "implicit at screen — see first transition; explicit POST /release is only for decision SAMPLE or DETAINED entries"
        actor: EntryReviewer
        preconditions: []
        side_effects: []
        note: "Decision RELEASE at screen time releases immediately; POST /release on such an entry is rejected ERR_ENTRY_INVALID_STATE (already terminal)."
      - from: "review * / disposition DETAINED"
        to: "review * / disposition RELEASED"
        trigger: "POST /registry/entries/{id}/release (DWPE evidence accepted) or import-alert petition-approval cascade"
        actor: ComplianceOfficer | system
        preconditions:
          - "disposition_status == DETAINED (else ERR_ENTRY_INVALID_STATE)"
          - "API path: actor must be ComplianceOfficer (an EntryReviewer releasing a DETAINED entry is rejected ERR_FORBIDDEN)"
        side_effects:
          - "disposition RELEASED; units_released += units_held; units_held := 0; facility.open_detention_count -= 1; disposition_completed_at := now (if not already set); importer standing recompute"
      - from: "review * / disposition DETAINED"
        to: "review * / disposition DETAINED (reconditioning requested)"
        trigger: "POST /registry/entries/{id}/request-reconditioning"
        actor: Importer
        preconditions:
          - "disposition_status == DETAINED (else ERR_ENTRY_INVALID_STATE)"
          - "caller X-User-ID == entry.importer_id (else ERR_OWNERSHIP_VIOLATION)"
          - "now <= response_deadline_at (else ERR_DETENTION_RESPONSE_DEADLINE_PASSED)"
          - "lots non-empty and every lot.quantity > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "bond_amount_cents := calculations.reconditioning_bond(lots, days_detained)"
      - from: "review * / disposition DETAINED (reconditioning requested)"
        to: "review * / disposition RECONDITIONED or DETAINED"
        trigger: "POST /registry/entries/{id}/record-reconditioning-outcome"
        actor: ComplianceOfficer
        preconditions:
          - "disposition_status == DETAINED and bond_amount_cents is not null (else ERR_ENTRY_INVALID_STATE)"
          - "units_passed >= 0 and units_failed >= 0 and units_passed + units_failed == units_held (else ERR_UNITS_ACCOUNTING_MISMATCH)"
        side_effects:
          - "units_released += units_passed; units_destroyed += units_failed; units_held := 0; facility.open_detention_count -= 1; if units_failed == 0: disposition RECONDITIONED, disposition_completed_at := now, importer standing recompute; else disposition REFUSED, units_refused += 0 (destroyed units count as refused for standing: refusal event fires), facility.violation_count += 1, disposition_completed_at := now, importer standing recompute"
        note: "Any failed unit makes the whole entry count as a refusal for facility violation_count and importer standing."
      - from: "review * / disposition DETAINED"
        to: "review * / disposition EXPORTED"
        trigger: "POST /registry/entries/{id}/export"
        actor: Importer
        preconditions:
          - "disposition_status == DETAINED (else ERR_ENTRY_INVALID_STATE)"
          - "caller X-User-ID == entry.importer_id (else ERR_OWNERSHIP_VIOLATION)"
          - "now <= response_deadline_at (else ERR_DETENTION_RESPONSE_DEADLINE_PASSED)"
        side_effects:
          - "units_exported += units_held; units_held := 0; facility.open_detention_count -= 1; disposition EXPORTED; disposition_completed_at := now; importer standing recompute (EXPORTED is terminal but not a refusal)"
      - from: "review * / disposition DETAINED"
        to: "review * / disposition REFUSED"
        trigger: "POST /registry/entries/{id}/refuse, or system sweep when now > response_deadline_at + 24 hours"
        actor: ComplianceOfficer | system
        preconditions:
          - "disposition_status == DETAINED (else ERR_ENTRY_INVALID_STATE)"
        side_effects:
          - "units_refused += units_held; units_held := 0; facility.open_detention_count -= 1; facility.violation_count += 1; disposition REFUSED; disposition_completed_at := now; importer standing recompute (refusal)"

  - entity: SampleAnalysis
    initial_state: SCHEDULED
    terminal_states: [RESULT_RECORDED]
    transitions:
      - from: SCHEDULED
        to: RESULT_RECORDED
        trigger: "POST /registry/samples/{id}/record-result"
        actor: EntryReviewer
        preconditions:
          - "status == SCHEDULED (else ERR_ENTRY_INVALID_STATE)"
          - "result IN {COMPLIANT, VIOLATIVE} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status := RESULT_RECORDED; result := input; VIOLATIVE detains the owning entry (see ImportEntry for-cause detention)"

  - entity: ImportAlert
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "system — cascade of POST /registry/alert-petitions/{id}/adjudicate with decision APPROVE"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := LIFTED; lifted_at := now; increments version by 1; then every ImportEntry with detained_under_alert_id == this alert and disposition_status == DETAINED is released (disposition RELEASED, units_released += units_held, units_held := 0, facility.open_detention_count -= 1, disposition_completed_at := now, importer standing recompute per entry)"

  - entity: AlertPetition
    initial_state: EVIDENCE_REVIEW
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: EVIDENCE_REVIEW
        to: EVIDENCE_REVIEW
        trigger: "POST /registry/alert-petitions/{id}/submit-evidence"
        actor: FacilityOwner
        preconditions:
          - "status == EVIDENCE_REVIEW (else ERR_PETITION_NOT_REVIEWABLE)"
          - "caller X-User-ID == petition.filed_by_facility_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "evidence_links extended with the submitted links; increments version by 1"
      - from: EVIDENCE_REVIEW
        to: APPROVED
        trigger: "POST /registry/alert-petitions/{id}/adjudicate with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "status == EVIDENCE_REVIEW (else ERR_PETITION_NOT_REVIEWABLE)"
          - "caller X-User-ID != alert.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "calculations.petition_compliance_streak >= 3 (else ERR_INSUFFICIENT_COMPLIANT_SHIPMENTS)"
          - "evidence_links non-empty (else ERR_INSUFFICIENT_COMPLIANT_SHIPMENTS)"
        side_effects:
          - "status := APPROVED; consecutive_compliant_count stored; alert lifted (see ImportAlert LIFTED cascade)"
      - from: EVIDENCE_REVIEW
        to: DENIED
        trigger: "POST /registry/alert-petitions/{id}/adjudicate with decision DENY"
        actor: ComplianceOfficer
        preconditions:
          - "status == EVIDENCE_REVIEW (else ERR_PETITION_NOT_REVIEWABLE)"
          - "caller X-User-ID != alert.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status := DENIED; consecutive_compliant_count stored; alert remains ACTIVE"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, REFUSED_BY_FACILITY]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /registry/inspections/{id}/complete"
        actor: FieldInspector
        preconditions:
          - "status == SCHEDULED (else ERR_INSPECTION_NOT_OPEN)"
          - "caller X-User-ID == inspection.inspector_user_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status := COMPLETED; Facility.violation_count += findings_violation_count; facility version increments"
      - from: SCHEDULED
        to: REFUSED_BY_FACILITY
        trigger: "POST /registry/inspections/{id}/refuse-entry"
        actor: FacilityOwner
        preconditions:
          - "status == SCHEDULED (else ERR_INSPECTION_NOT_OPEN)"
          - "caller X-User-ID == inspection.facility_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "status := REFUSED_BY_FACILITY; CASCADE link 1: facility REGISTERED -> SUSPENDED (an EXPIRED facility stays EXPIRED; links 2 and 3 still fire); link 2: every ImportEntry of that facility with disposition_status == PENDING (any review_status) becomes DETAINED (detained_at := now, response_deadline_at := now + 240h, units_held := declared_units, detained_under_alert_id := null, facility.open_detention_count += 1 per entry); link 3: every PriorNotice of that facility still in CONFIRMED becomes COMPROMISED"

  - entity: Recall
    initial_state: INITIATED
    terminal_states: [TERMINATED]
    transitions:
      - from: INITIATED
        to: CLASSIFIED
        trigger: "POST /registry/recalls/{id}/classify"
        actor: RecallCoordinator
        preconditions:
          - "status == INITIATED (else ERR_RECALL_INVALID_STATE)"
          - "classification IN {CLASS_I, CLASS_II, CLASS_III} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "classification := input; status := CLASSIFIED; from this moment the safety gate calculations.active_recall_gate applies to new entries"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /registry/recalls/{id}/record-effectiveness"
        actor: RecallCoordinator
        preconditions:
          - "status == CLASSIFIED (else ERR_RECALL_INVALID_STATE)"
          - "all deltas >= 0 and delta_recovered + delta_corrected + delta_destroyed <= quantity_outstanding (else ERR_UNITS_ACCOUNTING_MISMATCH)"
          - "consignees_contacted is a non-negative delta added to the cumulative count; consignees_total replaces the reported total and must be >= the new cumulative contacted (else ERR_INVALID_REQUEST)"
        side_effects:
          - "quantities accumulated; quantity_outstanding, effectiveness_pct, consignee_contact_pct recomputed; increments version by 1"
      - from: CLASSIFIED
        to: TERMINATED
        trigger: "POST /registry/recalls/{id}/terminate"
        actor: RecallCoordinator
        preconditions:
          - "status == CLASSIFIED (else ERR_RECALL_INVALID_STATE)"
          - "effectiveness threshold per calculations.recall_effectiveness met (else ERR_EFFECTIVENESS_THRESHOLD_NOT_MET)"
        side_effects:
          - "status := TERMINATED; safety gate for this recall ceases"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: renewal-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /registry/facilities/{id}/renew"
    occ_field: "expected_facility_version"
    description: |
      Renewing a Facility with an expected_facility_version that no longer
      matches the facility's current version is rejected. A renewal computed
      from a stale view of expires_at (for example before another writer's
      renewal or a cascade-driven mutation advanced the version) must not
      silently extend registration twice on the same baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: petition-create-stale-alert
    parent_entity: ImportAlert
    write_endpoint: "POST /registry/import-alerts/{id}/petitions"
    occ_field: "expected_import_alert_version"
    description: |
      Filing an AlertPetition against an ImportAlert whose version has
      advanced since the petitioner last observed it is rejected. Petition
      evidence is assembled against a specific alert revision; a stale
      version means the petitioner's basis may no longer describe the
      alert's current content.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prior_notice_window_check
    trigger: "POST /registry/prior-notices (initial variant) and POST /registry/prior-notices/{id}/amend (amendment variant)"
    algorithm: threshold
    formula: |
      lead_hours = (arrival_eta - now) in hours, exact to the minute
      MIN_LEAD_HOURS = { VESSEL: 8, AIR: 4, RAIL: 4, ROAD: 2 }
      initial variant:    require lead_hours >= MIN_LEAD_HOURS[transport_mode]
                          (ERR_NOTICE_TOO_LATE) and lead_hours <= MAX_LEAD_HOURS
                          (ERR_NOTICE_TOO_EARLY)
      amendment variant:  require lead_hours >= ceil(MIN_LEAD_HOURS[transport_mode] / 2)
                          (ERR_NOTICE_TOO_LATE) and lead_hours <= MAX_LEAD_HOURS
                          (ERR_NOTICE_TOO_EARLY)
      Boundaries are inclusive: lead exactly at the minimum passes; lead
      exactly 720.0 hours passes.
    input_set: "The notice being filed (or the new notice produced by amendment); transport_mode and arrival_eta from the payload"
    constants:
      MIN_LEAD_HOURS_VESSEL: 8
      MIN_LEAD_HOURS_AIR: 4
      MIN_LEAD_HOURS_RAIL: 4
      MIN_LEAD_HOURS_ROAD: 2
      MAX_LEAD_HOURS: 720
      AMENDMENT_MIN_DIVISOR: 2
    precision: "lead computed to whole minutes; comparison at minute granularity"
    variants:
      - name: initial
        when: "POST /registry/prior-notices"
        difference: "full minimum lead per transport mode"
      - name: amendment
        when: "POST /registry/prior-notices/{id}/amend"
        difference: "minimum lead halved (ceil); same data elements, different acceptance — e.g. VESSEL ETA 6h out: initial rejected, amendment accepted"

  - name: entry_screening_score
    trigger: "POST /registry/entries/{id}/screen"
    algorithm: weighted_scoring
    formula: |
      base_points = { LOW: 10, STANDARD: 30, HIGH: 60 }[entry.product_risk_class]
      vc = min(facility.violation_count, VC_CAP)
      rc = min(importer.refusal_count, RC_CAP)
      alert_term = 35 if an ACTIVE ImportAlert matches this entry's scope else 0
      amend_term = 10 if entry.is_amendment_pn else 0
      probation_term = 15 if importer.standing == PROBATION else 0
      variant BASE (facility.violation_count == 0 and importer.refusal_count == 0):
        score = min(100, base_points + 8*vc + 12*rc + alert_term + amend_term + probation_term)
      variant HISTORY_WEIGHTED (otherwise):
        score = min(100, base_points + 16*vc + 24*rc + alert_term + amend_term + probation_term)
      decision: alert_term > 0 -> DETAIN (regardless of score)
                else score >= SAMPLE_THRESHOLD -> SAMPLE
                else RELEASE
      The score is computed and stored even when the alert term forces DETAIN.
    input_set: "The entry being screened; its facility (violation_count), its importer (refusal_count, standing), the ACTIVE ImportAlert set, and the consumed prior notice's is_amendment"
    constants:
      BASE_LOW: 10
      BASE_STANDARD: 30
      BASE_HIGH: 60
      VC_CAP: 5
      RC_CAP: 3
      VC_WEIGHT_BASE: 8
      RC_WEIGHT_BASE: 12
      VC_WEIGHT_HISTORY: 16
      RC_WEIGHT_HISTORY: 24
      ALERT_TERM: 35
      AMEND_TERM: 10
      PROBATION_TERM: 15
      SAMPLE_THRESHOLD: 40
      SCORE_CAP: 100
    precision: "integer arithmetic; no rounding"
    variants:
      - name: base
        when: "facility.violation_count == 0 AND importer.refusal_count == 0 at screening time"
        difference: "history weights 8/12"
      - name: history_weighted
        when: "facility.violation_count > 0 OR importer.refusal_count > 0 at screening time"
        difference: "history weights 16/24 — identical entry data scores higher, e.g. STANDARD with violation_count 1: base 38 (RELEASE) vs weighted 46 (SAMPLE)"

  - name: reconditioning_bond
    trigger: "POST /registry/entries/{id}/request-reconditioning"
    algorithm: tiered_pricing
    formula: |
      Pinned evaluation order (rounding order matters and is fixed):
        1. per_lot_value_cents = lot.quantity * lot.unit_value_cents   (exact integer)
        2. per_lot_bond_cents  = round_half_up(per_lot_value_cents * BOND_RATE)
        3. bond_from_lots      = sum(per_lot_bond_cents)               (round BEFORE sum)
        4. days_detained       = floor((now - entry.detained_at) / 24h) (>= 0)
        5. storage_cents       = days_detained * STORAGE_DAILY_CENTS   (exact integer)
        6. bond_amount_cents   = bond_from_lots + storage_cents
      Example divergence: three lots of {quantity 1, unit_value_cents 105}
      give 3 * round_half_up(10.5) = 3 * 11 = 33; the forbidden order
      (sum-then-round) would give round_half_up(31.5) = 32.
    input_set: "The lots array from the request payload and the entry's detained_at"
    constants:
      BOND_RATE: 0.10
      STORAGE_DAILY_CENTS: 1500
    precision: "integer cents; round_half_up per lot before summing (order pinned above)"
    variants: []

  - name: importer_standing_recompute
    trigger: "Whenever one of the importer's entries reaches a terminal disposition (RELEASED | REFUSED | EXPORTED | RECONDITIONED), including via cascades and the deadline sweep"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (breaks the circular dependency between
      standing gating entry creation and entry outcomes feeding standing):
        1. apply the entry's outcome to refusal_count / terminal_entry_count
        2. ratio = refusal_count / max(1, terminal_entry_count)
        3. standing := REVOKED  if refusal_count >= REVOKED_REFUSALS or ratio >= REVOKED_RATIO
                       PROBATION elif refusal_count >= PROBATION_REFUSALS or ratio >= PROBATION_RATIO
                       GOOD_STANDING otherwise
        4. the new standing applies only to FUTURE POST /registry/entries
           and POST /registry/prior-notices calls; the entry whose outcome
           triggered the recompute is unaffected.
    input_set: "The importer's entries in terminal dispositions (counters updated by step 1)"
    constants:
      PROBATION_REFUSALS: 2
      PROBATION_RATIO: 0.20
      REVOKED_REFUSALS: 4
      REVOKED_RATIO: 0.50
    precision: "ratio compared as exact rational (refusal_count * 5 >= terminal_entry_count for 0.20; refusal_count * 2 >= terminal_entry_count for 0.50) — no float rounding"
    variants: []

  - name: petition_compliance_streak
    trigger: "POST /registry/alert-petitions/{id}/adjudicate (computed over the alert's scope at adjudication time)"
    algorithm: chronological
    formula: |
      candidate entries =
        scope FIRM:            ImportEntry where facility_id == alert.facility_id
        scope COUNTRY_PRODUCT: ImportEntry where entry facility's country_code == alert.country_code
                               and entry.product_code == alert.product_code
      keep only entries with disposition_completed_at != null
        AND disposition_completed_at >= alert.created_at
      order by disposition_completed_at ASC, tie-break created_at ASC (never id)
      streak = length of the trailing run of entries whose terminal
               disposition is in {RELEASED, RECONDITIONED}; any entry in
               {REFUSED, EXPORTED} breaks the run.
      Approve requires streak >= REQUIRED_STREAK and evidence_links non-empty.
    input_set: "Terminal entries in the alert scope completed at or after alert creation"
    constants:
      REQUIRED_STREAK: 3
    precision: "integer count"
    variants: []

  - name: recall_effectiveness
    trigger: "POST /registry/recalls/{id}/record-effectiveness (recompute) and POST /registry/recalls/{id}/terminate (threshold gate)"
    algorithm: aggregation
    formula: |
      quantity_outstanding = quantity_distributed - quantity_recovered
                             - quantity_corrected - quantity_destroyed
      accounted            = quantity_recovered + quantity_corrected + quantity_destroyed
      effectiveness_pct    = round_half_up(100 * accounted / quantity_distributed, 1)
      consignee_contact_pct = round_half_up(100 * consignees_contacted / consignees_total, 1)
                              (0.0 when consignees_total == 0)
      Termination thresholds:
        CLASS_I:   effectiveness_pct == 100.0 AND consignee_contact_pct == 100.0
        CLASS_II:  effectiveness_pct >= 95.0
        CLASS_III: effectiveness_pct >= 90.0
    input_set: "The recall's accumulated quantities"
    constants:
      CLASS_II_THRESHOLD: 95.0
      CLASS_III_THRESHOLD: 90.0
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: facility_registration_expiry
    trigger: "POST /registry/facilities (creation), POST /registry/facilities/{id}/renew (renewal), POST /_clock/set_current_utc (expiry sweep)"
    algorithm: threshold
    formula: |
      creation:            expires_at = registered_at + REGISTRATION_PERIOD_DAYS days
      renewal window:      expires_at - RENEWAL_OPEN_DAYS_BEFORE days <= now
                           <= expires_at + RENEWAL_GRACE_DAYS_AFTER days  (both inclusive)
      renewal from REGISTERED (now < expires_at):  new expires_at = old expires_at + 730 days
      renewal from EXPIRED  (now >= expires_at):   new expires_at = now + 730 days
      expiry sweep:        REGISTERED and expires_at < now  ->  EXPIRED
                           (strictly less-than: now == expires_at stays REGISTERED)
    input_set: "The facility's registered_at / expires_at and the current logical time"
    constants:
      REGISTRATION_PERIOD_DAYS: 730
      RENEWAL_OPEN_DAYS_BEFORE: 90
      RENEWAL_GRACE_DAYS_AFTER: 30
    precision: "whole-second ISO8601 comparisons"
    variants: []

  - name: active_recall_gate
    trigger: "POST /registry/entries (safety gate)"
    algorithm: threshold
    formula: |
      An entry creation is rejected with ERR_ACTIVE_RECALL_BLOCKS_ENTRY when a
      Recall exists with status == CLASSIFIED, classification == CLASS_I,
      facility_id == entry.facility_id and product_code == entry.product_code.
      INITIATED (unclassified) and TERMINATED recalls do not block.
    input_set: "Recalls matching the entry's facility and product code"
    constants: {}
    precision: "exact match"
    variants: []

  - name: entry_units_conservation
    trigger: "every disposition action on ImportEntry (invariant, asserted continuously)"
    algorithm: aggregation
    formula: |
      INVARIANT: units_held + units_released + units_refused
                 + units_exported + units_destroyed == declared_units
      at all times for every entry. All resolution actions move units
      between these buckets and never create or destroy the total.
    input_set: "The entry's five unit buckets"
    constants: {}
    precision: "integer units"
    variants: []

  - name: recall_quantity_conservation
    trigger: "POST /registry/recalls/{id}/record-effectiveness (invariant, asserted continuously)"
    algorithm: aggregation
    formula: |
      INVARIANT: quantity_recovered + quantity_corrected + quantity_destroyed
                 + quantity_outstanding == quantity_distributed
      at all times for every recall. record-effectiveness moves quantity
      from outstanding into the three accounted buckets.
    input_set: "The recall's four quantity fields"
    constants: {}
    precision: "integer units"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the seven declared roles; X-User-ID present for every role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: FacilityOwner X-User-ID equals the target facility id; Importer X-User-ID equals the target prior notice / entry importer_id; FieldInspector completing an inspection must be its inspector_user_id"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /registry/facilities/{id}/renew, POST /registry/prior-notices/{id}/amend, POST /registry/import-alerts/{id}/petitions, POST /registry/alert-petitions/{id}/submit-evidence, POST /registry/inspections/{id}/complete, POST /registry/inspections/{id}/refuse-entry, POST /registry/entries/{id}/request-reconditioning, POST /registry/entries/{id}/export, POST /registry/entries (via notice importer), POST /registry/prior-notices (importer_id == X-User-ID)"
  - priority: 4
    category: existence
    check: "Path ids resolve, validated left-to-right: facility, importer, prior notice, entry, sample, import alert, alert petition, inspection, recall; body-referenced lab_code must name an existing Laboratory"
    error_id: ERR_FACILITY_NOT_FOUND | ERR_IMPORTER_NOT_FOUND | ERR_PRIOR_NOTICE_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_IMPORT_ALERT_NOT_FOUND | ERR_ALERT_PETITION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_RECALL_NOT_FOUND | ERR_LAB_NOT_FOUND
    http_status: 404
    applies_to: "all id-addressed endpoints"
  - priority: 5
    category: state
    check: "Target resource in a valid state for the operation: facility REGISTERED/EXPIRED for renew; prior notice CONFIRMED for amend and for entry creation; importer standing != REVOKED for prior-notice and entry creation; entry review/disposition guards per §1.2; alert ACTIVE for petition filing; petition EVIDENCE_REVIEW for submit-evidence/adjudicate; inspection SCHEDULED for complete/refuse-entry; recall INITIATED for classify and CLASSIFIED for record-effectiveness/terminate"
    error_id: ERR_FACILITY_NOT_RENEWABLE | ERR_PN_NOT_CONFIRMED | ERR_IMPORTER_REVOKED | ERR_ENTRY_INVALID_STATE | ERR_IMPORT_ALERT_NOT_ACTIVE | ERR_PETITION_NOT_REVIEWABLE | ERR_INSPECTION_NOT_OPEN | ERR_RECALL_INVALID_STATE
    http_status: 409
    applies_to: "stateful action endpoints"
  - priority: 6
    category: business_safety
    check: "Entry creation requires the manufacturing facility registration_status == REGISTERED (EXPIRED or SUSPENDED rejected), and no CLASS_I CLASSIFIED recall matching the entry's facility_id and product_code (calculations.active_recall_gate); prior-notice creation also requires the facility REGISTERED"
    error_id: ERR_REGISTRATION_NOT_ACTIVE | ERR_ACTIVE_RECALL_BLOCKS_ENTRY
    http_status: 422
    applies_to: "POST /registry/entries, POST /registry/prior-notices"
  - priority: 7
    category: business_temporal
    check: "Timing windows: prior-notice lead window (create and amendment variants), renewal window, detention response deadline for request-reconditioning and export, sample analysis_date not in the past"
    error_id: ERR_NOTICE_TOO_LATE | ERR_NOTICE_TOO_EARLY | ERR_RENEWAL_WINDOW_CLOSED | ERR_DETENTION_RESPONSE_DEADLINE_PASSED | ERR_SAMPLE_DATE_PAST
    http_status: 422
    applies_to: "POST /registry/prior-notices, POST /registry/prior-notices/{id}/amend, POST /registry/facilities/{id}/renew, POST /registry/entries/{id}/request-reconditioning, POST /registry/entries/{id}/export, POST /registry/entries/{id}/record-sample"
  - priority: 8
    category: business_referential
    check: "Cross-references coherent: petition filer must be in the alert scope (FIRM: filer == alert.facility_id; COUNTRY_PRODUCT: filer country_code == alert.country_code and filer has at least one prior notice or entry with the alert product_code); inspection target facility must be FOREIGN"
    error_id: ERR_ALERT_SCOPE_MISMATCH | ERR_INSPECTION_REQUIRES_FOREIGN_FACILITY
    http_status: 422
    applies_to: "POST /registry/import-alerts/{id}/petitions, POST /registry/inspections"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and resource constraints: ufi unique across facilities; importer account_code unique; lab_code unique; inspector half-open schedule overlap; lab-day aggregate capacity; adjudicator segregation of duties (http 403); reconditioning unit accounting and recall effectiveness thresholds (http 422)"
    error_id: ERR_DUPLICATE_UFI | ERR_DUPLICATE_ACCOUNT_CODE | ERR_DUPLICATE_LAB_CODE | ERR_INSPECTION_SCHEDULE_OVERLAP | ERR_LAB_CAPACITY_EXCEEDED | ERR_SEGREGATION_OF_DUTIES | ERR_UNITS_ACCOUNTING_MISMATCH | ERR_EFFECTIVENESS_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "creation and adjudication endpoints"
  - priority: 10
    category: business_constraint
    check: "Optimistic concurrency: expected_facility_version / expected_import_alert_version match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /registry/facilities/{id}/renew, POST /registry/import-alerts/{id}/petitions"
  - priority: 11
    category: business_constraint
    check: "Petition approval sufficiency: consecutive compliant streak >= 3 and evidence_links non-empty (checked only when decision == APPROVE)"
    error_id: ERR_INSUFFICIENT_COMPLIANT_SHIPMENTS
    http_status: 422
    applies_to: "POST /registry/alert-petitions/{id}/adjudicate"
  - priority: 12
    category: business_constraint
    check: "Request shape: required fields present, enum values valid, integers within range (declared_units > 0, unit_value_cents >= 0, daily_sample_capacity > 0, scheduled_end_at > scheduled_start_at, quantities > 0, lots non-empty with positive quantity and non-negative unit_value_cents); alert scope-field consistency (FIRM requires facility_id and forbids country_code/product_code; COUNTRY_PRODUCT requires country_code + product_code and forbids facility_id)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (platform surface, outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and never the wall clock. The clock moves forward only (ERR_INVALID_REQUEST otherwise). Advancing the clock atomically runs the ops checkpoint: (1) every REGISTERED Facility with expires_at < new time becomes EXPIRED; (2) every ImportEntry with disposition_status == DETAINED and response_deadline_at + 24 hours < new time becomes REFUSED (units_refused += units_held, units_held := 0, facility.open_detention_count -= 1, facility.violation_count += 1, importer standing recompute). Both comparisons are strict: a facility with expires_at == new time stays REGISTERED, and a detention whose deadline+24h grace equals the new time is NOT auto-refused — the 24h sweep grace keeps ERR_DETENTION_RESPONSE_DEADLINE_PASSED reachable on still-DETAINED entries."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, expired_facility_ids: string[], auto_refused_entry_ids: string[] }"
    side_effects: ["facility expiry sweep", "detention deadline sweep (auto-refusal with standing recompute)"]

  # --- Facility ---
  - method: POST
    path: "/registry/facilities"
    description: "Register a food facility. The server mints the facility id and registration_number; the registering principal thereafter authenticates as FacilityOwner with X-User-ID equal to the facility id. created REGISTERED with registered_at := logical now, expires_at := now + 730 days."
    roles: [FacilityOwner]
    code: 201
    input: [legal_name, facility_kind, country_code, ufi]
    output: Facility
    side_effects: ["registration_number sequence advances"]
  - method: GET
    path: "/registry/facilities/{id}"
    description: "Read one facility including computed expires_at, violation_count, open_detention_count"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/registry/facilities/{id}/renew"
    description: "Biennial renewal. OCC-guarded. From REGISTERED extends old expires_at by 730 days; from EXPIRED (within grace) sets expires_at := now + 730 days and returns status REGISTERED."
    roles: [FacilityOwner]
    code: 200
    input: [expected_facility_version]
    output: Facility
    side_effects: ["increments Facility.version by 1", "recomputes expires_at per calculations.facility_registration_expiry"]

  # --- ImporterFirm ---
  - method: POST
    path: "/registry/importers"
    description: "Onboard an importer firm. Created GOOD_STANDING with zero counters. The importer thereafter authenticates with X-User-ID equal to the importer id."
    roles: [PlatformAdmin]
    code: 201
    input: [firm_name, account_code]
    output: ImporterFirm
    side_effects: []

  # --- Laboratory ---
  - method: POST
    path: "/registry/laboratories"
    description: "Register a laboratory with its daily aggregate sample capacity"
    roles: [PlatformAdmin]
    code: 201
    input: [lab_code, daily_sample_capacity]
    output: Laboratory
    side_effects: []

  # --- PriorNotice ---
  - method: POST
    path: "/registry/prior-notices"
    description: "File a prior notice for an imported food shipment. Synchronous data-element and timing validation (initial variant); created CONFIRMED. importer_id must equal caller X-User-ID."
    roles: [Importer]
    code: 201
    input: [importer_id, facility_id, product_code, product_risk_class, transport_mode, arrival_eta, declared_units, unit_value_cents, port_code]
    output: PriorNotice
    side_effects: []
  - method: GET
    path: "/registry/prior-notices/{id}"
    description: "Read one prior notice"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: []
    output: PriorNotice
    side_effects: []
  - method: GET
    path: "/registry/prior-notices"
    description: "List prior notices with filters and pagination"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["facility_id?", "importer_id?", "status?", "parent_pn_id?", "limit?", "offset?"]
    output: PriorNotice[]
    side_effects: []
  - method: POST
    path: "/registry/prior-notices/{id}/amend"
    description: "Amend a CONFIRMED notice. The old notice becomes SUPERSEDED and a new CONFIRMED notice is created with is_amendment = true, parent_pn_id := old id, unlisted fields inherited from the old notice. Amendment timing variant applies."
    roles: [Importer]
    code: 201
    input: [arrival_eta, "declared_units?", "unit_value_cents?", "port_code?"]
    output: PriorNotice
    side_effects: ["old notice SUPERSEDED"]

  # --- ImportEntry ---
  - method: POST
    path: "/registry/entries"
    description: "File an import entry against a CONFIRMED prior notice owned by the caller. Copies facility/product/units from the notice; notice becomes CONSUMED."
    roles: [Importer]
    code: 201
    input: [prior_notice_id]
    output: ImportEntry
    side_effects: ["prior notice := CONSUMED"]
  - method: GET
    path: "/registry/entries/{id}"
    description: "Read one entry including screening and disposition buckets"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: []
    output: ImportEntry
    side_effects: []
  - method: GET
    path: "/registry/entries"
    description: "List entries with filters and pagination"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["facility_id?", "importer_id?", "prior_notice_id?", "detained_under_alert_id?", "disposition_status?", "review_status?", "limit?", "offset?"]
    output: ImportEntry[]
    side_effects: []
  - method: POST
    path: "/registry/entries/{id}/screen"
    description: "Run entry review: computes calculations.entry_screening_score, stores score/variant/probation adjustment, applies decision (RELEASE / SAMPLE / DETAIN on active alert scope match)."
    roles: [EntryReviewer]
    code: 200
    input: []
    output: ImportEntry
    side_effects: ["screening decision applied per §1.2 ImportEntry", "on DETAIN: detention fields set and facility.open_detention_count += 1", "on RELEASE: importer standing recompute"]
  - method: POST
    path: "/registry/entries/{id}/record-sample"
    description: "Order a laboratory sample analysis for a SAMPLE-decision entry. Lab-day aggregate capacity enforced."
    roles: [EntryReviewer]
    code: 201
    input: [lab_code, sample_units, analysis_date]
    output: SampleAnalysis
    side_effects: ["creates SampleAnalysis SCHEDULED/PENDING"]
  - method: POST
    path: "/registry/entries/{id}/release"
    description: "Release an entry. EntryReviewer may release disposition PENDING entries (SAMPLE decision with a COMPLIANT result); a DETAINED entry may be released only by a ComplianceOfficer (ERR_FORBIDDEN for EntryReviewer)."
    roles: [EntryReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: ImportEntry
    side_effects: ["units move held -> released", "facility.open_detention_count -= 1 when released from DETAINED", "importer standing recompute"]
  - method: POST
    path: "/registry/entries/{id}/request-reconditioning"
    description: "Importer requests reconditioning of a detained entry before the response deadline; computes and stores calculations.reconditioning_bond."
    roles: [Importer]
    code: 200
    input: [lots]
    output: ImportEntry
    side_effects: ["bond_amount_cents stored"]
  - method: POST
    path: "/registry/entries/{id}/record-reconditioning-outcome"
    description: "ComplianceOfficer records the reconditioning result. units_passed + units_failed must equal units_held."
    roles: [ComplianceOfficer]
    code: 200
    input: [units_passed, units_failed]
    output: ImportEntry
    side_effects: ["units move to released/destroyed buckets", "terminal disposition RECONDITIONED (units_failed == 0) or REFUSED (units_failed > 0) with violation/standing consequences"]
  - method: POST
    path: "/registry/entries/{id}/export"
    description: "Importer exports a detained entry before the response deadline"
    roles: [Importer]
    code: 200
    input: []
    output: ImportEntry
    side_effects: ["units move held -> exported", "facility.open_detention_count -= 1", "importer standing recompute (not a refusal)"]
  - method: POST
    path: "/registry/entries/{id}/refuse"
    description: "ComplianceOfficer refuses admission of a detained entry"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ImportEntry
    side_effects: ["units move held -> refused", "facility.open_detention_count -= 1", "facility.violation_count += 1", "importer standing recompute (refusal)"]

  # --- SampleAnalysis ---
  - method: GET
    path: "/registry/entries/{id}/samples"
    description: "List sample analyses linked to an entry (reverse reachability for SampleAnalysis.entry_id)"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: SampleAnalysis[]
    side_effects: []
  - method: POST
    path: "/registry/samples/{id}/record-result"
    description: "Record the laboratory result for a scheduled sample. VIOLATIVE detains the owning entry for cause (detained_under_alert_id null)."
    roles: [EntryReviewer]
    code: 200
    input: [result]
    output: SampleAnalysis
    side_effects: ["VIOLATIVE: entry -> DETAINED with fresh 240h deadline, facility.open_detention_count += 1"]

  # --- ImportAlert ---
  - method: POST
    path: "/registry/import-alerts"
    description: "Place an import alert (created ACTIVE). Cascade: every non-terminal ImportEntry matching the scope (FIRM: entry.facility_id == facility_id; COUNTRY_PRODUCT: entry facility country_code == country_code and entry.product_code == product_code) with disposition_status == PENDING becomes DETAINED without physical examination (detained_under_alert_id := this alert, deadline now+240h, units_held := declared_units, facility.open_detention_count += 1 per entry)."
    roles: [ComplianceOfficer]
    code: 201
    input: [scope_type, "facility_id?", "country_code?", "product_code?", "reason?"]
    output: ImportAlert
    side_effects: ["auto-detention cascade over matching open entries"]
  - method: GET
    path: "/registry/import-alerts/{id}"
    description: "Read one import alert"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: []
    output: ImportAlert
    side_effects: []
  - method: GET
    path: "/registry/import-alerts"
    description: "List import alerts with filters and pagination (reverse reachability for ImportAlert.facility_id)"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["facility_id?", "status?", "scope_type?", "limit?", "offset?"]
    output: ImportAlert[]
    side_effects: []

  # --- AlertPetition ---
  - method: POST
    path: "/registry/import-alerts/{id}/petitions"
    description: "File a petition for removal from an ACTIVE alert. OCC-guarded on the alert version. Filer must be in the alert scope; created EVIDENCE_REVIEW."
    roles: [FacilityOwner]
    code: 201
    input: [expected_import_alert_version, evidence_links]
    output: AlertPetition
    side_effects: ["increments ImportAlert.version by 1"]
  - method: GET
    path: "/registry/import-alerts/{id}/petitions"
    description: "List petitions filed against an alert (reverse reachability for AlertPetition.alert_id)"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: AlertPetition[]
    side_effects: []
  - method: GET
    path: "/registry/facilities/{id}/petitions"
    description: "List petitions filed by a facility (reverse reachability for AlertPetition.filed_by_facility_id)"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: AlertPetition[]
    side_effects: []
  - method: POST
    path: "/registry/alert-petitions/{id}/submit-evidence"
    description: "Extend the petition's corrective-evidence list while EVIDENCE_REVIEW"
    roles: [FacilityOwner]
    code: 200
    input: [evidence_links]
    output: AlertPetition
    side_effects: ["increments AlertPetition.version by 1"]
  - method: POST
    path: "/registry/alert-petitions/{id}/adjudicate"
    description: "Adjudicate a petition. APPROVE requires streak >= 3 and non-empty evidence, and lifts the alert (releasing its remaining detentions); DENY leaves the alert ACTIVE. Adjudicator must not be the alert's creator."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: AlertPetition
    side_effects: ["on APPROVE: alert LIFTED cascade releases its DETAINED entries"]

  # --- Inspection ---
  - method: POST
    path: "/registry/inspections"
    description: "Schedule a foreign-facility inspection. Half-open [start, end) overlap per inspector is rejected; adjacency (new start == existing end) is allowed."
    roles: [FieldInspector]
    code: 201
    input: [facility_id, scheduled_start_at, scheduled_end_at]
    output: Inspection
    side_effects: []
  - method: GET
    path: "/registry/facilities/{id}/inspections"
    description: "List inspections of a facility (reverse reachability for Inspection.facility_id)"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/registry/inspections/{id}/complete"
    description: "Complete a scheduled inspection; only the scheduling inspector may complete it. findings_violation_count is added to Facility.violation_count."
    roles: [FieldInspector]
    code: 200
    input: [findings_violation_count]
    output: Inspection
    side_effects: ["Facility.violation_count += findings_violation_count"]
  - method: POST
    path: "/registry/inspections/{id}/refuse-entry"
    description: "Facility records refusal to permit inspection. Fires the three-link cascade: facility SUSPENDED -> open entries DETAINED -> their prior notices COMPROMISED."
    roles: [FacilityOwner]
    code: 200
    input: []
    output: Inspection
    side_effects: ["inspection-refusal cascade (see §1.2 Inspection)"]

  # --- Recall ---
  - method: POST
    path: "/registry/recalls"
    description: "Initiate a recall for a firm's distributed product. Created INITIATED with classification NONE."
    roles: [RecallCoordinator]
    code: 201
    input: [facility_id, product_code, quantity_distributed]
    output: Recall
    side_effects: []
  - method: GET
    path: "/registry/recalls/{id}"
    description: "Read one recall including derived quantities and percentages"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: []
    output: Recall
    side_effects: []
  - method: GET
    path: "/registry/recalls"
    description: "List recalls with filters and pagination (reverse reachability for Recall.facility_id)"
    roles: [PlatformAdmin, FacilityOwner, Importer, EntryReviewer, ComplianceOfficer, FieldInspector, RecallCoordinator]
    code: 200
    input: ["facility_id?", "classification?", "status?", "product_code?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []
  - method: POST
    path: "/registry/recalls/{id}/classify"
    description: "Assign CLASS_I | CLASS_II | CLASS_III; from this moment a CLASS_I recall blocks new entries for the same facility + product_code"
    roles: [RecallCoordinator]
    code: 200
    input: [classification]
    output: Recall
    side_effects: ["safety gate activates for CLASS_I"]
  - method: POST
    path: "/registry/recalls/{id}/record-effectiveness"
    description: "Record an effectiveness verification round: quantity deltas and consignee contact figures; recomputes outstanding/effectiveness/contact percentages"
    roles: [RecallCoordinator]
    code: 200
    input: [delta_recovered, delta_corrected, delta_destroyed, consignees_contacted, consignees_total]
    output: Recall
    side_effects: ["derived quantity and percentage fields recomputed", "increments Recall.version by 1"]
  - method: POST
    path: "/registry/recalls/{id}/terminate"
    description: "Terminate a classified recall once its classification's effectiveness threshold is met"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: Recall
    side_effects: ["safety gate ceases"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or role not one of the seven declared roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller role not in the endpoint's roles; also an EntryReviewer attempting to release a DETAINED entry" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed caller mismatch: renew/amend/petition/submit-evidence/complete/refuse-entry/request-reconditioning/export performed by a non-owner" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not resolve" }
  - { id: ERR_IMPORTER_NOT_FOUND, http: 404, condition: "ImporterFirm id does not resolve (e.g. prior notice importer_id)" }
  - { id: ERR_PRIOR_NOTICE_NOT_FOUND, http: 404, condition: "PriorNotice id does not resolve" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "ImportEntry id does not resolve" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "SampleAnalysis id does not resolve" }
  - { id: ERR_IMPORT_ALERT_NOT_FOUND, http: 404, condition: "ImportAlert id does not resolve" }
  - { id: ERR_ALERT_PETITION_NOT_FOUND, http: 404, condition: "AlertPetition id does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not resolve" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall id does not resolve" }
  - { id: ERR_LAB_NOT_FOUND, http: 404, condition: "lab_code names no existing Laboratory" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, range violation, alert scope-field inconsistency, non-forward clock set, empty reconditioning lots" }
  - { id: ERR_DUPLICATE_UFI, http: 409, condition: "ufi already registered on another facility" }
  - { id: ERR_DUPLICATE_ACCOUNT_CODE, http: 409, condition: "importer account_code already in use" }
  - { id: ERR_DUPLICATE_LAB_CODE, http: 409, condition: "lab_code already in use" }
  - { id: ERR_FACILITY_NOT_RENEWABLE, http: 409, condition: "Renew attempted on a SUSPENDED facility (state check; beats the renewal-window check)" }
  - { id: ERR_PN_NOT_CONFIRMED, http: 409, condition: "Amend or entry creation attempted on a notice not in CONFIRMED (SUPERSEDED / COMPROMISED / CONSUMED)" }
  - { id: ERR_IMPORTER_REVOKED, http: 409, condition: "Prior-notice or entry creation attempted while importer standing == REVOKED" }
  - { id: ERR_ENTRY_INVALID_STATE, http: 409, condition: "Entry action violates the review_status / disposition_status guards (double screen, release of terminal entry, reconditioning without DETAINED, etc.)" }
  - { id: ERR_IMPORT_ALERT_NOT_ACTIVE, http: 409, condition: "Petition filed against an alert that is not ACTIVE (LIFTED)" }
  - { id: ERR_PETITION_NOT_REVIEWABLE, http: 409, condition: "submit-evidence or adjudicate on a petition not in EVIDENCE_REVIEW" }
  - { id: ERR_INSPECTION_NOT_OPEN, http: 409, condition: "complete or refuse-entry on an inspection not in SCHEDULED" }
  - { id: ERR_RECALL_INVALID_STATE, http: 409, condition: "classify on non-INITIATED recall; record-effectiveness or terminate on non-CLASSIFIED recall" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 422, condition: "Prior-notice or entry creation while the facility is EXPIRED or SUSPENDED" }
  - { id: ERR_ACTIVE_RECALL_BLOCKS_ENTRY, http: 422, condition: "Entry creation for facility + product_code under a CLASS_I CLASSIFIED recall (safety; beats referential and temporal failures)" }
  - { id: ERR_NOTICE_TOO_LATE, http: 422, condition: "lead_hours < applicable minimum (initial: mode minimum; amendment: half the mode minimum)" }
  - { id: ERR_NOTICE_TOO_EARLY, http: 422, condition: "lead_hours > 720" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "Renewal attempted outside [expires_at - 90 days, expires_at + 30 days]" }
  - { id: ERR_DETENTION_RESPONSE_DEADLINE_PASSED, http: 422, condition: "request-reconditioning or export attempted after response_deadline_at" }
  - { id: ERR_SAMPLE_DATE_PAST, http: 422, condition: "record-sample with analysis_date before the current logical UTC date (temporal; beats the lab-capacity check)" }
  - { id: ERR_LAB_CAPACITY_EXCEEDED, http: 409, condition: "Sum of sample_units already scheduled for the lab on that UTC date plus new sample_units would exceed daily_sample_capacity" }
  - { id: ERR_INSPECTION_SCHEDULE_OVERLAP, http: 409, condition: "New inspection's half-open [start, end) intersects another SCHEDULED inspection of the same inspector" }
  - { id: ERR_INSPECTION_REQUIRES_FOREIGN_FACILITY, http: 422, condition: "Inspection scheduled for a DOMESTIC facility" }
  - { id: ERR_ALERT_SCOPE_MISMATCH, http: 422, condition: "Petition filer outside the alert scope (FIRM: filer != alert facility; COUNTRY_PRODUCT: filer country mismatch or no prior notice/entry with the product_code)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Petition adjudicator X-User-ID equals the alert's created_by_user_id" }
  - { id: ERR_INSUFFICIENT_COMPLIANT_SHIPMENTS, http: 422, condition: "APPROVE adjudication with consecutive compliant streak < 3 or empty evidence_links" }
  - { id: ERR_UNITS_ACCOUNTING_MISMATCH, http: 422, condition: "record-reconditioning-outcome units_passed + units_failed != units_held; or effectiveness deltas exceed quantity_outstanding" }
  - { id: ERR_EFFECTIVENESS_THRESHOLD_NOT_MET, http: 422, condition: "Recall termination before the classification's effectiveness/contact thresholds are met" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_facility_version / expected_import_alert_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Agency platform operator: drives the logical clock and ops checkpoint, onboards importer firms and laboratories"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /registry/importers", "POST /registry/laboratories"]
    shared_operations: ["all GET endpoints"]
  - name: FacilityOwner
    description: "The registered food facility acting on itself; X-User-ID equals the Facility id (the id is minted at registration, which itself carries no ownership check)"
    identity: "entity_backed:Facility"
    exclusive_operations: ["POST /registry/facilities", "POST /registry/facilities/{id}/renew", "POST /registry/import-alerts/{id}/petitions", "POST /registry/alert-petitions/{id}/submit-evidence", "POST /registry/inspections/{id}/refuse-entry"]
    shared_operations: ["all GET endpoints"]
  - name: Importer
    description: "Importer firm filing prior notices and entries and choosing detention outcomes; X-User-ID equals the ImporterFirm id"
    identity: "entity_backed:ImporterFirm"
    exclusive_operations: ["POST /registry/prior-notices", "POST /registry/prior-notices/{id}/amend", "POST /registry/entries", "POST /registry/entries/{id}/request-reconditioning", "POST /registry/entries/{id}/export"]
    shared_operations: ["all GET endpoints"]
  - name: EntryReviewer
    description: "FDA entry review staff: screening decisions, sample ordering and result recording, release of non-detained entries"
    identity: opaque
    exclusive_operations: ["POST /registry/entries/{id}/screen", "POST /registry/entries/{id}/record-sample", "POST /registry/samples/{id}/record-result"]
    shared_operations: ["all GET endpoints", "POST /registry/entries/{id}/release (PENDING entries only)"]
  - name: ComplianceOfficer
    description: "FDA compliance branch: import alerts, petition adjudication, detention refusal/release, reconditioning outcomes. May not adjudicate a petition against an alert it created."
    identity: opaque
    exclusive_operations: ["POST /registry/import-alerts", "POST /registry/alert-petitions/{id}/adjudicate", "POST /registry/entries/{id}/refuse", "POST /registry/entries/{id}/record-reconditioning-outcome"]
    shared_operations: ["all GET endpoints", "POST /registry/entries/{id}/release (any non-terminal detained or cleared entry)"]
  - name: FieldInspector
    description: "FDA foreign-office inspector: schedules and completes foreign facility inspections"
    identity: opaque
    exclusive_operations: ["POST /registry/inspections", "POST /registry/inspections/{id}/complete"]
    shared_operations: ["all GET endpoints"]
  - name: RecallCoordinator
    description: "FDA recall staff: recall initiation, classification, effectiveness verification, termination"
    identity: opaque
    exclusive_operations: ["POST /registry/recalls", "POST /registry/recalls/{id}/classify", "POST /registry/recalls/{id}/record-effectiveness", "POST /registry/recalls/{id}/terminate"]
    shared_operations: ["all GET endpoints"]
