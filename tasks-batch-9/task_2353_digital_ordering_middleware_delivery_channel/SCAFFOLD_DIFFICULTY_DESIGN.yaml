          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published; Channel AGGRPLUS (AGGREGATOR, accepts_delivery true)"
            - "CourierNetwork N_MKT: MARKETPLACE type, priority_rank 1, active"
