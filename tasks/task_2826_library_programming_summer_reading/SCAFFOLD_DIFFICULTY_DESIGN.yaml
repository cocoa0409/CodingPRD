  - rule_id: priority_pair_validation_conflict
    instances:

      - name: child_safety_screening_priority_19_outranks_fee_cap_priority_45
        grounds:
          - validations[priority=19]
          - validations[priority=45]
          - errors[ERR_PRESENTER_SCREENING_REQUIRED]
          - errors[ERR_FEE_CAP_EXCEEDED]
          - calculations.contract_total_fee
        distinguishing_aspect: |
          Safety-versus-fiscal pair, 26 priorities apart. One execute call violates both rules at once:
          the presenter has never been screened (screening_status NONE) on a minors-serving program,
          and the computed total_fee_cents 230753 blows through the binding branch cap of 150000.
          The response must be ERR_PRESENTER_SCREENING_REQUIRED (422, priority 19) — an implementation
          that computes the fee first and returns ERR_FEE_CAP_EXCEEDED (priority 45) is wrong even
          though both errors are individually correct diagnoses.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch with per_program_fee_cap_cents 150000."
            - "One TEEN (serves_minors true) IN_BRANCH program on Saturday 2026-08-15T14:00Z-15:00Z, left in DRAFT."
            - "One presenter that was NEVER screened: screening_decision NONE and screening_status NONE."
            - "That presenter's insurance_certificate_expires_on is 2026-09-10, which satisfies priority 20 (>= the program end date) but sits inside the 30-day rider window, so the rider is part of the over-cap total."
            - "A contract at round_trip_miles 75 offered at 200000 by user-coord-5: base 200000 + travel 3275 + escort 4000 + rider 2500 = 209775, weekend premium round_half_up(20977.5) = 20978, total 230753 > min(250000, 150000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Teen Robotics", age_group: "TEEN", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-15T14:00:00.000Z", end_utc: "2026-08-15T15:00:00.000Z", attendance_target: 24, attendance_cap: 24, supply_sku: "KIT-BOT", supply_units_per_attendee: 0, materials_budget_cents: 12000, presenter_fee_budget_cents: 250000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/presenters"
              payload: { legal_name: "Ada Reyes", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2026-09-10", quoted_fee_cents: 200000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${prog}", round_trip_miles: 75 }
              as: ProgramCoordinator
              as_user_id: "user-coord-5"
              captures: { ct: $.data.id }
            - call: "POST /library/contracts/${ct}/offer"
              payload: { offered_fee_cents: 200000 }
              as: ProgramCoordinator
              as_user_id: "user-coord-5"
          trigger:
            - call: "POST /library/contracts/${ct}/execute"
              payload: {}
              as: ProgramManager
