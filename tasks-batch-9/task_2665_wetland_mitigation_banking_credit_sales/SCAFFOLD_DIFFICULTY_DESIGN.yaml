          Combinatorial mode (a) — FOUR-INPUT NON-LINEAR INTERACTION. credits_requested 6.00 straddles
          the 5.00 marginal tier boundary (19000000 + 3610000 = 22610000, not 6.00 * 3800000 =
          22800000), hgm_class DEPRESSIONAL selects the 3800000 base, the SECONDARY service-area tier
          adds 0.12 and the underfunded endowment adds 0.08 to the SAME premium base (0.20 combined,
          4522000 — not two independently rounded premiums), and the resulting gross 27132000 then
