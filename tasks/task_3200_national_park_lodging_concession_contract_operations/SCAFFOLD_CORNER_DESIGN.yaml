              payload: { reason: "over cap" }
              as: AgencyRateAnalyst
            - &cy_f2
              call: "POST /contracts/${c_id}/rate-filings"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", submitted_rates: [{ occupancy_band: "SOLO", nightly_rate_cents: 19000 }, { occupancy_band: "DOUBLE", nightly_rate_cents: 23000 }, { occupancy_band: "FAMILY", nightly_rate_cents: 26300 }], reference_study_id: "${st1}", expected_contract_version: "${c_v2}", revision_of_id: "${f_id}" }
              as: ConcessionerRateManager
