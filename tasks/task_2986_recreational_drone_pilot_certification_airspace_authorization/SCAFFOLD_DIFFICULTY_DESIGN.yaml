              as_user_id: "rev-07"
            - call: "POST /drone-ops/waivers/${wid}/decide"
              payload: { decision: "APPROVE", granted_ceiling_ft: 700 }
              as: WaiverApprover
              as_user_id: "app-07"
              captures: { final_state: $.data.status, valid_until: $.data.valid_until }
          assert:
            - "SafetyCase.${scid}.sail_level == 3 (ground_risk_class 2 + ARC_B index 1 + no BVLOS uplift)"
            - "${round_after_revision} == 1 and Waiver.${wid}.status == \"REVISION_REQUESTED\" at that point, with SafetyCase.${scid}.review_status == \"REVISION_REQUESTED\""
            - "the second submit returns the waiver to \"SUBMITTED\" and resets SafetyCase.${scid}.review_status to \"PENDING\" on the same row - still exactly one SafetyCase for this waiver"
            - "the second begin-review re-enters \"UNDER_REVIEW\"; revision_round stays 1 because entering review is not a revision"
            - "${final_state} == \"APPROVED\" and ${valid_until} == \"2027-02-01T00:00:00Z\" (2026-08-05T00:00:00Z + 180 days)"
            - "SafetyCase.${scid}.review_status == \"CLEARED\" with cleared_by_user_id == \"rev-07\", while Waiver.${wid}.approved_by_user_id == \"app-07\" - two different users, as the segregation rule at priority 4 requires"
            - "Waiver.${wid}.granted_ceiling_ft == 700"

