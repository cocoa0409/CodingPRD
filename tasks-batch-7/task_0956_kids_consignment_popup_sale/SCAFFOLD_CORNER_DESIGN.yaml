# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Scenario 956: Kids' Consignment Pop-Up Sale (JBF style)
scaffold_corner_design:

  - section: entities
    instances:
      - name: consignor_creation_assigns_code_and_defaults
        claim_type: creation
        grounds: [entities.Consignor.fields.consignor_code, entities.Consignor.fields.status, calculations.consignor_code_assignment]
        distinguishing_aspect: "Registration returns 201 with system fields: status ACTIVE, all counters 0, and consignor_code assigned by created_at order (C0001 then C0002)."
        test_recipe:
          setup: ["Event exists in DRAFT (clock at default 2026-05-01T00:00:00Z)."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Bob", email: "bob@x.com" }, as: Anonymous, captures: { c2: $.data.id } }
          assert:
            - "Consignor.${c1}.consignor_code == 'C0001' and Consignor.${c2}.consignor_code == 'C0002'"
            - "Both have status ACTIVE, sold_count 0, unsold_count 0, rejected_count 0, sold_gross_cents 0, version 1"

      - name: item_creation_computes_barcode_and_defaults
        claim_type: computed_fields
        grounds: [entities.Item.fields.barcode, entities.Item.fields.discount_eligible, entities.Item.fields.status, calculations.barcode_assignment]
        distinguishing_aspect: "Item creation computes barcode from consignor_code + per-consignor sequence and applies defaults (discount_eligible true, donate_flag false, status TAGGED); client cannot set barcode or status."
        test_recipe:
          setup: ["Event in DRAFT; consignor Ann registered."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Blocks", category: TOYS, price_cents: 500 }, as: Consignor, as_user_id: "${c_id}", captures: { it1: $.data.id, bc1: $.data.barcode } }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Doll", category: TOYS, price_cents: 700 }, as: Consignor, as_user_id: "${c_id}", captures: { it2: $.data.id, bc2: $.data.barcode } }
          assert:
            - "Item.${it1}.barcode == 'C0001-0001' and Item.${it2}.barcode == 'C0001-0002'"
            - "Both items: status TAGGED, discount_eligible true (default), donate_flag false (default), sale_event_id copied from consignor"

      - name: item_price_below_minimum_rejected
        claim_type: type_constraints
        grounds: [entities.Item.fields.price_cents, "errors[ERR_PRICE_BELOW_MINIMUM]", "validations[priority=8]"]
        distinguishing_aspect: "price_cents 199 is below the 200-cent floor -> 400 ERR_PRICE_BELOW_MINIMUM; 200 exactly would pass."
        test_recipe:
          setup: ["Event in DRAFT; consignor registered."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Cheap", category: TOYS, price_cents: 199 }, as: Consignor, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRICE_BELOW_MINIMUM, http status 400; no Item row created"

      - name: item_price_increment_violation_rejected
        claim_type: type_constraints
        grounds: [entities.Item.fields.price_cents, "errors[ERR_PRICE_INCREMENT_VIOLATION]", "validations[priority=8]"]
        distinguishing_aspect: "price_cents 225 passes the 200 floor but is not a multiple of 50 -> 400 ERR_PRICE_INCREMENT_VIOLATION (distinct error from the floor check)."
        test_recipe:
          setup: ["Event in DRAFT; consignor registered."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Odd", category: TOYS, price_cents: 225 }, as: Consignor, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRICE_INCREMENT_VIOLATION, http status 400"

      - name: get_missing_item_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ITEM_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent item UUID yields 404 ERR_ITEM_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer }
          trigger:
            - { call: "GET /items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: EventOrganizer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_NOT_FOUND, http status 404, response_type == 'error'"

      - name: markdown_rule_invalid_window_rejected
        claim_type: type_constraints
        grounds: [calculations.markdown_window_conflict, "errors[ERR_INVALID_TIME_WINDOW]", "validations[priority=7]"]
        distinguishing_aspect: "effective_from >= effective_to (degenerate window) -> ERR_INVALID_TIME_WINDOW before any overlap analysis runs."
        test_recipe:
          setup: ["Event in DRAFT."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /markdown-rules", payload: { sale_event_id: "${ev_id}", effective_from: "2026-06-06T00:00:00Z", effective_to: "2026-06-05T00:00:00Z", discount_pct: 50 }, as: EventOrganizer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TIME_WINDOW, http status 409"

  - section: state_machines
    instances:
      - name: item_drop_off_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Item.TAGGED_to_DROPPED_OFF, "errors[ERR_ITEM_WRONG_STATE]"]
        distinguishing_aspect: "Drop-off is not idempotent: a DROPPED_OFF item has no drop-off transition, so the second call fails with ERR_ITEM_WRONG_STATE and no duplicate side effects."
        test_recipe:
          setup: ["Event in INTAKE_OPEN; consignor checked-in; item already DROPPED_OFF."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Blocks", category: TOYS, price_cents: 500 }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id } }
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ITEM_WRONG_STATE, http status 409; Item.${item_id}.status remains DROPPED_OFF"

      - name: event_advance_skipping_phase_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SaleEvent, "errors[ERR_EVENT_PHASE_MISMATCH]"]
        distinguishing_aspect: "advance-phase accepts only the exact next phase; DRAFT -> INTAKE_CLOSED is rejected even though the clock satisfies intake_end."
        test_recipe:
          setup: ["Event in DRAFT; clock past intake_end."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
          trigger:
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_PHASE_MISMATCH, http status 409; phase remains DRAFT"

      - name: advance_to_presale_blocked_by_uninspected_items
        claim_type: precondition_enforcement
        grounds: [state_machines.SaleEvent.INTAKE_CLOSED_to_PRESALE_DAY, "errors[ERR_UNINSPECTED_ITEMS_REMAIN]"]
        distinguishing_aspect: "Guarded transition: the event cannot enter PRESALE_DAY while any Item is DROPPED_OFF; failing the one uninspected item unblocks the advance."
        test_recipe:
          setup: ["Event in INTAKE_CLOSED; one item DROPPED_OFF (inspected nowhere)."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Blocks", category: TOYS, price_cents: 500 }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id } }
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
          trigger:
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer, captures: { err: $.data.error_id } }
          assert:
            - "Advance with a DROPPED_OFF item present: error_id == ERR_UNINSPECTED_ITEMS_REMAIN (409); phase stays INTAKE_CLOSED"
            - "(The unblocked path — all items inspected, then advance succeeds — is exercised by every §1.8 instance that reaches PRESALE_DAY.)"

      - name: signup_check_out_without_check_in_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShiftSignup.CHECKED_IN_to_COMPLETED, "errors[ERR_SIGNUP_WRONG_STATE]"]
        distinguishing_aspect: "check-out requires CHECKED_IN; from SIGNED_UP it fails with ERR_SIGNUP_WRONG_STATE and credits no hours."
        test_recipe:
          setup: ["Event in DRAFT; volunteer signed up (SIGNED_UP) for a 4h shift."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Sam", email: "sam@x.com" }, as: Anonymous, captures: { v_id: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Floor", start_time: "2026-05-28T09:00:00Z", end_time: "2026-05-28T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { sh: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${sh}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { su: $.data.id } }
          trigger:
            - { call: "POST /shift-signups/${su}/check-out", payload: {}, as: EventOrganizer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SIGNUP_WRONG_STATE, http status 409; signup remains SIGNED_UP; Volunteer.completed_hours stays 0"

      - name: completed_transaction_second_checkout_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.POSTransaction.OPEN_to_COMPLETED, "errors[ERR_TRANSACTION_NOT_OPEN]"]
        distinguishing_aspect: "COMPLETED is terminal for checkout: a second checkout on the same transaction fails and does not double-count the sale in sold_gross_cents."
        test_recipe:
          setup: ["Event in SALE_ACTIVE; one item (1000) already sold via a COMPLETED transaction."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Blocks", category: TOYS, price_cents: 1000 }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id, bc: $.data.barcode } }
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Insp Ira", email: "ira@x.com" }, as: Anonymous, captures: { v_insp: $.data.id } }
            - { call: "POST /items/${item_id}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc}" }, as: Cashier }
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 1000 }, as: Cashier }
          trigger:
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 1000 }, as: Cashier, captures: { err: $.data.error_id } }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer }
          assert:
            - "error_id == ERR_TRANSACTION_NOT_OPEN, http status 409"
            - "SaleEvent.${ev_id}.sold_gross_cents == 1000 (no double count)"

      - name: settlement_dispute_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Settlement.FINALIZED_to_DISPUTED, "errors[ERR_SETTLEMENT_WRONG_STATE]"]
        distinguishing_aspect: "dispute requires FINALIZED; from DRAFT it fails with ERR_SETTLEMENT_WRONG_STATE — the cycle can only be entered after a finalize."
        test_recipe:
          setup: ["Event in SETTLEMENT; consignor with one REJECTED item has a DRAFT settlement (gross 0)."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
