          rationale: "Existence-before-field-domain precedence is asserted in the named difficulty instance."

      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers yields 400 ERR_MISSING_OR_INVALID_USER_CONTEXT before any other check."
