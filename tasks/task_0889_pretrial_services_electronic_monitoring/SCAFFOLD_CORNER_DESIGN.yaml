  - section: cross_cutting_complexity_layers
    instances:
      - name: ledger_balance_conservation_stub
        claim_type: derived_field_reconciliation
        grounds: [entities.Defendant.fields.balance_owed_cents]
        excluded_because:
          difficulty_instance: ledger_charge_reversal_conserves_balance
