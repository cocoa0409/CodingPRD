          Cyclic loop: REPORT_SUBMITTED -> QC_REVIEW -> REVISION_REQUESTED ->
          REPORT_SUBMITTED can repeat unboundedly (one full cycle per QC
          cycle_index). This entity's fulfillment_status also has a parallel
          payment_status dimension evolving independently. The cycle is
          entered/exited via different triggers and each iteration increments
          cycle_index, making path history observable.
