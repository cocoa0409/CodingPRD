  - section: validations
    instances:
      - name: cross_building_group_membership_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=7]', 'errors[ERR_CROSS_BUILDING_REFERENCE]']
        distinguishing_aspect: "An access group may only reference doors/persons of its own building; a foreign door id is rejected."
        test_recipe:
          setup: ["Buildings B1 and B2; B1 has M1 -> C1 and door D1; B2 has M2 -> C2"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "B1" }
              as: SecurityAdmin
              captures: { b1: $.data.id }
            - call: "POST /buildings"
              payload: { name: "B2" }
              as: SecurityAdmin
              captures: { b2: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b1}", level: "MASTER", label: "M1" }
              as: SecurityAdmin
              captures: { m1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b1}", parent_id: "${m1}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /doors"
              payload: { building_id: "${b1}", door_code: "D-1", key_node_id: "${c1}" }
              as: SecurityAdmin
              captures: { d1: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b2}", level: "MASTER", label: "M2" }
              as: SecurityAdmin
              captures: { m2: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b2}", parent_id: "${m2}", level: "CHANGE", label: "C2" }
              as: SecurityAdmin
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /access-groups"
              payload: { building_id: "${b2}", name: "BadGroup", door_ids: ["${d1}"], days_of_week: ["MON"], window_start_utc: "08:00", window_end_utc: "17:00" }
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CROSS_BUILDING_REFERENCE (http 422; D1 belongs to B1)"

      - name: vendor_issue_without_expiry_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=9]', 'errors[ERR_EXPIRY_REQUIRED_FOR_VENDOR]']
