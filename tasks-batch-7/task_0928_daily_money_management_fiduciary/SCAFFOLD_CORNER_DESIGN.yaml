      - name: corner_occ_stale_period_version_rejected_on_statement_line_disposition
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[statement-line-disposition-stale-period]
          - validations[priority=34]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Flagging the first line advances ReconciliationPeriod.version, so flagging the second line with the version read before that first disposition is refused with HTTP 412 and open_exception_count stays at 1."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one ACTIVE client with one account"
            - "one OPEN ReconciliationPeriod for 2026-06 with two imported StatementLines, both UNMATCHED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C061" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/reconciliation-periods"
              payload: { account_id: "${acct_id}", period_month: "2026-06" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { per_id: $.data.id }
            - call: "POST /dmm/reconciliation-periods/${per_id}/statement-lines"
              payload: { external_ref: "BK-0001", amount_cents: 100000, line_date: "2026-06-01", line_description: "Unidentified credit one" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { line_1: $.data.id }
            - call: "POST /dmm/reconciliation-periods/${per_id}/statement-lines"
              payload: { external_ref: "BK-0002", amount_cents: 200000, line_date: "2026-06-02", line_description: "Unidentified credit two" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { line_2: $.data.id }
            - call: "GET /dmm/reconciliation-periods/${per_id}"
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { per_v: $.data.version }
            - call: "POST /dmm/statement-lines/${line_1}/disposition"
              payload: { action: "FLAG_EXCEPTION", expected_period_version: "${per_v}", exception_note: "No matching ledger entry." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
          trigger:
            - call: "POST /dmm/statement-lines/${line_2}/disposition"
              payload: { action: "FLAG_EXCEPTION", expected_period_version: "${per_v}", exception_note: "Also unexplained." }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 412 with error_id ERR_STALE_VERSION"
            - "StatementLine.${line_1}.match_status == EXCEPTION"
            - "StatementLine.${line_2}.match_status == UNMATCHED"
            - "ReconciliationPeriod.${per_id}.open_exception_count == 1"

