        grounds: [calculations.compliance_posture_derivation]
        distinguishing_aspect: "When the academic year ends with an unmet requirement (0 completed of 2 required), the posture derives NON_COMPLIANT — the year-end branch, distinct from the MISSED/overdue AT_RISK branches."
