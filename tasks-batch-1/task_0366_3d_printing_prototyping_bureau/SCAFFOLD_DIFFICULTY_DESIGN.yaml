          trigger:
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "Response status 409 and data.error_id == ERR_MATERIAL_RETIRED (OrderLine create gated by Material.status)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- instance 1: Machine half-open intervals, no buffer (back-to-back OK) ----
      - name: machine_slot_half_open_back_to_back
        grounds:
          - validations[priority=9]
          - errors[ERR_MACHINE_SLOT_CONFLICT]
          - entities.PrintRun.fields.start_min
          - entities.PrintRun.fields.duration_min
        distinguishing_aspect: >
          Machine slot uses HALF-OPEN [start, start+dur): a run at [240,300)
          starting exactly when [100,240) ends is ACCEPTED (back-to-back), while a
          run at [239,260) overlapping by 1 minute is REJECTED — half-open, zero
          buffer, on the Machine resource.
        test_recipe:
          setup:
            - "Funded customer, confirmed order line A; one QUEUED run on machine M occupying [100,240)."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau O1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "o1@x.com", display_name: "O1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "A.stl", volume_cm3: 8.40, bbox_x_mm: 50, bbox_y_mm: 50, bbox_z_mm: 60, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileA: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileA}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileA}", material_id: "${mat}", layer_height_mm: 0.05, quantity: 3 }, as: Customer, as_user_id: "${cust}", captures: { lineA: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 100, duration_min: 140 }, as: Operator, captures: { runBase: $.data.id } }
          trigger:
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 240, duration_min: 60 }, as: Operator, captures: { run_ok: $.data.id, status_ok: $.data.status } }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 239, duration_min: 21 }, as: Operator, captures: { err: $.data.error_id } }
          assert:
            - "Back-to-back run [240,300) is created with status QUEUED (half-open: 240 not < 240)"
            - "Overlapping run [239,260) is rejected: status 409, data.error_id == ERR_MACHINE_SLOT_CONFLICT"

      # ---- instance 2: Post-process station closed intervals with cooldown buffer ----
      - name: station_closed_interval_cooldown_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_STATION_SLOT_CONFLICT]
          - entities.Bureau.fields.cooldown_buffer_min
          - entities.FinishingTask.fields.station_start_min
        distinguishing_aspect: >
          Post-process station uses CLOSED intervals + a 15-min cooldown buffer:
          a UV_CURE task at [475,500] after [400,460] has gap 15 (not > 15)
          REJECTED, while [476,500] has gap 16 (> 15) ACCEPTED — different
          interval semantics (closed + buffer) on the station resource (distinct
          from machine half-open zero-buffer).
        test_recipe:
          setup:
            - "Bureau cooldown_buffer_min 15; a printable line A on a confirmed order; one SCHEDULED UV_CURE FinishingTask occupying [400,460]."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau O2", cooldown_buffer_min: 15 }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "o2@x.com", display_name: "O2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "A.stl", volume_cm3: 8.40, bbox_x_mm: 50, bbox_y_mm: 50, bbox_z_mm: 60, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileA: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileA}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileA}", material_id: "${mat}", layer_height_mm: 0.05, quantity: 3 }, as: Customer, as_user_id: "${cust}", captures: { lineA: $.data.id } }
            - { call: "POST /bureaus/finishing-tasks", payload: { order_line_id: "${lineA}", kind: "UV_CURE", addon_cents: 300, station_start_min: 400, station_duration_min: 60 }, as: Operator, captures: { taskBase: $.data.id } }
            - { call: "POST /bureaus/finishing-tasks/${taskBase}/schedule", payload: {}, as: Operator }
            - { call: "POST /bureaus/finishing-tasks", payload: { order_line_id: "${lineA}", kind: "UV_CURE", addon_cents: 300, station_start_min: 475, station_duration_min: 25 }, as: Operator, captures: { taskClose: $.data.id } }
            - { call: "POST /bureaus/finishing-tasks", payload: { order_line_id: "${lineA}", kind: "UV_CURE", addon_cents: 300, station_start_min: 476, station_duration_min: 24 }, as: Operator, captures: { taskFar: $.data.id } }
          trigger:
            - { call: "POST /bureaus/finishing-tasks/${taskClose}/schedule", payload: {}, as: Operator, captures: { err_close: $.data.error_id } }
            - { call: "POST /bureaus/finishing-tasks/${taskFar}/schedule", payload: {}, as: Operator, captures: { status_far: $.data.status } }
          assert:
            - "Scheduling [475,500] (gap 15 from [400,460]) is rejected: status 409, data.error_id == ERR_STATION_SLOT_CONFLICT"
            - "Scheduling [476,500] (gap 16 > 15) succeeds: FinishingTask.${taskFar}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- instance 1: wallet/escrow ledger conservation across confirm+cancel ----
      - name: wallet_escrow_conservation_confirm_cancel
        grounds:
          - calculations.wallet_ledger
          - state_machines.Order.QUOTED_to_CONFIRMED
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.Customer.fields.lifetime_deposits_cents
        distinguishing_aspect: >
          Conserved quantity = customer money: lifetime_deposits_cents ==
          wallet_balance_cents + escrow_held_cents + captured_revenue_cents holds
          before confirm, after confirm (escrow), and after compensating cancel
          (refund) — the deposited 5000000 never drifts. (Money domain.)
        test_recipe:
          setup:
            - "Customer deposit 5000000; confirmed STANDARD order line B (grand 2928, escrow 2928); then order cancelled (CONFIRMED, no production started)."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau I1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "i1@x.com", display_name: "I1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin, captures: { life: $.data.lifetime_deposits_cents } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov_quoted: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov_quoted}" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /bureaus/customers/${cust}", payload: {}, as: BureauAdmin, captures: { w_mid: $.data.wallet_balance_cents, e_mid: $.data.escrow_held_cents, c_mid: $.data.captured_revenue_cents } }
            - { call: "POST /bureaus/orders/${ord}/cancel", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /bureaus/customers/${cust}", payload: {}, as: BureauAdmin, captures: { w_end: $.data.wallet_balance_cents, e_end: $.data.escrow_held_cents, c_end: $.data.captured_revenue_cents } }
          assert:
            - "After confirm: wallet 4997072 + escrow 2928 + captured 0 == 5000000 == lifetime_deposits_cents"
            - "After cancel: wallet 5000000 + escrow 0 + captured 0 == 5000000 == lifetime_deposits_cents (no drift)"

      # ---- instance 2: spool grams conservation across commit+cancel ----
      - name: spool_grams_conservation_commit_release
        grounds:
          - calculations.spool_conservation
          - state_machines.PrintRun.QUEUED_to_CANCELLED
          - entities.Spool.fields.grams_total
          - entities.Spool.fields.grams_remaining
        distinguishing_aspect: >
          Conserved quantity = spool material: grams_remaining + grams_committed +
          grams_consumed == grams_total (100) holds before a run commit (100/0/0),
          after commit of 4g (96/4/0), and after compensating cancel that releases
          the commit (100/0/0) — material mass, not money (distinct conserved type).
        test_recipe:
          setup:
            - "Funded customer; confirmed order line B; spool grams_total 100; one QUEUED PrintRun committing run_grams 4 (volume 4.0 * density 1.10 * qty 1)."
          setup_api_calls:
