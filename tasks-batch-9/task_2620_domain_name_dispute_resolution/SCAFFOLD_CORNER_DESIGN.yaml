          rationale: "That instance walks a no-load exit and a load-taking exit through the same counters and reconciles both against the junction rows, which is this calculation's correctness claim."

  - section: validations
    instances:
      - name: ground_sufficiency_at_priority_62_is_reported_before_completeness_at_priority_90
        claim_type: priority_ordering
        grounds:
          - validations[priority=62].ERR_GROUND_EVIDENCE_INSUFFICIENT
          - validations[priority=90].ERR_MISSING_REQUIRED_GROUND
          - endpoints.POST_/udrp/cases/{id}/compliance-clearance
        distinguishing_aspect: "A case that violates BOTH ground rules at once - two grounds only, one of them with evidence_count 0 - returns the sufficiency error at priority 62, while an otherwise identical case whose two grounds are both evidenced returns the completeness error at priority 90; the pair proves the ordering rather than either rule alone."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9025; domains sufx.example and sufy.example; complainant Suf Ltd (country_code GB); two FILED cases each with the 150000 filing fee paid so no fee rule interferes."
            - "Case X carries TRADEMARK_RIGHTS with evidence_count 2 and NO_LEGITIMATE_INTEREST with evidence_count 0 - two rules broken at once."
            - "Case Y carries TRADEMARK_RIGHTS with evidence_count 2 and NO_LEGITIMATE_INTEREST with evidence_count 1 - only the completeness rule is broken."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Suf Registrar", iana_id: "IANA-9025", contact_email: "abuse@sufreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
