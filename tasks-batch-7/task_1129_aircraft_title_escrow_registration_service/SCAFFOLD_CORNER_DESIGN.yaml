      - name: c_fee_minimum_floor_applies
        claim_type: constants_applied
        grounds: [calculations.escrow_fee_schedule]
        distinguishing_aspect: "Price 1000000 (raw tier1 = 3000) is lifted to MIN_FEE_CENTS 150000 by the max() floor; floor applies before surcharge/cap."
        test_recipe:
          setup: ["one low-price file"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N130MF", serial_number: "S-19", make_model: "Cessna 150", year: 1970 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 1000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
            - { call: "GET /api/escrow-files/${f}/statement", payload: {}, as: EscrowOfficer, captures: { fee: $.data.escrow_fee_cents } }
          trigger: []
          assert:
            - "statement.escrow_fee_cents == 150000 (MIN_FEE floor; raw tier would be 3000)"
            - "statement.buyer_amount_due_cents == 1150000"
      - name: c_fee_cap_applies
        claim_type: constants_applied
        grounds: [calculations.escrow_fee_schedule]
        distinguishing_aspect: "Price 3000000000 produces tier_sum 3250000 which is clamped to FEE_CAP_CENTS 2500000 by the outer min()."
        test_recipe:
          setup: ["one very-high-price file"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N131FC", serial_number: "S-20", make_model: "Gulfstream G650", year: 2022 }, as: EscrowOfficer, captures: { ac: $.data.id } }
