            - "the second trigger returns HTTP 201 with CutoverSlot.${slot_ok_id}.status == OPEN and booked_port_request_id == null"
            - "GET /voip/cutover-slots?carrier_id=${car_id} returns total_count 1"

      - name: porting_a_number_already_inside_a_live_request_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_ACTIVE_PORT_REQUEST_EXISTS
