            - "Call 7: proposed_days_in_office_delta 3 is one past the -2..2 ceiling"
            - "Call 8: limit 101 is one past the 1..100 ceiling, so the range rule also governs query parameters"
            - "GET /teams?policy_cycle_id=${cyc_id} still returns total_count 1, GET /neighborhoods?policy_cycle_id=${cyc_id} returns total_count 0 and GET /compliance-signals?attendance_week_id=${w37} returns total_count 0"

      - name: every_legal_boundary_value_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=30, ERR_INVALID_REQUEST]
          - calculations.team_seat_entitlement
        distinguishing_aspect: "The mirror image of the rejection sweep: each input is set to the exact extreme that is still legal - expected_days 0, buffer_seats == seat_count - 1, minutes_present 1440, requested_relief_days 5, delta -2, limit 100 - so an implementation that guards with >= instead of > fails here rather than on the rejection cases."
