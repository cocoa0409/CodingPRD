# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_3126
# §1.8 Test Targeting Index: 9 difficulty rules x >=2 instances (21 total)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: priority_score_provisional_vs_verified_diverge
        grounds:
          - calculations.stay_request_priority_score
          - entities.StayRequest.fields.provisional_score
          - entities.StayRequest.fields.verified_score
        distinguishing_aspect: |
          Dual-variant on the StayRequest domain: the same stay request yields
          provisional_score 100.00 from self-reported acuity HIGH but
          verified_score 85.00 once the hospital-attested acuity MODERATE is
          applied — same entity, same distance and nights, two valid variants,
          different numbers.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Hospital H; House HH serving H; Family F at 120 miles; PENDING referral with acuity MODERATE; StayRequest created while the referral is still PENDING, self_reported_acuity HIGH, expected_nights 15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 15, self_reported_acuity: "HIGH", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
          trigger:
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/stay-requests/${sr_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "StayRequest.${sr_id}.provisional_score == 100.00  (60 band * 1.5 HIGH + 20 * 15/30 = 100.00, capped at 100)"
            - "StayRequest.${sr_id}.verified_score == 85.00  (60 band * 1.25 MODERATE + 10 = 85.00)"
            - "StayRequest.${sr_id}.verification_status == VERIFICATION_OK"
            - "StayRequest.${sr_id}.provisional_score != StayRequest.${sr_id}.verified_score"

      - name: contribution_estimated_vs_settled_diverge
        grounds:
          - calculations.contribution_amount
          - entities.ContributionRequest.fields.requested_amount_cents
          - entities.ContributionRequest.fields.settled_amount_cents
        distinguishing_aspect: |
          Dual-variant on the ContributionRequest domain (different entity domain
          from priority scoring): the same request estimates 5030 cents over 10
          planned nights but settles to 3521 cents over 7 actual nights — same
          rate, same hardship tier, two valid variants, different totals.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z at check-in. Family F (120 mi) with VERIFIED referral; StayRequest accepted and checked into room R on 2026-09-02; ContributionRequest with nightly_rate_cents 1005, planned_nights 10, hardship_tier PARTIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 15, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/stay-requests/${sr_id}/check-in"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { stay_id: $.data.id }
            - call: "POST /api/stays/${stay_id}/contribution-requests"
              payload: { nightly_rate_cents: 1005, planned_nights: 10, hardship_tier: "PARTIAL" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/stays/${stay_id}/check-out"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/contribution-requests/${cr_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "ContributionRequest.${cr_id}.per_night_cents == 503  (round_half_up(1005 * 0.5) = 503)"
            - "ContributionRequest.${cr_id}.settled_amount_cents == 3521  (503 * 7 actual nights)"
            - "ContributionRequest.${cr_id}.requested_amount_cents == 3521  (re-anchored from the 5030 estimated value)"
            - "ContributionRequest.${cr_id}.status == FORGIVEN and forgiven_cents == 3521 and outstanding_cents == 0"
            - "Stay.${stay_id}.status == CHECKED_OUT and actual_check_out_date == \"2026-09-09\""

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_nested_min_max_and_tiers
        grounds:
          - calculations.stay_request_priority_score
        distinguishing_aspect: |
          Mode (a): a formula with 3+ inputs and non-linear interaction — tiered
          distance band times acuity multiplier plus a capped stay factor, all
          under an outer min(100, ...): 300 miles / CRITICAL / 40 nights hits both
          caps and lands exactly at 100.00, while 60 miles / LOW / 9 nights lands
          at 46.00 without touching either cap.
        test_recipe:
          setup:
            - "Logical clock default. Hospital, house, and two families: F1 at 300 miles expecting 40 nights self-reporting CRITICAL; F2 at 60 miles expecting 9 nights self-reporting LOW. Both referrals created already-VERIFIED so verified_score is set at request creation."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Far", primary_contact_name: "Fay Far", home_city: "Remote", distance_miles: 300, child_patient_name: "Kit Far" }
              as: ProgramAdmin
              captures: { fam1_id: $.data.id, fam1_v: $.data.version }
            - call: "POST /api/families"
              payload: { family_name: "Near", primary_contact_name: "Ned Near", home_city: "Closeville", distance_miles: 60, child_patient_name: "Amy Near" }
              as: ProgramAdmin
              captures: { fam2_id: $.data.id, fam2_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam1_id}", hospital_id: "${hosp_id}", treating_unit: "ICU", care_type: "INPATIENT", acuity_level: "CRITICAL", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam2_id}", hospital_id: "${hosp_id}", treating_unit: "Clinic", care_type: "OUTPATIENT", acuity_level: "LOW", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /api/referrals/${ref1_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/referrals/${ref2_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam1_id}", house_id: "${house_id}", referral_id: "${ref1_id}", expected_nights: 40, self_reported_acuity: "CRITICAL", expected_family_version: "${fam1_v}" }
              as: FamilyContact
              as_user_id: "${fam1_id}"
              captures: { sr1_id: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam2_id}", house_id: "${house_id}", referral_id: "${ref2_id}", expected_nights: 9, self_reported_acuity: "LOW", expected_family_version: "${fam2_v}" }
              as: FamilyContact
              as_user_id: "${fam2_id}"
              captures: { sr2_id: $.data.id }
          trigger:
            - call: "GET /api/stay-requests/${sr1_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/stay-requests/${sr2_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "StayRequest.${sr1_id}.verified_score == 100.00  (raw 80*2.0 + 20*min(30,40)/30 = 180.00, capped by outer min to 100.00)"
            - "StayRequest.${sr2_id}.verified_score == 46.00  (40*1.0 + 20*9/30 = 46.00, no cap engaged)"

      - name: contribution_per_night_rounding_order_pinned
        grounds:
          - calculations.contribution_amount
          - entities.ContributionRequest.fields.per_night_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round per night then
          multiply gives 503 * 7 = 3521 cents; multiply then round would give
          round_half_up(1005 * 0.5 * 7) = 3518. The scaffold pins round-per-night-
          first, and the 3-cent gap is observable in settled_amount_cents.
        test_recipe:
          setup:
            - "Checked-in stay (check-in 2026-09-02) with a ContributionRequest nightly_rate_cents 1005, planned_nights 10, PARTIAL; check-out on 2026-09-09 (7 actual nights)."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 15, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/stay-requests/${sr_id}/respond"
              payload: { decision: "ACCEPT", expected_stay_request_version: "${sr_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/stay-requests/${sr_id}/check-in"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { stay_id: $.data.id }
            - call: "POST /api/stays/${stay_id}/contribution-requests"
              payload: { nightly_rate_cents: 1005, planned_nights: 10, hardship_tier: "PARTIAL" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/stays/${stay_id}/check-out"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/contribution-requests/${cr_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "ContributionRequest.${cr_id}.per_night_cents == 503"
            - "ContributionRequest.${cr_id}.settled_amount_cents == 3521  (503*7; NOT 3518 which the multiply-then-round order would yield)"

      - name: assignment_sweep_expire_before_promote_evaluation_order
        grounds:
          - calculations.assignment_capacity_snapshot
          - endpoints.POST_/api/houses/{id}/run-assignment-sweep
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency made explicit — the room freed
          by expiring an offer in step 1 is exactly the room the promotion in
          step 4 fills; the snapshot is taken after expiry, so the promoted
          request lands in the just-freed room, which a promote-before-expire
          order could never do.
        test_recipe:
          setup:
            - "House with exactly one room R (AVAILABLE). Request X is OFFERED holding R with offer_expires_at in the past. Request Y is WAITLISTED/VERIFICATION_OK with verified_score 90.00. Logical clock advanced past X's offer expiry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Exton", primary_contact_name: "Ed Exton", home_city: "Riverton", distance_miles: 120, child_patient_name: "Sam Exton" }
              as: ProgramAdmin
              captures: { famx_id: $.data.id, famx_v: $.data.version }
            - call: "POST /api/families"
              payload: { family_name: "York", primary_contact_name: "Yara York", home_city: "Hilltown", distance_miles: 150, child_patient_name: "Tess York" }
              as: ProgramAdmin
              captures: { famy_id: $.data.id, famy_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${famx_id}", hospital_id: "${hosp_id}", treating_unit: "Ward A", care_type: "INPATIENT", acuity_level: "LOW", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { refx_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${famy_id}", hospital_id: "${hosp_id}", treating_unit: "Ward B", care_type: "INPATIENT", acuity_level: "CRITICAL", attending_clinician: "Dr. Rao" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { refy_id: $.data.id }
            - call: "POST /api/referrals/${refx_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/referrals/${refy_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${famx_id}", house_id: "${house_id}", referral_id: "${refx_id}", expected_nights: 5, self_reported_acuity: "LOW", expected_family_version: "${famx_v}" }
              as: FamilyContact
              as_user_id: "${famx_id}"
              captures: { srx_id: $.data.id }
            - call: "POST /api/stay-requests/${srx_id}/offer"
              payload: { room_id: "${room_id}" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${famy_id}", house_id: "${house_id}", referral_id: "${refy_id}", expected_nights: 30, self_reported_acuity: "CRITICAL", expected_family_version: "${famy_v}" }
              as: FamilyContact
              as_user_id: "${famy_id}"
              captures: { sry_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/houses/${house_id}/run-assignment-sweep"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
              captures: { promoted: $.data.promoted_request_ids, expired: $.data.expired_offer_ids }
          assert:
            - "sweep response expired_offer_ids contains ${srx_id}  (offer from 2026-09-01 expired after 48h)"
            - "sweep response promoted_request_ids == [\"${sry_id}\"]  (Y promoted into the room X just freed)"
            - "StayRequest.${sry_id}.verified_score == 100.00  (150 mi band 60 * CRITICAL 2.0 + 20 * min(30,30)/30 = 140.00, capped to 100.00)"
            - "StayRequest.${sry_id}.assignment_status == OFFERED and offered_room_id == ${room_id}"
            - "StayRequest.${srx_id}.assignment_status == WAITLISTED and offered_room_id is null"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: stay_request_offer_decline_rewaitlists_cycle
        grounds:
          - state_machines.StayRequest.OFFERED_to_WAITLISTED
        distinguishing_aspect: |
          StayRequest carries a cycle: WAITLISTED -> OFFERED -> WAITLISTED on
          DECLINE, and the second waitlisting refreshes waitlisted_since, so the
          entity demonstrably loops rather than terminating.
        test_recipe:
          setup:
            - "House with rooms R1 and R2 both AVAILABLE. Family F with VERIFIED referral; request WAITLISTED then OFFERED holding R1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
              payload: { room_number: "101", bed_count: 2, occupancy_limit: 2 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { room1_id: $.data.id }
            - call: "POST /api/families"
              payload: { family_name: "Alvarez", primary_contact_name: "Maria Alvarez", home_city: "Riverton", distance_miles: 120, child_patient_name: "Nico Alvarez" }
              as: ProgramAdmin
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /api/referrals/${ref_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/stay-requests"
              payload: { family_id: "${fam_id}", house_id: "${house_id}", referral_id: "${ref_id}", expected_nights: 15, self_reported_acuity: "MODERATE", expected_family_version: "${fam_v}" }
              as: FamilyContact
              as_user_id: "${fam_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /api/stay-requests/${sr_id}/offer"
              payload: { room_id: "${room1_id}" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { sr_v: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
