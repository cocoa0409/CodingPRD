scaffold_difficulty_design:

  # =====================================================================
  # Rule 1: Dual-variant calculations across DIFFERENT entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: line_item_price_list_vs_reorder_locked_on_paper_price_change
        grounds:
          - calculations.line_item_price_cents
          - calculations.line_item_price_cents.variants.list_price
          - calculations.line_item_price_cents.variants.reorder_locked
          - entities.LineItem.fields.captured_base_price_cents
          - entities.Order.fields.prior_order_id
        distinguishing_aspect: |
          Entity domain = Order-fiscal (LineItem pricing on an Order). Same {paper_stock, finish, quantity}
          triple resolves to two different line_price_cents values: the list-price variant re-reads live
          PaperStock.base_price_cents (800 → line = 82000); the reorder-locked variant uses the prior order's
          captured_base_price_cents (500 → line = 55000). Delta 27000 cents observed on a single field.
        test_recipe:
          setup:
            - "Customer C1 exists; Design D1 references PaperStock P1 (base=500) + FinishOption F1 (surcharge=100) + EventPackage WEDDING (min_qty=50)."
            - "Order O1 has been delivered with a LineItem (paper=P1, finish=F1, quantity=100). Its captured_base=500, captured_finish=100."
            - "After O1 delivered, PaperStock P1.base_price_cents was raised to 800 via a new PaperStock (P1 kept, but a new variant with same finish existed) — for simplicity, we test both variants against the SAME (paper, finish) reference by rebuilding the catalog and letting the reorder-locked variant capture from prior line."
            - "Clock at 2026-05-01 (within 365 days of O1.created_at 2026-03-15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", phone: "555" }
              as: ShopAdmin
              captures: { c1_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "Ivory Cotton 220gsm", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "Gold Foil", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f1_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wedding Suite Std", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_wed_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "Ada Ink", active: true }
              as: ShopAdmin
              captures: { des1_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c1_id}", event_package_id: "${pkg_wed_id}", paper_stock_id: "${p1_id}", finish_option_id: "${f1_id}" }
              as: Customer
              captures: { d1_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c1_id}", design_id: "${d1_id}" }
              as: Customer
              captures: { o1_id: "$.data.id", o1_v0: "$.data.version" }
            - call: "POST /orders/${o1_id}/line-items"
              payload: { paper_stock_id: "${p1_id}", finish_option_id: "${f1_id}", quantity: 100, expected_order_version: "${o1_v0}" }
              as: Customer
              captures: { li1_id: "$.data.id" }
            - call: "POST /orders/${o1_id}/confirm"
              payload: {}
              as: Customer
              captures: { o1_deposit_due: "$.data.deposit_due_cents" }
            - call: "POST /_payments/simulate"
              payload: { order_id: "${o1_id}", amount_cents: 27500, outcome: "SUCCEEDED" }
              as: ShopAdmin
            - call: "POST /designs/${d1_id}/proofs"
              payload: { designer_id: "${des1_id}" }
              as: Designer
              captures: { pr1_id: "$.data.id" }
            - call: "POST /proofs/${pr1_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /proofs/${pr1_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c1_id}"
            - call: "GET /orders/${o1_id}/work-orders"
              payload: {}
              as: ShopAdmin
              captures: { wo1_id: "$.data[0].id" }
            - call: "POST /work-orders/${wo1_id}/production"
              payload: { new_status: "PRINTING", press_id: "PRESS_A", press_slot_start: "2026-03-20T09:00:00Z", press_slot_end: "2026-03-20T13:00:00Z" }
              as: ShopAdmin
            - call: "POST /work-orders/${wo1_id}/production"
              payload: { new_status: "FINISHING" }
              as: ShopAdmin
            - call: "POST /work-orders/${wo1_id}/production"
              payload: { new_status: "COMPLETED" }
              as: ShopAdmin
            - call: "GET /orders/${o1_id}/shipments"
              payload: {}
              as: ShopAdmin
              captures: { sh1_id: "$.data[0].id" }
            - call: "POST /shipments/${sh1_id}/dispatch"
              payload: {}
              as: ShopAdmin
            - call: "POST /shipments/${sh1_id}/mark-delivered"
              payload: {}
              as: ShopAdmin
            # Now bump paper price from 500 to 800 and place a REORDER
            - call: "PATCH /paper-stocks/${p1_id}"
              payload: { base_price_cents: 800 }
              as: ShopAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /designs"
              payload: { customer_id: "${c1_id}", event_package_id: "${pkg_wed_id}", paper_stock_id: "${p1_id}", finish_option_id: "${f1_id}" }
              as: Customer
              captures: { d2_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c1_id}", design_id: "${d2_id}", prior_order_id: "${o1_id}" }
              as: Customer
              captures: { o2_id: "$.data.id", o2_v0: "$.data.version" }
            - call: "POST /orders/${o2_id}/line-items"
              payload: { paper_stock_id: "${p1_id}", finish_option_id: "${f1_id}", quantity: 100, expected_order_version: "${o2_v0}" }
              as: Customer
              captures: { li2_price: "$.data.line_price_cents" }
          assert:
            - "LineItem.${li2_price} == 55000                # reorder_locked variant: 500*100*0.9 + 100*100 (uses O1's captured_base=500)"
            - "list_price variant would have produced 82000  # 800*100*0.9 + 100*100 — divergence of 27000 cents on the SAME (paper, finish, quantity) tuple"
            - "Order.${o2_id}.subtotal_cents == 55000"
            - "Order.${o2_id}.reorder_discount_cents == 5500  # 10% of 55000"

      - name: proof_expires_at_standard_vs_rush_variant_on_lifecycle_entity
        grounds:
          - calculations.proof_expires_at
          - calculations.proof_expires_at.variants.standard_expiry
          - calculations.proof_expires_at.variants.rush_expiry
          - entities.Proof.fields.expires_at
          - entities.Order.fields.rush_requested
          - state_machines.Proof.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity domain = Proof (lifecycle/temporal), DIFFERENT from line_item_price_cents (fiscal on Order).
          Same {pkg.proof_expiry_days=14, submitted_at=2026-06-15T00:00:00Z} produces two different expires_at
          values: standard_expiry = 2026-06-29T00:00:00Z; rush_expiry = 2026-06-22T00:00:00Z (7 days = ceil(14/2)).
        test_recipe:
          setup:
            - "Customer C2, Designer D2, WEDDING package (proof_expiry_days=14), Design D2, Order O2 confirmed with apply-rush toggled ON (deadline 10 days out)."
            - "Clock at 2026-06-15T00:00:00Z when the first proof is submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", phone: "555" }
              as: ShopAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "Recycled Kraft", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "Matte", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f2_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wedding Std", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg2_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "Bo Brush", active: true }
              as: ShopAdmin
              captures: { des2_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c2_id}", event_package_id: "${pkg2_id}", paper_stock_id: "${p2_id}", finish_option_id: "${f2_id}" }
              as: Customer
              captures: { d2_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c2_id}", design_id: "${d2_id}" }
              as: Customer
              captures: { o2_id: "$.data.id", o2_v0: "$.data.version" }
            - call: "POST /orders/${o2_id}/line-items"
              payload: { paper_stock_id: "${p2_id}", finish_option_id: "${f2_id}", quantity: 150, expected_order_version: "${o2_v0}" }
              as: Customer
            - call: "POST /orders/${o2_id}/apply-rush"
              payload: { rush_deadline: "2026-06-08T00:00:00Z" }
              as: Customer
              as_user_id: "${c2_id}"
            - call: "POST /orders/${o2_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c2_id}"
            - call: "POST /designs/${d2_id}/proofs"
              payload: { designer_id: "${des2_id}" }
              as: Designer
              captures: { pr2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /proofs/${pr2_id}/submit"
              payload: {}
              as: Designer
              captures: { pr2_expires_at: "$.data.expires_at" }
          assert:
            - "Proof.${pr2_id}.expires_at == \"2026-06-22T00:00:00.000Z\"  # rush variant: 2026-06-15 + ceil(14/2)=7 days"
            - "The standard variant on an identical order without apply-rush would return 2026-06-29T00:00:00.000Z (delta 7 days)"

  # =====================================================================
  # Rule 2: Combinatorial formulas — mode (a) and mode (b)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: line_item_tiered_pricing_three_input_branch_mode_a
        grounds:
          - calculations.line_item_price_cents
          - calculations.line_item_price_cents.constants.QUANTITY_TIERS
          - entities.LineItem.fields.line_price_cents
        distinguishing_aspect: |
          Mode (a): 3+ inputs (captured_base, captured_finish, quantity) with non-linear branch on quantity.
          For qty=150 the tier_multiplier=0.90; the branch selection is a conditional over the quantity range.
          A change from qty=99 to qty=100 crosses the tier boundary and the multiplier drops from 1.00 to 0.90.
        test_recipe:
          setup:
            - "Customer C3, catalog fresh, WEDDING package (min_qty=50), Order O3 in CART with paper P3 (base=500) + finish F3 (surcharge=100)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three", phone: "555" }
              as: ShopAdmin
              captures: { c3_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "Cotton A", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p3_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "Foil A", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f3_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wedding Std", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg3_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c3_id}", event_package_id: "${pkg3_id}", paper_stock_id: "${p3_id}", finish_option_id: "${f3_id}" }
              as: Customer
              captures: { d3_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c3_id}", design_id: "${d3_id}" }
              as: Customer
              captures: { o3_id: "$.data.id", o3_v0: "$.data.version" }
          trigger:
            - call: "POST /orders/${o3_id}/line-items"
              payload: { paper_stock_id: "${p3_id}", finish_option_id: "${f3_id}", quantity: 150, expected_order_version: "${o3_v0}" }
              as: Customer
              captures: { li3_price: "$.data.line_price_cents" }
          assert:
            - "LineItem.${li3_price} == 82500  # 500*150*0.9 + 100*150 = 67500 + 15000"

      - name: order_subtotal_per_line_then_sum_rounding_order_mode_b
        grounds:
          - calculations.order_subtotal_cents
          - calculations.line_item_price_cents
          - entities.Order.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned to 'per-line round_half_up then sum'. With base=333 cents,
          quantity=100, tier=0.90 → paper_component_raw = 333*100*0.9 = 29970.0 (already integer) →
          finish=100 → line = 29970 + 10000 = 39970. Two lines that both round separately produce a subtotal
          that DIFFERS from 'sum then round' when a fractional cent would appear — pin ensures deterministic answer.
        test_recipe:
          setup:
            - "Customer C4, WEDDING package (min_qty=50), Paper (base=333, lead=7), Finish (surcharge=100, +5 days). Order O4 has TWO line items each qty=100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four", phone: "555" }
              as: ShopAdmin
              captures: { c4_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "Odd 333", base_price_cents: 333, lead_days: 7 }
              as: ShopAdmin
              captures: { p4_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "F4", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f4_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wedding Std", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg4_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c4_id}", event_package_id: "${pkg4_id}", paper_stock_id: "${p4_id}", finish_option_id: "${f4_id}" }
              as: Customer
              captures: { d4_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c4_id}", design_id: "${d4_id}" }
              as: Customer
              captures: { o4_id: "$.data.id", o4_v0: "$.data.version" }
            - call: "POST /orders/${o4_id}/line-items"
              payload: { paper_stock_id: "${p4_id}", finish_option_id: "${f4_id}", quantity: 100, expected_order_version: "${o4_v0}" }
              as: Customer
              captures: { o4_v1: "$.data.version" }
          trigger:
            - call: "POST /orders/${o4_id}/line-items"
              payload: { paper_stock_id: "${p4_id}", finish_option_id: "${f4_id}", quantity: 100, expected_order_version: "${o4_v1}" }
              as: Customer
              captures: { li4b_price: "$.data.line_price_cents" }
            - call: "GET /orders/${o4_id}"
              payload: {}
              as: Customer
              as_user_id: "${c4_id}"
              captures: { o4_subtotal: "$.data.subtotal_cents" }
          assert:
            - "LineItem.${li4b_price} == 39970  # per-line rounding: round_half_up(333*100*0.9) + 100*100 = 29970 + 10000"
            - "Order.${o4_id}.subtotal_cents == 79940  # 2 lines × 39970; per-line-then-sum ordering pinned"

  # =====================================================================
  # Rule 3: Non-linear state machines on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: proof_cycle_changes_requested_back_to_submitted
        grounds:
          - state_machines.Proof.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.Proof.CHANGES_REQUESTED_to_SUBMITTED
          - entities.Proof.fields.current_revision_number
          - entities.Proof.fields.revision_fee_cents
        distinguishing_aspect: |
          Non-linear shape = CYCLE. Proof.SUBMITTED → CHANGES_REQUESTED → SUBMITTED is a permitted loop.
          Each traversal increments current_revision_number and, after revision #3, accrues a $25 revision fee.
          A pure-linear pipeline would forbid CHANGES_REQUESTED → SUBMITTED.
        test_recipe:
          setup:
            - "Customer C5, WEDDING package, confirmed Order O5, Proof PR5 currently in SUBMITTED (revision 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five", phone: "555" }
              as: ShopAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "P5", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p5_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "F5", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f5_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wedding Std", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg5_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "D5", active: true }
              as: ShopAdmin
              captures: { des5_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c5_id}", event_package_id: "${pkg5_id}", paper_stock_id: "${p5_id}", finish_option_id: "${f5_id}" }
              as: Customer
              captures: { d5_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c5_id}", design_id: "${d5_id}" }
              as: Customer
              captures: { o5_id: "$.data.id", o5_v0: "$.data.version" }
            - call: "POST /orders/${o5_id}/line-items"
              payload: { paper_stock_id: "${p5_id}", finish_option_id: "${f5_id}", quantity: 150, expected_order_version: "${o5_v0}" }
              as: Customer
            - call: "POST /orders/${o5_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c5_id}"
            - call: "POST /designs/${d5_id}/proofs"
              payload: { designer_id: "${des5_id}" }
              as: Designer
              captures: { pr5_id: "$.data.id" }
            - call: "POST /proofs/${pr5_id}/submit"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /proofs/${pr5_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${c5_id}"
            - call: "POST /proofs/${pr5_id}/submit"
              payload: {}
              as: Designer
              captures: { pr5_v2: "$.data.current_revision_number" }
          assert:
            - "Proof.${pr5_id}.status == \"SUBMITTED\"  # back in SUBMITTED after the cycle"
            - "Proof.${pr5_id}.current_revision_number == 2"
            - "Proof.${pr5_id}.revision_fee_cents == 0  # first 3 revisions free"

      - name: work_order_parallel_state_dimensions_production_and_addressing
        grounds:
          - state_machines.WorkOrder
          - entities.WorkOrder.fields.production_status
          - entities.WorkOrder.fields.addressing_status
        distinguishing_aspect: |
          Non-linear shape = PARALLEL DIMENSIONS on the WorkOrder entity — production_status and
          addressing_status evolve INDEPENDENTLY on the same row (production may reach FINISHING while
          addressing_status is still PENDING). Different entity from Proof's cycle — the two non-linear
          shapes belong to different entities as §0.5 requires.
        test_recipe:
          setup:
            - "Order O6 has been confirmed WITH an AddressingJob, proof approved, deposit paid, WorkOrder WO6 auto-created (production=NOT_STARTED, addressing=PENDING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six", phone: "555" }
              as: ShopAdmin
              captures: { c6_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "P6", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p6_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "F6", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f6_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wedding Std", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg6_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "D6", active: true }
              as: ShopAdmin
              captures: { des6_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c6_id}", event_package_id: "${pkg6_id}", paper_stock_id: "${p6_id}", finish_option_id: "${f6_id}" }
              as: Customer
              captures: { d6_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c6_id}", design_id: "${d6_id}" }
              as: Customer
              captures: { o6_id: "$.data.id", o6_v0: "$.data.version" }
            - call: "POST /orders/${o6_id}/line-items"
              payload: { paper_stock_id: "${p6_id}", finish_option_id: "${f6_id}", quantity: 150, expected_order_version: "${o6_v0}" }
              as: Customer
            - call: "POST /orders/${o6_id}/addressing-jobs"
              payload: { job_type: "ADDRESSING", quantity: 150, scheduled_date: "2026-04-20", unit_price_cents: 200 }
              as: Customer
              as_user_id: "${c6_id}"
            - call: "POST /orders/${o6_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c6_id}"
