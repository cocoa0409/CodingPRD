      - name: chargeback_h2o2_two_trays_value
        claim_type: correct_result
        grounds:
          - "calculations.load_reprocessing_chargeback"
        distinguishing_aspect: "LOW_TEMP_H2O2 multiplier 1.7625: two trays yield 2 x round_half_up(1762.5) = 3526, observably different from the naive sum-then-round 3525 — complements the PREVAC §1.8 instance on a second multiplier."
