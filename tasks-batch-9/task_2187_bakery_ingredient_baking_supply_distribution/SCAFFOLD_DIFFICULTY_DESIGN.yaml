      - name: overlap_silo_fill_windows_closed_interval_touching_endpoint_collides
        grounds:
          - validations[priority=20]
          - entities.SiloAsset.fields.last_fill_window_start_at
          - entities.SiloAsset.fields.last_fill_window_end_at
          - calculations.bulk_silo_fill_plan
          - errors[ERR_SILO_FILL_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A different resource (SiloAsset) with DELIBERATELY OPPOSITE adjacency semantics to the
          route rule: the fill window is a CLOSED interval [08:00, 10:00] with NO buffer, so a
          second BULK stop window of 10:00-12:00 - which the route rule would treat as
          non-overlapping - collides on the shared endpoint instant and must return
          ERR_SILO_FILL_WINDOW_CONFLICT / 409, while 10:00:01-12:00 (one second later, zero buffer
          required) is accepted. Route-style buffer logic applied here would wrongly reject the
          second case as well.
