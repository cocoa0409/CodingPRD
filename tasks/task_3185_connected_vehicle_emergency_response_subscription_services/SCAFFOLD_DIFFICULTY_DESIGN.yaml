# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3185_connected_vehicle_emergency_response_subscription_services
# Two instances per §0.5 rule; every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: crash_severity_sensor_reported_vs_delta_v_only
        grounds:
          - calculations.crash_severity
          - entities.CrashEvent.fields.severity_score
          - entities.CrashEvent.fields.severity_band
        distinguishing_aspect: |
          Same crash inputs except the sensor flags: the sensor_reported variant
          (airbag deployed) adds exactly 25 points over the delta_v_only variant
          for identical delta_v — 60.0 SEVERE vs 35.0 MODERATE — so one event is
          dispatch-eligible SEVERE while the other sits at the MODERATE floor.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default). Tier SAFETY (allows_emergency true, fee 2000), coverage zone TX with cellular, account A1 with gen-5 vehicle V1 in TX, subscription TRIAL."
          setup_api_calls:
            - &t_safety
              call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - &z_tx
              call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - &acct_a1
              call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - &veh_v1
              call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - &sub_s1
              call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
          trigger:
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 58.4, rollover_detected: false, airbag_deployed: true, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_hi: $.data.id }
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 58.4, rollover_detected: false, airbag_deployed: false, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_lo: $.data.id }
          assert:
            - "CrashEvent.${ce_hi}.severity_score == 60.0 and severity_band == SEVERE"
            - "CrashEvent.${ce_lo}.severity_score == 35.0 and severity_band == MODERATE"
            - "both events persist with status == RECEIVED (identical delta_v, flags diverge the score by exactly 25.0)"

      - name: conversion_fee_early_bird_vs_late_conversion
        grounds:
          - calculations.conversion_fee
          - entities.Subscription.fields.conversion_fee_paid_cents
          - entities.Subscription.fields.trial_end_date
        distinguishing_aspect: |
          The conversion_fee variants operate on the Subscription/billing domain
          (not crash scoring): identical tier (SAFETY_REMOTE, 4000 cents), but
          early_bird conversion on day 2 pays 0 while late_conversion on day 31
          pays 800 — the variant is selected purely by clock vs trial_end_date.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01. Tier SAFETY_REMOTE (4000 cents, remote commands allowed). Account A2 with vehicle V2, subscription S2 TRIAL started 2026-09-01 (trial_end 2026-10-01). A second account A3/Vehicle V3/Subscription S3 identical, converted late."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY_REMOTE", monthly_fee_cents: 4000, allows_emergency: true, allows_remote_commands: true, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - *z_tx
            - call: "POST /accounts"
              payload: { full_name: "Ben Barnes", email: "ben@example.com", phone: "+15125550102", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a2: $.data.id }
            - call: "POST /accounts/${acct_a2}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000002", make: "Chevrolet", model: "Equinox", model_year: 2021, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a2}"
              captures: { veh_v2: $.data.id }
            - call: "POST /accounts/${acct_a2}/subscriptions"
              payload: { vehicle_id: "${veh_v2}", tier_code: "SAFETY_REMOTE" }
              as: Account
              as_user_id: "${acct_a2}"
              captures: { sub_s2: $.data.id, sub_s2_v: $.data.version }
            - call: "POST /accounts"
              payload: { full_name: "Cara Cortez", email: "cara@example.com", phone: "+15125550103", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a3: $.data.id }
            - call: "POST /accounts/${acct_a3}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000003", make: "GMC", model: "Terrain", model_year: 2022, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a3}"
              captures: { veh_v3: $.data.id }
            - call: "POST /accounts/${acct_a3}/subscriptions"
              payload: { vehicle_id: "${veh_v3}", tier_code: "SAFETY_REMOTE" }
              as: Account
              as_user_id: "${acct_a3}"
              captures: { sub_s3: $.data.id, sub_s3_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_a2}/subscriptions/${sub_s2}/convert"
              payload: { expected_subscription_version: "${sub_s2_v}" }
              as: Account
              as_user_id: "${acct_a2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts/${acct_a3}/subscriptions/${sub_s3}/convert"
              payload: { expected_subscription_version: "${sub_s3_v}" }
              as: Account
              as_user_id: "${acct_a3}"
          assert:
            - "Subscription.${sub_s2}.status == ACTIVE and conversion_fee_paid_cents == 0 (early_bird variant)"
            - "Subscription.${sub_s3}.status == ACTIVE and conversion_fee_paid_cents == 800 (late_conversion: 20% of 4000)"
            - "same tier, same formula, different variant selected by clock position relative to trial_end_date"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: health_score_integer_division_and_clamp_order
        grounds:
          - calculations.health_score
          - entities.DiagnosticReport.fields.health_score
        distinguishing_aspect: |
          Mode (a) — non-linear interaction of >=3 inputs: 100 - 8*len(dtc) -
          ((100 - oil_life_pct) // 5) with integer division applied BEFORE the
          max(0, min(100, ...)) clamp; oil_life 96 (4% wear) costs 0 points
          while 95 costs 1, proving truncation order is pinned.
        test_recipe:
          setup:
            - "Default clock 2026-09-01. Zone TX, account A1, vehicle V1, TRIAL subscription exist (shared fixture chain)."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - *sub_s1
          trigger:
            - call: "POST /vehicles/${veh_v1}/diagnostic-reports"
              payload: { odometer_km: 10000, engine_hours: 400, dtc_codes: ["P0300", "P0420", "B0012"], oil_life_pct: 96 }
              as: SystemIngestion
              captures: { dr_a: $.data.id }
            - call: "POST /vehicles/${veh_v1}/diagnostic-reports"
              payload: { odometer_km: 10050, engine_hours: 402, dtc_codes: ["P0300", "P0420", "B0012"], oil_life_pct: 95 }
              as: SystemIngestion
              captures: { dr_b: $.data.id }
          assert:
            - "DiagnosticReport.${dr_a}.health_score == 76 (100 - 24 - 0: 4% oil wear truncates to 0)"
            - "DiagnosticReport.${dr_b}.health_score == 75 (100 - 24 - 1: 5% oil wear truncates to 1)"
            - "a one-point oil_life change across the integer-division boundary moves the score — truncation precedes clamping"

      - name: insurance_score_evaluation_order_with_empty_set_baseline
        grounds:
          - calculations.insurance_score
          - entities.DataConsent.fields.effective_score
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          effective_score aggregates reports collected under
          DRIVING_DATA_COLLECTION yet lives on the INSURANCE_PROGRAM_SHARING
          consent; reports-first order yields 77.50 from reports {75, 80},
          while the empty-set account deterministically yields the 50.00
          baseline rather than a division error.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Zone TX. Account A4 with vehicle V4 and two diagnostic reports (health 75 and 80). Account A5 with vehicle V5 and zero reports. Both accounts hold a GRANTED DRIVING_DATA_COLLECTION consent."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - call: "POST /accounts"
              payload: { full_name: "Dee Dawson", email: "dee@example.com", phone: "+15125550104", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a4: $.data.id }
            - call: "POST /accounts/${acct_a4}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000004", make: "Buick", model: "Encore", model_year: 2021, region_code: "TX", hardware_generation: 4 }
              as: Account
              as_user_id: "${acct_a4}"
              captures: { veh_v4: $.data.id }
            - call: "POST /vehicles/${veh_v4}/diagnostic-reports"
              payload: { odometer_km: 5000, engine_hours: 200, dtc_codes: ["P0300", "P0420", "B0012"], oil_life_pct: 95 }
              as: SystemIngestion
            - call: "POST /vehicles/${veh_v4}/diagnostic-reports"
              payload: { odometer_km: 6000, engine_hours: 240, dtc_codes: ["P0171"], oil_life_pct: 88 }
              as: SystemIngestion
            - call: "POST /accounts/${acct_a4}/consents"
              payload: { consent_type: "DRIVING_DATA_COLLECTION" }
              as: Account
              as_user_id: "${acct_a4}"
            - call: "POST /accounts"
              payload: { full_name: "Eli Evans", email: "eli@example.com", phone: "+15125550105", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a5: $.data.id }
            - call: "POST /accounts/${acct_a5}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000005", make: "Cadillac", model: "XT4", model_year: 2023, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a5}"
            - call: "POST /accounts/${acct_a5}/consents"
              payload: { consent_type: "DRIVING_DATA_COLLECTION" }
              as: Account
              as_user_id: "${acct_a5}"
          trigger:
            - call: "POST /accounts/${acct_a4}/consents"
              payload: { consent_type: "INSURANCE_PROGRAM_SHARING" }
              as: Account
              as_user_id: "${acct_a4}"
              captures: { con_a4: $.data.id }
            - call: "POST /accounts/${acct_a5}/consents"
              payload: { consent_type: "INSURANCE_PROGRAM_SHARING" }
              as: Account
              as_user_id: "${acct_a5}"
              captures: { con_a5: $.data.id }
          assert:
            - "DataConsent.${con_a4}.effective_score == 77.50 (mean of health scores 75 and 80, reports evaluated before the average)"
            - "DataConsent.${con_a5}.effective_score == 50.00 (empty report set hits the pinned baseline, not an error)"
            - "DataConsent.${con_a4}.status == GRANTED and DataConsent.${con_a5}.status == GRANTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: subscription_recovery_cycle_active_past_due_active
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - state_machines.Subscription.EMERGENCY_RETAINED_to_ACTIVE
        distinguishing_aspect: |
          Subscription machine is cyclic (ACTIVE -> PAST_DUE -> ACTIVE on
          payment retry, and EMERGENCY_RETAINED -> ACTIVE on reactivate) —
          not a linear funnel; the cycle resets the billing period and the
          remote-command counter each pass.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Account A1, vehicle V1, subscription S1 converted to ACTIVE on SAFETY_REMOTE (cap 10). One LOCK command acknowledged (period usage 1)."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY_REMOTE", monthly_fee_cents: 4000, allows_emergency: true, allows_remote_commands: true, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - *z_tx
            - *acct_a1
            - *veh_v1
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY_REMOTE" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_c1: $.data.id, sub_c1_v: $.data.version }
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_c1}/convert"
              payload: { expected_subscription_version: "${sub_c1_v}" }
              as: Account
              as_user_id: "${acct_a1}"
            - call: "POST /vehicles/${veh_v1}/remote-commands"
              payload: { command_type: "LOCK" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { rc_c1: $.data.id }
            - call: "POST /remote-commands/${rc_c1}/acknowledge"
              payload: {}
              as: SystemIngestion
          trigger:
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_c1}/billing-events"
              payload: { outcome: "PAYMENT_FAILED" }
              as: BillingAdmin
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_c1}/billing-events"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: BillingAdmin
          assert:
            - "after PAYMENT_FAILED: Subscription.${sub_c1}.status == PAST_DUE"
            - "after retry PAYMENT_SUCCEEDED: Subscription.${sub_c1}.status == ACTIVE (cycle closed)"
            - "Subscription.${sub_c1}.period_remote_commands_used == 0 (reset on cycle re-entry despite the earlier acknowledged command)"

      - name: data_consent_revoke_regrant_cycle_gated_by_dependency
        grounds:
          - state_machines.DataConsent.GRANTED_to_REVOKED
          - state_machines.DataConsent.REVOKED_to_GRANTED
        distinguishing_aspect: |
          DataConsent is a cyclic machine (GRANTED <-> REVOKED) on a different
          entity than Subscription; the re-grant leg of the cycle is gated by
          a sibling consent's state, so the cycle is conditional, not free.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Account A4 with GRANTED DRIVING_DATA_COLLECTION and GRANTED INSURANCE_PROGRAM_SHARING consents."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - call: "POST /accounts"
              payload: { full_name: "Dee Dawson", email: "dee@example.com", phone: "+15125550104", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a4: $.data.id }
            - call: "POST /accounts/${acct_a4}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000004", make: "Buick", model: "Encore", model_year: 2021, region_code: "TX", hardware_generation: 4 }
              as: Account
              as_user_id: "${acct_a4}"
            - call: "POST /accounts/${acct_a4}/consents"
              payload: { consent_type: "DRIVING_DATA_COLLECTION" }
              as: Account
              as_user_id: "${acct_a4}"
              captures: { con_dc: $.data.id }
            - call: "POST /accounts/${acct_a4}/consents"
              payload: { consent_type: "INSURANCE_PROGRAM_SHARING" }
              as: Account
              as_user_id: "${acct_a4}"
              captures: { con_ins: $.data.id }
            - call: "POST /accounts/${acct_a4}/consents/${con_ins}/revoke"
              payload: {}
              as: Account
              as_user_id: "${acct_a4}"
          trigger:
            - call: "POST /accounts/${acct_a4}/consents/${con_ins}/grant"
              payload: {}
              as: Account
              as_user_id: "${acct_a4}"
          assert:
            - "DataConsent.${con_ins}.status == GRANTED again after the revoke (cycle REVOKED -> GRANTED completed)"
            - "DataConsent.${con_ins}.granted_at > its previous revoked_at (logical clock re-stamped)"
            - "DataConsent.${con_dc}.status == GRANTED (sibling dependency satisfied, so re-grant allowed)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: crash_dispatch_acknowledge_bubbleup_chain
        grounds:
          - state_machines.CrashEvent.ADVISOR_CONNECTED_to_DISPATCH_COORDINATED
          - state_machines.DispatchRequest.LOCATION_SENT_to_ACKNOWLEDGED
          - state_machines.CrashEvent.DISPATCH_COORDINATED_to_CLOSED_DISPATCHED
        distinguishing_aspect: |
          Depth-3 cascade: advisor dispatch (A: CrashEvent -> DISPATCH_COORDINATED
          + creates DispatchRequest) -> PSAP acknowledge (B: DispatchRequest ->
          ACKNOWLEDGED) whose side effect itself closes the CrashEvent (C:
          -> CLOSED_DISPATCHED) — each link caused by the previous one, not the
          original dispatch call.
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier, zone TX (cellular), PSAP P1 ACTIVE in TX, account A1, vehicle V1, TRIAL subscription. Crash event E1 created (delta_v 70, airbag true -> SEVERE) and advisor connected."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - call: "POST /psaps"
              payload: { name: "Austin PSAP", region_code: "TX", accepts_location_transfer: true }
              as: PlatformAdmin
              captures: { psap_p1: $.data.id }
            - *acct_a1
            - *veh_v1
            - *sub_s1
            - call: "POST /vehicles/${veh_v1}/crash-events"
              payload: { delta_v_kph: 70, rollover_detected: false, airbag_deployed: true, location_region_code: "TX" }
              as: SystemIngestion
              captures: { ce_e1: $.data.id }
            - call: "POST /vehicles/${veh_v1}/crash-events/${ce_e1}/connect-advisor"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /vehicles/${veh_v1}/crash-events/${ce_e1}/dispatch-requests"
              payload: { psap_id: "${psap_p1}" }
              as: Advisor
              captures: { disp_d1: $.data.id }
            - call: "POST /dispatch-requests/${disp_d1}/acknowledge"
              payload: {}
              as: PSAPOperator
          assert:
            - "after dispatch: CrashEvent.${ce_e1}.status == DISPATCH_COORDINATED (link A)"
            - "DispatchRequest.${disp_d1}.status == LOCATION_SENT before acknowledge, with location_payload frozen (link A side effect)"
            - "after acknowledge: DispatchRequest.${disp_d1}.status == ACKNOWLEDGED and acknowledged_at non-null (link B)"
            - "after acknowledge: CrashEvent.${ce_e1}.status == CLOSED_DISPATCHED (link C — bubble-up caused by B, not by the dispatch call)"

      - name: stolen_verify_to_recovery_restores_vehicle_chain
        grounds:
          - state_machines.StolenVehicleCase.REPORTED_to_VERIFIED
          - state_machines.Vehicle.ACTIVE_to_STOLEN_REPORTED
          - state_machines.StolenVehicleCase.SLOWDOWN_EXECUTED_to_CLOSED_RECOVERED
          - state_machines.Vehicle.STOLEN_REPORTED_to_RECOVERED
        distinguishing_aspect: |
          Different trigger and direction than the crash chain: case verify (A)
          mutates Vehicle (B: ACTIVE -> STOLEN_REPORTED), and that vehicle
          mutation arms slowdown eligibility (C: arm-slowdown becomes legal only
          after B); the recovery leg then compensates B. Cascade originates from
          the verify transition, not from any crash event.
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier, zone TX (cellular), account A1, gen-5 vehicle V1, TRIAL subscription. Stolen case reported by officer LE-1."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - *sub_s1
            - call: "POST /vehicles/${veh_v1}/stolen-cases"
              payload: { police_report_number: "TX-2026-0001", reporting_agency: "Austin PD" }
              as: LawEnforcement
              as_user_id: "le-officer-1"
              captures: { svc_k1: $.data.id }
          trigger:
            - call: "POST /vehicles/${veh_v1}/stolen-cases/${svc_k1}/verify"
              payload: {}
              as: LawEnforcement
              as_user_id: "le-officer-2"
            - call: "POST /vehicles/${veh_v1}/stolen-cases/${svc_k1}/arm-slowdown"
              payload: {}
              as: EmergencyOperator
              as_user_id: "eo-ops-1"
          assert:
            - "after verify: StolenVehicleCase.${svc_k1}.status == VERIFIED and verified_by_user_id == \"le-officer-2\" (link A)"
            - "after verify: Vehicle.${veh_v1}.status == STOLEN_REPORTED (link B, caused by A)"
            - "arm-slowdown succeeds only now: StolenVehicleCase.${svc_k1}.status == SLOWDOWN_ARMED (link C gated by B's mutation)"
            - "Vehicle.${veh_v1}.version advanced by the cascaded mutation, not by the case create"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_beats_referential_entitlement_on_remote_command
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TIER_CAPABILITY_MISSING]
        distinguishing_aspect: |
          Category pair state vs business_referential: the vehicle is
          DECOMMISSIONED-adjacent (subscription CANCELLED — a state failure on
          the subscription lifecycle) AND the tier lacks remote commands; the
          state check (priority 6) must win over the tier-capability
          referential check (priority 10).
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier (allows_remote_commands false), zone TX, account A1, vehicle V1, subscription S1 created TRIAL then cancelled."
          setup_api_calls:
            - *t_safety
            - *z_tx
            - *acct_a1
            - *veh_v1
            - *sub_s1
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_s1}/cancel"
              payload: {}
              as: Account
              as_user_id: "${acct_a1}"
          trigger:
            - call: "POST /vehicles/${veh_v1}/remote-commands"
              payload: { command_type: "LOCK" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (subscription terminal state, priority 6)"
            - "error_id != ERR_TIER_CAPABILITY_MISSING (priority 10 loses despite also being violated)"

      - name: safety_gate_beats_temporal_window_on_stolen_case
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SLOWDOWN_NOT_VERIFIED]
          - errors[ERR_RETENTION_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Different category pair — business_safety vs business_temporal: an
          arm-slowdown on a case still REPORTED (safety failure: verification
          must precede slowdown) attempted when the vehicle's region zone ALSO
          fails cellular coverage must return the safety error, because safety
          (priority 7) outranks coverage/referential and temporal gates.
        test_recipe:
          setup:
            - "Clock 2026-09-01. SAFETY tier, zone NM (has_cellular false), account A6, gen-5 vehicle V6 in NM, TRIAL subscription, stolen case reported but NOT verified."
          setup_api_calls:
            - *t_safety
