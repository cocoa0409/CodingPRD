            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Disp", license_number: "L600", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BD1", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id" } }
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${a1}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a1}/complete", payload: { actual_start_minute: 420, actual_end_minute: 480, actual_miles: 60 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "GET /busops/service-days/${sd1}", as: ContractorOps, captures: { sd1_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd1}/lock", payload: { expected_service_day_version: "${sd1_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sd1}/reconcile", payload: {}, as: ContractorOps }
            - { call: "POST /busops/fuel-price-entries", payload: { district_id: "${d_id}", effective_month: "2026-06", avg_price_cents_per_gallon: 400, source: "EIA" }, as: FinanceClerk }
            - { call: "POST /busops/invoices/generate", payload: { contract_id: "${c_id}", period_month: "2026-06" }, as: FinanceClerk, captures: { inv: $.data.id } }
            - { call: "POST /busops/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /busops/invoices/${inv}/issue", payload: {}, as: FinanceClerk }
          trigger:
            - { call: "POST /busops/invoices/${inv}/dispute", payload: { reason: "Shortage credit miscalculated" }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { st_disputed: $.data.status } }
            - { call: "POST /busops/invoices/${inv}/reissue", payload: { adjustment_delta_cents: -5000, reason: "Agreed credit correction" }, as: FinanceClerk, captures: { st_reissued: $.data.status } }
          assert:
            - "${st_disputed} == DISPUTED"
            - "${st_reissued} == ISSUED (cycle completed)"
            - "Invoice.${inv}.total_cents == 45000 (50000 - 5000 delta)"
            - "Invoice.${inv}.final_total_cents == 45000"
            - "Invoice.${inv}.dispute_count == 1"
            - "Invoice.${inv}.issued_on == 2026-06-05 (refreshed at reissue from logical clock)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers: record-result vs clock)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_cascade_to_service_day
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - state_machines.Bus.IN_SERVICE_to_GROUNDED
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by record-result FAIL: Inspection FAILED ->
          Bus GROUNDED -> future CONFIRMED Assignment CANCELLED (BUS_GROUNDED)
          -> ServiceDay shortage fields recomputed. Each link is caused by the
          previous link, not by the original call.
        test_recipe:
          setup:
            - "Contract ACTIVE, one route; driver ACTIVE; bus B1 (inspection due 2026-12-31)"
            - "Service day 2026-06-03 DISPATCH_OPEN with assignment CONFIRMED on bus B1"
            - "Inspection on B1 scheduled 2026-05-10 (no day conflict with 2026-06-03)"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-CAS1", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
