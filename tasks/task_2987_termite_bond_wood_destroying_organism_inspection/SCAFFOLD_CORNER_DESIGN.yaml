            - call: "GET /properties/${p1}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { e1: "$.data.error_id" }
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
              headers: { X-User-Role: "" }
              captures: { e2: "$.data.error_id" }
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
              headers: { X-User-ID: "" }
              captures: { e3: "$.data.error_id" }
