            - "After the first trigger call: Facility.${fac_id}.resident_sire_count == 0"
            - "After the second trigger call: Sire.${b_id}.collection_status == SUSPENDED and suspension_reason == MANUAL"
            - "After the second trigger call: Sire.${b_id}.acquisition_status is still RETIRED (the collection move did not touch the acquisition dimension)"
            - "Sire.${b_id}.housing_facility_id == ${fac_id} (retained for audit after retirement)"

