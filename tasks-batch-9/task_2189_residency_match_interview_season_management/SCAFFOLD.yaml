      - "GET /rank-lists/{id}/votes, GET /committee-votes"
      - "GET /match-results, GET /match-results/{id}"
      - "GET /soap-offers, GET /soap-offers/{id}"
      - "GET /contracts, GET /contracts/{id}, GET /contracts/{id}/credential-items"
      - "GET /credential-items/{id}"
      - "POST /communication-logs, GET /communication-logs, GET /communication-logs/{id}"

  - name: Reviewer
    description: >
      Faculty member who writes paper-screening reviews of applications. Barred from any
      application whose applicant appears in their conflict_applicant_ids.
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /applications/{id}/reviews"
    shared_operations: []

  - name: Interviewer
    description: >
      Faculty member who staffs interview panels and authors rubric score cards for the
      applications their own panel seats hosted.
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /score-cards"
      - "POST /score-cards/{id}/submit"
      - "POST /score-cards/{id}/revise"
    shared_operations:
      - "GET /faculty-members, GET /faculty-members/{id}"
      - "GET /interview-slots, GET /interview-slots/{id}"
      - "GET /interview-assignments"
      - "GET /score-cards, GET /score-cards/{id}"
      - "POST /communication-logs"

  - name: CommitteeMember
    description: >
      Faculty member entitled to ballot on a rank list under deliberation. One ballot per member
      per review_round; the quorum resolution runs after every ballot.
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /rank-lists/{id}/votes"
    shared_operations:
      - "GET /score-cards, GET /score-cards/{id}"
      - "GET /rank-lists, GET /rank-lists/{id}, GET /rank-lists/{id}/entries, GET /rank-list-entries"
      - "GET /rank-lists/{id}/votes, GET /committee-votes"
      - "POST /communication-logs"

  - name: ProgramCoordinator
    description: >
      Operational staff who run the season's logistics - applications intake, screening decisions,
      waves, slots, invitations, panel staffing, contract issuance and activation. Not a
      FacultyMember, so coordinator actions never trip the conflict-of-interest rule.
    identity: "opaque"
    exclusive_operations:
      - "POST /applicants"
      - "POST /applications"
      - "POST /applications/{id}/screen"
      - "POST /applications/{id}/withdraw"
      - "POST /faculty-members"
      - "POST /interview-waves"
      - "POST /interview-waves/{id}/release"
