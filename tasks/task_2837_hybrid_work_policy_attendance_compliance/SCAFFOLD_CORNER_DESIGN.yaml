      - name: credited_days_diverges_between_the_union_and_corroborated_variants
        claim_type: variant_divergence
        grounds:
          - calculations.credited_office_days.variants
          - entities.AttendanceWeek.fields.variant_applied
        excluded_because:
          difficulty_instance: credited_days_union_versus_corroborated
          rationale: "That §1.8 instance already feeds the SAME signal set to two teams differing only in signal_corroboration_required and asserts the divergent credited_days, the variant_applied stamp on each week and the downstream pressure difference. Re-running it here would duplicate the fixture with fewer assertions."

      - name: pressure_is_a_capped_three_input_expression
        claim_type: threshold
        grounds:
          - calculations.non_compliance_pressure
          - calculations.pressure_derived_stage
        excluded_because:
          difficulty_instance: pressure_three_input_conditional_multiplier_with_ceiling
          rationale: "That §1.8 instance already varies all three inputs (shortfall, class-keyed multiplier, breach streak) and drives the sum past the 12.00 ceiling, asserting both the clamp and the stage the clamped value maps to. A §1.9 restatement could only test a subset of the same expression."

      - name: neighborhood_peak_load_aggregates_half_open_week_windows
        claim_type: interval_merge
        grounds:
          - calculations.neighborhood_peak_load
          - entities.Neighborhood.fields.peak_committed_seats
        excluded_because:
          difficulty_instance: seat_allocation_half_open_week_aggregate_overlap_matrix
          rationale: "That §1.8 instance already builds the per-week load matrix from three windows that touch, abut and nest, asserts the peak week, the exclusive upper bound and the capacity refusal at the peak. Any §1.9 version would be a strictly weaker sub-case."

      - name: chargeback_rounds_each_line_before_summing
        claim_type: precision
        grounds:
          - calculations.space_chargeback_cents
          - entities.RecalibrationReview.fields.total_space_chargeback_cents
        excluded_because:
          difficulty_instance: chargeback_round_per_line_then_sum
          rationale: "That §1.8 instance already pins the rounding ORDER with two lines whose raw halves cancel, asserting both the correct 77995 and the incorrect sum-then-round 77994. Duplicating it here adds no new discrimination."

      - name: seat_entitlement_tier_is_keyed_on_the_base_not_the_total
        claim_type: tiered_pricing
        grounds:
          - calculations.team_seat_entitlement
          - entities.Team.fields.entitled_seats
        excluded_because:
          difficulty_instance: seat_entitlement_tier_keyed_on_base_not_total
          rationale: "That §1.8 instance already walks teams that sit exactly on the 10 and 25 tier boundaries and shows that the buffer percentage is chosen from base_entitlement rather than from the buffered total. The §1.9 recalibration-adopt instance above re-observes the tier from a different angle (a delta that moves a team's base), so the boundary probe itself stays in §1.8."

      - name: relocation_selects_the_preliminary_variant_at_creation
        claim_type: variant_selection
        grounds:
          - calculations.relocation_risk_score.variants
          - entities.RemoteLocationRequest.fields.preliminary_risk_score
        excluded_because:
          difficulty_instance: relocation_risk_preliminary_versus_final
          rationale: "That §1.8 instance already asserts which variant runs at which step, including that PRELIMINARY is stored once and never recomputed when the reviews land. The §1.9 penalty-cap instance above reuses the divergence only as corroboration of the cap arithmetic, so variant SELECTION remains owned by §1.8."

  - section: validations
    instances:

      - name: uniqueness_sweep_over_every_declared_unique_key_rejects_replays
        claim_type: violation_to_error
        grounds:
          - validations[priority=60]
        distinguishing_aspect: "Seven distinct uniqueness rules with three different scopes: cycle_label, employee_number and work_email are GLOBAL, team_code, neighborhood_code and review_label are unique only WITHIN a policy cycle (so the same label is accepted in a second cycle), and attendance weeks are unique per (employee, iso_week). The declared tie-break between employee_number and work_email is observable on a payload that duplicates both."
        test_recipe:
          setup:
            - "Two cycles C1 (label FY27-CRN46) and C2 (label FY27-CRN47); in C1 a team T-A, a neighborhood N-1, an employee E-1001 (work_email e1001@corp.example), that employee's 2026-W37 attendance week, and a DRAFT recalibration review labelled R-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN46", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { c1: $.data.id }
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN47", effective_from: "2027-01-01", effective_to: "2027-06-30", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { c2: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${c1}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${c1}", anchor_team_id: "${t_a}", neighborhood_code: "N-1", site_code: "NYC-01", seat_count: 13, buffer_seats: 4, desk_index_from: 1, desk_index_to: 13 }
              as: WorkplaceProgramOffice
              captures: { n1: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
