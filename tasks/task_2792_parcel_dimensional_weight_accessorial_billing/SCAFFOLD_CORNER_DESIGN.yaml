            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { total: $.data.line_total_cents, base: $.data.transportation_base_cents }
          assert:
            - "GET /shipments/${p}/accessorials with code DELIVERY_AREA returns total_count == 1 and that row's amount_cents == 650 — the EXTENDED class rate, not the DAS 425"
            - "That row has source == AUTO and status == ASSESSED; no RESIDENTIAL, OVERSIZE or ADDITIONAL_HANDLING row exists (total_count over all codes == 1)"
            - "${acc} == 650"
            - "${base} == 2660 and ${total} == 3310 with surcharge_cents == 0"
            - "The preview's billable_weight_lbs == 7 with billable_weight_basis == DIMENSIONAL and rate_cents_per_lb == 380"

      - name: the_sweep_filters_out_in_transit_flagged_and_out_of_period_parcels
        claim_type: input_set_filtering
        grounds:
          - calculations.invoice_sweep_selection
          - calculations.scan_tolerance_evaluation
        distinguishing_aspect: |
          Four sibling parcels of one shipper, only one of which is sweepable: the sweep for
