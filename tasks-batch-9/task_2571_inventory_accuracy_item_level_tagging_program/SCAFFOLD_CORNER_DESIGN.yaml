              payload: { store_id: "${store_s100}", counter_firm_id: "${firm1}", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12" }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi1: "$.data.id" }
