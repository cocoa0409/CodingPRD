scaffold_difficulty_design:
  # ==================================================================
  # Rule 1: dual_variant_calc — different entity domains
  # ==================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_chair_minutes
        grounds:
          - calculations.invoice_pricing
          - entities.Invoice.fields.pricing_variant
          - entities.Booking.fields.booked_chair_minutes
          - entities.Booking.fields.delivered_chair_minutes
        distinguishing_aspect: |
          Same booking data produces two different Invoice.chair_minutes_billed
          values depending on pricing_variant: PROVISIONAL reads
          Booking.booked_chair_minutes (claims in CLAIMED/CHECKED_IN/COMPLETED),
          FINAL reads Booking.delivered_chair_minutes (COMPLETED only).
          Entity domain = customer-facing billing (Invoice).
        test_recipe:
          setup:
            - "Region SF-BAY active with base_mileage_rate_cents=120, travel_included_miles=20, setup_buffer=30, teardown_buffer=30"
            - "CorporateAccount ACME, credit_limit_cents=100000000"
            - "Therapist T1 ACTIVE, rate 6000c/hr, max_minutes_per_day=480, holds ACTIVE license in SF-BAY expiring 2027-12-31"
            - "Booking B: EVENT on 2026-06-10, window_start=600, window_duration=120, chair_count=1, slot_minutes=15, per_minute_rate_cents=200"
            - "B driven to IN_PROGRESS; chair-slot cs0 assigned to T1 and moved to ON_SITE"
            - "3 claims on cs0: c1 COMPLETED, c2 COMPLETED, c3 CHECKED_IN (each with active waiver)"
            - "Booking.booked_chair_minutes == 45; Booking.delivered_chair_minutes == 30"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "SF-BAY", name: "SF Bay", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "ap@acme.test", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T One", email: "t1@test", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "LIC-T1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "1 Main St", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 120, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs0: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_v: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/confirm", payload: { expected_booking_version: "${bk_v}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/chair-slots/${cs0}/depart", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
            - { call: "POST /chair-massage/chair-slots/${cs0}/arrive", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
            - { call: "POST /chair-massage/bookings/${bk_id}/start-service", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v1: "$.data.version" } }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "A One", recipient_email: "a1@x", expected_chair_slot_version: "${cs_v1}" }, as: Organizer, as_user_id: "${acct_id}", captures: { c1_id: "$.data.id" } }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v2: "$.data.version" } }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "A Two", recipient_email: "a2@x", expected_chair_slot_version: "${cs_v2}" }, as: Organizer, as_user_id: "${acct_id}", captures: { c2_id: "$.data.id" } }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v3: "$.data.version" } }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "A Three", recipient_email: "a3@x", expected_chair_slot_version: "${cs_v3}" }, as: Organizer, as_user_id: "${acct_id}", captures: { c3_id: "$.data.id" } }
            - { call: "POST /chair-massage/slot-claims/${c1_id}/waiver", payload: { booking_id: "${bk_id}", signer_email: "a1@x", signature_payload: "sig1" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/slot-claims/${c2_id}/waiver", payload: { booking_id: "${bk_id}", signer_email: "a2@x", signature_payload: "sig2" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/slot-claims/${c3_id}/waiver", payload: { booking_id: "${bk_id}", signer_email: "a3@x", signature_payload: "sig3" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/slot-claims/${c1_id}/check-in", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/slot-claims/${c2_id}/check-in", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/slot-claims/${c3_id}/check-in", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/slot-claims/${c1_id}/complete", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
            - { call: "POST /chair-massage/slot-claims/${c2_id}/complete", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
          trigger:
            - { call: "POST /chair-massage/bookings/${bk_id}/invoices", payload: { pricing_variant: "PROVISIONAL" }, as: PlatformAdmin, captures: { inv_prov: "$.data.id", prov_chair_minutes: "$.data.chair_minutes_billed", prov_subtotal: "$.data.subtotal_cents" } }
            - { call: "POST /chair-massage/invoices/${inv_prov}/void", payload: {}, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings/${bk_id}/invoices", payload: { pricing_variant: "FINAL" }, as: PlatformAdmin, captures: { inv_final: "$.data.id", final_chair_minutes: "$.data.chair_minutes_billed", final_subtotal: "$.data.subtotal_cents" } }
          assert:
            - "Invoice.${inv_prov}.chair_minutes_billed == 45"
            - "Invoice.${inv_prov}.subtotal_cents == 9000"
            - "Invoice.${inv_final}.chair_minutes_billed == 30"
            - "Invoice.${inv_final}.subtotal_cents == 6000"
            - "Invoice.${inv_prov}.chair_minutes_billed != Invoice.${inv_final}.chair_minutes_billed"

      - name: travel_fee_quoted_vs_settled_volume_discount
        grounds:
          - calculations.travel_fee
          - entities.TravelLeg.fields.travel_fee_variant
          - entities.TravelLeg.fields.travel_fee_cents
        distinguishing_aspect: |
          Same TravelLeg.distance_miles produces two different travel_fee_cents
          values depending on travel_fee_variant: QUOTED charges the raw
          per-mile overage, SETTLED applies a 20% volume discount when the
          therapist completed >=20 sessions on the booking. Entity domain =
          travel reimbursement (TravelLeg) — disjoint from invoice/billing.
        test_recipe:
          setup:
            - "Region R0 with base_mileage_rate_cents=120, travel_included_miles=20, setup_buffer=30, teardown_buffer=30"
            - "CorporateAccount ACME, credit_limit=100000000"
            - "Therapist T1 ACTIVE, rate 6000c/hr, max_minutes_per_day=2000, licensed in R0 through 2027-12-31"
            - "Booking B: EVENT 2026-06-10, window_start=600, window_duration=480, chair_count=1, slot_minutes=15, per_minute_rate_cents=200 (capacity 480/15 = 32 sessions)"
            - "B driven to IN_PROGRESS; 25 claims on chair cs0, all COMPLETED"
            - "TravelLeg for (B, T1) exists with distance_miles=40"
            - "At Booking.confirm time the TravelLeg was QUOTED with travel_fee_cents = (40-20)*120 = 2400"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "Region Zero", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "ap@acme.test", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T One", email: "t1@test", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 2000 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "LIC-T1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "1 Main St", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 480, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs0: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_v: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/confirm", payload: { expected_booking_version: "${bk_v}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/travel-legs", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { leg_id: "$.data[0].id", quoted_fee: "$.data[0].travel_fee_cents" } }
            - { call: "POST /chair-massage/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/chair-slots/${cs0}/depart", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
            - { call: "POST /chair-massage/chair-slots/${cs0}/arrive", payload: {}, as: Therapist, as_user_id: "${t1_id}" }
            - { call: "POST /chair-massage/bookings/${bk_id}/start-service", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            # 25 claims, all with waiver + check-in + complete. Use repeated literal calls.
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
