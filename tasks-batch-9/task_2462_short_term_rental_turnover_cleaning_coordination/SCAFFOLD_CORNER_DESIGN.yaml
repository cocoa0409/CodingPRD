          REACTIVATE is declared only from SUSPENDED. Applying it to an ACTIVE cleaner returns
          ERR_INVALID_CLEANER_STATE 409 and leaves version untouched; SUSPEND then REACTIVATE
          from SUSPENDED succeeds, so the refusal is about the source state, not the action.
        test_recipe:
          setup:
            - "Cleaner C exists in the declared initial state ACTIVE at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id", cc_v: "$.data.version" }
          trigger:
            - call: "POST /cleaners/${cc}/status"
              payload: { action: "REACTIVATE", reason: "no-op" }
              as: PlatformAdmin
            - call: "GET /cleaners/${cc}"
              payload: {}
              as: Coordinator
              captures: { mid_status: "$.data.status", mid_ver: "$.data.version" }
            - call: "POST /cleaners/${cc}/status"
              payload: { action: "SUSPEND", reason: "documents expired" }
              as: PlatformAdmin
              captures: { s_status: "$.data.status" }
            - call: "POST /cleaners/${cc}/status"
              payload: { action: "REACTIVATE", reason: "documents renewed" }
              as: PlatformAdmin
              captures: { r_status: "$.data.status" }
          assert:
            - "${cc_v} == 1"
            - "REACTIVATE from ACTIVE: HTTP 409 with data.error_id == ERR_INVALID_CLEANER_STATE"
            - "${mid_status} == ACTIVE and ${mid_ver} == 1 (nothing mutated)"
            - "${s_status} == SUSPENDED then ${r_status} == ACTIVE (the same action succeeds from the declared source state)"

      - name: corner_bubble_up_last_submission_moves_turnover_out_of_in_progress
        claim_type: Bubble up
        grounds:
          - state_machines.Turnover.note
          - state_machines.Turnover.IN_PROGRESS_to_AWAITING_VERIFICATION
          - entities.Turnover.fields.checklist_task_count
        distinguishing_aspect: |
          Turnover.status while the clean runs is re-derived from the children by the ordered
          rule, not set directly. With 4 generated tasks, three submitted and one still
          PENDING the parent stays IN_PROGRESS (rule 2 wins); the moment the fourth is
          submitted no child is PENDING or REJECTED and the parent bubbles up to
          AWAITING_VERIFICATION, incrementing version once per derivation.
        test_recipe:
          setup:
            - "P1 with LIN-SHEET-Q (par 6 on_hand 6); Cleaner C accepted T1; the guest checked out at 2026-08-08T16:00:00Z and the clean is IN_PROGRESS with 4 PENDING tasks (TWO_BR omits PATIO_STAGING)."
