          assert:
            - "submitted_at == 2026-08-05T00:00:00Z and response_due_date == 2026-08-26 (+21 days)"

  # ----------------------------------------------------------- validations ---
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without valid X-User-ID / X-User-Role headers is rejected with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /rcm/denial-cases"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: missing_auth_on_unknown_denial_returns_unauthenticated
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]"]
        distinguishing_aspect: "Priority ordering: an unauthenticated read of a nonexistent denial id returns ERR_UNAUTHENTICATED (priority 1), not ERR_DENIAL_NOT_FOUND (priority 4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /rcm/denial-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (auth beats existence)"

      - name: outcome_amount_shape_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_OUTCOME_AMOUNT_INCONSISTENT]"]
        distinguishing_aspect: "Outcome/amount shape coupling: UPHELD with recovered 5000 is rejected, and PARTIALLY_OVERTURNED with recovered == open balance is rejected (that shape belongs to OVERTURNED)."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2301 (denied 250000) with level-1 appeal SUBMITTED"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2301", patient_account_number: "PA-2301", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-2301-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "UPHELD", recovered_amount_cents: 5000 }
              as: DenialsSpecialist
              captures: { err1: $.data.error_id }
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "PARTIALLY_OVERTURNED", recovered_amount_cents: 250000 }
              as: DenialsSpecialist
              captures: { err2: $.data.error_id }
          assert:
            - "UPHELD with recovered 5000: error_id == ERR_OUTCOME_AMOUNT_INCONSISTENT (UPHELD requires 0)"
            - "PARTIALLY_OVERTURNED with recovered 250000 == open balance: error_id == ERR_OUTCOME_AMOUNT_INCONSISTENT (partial requires strictly less)"
            - "appeal remains SUBMITTED after both rejections"

      - name: writeoff_ceiling_checked_before_balance
        claim_type: priority_ordering
        grounds: ["validations[priority=11]", "errors[ERR_WRITE_OFF_EXCEEDS_CEILING]"]
        distinguishing_aspect: "Fiscal sub-order: a request for 10000001 violates both the ceiling and the open balance; the ceiling error ERR_WRITE_OFF_EXCEEDS_CEILING is returned first."
        test_recipe:
          setup: ["payer A; code CO-16; denial CLM-2302 (denied 4000000) QUEUED"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2302", patient_account_number: "PA-2302", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 4100000, denied_amount_cents: 4000000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
          trigger:
            - call: "POST /rcm/write-off-requests"
              payload: { denial_case_id: "${d1}", requested_amount_cents: 10000001, reason_code: "OTHER" }
              as: DenialsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WRITE_OFF_EXCEEDS_CEILING (ceiling 10000000 checked before the open-balance gate)"

      - name: writeoff_exceeds_open_balance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_AMOUNT_EXCEEDS_OPEN_BALANCE]"]
        distinguishing_aspect: "A request under the ceiling but above the denial's open balance (4000001 > 4000000) fails with ERR_AMOUNT_EXCEEDS_OPEN_BALANCE."
        test_recipe:
          setup: ["payer A; code CO-16; denial CLM-2303 (denied 4000000) QUEUED"]
          setup_api_calls:
