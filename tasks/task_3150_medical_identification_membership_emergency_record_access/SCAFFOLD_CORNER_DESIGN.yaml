            - call: "POST /medical-id/members"
              payload: { full_name: "Abe Audit", email: "abe@x.com", membership_tier: "STANDARD", date_of_birth: "1982-02-02" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /medical-id/members/${m}/contacts"
              payload: { contact_name: "C", phone: "+15550000001", priority_rank: 1 }
              as: Member
              as_user_id: "${m}"
            - call: "POST /medical-id/members/${m}/orders"
              payload: { product_id: "${prod}", engraving_text: "Abe", engrave_mode: "MANUAL" }
              as: Member
              as_user_id: "${m}"
              captures: { o: $.data.id }
          trigger:
            - call: "GET /medical-id/members/${m}/audit-events"
