              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
