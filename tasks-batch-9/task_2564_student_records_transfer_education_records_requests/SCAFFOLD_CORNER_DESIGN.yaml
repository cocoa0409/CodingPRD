            - call: "GET /records-office/discipline-incidents/00000000-0000-0000-0000-000000000102"
              payload: {}
              as: RecordsOfficer
            - call: "GET /records-office/records-requests/00000000-0000-0000-0000-000000000103"
              payload: {}
              as: RecordsOfficer
            - call: "GET /records-office/inspection-requests/00000000-0000-0000-0000-000000000104"
              payload: {}
              as: RecordsOfficer
            - call: "GET /records-office/review-appointments/00000000-0000-0000-0000-000000000105"
              payload: {}
              as: RecordsOfficer
            - call: "GET /records-office/amendment-requests/00000000-0000-0000-0000-000000000106"
              payload: {}
              as: RecordsOfficer
            - call: "GET /records-office/legal-demands/00000000-0000-0000-0000-000000000107"
              payload: {}
              as: LegalAffairsOfficer
            - call: "GET /records-office/retention-schedules/00000000-0000-0000-0000-000000000108"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "trigger call 1 returns HTTP 404 with data.error_id == \"ERR_WITHDRAWAL_NOT_FOUND\""
            - "trigger call 2 returns HTTP 404 with data.error_id == \"ERR_DISCIPLINE_INCIDENT_NOT_FOUND\""
            - "trigger call 3 returns HTTP 404 with data.error_id == \"ERR_RECORDS_REQUEST_NOT_FOUND\""
            - "trigger call 4 returns HTTP 404 with data.error_id == \"ERR_INSPECTION_REQUEST_NOT_FOUND\""
            - "trigger call 5 returns HTTP 404 with data.error_id == \"ERR_REVIEW_APPOINTMENT_NOT_FOUND\""
            - "trigger call 6 returns HTTP 404 with data.error_id == \"ERR_AMENDMENT_REQUEST_NOT_FOUND\""
            - "trigger call 7 returns HTTP 404 with data.error_id == \"ERR_LEGAL_DEMAND_NOT_FOUND\""
            - "trigger call 8 returns HTTP 404 with data.error_id == \"ERR_RETENTION_SCHEDULE_NOT_FOUND\""
            - "every one of the eight bodies has response_type == \"error\" and a non-empty data.message"

      - name: duplicate_state_rule_and_duplicate_district_code_codes
        claim_type: error_triggerable
        grounds:
          - validations.priority_90_state_rule_unique_per_state
          - validations.priority_91_district_code_unique
          - errors.ERR_DUPLICATE_STATE_RULE
          - errors.ERR_DUPLICATE_DISTRICT_CODE
        distinguishing_aspect: "Re-posting state_code CA with a completely different day budget returns ERR_DUPLICATE_STATE_RULE (the natural key, not the payload, decides), while re-posting district_code SEND01 under a different name returns ERR_DUPLICATE_DISTRICT_CODE — and a district_code that differs only in case is accepted, so the uniqueness key is exact-match."
        test_recipe:
          setup:
            - "The CA rule and district SEND01 exist."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 45, discipline_inclusion_mode: "ALL_INCIDENTS", discipline_min_days_removed: 1, include_pending_investigations: true, sped_requires_consent: false, amendment_hearing_days: 60, destruction_min_age_years: 9, directory_optout_grace_days: 30, notification_wait_days: 1 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Impostor Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Lowercase Unified", district_code: "send01", state_code: "CA" }
              as: SystemAdmin
              captures: { lowercase_district_id: "$.data.id" }
          assert:
            - "trigger call 1 returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_STATE_RULE\""
            - "GET /records-office/state-rules/CA still reports transfer_response_days == 10 and amendment_hearing_days == 30"
            - "trigger call 2 returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_DISTRICT_CODE\""
            - "trigger call 3 returns HTTP 201 with district_code == \"send01\" and an id different from ${send_district_id}"
            - "GET /records-office/districts returns total_count == 2"

      - name: withdrawal_uniqueness_enrollment_and_completion_codes
        claim_type: error_triggerable
        grounds:
          - validations.priority_50_student_enrolled_for_withdrawal
          - validations.priority_51_withdrawal_not_already_completed
          - validations.priority_92_one_open_withdrawal_per_student
          - errors.ERR_OPEN_WITHDRAWAL_EXISTS
          - errors.ERR_STUDENT_NOT_ENROLLED
          - errors.ERR_WITHDRAWAL_ALREADY_COMPLETED
        distinguishing_aspect: "The withdrawal surface distinguishes three refusals on one student: a second withdrawal while the first is open returns the sharper ERR_OPEN_WITHDRAWAL_EXISTS (priority 92) because a WITHDRAWAL_PENDING student still passes the priority-50 enrollment check; after completion, a withdrawal attempt on the now-WITHDRAWN student returns ERR_STUDENT_NOT_ENROLLED; and placing or releasing a hold on the COMPLETED row returns ERR_WITHDRAWAL_ALREADY_COMPLETED."
        test_recipe:
          setup:
            - "CA rule, SEND01 and one enrolled student with guardian-yves; a withdrawal is opened effective 2026-08-14 with no holds, so it sits in CLEARED."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
