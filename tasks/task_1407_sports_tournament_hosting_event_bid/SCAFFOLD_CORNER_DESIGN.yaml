  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_bid_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bid-create-stale-event]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Create-with-supersede OCC: after bid B1 advances Event.version 1 -> 2, a second create carrying expected_event_version 1 is rejected 412 even though superseding a DRAFT bid would otherwise be legal."
        test_recipe:
          setup: ["Event E created (version 1); bid B1 created with expected_event_version 1 (event now version 2, B1 DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 412; error_id == ERR_STALE_VERSION"
            - "Event.${ev_id}.version == 2 and Bid.${b1}.status remains DRAFT (not superseded by a failed write)"

      - name: occ_bid_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bid-patch-stale-bid]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH carries expected_bid_version; the first patch bumps Bid.version 1 -> 2, so replaying the same expected version fails 412."
        test_recipe:
          setup: ["Event E; bid B1 DRAFT (version 1)"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { b1: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "PATCH /api/v1/bids/${b1}", payload: { expected_bid_version: "${bv}", notes: "v2 notes" }, as: CommissionAdmin, captures: { bv2: $.data.version } }
            - { call: "PATCH /api/v1/bids/${b1}", payload: { expected_bid_version: "${bv}", notes: "stale replay" }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH succeeds: Bid.${b1}.version == 2 (version increments on every mutation)"
            - "second PATCH with the same observed version: HTTP 412 ERR_STALE_VERSION; notes stay 'v2 notes'"

      - name: occ_hotel_block_patch_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[hotel-block-patch-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "NEGOTIATING block terms are OCC-guarded: two patches carrying the same observed version yield one success (200) and one 412."
        test_recipe:
          setup: ["Event E; block H NEGOTIATING (version 1)"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb: $.data.id, hbv: $.data.version } }
          trigger:
            - { call: "PATCH /api/v1/hotel-blocks/${hb}", payload: { expected_hotel_block_version: "${hbv}", room_rate_cents: 16000 }, as: CommissionAdmin, captures: { hbv2: $.data.version, rate: $.data.room_rate_cents } }
            - { call: "PATCH /api/v1/hotel-blocks/${hb}", payload: { expected_hotel_block_version: "${hbv}", room_rate_cents: 17000 }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH: room_rate_cents == 16000, version == 2"
            - "second PATCH: HTTP 412 ERR_STALE_VERSION; room_rate_cents stays 16000"

      - name: occ_posture_advance_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[posture-advance-stale-event]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Posture advance is OCC-guarded: after a successful PLANNING advance bumps the version, replaying the stale expected version on the next transition fails 412 before any posture logic runs."
