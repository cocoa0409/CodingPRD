    output: GrossReceiptsReport
    side_effects: ["status REJECTED -> SUBMITTED", "the four category fields overwritten and rejection_note cleared to null", "total_receipts_cents, assessed_fee_cents and maintenance_reserve_due_cents recomputed", "increments GrossReceiptsReport.version by 1"]
  - method: GET
