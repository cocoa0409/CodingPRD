              payload: { operator_id: "${opb}", review_period: "2026" }
              as: FranchiseFinance
              captures: { crb: $.data.id }
          trigger:
            - call: "POST /franchise-system/capacity-reviews/${crb}/submit"
              payload: {}
              as: FranchiseFinance
            - call: "POST /franchise-system/operators/${opb}/approve"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "CapacityReview.${crb}.composite_score == 60"
            - "CapacityReview.${crb}.grade == ADEQUATE (60 is in the ADEQUATE band, not WEAK)"
            - "Operator.${opb}.max_stores == 6"
            - "approve succeeds -> Operator.${opb}.status == APPROVED"

