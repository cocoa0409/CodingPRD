          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with a single step seq 10 LITHO 2.0h."
            - "PLAN-A COMMITTED with planned_wafer_starts 10 and capacity_budget_hours 100.0 (committed_hours 20.00, TIER_0)."
