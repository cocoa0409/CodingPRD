  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: sweep_reversal_balance_conservation
        grounds:
          - state_machines.SettlementSweep.APPLIED_to_REVERSED
          - calculations.daily_holdback
        distinguishing_aspect: |
          Conserved quantity: loan repayment total. Invariant
          remaining_balance_cents + sum(APPLIED sweep holdback_cents) +
          sum(APPLIED catch-up amount_cents) + sum(enforcement draws) ==
          total_repayment_cents holds before the sweep, after the sweep, and
          after its reversal — forward action plus compensating action leaves
          the conserved quantity unchanged with zero drift.
        test_recipe:
          setup:
            - "Flat merchant (TX) ELIGIBLE; loan 500,000 @ 0.10 (total 555,000) ACTIVE; batch 2026-09-02 net 100,000 FINALIZED"
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Flat Co", state_code: "TX", owner_name: "Flat Line", processing_started_at: "2023-01-01T00:00:00Z" }
