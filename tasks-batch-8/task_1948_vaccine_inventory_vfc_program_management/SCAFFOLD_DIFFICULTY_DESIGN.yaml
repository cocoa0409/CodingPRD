      - name: payback_remaining_boundary_exact_remaining_closes_ticket
        grounds:
          - calculations.payback_quantity_validation
          - state_machines.BorrowTicket
        distinguishing_aspect: |
          Boundary metric: payback quantity remaining on a BorrowTicket
          (integer count, different from temperature). payback_quantity ==
          remaining is ALLOWED and closes the ticket (status -> REPAID);
          payback_quantity == remaining + 1 is REJECTED with
          ERR_PAYBACK_EXCEEDS_BORROWED. Endpoint:
          POST .../borrow-tickets/{ticketId}/record-payback.
        test_recipe:
          setup:
            - "Site S; unit U; product P; lot L_pub PUBLIC_VFC 10 doses; lot L_priv PRIVATE 8 doses"
            - "BorrowTicket BT direction=PUBLIC_FROM_PRIVATE borrowed_quantity=4"
          setup_api_calls:
