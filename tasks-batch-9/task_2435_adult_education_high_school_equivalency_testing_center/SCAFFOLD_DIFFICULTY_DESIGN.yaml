            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T11:00:00Z", requested_seats: 4 }
              as: CenterAdministrator
