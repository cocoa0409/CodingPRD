# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Sidewalk Repair & Cost-Share Program
# 24 instances across the nine Difficulty Rules (>= 2 per rule)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_award_divergence
        grounds:
          - calculations.provisional_award
          - calculations.final_award
          - entities.CostShareApplication.fields.provisional_award_cents
          - entities.CostShareApplication.fields.final_award_cents
          - state_machines.CostShareApplication.OBLIGATED_to_REIMBURSED
        distinguishing_aspect: |
          Entity domain: CostShareApplication fiscal. The provisional variant prices 100 sqft
          at the engineer unit rate (1200c) while the final variant prices the identical scope
          at the owner-submitted invoice (150000c repair cost), so the two variants of the same
          application yield 60000 vs 75000 cents — a 15000-cent divergence that must reconcile
          on the ProgramCycle ledger (committed released, disbursed booked).
        test_recipe:
          setup:
            - "OPEN cycle with appropriation_cents 10000000"
            - "owner (hardship NONE), LOCAL parcel, non-corner segment, one TRIP_HAZARD defect (offset 0.75, area 100)"
            - "notice issued at default clock; application qty 100 -> provisional 60000; APPROVED then OBLIGATED; inspection PASS by a different inspector"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Ann Arbor", mailing_address: "1 Main St", hardship_tier: "NONE" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-100", owner_id: "${owner_id}", street_address: "1 Main St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-100-1", length_ft: 20, width_ft: 5, is_corner_segment: false, has_existing_curb_ramp: false }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app_id: "$.data.id", prov_award: "$.data.provisional_award_cents" } }
            - { call: "POST /cost-share-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications/${app_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /repair-notices/${notice_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/reimburse", payload: { final_repair_cost_cents: 150000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { final_award: "$.data.final_award_cents", rev_status: "$.data.review_status", pay_status: "$.data.payment_status" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed: "$.data.committed_cents", disbursed: "$.data.disbursed_cents", available: "$.data.available_cents" } }
          assert:
            - "captured prov_award == 60000 (engineer-rate variant)"
            - "captured final_award == 75000 (actual-invoice variant) and != prov_award"
            - "rev_status == REIMBURSED and pay_status == DISBURSED"
            - "cycle committed == 0, disbursed == 75000, available == 9925000"

      - name: lien_statement_vs_payoff_quote_divergence
        grounds:
          - calculations.lien_interest_accrual
          - entities.LienCase.fields.accrued_interest_cents
          - endpoints: "GET /lien-cases/{id}/payoff-quote"
        distinguishing_aspect: |
          Entity domain: LienCase accrual (different domain from the CostShareApplication
          instance). The statement variant projects interest through the current clock day
          (day 30 -> 3616c) while the payoff-quote variant projects through clock + 15 days
          (day 45 -> 5425c) for the same lien row — identical stored state, two readings.
        test_recipe:
          setup:
            - "delinquent notice swept, city-repair batch awarded and verified, lien created with actual_repair_cost_cents 500000 on 2026-09-22 (owner_principal 550000 = 500000 + admin 50000, no city-tree credit), lien RECORDED"
            - "logical clock then advanced to 2026-10-22 (day 30 after assessment)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator }
            - { call: "POST /property-owners", payload: { full_name: "Bob Birch", mailing_address: "2 Oak St", hardship_tier: "NONE" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-200", owner_id: "${owner_id}", street_address: "2 Oak St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-200-1", length_ft: 10, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator, captures: { swept_n: "$.data.swept_notice_count" } }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-1", work_window_start: "2026-09-21", work_window_end: "2026-10-05", bid_deadline: "2026-09-21T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { item_id: "$.data.id" } }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1100, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/start-work", as: ProgramCoordinator }
            - { call: "POST /batch-work-items/${item_id}/complete", as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /batch-work-items/${item_id}/verify", as: Inspector, as_user_id: "insp-2" }
            - { call: "POST /lien-cases", payload: { notice_id: "${notice_id}", actual_repair_cost_cents: 500000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { lien_id: "$.data.id", principal: "$.data.owner_principal_cents" } }
            - { call: "POST /lien-cases/${lien_id}/record", as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-22T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "GET /lien-cases/${lien_id}", as: FinanceOfficer, captures: { stmt_interest: "$.data.accrued_interest_cents" } }
            - { call: "GET /lien-cases/${lien_id}/payoff-quote", as: FinanceOfficer, captures: { payoff_interest: "$.data.projected_interest_cents", payoff_total: "$.data.payoff_total_cents", good_through: "$.data.good_through_date" } }
          assert:
            - "captured principal == 550000"
            - "stmt_interest == 3616 (statement variant, day 30)"
            - "payoff_interest == 5425 (payoff variant, day 45) and != stmt_interest"
            - "payoff_total == 555425 and good_through == 2026-11-06"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_share_cap_clamp_with_ramp_branch
        grounds:
          - calculations.cost_share_pct
          - calculations.provisional_award
          - calculations.ramp_upgrade_trigger
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — share_pct is a capped tiered sum
          (min(90, 50 + street_bonus + hardship_bonus)) and the award applies a conditional
          ramp branch (100% city-paid 250000c) inside a nested min against PER_APPLICATION_CAP,
          so ARTERIAL + LOW_INCOME + corner-without-ramp pins share 90 and clamps 466000 -> 400000.
        test_recipe:
          setup:
            - "LOW_INCOME owner; ARTERIAL corner-lot parcel; corner segment without existing ramp; SPALLING defect area 20 (MAJOR); notice issued; application qty 200"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Cora Cedar", mailing_address: "3 Elm St", hardship_tier: "LOW_INCOME" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-300", owner_id: "${owner_id}", street_address: "3 Elm St", street_class: "ARTERIAL", is_corner_lot: true }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-300-1", length_ft: 40, width_ft: 5, is_corner_segment: true, has_existing_curb_ramp: false }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 200 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { share: "$.data.share_pct", ramp: "$.data.ramp_upgrade_required", prov: "$.data.provisional_award_cents" } }
          assert:
            - "share == 90 (min(90, 50+20+30))"
            - "ramp == true (corner segment without ramp in notice scope)"
            - "prov == 400000 (uncapped 216000 + 250000 = 466000 clamped to PER_APPLICATION_CAP_CENTS)"

      - name: lien_waterfall_payment_rounding_order
        grounds:
          - calculations.lien_interest_accrual
          - state_machines.LienCase.RECORDED_to_PARTIALLY_PAID
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — interest is rounded half-up to the
          cent at EACH payment event and applied interest-first; a single end-to-end rounding
          or principal-first order yields different cents. Pinned: day-20 payment leaves
          principal 452411; day-50 payment leaves 255386.
        test_recipe:
          setup:
            - "lien with owner_principal 550000 at 800bp assessed 2026-09-22, RECORDED (same city-repair chain as the lien statement instance, distinct parcel P-400)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Dan Dogwood", mailing_address: "4 Pine St", hardship_tier: "NONE" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-400", owner_id: "${owner_id}", street_address: "4 Pine St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-400-1", length_ft: 10, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-2", work_window_start: "2026-09-21", work_window_end: "2026-10-05", bid_deadline: "2026-09-21T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator, captures: { item_id: "$.data.id" } }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1100, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/award", as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/start-work", as: ProgramCoordinator }
            - { call: "POST /batch-work-items/${item_id}/complete", as: Contractor, as_user_id: "${contractor_id}" }
            - { call: "POST /batch-work-items/${item_id}/verify", as: Inspector, as_user_id: "insp-2" }
            - { call: "POST /lien-cases", payload: { notice_id: "${notice_id}", actual_repair_cost_cents: 500000 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { lien_id: "$.data.id" } }
            - { call: "POST /lien-cases/${lien_id}/record", as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-12T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /lien-cases/${lien_id}/payments", payload: { amount_cents: 100000 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { p1_principal: "$.data.principal_remaining_cents", p1_accrued: "$.data.accrued_interest_cents", p1_status: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-11T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /lien-cases/${lien_id}/payments", payload: { amount_cents: 200000 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { p2_principal: "$.data.principal_remaining_cents", p2_outstanding: "$.data.outstanding_balance_cents" } }
          assert:
            - "p1_principal == 452411 (interest 2411 rounded at the event, covered first; 97589 to principal)"
            - "p1_accrued == 0 and p1_status == PARTIALLY_PAID"
            - "p2_principal == 255386 (day-50 interest 2975 on the REDUCED principal 452411, not the original 550000)"
            - "p2_outstanding == 255386"

      - name: obligation_order_determines_cap_outcome
        grounds:
          - calculations.program_cap_reservation
          - state_machines.CostShareApplication.APPROVED_to_OBLIGATED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the cap check on obligation N depends on
          committed_cents, which is itself the result of prior obligation checks. The scaffold
          pins evaluate-at-request-time with NO priority by approval order, so obligating the
          second-approved application first succeeds and the first-approved then fails the cap.
        test_recipe:
          setup:
            - "cycle appropriation exactly 100000; two owners/parcels each with an issued notice; applications A1 (approved first) and A2 (approved second), each provisional 60000"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 100000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Ed Ash", mailing_address: "5 Ash St" }, as: ProgramCoordinator, captures: { owner1_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Fern Fig", mailing_address: "6 Fig St" }, as: ProgramCoordinator, captures: { owner2_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-501", owner_id: "${owner1_id}", street_address: "5 Ash St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel1_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-502", owner_id: "${owner2_id}", street_address: "6 Fig St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel2_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel1_id}", segment_code: "S-501-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg1_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel2_id}", segment_code: "S-502-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg2_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg1_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { def1_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg2_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 100 }, as: Inspector, as_user_id: "insp-1", captures: { def2_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel1_id}", defect_ids: ["${def1_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel2_id}", defect_ids: ["${def2_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice2_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice1_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /repair-notices/${notice2_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice1_id}", parcel_id: "${parcel1_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner1_id}", captures: { app1_id: "$.data.id" } }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice2_id}", parcel_id: "${parcel2_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 100 }, as: PropertyOwner, as_user_id: "${owner2_id}", captures: { app2_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app1_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications/${app2_id}/decision", payload: { outcome: "APPROVE" }, as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /cost-share-applications/${app2_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { a2_status: "$.data.review_status" } }
            - { call: "POST /cost-share-applications/${app1_id}/obligate", as: FinanceOfficer, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /program-cycles/${cycle_id}", as: ProgramCoordinator, captures: { committed: "$.data.committed_cents", available: "$.data.available_cents" } }
          assert:
            - "a2_status == OBLIGATED (the second-approved application obligates first and succeeds)"
            - "err == ERR_PROGRAM_CAP_EXCEEDED for the first-approved application (60000 + 60000 > 100000)"
            - "committed == 60000 and available == 40000"

  - rule_id: non_linear_state_machine
    instances:
      - name: notice_appeal_cycle_recomputes_deadline
        grounds:
          - state_machines.RepairNotice.ISSUED_to_UNDER_APPEAL
          - state_machines.RepairNotice.UNDER_APPEAL_to_ISSUED
          - calculations.compliance_deadline
        distinguishing_aspect: |
          Entity: RepairNotice — a true cycle (ISSUED -> UNDER_APPEAL -> ISSUED) that may be
          traversed repeatedly; each UPHELD decision replaces the deadline with
          decided_at + 15 days (2026-08-21 decision -> 2026-09-05), not an extension of the
          old one (2026-09-15 becomes unreachable).
        test_recipe:
          setup:
            - "owner NONE; parcel LOCAL; one defect; notice issued at default clock 2026-08-01 with default base 45 -> compliance_deadline 2026-09-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Gail Gale", mailing_address: "7 Gale St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-600", owner_id: "${owner_id}", street_address: "7 Gale St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
