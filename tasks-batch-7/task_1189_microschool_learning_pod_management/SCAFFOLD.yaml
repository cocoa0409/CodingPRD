# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this endpoint per RBAC matrix"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist (path-templated or body FK)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, wrong type, or fails basic format validation (e.g., malformed enum value, negative amount)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not valid from the entity's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch on expected_<parent>_version"
  - id: ERR_POD_FROZEN
    http: 409
    condition: "Pod.posture == FROZEN or CLOSED blocks the requested child mutation"
  - id: ERR_SAFETY_POLICY_MISSING
    http: 422
    condition: "No APPROVED SafetyPolicy present (or policy fails content requirements)"
  - id: ERR_EXEMPTION_NOT_ELIGIBLE
    http: 422
    condition: "Pod/FacilitySite does not meet licensing-exemption criteria (capacity > 10 or zoning not exemptible)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Reviewer X-User-ID equals filer X-User-ID on a RefundClaim decision"
  - id: ERR_GUIDE_WINDOW_OVERLAP
    http: 422
    condition: "GuideAssignment window overlaps another SCHEDULED/ACTIVE assignment for the same guide (inclusive both ends)"
  - id: ERR_CONFERENCE_OVERLAP
    http: 422
    condition: "ProgressConference window overlaps another non-terminal conference for the same guide (half-open [start, end))"
  - id: ERR_DUPLICATE_SEAT
    http: 422
    condition: "A Seat with seat_status in {RESERVED, ENROLLED} already exists for this (pod_id, student_id)"
  - id: ERR_CAPACITY_FULL
    http: 422
    condition: "Enrolling would exceed Pod.seat_capacity"
  - id: ERR_CURRICULUM_INADEQUATE
    http: 422
    condition: "Plan does not meet minute floor or grade-band coverage"
  - id: ERR_ENROLLMENT_OUT_OF_TERM
    http: 422
    condition: "Seat.enrolled_on lies outside [Pod.term_start_date, Pod.term_end_date]"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "GuideAssignment window_start_date > window_end_date, or window does not intersect pod term"
  - id: ERR_INVALID_CONFERENCE_WINDOW
    http: 422
    condition: "scheduled_start >= scheduled_end or window lies in the past"
  - id: ERR_INVALID_INVOICE_PERIOD
    http: 422
    condition: "billing_period_start > billing_period_end or due_date < billing_period_end"
  - id: ERR_INSUFFICIENT_VOUCHER_FUNDS
    http: 422
    condition: "Voucher-sourced payment exceeds disbursable balance, or voucher not VERIFIED, or voucher FROZEN"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Cleared payment would cause invoice paid_cents to exceed total_cents (non-voucher source)"
  - id: ERR_REFUND_EXCEEDS_CLAIM
    http: 422
    condition: "approved_amount_cents > claimed_amount_cents or < 0"
  - id: ERR_INVOICE_HAS_PAYMENTS
    http: 422
    condition: "Write-off attempted on invoice with paid_cents > 0"
  - id: ERR_VOUCHER_STUDENT_MISMATCH
    http: 422
    condition: "Student.esa_account_id references a VoucherAccount owned by a different student"
  - id: ERR_PLAN_NOT_APPROVED
    http: 422
    condition: "ProgressConference references a CurriculumPlan not in APPROVED status, or plan belongs to another pod"
  - id: ERR_GUIDE_INACTIVE
    http: 422
    condition: "GuideAssignment references a Guide whose guide_status != ACTIVE"
  - id: ERR_CONFERENCE_CYCLE_LIMIT
    http: 422
    condition: "Reschedule attempted when cycle_count >= 3"
  - id: ERR_CLAIM_ALREADY_EXISTS
    http: 422
    condition: "Ad-hoc RefundClaim filed when a non-terminal claim already exists for the same seat and kind"
  - id: ERR_NO_ENROLLED_SEATS_FOR_DISSOLUTION
    http: 422
    condition: "Dissolution cascade invoked on a pod whose state does not permit it"

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator-level administrator; superset of operational powers. Approves curriculum plans and safety policies, finalizes dissolution, disburses refunds, reverses payments, manages sites and guides."
    identity: "opaque"
    exclusive_operations:
      - "POST /pods/{id}/curriculum-plans/{plan_id}/approve"
      - "POST /pods/{id}/safety-policies/{policy_id}/approve"
      - "POST /pods/{id}/finalize-dissolution"
      - "POST /pods/{id}/refund-claims/{claim_id}/disburse"
      - "POST /payments/{id}/reverse"
      - "POST /facility-sites"
      - "POST /facility-sites/{id}/archive"
      - "POST /facility-sites/{id}/release"
      - "POST /guides"
      - "POST /guides/{id}/activate"
      - "POST /guides/{id}/deactivate"
      - "POST /voucher-accounts/{id}/release"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /pods, /pods/{id}, /pods/{id}/seats, /pods/{id}/guide-assignments, /pods/{id}/curriculum-plans, /pods/{id}/safety-policies, /pods/{id}/licensing-determinations, /pods/{id}/progress-conferences, /pods/{id}/refund-claims, /facility-sites, /facility-sites/{id}, /guides/{id}, /families/{id}, /families/{id}/students, /voucher-accounts, /voucher-accounts/{id}, /seats/{id}, /invoices/{id}, /payments/{id}, /refund-claims/{id}"

  - name: PodOperator
    description: "Runs a pod; owns day-to-day operations including staffing, invoicing, and initiating dissolution. Cannot approve its own plans or policies (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /pods"
      - "POST /pods/{id}/open-enrollment"
      - "POST /pods/{id}/revert-to-draft"
      - "POST /pods/{id}/dissolve"
      - "POST /pods/{id}/safety-policies"
      - "POST /pods/{id}/curriculum-plans"
      - "POST /pods/{id}/curriculum-plans/{plan_id}/submit"
      - "POST /pods/{id}/curriculum-plans/{plan_id}/revise"
      - "POST /pods/{id}/licensing-determinations"
      - "POST /pods/{id}/licensing-determinations/{det_id}/resubmit"
      - "POST /pods/{id}/guide-assignments"
      - "POST /pods/{id}/guide-assignments/{asg_id}/terminate"
      - "POST /pods/{id}/seats/{seat_id}/invoices"
      - "POST /pods/{id}/seats/{seat_id}/invoices/{invoice_id}/issue"
      - "POST /pods/{id}/seats/{seat_id}/invoices/{invoice_id}/write-off"
      - "POST /payments/{id}/clear"
      - "POST /payments/{id}/fail"
    shared_operations:
