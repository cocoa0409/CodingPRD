        there.
  - name: an_inherited_control_requires_an_authorized_source_offering
    claim_type: cross_entity
    grounds:
    - validations[priority=16]
    - errors[ERR_INHERITED_OFFERING_NOT_AUTHORIZED]
    excluded_because:
