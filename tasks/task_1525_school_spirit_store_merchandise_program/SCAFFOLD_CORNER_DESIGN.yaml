      - name: not_found_sweep_all_resources
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_NOT_FOUND]", "errors[ERR_VARIANT_NOT_FOUND]", "errors[ERR_DROP_NOT_FOUND]", "errors[ERR_PO_NOT_FOUND]", "errors[ERR_CAMPAIGN_NOT_FOUND]", "errors[ERR_PREORDER_NOT_FOUND]", "errors[ERR_EVENT_NOT_FOUND]", "errors[ERR_ORDER_NOT_FOUND]", "errors[ERR_EXCHANGE_NOT_FOUND]", "errors[ERR_ACCOUNT_NOT_FOUND]", "errors[ERR_ALLOCATION_RUN_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET with an unknown UUID returns its domain 404 — the whole not-found family is triggerable, one call per resource."
        test_recipe:
          setup: ["Program exists (no children needed)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector }
