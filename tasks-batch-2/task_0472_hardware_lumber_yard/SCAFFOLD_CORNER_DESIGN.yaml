              captures: { pco: $.data.id, pco_v0: $.data.version }
            - call: "POST /sales-orders/${pco}/lines"
              payload: { product_id: "${pcp}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${pco}/place"
              payload: { expected_sales_order_version: "${pco_v0}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${pco}/cancel"
              payload: {}
              as: SalesAssociate
          assert:
            - "SalesOrder.${pco}.fulfillment_status == CANCELLED"
            - "GET /sales-orders/${pco}/lines line.status == RESTOCKED"
