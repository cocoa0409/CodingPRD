      assert:
      - Product.${pr1_id}.status == DRAFT
      - Product.${pr1_id}.quantity_offered == 0 and Product.${pr1_id}.quantity_committed == 0 and Product.${pr1_id}.quantity_available == 0
      - Product.${pr1_id}.offer_window_start == null and Product.${pr1_id}.offer_window_end == null
  - name: product_quantity_available_is_computed_from_offer_minus_commitment
    claim_type: computed_fields
    grounds:
    - entities.Product.fields.quantity_available
    - calculations.line_allocation_waterfall
    - endpoints[POST /products/{id}/offers]
    distinguishing_aspect: 'quantity_available is derived, never stored from input: it reads 100 right after an offer of 100, and 40 after 60 units are committed by an aggregation run.'
    test_recipe:
      setup:
      - Producer P1 ACTIVE; Product PR1 LISTED with quantity_offered 100 and quantity_available 100.
      - Buyer B1 with an order O1 holding one 60-CASE line, still fulfillment_status DRAFT.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
