      - Listing.${lst1}.listing_status remains PENDING_REVIEW
      - the same listing with source_feed MLS approves cleanly — the gate is the (agreement, feed, state) triple, not the listing itself
- rule_id: resource_temporal_overlap
  instances:
  - name: duplicate_lead_30_day_window
    grounds:
    - validations[priority=9]
    - errors.ERR_DUPLICATE_LEAD
    distinguishing_aspect: 'Interval semantics: trailing 30-day half-open lookback window per

      (consumer_key, market) — an anchor at day 0 blocks a repeat at day 29

      (ERR_DUPLICATE_LEAD) but permits day 31, and a REJECTED_DUPLICATE anchor

      never blocks anyone; adjacency at exactly 30 days is outside the window.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market NC/27513 base 10000; agent W with 6000-bps ACTIVE order.
      - Lead for consumer c-t3@x.com created at day 0 (ASSIGNED to W).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '27513'
          state_code: NC
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt15: $.data.id
          mkt15_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B15 Realty
          primary_state: NC
        as: PlatformAdmin
        captures:
          bro15: $.data.id
      - call: POST /agents
        payload:
          full_name: W
          email: w@x.com
          license_number: L-W
          license_state: NC
          brokerage_id: ${bro15}
        as: PlatformAdmin
        captures:
          aw: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt15}
          buyer_agent_id: ${aw}
          share_bps: 6000
          duration_days: 60
        as: Agent
        as_user_id: ${aw}
        captures:
          ow: $.data.id
      - call: POST /share-orders/${ow}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt15_v}
        as: Agent
        as_user_id: ${aw}
      - call: POST /leads
        payload:
          market_id: ${mkt15}
          listing_id: null
          consumer_key: c-t3@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          ld15a: $.data.id
          ld15a_v: $.data.version
      - call: GET /leads/${ld15a}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asg15: $.data[0].id
      - call: POST /lead-assignments/${asg15}/accept
        payload:
          expected_lead_version: ${ld15a_v}
        as: Agent
        as_user_id: ${aw}
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-30T00:00:00Z'
        as: PlatformAdmin
      - call: POST /leads
        payload:
          market_id: ${mkt15}
          listing_id: null
          consumer_key: c-t3@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          dup29: $.data.id
          dup29_status: $.data.lead_status
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-10-02T00:00:00Z'
        as: PlatformAdmin
      - call: POST /leads
        payload:
          market_id: ${mkt15}
          listing_id: null
          consumer_key: c-t3@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          ok31: $.data.id
          ok31_status: $.data.lead_status
      assert:
      - dup29_status == REJECTED_DUPLICATE (29 days after the day-0 anchor is inside the trailing window)
      - Lead.${dup29}.duplicate_of_lead_id == ${ld15a}
      - ok31_status == ROUTED (31 days is outside the window; the repeat consumer is routable again)
      - Lead.${dup29} did not increment ShareOrder.${ow}.leads_charged (never charged)
  - name: share_capacity_disjoint_segments
    grounds:
    - validations[priority=7]
    - errors.ERR_SHARE_CAPACITY_EXCEEDED
    - entities.Market.fields.allocated_bps
    distinguishing_aspect: 'Different interval semantics on a different resource: the 10000-bps market

      share axis behaves like half-open disjoint segments [0,6000) and

      [6000,10000) — 6000+4000 fits exactly, but any third positive share

      overlaps capacity and is rejected; semantics are aggregate-capacity, not

      trailing-window.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market VA/22201 base 10000; agents H1 (6000 ACTIVE) and H2 (4000 PENDING); agent H3 wants 1 bps.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '22201'
          state_code: VA
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt16: $.data.id
          mkt16_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B16 Realty
          primary_state: VA
        as: PlatformAdmin
        captures:
          bro16: $.data.id
      - call: POST /agents
        payload:
          full_name: H1
          email: h1@x.com
          license_number: L-H1
          license_state: VA
          brokerage_id: ${bro16}
        as: PlatformAdmin
        captures:
          ah1: $.data.id
      - call: POST /agents
        payload:
          full_name: H2
          email: h2@x.com
          license_number: L-H2
          license_state: VA
          brokerage_id: ${bro16}
        as: PlatformAdmin
        captures:
          ah2: $.data.id
      - call: POST /agents
        payload:
          full_name: H3
          email: h3@x.com
          license_number: L-H3
          license_state: VA
          brokerage_id: ${bro16}
        as: PlatformAdmin
        captures:
          ah3: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt16}
          buyer_agent_id: ${ah1}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${ah1}
        captures:
          oh1: $.data.id
      - call: POST /share-orders/${oh1}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt16_v}
        as: Agent
        as_user_id: ${ah1}
      - call: POST /share-orders
        payload:
          market_id: ${mkt16}
          buyer_agent_id: ${ah2}
          share_bps: 4000
          duration_days: 30
        as: Agent
        as_user_id: ${ah2}
        captures:
          oh2: $.data.id
      trigger:
      - call: POST /share-orders/${oh2}/payments
        payload:
          amount_cents: 2375000
          outcome: SUCCEEDED
          expected_market_version: ${mkt16_v} + 1
        as: Agent
        as_user_id: ${ah2}
      - call: POST /share-orders
        payload:
          market_id: ${mkt16}
          buyer_agent_id: ${ah3}
          share_bps: 1
          duration_days: 30
        as: Agent
        as_user_id: ${ah3}
        captures:
          oh3: $.data.id
      - call: POST /share-orders/${oh3}/payments
        payload:
          amount_cents: 150
          outcome: SUCCEEDED
          expected_market_version: ${mkt16_v} + 2
        as: Agent
        as_user_id: ${ah3}
        captures:
          over_err: $.data.error_id
      assert:
      - 'H2''s 4000-bps activation succeeds at allocated 10000 exactly (6000 + 4000 == 10000 is allowed: boundary is inclusive of full capacity)'
      - over_err == ERR_SHARE_CAPACITY_EXCEEDED for even a 1-bps third order (10000 + 1 > 10000)
      - Market.${mkt16}.allocated_bps == 10000 and available_bps == 0
- rule_id: compensating_invariant
  instances:
  - name: market_share_conservation
    grounds:
    - state_machines.ShareOrder.PENDING_PAYMENT_to_ACTIVE
    - state_machines.ShareOrder.ACTIVE_to_PAUSED
    - state_machines.ShareOrder.PAUSED_to_ACTIVE
    - entities.Market.fields.allocated_bps
    - entities.Market.fields.available_bps
    distinguishing_aspect: 'Conserved quantity: share basis points. For every pause/resume pair and

      every activation/expiry pair, Market.allocated_bps + Market.available_bps

      == 10000 with zero drift — the compensating action restores exactly what

      the forward action consumed.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market PA/19101 base 10000; agent K with 6000-bps order.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '19101'
          state_code: PA
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt17: $.data.id
          mkt17_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B17 Realty
          primary_state: PA
        as: PlatformAdmin
        captures:
          bro17: $.data.id
      - call: POST /agents
        payload:
          full_name: K
          email: k@x.com
          license_number: L-K
          license_state: PA
          brokerage_id: ${bro17}
        as: PlatformAdmin
        captures:
          ak: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt17}
          buyer_agent_id: ${ak}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${ak}
        captures:
          ok: $.data.id
      trigger:
      - call: POST /share-orders/${ok}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt17_v}
        as: Agent
        as_user_id: ${ak}
        captures:
          mk_v1: $.data.id
      - call: POST /share-orders/${ok}/pause
        payload: {}
        as: Agent
        as_user_id: ${ak}
      - call: POST /share-orders/${ok}/resume
        payload: {}
        as: Agent
        as_user_id: ${ak}
      - call: GET /markets/${mkt17}
        payload: {}
        as: MarketplaceOps
        captures:
          alloc_end: $.data.allocated_bps
          avail_end: $.data.available_bps
      assert:
      - alloc_end == 6000 and avail_end == 4000 and alloc_end + avail_end == 10000 after the full activate->pause->resume round trip
      - ShareOrder.${ok}.order_status == ACTIVE after resume
      - 'invariant held at every step: allocated 0 -> 6000 -> 0 -> 6000, available the complement, never negative, never above 10000'
  - name: charge_credit_conservation
    grounds:
    - calculations.refund_credit
    - state_machines.CreditClaim.SUBMITTED_to_APPROVED
    - entities.ShareOrder.fields.charged_cents
    - entities.ShareOrder.fields.credits_cents
    distinguishing_aspect: 'Different conserved quantity: money. Charge 9000 (forward) then approve an

      INVALID claim for the full 9000 (compensation); the order''s net billed

      amount charged_cents - credits_cents returns to exactly 0 and the expiry

      sweep then takes the COMPLETED branch — drift of even one cent flips the

      terminal branch.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market MI/48201 base 10000; agent M with 6000-bps ACTIVE order duration 1 day; lead c-claim@x.com accepted
        by M at +60s (charged 9000).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '48201'
          state_code: MI
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt18: $.data.id
          mkt18_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B18 Realty
          primary_state: MI
        as: PlatformAdmin
        captures:
          bro18: $.data.id
      - call: POST /agents
        payload:
          full_name: M
          email: m@x.com
          license_number: L-M
          license_state: MI
          brokerage_id: ${bro18}
        as: PlatformAdmin
        captures:
          am: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt18}
          buyer_agent_id: ${am}
          share_bps: 6000
          duration_days: 1
        as: Agent
        as_user_id: ${am}
        captures:
          om: $.data.id
      - call: POST /share-orders/${om}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt18_v}
        as: Agent
        as_user_id: ${am}
      - call: POST /leads
        payload:
          market_id: ${mkt18}
          listing_id: null
          consumer_key: c-claim@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          ldm: $.data.id
          ldm_v: $.data.version
      - call: GET /leads/${ldm}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asgm: $.data[0].id
      - call: POST /lead-assignments/${asgm}/accept
        payload:
          expected_lead_version: ${ldm_v}
        as: Agent
        as_user_id: ${am}
      - call: POST /credit-claims
        payload:
          lead_id: ${ldm}
          claim_type: INVALID
          reason: fake number
        as: Agent
        as_user_id: ${am}
        captures:
          claimm: $.data.id
      trigger:
      - call: POST /credit-claims/${claimm}/resolve
        payload:
          resolution: APPROVED
        as: MarketplaceOps
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-02T00:00:01Z'
        as: PlatformAdmin
      - call: POST /ops-runs
        payload: {}
        as: MarketplaceOps
      - call: GET /share-orders/${om}
        payload: {}
        as: MarketplaceOps
        captures:
          om_status: $.data.order_status
          om_charged: $.data.charged_cents
          om_credited: $.data.credits_cents
      assert:
      - 'om_charged == 9000 and om_credited == 9000 and om_charged - om_credited == 0 (money conserved: forward charge fully compensated)'
      - om_status == COMPLETED (net zero routes the expiry sweep to COMPLETED, not CANCELLED)
      - CreditClaim.${claimm}.credit_cents == 9000 (INVALID -> full refund, not half)
