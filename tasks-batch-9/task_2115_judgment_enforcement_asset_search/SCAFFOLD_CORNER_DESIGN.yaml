          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The trigger request is issued with the X-User-Role header entirely omitted and returns ERR_UNAUTHENTICATED (401); the same request with X-User-Role: CaseManager returns 200."
        test_recipe:
          setup:
