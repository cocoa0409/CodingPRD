            - "step 5: Composer.${c2}.accrued_unpaid_cents == 11136 (PERFORMANCE 569 plus pool 10567)"
            - "BlanketAgreement.${ba1}.pool_distributed_cents == 85000 and pool_admin_fee_cents == 15000"
            - "BlanketAgreement.${ba1}.coverage_status == ACTIVE and reporting_status == COMPLIANT (neither axis is touched by acceptance)"

      - name: agreement_termination_withdraw_decline_credit_release_cascade
        grounds:
          - state_machines.ComposerAgreement.ACTIVE_to_TERMINATED
          - state_machines.Composition.AVAILABLE_to_WITHDRAWN
          - state_machines.SyncRequest.QUOTED_to_DECLINED
          - calculations.licensee_credit_exposure
          - entities.SyncRequest.fields.decline_reason
          - entities.Licensee.fields.reserved_spend_cents
          - entities.Licensee.fields.credit_available_cents
        distinguishing_aspect: |
          A depth-4 chain from a completely different trigger (agreement termination rather than usage
          report acceptance): terminate mutates the agreement, which is the only reason both governed
          compositions become WITHDRAWN, which is the only reason both open QUOTED sync requests become
          DECLINED with decline_reason CATALOG_WITHDRAWN, which is the only reason the licensee's
          reserved_spend_cents falls from 780000 to 0 and credit_available_cents returns to 10000000.
