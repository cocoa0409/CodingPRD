      - name: driver_needs_600_minutes_of_separation_not_merely_disjoint_duty
        grounds:
          - calculations.driver_rest_gap
          - calculations.driver_rest_gap.constants.MIN_REST_MINUTES
          - validations[priority 14 temporal]
          - errors.ERR_DRIVER_REST_GAP
          - endpoints[POST /fleet/trips/{trip_id}/assignments]
        distinguishing_aspect: |
          RESOURCE: a Driver. INTERVAL SEMANTICS: minimum-GAP - the third and
          strictest geometry. The two duty periods here never overlap at all,
          which would satisfy both the dock rule and the shop rule, yet the
          assignment is still refused because the separation is 599 minutes
          instead of 600. The comparison is strict `<`, so exactly 600 minutes
          is legal. Both probes use a tractor and trailer that no other trip
          holds, so the priority-10 availability check cannot pre-empt the
          answer, and both projected duties are far under the HOS ceilings so
          priority 12 cannot pre-empt it either.
