            - "the promotion is not silently dropped and the compose did not partially apply: no second order exists for the plan beyond ${order_err2a}"
            - "with no promotion_code the identical compose succeeds, so the refusal is attributable to the stacking guard alone"

      - name: unknown_destination_contractually_has_no_eligible_site
        claim_type: Violation to Error
        grounds:
          - errors.ERR_NO_ELIGIBLE_SITE
