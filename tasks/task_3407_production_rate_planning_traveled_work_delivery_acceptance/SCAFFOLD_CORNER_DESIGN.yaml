        claim_type: variant_divergence
        grounds:
          - "calculations.storage_preservation_fee"
        excluded_because:
          difficulty_instance: storage_fee_rounds_per_aircraft_before_program_sum
          rationale: "Rounding-order divergence is asserted there with exact per-aircraft and program totals."
