  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role/existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sites"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with HTTP 401"
      - name: forbidden_role_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "SafetyOfficer calling POST /api/invoices (BillingOperator-only) is rejected 403 ERR_FORBIDDEN even with a well-formed payload."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/invoices"
              payload: { site_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", supply_contract_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", period_start: "2026-10-01", period_end: "2026-11-01" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN with HTTP 403 (role check precedes existence: ids need not exist)"
      - name: occurrence_before_commission_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_STATION_NOT_COMMISSIONED]
        distinguishing_aspect: "A fueling event on a COMMISSIONED station but with occurred_at earlier than commissioned_at is rejected with ERR_STATION_NOT_COMMISSIONED — the temporal half of the rule, distinct from the status half covered in §1.8."
        test_recipe:
          setup:
            - "Commissioned station (commissioned at 2026-10-05); ACTIVE contract; event dated 2026-10-03 (before commissioning)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-V3", name: "Val Site 3", address: "3 Val Rd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.5, reliability_sla_pct: 99.0, committed_monthly_kg: 10 }
              as: SiteManager
              captures: { c: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${c}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-V3", location_type: "OUTDOOR", capacity_kg_per_day: 500, storage_capacity_kg: 1000, construction_start: "2026-10-01", construction_end: "2026-10-05" }
              as: SiteManager
              captures: { st: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf: $.data.id }
            - call: "POST /api/stations/${st}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/start-construction"
              payload: {}
              as: SiteManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/stations/${st}/commission"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/stations/${st}/fueling-events"
              payload: { forklift_id: "FL-V3", occurred_at: "2026-10-03T08:00:00Z", kg_dispensed: 10, supply_contract_id: "${c}" }
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STATION_NOT_COMMISSIONED (422): occurred_at 2026-10-03 precedes commissioned_at 2026-10-05"
      - name: indoor_commission_without_dispensing_permit_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INDOOR_DISPENSING_NOT_APPROVED]
        distinguishing_aspect: "An INDOOR station with CONSTRUCTION+FIRE issued but no DISPENSING_INDOOR permit cannot be commissioned; an OUTDOOR station with the same two permits can."
        test_recipe:
          setup: ["Two stations (INDOOR and OUTDOOR) both in CONSTRUCTION with CONSTRUCTION+FIRE permits issued"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-V4", name: "Val Site 4", address: "4 Val Rd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-IN", location_type: "INDOOR", capacity_kg_per_day: 100, storage_capacity_kg: 150, construction_start: "2026-10-01", construction_end: "2026-11-01" }
              as: SiteManager
              captures: { st_in: $.data.id }
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-OUT", location_type: "OUTDOOR", capacity_kg_per_day: 100, storage_capacity_kg: 500, construction_start: "2026-10-01", construction_end: "2026-11-01" }
              as: SiteManager
              captures: { st_out: $.data.id }
            - call: "POST /api/stations/${st_in}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc1: $.data.id }
            - call: "POST /api/stations/${st_in}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf1: $.data.id }
            - call: "POST /api/stations/${st_out}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc2: $.data.id }
            - call: "POST /api/stations/${st_out}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf2: $.data.id }
            - call: "POST /api/stations/${st_in}/permits/${pc1}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st_in}/permits/${pf1}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st_out}/permits/${pc2}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st_out}/permits/${pf2}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st_in}/start-construction"
              payload: {}
              as: SiteManager
            - call: "POST /api/stations/${st_out}/start-construction"
              payload: {}
              as: SiteManager
          trigger:
            - call: "POST /api/stations/${st_in}/commission"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/stations/${st_out}/commission"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "INDOOR commission rejected with ERR_INDOOR_DISPENSING_NOT_APPROVED (422)"
            - "OUTDOOR commission succeeds (construction_status COMMISSIONED)"
      - name: terminate_contract_with_open_invoice_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_OPEN_INVOICES_EXIST]
        distinguishing_aspect: "Terminating an ACTIVE contract while a DRAFT invoice references it is rejected with ERR_OPEN_INVOICES_EXIST; after voiding the invoice, termination succeeds."
