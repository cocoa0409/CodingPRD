  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_publish_blocked_when_supplier_certification_has_expired
        grounds:
          - state_machines.Certification.PROVISIONAL_to_EXPIRED
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - validations[priority=13]
          - errors.ERR_SUPPLIER_NOT_CERTIFIED
          - entities.Certification.fields.expires_at
        distinguishing_aspect: |
          Publishing an Offer depends on the state of a Certification two edges away: the PROVISIONAL
          certification decided on 2026-08-05 expires 90 days later on 2026-11-03, the clock sweep at
          2026-11-04 moves it to EXPIRED and suspends the Supplier, and the still-PENDING offer can no
          longer be published - a Certification-to-Offer entity pair.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z when the certification is decided PROVISIONAL, so expires_at is 2026-11-03T00:00:00Z."
            - "An ACTIVE AGENCY agreement 2026-08-01..2026-12-31 covering the offer's 2026-12-20 travel date."
            - "One PENDING offer for 2026-12-20 at net 24000 that was never published."
            - "The clock is then moved to 2026-11-04T00:00:00Z, firing the certification expiry sweep."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - call: "POST /certifications/${cert_h}/decide"
              payload: { decision: "PROVISIONAL", content_score: 88, connectivity_score: 91 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - call: "POST /rate-plans/${rp_h}/offers"
              payload: { travel_date: "2026-12-20", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_h_v}" }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { off_dec: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /offers/${off_dec}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
          assert:
            - "Certification.${cert_h}.expires_at == 2026-11-03T00:00:00Z and status == EXPIRED after the clock move"
            - "Supplier.${sup_h}.visibility_status == SUSPENDED and suspension_reason == CERTIFICATION_EXPIRED"
            - "the publish response is HTTP 422 with error_id ERR_SUPPLIER_NOT_CERTIFIED"
            - "Offer.${off_dec}.status is still PENDING"

      - name: package_price_blocked_when_a_component_offer_is_suppressed
        grounds:
          - state_machines.Offer.LIVE_to_SUPPRESSED
          - state_machines.Package.PRICED_to_DRAFT
          - validations[priority=26]
          - errors.ERR_COMPONENT_NOT_LIVE
          - concurrency_rules[package-price-stale-package]
        distinguishing_aspect: |
          Re-pricing a Package depends on the state of its component Offers: suppressing the air offer
          knocks the PRICED package back to DRAFT and clears its money fields, and the follow-up price call
          - even with a freshly read expected_package_version - is refused by ERR_COMPONENT_NOT_LIVE, an
          Offer-to-Package entity pair distinct from the Certification-to-Offer pair.
        test_recipe:
          setup:
            - "Hotel and air suppliers CERTIFIED with LIVE offers for 2026-09-20 (displays 198007 and 143106)."
            - "An opaque package holding both offers, already PRICED at package_total_cents 310413."
            - "The air offer is then SUPPRESSED, which cascades the package back to DRAFT."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_t7
            - *k_off_t7
            - *k_off_t7_pub
            - *k_sup_a
            - *k_cert_a_sub
            - *k_cert_a_rev
            - *k_cert_a_dec
            - *k_ma_a
            - *k_ma_a_act
            - *k_rp_a
            - *k_off_a
            - *k_off_a_pub
            - *k_pkg
            - *k_pkg_cmp_h
            - *k_pkg_cmp_a
            - *k_pkg_read
            - *k_pkg_price
            - call: "POST /offers/${off_a}/suppress"
              payload: { suppression_reason: "schedule change withdrawn by the airline" }
              as: CommercialManager
              as_user_id: "cm-1"
            - call: "GET /packages/${pkg}"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { pkg_v2: $.data.version }
          trigger:
            - call: "POST /packages/${pkg}/price"
              payload: { expected_package_version: "${pkg_v2}" }
              as: CommercialManager
              as_user_id: "cm-2"
          assert:
            - "after the suppression Package.${pkg}.status == DRAFT and priced_at == null"
            - "Offer.${off_a}.status == SUPPRESSED and suppression_reason == 'schedule change withdrawn by the airline'"
            - "the price response is HTTP 422 with error_id ERR_COMPONENT_NOT_LIVE"
            - "the response error_id is NOT ERR_STALE_VERSION because expected_package_version was re-read after the cascade"
            - "Package.${pkg}.status is still DRAFT and package_total_cents is still null"

  - rule_id: resource_temporal_overlap
    instances:
      - name: model_agreement_closed_interval_touching_end_date_is_an_overlap
        grounds:
          - validations[priority=14]
          - errors.ERR_MODEL_AGREEMENT_OVERLAP
          - state_machines.ModelAgreement.DRAFT_to_ACTIVE
          - entities.ModelAgreement.fields.effective_from
          - entities.ModelAgreement.fields.effective_to
        distinguishing_aspect: |
          ModelAgreement windows are CLOSED intervals, so a candidate starting 2026-09-30 - the exact
          effective_to of the ACTIVE agreement - shares that one day and is rejected, while a candidate
          starting 2026-10-01 activates; the touching endpoint collides.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; hotel supplier exists."
            - "Agreement A1 AGENCY 2026-08-01..2026-09-30 is ACTIVE."
            - "Agreement A2 AGENCY 2026-09-30..2026-12-31 and agreement A3 MERCHANT 2026-10-01..2026-12-31 are both DRAFT."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - call: "POST /suppliers/${sup_h}/model-agreements"
              payload: { model: "AGENCY", effective_from: "2026-08-01", effective_to: "2026-09-30", base_commission_pct: 0.15, chargeback_liability_pct_marketplace: 0.60, fraud_liability_cap_cents: 50000, settlement_terms_days: 30 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ag1: $.data.id }
            - call: "POST /model-agreements/${ag1}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /suppliers/${sup_h}/model-agreements"
              payload: { model: "AGENCY", effective_from: "2026-09-30", effective_to: "2026-12-31", base_commission_pct: 0.18, chargeback_liability_pct_marketplace: 0.55, fraud_liability_cap_cents: 60000, settlement_terms_days: 30 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ag2: $.data.id }
            - call: "POST /suppliers/${sup_h}/model-agreements"
              payload: { model: "MERCHANT", effective_from: "2026-10-01", effective_to: "2026-12-31", base_markup_pct: 0.14, chargeback_liability_pct_marketplace: 0.30, fraud_liability_cap_cents: 80000, settlement_terms_days: 45 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ag3: $.data.id }
          trigger:
            - call: "POST /model-agreements/${ag2}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /model-agreements/${ag3}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "activating ${ag2} returns HTTP 409 with error_id ERR_MODEL_AGREEMENT_OVERLAP and ModelAgreement.${ag2}.status stays DRAFT"
            - "activating ${ag3} returns HTTP 200 with ModelAgreement.${ag3}.status == ACTIVE and activated_by_user_id == co-1"
            - "ModelAgreement.${ag1}.status is still ACTIVE and was not superseded, because ag3.effective_from != ag1.effective_from"
            - "Supplier.${sup_h}.current_model == AGENCY at the 2026-08-05 clock date, since A1 covers it"

      - name: placement_half_open_windows_allow_adjacency_but_reject_day_overlap
        grounds:
          - calculations.placement_slot_capacity
          - validations[priority=15]
          - errors.ERR_PLACEMENT_CAPACITY_EXCEEDED
          - entities.PlacementAgreement.fields.window_start
          - entities.Market.fields.paid_slot_capacity
        distinguishing_aspect: |
          PlacementAgreement windows are HALF-OPEN, the opposite interval semantics from ModelAgreement: a
          candidate starting 2026-09-11 - the exact window_end of the ACTIVE agreement - shares no day and
          is approved, whereas a candidate starting 2026-09-10 collides on that single day and pushes the
          aggregate to 4 slots against a capacity of 3; filling capacity exactly to 3 is still allowed
          because the comparison is a strict >.
        test_recipe:
          setup:
            - "Market EU-PAR has paid_slot_capacity 3; hotel supplier exists."
            - "P1 with slots 2 over [2026-09-01, 2026-09-11) is ACTIVE."
            - "P2 with slots 2 over [2026-09-10, 2026-09-20), P3 with slots 2 over [2026-09-11, 2026-09-21) and P4 with slots 1 over [2026-09-11, 2026-09-12) are PROPOSED."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - call: "POST /placement-agreements"
              payload: { supplier_id: "${sup_h}", market_id: "${mkt_id}", slots: 2, boost_points: 6, fee_cents: 400000, disclosure_label: "SPONSORED", window_start: "2026-09-01", window_end: "2026-09-11" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { p1: $.data.id }
            - call: "POST /placement-agreements/${p1}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /placement-agreements"
              payload: { supplier_id: "${sup_h}", market_id: "${mkt_id}", slots: 2, boost_points: 6, fee_cents: 400000, disclosure_label: "SPONSORED", window_start: "2026-09-10", window_end: "2026-09-20" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { p2: $.data.id }
            - call: "POST /placement-agreements"
              payload: { supplier_id: "${sup_h}", market_id: "${mkt_id}", slots: 2, boost_points: 6, fee_cents: 400000, disclosure_label: "PREFERRED_PARTNER", window_start: "2026-09-11", window_end: "2026-09-21" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { p3: $.data.id }
            - call: "POST /placement-agreements"
              payload: { supplier_id: "${sup_h}", market_id: "${mkt_id}", slots: 1, boost_points: 3, fee_cents: 90000, disclosure_label: "SPONSORED", window_start: "2026-09-11", window_end: "2026-09-12" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { p4: $.data.id }
          trigger:
            - call: "POST /placement-agreements/${p2}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /placement-agreements/${p3}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /placement-agreements/${p4}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "approving ${p2} returns HTTP 409 with error_id ERR_PLACEMENT_CAPACITY_EXCEEDED because 2026-09-10 would hold 2 + 2 = 4 slots against capacity 3"
            - "PlacementAgreement.${p2}.status stays PROPOSED"
            - "approving ${p3} returns HTTP 200 with status ACTIVE: window_start 2026-09-11 equals P1's window_end so they share no day"
            - "approving ${p4} returns HTTP 200 with status ACTIVE: 2026-09-11 then holds exactly 2 + 1 = 3 slots, which the strict > comparison allows"
            - "PlacementAgreement.${p1}.status is still ACTIVE and its slots were never consumed by the rejected candidate"

  - rule_id: compensating_invariant
    instances:
      - name: cancel_then_reverse_refund_restores_the_charged_total_decomposition
        grounds:
          - calculations.refund_passthrough_due
          - calculations.dispute_settlement_total
          - calculations.dispute_liability_split
          - state_machines.Booking.REFUNDED_PARTIAL_to_CAPTURED
          - entities.Booking.fields.last_refund_clawback_cents
        distinguishing_aspect: |
          The conserved quantity is charged_total_cents == supplier_payable_cents + marketplace_margin_cents
          + taxes_fees_cents + refunded_cents. A 50 percent cancellation moves 12120 cents out of the three
          retained components into refunded_cents, and resolving the resulting dispute REVERSE_REFUND must
          push exactly those three stored last_refund_* amounts back where they came from - not recompute
          them - so the identity reads 24240 before the cancel, after the cancel and after the reversal,
          and the three components return to their original 20400 / 3600 / 240 rather than to some
          re-derived split.
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier on an ACTIVE AGENCY agreement 2026-08-01..2026-12-31 (0.15 commission, chargeback_liability_pct_marketplace 0.60)."
            - "A FLEX rate plan with free_cancel_cutoff_hours 48 and tax_fee_pct 0.01."
            - "A LIVE offer for 2026-09-20 at net 24000, so gross 24000, margin 3600, taxes 240, display 24240 and payable 20400."
            - "A booking on that offer for 24240 that has been CAPTURED, so charged_total_cents is 24240 and refunded_cents is 0."
            - "The clock is moved to 2026-09-18T16:00:00Z, exactly 47 hours before the 2026-09-20T15:00:00Z arrival, so FLEX pays 0.50."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
            - *k_bk_h
            - call: "POST /bookings/${bk_h}/capture"
              payload: {}
              as: BookingAgent
              as_user_id: "ba-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T16:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /bookings/${bk_h}/cancel"
              payload: { cancellation_reason: "traveller withdrew inside the free cancellation window" }
              as: BookingAgent
              as_user_id: "ba-1"
            - call: "POST /bookings/${bk_h}/dispute-cases"
              payload: { dispute_type: "REFUND_PASSTHROUGH", claim_cents: 12120, narrative: "supplier asserts the cancellation was mis-scored and the refund must be reversed" }
              as: ComplianceOfficer
              as_user_id: "co-3"
              captures: { dc_rev: $.data.id }
          trigger:
            - call: "POST /dispute-cases/${dc_rev}/resolve"
              payload: { outcome: "REVERSE_REFUND", note: "mediation found for the supplier; the refund is reversed in full" }
              as: ComplianceOfficer
              as_user_id: "co-4"
          assert:
            - "before the cancel: charged_total 24240 == payable 20400 + margin 3600 + taxes 240 + refunded 0"
            - "after the cancel: cancellation_refund_pct == 0.50, refunded_cents == 12120, marketplace_margin_cents == 1800, supplier_payable_cents == 10200, taxes_fees_cents == 120 and the identity still sums to 24240"
            - "after the cancel the stored reversal ledger is last_refund_clawback_cents 1800, last_refund_supplier_debit_cents 10200, last_refund_tax_cents 120 (12120 in total) and payment_status == REFUNDED_PARTIAL"
            - "DisputeCase.${dc_rev} at filing: refund_due_cents 12120, mediation_fee_pct 0.020, mediation_fee_cents 2742, settlement_total_cents 14862"
            - "DisputeCase.${dc_rev} preliminary split from the 0.60 filing agreement: preliminary_marketplace_cents 8917, preliminary_supplier_cents 5945"
            - "DisputeCase.${dc_rev} after resolve: outcome REVERSE_REFUND, uncapped_marketplace_cents 0, binding_marketplace_cents 0, binding_supplier_cents 14862, status RESOLVED, resolved_by_user_id co-4"
            - "after the reversal: payment_status == CAPTURED, refunded_cents == 0, marketplace_margin_cents == 3600, supplier_payable_cents == 20400, taxes_fees_cents == 240 - byte-for-byte the pre-cancel decomposition"
            - "all three last_refund_* fields are back to 0, so a second REVERSE_REFUND would have nothing to restore"
            - "fulfillment_status is still CANCELLED: the reversal compensates only the payment dimension"

      - name: confirm_then_cancel_conserves_the_offer_allotment_identity
        grounds:
          - entities.Offer.fields.allotment_remaining
          - state_machines.Booking.RESERVED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.refund_passthrough_due
          - validations[priority=32]
        distinguishing_aspect: |
          The conserved quantity is allotment_total == allotment_remaining + allotment_held +
          allotment_sold, which must hold after every write even though each write moves a unit between a
          different pair of buckets: booking moves remaining -> held, confirming moves held -> sold, and
          cancelling from CONFIRMED moves sold -> remaining. The full-refund cancel also drives
          the money identity to its degenerate 0 / 0 / 0 / 24240 form, so both invariants are checked on
          one timeline.
        test_recipe:
          setup:
            - "The same CERTIFIED hotel supplier, ACTIVE AGENCY agreement and FLEX rate plan (cutoff 48, tax 0.01)."
            - "A LIVE offer for 2026-09-20 at net 24000 with allotment_total 3, so remaining 3 / held 0 / sold 0."
            - "The clock stays at 2026-08-05T00:00:00Z, far outside the 48 hour cutoff, so the cancel refunds 1.00."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
            - *k_bk_h
            - call: "POST /bookings/${bk_h}/capture"
              payload: {}
              as: BookingAgent
