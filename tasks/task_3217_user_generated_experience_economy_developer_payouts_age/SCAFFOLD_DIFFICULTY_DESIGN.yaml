  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: safety_vs_fiscal_on_purchase_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_PARENTAL_SPEND_LIMIT
          - errors.ERR_INSUFFICIENT_ROBUX
        distinguishing_aspect: |
          business_safety (priority 5) beats business_fiscal (priority 8) when
          both fire on PurchaseOrder.confirm: a CHILD with parental spend limit
          already exhausted AND a zero Robux balance sees ERR_PARENTAL_SPEND_LIMIT,
          NOT ERR_INSUFFICIENT_ROBUX.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ADULT parent user and CHILD user (DOB 2020-01-01) linked via parent_user_id."
            - "ParentalControls on the child: monthly_spend_limit_robux = 100; child has already spent 100 this month."
            - "Child robux_balance == 0."
            - "A marketplace item ON_SALE at price 50."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "par_e", email: "par_e@x.com", date_of_birth: "1985-01-01" }
              as: Anonymous
              captures: { par_e_id: $.data.id, par_e_v: $.data.version }
            - call: "POST /ugc/users"
              payload: { username: "kid_e", email: "kid_e@x.com", date_of_birth: "2020-01-01", parent_user_id: "${par_e_id}" }
              as: Anonymous
              captures: { kid_e_id: $.data.id }
            - call: "POST /ugc/users/${par_e_id}/parental-controls"
              payload: { child_user_id: "${kid_e_id}", monthly_spend_limit_robux: 100, chat_mode: "FILTERED", pin_hash: "hash1234", expected_user_version: "${par_e_v}" }
              as: Creator
              as_user_id: "${par_e_id}"
            - call: "POST /ugc/users"
              payload: { username: "seller_e", email: "sel_e@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { seller_e_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Hat", item_kind: "HAT", price_robux: 50 }
              as: Creator
              as_user_id: "${seller_e_id}"
              captures: { item_e_id: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_e_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${seller_e_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { item_sub_e: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${item_sub_e}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 500, payment_method_token: "tok", idempotency_key: "kid-cur" }
              as: Creator
              as_user_id: "${kid_e_id}"
              captures: { kid_cur: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${kid_cur}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${kid_e_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_e_id}", price_robux: 50, idempotency_key: "po-e1" }
              as: Creator
              as_user_id: "${kid_e_id}"
              captures: { po_e1: $.data.id }
            - call: "POST /ugc/purchase-orders/${po_e1}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${kid_e_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_e_id}", price_robux: 50, idempotency_key: "po-e2" }
              as: Creator
              as_user_id: "${kid_e_id}"
              captures: { po_e2: $.data.id }
            - call: "POST /ugc/purchase-orders/${po_e2}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${kid_e_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_e_id}", price_robux: 50, idempotency_key: "po-e3" }
              as: Creator
              as_user_id: "${kid_e_id}"
              captures: { po_e3: $.data.id }
          trigger:
            - call: "POST /ugc/purchase-orders/${po_e3}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${kid_e_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "After the first two confirms the child has spent 100 Robux this month and balance == 350 (initial 400 from cur tier1 500*0.8=400, minus 50-50)."
            - "Wait — tiered: 500 cents @ 0.80 = 400 robux. Balance after two 50-robux purchases = 300. Third confirm would need 50 -> balance sufficient BUT monthly spend = 100 already at limit, so new spend 100+50 = 150 >= 100 triggers ERR_PARENTAL_SPEND_LIMIT."
            - "The trigger response status is 403 and error_id == ERR_PARENTAL_SPEND_LIMIT"
            - "error_id != ERR_INSUFFICIENT_ROBUX even though after this purchase the balance would still be 250 (sufficient) — the safety check short-circuits first"

      - name: state_vs_referential_on_appeal_file
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SUBMISSION_NOT_REJECTED
        distinguishing_aspect: |
          state (priority 4) beats business_referential (priority 7) when both
          fire on ModerationAppeal create: filing an appeal against a
          submission that does not exist (path-validated) AND is in a state
          other than REJECTED reports the state error, but here we test the
          reverse pair: an appeal against a submission that is APPROVED fires
          ERR_SUBMISSION_NOT_REJECTED (priority 7) when the submission entity
          itself exists and is in a valid lifecycle state — the referential
          check is what catches it. The dual-failure setup pairs a SUSPENDED
          appellant (state priority 4: user must be ACTIVE to file) with a
          non-REJECTED submission (priority 7): the state error wins.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One creator whose account is SUSPENDED."
            - "One ModerationSubmission in APPROVED status (not REJECTED)."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "cr_f", email: "cr_f@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cr_f_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "World F", description: "f" }
              as: Creator
              as_user_id: "${cr_f_id}"
              captures: { exp_f_id: $.data.id }
            - call: "POST /ugc/experiences/${exp_f_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${cr_f_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "EXPERIENCE" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_f_id: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_f_id}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/users/${cr_f_id}/suspend"
              payload: { reason: "test" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ugc/moderation-appeals"
              payload: { submission_id: "${sub_f_id}", reason: "please reverse this decision" }
              as: Creator
              as_user_id: "${cr_f_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The trigger response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_SUBMISSION_NOT_REJECTED even though the submission is APPROVED, because the state check on the appellant runs at priority 4 and short-circuits before the priority-7 referential check"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: parental_spend_limit_exactly_at_limit_rejected
        grounds:
          - calculations.parental_monthly_spend_check
          - errors.ERR_PARENTAL_SPEND_LIMIT
        distinguishing_aspect: |
          Numeric threshold metric: the monthly spend limit is a >= comparison
          (STRICT rejection at exactly the limit, not >). A purchase that would
          bring the monthly total to exactly monthly_spend_limit_robux is
          REJECTED. This is the opposite convention from most cap rules and is
          reachable through POST /ugc/purchase-orders/{id}/confirm.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Parent + CHILD (DOB 2020-01-01) linked. ParentalControls monthly_spend_limit_robux = 200, no prior spend this month."
            - "Child has robux_balance 1000 (funded via currency purchase)."
            - "One marketplace item ON_SALE at price 200."
