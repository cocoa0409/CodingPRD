scenario: "2235. Curtain Wall Fabrication & Installation (curtain wall subcontractor): design-assist engineering with performance mockup and testing requirements, shop drawing and structural calculation submittal cycles with delegated design responsibility, unitized versus stick-built system decision affecting fabrication and field labor, glass procurement lead times, coating specification and breakage replacement stock, anchor embed coordination with the structural contractor before concrete pour, hoisting, staging and installation sequence by floor with weather-tightness milestones, water and air infiltration field testing with remediation, thermal movement, deflection tolerances and punch-list closure"
domain_name: curtain-wall-fabrication-installation
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys in request bodies; only
  # ownership-obvious children (crew days, embed surveys, field tests) hang
  # off a single parent segment. No deep nesting anywhere.

  state_machine_shape: cyclic
  # ShopDrawingSubmittal loops SUBMITTED -> UNDER_REVIEW -> REVISION_REQUIRED ->
  # SUBMITTED (delegated-design resubmittal rounds); AnchorEmbedSurvey loops
  # REJECTED -> REJECTED/ACCEPTED on re-survey; DefectItem loops
  # OPEN -> REMEDIATION_SUBMITTED -> OPEN on failed re-inspection; GlassOrder
  # loops IN_PRODUCTION -> ORDERED on coating re-fire; InstallationZone carries
  # two independent axes (install_status x weather_status) and its weather axis
  # loops WEATHER_TIGHT -> REMEDIATION -> WEATHER_TIGHT.

  relationship_patterns:
    - one_to_many          # FacadePackage -> zones / submittals / glass orders / rigs
    - self_referential     # MockupTest.retest_of_test_id -> MockupTest.id
    - cross_aggregate      # FabricationRelease spans ShopDrawingSubmittal + GlassOrder + InstallationZone
    - polymorphic          # DefectItem origin ∈ {MOCKUP_TEST, FIELD_TEST, PUNCH_LIST} with kind-specific nullable FKs

  role_model: segregation_of_duties
  # The engineer who seals a delegated-design submittal may not review it; the
  # inspector who raised a defect may not re-inspect it; only the structural
  # contractor may survey/confirm the embed pour that the curtain wall
  # detailer laid out.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: FacadePackage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Contract scope name for the building facade package
      - name: floor_count
        type: integer
        source: input
        description: Number of building floors in scope
        constraints: ">= 1"
      - name: total_area_sqm
        type: number
        source: input
        description: Contracted curtain wall area in square metres
        constraints: "> 0"
      - name: contract_value_cents
        type: integer
        source: input
        description: Subcontract value in cents
        constraints: "> 0"
      - name: unit_rate_cents_per_sqm
        type: integer
        source: input
        description: Certification unit rate in cents per square metre, used by earned_value_certified_cents
        constraints: "> 0"
      - name: base_labor_rate_cents_per_hour
        type: integer
        source: input
        description: Straight-time field labor rate in cents per person-hour
        constraints: "> 0"
      - name: design_temp_delta_c
        type: number
        source: input
        description: Design temperature swing in Celsius used by thermal_movement_allowance_mm
        constraints: "> 0"
      - name: weather_tightness_deadline_date
        type: string
        source: input
        description: Contract weather-tightness milestone date (YYYY-MM-DD, UTC calendar date)
      - name: system_type
        type: enum
        source: input
        description: Curtain wall system decision, set only by POST /facade-packages/{id}/system-decision
        default: UNDECIDED
        constraints: "UNDECIDED | UNITIZED | STICK_BUILT"
      - name: state
        type: enum
        source: system
        description: Package lifecycle state
        default: DESIGN_ASSIST
        constraints: "DESIGN_ASSIST | SYSTEM_SELECTED | MOCKUP_QUALIFIED | IN_FABRICATION | IN_INSTALLATION | WEATHER_TIGHT_ACHIEVED | CLOSED_OUT"
      - name: engineering_posture
        type: enum
        source: computed
        description: Derived gate over child submittal/defect state; see calculations.engineering_posture
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: blocking_submittal_count
        type: integer
        source: computed
        description: Count of ShopDrawingSubmittal rows of this package with state IN {REVISION_REQUIRED, ESCALATED}
        default: 0
      - name: open_critical_defect_count
        type: integer
        source: computed
        description: Count of DefectItem rows of this package with severity == CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED}
        default: 0
      - name: planned_shop_hours
        type: integer
        source: computed
        description: Shop fabrication hours implied by the system decision branch
        default: 0
      - name: planned_field_crew_size
        type: integer
        source: computed
        description: Planned field crew headcount implied by the system decision branch
        default: 0
      - name: certified_area_sqm
        type: number
        source: computed
        description: Sum of area_sqm over this package's zones in the certified set (see calculations.earned_value_certified_cents)
        default: 0
      - name: earned_value_certified_cents
        type: integer
        source: computed
        description: Certified earned value net of retention; see calculations.earned_value_certified_cents
        default: 0
      - name: retention_held_cents
        type: integer
        source: computed
        description: Retention withheld from the certified subtotal
        default: 0
      - name: mockup_qualified
        type: boolean
        source: computed
        description: True once a MockupTest of this package reached state PASSED
        default: false
      - name: weather_tight_zone_count
        type: integer
        source: computed
        description: Count of this package's zones with weather_status == WEATHER_TIGHT
        default: 0

  - name: ShopDrawingSubmittal
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> FacadePackage.id
      - name: submittal_type
        type: enum
        source: input
        description: Submittal class
        constraints: "SHOP_DRAWING | STRUCTURAL_CALCULATION | COATING_SPEC | MOCKUP_TEST_PLAN"
      - name: title
        type: string
        source: input
        description: Submittal title
      - name: drawing_set_ref
        type: string
        source: input
        description: Current drawing/calculation set revision reference
      - name: delegated_design_scope
        type: boolean
        source: input
        description: True when the submittal carries delegated design responsibility and therefore requires a professional seal before review
        default: false
      - name: state
        type: enum
        source: system
        description: Submittal review state
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | REVISION_REQUIRED | APPROVED | APPROVED_AS_NOTED | ESCALATED | VOIDED"
      - name: revision_cycle
        type: integer
        source: system
        description: Review round counter; starts at 1 and increments on every resubmittal
        default: 1
      - name: sealed_by_user_id
        type: string
        source: system
        description: X-User-ID of the DelegatedEngineer who sealed this submittal; null when unsealed
        default: null
      - name: seal_license_no
        type: string
        source: input
        description: Professional engineer licence number captured at seal time
        default: null
      - name: sealed_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the seal
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ArchitectOfRecord who recorded the latest review decision
        default: null
      - name: review_decision
        type: enum
        source: system
        description: Latest recorded review decision
        default: null
        constraints: "APPROVED | APPROVED_AS_NOTED | REVISION_REQUIRED"
      - name: open_notes_count
        type: integer
        source: system
        description: Reviewer notes carried by an APPROVED_AS_NOTED decision that must be cleared before close-out
        default: 0
      - name: escalation_ref
        type: string
        source: input
        description: Delegated-design dispute reference recorded when the submittal escalates
        default: null

  - name: FabricationRelease
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> FacadePackage.id
      - name: submittal_id
        type: string
        source: input
        description: FK -> ShopDrawingSubmittal.id; the approved submittal authorising fabrication
      - name: glass_order_id
        type: string
        source: input
        description: FK -> GlassOrder.id; the glass the released lots draw from
      - name: zone_ids
        type: array
        source: input
        description: InstallationZone ids covered by this release; each id must reference an InstallationZone whose package_id equals this release's package_id, validated left-to-right
      - name: panels_per_zone
        type: integer
        source: input
        description: Panels fabricated per covered zone
        constraints: ">= 1"
      - name: lites_per_panel
        type: integer
        source: input
        description: Glass lites consumed per panel
        constraints: ">= 1"
      - name: state
        type: enum
        source: system
        description: Release lifecycle state
        default: RELEASED
        constraints: "RELEASED | REVOKED | CLOSED"
      - name: system_type_at_release
        type: enum
        source: system
        description: Copy of FacadePackage.system_type pinned at release time
        constraints: "UNITIZED | STICK_BUILT"
      - name: lot_count
        type: integer
        source: computed
        description: Number of PanelLot rows created by this release (one per covered zone)
        default: 0
      - name: revoked_reason
        type: enum
        source: system
        description: Why the release was revoked
        default: null
        constraints: "SUBMITTAL_REVISION | GLASS_RE_FIRE"
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock timestamp of release

  - name: GlassOrder
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> FacadePackage.id
      - name: supplier_name
        type: string
        source: input
        description: Glass fabricator name
      - name: coating_code
        type: string
        source: input
        description: Current low-e coating specification code
      - name: quoted_lead_time_days
        type: integer
        source: input
        description: Supplier quoted lead time in days from order placement
        constraints: ">= 1"
      - name: ordered_lites
        type: integer
        source: input
        description: Lites ordered
        constraints: ">= 1"
      - name: expedite_authorized
        type: boolean
        source: input
        description: True when an expedite premium has been authorised, shortening effective lead time
        default: false
      - name: expedite_tier
        type: integer
        source: system
        description: "Expedite tier bought so far (0 = none); each tier credits EXPEDITE_RECOVERY_DAYS in calculations.glass_procurement_risk_score. Set by POST /glass-orders/{id}/request-expedite."
        default: 0
        constraints: "0 | 1 | 2"
      - name: state
        type: enum
        source: system
        description: Procurement state
        default: ORDERED
        constraints: "ORDERED | IN_PRODUCTION | RECEIVED | CLOSED"
      - name: coating_revision_count
        type: integer
        source: system
        description: Number of coating specification revisions applied after order placement
        default: 0
      - name: re_fire_required
        type: boolean
        source: system
        description: True once a coating revision forces the lites to be re-fired
        default: false
      - name: risk_variant
        type: enum
        source: computed
        description: Which variant of calculations.glass_procurement_risk_score produced risk_score
        default: NOMINAL
        constraints: "NOMINAL | EXPEDITE_ADJUSTED"
      - name: risk_score
        type: number
        source: computed
        description: Procurement risk score 0.00-100.00; see calculations.glass_procurement_risk_score
        default: 0
      - name: risk_flag
        type: boolean
        source: computed
        description: True when risk_score >= RISK_HOLD_THRESHOLD (70.00)
        default: false
      - name: effective_lead_days
        type: number
        source: computed
        description: Lead days the risk variant in force used
        default: 0
      - name: received_lites
        type: integer
        source: system
        description: Lites recorded at receipt
        default: 0
      - name: breakage_stock_lites
        type: integer
        source: computed
        description: floor(received_lites * BREAKAGE_STOCK_PCT) held back as breakage replacement stock
        default: 0
      - name: allocated_lites
        type: integer
        source: computed
        description: Sum of lite_count over every PanelLot row whose glass_order_id equals this order, in any fabrication_status (lots are never deleted)
        default: 0
      - name: drawn_lites
        type: integer
        source: computed
        description: Sum of quantity_lites over BreakageDraw rows of this order with status == DRAWN
        default: 0
      - name: available_stock_lites
        type: integer
        source: computed
        description: breakage_stock_lites - drawn_lites
        default: 0
      - name: committable_lites
        type: integer
        source: computed
        description: "received_lites when state IN {RECEIVED, CLOSED}, else ordered_lites (lites may be committed to a release from the moment the order is placed; the physical count supersedes the ordered count at receipt)"
        default: 0
      - name: unallocated_lites
        type: integer
        source: computed
        description: committable_lites - allocated_lites - breakage_stock_lites
        default: 0
      - name: last_risk_computed_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of the latest risk recomputation
        default: null

  - name: BreakageDraw
    parent: null
    common_fields: true
    fields:
      - name: glass_order_id
        type: string
        source: input
        description: FK -> GlassOrder.id
      - name: panel_lot_id
        type: string
        source: input
        description: FK -> PanelLot.id; the lot whose broken lite is being replaced
      - name: quantity_lites
        type: integer
        source: input
        description: Lites drawn from breakage replacement stock
        constraints: ">= 1"
      - name: reason
        type: enum
        source: input
        description: Draw reason
        constraints: "FIELD_BREAKAGE | COATING_DEFECT | HANDLING_DAMAGE | MOCKUP_CONSUMPTION"
      - name: status
        type: enum
        source: system
        description: Draw status
        default: DRAWN
        constraints: "DRAWN | CANCELLED"
      - name: cancelled_reason
        type: string
        source: input
        description: Free-text reason recorded when the draw is cancelled
        default: null

  - name: PanelLot
    parent: null
    common_fields: true
    fields:
      - name: release_id
        type: string
        source: system
        description: FK -> FabricationRelease.id; the release that created or re-pointed this lot
      - name: glass_order_id
        type: string
        source: system
        description: FK -> GlassOrder.id
      - name: zone_id
        type: string
        source: system
        description: FK -> InstallationZone.id; the zone this lot is fabricated for
      - name: lot_code
        type: string
        source: system
        description: Human-readable lot code derived as "LOT-F{zone.floor_number}-{zone.elevation_label}"
      - name: panel_count
        type: integer
        source: system
        description: Copy of the release's panels_per_zone
      - name: lite_count
        type: integer
        source: system
        description: panel_count * release.lites_per_panel
      - name: fabrication_status
        type: enum
        source: system
        description: Shop progress axis
        default: BATCHED
        constraints: "BATCHED | GLAZED | SHIPPED | ON_HOLD"
      - name: hold_reason
        type: enum
        source: system
        description: Why the lot is on hold
        default: null
        constraints: "SUBMITTAL_REVISION | GLASS_RE_FIRE"
      - name: status_before_hold
        type: enum
        source: system
        description: fabrication_status captured when the lot went ON_HOLD, restored when a superseding release un-holds it
        default: null
        constraints: "BATCHED | GLAZED"
      - name: shipped_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the lot reached SHIPPED
        default: null

  - name: TestLab
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: Accredited performance mockup test laboratory name
      - name: chamber_capacity
        type: integer
        source: input
        description: Number of test chambers that may be occupied at the same instant
        constraints: ">= 1"
      - name: accreditation_ref
        type: string
        source: input
        description: Laboratory accreditation reference

  - name: MockupTest
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> FacadePackage.id
      - name: test_lab_id
        type: string
        source: input
        description: FK -> TestLab.id
      - name: retest_of_test_id
        type: string
        source: input
        description: FK -> MockupTest.id; the failed test this attempt re-runs, null for a first attempt
        default: null
      - name: attempt_no
        type: integer
        source: input
        description: Attempt number; attempts >= 2 carry the retest surcharge
        default: 1
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: Chamber occupation start (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: Chamber occupation end (exclusive)
      - name: chambers_required
        type: integer
        source: input
        description: Chambers occupied for the whole window
        constraints: ">= 1"
      - name: state
        type: enum
        source: system
        description: Mockup test state
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED"
      - name: chamber_hours
        type: integer
        source: computed
        description: ceil(window hours) * chambers_required
        default: 0
      - name: invoice_subtotal_cents
        type: integer
        source: computed
        description: Base fee plus chamber hours; the tier of the retest surcharge is selected from this value only
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: Retest surcharge; see calculations.mockup_test_invoice_cents
        default: 0
      - name: invoice_cents
        type: integer
        source: computed
        description: Total mockup test invoice; see calculations.mockup_test_invoice_cents
        default: 0
      - name: air_infiltration_cfm
        type: number
        source: system
        description: Measured air infiltration at the mockup
        default: null
      - name: water_penetration_observed
        type: boolean
        source: system
        description: Whether uncontrolled water penetration was observed at the mockup
        default: null
      - name: structural_deflection_mm
        type: number
        source: system
        description: Measured mullion deflection at design pressure
        default: null
      - name: result_recorded_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the result
        default: null

  - name: AnchorEmbedSurvey
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: system
        description: FK -> InstallationZone.id; taken from the creation path
      - name: embed_layout_ref
        type: string
        source: input
        description: Embed plate layout drawing reference issued to the structural contractor
      - name: planned_anchor_count
        type: integer
        source: input
        description: Embeds planned in the zone
        constraints: ">= 1"
      - name: tolerance_mm
        type: number
        source: input
        description: Acceptance tolerance for as-built embed deviation
        default: 25.0
        constraints: "> 0"
      - name: state
        type: enum
        source: system
        description: Embed coordination state
        default: PENDING_SURVEY
        constraints: "PENDING_SURVEY | ACCEPTED | REJECTED | POURED"
      - name: surveyed_anchor_count
        type: integer
        source: system
        description: Embeds found in the as-built survey
        default: null
      - name: max_deviation_mm
        type: number
        source: system
        description: Largest as-built embed deviation reported by the latest survey
        default: null
      - name: survey_attempt_count
        type: integer
        source: system
        description: Number of as-built surveys recorded
        default: 0
      - name: surveyed_by_user_id
        type: string
        source: system
        description: X-User-ID of the StructuralContractor who recorded the latest survey
        default: null
      - name: poured_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the pour was confirmed
        default: null

  - name: InstallationZone
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> FacadePackage.id
      - name: floor_number
        type: integer
        source: input
        description: Floor served by this zone
        constraints: ">= 1"
      - name: elevation_label
        type: enum
        source: input
        description: Building elevation
        constraints: "NORTH | SOUTH | EAST | WEST"
      - name: area_sqm
        type: number
        source: input
        description: Zone curtain wall area in square metres
        constraints: "> 0"
      - name: height_m
        type: number
        source: input
        description: Height of the zone above grade
        constraints: "> 0"
      - name: span_mm
        type: integer
        source: input
        description: Vertical mullion span in millimetres
        constraints: ">= 1"
      - name: anchor_type
        type: enum
        source: input
        description: Anchor detail
        constraints: "SLOTTED | PINNED | FIXED"
      - name: designed_joint_mm
        type: number
        source: input
        description: Movement joint width the shop drawings provide in this zone
        constraints: "> 0"
      - name: planned_panel_count
        type: integer
        source: input
        description: Panels planned for the zone
        constraints: ">= 1"
      - name: budget_crew_hours
        type: number
        source: input
        description: Field labor budget for the zone in person-hours
        constraints: "> 0"
      - name: install_status
        type: enum
        source: system
        description: Installation axis; evolves independently of weather_status
        default: PLANNED
        constraints: "PLANNED | ANCHORS_SET | PANELS_HUNG"
      - name: weather_status
        type: enum
        source: system
        description: Weather-tightness axis; evolves independently of install_status
        default: NOT_TIGHT
        constraints: "NOT_TIGHT | WEATHER_TIGHT | REMEDIATION"
      - name: thermal_movement_allowance_mm
        type: number
        source: computed
        description: Required movement joint; see calculations.thermal_movement_allowance_mm
        default: 0
      - name: deflection_limit_mm
        type: number
        source: computed
        description: Allowable mullion deflection; see calculations.thermal_movement_allowance_mm
        default: 0
      - name: provisional_labor_cost_cents
        type: integer
        source: computed
        description: PROVISIONAL_FORWARD variant of calculations.zone_field_labor_cost, stamped at hang-panels
        default: null
      - name: final_labor_cost_cents
        type: integer
        source: computed
        description: FINAL_CHRONOLOGICAL variant of calculations.zone_field_labor_cost, stamped at weather-tight certification
        default: null
      - name: consumed_crew_hours
        type: number
        source: computed
        description: Sum of crew_size * shift_hours over this zone's CrewDayLog rows with status == POSTED
        default: 0
      - name: remaining_crew_hours
        type: number
        source: computed
        description: budget_crew_hours - consumed_crew_hours; may go negative on overrun
        default: 0
      - name: certified_line_cents
        type: integer
        source: computed
        description: Rounded certified line amount for this zone; see calculations.earned_value_certified_cents
        default: null
      - name: weather_tight_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the current weather-tight certification, cleared when the zone reverts to REMEDIATION
        default: null
      - name: weather_tight_cycle_count
        type: integer
        source: system
        description: Number of times the zone has been certified weather-tight
        default: 0
      - name: hang_completed_at
        type: datetime
        source: system
        description: Logical-clock timestamp when panels finished hanging
        default: null

  - name: CrewDayLog
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: system
        description: FK -> InstallationZone.id; taken from the creation path
      - name: work_date
        type: string
        source: input
        description: Calendar work date (YYYY-MM-DD, UTC)
      - name: crew_size
        type: integer
        source: input
        description: Glaziers on the wall that day
        constraints: ">= 1"
      - name: shift_hours
        type: number
        source: input
        description: Hours worked per crew member that day
        constraints: "> 0 and <= 16"
      - name: panels_installed
        type: integer
        source: input
        description: Panels installed that day
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Posting status
        default: POSTED
        constraints: "POSTED | VOIDED"
      - name: day_index
        type: integer
        source: computed
        description: 1-based chronological index of this log among the zone's POSTED logs ordered by work_date ASC then created_at ASC; null once VOIDED
        default: null
      - name: straight_person_hours
        type: number
        source: computed
        description: min(shift_hours, SHIFT_STRAIGHT_HOURS) * crew_size
        default: 0
      - name: overtime_person_hours
        type: number
        source: computed
        description: max(0, shift_hours - SHIFT_STRAIGHT_HOURS) * crew_size
        default: 0
      - name: day_cost_cents
        type: integer
        source: computed
        description: Rounded per-day cost used by the FINAL_CHRONOLOGICAL labor variant
        default: 0

  - name: HoistRig
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> FacadePackage.id
      - name: rig_code
        type: string
        source: input
        description: Rig identifier on site
      - name: rig_kind
        type: enum
        source: input
        description: Hoisting equipment kind
        constraints: "MAST_CLIMBER | TOWER_CRANE | MONORAIL"
      - name: capacity_panels_per_shift
        type: integer
        source: input
        description: Panels the rig can hoist per shift
        constraints: ">= 1"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: Minimum idle minutes required between two reservations on this rig
        default: 45
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Rig availability
        default: ACTIVE
        constraints: "ACTIVE | OUT_OF_SERVICE"

  - name: HoistReservation
    parent: null
    common_fields: true
    fields:
      - name: rig_id
        type: string
        source: input
        description: FK -> HoistRig.id
      - name: zone_id
        type: string
        source: input
        description: FK -> InstallationZone.id
      - name: window_start
        type: datetime
        source: input
        description: Reservation start (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: Reservation end (exclusive)
      - name: planned_panel_count
        type: integer
        source: input
        description: Panels planned to be hoisted in the window
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Reservation status
        default: RESERVED
        constraints: "RESERVED | CONSUMED | CANCELLED"
      - name: blocked_from
        type: datetime
        source: computed
        description: window_start minus rig.changeover_buffer_minutes
      - name: blocked_until
        type: datetime
        source: computed
        description: window_end plus rig.changeover_buffer_minutes
      - name: cancelled_reason
        type: string
        source: input
        description: Free-text reason recorded on cancellation
        default: null

  - name: FieldTest
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: system
        description: FK -> InstallationZone.id; taken from the creation path
      - name: test_kind
        type: enum
        source: input
        description: Field test kind
        constraints: "WATER_AAMA_501_2 | AIR_INFILTRATION | STRUCTURAL_DEFLECTION"
      - name: scheduled_for
        type: datetime
        source: input
        description: Scheduled test instant
      - name: attempt_no
        type: integer
        source: input
        description: Attempt number for this test kind in this zone
        default: 1
        constraints: ">= 1"
      - name: state
        type: enum
        source: system
        description: Test state
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED"
      - name: water_penetration_observed
        type: boolean
        source: system
        description: Water observed on the interior face during the spray test
        default: null
      - name: measured_air_leakage_cfm
        type: number
        source: system
        description: Measured air leakage in cfm per square foot
        default: null
      - name: measured_deflection_mm
        type: number
        source: system
        description: Measured mullion deflection in millimetres
        default: null
      - name: outcome_reason
        type: enum
        source: computed
        description: Why the recorded result passed or failed
        default: null
        constraints: "WITHIN_TOLERANCE | WATER_PENETRATION | AIR_LEAKAGE_EXCEEDED | DEFLECTION_EXCEEDED"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the QCInspector who recorded the result
        default: null
      - name: result_recorded_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the result
        default: null

  - name: DefectItem
    parent: null
    common_fields: true
    fields:
      - name: package_id
        type: string
        source: input
        description: FK -> FacadePackage.id
      - name: zone_id
        type: string
        source: input
        description: FK -> InstallationZone.id; null for package-level mockup defects
        default: null
      - name: field_test_id
        type: string
        source: input
        description: FK -> FieldTest.id; set when origin == FIELD_TEST
        default: null
      - name: mockup_test_id
        type: string
        source: input
        description: FK -> MockupTest.id; set when origin == MOCKUP_TEST
        default: null
      - name: origin
        type: enum
        source: input
        description: What raised the item
        constraints: "MOCKUP_TEST | FIELD_TEST | PUNCH_LIST"
      - name: severity
        type: enum
        source: input
        description: Severity band
        constraints: "CRITICAL | MAJOR | MINOR"
      - name: description
        type: string
        source: input
        description: Defect description
      - name: status
        type: enum
        source: system
        description: Remediation state
        default: OPEN
        constraints: "OPEN | REMEDIATION_SUBMITTED | CLOSED | WAIVED"
      - name: raised_by_user_id
        type: string
        source: system
        description: X-User-ID that raised the item; for cascade-created items the id that recorded the failing result
        default: null
      - name: remediation_note
        type: string
        source: input
        description: Remediation narrative submitted for re-inspection
        default: null
      - name: reinspected_by_user_id
        type: string
        source: system
        description: X-User-ID of the QCInspector who recorded the latest re-inspection
        default: null
      - name: reinspect_fail_count
        type: integer
        source: system
        description: Number of failed re-inspections
        default: 0
      - name: waiver_ref
        type: string
        source: input
        description: Architect waiver reference recorded when the item is waived
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the item reached CLOSED or WAIVED
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: FacadePackage
    initial_state: DESIGN_ASSIST
    terminal_states: [CLOSED_OUT]
    note: "Compound machine: MOCKUP_QUALIFIED / IN_FABRICATION / IN_INSTALLATION / WEATHER_TIGHT_ACHIEVED are all auto-transitions bubbled up from children, and WEATHER_TIGHT_ACHIEVED can revert."
    transitions:
      - from: DESIGN_ASSIST
        to: SYSTEM_SELECTED
        trigger: "POST /facade-packages/{id}/system-decision"
        actor: CWProjectManager
        preconditions:
          - "package.system_type == UNDECIDED"
          - "package.state == DESIGN_ASSIST"
        side_effects:
          - "sets system_type to the requested value (UNITIZED or STICK_BUILT)"
          - "branch UNITIZED: planned_shop_hours = planned_shop_hours_for_system per calculations.system_decision_labor_split; planned_field_crew_size = UNITIZED_CREW_SIZE (4)"
          - "branch STICK_BUILT: planned_shop_hours = planned_shop_hours_for_system per calculations.system_decision_labor_split; planned_field_crew_size = STICK_CREW_SIZE (8)"
          - "recomputes thermal_movement_allowance_mm and deflection_limit_mm on every existing InstallationZone of this package (derived-field reconciliation)"
          - "increments FacadePackage.version by 1"
        note: "Branching fork with divergent side-effect sets: the two branches write different planned_shop_hours / planned_field_crew_size and different zone deflection divisors."
      - from: SYSTEM_SELECTED
        to: MOCKUP_QUALIFIED
        trigger: "system event: a MockupTest of this package reaches PASSED"
        actor: system
        preconditions:
          - "package.state == SYSTEM_SELECTED"
        side_effects:
          - "sets mockup_qualified = true"
          - "increments FacadePackage.version by 1"
      - from: MOCKUP_QUALIFIED
        to: IN_FABRICATION
        trigger: "system event: first FabricationRelease of this package is created"
        actor: system
        preconditions:
          - "package.state == MOCKUP_QUALIFIED"
        side_effects:
          - "increments FacadePackage.version by 1"
      - from: IN_FABRICATION
        to: IN_INSTALLATION
        trigger: "system event: first InstallationZone of this package reaches install_status ANCHORS_SET"
        actor: system
        preconditions:
          - "package.state == IN_FABRICATION"
        side_effects:
          - "increments FacadePackage.version by 1"
      - from: IN_INSTALLATION
        to: WEATHER_TIGHT_ACHIEVED
        trigger: "system event: weather_tight_zone_count reaches the package's zone count (>= 1 zone)"
        actor: system
        preconditions:
          - "package has >= 1 InstallationZone"
          - "every InstallationZone of the package has weather_status == WEATHER_TIGHT"
        side_effects:
          - "increments FacadePackage.version by 1"
      - from: WEATHER_TIGHT_ACHIEVED
        to: IN_INSTALLATION
        trigger: "system event: a zone of the package leaves weather_status WEATHER_TIGHT (field-test failure cascade or panel-lot hold cascade)"
        actor: system
        preconditions:
          - "package.state == WEATHER_TIGHT_ACHIEVED"
        side_effects:
          - "decrements weather_tight_zone_count; recomputes certified_area_sqm, earned_value_certified_cents, retention_held_cents"
          - "increments FacadePackage.version by 1"
        note: "Revert edge; makes the compound aggregate non-monotonic."
      - from: WEATHER_TIGHT_ACHIEVED
        to: CLOSED_OUT
        trigger: "POST /facade-packages/{id}/close-out"
        actor: CWProjectManager
        preconditions:
          - "every InstallationZone of the package has weather_status == WEATHER_TIGHT and install_status == PANELS_HUNG"
          - "no DefectItem of the package has status IN {OPEN, REMEDIATION_SUBMITTED}"
          - "no ShopDrawingSubmittal of the package has state IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUIRED, ESCALATED}"
          - "sum over the package's submittals of open_notes_count == 0"
        side_effects:
          - "freezes earned_value_certified_cents and retention_held_cents at their current values"
          - "increments FacadePackage.version by 1"

  - entity: ShopDrawingSubmittal
    initial_state: SUBMITTED
    terminal_states: [APPROVED, VOIDED]
    note: "Cyclic review machine: REVISION_REQUIRED -> SUBMITTED -> UNDER_REVIEW rounds, with a branch out to ESCALATED at the third return."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /shop-drawing-submittals/{id}/start-review"
        actor: ArchitectOfRecord
        preconditions:
          - "submittal.state == SUBMITTED"
          - "if submittal_type == STRUCTURAL_CALCULATION or delegated_design_scope == true then sealed_by_user_id != null"
          - "X-User-ID != submittal.sealed_by_user_id (segregation of duties)"
        side_effects:
          - "increments ShopDrawingSubmittal.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /shop-drawing-submittals/{id}/review with decision APPROVED"
        actor: ArchitectOfRecord
        preconditions:
          - "submittal.state == UNDER_REVIEW"
        side_effects:
          - "sets review_decision = APPROVED, reviewed_by_user_id = X-User-ID, open_notes_count = 0"
          - "increments ShopDrawingSubmittal.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED_AS_NOTED
        trigger: "POST /shop-drawing-submittals/{id}/review with decision APPROVED_AS_NOTED"
        actor: ArchitectOfRecord
        preconditions:
          - "submittal.state == UNDER_REVIEW"
          - "request notes_count >= 1"
        side_effects:
          - "sets review_decision = APPROVED_AS_NOTED, reviewed_by_user_id = X-User-ID, open_notes_count = request notes_count"
          - "increments ShopDrawingSubmittal.version by 1"
        note: "Divergent branch sibling of APPROVED: fabrication may be released, but package close-out stays blocked until open_notes_count reaches 0."
      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /shop-drawing-submittals/{id}/review with decision REVISION_REQUIRED and revision_cycle <= 2"
        actor: ArchitectOfRecord
        preconditions:
          - "submittal.state == UNDER_REVIEW"
          - "submittal.revision_cycle <= 2"
        side_effects:
          - "sets review_decision = REVISION_REQUIRED, reviewed_by_user_id = X-User-ID"
          - "cascade hop 1: every FabricationRelease with submittal_id == this submittal and state == RELEASED transitions to REVOKED with revoked_reason SUBMITTAL_REVISION"
          - "cascade hop 2 (caused by hop 1): every PanelLot of each revoked release with fabrication_status IN {BATCHED, GLAZED} records status_before_hold and transitions to ON_HOLD with hold_reason SUBMITTAL_REVISION"
          - "cascade hop 3 (caused by hop 2): for every zone that now holds an ON_HOLD lot and has weather_status == WEATHER_TIGHT, the zone reverts to weather_status REMEDIATION and weather_tight_at is cleared"
          - "cascade hop 4 (caused by hop 3): package.weather_tight_zone_count decrements, certified_area_sqm / earned_value_certified_cents / retention_held_cents recompute, and package.state WEATHER_TIGHT_ACHIEVED reverts to IN_INSTALLATION"
          - "recomputes package.blocking_submittal_count and package.engineering_posture"
          - "increments ShopDrawingSubmittal.version by 1"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /shop-drawing-submittals/{id}/review with decision REVISION_REQUIRED and revision_cycle >= 3"
        actor: ArchitectOfRecord
        preconditions:
          - "submittal.state == UNDER_REVIEW"
          - "submittal.revision_cycle >= 3"
        side_effects:
          - "sets review_decision = REVISION_REQUIRED, reviewed_by_user_id = X-User-ID, escalation_ref = request escalation_ref when supplied"
          - "runs the same four cascade hops as the UNDER_REVIEW -> REVISION_REQUIRED transition"
          - "recomputes package.blocking_submittal_count and package.engineering_posture (any ESCALATED submittal forces posture FROZEN)"
          - "increments ShopDrawingSubmittal.version by 1"
        note: "Boundary: revision_cycle == 2 returns to REVISION_REQUIRED, revision_cycle == 3 escalates."
      - from: APPROVED_AS_NOTED
        to: UNDER_REVIEW
        trigger: "POST /shop-drawing-submittals/{id}/reopen-review"
        actor: ArchitectOfRecord
        preconditions:
          - "submittal.state == APPROVED_AS_NOTED"
          - "submittal.open_notes_count >= 1"
          - "X-User-ID != submittal.sealed_by_user_id"
        side_effects:
          - "stores reopen_reason; leaves review_decision as APPROVED_AS_NOTED until the new decision is recorded"
          - "recomputes package.engineering_posture (UNDER_REVIEW is not a blocking state, so the posture does not change on this edge)"
          - "increments ShopDrawingSubmittal.version by 1"
        note: "Re-entry edge that makes APPROVED_AS_NOTED non-terminal: a released package can be dragged back into review, which is what lets the revision cascade revoke live releases."
      - from: REVISION_REQUIRED
        to: SUBMITTED
        trigger: "POST /shop-drawing-submittals/{id}/resubmit"
        actor: CWDetailer
        preconditions:
          - "submittal.state == REVISION_REQUIRED"
        side_effects:
          - "increments revision_cycle by 1; sets drawing_set_ref to the request value; clears sealed_by_user_id, seal_license_no and sealed_at (a new set needs a new seal)"
          - "recomputes package.blocking_submittal_count and package.engineering_posture"
          - "increments ShopDrawingSubmittal.version by 1"
        note: "Cycle edge back to SUBMITTED."
      - from: ESCALATED
        to: SUBMITTED
        trigger: "POST /shop-drawing-submittals/{id}/resubmit with dispute_resolution_ref"
        actor: CWDetailer
        preconditions:
          - "submittal.state == ESCALATED"
          - "request dispute_resolution_ref is present and non-empty"
        side_effects:
          - "increments revision_cycle by 1; clears sealed_by_user_id, seal_license_no, sealed_at"
          - "recomputes package.blocking_submittal_count and package.engineering_posture"
          - "increments ShopDrawingSubmittal.version by 1"

  - entity: GlassOrder
    initial_state: ORDERED
    terminal_states: [CLOSED]
    note: "Cyclic: a coating revision during production sends the order back to ORDERED for a re-fire."
    transitions:
      - from: ORDERED
        to: IN_PRODUCTION
        trigger: "POST /glass-orders/{id}/start-production"
        actor: GlazingProcurement
        preconditions:
          - "order.state == ORDERED"
        side_effects:
          - "increments GlassOrder.version by 1"
      - from: IN_PRODUCTION
        to: ORDERED
        trigger: "POST /glass-orders/{id}/coating-revision with re_fire_required true"
        actor: GlazingProcurement
        preconditions:
          - "order.state == IN_PRODUCTION"
        side_effects:
          - "increments coating_revision_count by 1, sets coating_code, sets re_fire_required = true"
          - "sets risk_variant = EXPEDITE_ADJUSTED and recomputes risk_score, effective_lead_days, risk_flag, last_risk_computed_at"
          - "cascade hop 1 (when risk_flag flips to true): every FabricationRelease with glass_order_id == this order and state == RELEASED transitions to REVOKED with revoked_reason GLASS_RE_FIRE"
          - "cascade hop 2 (caused by hop 1): every PanelLot of each revoked release with fabrication_status IN {BATCHED, GLAZED} records status_before_hold and transitions to ON_HOLD with hold_reason GLASS_RE_FIRE"
          - "increments GlassOrder.version by 1"
      - from: IN_PRODUCTION
        to: RECEIVED
        trigger: "POST /glass-orders/{id}/receive"
        actor: GlazingProcurement
        preconditions:
          - "order.state == IN_PRODUCTION"
          - "request received_lites >= 1"
        side_effects:
          - "sets received_lites; switches committable_lites from ordered_lites to received_lites; sets breakage_stock_lites = floor(received_lites * BREAKAGE_STOCK_PCT); recomputes available_stock_lites and unallocated_lites"
          - "increments GlassOrder.version by 1"
      - from: RECEIVED
        to: CLOSED
        trigger: "system event: every PanelLot of the order reaches fabrication_status SHIPPED and unallocated_lites == 0"
        actor: system
        preconditions:
          - "order.state == RECEIVED"
          - "order has >= 1 PanelLot"
        side_effects:
          - "increments GlassOrder.version by 1"

  - entity: FabricationRelease
    initial_state: RELEASED
    terminal_states: [REVOKED, CLOSED]
    transitions:
      - from: RELEASED
        to: REVOKED
        trigger: "system event: the authorising submittal returns to REVISION_REQUIRED/ESCALATED, or the glass order's risk_flag flips true on a coating revision"
        actor: system
        preconditions:
          - "release.state == RELEASED"
        side_effects:
          - "sets revoked_reason to SUBMITTAL_REVISION or GLASS_RE_FIRE per the originating cascade"
          - "puts every PanelLot of the release with fabrication_status IN {BATCHED, GLAZED} ON_HOLD"
          - "increments FabricationRelease.version by 1"
      - from: RELEASED
        to: CLOSED
        trigger: "system event: every PanelLot of the release reaches fabrication_status SHIPPED"
        actor: system
        preconditions:
          - "release.state == RELEASED"
          - "release.lot_count >= 1"
        side_effects:
          - "increments FabricationRelease.version by 1"
        note: "Bubble-up: parent closes when all children are terminal on the shop axis."

  - entity: PanelLot
    initial_state: BATCHED
    terminal_states: [SHIPPED]
    transitions:
      - from: BATCHED
        to: GLAZED
        trigger: "POST /panel-lots/{id}/advance-fabrication with to_status GLAZED"
        actor: FieldSuperintendent
        preconditions:
          - "lot.fabrication_status == BATCHED"
          - "lot's FabricationRelease.state == RELEASED"
          - "lot's GlassOrder.state == RECEIVED"
        side_effects:
          - "increments PanelLot.version by 1"
      - from: GLAZED
        to: SHIPPED
        trigger: "POST /panel-lots/{id}/advance-fabrication with to_status SHIPPED"
        actor: FieldSuperintendent
        preconditions:
          - "lot.fabrication_status == GLAZED"
          - "lot's FabricationRelease.state == RELEASED"
        side_effects:
          - "sets shipped_at to the logical clock"
          - "when every lot of the release is SHIPPED, the release auto-transitions RELEASED -> CLOSED"
          - "when every lot of the glass order is SHIPPED and order.unallocated_lites == 0, the order auto-transitions RECEIVED -> CLOSED"
          - "increments PanelLot.version by 1"
      - from: BATCHED
        to: ON_HOLD
        trigger: "system event: the lot's release is revoked"
        actor: system
        preconditions:
          - "lot.fabrication_status == BATCHED"
        side_effects:
          - "sets status_before_hold = BATCHED and hold_reason from the revoking cascade"
          - "reverts the lot's zone to weather_status REMEDIATION when that zone was WEATHER_TIGHT"
          - "increments PanelLot.version by 1"
      - from: GLAZED
        to: ON_HOLD
        trigger: "system event: the lot's release is revoked"
        actor: system
        preconditions:
          - "lot.fabrication_status == GLAZED"
        side_effects:
          - "sets status_before_hold = GLAZED and hold_reason from the revoking cascade"
          - "reverts the lot's zone to weather_status REMEDIATION when that zone was WEATHER_TIGHT"
          - "increments PanelLot.version by 1"
      - from: ON_HOLD
        to: BATCHED
        trigger: "system event: a new FabricationRelease covers this lot's zone with hold_reason SUBMITTAL_REVISION and status_before_hold BATCHED"
        actor: system
        preconditions:
          - "lot.fabrication_status == ON_HOLD"
          - "lot.hold_reason == SUBMITTAL_REVISION"
          - "lot.status_before_hold == BATCHED"
        side_effects:
          - "re-points release_id to the new release, clears hold_reason and status_before_hold"
          - "increments PanelLot.version by 1"
      - from: ON_HOLD
        to: GLAZED
        trigger: "system event: a new FabricationRelease covers this lot's zone with hold_reason SUBMITTAL_REVISION and status_before_hold GLAZED"
        actor: system
        preconditions:
          - "lot.fabrication_status == ON_HOLD"
          - "lot.hold_reason == SUBMITTAL_REVISION"
          - "lot.status_before_hold == GLAZED"
        side_effects:
          - "re-points release_id to the new release, clears hold_reason and status_before_hold"
          - "increments PanelLot.version by 1"

  - entity: MockupTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /mockup-tests/{id}/record-result with no failing measurement"
        actor: QCInspector
        preconditions:
          - "test.state == SCHEDULED"
          - "water_penetration_observed == false"
          - "air_infiltration_cfm < AIR_LEAKAGE_LIMIT_CFM (0.06)"
          - "structural_deflection_mm < MOCKUP_DEFLECTION_LIMIT_MM (19.00)"
        side_effects:
          - "stamps the measurements and result_recorded_at"
          - "sets package.mockup_qualified = true and auto-transitions package SYSTEM_SELECTED -> MOCKUP_QUALIFIED"
          - "increments MockupTest.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /mockup-tests/{id}/record-result with any failing measurement"
        actor: QCInspector
        preconditions:
          - "test.state == SCHEDULED"
        side_effects:
          - "stamps the measurements and result_recorded_at"
          - "creates a DefectItem with origin MOCKUP_TEST, severity CRITICAL, package_id = test.package_id, mockup_test_id = test.id, zone_id = null, raised_by_user_id = X-User-ID, status OPEN"
          - "recomputes package.open_critical_defect_count and package.engineering_posture"
          - "increments MockupTest.version by 1"

  - entity: AnchorEmbedSurvey
    initial_state: PENDING_SURVEY
    terminal_states: [POURED]
    note: "Cyclic: a rejected survey is re-surveyed after embed remediation and may be rejected again."
    transitions:
      - from: PENDING_SURVEY
        to: ACCEPTED
        trigger: "POST /embed-surveys/{id}/survey with max_deviation_mm < tolerance_mm"
        actor: StructuralContractor
        preconditions:
          - "survey.state == PENDING_SURVEY"
          - "request surveyed_anchor_count == survey.planned_anchor_count"
          - "request max_deviation_mm < survey.tolerance_mm"
        side_effects:
          - "stamps max_deviation_mm, surveyed_anchor_count, surveyed_by_user_id; increments survey_attempt_count"
          - "increments AnchorEmbedSurvey.version by 1"
      - from: PENDING_SURVEY
        to: REJECTED
        trigger: "POST /embed-surveys/{id}/survey with max_deviation_mm >= tolerance_mm or a short anchor count"
        actor: StructuralContractor
        preconditions:
          - "survey.state == PENDING_SURVEY"
        side_effects:
          - "stamps the survey values; increments survey_attempt_count"
          - "increments AnchorEmbedSurvey.version by 1"
        note: "Boundary: deviation exactly equal to tolerance_mm rejects."
      - from: REJECTED
        to: ACCEPTED
        trigger: "POST /embed-surveys/{id}/survey after embed remediation with max_deviation_mm < tolerance_mm"
        actor: StructuralContractor
        preconditions:
          - "survey.state == REJECTED"
          - "request surveyed_anchor_count == survey.planned_anchor_count"
          - "request max_deviation_mm < survey.tolerance_mm"
        side_effects:
          - "stamps the survey values; increments survey_attempt_count"
          - "increments AnchorEmbedSurvey.version by 1"
      - from: REJECTED
        to: REJECTED
        trigger: "POST /embed-surveys/{id}/survey after embed remediation still out of tolerance"
        actor: StructuralContractor
        preconditions:
          - "survey.state == REJECTED"
        side_effects:
          - "stamps the survey values; increments survey_attempt_count"
          - "increments AnchorEmbedSurvey.version by 1"
        note: "Self-loop closes the revision cycle."
      - from: ACCEPTED
        to: POURED
        trigger: "POST /embed-surveys/{id}/confirm-pour"
        actor: StructuralContractor
        preconditions:
          - "survey.state == ACCEPTED"
        side_effects:
          - "sets poured_at from the request"
          - "increments AnchorEmbedSurvey.version by 1"

  - entity: InstallationZone
    initial_state: PLANNED
    terminal_states: []
    note: "Parallel dimensions on one row: install_status (PLANNED -> ANCHORS_SET -> PANELS_HUNG) and weather_status (NOT_TIGHT -> WEATHER_TIGHT <-> REMEDIATION) advance independently; hanging panels never touches weather_status and certification never touches install_status."
    transitions:
      - from: "install_status PLANNED"
        to: "install_status ANCHORS_SET"
        trigger: "POST /installation-zones/{id}/set-anchors"
        actor: FieldSuperintendent
        preconditions:
          - "zone.install_status == PLANNED"
          - "the zone has an AnchorEmbedSurvey with state == POURED"
          - "package.engineering_posture != FROZEN"
        side_effects:
          - "auto-transitions package IN_FABRICATION -> IN_INSTALLATION on the first such zone"
          - "increments InstallationZone.version by 1"
      - from: "install_status ANCHORS_SET"
        to: "install_status PANELS_HUNG"
        trigger: "POST /installation-zones/{id}/hang-panels"
        actor: FieldSuperintendent
        preconditions:
          - "zone.install_status == ANCHORS_SET"
          - "package.engineering_posture != FROZEN"
          - "every PanelLot with zone_id == this zone has fabrication_status == SHIPPED and the zone has >= 1 PanelLot"
          - "the referenced HoistReservation has status == RESERVED, zone_id == this zone and window_start <= logical clock now < window_end"
        side_effects:
          - "sets hang_completed_at to the logical clock"
          - "sets the referenced HoistReservation.status = CONSUMED"
          - "computes provisional_labor_cost_cents via calculations.zone_field_labor_cost variant PROVISIONAL_FORWARD"
          - "increments InstallationZone.version by 1"
      - from: "weather_status NOT_TIGHT"
        to: "weather_status WEATHER_TIGHT"
        trigger: "POST /installation-zones/{id}/certify-weather-tight"
        actor: CWProjectManager
        preconditions:
          - "zone.install_status == PANELS_HUNG"
          - "zone.weather_status IN {NOT_TIGHT, REMEDIATION}"
          - "package.engineering_posture != FROZEN"
          - "the zone has >= 1 FieldTest with test_kind == WATER_AAMA_501_2 and state == PASSED"
          - "the zone has >= 1 FieldTest with test_kind == AIR_INFILTRATION and state == PASSED"
          - "no FieldTest of the zone has state == FAILED whose linked DefectItem is not CLOSED or WAIVED"
          - "no DefectItem of the zone has severity CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED}"
          - "certified subtotal must not push earned value past contract_value_cents"
        side_effects:
          - "sets weather_tight_at to the logical clock and increments weather_tight_cycle_count"
          - "computes final_labor_cost_cents via calculations.zone_field_labor_cost variant FINAL_CHRONOLOGICAL"
          - "computes certified_line_cents and recomputes package.certified_area_sqm, earned_value_certified_cents, retention_held_cents, weather_tight_zone_count"
          - "auto-transitions package IN_INSTALLATION -> WEATHER_TIGHT_ACHIEVED once every zone is WEATHER_TIGHT"
          - "increments InstallationZone.version by 1"
      - from: "weather_status REMEDIATION"
        to: "weather_status WEATHER_TIGHT"
        trigger: "POST /installation-zones/{id}/certify-weather-tight after remediation"
        actor: CWProjectManager
        preconditions:
          - "zone.weather_status == REMEDIATION"
          - "same evidence preconditions as the NOT_TIGHT -> WEATHER_TIGHT edge, evaluated against the latest attempt of each test kind"
        side_effects:
          - "same side effects as the NOT_TIGHT -> WEATHER_TIGHT edge"
        note: "Cycle edge: a zone can be certified, reverted and re-certified any number of times."
      - from: "weather_status WEATHER_TIGHT"
        to: "weather_status REMEDIATION"
        trigger: "system event: a FieldTest of the zone is recorded FAILED, or a PanelLot of the zone goes ON_HOLD"
        actor: system
        preconditions:
          - "zone.weather_status == WEATHER_TIGHT"
        side_effects:
          - "clears weather_tight_at and certified_line_cents"
          - "decrements package.weather_tight_zone_count and recomputes package.certified_area_sqm, earned_value_certified_cents, retention_held_cents"
          - "auto-reverts package WEATHER_TIGHT_ACHIEVED -> IN_INSTALLATION"
          - "increments InstallationZone.version by 1"

  - entity: FieldTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /field-tests/{id}/record-result with the kind's measurement inside tolerance"
        actor: QCInspector
        preconditions:
          - "test.state == SCHEDULED"
          - "zone.install_status == PANELS_HUNG"
          - "the measurement field required by test_kind is present"
          - "WATER_AAMA_501_2: water_penetration_observed == false; AIR_INFILTRATION: measured_air_leakage_cfm < AIR_LEAKAGE_LIMIT_CFM; STRUCTURAL_DEFLECTION: measured_deflection_mm < zone.deflection_limit_mm"
        side_effects:
          - "sets outcome_reason = WITHIN_TOLERANCE, recorded_by_user_id = X-User-ID, result_recorded_at = logical clock"
          - "increments FieldTest.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /field-tests/{id}/record-result with the kind's measurement at or beyond tolerance"
        actor: QCInspector
        preconditions:
          - "test.state == SCHEDULED"
          - "zone.install_status == PANELS_HUNG"
          - "the measurement field required by test_kind is present"
        side_effects:
          - "sets outcome_reason to WATER_PENETRATION, AIR_LEAKAGE_EXCEEDED or DEFLECTION_EXCEEDED per test_kind"
          - "cascade hop 1: creates a DefectItem with origin FIELD_TEST, field_test_id = test.id, zone_id = test.zone_id, package_id = zone.package_id, status OPEN, raised_by_user_id = X-User-ID, severity CRITICAL for WATER_PENETRATION and DEFLECTION_EXCEEDED, severity MAJOR for AIR_LEAKAGE_EXCEEDED"
          - "cascade hop 2 (caused by hop 1): package.open_critical_defect_count recomputes and package.engineering_posture recomputes (RESTRICTED at 1 open critical, FROZEN at >= 2)"
          - "cascade hop 3 (caused by hop 1): when the zone's weather_status == WEATHER_TIGHT it reverts to REMEDIATION and weather_tight_at / certified_line_cents are cleared"
          - "cascade hop 4 (caused by hop 3): package.weather_tight_zone_count decrements, certified_area_sqm / earned_value_certified_cents / retention_held_cents recompute, and package.state WEATHER_TIGHT_ACHIEVED reverts to IN_INSTALLATION"
          - "increments FieldTest.version by 1"

  - entity: DefectItem
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    note: "Cyclic: a failed re-inspection sends the item back to OPEN."
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /defect-items/{id}/submit-remediation"
        actor: CWDetailer
        preconditions:
          - "item.status == OPEN"
        side_effects:
          - "stores remediation_note"
          - "recomputes package.open_critical_defect_count and package.engineering_posture"
          - "increments DefectItem.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: CLOSED
        trigger: "POST /defect-items/{id}/reinspect with outcome PASS"
        actor: QCInspector
        preconditions:
          - "item.status == REMEDIATION_SUBMITTED"
          - "X-User-ID != item.raised_by_user_id (segregation of duties)"
        side_effects:
          - "sets reinspected_by_user_id, closed_at"
          - "recomputes package.open_critical_defect_count and package.engineering_posture"
          - "increments DefectItem.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: OPEN
        trigger: "POST /defect-items/{id}/reinspect with outcome FAIL"
        actor: QCInspector
        preconditions:
          - "item.status == REMEDIATION_SUBMITTED"
          - "X-User-ID != item.raised_by_user_id (segregation of duties)"
        side_effects:
          - "increments reinspect_fail_count, sets reinspected_by_user_id, clears remediation_note"
          - "recomputes package.engineering_posture"
          - "increments DefectItem.version by 1"
        note: "Cycle edge back to OPEN."
      - from: OPEN
        to: WAIVED
        trigger: "POST /defect-items/{id}/waive"
        actor: ArchitectOfRecord
        preconditions:
          - "item.status == OPEN"
          - "item.severity != CRITICAL"
        side_effects:
          - "stores waiver_ref, sets closed_at"
          - "recomputes package.engineering_posture"
          - "increments DefectItem.version by 1"

  - entity: HoistReservation
    initial_state: RESERVED
    terminal_states: [CONSUMED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system event: POST /installation-zones/{id}/hang-panels references this reservation"
        actor: system
        preconditions:
          - "reservation.status == RESERVED"
        side_effects:
          - "increments HoistReservation.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /hoist-reservations/{id}/cancel"
        actor: FieldSuperintendent
        preconditions:
          - "reservation.status == RESERVED"
        side_effects:
          - "stores cancelled_reason; the rig's blocked interval [blocked_from, blocked_until) stops obstructing new reservations"
          - "increments HoistReservation.version by 1"

  - entity: BreakageDraw
    initial_state: DRAWN
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAWN
        to: CANCELLED
        trigger: "POST /breakage-draws/{id}/cancel"
        actor: GlazingProcurement
        preconditions:
          - "draw.status == DRAWN"
        side_effects:
          - "stores cancelled_reason"
          - "recomputes GlassOrder.drawn_lites and GlassOrder.available_stock_lites so that breakage_stock_lites == available_stock_lites + drawn_lites still holds"
          - "increments GlassOrder.version by 1 and BreakageDraw.version by 1"

  - entity: CrewDayLog
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /installation-zones/{id}/crew-days/{crew_day_id}/void"
        actor: FieldSuperintendent
        preconditions:
          - "log.status == POSTED"
        side_effects:
          - "clears day_index and re-indexes day_index over the zone's remaining POSTED logs ordered by work_date ASC then created_at ASC"
          - "recomputes zone.consumed_crew_hours and zone.remaining_crew_hours so that budget_crew_hours == consumed_crew_hours + remaining_crew_hours still holds"
          - "recomputes zone.final_labor_cost_cents when zone.weather_status == WEATHER_TIGHT"
          - "increments CrewDayLog.version by 1 and InstallationZone.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: release-create-stale-package
    parent_entity: FacadePackage
    write_endpoint: "POST /fabrication-releases"
    occ_field: "expected_package_version"
    description: |
      Creating a FabricationRelease against a FacadePackage whose version has
      advanced since the client last observed it is rejected. A new release for
      a zone legitimately supersedes an earlier one (it re-points ON_HOLD lots
      and re-allocates lites), so the operation cannot be guarded by a state
      precondition alone: the writer must prove its view of the package -
      posture, mockup qualification, zone roster - is current.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
  - rule_id: breakage-draw-stale-glass-order
    parent_entity: GlassOrder
    write_endpoint: "POST /breakage-draws"
    occ_field: "expected_glass_order_version"
    description: |
      Drawing replacement lites from a GlassOrder whose version has advanced
      since the client last observed it is rejected. Repeated draws are each
      legitimate while stock remains, so nothing in the order's state stops a
      second draw; the stale-version check is what forces the writer to
      re-read available_stock_lites before committing another draw.
    error_id: ERR_STALE_GLASS_ORDER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: system_decision_labor_split
    entity: FacadePackage
    output_fields: [planned_shop_hours, planned_field_crew_size]
    algorithm_type: threshold
    trigger: "POST /facade-packages/{id}/system-decision"
    constants:
      UNITIZED_SHOP_HOURS_PER_SQM: "0.55"
      STICK_SHOP_HOURS_PER_SQM: "0.18"
      UNITIZED_CREW_SIZE: 4
      STICK_CREW_SIZE: 8
    formula: |
      branch UNITIZED:
        planned_shop_hours    = round_half_up(total_area_sqm * UNITIZED_SHOP_HOURS_PER_SQM, 2)
        planned_field_crew_size = UNITIZED_CREW_SIZE
      branch STICK_BUILT:
        planned_shop_hours    = round_half_up(total_area_sqm * STICK_SHOP_HOURS_PER_SQM, 2)
        planned_field_crew_size = STICK_CREW_SIZE
      The unitized branch moves labour into the shop (high shop hours, small field crew);
      the stick-built branch moves it into the field (low shop hours, large field crew).
    precision: "2 decimal places, round_half_up"
    worked_example: |
      total_area_sqm = 9000.0
      UNITIZED   -> planned_shop_hours = 4950.00, planned_field_crew_size = 4
      STICK_BUILT -> planned_shop_hours = 1620.00, planned_field_crew_size = 8

  - name: zone_field_labor_cost
    entity: InstallationZone
    output_fields: [provisional_labor_cost_cents, final_labor_cost_cents]
    algorithm_type: chronological
    trigger: "POST /installation-zones/{id}/hang-panels (provisional) and POST /installation-zones/{id}/certify-weather-tight (final); the final variant is also recomputed by POST /installation-zones/{id}/crew-days/{crew_day_id}/void"
    constants:
      UNITIZED_PANELS_PER_CREW_DAY: 12
      STICK_PANELS_PER_CREW_DAY: 6
      STANDARD_SHIFT_HOURS: "8.0"
      OVERTIME_MULTIPLIER: "1.5"
      HIGH_ELEVATION_FACTOR: "1.15"
      HIGH_ELEVATION_THRESHOLD_M: "20.0"
    variants:
      - variant: PROVISIONAL_FORWARD
        applies_when: "zone install_status moves ANCHORS_SET -> PANELS_HUNG; written to provisional_labor_cost_cents"
        formula: |
          panels_per_crew_day = UNITIZED_PANELS_PER_CREW_DAY when package.system_type == UNITIZED
                                else STICK_PANELS_PER_CREW_DAY
          crew_days = ceil(zone.planned_panel_count / panels_per_crew_day)
          planned_hours = crew_days * package.planned_field_crew_size * STANDARD_SHIFT_HOURS
          provisional_labor_cost_cents = round_half_up(planned_hours * package.base_labor_rate_cents_per_hour)
          The forward-looking variant charges every hour at straight time and ignores
          elevation: no CrewDayLog rows exist yet, so neither overtime nor the
          high-elevation factor can be known.
      - variant: FINAL_CHRONOLOGICAL
        applies_when: "zone weather_status becomes WEATHER_TIGHT, or a CrewDayLog of the zone is voided while the zone is WEATHER_TIGHT; written to final_labor_cost_cents"
        formula: |
          Walk the zone's CrewDayLog rows with status == POSTED in work_date ASC,
          then created_at ASC order (never by id). For each log:
            straight_hours  = crew_size * min(shift_hours, STANDARD_SHIFT_HOURS)
            overtime_hours  = crew_size * max(shift_hours - STANDARD_SHIFT_HOURS, 0)
            day_base_cents  = straight_hours * rate + overtime_hours * rate * OVERTIME_MULTIPLIER
                              where rate = package.base_labor_rate_cents_per_hour
            elevation_factor = HIGH_ELEVATION_FACTOR when zone.height_m > HIGH_ELEVATION_THRESHOLD_M
                               else 1.00
            day_cost_cents  = round_half_up(day_base_cents * elevation_factor)
          final_labor_cost_cents = sum of day_cost_cents over the walked logs
          Each day is rounded to whole cents before it enters the sum; VOIDED logs
          are excluded and the surviving logs are re-indexed. The per-log values are
          persisted on CrewDayLog as straight_person_hours, overtime_person_hours and
          day_cost_cents, so the zone total must equal the sum of the surviving
          day_cost_cents values exactly.
    input_set: "PROVISIONAL_FORWARD: zone.planned_panel_count and package planning fields only. FINAL_CHRONOLOGICAL: CrewDayLog rows of the zone with status == POSTED."
    precision: "integer cents, round_half_up per crew day (not once on the total)"
    worked_example: |
      package: system_type UNITIZED, planned_field_crew_size 4, base_labor_rate_cents_per_hour 9800
      zone: planned_panel_count 36, height_m 24.0 (> 20.0, factor 1.15), budget_crew_hours 320.0
      PROVISIONAL_FORWARD: crew_days = ceil(36/12) = 3 -> 3*4*8.0 = 96.0 h
                           -> 96.0 * 9800 = 940800 cents
      FINAL_CHRONOLOGICAL over three POSTED logs (crew_size 4):
        2026-08-10 shift_hours 9.0 -> straight 32.0, overtime 4.0
                   base 372400 -> *1.15 = 428260
        2026-08-11 shift_hours 8.0 -> base 313600 -> *1.15 = 360640
        2026-08-12 shift_hours 8.0 -> base 313600 -> *1.15 = 360640
        final_labor_cost_cents = 1149540 (divergence from provisional: +208740)
      Same three logs on a zone with height_m 12.0 -> 999600 cents.

  - name: glass_procurement_risk_score
    entity: GlassOrder
    output_fields: [risk_score, effective_lead_days, risk_flag]
    algorithm_type: weighted_scoring
    trigger: "POST /glass-orders, POST /glass-orders/{id}/request-expedite, POST /glass-orders/{id}/coating-revision, POST /glass-orders/{id}/recompute-risk"
    constants:
      W_LEAD: "0.45"
      W_CALENDAR: "0.35"
      W_COATING: "0.20"
      RE_FIRE_PENALTY_DAYS: 21
      EXPEDITE_RECOVERY_DAYS: 10
      NOMINAL_HORIZON_DAYS: 90
      EXPEDITE_HORIZON_DAYS: 45
      MAX_TOLERATED_REVISIONS: "2"
      RISK_THRESHOLD: "70.00"
    variants:
      - variant: NOMINAL
        applies_when: "order.expedite_tier == 0 AND order.coating_revision_count == 0"
        formula: |
          effective_lead_days = quoted_lead_time_days
                                + RE_FIRE_PENALTY_DAYS * coating_revision_count
          horizon_days = NOMINAL_HORIZON_DAYS
      - variant: EXPEDITE_ADJUSTED
        applies_when: "order.expedite_tier >= 1 OR order.coating_revision_count >= 1"
        formula: |
          effective_lead_days = max(quoted_lead_time_days
                                    + RE_FIRE_PENALTY_DAYS * coating_revision_count
                                    - EXPEDITE_RECOVERY_DAYS * expedite_tier, 0)
          horizon_days = EXPEDITE_HORIZON_DAYS
          The expedited variant both credits the recovery days bought by the
          expedite tier and judges the surviving float against the shorter
          near-term horizon, so it diverges from NOMINAL in two terms.
    formula: |
      Shared tail, evaluated with the variant's effective_lead_days and horizon_days:
        days_to_deadline  = (package.weather_tightness_deadline_date - date(logical clock now)) in whole days
        lead_component    = clamp(effective_lead_days / max(days_to_deadline, 1), 0, 1)
        float_days        = days_to_deadline - effective_lead_days
        calendar_component= clamp(1 - float_days / horizon_days, 0, 1)
        coating_component = clamp(coating_revision_count / MAX_TOLERATED_REVISIONS, 0, 1)
        risk_score = round_half_up(100 * (W_LEAD * lead_component
                                        + W_CALENDAR * calendar_component
                                        + W_COATING * coating_component), 2)
        risk_flag  = risk_score >= RISK_THRESHOLD
    input_set: "the order's own quoted_lead_time_days, coating_revision_count and expedite_tier plus the parent package's weather_tightness_deadline_date; PanelLot rows do not participate"
    precision: "risk_score 2 decimal places, round_half_up; effective_lead_days integer days; components are not rounded before weighting"
    worked_example: |
      clock 2026-08-03, package.weather_tightness_deadline_date 2026-12-16 -> days_to_deadline 135
      order A: quoted_lead_time_days 96, coating_revision_count 1, expedite_tier 0
        variant EXPEDITE_ADJUSTED (revision count >= 1): effective_lead_days 117,
        lead 117/135 = 0.866666..., float 18, calendar 1 - 18/45 = 0.6, coating 0.5
        risk_score = 70.00 exactly -> risk_flag true (>= threshold)
        the same row forced through NOMINAL (horizon 90) scores 77.00 -> delta 7.00
      order A with quoted_lead_time_days 95: effective_lead_days 116 -> risk_score 68.89, risk_flag false
      clock 2026-08-03, deadline 2026-12-15 -> days_to_deadline 134
      order B: quoted 90, revisions 0, expedite_tier 0 -> NOMINAL, risk_score 48.11
      order B after request-expedite tier 1 -> EXPEDITE_ADJUSTED, effective_lead_days 80,
        lead 80/134 = 0.597014..., float 54, calendar 1 - 54/45 = 0 (clamped) -> risk_score 26.87

  - name: thermal_movement_allowance_mm
    entity: InstallationZone
    output_fields: [thermal_movement_allowance_mm]
    algorithm_type: constraint_propagation
    trigger: "POST /installation-zones, POST /facade-packages/{id}/system-decision (recomputes every zone), POST /installation-zones/{id}/retune-joint"
    constants:
      THERMAL_COEFF_PER_C: "0.0000234"
      SYSTEM_FACTOR_UNITIZED: "1.00"
      SYSTEM_FACTOR_STICK_BUILT: "1.25"
      ANCHOR_FACTOR_SLOTTED: "1.30"
      ANCHOR_FACTOR_PINNED: "1.15"
      ANCHOR_FACTOR_FIXED: "1.00"
      ELEVATION_ADDEND_LOW_MM: "0.00"
      ELEVATION_ADDEND_MID_MM: "1.50"
      ELEVATION_ADDEND_HIGH_MM: "3.00"
      ELEVATION_BAND_LOW_MAX_M: "20.0"
      ELEVATION_BAND_MID_MAX_M: "40.0"
    formula: |
      Full 2 x 3 x 3 matrix (system_type x anchor_type x elevation band); every one of
      the 18 combinations is reachable and no combination collapses into another.
        system_factor  = SYSTEM_FACTOR_UNITIZED | SYSTEM_FACTOR_STICK_BUILT   (package.system_type)
        anchor_factor  = ANCHOR_FACTOR_SLOTTED | ANCHOR_FACTOR_PINNED | ANCHOR_FACTOR_FIXED
                         (zone.anchor_type)
        elevation_addend_mm = ELEVATION_ADDEND_LOW_MM   when height_m <= 20.0
                              ELEVATION_ADDEND_MID_MM   when 20.0 <  height_m <= 40.0
                              ELEVATION_ADDEND_HIGH_MM  when height_m >  40.0
        thermal_movement_allowance_mm = round_half_up(
            span_mm * THERMAL_COEFF_PER_C * package.design_temp_delta_c
            * system_factor * anchor_factor + elevation_addend_mm, 2)
      When package.system_type is still UNDECIDED the field is null and the zone
      cannot be certified weather-tight.
    precision: "2 decimal places, round_half_up; the addend is applied after the multiplicative chain, never before"
    worked_example: |
      design_temp_delta_c 60.0
      span 3200, UNITIZED,    SLOTTED, height 18.0 -> 5.84
      span 3200, STICK_BUILT, SLOTTED, height 18.0 -> 7.30
      span 3200, UNITIZED,    SLOTTED, height 20.0 -> 5.84  (band boundary, low band)
      span 3200, UNITIZED,    SLOTTED, height 20.5 -> 7.34  (mid band, +1.50)
      span 3200, UNITIZED,    FIXED,   height 45.0 -> 7.49  (high band, +3.00)
      span 4200, STICK_BUILT, PINNED,  height 30.0 -> 9.98

  - name: zone_deflection_limit_mm
    entity: InstallationZone
    output_fields: [deflection_limit_mm]
    algorithm_type: threshold
    trigger: "POST /installation-zones and POST /facade-packages/{id}/system-decision"
    constants:
      DEFLECTION_DIVISOR_UNITIZED: 240
      DEFLECTION_DIVISOR_STICK_BUILT: 175
    formula: |
      divisor = DEFLECTION_DIVISOR_UNITIZED when package.system_type == UNITIZED
                else DEFLECTION_DIVISOR_STICK_BUILT
      deflection_limit_mm = round_half_up(span_mm / divisor, 2)
      A STRUCTURAL_DEFLECTION FieldTest passes only when
      measured_deflection_mm < deflection_limit_mm (equality fails).
    precision: "2 decimal places, round_half_up"
    worked_example: |
      span 3200, UNITIZED    -> 3200/240 = 13.33
      span 3200, STICK_BUILT -> 3200/175 = 18.29
      span 4200, STICK_BUILT -> 4200/175 = 24.00

  - name: earned_value_certified_cents
    entity: FacadePackage
    output_fields: [certified_area_sqm, earned_value_certified_cents, retention_held_cents]
    algorithm_type: aggregation
    trigger: "POST /installation-zones/{id}/certify-weather-tight, the weather-tight revert cascades, and GET /facade-packages/{id}/earned-value"
    constants:
      WEATHER_TIGHT_MILESTONE_FACTOR: "0.95"
      RETENTION_RATE: "0.05"
    formula: |
      Sequential dependency - three ordered stages, each consuming the rounded
      output of the previous one:
        stage 1 (per zone, ordered by weather_tight_at ASC then created_at ASC):
          for every InstallationZone of the package with weather_status == WEATHER_TIGHT:
            certified_line_cents = round_half_up(zone.area_sqm
                                   * package.unit_rate_cents_per_sqm
                                   * WEATHER_TIGHT_MILESTONE_FACTOR)
        stage 2: certified_subtotal_cents = sum of the stage-1 line values
                 (each line already rounded to whole cents - never round the
                  un-rounded products once at the end)
                 certified_area_sqm = round_half_up(sum of those zones' area_sqm, 2)
        stage 3: retention_held_cents = round_half_up(certified_subtotal_cents * RETENTION_RATE)
                 earned_value_certified_cents = certified_subtotal_cents - retention_held_cents
      Retention is taken on the rounded subtotal, not on each line.
    input_set: "only zones whose weather_status == WEATHER_TIGHT at evaluation time; zones in NOT_TIGHT or REMEDIATION contribute nothing, so a revert cascade removes their line"
    precision: "integer cents, round_half_up at stage 1 and again at stage 3; certified_area_sqm 2 decimal places"
    worked_example: |
      unit_rate_cents_per_sqm 148733, two weather-tight zones
        zone A 412.37 sqm -> 58266376
        zone B 388.63 sqm -> 54912001
      certified_area_sqm = 801.00
      certified_subtotal_cents = 113178377
      retention_held_cents     = 5658919
      earned_value_certified_cents = 107519458
      Rounding once on the summed product instead would give subtotal 113178376 and
      earned 107519457 - one cent low.
      With zone B reverted to REMEDIATION: subtotal 58266376, retention 2913319,
      earned 55353057.

  - name: mockup_test_invoice_cents
    entity: MockupTest
    output_fields: [invoice_subtotal_cents, surcharge_cents, invoice_cents]
    algorithm_type: tiered_pricing
    trigger: "POST /mockup-tests and POST /mockup-tests/{id}/record-result"
    constants:
      MOCKUP_BASE_FEE_CENTS: 480000
      CHAMBER_HOUR_RATE_CENTS: 21500
      TIER1_MAX_CENTS: 600000
      TIER1_RATE: "0.02"
      TIER2_MAX_CENTS: 800000
      TIER2_RATE: "0.04"
      TIER3_MAX_CENTS: 2000000
      TIER3_RATE: "0.06"
      TIER4_RATE: "0.10"
    formula: |
      Sequential dependency with a deliberate re-tiering trap:
        stage 0: chamber_hours = ceil((window_end - window_start) in hours) * chambers_required
        stage 1: invoice_subtotal_cents = MOCKUP_BASE_FEE_CENTS
                 + chamber_hours * CHAMBER_HOUR_RATE_CENTS
        stage 2: surcharge_cents = 0 when retest_of_test_id is null, otherwise
                 round_half_up(invoice_subtotal_cents * tier_rate(invoice_subtotal_cents))
                 tier_rate(s) = TIER1_RATE when s <= TIER1_MAX_CENTS
                                TIER2_RATE when s <= TIER2_MAX_CENTS
                                TIER3_RATE when s <= TIER3_MAX_CENTS
                                TIER4_RATE otherwise
        stage 3: invoice_cents = invoice_subtotal_cents + surcharge_cents
      The tier is selected from the stage-1 subtotal only. It must never be
      re-selected from invoice_cents after the surcharge is added, even when
      the total crosses the next tier ceiling.
    precision: "integer cents, round_half_up on the surcharge"
    worked_example: |
      window 2026-08-05T06:00:00Z -> 2026-08-05T20:00:00Z (14 h) with chambers_required 1
        -> chamber_hours 14
      chamber_hours 14, first attempt (retest_of_test_id null):
        subtotal 781000, surcharge 0, total 781000
      chamber_hours 14, retest: subtotal 781000 -> tier 0.04 -> surcharge 31240,
        total 812240. Re-tiering on the 812240 total would pick 0.06 and yield
        827860 - wrong.
      chamber_hours 6,  retest: subtotal 609000 -> tier 0.04 -> surcharge 24360, total 633360
      chamber_hours 72, retest: subtotal 2028000 -> tier 0.10 -> surcharge 202800, total 2230800

  - name: engineering_posture
    entity: FacadePackage
    output_fields: [engineering_posture, blocking_submittal_count, open_critical_defect_count]
    algorithm_type: constraint_propagation
    trigger: "every submittal review/resubmit, every field-test result, every defect transition, every mockup result"
    constants:
      RESTRICTED_AT_OPEN_CRITICAL: 1
      FROZEN_AT_OPEN_CRITICAL: 2
    formula: |
      blocking_submittal_count  = count of the package's ShopDrawingSubmittal rows with
                                  state IN {REVISION_REQUIRED, ESCALATED}
      open_critical_defect_count= count of the package's DefectItem rows with
                                  severity == CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED}
      engineering_posture = FROZEN     when any submittal of the package is ESCALATED
                                       OR open_critical_defect_count >= FROZEN_AT_OPEN_CRITICAL
                            RESTRICTED when blocking_submittal_count >= 1
                                       OR open_critical_defect_count == RESTRICTED_AT_OPEN_CRITICAL
                            OPEN       otherwise
      The posture is re-derived from scratch on every contributing write and reaches a
      fixed point in one pass; it is never incremented in place.
    input_set: "the package's submittals and defect items only"
    precision: "exact enum, no rounding"
    worked_example: |
      no blocking submittal, no open critical defect -> OPEN
      one submittal REVISION_REQUIRED, no defects    -> RESTRICTED (blocking_submittal_count 1)
      one CRITICAL defect OPEN                        -> RESTRICTED (open_critical_defect_count 1)
      two CRITICAL defects OPEN                       -> FROZEN
      one submittal ESCALATED                         -> FROZEN even with zero defects

  - name: glass_lite_ledger
    entity: GlassOrder
    output_fields: [committable_lites, allocated_lites, breakage_stock_lites, available_stock_lites, drawn_lites, unallocated_lites]
    algorithm_type: waterfall_allocation
    trigger: "POST /glass-orders/{id}/receive, POST /fabrication-releases, POST /breakage-draws, POST /breakage-draws/{id}/cancel"
    constants:
      BREAKAGE_STOCK_PCT: "0.03"
      LITES_PER_PANEL: 2
    formula: |
      Commitment base:
        committable_lites    = received_lites when state IN {RECEIVED, CLOSED}
                               else ordered_lites
      On receipt:
        breakage_stock_lites = floor(received_lites * BREAKAGE_STOCK_PCT)   (floor, never round)
        before receipt breakage_stock_lites is 0 - no physical stock exists to hold back
      Allocation waterfall, in creation order of the PanelLot rows:
        lot.lite_count       = lot.panel_count * LITES_PER_PANEL
        allocated_lites      = sum of lite_count over every PanelLot of the order
        unallocated_lites    = committable_lites - allocated_lites - breakage_stock_lites
      Breakage stock split:
        drawn_lites          = sum of quantity_lites over BreakageDraw rows with status == DRAWN
        available_stock_lites= breakage_stock_lites - drawn_lites
      Two invariants must hold after every one of the trigger operations:
        committable_lites    == allocated_lites + breakage_stock_lites + unallocated_lites
        breakage_stock_lites == available_stock_lites + drawn_lites
      Breakage stock is reserved before allocation: a release may only consume from
      unallocated_lites, never from breakage_stock_lites. Because the commitment base
      switches from ordered_lites to received_lites at receipt, a short shipment
      retroactively shrinks unallocated_lites (it may go negative and is not clamped).
    precision: "integer lites; floor on the stock reservation"
    worked_example: |
      ordered_lites 240, still IN_PRODUCTION -> committable_lites 240, breakage_stock_lites 0,
        so a release of two 36-panel lots is admissible: allocated 144, unallocated 96
      received_lites 240 -> committable_lites 240, breakage_stock_lites = floor(7.2) = 7
      two lots of 36 panels -> allocated_lites 144
      unallocated_lites = 240 - 144 - 7 = 89
      a DRAWN breakage draw of 3 lites -> drawn_lites 3, available_stock_lites 4
      cancelling that draw -> drawn_lites 0, available_stock_lites 7 (no drift)

  - name: zone_crew_hour_ledger
    entity: InstallationZone
    output_fields: [consumed_crew_hours, remaining_crew_hours]
    algorithm_type: aggregation
    trigger: "POST /installation-zones/{id}/crew-days and POST /installation-zones/{id}/crew-days/{crew_day_id}/void"
    formula: |
      consumed_crew_hours  = sum over the zone's CrewDayLog rows with status == POSTED of
                             (crew_size * shift_hours)
      remaining_crew_hours = budget_crew_hours - consumed_crew_hours
      Invariant after every posting and every void:
        budget_crew_hours == consumed_crew_hours + remaining_crew_hours
      remaining_crew_hours may go negative; the overrun is reported, not clamped.
    input_set: "CrewDayLog rows of the zone with status == POSTED; VOIDED rows are excluded and the surviving day_index values are re-packed from 1"
    precision: "1 decimal place, round_half_up"
    worked_example: |
      budget_crew_hours 320.0 with POSTED logs 4x9.0, 4x8.0, 4x8.0
        consumed_crew_hours 100.0, remaining_crew_hours 220.0
      voiding the 4x9.0 log -> consumed_crew_hours 64.0, remaining_crew_hours 256.0
        and the two survivors are re-indexed to day_index 1 and 2

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in ascending priority; first violation wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: "X-Role header absent or empty"
    error_id: ERR_MISSING_ROLE
    http_status: 401
  - priority: 15
    category: auth
    applies_to: "every endpoint whose roles list is non-empty"
    condition: "X-Role is not one of the roles declared for the endpoint in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
  - priority: 20
    category: auth
    applies_to: "POST /shop-drawing-submittals/{id}/seal, POST /shop-drawing-submittals/{id}/start-review, POST /shop-drawing-submittals/{id}/review, POST /defect-items/{id}/reinspect, POST /installation-zones/{id}/crew-days"
    condition: "X-User-ID header absent or empty on an endpoint that records or compares an acting user"
    error_id: ERR_MISSING_USER
    http_status: 401
  - priority: 25
    category: format
    applies_to: "every write endpoint"
    condition: "a required input field is absent, null, or of the wrong JSON type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
  - priority: 30
    category: format
    applies_to: "every write endpoint carrying an enum, date or timestamp field"
    condition: "an enum field carries a value outside its declared set, or a date/timestamp field is not ISO-8601"
    error_id: ERR_INVALID_ENUM
    http_status: 400
  - priority: 32
    category: format
    applies_to: "POST /installation-zones, POST /glass-orders, POST /mockup-tests, POST /installation-zones/{id}/crew-days, POST /breakage-draws, POST /hoist-rigs"
    condition: "a numeric field violates its declared range (area/span/hours/rate <= 0, lite or panel counts < 1, tolerance_mm <= 0)"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 400
  - priority: 35
    category: format
    applies_to: "POST /mockup-tests, POST /hoist-reservations, POST /test-labs"
    condition: "window_end <= window_start on a reservation or test window"
