# =============================================================================
# PRD Benchmark Seed Tables — task_1009_fine_watch_boutique
# Fine-Watch Boutique & Service
# §1.0–§1.7 (this file). §1.8 → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1009. Fine-Watch Boutique & Service: inventory & serial/authentication, service
  (movement/battery/water) ticket, trade-in/consignment, waitlist/allocation,
  warranty & insurance appraisal, layaway, special order, provenance

domain_name: fine-watch-boutique
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # scarce authenticated watches allocated off a ranked waitlist
  secondary_archetype: ledger_reconciliation    # dual valuations (trade-in/consignment, market/insurance) feed customer store credit
  complexity_layers:
    - optimistic_concurrency                    # OCC on Watch.version guarding re-appraisal (CREATE-with-supersede)
    - cascading_side_effects                    # layaway default → watch freed → waitlist auto-offer
    - dual_variant_calculation                  # same inputs, two valuation algorithms diverge
    - rate_threshold_triggers                   # deposit-ratio floor, offer-expiry instant, bench buffer

  entity_topology: flat                          # peer entities linked by foreign keys, no nested-URL ownership tree
  state_machine_shape: parallel                  # ServiceTicket (status × payment_status) and Watch (status × authentication_status) carry independent dimensions; WaitlistEntry is cyclic
  relationship_patterns:
    - one_to_many                                # WatchModel→Watch, Customer→(WaitlistEntry, LayawayPlan, TradeInOffer, ServiceTicket)
    - self_referential                           # Watch.loaner_watch_id points at another Watch used as a loaner
    - cross_aggregate                            # ServiceTicket references Watch + Watchmaker across aggregates
  role_model: peer_roles                          # Associate (opaque ops), Client (entity_backed Customer), Watchmaker (entity_backed Watchmaker)
  consistency_model: immediate

  entity_count: 10
  state_machine_count: 6
  calculation_count: 6
  endpoint_count: 37
  error_code_count: 22
  role_count: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client full name" }
      - { name: email, type: string, source: input, description: "Client email (unique)" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: null }
      - { name: kyc_verified, type: boolean, source: input, description: "Whether identity/KYC has been verified; consignment settlement requires true", default: false }
      - { name: store_credit_cents, type: integer, source: system, description: "Boutique store-credit balance in cents; credited by trade-in/consignment settlement, drawn down when used as a layaway deposit, clawed back on inauthentic reversal. Never negative.", default: 0 }

  - name: WatchModel
    parent: null
    common_fields: true
    fields:
      - { name: brand, type: string, source: input, description: "Manufacturer, e.g. Rolex" }
      - { name: reference_number, type: string, source: input, description: "Model reference, e.g. 126610LN" }
      - { name: display_name, type: string, source: input, description: "Human-readable model name" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents; valuation base" }
      - { name: market_premium_bps, type: integer, source: input, description: "Secondary-market/scarcity premium over MSRP in basis points, used by INSURANCE_REPLACEMENT appraisal", default: 0 }
      - { name: allocation_controlled, type: boolean, source: input, description: "If true, arriving watches of this model are allocated off the waitlist rather than sold freely", default: false }
      - { name: lifecycle, type: enum, source: input, description: "Catalog lifecycle; ACTIVE models accept waitlist joins, DISCONTINUED do not", default: ACTIVE, constraints: "ACTIVE | DISCONTINUED" }

  - name: Watch
    parent: null
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> WatchModel.id" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial (unique across all watches)" }
      - { name: condition_grade, type: enum, source: input, description: "Physical condition", constraints: "NEW | MINT | EXCELLENT | GOOD | FAIR" }
      - { name: has_box_papers, type: boolean, source: input, description: "Full set (box + papers) present; adds valuation premium", default: false }
      - { name: list_price_cents, type: integer, source: input, description: "Boutique asking price in cents" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Cost basis to the boutique in cents", default: null }
      - { name: is_loaner, type: boolean, source: input, description: "If true this watch is a service loaner, not for sale; occupies loan intervals", default: false }
      - { name: source, type: enum, source: system, description: "How the boutique acquired the piece", default: PURCHASE, constraints: "PURCHASE | TRADE_IN | CONSIGNMENT" }
      - { name: authentication_status, type: enum, source: system, description: "Authentication dimension of the watch state machine", default: UNVERIFIED, constraints: "UNVERIFIED | AUTHENTICATED | FLAGGED" }
      - { name: status, type: enum, source: system, description: "Inventory/lifecycle dimension of the watch state machine", default: IN_STOCK, constraints: "IN_STOCK | OFFERED | RESERVED | IN_SERVICE | CONSIGNED | SOLD" }
      - { name: current_appraisal_id, type: string, source: system, description: "Denormalized pointer to the most recent Appraisal.id that superseded all prior ones (discover appraisals via GET /watches/{id}/appraisals); null until first appraisal", default: null }

  - name: Watchmaker
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Watchmaker name" }
      - { name: specialties, type: array, source: input, description: "Service types the watchmaker handles, e.g. [MOVEMENT_OVERHAUL, WATER_RESISTANCE]", default: [] }
      - { name: active, type: boolean, source: input, description: "Whether the watchmaker currently accepts new tickets", default: true }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: model_id, type: string, source: input, description: "FK -> WatchModel.id" }
      - { name: priority_tier, type: enum, source: input, description: "Allocation priority band", default: STANDARD, constraints: "STANDARD | PREMIER | VIP" }
      - { name: deposit_cents, type: integer, source: input, description: "Good-faith deposit in cents; higher deposit breaks priority ties", default: 0 }
      - { name: allocated_watch_id, type: string, source: system, description: "FK -> Watch.id; the watch offered/allocated to this entry, null until offered", default: null }
      - { name: offer_expires_at, type: datetime, source: system, description: "Instant at/after which an outstanding OFFER lapses (offer_start + OFFER_WINDOW_DAYS)", default: null }
      - { name: status, type: enum, source: system, description: "Waitlist lifecycle", default: WAITING, constraints: "WAITING | OFFERED | ALLOCATED | EXPIRED | DECLINED" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: watch_id, type: string, source: input, description: "FK -> Watch.id; the watch being serviced" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owner requesting service" }
      - { name: watchmaker_id, type: string, source: input, description: "FK -> Watchmaker.id; assigned bench" }
      - { name: service_type, type: enum, source: input, description: "Kind of service", constraints: "BATTERY | MOVEMENT_OVERHAUL | WATER_RESISTANCE" }
      - { name: movement_complexity, type: enum, source: input, description: "Movement complexity multiplier band", default: STANDARD, constraints: "STANDARD | CHRONOGRAPH | GRAND_COMPLICATION" }
      - { name: water_resistance_target_m, type: integer, source: input, description: "Target water resistance in metres (WATER_RESISTANCE only)", default: null }
      - { name: parts_cost_cents, type: integer, source: input, description: "Parts cost in cents", default: 0 }
      - { name: appt_start, type: datetime, source: input, description: "Bench appointment start (inclusive)" }
      - { name: appt_end, type: datetime, source: input, description: "Bench appointment end (exclusive)" }
      - { name: loaner_watch_id, type: string, source: input, description: "FK -> Watch.id; optional loaner unit reserved for the customer", default: null }
      - { name: loan_start, type: datetime, source: input, description: "Loan interval start (inclusive)", default: null }
      - { name: loan_end, type: datetime, source: input, description: "Loan interval end (inclusive)", default: null }
      - { name: quoted_cents, type: integer, source: computed, description: "Service quote computed at diagnosis (service_quote calculation)", default: null }
      - { name: amount_paid_cents, type: integer, source: system, description: "Cumulative payments applied to the ticket in cents", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension of the ticket state machine", default: UNPAID, constraints: "UNPAID | PARTIALLY_PAID | PAID" }
      - { name: status, type: enum, source: system, description: "Workflow dimension of the ticket state machine", default: RECEIVED, constraints: "RECEIVED | DIAGNOSED | READY | COLLECTED | CANCELLED" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: watch_id, type: string, source: input, description: "FK -> Watch.id; the appraised watch" }
      - { name: purpose, type: enum, source: input, description: "Business reason for the appraisal", constraints: "WARRANTY | INSURANCE | SALE" }
      - { name: valuation_basis, type: enum, source: input, description: "Which valuation algorithm to apply", constraints: "MARKET | INSURANCE_REPLACEMENT" }
      - { name: condition_grade_snapshot, type: enum, source: system, description: "Watch.condition_grade captured at appraisal time", constraints: "NEW | MINT | EXCELLENT | GOOD | FAIR" }
      - { name: market_value_cents, type: integer, source: computed, description: "MARKET valuation output (condition-adjusted)" }
      - { name: replacement_value_cents, type: integer, source: computed, description: "INSURANCE_REPLACEMENT valuation output (retail + scarcity, condition-independent)" }
      - { name: appraised_value_cents, type: integer, source: computed, description: "The value selected by valuation_basis (market_value_cents or replacement_value_cents)" }

  - name: TradeInOffer
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the consignor/seller" }
      - { name: incoming_brand, type: string, source: input, description: "Brand of the piece being brought in" }
      - { name: incoming_reference, type: string, source: input, description: "Model reference of the incoming piece" }
      - { name: serial_number, type: string, source: input, description: "Serial of the incoming piece (used when a Watch is minted on settlement)" }
      - { name: est_model_msrp_cents, type: integer, source: input, description: "Estimated MSRP of the incoming model in cents; valuation base" }
      - { name: condition_grade, type: enum, source: input, description: "Assessed condition of the incoming piece", constraints: "NEW | MINT | EXCELLENT | GOOD | FAIR" }
      - { name: has_box_papers, type: boolean, source: input, description: "Full set present on the incoming piece", default: false }
      - { name: disposition, type: enum, source: input, description: "TRADE_IN (instant credit) or CONSIGNMENT (proceeds after commission)", constraints: "TRADE_IN | CONSIGNMENT" }
      - { name: appraised_market_cents, type: integer, source: computed, description: "Condition-adjusted market value of the incoming piece" }
      - { name: commission_rate_bps, type: integer, source: computed, description: "Consignment commission rate in basis points (CONSIGNMENT only, else null)", default: null }
      - { name: quoted_credit_cents, type: integer, source: computed, description: "Store credit the customer receives on settlement, per disposition" }
      - { name: resulting_watch_id, type: string, source: system, description: "FK -> Watch.id; inventory watch minted when the offer settles, null until then", default: null }
      - { name: status, type: enum, source: system, description: "Offer lifecycle", default: QUOTED, constraints: "QUOTED | ACCEPTED | SETTLED | DECLINED | REVERSED" }

  - name: LayawayPlan
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: watch_id, type: string, source: input, description: "FK -> Watch.id; the reserved watch" }
      - { name: deposit_cents, type: integer, source: input, description: "Down payment in cents; must be >= MIN_DEPOSIT_RATE * total_price_cents" }
      - { name: use_store_credit, type: boolean, source: input, description: "If true the deposit is drawn from Customer.store_credit_cents", default: false }
      - { name: term_months, type: integer, source: input, description: "Number of monthly installments financing the balance" }
      - { name: first_due_at, type: datetime, source: input, description: "Due date of the first installment" }
      - { name: total_price_cents, type: integer, source: system, description: "Snapshot of Watch.list_price_cents at plan creation" }
      - { name: per_installment_cents, type: integer, source: computed, description: "Floor(financed / term_months); charged for the first term_months-1 installments" }
      - { name: final_installment_cents, type: integer, source: computed, description: "financed - per_installment_cents * (term_months-1); absorbs the rounding remainder" }
      - { name: paid_cents, type: integer, source: system, description: "Cumulative amount paid including deposit" }
      - { name: remaining_cents, type: integer, source: computed, description: "total_price_cents - paid_cents; never negative" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", default: ACTIVE, constraints: "ACTIVE | PAID_OFF | FULFILLED | DEFAULTED | CANCELLED | VOIDED" }

  - name: ProvenanceEvent
    parent: null
    common_fields: false
    fields:
      - { name: watch_id, type: string, source: input, description: "FK -> Watch.id; the watch whose history this event records" }
      - { name: event_type, type: enum, source: system, description: "Provenance event kind", constraints: "INTAKE | AUTHENTICATED | FLAGGED | APPRAISED | SERVICED | LAYAWAY_RESERVED | ALLOCATED | TRADE_IN_INTAKE | REVERSED" }
      - { name: detail, type: string, source: system, description: "Human-readable description of the event" }
      - { name: actor_role, type: enum, source: system, description: "Role that caused the event", constraints: "Associate | Client | Watchmaker | system" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Watch
    field: authentication_status
    initial_state: UNVERIFIED
    terminal_states: [FLAGGED]
    note: "Authentication dimension; evolves independently of the inventory `status` dimension (parallel state machine)."
    transitions:
      - from: UNVERIFIED
        to: AUTHENTICATED
        trigger: "POST /watches/{id}/authenticate"
        actor: Associate
        preconditions:
          - "Watch.authentication_status == UNVERIFIED"
        side_effects:
          - "Append ProvenanceEvent(event_type=AUTHENTICATED)"
          - "increments Watch.version by 1"

      - from: UNVERIFIED
        to: FLAGGED
        trigger: "POST /watches/{id}/flag-inauthentic"
        actor: Associate
        preconditions:
          - "Watch.authentication_status IN {UNVERIFIED, AUTHENTICATED}"
        side_effects:
          - "Append ProvenanceEvent(event_type=FLAGGED)"
          - "CASCADE-B hop1 (see below)"
          - "increments Watch.version by 1"

      - from: AUTHENTICATED
        to: FLAGGED
        trigger: "POST /watches/{id}/flag-inauthentic"
        actor: Associate
        preconditions:
          - "Watch.authentication_status IN {UNVERIFIED, AUTHENTICATED}"
        side_effects:
          - "Append ProvenanceEvent(event_type=FLAGGED)"
          - "CASCADE-B hop1: this FLAGGED transition itself triggers, on the hop2 dependent, the void of any ACTIVE LayawayPlan whose watch_id == this watch (LayawayPlan.status ACTIVE->VOIDED, refund paid_cents to Customer.store_credit_cents) — the plan mutation is caused by the watch flagging, not by the original API caller"
          - "If this watch was a TRADE_IN intake (source==TRADE_IN and a SETTLED TradeInOffer has resulting_watch_id == this watch): reverse it — TradeInOffer.status SETTLED->REVERSED and Customer.store_credit_cents -= TradeInOffer.quoted_credit_cents (store-credit clawback invariant)"
          - "increments Watch.version by 1"

  - entity: Watch
    field: status
    initial_state: IN_STOCK
    terminal_states: [SOLD]
    note: "Inventory dimension; cyclic (IN_STOCK<->RESERVED, IN_STOCK<->IN_SERVICE, IN_STOCK<->OFFERED, IN_STOCK<->CONSIGNED)."
    transitions:
      - from: IN_STOCK
        to: OFFERED
        trigger: "POST /watches/{id}/offer (allocation) OR cascade auto-offer from layaway default"
        actor: Associate
        preconditions:
          - "Watch.status == IN_STOCK"
          - "Watch.authentication_status == AUTHENTICATED"
          - "At least one eligible WaitlistEntry exists (see waitlist_allocation_selector); else ERR_NO_ELIGIBLE_WAITLIST"
        side_effects:
          - "Selected WaitlistEntry.status WAITING->OFFERED, allocated_watch_id=this watch, offer_expires_at = clock_now + OFFER_WINDOW_DAYS"
          - "Append ProvenanceEvent(event_type=ALLOCATED)"

      - from: OFFERED
        to: IN_STOCK
        trigger: "POST /waitlist-entries/{id}/decline OR lazy offer expiry on accept"
        actor: "Client or Associate or system"
        preconditions:
          - "Watch.status == OFFERED"
        side_effects:
          - "WaitlistEntry.status OFFERED->DECLINED (decline) or OFFERED->EXPIRED (lapse)"
          - "COMPENSATING-INVARIANT-A: COUNT(Watch WHERE model_id==M AND status==IN_STOCK) restored to its pre-offer value"

      - from: OFFERED
        to: RESERVED
        trigger: "POST /waitlist-entries/{id}/accept"
        actor: "Client or Associate"
        preconditions:
          - "Watch.status == OFFERED"
          - "clock_now < WaitlistEntry.offer_expires_at (else ERR_OFFER_EXPIRED)"
        side_effects:
          - "WaitlistEntry.status OFFERED->ALLOCATED"

      - from: IN_STOCK
        to: RESERVED
        trigger: "POST /layaway-plans"
        actor: "Client or Associate"
        preconditions:
          - "Watch.status == IN_STOCK"
          - "Watch.authentication_status == AUTHENTICATED"
        side_effects:
          - "New LayawayPlan created ACTIVE; Append ProvenanceEvent(event_type=LAYAWAY_RESERVED)"

      - from: RESERVED
        to: IN_STOCK
        trigger: "POST /layaway-plans/{id}/default OR POST /layaway-plans/{id}/cancel"
        actor: "Associate or Client or system"
        preconditions:
          - "Watch.status == RESERVED"
        side_effects:
          - "CASCADE-A hop2: this RESERVED->IN_STOCK is caused by the plan leaving ACTIVE; on default it in turn triggers CASCADE-A hop3 (auto-offer to the top eligible WaitlistEntry) when the model is allocation_controlled and an eligible entry exists"

      - from: RESERVED
        to: SOLD
        trigger: "system (LayawayPlan reaches PAID_OFF and is fulfilled)"
        actor: system
        preconditions:
          - "Watch.status == RESERVED"
          - "LayawayPlan.status == PAID_OFF"
        side_effects:
          - "Append ProvenanceEvent(event_type=SERVICED? no — SOLD note)"

      - from: IN_STOCK
        to: IN_SERVICE
        trigger: "POST /service-tickets"
        actor: "Client or Associate"
        preconditions:
          - "Watch.status == IN_STOCK"
          - "Watch.authentication_status == AUTHENTICATED (cross-entity gate; FLAGGED/UNVERIFIED -> ERR_WATCH_NOT_AUTHENTICATED)"
        side_effects:
          - "New ServiceTicket created RECEIVED/UNPAID; bench + optional loaner intervals reserved"

      - from: IN_SERVICE
        to: IN_STOCK
        trigger: "POST /service-tickets/{id}/collect"
        actor: "Client or Associate"
        preconditions:
          - "Watch.status == IN_SERVICE"
          - "ServiceTicket.status == READY AND ServiceTicket.payment_status == PAID"
        side_effects:
          - "Append ProvenanceEvent(event_type=SERVICED); loaner interval released"

      - from: IN_STOCK
        to: CONSIGNED
        trigger: "POST /trade-in-offers/{id}/settle (disposition==CONSIGNMENT mints the watch already CONSIGNED)"
        actor: Associate
        preconditions:
          - "Watch minted by consignment settlement"
        side_effects:
          - "Append ProvenanceEvent(event_type=TRADE_IN_INTAKE)"

  - entity: WaitlistEntry
    field: status
    initial_state: WAITING
    terminal_states: [ALLOCATED, EXPIRED, DECLINED]
    note: "Cyclic: WAITING->OFFERED->WAITING is reachable because a declined re-queue may be re-offered; individual entry terminates at ALLOCATED/EXPIRED/DECLINED."
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /watches/{id}/offer OR cascade auto-offer"
        actor: "Associate or system"
        preconditions:
          - "WaitlistEntry.status == WAITING"
          - "WatchModel.lifecycle == ACTIVE"
          - "This entry is the top-ranked eligible entry (waitlist_allocation_selector)"
        side_effects:
          - "allocated_watch_id set, offer_expires_at set, paired Watch.status IN_STOCK->OFFERED"

      - from: OFFERED
        to: ALLOCATED
        trigger: "POST /waitlist-entries/{id}/accept"
        actor: "Client or Associate"
        preconditions:
          - "WaitlistEntry.status == OFFERED"
          - "clock_now < offer_expires_at (else ERR_OFFER_EXPIRED, entry -> EXPIRED)"
          - "allocated Watch.status == OFFERED (cross-entity gate on Watch)"
        side_effects:
          - "Paired Watch.status OFFERED->RESERVED"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /waitlist-entries/{id}/decline"
        actor: "Client or Associate"
        preconditions:
          - "WaitlistEntry.status == OFFERED"
        side_effects:
          - "Paired Watch.status OFFERED->IN_STOCK (compensating invariant A); allocated_watch_id cleared"

      - from: OFFERED
        to: EXPIRED
        trigger: "POST /waitlist-entries/{id}/accept after offer_expires_at (lazy expiry) — accept is rejected AND entry lapses"
        actor: system
        preconditions:
          - "WaitlistEntry.status == OFFERED"
          - "clock_now >= offer_expires_at"
        side_effects:
          - "Paired Watch.status OFFERED->IN_STOCK; allocated_watch_id cleared; ERR_OFFER_EXPIRED returned to caller"

  - entity: ServiceTicket
    field: status
    initial_state: RECEIVED
    terminal_states: [COLLECTED, CANCELLED]
    note: "Workflow dimension; evolves independently of the payment_status dimension (parallel state machine). `collect` guards on BOTH dimensions."
    transitions:
      - from: RECEIVED
        to: DIAGNOSED
        trigger: "POST /service-tickets/{id}/diagnose"
        actor: Watchmaker
        preconditions:
          - "ServiceTicket.status == RECEIVED"
        side_effects:
          - "quoted_cents computed by service_quote calculation"

      - from: DIAGNOSED
        to: READY
        trigger: "POST /service-tickets/{id}/finish"
        actor: Watchmaker
        preconditions:
          - "ServiceTicket.status == DIAGNOSED"
        side_effects:
          - "Append ProvenanceEvent(event_type=SERVICED) on the serviced watch"

      - from: READY
        to: COLLECTED
        trigger: "POST /service-tickets/{id}/collect"
        actor: "Client or Associate"
        preconditions:
          - "ServiceTicket.status == READY"
          - "ServiceTicket.payment_status == PAID (else ERR_PAYMENT_NOT_COMPLETE)"
        side_effects:
          - "Watch.status IN_SERVICE->IN_STOCK; loaner interval released"

      - from: [RECEIVED, DIAGNOSED]
        to: CANCELLED
        trigger: "system (watch flagged inauthentic while ticket open)"
        actor: system
        preconditions:
          - "ServiceTicket.status IN {RECEIVED, DIAGNOSED}"
        side_effects:
          - "Watch.status IN_SERVICE->IN_STOCK; loaner released"

  - entity: ServiceTicket
    field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID]
    note: "Payment dimension; parallel to workflow status."
    transitions:
      - from: [UNPAID, PARTIALLY_PAID]
        to: PARTIALLY_PAID
        trigger: "POST /service-tickets/{id}/payments (0 < amount_paid_cents < quoted_cents)"
        actor: "Client or Associate"
        preconditions:
          - "ServiceTicket.status IN {DIAGNOSED, READY} (must be quoted first)"
          - "amount_paid_cents + amount_cents <= quoted_cents (else ERR_OVERPAYMENT)"
        side_effects:
          - "amount_paid_cents += amount_cents"

      - from: [UNPAID, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /service-tickets/{id}/payments (amount_paid_cents reaches quoted_cents)"
        actor: "Client or Associate"
        preconditions:
          - "amount_paid_cents + amount_cents == quoted_cents (else ERR_OVERPAYMENT if >)"
        side_effects:
          - "amount_paid_cents = quoted_cents; ticket now collectable"

  - entity: LayawayPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [FULFILLED, DEFAULTED, CANCELLED, VOIDED]
    note: "Branching: ACTIVE forks to PAID_OFF->FULFILLED (success), DEFAULTED (grace lapse), CANCELLED (voluntary), or VOIDED (watch flagged)."
    transitions:
      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /layaway-plans/{id}/payments (paid_cents reaches total_price_cents)"
        actor: "Client or Associate"
        preconditions:
          - "LayawayPlan.status == ACTIVE"
          - "paid_cents + amount_cents == total_price_cents (else ERR_OVERPAYMENT if >)"
        side_effects:
          - "paid_cents = total_price_cents; remaining_cents = 0"

      - from: PAID_OFF
        to: FULFILLED
        trigger: "system (auto on final payment)"
        actor: system
        preconditions:
          - "LayawayPlan.status == PAID_OFF"
        side_effects:
          - "Watch.status RESERVED->SOLD"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /layaway-plans/{id}/default"
        actor: Associate
        preconditions:
          - "LayawayPlan.status == ACTIVE"
          - "clock_now >= first_due_at + DEFAULT_GRACE_DAYS (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE-A hop1: DEFAULTED status triggers, on the reserved Watch (hop2), Watch.status RESERVED->IN_STOCK; that freeing in turn triggers auto-offer (hop3) to the top eligible WaitlistEntry when model.allocation_controlled"
          - "Forfeit: paid_cents retained by boutique (no refund)"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /layaway-plans/{id}/cancel"
        actor: "Client or Associate"
        preconditions:
          - "LayawayPlan.status == ACTIVE"
        side_effects:
          - "Watch.status RESERVED->IN_STOCK"
          - "Refund = paid_cents - restocking fee (layaway_cancellation calc) credited to Customer.store_credit_cents"

      - from: ACTIVE
        to: VOIDED
        trigger: "system (watch flagged inauthentic — CASCADE-B hop2)"
        actor: system
        preconditions:
          - "LayawayPlan.status == ACTIVE"
        side_effects:
          - "Full refund: Customer.store_credit_cents += paid_cents; Watch already FLAGGED"

  - entity: TradeInOffer
    field: status
    initial_state: QUOTED
    terminal_states: [SETTLED, DECLINED, REVERSED]
    note: "Branching by disposition: settlement side-effects diverge for TRADE_IN vs CONSIGNMENT."
    transitions:
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /trade-in-offers/{id}/accept"
        actor: "Client or Associate"
        preconditions:
          - "TradeInOffer.status == QUOTED"
        side_effects: []

      - from: QUOTED
        to: DECLINED
        trigger: "system/associate (offer withdrawn) — reachable via decline; modeled through accept precondition failure path"
        actor: Associate
        preconditions:
          - "TradeInOffer.status == QUOTED"
        side_effects: []

      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /trade-in-offers/{id}/settle"
        actor: Associate
        preconditions:
          - "TradeInOffer.status == ACCEPTED"
          - "disposition==CONSIGNMENT requires Customer.kyc_verified == true (else ERR_KYC_REQUIRED)"
        side_effects:
          - "Mint inventory Watch (serial_number, source=TRADE_IN if TRADE_IN else CONSIGNMENT; status IN_STOCK for TRADE_IN, CONSIGNED for CONSIGNMENT); set resulting_watch_id"
          - "Customer.store_credit_cents += quoted_credit_cents (store-credit conservation invariant B counterpart)"
          - "Append ProvenanceEvent(event_type=TRADE_IN_INTAKE)"

      - from: SETTLED
        to: REVERSED
        trigger: "system (resulting watch flagged inauthentic)"
        actor: system
        preconditions:
          - "TradeInOffer.status == SETTLED"
        side_effects:
          - "Customer.store_credit_cents -= quoted_credit_cents (clawback; invariant B closes)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appraisal-create-stale-watch
    parent_entity: Watch
    write_endpoint: "POST /watches/{id}/appraisals"
    occ_field: "expected_watch_version"
    description: |
      Creating an Appraisal against a Watch whose version has advanced since the
      client last observed it is rejected. A new appraisal legitimately supersedes
      the prior current_appraisal_id, so a second create that still carries the
      stale version the client read before an earlier appraisal (or authenticate)
      bumped it observes a stale Watch.version and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: appraisal_valuation
    trigger: "POST /watches/{id}/appraisals"
    algorithm: dual_variant
    formula: |
      condition_factor = CONDITION_FACTOR[watch.condition_grade]
      box_premium = watch.has_box_papers ? BOX_PAPERS_PREMIUM : 0.0
      # MARKET: condition-adjusted resale value
      market_value_cents = round_half_up(model.msrp_cents * condition_factor * (1 + box_premium))
      # INSURANCE_REPLACEMENT: cost to replace at retail incl. scarcity; condition ignored
      replacement_value_cents = round_half_up(model.msrp_cents * (1 + model.market_premium_bps / 10000))
      appraised_value_cents = (valuation_basis == MARKET) ? market_value_cents : replacement_value_cents
    input_set: "The single target Watch and its WatchModel; condition_grade snapshotted."
    constants:
      CONDITION_FACTOR: { NEW: 1.00, MINT: 0.95, EXCELLENT: 0.88, GOOD: 0.78, FAIR: 0.65 }
      BOX_PAPERS_PREMIUM: 0.08
    precision: "integer cents, round_half_up"
    variants:
      - name: market
        when: "valuation_basis == MARKET (WARRANTY/SALE appraisals)"
        difference: "Multiplies MSRP by condition_factor and box premium; DEPRECIATES for wear."
      - name: insurance_replacement
        when: "valuation_basis == INSURANCE_REPLACEMENT (INSURANCE appraisals)"
        difference: "Uses retail MSRP plus scarcity premium, IGNORING condition; yields a higher figure for a worn scarce piece."

  - name: trade_in_valuation
    trigger: "POST /trade-in-offers"
    algorithm: dual_variant
    formula: |
      condition_factor = CONDITION_FACTOR[offer.condition_grade]
      box_premium = offer.has_box_papers ? BOX_PAPERS_PREMIUM : 0.0
      appraised_market_cents = round_half_up(offer.est_model_msrp_cents * condition_factor * (1 + box_premium))
      if disposition == TRADE_IN:
        commission_rate_bps = null
        quoted_credit_cents = round_half_up(appraised_market_cents * TRADE_IN_RATE)
      else:  # CONSIGNMENT
        commission_rate_bps = (appraised_market_cents <= CONSIGN_TIER1_CENTS) ? 2000
                              : (appraised_market_cents <= CONSIGN_TIER2_CENTS) ? 1500
                              : 1000
        quoted_credit_cents = round_half_up(appraised_market_cents * (1 - commission_rate_bps / 10000))
    input_set: "The incoming piece described on the offer plus its disposition."
    constants:
      CONDITION_FACTOR: { NEW: 1.00, MINT: 0.95, EXCELLENT: 0.88, GOOD: 0.78, FAIR: 0.65 }
      BOX_PAPERS_PREMIUM: 0.08
      TRADE_IN_RATE: 0.70
      CONSIGN_TIER1_CENTS: 500000
      CONSIGN_TIER2_CENTS: 2000000
    precision: "integer cents, round_half_up"
    variants:
      - name: trade_in
        when: "disposition == TRADE_IN"
        difference: "Flat 70% of appraised market value, paid instantly as store credit."
      - name: consignment
        when: "disposition == CONSIGNMENT"
        difference: "Full appraised market value minus a tiered commission (20/15/10%); yields MORE credit than trade-in for the same piece."

  - name: service_quote
    trigger: "POST /service-tickets/{id}/diagnose"
    algorithm: threshold
    formula: |
      labor = BASE_LABOR[service_type] * COMPLICATION_MULT[movement_complexity]
      water_surcharge = (service_type == WATER_RESISTANCE)
                        ? ceil(water_resistance_target_m / 100.0) * WATER_SURCHARGE_PER_100M
                        : 0
      raw = labor + parts_cost_cents + water_surcharge
      quoted_cents = min(MAX_QUOTE_CENTS, max(MIN_QUOTE_CENTS, round_half_up(raw)))
    input_set: "The single ServiceTicket: service_type, movement_complexity, water_resistance_target_m, parts_cost_cents."
    constants:
      BASE_LABOR: { BATTERY: 8000, MOVEMENT_OVERHAUL: 60000, WATER_RESISTANCE: 25000 }
      COMPLICATION_MULT: { STANDARD: 1.0, CHRONOGRAPH: 1.5, GRAND_COMPLICATION: 2.5 }
      WATER_SURCHARGE_PER_100M: 5000
      MIN_QUOTE_CENTS: 12000
      MAX_QUOTE_CENTS: 500000
    precision: "integer cents, round_half_up; evaluation order: labor -> +parts -> +water -> clamp"

  - name: layaway_installment_schedule
    trigger: "POST /layaway-plans"
    algorithm: waterfall_allocation
    formula: |
      financed = total_price_cents - deposit_cents
      # ROUNDING ORDER IS PINNED: floor the per-installment first, the FINAL installment
      # absorbs the remainder. (round(financed/term) then multiply would NOT reconcile.)
      per_installment_cents = floor(financed / term_months)
      final_installment_cents = financed - per_installment_cents * (term_months - 1)
      # Invariant: per_installment_cents*(term_months-1) + final_installment_cents == financed
    input_set: "The single LayawayPlan at creation."
    constants:
      MIN_DEPOSIT_RATE: 0.20
      DEFAULT_GRACE_DAYS: 10
    precision: "integer cents; floor for per-installment, remainder to final installment"

  - name: layaway_cancellation
    trigger: "POST /layaway-plans/{id}/cancel"
    algorithm: aggregation
    formula: |
      restock_fee_cents = round_half_up(total_price_cents * RESTOCK_FEE_RATE)
      refund_cents = max(0, paid_cents - restock_fee_cents)
      # refund credited to Customer.store_credit_cents
    input_set: "The single ACTIVE LayawayPlan being cancelled."
    constants:
      RESTOCK_FEE_RATE: 0.05
    precision: "integer cents, round_half_up"

  - name: waitlist_allocation_selector
    trigger: "POST /watches/{id}/offer AND cascade auto-offer"
    algorithm: weighted_scoring
    formula: |
      candidates = WaitlistEntry WHERE status == WAITING
                   AND model_id == watch.model_id
                   AND WatchModel(model_id).lifecycle == ACTIVE
      # Deterministic ranking, no random/id inputs:
      rank_key = ( TIER_RANK[priority_tier] DESC,   # VIP=3 > PREMIER=2 > STANDARD=1
                   deposit_cents DESC,
                   created_at ASC )                  # created_at is the final tie-break (never id)
      selected = first(sort(candidates, rank_key))
      if candidates is empty: raise ERR_NO_ELIGIBLE_WAITLIST
    input_set: "WAITING WaitlistEntry rows for the watch's model whose model is ACTIVE."
    constants:
      TIER_RANK: { STANDARD: 1, PREMIER: 2, VIP: 3 }
      OFFER_WINDOW_DAYS: 7
    precision: "n/a (selection); ties resolved by created_at ASC"

  - name: service_scheduling_overlap
    trigger: "POST /service-tickets (bench + loaner interval reservation)"
    algorithm: interval_merge
    formula: |
      # Watchmaker bench (half-open [appt_start, appt_end) + buffer):
      #   conflict IFF NOT ( new_start >= existing_end + BENCH_BUFFER
      #                      OR existing_start >= new_end + BENCH_BUFFER )
      #   -> a gap of EXACTLY BENCH_BUFFER_MINUTES is allowed (>=).
      # Loaner watch (closed [loan_start, loan_end], touching endpoints allowed):
      #   conflict IFF ( new_start < existing_end AND existing_start < new_end )
      #   -> loan_end == next loan_start is NOT a conflict (adjacency permitted).
      bench_buffer = timedelta(minutes=BENCH_BUFFER_MINUTES)
    input_set: "Existing non-terminal ServiceTickets on the same watchmaker_id (bench) or the same loaner_watch_id (loaner)."
    constants:
      BENCH_BUFFER_MINUTES: 30
    precision: "minute-resolution UTC instants"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Watch.serial_number and TradeInOffer.serial_number unique across all watches"
    error_id: ERR_SERIAL_DUPLICATE
    http_status: 409
    applies_to: "POST /watches, POST /trade-in-offers/{id}/settle"

  - priority: 6
    category: business_constraint
    check: "A customer may hold only one non-terminal (WAITING/OFFERED) WaitlistEntry per model"
    error_id: ERR_DUPLICATE_WAITLIST
    http_status: 409
    applies_to: "POST /waitlist-entries"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "Outstanding waitlist OFFER has not lapsed (clock_now < offer_expires_at)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /waitlist-entries/{id}/accept"

  - priority: 9
    category: business_referential
    check: "Waitlist join requires WatchModel.lifecycle == ACTIVE (cross-entity: WaitlistEntry depends on WatchModel state)"
    error_id: ERR_MODEL_DISCONTINUED
    http_status: 409
    applies_to: "POST /waitlist-entries"

  - priority: 10
    category: business_safety
    check: "Watch.authentication_status == AUTHENTICATED before service, layaway reserve, offer, or appraisal-as-collateral (cross-entity: ServiceTicket/LayawayPlan depend on Watch auth)"
    error_id: ERR_WATCH_NOT_AUTHENTICATED
    http_status: 409
    applies_to: "POST /service-tickets, POST /layaway-plans, POST /watches/{id}/offer"

  - priority: 11
    category: business_referential
    check: "Consignment settlement requires Customer.kyc_verified == true"
    error_id: ERR_KYC_REQUIRED
    http_status: 409
    applies_to: "POST /trade-in-offers/{id}/settle"

  - priority: 12
    category: business_temporal
    check: "Bench appointment window must not fall within BENCH_BUFFER_MINUTES of another ticket on the same watchmaker (half-open interval + buffer)"
    error_id: ERR_WATCHMAKER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /service-tickets"

  - priority: 13
    category: business_temporal
    check: "Loaner watch loan interval must not overlap an existing loan on the same loaner (closed interval; touching endpoints allowed)"
    error_id: ERR_LOANER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /service-tickets"

  - priority: 14
    category: business_temporal
    check: "appt_start must be >= clock_now (no back-dated appointments)"
    error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 422
    applies_to: "POST /service-tickets"

  - priority: 15
    category: business_constraint
    check: "Offering a watch requires at least one eligible WaitlistEntry (non-empty candidate set)"
    error_id: ERR_NO_ELIGIBLE_WAITLIST
    http_status: 409
    applies_to: "POST /watches/{id}/offer"

  - priority: 16
    category: business_constraint
    check: "Target watch must be IN_STOCK for layaway reserve or offer"
    error_id: ERR_WATCH_UNAVAILABLE
    http_status: 409
    applies_to: "POST /layaway-plans, POST /watches/{id}/offer"

  - priority: 17
    category: business_fiscal
    check: "Layaway deposit_cents >= round_half_up(MIN_DEPOSIT_RATE * total_price_cents)"
    error_id: ERR_DEPOSIT_TOO_LOW
    http_status: 422
    applies_to: "POST /layaway-plans"

  - priority: 18
    category: business_fiscal
    check: "When use_store_credit, Customer.store_credit_cents >= deposit_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 422
    applies_to: "POST /layaway-plans"

  - priority: 19
    category: business_fiscal
    check: "A payment must not push cumulative paid above the owed total (ticket quoted_cents or plan total_price_cents)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /layaway-plans/{id}/payments, POST /service-tickets/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table (37 endpoints)
# =============================================================================
endpoints:
  # --- Customers ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [Associate]
    code: 201
    input: [full_name, email, "phone?", "kyc_verified?"]
    output: Customer
    side_effects: ["store_credit_cents=0"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (including store_credit_cents)"
    roles: [Associate, Client]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Watch models ---
  - method: POST
    path: "/watch-models"
    description: "Create a catalog model"
    roles: [Associate]
    code: 201
    input: [brand, reference_number, display_name, msrp_cents, "market_premium_bps?", "allocation_controlled?", "lifecycle?"]
    output: WatchModel
    side_effects: []

  - method: GET
    path: "/watch-models/{id}"
    description: "Get a model"
    roles: [Associate, Client]
    code: 200
    input: []
    output: WatchModel
    side_effects: []

  # --- Watchmakers ---
  - method: POST
    path: "/watchmakers"
    description: "Create a watchmaker (service bench)"
    roles: [Associate]
    code: 201
    input: [display_name, "specialties?", "active?"]
    output: Watchmaker
    side_effects: []

  - method: GET
    path: "/watchmakers/{id}"
    description: "Get a watchmaker"
    roles: [Associate, Client, Watchmaker]
    code: 200
    input: []
    output: Watchmaker
    side_effects: []

  # --- Watches (inventory) ---
  - method: POST
    path: "/watches"
    description: "Take a watch into inventory"
    roles: [Associate]
    code: 201
    input: [model_id, serial_number, condition_grade, list_price_cents, "has_box_papers?", "acquisition_cost_cents?", "is_loaner?"]
    output: Watch
    side_effects: ["status=IN_STOCK, authentication_status=UNVERIFIED", "Append ProvenanceEvent(INTAKE)"]

  - method: GET
    path: "/watches/{id}"
    description: "Get a watch"
    roles: [Associate, Client]
    code: 200
    input: []
    output: Watch
    side_effects: []

  - method: GET
    path: "/watches"
    description: "List/search watches"
    roles: [Associate, Client]
    code: 200
    input: ["model_id?", "status?", "authentication_status?", "is_loaner?", "limit?", "offset?"]
    output: Watch[]
    side_effects: []

  - method: POST
    path: "/watches/{id}/authenticate"
    description: "Authenticate a watch (serial verified)"
    roles: [Associate]
    code: 200
    input: []
    output: Watch
    side_effects: ["authentication_status UNVERIFIED->AUTHENTICATED", "Append ProvenanceEvent(AUTHENTICATED)", "increments Watch.version by 1"]

  - method: POST
    path: "/watches/{id}/flag-inauthentic"
    description: "Flag a watch as inauthentic (triggers void/reversal cascades)"
    roles: [Associate]
    code: 200
    input: ["reason?"]
    output: Watch
    side_effects:
      - "authentication_status -> FLAGGED"
      - "CASCADE-B: ACTIVE LayawayPlan on this watch -> VOIDED, refund paid_cents to Customer.store_credit_cents"
      - "If TRADE_IN intake: linked SETTLED TradeInOffer -> REVERSED, store_credit clawback"
      - "Open ServiceTicket (RECEIVED/DIAGNOSED) -> CANCELLED, watch IN_SERVICE->IN_STOCK"
      - "Append ProvenanceEvent(FLAGGED)"
      - "increments Watch.version by 1"

  - method: GET
    path: "/watches/{id}/provenance"
    description: "Get the append-only provenance history of a watch"
    roles: [Associate, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: ProvenanceEvent[]
    side_effects: []

  - method: POST
    path: "/watches/{id}/appraisals"
    description: "Create an appraisal (OCC on Watch.version; supersedes prior current_appraisal_id)"
    roles: [Associate]
    code: 201
    input: [purpose, valuation_basis, expected_watch_version]
    output: Appraisal
    side_effects:
      - "Compute market_value_cents, replacement_value_cents, appraised_value_cents (appraisal_valuation)"
      - "Set Watch.current_appraisal_id"
      - "Append ProvenanceEvent(APPRAISED)"
      - "increments Watch.version by 1"

  - method: GET
    path: "/watches/{id}/appraisals"
    description: "List appraisals for a watch (newest supersedes)"
    roles: [Associate, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  - method: POST
    path: "/watches/{id}/offer"
    description: "Allocate an IN_STOCK watch to the top eligible waitlist entry"
    roles: [Associate]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects:
      - "waitlist_allocation_selector picks entry; entry WAITING->OFFERED"
      - "Watch.status IN_STOCK->OFFERED; offer_expires_at = clock_now + OFFER_WINDOW_DAYS"
      - "Append ProvenanceEvent(ALLOCATED)"

  # --- Waitlist ---
  - method: POST
    path: "/waitlist-entries"
    description: "Join the waitlist for a model"
    roles: [Associate, Client]
    code: 201
    input: [customer_id, model_id, "priority_tier?", "deposit_cents?"]
    output: WaitlistEntry
    side_effects: ["status=WAITING"]

  - method: GET
    path: "/waitlist-entries/{id}"
    description: "Get a waitlist entry"
    roles: [Associate, Client]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/waitlist-entries"
    description: "List/search waitlist entries"
    roles: [Associate, Client]
    code: 200
    input: ["customer_id?", "model_id?", "allocated_watch_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: POST
    path: "/waitlist-entries/{id}/accept"
    description: "Accept an offer (reserves the watch); lapsed offers are rejected and expired"
    roles: [Associate, Client]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status OFFERED->ALLOCATED; Watch.status OFFERED->RESERVED", "If lapsed: status->EXPIRED, Watch->IN_STOCK, ERR_OFFER_EXPIRED"]

  - method: POST
    path: "/waitlist-entries/{id}/decline"
    description: "Decline an offer (returns watch to stock)"
    roles: [Associate, Client]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status OFFERED->DECLINED; Watch.status OFFERED->IN_STOCK (compensating invariant A)"]

  # --- Service tickets ---
  - method: POST
    path: "/service-tickets"
    description: "Open a service ticket (reserves bench + optional loaner)"
    roles: [Associate, Client]
    code: 201
    input: [watch_id, customer_id, watchmaker_id, service_type, appt_start, appt_end, "movement_complexity?", "water_resistance_target_m?", "parts_cost_cents?", "loaner_watch_id?", "loan_start?", "loan_end?"]
    output: ServiceTicket
    side_effects:
      - "Watch.status IN_STOCK->IN_SERVICE (requires AUTHENTICATED)"
      - "Reserve watchmaker bench interval (buffer check) and loaner interval (overlap check)"
      - "status=RECEIVED, payment_status=UNPAID"

  - method: GET
    path: "/service-tickets/{id}"
    description: "Get a service ticket"
    roles: [Associate, Client, Watchmaker]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []

  - method: GET
    path: "/service-tickets"
    description: "List/search service tickets"
    roles: [Associate, Client, Watchmaker]
    code: 200
    input: ["watch_id?", "customer_id?", "watchmaker_id?", "loaner_watch_id?", "status?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []

  - method: POST
    path: "/service-tickets/{id}/diagnose"
    description: "Diagnose and quote the service"
    roles: [Watchmaker]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status RECEIVED->DIAGNOSED", "quoted_cents = service_quote(...)"]

  - method: POST
    path: "/service-tickets/{id}/finish"
    description: "Mark the service complete (ready for collection)"
    roles: [Watchmaker]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status DIAGNOSED->READY", "Append ProvenanceEvent(SERVICED)"]

  - method: POST
    path: "/service-tickets/{id}/collect"
    description: "Customer collects the serviced watch"
    roles: [Associate, Client]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status READY->COLLECTED (requires payment_status==PAID)", "Watch.status IN_SERVICE->IN_STOCK; loaner released"]

  - method: POST
    path: "/service-tickets/{id}/payments"
    description: "Apply a payment to a service ticket"
    roles: [Associate, Client]
    code: 200
    input: [amount_cents]
    output: ServiceTicket
    side_effects: ["amount_paid_cents += amount_cents", "payment_status -> PARTIALLY_PAID or PAID"]

  # --- Layaway ---
  - method: POST
    path: "/layaway-plans"
    description: "Open a layaway plan reserving a watch"
    roles: [Associate, Client]
    code: 201
    input: [customer_id, watch_id, deposit_cents, term_months, first_due_at, "use_store_credit?"]
    output: LayawayPlan
    side_effects:
      - "Watch.status IN_STOCK->RESERVED (requires AUTHENTICATED)"
      - "total_price_cents = Watch.list_price_cents; paid_cents = deposit_cents"
      - "per_installment_cents/final_installment_cents = layaway_installment_schedule(...)"
      - "If use_store_credit: Customer.store_credit_cents -= deposit_cents"
      - "Append ProvenanceEvent(LAYAWAY_RESERVED)"

  - method: GET
    path: "/layaway-plans/{id}"
    description: "Get a layaway plan"
    roles: [Associate, Client]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: []

  - method: GET
    path: "/layaway-plans"
    description: "List/search layaway plans"
    roles: [Associate, Client]
    code: 200
    input: ["customer_id?", "watch_id?", "status?", "limit?", "offset?"]
    output: LayawayPlan[]
    side_effects: []

  - method: POST
    path: "/layaway-plans/{id}/payments"
    description: "Apply an installment payment"
    roles: [Associate, Client]
    code: 200
    input: [amount_cents]
    output: LayawayPlan
    side_effects:
      - "paid_cents += amount_cents; remaining_cents recomputed"
      - "If paid_cents == total_price_cents: status ACTIVE->PAID_OFF->FULFILLED, Watch RESERVED->SOLD"

  - method: POST
    path: "/layaway-plans/{id}/default"
    description: "Declare a layaway defaulted after grace (frees the watch; auto-offer cascade)"
    roles: [Associate]
    code: 200
    input: []
    output: LayawayPlan
    side_effects:
      - "status ACTIVE->DEFAULTED (requires clock_now >= first_due_at + DEFAULT_GRACE_DAYS)"
      - "CASCADE-A: Watch RESERVED->IN_STOCK -> (if allocation_controlled) auto-offer to top eligible WaitlistEntry"
      - "paid_cents forfeited"

  - method: POST
    path: "/layaway-plans/{id}/cancel"
    description: "Cancel a layaway (refund minus restock fee)"
    roles: [Associate, Client]
    code: 200
    input: []
    output: LayawayPlan
    side_effects:
      - "status ACTIVE->CANCELLED; Watch RESERVED->IN_STOCK"
      - "refund = layaway_cancellation(...) credited to Customer.store_credit_cents"

  # --- Trade-in / consignment ---
  - method: POST
    path: "/trade-in-offers"
    description: "Quote a trade-in or consignment"
    roles: [Associate]
    code: 201
    input: [customer_id, incoming_brand, incoming_reference, serial_number, est_model_msrp_cents, condition_grade, disposition, "has_box_papers?"]
    output: TradeInOffer
    side_effects: ["appraised_market_cents, commission_rate_bps, quoted_credit_cents = trade_in_valuation(...)", "status=QUOTED"]

  - method: GET
    path: "/trade-in-offers/{id}"
    description: "Get a trade-in/consignment offer"
    roles: [Associate, Client]
    code: 200
    input: []
    output: TradeInOffer
    side_effects: []

  - method: GET
    path: "/trade-in-offers"
    description: "List/search trade-in/consignment offers"
    roles: [Associate, Client]
    code: 200
    input: ["customer_id?", "resulting_watch_id?", "status?", "limit?", "offset?"]
    output: TradeInOffer[]
    side_effects: []

  - method: POST
    path: "/trade-in-offers/{id}/accept"
    description: "Accept a quoted offer"
    roles: [Associate, Client]
    code: 200
    input: []
    output: TradeInOffer
    side_effects: ["status QUOTED->ACCEPTED"]

  - method: POST
    path: "/trade-in-offers/{id}/settle"
    description: "Settle an accepted offer: mint the inventory watch and credit the customer"
    roles: [Associate]
    code: 200
    input: []
    output: TradeInOffer
    side_effects:
      - "status ACCEPTED->SETTLED (CONSIGNMENT requires Customer.kyc_verified)"
      - "Mint Watch (source=TRADE_IN|CONSIGNMENT); set resulting_watch_id"
      - "Customer.store_credit_cents += quoted_credit_cents"
      - "Append ProvenanceEvent(TRADE_IN_INTAKE)"

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (deadlines/expiry/appointments read from it). Server startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Associate]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog (22 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, negative integer" }
  - { id: ERR_SERIAL_DUPLICATE, http: 409, condition: "serial_number already exists on another watch" }
  - { id: ERR_DUPLICATE_WAITLIST, http: 409, condition: "Customer already holds a WAITING/OFFERED entry for this model" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Accept attempted at/after offer_expires_at" }
  - { id: ERR_MODEL_DISCONTINUED, http: 409, condition: "Waitlist join on a DISCONTINUED model" }
  - { id: ERR_WATCH_NOT_AUTHENTICATED, http: 409, condition: "Operation requires Watch.authentication_status == AUTHENTICATED" }
  - { id: ERR_KYC_REQUIRED, http: 409, condition: "Consignment settlement requires Customer.kyc_verified == true" }
  - { id: ERR_WATCHMAKER_UNAVAILABLE, http: 409, condition: "Bench appointment within BENCH_BUFFER_MINUTES of another ticket on the same watchmaker" }
  - { id: ERR_LOANER_UNAVAILABLE, http: 409, condition: "Loaner loan interval overlaps an existing loan on the same loaner watch" }
  - { id: ERR_APPOINTMENT_IN_PAST, http: 422, condition: "appt_start earlier than the logical clock" }
  - { id: ERR_NO_ELIGIBLE_WAITLIST, http: 409, condition: "Offer attempted with an empty eligible waitlist candidate set" }
  - { id: ERR_WATCH_UNAVAILABLE, http: 409, condition: "Watch not IN_STOCK for layaway reserve or offer" }
  - { id: ERR_DEPOSIT_TOO_LOW, http: 422, condition: "Layaway deposit below MIN_DEPOSIT_RATE of the price" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 422, condition: "use_store_credit deposit exceeds Customer.store_credit_cents" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment would push cumulative paid above the owed total" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_watch_version does not match current Watch.version (OCC)" }
  - { id: ERR_VERSION_REQUIRED, http: 400, condition: "expected_watch_version missing on an OCC write" }
  - { id: ERR_PAYMENT_NOT_COMPLETE, http: 409, condition: "Collect attempted while payment_status != PAID" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Associate
    description: "Boutique sales/operations associate: inventory intake, authentication, allocation, trade-in/consignment, layaway administration, appraisals, catalog. Also drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /watch-models"
      - "POST /watchmakers"
      - "POST /watches"
      - "POST /watches/{id}/authenticate"
      - "POST /watches/{id}/flag-inauthentic"
      - "POST /watches/{id}/appraisals"
      - "POST /watches/{id}/offer"
      - "POST /layaway-plans/{id}/default"
      - "POST /trade-in-offers"
      - "POST /trade-in-offers/{id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /* read endpoints"
      - "POST /waitlist-entries, /accept, /decline"
      - "POST /service-tickets, /collect, /payments"
      - "POST /layaway-plans, /payments, /cancel"
      - "POST /trade-in-offers/{id}/accept"

  - name: Client
    description: "A customer acting on their own resources (waitlist, layaway, service collection, payments, offer accept/decline)."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET /customers/{id}, /watches, /watch-models/{id}, /waitlist-entries, /layaway-plans, /trade-in-offers, /service-tickets, provenance, appraisals"
      - "POST /waitlist-entries, /accept, /decline"
      - "POST /service-tickets, /collect, /payments"
      - "POST /layaway-plans, /payments, /cancel"
      - "POST /trade-in-offers/{id}/accept"

  - name: Watchmaker
    description: "A watchmaker working their own bench tickets (diagnose, finish)."
    identity: "entity_backed:Watchmaker"
    exclusive_operations:
      - "POST /service-tickets/{id}/diagnose"
      - "POST /service-tickets/{id}/finish"
    shared_operations:
      - "GET /service-tickets, /service-tickets/{id}, /watchmakers/{id}"
