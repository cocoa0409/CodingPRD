            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
          trigger:
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lot_id}", payment_method: "CASH" }, as: Cashier, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SALE_NOT_OPEN"
            - "Lot.${lot_id}.status == LISTED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_half_open_window_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.SaleEvent.fields.crew_id
          - errors[ERR_CREW_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Crew booking uses half-open [start,end) with no buffer: [2026-06-01T16:00,20:00) overlaps the
          existing [09:00,17:00) and is rejected with ERR_CREW_DOUBLE_BOOKED; an event starting exactly at
          17:00 (touching only the endpoint) would be allowed. Interval arithmetic: half-open, buffer 0.
        test_recipe:
          setup:
            - "Crew booked by sale-event #1 over [2026-06-01T09:00, 2026-06-01T17:00)"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Pa Owner", phone: "555-0244" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "15 Quay St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "POST /estate/crews", payload: { name: "Crew I" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z" }, as: SaleManager, captures: { se1_id: "$.data.id" } }
          trigger:
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T16:00:00Z", end_at: "2026-06-01T20:00:00Z" }, as: SaleManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_CREW_DOUBLE_BOOKED"

      - name: truck_closed_window_buffer_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.HaulJob.fields.truck_id
          - errors[ERR_TRUCK_UNAVAILABLE]
        distinguishing_aspect: |
          Truck booking uses a closed interval plus a 60-min buffer each side: a job at [11:30,13:00] only
          30 min after an existing [09:00,11:00] job is rejected with ERR_TRUCK_UNAVAILABLE (gap 30 < 60);
          a job starting at 12:00 (gap exactly 60) would be allowed. Distinct arithmetic from the crew rule.
        test_recipe:
          setup:
            - "Truck booked by haul-job #1 over [2026-06-05T09:00, 2026-06-05T11:00]"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Qu Owner", phone: "555-0255" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "16 Rye St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "POST /estate/trucks", payload: { name: "Truck 1" }, as: PlatformAdmin, captures: { truck_id: "$.data.id" } }
            - { call: "POST /estate/haul-jobs", payload: { project_id: "${proj_id}", truck_id: "${truck_id}", disposition_type: "DONATION", start_at: "2026-06-05T09:00:00Z", end_at: "2026-06-05T11:00:00Z" }, as: SaleManager, captures: { hj1_id: "$.data.id" } }
          trigger:
            - { call: "POST /estate/haul-jobs", payload: { project_id: "${proj_id}", truck_id: "${truck_id}", disposition_type: "HAULAWAY", start_at: "2026-06-05T11:30:00Z", end_at: "2026-06-05T13:00:00Z" }, as: SaleManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_TRUCK_UNAVAILABLE"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: gross_sales_conserved_across_sale_and_void
        grounds:
          - state_machines.Transaction.RECORDED_to_VOIDED
          - calculations.project_gross_sales
          - entities.Project.fields.gross_sales_cents
        distinguishing_aspect: |
          Conserved quantity = money (Project.gross_sales_cents). Recording a 7500 sale sets it to 7500;
          voiding that sale restores it to 0 == sum(final_price over RECORDED transactions). No monetary drift.
        test_recipe:
          setup:
            - "Lot list 7500 reserve 100 sold day 0 for 7500 by CASH (Project.gross_sales_cents == 7500)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Ro Owner", phone: "555-0266" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "17 Sage St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Cabinet", list_price_cents: 7500, reserve_price_cents: 100 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/crews", payload: { name: "Crew J" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-02T00:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/sale-events/${se_id}", payload: { status: "OPEN" }, as: SaleManager }
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lot_id}", payment_method: "CASH" }, as: Cashier, captures: { tx_id: "$.data.id" } }
          trigger:
            - { call: "POST /estate/transactions/${tx_id}/void", payload: {}, as: SaleManager }
          assert:
            - "Transaction.${tx_id}.status == VOIDED"
            - "Project.${proj_id}.gross_sales_cents == 0"
            - "Lot.${lot_id}.status == LISTED"

      - name: crew_minutes_conserved_across_booking_and_cancel
        grounds:
          - state_machines.SaleEvent.transitions.to_CANCELLED
          - calculations.crew_booked_minutes
          - entities.Crew.fields.booked_minutes
        distinguishing_aspect: |
          Conserved quantity = time (Crew.booked_minutes). Booking an 8-hour event adds 480 minutes;
          cancelling the project cascades the event to CANCELLED and releases them back to 0 == sum over
          active events. Distinct conserved quantity from the monetary gross_sales invariant.
        test_recipe:
          setup:
            - "Crew booked 480 minutes by one SCHEDULED sale-event on a project"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Su Owner", phone: "555-0277" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "18 Teak St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "POST /estate/crews", payload: { name: "Crew K" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
          trigger:
            - { call: "POST /estate/projects/${proj_id}/cancel", payload: {}, as: SaleManager }
          assert:
            - "SaleEvent.${se_id}.status == CANCELLED"
            - "Crew.${crew_id}.booked_minutes == 0"
