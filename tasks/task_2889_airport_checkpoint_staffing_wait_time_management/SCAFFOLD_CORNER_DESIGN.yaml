          - calculations.break_due_evaluation
        distinguishing_aspect: "The break axis only opens at MAX_CONSECUTIVE_ON_POSITION_MINUTES (60) measured from break_baseline_utc. At 59 minutes the row is still NOT_DUE and START must be refused; the failure is a precondition on break_state, not on assignment_state, which stays CHECKED_IN throughout."
        test_recipe:
          setup:
            - "an ACTIVATED plan with one CHECKED_IN assignment; clock advanced 59 minutes past check-in"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
            - *c_approve
            - *c_activate
            - &c_checkin
              call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              captures: { ci_state: $.data.assignment_state, ci_break: $.data.break_state, ci_baseline: $.data.break_baseline_utc }
            - call: "POST /_clock/set_current_utc"
