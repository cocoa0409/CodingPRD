              as: SubscriptionOpsAgent
              captures: { rd_dm_admin: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "outsider@other.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_dm_out: "$.data.id" }
            - call: "POST /paywall/group-accounts"
              payload: { name: "Campus Domain Group", admin_email: "bursar2@campus.test", allowed_email_domain: "campus.test", seat_capacity: 3, offer_plan_id: "${plan_dm}" }
              as: SubscriptionOpsAgent
              captures: { grp_dm: "$.data.id", grp_dm_v: "$.data.version" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_dm_admin}", offer_plan_id: "${plan_dm}", expected_offer_plan_version: "${plan_dm_v}", group_account_id: "${grp_dm}" }
              as: SubscriptionOpsAgent
              captures: { sub_dm: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_dm}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_dm: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_dm}/payment-attempts"
