# =============================================================================
# 1.9 Scaffold Corner Design (breadth) — cryobank
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_donor_returns_201_and_defaults
        claim_type: Creation
        grounds: [entities.Donor.fields.status, entities.Donor.fields.reported_family_count]
        distinguishing_aspect: "POST /donors with all required fields returns 201 with status==APPLICANT, reported_family_count==0, is_family_limit_reached==false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /donors", payload: { display_code: "D-C1", full_name: "Corner One", donor_type: "OOCYTE", blood_type: "A_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
          assert:
            - "response code 201; Donor.status == APPLICANT; reported_family_count == 0; is_family_limit_reached == false; version == 1"

      - name: get_donor_not_found_returns_404
        claim_type: Not Found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /donors/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /donors/00000000-0000-4000-8000-000000000000", payload: {}, as: ScreeningOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND, http 404"

      - name: create_donor_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=16]"]
        distinguishing_aspect: "POST /donors omitting family_limit returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /donors", payload: { display_code: "D-C2", full_name: "Corner Two", donor_type: "SPERM", blood_type: "O_POS" }, as: ScreeningOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_specimen_nonpositive_vial_count_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=16]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /specimens with initial_vial_count == 0 returns ERR_INVALID_REQUEST (positive-integer rule)."
        test_recipe:
          setup: ["An APPROVED donor exists."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C3", full_name: "Corner Three", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
          trigger:
            - { call: "POST /specimens", payload: { donor_id: "${d}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 0, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 400"

      - name: donor_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Donor, endpoints]
        distinguishing_aspect: "GET /donors returns a paginated array envelope with total_count and has_more fields."
        test_recipe:
          setup: ["Two donors created."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C4a", full_name: "P A", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer }
            - { call: "POST /donors", payload: { display_code: "D-C4b", full_name: "P B", donor_type: "OOCYTE", blood_type: "A_NEG", family_limit: 5 }, as: ScreeningOfficer }
          trigger:
            - { call: "GET /donors?limit=1&offset=0", payload: {}, as: CatalogManager }
          assert:
            - "response_type == array; meta.total_count >= 2; has_more == true; data length == 1"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_from_submitted_without_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ScreeningApplication.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST approve on a SUBMITTED (not UNDER_REVIEW) application returns ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["Donor with a SUBMITTED (not yet reviewed) application."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C5", full_name: "Corner Five", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
          trigger:
            - { call: "POST /screening-applications/${a}/approve", payload: {}, as: ScreeningOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409; Donor.${d}.status == APPLICANT (unchanged)"

      - name: deliver_from_preparing_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Shipment.PREPARING_to_DISPATCHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /shipments/{id}/deliver on a PREPARING shipment returns ERR_INVALID_STATE (must be DISPATCHED)."
        test_recipe:
          setup: ["A PREPARING shipment for a CONFIRMED reservation."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C6", full_name: "Corner Six", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${a}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${d}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { s: "$.data.id" } }
            - { call: "POST /specimens/${s}/begin-quarantine", payload: { dewar_code: "T-C6" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${s}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${s}", payload: {}, as: CatalogManager, captures: { inv: "$.data[0].id", iv: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "F C6", contact_email: "c6@x.com" }, as: CatalogManager, captures: { r: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${r}", donor_id: "${d}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${r}", captures: { c: "$.data.id" } }
            - { call: "POST /recipient-consents/${c}/sign", payload: {}, as: Recipient, as_user_id: "${r}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${r}", inventory_id: "${inv}", vial_count: 1, expected_inventory_version: "${iv}" }, as: Recipient, as_user_id: "${r}", captures: { res: "$.data.id" } }
            - { call: "POST /vial-reservations/${res}/confirm", payload: {}, as: CatalogManager }
            - { call: "POST /shipments", payload: { reservation_id: "${res}", clinic_address: "C6", ln2_dewar_serial: "DS-C6" }, as: LabTech, captures: { sh: "$.data.id" } }
          trigger:
            - { call: "POST /shipments/${sh}/deliver", payload: {}, as: LabTech, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409; Shipment.${sh}.status == PREPARING"

      - name: consent_revoke_blocked_by_active_reservation
        claim_type: Precondition Enforcement
        grounds: [state_machines.RecipientConsent.SIGNED_to_REVOKED, "errors[ERR_ACTIVE_RESERVATION_EXISTS]"]
        distinguishing_aspect: "Revoking a SIGNED consent while a HELD reservation of that recipient+donor exists returns ERR_ACTIVE_RESERVATION_EXISTS (409)."
        test_recipe:
          setup: ["Recipient with a SIGNED consent and a HELD reservation for the same donor."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C7", full_name: "Corner Seven", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${a}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${d}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { s: "$.data.id" } }
            - { call: "POST /specimens/${s}/begin-quarantine", payload: { dewar_code: "T-C7" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${s}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${s}", payload: {}, as: CatalogManager, captures: { inv: "$.data[0].id", iv: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "F C7", contact_email: "c7@x.com" }, as: CatalogManager, captures: { r: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${r}", donor_id: "${d}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${r}", captures: { c: "$.data.id" } }
            - { call: "POST /recipient-consents/${c}/sign", payload: {}, as: Recipient, as_user_id: "${r}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${r}", inventory_id: "${inv}", vial_count: 1, expected_inventory_version: "${iv}" }, as: Recipient, as_user_id: "${r}", captures: { res: "$.data.id" } }
          trigger:
            - { call: "POST /recipient-consents/${c}/revoke", payload: {}, as: Recipient, as_user_id: "${r}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_ACTIVE_RESERVATION_EXISTS, http 409; RecipientConsent.${c}.status == SIGNED"

      - name: consent_sign_without_acknowledgement_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.RecipientConsent.DRAFT_to_SIGNED, "errors[ERR_CONSENT_NOT_ACKNOWLEDGED]"]
        distinguishing_aspect: "Signing a consent whose acknowledges_open_id==false returns ERR_CONSENT_NOT_ACKNOWLEDGED (422)."
        test_recipe:
          setup: ["An APPROVED donor and a DRAFT consent with acknowledges_open_id=false."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C8", full_name: "Corner Eight", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${a}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /recipients", payload: { family_name: "F C8", contact_email: "c8@x.com" }, as: CatalogManager, captures: { r: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${r}", donor_id: "${d}", acknowledges_open_id: false }, as: Recipient, as_user_id: "${r}", captures: { c: "$.data.id" } }
          trigger:
            - { call: "POST /recipient-consents/${c}/sign", payload: {}, as: Recipient, as_user_id: "${r}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_CONSENT_NOT_ACKNOWLEDGED, http 422; RecipientConsent.${c}.status == DRAFT"

      - name: terminal_deferred_application_cannot_restart_review
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ScreeningApplication.UNDER_REVIEW_to_DEFERRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start-review on a DEFERRED (terminal) application returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An application deferred to terminal DEFERRED."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C9", full_name: "Corner Nine", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${a}/defer", payload: {}, as: ScreeningOfficer }
          trigger:
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE, http 409; ScreeningApplication.${a}.status == DEFERRED"

      - name: release_quarantine_before_date_returns_temporal_error
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=6]", "errors[ERR_QUARANTINE_NOT_ELAPSED]"]
        distinguishing_aspect: "release-quarantine with retest_negative=true but clock before quarantine_release_date returns ERR_QUARANTINE_NOT_ELAPSED (isolates p6 from p5)."
        test_recipe:
          setup: ["Specimen QUARANTINE, retest_negative=true, quarantine_release_date 2026-06-01, clock at default 2026-05-01."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C10", full_name: "Corner Ten", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${a}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${d}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { s: "$.data.id" } }
            - { call: "POST /specimens/${s}/begin-quarantine", payload: { dewar_code: "T-C10" }, as: LabTech }
          trigger:
            - { call: "POST /specimens/${s}/release-quarantine", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_QUARANTINE_NOT_ELAPSED, http 422; Specimen.${s}.status == QUARANTINE"

      - name: sibling_confirm_without_shipment_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.SiblingRegistryEntry.PENDING_to_CONFIRMED, "errors[ERR_REGISTRY_NO_SHIPMENT]"]
        distinguishing_aspect: "Confirming a PENDING registry entry when the recipient has no SHIPPED reservation for the donor returns ERR_REGISTRY_NO_SHIPMENT (422)."
        test_recipe:
          setup: ["A PENDING registry entry whose recipient has no shipment for the donor."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C11", full_name: "Corner Eleven", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /recipients", payload: { family_name: "F C11", contact_email: "c11@x.com" }, as: CatalogManager, captures: { r: "$.data.id" } }
            - { call: "POST /sibling-registry", payload: { donor_id: "${d}", recipient_id: "${r}", birth_reported_date: "2026-06-05T00:00:00Z" }, as: Recipient, as_user_id: "${r}", captures: { sib: "$.data.id" } }
          trigger:
            - { call: "POST /sibling-registry/${sib}/confirm", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_REGISTRY_NO_SHIPMENT, http 422; SiblingRegistryEntry.${sib}.status == PENDING"

      - name: assess_lapse_before_grace_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.StorageAccount.ACTIVE_to_LAPSED, "errors[ERR_GRACE_NOT_ELAPSED]"]
        distinguishing_aspect: "assess-lapse before current_utc >= paid_through + GRACE_DAYS returns ERR_GRACE_NOT_ELAPSED (422)."
        test_recipe:
          setup: ["StorageAccount ACTIVE (paid_through 2027-06-01) with clock at 2027-06-15 (within grace)."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C12", full_name: "Corner Twelve", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${a}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${d}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { s: "$.data.id" } }
            - { call: "POST /specimens/${s}/begin-quarantine", payload: { dewar_code: "T-C12" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${s}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${s}", payload: {}, as: CatalogManager, captures: { inv: "$.data[0].id", iv: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "F C12", contact_email: "c12@x.com" }, as: CatalogManager, captures: { r: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${r}", donor_id: "${d}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${r}", captures: { c: "$.data.id" } }
            - { call: "POST /recipient-consents/${c}/sign", payload: {}, as: Recipient, as_user_id: "${r}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${r}", inventory_id: "${inv}", vial_count: 1, expected_inventory_version: "${iv}" }, as: Recipient, as_user_id: "${r}", captures: { res: "$.data.id" } }
            - { call: "POST /vial-reservations/${res}/confirm", payload: {}, as: CatalogManager }
            - { call: "POST /shipments", payload: { reservation_id: "${res}", clinic_address: "C12", ln2_dewar_serial: "DS-C12" }, as: LabTech, captures: { sh: "$.data.id" } }
            - { call: "POST /shipments/${sh}/dispatch", payload: {}, as: LabTech }
            - { call: "GET /storage-accounts?reservation_id=${res}", payload: {}, as: BillingClerk, captures: { acct: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-15T00:00:00Z" }, as: BillingClerk }
          trigger:
            - { call: "POST /storage-accounts/${acct}/assess-lapse", payload: {}, as: BillingClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_GRACE_NOT_ELAPSED, http 422; StorageAccount.${acct}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: report_snapshot_totals_correct
        claim_type: Correct Result
        grounds: [calculations.report_snapshot, entities.RegulatoryReport.fields.total_vials_shipped_at_report]
        distinguishing_aspect: "Filing a report on a donor with one SHIPPED 2-vial reservation and one CONFIRMED family snapshots total_vials_shipped_at_report==2 and total_families_at_report==1."
        test_recipe:
          setup: ["Donor with a SHIPPED 2-vial reservation and one CONFIRMED sibling family."]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_code: "D-C13", full_name: "Corner Thirteen", donor_type: "SPERM", blood_type: "O_POS", family_limit: 5 }, as: ScreeningOfficer, captures: { d: "$.data.id" } }
            - { call: "POST /screening-applications", payload: { donor_id: "${d}", fda_risk_flag: false, genetic_carrier_count: 0, partner_screening_required: false }, as: ScreeningOfficer, captures: { a: "$.data.id" } }
            - { call: "POST /screening-applications/${a}/start-review", payload: {}, as: ScreeningOfficer }
            - { call: "POST /screening-applications/${a}/approve", payload: {}, as: ScreeningOfficer }
            - { call: "POST /specimens", payload: { donor_id: "${d}", collection_date: "2026-05-01T00:00:00Z", initial_vial_count: 5, quarantine_release_date: "2026-06-01T00:00:00Z", retest_negative: true }, as: LabTech, captures: { s: "$.data.id" } }
            - { call: "POST /specimens/${s}/begin-quarantine", payload: { dewar_code: "T-C13" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${s}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${s}", payload: {}, as: CatalogManager, captures: { inv: "$.data[0].id", iv: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "F C13", contact_email: "c13@x.com" }, as: CatalogManager, captures: { r: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${r}", donor_id: "${d}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${r}", captures: { c: "$.data.id" } }
            - { call: "POST /recipient-consents/${c}/sign", payload: {}, as: Recipient, as_user_id: "${r}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${r}", inventory_id: "${inv}", vial_count: 2, expected_inventory_version: "${iv}" }, as: Recipient, as_user_id: "${r}", captures: { res: "$.data.id" } }
            - { call: "POST /vial-reservations/${res}/confirm", payload: {}, as: CatalogManager }
