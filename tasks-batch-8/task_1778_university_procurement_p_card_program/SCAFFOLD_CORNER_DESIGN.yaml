# =============================================================================
# task_1778 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide taxonomy; §1.8-covered corners
# appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: requisition_create_with_total_cents_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Requisition.fields.total_cents", "entities.Requisition.fields.status"]
        distinguishing_aspect: "Client-supplied total_cents/status on create are ignored: server computes total from lines (2 x 125,000 = 250,000), stamps DRAFT, version 1, UUID id — and the success envelope wraps it."
        test_recipe:
          setup: ["Department and vendor exist"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Kinesiology", cost_center: "CC-2300", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "GymCo" }
              as: Buyer
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-9", vendor_id: "${v_id}", total_cents: 99999999, status: "APPROVED", lines: [{ commodity_code: "KIN", description: "rower", quantity: 2, unit_price_cents: 125000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-9"
              captures: { r_total: $.data.total_cents, r_status: $.data.status, r_ver: $.data.version, r_id: $.data.id }
          assert:
            - "response data.total_cents == 250000 (server-computed; smuggled 99999999 ignored)"
            - "response data.status == DRAFT and version == 1 (smuggled APPROVED ignored; system stamps initial state)"
            - "id is a server-minted UUID; response_type == object with meta.api_request_id present"

      - name: purchase_order_not_found_returns_404
        claim_type: not_found
        grounds: ["errors", "ERR_PO_NOT_FOUND", "validations", "priority"]
        distinguishing_aspect: "A nonexistent PO id returns ERR_PO_NOT_FOUND both on the bare resource and on the nested receipts sub-resource (existence checked left-to-right on the path)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /purchase-orders/00000000-0000-0000-0000-000000000000"
              as: ProcurementAdmin
              captures: { err: $.data.error_id }
            - call: "POST /purchase-orders/00000000-0000-0000-0000-000000000000/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
              captures: { err2: $.data.error_id }
          assert:
            - "GET: err == ERR_PO_NOT_FOUND (404)"
            - "nested POST receipts: err2 == ERR_PO_NOT_FOUND (parent checked before any receipt logic)"

      - name: create_with_missing_foreign_key_returns_404
        claim_type: parent_relationships
        grounds: ["entities.Requisition.fields.department_id", "errors", "ERR_DEPARTMENT_NOT_FOUND"]
        distinguishing_aspect: "Body-referenced FK existence: POST /requisitions with a nonexistent department_id fails 404 before any line/total validation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /requisitions"
              payload: { department_id: "00000000-0000-0000-0000-000000000000", requester_id: "req-user-1", lines: [{ commodity_code: "X", description: "x", quantity: 1, unit_price_cents: 100, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEPARTMENT_NOT_FOUND (404); no requisition persisted"

      - name: pcard_and_surplus_shape_errors_rejected
        claim_type: type_constraints
        grounds: ["errors", "ERR_LIMIT_INCONSISTENT", "errors", "ERR_INVALID_REQUEST", "entities.SurplusAsset.fields.condition"]
        distinguishing_aspect: "Three shape/constraint violations on different entities: card single > monthly (422 ERR_LIMIT_INCONSISTENT), surplus condition outside the enum (400 ERR_INVALID_REQUEST), zero-amount transaction (400 ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["Department exists; a valid card exists for the transaction attempt"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Nursing", cost_center: "CC-2400", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Ann", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Bad", single_txn_limit_cents: 600000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /surplus-assets"
              payload: { asset_tag: "A-1", department_id: "${d_id}", description: "desk", condition: "BROKEN", estimated_value_cents: 10000 }
              as: SurplusManager
              captures: { err2: $.data.error_id }
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 0, entry_type: "DEBIT", merchant_name: "Zero", mcc_code: "5942" }
              as: Cardholder
              as_user_id: "${pc_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_LIMIT_INCONSISTENT (single 600,000 > monthly 500,000)"
            - "err2 == ERR_INVALID_REQUEST (condition BROKEN not in enum NEW|GOOD|FAIR|POOR)"
            - "err3 == ERR_INVALID_REQUEST (amount_cents must be > 0)"

      - name: approval_record_append_only_immutability
        claim_type: immutability
        grounds: ["entities.ApprovalRecord"]
        distinguishing_aspect: "ApprovalRecord (common_fields false) carries only id + created_at plus audit fields, one record per decision in created_at order — no update or delete endpoint exists and no version field is exposed."
        test_recipe:
          setup: ["Requisition 400,000 submitted, returned once, edited, resubmitted, approved"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Linguistics", cost_center: "CC-2500", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "BookCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "LIN", description: "corpus", quantity: 1, unit_price_cents: 400000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/return-step"
              payload: { reason: "clarify scope" }
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
          trigger:
            - call: "GET /requisitions/${r_id}/approvals"
              as: ProcurementAdmin
              captures: { a0_step: "$.data[0].step_role", a0_dec: "$.data[0].decision", a0_actor: "$.data[0].actor_id", a1_step: "$.data[1].step_role", a1_dec: "$.data[1].decision" }
          assert:
            - "exactly 2 records: [0] step_role DEPARTMENT decision RETURNED actor dept-approver-1; [1] step_role DEPARTMENT decision APPROVED"
            - "records ordered by created_at ascending; no version/updated_at fields on ApprovalRecord (immutable audit)"

  - section: state_machines
    instances:
      - name: requisition_terminal_and_submitted_invalid_froms
        claim_type: invalid_transition
        grounds: ["state_machines.Requisition", "errors", "ERR_REQUISITION_NOT_CANCELLABLE", "errors", "ERR_REQUISITION_NOT_IN_APPROVAL"]
        distinguishing_aspect: "Invalid-from sweep on one entity: cancel from SUBMITTED is rejected (mid-approval must be returned first); after PO_ISSUED the terminal lockdown rejects submit, approve-step, and cancel."
        test_recipe:
          setup: ["Department (limit 10,000,000); vendor; requisition 400,000"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Botany", cost_center: "CC-2600", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SeedCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "BOT", description: "seeds", quantity: 1, unit_price_cents: 400000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
          trigger:
            - call: "POST /requisitions/${r_id}/cancel"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err1: $.data.error_id }
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err2: $.data.error_id }
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
              captures: { err3: $.data.error_id }
            - call: "POST /requisitions/${r_id}/cancel"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err4: $.data.error_id }
          assert:
            - "cancel while SUBMITTED: err1 == ERR_REQUISITION_NOT_CANCELLABLE"
            - "after PO_ISSUED (terminal): submit -> err2 == ERR_REQUISITION_NOT_SUBMITTABLE; approve-step -> err3 == ERR_REQUISITION_NOT_IN_APPROVAL; cancel -> err4 == ERR_REQUISITION_NOT_CANCELLABLE"

      - name: solicitation_deadline_half_open_both_sides
        claim_type: precondition_enforcement
        grounds: ["errors", "ERR_SOLICITATION_DEADLINE_NOT_PASSED", "errors", "ERR_SOLICITATION_EXPIRED", "state_machines.BidSolicitation.OPEN_to_CLOSED"]
        distinguishing_aspect: "One deadline, two half-open faces: at clock == response_deadline exactly, quote submission is rejected (window [ , deadline) closed) while close succeeds (close requires clock >= deadline) — and close one second early fails."
        test_recipe:
          setup: ["Department (limit 10,000,000); requisition 3,000,000 SUBMITTED with DEPARTMENT approved; solicitation OPEN with deadline 2026-08-08T00:00:00Z; one quote already in"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /departments"
              payload: { name: "UrbanPlanning", cost_center: "CC-2700", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "BuildCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "DesignCo" }
              as: Buyer
              captures: { v2_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "URB", description: "study", quantity: 1, unit_price_cents: 3000000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/solicitations"
              payload: { response_deadline: "2026-08-08T00:00:00Z" }
              as: Buyer
              captures: { s_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${v_id}", price_cents: 3000000 }
              as: Buyer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T23:59:59Z" }
              as: ProcurementAdmin
            - call: "POST /solicitations/${s_id}/close"
              as: Buyer
              captures: { err1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${v2_id}", price_cents: 2900000 }
              as: Buyer
              captures: { err2: $.data.error_id }
            - call: "POST /solicitations/${s_id}/close"
              as: Buyer
              captures: { s_status: $.data.status }
          assert:
            - "close one second before deadline: err1 == ERR_SOLICITATION_DEADLINE_NOT_PASSED"
            - "quote at exactly the deadline: err2 == ERR_SOLICITATION_EXPIRED (submission window is half-open)"
            - "close at exactly the deadline succeeds: status == CLOSED"

      - name: award_and_cancel_wrong_state_rejections
        claim_type: invalid_transition
        grounds: ["errors", "ERR_SOLICITATION_NOT_CLOSED", "errors", "ERR_SOLICITATION_NOT_CANCELLABLE"]
        distinguishing_aspect: "Award while OPEN is rejected, and once AWARDED the manual cancel path is closed (only the vendor-suspension cascade can cancel an awarded solicitation)."
        test_recipe:
          setup: ["Solicitation OPEN on a 3,000,000 requisition; three quotes in"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /departments"
              payload: { name: "Comm", cost_center: "CC-2800", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "QA" }
              as: Buyer
              captures: { va: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "QB" }
              as: Buyer
              captures: { vb: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "QC" }
              as: Buyer
              captures: { vc: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${va}", lines: [{ commodity_code: "COM", description: "av", quantity: 1, unit_price_cents: 3000000, cost_category: "SERVICES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/solicitations"
              payload: { response_deadline: "2026-08-08T00:00:00Z" }
              as: Buyer
              captures: { s_id: $.data.id }
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${va}", price_cents: 3100000 }
              as: Buyer
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${vb}", price_cents: 3000000 }
              as: Buyer
            - call: "POST /solicitations/${s_id}/quotes"
              payload: { vendor_id: "${vc}", price_cents: 3200000 }
              as: Buyer
          trigger:
            - call: "POST /solicitations/${s_id}/award"
              as: ProcurementDirector
              captures: { err1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /solicitations/${s_id}/close"
              as: Buyer
            - call: "POST /solicitations/${s_id}/award"
              as: ProcurementDirector
              captures: { s_status: $.data.status }
            - call: "POST /solicitations/${s_id}/cancel"
              as: Buyer
              captures: { err2: $.data.error_id }
          assert:
            - "award while OPEN: err1 == ERR_SOLICITATION_NOT_CLOSED"
            - "award after close succeeds: status == AWARDED (winner is the 3,000,000 quote: score 70.00 vs 67.74 and 65.63)"
            - "cancel while AWARDED: err2 == ERR_SOLICITATION_NOT_CANCELLABLE"

      - name: receipt_void_rematches_payable_invoice
        claim_type: side_effect_execution
        grounds: ["state_machines.Receipt.POSTED_to_VOIDED", "state_machines.Invoice.PAYABLE_to_EXCEPTION", "errors", "ERR_RECEIPT_NOT_VOIDABLE"]
        distinguishing_aspect: "Conditional cascade: voiding a receipt after the invoice went PAYABLE re-runs the match against the reduced received quantity, flipping the invoice to EXCEPTION/RECEIPT_VOIDED and the PO back to PARTIALLY_RECEIVED; double-void is rejected."
        test_recipe:
          setup: ["PO (1 line qty 2 @ 300,000) fully received (2+2? no: two receipts of 1 each), invoice qty 2 exact price PAYABLE"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Zoology", cost_center: "CC-2900", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "CageCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "ZOO", description: "cages", quantity: 2, unit_price_cents: 300000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
              captures: { rc1_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
            - call: "POST /purchase-orders/${po_id}/invoices"
              payload: { invoice_number: "INV-V", lines: [{ line_no: 0, quantity: 2, unit_price_cents: 300000 }] }
              as: APClerk
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /receipts/${rc1_id}/void"
              as: ReceivingClerk
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { fs: $.data.fulfillment_status, ms: $.data.match_status }
            - call: "GET /invoices/${inv_id}"
              as: ProcurementAdmin
              captures: { inv_status: $.data.status, inv_reason: $.data.exception_reason }
            - call: "POST /receipts/${rc1_id}/void"
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "after void: PO fulfillment_status == PARTIALLY_RECEIVED and match_status == EXCEPTION"
            - "invoice flipped PAYABLE -> EXCEPTION with exception_reason == RECEIPT_VOIDED (re-match against received qty 1 < invoiced 2)"
            - "second void of the same receipt: err == ERR_RECEIPT_NOT_VOIDABLE"

      - name: surplus_redistribution_window_boundary
        claim_type: precondition_enforcement
        grounds: ["state_machines.SurplusAsset.DECLARED_to_TRANSFERRED", "errors", "ERR_REDISTRIBUTION_WINDOW_EXPIRED", "errors", "ERR_REDISTRIBUTION_WINDOW_ACTIVE"]
        distinguishing_aspect: "The 10-day redistribution window is half-open [declared_at, declared_at + 10d): a claim at exactly +10 days is expired while list-for-sale at exactly +10 days becomes legal — one instant separates the two outcomes."
        test_recipe:
          setup: ["Departments D1 (owner) and D2 (claimer); asset declared at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /departments"
              payload: { name: "ChemStore", cost_center: "CC-3000", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /departments"
              payload: { name: "PhysStore", cost_center: "CC-3001", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /surplus-assets"
              payload: { asset_tag: "AST-10", department_id: "${d1_id}", description: "centrifuge", condition: "FAIR", estimated_value_cents: 100000 }
              as: SurplusManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /surplus-assets/${a_id}/claim"
              payload: { claiming_department_id: "${d2_id}" }
              as: Requester
              as_user_id: "req-user-2"
              captures: { a_status_1: $.data.status }
            - call: "GET /surplus-assets/${a_id}"
              as: ProcurementAdmin
              captures: { a_status_2: $.data.status, a_claim: $.data.claiming_department_id }
          assert:
            - "claim inside the window succeeds: status == TRANSFERRED and claiming_department_id == the D2 id"
            - "a TRANSFERRED asset can no longer be listed: covered by terminal lockdown (asset terminal after claim)"
            - "boundary arithmetic pinned: window end == declared_at + 10 days; at exactly 2026-08-11T00:00:00Z claims are expired and list-for-sale is allowed (verified in surplus_window_edge_at_exact_ten_days below)"

      - name: surplus_window_edge_at_exact_ten_days
        claim_type: invalid_transition
