            - "Assignment.${a1}.status == ENDED and end_reason == SERVICE_CHANGED (hop 1)"
            - "Paraprofessional.${p1}.weekly_scheduled_minutes == 0 (hop 1 release)"
            - "Paraprofessional.${p1}.benefit_eligible == false (hop 2 flip from true)"
            - "Assignment.${a2}.daily_cost_cents == 1867 (hop 3 re-snapshot at non-surcharged rate; was 2240 at create)"
            - "Assignment.${a2}.projected_weekly_cost_cents == 9335"
            - "StaffingPlan.${plan_id}.committed_cost_cents == 9335 (87200 - 76000 - (11200 - 9335))"
            - "Student.${s1}.iep_minutes_per_week == 100 and status == ACTIVE_IEP"

