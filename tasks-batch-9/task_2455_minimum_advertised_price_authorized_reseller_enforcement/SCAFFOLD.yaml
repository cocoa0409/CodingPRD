  # --- TestPurchase ----------------------------------------------------------
  - method: POST
    path: /test-purchases
    purpose: "Order a test purchase against a suspected unauthorized listing"
    input: [observation_id, ordered_at, purchase_price_cents]
    output: TestPurchase
    status: 201
    roles: [MonitoringAnalyst]
    side_effects:
      - "creates TestPurchase in status ORDERED with purchaser_user_id = X-User-ID"

  - method: POST
    path: /test-purchases/{test_purchase_id}/serial-capture
    purpose: "Record the serial number found on the delivered test-purchase unit"
    input: [serial_number]
    output: TestPurchase
    status: 200
    roles: [MonitoringAnalyst]
    side_effects:
      - "sets status = SERIAL_CAPTURED, captured_serial_number and traced_serial_unit_id"

  - method: POST
    path: /test-purchases/{test_purchase_id}/confirm-outcome
    purpose: "Confirm or clear the unauthorized-seller finding for a traced test purchase"
    input: [outcome, outcome_reason]
    output: TestPurchase
    status: 200
    roles: [MonitoringAnalyst]
    side_effects:
      - "outcome CONFIRM sets status = CONFIRMED_UNAUTHORIZED, sets the traced serial unit to TRACED_UNAUTHORIZED with traced_at, and sets the observation's unauthorized_seller_confirmed = true"
      - "outcome CLEAR sets status = CLEARED and leaves the traced serial unit untouched"

  - method: GET
    path: /test-purchases/{test_purchase_id}
    purpose: "Read one test purchase"
    input: []
    output: TestPurchase
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Distributor]
    side_effects: []

  - method: GET
    path: /test-purchases
    purpose: "List test purchases, optionally by observation, traced serial unit or status"
    input: ["observation_id?", "traced_serial_unit_id?", "status?", "limit?", "offset?"]
    output: TestPurchase[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Distributor]
    side_effects: []

  # --- DistributorChargeback -------------------------------------------------
  - method: POST
    path: /distributor-chargebacks
    purpose: "Assess a contractual chargeback against the distributor that shipped diverted units"
    input: [distributor_id, test_purchase_id, diverted_units, expected_distributor_version]
    output: DistributorChargeback
    status: 201
    roles: [BrandChannelManager]
    side_effects:
      - "computes tier_rate_cents_per_unit from the distributor's pre-increment diversion_score and sets amount_cents"
      - "adds amount_cents to Distributor.chargeback_balance_cents, adds score_delta_applied to Distributor.diversion_score, re-derives standing and increments Distributor.version by 1"
      - "standing reaching PROBATION sets review_required = true on every Reseller sourcing from this distributor"

  - method: POST
    path: /distributor-chargebacks/{chargeback_id}/dispute
    purpose: "Distributor disputes an assessed chargeback"
    input: [dispute_reason]
    output: DistributorChargeback
    status: 200
    roles: [Distributor]
    side_effects:
      - "sets status = DISPUTED and increments dispute_rounds by 1"

  - method: POST
    path: /distributor-chargebacks/{chargeback_id}/dispute-decision
    purpose: "Counsel upholds or reverses a disputed chargeback"
    input: [decision, decision_reason]
    output: DistributorChargeback
    status: 200
    roles: [BrandLegalCounsel]
    side_effects:
      - "decision UPHOLD sets status = UPHELD and leaves the money and score ledgers unchanged"
      - "decision REVERSE sets status = REVERSED, subtracts amount_cents from Distributor.chargeback_balance_cents, subtracts score_delta_applied from diversion_score, re-derives standing and re-derives review_required on the sourcing resellers"

  - method: GET
    path: /distributor-chargebacks/{chargeback_id}
    purpose: "Read one chargeback"
    input: []
    output: DistributorChargeback
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Distributor]
    side_effects: []

  - method: GET
    path: /distributor-chargebacks
    purpose: "List chargebacks, optionally by distributor, originating test purchase or status"
    input: ["distributor_id?", "test_purchase_id?", "status?", "limit?", "offset?"]
    output: DistributorChargeback[]
    status: 200
    roles: [BrandChannelManager, BrandLegalCounsel, MonitoringAnalyst, PlatformAdmin, Distributor]
    side_effects: []

  # --- Sweep and clock -------------------------------------------------------
  - method: POST
    path: /enforcement-sweeps
    purpose: "Run the deterministic clock-driven sweep over expiries, escalations and reinstatements"
    input: []
    output: "{ swept_at: string, expired_agreements: integer, expired_exceptions: integer, escalated_violations: integer, reinstated_resellers: integer }"
    status: 200
    roles: [BrandChannelManager, PlatformAdmin]
    side_effects:
      - "ACTIVE agreements whose term_ends_at is at or before the clock become EXPIRED and put their reseller on supply_status HOLD with hold_reason AGREEMENT_EXPIRED, leaving authorization_status untouched"
      - "APPROVED exceptions whose ends_at is at or before the clock become EXPIRED and decrement Product.open_exception_count"
      - "NOTICED violations past cure_deadline_at become ESCALATED"
      - "SUSPENDED resellers whose suspension_ends_at is at or before the clock return to AUTHORIZED with supply_status OPEN, hold_reason NONE and last_suspension_ended_at set to suspension_ends_at"
      - "processes entities ordered by created_at ASC within each phase"

  - method: POST
    path: /_clock/set_current_utc
    purpose: "Test-driving endpoint that pins the deterministic logical clock; the clock defaults to 2026-08-01T00:00:00Z before any call"
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string }"
    status: 200
    roles: [PlatformAdmin]
    side_effects:
      - "sets the logical clock used by every timestamp default, window check and sweep"
