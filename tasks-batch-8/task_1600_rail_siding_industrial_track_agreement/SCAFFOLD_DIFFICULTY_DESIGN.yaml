            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /segments"
              payload: { agreement_id: "${agr_id}", segment_name: "Siding A", length_feet: 1200, storage_capacity_cars: 3 }
              as: RailroadEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /derail-devices"
              payload: { segment_id: "${seg_id}", device_type: "DERAIL", location_description: "East end, fouling point" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { dev_id: $.data.id }
            - call: "POST /derail-devices/${dev_id}/approve"
              as: RailroadEngineer
            - call: "POST /derail-devices/${dev_id}/mark-installed"
              payload: { installed_date: "2026-08-01" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /inspections"
              payload: { agreement_id: "${agr_id}", segment_id: "${seg_id}", scheduled_date: "2026-08-01" }
              as: SafetyInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/record-result"
              payload: { result: "FAIL", completed_date: "2026-08-02", cited_device_ids: ["${dev_id}"] }
              as: SafetyInspector
              captures: { insp_status: $.data.status }
            - call: "GET /derail-devices/${dev_id}"
              as: SafetyInspector
              captures: { dev_status: $.data.status }
            - call: "GET /segments/${seg_id}"
              as: SafetyInspector
              captures: { seg_susp: $.data.safety_suspended }
            - call: "POST /service-orders"
              payload: { agreement_id: "${agr_id}", segment_id: "${seg_id}", order_type: "SWITCHING", service_date: "2026-08-03", start_hour: 8, end_hour: 10 }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { blocked_err: $.data.error_id }
          assert:
            - "insp_status == COMPLETED_FAIL"
            - "Link 1: dev_status == NON_COMPLIANT"
            - "Link 2: seg_susp == true"
            - "Gate evidence: blocked_err == ERR_SEGMENT_SAFETY_SUSPENDED (order on 2026-08-03, a Monday, would otherwise succeed)"
            - "Auto-schedule: GET /inspections?segment_id=${seg_id} returns a second SafetyInspection with status SCHEDULED and scheduled_date == 2026-10-31 (2026-08-02 + 90 days)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_error_beats_fiscal_overpayment
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_PROJECT_INVALID_STATE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: settle on a SPEC_APPROVED project
          violates the own-state rule (priority 6) and the payment 999999 would also violate
          the overpayment rule (priority 12) — the response must be the priority-6
          ERR_PROJECT_INVALID_STATE, not the fiscal error.
        test_recipe:
          setup:
