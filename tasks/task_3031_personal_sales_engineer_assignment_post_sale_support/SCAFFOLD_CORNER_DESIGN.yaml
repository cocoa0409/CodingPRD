  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_customer_version_on_second_assignment_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-customer]
          - endpoints.POST_/assignments
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating an Assignment against a Customer whose version advanced since the client last read it is rejected with 412 ERR_STALE_VERSION, using expected_customer_version taken from a prior read."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-17T00:00:00Z. One engineer and one customer whose version is 1; the client reads that version before any write."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - call: "GET /customers/${cust_a_id}"
              payload: {}
              as: SalesEngineerOps
              captures: { cust_stale_v: $.data.version }
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { asg_first_id: $.data.id }
          trigger:
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "REGION_CHANGE", expected_customer_version: "${cust_stale_v}" }
              as: SalesEngineerOps
              captures: { err: $.data.error_id }
          assert:
            - "the first create succeeds with expected_customer_version ${cust_a_v} == 1"
            - "the second create still carrying the pre-write version ${cust_stale_v} returns 412 with data.error_id == ERR_STALE_VERSION"
            - "GET /assignments?customer_id=${cust_a_id} returns exactly 1 row, so the stale create left no residue"

      - name: stale_quote_version_on_reserve_after_amend_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-reserve-stale-quote]
          - endpoints.POST_/quotes/{id}/reserve
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Reserving a Quote with an expected_quote_version captured before an amend bumped the version is rejected with 412 ERR_STALE_VERSION, and the stale input is expressed as an expression over a captured placeholder."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-17T00:00:00Z. A reserved quote whose version the client records, then amends back to SUBMITTED without refreshing."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_lamp
            - *c_submit
            - *c_reserve
            - call: "GET /quotes/${quote_a_id}"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_stale_v: $.data.version }
            - call: "POST /quotes/${quote_a_id}/amend"
              payload: { expected_quote_version: "${quote_stale_v}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_after_amend_v: $.data.version, quote_after_amend_status: $.data.status }
          trigger:
            - call: "POST /quotes/${quote_a_id}/reserve"
              payload: { expected_quote_version: "${quote_stale_v}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { err: $.data.error_id }
            - call: "POST /quotes/${quote_a_id}/reserve"
              payload: { expected_quote_version: "${quote_after_amend_v}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { reserved_status: $.data.status, reserved_v: $.data.version }
          assert:
            - "Quote.${quote_a_id}.version == ${quote_after_amend_v} == ${quote_stale_v} + 1 after the amend"
            - "the reserve carrying the stale ${quote_stale_v} returns 412 with data.error_id == ERR_STALE_VERSION"
            - "the reserve carrying the refreshed ${quote_after_amend_v} succeeds with status RESERVED and version == ${reserved_v} == ${quote_after_amend_v} + 1"
            - "Quote.${quote_a_id}.reserved_at is non-null only after the successful reserve"

      - name: derived_assigned_engineer_mirror_reconciles_after_end
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Customer.fields.assigned_engineer_id
          - state_machines.Assignment.ACTIVE_to_ENDED
          - entities.Engineer.fields.active_book_size
        distinguishing_aspect: "The denormalized assigned_engineer_id mirror and the engineer's active_book_size both reconcile to the source Assignment rows after the assignment ends, leaving no stale mirror."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-18T00:00:00Z. One engineer holding one ACTIVE assignment for one customer."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
          trigger:
            - call: "GET /customers/${cust_a_id}"
              payload: {}
              as: SalesEngineerOps
              captures: { mirror_before: $.data.assigned_engineer_id }
            - call: "POST /assignments/${asg_a_id}/end"
              payload: {}
              as: SalesEngineerOps
            - call: "GET /customers/${cust_a_id}"
              payload: {}
              as: SalesEngineerOps
              captures: { mirror_after: $.data.assigned_engineer_id, cust_version_after: $.data.version }
          assert:
            - "Customer.${cust_a_id}.assigned_engineer_id == ${eng_a_id} before the end call"
            - "Customer.${cust_a_id}.assigned_engineer_id is null after the end call"
            - "Engineer.${eng_a_id}.active_book_size == 0 after the end call, matching the count of ACTIVE Assignment rows"
            - "Customer.${cust_a_id}.version advanced by 1 across the end call"

      - name: qualifying_quote_reservation_cascades_to_one_backorder_per_line
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Quote.SUBMITTED_to_RESERVED
          - entities.Backorder.fields.alloc_sequence
        distinguishing_aspect: "Reserving a two-line quote cascades into exactly two PREORDER_PENDING backorders, one per line, each with a distinct alloc_sequence assigned at creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-18T00:00:00Z. A submitted SYSTEM_PACKAGE quote with an anchor guitar line and a dependent amp line."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_lamp
            - *c_submit
          trigger:
            - call: "POST /quotes/${quote_a_id}/reserve"
              payload: { expected_quote_version: "${quote_a_v0}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { reserved_status: $.data.status }
            - call: "GET /quotes/${quote_a_id}/lines"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { first_line_id: "$.data[0].id" }
            - call: "GET /backorders"
              payload: { quote_line_id: "${first_line_id}" }
              as: SalesEngineerOps
          assert:
            - "Quote.${quote_a_id}.status == RESERVED after the reserve call"
            - "GET /backorders?engineer_id=${eng_a_id} returns exactly 2 rows, one per quote line"
            - "every created backorder has status PREORDER_PENDING and units_requested == 1 by default"
            - "the two backorders carry distinct alloc_sequence values ordered by created_at"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_visibility_of_state_change_within_the_same_response
        claim_type: immediate
        grounds:
          - entities.Assignment.fields.status
          - state_machines.Assignment.PENDING_ACCEPT_to_ACTIVE
          - entities.Customer.fields.assigned_engineer_id
        distinguishing_aspect: "The active-book count and the customer mirror are visible in the same request that accepted the assignment, with no read-your-writes delay."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-19T00:00:00Z. One engineer and one customer with a PENDING_ACCEPT assignment."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
          trigger:
            - call: "POST /assignments/${asg_a_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { accepted_status: $.data.status, accepted_sequence: $.data.sequence, accepted_at: $.data.assigned_at }
          assert:
            - "the accept response itself carries status ACTIVE, sequence 1 and assigned_at 2026-09-19T00:00:00Z"
            - "an immediate GET /engineers/${eng_a_id} returns active_book_size == 1 without any wait"
            - "an immediate GET /customers/${cust_a_id} returns assigned_engineer_id == ${eng_a_id}"
            - "the same request's response data matches the subsequent reads, confirming immediate consistency"

      - name: backorder_allocation_visible_in_the_finalize_response
        claim_type: immediate
        grounds:
          - endpoints.POST_/backorders/{id}/finalize-allocation
          - entities.Backorder.fields.units_filled
          - calculations.backorder_allocation_units
        distinguishing_aspect: "The finalized allocation is returned in the finalize response rather than surfacing only on a later read, consistent with the scaffold's immediate consistency model."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-19T00:00:00Z. A reserved quote with one guitar line and one PREORDER_PENDING backorder requesting 2 units."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_gtr_id}", engineer_id: "${eng_a_id}", units_requested: 2, preorder_open_at: "2026-09-19T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_id: $.data.id }
            - call: "POST /backorders/${bo_id}/start-sweep"
              payload: { pool_units: 1 }
              as: SalesEngineerOps
              captures: { bo_estimate: $.data.overcommit_estimate_units }
          trigger:
            - call: "POST /backorders/${bo_id}/finalize-allocation"
              payload: { pool_units: 1 }
              as: SalesEngineerOps
              captures: { filled_in_response: $.data.units_filled, status_in_response: $.data.status }
          assert:
            - "Backorder.${bo_id}.overcommit_estimate_units == 1 in the sweep response (preliminary variant)"
            - "the finalize response carries units_filled == 1 and status == PARTIALLY_FILLED"
            - "an immediate GET /backorders/${bo_id} returns the same units_filled == 1 with no additional sweep"
            - "the pool of 1 unit is fully consumed, so units_filled never exceeds pool_units"