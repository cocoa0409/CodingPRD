            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_ai}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_ai: $.data.id }
          trigger:
            - call: "POST /audit/independence-threats"
              payload: { professional_id: "${pro_mn}", client_id: "${cli_ai}", threat_type: "FINANCIAL_INTEREST", instrument_type: "MUTUAL_FUND", value_cents: 199999, effective_on: "2026-09-01T00:00:00Z" }
              as: IndependenceOfficer
              captures: { thr_ind: $.data.id }
            - call: "POST /audit/independence-threats"
              payload: { professional_id: "${pro_mn}", client_id: "${cli_ai}", threat_type: "FINANCIAL_INTEREST", instrument_type: "MUTUAL_FUND", value_cents: 200000, effective_on: "2026-09-01T00:00:00Z" }
              as: IndependenceOfficer
              captures: { thr_ind2: $.data.id }
            - call: "POST /audit/independence-threats"
              payload: { professional_id: "${pro_mn}", client_id: "${cli_ai}", threat_type: "FINANCIAL_INTEREST", instrument_type: "EQUITY", value_cents: 199999, effective_on: "2026-09-01T00:00:00Z" }
              as: IndependenceOfficer
              captures: { thr_dir: $.data.id }
          assert:
            - "IndependenceThreat.${thr_ind}.is_material == false (199999 < 100000 * 2 for an indirect holding)"
            - "IndependenceThreat.${thr_ind2}.is_material == true (200000 >= 100000 * 2, inclusive boundary)"
            - "IndependenceThreat.${thr_dir}.is_material == true (199999 >= 100000 with no indirect multiplier)"
            - "the immaterial threat ends in status CLEARED while each material threat leaves Engagement.${eng_ai}.independence_status == FROZEN"

      - name: network_risk_points_clamp_at_the_ceiling
