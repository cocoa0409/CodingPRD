# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3104_transparent_cost_plus_pharmacy_pricing_direct_manufacturer
#
# Depth probe: nine Difficulty Rules from SKILL.md §0.5, two instances each.
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1–§1.7;
# deleting this file leaves the scaffold's declared behavior identical.
# Every setup_api_calls / trigger chain is a structured call list that drives
# empty-DB into the stated precondition using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: sourcing_weighted_average_vs_cheapest_single_source_on_drug
        grounds:
          - calculations.primary_source_cost
          - calculations.primary_source_cost.variants.overview_weighted_average
          - calculations.primary_source_cost.variants.lowest_available_per_unit
          - endpoints.GET_/formularies/{id}/stock-check
        distinguishing_aspect: >
          On a drug whose eligible sourcing pool holds two rows, the OVERVIEW
          available_units-weighted average yields 13 cents while the DETAIL
          single-cheapest-source variant yields 12 cents for identical pool data,
          so the two valid readings of "the acquisition cost" differ by exactly
          one cent.
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-09-01T00:00:00Z."
            - "Manufacturer M1 exists and is ACTIVE."
            - "Manufacturer M2 exists and is ACTIVE."
            - "Drug D exists with is_controlled=false, state NON_FORMULARY."
            - "Price row P1 offered by M1 for D at 12 cents per unit with 500 units available, price_status ACTIVE, sourcing_status SOURCED."
            - "Price row P2 offered by M2 for D at 20 cents per unit with 100 units available, price_status ACTIVE, sourcing_status SOURCED."
            - "The eligible pool therefore holds exactly P1 and P2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m1_id: $.data.id }
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Cardell Labs" }
              as: PharmacyOps
              captures: { m2_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m1_id}", unit_cost_cents: 12, available_units: 500, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p1_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m2_id}", unit_cost_cents: 20, available_units: 100, reliability_tier: "B", packaging: "100-count bottle" }
              as: PharmacyOps
              captures: { p2_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p1_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p1_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p2_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p2_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
          trigger:
            - call: "GET /formularies/${d_id}/stock-check"
              payload: {}
              as: PharmacyOps
          assert:
            - "response data.effective_unit_cost_cents == 13"
            - "the DETAIL variant lowest_available_per_unit over the same pool yields 12"
            - "13 != 12 — the two valid readings of 'the acquisition cost' diverge on identical pool data"
            - "response data.sourcing_status == \"SOURCED\""
            - "response data.eligible_price_ids contains exactly ${p1_id} and ${p2_id}"

      - name: priced_intake_blended_vs_unblended_acquisition_cost_on_order
        grounds:
          - calculations.order_price
          - calculations.order_price.variants.single_source
          - calculations.order_price.variants.blended_source
          - entities.Order.fields.acquisition_cost_cents
          - entities.Order.fields.is_blended_cost
        distinguishing_aspect: >
          For the same order quantity of 60, a source row that fully covers the
          quantity produces acquisition_cost_cents = 720 while a source row with
          only 20 units forces a fallback blend whose divided-down per-unit figure
          is 15, so the two valid readings of "the acquisition cost of this order"
          differ by 705 cents and the order also flips is_blended_cost.
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-09-01T00:00:00Z."
            - "Drug D is FORMULARY, price rows P1 {12c, 600u} and PS {16c, 400u} are both ACTIVE+SOURCED, and the drug reports effective_unit_cost_cents 12."
            - "A pharmacy PH licensed ACTIVE for state CA, shipping_enabled true, exists."
            - "Patient, prescriber and prescription RX (ship_state_code CA, total_refills_authorized 1) exist; RX is ACTIVE with refill request RQ ACCEPTED at packaged_quantity 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m1_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m1_id}", unit_cost_cents: 12, available_units: 600, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p1_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p1_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p1_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
            - call: "POST /formularies/${d_id}/expansion"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m1_id}", unit_cost_cents: 16, available_units: 400, reliability_tier: "C", packaging: "400-count bottle" }
              as: PharmacyOps
              captures: { ps_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${ps_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${ps_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
            - call: "POST /pharmacies"
              payload: { pharmacy_name: "Sunbelt Mail Pharmacy", domicile_state_code: "TX", shipping_enabled: true }
              as: PharmacyOps
              captures: { ph_id: $.data.id }
            - call: "POST /pharmacies/${ph_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-MP-1001", expiry_at: "2027-09-01T00:00:00Z" }
              as: PharmacyOps
              captures: { lic_id: $.data.id }
            - call: "POST /pharmacies/${ph_id}/licenses/${lic_id}/verification"
              payload: {}
              as: PharmacyOps
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", home_state_code: "CA" }
              as: PharmacyOps
              captures: { pat_id: $.data.id }
            - call: "POST /prescribers"
              payload: { prescriber_name: "Dr. Lin", npi: "1407001234", license_state_code: "CA" }
              as: PharmacyOps
              captures: { prs_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${prs_id}", drug_id: "${d_id}", ship_state_code: "CA", total_refills_authorized: 1 }
              as: PharmacyOps
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/intake-requests"
              payload: { packaged_quantity: 100 }
              as: PharmacyOps
              captures: { rq_id: $.data.id }
            - call: "POST /prescription-requests/${rq_id}/review"
              payload: {}
              as: Pharmacist
            - call: "POST /prescription-requests/${rq_id}/acceptance"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /orders"
              payload: { prescription_id: "${rx_id}", request_id: "${rq_id}", pharmacy_id: "${ph_id}", quantity: 60, source_price_id: "${ps_id}", sub_source_price_id: "${p1_id}" }
              as: PharmacyOps
              captures: { o_blend_id: $.data.id }
            - call: "GET /orders/${o_blend_id}"
              payload: {}
              as: PharmacyOps
          assert:
            - "Order.${o_blend_id}.acquisition_cost_cents == 15"
            - "Order.${o_blend_id}.is_blended_cost == true"
            - "Order.${o_blend_id}.primary_units == 20 and Order.${o_blend_id}.fallback_units == 40"
            - "the single-source variant on the same quantity 60 against P1 alone yields acquisition_cost_cents == 720 and is_blended_cost == false"
            - "15 != 720 — the two valid readings of 'the acquisition cost of this order' diverge by 705 cents"
