      - name: remanufacture_receipt_returns_the_pack_to_stock_and_refills_inventory
        claim_type: action_endpoint
        grounds:
          - state_machines.BatteryPack.transitions.QUARANTINED_to_STOCK
          - entities.WarrantyProgram.fields.reman_available_count
          - endpoints[POST /battery-warranty/pack-shipments/{shipment_id}/receive]
        distinguishing_aspect: |
          One accepted receipt fans out across three entities in one request: the pack changes TYPE
          as well as status, its whole module roster is reset to HEALTHY even though a thermal event
          had flagged runaway, and the program's inventory mirror flips reman_stock_state from
          DEPLETED to AVAILABLE. The mirror is a derived COUNT, so it must move without any separate
          inventory call.
        test_recipe:
          setup:
            - "One program (reman_available_count 0, reman_stock_state DEPLETED), one center with a technician, one vehicle with an installed pack."
            - "An S3 ThermalEvent quarantines the pack and flags modules 3 and 7 for runaway; the resulting UN3536 shipment is tendered at 30.00 %."
