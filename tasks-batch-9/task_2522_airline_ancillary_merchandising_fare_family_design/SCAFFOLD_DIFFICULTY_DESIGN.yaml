  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_state_beats_seat_capacity_on_hold
        grounds:
          - validations.priority_9
          - validations.priority_47
          - validations.priority_42
          - errors.ERR_BOOKING_STATE_INVALID
          - errors.ERR_SEAT_INVENTORY_EXHAUSTED
        conflict_pair:
          higher: { priority: 9, category: state, error_id: ERR_BOOKING_STATE_INVALID, http: 409 }
          lower: { priority: 42, category: business_fiscal, error_id: ERR_SEAT_INVENTORY_EXHAUSTED, http: 409 }
        distinguishing_aspect: |
          A single request violates the state check at priority 9 (the booking was cancelled)
          and the fiscal capacity check at priority 42 (the segment is fully held, so
          available_seats is 0); the occupancy check at priority 47 is violated too. Only the
          numerically lowest priority may answer, so the response must be
          ERR_BOOKING_STATE_INVALID - a validator that evaluates inventory first, or that
          orders by category severity rather than by priority number, returns
          ERR_SEAT_INVENTORY_EXHAUSTED or ERR_SEAT_ALREADY_OCCUPIED instead.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; SEAT_STANDARD (1900) is ACTIVE and ECO_LITE is PUBLISHED on DIRECT_WEB"
            - "flight AB100 carries one OPEN MID segment rows 20..20 letters A,B (total_seats 2)"
            - "a first HELD booking holds 20A and 20B, so available_seats is 0"
            - "a second booking on the same flight has been cancelled from HELD, so it is terminal"
