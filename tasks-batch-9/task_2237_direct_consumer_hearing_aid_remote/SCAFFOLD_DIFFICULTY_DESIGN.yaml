          - "GET /devices/${dev}: data.status == \"WITH_PATIENT\"; GET /repair-orders with device_id == ${dev} returns exactly 3 rows"

  # =======================================================================
  # 0.5 rule 9: compensating_invariant
  # Three DIFFERENT conserved quantities, each broken-then-restored by a
  # declared compensating action:
  #   cash      : captured == refunded + retained + open_balance
  #   inventory : on_hand + reserved + dispatched == total_units_received
  #   benefit   : insurance_paid + fsa_paid + patient_responsibility == eligible
  # =======================================================================
  compensating_invariant:

    - name: cash_conservation_restored_by_restocking_waiver
      grounds:
        - "entities.DeviceOrder.fields.open_balance_cents"
        - "state_machines.DeviceOrder.PARTIALLY_REFUNDED_to_REFUNDED"
        - "calculations.return_refund_settlement"
        - "validations[priority=65]"
      distinguishing_aspect: >-
        CONSERVED QUANTITY: cash, captured_cents == refunded_cents + retained_cents
        + open_balance_cents. Settlement moves 20720 of the 210096 captured cents
        into retained_cents; POST /return-authorizations/{id}/waive-restocking is the
        declared compensating action that pushes those cents back into refunded_cents.
        The identity holds as 210096 == 189376 + 20720 + 0 before the waiver and as
        210096 == 210096 + 0 + 0 after it, and captured_cents itself never changes.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with restocking_fee_mode FLAT_PCT, restocking_fee_pct 0.1000, restocking_fee_cap_cents 0, shipping_refundable false, trial_period_days 30."
          - "One InventoryPool NEO/M/OPEN with 5 units and one IN_STOCK NEO device."
          - "Patient age 71 screens clean; order 199900/9900/4500/1495 -> device subtotal 190000, tax 14101, total_cents 210096, captured_cents 210096."
          - "DELIVERED 2026-08-01T00:00:00Z; the return is issued at 2026-08-07T00:00:00Z (days_used_at_issue 6), picked up, received, inspected RESELLABLE and settled at that same instant, so settled_at == 2026-08-07T00:00:00Z."
          - "The waiver is called at the same clock, comfortably inside the 30-day window enforced by priority 65."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /devices", payload: { serial_number: "SN-CC-0001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "cc@example.com", full_name: "Cleo Crane", age_years: 71 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /device-orders/${ord}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord}", event: "DELIVERED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "GET /trial-periods"
            payload: { device_order_id: "${ord}" }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { trial: "$.data[0].id", trial_v: "$.data[0].version" }
          - call: "POST /trial-periods/${trial}/return-authorizations"
            payload: { expected_trial_period_version: "${trial_v}" }
            as: Patient
            as_user_id: "${pat}"
            captures: { ra: "$.data.id" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord}", event: "RETURN_PICKED_UP" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /return-authorizations/${ra}/receive", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /return-authorizations/${ra}/inspect", payload: { inspection_grade: "RESELLABLE" }, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /return-authorizations/${ra}/settle", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
        trigger:
          - { call: "POST /return-authorizations/${ra}/waive-restocking", payload: { reason_note: "goodwill adjustment after supervisor review" }, as: ComplianceOfficer, as_user_id: "comp_1" }
        assert:
          - "Before the trigger, GET /return-authorizations/${ra}: data.days_used_at_issue == 6, data.restocking_variant == \"FLAT_PCT\", data.restocking_fee_cents == 19225, data.non_refundable_shipping_cents == 1495 and data.refund_amount_cents == 189376"
          - "Before the trigger, GET /device-orders/${ord}: data.captured_cents == 210096, data.refunded_cents == 189376, data.retained_cents == 20720 and data.open_balance_cents == 0 (identity: 210096 == 189376 + 20720 + 0)"
          - "Before the trigger, GET /device-orders/${ord}: data.payment_status == \"PARTIALLY_REFUNDED\" and data.fulfillment_status == \"RETURNED\""
          - "Trigger response: HTTP 200 with data.restocking_variant == \"WAIVED\", data.restocking_fee_cents == 0, data.non_refundable_shipping_cents == 0 and data.refund_amount_cents == 210096"
          - "Trigger response: data.status == \"REFUND_SETTLED\" (the ReturnAuthorization has no transition out of REFUND_SETTLED; the compensating transition lands on the DeviceOrder payment dimension)"
          - "After the trigger, GET /device-orders/${ord}: data.payment_status == \"REFUNDED\", data.captured_cents == 210096, data.refunded_cents == 210096, data.retained_cents == 0 and data.open_balance_cents == 0 (identity: 210096 == 210096 + 0 + 0)"
          - "After the trigger, GET /trial-periods/${trial}: data.status == \"RETURN_SETTLED\"; GET /patients/${pat}: data.lifetime_return_count == 1 (the waiver does not double-count the return)"

    - name: inventory_conservation_restored_by_fit_exchange_cancel
      grounds:
        - "entities.InventoryPool.fields.total_units_received"
        - "state_machines.FitExchange.RESERVED_to_CANCELLED"
        - "calculations.fit_exchange_fee"
        - "concurrency_rules[fit-exchange-create-stale-order]"
      distinguishing_aspect: >-
        CONSERVED QUANTITY: inventory, on_hand_units + reserved_units +
        dispatched_units == total_units_received, held per pool. Requesting an
        exchange from NEO/M/OPEN to NEO/L/CLOSED moves one target unit from on_hand
        to reserved (3/0/0 becomes 2/1/0, sum still 3); POST
        /fit-exchanges/{id}/cancel is the declared compensating action that restores
        the exact pre-request distribution 3/0/0, not merely the sum. The source pool
        is untouched throughout because the exchange never reached COMPLETED.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with trial_period_days 30; pool P1 NEO/M/OPEN with 5 units and pool P2 NEO/L/CLOSED with 3 units; one IN_STOCK NEO device."
          - "Patient age 64 screens clean and orders dome_size M / tip_type OPEN; authorized, fit-confirmed (P1 reserved 1), shipped (P1 dispatched 1) and DELIVERED, so the trial is ACTIVE and the exchange fee is 0."
          - "The live order version is captured from GET /device-orders/{id} for the OCC token on the exchange request."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { p1: "$.data.id" }
          - { call: "POST /inventory-pools/${p1}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-L-CLOSED", model: "NEO", dome_size: "L", tip_type: "CLOSED" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { p2: "$.data.id" }
          - { call: "POST /inventory-pools/${p2}/restock", payload: { units: 3 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /devices", payload: { serial_number: "SN-IC-0001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "ic@example.com", full_name: "Ida Cobb", age_years: 64 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /device-orders/${ord}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord}", event: "DELIVERED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "GET /device-orders/${ord}"
            payload: {}
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { ord_v: "$.data.version" }
          - call: "POST /device-orders/${ord}/fit-exchanges"
            payload: { to_dome_size: "L", to_tip_type: "CLOSED", expected_device_order_version: "${ord_v}", allow_backorder: false }
            as: Patient
            as_user_id: "${pat}"
            captures: { fx: "$.data.id" }
        trigger:
          - { call: "POST /fit-exchanges/${fx}/cancel", payload: { reason_note: "patient changed their mind before shipment" }, as: Patient, as_user_id: "${pat}" }
        assert:
          - "Before the trigger, GET /fit-exchanges/${fx}: data.status == \"RESERVED\", data.exchange_ordinal == 1 and data.exchange_fee_cents == 0 (the trial is ACTIVE, so exchanges are always free)"
          - "Before the trigger, GET /inventory-pools/${p2}: data.on_hand_units == 2, data.reserved_units == 1, data.dispatched_units == 0 and data.total_units_received == 3 (identity: 2 + 1 + 0 == 3)"
          - "Before the trigger, GET /inventory-pools/${p1}: data.on_hand_units == 4, data.reserved_units == 0, data.dispatched_units == 1 and data.total_units_received == 5 (identity: 4 + 0 + 1 == 5)"
          - "Trigger response: HTTP 200 with data.status == \"CANCELLED\""
          - "After the trigger, GET /inventory-pools/${p2}: data.on_hand_units == 3, data.reserved_units == 0, data.dispatched_units == 0 and data.total_units_received == 3 (the exact pre-request distribution, not just a matching sum)"
          - "After the trigger, GET /inventory-pools/${p1}: data.on_hand_units == 4, data.reserved_units == 0, data.dispatched_units == 1 and data.total_units_received == 5 (the source pool was never touched)"
          - "After the trigger, GET /device-orders/${ord}: data.dome_size == \"M\" and data.tip_type == \"OPEN\" (only a COMPLETED exchange rewrites the configuration) and data.version == ${ord_v} + 1"
          - "GET /fit-exchanges with device_order_id == ${ord} and status == \"CANCELLED\" returns exactly 1 row"

    - name: benefit_conservation_preserved_by_reimbursement_void
      grounds:
        - "entities.ReimbursementClaim.fields.patient_responsibility_cents"
        - "calculations.reimbursement_allocation"
        - "state_machines.ReimbursementClaim.APPROVED_to_VOIDED"
        - "validations[priority=8]"
      distinguishing_aspect: >-
        CONSERVED QUANTITY: benefit, insurance_paid_cents + fsa_paid_cents +
        patient_responsibility_cents == eligible_amount_cents. The ordered waterfall
        splits eligible 150000 into 60000 / 25000 / 65000; POST
        /reimbursement-claims/{id}/void is the declared compensating action that
        zeroes the first two buckets and pushes the entire 150000 into
        patient_responsibility_cents, so the identity holds both before and after
        while the total never moves. A proportional (rather than ordered) split would
        already fail the pre-void buckets.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA; one InventoryPool NEO/M/OPEN with 5 units; one IN_STOCK NEO device."
          - "Patient age 67 screens clean; order 199900/9900/4500/1495 -> captured_cents 210096 with refunded_cents 0 and retained_cents 0, so the DEVICE_ORDER eligible ceiling is 210096."
          - "A DEVICE_ORDER claim is drafted with claimed_amount_cents 150000, the full required document set {INVOICE, AUDIOGRAM_OR_WAIVER, PROOF_OF_PAYMENT, LMN} (documentation_complete true), insurance_benefit_cap_cents 100000, insurance_benefit_used_cents 40000 and fsa_balance_cents 25000."
          - "Waterfall: eligible = min(150000, 210096) = 150000; insurance = min(150000, 100000 - 40000) = 60000; remaining 90000; fsa = min(90000, 25000) = 25000; patient = 65000."
          - "Submitted by ReimbursementSpecialist rs_1 and approved by a DIFFERENT ReimbursementSpecialist rs_2, satisfying the priority-8 segregation-of-duties rule; priority 60 also passes because claimed_amount_cents 150000 == eligible_amount_cents 150000."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /devices", payload: { serial_number: "SN-BC-0001", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "bc@example.com", full_name: "Ben Cole", age_years: 67 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord}", outcome: "AUTHORIZED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /device-orders/${ord}/confirm-fit", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /device-orders/${ord}/ship", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
          - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord}", event: "DELIVERED" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /reimbursement-claims"
            payload: { patient_id: "${pat}", subject_kind: "DEVICE_ORDER", device_order_id: "${ord}", claimed_amount_cents: 150000, document_codes: ["INVOICE", "AUDIOGRAM_OR_WAIVER", "PROOF_OF_PAYMENT", "LMN"], insurance_benefit_cap_cents: 100000, insurance_benefit_used_cents: 40000, fsa_balance_cents: 25000 }
            as: ReimbursementSpecialist
            as_user_id: "rs_1"
            captures: { clm: "$.data.id" }
          - { call: "POST /reimbursement-claims/${clm}/submit", payload: {}, as: ReimbursementSpecialist, as_user_id: "rs_1" }
          - { call: "POST /reimbursement-claims/${clm}/start-review", payload: {}, as: ReimbursementSpecialist, as_user_id: "rs_2" }
          - { call: "POST /reimbursement-claims/${clm}/decide", payload: { decision: "APPROVE" }, as: ReimbursementSpecialist, as_user_id: "rs_2" }
        trigger:
          - { call: "POST /reimbursement-claims/${clm}/void", payload: { reason_note: "subject order superseded; claim withdrawn by compliance" }, as: ComplianceOfficer, as_user_id: "comp_1" }
        assert:
          - "Before the trigger, GET /reimbursement-claims/${clm}: data.documentation_complete == true and data.eligible_amount_cents == 150000"
          - "Before the trigger, GET /reimbursement-claims/${clm}: data.insurance_paid_cents == 60000, data.fsa_paid_cents == 25000 and data.patient_responsibility_cents == 65000 (identity: 60000 + 25000 + 65000 == 150000)"
          - "Before the trigger, GET /reimbursement-claims/${clm}: data.status == \"APPROVED\" and data.submitted_by_user_id != data.approved_by_user_id"
          - "Trigger response: HTTP 200 with data.status == \"VOIDED\""
          - "After the trigger, GET /reimbursement-claims/${clm}: data.eligible_amount_cents == 150000, data.insurance_paid_cents == 0, data.fsa_paid_cents == 0 and data.patient_responsibility_cents == 150000 (identity: 0 + 0 + 150000 == 150000)"
          - "After the trigger, GET /device-orders/${ord}: data.captured_cents == 210096, data.refunded_cents == 0 and data.retained_cents == 0 (voiding a claim moves no cash)"
          - "GET /reimbursement-claims with device_order_id == ${ord} returns exactly 1 row with data[0].status == \"VOIDED\", so a fresh claim on the same subject is no longer blocked by priority 44"
