        test_recipe:
          setup: "Standard property; business date 2026-08-01 left in ROOM_POSTING; one CASH folio at rate 200.00 with room and tax posted; a 100.00 POSTING_ERROR allowance requested by NightAuditor u_na_1 (so its frozen tier is NightAuditor) and submitted."
