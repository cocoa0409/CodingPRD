      - name: remitting_every_delinquent_fee_restores_posture_and_points_but_not_the_suspension
        grounds:
          - state_machines.UsageReport.fee_status.DELINQUENT_to_PAID
          - state_machines.MasterContract.compliance_posture.DELINQUENT_to_WATCH
          - state_machines.MasterContract.compliance_posture.DELINQUENT_to_COMPLIANT
          - calculations.contract_compliance_posture
          - calculations.supplier_performance_score
          - validations.priority_60
          - validations.priority_62
          - errors.ERR_CONTRACT_NOT_ACTIVE
          - errors.ERR_PIGGYBACK_NOT_AUTHORIZED
        distinguishing_aspect: |
          Two exact remittances must unwind the delinquency ledger in the reverse order it was built:
          DELINQUENT -> WATCH after the first (count 1, outstanding 180 which is under the amount
          threshold) and DELINQUENT -> COMPLIANT after the second, with the supplier's
          DELINQUENCY_DEDUCTION_POINTS returned one report at a time (6.00 -> 3.00 -> 0.00, score 94.00 ->
          97.00 -> 100.00) and fee_outstanding_cents driven to exactly 0. What is NOT compensated is the
          suspension: the contract stays SUSPENDED and the analyses stay VOIDED, so usage is still refused
          until an explicit REINSTATE, and even then only with ERR_PIGGYBACK_NOT_AUTHORIZED.
        test_recipe:
          setup:
            - "Contract COOP-MC-2026-001 is ACTIVE for Acme with admin_fee_rate_bps 200 and line JAN-LINER-045 at 9015 cents; member Riverside (CA) is ACTIVE with a DETERMINED analysis."
            - "Two ACCEPTED reports each carry reported_fee_cents 180 and remitted_cents 0: SEP (fee_due_at 2026-10-31) and OCT (fee_due_at 2026-12-01)."
            - "A compliance sweep at clock 2026-12-02 moved both DUE -> DELINQUENT, took delinquent_report_count to 2, drove compliance_posture to DELINQUENT on the count branch, suspended the contract, voided the analysis and charged the supplier 6.00 points for a score of 94.00."
