      - name: cushion_gas_safety_priority_13_wins_over_contract_inventory_fiscal_priority_34
        grounds:
          - validations.priority_13_ERR_CUSHION_GAS_BREACH
          - validations.priority_34_ERR_CONTRACT_INVENTORY_INSUFFICIENT
          - calculations.ticket_charge_breakdown
        distinguishing_aspect: |
          On the tight F_BOUND field the physical cushion floor and the contractual inventory floor sit only
          1110 Dth apart, so a 92600 Dth withdrawal breaks both (92600 > 92500 field working gas AND
          92600 + 1111.200 > 91390.000 contract balance) and must return ERR_CUSHION_GAS_BREACH, while a
          92000 Dth withdrawal on a second gas day clears the cushion (92000 <= 92500) yet still breaks the
          contract floor (92000 + 1104.000 = 93104.000 > 91390.000) and must return
          ERR_CONTRACT_INVENTORY_INSUFFICIENT. The gap only exists because the fiscal check adds the fuel
          retention while the safety check does not.
