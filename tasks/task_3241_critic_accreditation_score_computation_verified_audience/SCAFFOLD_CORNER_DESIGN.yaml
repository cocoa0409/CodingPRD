        distinguishing_aspect: "Error responses carry meta.api_request_id, meta.api_request_timestamp, response_type == \"error\", and data.error_id + data.message — verified on a 404 path."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /reviews/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == \"error\""
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: dispute_ruling_occ_stale_dispute_version_returns_412
        claim_type: conditional_action
        grounds:
          - concurrency_rules[dispute-ruling-stale-dispute]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The dispute-ruling OCC rule: ruling with the pre-TRIAGE dispute version fails 412, and the dispute's version increments by exactly 1 per transition."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA, CC ACCREDITED; R1 OPEN, embargo lifted; CA publishes RA; CC files CLASSIFICATION dispute D1 (version observed at FILED)."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_cc
            - call: "POST /critics/${cc}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - call: "POST /disputes"
              payload: { dispute_kind: "CLASSIFICATION", subject_review_id: "${ra}", filed_by_critic_id: "${cc}", requested_classification: "ROTTEN" }
              as: Critic
              as_user_id: "${cc}"
              captures: { d1: $.data.id, d_v0: $.data.version }
          trigger:
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
              captures: { d_v1: $.data.version }
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "RULE_UPHOLD", expected_dispute_version: "${d_v0}" }
              as: AccreditationBoard
              captures: { err: $.data.error_id }
          assert:
            - "Dispute.${d1}.version incremented from ${d_v0} to ${d_v1} on TRIAGE (${d_v1} == ${d_v0} + 1)"
            - "RULE_UPHOLD with the stale ${d_v0} returns 412 ERR_STALE_VERSION and Dispute.${d1}.status remains TRIAGED"

      - name: score_display_dispute_upheld_forces_snapshot_supersession
        claim_type: conditional_action
        grounds:
          - state_machines.Dispute.TRIAGED_to_UPHELD
          - entities.ScoreSnapshot.fields.superseded
        distinguishing_aspect: "A SCORE_DISPLAY dispute RULE_UPHOLD forces a fresh recalculation: every previously non-superseded snapshot for the release gains superseded == true and a fresh pair appears."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA ACCREDITED; R1 OPEN, embargo lifted; CA publishes RA (FRESH); studio files SCORE_DISPLAY dispute DS1 on R1; DS1 TRIAGED."
          setup_api_calls:
            - *c_clock
            - *c_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *c_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - &c_ds1
              call: "POST /disputes"
              payload: { dispute_kind: "SCORE_DISPLAY", subject_release_id: "${r1}", filed_by_studio: "Harbor Pictures" }
              as: StudioRep
              captures: { ds1: $.data.id }
            - call: "POST /disputes/${ds1}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
          trigger:
            - call: "GET /disputes/${ds1}"
              as: AccreditationBoard
              captures: { ds1_v: $.data.version }
            - call: "POST /disputes/${ds1}/transition"
              payload: { action: "RULE_UPHOLD", expected_dispute_version: "${ds1_v}" }
              as: AccreditationBoard
            - call: "GET /releases/${r1}/score-snapshots"
              as: AccreditationBoard
          assert:
            - "the TOMATOMETER/PROVISIONAL snapshot created at publish now has superseded == true"
            - "a fresh TOMATOMETER/PROVISIONAL snapshot exists with superseded == false and identical counts (positive_count 1, total_count 1, pct 100)"

