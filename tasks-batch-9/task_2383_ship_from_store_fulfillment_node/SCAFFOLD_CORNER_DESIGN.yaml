          - errors.ERR_WINDOW_NOT_FOUND
          - errors.ERR_NOTIFICATION_NOT_FOUND
          - validations.priority 4
        distinguishing_aspect: "Nine detail reads on an empty network each return their own resource-specific 404 code rather than a shared generic ERR_NOT_FOUND, which is the only way the priority-4 left-to-right path resolution rule can be observed per entity."
        test_recipe:
          setup:
            - "Empty database. No fixture rows exist, so every well-formed UUID below is unresolvable."
          setup_api_calls: []
          trigger:
            - call: "GET /fulfillment-network/store-inventories/00000000-0000-4000-8000-000000000001"
