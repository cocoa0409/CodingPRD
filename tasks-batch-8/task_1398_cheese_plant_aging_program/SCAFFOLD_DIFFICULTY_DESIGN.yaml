# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Cheese Plant & Aging Program
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two DIFFERENT entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cheese_batch_provisional_vs_actual_yield_diverge
        grounds:
          - calculations.provisional_yield_from_components
          - entities.CheeseBatch.fields.yield_provisional_pct
          - entities.CheeseBatch.fields.yield_actual_pct
        distinguishing_aspect: |
          Same make inputs produce two different yield values on the CheeseBatch
          entity domain: the provisional component-model variant (19.18) differs
          from the final observed variant (9.80), proving both variants run.
        test_recipe:
          setup:
            - "Plant, vat, accepted intake (10000 L, fat 3.85, protein 3.10), RELEASED culture/coagulant lots"
            - "MakeSheet for CHEDDAR started and completed with green_weight_kg=980.0, wheels_produced=10"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant A", license_number: "WI-100", export_listed: true }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 10000.0, fat_pct: 3.85, protein_pct: 3.10, somatic_cell_count: 200000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "CHEDDAR", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T10:00:00Z", liters_committed: 10000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 10.0, coagulant_ml_planned: 500.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/6/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/7/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/8/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 980.0, wheels_produced: 10 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/cheese-batches", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { batch_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /plant/cheese-batches/${batch_id}", payload: {}, as: Cheesemaker }
          assert:
            - "CheeseBatch.${batch_id}.yield_provisional_pct == 19.18"
            - "CheeseBatch.${batch_id}.yield_actual_pct == 9.80"
            - "CheeseBatch.${batch_id}.yield_provisional_pct != CheeseBatch.${batch_id}.yield_actual_pct"

      - name: aging_unit_age_days_floor_vs_turn_due_projection_variants
        grounds:
          - calculations.age_days_and_turn_due
          - entities.AgingUnit.fields.age_days
          - entities.AgingUnit.fields.turns_due
        distinguishing_aspect: |
          A different entity domain (AgingUnit, not CheeseBatch): the floor-days
          age projection and the >= turn-due projection are two interpretations
          of the same elapsed clock interval — at exactly 3.5 days age_days reads
          3 while a BRICK unit (interval 3) is simultaneously turns_due=true only
          when the full 3-day boundary has elapsed; floor vs threshold variants
          of the same duration diverge at partial-day boundaries.
        test_recipe:
          setup:
            - "Completed MUENSTER batch placed in an aging room at 2026-08-01T12:00:00Z; clock later set to 2026-08-04T00:00:00Z (2.5 days) then 2026-08-04T12:00:00Z (exactly 3.0 days)"
            - "MUENSTER turn interval is 3 days"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant B", license_number: "WI-101" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 500.0, wheels_produced: 5 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/cheese-batches", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /plant/plants/${plant_id}/aging-rooms", payload: { code: "RM-1", capacity_wheels: 100, temp_c: 10.0, humidity_pct: 85.0 }, as: PlantAdmin, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/aging-units", payload: { cheese_batch_id: "${batch_id}", aging_room_id: "${room_id}", wheel_count: 5, expected_aging_room_version: "${room_v}" }, as: AgingRoomOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T11:59:59Z" }, as: PlantAdmin }
            - { call: "GET /plant/aging-units/${unit_id}", payload: {}, as: AgingRoomOperator, captures: { age_before: $.data.age_days, due_before: $.data.turns_due } }
          trigger:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: PlantAdmin }
            - { call: "GET /plant/aging-units/${unit_id}", payload: {}, as: AgingRoomOperator, captures: { age_after: $.data.age_days, due_after: $.data.turns_due } }
          assert:
            - "age_before == 2 (floor of 2.9999 days) and due_before == false"
            - "age_after == 3 and due_after == true (>= boundary at exactly 3 days)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (two DIFFERENT modes: (a) >=3-input non-linear, (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: grade_assignment_multi_branch_ladder
        grounds:
          - calculations.grade_assignment
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear conditional branches — body_score,
          flavor_score, moisture_pct, fat_dry_basis_pct and variety interact
          through a top-down ladder where CONDEMNED/DOWNGRADE/GRADE_A/GRADE_B
          rungs reorder outcomes; a batch with A-level scores but moisture
          between the A-max and the legal max lands GRADE_B, proving the ladder
          is not a single threshold.
        test_recipe:
          setup:
            - "Completed CHEDDAR batch, all 10 wheels placed, aged >= 60 days"
            - "Grading readings chosen to hit the middle rung: moisture 38.0 (> CHEDDAR A-max 37.0, <= legal max 39.0), fat_db 52.0, body 9, flavor 9"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant C", license_number: "WI-102" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 10000.0, fat_pct: 3.85, protein_pct: 3.10, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "CHEDDAR", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T10:00:00Z", liters_committed: 10000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 10.0, coagulant_ml_planned: 500.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/6/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/7/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/8/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 1000.0, wheels_produced: 10 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/cheese-batches", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /plant/plants/${plant_id}/aging-rooms", payload: { code: "RM-1", capacity_wheels: 100, temp_c: 10.0, humidity_pct: 85.0 }, as: PlantAdmin, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /plant/aging-units", payload: { cheese_batch_id: "${batch_id}", aging_room_id: "${room_id}", wheel_count: 10, expected_aging_room_version: "${room_v}" }, as: AgingRoomOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", moisture_pct: 38.0, fat_dry_basis_pct: 52.0, body_score: 9, flavor_score: 9 }, as: QAGrader, as_user_id: "qa_carol", captures: { grade: $.data.assigned_grade } }
          assert:
            - "GradingEvent.assigned_grade == GRADE_B (A-level scores but moisture 38.0 > 37.0 A-max pushes down exactly one rung)"
            - "CheeseBatch.${batch_id}.current_grade == GRADE_B"
            - "CheeseBatch.${batch_id}.moisture_pct == 38.0"

      - name: whey_split_pinned_evaluation_and_rounding_order
        grounds:
          - calculations.whey_valorization_split
        distinguishing_aspect: |
          Mode (b)+(c): a circular-looking derived set (valorized_kg -> disposed_kg
          -> valorization_rate_pct all feed each other) whose evaluation order the
          scaffold pins (total fixed -> disposed -> rate) with per-field 2dp
          half-up rounding; the rate 7000/9020 = 77.61 is only reproducible when
          the stored disposed_kg is rounded before the rate is computed.
        test_recipe:
          setup:
            - "Completed CHEDDAR make: liters_committed 10000.0, green_weight_kg 980.0 -> WheyStream total_whey_kg 9020.0"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant D", license_number: "WI-103" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 10000.0, fat_pct: 3.85, protein_pct: 3.10, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "CHEDDAR", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T10:00:00Z", liters_committed: 10000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 10.0, coagulant_ml_planned: 500.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/6/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/7/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/8/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 980.0, wheels_produced: 10 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/whey-streams", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { whey_id: "$.data[0].id" } }
          trigger:
            - { call: "PUT /plant/whey-streams/${whey_id}", payload: { valorized_kg: 7000.0 }, as: Cheesemaker, as_user_id: "cm_alice" }
          assert:
            - "WheyStream.${whey_id}.total_whey_kg == 9020.0"
            - "WheyStream.${whey_id}.disposed_kg == 2020.0"
            - "WheyStream.${whey_id}.valorization_rate_pct == 77.61"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cheese_batch_regrade_cycle_graded_to_graded
        grounds:
          - state_machines.CheeseBatch.GRADED_to_GRADED
          - state_machines.CheeseBatch.GRADED_to_CONDEMNED
        distinguishing_aspect: |
          Cycle on CheeseBatch: a GRADED batch with release_decision PENDING may
          be re-graded (GRADED -> GRADED), each new GradingEvent superseding the
          prior one; the loop terminates only via release or a CONDEMNED re-grade.
        test_recipe:
          setup:
            - "Completed MUENSTER batch, all wheels placed, aged past 21-day minimum, graded once to GRADE_A"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant E", license_number: "WI-104" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
