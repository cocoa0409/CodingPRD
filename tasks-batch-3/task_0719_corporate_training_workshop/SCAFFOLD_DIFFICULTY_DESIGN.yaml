          Depth-2 chain from a DIFFERENT trigger (withdraw, not cancel): withdraw(Registration CONFIRMED->WITHDRAWN)
          frees a seat (seats_confirmed-=1); that seat-freeing causes the earliest WAITLISTED registration to be
          promoted WAITLISTED->ENROLLED (seats_waitlisted-=1, seats_reserved+=1).
