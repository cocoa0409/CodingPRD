# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Commercial General Liability — Expert
# Walks references/claim-extraction-guide.md against §1.1-§1.7. Corners already
# proven by a §1.8 difficulty instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_policy_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.Policy
          - endpoints
        distinguishing_aspect: "POST /policies with all required fields -> 201, status DRAFT, server-minted id/created_at/version=1, estimated/audited premium and posture null pre-bind."
        test_recipe:
          setup:
            - "Insurer + PAYROLL insured exist."
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C01", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id, ver: $.data.version }
          assert:
            - "Response status 201"
            - "Policy.${pol_id}.status == DRAFT"
            - "Policy.${pol_id}.version == 1"
            - "Policy.${pol_id}.estimated_premium_cents == null"
            - "Policy.${pol_id}.posture == null"

      - name: get_policy_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Policy
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /policies/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB (only auth headers needed)"]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 404, data.error_id == ERR_NOT_FOUND"

      - name: create_policy_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Policy
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "POST /policies omitting coverage_trigger is malformed; the implementation rejects it (no policy created). Name marks this a negative test."
        test_recipe:
          setup: ["Insurer + insured exist."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C02", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
          assert:
            - "Response status is 4XX (missing coverage_trigger); no Policy persisted with policy_number CGL-C02"

      - name: duplicate_fein_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Insured.fields.fein
          - errors[ERR_DUPLICATE_FEIN]
        distinguishing_aspect: "Second insured with the same fein within one insurer -> 409 ERR_DUPLICATE_FEIN."
        test_recipe:
          setup: ["Insurer with one insured fein 11-1111111."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
          trigger:
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "Other LLC", fein: "11-1111111", primary_basis: "SALES" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409, data.error_id == ERR_DUPLICATE_FEIN"

      - name: duplicate_policy_number_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Policy.fields.policy_number
          - errors[ERR_DUPLICATE_POLICY_NUMBER]
        distinguishing_aspect: "Second policy with the same policy_number within one insurer -> 409 ERR_DUPLICATE_POLICY_NUMBER."
        test_recipe:
          setup: ["Insurer + insured + one policy CGL-DUP."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-DUP", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
          trigger:
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-DUP", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409, data.error_id == ERR_DUPLICATE_POLICY_NUMBER"

      - name: cross_insurer_insured_reference_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Policy.fields.insured_id
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "A policy on insurer A referencing an insured belonging to insurer B -> 422 ERR_REFERENCE_NOT_FOUND (cross-insurer references rejected)."
        test_recipe:
          setup: ["Two insurers A and B; insured belongs to B."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Insurer A", naic_code: "11111" }
              as: InsurerAdmin
              captures: { ins_a: $.data.id }
            - call: "POST /insurers"
              payload: { name: "Insurer B", naic_code: "22222" }
              as: InsurerAdmin
              captures: { ins_b: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_b}", legal_name: "B Co", fein: "22-2222222", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_b: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { insurer_id: "${ins_a}", insured_id: "${insured_b}", policy_number: "CGL-X01", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 422, data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: endorsement_scope_computed_from_form_number
        claim_type: Computed Fields
        grounds:
          - entities.AdditionalInsuredEndorsement.fields.scope
          - entities.AdditionalInsuredEndorsement.fields.form_number
        distinguishing_aspect: "form_number CG2037 -> scope COMPLETED_OPS (computed, not client-supplied)."
        test_recipe:
          setup: ["IN_FORCE OCCURRENCE policy + holder."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /certificate-holders"
              payload: { insurer_id: "${ins_id}", holder_name: "Landlord LLC", address: "1 Main St" }
              as: Underwriter
              captures: { holder_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C03", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /endorsements"
              payload: { policy_id: "${pol_id}", certificate_holder_id: "${holder_id}", form_number: "CG2037", ai_effective_date: "2026-02-01T00:00:00.000Z" }
              as: Underwriter
              captures: { endo_id: $.data.id, sc: $.data.scope }
          assert:
            - "AdditionalInsuredEndorsement.${endo_id}.scope == COMPLETED_OPS"

      - name: claim_aggregate_bucket_computed_from_loss_type
        claim_type: Computed Fields
        grounds:
          - entities.Claim.fields.aggregate_bucket
          - entities.Claim.fields.loss_type
        distinguishing_aspect: "loss_type PRODUCTS_COMPLETED_OPS -> aggregate_bucket PRODUCTS; BODILY_INJURY -> GENERAL (computed at create)."
        test_recipe:
          setup: ["IN_FORCE OCCURRENCE policy; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C04", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "Prod J", loss_type: "PRODUCTS_COMPLETED_OPS", occurrence_date: "2026-03-01T00:00:00.000Z", reported_date: "2026-03-02T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id, bucket: $.data.aggregate_bucket }
          assert:
            - "Claim.${claim_id}.aggregate_bucket == PRODUCTS"

      - name: claim_transaction_is_immutable_event
        claim_type: Immutability
        grounds:
          - entities.ClaimTransaction
        distinguishing_aspect: "ClaimTransaction has common_fields:false (no update/version): created via POST and read-only afterward; GET /claim-transactions/{id} returns id and created_at only as mutable-free."
        test_recipe:
          setup: ["IN_FORCE OCCURRENCE policy; clock 2026-06-01; a claim with one RESERVE_SET."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C05", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_name: "K", loss_type: "BODILY_INJURY", occurrence_date: "2026-03-01T00:00:00.000Z", reported_date: "2026-03-02T00:00:00.000Z" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/transactions"
              payload: { txn_type: "RESERVE_SET", amount_cents: 5000000 }
              as: ClaimsAdjuster
              captures: { txn_id: $.data.id }
          trigger:
            - call: "GET /claim-transactions/${txn_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { seq: $.data.posted_sequence }
          assert:
            - "ClaimTransaction.${txn_id}.posted_sequence == 1"
            - "ClaimTransaction.${txn_id}.amount_cents == 5000000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: bind_already_bound_policy_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Policy.DRAFT_to_BOUND
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling bind on a BOUND policy -> 409 ERR_INVALID_STATE (transitions are not idempotent)."
        test_recipe:
          setup: ["A BOUND (not yet activated) OCCURRENCE policy."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C06", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409, data.error_id == ERR_INVALID_STATE"
            - "Policy.${pol_id}.status == BOUND (unchanged)"

      - name: activate_before_effective_date_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Policy.BOUND_to_IN_FORCE
          - errors[ERR_POLICY_NOT_YET_EFFECTIVE]
        distinguishing_aspect: "Activate when Insurer.current_date < effective_date -> 409 ERR_POLICY_NOT_YET_EFFECTIVE. Policy effective 2026-06-01 while clock is default 2026-01-01."
        test_recipe:
          setup: ["BOUND OCCURRENCE policy with effective_date 2026-06-01; clock still default 2026-01-01."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C07", coverage_trigger: "OCCURRENCE", effective_date: "2026-06-01T00:00:00.000Z", expiration_date: "2027-06-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409, data.error_id == ERR_POLICY_NOT_YET_EFFECTIVE"
            - "Policy.${pol_id}.status == BOUND (unchanged)"

      - name: issue_certificate_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.CertificateOfInsurance.DRAFT_to_ISSUED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Issuing an already-ISSUED COI a second time -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["IN_FORCE OCCURRENCE policy; holder; an informational COI issued once."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /certificate-holders"
              payload: { insurer_id: "${ins_id}", holder_name: "Landlord LLC", address: "1 Main St" }
              as: Underwriter
              captures: { holder_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C08", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /certificates"
              payload: { policy_id: "${pol_id}", certificate_holder_id: "${holder_id}" }
              as: Underwriter
              captures: { coi_id: $.data.id }
            - call: "POST /certificates/${coi_id}/issue"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /certificates/${coi_id}/issue"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409, data.error_id == ERR_INVALID_STATE"
            - "CertificateOfInsurance.${coi_id}.status == ISSUED (unchanged)"

      - name: open_claims_block_in_force_cancel
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Policy.IN_FORCE_to_CANCELLED
          - errors[ERR_OPEN_CLAIMS_BLOCK_CANCEL]
        distinguishing_aspect: "Cancelling an IN_FORCE policy with a RESERVED (non-terminal) claim -> 409 ERR_OPEN_CLAIMS_BLOCK_CANCEL."
        test_recipe:
          setup: ["IN_FORCE OCCURRENCE policy; clock 2026-06-01; a claim with RESERVE_SET (RESERVED)."]
          setup_api_calls:
            - call: "POST /insurers"
              payload: { name: "Acme Mutual", naic_code: "12345" }
              as: InsurerAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /insureds"
              payload: { insurer_id: "${ins_id}", legal_name: "BuildCo LLC", fein: "11-1111111", primary_basis: "PAYROLL" }
              as: Underwriter
              captures: { insured_id: $.data.id }
            - call: "POST /policies"
              payload: { insurer_id: "${ins_id}", insured_id: "${insured_id}", policy_number: "CGL-C09", coverage_trigger: "OCCURRENCE", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z", each_occurrence_limit_cents: 100000000, general_aggregate_limit_cents: 200000000, products_aggregate_limit_cents: 100000000, premium_basis: "PAYROLL", rate_per_unit_cents: 300, minimum_premium_cents: 100000, estimated_exposure_units: 1000000 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /insurers/${ins_id}/clock"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: InsurerAdmin
            - call: "POST /claims"
