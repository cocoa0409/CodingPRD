      - name: err_appeal_window_closed_after_deadline
        claim_type: triggerable
        grounds: ["errors[ERR_APPEAL_WINDOW_CLOSED]", calculations.appeal_response_deadline, entities.UnderpaymentCase.fields.appeal_filing_deadline]
        distinguishing_aspect: "Temporal validation: payer appeal_deadline_days 45 -> case queued 2026-08-01 has filing deadline 2026-09-15; creating a level-1 appeal at 2026-09-16 is rejected ERR_APPEAL_WINDOW_CLOSED."
        test_recipe:
          setup: ["case UNDER_REVIEW (claim 200000, remittance 100000); clock advanced to 2026-09-16, past queued_date + 45"]
          setup_api_calls:
            - call: "POST /api/payers"
