  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_review_return_cycle
        grounds:
          - state_machines.Case.PENDING_REVIEW_to_INVESTIGATION
          - state_machines.Case.INVESTIGATION_to_PENDING_REVIEW
        distinguishing_aspect: |
          The Case entity cycles PENDING_REVIEW -> INVESTIGATION (adjudicate RETURN) ->
          PENDING_REVIEW (re-submit), a revision loop no linear pipeline can express.
        test_recipe:
          setup:
            - "A Case in PENDING_REVIEW (assigned, has evidence, submitted for review)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Cy Loop", ssn_last4: "5555", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "PUBLIC", allegation_summary: "Tip" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "INTERVIEW", description: "Neighbor statement" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
          trigger:
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "RETURN" }
              as: Supervisor
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
          assert:
            - "Case.${case_id}.status == PENDING_REVIEW"

      - name: hearing_fork_ipv_branch
        grounds:
          - state_machines.Hearing.HELD_to_DECIDED_IPV
          - state_machines.Hearing.HELD_to_DECIDED_NO_IPV
          - state_machines.Hearing.HELD_to_DISMISSED
        distinguishing_aspect: |
          The Hearing entity forks from HELD into {DECIDED_IPV, DECIDED_NO_IPV, DISMISSED};
          the IPV branch alone imposes the linked Disqualification (divergent side effects).
        test_recipe:
          setup:
            - "A HELD Hearing on an ADH_REFERRED Disqualification of a SUBSTANTIATED case (investigator inv-1)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Del Fork", ssn_last4: "6666", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "HOTLINE", allegation_summary: "Fraud ring" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "DOCUMENT", description: "Falsified app" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE" }
              as: Supervisor
            - call: "POST /fraud-recovery/disqualifications"
              payload: { case_id: "${case_id}" }
              as: Investigator
              captures: { disq_id: $.data.id }
            - call: "POST /fraud-recovery/disqualifications/${disq_id}/refer-adh"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/hearings"
              payload: { disqualification_id: "${disq_id}", scheduled_date: "2026-05-15T09:00:00Z" }
              as: Adjudicator
              captures: { hearing_id: $.data.id }
            - call: "POST /fraud-recovery/hearings/${hearing_id}/hold"
              payload: {}
              as: Adjudicator
              as_user_id: "adj-1"
          trigger:
            - call: "POST /fraud-recovery/hearings/${hearing_id}/decide"
              payload: { outcome: "IPV" }
              as: Adjudicator
              as_user_id: "adj-1"
          assert:
            - "Hearing.${hearing_id}.status == DECIDED_IPV"
            - "Hearing.${hearing_id}.outcome == IPV"
            - "Disqualification.${disq_id}.status == IMPOSED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: hearing_ipv_impose_reclassify_recoup_depth3
        grounds:
          - state_machines.Hearing.HELD_to_DECIDED_IPV
          - state_machines.Disqualification.ADH_REFERRED_to_IMPOSED
          - entities.Subject.fields.prior_ipv_count
          - entities.Overpayment.fields.claim_type
          - entities.RecoveryPlan.fields.monthly_recoupment_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by hearing decide=IPV: Disqualification -> IMPOSED (hop1)
          causes Overpayment.claim_type -> IPV (hop2) which causes RecoveryPlan
          monthly_recoupment_cents to recompute from 1940 (IHE) to 3880 (IPV) (hop3).
        test_recipe:
          setup:
            - "A SUBSTANTIATED case whose IHE Overpayment (final 45050) is IN_RECOVERY under an ACTIVE RECOUPMENT plan (recoupment 1940 at IHE rate), with an ADH_REFERRED Disqualification and a HELD Hearing (adjudicator adj-1 != investigator inv-1)."
