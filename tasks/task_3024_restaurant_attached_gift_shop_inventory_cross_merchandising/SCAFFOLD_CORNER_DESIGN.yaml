              captures: { buckets: $.data.liquidation_bucket_units, blended: $.data.liquidation_blended_cents }
          assert:
            - "ClearanceSchedule.${cs_id}.liquidation_bucket_units == [3] — floor(3*0.40) == 1 admits the first bucket, floor(3*0.30) == 0 admits no second bucket, and the residual 2 units spill into the same last-tier bucket, collapsing the tuple to a single entry"
            - "unit_value is min(500, 1300) == 500, so the only bucket price is round_half_up(500*0.90) == 450"
            - "ClearanceSchedule.${cs_id}.liquidation_blended_cents == 450, identical to the single bucket price"
            - "the three-unit case produces no discount ladder at all, the opposite outcome from the five-unit case on the same formula"
            - "ClearanceSchedule.${cs_id}.liquidation_price_cents == 450, the first bucket's price"

      - name: conversion_index_pins_to_zero_when_no_shopper_entered_the_waiting_area
        claim_type: Correct Result
        grounds:
          - calculations.derive_waiting_area_conversion_index
          - entities.StoreDay.fields.waiting_area_conversion_index_bps
        distinguishing_aspect: "With a zero waiting-area shopper count the raw conversion rate is still defined because the denominator carries a plus-one, and with no retail sales the tip share pins to zero — so the index is 0 without any divide-by-zero."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN with 142 guests, no waiting-area traffic at all, and no receipt rung on it, so every derived metric reads zero."
          setup_api_calls:
            - *c_clock
            - *c_brand
            - *c_loc
            - *c_day_open
          trigger:
            - call: "POST /retail-ops/store-days/${day_id}/guest-counts"
              payload: { expected_store_day_version: "${day_v}", restaurant_guest_count: 142, restaurant_sales_cents: 1420000, waiting_area_shopper_count: 0, waiting_area_converted_count: 0 }
              as: BoutiqueManager
              captures: { idx: $.data.waiting_area_conversion_index_bps }
          assert:
            - "StoreDay.${day_id}.waiting_area_conversion_index_bps == 0"
            - "the raw rate is round_half_up(0 * 10000 / (0 + 1)) == 0 and the decay multiplier is 1.0 because retail_transaction_count is 0"
            - "the tip share is 0 because StoreDay.retail_sales_cents is 0, so the weighted sum round_half_up((6000*0 + 4000*0) / 10000) is 0"
            - "no divide-by-zero error is raised and the response status is 200"

      - name: conversion_index_decay_saturates_at_five_retail_transactions
        claim_type: decay_function
        grounds:
          - calculations.derive_waiting_area_conversion_index
          - entities.StoreDay.fields.retail_transaction_count
        distinguishing_aspect: "The per-transaction dilutive decay is ten percent each and is capped at fifty percent, so a day with five transactions decays its raw rate by half and a sixth transaction changes nothing."
        test_recipe:
          setup:
            - "Logical clock 2026-09-21T00:00:00Z. StoreDay 2026-09-21 is OPEN with 30 waiting-area shoppers, 15 converters, and six DRAFT retail receipts already recorded."
          setup_api_calls:
            - *c_clock
