  - name: posting_a_reconciliation_before_delivery_returns_invalid_cycle_state
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=47]
    - errors[ERR_INVALID_CYCLE_STATE]
    - state_machines.DropReconciliation.BALANCED_to_POSTED
    distinguishing_aspect: Nothing stops a drop's ledger being drafted and balanced while the cycle is only CONSOLIDATED, so rung 47 is the single check that keeps a posting from preceding delivery - and it fires after the reconciliation-state rung at 21 has already passed.
    test_recipe:
      setup:
