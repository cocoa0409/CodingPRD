# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Enumerates every testable claim of SCAFFOLD.yaml §1.1-§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ============================================================== entities
  - section: entities
    instances:
      - name: create_property_applies_defaults
        claim_type: defaults
        grounds: [entities.Property.fields.timezone, entities.Property.fields.posture, entities.Property.fields.open_bed_bug_case_count]
        distinguishing_aspect: "Omitting timezone yields default America/Los_Angeles; computed posture starts STANDARD; open_bed_bug_case_count 0; version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Default Hall", address: "1 Default Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id", tz: "$.data.timezone", posture: "$.data.posture", cnt: "$.data.open_bed_bug_case_count", ver: "$.data.version" } }
          trigger: []
          assert:
            - "timezone == America/Los_Angeles (default applied)"
            - "posture == STANDARD and open_bed_bug_case_count == 0 and version == 1"
      - name: create_unit_missing_required_returns_invalid_request
        claim_type: violation_to_error
        grounds: [entities.Unit.fields.floor, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field floor on unit creation -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["property exists"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Req Hall", address: "2 Req Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: get_nonexistent_unit_returns_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> 404 ERR_NOT_FOUND; error envelope carries meta.api_request_id, response_type error, data.error_id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pest/units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"
            - "envelope: response_type == error and data.error_id present under the standard error shape of §1.0"
      - name: create_unit_pest_flag_input_ignored
        claim_type: computed_field
        grounds: [entities.Unit.fields.pest_flag]
        distinguishing_aspect: "Client-supplied pest_flag is ignored (computed field): a fresh unit always reads CLEAR."
        test_recipe:
          setup: ["property exists"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Comp Hall", address: "3 Comp Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1, pest_flag: "INFESTED" }, as: ProgramAdmin, captures: { flag: "$.data.pest_flag" } }
          assert:
            - "pest_flag == CLEAR (client input INFESTED ignored)"
      - name: create_contract_invalid_enum_returns_invalid_request
        claim_type: type_constraint
        grounds: [entities.ServiceContract.fields.scope_pest_types, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Unknown enum member FLEAS in scope_pest_types -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["property exists"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Enum Hall", address: "4 Enum Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["FLEAS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: fk_reverse_reachability_children_from_parent
        claim_type: parent_relationship
        grounds: [entities.ServiceContract.fields.property_id, entities.Lease.fields.unit_id]
        distinguishing_aspect: "Every FK is traversable parent -> children: contracts and leases appear under their parents' list endpoints."
        test_recipe:
          setup: ["property with one contract; unit 101 with one lease"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "FK Hall", address: "5 FK Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 50000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
          trigger:
            - { call: "GET /pest/properties/${prop_id}/contracts", payload: {}, as: ProgramAdmin, captures: { c0: "$.data[0].id" } }
            - { call: "GET /pest/units/${unit_id}/leases", payload: {}, as: PropertyManager, captures: { l0: "$.data[0].id" } }
          assert:
            - "GET /pest/properties/${prop_id}/contracts returns exactly [${contract_id}]"
            - "GET /pest/units/${unit_id}/leases returns exactly [${lease_id}]"

  # ============================================================== state_machines
  - section: state_machines
    instances:
      - name: terminated_contract_rejects_suspend
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceContract, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "TERMINATED is terminal: suspend afterwards -> ERR_ALREADY_TERMINAL 409."
        test_recipe:
          setup: ["property with ACTIVATED-then-TERMINATED contract"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Term Hall", address: "6 Term Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/contracts/${contract_id}/terminate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /pest/contracts/${contract_id}/suspend", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL with HTTP 409"
      - name: treatment_complete_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Treatment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete requires PREP_VERIFIED; from SCHEDULED the transition is undefined -> ERR_INVALID_STATE (not a skip-ahead)."
        test_recipe:
          setup: ["SCHEDULED treatment on unit 101"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Skip Hall", address: "7 Skip Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/treatments/${tr_id}/complete", payload: { actual_minutes: 60 }, as: Technician, as_user_id: "${tech_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
      - name: inspection_double_complete_returns_already_terminal
        claim_type: idempotency
        grounds: [state_machines.Inspection, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Completing an already-COMPLETED inspection -> ERR_ALREADY_TERMINAL; the first completion's severity/side effects are not reapplied."
        test_recipe:
          setup: ["COMPLETED negative ROUTINE inspection on unit 101"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Twice Hall", address: "8 Twice Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "ROACHES", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { insp_id: "$.data.id" } }
            - { call: "POST /pest/inspections/${insp_id}/complete", payload: { live_sightings: 0, evidence_count: 0, bed_bug_positive: false }, as: Technician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /pest/inspections/${insp_id}/complete", payload: { live_sightings: 5, evidence_count: 5, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL with HTTP 409; no BedBugCase is created by the rejected second completion"
      - name: chargeback_dispute_from_billed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Chargeback, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "dispute is defined only from ASSESSED; a BILLED chargeback rejects dispute with ERR_INVALID_STATE even inside the 14-day window."
        test_recipe:
          setup: ["BILLED NON_COMPLIANCE_FEE chargeback (final 16125) on a lease"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Billed Hall", address: "9 Billed Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/leases/${lease_id}/chargebacks", payload: { kind: "NON_COMPLIANCE_FEE" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb_id: "$.data.id" } }
            - { call: "POST /pest/chargebacks/${cb_id}/bill", payload: {}, as: BillingClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /pest/chargebacks/${cb_id}/dispute", payload: { reason: "too late to dispute a bill" }, as: Resident, as_user_id: "${res_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
      - name: evaluate_clearance_from_open_returns_case_not_monitoring
        claim_type: precondition_enforcement
        grounds: [state_machines.BedBugCase, "errors[ERR_CASE_NOT_MONITORING]"]
        distinguishing_aspect: "evaluate-clearance from OPEN (case never treated) -> ERR_CASE_NOT_MONITORING."
        test_recipe:
          setup: ["BedBugCase OPEN on unit 101 (positive inspection just completed)"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Open Case Hall", address: "10 Open Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["BED_BUGS"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "BED_BUGS", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { insp_id: "$.data.id" } }
            - { call: "POST /pest/inspections/${insp_id}/complete", payload: { live_sightings: 10, evidence_count: 0, bed_bug_positive: true }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /pest/units/${unit_id}/bed-bug-cases", payload: {}, as: PropertyManager, captures: { case_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /pest/bed-bug-cases/${case_id}/evaluate-clearance", payload: {}, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CASE_NOT_MONITORING with HTTP 409"
      - name: claim_packet_finalize_twice_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ClaimPacket, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "FINALIZED is terminal: a second finalize -> ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["claim packet with zero references, already FINALIZED"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Packet Hall", address: "11 Packet Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/claim-packets", payload: { claim_reference: "HC-1", references: [] }, as: ComplianceOfficer, captures: { pkt_id: "$.data.id" } }
            - { call: "POST /pest/claim-packets/${pkt_id}/finalize", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /pest/claim-packets/${pkt_id}/finalize", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL with HTTP 409"
      - name: no_access_strikes_trigger_auto_chargeback
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.SCHEDULED_to_NO_ACCESS, entities.Unit.fields.no_access_strikes, calculations.lease_balance]
        distinguishing_aspect: "Second NO_ACCESS resets strikes to 0 and auto-creates a NON_COMPLIANCE_FEE chargeback (16125); first NO_ACCESS leaves strikes at 1 with no chargeback."
        test_recipe:
          setup: ["unit 101 with lease (addendum signed, cap 100000) + technician; two SCHEDULED ROUTINE inspections"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Strike Hall", address: "12 Strike Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "ROACHES", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { i1: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "ROACHES", scheduled_for: "2026-08-06T09:00:00Z" }, as: PropertyManager, captures: { i2: "$.data.id" } }
            - { call: "POST /pest/inspections/${i1}/no-access", payload: {}, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /pest/units/${unit_id}", payload: {}, as: PropertyManager, captures: { strikes1: "$.data.no_access_strikes" } }
          trigger:
            - { call: "POST /pest/inspections/${i2}/no-access", payload: {}, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /pest/units/${unit_id}", payload: {}, as: PropertyManager, captures: { strikes2: "$.data.no_access_strikes" } }
            - { call: "GET /pest/leases/${lease_id}", payload: {}, as: BillingClerk, captures: { bal: "$.data.outstanding_balance_cents" } }
          assert:
            - "after first NO_ACCESS: no_access_strikes == 1 and no chargeback exists"
            - "after second NO_ACCESS: no_access_strikes == 0 (reset) and Lease balance == 16125 (auto NON_COMPLIANCE_FEE)"

  # ============================================================== calculations
  - section: calculations
    instances:
      - name: severity_evidence_axis_threshold
        claim_type: correct_result
        grounds: [calculations.severity_classification]
        distinguishing_aspect: "The evidence_count axis independently drives classification: evidence 20 -> SEVERE, 19 -> MODERATE (live_sightings 0 both times)."
        test_recipe:
          setup: ["property with ACTIVE contract (scope ROACHES), unit 101, technician, two ROUTINE inspections"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Ev Hall", address: "13 Ev Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "ROACHES", scheduled_for: "2026-08-05T09:00:00Z" }, as: PropertyManager, captures: { iA: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/inspections", payload: { technician_id: "${tech_id}", kind: "ROUTINE", pest_type: "ROACHES", scheduled_for: "2026-08-06T09:00:00Z" }, as: PropertyManager, captures: { iB: "$.data.id" } }
          trigger:
            - { call: "POST /pest/inspections/${iA}/complete", payload: { live_sightings: 0, evidence_count: 20, bed_bug_positive: false }, as: Technician, as_user_id: "${tech_id}", captures: { sevA: "$.data.severity" } }
            - { call: "POST /pest/inspections/${iB}/complete", payload: { live_sightings: 0, evidence_count: 19, bed_bug_positive: false }, as: Technician, as_user_id: "${tech_id}", captures: { sevB: "$.data.severity" } }
          assert:
            - "inspection A severity == SEVERE (evidence_count == 20 hits >= 20)"
            - "inspection B severity == MODERATE (19 below threshold, above 8)"
      - name: posture_elevated_at_exactly_two_cases
        claim_type: correct_result
        grounds: [calculations.exposure_posture]
        distinguishing_aspect: "Posture boundary below the RESTRICTED edge: exactly 2 open cases -> ELEVATED (not RESTRICTED); the >= 3 boundary is exercised by lease_creation_gated_by_property_posture in §1.8."
        test_recipe:
          setup: ["property with ACTIVE contract (scope BED_BUGS); units 101 and 103 (non-adjacent stacks 1 and 3 so no INITIAL cross-creation complicates counts... they are stack delta 2 apart, same floor: not adjacent); positive inspections completed on both"]
          setup_api_calls:
