scenario: "749. Time-Bank & Volunteer-Hour Exchange: member & skill/offer-request, hour-credit ledger & exchange, matching & coordination, group/project event, trust/verification, balance & redemption, impact reporting, dispute"
domain_name: "time-bank-exchange"
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (Member, SkillOffer, SkillRequest, Exchange, LedgerEntry,
  # Redemption, VerificationCredential, GroupProject, ProjectShift,
  # ShiftAssignment, Dispute, ImpactReport) linked via foreign keys; no
  # nesting deeper than /parent-collection/{id}/action.

  state_machine_shape: cyclic
  # Exchange has DELIVERED↔DISPUTED↔DELIVERED cycle via dispute-resolve.
  # VerificationCredential has SUBMITTED→REVISION_REQUESTED→SUBMITTED cycle.
  # GroupProject is compound (state derived from ProjectShift statuses).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: peer_roles
  # Member acts on own resources; VerifierMember has peer verify power on
  # OTHER members' credentials; ProjectOrganizer creates GroupProjects;
  # PlatformAdmin operates the clock, resolves disputes, files impact reports.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique member email."
        constraints: "unique across active members"
      - name: display_name
        type: string
        source: input
        description: "Public display name."
      - name: home_neighborhood
        type: string
        source: input
        description: "Neighborhood code (e.g., 'NW-01')."
      - name: trust_tier
        type: enum
        source: computed
        description: "Derived from verified_credential_count and completed_exchange_count."
        default: "UNVERIFIED"
        constraints: "one of {UNVERIFIED, BASIC, TRUSTED, ANCHOR}"
      - name: verified_credential_count
        type: integer
        source: computed
        description: "Count of VerificationCredential rows for this member with status=VERIFIED. Recomputed on every VerificationCredential.status write; the Member.version bump on this recompute is what OCC on the ledger read observes."
        default: 0
      - name: completed_exchange_count
        type: integer
        source: computed
        description: "Count of Exchange rows where provider_member_id=this member and status=SETTLED."
        default: 0
      - name: chronological_balance_minutes
        type: integer
        source: computed
        description: "Sum of LedgerEntry.delta_minutes for this member's rows, ordered by (posted_at ASC, created_at ASC), with the CHRONOLOGICAL algorithm (§1.3 chronological_balance). Recomputed on every LedgerEntry create for this member."
        default: 0
      - name: forward_looking_balance_minutes
        type: integer
        source: computed
        description: "chronological_balance_minutes minus sum of Exchange.committed_minutes for exchanges where requester_member_id=this member and status ∈ {SCHEDULED, DELIVERED}, per the FORWARD_LOOKING algorithm (§1.3 forward_looking_balance)."
        default: 0
      - name: lifetime_earned_minutes
        type: integer
        source: computed
        description: "Sum of positive LedgerEntry.delta_minutes with entry_kind=EARNED for this member."
        default: 0
      - name: lifetime_redeemed_minutes
        type: integer
        source: computed
        description: "Sum of |LedgerEntry.delta_minutes| where entry_kind=REDEMPTION for this member."
        default: 0
      - name: no_show_strikes
        type: integer
        source: computed
        description: "Count of ShiftAssignment rows for this member with status=NO_SHOW in the last 90 days per §1.3 no_show_strikes."
        default: 0
      - name: is_suspended
        type: boolean
        source: computed
        description: "True iff no_show_strikes >= 3 (per §1.4 priority 7 gate). Setting to true is a cascading side effect of the third NO_SHOW."
        default: false
    constraints: "created with default trust_tier=UNVERIFIED and all balance/counter fields at 0."

  - name: SkillOffer
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the offering member. Ownership check: acting Member.id MUST equal this."
      - name: skill_code
        type: string
        source: input
        description: "Skill taxonomy code (e.g., 'GARDENING', 'TUTORING_MATH')."
        constraints: "must be one of the platform's declared skill_codes"
      - name: title
        type: string
        source: input
        description: "Short public title."
      - name: minutes_per_session
        type: integer
        source: input
        description: "Standard session length in minutes; MUST be a multiple of 15 in [15, 480]."
        constraints: "15 <= x <= 480, x % 15 == 0"
      - name: required_trust_tier
        type: enum
        source: input
        description: "Minimum trust_tier a requester must hold to book. One of {UNVERIFIED, BASIC, TRUSTED, ANCHOR}."
        default: "UNVERIFIED"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status; state machine defined in §1.2."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, PAUSED, ARCHIVED}"

  - name: SkillRequest
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the requesting member. Ownership check: acting Member.id MUST equal this."
      - name: skill_code
        type: string
        source: input
        description: "Skill taxonomy code sought."
      - name: needed_minutes
        type: integer
        source: input
        description: "Total minutes needed; multiple of 15 in [15, 480]."
      - name: earliest_start_utc
        type: datetime
        source: input
        description: "Earliest acceptable start (ISO8601 UTC)."
      - name: latest_start_utc
        type: datetime
        source: input
        description: "Latest acceptable start; must be > earliest_start_utc."
      - name: status
        type: enum
        source: system
        description: "Lifecycle; §1.2 SkillRequest machine."
        default: "OPEN"
        constraints: "one of {OPEN, MATCHED, EXPIRED, CANCELLED}"

  - name: Exchange
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> SkillOffer.id."
      - name: request_id
        type: string
        source: input
        description: "FK -> SkillRequest.id."
      - name: provider_member_id
        type: string
        source: system
        description: "FK -> Member.id; copied from SkillOffer.member_id at creation."
      - name: requester_member_id
        type: string
        source: system
        description: "FK -> Member.id; copied from SkillRequest.member_id at creation."
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Agreed session start (ISO8601 UTC); must lie within [request.earliest_start_utc, request.latest_start_utc]."
      - name: committed_minutes
        type: integer
        source: input
        description: "Minutes committed for this exchange; MUST equal offer.minutes_per_session."
      - name: status
        type: enum
        source: system
        description: "Lifecycle; §1.2 Exchange machine."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, DELIVERED, DISPUTED, SETTLED, CANCELLED}"
      - name: settled_at_utc
        type: datetime
        source: system
        description: "Wall-clock time of settlement (from logical clock)."
        default: null

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the account being credited/debited."
      - name: exchange_id
        type: string
        source: input
        description: "FK -> Exchange.id (nullable for REDEMPTION and ADMIN_ADJUSTMENT entries)."
        default: null
      - name: redemption_id
        type: string
        source: input
        description: "FK -> Redemption.id (only present for REDEMPTION entries)."
        default: null
      - name: entry_kind
        type: enum
        source: input
        description: "Kind of ledger event."
        constraints: "one of {EARNED, SPENT, REDEMPTION, ADMIN_ADJUSTMENT, DISPUTE_REVERSAL}"
      - name: delta_minutes
        type: integer
        source: input
        description: "Signed; positive for EARNED and positive ADMIN_ADJUSTMENT, negative for SPENT/REDEMPTION/DISPUTE_REVERSAL."
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock time when this entry becomes visible to the CHRONOLOGICAL balance algorithm."
      - name: memo
        type: string
        source: input
        description: "Free-text memo; required for ADMIN_ADJUSTMENT, else optional."
        default: null

  - name: Redemption
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; redeeming member. Ownership check: acting Member.id MUST equal this."
      - name: reward_code
        type: string
        source: input
        description: "Catalog code (e.g., 'FARMERS_MARKET_15', 'BUS_PASS_60')."
      - name: minutes_cost
        type: integer
        source: system
        description: "Copied from reward catalog; positive integer."
      - name: expected_member_version
        type: integer
        source: input
        description: "OCC — the Member.version the client last observed. Rejected with 412 if it disagrees with the current Member.version at check time (§1.2.1)."
      - name: status
        type: enum
        source: system
        description: "Lifecycle; §1.2 Redemption machine."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, FULFILLED, VOIDED}"
      - name: fulfilled_at_utc
        type: datetime
        source: system
        description: "Logical-clock time of fulfillment."
        default: null

  - name: VerificationCredential
    parent: null
    common_fields: true
    fields:
      - name: subject_member_id
        type: string
        source: input
        description: "FK -> Member.id; the credential's subject."
      - name: verifier_member_id
        type: string
        source: system
        description: "FK -> Member.id; the peer verifier (populated on assignment)."
        default: null
      - name: credential_type
        type: enum
        source: input
        description: "Kind of credential."
        constraints: "one of {ID_CHECK, SKILL_ATTEST, REFERENCE_ATTEST}"
      - name: skill_code
        type: string
        source: input
        description: "Present iff credential_type=SKILL_ATTEST."
        default: null
      - name: evidence_url
        type: string
        source: input
        description: "URL to evidence document."
      - name: status
        type: enum
        source: system
        description: "Lifecycle; §1.2 VerificationCredential machine."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, REVISION_REQUESTED, VERIFIED, REJECTED}"
      - name: revision_round
        type: integer
        source: computed
        description: "Count of REVISION_REQUESTED transitions applied to this credential; caps at 2 per §1.2."
        default: 0

  - name: GroupProject
    parent: null
    common_fields: true
    fields:
      - name: organizer_member_id
        type: string
        source: input
        description: "FK -> Member.id; the ProjectOrganizer identity."
      - name: title
        type: string
        source: input
        description: "Project title."
      - name: window_start_utc
        type: datetime
        source: input
        description: "Earliest shift start allowed."
      - name: window_end_utc
        type: datetime
        source: input
        description: "Latest shift end allowed; must be > window_start_utc."
      - name: minimum_completed_ratio
        type: number
        source: input
        description: "Decimal in (0, 1]; §1.3 project_completion_ratio threshold for auto-transition to COMPLETED. Two decimal places."
        default: 0.60
      - name: aggregate_state
        type: enum
        source: computed
        description: "Compound state derived from ProjectShift statuses per §1.3 project_aggregate_state."
        default: "PLANNING"
        constraints: "one of {PLANNING, OPEN, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: total_committed_minutes
        type: integer
        source: computed
        description: "Sum of ProjectShift.duration_minutes across shifts with status=FILLED. Recomputed on every ShiftAssignment write."
        default: 0

  - name: ProjectShift
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> GroupProject.id."
      - name: role_label
        type: string
        source: input
        description: "Role label (e.g., 'PACKER', 'DRIVER')."
      - name: shift_start_utc
        type: datetime
        source: input
        description: "Shift start (must lie in [project.window_start_utc, project.window_end_utc])."
      - name: duration_minutes
        type: integer
        source: input
        description: "Duration; multiple of 15 in [15, 480]."
      - name: capacity
        type: integer
        source: input
        description: "Max concurrent assignments; positive integer."
      - name: status
        type: enum
        source: computed
        description: "Derived from ShiftAssignment counts per §1.2 ProjectShift; one of {OPEN, FILLED, COMPLETED, CANCELLED}."
        default: "OPEN"

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - name: shift_id
        type: string
        source: input
        description: "FK -> ProjectShift.id."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id."
      - name: status
        type: enum
        source: system
        description: "Lifecycle; §1.2 ShiftAssignment machine."
        default: "CONFIRMED"
        constraints: "one of {CONFIRMED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED}"
      - name: check_in_utc
        type: datetime
        source: system
        description: "Logical-clock time of check-in."
        default: null

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: exchange_id
        type: string
        source: input
        description: "FK -> Exchange.id."
      - name: raised_by_member_id
        type: string
        source: input
        description: "FK -> Member.id; must equal exchange.requester_member_id OR exchange.provider_member_id."
      - name: reason_code
        type: enum
        source: input
        description: "Dispute reason."
        constraints: "one of {NO_SHOW, INCOMPLETE_SERVICE, WRONG_DURATION, OTHER}"
      - name: claimed_delta_minutes
        type: integer
        source: input
        description: "Number of minutes the raiser claims should be adjusted; MUST be a positive multiple of 15."
      - name: status
        type: enum
        source: system
        description: "Lifecycle; §1.2 Dispute machine."
        default: "OPEN"
        constraints: "one of {OPEN, RESOLVED_UPHELD, RESOLVED_REJECTED, WITHDRAWN}"
      - name: admin_notes
        type: string
        source: input
        description: "Free text set at resolve; required on RESOLVED_UPHELD."
        default: null

  - name: ImpactReport
    parent: null
    common_fields: true
    fields:
      - name: report_month
        type: string
        source: input
        description: "YYYY-MM string identifying the reporting month."
      - name: total_hours_exchanged
        type: number
        source: system
        description: "Sum of Exchange.committed_minutes / 60 for exchanges with settled_at_utc inside the month. Two decimal places, round half-up."
      - name: unique_active_members
        type: integer
        source: system
        description: "Distinct member_ids on LedgerEntry rows with posted_at inside the month."
      - name: top_skill_code
        type: string
        source: system
        description: "The skill_code appearing on the most SETTLED Exchanges in the month; §1.3 report_top_skill defines tie-break."
        default: null
      - name: generated_by_user_id
        type: string
        source: system
        description: "The X-User-ID that generated the report (audit only; opaque)."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Exchange
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /exchanges/{id}/mark-delivered"
        actor: Member
        preconditions:
          - "acting Member.id == exchange.provider_member_id"
          - "logical_clock_utc >= exchange.scheduled_start_utc"
          - "exchange.status == SCHEDULED"
        side_effects:
          - "exchange.status <- DELIVERED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /exchanges/{id}/cancel"
        actor: Member
        preconditions:
          - "acting Member.id ∈ {exchange.provider_member_id, exchange.requester_member_id}"
          - "logical_clock_utc < exchange.scheduled_start_utc"
        side_effects:
          - "exchange.status <- CANCELLED"
          - "SkillRequest.status transitions MATCHED -> OPEN"

      - from: DELIVERED
        to: SETTLED
        trigger: "POST /exchanges/{id}/settle"
        actor: Member
        preconditions:
          - "acting Member.id == exchange.requester_member_id"
          - "logical_clock_utc >= exchange.scheduled_start_utc + exchange.committed_minutes minutes"
          - "no OPEN Dispute row references this exchange"
        side_effects:
          - "exchange.status <- SETTLED"
          - "exchange.settled_at_utc <- logical_clock_utc"
          - "insert LedgerEntry (SPENT, delta=-exchange.committed_minutes) for requester"
          - "insert LedgerEntry (EARNED, delta=+exchange.committed_minutes) for provider"
          - "recompute Member.chronological_balance_minutes and Member.forward_looking_balance_minutes for BOTH members"
          - "recompute Member.completed_exchange_count for provider (this in turn triggers §1.3 trust_tier reclassification)"
          - "SkillRequest.status transitions MATCHED -> CLOSED via SkillRequest §1.2 auto-close"

      - from: DELIVERED
        to: DISPUTED
        trigger: "POST /disputes (Dispute created against this exchange)"
        actor: system
        preconditions:
          - "Dispute.exchange_id == this exchange.id"
          - "exchange.status == DELIVERED"
        side_effects:
          - "exchange.status <- DISPUTED"

      - from: DISPUTED
        to: DELIVERED
        trigger: "POST /disputes/{id}/resolve with outcome=REJECTED (Dispute §1.2)"
        actor: PlatformAdmin
        preconditions:
          - "Dispute.status transitions to RESOLVED_REJECTED"
        side_effects:
          - "exchange.status <- DELIVERED (settlement path resumes)"

      - from: DISPUTED
        to: SETTLED
        trigger: "POST /disputes/{id}/resolve with outcome=UPHELD (Dispute §1.2)"
        actor: PlatformAdmin
        preconditions:
          - "Dispute.status transitions to RESOLVED_UPHELD"
        side_effects:
          - "exchange.status <- SETTLED"
          - "exchange.settled_at_utc <- logical_clock_utc"
          - "insert LedgerEntry (SPENT, delta=-(exchange.committed_minutes - dispute.claimed_delta_minutes)) for requester"
          - "insert LedgerEntry (EARNED, delta=+(exchange.committed_minutes - dispute.claimed_delta_minutes)) for provider"
          - "insert LedgerEntry (DISPUTE_REVERSAL, delta=-dispute.claimed_delta_minutes) on the DEFICIENT party's account (the party opposite dispute.raised_by_member_id) — memo=dispute.id"
          - "recompute balances for BOTH members; recompute provider.completed_exchange_count and trust_tier"

  - entity: SkillRequest
    initial_state: OPEN
    terminal_states: [EXPIRED, CANCELLED, CLOSED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "POST /exchanges (Exchange created that references this request)"
        actor: system
        preconditions:
          - "SkillRequest.status == OPEN"
        side_effects:
          - "SkillRequest.status <- MATCHED"

      - from: MATCHED
        to: OPEN
        trigger: "POST /exchanges/{id}/cancel (Exchange for this request cancelled)"
        actor: system
        preconditions:
          - "SkillRequest.status == MATCHED"
        side_effects:
          - "SkillRequest.status <- OPEN"

      - from: MATCHED
        to: CLOSED
        trigger: "POST /exchanges/{id}/settle (auto)"
        actor: system
        preconditions:
          - "linked Exchange.status == SETTLED"
        side_effects:
          - "SkillRequest.status <- CLOSED"

      - from: OPEN
        to: EXPIRED
        trigger: "system_clock_advance past latest_start_utc"
        actor: system
        preconditions:
          - "logical_clock_utc > SkillRequest.latest_start_utc"
          - "SkillRequest.status == OPEN"
        side_effects:
          - "SkillRequest.status <- EXPIRED"
        note: "Evaluated lazily on every POST /_clock/set_current_utc call."

      - from: OPEN
        to: CANCELLED
        trigger: "POST /skill-requests/{id}/cancel"
        actor: Member
        preconditions:
          - "acting Member.id == request.member_id"
        side_effects:
          - "SkillRequest.status <- CANCELLED"

  - entity: VerificationCredential
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /credentials/{id}/request-revision"
        actor: Member
        preconditions:
          - "acting Member.id == credential.verifier_member_id"
          - "credential.revision_round < 2"
        side_effects:
          - "credential.status <- REVISION_REQUESTED"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /credentials/{id}/resubmit"
        actor: Member
        preconditions:
          - "acting Member.id == credential.subject_member_id"
          - "credential.revision_round < 2"
        side_effects:
          - "credential.status <- SUBMITTED"
          - "credential.revision_round <- revision_round + 1"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /credentials/{id}/verify"
        actor: Member
        preconditions:
          - "acting Member.id == credential.verifier_member_id"
          - "acting Member.trust_tier ∈ {TRUSTED, ANCHOR}"
          - "credential.subject_member_id != acting Member.id"
        side_effects:
          - "credential.status <- VERIFIED"
          - "subject_member.verified_credential_count += 1"
          - "recompute subject_member.trust_tier per §1.3 trust_tier"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /credentials/{id}/reject"
        actor: Member
        preconditions:
          - "acting Member.id == credential.verifier_member_id"
          - "acting Member.trust_tier ∈ {TRUSTED, ANCHOR}"
        side_effects:
          - "credential.status <- REJECTED"

      - from: REVISION_REQUESTED
        to: REJECTED
        trigger: "POST /credentials/{id}/reject"
        actor: Member
        preconditions:
          - "acting Member.id == credential.verifier_member_id"
        side_effects:
          - "credential.status <- REJECTED"

  - entity: GroupProject
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /group-projects/{id}/publish"
        actor: ProjectOrganizer
        preconditions:
          - "acting Member.id == project.organizer_member_id"
          - "at least one ProjectShift exists for this project"
          - "logical_clock_utc <= project.window_start_utc"
        side_effects:
          - "project.aggregate_state <- OPEN"

      - from: OPEN
        to: IN_PROGRESS
        trigger: "system_clock_advance reaches earliest_shift_start_utc"
        actor: system
        preconditions:
          - "logical_clock_utc >= min(ProjectShift.shift_start_utc for this project)"
        side_effects:
          - "project.aggregate_state <- IN_PROGRESS"
        note: "Evaluated lazily on every POST /_clock/set_current_utc call."

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system: last COMPLETED assignment posted (compound, §1.3 project_aggregate_state)"
        actor: system
        preconditions:
          - "share of ProjectShift.status=COMPLETED / total shift count >= project.minimum_completed_ratio (§1.3 project_completion_ratio)"
          - "logical_clock_utc > project.window_end_utc"
        side_effects:
          - "project.aggregate_state <- COMPLETED"

      - from: PLANNING
        to: CANCELLED
        trigger: "POST /group-projects/{id}/cancel"
        actor: ProjectOrganizer
        preconditions:
          - "acting Member.id == project.organizer_member_id"
          - "project.aggregate_state == PLANNING"
        side_effects:
          - "project.aggregate_state <- CANCELLED"
          - "cascade cancel every ProjectShift with status ∈ {OPEN, FILLED} to CANCELLED"
          - "cascade cancel every ShiftAssignment with status ∈ {CONFIRMED} to CANCELLED (via ProjectShift.cancel side effect)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /group-projects/{id}/cancel"
        actor: ProjectOrganizer
        preconditions:
          - "acting Member.id == project.organizer_member_id"
          - "logical_clock_utc < min(ProjectShift.shift_start_utc for this project)"
        side_effects:
          - "project.aggregate_state <- CANCELLED"
          - "cascade cancel every ProjectShift with status ∈ {OPEN, FILLED} to CANCELLED"

  - entity: ProjectShift
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "POST /shifts/{id}/assignments (assignment created that reaches capacity)"
        actor: system
        preconditions:
          - "count of ShiftAssignment where shift_id=this and status=CONFIRMED == shift.capacity"
        side_effects:
          - "shift.status <- FILLED"
          - "project.total_committed_minutes recomputed (bubble-up derived field)"

      - from: FILLED
        to: OPEN
        trigger: "DELETE /shifts/{id}/assignments/{aid} (assignment cancelled)"
        actor: system
        preconditions:
          - "count of ShiftAssignment where shift_id=this and status=CONFIRMED < shift.capacity"
        side_effects:
          - "shift.status <- OPEN"
          - "project.total_committed_minutes recomputed"

      - from: FILLED
        to: COMPLETED
        trigger: "system_clock_advance past shift_start_utc + duration_minutes AND all assignments COMPLETED-or-NO_SHOW"
        actor: system
        preconditions:
          - "logical_clock_utc >= shift.shift_start_utc + shift.duration_minutes minutes"
          - "every ShiftAssignment for this shift has status ∈ {COMPLETED, NO_SHOW, CANCELLED}"
          - "at least one ShiftAssignment has status=COMPLETED"
        side_effects:
          - "shift.status <- COMPLETED"
          - "for each COMPLETED assignment, insert LedgerEntry (EARNED, +shift.duration_minutes) for that member; recompute balances"

      - from: OPEN
        to: CANCELLED
        trigger: "cascade from GroupProject cancel"
        actor: system
        preconditions:
          - "parent project.aggregate_state == CANCELLED"
        side_effects:
          - "shift.status <- CANCELLED"

      - from: FILLED
        to: CANCELLED
        trigger: "cascade from GroupProject cancel"
        actor: system
        preconditions:
          - "parent project.aggregate_state == CANCELLED"
        side_effects:
          - "shift.status <- CANCELLED"
          - "cascade cancel every ShiftAssignment with status=CONFIRMED"

  - entity: ShiftAssignment
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /assignments/{id}/check-in"
        actor: Member
        preconditions:
          - "acting Member.id == assignment.member_id"
          - "logical_clock_utc >= shift.shift_start_utc"
          - "logical_clock_utc < shift.shift_start_utc + shift.duration_minutes minutes"
        side_effects:
          - "assignment.status <- CHECKED_IN"
          - "assignment.check_in_utc <- logical_clock_utc"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system_clock_advance past shift end (via /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "logical_clock_utc >= shift.shift_start_utc + shift.duration_minutes minutes"
        side_effects:
          - "assignment.status <- COMPLETED"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system_clock_advance past shift end without check-in"
        actor: system
        preconditions:
          - "logical_clock_utc >= shift.shift_start_utc + shift.duration_minutes minutes"
          - "assignment.check_in_utc IS NULL"
        side_effects:
          - "assignment.status <- NO_SHOW"
          - "recompute member.no_show_strikes"
          - "if member.no_show_strikes >= 3 after recompute: member.is_suspended <- true (cascading side effect)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "DELETE /shifts/{sid}/assignments/{id}"
        actor: Member
        preconditions:
          - "acting Member.id == assignment.member_id"
          - "logical_clock_utc < shift.shift_start_utc"
        side_effects:
          - "assignment.status <- CANCELLED"
          - "if shift previously FILLED, shift may transition FILLED -> OPEN"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_REJECTED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{id}/resolve with outcome=UPHELD"
        actor: PlatformAdmin
        preconditions:
          - "admin_notes non-empty on request"
        side_effects:
          - "dispute.status <- RESOLVED_UPHELD"
          - "Exchange transitions DISPUTED -> SETTLED with reduced credit (see Exchange §1.2)"

      - from: OPEN
        to: RESOLVED_REJECTED
        trigger: "POST /disputes/{id}/resolve with outcome=REJECTED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "dispute.status <- RESOLVED_REJECTED"
          - "Exchange transitions DISPUTED -> DELIVERED (settlement path resumes)"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Member
        preconditions:
          - "acting Member.id == dispute.raised_by_member_id"
        side_effects:
          - "dispute.status <- WITHDRAWN"
          - "Exchange transitions DISPUTED -> DELIVERED"

  - entity: Redemption
    initial_state: REQUESTED
    terminal_states: [FULFILLED, VOIDED]
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST /redemptions/{id}/fulfill"
        actor: PlatformAdmin
        preconditions:
          - "member.forward_looking_balance_minutes >= redemption.minutes_cost (RE-CHECKED at fulfillment)"
        side_effects:
          - "redemption.status <- FULFILLED"
          - "redemption.fulfilled_at_utc <- logical_clock_utc"
          - "insert LedgerEntry (REDEMPTION, delta=-redemption.minutes_cost) for member"
          - "recompute member.chronological_balance_minutes, forward_looking_balance_minutes, lifetime_redeemed_minutes"
          - "increments Member.version by 1"

      - from: REQUESTED
        to: VOIDED
        trigger: "POST /redemptions/{id}/void"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "redemption.status <- VOIDED"

  - entity: SkillOffer
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /skill-offers/{id}/pause"
        actor: Member
        preconditions: ["acting Member.id == offer.member_id"]
        side_effects: ["offer.status <- PAUSED"]

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /skill-offers/{id}/resume"
        actor: Member
        preconditions: ["acting Member.id == offer.member_id"]
        side_effects: ["offer.status <- ACTIVE"]

      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /skill-offers/{id}/archive"
        actor: Member
        preconditions: ["acting Member.id == offer.member_id"]
        side_effects: ["offer.status <- ARCHIVED"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: redemption-stale-member-version
    parent_entity: Member
    write_endpoint: "POST /redemptions"
    occ_field: "expected_member_version"
    description: |
      Creating a Redemption is guarded by OCC on the Member's version. Between
      the client's balance read and this create, cascading balance recomputes
      driven by Exchange settlement (§1.2 Exchange DELIVERED->SETTLED) or a
      VerificationCredential status flip may have already advanced
      Member.version. A create carrying a version older than the current one
      is rejected — the balance the client is spending against is stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: chronological_balance
    trigger: "recomputed on every LedgerEntry insert for the member; read by Member.chronological_balance_minutes"
    algorithm: chronological
    formula: |
      # ordered chronological replay
      entries = LedgerEntry where member_id = M
      sort key: (posted_at ASC, LedgerEntry.created_at ASC)   # id NEVER used as fallback
      running = 0
      for e in entries: running = running + e.delta_minutes
      return running
    input_set: "All LedgerEntry rows for member M; NO status filter (ledger is append-only)."
    constants: {}
    precision: "integer minutes, exact"

  - name: forward_looking_balance
    trigger: "recomputed on every LedgerEntry insert AND on every Exchange creation/cancellation for M"
    algorithm: forward_looking
    formula: |
      chrono = chronological_balance(M)
      pending = sum(Exchange.committed_minutes for e where
                    e.requester_member_id = M
                    AND e.status IN {SCHEDULED, DELIVERED})
      return chrono - pending
    input_set: "chronological ledger PLUS pending Exchange debits (SCHEDULED and DELIVERED requester obligations)."
    constants: {}
    precision: "integer minutes, exact"
    variants:
      - name: chronological_variant
        when: "impact reporting, historical audits, dispute reconstruction"
        difference: "Uses chronological_balance (no pending subtraction) — accepts the ledger as final at each posted_at."
      - name: forward_looking_variant
        when: "redemption authorization, exchange creation ceiling (§1.4 priority 8)"
        difference: "Deducts pending SCHEDULED+DELIVERED debits so a member cannot double-spend committed hours."

  - name: trust_tier
    trigger: "recomputed on VerificationCredential VERIFY transition and on Exchange DELIVERED->SETTLED (provider completed_exchange_count changes)"
    algorithm: threshold
    formula: |
      v = member.verified_credential_count
      c = member.completed_exchange_count
      # Evaluation order is pinned top-to-bottom; the FIRST branch matched wins.
      # No `id` fallback anywhere.
      if v >= 3 and c >= 20: return ANCHOR
      if v >= 2 and c >= 5:  return TRUSTED
      if v >= 1:             return BASIC
      return UNVERIFIED
    input_set: "Member.verified_credential_count and Member.completed_exchange_count as computed above."
    constants:
      ANCHOR_MIN_VERIFIED: 3
      ANCHOR_MIN_COMPLETED: 20
      TRUSTED_MIN_VERIFIED: 2
      TRUSTED_MIN_COMPLETED: 5
    precision: "exact integers; comparisons are `>=`"

  - name: no_show_strikes
    trigger: "recomputed on every ShiftAssignment status write; also lazy-recomputed inside GET /members/{id} whenever any ShiftAssignment row for M ages out of the 90-day window (evaluated against logical_clock_utc, NOT wall clock)"
    algorithm: aggregation
    formula: |
      cutoff = logical_clock_utc - 90 days
      strikes = count(ShiftAssignment a where
                     a.member_id = M
                     AND a.status = NO_SHOW
                     AND (shift.shift_start_utc + shift.duration_minutes minutes) >= cutoff)
      return strikes
    input_set: "All ShiftAssignment rows for M, filtered to a rolling 90-day window on shift-end time."
    constants:
      WINDOW_DAYS: 90
      SUSPENSION_THRESHOLD: 3   # boundary: `>= 3` triggers suspension per §1.4 priority 7

  - name: project_aggregate_state
    trigger: "recomputed on every ProjectShift status write AND on every /_clock/set_current_utc advance"
    algorithm: constraint_propagation
    formula: |
      # ordered evaluation — first match wins
      if project.aggregate_state = CANCELLED:                             return CANCELLED
      if project.aggregate_state = PLANNING and not_yet_published:        return PLANNING
      if logical_clock_utc > project.window_end_utc:
        r = shifts_with_status_COMPLETED / total_shifts_count             # §1.3 project_completion_ratio
        if r >= project.minimum_completed_ratio:                          return COMPLETED
        else:                                                             return CANCELLED
      if logical_clock_utc >= min(shift.shift_start_utc): return IN_PROGRESS
      return OPEN
    input_set: "All ProjectShift rows for the project (status and shift_start_utc); project.window_end_utc; logical_clock_utc; project.minimum_completed_ratio."
    constants: {}
    precision: "ratio computed as float64 division; comparison uses `>=`."

  - name: project_completion_ratio
    trigger: "invoked inside project_aggregate_state whenever logical_clock_utc > window_end_utc"
    algorithm: threshold
    formula: |
      total = count(ProjectShift where project_id = P)
      completed = count(ProjectShift where project_id = P AND status = COMPLETED)
      if total == 0: return 0.0
      # boundary — `>=` triggers, `<` cancels
      return completed / total
    input_set: "ProjectShift rows for project P."
    constants: {}
    precision: "float division; compared with `>=` to project.minimum_completed_ratio at 2 decimal places (round half-up before comparison)."

  - name: report_top_skill
    trigger: "computed inside POST /impact-reports at creation"
    algorithm: aggregation
    formula: |
      # candidate set: Exchange e where e.status=SETTLED AND settled_at_utc inside month M
      # count grouped by SkillOffer(offer_id).skill_code
      # ranking: count DESC
      # tie-break rule (pinned): among tied skill_codes, pick the one whose EARLIEST settled Exchange in the month
      #   has the earliest settled_at_utc; if still tied, the earlier LedgerEntry.posted_at wins; if still tied,
      #   pick the alphabetically smaller skill_code (ASCII).  `id` is NEVER used as fallback.
    input_set: "SETTLED exchanges whose settled_at_utc lies in [YYYY-MM-01T00:00:00Z, first day of next month)."
    constants: {}
    precision: "exact integer counts; comparisons on datetimes are inclusive-lower / exclusive-upper."

  - name: report_hours_exchanged
    trigger: "computed inside POST /impact-reports"
    algorithm: aggregation
    formula: |
      # order-independent sum, but rounding order matters:
      # per §1.3 constant SUM_ORDER=per_exchange_then_sum, we FIRST round each exchange's minutes/60 to 2dp,
      # THEN sum the rounded values, THEN round the final sum to 2dp round_half_up.
      total = 0
      for e in SETTLED exchanges in month:
        total = total + round(e.committed_minutes / 60, 2, round_half_up)
      return round(total, 2, round_half_up)
    input_set: "SETTLED exchanges whose settled_at_utc lies in [YYYY-MM-01T00:00:00Z, first day of next month)."
    constants:
      SUM_ORDER: "per_exchange_then_sum"    # pins the (b) nested-rounding order
    precision: "2 decimal places, round_half_up; rounding order pinned per SUM_ORDER."
    variants:
      - name: gross_hours_variant
        when: "final impact reporting; called via POST /impact-reports"
        difference: "Includes ALL SETTLED exchanges (including those whose settlement came from a dispute-upheld reduced credit). Uses the full exchange.committed_minutes value — NOT the reduced credit."
      - name: net_hours_variant
        when: "internal accounting audits; NOT surfaced via POST /impact-reports but pinned as the ledger-reconciliation cross-check"
        difference: "Sums only the EARNED LedgerEntry rows with posted_at in the month, which for dispute-upheld exchanges yields (committed_minutes - dispute.claimed_delta_minutes) — always ≤ gross_hours_variant when at least one dispute was upheld in the month."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and syntactically valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc and Anonymous endpoints"

  - priority: 2
    category: auth
    check: "acting role in endpoint.roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all authenticated endpoints"

  - priority: 3
    category: existence
    check: "every path-referenced resource exists (validated left-to-right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: state
    check: "target resource is in a state that permits this operation (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions in §1.2"

  - priority: 5
    category: state
    check: "OCC — for POST /redemptions, expected_member_version equals current Member.version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /redemptions"

  - priority: 6
    category: business_referential
    check: "requester and provider MUST be different members; acting member has ownership per §1.7 identity"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all Member-owned endpoints"

  - priority: 7
    category: business_safety
    check: "acting member is NOT suspended (member.no_show_strikes < 3)"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 403
    applies_to: "POST /exchanges, POST /shifts/{id}/assignments, POST /redemptions"

  - priority: 8
    category: business_fiscal
    check: "member.forward_looking_balance_minutes >= committed_minutes at POST /exchanges (requester side) AND >= minutes_cost at POST /redemptions"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /exchanges, POST /redemptions"

  - priority: 9
    category: business_temporal
    check: "temporal-overlap on ShiftAssignments — a member cannot hold two CONFIRMED-or-CHECKED_IN assignments whose [shift_start_utc, shift_start_utc+duration_minutes) intervals overlap (adjacency touching at endpoints is ALLOWED)"
    error_id: ERR_SHIFT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments"

  - priority: 10
    category: business_temporal
    check: "temporal-overlap on Exchanges — an exchange's [scheduled_start_utc, scheduled_start_utc+committed_minutes) interval, plus a 30-minute travel buffer on BOTH sides, cannot overlap another SCHEDULED-or-DELIVERED Exchange the same member participates in"
    error_id: ERR_EXCHANGE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /exchanges"

  - priority: 11
    category: business_constraint
    check: "requester's SkillRequest status == OPEN AND offer's SkillOffer status == ACTIVE at POST /exchanges"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /exchanges"

  - priority: 12
    category: business_constraint
    check: "trust-tier gate — requester.trust_tier >= offer.required_trust_tier (ordering: UNVERIFIED < BASIC < TRUSTED < ANCHOR)"
    error_id: ERR_TRUST_TIER_TOO_LOW
    http_status: 403
    applies_to: "POST /exchanges"

  - priority: 13
    category: business_constraint
    check: "verifier eligibility — POST /credentials/{id}/verify requires acting Member.trust_tier ∈ {TRUSTED, ANCHOR} AND acting Member.id != credential.subject_member_id"
    error_id: ERR_VERIFIER_INELIGIBLE
    http_status: 403
    applies_to: "POST /credentials/{id}/verify, POST /credentials/{id}/reject, POST /credentials/{id}/request-revision"

  - priority: 14
    category: business_constraint
    check: "input schema — required fields present, enum values in allowed set, integer minutes multiple of 15 in [15, 480], datetimes ISO8601 UTC, latest > earliest"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:
  # ----- Clock (test-driving; sits under /_ namespace per §1.5 ladder rung 3) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit UTC timestamp. Default at boot is 2026-03-01T00:00:00Z; every deadline/expiry is evaluated against this logical clock (never wall-clock). Also lazily fires: SkillRequest OPEN->EXPIRED, ShiftAssignment CONFIRMED->NO_SHOW, ShiftAssignment CHECKED_IN->COMPLETED, ProjectShift FILLED->COMPLETED, GroupProject OPEN->IN_PROGRESS / IN_PROGRESS->COMPLETED transitions whose time-preconditions become satisfied by the new clock value."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock advances; time-gated auto-transitions fire in the order listed above"
      - "recompute member.no_show_strikes for any member whose NO_SHOW roll happened"

  - method: POST
    path: "/_ledger/admin-adjust"
    description: "Test-driving endpoint (per §1.5 priority ladder rung 3): PlatformAdmin posts an ADMIN_ADJUSTMENT LedgerEntry directly to a member's ledger. Used to seed opening balances for tests. delta_minutes MUST be a signed integer multiple of 15 in [-4800, 4800]; memo is required."
    roles: [PlatformAdmin]
    code: 201
    input: [member_id, delta_minutes, memo]
    output: LedgerEntry
    side_effects:
      - "insert LedgerEntry with entry_kind=ADMIN_ADJUSTMENT and posted_at=logical_clock_utc"
      - "recompute member.chronological_balance_minutes and forward_looking_balance_minutes"
      - "increments Member.version by 1"

  # ----- Members -----
  - method: POST
    path: "/members"
    description: "Register a new member. Anonymous."
    roles: [Anonymous]
    code: 201
    input: [email, display_name, home_neighborhood]
    output: Member
    side_effects:
      - "insert Member with trust_tier=UNVERIFIED, chronological_balance_minutes=0, is_suspended=false, version=1"

  - method: GET
    path: "/members/{id}"
    description: "Fetch a member's public + balance fields; forward_looking is recomputed at read time."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members with optional filters."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: ["home_neighborhood?", "trust_tier?", "is_suspended?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/members/{id}/ledger-entries"
    description: "Reverse-reachability: list LedgerEntry rows for a member, chronologically."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "LedgerEntry[]"
    side_effects: []

  # ----- Skill offers -----
  - method: POST
    path: "/skill-offers"
    description: "Create a SkillOffer owned by acting Member."
    roles: [Member]
    code: 201
    input: ["member_id", "skill_code", "title", "minutes_per_session", "required_trust_tier?"]
    output: SkillOffer
    side_effects: ["insert SkillOffer with status=ACTIVE"]

  - method: GET
    path: "/skill-offers"
    description: "List skill offers with filters; supports member_id filter for FK reverse-reachability."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: ["member_id?", "skill_code?", "status?", "required_trust_tier?", "limit?", "offset?"]
    output: "SkillOffer[]"
    side_effects: []

  - method: GET
    path: "/skill-offers/{id}"
    description: "Fetch offer."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: []
    output: SkillOffer
    side_effects: []

  - method: POST
    path: "/skill-offers/{id}/pause"
    description: "Pause an ACTIVE offer."
    roles: [Member]
    code: 200
    input: []
    output: SkillOffer
    side_effects: ["offer.status <- PAUSED"]

  - method: POST
    path: "/skill-offers/{id}/resume"
    description: "Resume a PAUSED offer."
    roles: [Member]
    code: 200
    input: []
    output: SkillOffer
    side_effects: ["offer.status <- ACTIVE"]

  - method: POST
    path: "/skill-offers/{id}/archive"
    description: "Archive (terminal)."
    roles: [Member]
    code: 200
    input: []
    output: SkillOffer
    side_effects: ["offer.status <- ARCHIVED"]

  # ----- Skill requests -----
  - method: POST
    path: "/skill-requests"
    description: "Create a SkillRequest."
    roles: [Member]
    code: 201
    input: [member_id, skill_code, needed_minutes, earliest_start_utc, latest_start_utc]
    output: SkillRequest
    side_effects: ["insert SkillRequest with status=OPEN"]

  - method: GET
    path: "/skill-requests"
    description: "List; supports member_id filter for FK reverse-reachability."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: ["member_id?", "skill_code?", "status?", "limit?", "offset?"]
    output: "SkillRequest[]"
    side_effects: []

  - method: GET
    path: "/skill-requests/{id}"
    description: "Fetch."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: []
    output: SkillRequest
    side_effects: []

  - method: POST
    path: "/skill-requests/{id}/cancel"
    description: "Cancel an OPEN request."
    roles: [Member]
    code: 200
    input: []
    output: SkillRequest
    side_effects: ["request.status <- CANCELLED"]

  # ----- Exchanges -----
  - method: POST
    path: "/exchanges"
    description: "Create an Exchange linking a SkillRequest and SkillOffer. Requester's forward_looking_balance_minutes must be >= committed_minutes; requester.trust_tier must be >= offer.required_trust_tier. Auto-transitions request.status OPEN->MATCHED."
    roles: [Member]
    code: 201
    input: [offer_id, request_id, scheduled_start_utc, committed_minutes]
    output: Exchange
    side_effects:
      - "insert Exchange with status=SCHEDULED"
      - "SkillRequest.status OPEN -> MATCHED"
      - "recompute requester.forward_looking_balance_minutes (pending debit added)"

  - method: GET
    path: "/exchanges"
    description: "List; filterable by provider_member_id, requester_member_id, offer_id, request_id — reverse-reachability. `member_id` is a convenience filter matching either the provider or the requester."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "provider_member_id?", "requester_member_id?", "offer_id?", "request_id?", "status?", "limit?", "offset?"]
    output: "Exchange[]"
    side_effects: []

  - method: GET
    path: "/exchanges/{id}"
    description: "Fetch."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Exchange
    side_effects: []

  - method: POST
    path: "/exchanges/{id}/mark-delivered"
    description: "Provider marks exchange DELIVERED after scheduled_start_utc."
    roles: [Member]
    code: 200
    input: []
    output: Exchange
    side_effects: ["exchange.status <- DELIVERED"]

  - method: POST
    path: "/exchanges/{id}/settle"
    description: "Requester settles DELIVERED exchange, posting the paired LedgerEntry."
    roles: [Member]
    code: 200
    input: []
    output: Exchange
    side_effects:
      - "exchange.status <- SETTLED"
      - "insert LedgerEntry (SPENT, -committed_minutes) for requester"
      - "insert LedgerEntry (EARNED, +committed_minutes) for provider"
      - "recompute balances for BOTH members"
      - "SkillRequest.status MATCHED -> CLOSED"

  - method: POST
    path: "/exchanges/{id}/cancel"
    description: "Cancel SCHEDULED exchange (before start)."
    roles: [Member]
    code: 200
    input: []
    output: Exchange
    side_effects: ["exchange.status <- CANCELLED", "SkillRequest.status MATCHED -> OPEN"]

  # ----- Ledger (read-only surface; append-only via other endpoints) -----
  - method: GET
    path: "/ledger-entries"
    description: "List LedgerEntry rows across all filters (also filterable by exchange_id and redemption_id — reverse-reachability)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "exchange_id?", "redemption_id?", "entry_kind?", "limit?", "offset?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/ledger-entries/{id}"
    description: "Fetch a single ledger entry by id (canonical collection GET so LedgerEntry has a derived URL segment)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # ----- Redemptions -----
  - method: POST
    path: "/redemptions"
    description: "Redeem hours for a reward. OCC-guarded by expected_member_version on Member (§1.2.1)."
    roles: [Member]
    code: 201
    input: [member_id, reward_code, expected_member_version]
    output: Redemption
    side_effects:
      - "insert Redemption with status=REQUESTED"
      - "minutes_cost is server-set from reward catalog"
      - "increments Member.version by 1 (redemption is a member-scoped mutation)"

  - method: GET
    path: "/redemptions"
    description: "List redemptions; member_id filter — reverse-reachability."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "Redemption[]"
    side_effects: []

  - method: GET
    path: "/redemptions/{id}"
    description: "Fetch."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Redemption
    side_effects: []

  - method: POST
    path: "/redemptions/{id}/fulfill"
    description: "PlatformAdmin fulfills REQUESTED redemption; RE-CHECKS balance."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Redemption
    side_effects:
      - "redemption.status <- FULFILLED"
      - "insert LedgerEntry (REDEMPTION, -minutes_cost)"
      - "recompute balances; increments Member.version by 1"

  - method: POST
    path: "/redemptions/{id}/void"
    description: "PlatformAdmin voids REQUESTED redemption without spending hours."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Redemption
    side_effects: ["redemption.status <- VOIDED"]

  # ----- Verification credentials -----
  - method: POST
    path: "/credentials"
    description: "Subject submits a VerificationCredential and specifies a verifier_member_id (peer)."
    roles: [Member]
    code: 201
    input: ["subject_member_id", "verifier_member_id", "credential_type", "skill_code?", "evidence_url"]
    output: VerificationCredential
    side_effects: ["insert credential with status=SUBMITTED"]

  - method: GET
    path: "/credentials"
    description: "List; supports subject_member_id / verifier_member_id filters — reverse-reachability."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["subject_member_id?", "verifier_member_id?", "status?", "limit?", "offset?"]
    output: "VerificationCredential[]"
    side_effects: []

  - method: GET
    path: "/credentials/{id}"
    description: "Fetch."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: VerificationCredential
    side_effects: []

  - method: POST
    path: "/credentials/{id}/verify"
    description: "Verifier approves credential."
    roles: [Member]
    code: 200
    input: []
    output: VerificationCredential
    side_effects:
      - "credential.status <- VERIFIED"
      - "subject.verified_credential_count += 1"
      - "recompute subject.trust_tier; may cascade UNVERIFIED->BASIC->TRUSTED->ANCHOR"
      - "increments subject Member.version by 1"

  - method: POST
    path: "/credentials/{id}/reject"
    description: "Verifier rejects credential (terminal)."
    roles: [Member]
    code: 200
    input: []
    output: VerificationCredential
    side_effects: ["credential.status <- REJECTED"]

  - method: POST
    path: "/credentials/{id}/request-revision"
    description: "Verifier asks subject to revise."
    roles: [Member]
    code: 200
    input: []
    output: VerificationCredential
    side_effects: ["credential.status <- REVISION_REQUESTED"]

  - method: POST
    path: "/credentials/{id}/resubmit"
    description: "Subject resubmits."
    roles: [Member]
    code: 200
    input: [evidence_url]
    output: VerificationCredential
    side_effects: ["credential.status <- SUBMITTED", "credential.revision_round += 1"]

  # ----- Group projects -----
  - method: POST
    path: "/group-projects"
    description: "Organizer creates a project (PLANNING)."
    roles: [ProjectOrganizer]
    code: 201
    input: ["organizer_member_id", "title", "window_start_utc", "window_end_utc", "minimum_completed_ratio?"]
    output: GroupProject
    side_effects: ["insert project with aggregate_state=PLANNING"]

  - method: GET
    path: "/group-projects"
    description: "List; supports organizer_member_id filter — reverse-reachability."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: ["organizer_member_id?", "aggregate_state?", "limit?", "offset?"]
    output: "GroupProject[]"
    side_effects: []

  - method: GET
    path: "/group-projects/{id}"
    description: "Fetch project."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: []
    output: GroupProject
    side_effects: []

  - method: POST
    path: "/group-projects/{id}/publish"
    description: "Publish project (PLANNING -> OPEN)."
    roles: [ProjectOrganizer]
    code: 200
    input: []
    output: GroupProject
    side_effects: ["project.aggregate_state <- OPEN"]

  - method: POST
    path: "/group-projects/{id}/cancel"
    description: "Cancel project; cascades to shifts and assignments."
    roles: [ProjectOrganizer]
    code: 200
    input: []
    output: GroupProject
    side_effects:
      - "project.aggregate_state <- CANCELLED"
      - "cascade shifts to CANCELLED and assignments to CANCELLED"

  - method: POST
    path: "/group-projects/{id}/shifts"
    description: "Create a ProjectShift under the project (allowed in PLANNING and OPEN only)."
    roles: [ProjectOrganizer]
    code: 201
    input: [role_label, shift_start_utc, duration_minutes, capacity]
    output: ProjectShift
    side_effects: ["insert shift with status=OPEN"]

  - method: GET
    path: "/group-projects/{id}/shifts"
    description: "Sub-resource listing shifts for a project — FK reverse-reachability (ProjectShift.project_id -> GroupProject.id)."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ProjectShift[]"
    side_effects: []

  - method: GET
    path: "/shifts/{id}"
    description: "Fetch shift."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: []
    output: ProjectShift
    side_effects: []

  - method: POST
    path: "/shifts/{id}/assignments"
    description: "A Member self-assigns to a shift; capacity + temporal-overlap gates apply."
    roles: [Member]
    code: 201
    input: [member_id]
    output: ShiftAssignment
    side_effects:
      - "insert assignment with status=CONFIRMED"
      - "shift may transition OPEN -> FILLED"
      - "project.total_committed_minutes recomputed"

  - method: GET
    path: "/shifts/{id}/assignments"
    description: "Sub-resource listing assignments — FK reverse-reachability (ShiftAssignment.shift_id -> ProjectShift.id)."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: ["status?", "member_id?", "limit?", "offset?"]
    output: "ShiftAssignment[]"
    side_effects: []

  - method: DELETE
    path: "/shifts/{sid}/assignments/{id}"
    description: "Member cancels own assignment (before shift starts) OR cascade from project cancel."
    roles: [Member]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["assignment.status <- CANCELLED", "shift may FILLED -> OPEN"]

  - method: POST
    path: "/assignments/{id}/check-in"
    description: "Member checks in at their confirmed shift within the shift's time window."
    roles: [Member]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["assignment.status <- CHECKED_IN", "assignment.check_in_utc <- logical_clock"]

  - method: GET
    path: "/assignments/{id}"
    description: "Fetch a shift assignment by id."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "Flat list of assignments; supports member_id filter — FK reverse-reachability (ShiftAssignment.member_id -> Member.id)."
    roles: [Member, ProjectOrganizer, PlatformAdmin]
    code: 200
    input: ["member_id?", "shift_id?", "status?", "limit?", "offset?"]
    output: "ShiftAssignment[]"
    side_effects: []

  # ----- Disputes -----
  - method: POST
    path: "/disputes"
    description: "File a dispute against a DELIVERED Exchange."
    roles: [Member]
    code: 201
    input: [exchange_id, raised_by_member_id, reason_code, claimed_delta_minutes]
    output: Dispute
    side_effects:
      - "insert Dispute with status=OPEN"
      - "Exchange.status DELIVERED -> DISPUTED"

  - method: GET
    path: "/disputes"
    description: "List; supports exchange_id filter — FK reverse-reachability (Dispute.exchange_id -> Exchange.id) AND raised_by_member_id filter."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["exchange_id?", "raised_by_member_id?", "status?", "limit?", "offset?"]
    output: "Dispute[]"
    side_effects: []

  - method: GET
    path: "/disputes/{id}"
    description: "Fetch."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: POST
    path: "/disputes/{id}/resolve"
    description: "PlatformAdmin resolves; outcome UPHELD triggers reduced-credit settlement, REJECTED resumes normal settlement."
    roles: [PlatformAdmin]
    code: 200
    input: ["outcome", "admin_notes?"]
    output: Dispute
    side_effects:
      - "dispute.status <- RESOLVED_UPHELD | RESOLVED_REJECTED"
      - "Exchange transitions DISPUTED -> SETTLED (UPHELD) or DISPUTED -> DELIVERED (REJECTED)"
      - "on UPHELD: ledger entries posted with claimed_delta_minutes reduction"

  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "Raiser withdraws OPEN dispute."
    roles: [Member]
    code: 200
    input: []
    output: Dispute
    side_effects: ["dispute.status <- WITHDRAWN", "Exchange transitions DISPUTED -> DELIVERED"]

  # ----- Impact reports -----
  - method: POST
    path: "/impact-reports"
    description: "PlatformAdmin generates a report for a completed month."
    roles: [PlatformAdmin]
    code: 201
    input: [report_month]
    output: ImpactReport
    side_effects: ["computes total_hours_exchanged, unique_active_members, top_skill_code per §1.3"]

  - method: GET
    path: "/impact-reports"
    description: "List all impact reports; supports report_month filter."
    roles: [PlatformAdmin]
    code: 200
    input: ["report_month?", "limit?", "offset?"]
    output: "ImpactReport[]"
    side_effects: []

  - method: GET
    path: "/impact-reports/{id}"
    description: "Fetch."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ImpactReport
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or syntactically invalid."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Acting X-User-Role is not in the endpoint's roles list."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state that permits this operation (per §1.2 transitions)."
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "POST /redemptions with expected_member_version != current Member.version."
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "Acting Member.id does not equal the resource's owning member_id (or requester and provider are the same member)."
  - id: ERR_MEMBER_SUSPENDED
    http: 403
    condition: "Acting member is suspended (no_show_strikes >= 3)."
  - id: ERR_INSUFFICIENT_BALANCE
    http: 402
    condition: "Member.forward_looking_balance_minutes < required minutes for this operation."
  - id: ERR_SHIFT_TIME_CONFLICT
    http: 409
    condition: "Assignment interval overlaps another CONFIRMED-or-CHECKED_IN assignment for the same member (endpoints touching allowed)."
  - id: ERR_EXCHANGE_TIME_CONFLICT
    http: 409
    condition: "Exchange interval (with 30-min buffer on both sides) overlaps another SCHEDULED-or-DELIVERED exchange for the same member."
  - id: ERR_TRUST_TIER_TOO_LOW
    http: 403
    condition: "Requester's trust_tier is below the offer's required_trust_tier."
  - id: ERR_VERIFIER_INELIGIBLE
    http: 403
    condition: "Acting member is not eligible to verify (trust_tier below TRUSTED, or is the credential's subject)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed input — missing required field, invalid enum, invalid interval, minutes not in [15, 480] and multiple of 15, etc."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: Anonymous
    description: "Unauthenticated caller; can only register a Member."
    identity: "opaque"
    exclusive_operations:
      - "POST /members"
    shared_operations: []

  - name: Member
    description: "Standard member; owns SkillOffers, SkillRequests, Exchanges, Redemptions, VerificationCredentials (as subject or verifier), ShiftAssignments."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /skill-offers"
      - "POST /skill-offers/{id}/pause"
      - "POST /skill-offers/{id}/resume"
      - "POST /skill-offers/{id}/archive"
      - "POST /skill-requests"
      - "POST /skill-requests/{id}/cancel"
      - "POST /exchanges"
      - "POST /exchanges/{id}/mark-delivered"
      - "POST /exchanges/{id}/settle"
      - "POST /exchanges/{id}/cancel"
      - "POST /redemptions"
      - "POST /credentials"
      - "POST /credentials/{id}/verify"
      - "POST /credentials/{id}/reject"
      - "POST /credentials/{id}/request-revision"
      - "POST /credentials/{id}/resubmit"
      - "POST /shifts/{id}/assignments"
      - "DELETE /shifts/{sid}/assignments/{id}"
      - "POST /assignments/{id}/check-in"
      - "POST /disputes"
      - "POST /disputes/{id}/withdraw"
    shared_operations:
      - "GET /members, GET /members/{id}, GET /skill-offers*, GET /skill-requests*, GET /exchanges*, GET /credentials*, GET /group-projects*, GET /shifts/{id}, GET /shifts/{id}/assignments, GET /assignments/{id}, GET /assignments, GET /disputes*, GET /ledger-entries, GET /members/{id}/ledger-entries, GET /redemptions*"

  - name: ProjectOrganizer
    description: "A Member acting in the ProjectOrganizer capacity; can create/publish/cancel GroupProjects and their shifts."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /group-projects"
      - "POST /group-projects/{id}/publish"
      - "POST /group-projects/{id}/cancel"
      - "POST /group-projects/{id}/shifts"
    shared_operations:
      - "GET /group-projects*, GET /shifts/{id}, GET /shifts/{id}/assignments, GET /assignments, GET /members, GET /skill-offers*, GET /skill-requests*, GET /assignments/{id}"

  - name: PlatformAdmin
    description: "Operates the clock, fulfills/voids redemptions, resolves disputes, generates impact reports. Cannot act as a Member (cannot create exchanges/offers/requests)."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ledger/admin-adjust"
      - "POST /redemptions/{id}/fulfill"
      - "POST /redemptions/{id}/void"
      - "POST /disputes/{id}/resolve"
      - "POST /impact-reports"
    shared_operations:
      - "GET on all resources (members, offers, requests, exchanges, ledger-entries, redemptions, credentials, group-projects, shifts, assignments, disputes, impact-reports)"
