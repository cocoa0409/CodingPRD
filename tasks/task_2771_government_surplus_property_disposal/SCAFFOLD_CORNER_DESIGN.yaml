      - name: sm_transfer_void_four_hop_cascade_excluded
        claim_type: compensation
        grounds:
          - state_machines.TransferOrder.transitions[ACKNOWLEDGED->VOIDED]
          - state_machines.ScreeningRequest.transitions[APPROVED->DENIED]
          - state_machines.ScreeningCycle.transitions[AWARDED->OPEN]
        excluded_because:
          difficulty_instance: tc_transfer_void_four_hop_return_to_screening
          rationale: "That §1.8 instance already drives the void from an ACKNOWLEDGED order through all four hops — TransferOrder -> ScreeningRequest (denial_reason TRANSFER_VOIDED) -> ScreeningCycle (AWARDED -> OPEN with current_tier preserved) -> SurplusAsset (AWARDED_TRANSFER -> SCREENING) — and asserts every intermediate row's state and version, so a separate corner test would repeat it verbatim."

      - name: sm_bidder_debarment_five_hop_cascade_excluded
        claim_type: compensation
        grounds:
          - state_machines.Bidder.transitions[REGISTERED->DEBARRED]
          - state_machines.Bid.transitions[WINNING->RETRACTED]
          - state_machines.AuctionLot.transitions[CLOSED_MET->CLOSED_NO_SALE]
          - state_machines.SaleInvoice.transitions[ISSUED->VOIDED]
        excluded_because:
          difficulty_instance: tc_bidder_debarment_five_hop_unwind
          rationale: "The debarment cascade — bid retraction, lot regression to CLOSED_NO_SALE, invoice VOIDED with void_reason WINNER_DEBARRED, asset SOLD -> AUCTION_ELIGIBLE and the deposit returning to deposit_held_cents — is asserted hop by hop there, including winning_lot_count decrementing back to 0."

      - name: sm_demil_destroy_cascade_excluded
        claim_type: conditional_cascade
        grounds:
          - state_machines.SurplusAsset.transitions[LISTED->DESTROYED]
          - state_machines.AuctionLot.transitions[OPEN->CANCELLED]
          - state_machines.Bid.transitions[ACTIVE->RETRACTED]
        excluded_because:
          difficulty_instance: tc_demil_destroy_four_hop_cancellation
          rationale: "The DESTROY certificate cascade is covered end to end there, including the conditional nature of hop 2 (only DRAFT and OPEN lots are cancelled) and the bubble-up of the parent TurnIn to CLOSED once the destroyed asset is its only child."

      - name: sm_asset_parallel_axis_independence_excluded
        claim_type: parallel_state_dimensions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.SurplusAsset.transitions[CLEARED->BLOCKED]
        excluded_because:
          difficulty_instance: nlsm_asset_dual_axis_disposition_and_clearance_independence
          rationale: "The two-axis independence claim — clearance walking REQUIRED_PENDING -> BLOCKED -> CLEARED -> BLOCKED while disposition independently walks INTAKE -> ASSESSED -> SCREENING, with a BLOCK never disturbing the disposition axis — is the whole subject of that §1.8 instance."

      - name: sm_screening_request_info_loop_excluded
        claim_type: cyclic_shape
        grounds:
          - state_machines.ScreeningRequest.transitions[SUBMITTED->INFO_REQUESTED]
          - state_machines.ScreeningRequest.transitions[INFO_REQUESTED->SUBMITTED]
        excluded_because:
          difficulty_instance: nlsm_screening_request_info_requested_resubmit_loop
          rationale: "The request-info / resubmit loop, resubmission_count as the monotone witness, the frozen tier_at_submission and the ERR_TIER_WINDOW_EXPIRED exit condition are all asserted there."

      - name: sm_proceeds_post_reverse_ledger_sync_excluded
        claim_type: ledger_sync
        grounds:
          - state_machines.ProceedsDistribution.transitions[CALCULATED->POSTED]
          - state_machines.ProceedsDistribution.transitions[POSTED->REVERSED]
        excluded_because:
          difficulty_instance: ci_agency_proceeds_ledger_post_then_reverse_restores_balance
          rationale: "Posting recomputing Agency.proceeds_account_balance_cents, posted_distribution_count moving 0 -> 1 -> 0 and the reversal restoring the ledger invariant by recomputation rather than subtraction are all asserted there."

  - section: calculations
    instances:

      - name: calc_fmv_non_functional_factor_and_repair_floor
        claim_type: constants_applied
        grounds:
          - calculations.asset_fair_market_value.constants.NON_FUNCTIONAL_FACTOR
          - calculations.asset_fair_market_value.formula
        distinguishing_aspect: "Two constants are exercised on the same write pass: functional == false pulls NON_FUNCTIONAL_FACTOR 0.60 into the product, and the repair deduction is applied after the single rounding with a floor at 0, so an asset whose repair estimate exceeds its rounded base is valued at exactly 0 rather than a negative number."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one SUBMITTED turn-in for DOT-01 holding two FURNITURE assets acquired 2026-01-10 (elapsed 203 days, so full_years 0 and age_factor 1.00): one costing 1000000 and one costing 25000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
