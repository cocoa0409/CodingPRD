  - { method: POST, path: "/api/agreements/{id}/submit", description: "Submit agreement for signature (DRAFT -> PENDING_EXECUTION)", roles: [PremiumSalesRep, StadiumAdmin], code: 200, input: [], output: LicenseAgreement, side_effects: ["status -> PENDING_EXECUTION"] }
