          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      trigger:
        call: POST /recipient-candidates
        payload:
          program_id: ${prog_id}
          mrn: R-103
          abo_blood_type: A
          age_years: 44
          cpra: 0.85
          dialysis_years: 2.0
          medical_urgency_points: 7
          waitlist_priority_score: 99.0
          active_days_total: 500
          listing_status: ACTIVE
          offer_decline_count: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
      assert:
      - HTTP 201
      - waitlist_priority_score == 20.01 (not 99.0)
      - active_days_total == 0 (not 500)
      - listing_status == WORKUP (not ACTIVE)
      - offer_decline_count == 0 (not 7)
      - registered_at is null
  - name: donor_create_system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.DonorCandidate.fields.referred_by_staff_id
    - entities.DonorCandidate.fields.advocate_staff_id
    - entities.DonorCandidate.fields.overall_status
    - endpoints[POST /donor-candidates]
    distinguishing_aspect: referred_by_staff_id is stamped from X-User-ID rather than from the body, so
      a body that names the advocate as referrer is ignored and the coordinator's id is stored instead.
    test_recipe:
      setup:
      - Program NLT-01 with coordinator, advocate and two reviewers exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
