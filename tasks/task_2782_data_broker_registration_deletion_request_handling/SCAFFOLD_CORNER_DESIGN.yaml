            - "DownstreamRecipient.${recipient_id}.on_time_ack_count == 0"
            - "DownstreamRecipient.${recipient_id}.late_ack_count == 0"
            - "DownstreamRecipient.${recipient_id}.fail_count == 0"
            - "DownstreamRecipient.${recipient_id}.waive_count == 0"
            - "DownstreamRecipient.${recipient_id}.version == 1"

      - name: execute_forks_the_pinned_internal_target_set_in_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.DeletionRequest.transitions.VERIFIED_to_EXECUTING
          - calculations.propagation_plan.constants.TARGET_WEIGHT
          - calculations.propagation_plan.constants.INTERNAL_SLA_DAYS
        distinguishing_aspect: >
          With requested_scope DELETE_ALL, derived_profile_count 0 and no eligible recipients, the
          fork must mint exactly two tasks in the pinned order ACTIVE_DATABASE then BACKUP_ARCHIVE
          — weights 40 and 20, SLAs 5 and 45 days, due 2026-09-06 and 2026-10-16 — and no
          DERIVED_DATASET task, because the consumer holds no derived profiles.
