            - "error_id != ERR_CONTINUANCE_PENDING_BLOCKS_NO_SHOW even though a PENDING continuance exists — the priority-7 safety check fires before the priority-9 constraint check"
            - "Hearing.${h_id}.status remains SCHEDULED and Case.${case_id}.status remains CALENDAR (no partial cascade)"
            - "ContinuanceRequest.${cont_id}.status remains PENDING"

  # ===========================================================================
  # Rule 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: detained_continuance_cap_rejects_at_exactly_two
        grounds:
          - calculations.continuance_caps_bumps_and_auto_hearing_offsets
          - errors.ERR_CONTINUANCE_CAP_REACHED
          - entities.Case.fields.continuance_count
        distinguishing_aspect: |
          Count boundary on POST /eoir/continuance-requests: a DETAINED case
          accepts filings while its GRANTED count is 0 and 1, and the filing
          made while the count is exactly 2 (== cap) is rejected — the cap is
          inclusive-at-cap, so grant number cap+1 can never be filed.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One DETAINED PRO_SE English case (no interpreter) docketed, master hearing 2026-09-10T10:00 remote. Two continuances filed and granted in sequence; each grant bumps the hearing +7 days (2026-09-17, then 2026-09-24)."
