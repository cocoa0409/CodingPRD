# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Enterprise Risk Management & Risk Register
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: inherent_vs_residual_scoring_divergence_on_risk
        grounds:
          - calculations.inherent_scoring
          - calculations.residual_scoring
          - entities.Risk.fields.inherent_score
          - entities.Risk.fields.residual_score
        distinguishing_aspect: |
          Same risk, same register data: inherent_score (pre-control likelihood*impact)
          is 20 while residual_score (post-control, diminishing-returns discount over
          two ACTIVE mappings) is 9 — the two variants of risk scoring diverge on the
          Risk entity domain.
        test_recipe:
          setup:
            - "Category C1 exists; no appetite (breach evaluation inert)"
            - "Risk R in C1, ASSESSED with likelihood=4, impact=5 (inherent 20)"
            - "Controls K1 (effectiveness 0.8, ACTIVE) and K2 (effectiveness 0.6, ACTIVE)"
            - "Mappings: R-K1 weight 0.5 ACTIVE (contribution 0.40), R-K2 weight 0.5 ACTIVE (contribution 0.30)"
            - "A RESIDUAL assessment has been submitted"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "Operational", weight_factor: 1.0 }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Supply chain concentration", owner_user_id: "user_owner_1", treatment_budget_cents: 100000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rv1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${rv1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "Dual sourcing", effectiveness_pct: 0.8 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k1_id: $.data.id } }
            - { call: "POST /controls/${k1_id}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /controls", payload: { name: "Supplier audits", effectiveness_pct: 0.6 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k2_id: $.data.id } }
            - { call: "POST /controls/${k2_id}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${k1_id}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m1_id: $.data.id } }
            - { call: "POST /control-mappings/${m1_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${k2_id}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m2_id: $.data.id } }
            - { call: "POST /control-mappings/${m2_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rv2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${rv2}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { residual_assessment_id: $.data.id } }
          trigger:
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "Risk.${risk_id}.inherent_score == 20"
            - "Risk.${risk_id}.inherent_band == CRITICAL"
            - "Risk.${risk_id}.residual_score == 9"
            - "Risk.${risk_id}.residual_band == MEDIUM"
            - "RiskAssessment.${residual_assessment_id}.inherent_score == 20 and .residual_score == 9"

      - name: report_provisional_vs_final_aggregation_divergence
        grounds:
          - calculations.board_report_aggregation
          - entities.RiskReport.fields.variant
          - entities.RiskReport.fields.heat_score_total
        distinguishing_aspect: |
          Different entity domain than risk scoring: RiskReport aggregation over the
          SAME register yields heat_score_total 56.00 for variant=PROVISIONAL
          (inherent metric) vs 37.10 for variant=FINAL (residual metric).
        test_recipe:
          setup:
            - "Category CA weight 1.5; Category CB weight 0.8; no appetite statements"
            - "Risk A1 in CA: inherent 20 (L4 I5), residual 9 (mappings 0.40 and 0.30)"
            - "Risk A2 in CA: inherent 12 (L3 I4), no mappings, residual 12"
            - "Risk B1 in CB: inherent 10 (L2 I5), one mapping contribution 0.30, residual 7"
            - "All three risks are ASSESSED with a RESIDUAL assessment submitted"
            - "Clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "Strategic", weight_factor: 1.5 }, as: RiskManager, captures: { cat_a: $.data.id } }
            - { call: "POST /categories", payload: { name: "Financial", weight_factor: 0.8 }, as: RiskManager, captures: { cat_b: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_a}", title: "A1", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { ra1: $.data.id } }
            - { call: "POST /risks/${ra1}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${ra1}", as: RiskOwner, as_user_id: "user_owner_1", captures: { ra1_v: $.data.version } }
            - { call: "POST /risks/${ra1}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${ra1_v}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "K-A1a", effectiveness_pct: 0.8 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ka1: $.data.id } }
            - { call: "POST /controls/${ka1}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /controls", payload: { name: "K-A1b", effectiveness_pct: 0.6 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ka2: $.data.id } }
            - { call: "POST /controls/${ka2}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${ra1}/control-mappings", payload: { control_id: "${ka1}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { ma1: $.data.id } }
            - { call: "POST /control-mappings/${ma1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${ra1}/control-mappings", payload: { control_id: "${ka2}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { ma2: $.data.id } }
            - { call: "POST /control-mappings/${ma2}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${ra1}", as: RiskOwner, as_user_id: "user_owner_1", captures: { ra1_v2: $.data.version } }
            - { call: "POST /risks/${ra1}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${ra1_v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cat_a}", title: "A2", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { ra2: $.data.id } }
            - { call: "POST /risks/${ra2}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${ra2}", as: RiskOwner, as_user_id: "user_owner_1", captures: { ra2_v: $.data.version } }
            - { call: "POST /risks/${ra2}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 4, expected_risk_version: "${ra2_v}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${ra2}", as: RiskOwner, as_user_id: "user_owner_1", captures: { ra2_v2: $.data.version } }
            - { call: "POST /risks/${ra2}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${ra2_v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cat_b}", title: "B1", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { rb1: $.data.id } }
            - { call: "POST /risks/${rb1}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${rb1}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rb1_v: $.data.version } }
            - { call: "POST /risks/${rb1}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 5, expected_risk_version: "${rb1_v}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "K-B1", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { kb1: $.data.id } }
            - { call: "POST /controls/${kb1}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${rb1}/control-mappings", payload: { control_id: "${kb1}", coverage_weight: 0.6 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { mb1: $.data.id } }
            - { call: "POST /control-mappings/${mb1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${rb1}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rb1_v2: $.data.version } }
            - { call: "POST /risks/${rb1}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${rb1_v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", variant: "PROVISIONAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep_prov: $.data.id } }
            - { call: "POST /reports/${rep_prov}/finalize", payload: {}, as: BoardReporter, as_user_id: "user_br_1" }
            - { call: "POST /reports", payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", variant: "FINAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep_final: $.data.id } }
            - { call: "POST /reports/${rep_final}/finalize", payload: {}, as: BoardReporter, as_user_id: "user_br_1" }
            - { call: "GET /reports/${rep_prov}", as: BoardReporter, as_user_id: "user_br_1" }
            - { call: "GET /reports/${rep_final}", as: BoardReporter, as_user_id: "user_br_1" }
          assert:
            - "RiskReport.${rep_prov}.heat_score_total == 56.00"
            - "RiskReport.${rep_final}.heat_score_total == 37.10"
            - "RiskReport.${rep_final}.category_breakdown entry for ${cat_a}: risk_count == 2 and heat_score == 31.50"
            - "RiskReport.${rep_final}.category_breakdown entry for ${cat_b}: risk_count == 1 and heat_score == 5.60"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: residual_discount_diminishing_returns_mode_a
        grounds:
          - calculations.residual_scoring
          - entities.RiskControlMapping.fields.coverage_weight
          - entities.Control.fields.effectiveness_pct
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: three inputs (inherent 20,
          contributions 0.40 and 0.30) interact through the diminishing-returns
          accumulator, producing discount 0.58 and residual 9 — a naive additive
          discount (0.70) would produce 6, so the accumulator shape is falsifiable.
        test_recipe:
          setup:
            - "Category exists; risk ASSESSED with inherent 20; controls eff 0.8/0.6 ACTIVE; mappings weight 0.5 each, both ACTIVE"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "Technology" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rv: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${rv}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "K1", effectiveness_pct: 0.8 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k1: $.data.id } }
            - { call: "POST /controls/${k1}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /controls", payload: { name: "K2", effectiveness_pct: 0.6 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k2: $.data.id } }
            - { call: "POST /controls/${k2}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${k1}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m1: $.data.id } }
            - { call: "POST /control-mappings/${m1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${k2}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m2: $.data.id } }
            - { call: "POST /control-mappings/${m2}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rv2: $.data.version } }
          trigger:
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${rv2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "Risk.${risk_id}.residual_score == 9"
            - "Risk.${risk_id}.residual_score != 6 (naive additive discount 0.70 is wrong)"

      - name: report_heat_per_category_rounding_order_mode_b
        grounds:
          - calculations.board_report_aggregation
          - entities.TaxonomyCategory.fields.weight_factor
        distinguishing_aspect: |
          Mode (b) nested rounding: weight_factor 1.005 on two single-risk categories
          (residual 1 each) makes per-category-then-sum yield 2.02 while
          sum-then-round would yield 2.01 — the scaffold pins per-category rounding
          first, so the literal 2.02 is falsifiable against the wrong order.
        test_recipe:
          setup:
            - "Categories CW1 and CW2 each with weight_factor 1.005"
            - "One ASSESSED risk per category, L1 I1 inherent=1, no mappings, RESIDUAL assessed (residual 1)"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CW1", weight_factor: 1.005 }, as: RiskManager, captures: { cw1: $.data.id } }
            - { call: "POST /categories", payload: { name: "CW2", weight_factor: 1.005 }, as: RiskManager, captures: { cw2: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cw1}", title: "W1", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { rw1: $.data.id } }
            - { call: "POST /risks/${rw1}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${rw1}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rw1_v: $.data.version } }
            - { call: "POST /risks/${rw1}/assessments", payload: { kind: "INHERENT", likelihood: 1, impact: 1, expected_risk_version: "${rw1_v}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${rw1}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rw1_v2: $.data.version } }
            - { call: "POST /risks/${rw1}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${rw1_v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cw2}", title: "W2", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { rw2: $.data.id } }
            - { call: "POST /risks/${rw2}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${rw2}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rw2_v: $.data.version } }
            - { call: "POST /risks/${rw2}/assessments", payload: { kind: "INHERENT", likelihood: 1, impact: 1, expected_risk_version: "${rw2_v}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${rw2}", as: RiskOwner, as_user_id: "user_owner_1", captures: { rw2_v2: $.data.version } }
            - { call: "POST /risks/${rw2}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${rw2_v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", variant: "FINAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep_id: $.data.id } }
            - { call: "POST /reports/${rep_id}/finalize", payload: {}, as: BoardReporter, as_user_id: "user_br_1" }
          assert:
            - "RiskReport.${rep_id}.heat_score_total == 2.02"
            - "RiskReport.${rep_id}.category_breakdown entry for ${cw1}: heat_score == 1.01"
            - "RiskReport.${rep_id}.category_breakdown entry for ${cw2}: heat_score == 1.01"
            - "RiskReport.${rep_id}.band_counts.LOW == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: risk_reassessment_and_reopen_cycles
        grounds:
          - state_machines.Risk.MONITORING_to_REASSESSMENT
          - state_machines.Risk.REASSESSMENT_to_MONITORING
          - state_machines.Risk.CLOSED_to_IDENTIFIED
        distinguishing_aspect: |
          Risk machine is cyclic: MONITORING -> REASSESSMENT -> MONITORING loop via
          reassess + INHERENT re-assessment, and CLOSED -> IDENTIFIED reopen — not a
          linear pipeline; each loop re-runs scoring cascades.
        test_recipe:
          setup:
            - "Category exists (no appetite); risk driven DRAFT->IDENTIFIED->ASSESSED->MONITORING path is impossible directly, so: risk ASSESSED with residual assessed, plan approved then cancelled, enter-treatment then monitor -> MONITORING"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "Cyc" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Cyclic risk", owner_user_id: "user_owner_1", treatment_budget_cents: 100000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P1", budget_cents: 50000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${risk_id}/enter-treatment", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-plans/${plan_id}/cancel", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks/${risk_id}/monitor", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /risks/${risk_id}/reassess", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v4: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v4}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks/${risk_id}/close", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks/${risk_id}/reopen", payload: { reason: "regulator inquiry" }, as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "After reassess: Risk.${risk_id}.status == REASSESSMENT"
            - "After INHERENT in REASSESSMENT: Risk.${risk_id}.status == MONITORING and inherent_score == 4 and residual_score == 4"
            - "After close: Risk.${risk_id}.status == CLOSED"
            - "After reopen: Risk.${risk_id}.status == IDENTIFIED and inherent_score == 4 (scores preserved)"

      - name: kri_parallel_lifecycle_and_breach_dimensions
        grounds:
          - state_machines.KRI
          - entities.KRI.fields.status
          - entities.KRI.fields.current_breach_status
        distinguishing_aspect: |
          KRI carries two independent state dimensions on one row: lifecycle
          (DRAFT->ACTIVE->RETIRED, linear) x breach (NORMAL/AMBER_BREACH/RED_BREACH,
          cyclic via observations) — breach flips repeatedly while lifecycle stays
          ACTIVE, then freezes when lifecycle reaches RETIRED. Different entity
          than the Risk cycle instance.
        test_recipe:
          setup:
            - "Category exists; KRI direction ABOVE amber 50 red 75 min_observation_interval_days 0, activated"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "ParK" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "Liquidity ratio", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 51, observed_at: "2026-08-01T01:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { o1: $.data.resulting_breach_status } }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 76, observed_at: "2026-08-01T02:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { o2: $.data.resulting_breach_status } }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 10, observed_at: "2026-08-01T03:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { o3: $.data.resulting_breach_status } }
            - { call: "POST /kris/${kri_id}/retire", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /kris/${kri_id}", as: RiskManager, as_user_id: "user_rm_1" }
          assert:
            - "KRIObservation.${o1-obs} — first observation resulting_breach_status == AMBER_BREACH (captured o1 == AMBER_BREACH)"
            - "captured o2 == RED_BREACH and o3 == NORMAL (breach dimension cycled AMBER->RED->NORMAL)"
            - "KRI.${kri_id}.status stayed ACTIVE through all three observations and is RETIRED after retire"
            - "KRI.${kri_id}.current_breach_status == NORMAL after retire (frozen at last evaluated value)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: kri_red_observation_alert_priority_chain
        grounds:
          - state_machines.KRI.ACTIVE_to_ACTIVE
          - calculations.kri_breach_evaluation
          - entities.Risk.fields.kri_alert
          - entities.TreatmentPlan.fields.priority
        distinguishing_aspect: |
          Depth-3 chain from observation create: KRIObservation -> KRI.current_breach_status
          becomes RED_BREACH (link 1) -> Risk.kri_alert flips true for ASSESSED+
          risks in the category (link 2, caused by link 1) -> those risks' open
          TreatmentPlans ratchet priority to URGENT (link 3, caused by link 2).
        test_recipe:
          setup:
            - "Category CC; risk in CC ASSESSED with residual assessed; plan P approved; risk in TREATMENT"
            - "KRI in CC: ABOVE, amber 50, red 75, min interval 0, ACTIVE"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CC" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Cascade risk", owner_user_id: "user_owner_1", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 100000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${risk_id}/enter-treatment", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "Counterparty exposure", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 76, observed_at: "2026-08-01T01:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /kris/${kri_id}", as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /treatment-plans/${plan_id}", as: RiskManager, as_user_id: "user_rm_1" }
          assert:
            - "KRI.${kri_id}.current_breach_status == RED_BREACH"
            - "Risk.${risk_id}.kri_alert == true"
            - "TreatmentPlan.${plan_id}.priority == URGENT"

      - name: mapping_retire_residual_recompute_breach_chain
        grounds:
          - state_machines.RiskControlMapping.ACTIVE_to_RETIRED
          - calculations.residual_scoring
          - calculations.appetite_breach_evaluation
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (mapping retire, not KRI
          observation): mapping retire -> risk residual recomputed 9 -> 14 (link 1)
          -> residual crosses tolerance 10 so a ToleranceBreach is auto-created OPEN
          with residual_at_breach 14 (link 2, caused by link 1).
        test_recipe:
          setup:
            - "Category CT with APPROVED appetite tolerance_score 10, acceptance_cap 20, window [2026-01-01, 2027-01-01)"
            - "Risk inherent 20; mappings M1 (eff 0.8, w 0.5 -> 0.40) and M2 (eff 0.6, w 0.5 -> 0.30) ACTIVE; residual assessed = 9 (< 10, no breach)"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CT" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 10, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Breach-chain risk", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "KC1", effectiveness_pct: 0.8 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k1: $.data.id } }
            - { call: "POST /controls/${k1}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /controls", payload: { name: "KC2", effectiveness_pct: 0.6 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k2: $.data.id } }
            - { call: "POST /controls/${k2}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${k1}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m1: $.data.id } }
            - { call: "POST /control-mappings/${m1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${k2}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m2: $.data.id } }
            - { call: "POST /control-mappings/${m2}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}/tolerance-breaches", as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /control-mappings/${m1}/retire", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}/tolerance-breaches", as: RiskManager, as_user_id: "user_rm_1", captures: { breach_id: "$.data[0].id" } }
          assert:
            - "Before retire: breaches list was empty (residual 9 < tolerance 10)"
            - "After retire: Risk.${risk_id}.residual_score == 14 (only contribution 0.30 remains)"
            - "ToleranceBreach.${breach_id}.status == OPEN and residual_at_breach == 14"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: plan_approve_state_beats_business_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): approving a REJECTED plan
          whose budget (300000) also exceeds the risk's available budget (100000)
          violates both rule 7 and rule 12; priority 7 wins, so the response is
          ERR_INVALID_STATE, not ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Category; risk ASSESSED (inherent assessed) with treatment_budget_cents 100000"
            - "Plan P1 budget_cents 300000 created by user_owner_1 and REJECTED by RiskManager"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "PC1" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Conflict risk", owner_user_id: "user_owner_1", treatment_budget_cents: 100000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "Oversized plan", budget_cents: 300000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/reject", payload: { reason: "scope" }, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE (state priority 7 beats business_fiscal priority 12; budget 300000 > 100000 also fails but is masked)"
            - "HTTP status 409"

      - name: appetite_constraint_range_beats_temporal_overlap
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_TOLERANCE_OUT_OF_RANGE]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair (business_constraint vs business_temporal) — different
          pair than the state/fiscal instance: creating an appetite statement with
          tolerance_score 30 (out of 1..25) AND a window overlapping an APPROVED
          statement fails both rules; priority 9 wins, so ERR_TOLERANCE_OUT_OF_RANGE
          is returned, not ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Category CP with APPROVED appetite window [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CP" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 10, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
          trigger:
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 30, acceptance_cap_score: 20, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_TOLERANCE_OUT_OF_RANGE (business_constraint priority 9 beats business_temporal priority 10; window [2026-06-01, 2027-06-01) also overlaps but is masked)"
            - "HTTP status 422"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: kri_red_threshold_strict_inequality
        grounds:
          - calculations.kri_breach_evaluation
          - entities.KRI.fields.current_breach_status
        distinguishing_aspect: |
          Metric: KRI observed_value on endpoint POST /kris/{id}/observations.
          Strict >: value exactly equal to red_threshold (75) yields NORMAL-adjacent
          AMBER_BREACH... no — 75 == red is NOT a red breach, yielding AMBER_BREACH
          (75 > amber 50); value 76 yields RED_BREACH. The == boundary is pinned.
        test_recipe:
          setup:
            - "Category; KRI direction ABOVE amber 50 red 75 min interval 0, ACTIVE"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "BK" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "Boundary KRI", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 75, observed_at: "2026-08-01T01:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { at_eq: $.data.resulting_breach_status } }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 76, observed_at: "2026-08-01T02:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { at_gt: $.data.resulting_breach_status } }
          assert:
            - "captured at_eq == AMBER_BREACH (observed_value == red_threshold is NOT a red breach: strict >)"
            - "captured at_gt == RED_BREACH"

      - name: appetite_breach_inclusive_greater_equal
        grounds:
          - calculations.appetite_breach_evaluation
          - entities.ToleranceBreach.fields.residual_at_breach
        distinguishing_aspect: |
          Metric: residual_score vs tolerance_score on endpoint
          POST /risks/{id}/assessments — different metric and endpoint than the KRI
          instance. INCLUSIVE >=: residual exactly equal to tolerance (9 == 9)
          creates a breach, while residual tolerance-1 (8) creates none.
        test_recipe:
          setup:
            - "Category CB9 with APPROVED appetite tolerance 9, cap 20, window covering default clock"
            - "Risk R8: inherent 20, one ACTIVE mapping contribution 0.60 -> residual ceil(20*0.4) = 8"
            - "Risk R9: inherent 20, ACTIVE mappings 0.40 + 0.30 -> discount 0.58 -> residual 9"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CB9" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 9, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R8", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { r8: $.data.id } }
            - { call: "POST /risks/${r8}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r8}", as: RiskOwner, as_user_id: "user_owner_1", captures: { r8_v: $.data.version } }
            - { call: "POST /risks/${r8}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${r8_v}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "K60", effectiveness_pct: 0.6 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k60: $.data.id } }
            - { call: "POST /controls/${k60}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${r8}/control-mappings", payload: { control_id: "${k60}", coverage_weight: 1.0 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m8: $.data.id } }
            - { call: "POST /control-mappings/${m8}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${r8}", as: RiskOwner, as_user_id: "user_owner_1", captures: { r8_v2: $.data.version } }
            - { call: "POST /risks/${r8}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${r8_v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R9", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { r9: $.data.id } }
            - { call: "POST /risks/${r9}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r9}", as: RiskOwner, as_user_id: "user_owner_1", captures: { r9_v: $.data.version } }
            - { call: "POST /risks/${r9}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${r9_v}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "K80", effectiveness_pct: 0.8 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k80: $.data.id } }
            - { call: "POST /controls/${k80}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /controls", payload: { name: "K60b", effectiveness_pct: 0.6 }, as: ControlOwner, as_user_id: "user_co_1", captures: { k60b: $.data.id } }
            - { call: "POST /controls/${k60b}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${r9}/control-mappings", payload: { control_id: "${k80}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m9a: $.data.id } }
            - { call: "POST /control-mappings/${m9a}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${r9}/control-mappings", payload: { control_id: "${k60b}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m9b: $.data.id } }
            - { call: "POST /control-mappings/${m9b}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${r9}", as: RiskOwner, as_user_id: "user_owner_1", captures: { r9_v2: $.data.version } }
          trigger:
            - { call: "POST /risks/${r9}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${r9_v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r8}/tolerance-breaches", as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${r9}/tolerance-breaches", as: RiskManager, as_user_id: "user_rm_1", captures: { b9: "$.data[0].id" } }
          assert:
            - "Risk.${r8}.residual_score == 8 and its tolerance-breaches list is empty (8 < 9: no breach)"
            - "Risk.${r9}.residual_score == 9"
            - "ToleranceBreach.${b9}.status == OPEN and residual_at_breach == 9 (9 >= 9: inclusive breach)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: mapping_approve_requires_control_active
        grounds:
          - state_machines.RiskControlMapping.PROPOSED_to_ACTIVE
          - entities.Control.fields.status
          - errors[ERR_CONTROL_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair RiskControlMapping -> Control: a mapping cannot transition
          PROPOSED -> ACTIVE while its referenced Control is PROPOSED; the guard
          lives on the mapping but reads the control's state.
        test_recipe:
          setup:
            - "Category; risk ASSESSED (inherent done); control KC still PROPOSED (never activated); mapping created (PROPOSED)"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CE1" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "KC", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${ctl_id}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { map_id: $.data.id } }
          trigger:
            - { call: "POST /control-mappings/${map_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
            - { call: "POST /controls/${ctl_id}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /control-mappings/${map_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          assert:
            - "First approve: captured err == ERR_CONTROL_NOT_ACTIVE, HTTP 409, mapping stays PROPOSED"
            - "After control activation, second approve succeeds: RiskControlMapping.${map_id}.status == ACTIVE"

      - name: risk_monitor_requires_no_open_breach
        grounds:
          - state_machines.Risk.TREATMENT_to_MONITORING
          - entities.ToleranceBreach.fields.status
          - errors[ERR_OPEN_BREACH_BLOCKING]
        distinguishing_aspect: |
          Entity pair Risk -> ToleranceBreach (different pair than mapping->control):
          the TREATMENT -> MONITORING transition is rejected while any breach of the
          risk is OPEN or ACKNOWLEDGED, and only succeeds after the breach reaches
          RESOLVED (which itself requires residual below tolerance).
        test_recipe:
          setup:
            - "Category CTOL with APPROVED appetite tolerance 9, cap 20"
            - "Risk inherent 20, one ACTIVE mapping contribution 0.60 (residual 8), RESIDUAL assessed; plan approved; risk TREATMENT"
            - "Control retired -> mapping RETIRED -> residual recomputed to 20 -> breach OPEN created"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CTOL" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 9, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Guarded risk", owner_user_id: "user_owner_1", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "KG", effectiveness_pct: 0.6 }, as: ControlOwner, as_user_id: "user_co_1", captures: { kg: $.data.id } }
            - { call: "POST /controls/${kg}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${kg}", coverage_weight: 1.0 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { mg: $.data.id } }
            - { call: "POST /control-mappings/${mg}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 100000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${risk_id}/enter-treatment", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls/${kg}/retire", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "GET /risks/${risk_id}/tolerance-breaches", as: RiskManager, as_user_id: "user_rm_1", captures: { breach_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /risks/${risk_id}/monitor", payload: {}, as: RiskOwner, as_user_id: "user_owner_1", captures: { err1: $.data.error_id } }
            - { call: "POST /tolerance-breaches/${breach_id}/acknowledge", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks/${risk_id}/monitor", payload: {}, as: RiskOwner, as_user_id: "user_owner_1", captures: { err2: $.data.error_id } }
            - { call: "POST /controls", payload: { name: "KG2", effectiveness_pct: 0.8 }, as: ControlOwner, as_user_id: "user_co_1", captures: { kg2: $.data.id } }
            - { call: "POST /controls/${kg2}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${kg2}", coverage_weight: 1.0 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { mg2: $.data.id } }
            - { call: "POST /control-mappings/${mg2}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /tolerance-breaches/${breach_id}/resolve", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-plans/${plan_id}/cancel", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks/${risk_id}/monitor", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "captured err1 == ERR_OPEN_BREACH_BLOCKING (breach OPEN)"
            - "captured err2 == ERR_OPEN_BREACH_BLOCKING (ACKNOWLEDGED still blocks)"
            - "After new mapping (contribution 0.80): Risk.${risk_id}.residual_score == 4, breach resolves to RESOLVED"
            - "After plan cancel + monitor: Risk.${risk_id}.status == MONITORING"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: appetite_half_open_window_overlap
        grounds:
          - entities.AppetiteStatement.fields.effective_from
          - entities.AppetiteStatement.fields.effective_to
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [from, to) on AppetiteStatement. Overlap
          ([2026-06-01, 2027-06-01) vs APPROVED [2026-01-01, 2027-01-01)) is rejected;
          exact adjacency ([2027-01-01, 2028-01-01)) is accepted because the prior
          window's end is exclusive.
        test_recipe:
          setup:
            - "Category CW with APPROVED appetite [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CW" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 10, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app1: $.data.id } }
            - { call: "POST /appetite-statements/${app1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
          trigger:
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 12, acceptance_cap_score: 22, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 12, acceptance_cap_score: 22, effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app3: $.data.id } }
            - { call: "POST /appetite-statements/${app3}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
          assert:
            - "First create: captured err == ERR_WINDOW_OVERLAP, HTTP 409"
            - "Adjacent create succeeds: AppetiteStatement.${app3}.id exists, status DRAFT, and its approve succeeds to APPROVED"

      - name: report_closed_period_shared_boundary_overlap
        grounds:
          - entities.RiskReport.fields.period_start
          - entities.RiskReport.fields.period_end
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics than appetite: RiskReport periods are CLOSED
          [start, end] on a different resource entity, so a shared boundary date
          (period_end == period_start of another FINALIZED report) IS an overlap;
          only a strictly later start passes.
        test_recipe:
          setup:
            - "FINALIZED report R1 for closed period [2026-01-01, 2026-03-31]"
          setup_api_calls:
            - { call: "POST /reports", payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", variant: "FINAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep1: $.data.id } }
            - { call: "POST /reports/${rep1}/finalize", payload: {}, as: BoardReporter, as_user_id: "user_br_1" }
          trigger:
            - { call: "POST /reports", payload: { period_start: "2026-03-31T00:00:00Z", period_end: "2026-06-30T00:00:00Z", variant: "FINAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep2: $.data.id } }
            - { call: "POST /reports/${rep2}/finalize", payload: {}, as: BoardReporter, as_user_id: "user_br_1", captures: { err: $.data.error_id } }
            - { call: "POST /reports", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", variant: "FINAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep3: $.data.id } }
            - { call: "POST /reports/${rep3}/finalize", payload: {}, as: BoardReporter, as_user_id: "user_br_1" }
          assert:
            - "Shared-boundary finalize: captured err == ERR_REPORT_PERIOD_OVERLAP, HTTP 409 (2026-03-31 is inside both closed periods)"
            - "RiskReport.${rep2}.status remains DRAFT"
            - "Strictly-later finalize succeeds: RiskReport.${rep3}.status == FINALIZED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: treatment_budget_approve_cancel_conservation
        grounds:
          - calculations.treatment_budget_accounting
          - entities.Risk.fields.reserved_treatment_cents
          - entities.Risk.fields.available_treatment_cents
        distinguishing_aspect: |
          Conserved quantity: cents. Plan approve (300000) followed by its
          compensating cancel leaves risk.reserved_treatment_cents == 0 and
          available_treatment_cents == 1000000 exactly — no drift from the
          pre-approve state.
        test_recipe:
          setup:
            - "Category; risk ASSESSED with treatment_budget_cents 1000000"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CI1" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Budget risk", owner_user_id: "user_owner_1", treatment_budget_cents: 1000000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "PB", budget_cents: 300000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
          trigger:
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-plans/${plan_id}/cancel", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "After approve: Risk.${risk_id}.reserved_treatment_cents == 300000 and available_treatment_cents == 700000"
            - "After cancel: Risk.${risk_id}.reserved_treatment_cents == 0 and available_treatment_cents == 1000000"
            - "TreatmentPlan.${plan_id}.status == CANCELLED"

      - name: control_mapped_count_create_retire_conservation
        grounds:
          - calculations.control_mapping_accounting
          - entities.Control.fields.mapped_active_count
        distinguishing_aspect: |
          Conserved quantity: mapping count (not cents). Mapping approve followed by
          its compensating retire leaves control.mapped_active_count unchanged (0 ->
          1 -> 0) and always equal to the actual count of ACTIVE mappings.
        test_recipe:
          setup:
            - "Category; risk ASSESSED; control KC ACTIVE with max_mapped_risks 3"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CI2" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "Count risk", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 4, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "KC", effectiveness_pct: 0.5, max_mapped_risks: 3 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl_id: $.data.id } }
            - { call: "POST /controls/${ctl_id}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${ctl_id}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { map_id: $.data.id } }
          trigger:
            - { call: "POST /control-mappings/${map_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /controls/${ctl_id}", as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /control-mappings/${map_id}/retire", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /controls/${ctl_id}", as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "GET /controls/${ctl_id}/control-mappings", as: ControlOwner, as_user_id: "user_co_1" }
          assert:
            - "After approve: Control.${ctl_id}.mapped_active_count == 1"
            - "After retire: Control.${ctl_id}.mapped_active_count == 0 and no ACTIVE mapping remains in the list"
