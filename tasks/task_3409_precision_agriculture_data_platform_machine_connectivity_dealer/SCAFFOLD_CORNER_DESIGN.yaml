        distinguishing_aspect: "settle exists only from APPROVED and decide only from SUBMITTED: settle on a SUBMITTED claim and a second decide on an APPROVED claim both fail 409; reserve and payout are untouched."
        test_recipe:
          setup:
            - "IN_SERVICE machine with 648 filled hour-buckets (coverage 90.0 at clock 2026-09-30); a submitted claim of 500000 cents with 200000 parts."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
