              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { pn1: "$.data.id", pn1_status: "$.data.status" }
            - call: "POST /sample-panels/${pn1}/submit"
              payload: {}
              as: BlendTechnician
              as_user_id: "blend-001"
              captures: { pn1_status_2: "$.data.status" }
          trigger:
            - call: "POST /blends/${b1}/certify"
              payload: {}
              as: QualityManager
              as_user_id: "qual-001"
              captures: { e22: "$.data.error_id" }
            - call: "POST /sample-panels/${pn1}/approve"
