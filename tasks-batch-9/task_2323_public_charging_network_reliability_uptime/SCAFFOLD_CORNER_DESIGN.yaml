            - "call 2: MaintenanceDispatch.${d1_id}.arrived_at == \"2026-08-01T02:00:00Z\" and response_met == true — arrival exactly on the deadline counts as met"
            - "call 4: MaintenanceDispatch.${d2_id}.arrived_at == \"2026-08-01T02:01:00Z\" and response_met == false — one minute past is a miss"
            - "response_met is pinned at ARRIVE and never re-evaluated: after call 3 moved the clock past ${d1_id}'s deadline, MaintenanceDispatch.${d1_id}.response_met is still true"
            - "both ports moved DISPATCH_PENDING -> UNDER_REPAIR, and Station.${st_id}.status is SUSPENDED with suspension_source AUTOMATIC from the two CRITICAL faults"
            - "the cumulative counterpart of this layer — the 97 / 95 / 90 uptime withhold ladder — is exercised by withhold_tier_selection_is_inclusive_at_exactly_ninety_seven_percent"

      - name: four_level_cascade_runs_end_to_end_on_dispatch_completion
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: dispatch_completion_cascades_four_levels_dispatch_outage_port_station
          rationale: "That §1.8 instance walks the full dispatch -> outage -> port -> station chain in one call, asserts the ordering dependency (the station may only leave SUSPENDED after the last port is back IN_SERVICE) and pins the ledger figures the cascade produces."

      - name: both_uptime_variants_are_produced_from_the_same_rows
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: uptime_provisional_and_final_variants_diverge_on_identical_outage_rows
          rationale: "That §1.8 instance computes PROVISIONAL and FINAL over one identical outage set, asserts both figures and the exact delta the methodology switch introduces by removing excluded minutes from the denominator."

  # ===========================================================================
  # SECTION 9 — Consistency model (§1.0.consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_cascaded_field_is_already_settled_in_the_causing_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
        distinguishing_aspect: "consistency_model is `immediate`, so no derived value may lag by a request. The completion call returns only the dispatch, yet the outage's cleared_at, the port's two state dimensions, the station's counters and the station's downtime ledger must already be final at that instant — an immediately following GET of each of the four entities must report exactly the same figures, with no second write and no version drift."
        test_recipe:
          setup:
            - "Logical clock walked 2026-08-01T00:00:00Z -> 2026-08-01T03:00:00Z -> 2026-08-01T05:30:00Z."
            - "HostSite / Station ST-1 OPERATIONAL / one CERTIFIED port DS-1."
            - "A CLASSIFIED MAJOR outage detected 2026-08-01T00:00:00Z with a dispatch driven to ON_SITE at 03:00."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-08-01T01:00:00Z", window_end_at: "2026-08-01T09:00:00Z" }
              as: NetworkOperator
              as_user_id: "op-1"
              captures: { d_id: $.data.id }
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T03:00:00Z" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T05:30:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /maintenance-dispatches/${d_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { d_ver: $.data.version }
            - call: "GET /outage-events/${o_id}"
              payload: {}
              as: NetworkOperator
            - call: "GET /charging-ports/${p_id}"
              payload: {}
              as: NetworkOperator
            - call: "GET /stations/${st_id}"
              payload: {}
              as: NetworkOperator
            - call: "GET /maintenance-dispatches/${d_id}"
              payload: {}
              as: NetworkOperator
          assert:
            - "call 1 returns MaintenanceDispatch.${d_id}.state == COMPLETED with arrived_at 2026-08-01T03:00:00Z and response_met == true (the MAJOR / DCFC_150 deadline is detected_at + floor(720 x 0.75) == 540 minutes, i.e. 2026-08-01T09:00:00Z)"
            - "call 2: OutageEvent.${o_id}.state == RESOLVED and cleared_at == \"2026-08-01T05:30:00Z\", set by the same request that completed the dispatch"
            - "call 3: ChargingPort.${p_id}.service_state == IN_SERVICE and maintenance_state == NONE — both dimensions already settled"
            - "call 4: Station.${st_id}.status == OPERATIONAL with suspension_source == NONE, out_of_service_port_count == 0, gross_downtime_minutes_lifetime == 330 and billable_downtime_minutes_lifetime == 330 with excluded_downtime_minutes_lifetime == 0 (2026-08-01T00:00:00Z -> 05:30:00Z)"
            - "call 5: MaintenanceDispatch.${d_id}.version == ${d_ver} — the follow-up reads observed the cascade without triggering any further write"
            - "nothing lagged: there is no state in which the dispatch reads COMPLETED while the outage still reads DISPATCHED, so a deferred or queued reconciliation is not an acceptable implementation"
