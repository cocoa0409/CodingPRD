          assert:
            - "err == ERR_DECISION_TRIGGER_NOT_ARMED (409)"
            - "HOLD decision created: DispositionDecision.${dd_hold}.status == SCREENING and hold_years_elapsed == 2"

      - name: record_sale_without_decision_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Asset.LISTED_FOR_SALE_to_UNDER_CONTRACT, "errors[ERR_ASSET_NOT_SELLABLE]"]
        distinguishing_aspect: "CONTRACT on an asset that is merely OWNED (no executed SELL decision) fails — both the from-state and the decision precondition are absent."
