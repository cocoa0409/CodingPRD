      - name: pilot_car_arm_of_escort_sufficiency_is_conditional_on_the_flag
        claim_type: conditional_validation
        grounds:
          - validations[priority 26]
          - calculations.escort_requirement_matrix
          - entities.TransportPermit.fields.pilot_car_required
          - entities.EscortAssignment.fields.role
        distinguishing_aspect: |
          An AZ permit filed for 3 legs needs zero escorts (STATE_ESCORT_BASE AZ is
          0 and the load is neither oversize nor overheight) yet pilot_car_required
          is true because leg_count reaches PILOT_CAR_LEG_THRESHOLD. A RESERVED
          role == ESCORT reservation therefore does NOT satisfy priority 26 - only a
          RESERVED role == PILOT_CAR does - so the flag, not the head-count, decides.
          Fee is 12000 + 3 x 4500 = 25500 both provisionally and finally.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an AZ plant, an ACTIVE AZ hauler, an escort crew certified for ESCORT and PILOT_CAR"
            - "a single-section AZ order, section 168 x 150 in, measured and released"
            - "an AZ permit filed with planned_leg_count 3 and all three legs created, paid to exactly 25500 so it sits in FEE_PAID"
            - "one RESERVED role == ESCORT assignment already on leg 1"
