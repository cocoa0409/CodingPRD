              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "L1", nominal_length_ft: 1000 }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 300, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${q_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { so_id: "$.data.id", so_v1: "$.data.version" }
            - call: "POST /sales-orders/${so_id}/allocate"
              payload: { allocation_policy: "MINIMIZE_REMNANT", expected_sales_order_version: "${so_v1}" }
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "POST /customers/${cust_id}/credit-adjustments"
              payload: { delta_open_balance_cents: 150000, reason: "manual invoice posted" }
