  - rule_id: non_linear_state_machine
    instances:
      - name: slotting_deal_negotiation_cycle_then_acceptance_by_non_offeror
        grounds:
          - state_machines.SlottingDeal.PROPOSED_to_COUNTERED
          - state_machines.SlottingDeal.COUNTERED_to_PROPOSED
          - state_machines.SlottingDeal.COUNTERED_to_ACCEPTED
          - state_machines.SlottingDeal.ACCEPTED_to_AMORTIZING
          - entities.SlottingDeal.fields.round_index
          - entities.SlottingDeal.fields.last_offer_side
          - validations[priority=7]
        distinguishing_aspect: |
          A genuine CYCLE with a bounded loop counter: PROPOSED→COUNTERED→
          PROPOSED→COUNTERED revisits both states, round_index monotonically
          counts only the retailer's counters (2 after two loops, capped at
          MAX_NEGOTIATION_ROUNDS=3), each re-proposal must be strictly lower and
          each counter strictly higher, and the terminal acceptance is guarded by
          last_offer_side so only the NON-offeror may accept — the same endpoint
          is legal for RetailerBuyer in one loop position and for
          BrokerAccountManager in the other. The sibling instance is a PARALLEL
          two-dimension machine (Deduction settlement_state × dispute_state), not
          a cycle.
        test_recipe:
          setup:
            - "Retailer BIGMART (1200 stores); principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement and a 20,000,000-cent budget; one VALIDATED item."
            - "OPEN FROZEN_SNACKS review with 2 slots; presentation SUBMITTED."
            - "SlottingDeal created (100 stores, 1 item, forecast 0, 4 periods, FORECAST_STRAIGHT) and driven through propose 50000 → counter 60000 → propose 55000 → counter 58000, i.e. two full negotiation loops ending with the retailer holding the standing offer."
            - "Review locked at the deadline and DECIDED at 2026-09-02, awarding the item; the deal was COUNTERED at decide time so the created authorization is linked to it and sits in PENDING_SETUP."
