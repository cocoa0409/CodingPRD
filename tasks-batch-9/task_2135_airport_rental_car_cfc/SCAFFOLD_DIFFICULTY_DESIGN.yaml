  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_priority_12_beats_fiscal_priority_33_on_draw_authorize
        grounds:
          - validations[priority=12]
          - validations[priority=33]
          - errors[ERR_PROJECT_NOT_FUNDED]
          - errors[ERR_CAPITAL_FUND_INSUFFICIENT]
        distinguishing_aspect: |
          Error-category pair: `state` (priority 12, ERR_PROJECT_NOT_FUNDED)
          versus `business_fiscal` (priority 33, ERR_CAPITAL_FUND_INSUFFICIENT).
          Both are violated by one authorize call — the project is still APPROVED
          and the capital bucket holds 0 cents — and the response must be
          ERR_PROJECT_NOT_FUNDED with HTTP 409.
        test_recipe:
          setup:
            - "A facility whose CFC trust has received nothing: trust_capital_fund_cents == 0 and bond_coverage_status == DEFICIENT."
