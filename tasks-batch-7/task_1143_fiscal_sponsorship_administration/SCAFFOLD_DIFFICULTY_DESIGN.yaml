          29,999 = 59,999 leaves requires_1099 false; +1 cent crossing to exactly
          60,000 flips it true (>= inclusive).
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; received 500,000 (fee 40,000; available 460,000); CONTRACTOR engagement ACTIVE"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Pi", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "p@x.org" }, as: Applicant, as_user_id: user_app_p, captures: { app_p: $.data.id } }
            - { call: "POST /fsa/applications/${app_p}/submit", payload: {}, as: Applicant, as_user_id: user_app_p }
            - { call: "POST /fsa/applications/${app_p}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_p}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_p: $.data.project_id, ag_p: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_p}/countersign", payload: {}, as: Applicant, as_user_id: user_app_p }
            - { call: "POST /fsa/projects/${p_p}/donations", payload: { amount_cents: 500000, donor_name: "D Thirteen", donor_email: "d13@x.org", payment_method: "ACH" }, as: Donor, as_user_id: user_donor_1, captures: { d_p1: $.data.id } }
            - { call: "POST /fsa/donations/${d_p1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p_p}/staff-engagements", payload: { worker_name: "W Two", worker_email: "w2@x.org", engagement_type: "CONTRACTOR", compensation_type: "FIXED", rate_cents: 30000, start_date: "2026-05-10" }, as: ProjectLead, as_user_id: "${p_p}", captures: { eng_p: $.data.id } }
            - { call: "POST /fsa/staff-engagements/${eng_p}/classification-review", payload: { approved_type: "CONTRACTOR", rationale: "ok" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/staff-engagements/${eng_p}/activate", payload: {}, as: ProjectLead, as_user_id: "${p_p}" }
          trigger:
            - { call: "POST /fsa/projects/${p_p}/disbursement-requests", payload: { amount_cents: 30000, purpose: "milestone 1", payee_type: "STAFF", payee_name: "W Two", spend_date: "2026-06-01", staff_engagement_id: "${eng_p}" }, as: ProjectLead, as_user_id: "${p_p}", captures: { dr_p1: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr_p1}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_p}" }
            - { call: "POST /fsa/disbursement-requests/${dr_p1}/compliance-review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/disbursement-requests/${dr_p1}/pay", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "GET /fsa/staff-engagements/${eng_p}", payload: {}, as: ComplianceOfficer, as_user_id: user_co_1, captures: { ytd1: $.data.contractor_ytd_cents, f1: $.data.requires_1099 } }
            - { call: "POST /fsa/projects/${p_p}/disbursement-requests", payload: { amount_cents: 29999, purpose: "milestone 2", payee_type: "STAFF", payee_name: "W Two", spend_date: "2026-06-08", staff_engagement_id: "${eng_p}" }, as: ProjectLead, as_user_id: "${p_p}", captures: { dr_p2: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr_p2}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_p}" }
            - { call: "POST /fsa/disbursement-requests/${dr_p2}/compliance-review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/disbursement-requests/${dr_p2}/pay", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "GET /fsa/staff-engagements/${eng_p}", payload: {}, as: ComplianceOfficer, as_user_id: user_co_1, captures: { ytd2: $.data.contractor_ytd_cents, f2: $.data.requires_1099 } }
            - { call: "POST /fsa/projects/${p_p}/disbursement-requests", payload: { amount_cents: 1, purpose: "milestone 3 top-up", payee_type: "STAFF", payee_name: "W Two", spend_date: "2026-06-15", staff_engagement_id: "${eng_p}" }, as: ProjectLead, as_user_id: "${p_p}", captures: { dr_p3: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr_p3}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_p}" }
