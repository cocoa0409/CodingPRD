            - "AlarmPermit.${permit1_id}.status is still stored as ACTIVE with version 1 and last_renewed_at null — the clock call mutated nothing"
            - "AlarmSite.${site_id}.version, outstanding_balance_cents 5500 and response_status RESPONSE_ACTIVE are all unchanged"
            - "a subsequent POST /false-alarm-program/_program-runs/nightly is what advances the permit to GRACE (past term_end_at, before grace_through_at) and bumps its version"
            - "setting the clock backwards to 2026-08-01T00:00:00Z is likewise accepted and leaves every entity untouched"

  # ===========================================================================
  # 6. ERRORS — the guide's Table 6 sweep: every code in the §1.6 catalog must be
  #    triggerable. The 62 business / state / concurrency / auth codes are each
  #    already the asserted winner of an instance in sections 2-5; this section
  #    closes the remaining gaps — the ten entity-specific 404s that no earlier
  #    instance raises, ERR_DOCKET_EMPTY, and ERR_INVALID_PAGINATION on the two
  #    list endpoints whose pagination edges are otherwise untested.
  # ===========================================================================
  - section: errors
    instances:

      - name: fee_schedule_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_FEE_SCHEDULE_NOT_FOUND
          - validations.priority_6_existence_path_ids
          - endpoints.GET_/false-alarm-program/fee-schedules/{scheduleId}
        distinguishing_aspect: "Priority 6 emits the ENTITY-SPECIFIC 404, not a generic one: a well-formed UUID that matches no FeeSchedule yields ERR_FEE_SCHEDULE_NOT_FOUND, and the error envelope carries error_id plus a message with response_type \"error\" — which is what every other 404 claim in this section is stated against."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; exactly one FeeSchedule (FS-2026-A) exists and the queried id is not its id."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
          trigger:
            - call: "GET /false-alarm-program/fee-schedules/8c1f0a44-0000-4000-8000-000000000001"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { err_fs_nf: $.data.error_id, err_fs_msg: $.data.message }
          assert:
            - "the response status is 404 and error_id == ERR_FEE_SCHEDULE_NOT_FOUND"
            - "response_type == \"error\" and data.message is a non-empty human-readable string"
            - "the real schedule is untouched: GET /false-alarm-program/fee-schedules/${sched_id} still returns 200 with status ACTIVE"

      - name: alarm_company_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_ALARM_COMPANY_NOT_FOUND
          - endpoints.GET_/false-alarm-program/alarm-companies/{companyId}
        distinguishing_aspect: "The companyId path segment resolves against AlarmCompany only, so an unknown id must give ERR_ALARM_COMPANY_NOT_FOUND even when the caller passes a valid AlarmSite id in its place — the code names the entity the segment addresses, not the shape of the value."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one company and one premises exist."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
          trigger:
            - call: "GET /false-alarm-program/alarm-companies/8c1f0a44-0000-4000-8000-000000000002"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err_co_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ALARM_COMPANY_NOT_FOUND"
            - "passing the AlarmSite id ${site_id} in the same position also returns 404 ERR_ALARM_COMPANY_NOT_FOUND, not a 200 and not ERR_ALARM_SITE_NOT_FOUND"
            - "GET /false-alarm-program/alarm-companies/${company_id} still returns 200 with status ACTIVE"

      - name: alarm_system_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_ALARM_SYSTEM_NOT_FOUND
          - endpoints.GET_/false-alarm-program/alarm-systems/{systemId}
        distinguishing_aspect: "Existence is checked before role-scoped ownership: the AlarmUser caller owns ${site_id} but the systemId does not exist, so the answer is the 404 rather than the priority-8 ownership 403 — an implementation that resolved ownership first would leak whether the id exists."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; system 1 exists and is PERMITTED at the caller's own premises."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
          trigger:
            - call: "GET /false-alarm-program/alarm-systems/8c1f0a44-0000-4000-8000-000000000003"
              payload: {}
              as: AlarmUser
              as_user_id: "${site_id}"
              captures: { err_sys_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ALARM_SYSTEM_NOT_FOUND"
            - "the 404 wins over the ownership rule at priority 8, which could not be evaluated for a non-existent row"
            - "GET /false-alarm-program/alarm-systems/${system1_id} by the same caller returns 200 with status PERMITTED"

      - name: site_contact_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_SITE_CONTACT_NOT_FOUND
          - endpoints.GET_/false-alarm-program/site-contacts/{contactId}
        distinguishing_aspect: "A contact deleted from the roster is gone for path resolution too: the code must be ERR_SITE_CONTACT_NOT_FOUND for any unknown contactId, which is the same code a DELETE of an already-removed contact would raise."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; the premises has two live contacts."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_site
            - *k_c1
            - *k_c2
          trigger:
            - call: "GET /false-alarm-program/site-contacts/8c1f0a44-0000-4000-8000-000000000004"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
              captures: { err_contact_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_SITE_CONTACT_NOT_FOUND"
            - "the roster is unaffected: GET /false-alarm-program/site-contacts?alarm_site_id=${site_id} still returns total_count 2"
            - "AlarmSite.${site_id}.ecv_callable_contact_count is still 2"

      - name: dispatch_request_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_DISPATCH_REQUEST_NOT_FOUND
          - endpoints.GET_/false-alarm-program/dispatch-requests/{requestId}
        distinguishing_aspect: "DispatchRequest is the busiest path parameter in the program (validate, record-dispatch, refuse, close-valid all take it), so its 404 code must be entity-specific rather than folded into the incident's code: an unknown requestId gives ERR_DISPATCH_REQUEST_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-09-20T00:00:00Z; one real dispatch request for the 2026-09-15T03:09:00Z alarm exists in SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_clock_sep
            - *k_dr1
          trigger:
            - call: "GET /false-alarm-program/dispatch-requests/8c1f0a44-0000-4000-8000-000000000005"
              payload: {}
              as: PoliceDispatchSupervisor
              as_user_id: "pds-05"
              captures: { err_dr_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_DISPATCH_REQUEST_NOT_FOUND"
            - "POST /false-alarm-program/dispatch-requests/8c1f0a44-0000-4000-8000-000000000005/validate returns the same 404 code — path existence precedes every state precondition"
            - "DispatchRequest.${dr1_id} is untouched and still SUBMITTED with version 1"

      - name: suspension_order_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_SUSPENSION_ORDER_NOT_FOUND
          - endpoints.GET_/false-alarm-program/suspension-orders/{orderId}
        distinguishing_aspect: "No suspension order exists at all in this fixture, so the read cannot be confused with an ownership or state failure: the empty collection still resolves the path segment and answers ERR_SUSPENSION_ORDER_NOT_FOUND rather than returning an empty object."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one permitted system, zero suspension orders."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
          trigger:
            - call: "GET /false-alarm-program/suspension-orders/8c1f0a44-0000-4000-8000-000000000006"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { err_so_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_SUSPENSION_ORDER_NOT_FOUND"
            - "GET /false-alarm-program/suspension-orders?alarm_site_id=${site_id} returns 200 with total_count 0 — the list has no 404 semantics"
            - "POST /false-alarm-program/suspension-orders/8c1f0a44-0000-4000-8000-000000000006/serve returns the same 404 code"

      - name: penalty_invoice_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_PENALTY_INVOICE_NOT_FOUND
          - endpoints.GET_/false-alarm-program/penalty-invoices/{invoiceId}
        distinguishing_aspect: "The invoice 404 also guards the money-moving endpoints that take invoiceId in the body (explicit payment allocations) or the path (adjustments, collections-referral), so it must be the entity-specific code and not ERR_ALARM_SITE_NOT_FOUND from the invoice's parent."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one real PERMIT_ISSUE_FEE invoice of 5500 cents exists."
