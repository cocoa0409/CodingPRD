          - entities.CreatorFund.fields.max_allocation_cents
          - entities.CreatorFund.fields.unallocated_remainder_cents
        distinguishing_aspect: "With max_allocation_cents 20000 both pro-rata quotients (76923 and 23076) are clipped to 20000 and the 60000 residue is left in unallocated_remainder_cents rather than being spread over the capped recipients."
