            - { call: "POST /students/${st1}/privacy-directives", payload: { directive_type: "FULL_BLOCK", effective_from: "2026-01-01", expected_student_version: "${st_v1}" }, as: ClearinghouseOps, captures: { d1: "$.data.id" } }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_v2: "$.data.version" } }
            - { call: "POST /students/${st1}/privacy-directives", payload: { directive_type: "FULL_BLOCK", effective_from: "2026-06-01", expected_student_version: "${st_v2}" }, as: ClearinghouseOps, captures: { d2: "$.data.id" } }
