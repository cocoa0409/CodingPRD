        distinguishing_aspect: "While the first assessment is still ASSESSED, a repeat for the same (account, jurisdiction, period_month) is refused with ERR_DUPLICATE_PROVISIONAL_ASSESSMENT (409); voiding the first releases the triple, so the third call succeeds and the ledger holds exactly one live assessment."
        test_recipe:
          setup:
            - "clock at 2026-08-15T00:00:00Z; device holding number 4301 with a VERIFIED registration effective 2026-08-15"
            - "one PROVISIONAL assessment for 2026-08 taken by billing-1"
