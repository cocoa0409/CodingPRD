    code: 200
    input: ["limit?", "offset?"]
    output: Holiday[]
    side_effects: []
  - method: POST
    path: "/accounts"
    description: "Create a residential service account in PENDING_START."
    roles: [Dispatcher]
    code: 201
    input: [plan_id, zone_id, service_address, holder_name]
    output: ServiceAccount
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List accounts; supports plan_id, zone_id, and transferred_from_account_id filters (reverse-reachability for ServiceAccount FKs incl. self-referential transfer link)."
    roles: [Dispatcher]
    code: 200
    input: ["limit?", "offset?", "plan_id?", "zone_id?", "transferred_from_account_id?"]
    output: ServiceAccount[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch one account; account_balance_cents and credit_balance_cents recomputed on read."
    roles: [Dispatcher, AccountHolder]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["recompute account_balance_cents, credit_balance_cents"]
  - method: POST
    path: "/accounts/{id}/carts"
    description: "Assign a cart to an account."
    roles: [Dispatcher]
    code: 201
    input: [cart_type, size_gallons]
    output: CartAssignment
    side_effects: ["recompute is_extra on this and sibling carts"]
  - method: GET
    path: "/accounts/{id}/carts"
    description: "List an account's carts (reverse-reachability for CartAssignment.account_id)."
    roles: [Dispatcher, AccountHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: CartAssignment[]
    side_effects: []
  - method: POST
    path: "/carts/{id}/remove"
    description: "Remove (deactivate) a cart."
    roles: [Dispatcher]
    code: 200
    input: []
    output: CartAssignment
    side_effects: ["set status REMOVED", "recompute is_extra on remaining carts", "increments CartAssignment.version by 1"]
  - method: POST
    path: "/accounts/{id}/activate-start"
    description: "Activate a PENDING_START account (start of service)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["set service_start_date", "generate PickupSchedule rows for next 28 days", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/suspend"
    description: "Suspend an ACTIVE account."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["cancel future PLANNED schedules", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/resume"
    description: "Resume a SUSPENDED account."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["regenerate PLANNED schedules for next 28 days", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/stop"
    description: "Stop service permanently (move-out without transfer)."
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["cancel PLANNED schedules", "remove carts", "expire ISSUED credits", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/transfer-out"
    description: "Transfer service to a new address; mints a new PENDING_START account and migrates ISSUED credits. OCC-guarded."
    roles: [Dispatcher]
    code: 201
    input: ["expected_account_version", "new_service_address", "new_zone_id", "new_plan_id?"]
    output: ServiceAccount
    side_effects: ["create destination ServiceAccount (transferred_from_account_id set)", "migrate ISSUED credits", "cancel PLANNED schedules", "remove carts", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/payment-method"
    description: "Attach a tokenized payment method to the account."
    roles: [Dispatcher, AccountHolder]
    code: 200
    input: [stored_payment_token]
    output: ServiceAccount
    side_effects: ["set stored_payment_token", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/autopay"
    description: "Enable or disable autopay on the account."
    roles: [Dispatcher, AccountHolder]
    code: 200
    input: [autopay_enabled]
    output: ServiceAccount
    side_effects: ["set autopay_enabled", "increments ServiceAccount.version by 1"]
  - method: POST
    path: "/accounts/{id}/invoices"
    description: "Generate a billing-period invoice for the account. OCC-guarded on account.version."
    roles: [Dispatcher]
    code: 201
    input: [expected_account_version, period_start, period_end, due_date]
    output: Invoice
    side_effects: ["compute gross/credit_applied/amount_due per §1.3 invoice_gross", "consume ISSUED credits (status APPLIED, applied_invoice_id set)", "increments ServiceAccount.version by 1"]
  - method: GET
    path: "/accounts/{id}/invoices"
    description: "List an account's invoices (reverse-reachability for Invoice.account_id)."
    roles: [Dispatcher, AccountHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch one invoice."
    roles: [Dispatcher, AccountHolder]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an OPEN or PAST_DUE invoice (exact amount)."
    roles: [AccountHolder, Dispatcher]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects: ["create Payment", "set invoice PAID", "re-evaluate account.billing_status", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an OPEN invoice, restoring any consumed credits."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Invoice
    side_effects: ["set invoice VOID", "restore consumed MissedPickupCredit to ISSUED", "increments Invoice.version by 1"]
  - method: GET
