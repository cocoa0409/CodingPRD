        distinguishing_aspect: |
          Different metric (elapsed seconds, not a count) on the same class of
          endpoint but distinct boundary: INCREMENTAL refresh at elapsed == 3599
          fails ERR_REFRESH_TOO_SOON while elapsed == 3600 exactly passes (<
          comparison), pinned against the institution-capacity boundary's >=
