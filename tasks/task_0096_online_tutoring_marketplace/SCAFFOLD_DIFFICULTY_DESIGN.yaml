            - "Booking ${booking_id}.status remains SCHEDULED"

      # --- Instance 2: TutorSubjectTag approval depends on Credential state (different pair) ---
      - name: tag_approval_requires_verified_credential_for_subject
        grounds:
          - state_machines.TutorSubjectTag.PROPOSED_to_APPROVED
          - entities.Credential.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair TutorSubjectTag -> Credential (distinct from Booking->Tutor):
          approving a tag for a credential-gated subject succeeds only once the
          matching Credential is VERIFIED. With the credential still UNDER_REVIEW the
          approval fails; after verify it succeeds — the tag transition depends on a
          sibling Credential's state.
        test_recipe:
          setup:
            - "Tutor with an UNDER_REVIEW credential on a requires_credential subject and a PROPOSED tag on that subject."
          setup_api_calls:
