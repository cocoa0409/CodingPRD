      - name: extension_request_rejects_with_stale_case_version_not_invalid_case_state
        grounds:
          - validations.priority_7.ERR_STALE_CASE_VERSION
          - validations.priority_8.ERR_INVALID_CASE_STATE
          - concurrency_rules.extension-request-create-stale-case
        distinguishing_aspect: |
          The case is ELIGIBLE (extension requests require ACTIVE) and the payload carries the version the
          case had at creation, which two later writes have already superseded. The optimistic-concurrency
          gate sits at priority 7, above the lifecycle gate at priority 8, so the answer is 412
          ERR_STALE_CASE_VERSION even though the state precondition is also unsatisfiable; this is the only
          pair in the set where the winning rule is a concurrency rule rather than a business rule.
        test_recipe:
          setup:
            - "MIDDLE/IN_HOME rule PUBLISHED."
            - "HomeboundCase created (version v0 captured), certification submitted and ACCEPTED, so the case is ELIGIBLE and its version has advanced past v0."
            - "extension_count is 0 and the certification status is ACCEPTED, so no other extension precondition is violated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
