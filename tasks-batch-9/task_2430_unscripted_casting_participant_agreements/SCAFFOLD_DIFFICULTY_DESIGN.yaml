# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids × ≥2 instances = 22 instances.
# Every numeric assert below was computed by executing the §1.3 formulas.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: agreement_stipend_provisional_vs_final_diverge
        grounds:
          - calculations.agreement_stipend_commitment
          - entities.ParticipantAgreement.fields.provisional_stipend_cents
          - entities.ParticipantAgreement.fields.total_stipend_commitment_cents
          - state_machines.ParticipantAgreement.DRAFTED_to_SENT
          - state_machines.ParticipantAgreement.SENT_to_EXECUTED
          - calculations.production_stipend_rollup
        distinguishing_aspect: |
          Cost-accounting domain on ParticipantAgreement: for one unchanged row the
          PROVISIONAL variant (episodes_used = max(6, episode_order 10) = 10, tier 1.30,
          press count +2 reserve, reunion assumed, no depiction discount) yields
          3,945,000 while the FINAL variant (episodes_committed 6, tier 1.15, contracted
          press 2, actual reunion, LIMITED −5%) yields 2,106,625; only FINAL enters
          production_stipend_rollup, so stipend_committed_cents is 2,106,625 not 3,945,000.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One COMPETITION_HIGH_STRESS / CA production with episode_order 10, stipend_pool_cents 50,000,000."
            - "One PUBLISHED REFERRAL casting call; one adult applicant fully CLEARED with medical_status CLEARED and final_risk_score 0.00."
            - "One DRAFTED agreement: base_stipend_cents 250,000, episodes_committed 6, exclusivity 90 days, 2 press appearances, reunion true, depiction LIMITED."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S1", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 1, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 18, max_age: 45, exclusivity_window_days: 90 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "CA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 90, confidentiality_tier: "ENHANCED", depiction_rights_scope: "LIMITED", stipend_structure: "PER_EPISODE", base_stipend_cents: 250000, episodes_committed: 6, press_appearance_obligation_count: 2, reunion_obligation: true, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /casting/participant-agreements/${agr_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { prov_after_send: $.data.provisional_stipend_cents }
            - call: "POST /casting/participant-agreements/${agr_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_2"
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
              captures: { committed: $.data.stipend_committed_cents }
          assert:
            - "${prov_after_send} == 3945000"
            - "ParticipantAgreement.${agr_id}.provisional_stipend_cents == 3945000"
            - "ParticipantAgreement.${agr_id}.total_stipend_commitment_cents == 2106625"
            - "ParticipantAgreement.${agr_id}.provisional_stipend_cents - ParticipantAgreement.${agr_id}.total_stipend_commitment_cents == 1838375"
            - "${committed} == 2106625"
            - "Production.${prod_id}.stipend_committed_cents == 2106625"
            - "Production.${prod_id}.casting_posture == OPEN"

      - name: applicant_risk_ceiling_vs_decayed_diverge
        grounds:
          - calculations.applicant_risk_score
          - entities.Applicant.fields.provisional_risk_score
          - entities.Applicant.fields.final_risk_score
          - entities.Applicant.fields.enhanced_support_required
          - entities.ScreeningItem.fields.recorded_at
        distinguishing_aspect: |
          Risk-scoring domain on Applicant, not cost accounting on an agreement: the same
          four recorded screening items give PROVISIONAL_CEILING 10.00 (no recency decay)
          and FINAL_DECAYED 7.45 (recorded_at DESC weighted 1.00/0.80/0.60/0.50), and
          because 7.45 < 8.00 the FINAL variant leaves enhanced_support_required false
          where the ceiling variant would have crossed the threshold.
        test_recipe:
          setup:
            - "One COMPETITION_HIGH_STRESS / CA production (so psych_eval_required is true) with a PUBLISHED REFERRAL call."
            - "One adult applicant with three screening items already recorded on distinct clock instants: INTERVIEW CONDITIONAL severity 2 at 2026-08-01, BACKGROUND_CHECK CONDITIONAL severity 3 at 2026-08-02, MEDICAL_EXAM PASS severity 0 at 2026-08-03."
            - "The logical clock is at 2026-08-04T00:00:00Z so the fourth item lands last in recorded_at order."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S1 Risk", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 1, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 18, max_age: 45, exclusivity_window_days: 90 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ben Ortiz", date_of_birth: "1994-04-02", residency_state_code: "CA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "CONDITIONAL", severity_flags: 2, conditional_conditions: "producer follow-up interview required" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProductionAdmin
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "CONDITIONAL", severity_flags: 3, conditional_conditions: "three sealed misdemeanour records" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ProductionAdmin
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ProductionAdmin
          trigger:
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "CONDITIONAL", severity_flags: 2, conditional_conditions: "on-set psychologist check-ins" }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov: $.data.provisional_risk_score, fin: $.data.final_risk_score }
          assert:
            - "${prov} == 10.00"
            - "${fin} == 7.45"
            - "Applicant.${app_id}.provisional_risk_score == 10.00"
            - "Applicant.${app_id}.final_risk_score == 7.45"
            - "Applicant.${app_id}.provisional_risk_score != Applicant.${app_id}.final_risk_score"
            - "Applicant.${app_id}.enhanced_support_required == false"
            - "Applicant.${app_id}.screening_status == CLEARED"
            - "Applicant.${app_id}.medical_status == CLEARED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: stipend_formula_tier_jump_and_depiction_branch_mode_a
        grounds:
          - calculations.agreement_stipend_commitment
          - entities.ParticipantAgreement.fields.episodes_committed
          - entities.ParticipantAgreement.fields.depiction_rights_scope
          - entities.Production.fields.format_type
          - state_machines.ParticipantAgreement.SENT_to_EXECUTED
        distinguishing_aspect: |
          Mode (a) — five inputs interacting non-linearly: crossing episodes_committed
          4 -> 5 lifts tier_multiplier 1.00 -> 1.15 (a 25% episode increase produces a
          43.75% base increase), the COMPETITION_HIGH_STRESS branch adds a 10% hazard
          uplift computed on the already-rounded base component, and the depiction
          branch subtracts 12% of the whole subtotal, giving 1,320,000 vs 1,669,800 for
          two rows whose PROVISIONAL variants are byte-identical at 4,490,000.
        test_recipe:
          setup:
            - "One COMPETITION_HIGH_STRESS / CA production, episode_order 10, stipend_pool_cents 50,000,000."
            - "Two adult applicants on the same PUBLISHED REFERRAL call, both CLEARED with medical_status CLEARED."
            - "Applicant Cara: base 300,000, episodes_committed 4, exclusivity 0, no press, no reunion, depiction FULL."
            - "Applicant Dev: base 300,000, episodes_committed 5, exclusivity 0, no press, no reunion, depiction PSEUDONYMIZED."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S2", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 2, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 18, max_age: 45, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Cara Lin", date_of_birth: "1994-04-02", residency_state_code: "CA" }
              as: CastingDirector
              captures: { app_c_id: $.data.id }
            - call: "POST /casting/applicants/${app_c_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_c_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_c_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_c_id}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Dev Roy", date_of_birth: "1993-11-08", residency_state_code: "CA" }
              as: CastingDirector
              captures: { app_d_id: $.data.id }
            - call: "POST /casting/applicants/${app_d_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_d_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_d_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_d_id}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "GET /casting/applicants/${app_c_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_c_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_c_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 300000, episodes_committed: 4, press_appearance_obligation_count: 0, reunion_obligation: false, expected_applicant_version: "${app_c_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_c_id: $.data.id }
            - call: "GET /casting/applicants/${app_d_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_d_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_d_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "PSEUDONYMIZED", stipend_structure: "PER_EPISODE", base_stipend_cents: 300000, episodes_committed: 5, press_appearance_obligation_count: 0, reunion_obligation: false, expected_applicant_version: "${app_d_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_d_id: $.data.id }
          trigger:
            - call: "POST /casting/participant-agreements/${agr_c_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { prov_c: $.data.provisional_stipend_cents }
            - call: "POST /casting/participant-agreements/${agr_c_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_2"
              captures: { final_c: $.data.total_stipend_commitment_cents }
            - call: "POST /casting/participant-agreements/${agr_d_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { prov_d: $.data.provisional_stipend_cents }
            - call: "POST /casting/participant-agreements/${agr_d_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_2"
              captures: { final_d: $.data.total_stipend_commitment_cents }
          assert:
            - "${final_c} == 1320000"
            - "${final_d} == 1669800"
            - "${prov_c} == 4490000"
            - "${prov_d} == 4490000"
            - "${prov_c} == ${prov_d}"
            - "ParticipantAgreement.${agr_c_id}.total_stipend_commitment_cents == 1320000"
            - "ParticipantAgreement.${agr_d_id}.total_stipend_commitment_cents == 1669800"
            - "Production.${prod_id}.stipend_committed_cents == 2989800"

      - name: trust_installments_rounded_per_installment_then_summed_mode_b
        grounds:
          - calculations.minor_trust_deposit_schedule
          - entities.MinorProtection.fields.per_installment_cents
          - entities.MinorProtection.fields.trust_deposited_cents
          - calculations.trust_escrow_rollup
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order is pinned: 2,106,625 x 0.15 = 315,993.75
          divided into 6 installments rounds per installment to 52,666 and sums to
          315,996, whereas the forbidden sum-then-round order (round 315,993.75 to
          315,994 first) yields 315,994; the 2-cent difference is the observable.
        test_recipe:
          setup:
            - "COMPETITION_HIGH_STRESS / CA production, episode_order 10, minor_participant_cap 2, stipend_pool_cents 50,000,000."
            - "One minor applicant (DOB 2011-05-20, age 15 at photography start) with guardian recorded."
            - "A MinorProtection packet with status COMPLETE: work permit valid to 2027-03-31, 15 education hours weekly, trust_deposit_pct 0.15 (both at the CA minimums)."
            - "The minor's agreement is EXECUTED with total_stipend_commitment_cents 2,106,625."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Teen Trials S1", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 1, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 45, exclusivity_window_days: 90 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Hana Kim", date_of_birth: "2011-05-20", residency_state_code: "CA", guardian_name: "Iris Kim" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/minor-protections"
              payload: { work_permit_number: "CA-WP-88001", permit_expires_on: "2027-03-31", education_hours_scheduled_weekly: 15, trust_deposit_pct: 0.15 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mp_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 90, confidentiality_tier: "ENHANCED", depiction_rights_scope: "LIMITED", stipend_structure: "PER_EPISODE", base_stipend_cents: 250000, episodes_committed: 6, press_appearance_obligation_count: 2, reunion_obligation: true, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id }
            - call: "POST /casting/participant-agreements/${agr_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
            - call: "POST /casting/participant-agreements/${agr_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_2"
              captures: { final_cents: $.data.total_stipend_commitment_cents }
          trigger:
            - call: "POST /casting/minor-protections/${mp_id}/trust-deposits"
              payload: { installment_count: 6 }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { per_inst: $.data.per_installment_cents, deposited: $.data.trust_deposited_cents }
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
              captures: { escrow: $.data.trust_escrow_balance_cents }
          assert:
            - "${final_cents} == 2106625"
            - "${per_inst} == 52666"
            - "${deposited} == 315996"
            - "${deposited} != 315994"
            - "MinorProtection.${mp_id}.per_installment_cents == 52666"
            - "MinorProtection.${mp_id}.trust_deposited_cents == 315996"
            - "MinorProtection.${mp_id}.installment_count == 6"
            - "${escrow} == 315996"
            - "Production.${prod_id}.trust_escrow_balance_cents == 315996"

      - name: welfare_band_read_from_presurcharge_subtotal_mode_c
        grounds:
          - calculations.welfare_commitment_rollup
          - entities.Production.fields.welfare_committed_cents
          - entities.Production.fields.duty_of_care_tier
          - endpoints[POST /casting/productions/{id}/welfare-protocols]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order:
          welfare_committed_cents = subtotal + surcharge, but the surcharge's band rate
          is selected from the PRE-surcharge subtotal. With subtotal 4,900,000 and tier
          ENHANCED the pinned order gives band 0.04 -> surcharge 294,000 -> committed
          5,194,000, while reading the band off the post-surcharge total (5,194,000 >=
          5,000,000 -> band 0.07) would give 5,414,500.
        test_recipe:
          setup:
            - "One COMPETITION_HIGH_STRESS production, so duty_of_care_tier is ENHANCED (tier_factor 1.5) from creation, welfare_budget_cents 10,000,000."
            - "One PLANNED DUTY_OF_CARE_OFFICER protocol costing 2,400,000 already filed (subtotal 2,400,000, committed 2,544,000)."
          setup_api_calls:
