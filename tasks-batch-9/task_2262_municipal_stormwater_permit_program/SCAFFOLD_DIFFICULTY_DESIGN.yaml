  - rule_id: non_linear_state_machine
    instances:

      - name: illicit_discharge_case_reopen_cycle_clears_source_and_counts_attempts
        grounds:
          - state_machines.IllicitDischargeCase.SOURCE_IDENTIFIED_to_TRACING
          - state_machines.IllicitDischargeCase.TRACING_to_SOURCE_IDENTIFIED
          - entities.IllicitDischargeCase.fields.reopen_count
          - entities.IllicitDischargeCase.fields.tracing_attempt_count
          - entities.IllicitDischargeCase.fields.source_description
        distinguishing_aspect: |
          Cyclic re-entry: the case returns to a state it already occupied (TRACING) and the
          second visit is NOT idempotent — source_description and responsible_party are cleared
          to null while tracing_attempt_count reaches 3 and reopen_count reaches 2, proving the
          machine counts loops rather than treating the revisit as a no-op.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures and outfall OF-01"
            - "a SUSPECT dry-weather screening at OF-01 has cascaded an IllicitDischargeCase into OPEN"
            - "the case has been traced once and a source identified, then reopened once and re-identified"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
              captures: { id_measure_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
              captures: { of1_id: $.data.id }
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/outfalls/${of1_id}/observations"
              payload: { observation_type: "DRY_WEATHER_SCREENING", observed_at: "2026-08-01T08:00:00Z", dry_weather_flow_present: true, indicator_bacteria_mpn: 5000, indicator_surfactant_mg_per_l: 0.60 }
              as: IDDEInvestigator
              as_user_id: "idde-01"
              captures: { scr1_id: $.data.id }
            - call: "GET /stormwater/illicit-discharge-cases"
              payload: { outfall_id: "${of1_id}", status: "OPEN" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
              captures: { case1_id: "$.data[0].id" }
            - call: "POST /stormwater/illicit-discharge-cases/${case1_id}/start-tracing"
              payload: { trace_method: "DYE_TEST" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
            - call: "POST /stormwater/illicit-discharge-cases/${case1_id}/identify-source"
              payload: { source_description: "Floor drain cross-connection at 14 Mill Rd", responsible_party: "Mill Road Laundry" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
            - call: "POST /stormwater/illicit-discharge-cases/${case1_id}/reopen-tracing"
              payload: { reason: "Dye did not resurface at the suspected connection" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
            - call: "POST /stormwater/illicit-discharge-cases/${case1_id}/identify-source"
              payload: { source_description: "Grease interceptor overflow at 22 Mill Rd", responsible_party: "Mill Road Diner" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
          trigger:
            - call: "POST /stormwater/illicit-discharge-cases/${case1_id}/reopen-tracing"
              payload: { reason: "Second source hypothesis also failed smoke testing" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
          assert:
            - "IllicitDischargeCase.${case1_id}.status == TRACING for the third time"
            - "IllicitDischargeCase.${case1_id}.reopen_count == 2 and tracing_attempt_count == 3"
            - "IllicitDischargeCase.${case1_id}.source_description == null and responsible_party == null"
            - "IllicitDischargeCase.${case1_id}.origin_observation_id == ${scr1_id}: the cycle never detaches the case from the screening that opened it"
            - "Outfall.${of1_id}.screening_status == SUSPECT and open_case_count == 1: the loop does not change the outfall census"
            - "ControlMeasure.${id_measure_id}.open_case_count == 1 and goal_status == PENDING"

      - name: construction_site_plan_and_field_dimensions_advance_independently
