      - name: biennial_update_clears_delinquency_and_pushes_the_deadline_out_730_days
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /carriers/{id}/biennial-update]
          - entities.Carrier.fields.biennial_update_due_at
          - entities.Carrier.fields.biennial_delinquent
        distinguishing_aspect: "The new deadline is measured from the update instant, not from the missed one: an update accepted at 2028-08-01 sets biennial_update_due_at to 2030-08-01T00:00:00.000Z (current_utc + 730 days) rather than 2030-07-31, and clears biennial_delinquent."
        test_recipe:
          setup:
            - "one carrier created at 2026-08-01, so biennial_update_due_at == 2028-07-31T00:00:00.000Z"
            - "clock advanced to 2028-08-01 and one sweep run, so biennial_delinquent == true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Sabine Crossing Motor Lines LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c51_id: $.data.id, c51_due_at: $.data.biennial_update_due_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /compliance-sweeps"
