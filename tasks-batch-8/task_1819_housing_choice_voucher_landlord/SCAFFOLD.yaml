  - method: GET
    path: "/hcv/inspections/{id}/repair-items"
    description: "List repair items for an inspection (reverse-reachability for RepairItem.inspection_id)"
    roles: [HousingAuthorityAdmin, Landlord, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: RepairItem[]
    side_effects: []

  - method: POST
    path: "/hcv/inspections/{id}/repair-items"
    description: "Attach a repair item to an inspection (must exist before FAIL result)"
    roles: [Inspector]
    code: 201
    input: [description, "is_life_threatening?"]
    output: RepairItem
    side_effects: []
  - method: POST
    path: "/hcv/repair-items/{id}/mark-repaired"
    description: "Landlord marks a repair item repaired"
    roles: [Landlord]
    code: 200
    input: []
    output: RepairItem
    side_effects: ["RepairItem OPEN/FAILED_VERIFICATION -> REPAIRED; increments RepairItem.version by 1"]
  - method: POST
    path: "/hcv/repair-items/{id}/verify"
    description: "Inspector verifies (PASS) or refutes (FAIL) a repaired item; last verify cascades closure and abatement cure"
    roles: [Inspector]
    code: 200
    input: [outcome]
    output: RepairItem
    side_effects: ["RepairItem REPAIRED -> VERIFIED or FAILED_VERIFICATION; on last VERIFIED: Inspection REPAIR_VERIFICATION -> CLOSED, contract ABATED -> ACTIVE with abatement_proration recompute, Unit SUSPENDED_ABATEMENT -> UNDER_CONTRACT; increments RepairItem.version by 1"]

  - method: POST
    path: "/hcv/rent-increase-requests"
    description: "Landlord requests a rent increase effective at/after next recert anniversary"
    roles: [Landlord]
    code: 201
    input: [contract_id, requested_rent_cents, effective_date]
    output: RentIncreaseRequest
    side_effects: []
  - method: GET
    path: "/hcv/rent-increase-requests/{id}"
    description: "Get rent increase request"
    roles: [HousingAuthorityAdmin, Landlord]
    code: 200
    input: []
    output: RentIncreaseRequest
    side_effects: []
  - method: POST
    path: "/hcv/rent-increase-requests/{id}/approve"
    description: "Approve a rent increase (rent reasonableness re-checked)"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: RentIncreaseRequest
    side_effects: ["RentIncreaseRequest PENDING -> APPROVED; HAPContract rents + portions recomputed; increments RentIncreaseRequest.version by 1"]
  - method: POST
    path: "/hcv/rent-increase-requests/{id}/deny"
    description: "Deny a rent increase"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: RentIncreaseRequest
    side_effects: ["RentIncreaseRequest PENDING -> DENIED; increments RentIncreaseRequest.version by 1"]
  - method: POST
    path: "/hcv/rent-increase-requests/{id}/withdraw"
    description: "Landlord withdraws a pending increase request"
    roles: [Landlord]
    code: 200
    input: []
    output: RentIncreaseRequest
    side_effects: ["RentIncreaseRequest PENDING -> WITHDRAWN; increments RentIncreaseRequest.version by 1"]

  - method: POST
    path: "/hcv/recertifications"
    description: "Open an annual recertification for a contract"
    roles: [HousingAuthorityAdmin]
    code: 201
    input: [contract_id, due_date, new_family_income_cents]
    output: Recertification
    side_effects: []
  - method: GET
    path: "/hcv/recertifications/{id}"
    description: "Get recertification"
    roles: [HousingAuthorityAdmin, Landlord]
    code: 200
    input: []
    output: Recertification
    side_effects: []
  - method: POST
    path: "/hcv/recertifications/{id}/complete"
    description: "Complete recertification: updates family income, recomputes portions, advances anniversary. Requires OCC expected_contract_version."
    roles: [HousingAuthorityAdmin]
    code: 200
    input: [expected_contract_version]
    output: Recertification
    side_effects: ["Recertification OPEN -> COMPLETED; VoucherFamily.annual_income_cents updated; hap_split recomputed; HAPContract.next_recert_due_date += 1 year; new Recertification auto-created; increments Recertification.version by 1; increments HAPContract.version by 1"]

  - method: POST
    path: "/hcv/hap-payments/{id}/disburse"
    description: "Disburse a scheduled HAP payment"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: HAPPayment
    side_effects: ["HAPPayment SCHEDULED -> PAID"]

  - method: POST
    path: "/hcv/portability-actions"
    description: "Initiate a portability action for a family"
    roles: [HousingAuthorityAdmin]
    code: 201
    input: [family_id, destination_zip, action_type]
    output: PortabilityAction
    side_effects: []
  - method: GET
    path: "/hcv/portability-actions/{id}"
    description: "Get portability action"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: PortabilityAction
    side_effects: []
  - method: POST
    path: "/hcv/portability-actions/{id}/accept-billing"
    description: "Accept billing arrangement for the port"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: PortabilityAction
    side_effects: ["PortabilityAction INITIATED -> BILLING_ACCEPTED; increments PortabilityAction.version by 1"]
  - method: POST
    path: "/hcv/portability-actions/{id}/absorb"
    description: "Absorb the ported family; PORT_OUT terminates the current contract (move-out cascade)"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: PortabilityAction
    side_effects: ["PortabilityAction BILLING_ACCEPTED -> ABSORBED; PORT_OUT: VoucherFamily LEASED -> PORTED_OUT, HAPContract ACTIVE -> TERMINATED; increments PortabilityAction.version by 1"]
  - method: POST
    path: "/hcv/portability-actions/{id}/terminate"
    description: "Terminate a portability action before billing acceptance"
    roles: [HousingAuthorityAdmin]
    code: 200
    input: []
    output: PortabilityAction
    side_effects: ["PortabilityAction INITIATED -> TERMINATED; increments PortabilityAction.version by 1"]

  - method: POST
    path: "/hcv/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server's current UTC instant. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock evaluates all date-driven system transitions (abatement on repair-deadline breach, recertification overdue)."
    roles: [HousingAuthorityAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["evaluates HAPContract ACTIVE -> ABATED for breached repair deadlines; evaluates Recertification OPEN -> OVERDUE"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role header, or missing X-User-ID for an entity_backed role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to call this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path or body id) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which the requested transition is defined"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent entity's current version"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting Landlord does not own the resource's property chain"
  - id: ERR_LANDLORD_SUSPENDED
    http: 409
    condition: "Landlord is SUSPENDED (or TERMINATED) and the operation requires ACTIVE"
  - id: ERR_INCREASE_TOO_EARLY
    http: 422
    condition: "Rent increase effective_date precedes the contract's next_recert_due_date"
  - id: ERR_SCHEDULE_IN_PAST
    http: 422
    condition: "Inspection scheduled_date precedes the current logical date"
  - id: ERR_VOUCHER_SIZE_MISMATCH
    http: 422
    condition: "Voucher bedroom size is smaller than unit bedroom count"
  - id: ERR_UNIT_ALREADY_UNDER_CONTRACT
    http: 409
    condition: "Unit already has a HAPContract in a non-terminal status"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Rent or income amount is non-positive where a positive value is required, or negative income"
  - id: ERR_RENT_NOT_REASONABLE
    http: 422
    condition: "Requested rent exceeds the rent-reasonableness ceiling"
  - id: ERR_FAIL_REQUIRES_ITEMS
    http: 422
    condition: "FAIL result submitted without any RepairItem attached to the inspection"
  - id: ERR_OPEN_REPAIR_ITEMS
    http: 409
    condition: "Reinspection requested while some RepairItems are not REPAIRED"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HousingAuthorityAdmin
    description: "Public housing authority staff; administers landlords, standards, contracts, payments, recertifications, portability, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /hcv/landlords, suspend, reinstate, terminate"
      - "POST /hcv/voucher-families, exit"
      - "POST /hcv/payment-standards"
      - "POST /hcv/rent-comparables"
      - "POST /hcv/contracts/{id}/activate, terminate"
      - "POST /hcv/contracts/{id}/inspections (schedule)"
      - "POST /hcv/rent-increase-requests/{id}/approve, deny"
      - "POST /hcv/recertifications, complete"
      - "POST /hcv/hap-payments/{id}/disburse"
      - "POST /hcv/portability-actions and all transitions"
      - "POST /hcv/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
      - "POST /hcv/properties, /hcv/properties/{id}/units (shared with Landlord)"
  - name: Landlord
    description: "Participating landlord; owns properties/units, initiates contracts, requests increases, repairs failed items"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /hcv/contracts, submit, withdraw"
      - "POST /hcv/units/{id}/delist"
      - "POST /hcv/inspections/{id}/request-reinspection"
      - "POST /hcv/repair-items/{id}/mark-repaired"
      - "POST /hcv/rent-increase-requests, withdraw"
    shared_operations:
      - "GET endpoints for own resources"
      - "POST /hcv/properties, /hcv/properties/{id}/units (shared with HousingAuthorityAdmin)"
  - name: Inspector
    description: "HQS inspector; records inspection results and verifies repairs"
    identity: "opaque"
    exclusive_operations:
      - "POST /hcv/inspections/{id}/record-result"
      - "POST /hcv/inspections/{id}/repair-items"
      - "POST /hcv/repair-items/{id}/verify"
    shared_operations:
      - "GET endpoints for inspections and contracts"
