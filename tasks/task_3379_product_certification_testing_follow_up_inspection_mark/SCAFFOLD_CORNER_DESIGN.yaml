              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [{ finding_ref: "FD-X", certification_id: "${cert2_id}", severity: "MAJOR", description: "Names factory B's certification while inspecting factory A" }] }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
          assert:
