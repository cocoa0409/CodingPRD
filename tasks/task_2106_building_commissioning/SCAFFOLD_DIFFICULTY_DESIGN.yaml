# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2106 — Building Commissioning & Systems Verification
# Nine rule_ids from SKILL.md 0.5, two instances each (18 total).
# Every numeric literal in `assert:` was produced by executing the matching
# calculations[].formula against its constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: acceptance_score_provisional_vs_final_diverge_on_same_project
        grounds:
          - calculations.acceptance_completion_score
          - entities.CxProject.fields.acceptance_completion_score
          - entities.CxProject.fields.final_acceptance_score
          - state_machines.FunctionalTest.IN_PROGRESS_to_PASSED_WITH_EXCEPTIONS
          - state_machines.CloseoutDeliverable.DELIVERED_to_ACCEPTED
        distinguishing_aspect: |
          On one unchanged project the PROVISIONAL variant reads 85.00 while the
          FINAL variant reads 60.00, because PROVISIONAL credits a
          PASSED_WITH_EXCEPTIONS test at 1.0 and a still-PLANNED seasonal test at
          0.5 whereas FINAL scores them 0.5 and 0.0; this instance's subject is
          completion accounting on CxProject, a different entity domain from the
          energy accounting instance below.
        test_recipe:
          setup:
            - "Project P (NEW_CONSTRUCTION, contract_value_cents 100000000, witness_capacity 1) with one APPROVED OwnerRequirement R1 (target 10000, tolerance 5) pinned by an APPROVED CxPlan."
            - "EquipmentUnit E1 (weight_units 10) has a VERIFIED checklist, install_status STARTED_UP, one FunctionalTest recorded PASSED_WITH_EXCEPTIONS, and one ACCEPTED SYSTEMS_MANUAL_SECTION deliverable."
            - "EquipmentUnit E2 (weight_units 5) has a VERIFIED checklist and one PLANNED DeferredTest, and no closeout deliverable at all."
            - "Total weight is 15; readiness_posture is OPEN (only the auto-opened S3 issue exists, index 8.00)."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Northgate Cx", building_name: "Northgate Tower", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000, certification_target: "STANDARD", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /owner-requirements"
              payload: { project_id: "${p}", metric_key: "SUPPLY_AIRFLOW_CFM", target_value: 10000, tolerance_pct: 5, criticality: "CRITICAL" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { r1: $.data.id }
            - call: "POST /owner-requirements/${r1}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pv1: $.data.version }
            - call: "POST /cx-plans"
              payload: { project_id: "${p}", title: "Northgate Commissioning Plan", expected_project_version: "${pv1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pl: $.data.id }
            - call: "POST /cx-plans/${pl}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-1", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e1}", template_code: "PFC-AHU-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl1: $.data.id }
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Filters installed and clean", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "STARTED_UP" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /functional-tests"
              payload: { equipment_id: "${e1}", requirement_id: "${r1}", script_code: "FPT-AHU-01", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { ft1: $.data.id }
            - call: "POST /functional-tests/${ft1}/start"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /functional-tests/${ft1}/record-result"
              payload: { measured_value: 10600 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /closeout-deliverables"
              payload: { project_id: "${p}", deliverable_kind: "SYSTEMS_MANUAL_SECTION", title: "AHU-1 systems manual section", equipment_id: "${e1}" }
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { d1: $.data.id }
            - call: "POST /closeout-deliverables/${d1}/deliver"
              payload: { attendee_count: 0, duration_minutes: 0 }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /closeout-deliverables/${d1}/accept"
              payload: { attestation_note: "Manual section reviewed and accepted" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "CHW-1", system_type: "CHILLER", criticality: "STANDARD", contract_value_cents: 500000, weight_units: 5 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e2: $.data.id }
            - call: "POST /equipment-units/${e2}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e2}", template_code: "PFC-CHW-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl2: $.data.id }
            - call: "POST /prefunctional-checklists/${cl2}/items"
              payload: { item_code: "PFC-01", description: "Refrigerant charge verified", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl2}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl2}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl2}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /deferred-tests"
              payload: { equipment_id: "${e2}", requirement_id: "${r1}", season: "COOLING", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { dt1: $.data.id }
          trigger:
            - call: "GET /cx-projects/${p}/readiness"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "readiness.acceptance_completion_score_provisional == 85.00"
            - "readiness.acceptance_completion_score_final == 60.00"
            - "readiness.total_weight_units == 15"
            - "CxProject.${p}.acceptance_completion_score == 85.00"
            - "CxProject.${p}.final_acceptance_score is null (no acceptance certificate has been issued)"
            - "FunctionalTest.${ft1}.status == PASSED_WITH_EXCEPTIONS and FunctionalTest.${ft1}.outcome_deviation_pct == 6.00"
            - "EquipmentUnit.${e1}.verification_status == CONDITIONALLY_ACCEPTED and EquipmentUnit.${e1}.blocking_issue_count == 0"
            - "DeferredTest.${dt1}.status == PLANNED"

      - name: retro_savings_deemed_vs_measured_diverge_on_energy_baseline
        grounds:
          - calculations.retro_savings_estimate
          - entities.EnergyBaseline.fields.deemed_savings_kwh
          - entities.EnergyBaseline.fields.measured_savings_kwh
          - state_machines.EnergyBaseline.BASELINE_SET_to_POST_PERIOD_RECORDED
          - state_machines.EnergyBaseline.POST_PERIOD_RECORDED_to_CERTIFIED
        distinguishing_aspect: |
          The same retro-commissioning measure yields 46537.50 kWh under DEEMED
          and 19800.00 kWh under MEASURED from one identical row; the subject is
          energy accounting on EnergyBaseline, a different entity domain from the
          CxProject completion accounting of the instance above.
        test_recipe:
          setup:
            - "Project RP is a RETRO_COMMISSIONING engagement with certification_target STANDARD (so both variants are permitted)."
            - "One EnergyBaseline B1 with baseline_kwh 480000, baseline_hdd 3200, stipulated_kwh_per_hour 12.5, operating_hours 4380."
            - "Post-period metering recorded as post_kwh 410000 and post_hdd 2880."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Elmwood Retro-Cx", building_name: "Elmwood Plaza", project_type: "RETRO_COMMISSIONING", contract_value_cents: 40000000, certification_target: "STANDARD", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { rp: $.data.id }
            - call: "POST /energy-baselines"
              payload: { project_id: "${rp}", measure_code: "RCX-SAT-RESET", baseline_kwh: 480000, baseline_hdd: 3200, stipulated_kwh_per_hour: 12.5, operating_hours: 4380 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { b1: $.data.id }
            - call: "POST /energy-baselines/${b1}/post-period"
              payload: { post_kwh: 410000, post_hdd: 2880 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
          trigger:
            - call: "POST /energy-baselines/${b1}/certify-savings"
              payload: { variant: "MEASURED" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "EnergyBaseline.${b1}.deemed_savings_kwh == 46537.50"
            - "EnergyBaseline.${b1}.measured_savings_kwh == 19800.00"
            - "EnergyBaseline.${b1}.certified_savings_kwh == 19800.00"
            - "EnergyBaseline.${b1}.certified_variant == MEASURED"
            - "EnergyBaseline.${b1}.status == CERTIFIED"
            - "EnergyBaseline.${b1}.deemed_savings_kwh != EnergyBaseline.${b1}.measured_savings_kwh"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: retainage_rounds_per_issue_before_summing
        grounds:
          - calculations.issue_retainage_hold
          - entities.Issue.fields.retainage_hold_cents
          - entities.CxProject.fields.retainage_withheld_cents
          - validations[priority=33]
        distinguishing_aspect: |
          Mode (b) nested rounding: three issues on a 1000005-cent LIFE_SAFETY
          unit produce unrounded holds of 7500.0375, 30000.15 and 75000.375
          cents; rounding each to whole cents first and then summing yields
          112500, while summing first and rounding once yields 112501, and the
          scaffold pins the per-issue-first order.
        test_recipe:
          setup:
            - "Project P with contract_value_cents 100000000 (retainage cap 10000000 cents)."
            - "EquipmentUnit ELS with contract_value_cents 1000005 and criticality LIFE_SAFETY (factor 1.5)."
            - "Three OPEN issues against ELS with severities S3, S2 and S1."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Harbour Cx", building_name: "Harbour House", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000, certification_target: "NONE", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "FA-1", system_type: "FIRE_ALARM", criticality: "LIFE_SAFETY", contract_value_cents: 1000005, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { els: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S3", description: "Annunciator legend incomplete", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s3: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S2", description: "Battery calculation not submitted", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s2: $.data.id }
          trigger:
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S1", description: "Smoke detector spacing violates code", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s1: $.data.id }
          assert:
            - "Issue.${i_s3}.retainage_hold_cents == 7500"
            - "Issue.${i_s2}.retainage_hold_cents == 30000"
            - "Issue.${i_s1}.retainage_hold_cents == 75000"
            - "CxProject.${p}.retainage_withheld_cents == 112500"
            - "CxProject.${p}.retainage_withheld_cents != 112501 (sum-then-round is the wrong order)"
            - "readiness.retainage_cap_cents == 10000000"

      - name: credit_documentation_score_single_pass_tier_evaluation_order
        grounds:
          - calculations.credit_documentation_score
          - calculations.credit_evidence_freshness
          - entities.CertificationCredit.fields.provisional_tier
          - entities.CertificationCredit.fields.documentation_score
          - entities.CertificationCredit.fields.final_tier
          - state_machines.CloseoutDeliverable.DELIVERED_to_RETURNED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: tier depends on score and score
          depends on tier, and the scaffold pins a single top-to-bottom pass, so
          when one of four evidence rows goes stale the score is computed with
          the PROVISIONAL tier weight 0.85 giving 48.75 and a final_tier of NONE
          - a fixed-point re-evaluation using NONE's weight 0.40 would give 15.00
          instead.
        test_recipe:
          setup:
            - "Project P with a VERIFIED checklist on E1, E1 PREFUNCTIONAL_VERIFIED, and one ACCEPTED SYSTEMS_MANUAL_SECTION deliverable D1 plus one ACCEPTED TRAINING_SESSION deliverable D2."
            - "CertificationCredit C1 with required_evidence_count 4 and max_points 6.0, carrying four FRESH evidence rows: EQUIPMENT_VERIFICATION->E1, CHECKLIST->CL1, MANUAL_SECTION->D1, TRAINING->D2."
            - "At that point completeness_ratio is 1.0, provisional_tier GOLD, documentation_score 100.00 and final_tier GOLD."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Riverside Cx", building_name: "Riverside Labs", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000, certification_target: "STANDARD", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-2", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e1}", template_code: "PFC-AHU-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl1: $.data.id }
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Dampers stroke full range", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /closeout-deliverables"
              payload: { project_id: "${p}", deliverable_kind: "SYSTEMS_MANUAL_SECTION", title: "AHU-2 manual section", equipment_id: "${e1}" }
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { d1: $.data.id }
            - call: "POST /closeout-deliverables/${d1}/deliver"
              payload: { attendee_count: 0, duration_minutes: 0 }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /closeout-deliverables/${d1}/accept"
              payload: { attestation_note: "Accepted" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /closeout-deliverables"
              payload: { project_id: "${p}", deliverable_kind: "TRAINING_SESSION", title: "AHU-2 operator training", equipment_id: "${e1}", required_attendee_count: 5 }
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { d2: $.data.id }
            - call: "POST /closeout-deliverables/${d2}/deliver"
              payload: { attendee_count: 5, duration_minutes: 120 }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /closeout-deliverables/${d2}/accept"
              payload: { attestation_note: "Training witnessed" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /certification-credits"
              payload: { project_id: "${p}", credit_code: "EA-CX-FUNDAMENTAL", required_evidence_count: 4, max_points: 6.0 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { c1: $.data.id }
            - call: "POST /certification-credits/${c1}/evidence"
              payload: { evidence_type: "EQUIPMENT_VERIFICATION", evidence_ref_id: "${e1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { ev1: $.data.id }
            - call: "POST /certification-credits/${c1}/evidence"
              payload: { evidence_type: "CHECKLIST", evidence_ref_id: "${cl1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { ev2: $.data.id }
            - call: "POST /certification-credits/${c1}/evidence"
              payload: { evidence_type: "MANUAL_SECTION", evidence_ref_id: "${d1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { ev3: $.data.id }
            - call: "POST /certification-credits/${c1}/evidence"
              payload: { evidence_type: "TRAINING", evidence_ref_id: "${d2}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { ev4: $.data.id }
          trigger:
            - call: "POST /closeout-deliverables/${d2}/return"
              payload: { reason: "Attendance roster unsigned" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "CreditEvidence.${ev4}.is_stale == true"
            - "CreditEvidence.${ev1}.is_stale == false and CreditEvidence.${ev2}.is_stale == false and CreditEvidence.${ev3}.is_stale == false"
            - "CertificationCredit.${c1}.fresh_evidence_count == 3 and CertificationCredit.${c1}.stale_evidence_count == 1"
            - "CertificationCredit.${c1}.completeness_ratio == 0.75"
            - "CertificationCredit.${c1}.provisional_tier == SILVER"
            - "CertificationCredit.${c1}.documentation_score == 48.75"
            - "CertificationCredit.${c1}.final_tier == NONE"
            - "CertificationCredit.${c1}.status == IN_PREPARATION"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: submittal_review_resubmit_cycle_escalates_on_third_round
        grounds:
          - state_machines.Submittal.RECEIVED_to_REVISE_AND_RESUBMIT
          - state_machines.Submittal.REVISE_AND_RESUBMIT_to_RECEIVED
          - entities.Submittal.fields.review_round
          - entities.Submittal.fields.escalation_issue_id
          - validations[priority=30]
        distinguishing_aspect: |
          Submittal is a cyclic machine: RECEIVED -> REVISE_AND_RESUBMIT ->
          RECEIVED loops twice before the third REVISE_AND_RESUBMIT decision
          escalates by minting an S2 SUBMITTAL issue and locking further
          resubmission; the non-linearity lives on Submittal, a different entity
          from the parallel-dimension instance below.
        test_recipe:
          setup:
            - "Project P with contract_value_cents 100000000 and no equipment."
            - "Submittal S1 (DESIGN_DOCUMENT, project-wide) has been through two full review rounds, each ending REVISE_AND_RESUBMIT and each followed by a resubmit, so it is back in RECEIVED with review_round 3."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Beacon Cx", building_name: "Beacon Court", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000, certification_target: "NONE", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /submittals"
              payload: { project_id: "${p}", title: "AHU schedule", submittal_kind: "DESIGN_DOCUMENT" }
              as: DesignTeam
              as_user_id: "u-design-1"
              captures: { s1: $.data.id }
            - call: "POST /submittals/${s1}/review"
              payload: { decision: "REVISE_AND_RESUBMIT", comment: "Round 1 - coil capacity unsupported" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /submittals/${s1}/resubmit"
              payload: {}
              as: DesignTeam
              as_user_id: "u-design-1"
            - call: "POST /submittals/${s1}/review"
              payload: { decision: "REVISE_AND_RESUBMIT", comment: "Round 2 - still unsupported" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /submittals/${s1}/resubmit"
              payload: {}
              as: DesignTeam
              as_user_id: "u-design-1"
              captures: { round_after_second_resubmit: $.data.review_round }
          trigger:
            - call: "POST /submittals/${s1}/review"
              payload: { decision: "REVISE_AND_RESUBMIT", comment: "Round 3 - escalating" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { esc_issue: $.data.escalation_issue_id }
            - call: "POST /submittals/${s1}/resubmit"
              payload: {}
              as: DesignTeam
              as_user_id: "u-design-1"
              captures: { err: $.data.error_id }
          assert:
            - "${round_after_second_resubmit} == 3"
            - "Submittal.${s1}.status == REVISE_AND_RESUBMIT after the third review"
            - "Submittal.${s1}.review_round == 3"
            - "Submittal.${s1}.escalation_issue_id is not null"
