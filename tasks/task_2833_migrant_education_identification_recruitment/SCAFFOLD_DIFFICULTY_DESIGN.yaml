          - endpoints[POST /mep/service-deliveries]
        distinguishing_aspect: |
          A THIRD boundary in a THIRD unit - a two-decimal Decimal grid rather than points or
          dates - exercised on all four edges at once: 0.00 is rejected (strictly-greater-than
          zero), 0.25 is the smallest accepted value, 8.00 is accepted at the inclusive maximum,
          8.25 is rejected one increment above it, and 0.30 is rejected for being off the 0.25
          multiple even though it lies well inside the numeric range. Range-only checks pass the
          first four cases and fail the fifth.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one ELIGIBLE Student certified end-to-end with one ACTIVE SUMMER_PROGRAM ServicePlan"
