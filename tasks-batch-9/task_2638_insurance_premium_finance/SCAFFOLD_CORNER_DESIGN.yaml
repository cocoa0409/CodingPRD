            - call: "POST /agreements/${is_agr}/cancellation-notices"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-notice"
              captures: { is_notice_status: "$.data.status", is_notice_cured: "$.data.cured_date", is_notice_executed: "$.data.executed_date" }
          assert:
            - "EXPLICITLY CREATED MACHINES: ${is_lic_status} == 'ACTIVE' with ${is_lic_eff} == true, ${is_agent_status} == 'ACTIVE', ${is_agr_status} == 'DRAFT', ${is_pol_status} == 'PENDING_VERIFICATION', ${is_end_status} == 'PENDING' and ${is_pay_status} == 'POSTED'"
            - "THE INITIAL STATE IS UNREACHABLE FROM INPUT: none of these states was named in any request body, because §1.5 declares no `status` or `delinquency_stage` input on any create endpoint — every value above was chosen by the server"
            - "THE SECOND STATE DIMENSION HAS ITS OWN INITIAL STATE: ${is_agr_stage} == 'CURRENT', independent of status 'DRAFT'"
            - "MACHINES BORN INSIDE A SIDE EFFECT, WHICH NO CLIENT EVER POSTS: activation created six Installment rows and ${is_i1_status} == ${is_i6_status} == 'SCHEDULED' with ${is_i1_paid} == 0 — not PAST_DUE, not PAID, and the status filter 'SCHEDULED' returns total_count == 6"
            - "and the sweep created the late fee in OUTSTANDING: ${is_sweep_fees} == 1, ${is_fee_status} == 'OUTSTANDING', ${is_fee_amt} == 4497 == clamp(round_half_up(89941 * 500 / 10000), 500, 10000) — the fee is computed on the installment's full amount_cents even though 1000 cents had already been applied to it"
            - "${is_notice_status} == 'ISSUED' with ${is_notice_cured} == null and ${is_notice_executed} == null — a notice is born un-cured and un-executed"
            - "the immutable attestation row is born un-superseded: ${is_ver_superseded} == false"
            - "the endorsement is born unfinanced: ${is_end_financed_at} == null"
            - "ProducerAgent's machine declares no terminal_states at all, so ACTIVE is both its initial state and a state it can always return to; every other initial state above is non-terminal"

      - name: precondition_enforcement_submit_with_no_policies_and_suspended_agent
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PremiumFinanceAgreement.DRAFT_to_PENDING_VERIFICATION
          - validations.priority_29_ERR_NO_FINANCED_POLICIES
          - validations.priority_23_ERR_AGENT_SUSPENDED
          - errors[ERR_NO_FINANCED_POLICIES]
          - errors[ERR_AGENT_SUSPENDED]
        distinguishing_aspect: |
          Two DIFFERENT preconditions of the same transition are violated one at a time, so each maps
          to its own error rather than to a generic conflict: an agreement with policy_count == 0
          gives ERR_NO_FINANCED_POLICIES (422), and an agreement whose producing agency was suspended
          AFTER origination gives ERR_AGENT_SUSPENDED (422). The second is the interesting one — the
          agency was ACTIVE when the agreement row was written, so the precondition has to be
          evaluated at submit time against the agency's CURRENT status, not against a snapshot.
