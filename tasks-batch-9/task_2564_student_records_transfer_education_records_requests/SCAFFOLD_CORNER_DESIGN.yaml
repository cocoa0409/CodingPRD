              payload: { expected_cumulative_file_version: "${file_v}" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "GET /records-office/records-requests/${req_id}"
              payload: {}
              as: ReceivingRegistrar
              as_user_id: "${recv_district_id}"
          assert:
            - "the validate response itself already reports status == \"ASSEMBLING\" (the VALIDATED bubble happens inside the same call because the file was IN_ASSEMBLY)"
            - "trigger call 1's own response body reports FileComponent.status == \"CERTIFIED\" and certified_at == \"2026-08-01T00:00:00.000Z\""
            - "trigger call 2 reports assembly_status == \"COMPLETE\", completeness_pct == 100.0, certified_component_count == 3, total_page_count == 60, included_page_count == 60 and disclosable_page_count == 60"
            - "trigger call 3's own response body reports status == \"READY_FOR_RELEASE\", packet_status == \"SNAPSHOT\" and packet_page_count == 60 with no intervening read"
            - "trigger call 4 returns exactly the same status, packet_status and packet_page_count as trigger call 3's body"
            - "CumulativeFile.${file_id}.last_packet_snapshot_at == \"2026-08-01T00:00:00.000Z\" in the same read"
