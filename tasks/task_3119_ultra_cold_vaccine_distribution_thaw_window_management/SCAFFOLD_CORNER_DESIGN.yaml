        distinguishing_aspect: "The lapsed carton rate is reported to four decimal places with round_half_up and the tier-2 gate compares it inclusively at 0.25, so a program whose entire computed allocation lapses reports a rate of exactly 1.0000 and falls to tier 2 FROZEN rather than to tier 1."
        test_recipe:
          setup:
            - "The anchored base fixture with the window opened and then closed after the clock passes closes_at, so every one of the ten computed cartons lapses and released_cartons_to_date equals lapsed_carton_count."
