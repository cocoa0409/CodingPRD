          assert:
            - "TOUCHING RIGHT (gap 0): booking 11:00..13:00 behind an anchor that ends at 11:00 returns 409 ERR_BENCH_WINDOW_CONFLICT - half-open bounds alone would allow it, the changeover buffer does not"
            - "GAP 59 MINUTES: booking 11:59..13:00 returns 409 ERR_BENCH_WINDOW_CONFLICT - one minute short of the buffer is still a conflict"
            - "GAP EXACTLY 60 MINUTES: booking 12:00..14:00 returns 201 with TestSession.${right_id}.state == SCHEDULED and reserved_minutes == 120"
            - "TOUCHING LEFT (gap 0): booking 08:00..09:00 in front of an anchor that starts at 09:00 returns 409 ERR_BENCH_WINDOW_CONFLICT - the buffer applies on BOTH sides"
            - "GAP EXACTLY 60 MINUTES ON THE LEFT: booking 07:00..08:00 returns 201 with TestSession.${left_id}.reserved_minutes == 60"
            - "DIFFERENT RESOURCE: the exact window 11:00..13:00 that was refused on bench 1 is accepted on bench_index 2 - TestSession.${bench2_id}.state == SCHEDULED and reserved_minutes == 120 - because the resource key is (laboratory_id, bench_index)"
            - "The buffer never becomes reserved time: TestLaboratory.${lab_id}.reserved_bench_minutes == 420 (120 anchor + 120 right + 60 left + 120 bench 2), and the three refusals reserved nothing"
            - "GET /test-sessions?laboratory_id=${lab_id} returns exactly 4 sessions, all in state SCHEDULED"

      - name: one_device_cannot_attend_two_plugfests_sharing_a_utc_calendar_date
        grounds:
          - validations[priority=39]
          - validations[priority=40]
          - errors[ERR_PARTICIPATION_WINDOW_CONFLICT]
          - endpoints[POST /plugfest-participations]
        distinguishing_aspect: |
          INTERVAL SEMANTICS 2 - a DIFFERENT semantics on a DIFFERENT resource. Here the resource is the
          CertificationSubmission (one physical device), and the interval is the CLOSED UTC-CALENDAR-DATE
          range [DATE(window_start) .. DATE(window_end)], inclusive at both ends, with clock times
          entirely discarded. Two events whose instants are two hours apart still collide because they
          occupy the same date, while two events 60 minutes apart across midnight do NOT collide because
          their dates differ - the exact opposite of the bench rule's minute arithmetic. A multi-day
          event blocks every date it spans, and re-registering the same pair falls through to
          ERR_DUPLICATE_PARTICIPATION rather than being reported as a window conflict.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification, one AUTHORIZED host laboratory, one Member in good standing."
            - "One CertificationSubmission (the device) for that member, plus a SECOND submission of the same member used to prove the conflict is per-device, not per-member."
            - "Five REGISTRATION_OPEN Plugfests on that specification, all with registration_deadline 2026-10-01T00:00:00Z and min_distinct_vendors 2: PF_A 2026-10-05T09:00Z..2026-10-06T18:00Z (dates 10-05..10-06), PF_B 2026-10-06T20:00Z..2026-10-06T23:00Z (date 10-06), PF_C 2026-10-07T00:00Z..2026-10-07T18:00Z (date 10-07), PF_D 2026-10-04T09:00Z..2026-10-04T23:00Z (date 10-04), PF_E 2026-10-03T09:00Z..2026-10-05T09:00Z (dates 10-03..10-05)."
