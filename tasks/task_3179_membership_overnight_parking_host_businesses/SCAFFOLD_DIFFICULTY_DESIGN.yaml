            - call: "POST /api/stay-requests/${ra}/decisions"
              payload: { decision: "CONFIRM", site_id: "S1", expected_host_version: "${h_cs_v2}" }
              as: HostOperator
              as_user_id: "${h_cs}"
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_cs}", member_id: "${mb}", vehicle_id: "${vb}", arrival_date: "2026-07-10", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 1, same_day_hold: false }
