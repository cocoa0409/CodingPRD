          - calculations.weekly_hour_cap
        excluded_because:
          difficulty_instance: combinatorial_formula / weekly_hour_cap_nested_min_with_minor_and_education_branches
          rationale: "That §1.8 instance walks the nested min for a full-time enrolled minor, asserts the 600-minute education deduction and lands on ERR_EDUCATION_HOURS_RESERVED."

