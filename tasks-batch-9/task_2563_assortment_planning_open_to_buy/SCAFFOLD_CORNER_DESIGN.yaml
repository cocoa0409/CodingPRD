            - "GET /otb/reforecast-cycles filtered to category_plan_id ${plan_id} returns total_count 3, all CLOSED: the cap is three cycles, not three attempts"

      - name: zero_receipt_budget_blocks_approval_at_the_rounding_boundary
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RECEIPT_BUDGET_ZERO
          - validations[priority=38].ERR_RECEIPT_BUDGET_ZERO
          - calculations.plan_receipt_budget
        distinguishing_aspect: "The block is triggered purely by the department share cap rounding to zero, one cent either side of the half-up boundary: sales_target_cents 4 gives round_half_up(4 * 1200 / 10000) = round_half_up(0.48) = 0 and approval is refused, while sales_target_cents 5 gives round_half_up(0.6) = 1 and approval SUCCEEDS with receipt_budget_cents exactly 1. Both plans have identical role capacity 67,500,000 and turn capacity 63,281,250, so the outer min() is doing all the work. The accepted 1-cent plan also proves the budget gates approval without scaling the month ledger: its PlanMonth still comes out at otb_planned 18,200,000."
        test_recipe:
          setup:
            - "department WAPP with sales_target_cents 4 and department MENS with sales_target_cents 5, each with its own DESTINATION category and an otherwise identical SUBMITTED plan"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 4, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_a: $.data.id }
            - call: "POST /otb/departments"
              payload: { name: "Menswear", code: "MENS", fiscal_year: 2027, sales_target_cents: 5, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_b: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_a}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_a: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_b}", name: "Shirts", code: "SHRT", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_b: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_a}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_a: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_a}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m_a: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_a}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_a: $.data.id }
            - call: "PUT /otb/option-plans/${op_a}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 4000 }, { size_label: "L", size_sort_order: 2, pct_bps: 6000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_a}/submit"
              payload: { submission_note: "plan A" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { a_submitted: $.data.status }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_b}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_b: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_b}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m_b: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_b}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_b: $.data.id }
            - call: "PUT /otb/option-plans/${op_b}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 4000 }, { size_label: "L", size_sort_order: 2, pct_bps: 6000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_b}/submit"
              payload: { submission_note: "plan B" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /otb/category-plans/${plan_a}/approve"
              payload: { approval_note: "try to approve the zero-budget plan" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e_zero: $.data.error_id }
            - call: "GET /otb/category-plans/${plan_a}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { a_status: $.data.status, a_budget: $.data.receipt_budget_cents, a_approver: $.data.approved_by_user_id }
            - call: "GET /otb/plan-months/${m_a}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { ma_status: $.data.status, ma_planned: $.data.otb_planned_cents, ma_reserve: $.data.markdown_reserve_cents }
            - call: "GET /otb/option-plans/${op_a}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { opa_status: $.data.status, opa_total: $.data.option_slots_total }
            - call: "POST /otb/category-plans/${plan_b}/approve"
              payload: { approval_note: "one cent is still a budget" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { b_status: $.data.status, b_budget: $.data.receipt_budget_cents }
            - call: "GET /otb/plan-months/${m_b}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { mb_status: $.data.status, mb_planned: $.data.otb_planned_cents }
            - call: "GET /otb/option-plans/${op_b}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { opb_status: $.data.status, opb_total: $.data.option_slots_total, opb_target: $.data.target_units_per_option }
          assert:
            - "${a_submitted} == SUBMITTED before the trigger, so the approval fails on the budget and not on the plan's state"
            - "${e_zero} == ERR_RECEIPT_BUDGET_ZERO with HTTP 422: cost_of_goods 67,500,000, role capacity 67,500,000, turn capacity 63,281,250, dept_cap round_half_up(4 * 1200 / 10000) = 0, and min(0, 67,500,000) = 0"
            - "${a_status} == SUBMITTED with ${a_budget} and ${a_approver} both null: cascade-B link 1 never ran, so nothing was pinned on the plan"
            - "${ma_status} == DRAFT with ${ma_planned} == 0 and ${ma_reserve} == 0, and ${opa_status} == OPEN with ${opa_total} null: links 2 through 5 never ran either - a zero budget aborts the whole cascade, it does not distribute zero dollars"
            - "${b_status} == APPROVED with ${b_budget} == 1: round_half_up(5 * 1200 / 10000) = round_half_up(0.6) = 1, so one cent more of department target flips the same request from 422 to 200"
            - "${mb_status} == LOCKED_PLAN with ${mb_planned} == 18200000: the month ledger does NOT scale with the receipt budget - plan_month_open_to_buy never reads receipt_budget_cents, so a 1-cent budget still produces the full 18,200,000 of month-level open-to-buy"
            - "${opb_status} == SLOTTED with ${opb_total} == 2 and ${opb_target} == 276: tier_share round_half_up(1 * 3500 / 10000) = 0, budget_share 0, floor(0 / 576,000) = 0, and the MIN_SLOTS_PER_TIER floor of 2 still applies"

      - name: unauthorized_vendor_commit_is_a_409
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VENDOR_NOT_AUTHORIZED
        excluded_because:
          difficulty_instance: vendor_authorization_beats_lead_time_infeasible
          rationale: "The §1.8 instance already commits against a SUSPENDED and a PENDING vendor for ERR_VENDOR_NOT_AUTHORIZED, and pins its precedence over the ERR_LEAD_TIME_INFEASIBLE 422 on the same request; repeating the bare trigger here adds no coverage."

      - name: overlapping_overlay_windows_are_a_409
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OVERLAY_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: overlay_closed_window_separation_buffer
          rationale: "ERR_OVERLAY_WINDOW_CONFLICT is exercised there at exactly the 7-day buffer boundary on both sides, including the accepted 8-day gap, which subsumes any plain trigger case."

      - name: vendor_capacity_ceiling_is_a_409
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VENDOR_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: vendor_ship_window_half_open_capacity_aggregate
          rationale: "That instance triggers ERR_VENDOR_CAPACITY_EXCEEDED through the half-open ship-window overlap aggregate, and the aggregate_validation corner instance covers the max_open_units limb; the code has no third path."

      - name: overspending_a_month_is_a_422
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OTB_EXCEEDED
        excluded_because:
          difficulty_instance: otb_open_exact_cent_boundary_on_commitment_create
          rationale: "ERR_OTB_EXCEEDED is pinned there at the exact cent - equal cost accepted, one cent over rejected - which is strictly stronger than an isolated trigger."

      - name: a_size_cell_that_rounds_to_zero_is_a_422
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SIZE_CURVE_ZERO_CELL
        excluded_because:
          difficulty_instance: size_curve_zero_unit_cell_boundary
          rationale: "That instance already walks the thinnest viable share one basis point at a time, accepting the cell that rounds to 1 unit and rejecting the one that rounds to 0."

  # === 7. From Table 7 (RBAC) ===
  - section: rbac
    instances:
      - name: each_role_is_refused_every_other_roles_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - roles
          - errors.ERR_UNAUTHORIZED_ROLE
          - validations[priority=2].ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Five denials taken from five different roles' exclusive lists, each paired with the same call succeeding for its rightful owner, so the 403 cannot be a blanket refusal. Two of them also pin priority 2 above the business ladder: a MerchandisePlanner posting actuals to a LOCKED_PLAN month gets ERR_UNAUTHORIZED_ROLE and not ERR_PLAN_MONTH_NOT_OPEN, and a CategoryBuyer approving an already-APPROVED plan would get ERR_UNAUTHORIZED_ROLE and not ERR_INVALID_STATE. VendorRep is the sharpest case: its shared list contains only two GETs, so it is refused even a plain category-plan read."
        test_recipe:
          setup:
            - "the reference spine plus a SUBMITTED plan with one month and one option plan, an item, and an AUTHORIZED vendor with an ACTIVE category authorization"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
