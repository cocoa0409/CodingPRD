          The report is a pure projection with no stored row behind it, so the
          same URL must answer differently before and after a compensating
          renormalize: REVERSED accruals leave realized_cents, and un-matched
          lines leave BOTH sides of the ratio, yet invoice_spend_cents and
          unmatched_cases keep the volume. A report reading cached member
          counters instead of recomputing would still show 53839.
