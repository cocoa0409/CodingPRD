              as: Referee
            - call: "POST /credit/consumers/${rt_id}/content-quality-facets"
              payload: { topic: "accuracy_education", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "corner-round-rollup" }
              as: PlatformAdmin
            - call: "POST /credit/pre-qualification-decisions/${rt_dec}/present"
              payload: { channel: "WEB" }
              as: Consumer
              as_user_id: "${rt_id}"
