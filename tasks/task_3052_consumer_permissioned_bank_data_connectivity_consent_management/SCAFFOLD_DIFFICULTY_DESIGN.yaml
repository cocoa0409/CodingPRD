            - "4th refresh rejected: err4 == ERR_RATE_LIMITED with http 429 (count 3 >= limit 3)"
            - "The rejected refresh records NO RefreshJob execution: GET /connections/${conn_id}/refresh_jobs returns exactly 3 jobs"

      - name: boundary_cadence_elapsed_exactly_3600_passes
        grounds:
          - calculations.refresh_cadence_gate
