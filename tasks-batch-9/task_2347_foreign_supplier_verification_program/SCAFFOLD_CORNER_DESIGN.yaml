        claim_type: cross_entity
        excluded_because:
          difficulty_instance: pair_adequacy_planned_diverges_from_realized_after_one_attestation
          rationale: "The cross-entity side effect of attestation (record change → pair.adequacy_score_realized adjusts) is the entire subject of that §1.8 dual-variant instance, which asserts both variants before and after the attestation."

