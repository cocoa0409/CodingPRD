  - rule_id: compensating_invariant
    instances:
      - name: advance_recovery_ledger_conserved_across_pay_then_open_revision
        grounds:
          - calculations.advance_recovery_waterfall
          - state_machines.MealClaim.transitions[PAID->REVISION_OPENED]
          - entities.Sponsor.fields.advance_outstanding_cents
          - entities.AdvancePayment.fields.recovered_amount_cents
