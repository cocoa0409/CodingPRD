            - call: "POST /apportionment/registration-applications/${app1_id}/review"
              payload: { decision: "INVOICE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "RegistrationApplication.${app1_id}.fleet_total_distance_miles == 30000.0 and apportioned_vehicle_count == 1"
            - "DistanceScheduleLine.${dsl_il_id}.apportion_percent == 0.333333 and jurisdiction_fee_amount == 930.00"
            - "DistanceScheduleLine.${dsl_in_id}.apportion_percent == 0.666667 and jurisdiction_fee_amount == 1128.00"
            - "RegistrationApplication.${app1_id}.base_fee_total == 2058.00 and total_apportioned_fee == 2058.00"
            - "The percentages are stored as rounded, not scaled to force an exact 1.000000 sum"

      - name: the_gap_is_measured_against_the_chronological_predecessor_not_the_last_created_trip
        claim_type: chronological
        grounds:
          - calculations.mileage_gap_detection
          - calculations.mileage_gap_detection.algorithm
        distinguishing_aspect: "Trips are submitted out of order — A (04-05, 1000.0 -> 1300.0), then C (06-10, 1400.0 -> 1900.0) which gaps 100.0 against A, then B (05-10, 1300.0 -> 1350.0) which gaps 0.0 against A, not against the newest row C. A naive last-created predecessor would compute B's gap from C's 1900.0 and flag it."
        test_recipe:
          setup:
            - "One carrier and one vehicle; three trips submitted in the order A, C, B."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1300.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t_a_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-06-10T06:00:00Z", trip_end_utc: "2026-06-10T18:00:00Z", start_odometer: 1400.0, end_odometer: 1900.0, legs: [ { jurisdiction_code: "IL", leg_miles: 500.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t_c_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-05-10T06:00:00Z", trip_end_utc: "2026-05-10T12:00:00Z", start_odometer: 1300.0, end_odometer: 1350.0, legs: [ { jurisdiction_code: "IL", leg_miles: 50.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t_b_id: $.data.id }
          assert:
            - "TripRecord.${t_a_id}.gap_miles_from_previous == 0.0 and trip_status == CAPTURED (no predecessor)"
            - "TripRecord.${t_c_id}.gap_miles_from_previous == 100.0 and trip_status == GAP_FLAGGED"
            - "TripRecord.${t_b_id}.gap_miles_from_previous == 0.0 and trip_status == CAPTURED — measured against A, the chronological predecessor"
            - "TripRecord.${t_c_id}.gap_miles_from_previous is still 100.0 after B is inserted — the gap is stamped at submission and not retroactively re-derived"
            - "GET /apportionment/trip-records?vehicle_id=${v1_id}&trip_status=GAP_FLAGGED returns total_count == 1"

      - name: audit_basis_versus_preparer_basis_settlement
        claim_type: variant_divergence
        grounds:
          - calculations.quarterly_fuel_tax_settlement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / preparer_versus_audit_basis_quarterly_settlement_divergence
          rationale: "PREPARER_BASIS versus AUDIT_BASIS on identical data, and the audit_assessment_delta between them, is precisely that §1.8 instance's subject."

      - name: reconciliation_when_the_settlement_basis_switches
        claim_type: reconciliation
        grounds:
          - calculations.quarterly_fuel_tax_settlement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / preparer_versus_audit_basis_quarterly_settlement_divergence
          rationale: "The delta applied when the return is re-settled on the audit basis is asserted there; duplicating it here would test the same arithmetic twice."

      - name: registration_fee_on_the_estimated_versus_actual_distance_basis
        claim_type: variant_selection
        grounds:
          - calculations.apportioned_registration_fee.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / actual_versus_estimated_distance_basis_registration_fee_divergence
          rationale: "Selection between ESTIMATED_DISTANCE_BASIS and ACTUAL_DISTANCE_BASIS and the resulting fee divergence is the whole point of that §1.8 instance."

      - name: per_line_rounding_before_the_return_total
        claim_type: correct_result
        grounds:
          - calculations.quarterly_fuel_tax_settlement.rounding
        excluded_because:
          difficulty_instance: combinatorial_formula / net_tax_total_rounds_each_jurisdiction_line_before_summing
          rationale: "Round-then-sum versus sum-then-round on the jurisdiction lines is that §1.8 instance's discriminating fixture."

      - name: carrier_gallons_ledger_after_a_reversal
        claim_type: aggregation
        grounds:
          - calculations.tax_paid_gallons_by_jurisdiction
        excluded_because:
          difficulty_instance: compensating_invariant / carrier_tax_paid_gallons_ytd_restored_exactly_by_purchase_disallow
          rationale: "Running-total correctness after add and after disallow is asserted end-to-end in that §1.8 instance."

      - name: adjacent_trip_intervals_do_not_overlap
        claim_type: interval_merge
        grounds:
          - validations[32].ERR_TRIP_INTERVAL_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vehicle_trip_intervals_are_half_open_so_adjacency_is_allowed
          rationale: "The gap-zero adjacency case and the one-second overlap case are both covered by that §1.8 boundary instance."

      - name: risk_score_weights_and_saturation
        claim_type: weighted_scoring
        grounds:
          - calculations.audit_risk_score
        excluded_because:
          difficulty_instance: combinatorial_formula / audit_risk_score_saturating_min_max_lands_on_inclusive_threshold
          rationale: "Weight summation, single-rounding of the unrounded components and the min/max clamp landing on an inclusive threshold are that §1.8 instance."

      - name: gap_detection_at_the_five_mile_tolerance
        claim_type: threshold
        grounds:
          - calculations.mileage_gap_detection.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / gap_of_exactly_five_miles_stays_captured_and_five_point_one_flags
          rationale: "The exact 5.0 / 5.1 tolerance boundary is that §1.8 instance's discriminating pair."

      - name: reconstructed_mileage_penalty_at_the_ten_percent_ratio
        claim_type: threshold
        grounds:
          - calculations.reconstructed_mileage_penalty
        excluded_because:
          difficulty_instance: boundary_precision_check / reconstructed_mileage_ratio_exactly_ten_percent_attracts_no_penalty
          rationale: "The inclusive/exclusive behaviour at a ratio of exactly 0.1000 is that §1.8 instance."

  # =====================================================================
  # SECTION 4 — VALIDATIONS (claim-extraction-guide Table 4)
  # =====================================================================
  - section: validations
    instances:

      - name: an_empty_x_user_id_header_is_unauthenticated_before_any_role_check
        claim_type: violation_to_error
        grounds:
          - validations[1].ERR_UNAUTHENTICATED
          - validations[2].ERR_FORBIDDEN_ROLE
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 treats a present-but-empty X-User-ID as absent, so a MileageAnalyst call with an empty user id returns ERR_UNAUTHENTICATED 401 — not the 403 the role check would give and not a 500."
        test_recipe:
          setup:
            - "One carrier and one vehicle exist."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: MileageAnalyst
              as_user_id: ""
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 401 and body.data.error_id == 'ERR_UNAUTHENTICATED'"
            - "body.response_type == 'error' and body.meta.api_request_id is present"
            - "GET /apportionment/trip-records?carrier_id=${c1_id} returns total_count == 0 — nothing was persisted"

      - name: a_leg_in_an_undeclared_jurisdiction_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[14].ERR_JURISDICTION_NOT_DECLARED
          - errors[ERR_JURISDICTION_NOT_DECLARED]
        distinguishing_aspect: "A leg naming a syntactically valid but unregistered jurisdiction code returns ERR_JURISDICTION_NOT_DECLARED 422 — distinct from a not-found path id and distinct from a shape error — and the whole trip create is rolled back so no partial legs remain."
        test_recipe:
          setup:
            - "Only IL is declared as a jurisdiction."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "ZZ", leg_miles: 100.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422 and body.data.error_id == 'ERR_JURISDICTION_NOT_DECLARED'"
            - "GET /apportionment/trip-records?carrier_id=${c1_id} returns total_count == 0 — the valid IL leg was not partially committed"

      - name: reconstruction_leg_sums_pass_at_exactly_half_a_mile_and_fail_at_six_tenths
        claim_type: satisfaction_to_pass
        grounds:
          - validations[34].ERR_LEG_MILEAGE_MISMATCH
          - state_machines.TripRecord.transitions.GAP_FLAGGED_to_RECONSTRUCTED
        distinguishing_aspect: "The reconstruction target is odometer_delta_miles 300.0 plus gap_miles_from_previous 100.0 = 400.0 with a 0.5-mile tolerance: legs summing 400.6 return ERR_LEG_MILEAGE_MISMATCH 422 and leave the trip GAP_FLAGGED, while legs summing exactly 400.5 are accepted and stamp accepted_leg_miles_total 400.5."
        test_recipe:
          setup:
            - "A GAP_FLAGGED trip: predecessor ends at odometer 1000.0, the flagged trip runs 1100.0 -> 1400.0, so gap_miles_from_previous is 100.0 and odometer_delta_miles is 300.0."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 700.0, end_odometer: 1000.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-05-10T06:00:00Z", trip_end_utc: "2026-05-10T18:00:00Z", start_odometer: 1100.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t_gap_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records/${t_gap_id}/reconstruct"
              payload: { reconstructed_legs: [ { jurisdiction_code: "IL", leg_miles: 300.3 }, { jurisdiction_code: "IN", leg_miles: 100.3 } ], supporting_document_reference: "FUEL-LOG-88" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /apportionment/trip-records/${t_gap_id}/reconstruct"
              payload: { reconstructed_legs: [ { jurisdiction_code: "IL", leg_miles: 300.5 }, { jurisdiction_code: "IN", leg_miles: 100.0 } ], supporting_document_reference: "FUEL-LOG-88" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
          assert:
            - "TripRecord.${t_gap_id}.gap_miles_from_previous == 100.0 and odometer_delta_miles == 300.0"
            - "First reconstruct: HTTP 422 and body.data.error_id == 'ERR_LEG_MILEAGE_MISMATCH'; the trip is still GAP_FLAGGED with mileage_source TELEMATICS"
            - "Second reconstruct: HTTP 200; TripRecord.${t_gap_id}.trip_status == RECONSTRUCTED and mileage_source == MANUAL_RECONSTRUCTION"
            - "TripRecord.${t_gap_id}.accepted_leg_miles_total == 400.5 and supporting_document_reference == 'FUEL-LOG-88'"
            - "GET /apportionment/trip-records/${t_gap_id}/mileage-legs?leg_status=ACTIVE returns total_count == 2 — the 400.6 attempt left no legs behind"

      - name: a_second_return_for_the_same_quarter_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[27].ERR_DUPLICATE_RETURN_PERIOD
          - errors[ERR_DUPLICATE_RETURN_PERIOD]
        distinguishing_aspect: "The natural key is (carrier_id, filing_year, filing_quarter): a second DRAFT return for 2026 Q2 returns ERR_DUPLICATE_RETURN_PERIOD 409 while 2026 Q3 for the same carrier and 2026 Q2 for a different carrier both succeed."
        test_recipe:
          setup:
            - "Two carriers; carrier 1 already has a DRAFT 2026 Q2 return."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Lakeshore Haulage Inc", usdot_number: "USDOT-2637002", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c2_id: $.data.id }
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 2 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 2 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 3 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret_q3_id: $.data.id }
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c2_id}", filing_year: 2026, filing_quarter: 2 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret_c2_id: $.data.id }
          assert:
            - "First trigger: HTTP 409 and body.data.error_id == 'ERR_DUPLICATE_RETURN_PERIOD'"
            - "Second trigger: HTTP 201; FuelTaxReturn.${ret_q3_id}.filing_quarter == 3, whose window opens at 2026-07-01T00:00:00Z"
            - "Third trigger: HTTP 201; FuelTaxReturn.${ret_c2_id}.carrier_id == ${c2_id} — the key is carrier-scoped"
            - "GET /apportionment/fuel-tax-returns?carrier_id=${c1_id} returns total_count == 2"

      - name: a_carrier_admin_cannot_post_a_trip_for_another_carrier
        claim_type: cross_entity_validation
        grounds:
          - validations[15].ERR_CARRIER_SCOPE_VIOLATION
          - roles.CarrierAdmin.entity_backed
          - errors[ERR_CARRIER_SCOPE_VIOLATION]
        distinguishing_aspect: "CarrierAdmin is entity_backed on Carrier, so its X-User-ID is a carrier id: posting a trip whose carrier_id is carrier 1 while authenticated as carrier 2 returns ERR_CARRIER_SCOPE_VIOLATION 403 — the scope check is a body-versus-identity comparison, not a role check, and the same call inside its own scope succeeds."
        test_recipe:
          setup:
            - "Two carriers, each with one vehicle."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Lakeshore Haulage Inc", usdot_number: "USDOT-2637002", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c2_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c2_id}", unit_number: "L-201", vin: "1FUJA6CK21L102201", weight_group_code: "W80", factory_price_amount: 139000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v2_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: CarrierAdmin
              as_user_id: "${c2_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c2_id}", vehicle_id: "${v2_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 500.0, end_odometer: 900.0, legs: [ { jurisdiction_code: "IL", leg_miles: 400.0 } ] }
              as: CarrierAdmin
              as_user_id: "${c2_id}"
              captures: { t_ok_id: $.data.id }
          assert:
            - "First trigger: HTTP 403 and body.data.error_id == 'ERR_CARRIER_SCOPE_VIOLATION'"
            - "Second trigger: HTTP 201; TripRecord.${t_ok_id}.carrier_id == ${c2_id} and trip_status == CAPTURED"
            - "GET /apportionment/trip-records?carrier_id=${c1_id} returns total_count == 0"

      - name: an_effective_date_outside_the_registration_year_is_caught_at_decide_time
        claim_type: temporal_validation
        grounds:
          - validations[31].ERR_EFFECTIVE_DATE_OUT_OF_YEAR
          - calculations.fleet_change_fee_delta
          - errors[ERR_EFFECTIVE_DATE_OUT_OF_YEAR]
        distinguishing_aspect: "The effective_date must fall inside the application's registration_year, and the rule is enforced on decide rather than on create: the 2027-02-01 supplement is accepted as REQUESTED but APPROVE returns ERR_EFFECTIVE_DATE_OUT_OF_YEAR 422 and the fee stays at the invoiced 2350.80."
        test_recipe:
          setup:
