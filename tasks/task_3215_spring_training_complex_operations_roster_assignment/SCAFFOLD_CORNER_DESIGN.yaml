        distinguishing_aspect: "A sponsorship with 5000 of a 20000 commitment cannot settle and returns 422 ERR_SPONSORSHIP_NOT_FULLY_FUNDED, while the same sponsorship settles once the remaining 15000 lands."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with a DRAFT agreement carrying a host community record and one LOCAL sponsorship committed at 20000 with only 5000 contributed."
