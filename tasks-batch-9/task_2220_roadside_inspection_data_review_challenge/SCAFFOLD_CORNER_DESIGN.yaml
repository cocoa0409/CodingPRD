scaffold_corner_design:
  - section: entities
    instances:
      - name: carrier_creation_computes_segment_utilization_and_quota_limit
        claim_type: creation
        grounds:
          - entities.Carrier
          - endpoints[POST /carriers]
          - calculations.basic_measure_recompute.utilization_factor
          - calculations.challenge_quota_ledger
        distinguishing_aspect: |
          A carrier created with 20 power units and 1,600,000 VMT must come back with every derived
          field already populated in the create response: carrier_segment MEDIUM (16..100 power
          units), utilization_factor 1.5 (vmt_per_pu 80000 in the 60000..99999 tier),
          challenge_quota_limit 3 (MEDIUM), and the zero-state posture UNRATED / NONE / PASS.
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
          trigger:
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Carrier.${c1_id}.dot_number == 1000001"
            - "Carrier.${c1_id}.carrier_segment == MEDIUM"
            - "Carrier.${c1_id}.utilization_factor == 1.5"
            - "Carrier.${c1_id}.challenge_quota_limit == 3"
            - "Carrier.${c1_id}.challenge_quota_used == 0"
            - "Carrier.${c1_id}.safety_fitness_status == UNRATED"
            - "Carrier.${c1_id}.intervention_status == NONE"
            - "Carrier.${c1_id}.selection_band == PASS"
            - "Carrier.${c1_id}.iss_pre_credit_value == 0.0"
            - "Carrier.${c1_id}.iss_value == 0.0"
            - "Carrier.${c1_id}.open_alert_count == 0"
            - "Carrier.${c1_id}.scored_violation_count == 0"

      - name: inspection_report_get_returns_selection_snapshot
        claim_type: retrieval
        grounds:
          - entities.InspectionReport
          - endpoints[POST /inspection-reports]
          - endpoints[GET /inspection-reports/{id}]
        distinguishing_aspect: |
          The report freezes the carrier's screening posture at ingestion time into
          iss_value_at_selection 0.0 / selection_band_at_selection PASS and starts at RECEIVED with
          zeroed rollups and reattributed false, original_carrier_id null.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (20 power units, 1,600,000 VMT) with iss_value 0.0 and selection_band PASS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070101", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00101", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "GET /inspection-reports/${r1_id}"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { status_read: $.data.status }
          assert:
            - "after trigger[1]: HTTP status == 200"
            - "InspectionReport.${r1_id}.status == RECEIVED"
            - "InspectionReport.${r1_id}.attributed_carrier_id == ${c1_id}"
            - "InspectionReport.${r1_id}.iss_value_at_selection == 0.0"
            - "InspectionReport.${r1_id}.selection_band_at_selection == PASS"
            - "InspectionReport.${r1_id}.reattributed == false"
            - "InspectionReport.${r1_id}.original_carrier_id == null"
            - "InspectionReport.${r1_id}.duplicate_master_report_id == null"
            - "InspectionReport.${r1_id}.active_violation_count == 0"
            - "InspectionReport.${r1_id}.total_time_weighted_severity == 0.0"
            - "InspectionReport.${r1_id}.scored_at == null"
            - "InspectionReport.${r1_id}.severity_basis_utc == null"

      - name: violation_code_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /violation-codes]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three published codes and limit 2, page one carries exactly 2 rows with total_count 3
          and has_more true; offset 2 carries the single remaining row with has_more false - the
          total_count is the unpaginated count, not the page size.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; exactly three ViolationCode rows published: 392.2S (UNSAFE_DRIVING), 395.3A1 (HOURS_OF_SERVICE), 393.9TS (VEHICLE_MAINTENANCE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /violation-codes"
              payload: { code: "395.3A1", description: "11 hour driving limit exceeded", basic_category: "HOURS_OF_SERVICE", severity_weight: 5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /violation-codes"
              payload: { code: "393.9TS", description: "Inoperative tail lamp", basic_category: "VEHICLE_MAINTENANCE", severity_weight: 2 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
          trigger:
            - call: "GET /violation-codes"
              payload: { limit: 2, offset: 0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { first_code: "$.data[0].code" }
            - call: "GET /violation-codes"
              payload: { limit: 2, offset: 2 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { last_code: "$.data[0].code" }
            - call: "GET /violation-codes"
              payload: { basic_category: "UNSAFE_DRIVING" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { filtered_code: "$.data[0].code" }
          assert:
            - "after trigger[0]: HTTP status == 200"
            - "after trigger[0]: meta.total_count == 3"
            - "after trigger[0]: meta.has_more == true"
            - "after trigger[0]: len(data) == 2"
            - "after trigger[1]: meta.total_count == 3"
            - "after trigger[1]: meta.has_more == false"
            - "after trigger[1]: len(data) == 1"
            - "after trigger[2]: meta.total_count == 1"
            - "after trigger[2]: meta.has_more == false"
            - "after trigger[2]: data[0].code == 392.2S"

      - name: unknown_path_ids_return_entity_scoped_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_CARRIER_NOT_FOUND]
          - errors[ERR_DRIVER_NOT_FOUND]
          - errors[ERR_VIOLATION_CODE_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
          - errors[ERR_VIOLATION_NOT_FOUND]
          - errors[ERR_AMENDMENT_NOT_FOUND]
          - errors[ERR_CHALLENGE_NOT_FOUND]
          - errors[ERR_ADJUDICATION_NOT_FOUND]
          - errors[ERR_BASIC_SCORE_NOT_FOUND]
          - errors[ERR_COACHING_NOT_FOUND]
          - errors[ERR_CAP_NOT_FOUND]
          - errors[ERR_CAP_ITEM_NOT_FOUND]
          - errors[ERR_SCORING_RUN_NOT_FOUND]
        distinguishing_aspect: |
          Each path parameter resolves to its OWN 404 error_id rather than a single generic
          ERR_NOT_FOUND - thirteen distinct error identifiers, all HTTP 404, one per addressable
          resource family.
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z; no entity of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
          trigger:
            - call: "GET /carriers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_carrier: $.data.error_id }
            - call: "GET /drivers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_driver: $.data.error_id }
            - call: "GET /violation-codes/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_code: $.data.error_id }
            - call: "GET /inspection-reports/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_report: $.data.error_id }
            - call: "GET /violations/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_violation: $.data.error_id }
            - call: "GET /report-amendments/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_amendment: $.data.error_id }
            - call: "GET /data-challenges/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_challenge: $.data.error_id }
            - call: "GET /citation-adjudications/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_adjudication: $.data.error_id }
            - call: "GET /basic-scores/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_score: $.data.error_id }
            - call: "GET /coaching-assignments/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_coaching: $.data.error_id }
            - call: "GET /corrective-action-plans/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_cap: $.data.error_id }
            - call: "POST /cap-action-items/00000000-0000-4000-8000-000000000012/status"
              payload: { action: "COMMIT" }
              as: CarrierAnalyst
              as_user_id: "carrier_unknown"
              captures: { e_cap_item: $.data.error_id }
            - call: "GET /scoring-runs/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e_run: $.data.error_id }
          assert:
            - "every trigger returns HTTP status == 404"
            - "trigger[0]: error_id == ERR_CARRIER_NOT_FOUND"
            - "trigger[1]: error_id == ERR_DRIVER_NOT_FOUND"
            - "trigger[2]: error_id == ERR_VIOLATION_CODE_NOT_FOUND"
            - "trigger[3]: error_id == ERR_REPORT_NOT_FOUND"
            - "trigger[4]: error_id == ERR_VIOLATION_NOT_FOUND"
            - "trigger[5]: error_id == ERR_AMENDMENT_NOT_FOUND"
            - "trigger[6]: error_id == ERR_CHALLENGE_NOT_FOUND"
            - "trigger[7]: error_id == ERR_ADJUDICATION_NOT_FOUND"
            - "trigger[8]: error_id == ERR_BASIC_SCORE_NOT_FOUND"
            - "trigger[9]: error_id == ERR_COACHING_NOT_FOUND"
            - "trigger[10]: error_id == ERR_CAP_NOT_FOUND"
            - "trigger[11]: error_id == ERR_CAP_ITEM_NOT_FOUND"
            - "trigger[12]: error_id == ERR_SCORING_RUN_NOT_FOUND"

      - name: child_and_body_foreign_keys_unresolved_return_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - complexity_profile.entity_topology
          - errors[ERR_REPORT_NOT_FOUND]
          - errors[ERR_CHALLENGE_NOT_FOUND]
          - errors[ERR_CAP_NOT_FOUND]
          - errors[ERR_CARRIER_NOT_FOUND]
          - errors[ERR_VIOLATION_CODE_NOT_FOUND]
          - errors[ERR_DRIVER_NOT_FOUND]
        distinguishing_aspect: |
          In a graph topology both the nested path parent AND every body foreign key are resolved:
          appending a violation under an unknown report, adding evidence under an unknown challenge,
          adding an item under an unknown CAP, and naming an unknown carrier / code / driver in a
          body each fail with the error of the MISSING reference, not a generic 400.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 and code 392.2S exist; one RECEIVED report r1 on c1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070102", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00102", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /inspection-reports/00000000-0000-4000-8000-000000000004/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { e1: $.data.error_id }
            - call: "POST /data-challenges/00000000-0000-4000-8000-000000000007/evidence"
              payload: { evidence_type: "PHOTO", document_uri: "s3://dataqs/x.jpg", description: "Photo" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /corrective-action-plans/00000000-0000-4000-8000-000000000011/action-items"
              payload: { basic_category: "UNSAFE_DRIVING", description: "Install speed governors", target_completion_date: "2026-10-01T00:00:00Z" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /drivers"
              payload: { carrier_id: "00000000-0000-4000-8000-000000000001", cdl_number: "OH-D-99001", full_name: "Dana Reyes" }
              as: CarrierSafetyManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { e4: $.data.error_id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "00000000-0000-4000-8000-000000000003", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { e5: $.data.error_id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070103", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-02T14:00:00Z", inspection_end: "2026-07-02T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00103", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM", driver_id: "00000000-0000-4000-8000-000000000002" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { e6: $.data.error_id }
          assert:
            - "trigger[0]: HTTP status == 404 and error_id == ERR_REPORT_NOT_FOUND"
            - "trigger[1]: HTTP status == 404 and error_id == ERR_CHALLENGE_NOT_FOUND"
            - "trigger[2]: HTTP status == 404 and error_id == ERR_CAP_NOT_FOUND"
            - "trigger[3]: HTTP status == 404 and error_id == ERR_CARRIER_NOT_FOUND"
            - "trigger[4]: HTTP status == 404 and error_id == ERR_VIOLATION_CODE_NOT_FOUND"
            - "trigger[5]: HTTP status == 404 and error_id == ERR_DRIVER_NOT_FOUND"
            - "after all triggers: InspectionReport.${r1_id}.active_violation_count == 0"

      - name: required_fields_missing_on_create_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /carriers]
          - endpoints[POST /drivers]
          - endpoints[POST /inspection-reports]
        distinguishing_aspect: |
          Every input field declared without a default is genuinely required: omitting annual_vmt,
          cdl_number or vehicle_vin returns ERR_INVALID_REQUEST (400) and creates nothing, so the
          follow-up list read still returns total_count 0.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 exists so the driver and report bodies are otherwise valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /carriers"
              payload: { dot_number: "1000002", legal_name: "Maple Leaf Transport", average_power_units: 25 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { e1: $.data.error_id }
            - call: "POST /drivers"
              payload: { carrier_id: "${c1_id}", full_name: "Dana Reyes" }
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070104", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { e3: $.data.error_id }
          assert:
            - "trigger[0]: HTTP status == 400 and error_id == ERR_INVALID_REQUEST"
            - "trigger[1]: HTTP status == 400 and error_id == ERR_INVALID_REQUEST"
            - "trigger[2]: HTTP status == 400 and error_id == ERR_INVALID_REQUEST"
            - "after all triggers: GET /drivers?carrier_id=${c1_id} returns meta.total_count == 0"
            - "after all triggers: GET /inspection-reports?attributed_carrier_id=${c1_id} returns meta.total_count == 0"

      - name: optional_fields_omitted_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ViolationCode.fields.oos_add_on
          - entities.ViolationCode.fields.driver_attributable
          - entities.Driver.fields.employment_status
          - entities.InterventionThreshold.fields.intervention_percentile
        distinguishing_aspect: |
          Omitting the optional inputs yields the declared defaults exactly - oos_add_on 2,
          driver_attributable true, employment_status ACTIVE, and the threshold percentile trio
          50.0 / 65.0 / 85.0 - rather than nulls or zeros.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_id: $.data.id }
            - call: "POST /drivers"
              payload: { carrier_id: "${c1_id}", cdl_number: "OH-D-99001", full_name: "Dana Reyes" }
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "MEDIUM", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 0.5, measure_at_p65: 1.0, measure_at_p80: 2.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { th_id: $.data.id }
          assert:
            - "ViolationCode.${vc_id}.oos_add_on == 2"
            - "ViolationCode.${vc_id}.driver_attributable == true"
            - "Driver.${d1_id}.employment_status == ACTIVE"
            - "Driver.${d1_id}.coaching_required == false"
            - "Driver.${d1_id}.strict_attribution_score == 0.0"
            - "InterventionThreshold.${th_id}.monitor_percentile == 50.0"
            - "InterventionThreshold.${th_id}.intervention_percentile == 65.0"
            - "InterventionThreshold.${th_id}.investigation_percentile == 85.0"

      - name: computed_and_system_fields_on_create_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Carrier.fields.carrier_segment
          - entities.Carrier.fields.safety_fitness_status
          - entities.Carrier.fields.iss_value
          - entities.InspectionReport.fields.status
          - entities.Violation.fields.status
        distinguishing_aspect: |
          Client-supplied values for computed and system fields are discarded, not honoured: a
          carrier posted with carrier_segment LARGE / safety_fitness_status SATISFACTORY / iss_value
          90.0 still reads MEDIUM / UNRATED / 0.0, and a report posted with status SCORED still reads
          RECEIVED with total_time_weighted_severity 0.0.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
          trigger:
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000, carrier_segment: "LARGE", safety_fitness_status: "SATISFACTORY", iss_value: 90.0, challenge_quota_limit: 99 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070105", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00105", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM", status: "SCORED", total_time_weighted_severity: 99.0, reattributed: true }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
          assert:
            - "trigger[0]: Carrier.${c1_id}.carrier_segment == MEDIUM"
            - "trigger[0]: Carrier.${c1_id}.safety_fitness_status == UNRATED"
            - "trigger[0]: Carrier.${c1_id}.iss_value == 0.0"
            - "trigger[0]: Carrier.${c1_id}.challenge_quota_limit == 3"
            - "trigger[1]: InspectionReport.${r1_id}.status == RECEIVED"
            - "trigger[1]: InspectionReport.${r1_id}.total_time_weighted_severity == 0.0"
            - "trigger[1]: InspectionReport.${r1_id}.reattributed == false"
            - "trigger[1]: InspectionReport.${r1_id}.scored_at == null"

      - name: enum_and_range_constraints_rejected
