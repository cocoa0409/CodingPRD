            - { call: "POST /audit-work-orders/${wo_c}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo_a}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo_b}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo_c}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo_a}", payload: {}, as: AuditManager, captures: { wo_a_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo_a}/appointments", payload: { scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", location_type: "INSURED_PREMISES", expected_work_order_version: "${wo_a_v}" }, as: Auditor, as_user_id: "${aud}", captures: { appt_a: "$.data.id" } }
            - { call: "GET /audit-work-orders/${wo_b}", payload: {}, as: AuditManager, captures: { wo_b_v: "$.data.version" } }
