        distinguishing_aspect: "Issuing a policy whose coverage_amount_cents (30000000) exceeds the ISSUED commitment.insured_amount_cents (25000000) returns ERR_COVERAGE_EXCEEDS_COMMITMENT."
        test_recipe:
          setup: ["An order with an ISSUED commitment insured 25000000 and a PENDING OWNER policy coverage 30000000 bound to it."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C24", county: "King", transaction_type: "PURCHASE", sales_price_cents: 30000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 30000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COVERAGE_EXCEEDS_COMMITMENT"
            - "Policy.${p_id}.status == PENDING"

