  - section: rbac
    instances:
      - name: corner_safety_officer_allowed_to_post_condition_reading
        claim_type: role_allow
        grounds:
          - roles.SafetyOfficer.exclusive_operations
          - endpoints[POST /boathouse/water-condition-readings]
          - entities.WaterConditionReading
        distinguishing_aspect: "SafetyOfficer holds POST /boathouse/water-condition-readings exclusively and the call succeeds with 201, which is the positive half of the deny claims below."
        test_recipe:
          setup:
            - "one member acting as the dock safety officer"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Sam Officer", tier: "COMPETITIVE", body_weight_kg: 80.0, club_roles: ["LAUNCH_DRIVER"], safety_launch_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { officer_id: $.data.id }
          trigger:
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:00:00Z", air_temp_c: 22.0, water_temp_c: 19.0, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
          assert:
            - "the call returns HTTP 201 with data.posture == OPEN and data.cold_water_flag == false"
            - "the reading carries no version field, since WaterConditionReading has common_fields false"

      - name: corner_member_cannot_create_regatta_entry_returns_403
        claim_type: role_deny
        grounds:
          - roles.Coach.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /boathouse/regatta-entries is Coach-exclusive, so a well-formed request from an ordinary Member returns HTTP 403 ERR_UNAUTHORIZED rather than being accepted or rejected as invalid."
        test_recipe:
          setup:
            - "one ordinary member, one 1X hull, one HOME regatta"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/regattas"
              payload: { name: "Club Head Race", host_club: "Home RC", venue_kind: "HOME", race_date_at: "2026-08-12T08:00:00Z", entry_deadline_at: "2026-08-10T00:00:00Z", scratch_deadline_at: "2026-08-11T00:00:00Z", weigh_in_opens_at: "2026-08-12T06:00:00Z", weigh_in_closes_at: "2026-08-12T07:00:00Z" }
              as: ClubAdmin
              captures: { regatta_id: $.data.id }
          trigger:
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${regatta_id}", shell_id: "${shell_id}", event_code: "M1X_OPEN", boat_class: "1X", seed_time_seconds: 380.0 }
              as: Member
              as_user_id: "${rita_id}"
          assert:
            - "the call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /boathouse/regatta-entries?regatta_id=${regatta_id} returns total_count == 0"

      - name: corner_coach_cannot_confirm_entry_returns_403_before_path_resolution
        claim_type: role_deny
        grounds:
          - roles.RaceOfficial.exclusive_operations
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The role check sits at priority 2, ahead of path-id resolution at priority 3: a Coach calling confirm on an id that does not exist gets ERR_UNAUTHORIZED (403), not ERR_ENTRY_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "one certified coach; the entry id 00000000-0000-0000-0000-000000000000 does not exist"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
          trigger:
            - call: "POST /boathouse/regatta-entries/00000000-0000-0000-0000-000000000000/confirm"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "the call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the response is not 404 and data.error_id is not ERR_ENTRY_NOT_FOUND"

      - name: corner_equipment_manager_cannot_triage_own_report_returns_403
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=23]
          - errors[ERR_SELF_TRIAGE_FORBIDDEN]
          - complexity_profile.role_model
        distinguishing_aspect: "The boatman holds the triage endpoint but may not triage a report they filed themselves: with X-User-ID equal to DamageReport.reported_by_member_id the call returns HTTP 403 ERR_SELF_TRIAGE_FORBIDDEN even though the role would otherwise allow it."
        test_recipe:
          setup:
            - "one EquipmentManager who files the report and a second EquipmentManager who could legitimately triage it"
            - "one hull with one MINOR report in REPORTED filed by the first boatman"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Enid Boatman", tier: "RECREATIONAL", body_weight_kg: 75.0, club_roles: ["EQUIPMENT_MANAGER"] }
              as: ClubAdmin
              captures: { equip_a_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Owen Boatman", tier: "RECREATIONAL", body_weight_kg: 79.0, club_roles: ["EQUIPMENT_MANAGER"] }
              as: ClubAdmin
              captures: { equip_b_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_id}", reported_by_member_id: "${equip_a_id}", severity: "MINOR", narrative: "scuffed bow ball" }
              as: EquipmentManager
              as_user_id: "${equip_a_id}"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /boathouse/damage-reports/${report_id}/triage"
              payload: {}
              as: EquipmentManager
              as_user_id: "${equip_a_id}"
          assert:
            - "the call returns HTTP 403 with data.error_id == ERR_SELF_TRIAGE_FORBIDDEN"
            - "DamageReport.${report_id}.status == REPORTED with triaged_by_user_id == null"
            - "the same call issued by the second boatman (X-User-ID ${equip_b_id}) succeeds and sets triaged_by_user_id == ${equip_b_id}"

      - name: corner_coach_cannot_clear_own_session_returns_403
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=24]
          - errors[ERR_SELF_CLEARANCE_FORBIDDEN]
          - complexity_profile.role_model
        distinguishing_aspect: "One person holding both club roles still cannot sign off their own outing: the SafetyOfficer clearance is refused with HTTP 403 ERR_SELF_CLEARANCE_FORBIDDEN when X-User-ID equals WaterSession.coach_member_id."
        test_recipe:
          setup:
            - "one member carrying both the COACH and LAUNCH_DRIVER club roles, acting under both the Coach and SafetyOfficer API roles, with both certificates valid to 2027-01-01"
            - "one independent SafetyOfficer, one rower, one hull, one OPEN reading, one PLANNED session coached by the dual-role member"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Dana Dual", tier: "COMPETITIVE", body_weight_kg: 77.0, club_roles: ["COACH", "LAUNCH_DRIVER"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z", safety_launch_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { dual_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Sam Officer", tier: "COMPETITIVE", body_weight_kg: 80.0, club_roles: ["LAUNCH_DRIVER"], safety_launch_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "COMPETITIVE", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:00:00Z", air_temp_c: 22.0, water_temp_c: 19.0, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { reading_id: $.data.id }
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T06:00:00Z", planned_end_at: "2026-08-01T07:00:00Z", coach_member_id: "${dual_id}", athlete_member_ids: ["${rita_id}"] }
              as: Coach
              as_user_id: "${dual_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /boathouse/water-sessions/${session_id}/clear"
