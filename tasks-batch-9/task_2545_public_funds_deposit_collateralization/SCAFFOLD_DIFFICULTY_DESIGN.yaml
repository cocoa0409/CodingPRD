          - validations[priority=50]
        distinguishing_aspect: |
          QualificationReview is cyclic: ATTESTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> ATTESTED can be
          traversed repeatedly, each re-attestation clearing attested_by_user_id and incrementing
          round_count (1 -> 2 -> 3), and the loop terminates at REVIEW_ROUND_LIMIT 3 where the fourth
          attestation is rejected with ERR_ROUND_LIMIT_REACHED instead of looping forever.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "A DRAFT depository whose qualification review was filed by user officer-1 (round_count 1, status SUBMITTED)."
            - "Attestations are performed by compliance-1, which differs from officer-1 (segregation of duties)."
