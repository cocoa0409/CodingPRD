            - call: "POST /wind-ops/spare-parts"
              payload: { component_type: "GEARBOX", part_number: "GB-4200-A", quantity_on_hand: 2, lead_time_days: 210, reorder_point: 2, unit_cost_cents: 25000000, uptower_repairable: false }
              as: SiteAdmin
              as_user_id: "admin-1"
