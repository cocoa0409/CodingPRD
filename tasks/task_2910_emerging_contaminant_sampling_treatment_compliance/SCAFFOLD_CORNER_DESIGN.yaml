          - validations[priority=101]
          - validations[priority=102]
        distinguishing_aspect: "Six refusals are walked along one pilot without ever creating a second one, and each refused call must leave unmanifested_media_kg untouched — an implementation that decrements the mass before validating the media type or the ceiling leaks kilograms on every rejected manifest."
