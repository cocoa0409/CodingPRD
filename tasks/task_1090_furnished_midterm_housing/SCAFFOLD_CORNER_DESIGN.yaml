              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /deposits?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { dep_id: "$.data[0].id", dep_v: "$.data[0].version" }
            - call: "POST /damage-claims"
              payload: { deposit_id: "${dep_id}", expected_deposit_version: "${dep_v}", claimed_cents: 20000, description: "claim A" }
              as: Host
              as_user_id: "${host_id}"
              captures: { claim_a: $.data.id }
          trigger:
            - call: "POST /damage-claims"
              payload: { deposit_id: "${dep_id}", expected_deposit_version: "${dep_v}", claimed_cents: 30000, description: "claim B" }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_STALE_DEPOSIT_VERSION (the first claim bumped Deposit.version, so the reused dep_v is stale)"

      - name: payout_pay_same_user_segregation_of_duties
        claim_type: Segregation of duties
        grounds: [state_machines.Payout.SCHEDULED_to_PAID, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "A payout scheduled by admin-1 and then paid by the same admin-1 is denied with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Verified host/tenant, LISTED unit; booking completed -> Payout FINAL; scheduled by admin-1"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CX", email: "cx@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse CX", email: "ncx@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docCX" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CX", address: "21 A St", monthly_rate_cents: 300000, cleaning_included: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
            - call: "GET /payouts?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /payouts/${payout_id}/transitions"
              payload: { to_status: "SCHEDULED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /payouts/${payout_id}/transitions"
              payload: { to_status: "PAID" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SEGREGATION_OF_DUTIES (same X-User-ID scheduled and attempted to pay)"

      - name: units_list_pagination_envelope
        claim_type: pagination_with_filtering
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /units?host_id returns a paginated array with total_count and has_more; two units yield total_count 2 and has_more false at the default limit 10."
        test_recipe:
          setup: ["One host with two units"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CY", email: "cy@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CY1", address: "22 A St", monthly_rate_cents: 300000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CY2", address: "23 A St", monthly_rate_cents: 300000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { u2: $.data.id }
          trigger:
            - call: "GET /units?host_id=${host_id}"
              payload: {}
              as: PlatformAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response meta.total_count == 2; meta.has_more == false; array length == 2 (default limit 10)"

  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visible
        claim_type: immediate
        grounds: [endpoints]
        distinguishing_aspect: "A unit created via POST /units is immediately visible with identical field values via GET /units/{id} in a subsequent request."
        test_recipe:
          setup: ["A registered host"]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host CZ", email: "cz@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "CZ", address: "24 A St", monthly_rate_cents: 275000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: PlatformAdmin
              captures: { rate: $.data.monthly_rate_cents, st: $.data.status }
          assert:
            - "captured rate == 275000, st == DRAFT (identical to the create response)"
