          setup:
            - "Logical clock at 2026-08-01T00:00:00Z at publication time"
            - "Department DOT with licence CC-BY-4.0"
            - "Dataset A 'weekly-traffic-counts' WEEKLY, published 2026-08-01 → next_due_at 2026-08-08T00:00:00Z; after publication its stored tier is TIER_3 (AS_OBSERVED 33.60), so GRACE_DAYS is 14"
            - "Dataset B 'library-circulation' MONTHLY, published 2026-08-01 → next_due_at 2026-08-31T00:00:00Z"
            - "The clock is moved to 2026-08-20T00:00:00Z and one sweep is run: A is 12 days overdue → AGING (no alert), B is still CURRENT"
            - "The clock is then moved to 2026-08-25T00:00:00Z, where A is 17 days overdue (> 14) and B is still not due"
