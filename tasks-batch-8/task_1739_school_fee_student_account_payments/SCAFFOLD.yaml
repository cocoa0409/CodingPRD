    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: POST
    path: "/student-accounts/{id}/payments/{paymentId}/settle"
    description: "Settle a PENDING payment (gateway callback simulation)"
    roles: [FamilyMember]
    code: 200
    input: [outcome]
    output: Payment
    side_effects: ["allocation_waterfall", "department_distribution", "posture recompute", "case resolution checks", "increments StudentAccount.version by 1"]
  - method: POST
    path: "/student-accounts/{id}/payments/{paymentId}/void"
    description: "Void a PENDING payment"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: Payment
    side_effects: []
