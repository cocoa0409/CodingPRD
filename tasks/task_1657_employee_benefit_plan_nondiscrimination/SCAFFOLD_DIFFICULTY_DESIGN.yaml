          run_mode: FINAL
        as: ComplianceAnalyst
        captures:
          tr3: $.data.id
      - call: POST /ndt/test-runs/${tr3}/execute-synchronously
        payload: {}
        as: ComplianceAnalyst
      assert:
      - TestResultLine[metric=ADP_NHCE_PCT].value_pct == 5.0000
      - TestResultLine[metric=ADP_CEILING_PCT].value_pct == 7.0000 (the min(+2pp, 2x) prong at 7.0000 beats the 1.25x prong
        at 6.2500; then max picks 7.0000)
      - TestResultLine[metric=ADP_HCE_PCT].value_pct == 10.0000 and outcome == FAIL (10.0000 > 7.0000)
  - name: dependent_care_per_person_cap_then_average_rounding
    grounds:
    - calculations.dependent_care_129_average_benefits
    distinguishing_aspect: 'Mode (b): the statutory $5,000 cap is applied PER PERSON BEFORE ratios

      and averaging; capping after averaging (or averaging uncapped amounts)

      yields different values — the scaffold pins cap -> per-person ratio

      (4dp) -> mean (4dp), and the literal outcome depends on that order.

      '
    test_recipe:
      setup:
      - DEPENDENT_CARE_FSA plan; RegulatoryLimit.dependent_care_limit_cents = 500000
      - 'NHCE-D: comp 5000000, DC election 600000 (capped to 500000 -> 10.0000%)'
      - 'NHCE-E: comp 10000000, DC election 200000 (2.0000%)'
      - 'HCE-F (6% owner): comp 30000000, DC election 500000 (1.6667%)'
      - avg_nhce = (10.0000 + 2.0000)/2 = 6.0000; avg_hce = 1.6667; 55% ceiling = 3.3000; 1.6667 <= 3.3000 -> PASS
      - Uncapped alternative would give NHCE-D 12.0000% -> avg 7.0000 -> ceiling 3.8500 — a different (wrong) verdict surface
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Delta Co
          ein: '423456789'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
