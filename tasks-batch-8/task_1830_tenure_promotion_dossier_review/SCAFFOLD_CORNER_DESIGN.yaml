            - "app_ap_status == WITHDRAWN"
            - "ap_stage == CLOSED (cleared after withdrawal)"
      - name: second_active_chair_rejected
        claim_type: violation_to_error
        grounds: ["entities.CommitteeMember.fields.role_in_committee", "errors[ERR_CHAIR_CONFLICT]"]
        distinguishing_aspect: "At most one active CHAIR per committee: adding a second CHAIR member fails with ERR_CHAIR_CONFLICT; after deactivating the first chair, a new chair can be appointed."
        test_recipe:
          setup: ["committee with one active CHAIR"]
          setup_api_calls:
            - { call: "POST /api/committees", payload: { level: "DEPARTMENT", academic_unit: "CS", term_start: "2026-01-01", term_end: "2026-12-31", pass_rule: "STRICT_MAJORITY_OF_CAST" }, as: ProvostOfficer, captures: { comm_hc: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_hc}", full_name: "Chair One", email: "chair1_hc@u.edu", role_in_committee: "CHAIR", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { chair_hc1: $.data.id } }
          trigger:
            - { call: "POST /api/members", payload: { committee_id: "${comm_hc}", full_name: "Chair Two", email: "chair2_hc@u.edu", role_in_committee: "CHAIR", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { err_hc: $.data.error_id } }
            - { call: "POST /api/members/${chair_hc1}/deactivate", as: ProvostOfficer }
            - { call: "POST /api/members", payload: { committee_id: "${comm_hc}", full_name: "Chair Two", email: "chair2_hc@u.edu", role_in_committee: "CHAIR", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { chair_hc2: $.data.id } }
          assert:
            - "err_hc == ERR_CHAIR_CONFLICT"
            - "chair_hc2 created successfully after the first chair was deactivated (is_active false frees the seat)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_envelope_and_bounds
        claim_type: list_pagination
        grounds: [response_envelope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Pagination contract: limit/offset window over 3 dossier items returns the right slice with total_count 3 and correct has_more on both pages; limit 0 and limit 101 are rejected with ERR_INVALID_REQUEST (envelope bounds 1..100)."
        test_recipe:
          setup: ["case with 3 dossier items"]
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand PG", employee_id: "E9400", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_pg: $.data.id } }
