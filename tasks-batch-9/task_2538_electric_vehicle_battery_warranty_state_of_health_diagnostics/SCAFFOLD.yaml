scenario: |
  Generate task harder than expert level!

  2538. Electric Vehicle Battery Warranty & State-of-Health Diagnostics (electric vehicle
  manufacturer battery program): capacity retention warranty terms with degradation thresholds
  over years and miles, telematics-based state-of-health calculation and diagnostic validation
  before a claim, module versus pack replacement decision rules and remanufactured pack
  availability, service center high-voltage certification requirements and tooling constraints,
  thermal event reporting, containment procedures and regulatory notification, software update
  remediation for charging or thermal management issues with owner consent, battery capacity
  dispute resolution and independent verification, removed pack logistics with hazardous
  shipping classification

domain_name: ev-battery-warranty-soh-diagnostics
api_prefix: "/battery-warranty"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # graph: BatteryPack is self-referential (superseded_pack_id), RemediationConsent is a
  # junction between RemediationCampaign and Vehicle, RemediationConsent is itself
  # self-referential (superseded_consent_id), and WarrantyClaim fans out to five peers
  # (Vehicle, ServiceCenter, SohAssessment, Technician, BatteryPack) with no URL nesting.

  state_machine_shape: cyclic
  # Three machines cycle: WarrantyClaim (SUBMITTED -> INFO_REQUESTED -> SUBMITTED, capped by
  # info_request_limit; DENIED -> SUBMITTED on dispute overturn), CapacityDispute
  # (LAB_RESULT_RECEIVED -> LAB_ASSIGNED mandatory retest), ServiceCenter (ACTIVE ->
  # SHIPPING_SUSPENDED -> ACTIVE). ThermalEvent additionally carries two independent state
  # dimensions (containment_status x notification_status) that join into event_status.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Two enforced two-person rules: (1) the PackShipment hazmat certifying technician MUST NOT
  # be the technician who removed the pack (claim.fulfilment_technician_id); (2) the
  # WarrantyAdjudicator resolving a CapacityDispute MUST NOT be the adjudicator who decided
  # the underlying claim (claim.adjudicated_by_user_id).

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities, 52 endpoints, 80 error codes, 70 ordered validations, 14 calculations
  # (2 dual-variant on different entity domains), 10 state-machine dimensions across 9
  # entities (ThermalEvent carries two), 7 roles, 3 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: WarrantyProgram
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Program label, e.g. "MX Battery Capacity Retention 2020".
      - name: coverage_months
        type: integer
        source: input
        description: Capacity-retention coverage horizon in whole months from Vehicle.in_service_date.
        constraints: "60..144"
        default: 96
      - name: coverage_miles
        type: integer
        source: input
        description: Capacity-retention coverage horizon in odometer miles.
        constraints: "50000..200000"
        default: 100000
      - name: retention_schedule
        type: array
        source: input
        description: >-
          Ordered tier rows, each an object {through_months: integer, through_miles: integer,
          min_retention_pct: number}. Server sorts rows ascending by through_months at write
          time and persists them in that order. The last row's through_months MUST equal
          coverage_months and its through_miles MUST equal coverage_miles.
        constraints: "1..4 rows; min_retention_pct in 50.00..95.00 with 2 decimals"
        default: [{through_months: 48, through_miles: 50000, min_retention_pct: 80.00}, {through_months: 96, through_miles: 100000, min_retention_pct: 70.00}]
      - name: pack_replacement_retention_pct
        type: number
        source: input
        description: Retention percentage strictly below which pack replacement is mandated over module replacement.
        default: 60.00
      - name: module_replacement_cap
        type: integer
        source: input
        description: Lifetime cap on modules replaced per pack before the pack must be replaced whole.
        default: 3
      - name: goodwill_months
        type: integer
        source: input
        description: Months of goodwill extension beyond coverage_months in which prorated cost sharing applies.
        default: 12
      - name: goodwill_miles
        type: integer
        source: input
        description: Miles of goodwill extension beyond coverage_miles in which prorated cost sharing applies.
        default: 15000
      - name: diagnostic_fee_cents
        type: integer
        source: input
        description: Flat diagnostic line item added to every remedy cost estimate, in cents.
        default: 12000
      - name: module_unit_price_cents
        type: integer
        source: input
        description: Parts price of one replacement battery module, in cents.
        default: 145000
      - name: pack_price_new_cents
        type: integer
        source: input
        description: Parts price of a NEW replacement pack, in cents.
        default: 1420000
      - name: pack_price_reman_cents
        type: integer
        source: input
        description: Parts price of a REMANUFACTURED replacement pack, in cents.
        default: 890000
      - name: labor_hours_module
        type: number
        source: input
        description: Flat-rate labor hours for a module replacement.
        default: 3.25
      - name: labor_hours_pack
        type: number
        source: input
        description: Flat-rate labor hours for a pack replacement.
        default: 6.50
      - name: surcharge_un3480_cents
        type: integer
        source: input
        description: Hazmat surcharge basis per 100 kg for UN3480 (standalone lithium-ion pack), in cents.
        default: 4000
      - name: surcharge_un3481_cents
        type: integer
        source: input
        description: Hazmat surcharge basis per 100 kg for UN3481 (modules contained in equipment), in cents.
        default: 2500
      - name: surcharge_un3536_cents
        type: integer
        source: input
        description: Hazmat surcharge basis per 100 kg for UN3536 (damaged/defective escalated), in cents.
        default: 18000
      - name: snapshot_min_count
        type: integer
        source: input
        description: Minimum count of fresh VALID telematics snapshots required for a TELEMATICS_FLEET assessment.
        default: 3
      - name: snapshot_window_size
        type: integer
        source: input
        description: Maximum size of the fresh snapshot window used by the telematics state-of-health estimate.
        default: 5
      - name: snapshot_freshness_days
        type: integer
        source: input
        description: A snapshot enters the window only when captured_at >= clock_now - this many days.
        default: 30
      - name: cell_delta_pack_threshold_mv
        type: integer
        source: input
        description: Max cell delta in millivolts at or above which pack replacement is mandated.
        default: 250
      - name: info_request_limit
        type: integer
        source: input
        description: Maximum number of INFO_REQUESTED rounds an adjudicator may open on one claim.
        default: 2
      - name: reman_min_soh_pct
        type: number
        source: input
        description: Minimum refurb_soh_pct a remanufactured pack must carry to be selectable as a replacement.
        default: 85.00
      - name: allow_new_pack_substitution
        type: boolean
        source: input
        description: When true, an empty remanufactured candidate pool falls back to NEW STOCK packs instead of erroring.
        default: false
      - name: liability_cap_cents
        type: integer
        source: input
        description: Ceiling on accrued_liability_cents; an approval whose oem_total_cents would push the accrual strictly above this is rejected.
        default: 50000000
      - name: lab_tolerance_pct
        type: number
        source: input
        description: Absolute retention-percentage-point tolerance between the OEM and independent-lab measurements.
        default: 2.00
      - name: dispute_window_days
        type: integer
        source: input
        description: Days after a claim's adjudication during which the owner may file a CapacityDispute; the boundary day is INCLUSIVE.
        default: 30
      - name: accrued_liability_cents
        type: integer
        source: computed
        description: >-
          Ledger mirror; MUST always equal SUM(WarrantyClaim.oem_total_cents) over claims of this
          program whose adjudication_status IN {APPROVED_MODULE, APPROVED_PACK, APPROVED_SOFTWARE,
          FULFILLED, CLOSED}.
        default: 0
      - name: reman_available_count
        type: integer
        source: computed
        description: >-
          Inventory mirror; MUST always equal COUNT(BatteryPack WHERE pack_type == REMANUFACTURED
          AND status == STOCK).
        default: 0
      - name: reman_stock_state
        type: enum
        source: computed
        description: DEPLETED when reman_available_count == 0, else AVAILABLE.
        constraints: "AVAILABLE | DEPLETED"
        default: DEPLETED

  - name: Vehicle
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vin
        type: string
        source: input
        description: Vehicle identification number; unique across the program.
        constraints: "exactly 17 chars, uppercase alphanumeric"
      - name: model_code
        type: string
        source: input
        description: Model code used for remediation-campaign eligibility matching.
        default: "MX-90"
      - name: region_code
        type: string
        source: input
        description: Owner-domicile region code used for LIMITED release campaign eligibility.
        default: "US-WEST"
      - name: warranty_program_id
        type: string
        source: input
        description: FK -> WarrantyProgram.id
      - name: in_service_date
        type: datetime
        source: input
        description: First-retail-delivery instant; origin of the elapsed_months clock. MUST be <= current logical clock.
      - name: owner_contact_email
        type: string
        source: input
        description: Owner notification address for consent solicitation.
        default: "owner@example.com"
      - name: odometer_miles
        type: integer
        source: computed
        description: >-
          MAX(TelematicsSnapshot.odometer_miles) over this vehicle's snapshots with
          validity_flag == VALID; 0 when the vehicle has none.
        default: 0
      - name: installed_pack_id
        type: string
        source: computed
        description: >-
          Derived mirror of the BatteryPack whose installed_vehicle_id == this Vehicle.id and
          whose status IN {IN_SERVICE, QUARANTINED}; null when there is none. This is a mirror,
          not an owning foreign key - the owning direction is BatteryPack.installed_vehicle_id.
        default: null
      - name: warranty_hold
        type: boolean
        source: computed
        description: >-
          True while the installed pack's status == QUARANTINED; surfaced on the vehicle read as
          the operator-visible hold. The enforcement point is the fulfilment gate at validation
          priority 47 (ERR_THERMAL_CONTAINMENT_OPEN), which refuses any fulfilment while an S3/S4
          ThermalEvent on the pack is not CONTAINMENT_CLOSED.
        default: false
      - name: status
        type: enum
        source: computed
        description: >-
          ACTIVE initially; IMMOBILIZED when a ThermalEvent with severity IN {S3, S4} quarantines
          the installed pack; returns to ACTIVE when a PACK_REPLACEMENT fulfilment installs a
          replacement pack.
        constraints: "ACTIVE | IMMOBILIZED"
        default: ACTIVE

  - name: BatteryPack
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: serial_number
        type: string
        source: input
        description: Pack serial; unique across the program.
      - name: pack_type
        type: enum
        source: input
        description: NEW for factory packs, REMANUFACTURED for refurbished stock.
        constraints: "NEW | REMANUFACTURED"
        default: NEW
      - name: nominal_capacity_kwh
        type: number
        source: input
        description: Beginning-of-life usable capacity in kWh, 3 decimals.
        constraints: "> 0"
        default: 80.000
      - name: module_count
        type: integer
        source: input
        description: Number of BatteryModule children created with the pack.
        constraints: "8..24"
        default: 16
      - name: gross_weight_kg
        type: number
        source: input
        description: Shipping gross weight of the whole pack in kg, 3 decimals; basis of the hazmat surcharge line.
        default: 483.296
      - name: stock_region_code
        type: string
        source: input
        description: Region where the pack physically sits; must match the service center region to be selectable.
        default: "US-WEST"
      - name: refurb_soh_pct
        type: number
        source: input
        description: Post-refurbishment state-of-health percentage. Required when pack_type == REMANUFACTURED, MUST be omitted when pack_type == NEW.
        default: null
      - name: remanufacture_count
        type: integer
        source: input
        description: Number of completed remanufacture cycles this pack has been through.
        default: 0
      - name: installed_vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; null while the pack sits in stock, reserved, removed, quarantined or scrapped.
        default: null
      - name: superseded_pack_id
        type: string
        source: computed
        description: FK -> BatteryPack.id; set on the replacement pack to the pack it displaced during PACK_REPLACEMENT fulfilment.
        default: null
      - name: status
        type: enum
        source: computed
        description: >-
          STOCK when created without installed_vehicle_id; IN_SERVICE when created with one;
          RESERVED when an APPROVED_PACK adjudication earmarks it; REMOVED when a fulfilment
          pulls it from a vehicle; QUARANTINED on thermal escalation or shipment rejection;
          SCRAPPED on shipment receipt with disposition SCRAP.
        constraints: "STOCK | RESERVED | IN_SERVICE | REMOVED | QUARANTINED | SCRAPPED"
      - name: hazmat_classification
        type: enum
        source: computed
        description: >-
          Null until a shipment classification or a thermal escalation is computed; UN3536
          whenever damaged_defective == true, otherwise UN3480 for FULL_PACK shipments and
          UN3481 for MODULES_ONLY shipments.
        constraints: "UN3480 | UN3481 | UN3536"
        default: null
      - name: damaged_defective
        type: boolean
        source: computed
        description: True once a ThermalEvent with severity IN {S3, S4} references the pack or a PackShipment carrying it is REJECTED.
        default: false
      - name: module_replacements_to_date
        type: integer
        source: computed
        description: Count of this pack's BatteryModule children with status == REPLACED.
        default: 0
      - name: faulted_module_count
        type: integer
        source: computed
        description: Count of this pack's BatteryModule children with status == FAULTED.
        default: 0

  - name: BatteryModule
    parent: BatteryPack
    common_fields: true
    kind: resource
    fields:
      - name: pack_id
        type: string
        source: system
        description: FK -> BatteryPack.id
      - name: position_index
        type: integer
        source: system
        description: 1-based slot index; the pack's children are minted with position_index 1..module_count in ascending order.
      - name: module_capacity_kwh
        type: number
        source: computed
        description: ROUND_HALF_UP(BatteryPack.nominal_capacity_kwh / BatteryPack.module_count, 3).
      - name: status
        type: enum
        source: computed
        description: >-
          HEALTHY at creation; DEGRADED when an assessment lists the position in
          module_degraded_positions; FAULTED when an assessment lists it in
          module_fault_positions or a ThermalEvent lists it in affected_module_positions;
          REPLACED when a MODULE_REPLACEMENT fulfilment swaps it.
        constraints: "HEALTHY | DEGRADED | FAULTED | REPLACED"
        default: HEALTHY
      - name: cell_delta_mv
        type: integer
        source: computed
        description: Latest per-module cell delta in millivolts, written by bench assessments.
        default: 0
      - name: thermal_runaway_flag
        type: boolean
        source: computed
        description: True when a ThermalEvent with severity IN {S3, S4} listed this position in affected_module_positions.
        default: false
      - name: replaced_at
        type: datetime
        source: computed
        description: Logical-clock instant at which a MODULE_REPLACEMENT fulfilment set status to REPLACED.
        default: null

  - name: TelematicsSnapshot
    parent: Vehicle
    common_fields: false
    kind: event
    fields:
      - name: vehicle_id
        type: string
        source: system
        description: FK -> Vehicle.id
      - name: captured_at
        type: datetime
        source: input
        description: On-vehicle capture instant; MUST be <= current logical clock or the row is flagged INVALID_FUTURE_CAPTURE.
      - name: odometer_miles
        type: integer
        source: input
        description: Odometer at capture.
        constraints: ">= 0"
      - name: reported_capacity_kwh
        type: number
        source: input
        description: BMS-reported usable capacity in kWh at capture, 3 decimals.
      - name: charge_cycles
        type: integer
        source: input
        description: Cumulative equivalent full charge cycles.
        constraints: ">= 0"
        default: 400
      - name: max_cell_delta_mv
        type: integer
        source: input
        description: Worst-cell voltage spread across the pack at capture, in millivolts.
        constraints: ">= 0"
        default: 40
      - name: coolant_temp_c
        type: number
        source: input
        description: Coolant temperature in Celsius at capture; drives the temperature correction factor.
        default: 20.0
      - name: dcfc_session_count
        type: integer
        source: input
        description: Cumulative DC fast-charge session count.
        constraints: ">= 0"
        default: 0
      - name: validity_flag
        type: enum
        source: computed
        description: >-
          VALID unless one of the ingest checks fires, in priority order:
          INVALID_FUTURE_CAPTURE (captured_at > clock_now), INVALID_CAPACITY_RANGE
          (reported_capacity_kwh <= 0 OR > installed pack nominal_capacity_kwh * 1.05),
          INVALID_ODOMETER_REGRESSION (there exists a VALID snapshot for the same vehicle with
          captured_at <= this captured_at AND odometer_miles > this odometer_miles).
        constraints: "VALID | INVALID_FUTURE_CAPTURE | INVALID_CAPACITY_RANGE | INVALID_ODOMETER_REGRESSION"
      - name: corrected_capacity_kwh
        type: number
        source: computed
        description: >-
          ROUND_HALF_UP(reported_capacity_kwh * temperature_correction_factor(coolant_temp_c), 3).
          Written for every row, including invalid ones.

  - name: SohAssessment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id
      - name: pack_id
        type: string
        source: input
        description: FK -> BatteryPack.id; MUST equal Vehicle.installed_pack_id at assessment time.
      - name: technician_id
        type: string
        source: input
        description: FK -> Technician.id; the technician signing the diagnostic.
      - name: variant
        type: enum
        source: input
        description: TELEMATICS_FLEET uses the fresh snapshot window; BENCH_CAPACITY_TEST uses a measured capacity against module-adjusted nominal.
        constraints: "TELEMATICS_FLEET | BENCH_CAPACITY_TEST"
      - name: bench_measured_capacity_kwh
        type: number
        source: input
        description: Bench-measured usable capacity in kWh. Required when variant == BENCH_CAPACITY_TEST, MUST be omitted for TELEMATICS_FLEET.
        default: null
      - name: module_fault_positions
        type: array
        source: input
        description: >-
          Integer position_index values this diagnostic declares FAULTED. Accepted for BOTH
          variants and written to the pack's modules before nominal_basis_kwh is computed; only
          the BENCH_CAPACITY_TEST denominator is derated by them.
        default: []
      - name: module_degraded_positions
        type: array
        source: input
        description: >-
          Integer position_index values this diagnostic declares DEGRADED. Accepted for BOTH
          variants; MUST be disjoint from module_fault_positions.
        default: []
      - name: window_snapshot_count
        type: integer
        source: computed
        description: Size of the fresh VALID snapshot window used by this assessment (0..snapshot_window_size).
      - name: nominal_basis_kwh
        type: number
        source: computed
        description: >-
          Denominator of the retention ratio: pack.nominal_capacity_kwh for TELEMATICS_FLEET;
          ROUND_HALF_UP(pack.nominal_capacity_kwh * (module_count - faulted_after_write) / module_count, 3)
          for BENCH_CAPACITY_TEST, where faulted_after_write is the pack's FAULTED module count
          after this assessment's module_fault_positions have been applied.
      - name: estimated_capacity_kwh
        type: number
        source: computed
        description: Trimmed-window estimate for TELEMATICS_FLEET; bench_measured_capacity_kwh for BENCH_CAPACITY_TEST. Null when diagnostic_validity != VALID.
        default: null
      - name: retention_pct
        type: number
        source: computed
        description: ROUND_HALF_UP(estimated_capacity_kwh / nominal_basis_kwh * 100, 2). Null when diagnostic_validity != VALID.
        default: null
      - name: diagnostic_validity
        type: enum
        source: computed
        description: >-
          VALID when the diagnostic gate passes; STALE_TELEMETRY when the vehicle has >= 1 VALID
          snapshot but none inside the freshness window; INSUFFICIENT_DATA when the vehicle has
          zero VALID snapshots at all, or (TELEMATICS_FLEET only) when the fresh window holds
          fewer than snapshot_min_count rows; BENCH_OUT_OF_RANGE when bench_measured_capacity_kwh
          > nominal_basis_kwh * 1.05.
        constraints: "VALID | STALE_TELEMETRY | INSUFFICIENT_DATA | BENCH_OUT_OF_RANGE"
      - name: elapsed_months
        type: integer
        source: computed
        description: Whole months from Vehicle.in_service_date to the current logical clock, floored per calculation elapsed_coverage_position.
      - name: assessed_odometer_miles
        type: integer
        source: computed
        description: odometer_miles of the newest row in the fresh window; 0 when the window is empty.
        default: 0
      - name: coverage_position
        type: enum
        source: computed
        description: IN_COVERAGE, GOODWILL_BAND or OUT_OF_COVERAGE per calculation elapsed_coverage_position.
        constraints: "IN_COVERAGE | GOODWILL_BAND | OUT_OF_COVERAGE"
      - name: applicable_min_retention_pct
        type: number
        source: computed
        description: min_retention_pct of the selected retention_schedule row; null when coverage_position == OUT_OF_COVERAGE.
        default: null
      - name: max_cell_delta_mv
        type: integer
        source: computed
        description: max_cell_delta_mv of the newest row in the fresh window; 0 when the window is empty.
        default: 0
      - name: qualifies_for_claim
        type: boolean
        source: computed
        description: >-
          True when diagnostic_validity == VALID AND coverage_position IN {IN_COVERAGE,
          GOODWILL_BAND} AND retention_pct <= applicable_min_retention_pct.
        default: false
      - name: superseded
        type: boolean
        source: computed
        description: True once a newer SohAssessment exists for the same vehicle_id; superseded assessments cannot back a claim.
        default: false

  - name: ServiceCenter
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Service center trading name.
      - name: region_code
        type: string
        source: input
        description: Region code; must match a candidate replacement pack's stock_region_code.
        default: "US-WEST"
      - name: hv_certification_level
        type: enum
        source: input
        description: High-voltage certification tier of the center; ordinal L1 < L2 < L3.
        constraints: "L1 | L2 | L3"
        default: L3
      - name: has_pack_lift
        type: boolean
        source: input
        description: Whether the center owns a certified pack lift, required for PACK_REPLACEMENT fulfilment.
        default: false
      - name: insulation_tester_cal_due_at
        type: datetime
        source: input
        description: Calibration expiry of the insulation resistance tester; MUST be > clock_now at fulfilment time.
        default: "2027-01-01T00:00:00Z"
      - name: hv_bay_count
        type: integer
        source: input
        description: Number of high-voltage isolation bays; caps concurrent fulfilment windows.
        constraints: "1..6"
        default: 2
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: Warranty labor reimbursement rate in cents per hour.
        default: 18333
      - name: status
        type: enum
        source: computed
        description: >-
          ACTIVE at creation; SHIPPING_SUSPENDED while open_hazmat_holds >= 2; back to ACTIVE
          when open_hazmat_holds falls to <= 1; DECERTIFIED (terminal) when compliance_score <= 20.
        constraints: "ACTIVE | SHIPPING_SUSPENDED | DECERTIFIED"
        default: ACTIVE
      - name: open_hazmat_holds
        type: integer
        source: computed
        description: Count of this center's packs currently in status QUARANTINED as a result of a REJECTED PackShipment.
        default: 0
      - name: rejected_shipment_count
        type: integer
        source: computed
        description: Lifetime count of this center's PackShipments that reached status REJECTED.
        default: 0
      - name: late_notification_count
        type: integer
        source: computed
        description: Lifetime count of ThermalEvents at this center's claims-of-record whose notification_status became LATE_FILED.
        default: 0
      - name: compliance_score
        type: integer
        source: computed
        description: MAX(0, 100 - 15 * rejected_shipment_count - 40 * late_notification_count).
        default: 100

  - name: Technician
    parent: ServiceCenter
    common_fields: true
    kind: resource
    fields:
      - name: service_center_id
        type: string
        source: system
        description: FK -> ServiceCenter.id
      - name: full_name
        type: string
        source: input
        description: Technician name.
      - name: hv_cert_level
        type: enum
        source: input
        description: Personal high-voltage certification tier; ordinal L1 < L2 < L3.
        constraints: "L1 | L2 | L3"
        default: L3
      - name: cert_expires_at
        type: datetime
        source: input
        description: Certification expiry instant; lapsed when cert_expires_at <= clock_now.
        default: "2027-06-01T00:00:00Z"
      - name: status
        type: enum
        source: computed
        description: CERT_LAPSED when cert_expires_at <= current logical clock, else ACTIVE. Re-evaluated on every read.
        constraints: "ACTIVE | CERT_LAPSED"
        default: ACTIVE
      - name: last_hv_window_end_at
        type: datetime
        source: computed
        description: hv_bay_window_end of the most recent fulfilment this technician performed; null before the first one.
        default: null

  - name: WarrantyClaim
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id
      - name: service_center_id
        type: string
        source: input
        description: FK -> ServiceCenter.id; the center of record for diagnosis and fulfilment.
      - name: assessment_id
        type: string
        source: input
        description: FK -> SohAssessment.id; the diagnostic backing this claim.
      - name: diagnosing_technician_id
        type: string
        source: input
        description: FK -> Technician.id; must belong to service_center_id and equal the acting X-User-ID.
      - name: replacement_pack_id
        type: string
        source: computed
        description: FK -> BatteryPack.id; the pack reserved by an APPROVED_PACK adjudication. Null otherwise.
        default: null
      - name: fulfilment_technician_id
        type: string
        source: computed
        description: FK -> Technician.id; the technician who executed the fulfilment. Null before fulfilment.
        default: null
      - name: linked_campaign_id
        type: string
        source: computed
        description: FK -> RemediationCampaign.id; the campaign named by an APPROVED_SOFTWARE adjudication. Null otherwise.
        default: null
      - name: adjudication_status
        type: enum
        source: computed
        description: >-
          SUBMITTED at creation; INFO_REQUESTED / back to SUBMITTED across request-info and
          resubmit rounds; one of APPROVED_MODULE / APPROVED_PACK / APPROVED_SOFTWARE / DENIED on
          adjudication; FULFILLED once the remedy is executed; CLOSED (terminal) on close.
        constraints: "SUBMITTED | INFO_REQUESTED | APPROVED_MODULE | APPROVED_PACK | APPROVED_SOFTWARE | DENIED | FULFILLED | CLOSED"
        default: SUBMITTED
      - name: recommended_remedy
        type: enum
        source: computed
        description: Output of calculation remedy_decision, recomputed at creation and on every resubmit.
        constraints: "MODULE_REPLACEMENT | PACK_REPLACEMENT | SOFTWARE_REMEDIATION"
      - name: approved_remedy
        type: enum
        source: computed
        description: The adjudicator's decision; null until adjudication.
        constraints: "MODULE_REPLACEMENT | PACK_REPLACEMENT | SOFTWARE_REMEDIATION | DENIED"
        default: null
      - name: recommendation_basis
        type: enum
        source: computed
        description: >-
          Which branch of remedy_decision fired: THERMAL_HISTORY, CELL_DELTA, RETENTION_FLOOR,
          MODULE_ALLOWANCE, MODULE_FAULT or NO_MODULE_FAULT.
        constraints: "THERMAL_HISTORY | CELL_DELTA | RETENTION_FLOOR | MODULE_ALLOWANCE | MODULE_FAULT | NO_MODULE_FAULT"
      - name: info_request_round
        type: integer
        source: computed
        description: Count of INFO_REQUESTED rounds opened on this claim so far.
        default: 0
      - name: settlement_variant
        type: enum
        source: computed
        description: FULL_COVERAGE when the backing assessment's coverage_position == IN_COVERAGE; GOODWILL_PRORATED when GOODWILL_BAND. Null before adjudication.
        constraints: "FULL_COVERAGE | GOODWILL_PRORATED"
        default: null
      - name: remedy_cost_cents
        type: integer
        source: computed
        description: Output of calculation remedy_cost_estimate; null before adjudication.
        default: null
      - name: proration_factor
        type: number
        source: computed
        description: 0.0000 for FULL_COVERAGE; the 4-decimal goodwill factor for GOODWILL_PRORATED. Null before adjudication.
        default: null
      - name: owner_share_cents
        type: integer
        source: computed
        description: Owner's share of remedy_cost_cents; null before adjudication.
        default: null
      - name: oem_share_cents
        type: integer
        source: computed
        description: remedy_cost_cents - owner_share_cents; null before adjudication.
        default: null
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Tiered administration fee keyed on oem_share_cents; null before adjudication.
        default: null
      - name: oem_total_cents
        type: integer
        source: computed
        description: oem_share_cents + admin_fee_cents; 0 for a DENIED claim; null before adjudication.
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the WarrantyAdjudicator who decided this claim; basis of the dispute-resolution two-person rule.
        default: null
      - name: fulfilment_blocked
        type: boolean
        source: computed
        description: True while the center of record is SHIPPING_SUSPENDED or DECERTIFIED; cleared when the center returns to ACTIVE.
        default: false
      - name: hv_bay_window_start
        type: datetime
        source: computed
        description: Start of the half-open HV bay window occupied by the fulfilment; null before fulfilment.
        default: null
      - name: hv_bay_window_end
        type: datetime
        source: computed
        description: End of the half-open HV bay window occupied by the fulfilment; null before fulfilment.
        default: null
      - name: denial_reason
        type: enum
        source: computed
        description: ADJUDICATOR_DECISION when denied at adjudication; DISPUTE_DOWNGRADE when a dispute downgrade collapsed a module approval; CONSENT_DECLINED when the owner declined the software remedy.
        constraints: "ADJUDICATOR_DECISION | DISPUTE_DOWNGRADE | CONSENT_DECLINED"
        default: null
      - name: reopened_count
        type: integer
        source: computed
        description: Count of times a dispute overturn moved this claim from DENIED back to SUBMITTED.
        default: 0
      - name: pack_shipment_required
        type: boolean
        source: computed
        description: True once a fulfilment removed hardware that must ship out (any MODULE_REPLACEMENT or PACK_REPLACEMENT fulfilment); gates close.
        default: false

  - name: ThermalEvent
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id
      - name: pack_id
        type: string
        source: input
        description: FK -> BatteryPack.id; MUST equal the vehicle's installed_pack_id.
      - name: severity
        type: enum
        source: input
        description: S1 (thermal warning) .. S4 (thermal runaway with venting).
        constraints: "S1 | S2 | S3 | S4"
      - name: detected_at
        type: datetime
        source: input
        description: Detection instant; MUST be <= current logical clock. Origin of the notification deadline.
      - name: affected_module_positions
        type: array
        source: input
        description: Integer position_index values implicated in the event.
        default: []
      - name: source
        type: enum
        source: input
        description: TELEMATICS for gateway-detected events, SERVICE_CENTER for technician-reported events.
        constraints: "TELEMATICS | SERVICE_CENTER"
      - name: containment_status
        type: enum
        source: computed
        description: >-
          Containment dimension, advanced one step at a time by containment-step calls:
          DETECTED -> ISOLATED -> PACK_QUARANTINED -> CONTAINMENT_CLOSED.
        constraints: "DETECTED | ISOLATED | PACK_QUARANTINED | CONTAINMENT_CLOSED"
        default: DETECTED
      - name: notification_status
        type: enum
        source: computed
        description: >-
          Regulatory dimension, independent of containment_status: NOT_REQUIRED for severity IN
          {S1, S2}; PENDING at creation for severity IN {S3, S4}; FILED when the notification is
          filed at or before notification_deadline_at; LATE_FILED when filed after it.
        constraints: "NOT_REQUIRED | PENDING | FILED | LATE_FILED"
      - name: notification_deadline_at
        type: datetime
        source: computed
        description: detected_at + 24 hours for S4, detected_at + 72 hours for S3; null for S1/S2.
        default: null
      - name: notification_filed_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the regulatory notification was filed.
        default: null
      - name: regulator_reference
        type: string
        source: computed
        description: Regulator-issued reference string echoed from the filing payload.
        default: null
      - name: reporting_service_center_id
        type: string
        source: computed
        description: FK -> ServiceCenter.id; the center that filed the regulatory notification, and the ONLY center whose late_notification_count a late filing touches. Null until a filing is accepted.
        default: null
      - name: containment_steps_completed
        type: integer
        source: computed
        description: Count of accepted containment steps (0..3).
        default: 0
      - name: event_status
        type: enum
        source: computed
        description: >-
          Parallel-dimension join: COMPLETE when containment_status == CONTAINMENT_CLOSED AND
          notification_status IN {NOT_REQUIRED, FILED, LATE_FILED}; OPEN otherwise.
        constraints: "OPEN | COMPLETE"
        default: OPEN

  - name: RemediationCampaign
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: campaign_code
        type: string
        source: input
        description: Campaign code; unique across the program.
      - name: target_defect
        type: enum
        source: input
        description: CHARGING for charge-control defects, THERMAL_MANAGEMENT for cooling-control defects.
        constraints: "CHARGING | THERMAL_MANAGEMENT"
      - name: software_version
        type: string
        source: input
        description: BMS software version the campaign flashes.
      - name: applies_to_pack_type
        type: enum
        source: input
        description: Pack-type filter for consent solicitation; ANY matches both.
        constraints: "NEW | REMANUFACTURED | ANY"
      - name: applies_to_model_code
        type: string
        source: input
        description: Exact Vehicle.model_code the campaign targets.
      - name: consent_required
        type: boolean
        source: input
        description: When true the flash may only be applied after an explicit owner GRANT.
        default: true
      - name: pilot_region_codes
        type: array
        source: input
        description: Region codes eligible under a LIMITED release; ignored for a FIELD release.
        default: []
      - name: status
        type: enum
        source: computed
        description: >-
          DRAFT at creation; LIMITED_RELEASE or FIELD_RELEASE on release (fork); SUSPENDED when a
          severity-S4 ThermalEvent is reported on a Vehicle whose model_code == applies_to_model_code
          while target_defect == THERMAL_MANAGEMENT; CLOSED (terminal) when
          open_consent_count reaches 0 after at least one solicitation.
        constraints: "DRAFT | LIMITED_RELEASE | FIELD_RELEASE | SUSPENDED | CLOSED"
        default: DRAFT
      - name: release_scope
        type: enum
        source: computed
        description: LIMITED or FIELD, echoing the release fork taken; null while DRAFT.
        constraints: "LIMITED | FIELD"
        default: null
      - name: solicited_consent_count
        type: integer
        source: computed
        description: Lifetime count of RemediationConsent rows created for this campaign.
        default: 0
      - name: open_consent_count
        type: integer
        source: computed
        description: COUNT(RemediationConsent WHERE campaign_id == this AND consent_status IN {PENDING, GRANTED}).
        default: 0
      - name: applied_count
        type: integer
        source: computed
        description: COUNT(RemediationConsent WHERE campaign_id == this AND consent_status == APPLIED).
        default: 0

  - name: RemediationConsent
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> RemediationCampaign.id
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id
      - name: superseded_consent_id
        type: string
        source: input
        description: FK -> RemediationConsent.id; the DECLINED or EXPIRED record this re-solicitation replaces. Null for cascade-created first-round records.
        default: null
      - name: solicitation_round
        type: integer
        source: computed
        description: 1 for cascade-created records; predecessor's solicitation_round + 1 for re-solicitations.
        default: 1
      - name: consent_status
        type: enum
        source: computed
        description: >-
          PENDING at creation; GRANTED or DECLINED on the owner's decision; EXPIRED when a
          cascade (vehicle immobilization or campaign suspension) closes it unanswered or
          unapplied; APPLIED once the flash is recorded.
        constraints: "PENDING | GRANTED | DECLINED | EXPIRED | APPLIED"
        default: PENDING
      - name: expires_at
        type: datetime
        source: computed
        description: created_at + 14 days; the last instant at which the owner's decision or the flash may be recorded. The boundary instant is INCLUSIVE.
      - name: decision_at
        type: datetime
        source: computed
        description: Logical-clock instant of the owner's GRANT or DECLINE.
        default: null
      - name: applied_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the flash was recorded.
        default: null
      - name: applied_software_version
        type: string
        source: computed
        description: Campaign software_version snapshotted at apply time.
        default: null

  - name: CapacityDispute
    parent: WarrantyClaim
    common_fields: true
    kind: resource
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> WarrantyClaim.id
      - name: lab_name
        type: string
        source: input
        description: Independent verification laboratory of record.
      - name: owner_statement
        type: string
        source: input
        description: Owner's free-text basis for disputing the OEM capacity measurement.
      - name: nominal_basis_kwh
        type: number
        source: computed
        description: Copy of the backing SohAssessment.nominal_basis_kwh at filing time; denominator for lab_retention_pct.
      - name: oem_retention_pct
        type: number
        source: computed
        description: Copy of the backing SohAssessment.retention_pct at filing time.
      - name: lab_measured_capacity_kwh
        type: number
        source: computed
        description: Latest independent-lab measured usable capacity in kWh.
        default: null
      - name: lab_retention_pct
        type: number
        source: computed
        description: ROUND_HALF_UP(lab_measured_capacity_kwh / nominal_basis_kwh * 100, 2) for the latest lab result.
        default: null
      - name: deviation_pct
        type: number
        source: computed
        description: ROUND_HALF_UP(lab_retention_pct - oem_retention_pct, 2) for the latest lab result; signed.
        default: null
      - name: retest_count
        type: integer
        source: computed
        description: Number of mandatory retests already ordered (0 or 1).
        default: 0
      - name: dispute_status
        type: enum
        source: computed
        description: >-
          LAB_ASSIGNED at creation; LAB_RESULT_RECEIVED on a lab result that does not trigger a
          retest; back to LAB_ASSIGNED when the first result deviates beyond tolerance;
          RESOLVED_UPHELD / RESOLVED_OVERTURNED / RESOLVED_DOWNGRADED (terminal) on resolution.
        constraints: "LAB_ASSIGNED | LAB_RESULT_RECEIVED | RESOLVED_UPHELD | RESOLVED_OVERTURNED | RESOLVED_DOWNGRADED"
        default: LAB_ASSIGNED
      - name: resolution_note
        type: string
        source: computed
        description: Adjudicator's note echoed from the resolve payload.
        default: null
      - name: resolved_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the resolving WarrantyAdjudicator; MUST differ from the claim's adjudicated_by_user_id.
        default: null

  - name: PackShipment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: pack_id
        type: string
        source: input
        description: FK -> BatteryPack.id; the removed or quarantined pack being shipped.
      - name: origin_service_center_id
        type: string
        source: input
        description: FK -> ServiceCenter.id
      - name: certifying_technician_id
        type: string
        source: input
        description: FK -> Technician.id; signs the hazmat shipper certification. MUST differ from the removing technician.
      - name: shipment_contents
        type: enum
        source: input
        description: FULL_PACK when the whole pack ships, MODULES_ONLY when only removed modules ship.
        constraints: "FULL_PACK | MODULES_ONLY"
      - name: packaging_spec
        type: enum
        source: input
        description: Packaging the shipper actually used; validated against required_packaging_spec at tender.
        constraints: "STANDARD_UN_4G | SP376_STRONG_OUTER"
      - name: transport_mode
        type: enum
        source: input
        description: GROUND or AIR; AIR is forbidden for UN3536.
        constraints: "GROUND | AIR"
        default: GROUND
      - name: destination
        type: enum
        source: input
        description: REMAN_CENTER for refurbishment intake, RECYCLER for scrap.
        constraints: "REMAN_CENTER | RECYCLER"
        default: REMAN_CENTER
      - name: state_of_charge_pct
        type: number
        source: input
        description: State of charge at tender, 2 decimals; capped per classification and transport mode.
        constraints: "0.00..100.00"
      - name: hazmat_classification
        type: enum
        source: computed
        description: Output of calculation hazmat_classification, computed at creation and frozen.
        constraints: "UN3480 | UN3481 | UN3536"
      - name: required_packaging_spec
        type: enum
        source: computed
        description: SP376_STRONG_OUTER when hazmat_classification == UN3536, else STANDARD_UN_4G.
        constraints: "STANDARD_UN_4G | SP376_STRONG_OUTER"
      - name: gross_weight_kg
        type: number
        source: computed
        description: >-
          Declared shipping weight, 3 decimals. Equal to the pack's gross_weight_kg for a
          FULL_PACK shipment; ROUND_HALF_UP(pack.gross_weight_kg * removed_module_count /
          pack.module_count, 3) for a MODULES_ONLY shipment.
      - name: hazmat_fee_cents
        type: integer
        source: computed
        description: ROUND_HALF_UP(surcharge_basis_cents * gross_weight_kg / 100) per calculation hazmat_classification.
      - name: soc_limit_pct
        type: number
        source: computed
        description: 30.00 when hazmat_classification == UN3536 OR transport_mode == AIR, else 50.00.
      - name: status
        type: enum
        source: computed
        description: DRAFT at creation; TENDERED on tender; RECEIVED or REJECTED (both terminal) on receipt.
        constraints: "DRAFT | TENDERED | RECEIVED | REJECTED"
        default: DRAFT
      - name: tendered_at
        type: datetime
        source: computed
        description: Logical-clock instant of tender.
        default: null
      - name: received_at
        type: datetime
        source: computed
        description: Logical-clock instant of receipt.
        default: null
      - name: disposition
        type: enum
        source: computed
        description: REMANUFACTURE or SCRAP, echoed from an accepted receipt; null for a rejected one.
        constraints: "REMANUFACTURE | SCRAP"
        default: null
      - name: rejection_reason
        type: enum
        source: computed
        description: Reason echoed from a rejected receipt; null otherwise.
        constraints: "PACKAGING_NONCONFORMANT | SOC_OUT_OF_LIMIT | DOCUMENTATION_MISSING"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WarrantyClaim
    state_field: adjudication_status
    shape: cyclic_with_branching
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /battery-warranty/warranty-claims"
        actor: ServiceTechnician
        preconditions:
          - "assessment.vehicle_id == body vehicle_id AND assessment.superseded == false"
          - "assessment.diagnostic_validity == VALID"
          - "assessment.coverage_position IN {IN_COVERAGE, GOODWILL_BAND}"
          - "assessment.qualifies_for_claim == true"
          - "no WarrantyClaim exists for this vehicle_id with adjudication_status NOT IN {DENIED, CLOSED}"
          - "vehicle.warranty_hold == false AND no ThermalEvent for this vehicle has event_status == OPEN"
          - "service_center.status != DECERTIFIED"
          - "technician.service_center_id == body service_center_id AND technician.status == ACTIVE"
          - "X-User-ID == body diagnosing_technician_id"
        side_effects:
          - "computes recommended_remedy and recommendation_basis per calculation remedy_decision"
          - "sets info_request_round = 0, reopened_count = 0, fulfilment_blocked = false"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/request-info"
        actor: WarrantyAdjudicator
        preconditions:
          - "claim.adjudication_status == SUBMITTED"
          - "claim.info_request_round < program.info_request_limit"
        side_effects:
          - "increments claim.info_request_round by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/resubmit"
        actor: ServiceTechnician
        preconditions:
          - "claim.adjudication_status == INFO_REQUESTED"
          - "body assessment_id names a SohAssessment for the same vehicle with superseded == false, diagnostic_validity == VALID and qualifies_for_claim == true"
          - "X-User-ID == claim.diagnosing_technician_id"
        side_effects:
          - "repoints claim.assessment_id at the new assessment"
          - "recomputes recommended_remedy and recommendation_basis from the new assessment"
        note: "Cycle edge - INFO_REQUESTED returns to SUBMITTED without resetting info_request_round, so the third request-info is refused."
      - from: SUBMITTED
        to: APPROVED_MODULE
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/adjudicate with approved_remedy=MODULE_REPLACEMENT"
        actor: WarrantyAdjudicator
        preconditions:
          - "claim.adjudication_status == SUBMITTED"
          - "approved_remedy == claim.recommended_remedy OR override_justification is present"
          - "claim.recommendation_basis != THERMAL_HISTORY (safety lock forbids downgrading a thermal-driven pack recommendation)"
          - "service_center.hv_certification_level ordinal >= L2"
          - "program.accrued_liability_cents + computed oem_total_cents <= program.liability_cap_cents"
        side_effects:
          - "computes settlement_variant, remedy_cost_cents, proration_factor, owner_share_cents, oem_share_cents, admin_fee_cents, oem_total_cents per calculations remedy_cost_estimate and claim_settlement"
          - "adds claim.oem_total_cents to program.accrued_liability_cents"
          - "sets claim.adjudicated_by_user_id = acting X-User-ID"
      - from: SUBMITTED
        to: APPROVED_PACK
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/adjudicate with approved_remedy=PACK_REPLACEMENT"
        actor: WarrantyAdjudicator
        preconditions:
          - "claim.adjudication_status == SUBMITTED"
          - "approved_remedy == claim.recommended_remedy OR override_justification is present"
          - "service_center.hv_certification_level == L3 AND service_center.has_pack_lift == true"
          - "calculation reman_pack_selection returns a candidate (else ERR_NO_REMAN_PACK_AVAILABLE)"
          - "program.accrued_liability_cents + computed oem_total_cents <= program.liability_cap_cents"
        side_effects:
          - "selects the replacement pack per calculation reman_pack_selection and sets claim.replacement_pack_id"
          - "selected BatteryPack.status STOCK -> RESERVED (link 1)"
          - "because that pack left STOCK, program.reman_available_count is decremented by 1 (link 2)"
          - "because reman_available_count reached 0, program.reman_stock_state -> DEPLETED (link 3)"
          - "computes the settlement fields and adds oem_total_cents to program.accrued_liability_cents"
          - "sets claim.adjudicated_by_user_id = acting X-User-ID"
      - from: SUBMITTED
        to: APPROVED_SOFTWARE
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/adjudicate with approved_remedy=SOFTWARE_REMEDIATION"
        actor: WarrantyAdjudicator
        preconditions:
          - "claim.adjudication_status == SUBMITTED"
          - "body linked_campaign_id is present and names a RemediationCampaign with status IN {LIMITED_RELEASE, FIELD_RELEASE}"
          - "campaign.applies_to_model_code == vehicle.model_code"
          - "approved_remedy == claim.recommended_remedy OR override_justification is present"
        side_effects:
          - "sets claim.linked_campaign_id = body linked_campaign_id"
          - "when no RemediationConsent exists for (campaign_id, vehicle_id), creates one with consent_status PENDING and solicitation_round 1, and increments campaign.solicited_consent_count and campaign.open_consent_count"
          - "computes the settlement fields with a zero parts line and adds oem_total_cents to program.accrued_liability_cents"
          - "sets claim.adjudicated_by_user_id = acting X-User-ID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/adjudicate with approved_remedy=DENIED"
        actor: WarrantyAdjudicator
        preconditions:
          - "claim.adjudication_status == SUBMITTED"
          - "override_justification is present"
        side_effects:
          - "sets denial_reason = ADJUDICATOR_DECISION, oem_total_cents = 0, owner_share_cents = 0, remedy_cost_cents = 0"
          - "leaves program.accrued_liability_cents unchanged"
          - "sets claim.adjudicated_by_user_id = acting X-User-ID"
      - from: DENIED
        to: SUBMITTED
        trigger: "system - CapacityDispute resolution computes RESOLVED_OVERTURNED"
        actor: system
        preconditions:
          - "dispute.claim_id == claim.id AND claim.adjudication_status == DENIED"
        side_effects:
          - "increments claim.reopened_count by 1 and clears approved_remedy, denial_reason and adjudicated_by_user_id"
        note: "Second cycle edge on the same entity - a denied claim can re-enter adjudication."
      - from: APPROVED_PACK
        to: APPROVED_MODULE
        trigger: "system - CapacityDispute resolution computes RESOLVED_DOWNGRADED"
        actor: system
        preconditions:
          - "claim.adjudication_status == APPROVED_PACK"
        side_effects:
          - "reserved BatteryPack.status RESERVED -> STOCK (link 1)"
          - "because that pack re-entered STOCK, program.reman_available_count is incremented by 1 (link 2)"
          - "because reman_available_count became > 0, program.reman_stock_state -> AVAILABLE (link 3)"
          - "clears claim.replacement_pack_id"
          - "subtracts the old oem_total_cents from program.accrued_liability_cents, recomputes the settlement for a MODULE_REPLACEMENT remedy, then adds the new oem_total_cents"
      - from: APPROVED_MODULE
        to: DENIED
        trigger: "system - CapacityDispute resolution computes RESOLVED_DOWNGRADED on a module approval"
        actor: system
        preconditions:
          - "claim.adjudication_status == APPROVED_MODULE"
        side_effects:
          - "subtracts claim.oem_total_cents from program.accrued_liability_cents, then sets oem_total_cents = 0, oem_share_cents = 0, owner_share_cents = 0, remedy_cost_cents = 0"
          - "sets denial_reason = DISPUTE_DOWNGRADE"
      - from: APPROVED_MODULE
        to: APPROVED_PACK
        trigger: "system - CapacityDispute resolution computes RESOLVED_OVERTURNED on a module approval"
        actor: system
        preconditions:
          - "claim.adjudication_status == APPROVED_MODULE"
          - "calculation reman_pack_selection returns a candidate"
        side_effects:
          - "reserves the selected pack (STOCK -> RESERVED), decrements program.reman_available_count, updates reman_stock_state"
          - "subtracts the old oem_total_cents from program.accrued_liability_cents, recomputes the settlement for a PACK_REPLACEMENT remedy, then adds the new oem_total_cents"
      - from: APPROVED_SOFTWARE
        to: DENIED
        trigger: "system - the linked RemediationConsent is DECLINED by the owner"
        actor: system
        preconditions:
          - "consent.vehicle_id == claim.vehicle_id AND consent.campaign_id == claim.linked_campaign_id"
          - "claim.adjudication_status == APPROVED_SOFTWARE"
        side_effects:
          - "subtracts claim.oem_total_cents from program.accrued_liability_cents, then zeroes the settlement fields"
          - "sets denial_reason = CONSENT_DECLINED"
      - from: APPROVED_MODULE
        to: FULFILLED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/fulfil"
        actor: ServiceTechnician
        preconditions:
          - "claim.adjudication_status == APPROVED_MODULE AND claim.fulfilment_blocked == false"
          - "service_center.status == ACTIVE"
          - "service_center.hv_certification_level ordinal >= L2 AND service_center.insulation_tester_cal_due_at > clock_now"
          - "technician.service_center_id == claim.service_center_id, technician.hv_cert_level ordinal >= L2, technician.status == ACTIVE"
          - "hv bay window is free per calculation hv_bay_window_conflict"
          - "technician cooldown satisfied per calculation technician_cooldown_conflict"
          - "X-User-ID == body fulfilment_technician_id"
        side_effects:
          - "every BatteryModule of the pack with status == FAULTED -> REPLACED with replaced_at = clock_now (link 1)"
          - "because those modules changed status, pack.module_replacements_to_date and pack.faulted_module_count are recomputed (link 2)"
          - "sets claim.fulfilment_technician_id, hv_bay_window_start, hv_bay_window_end, pack_shipment_required = true"
          - "sets technician.last_hv_window_end_at = body hv_bay_window_end"
      - from: APPROVED_PACK
        to: FULFILLED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/fulfil"
        actor: ServiceTechnician
        preconditions:
          - "claim.adjudication_status == APPROVED_PACK AND claim.fulfilment_blocked == false"
          - "service_center.status == ACTIVE AND service_center.hv_certification_level == L3 AND service_center.has_pack_lift == true AND service_center.insulation_tester_cal_due_at > clock_now"
          - "technician.hv_cert_level == L3 AND technician.status == ACTIVE AND technician.service_center_id == claim.service_center_id"
          - "claim.replacement_pack_id names a BatteryPack with status == RESERVED"
          - "hv bay window is free per calculation hv_bay_window_conflict"
          - "technician cooldown satisfied per calculation technician_cooldown_conflict"
          - "X-User-ID == body fulfilment_technician_id"
        side_effects:
          - "removed pack (vehicle.installed_pack_id) status IN_SERVICE or QUARANTINED -> REMOVED and installed_vehicle_id -> null"
          - "replacement pack status RESERVED -> IN_SERVICE, installed_vehicle_id -> claim.vehicle_id, superseded_pack_id -> removed pack id"
          - "vehicle.installed_pack_id -> replacement pack, vehicle.warranty_hold -> false, vehicle.status -> ACTIVE"
          - "sets claim.fulfilment_technician_id, the hv bay window fields and pack_shipment_required = true"
          - "sets technician.last_hv_window_end_at = body hv_bay_window_end"
      - from: APPROVED_SOFTWARE
        to: FULFILLED
        trigger: "system - the linked RemediationConsent reaches APPLIED"
        actor: system
        preconditions:
          - "the WarrantyClaim whose vehicle_id == consent.vehicle_id AND adjudication_status == APPROVED_SOFTWARE exists (at most one, since a vehicle may hold only one non-terminal claim)"
        side_effects:
          - "sets claim.pack_shipment_required = false"
      - from: FULFILLED
        to: CLOSED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/close"
        actor: WarrantyAdjudicator
        preconditions:
          - "claim.adjudication_status == FULFILLED"
          - "claim.pack_shipment_required == false OR a PackShipment with pack_id == the removed pack (or the claim's pack for MODULES_ONLY) has status == RECEIVED"
        side_effects:
          - "freezes the settlement fields; program.accrued_liability_cents is unchanged"
      - from: DENIED
        to: CLOSED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/close"
        actor: WarrantyAdjudicator
        preconditions:
          - "claim.adjudication_status == DENIED (validation priority 20 admits FULFILLED and DENIED)"
          - "no CapacityDispute on this claim has dispute_status IN {LAB_ASSIGNED, LAB_RESULT_RECEIVED}; closing a denial ends the dispute window"
        side_effects:
          - "the zeroed settlement fields are frozen; program.accrued_liability_cents is unchanged"
          - "the claim leaves the disputable set, so a later dispute filing is refused with ERR_CLAIM_NOT_DISPUTABLE at validation priority 21"

  - entity: ThermalEvent
    state_field: containment_status
    shape: parallel_dimension_a
    initial_state: DETECTED
    terminal_states: [CONTAINMENT_CLOSED]
    transitions:
      - from: null
        to: DETECTED
        trigger: "POST /battery-warranty/thermal-events"
        actor: TelematicsGateway | ServiceTechnician
        preconditions:
          - "body pack_id == vehicle.installed_pack_id"
          - "body detected_at <= clock_now"
          - "no ThermalEvent for this vehicle_id has event_status == OPEN"
        side_effects:
          - "sets notification_status = PENDING and notification_deadline_at per calculation regulatory_notification_deadline for severity IN {S3, S4}; NOT_REQUIRED with a null deadline for S1/S2"
          - "for severity IN {S3, S4}: pack.damaged_defective -> true, pack.hazmat_classification -> UN3536, pack.status IN_SERVICE -> QUARANTINED (cascade A link 1)"
          - "for severity IN {S3, S4}: every BatteryModule of the pack whose position_index is in affected_module_positions gets thermal_runaway_flag = true and status -> FAULTED"
          - "because the pack entered QUARANTINED, vehicle.warranty_hold -> true and vehicle.status -> IMMOBILIZED (cascade A link 2)"
          - "because the vehicle became IMMOBILIZED, every RemediationConsent for that vehicle_id with consent_status IN {PENDING, GRANTED} -> EXPIRED (cascade A link 3)"
          - "because those consents left the open set, each affected RemediationCampaign recomputes open_consent_count and auto-transitions to CLOSED when it reaches 0 while status IN {LIMITED_RELEASE, FIELD_RELEASE} (cascade A link 4)"
          - "for severity == S4: every RemediationCampaign with target_defect == THERMAL_MANAGEMENT, applies_to_model_code == vehicle.model_code and status IN {LIMITED_RELEASE, FIELD_RELEASE} -> SUSPENDED; this suspension check is evaluated BEFORE the consent-expiry cascade, and a SUSPENDED campaign never auto-closes"
      - from: DETECTED
        to: ISOLATED
        trigger: "POST /battery-warranty/thermal-events/{event_id}/containment-step with step_index=1 (ISOLATE_HV)"
        actor: ServiceTechnician
        preconditions:
          - "event.containment_status == DETECTED"
          - "technician.hv_cert_level ordinal >= L2 AND technician.status == ACTIVE"
        side_effects:
          - "increments containment_steps_completed to 1"
      - from: ISOLATED
        to: PACK_QUARANTINED
        trigger: "POST /battery-warranty/thermal-events/{event_id}/containment-step with step_index=2 (QUARANTINE_PACK)"
        actor: ServiceTechnician
        preconditions:
          - "event.containment_status == ISOLATED"
          - "pack.status == QUARANTINED (already set for S3/S4 at creation; an S1/S2 event must be quarantined by the step itself)"
        side_effects:
          - "increments containment_steps_completed to 2"
          - "for severity IN {S1, S2}: pack.status IN_SERVICE -> QUARANTINED and pack.damaged_defective -> true"
      - from: PACK_QUARANTINED
        to: CONTAINMENT_CLOSED
        trigger: "POST /battery-warranty/thermal-events/{event_id}/containment-step with step_index=3 (CLOSE_CONTAINMENT)"
        actor: ServiceTechnician
        preconditions:
          - "event.containment_status == PACK_QUARANTINED"
          - "event.notification_status IN {NOT_REQUIRED, FILED, LATE_FILED} - the containment dimension may not close while the regulatory dimension is still PENDING"
        side_effects:
          - "increments containment_steps_completed to 3"
          - "recomputes event_status; it becomes COMPLETE because the notification dimension is already settled"

  - entity: ThermalEvent
    state_field: notification_status
    shape: parallel_dimension_b
    initial_state: PENDING
    terminal_states: [NOT_REQUIRED, FILED, LATE_FILED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /battery-warranty/thermal-events/{event_id}/regulatory-notification with clock_now <= notification_deadline_at"
        actor: RegulatoryLiaison
        preconditions:
          - "event.notification_status == PENDING"
          - "clock_now <= event.notification_deadline_at (boundary is inclusive)"
        side_effects:
          - "sets notification_filed_at = clock_now and regulator_reference from the payload"
          - "recomputes event_status; still OPEN unless containment_status is already CONTAINMENT_CLOSED"
        note: "This dimension advances independently of containment_status, which may be DETECTED, ISOLATED or PACK_QUARANTINED at filing time."
      - from: PENDING
        to: LATE_FILED
        trigger: "POST /battery-warranty/thermal-events/{event_id}/regulatory-notification with clock_now > notification_deadline_at"
        actor: RegulatoryLiaison
        preconditions:
          - "event.notification_status == PENDING"
          - "clock_now > event.notification_deadline_at"
        side_effects:
          - "sets notification_filed_at = clock_now and regulator_reference from the payload"
          - "increments late_notification_count by 1 on exactly one ServiceCenter: the one named by body reporting_service_center_id (link 1)"
          - "because late_notification_count changed, that center recomputes compliance_score = MAX(0, 100 - 15 * rejected_shipment_count - 40 * late_notification_count) (link 2)"
          - "when and only when the recomputed compliance_score is <= 20, that center's status -> DECERTIFIED (link 3); one late filing on a center with no rejected shipments yields 60 and does not decertify"

  - entity: ServiceCenter
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [DECERTIFIED]
    transitions:
      - from: ACTIVE
        to: SHIPPING_SUSPENDED
        trigger: "system - open_hazmat_holds reaches 2 after a PackShipment is REJECTED"
        actor: system
        preconditions:
          - "center.open_hazmat_holds >= 2 AND center.status == ACTIVE"
        side_effects:
          - "every WarrantyClaim with service_center_id == this center and adjudication_status IN {APPROVED_MODULE, APPROVED_PACK} gets fulfilment_blocked = true"
      - from: SHIPPING_SUSPENDED
        to: ACTIVE
        trigger: "system - open_hazmat_holds falls to <= 1 after a re-tendered pack is RECEIVED"
        actor: system
        preconditions:
          - "center.open_hazmat_holds <= 1 AND center.status == SHIPPING_SUSPENDED"
        side_effects:
          - "every WarrantyClaim with service_center_id == this center and fulfilment_blocked == true gets fulfilment_blocked = false"
        note: "Cycle edge - a suspended center is restored without administrative action once its hazmat holds clear."
      - from: ACTIVE
        to: DECERTIFIED
        trigger: "system - compliance_score falls to <= 20"
        actor: system
        preconditions:
          - "center.compliance_score <= 20"
        side_effects:
          - "every WarrantyClaim with service_center_id == this center and adjudication_status NOT IN {DENIED, CLOSED} gets fulfilment_blocked = true"
      - from: SHIPPING_SUSPENDED
        to: DECERTIFIED
        trigger: "system - compliance_score falls to <= 20 while suspended"
        actor: system
        preconditions:
          - "center.compliance_score <= 20"
        side_effects:
          - "every WarrantyClaim with service_center_id == this center and adjudication_status NOT IN {DENIED, CLOSED} gets fulfilment_blocked = true"

  - entity: BatteryPack
    state_field: status
    shape: branching
    initial_state: STOCK
    terminal_states: [SCRAPPED]
    transitions:
      - from: null
        to: STOCK
        trigger: "POST /battery-warranty/battery-packs without installed_vehicle_id"
        actor: ProgramAdmin
        preconditions:
          - "serial_number is unique"
          - "refurb_soh_pct is present when pack_type == REMANUFACTURED and absent when pack_type == NEW"
        side_effects:
          - "creates module_count BatteryModule children with position_index 1..module_count, status HEALTHY"
          - "when pack_type == REMANUFACTURED, increments program-wide reman_available_count on every WarrantyProgram and refreshes reman_stock_state"
      - from: null
        to: IN_SERVICE
        trigger: "POST /battery-warranty/battery-packs with installed_vehicle_id"
        actor: ProgramAdmin
        preconditions:
          - "the named Vehicle exists and has installed_pack_id == null"
        side_effects:
          - "creates module_count BatteryModule children"
          - "sets vehicle.installed_pack_id to this pack"
      - from: STOCK
        to: RESERVED
        trigger: "system - APPROVED_PACK adjudication selects this pack"
        actor: system
        preconditions:
          - "pack.status == STOCK AND pack.installed_vehicle_id == null"
        side_effects:
          - "decrements program.reman_available_count and refreshes reman_stock_state"
      - from: RESERVED
        to: STOCK
        trigger: "system - CapacityDispute downgrade releases the reservation"
        actor: system
        preconditions:
          - "pack.status == RESERVED"
        side_effects:
          - "increments program.reman_available_count and refreshes reman_stock_state"
      - from: RESERVED
        to: IN_SERVICE
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/fulfil on an APPROVED_PACK claim"
        actor: ServiceTechnician
        preconditions:
          - "pack.status == RESERVED AND pack.id == claim.replacement_pack_id"
        side_effects:
          - "sets installed_vehicle_id and superseded_pack_id"
      - from: IN_SERVICE
        to: REMOVED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/fulfil on an APPROVED_PACK claim"
        actor: ServiceTechnician
        preconditions:
          - "pack.id == vehicle.installed_pack_id"
        side_effects:
          - "clears installed_vehicle_id"
      - from: QUARANTINED
        to: REMOVED
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/fulfil on an APPROVED_PACK claim for a quarantined pack"
        actor: ServiceTechnician
        preconditions:
          - "pack.id == vehicle.installed_pack_id AND every ThermalEvent referencing this pack has containment_status == CONTAINMENT_CLOSED"
        side_effects:
          - "clears installed_vehicle_id; pack.damaged_defective stays true so the outbound shipment classifies as UN3536"
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "POST /battery-warranty/thermal-events (severity S3/S4) or containment-step QUARANTINE_PACK (severity S1/S2)"
        actor: system
        preconditions:
          - "pack.status == IN_SERVICE"
        side_effects:
          - "sets damaged_defective = true and hazmat_classification = UN3536"
      - from: REMOVED
        to: QUARANTINED
        trigger: "system - a PackShipment carrying this pack is REJECTED"
        actor: system
        preconditions:
          - "pack.status == REMOVED"
        side_effects:
          - "sets damaged_defective = true and hazmat_classification = UN3536 (cascade B link 1)"
          - "because the pack entered QUARANTINED from a rejection, origin center.open_hazmat_holds is incremented by 1 (cascade B link 2)"
      - from: QUARANTINED
        to: STOCK
        trigger: "POST /battery-warranty/pack-shipments/{shipment_id}/receive with outcome=ACCEPTED and disposition=REMANUFACTURE"
        actor: ProgramAdmin
        preconditions:
          - "shipment.status == TENDERED AND shipment.pack_id == pack.id"
        side_effects:
          - "sets pack_type = REMANUFACTURED, increments remanufacture_count, sets refurb_soh_pct from the receipt payload, clears damaged_defective, sets every module status to HEALTHY"
          - "increments program.reman_available_count and refreshes reman_stock_state"
          - "decrements origin center.open_hazmat_holds by 1 with a floor of 0 when the pack was held"
      - from: REMOVED
        to: STOCK
        trigger: "POST /battery-warranty/pack-shipments/{shipment_id}/receive with outcome=ACCEPTED and disposition=REMANUFACTURE"
        actor: ProgramAdmin
        preconditions:
          - "shipment.status == TENDERED AND shipment.pack_id == pack.id"
        side_effects:
          - "sets pack_type = REMANUFACTURED, increments remanufacture_count, sets refurb_soh_pct from the receipt payload, sets every module status to HEALTHY"
          - "increments program.reman_available_count and refreshes reman_stock_state"
      - from: REMOVED
        to: SCRAPPED
        trigger: "POST /battery-warranty/pack-shipments/{shipment_id}/receive with outcome=ACCEPTED and disposition=SCRAP"
        actor: ProgramAdmin
        preconditions:
          - "shipment.status == TENDERED AND shipment.destination == RECYCLER"
        side_effects:
          - "sets every module status to REPLACED and clears hazmat_classification"
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /battery-warranty/pack-shipments/{shipment_id}/receive with outcome=ACCEPTED and disposition=SCRAP"
        actor: ProgramAdmin
        preconditions:
          - "shipment.status == TENDERED AND shipment.destination == RECYCLER"
        side_effects:
          - "decrements origin center.open_hazmat_holds by 1 with a floor of 0 when the pack was held"

  - entity: Vehicle
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: IMMOBILIZED
        trigger: "system - the installed pack enters QUARANTINED"
        actor: system
        preconditions:
          - "vehicle.installed_pack_id names a pack whose status became QUARANTINED"
        side_effects:
          - "sets warranty_hold = true"
          - "expires the vehicle's PENDING and GRANTED RemediationConsents"
      - from: IMMOBILIZED
        to: ACTIVE
        trigger: "POST /battery-warranty/warranty-claims/{claim_id}/fulfil on an APPROVED_PACK claim"
        actor: ServiceTechnician
        preconditions:
          - "the replacement pack reaches IN_SERVICE on this vehicle"
        side_effects:
          - "sets warranty_hold = false"
        note: "Cycle edge - a vehicle returns to service once a healthy pack is installed."

  - entity: RemediationCampaign
    state_field: status
    shape: branching_fork_with_compound_close
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LIMITED_RELEASE
        trigger: "POST /battery-warranty/remediation-campaigns/{campaign_id}/release with release_scope=LIMITED"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == DRAFT"
          - "campaign.pilot_region_codes is non-empty (validation priority 70)"
        side_effects:
          - "sets release_scope = LIMITED"
          - "creates one PENDING RemediationConsent per eligible Vehicle, where eligible means vehicle.model_code == applies_to_model_code AND vehicle.status == ACTIVE AND vehicle.region_code IN pilot_region_codes AND (applies_to_pack_type == ANY OR the installed pack's pack_type == applies_to_pack_type); creation order is vehicle.created_at ASC"
          - "sets solicited_consent_count and open_consent_count to the number of consents created"
        note: "Fork branch A - the eligibility filter additionally intersects pilot_region_codes, so this branch's consent set is a strict subset of branch B's for the same fleet."
      - from: DRAFT
        to: FIELD_RELEASE
        trigger: "POST /battery-warranty/remediation-campaigns/{campaign_id}/release with release_scope=FIELD"
        actor: ProgramAdmin
        preconditions:
          - "campaign.status == DRAFT"
        side_effects:
          - "sets release_scope = FIELD"
          - "creates one PENDING RemediationConsent per eligible Vehicle, ignoring pilot_region_codes entirely; creation order is vehicle.created_at ASC"
          - "sets solicited_consent_count and open_consent_count to the number of consents created"
        note: "Fork branch B - divergent side-effect set from branch A (no region filter)."
      - from: LIMITED_RELEASE
        to: SUSPENDED
        trigger: "system - a severity-S4 ThermalEvent is reported on a matching model while target_defect == THERMAL_MANAGEMENT"
        actor: system
        preconditions:
          - "campaign.status == LIMITED_RELEASE AND campaign.target_defect == THERMAL_MANAGEMENT AND campaign.applies_to_model_code == vehicle.model_code"
        side_effects:
          - "every RemediationConsent of this campaign with consent_status == PENDING -> EXPIRED; GRANTED consents are left untouched so an in-progress flash can still be recorded only after the campaign is re-released (which this scaffold does not permit)"
          - "recomputes open_consent_count; a SUSPENDED campaign never auto-closes"
      - from: FIELD_RELEASE
        to: SUSPENDED
        trigger: "system - a severity-S4 ThermalEvent is reported on a matching model while target_defect == THERMAL_MANAGEMENT"
        actor: system
        preconditions:
          - "campaign.status == FIELD_RELEASE AND campaign.target_defect == THERMAL_MANAGEMENT AND campaign.applies_to_model_code == vehicle.model_code"
        side_effects:
          - "every RemediationConsent of this campaign with consent_status == PENDING -> EXPIRED"
          - "recomputes open_consent_count; a SUSPENDED campaign never auto-closes"
      - from: LIMITED_RELEASE
        to: CLOSED
        trigger: "system - open_consent_count reaches 0"
        actor: system
        preconditions:
          - "campaign.solicited_consent_count >= 1 AND campaign.open_consent_count == 0"
        side_effects:
          - "freezes applied_count"
        note: "Compound close - the parent's state is derived from the aggregate state of its consent children."
      - from: FIELD_RELEASE
        to: CLOSED
        trigger: "system - open_consent_count reaches 0"
        actor: system
        preconditions:
          - "campaign.solicited_consent_count >= 1 AND campaign.open_consent_count == 0"
        side_effects:
          - "freezes applied_count"

  - entity: RemediationConsent
    state_field: consent_status
    shape: branching
    initial_state: PENDING
    terminal_states: [DECLINED, EXPIRED, APPLIED]
    transitions:
      - from: null
        to: PENDING
        trigger: "system - campaign release, or POST /battery-warranty/remediation-consents for a re-solicitation"
        actor: system | ProgramAdmin
        preconditions:
          - "for a re-solicitation: the named superseded_consent_id has consent_status IN {DECLINED, EXPIRED} and belongs to the same (campaign_id, vehicle_id) pair"
          - "for a re-solicitation: campaign.status IN {LIMITED_RELEASE, FIELD_RELEASE}"
          - "for a re-solicitation: body expected_campaign_version equals campaign.version"
        side_effects:
          - "sets solicitation_round = predecessor.solicitation_round + 1 for a re-solicitation, else 1"
          - "increments campaign.solicited_consent_count and campaign.open_consent_count"
          - "increments campaign.version by 1"
      - from: PENDING
        to: GRANTED
        trigger: "POST /battery-warranty/remediation-consents/{consent_id}/decision with decision=GRANT"
        actor: VehicleOwner
        preconditions:
          - "consent.consent_status == PENDING"
          - "campaign.status IN {LIMITED_RELEASE, FIELD_RELEASE}"
          - "X-User-ID == consent.vehicle_id"
        side_effects:
          - "sets decision_at = clock_now"
          - "campaign.open_consent_count is unchanged, because GRANTED remains inside the open set {PENDING, GRANTED}"
      - from: PENDING
        to: DECLINED
        trigger: "POST /battery-warranty/remediation-consents/{consent_id}/decision with decision=DECLINE"
        actor: VehicleOwner
        preconditions:
          - "consent.consent_status == PENDING"
          - "campaign.status IN {LIMITED_RELEASE, FIELD_RELEASE}"
          - "X-User-ID == consent.vehicle_id"
        side_effects:
          - "sets decision_at = clock_now"
          - "decrements campaign.open_consent_count by 1 (link 1)"
          - "because the open set shrank, the campaign auto-transitions to CLOSED when open_consent_count reaches 0 (link 2)"
          - "the WarrantyClaim with vehicle_id == consent.vehicle_id, linked_campaign_id == consent.campaign_id and adjudication_status == APPROVED_SOFTWARE, when one exists, -> DENIED with denial_reason CONSENT_DECLINED and its oem_total_cents is subtracted from program.accrued_liability_cents (link 1b)"
      - from: PENDING
        to: EXPIRED
        trigger: "system - the vehicle is IMMOBILIZED or the campaign is SUSPENDED"
        actor: system
        preconditions:
          - "consent.consent_status == PENDING"
        side_effects:
          - "decrements campaign.open_consent_count by 1"
      - from: GRANTED
        to: EXPIRED
        trigger: "system - the vehicle is IMMOBILIZED"
        actor: system
        preconditions:
          - "consent.consent_status == GRANTED"
        side_effects:
          - "decrements campaign.open_consent_count by 1"
      - from: GRANTED
        to: APPLIED
        trigger: "POST /battery-warranty/remediation-consents/{consent_id}/apply-update"
        actor: ServiceTechnician
        preconditions:
          - "consent.consent_status == GRANTED"
          - "campaign.status IN {LIMITED_RELEASE, FIELD_RELEASE}"
          - "vehicle.status == ACTIVE"
          - "technician.status == ACTIVE AND technician.hv_cert_level ordinal >= L1"
        side_effects:
          - "sets applied_at = clock_now and applied_software_version = campaign.software_version"
          - "decrements campaign.open_consent_count by 1 and increments campaign.applied_count by 1 (link 1)"
          - "because the open set shrank, the campaign auto-transitions to CLOSED when open_consent_count reaches 0 (link 2)"
          - "the WarrantyClaim with vehicle_id == consent.vehicle_id, linked_campaign_id == consent.campaign_id and adjudication_status == APPROVED_SOFTWARE, when one exists, -> FULFILLED (link 1b)"

  - entity: CapacityDispute
    state_field: dispute_status
    shape: cyclic
    initial_state: LAB_ASSIGNED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_OVERTURNED, RESOLVED_DOWNGRADED]
    transitions:
      - from: null
        to: LAB_ASSIGNED
        trigger: "POST /battery-warranty/capacity-disputes"
        actor: VehicleOwner
        preconditions:
          - "claim.adjudication_status IN {APPROVED_MODULE, APPROVED_PACK, APPROVED_SOFTWARE, DENIED, FULFILLED} (validation priority 21)"
          - "no CapacityDispute for this claim_id has dispute_status IN {LAB_ASSIGNED, LAB_RESULT_RECEIVED}"
          - "X-User-ID == claim.vehicle_id"
          - "body expected_claim_version equals claim.version"
        side_effects:
          - "copies nominal_basis_kwh and retention_pct from the claim's backing SohAssessment into nominal_basis_kwh and oem_retention_pct"
          - "increments claim.version by 1"
      - from: LAB_ASSIGNED
        to: LAB_RESULT_RECEIVED
        trigger: "POST /battery-warranty/capacity-disputes/{dispute_id}/lab-result"
        actor: IndependentLab
        preconditions:
          - "dispute.dispute_status == LAB_ASSIGNED"
          - "ABS(deviation_pct) <= program.lab_tolerance_pct OR dispute.retest_count == 1"
        side_effects:
          - "sets lab_measured_capacity_kwh, lab_retention_pct and deviation_pct per calculation lab_deviation"
      - from: LAB_ASSIGNED
        to: LAB_ASSIGNED
        trigger: "POST /battery-warranty/capacity-disputes/{dispute_id}/lab-result with ABS(deviation_pct) > program.lab_tolerance_pct and retest_count == 0"
        actor: IndependentLab
        preconditions:
          - "dispute.dispute_status == LAB_ASSIGNED AND dispute.retest_count == 0"
          - "ABS(deviation_pct) > program.lab_tolerance_pct"
        side_effects:
          - "stores lab_measured_capacity_kwh, lab_retention_pct and deviation_pct from this first result"
          - "increments retest_count to 1 and holds the dispute in LAB_ASSIGNED awaiting the retest"
        note: "Cycle self-edge - a materially deviating first measurement mandates exactly one retest before resolution."
      - from: LAB_RESULT_RECEIVED
        to: RESOLVED_UPHELD
        trigger: "POST /battery-warranty/capacity-disputes/{dispute_id}/resolve where ABS(deviation_pct) <= program.lab_tolerance_pct"
        actor: WarrantyAdjudicator
        preconditions:
          - "dispute.dispute_status == LAB_RESULT_RECEIVED"
          - "X-User-ID != claim.adjudicated_by_user_id"
        side_effects:
          - "sets resolution_note and resolved_by_user_id; the claim is untouched"
      - from: LAB_RESULT_RECEIVED
        to: RESOLVED_OVERTURNED
        trigger: "POST /battery-warranty/capacity-disputes/{dispute_id}/resolve where deviation_pct < -program.lab_tolerance_pct"
        actor: WarrantyAdjudicator
        preconditions:
          - "dispute.dispute_status == LAB_RESULT_RECEIVED"
          - "X-User-ID != claim.adjudicated_by_user_id"
        side_effects:
          - "sets resolution_note and resolved_by_user_id"
          - "drives the claim's DENIED -> SUBMITTED or APPROVED_MODULE -> APPROVED_PACK edge"
      - from: LAB_RESULT_RECEIVED
        to: RESOLVED_DOWNGRADED
        trigger: "POST /battery-warranty/capacity-disputes/{dispute_id}/resolve where deviation_pct > program.lab_tolerance_pct"
        actor: WarrantyAdjudicator
        preconditions:
          - "dispute.dispute_status == LAB_RESULT_RECEIVED"
          - "X-User-ID != claim.adjudicated_by_user_id"
        side_effects:
          - "sets resolution_note and resolved_by_user_id"
          - "drives the claim's APPROVED_PACK -> APPROVED_MODULE or APPROVED_MODULE -> DENIED edge, which reverses the corresponding liability and reservation side effects"

  - entity: PackShipment
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [RECEIVED, REJECTED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /battery-warranty/pack-shipments"
        actor: ServiceTechnician
        preconditions:
          - "pack.status IN {REMOVED, QUARANTINED}"
          - "certifying technician belongs to origin_service_center_id, status == ACTIVE and hv_cert_level ordinal >= L2"
          - "certifying_technician_id != the fulfilment_technician_id of any WarrantyClaim whose replacement_pack_id or removed pack equals pack_id (two-person hazmat rule)"
          - "origin center.status != DECERTIFIED"
        side_effects:
          - "computes hazmat_classification, required_packaging_spec and soc_limit_pct per calculation hazmat_classification"
      - from: DRAFT
        to: TENDERED
        trigger: "POST /battery-warranty/pack-shipments/{shipment_id}/tender"
        actor: ServiceTechnician
        preconditions:
          - "shipment.status == DRAFT"
          - "shipment.packaging_spec == shipment.required_packaging_spec"
          - "NOT (shipment.hazmat_classification == UN3536 AND shipment.transport_mode == AIR)"
          - "shipment.state_of_charge_pct <= shipment.soc_limit_pct"
          - "origin center.status != DECERTIFIED"
        side_effects:
          - "sets tendered_at = clock_now"
      - from: TENDERED
        to: RECEIVED
        trigger: "POST /battery-warranty/pack-shipments/{shipment_id}/receive with outcome=ACCEPTED"
        actor: ProgramAdmin
        preconditions:
          - "shipment.status == TENDERED"
          - "disposition is present; REMANUFACTURE requires destination == REMAN_CENTER and refurb_soh_pct in the payload; SCRAP requires destination == RECYCLER"
        side_effects:
          - "sets received_at = clock_now and disposition"
          - "drives the pack's -> STOCK or -> SCRAPPED edge and the hazmat-hold decrement"
      - from: TENDERED
        to: REJECTED
        trigger: "POST /battery-warranty/pack-shipments/{shipment_id}/receive with outcome=REJECTED"
        actor: ProgramAdmin
        preconditions:
          - "shipment.status == TENDERED"
          - "rejection_reason is present"
        side_effects:
          - "sets received_at = clock_now and rejection_reason"
          - "pack.status REMOVED -> QUARANTINED with damaged_defective = true (cascade B link 1)"
          - "because the pack entered QUARANTINED from a rejection, origin center.open_hazmat_holds is incremented by 1 (cascade B link 2)"
          - "because open_hazmat_holds reached 2, origin center.status ACTIVE -> SHIPPING_SUSPENDED (cascade B link 3)"
          - "because the center became SHIPPING_SUSPENDED, every WarrantyClaim of that center with adjudication_status IN {APPROVED_MODULE, APPROVED_PACK} gets fulfilment_blocked = true (cascade B link 4)"
          - "increments origin center.rejected_shipment_count by 1 and recomputes compliance_score"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` - the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /battery-warranty/soh-assessments"
    occ_field: "expected_vehicle_version"
    description: |
      Creating a SohAssessment against a Vehicle whose version has advanced since the client last
      observed it is rejected. A new assessment legitimately supersedes every prior assessment for
      that vehicle (setting superseded = true on them), so a writer holding a stale view of the
      vehicle would silently invalidate a diagnostic it never saw - including one produced by a
      telematics snapshot ingest that moved odometer_miles.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
  - rule_id: dispute-create-stale-claim
    parent_entity: WarrantyClaim
    write_endpoint: "POST /battery-warranty/capacity-disputes"
    occ_field: "expected_claim_version"
    description: |
      Filing a CapacityDispute against a WarrantyClaim whose version has advanced since the owner
      last observed it is rejected. The dispute snapshots the claim's settlement basis
      (nominal_basis_kwh and oem_retention_pct) at filing time, so a stale view would freeze a
      basis that no longer describes the claim the owner intends to dispute.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: consent-resolicit-stale-campaign
    parent_entity: RemediationCampaign
    write_endpoint: "POST /battery-warranty/remediation-consents"
    occ_field: "expected_campaign_version"
    description: |
      Creating a re-solicitation RemediationConsent against a RemediationCampaign whose version has
      advanced since the client last observed it is rejected. Each re-solicitation legitimately
      supersedes a DECLINED or EXPIRED record and raises the campaign's open_consent_count, so a
      writer with a stale campaign view could re-open a campaign that has since been suspended or
      compound-closed.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: temperature_correction_factor
    trigger: "on POST /battery-warranty/vehicles/{id}/telematics-snapshots, before validity_flag is set"
    algorithm: threshold
    formula: |
      # Step function on coolant_temp_c. Boundaries are exact: 0.0 belongs to the 1.03 band,
      # 15.0 belongs to the 1.00 band, 35.0 belongs to the 1.00 band, 35.0001 to the 0.97 band.
      if coolant_temp_c < 0.0:        factor = 1.06
      elif coolant_temp_c < 15.0:     factor = 1.03
      elif coolant_temp_c <= 35.0:    factor = 1.00
      else:                           factor = 0.97
      corrected_capacity_kwh = ROUND_HALF_UP(reported_capacity_kwh * factor, 3)
    input_set: "The single snapshot being ingested; independent of every other row."
    constants:
      COLD_FACTOR: 1.06
      COOL_FACTOR: 1.03
      NOMINAL_FACTOR: 1.00
      HOT_FACTOR: 0.97
      COLD_EDGE_C: 0.0
      COOL_EDGE_C: 15.0
      HOT_EDGE_C: 35.0
    precision: "3 decimal places on corrected_capacity_kwh, round_half_up"

  - name: diagnostic_validity_gate
    trigger: "on POST /battery-warranty/soh-assessments, before any retention arithmetic"
    algorithm: threshold
    formula: |
      # PINNED evaluation order; the FIRST rule that fires wins and short-circuits.
      all_valid = TelematicsSnapshot WHERE vehicle_id == assessment.vehicle_id
                                      AND validity_flag == VALID
      (1) if COUNT(all_valid) == 0:                       -> INSUFFICIENT_DATA
      fresh = all_valid WHERE captured_at >= clock_now - program.snapshot_freshness_days days
              # lower bound INCLUSIVE: captured_at exactly on the boundary instant is fresh
      (2) if COUNT(fresh) == 0:                           -> STALE_TELEMETRY
      window = fresh ORDER BY captured_at DESC, created_at DESC  LIMIT program.snapshot_window_size
      window_snapshot_count      = COUNT(window)
      assessed_odometer_miles    = window[0].odometer_miles
      max_cell_delta_mv          = window[0].max_cell_delta_mv
      (3) if variant == TELEMATICS_FLEET AND COUNT(window) < program.snapshot_min_count:
                                                          -> INSUFFICIENT_DATA
      (4) if variant == BENCH_CAPACITY_TEST
             AND bench_measured_capacity_kwh > nominal_basis_kwh * 1.05:
                                                          -> BENCH_OUT_OF_RANGE
      (5) otherwise                                       -> VALID
    input_set: >-
      Only TelematicsSnapshot rows with validity_flag == VALID enter any set; rows flagged
      INVALID_FUTURE_CAPTURE, INVALID_CAPACITY_RANGE or INVALID_ODOMETER_REGRESSION are excluded
      from all_valid, fresh and window, and never contribute to odometer or cell-delta reads.
    constants:
      BENCH_PLAUSIBILITY_MULTIPLIER: 1.05
    precision: "integer counts; datetime comparison at millisecond resolution"

  - name: soh_retention
    trigger: "on POST /battery-warranty/soh-assessments when diagnostic_validity == VALID"
    algorithm: aggregation
    formula: |
      # Shared step: nominal_basis_kwh differs per variant (see variants below).
      retention_pct = ROUND_HALF_UP(estimated_capacity_kwh / nominal_basis_kwh * 100, 2)
    input_set: "The window produced by diagnostic_validity_gate, plus the pack's module roster."
    constants:
      TRIM_COUNT_EACH_END: 1
    precision: "estimated_capacity_kwh 3 decimals round_half_up; retention_pct 2 decimals round_half_up"
    variants:
      - name: TELEMATICS_FLEET
        when: "assessment.variant == TELEMATICS_FLEET"
        difference: |
          nominal_basis_kwh = pack.nominal_capacity_kwh    # the FULL beginning-of-life capacity;
                                                           # faulted modules are NOT excluded
          corrected = [s.corrected_capacity_kwh for s in window]
          if COUNT(window) == program.snapshot_window_size:
              # trimmed mean: sort ascending, drop the single lowest and single highest value,
              # average the remainder. Sorting ties need no tie-break because the mean of a
              # multiset is order-insensitive.
              trimmed = SORT_ASC(corrected)[1 : COUNT(window)-1]
          else:
              trimmed = corrected                          # window size 3 or 4: plain mean
          estimated_capacity_kwh = ROUND_HALF_UP(SUM(trimmed) / COUNT(trimmed), 3)
      - name: BENCH_CAPACITY_TEST
        when: "assessment.variant == BENCH_CAPACITY_TEST"
        difference: |
          # module_fault_positions are written to the pack's modules BEFORE nominal_basis_kwh is
          # computed, so this variant's denominator excludes faulted modules pro rata.
          faulted_after_write = COUNT(BatteryModule WHERE pack_id == assessment.pack_id
                                                      AND status == FAULTED)
          nominal_basis_kwh = ROUND_HALF_UP(
              pack.nominal_capacity_kwh * (pack.module_count - faulted_after_write)
                                        / pack.module_count, 3)
          estimated_capacity_kwh = bench_measured_capacity_kwh
        note: >-
          DIVERGENCE: for identical measured capacity the two variants return different
          retention_pct whenever faulted_after_write > 0, because only the bench variant shrinks
          the denominator. Both are defensible readings of "capacity retention"; the scaffold
          pins which one each variant uses.

  - name: elapsed_coverage_position
    trigger: "on POST /battery-warranty/soh-assessments, and again on every claim resubmit"
    algorithm: tiered_pricing
    formula: |
      # (a) whole elapsed months, floored on the day-of-month
      y1,m1,d1 = calendar parts of vehicle.in_service_date (UTC)
      y2,m2,d2 = calendar parts of clock_now (UTC)
      elapsed_months = (y2 - y1) * 12 + (m2 - m1) - (1 if d2 < d1 else 0)

      # (b) tier selection: scan retention_schedule in stored order (ascending through_months)
      #     and take the FIRST row where BOTH axes are within the row. Both bounds INCLUSIVE.
      selected = null
      for row in program.retention_schedule:                 # ascending through_months
          if elapsed_months <= row.through_months AND assessed_odometer_miles <= row.through_miles:
              selected = row; break
      if selected is not null:
          coverage_position           = IN_COVERAGE
          applicable_min_retention_pct = selected.min_retention_pct
      elif elapsed_months <= program.coverage_months + program.goodwill_months
           AND assessed_odometer_miles <= program.coverage_miles + program.goodwill_miles:
          coverage_position           = GOODWILL_BAND      # BOTH axes must be inside the band
          applicable_min_retention_pct = LAST(program.retention_schedule).min_retention_pct
      else:
          coverage_position           = OUT_OF_COVERAGE
          applicable_min_retention_pct = null
    input_set: >-
      vehicle.in_service_date, the logical clock, assessed_odometer_miles from the fresh window
      (NOT Vehicle.odometer_miles, which is a lifetime maximum and may come from a snapshot that
      has since fallen out of the freshness window), and the program's stored schedule order.
    constants:
      TIER_BOUND_INCLUSIVE: true
    precision: "integer months and miles; percentages 2 decimals"

  - name: remedy_decision
    trigger: "on POST /battery-warranty/warranty-claims and on every resubmit"
    algorithm: constraint_propagation
    formula: |
      # >=3 inputs with non-linear interaction: a nested MIN over an allowance and a
      # capacity-derived cap, evaluated inside a short-circuit branch ladder whose earlier rungs
      # depend on sibling-entity state (ThermalEvent history) and on pack lifetime counters.
      F  = pack.faulted_module_count
      N  = pack.module_count
      D  = assessment.max_cell_delta_mv
      R  = assessment.retention_pct
      M  = pack.module_replacements_to_date
      C  = program.module_replacement_cap
      E  = COUNT(ThermalEvent WHERE pack_id == pack.id AND severity IN {S3, S4})

      # PINNED ladder - first rung that fires wins.
      (1) if E >= 1:                     PACK_REPLACEMENT      basis THERMAL_HISTORY
      (2) if D >= program.cell_delta_pack_threshold_mv:
                                         PACK_REPLACEMENT      basis CELL_DELTA
      (3) if R < program.pack_replacement_retention_pct:
                                         PACK_REPLACEMENT      basis RETENTION_FLOOR
      (4) allowance = MAX(0, C - M)
          module_cap = FLOOR(N * 0.25)
          if F > MIN(allowance, module_cap):
                                         PACK_REPLACEMENT      basis MODULE_ALLOWANCE
      (5) if F >= 1:                     MODULE_REPLACEMENT    basis MODULE_FAULT
      (6) otherwise:                     SOFTWARE_REMEDIATION  basis NO_MODULE_FAULT
    input_set: >-
      The pack's module roster as of this instant (F and M are recomputed, not cached), every
      ThermalEvent on the pack with severity S3 or S4 regardless of its containment_status, and
      the backing assessment's retention_pct and max_cell_delta_mv.
    constants:
      MODULE_CAP_FRACTION: 0.25
    precision: "integer comparisons; R compared at 2 decimals"

  - name: remedy_cost_estimate
    trigger: "on POST /battery-warranty/warranty-claims/{claim_id}/adjudicate for any approved_remedy != DENIED, and on every dispute-driven remedy change"
    algorithm: waterfall_allocation
    formula: |
      remedy = claim.approved_remedy
      F      = pack.faulted_module_count at adjudication time

      # --- line 1: parts (exact integer, no rounding) -------------------------------------
      if   remedy == MODULE_REPLACEMENT:  parts_line = program.module_unit_price_cents * F
      elif remedy == PACK_REPLACEMENT:    parts_line = program.pack_price_reman_cents
                                            if replacement_pack.pack_type == REMANUFACTURED
                                            else program.pack_price_new_cents
      else:                               parts_line = 0                 # SOFTWARE_REMEDIATION

      # --- line 2: labor (fractional -> rounded on its own) --------------------------------
      labor_hours = program.labor_hours_module  if remedy == MODULE_REPLACEMENT
                    else program.labor_hours_pack if remedy == PACK_REPLACEMENT
                    else LABOR_HOURS_SOFTWARE
      labor_line  = ROUND_HALF_UP(labor_hours * center.labor_rate_cents_per_hour)

      # --- line 3: hazmat surcharge (fractional -> rounded on its own) ---------------------
      if   remedy == SOFTWARE_REMEDIATION: hazmat_base = 0;  shipped_kg = 0.000
      elif pack.damaged_defective:         hazmat_base = program.surcharge_un3536_cents
      elif remedy == PACK_REPLACEMENT:     hazmat_base = program.surcharge_un3480_cents
      else:                                hazmat_base = program.surcharge_un3481_cents
      if   remedy == PACK_REPLACEMENT:     shipped_kg  = pack.gross_weight_kg
      elif remedy == MODULE_REPLACEMENT:   shipped_kg  = ROUND_HALF_UP(
                                                pack.gross_weight_kg * F / pack.module_count, 3)
      hazmat_line = ROUND_HALF_UP(hazmat_base * shipped_kg / 100)

      # --- line 4: diagnostic (exact integer) ---------------------------------------------
      diagnostic_line = program.diagnostic_fee_cents

      # --- PINNED ROUNDING ORDER ----------------------------------------------------------
      # Each line item is rounded to whole cents FIRST, then the four rounded lines are summed.
      # The alternative reading - sum the raw products and round the total once - is REJECTED and
      # produces a different figure whenever two fractional lines each round down while their
      # fractional parts sum to >= 0.5.
      remedy_cost_cents = parts_line + labor_line + hazmat_line + diagnostic_line
    input_set: "The claim's pack, its service center's labor rate, and the program price book."
    constants:
      LABOR_HOURS_SOFTWARE: 0.50
      ROUNDING_ORDER: "per_line_then_sum"
    precision: "whole cents per line, round_half_up; no fractional cents survive into the sum"

  - name: claim_settlement
    trigger: "on POST /battery-warranty/warranty-claims/{claim_id}/adjudicate, and on every dispute-driven remedy change"
    algorithm: chronological
    formula: |
      # A circular-LOOKING dependency: admin_fee_cents is keyed on a tier of oem_share_cents,
      # oem_share_cents depends on owner_share_cents, owner_share_cents depends on
      # remedy_cost_cents - and remedy_cost_cents itself carries a hazmat line whose basis depends
      # on the pack's damaged_defective flag. The evaluation order below is PINNED; admin_fee_cents
      # NEVER re-enters remedy_cost_cents, proration_factor or owner_share_cents.
      #
      # STEP 1  settlement_variant
      if   assessment.coverage_position == IN_COVERAGE:   settlement_variant = FULL_COVERAGE
      elif assessment.coverage_position == GOODWILL_BAND: settlement_variant = GOODWILL_PRORATED
      # STEP 2  remedy_cost_cents  <- calculation remedy_cost_estimate
      # STEP 3  proration_factor
      if settlement_variant == FULL_COVERAGE:
          proration_factor = 0.0000
      else:
          months_over = MAX(0, assessment.elapsed_months          - program.coverage_months)
          miles_over  = MAX(0, assessment.assessed_odometer_miles - program.coverage_miles)
          proration_factor = ROUND_HALF_UP(MIN(1.0, MAX(months_over / program.goodwill_months,
                                                       miles_over  / program.goodwill_miles)), 4)
      # STEP 4  owner_share_cents
      owner_share_cents = ROUND_HALF_UP(remedy_cost_cents * proration_factor)
      # STEP 5  oem_share_cents
      oem_share_cents   = remedy_cost_cents - owner_share_cents
      # STEP 6  admin_fee_cents  (tier on oem_share_cents; lower bounds INCLUSIVE)
      if   oem_share_cents <  ADMIN_TIER_1_FLOOR:  admin_fee_cents = 0
      elif oem_share_cents <  ADMIN_TIER_2_FLOOR:  admin_fee_cents = ADMIN_FEE_TIER_1
      else:                                        admin_fee_cents = ADMIN_FEE_TIER_2
      # STEP 7  oem_total_cents
      oem_total_cents = oem_share_cents + admin_fee_cents
      # STEP 8  ledger
      program.accrued_liability_cents += oem_total_cents
      # DENIED short-circuit: remedy_cost_cents = owner_share_cents = oem_share_cents =
      # admin_fee_cents = oem_total_cents = 0, proration_factor = 0.0000, ledger untouched.
    input_set: >-
      The claim's backing assessment (coverage_position, elapsed_months,
      assessed_odometer_miles), the program's coverage and goodwill constants, and
      remedy_cost_cents from remedy_cost_estimate.
    constants:
      ADMIN_TIER_1_FLOOR: 200000
      ADMIN_TIER_2_FLOOR: 500000
      ADMIN_FEE_TIER_1: 7500
      ADMIN_FEE_TIER_2: 15000
    precision: "proration_factor 4 decimals round_half_up; all cent amounts whole, round_half_up"
    variants:
      - name: FULL_COVERAGE
        when: "the backing assessment's coverage_position == IN_COVERAGE"
        difference: "proration_factor is forced to 0.0000, so owner_share_cents == 0 and oem_share_cents == remedy_cost_cents; the admin-fee tier is therefore evaluated against the FULL remedy cost."
      - name: GOODWILL_PRORATED
        when: "the backing assessment's coverage_position == GOODWILL_BAND"
        difference: >-
          proration_factor is the worse-of-two-axes overrun fraction, so owner_share_cents is
          positive and oem_share_cents shrinks - which can drop oem_share_cents into a LOWER
          admin-fee tier than the FULL_COVERAGE reading of the very same remedy cost. Identical
          remedy_cost_cents therefore yields a different oem_total_cents under the two variants,
          and the divergence is not merely the proration delta.

  - name: reman_pack_selection
    trigger: "on POST /battery-warranty/warranty-claims/{claim_id}/adjudicate when approved_remedy == PACK_REPLACEMENT and no replacement_pack_id was supplied"
    algorithm: topological
    formula: |
      # SELECTOR POLICY. Eligibility predicate (ALL must hold) against the removed pack `RP`
      # and the claim's service center `SC`:
      #   p.pack_type              == REMANUFACTURED
      #   p.status                 == STOCK
      #   p.installed_vehicle_id   IS NULL
      #   p.stock_region_code      == SC.region_code
      #   p.module_count           == RP.module_count
      #   p.nominal_capacity_kwh   >= RP.nominal_capacity_kwh
      #   p.refurb_soh_pct         >= program.reman_min_soh_pct        # >= : boundary INCLUSIVE
      # Ranking (total order, no ties possible because created_at is the final key):
      #   ORDER BY refurb_soh_pct DESC, remanufacture_count ASC, created_at ASC
      # Take the FIRST row.
      #
      # EMPTY-POOL FALLBACK:
      #   if program.allow_new_pack_substitution == true:
      #       re-run with p.pack_type == NEW, DROPPING the refurb_soh_pct predicate, and rank by
      #       remanufacture_count ASC, created_at ASC (refurb_soh_pct is NULL on NEW packs and is
      #       NOT coerced to 100.00 for ranking - the key is simply skipped).
      #       if that pool is also empty -> ERR_NO_REMAN_PACK_AVAILABLE (409)
      #   else -> ERR_NO_REMAN_PACK_AVAILABLE (409)
      #
      # The selected pack transitions STOCK -> RESERVED and
      # program.reman_available_count is decremented by 1 only when the selected pack's
      # pack_type == REMANUFACTURED.
    input_set: >-
      Only BatteryPack rows in status STOCK are candidates; RESERVED, IN_SERVICE, REMOVED,
      QUARANTINED and SCRAPPED packs are invisible to the selector even when every other
      predicate holds.
    constants:
      REGION_MATCH_REQUIRED: true
    precision: "refurb_soh_pct and nominal_capacity_kwh compared at their stored precision (2 and 3 decimals)"

  - name: hazmat_classification
    trigger: "on POST /battery-warranty/pack-shipments"
    algorithm: threshold
    formula: |
      # PINNED order: the damaged/defective condition DOMINATES the contents condition, so a
      # MODULES_ONLY shipment of a damaged pack is UN3536, not UN3481.
      if   pack.damaged_defective == true:            hazmat_classification = UN3536
      elif shipment_contents == FULL_PACK:            hazmat_classification = UN3480
      else:                                           hazmat_classification = UN3481

      required_packaging_spec = SP376_STRONG_OUTER if hazmat_classification == UN3536
                                else STANDARD_UN_4G
      soc_limit_pct = 30.00 if (hazmat_classification == UN3536 OR transport_mode == AIR)
                      else 50.00

      # declared weight
      if shipment_contents == FULL_PACK:
          gross_weight_kg = pack.gross_weight_kg
      else:
          removed_module_count = COUNT(BatteryModule WHERE pack_id == pack.id
                                                      AND status == REPLACED)
          gross_weight_kg = ROUND_HALF_UP(pack.gross_weight_kg * removed_module_count
                                          / pack.module_count, 3)

      surcharge_basis_cents = program.surcharge_un3536_cents if hazmat_classification == UN3536
                              else program.surcharge_un3480_cents
                                   if hazmat_classification == UN3480
                              else program.surcharge_un3481_cents
      hazmat_fee_cents = ROUND_HALF_UP(surcharge_basis_cents * gross_weight_kg / 100)
    input_set: "The shipment's declared shipment_contents and the referenced pack's damaged_defective flag as of CREATION time; the classification is frozen thereafter and is NOT recomputed if the pack is later flagged damaged."
    constants:
      DAMAGED_SOC_LIMIT_PCT: 30.00
      AIR_SOC_LIMIT_PCT: 30.00
      DEFAULT_SOC_LIMIT_PCT: 50.00
      SURCHARGE_BASIS_KG: 100
    precision: "hazmat_fee_cents whole cents round_half_up; gross_weight_kg 3 decimals"

  - name: regulatory_notification_deadline
    trigger: "on POST /battery-warranty/thermal-events"
    algorithm: threshold
    formula: |
      # The clock the deadline hangs off is detected_at, NOT created_at: an event detected in the
      # field and reported to the API hours later already has part of its window consumed.
      if   severity == S4:  notification_deadline_at = detected_at + 24 hours
      elif severity == S3:  notification_deadline_at = detected_at + 72 hours
      else:                 notification_deadline_at = null      # S1 and S2 are not reportable
      notification_status = PENDING if notification_deadline_at is not null else NOT_REQUIRED
      # At POST /thermal-events/{event_id}/regulatory-notification:
      #   filed_late = (clock_now > notification_deadline_at)    # STRICTLY greater; filing at the
      #                                                         # exact deadline instant is ON TIME
      #   notification_status = FILED if not filed_late else LATE_FILED
    input_set: "The single ThermalEvent's severity and detected_at; the deadline is frozen at creation."
    constants:
      S4_DEADLINE_HOURS: 24
      S3_DEADLINE_HOURS: 72
    precision: "millisecond datetime arithmetic in UTC"

  - name: hv_bay_window_conflict
    trigger: "on POST /battery-warranty/warranty-claims/{claim_id}/fulfil"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics [start, end). Two windows conflict iff
      #     existing.hv_bay_window_start <  new.hv_bay_window_end
      # AND new.hv_bay_window_start      <  existing.hv_bay_window_end
      # Consequence: back-to-back windows that share an instant (existing.end == new.start)
      # do NOT conflict.
      occupancy = WarrantyClaim WHERE service_center_id == center.id
                                 AND hv_bay_window_start IS NOT NULL
                                 AND adjudication_status IN {FULFILLED, CLOSED}
                                 AND overlaps(new window)
      # AGGREGATE capacity rule - not a pairwise rule:
      if COUNT(occupancy) >= center.hv_bay_count:  -> ERR_HV_BAY_CAPACITY_EXCEEDED (409)
      # A center with hv_bay_count = 2 therefore tolerates exactly one concurrent neighbour and
      # rejects the third overlapping window.
    input_set: >-
      Only claims already in FULFILLED or CLOSED occupy a bay. Claims in SUBMITTED,
      INFO_REQUESTED, APPROVED_* or DENIED hold no bay even if hv_bay_window fields were echoed
      into them, and are excluded from the occupancy count.
    constants:
      INTERVAL_SEMANTICS: "half_open_start_inclusive_end_exclusive"
    precision: "millisecond datetime comparison in UTC"

  - name: technician_cooldown_conflict
    trigger: "on POST /battery-warranty/warranty-claims/{claim_id}/fulfil"
    algorithm: interval_merge
    formula: |
      # A DIFFERENT interval geometry from hv_bay_window_conflict: this is an exclusive
      # single-resource rule evaluated against the technician's running high-water mark
      # (last_hv_window_end_at), extended by a mandatory rest buffer, with a CLOSED lower bound.
      if technician.last_hv_window_end_at IS NOT NULL
         AND new.hv_bay_window_start < technician.last_hv_window_end_at
                                          + COOLDOWN_MINUTES minutes:
          -> ERR_TECHNICIAN_COOLDOWN_CONFLICT (409)
      # Starting EXACTLY at last_hv_window_end_at + 60 minutes is ACCEPTED (>= boundary passes).
      # On success: technician.last_hv_window_end_at = MAX(existing, new.hv_bay_window_end)
    input_set: "Only the fulfilling technician's own high-water mark; other technicians at the same center are irrelevant, and the center's other claims are not scanned."
    constants:
      COOLDOWN_MINUTES: 60
      RESOURCE_CARDINALITY: 1
    precision: "millisecond datetime comparison in UTC"

  - name: lab_deviation
    trigger: "on POST /battery-warranty/capacity-disputes/{dispute_id}/lab-result"
    algorithm: threshold
    formula: |
      lab_retention_pct = ROUND_HALF_UP(lab_measured_capacity_kwh
                                        / dispute.nominal_basis_kwh * 100, 2)
      deviation_pct     = ROUND_HALF_UP(lab_retention_pct - dispute.oem_retention_pct, 2)
      # At POST /capacity-disputes/{dispute_id}/resolve, deviation_pct maps to an outcome with
      # SYMMETRIC tolerance bands whose boundaries are INCLUSIVE on the UPHELD side:
      if   deviation_pct < -program.lab_tolerance_pct: resolution = RESOLVED_OVERTURNED
      elif deviation_pct >  program.lab_tolerance_pct: resolution = RESOLVED_DOWNGRADED
      else:                                           resolution = RESOLVED_UPHELD
      # deviation_pct of exactly -2.00 or +2.00 with lab_tolerance_pct = 2.00 -> RESOLVED_UPHELD.
    input_set: >-
      The MOST RECENT lab result on the dispute (ORDER BY created_at DESC) - a retest supersedes
      the first result rather than averaging with it.
    constants:
      TOLERANCE_IS_SYMMETRIC: true
      BOUNDARY_FAVOURS: "RESOLVED_UPHELD"
    precision: "both percentages 2 decimals round_half_up"

  - name: center_compliance_score
    trigger: "on POST /battery-warranty/thermal-events/{event_id}/regulatory-notification (late filing) and on POST /battery-warranty/pack-shipments/{shipment_id}/receive (rejected shipment)"
    algorithm: weighted_scoring
    formula: |
      compliance_score = MAX(0, 100 - SHIPMENT_WEIGHT * center.rejected_shipment_count
                                    - NOTIFICATION_WEIGHT * center.late_notification_count)
      # The score is RECOMPUTED from the two counters on every change - it is never decremented
      # in place, so repeated recomputation is idempotent and cannot drift.
      # Certification consequence (evaluated immediately after recomputation):
      if compliance_score <= DECERT_THRESHOLD and center.status != DECERTIFIED:
          center.status = DECERTIFIED                    # terminal
    input_set: "The center's own two counters only; counters are never shared across centers even when one center's technician works a claim booked to another."
    constants:
      SHIPMENT_WEIGHT: 15
      NOTIFICATION_WEIGHT: 40
      DECERT_THRESHOLD: 20
      SCORE_FLOOR: 0
    precision: "integer score, clamped at 0"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# Domain priority order: auth -> request shape -> existence -> optimistic concurrency ->
# uniqueness -> temporal sanity -> state preconditions -> referential coherence ->
# high-voltage safety & regulatory -> resource/temporal conflicts -> business constraints ->
# fiscal ceilings. Safety ALWAYS precedes money in this domain.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a member of the declared role set"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-ID header present on every endpoint that records an actor identity"
    error_id: ERR_ACTOR_REQUIRED
    http_status: 400
    applies_to: "POST /warranty-claims/{claim_id}/adjudicate, POST /warranty-claims/{claim_id}/fulfil, POST /capacity-disputes/{dispute_id}/resolve, POST /pack-shipments/{shipment_id}/tender, POST /remediation-consents/{consent_id}/decision"

  - priority: 4
    category: business_constraint
    check: "every required input field present and non-null; enum values members of the declared set; integers non-negative where constrained; decimals within declared scale; arrays of the declared element type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_constraint
    check: "CONDITIONAL required field - bench_measured_capacity_kwh MUST be present when variant == BENCH_CAPACITY_TEST and MUST be absent when variant == TELEMATICS_FLEET"
    error_id: ERR_BENCH_CAPACITY_REQUIRED
    http_status: 400
    applies_to: "POST /soh-assessments"

  - priority: 6
    category: existence
    check: "every path-parameter resource exists, validated strictly left-to-right so the outermost segment's error wins"
    error_id: "ERR_VEHICLE_NOT_FOUND | ERR_PACK_NOT_FOUND | ERR_CENTER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_CONSENT_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 7
    category: existence
    check: "every FK supplied in the request body resolves, validated in the order the fields are declared in §1.1"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_CENTER_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_PACK_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_CONSENT_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK inputs"

  - priority: 8
    category: state
    check: "expected_vehicle_version equals the referenced Vehicle's current version"
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
    applies_to: "POST /soh-assessments"

  - priority: 9
    category: state
    check: "expected_claim_version equals the referenced WarrantyClaim's current version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /capacity-disputes"

  - priority: 10
    category: state
    check: "expected_campaign_version equals the referenced RemediationCampaign's current version"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /remediation-consents"

  - priority: 11
    category: business_constraint
    check: "vin is unique across all Vehicles"
    error_id: ERR_DUPLICATE_VIN
    http_status: 409
    applies_to: "POST /vehicles"

  - priority: 12
    category: business_constraint
    check: "serial_number is unique across all BatteryPacks"
    error_id: ERR_DUPLICATE_PACK_SERIAL
    http_status: 409
    applies_to: "POST /battery-packs"

  - priority: 13
    category: business_constraint
    check: "campaign_code is unique across all RemediationCampaigns"
    error_id: ERR_DUPLICATE_CAMPAIGN_CODE
    http_status: 409
    applies_to: "POST /remediation-campaigns"

  - priority: 14
    category: business_temporal
    check: "the requested logical clock instant is greater than or equal to the current logical clock; the clock never rewinds"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

  - priority: 15
    category: business_temporal
    check: "detected_at is less than or equal to the current logical clock"
    error_id: ERR_DETECTED_AT_IN_FUTURE
    http_status: 400
    applies_to: "POST /thermal-events"

  - priority: 16
    category: state
    check: "TERMINAL LOCKDOWN - the claim's adjudication_status is not CLOSED"
    error_id: ERR_CLAIM_TERMINAL
    http_status: 409
    applies_to: "every POST under /warranty-claims/{claim_id}"

  - priority: 17
    category: state
    check: "adjudication_status == SUBMITTED for an adjudication or an information request"
    error_id: ERR_CLAIM_NOT_ADJUDICABLE
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/adjudicate, POST /warranty-claims/{claim_id}/request-info"

  - priority: 18
    category: state
    check: "adjudication_status == INFO_REQUESTED for a resubmit"
    error_id: ERR_INFO_REQUEST_NOT_OPEN
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/resubmit"

  - priority: 19
    category: state
    check: "adjudication_status IN {APPROVED_MODULE, APPROVED_PACK, APPROVED_SOFTWARE} for a fulfilment"
    error_id: ERR_CLAIM_NOT_FULFILLABLE
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 20
    category: state
    check: "adjudication_status IN {FULFILLED, DENIED} for a close"
    error_id: ERR_CLAIM_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/close"

  - priority: 21
    category: state
    check: "adjudication_status IN {APPROVED_MODULE, APPROVED_PACK, APPROVED_SOFTWARE, DENIED, FULFILLED} for a dispute filing - a claim still under adjudication cannot be disputed"
    error_id: ERR_CLAIM_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /capacity-disputes"

  - priority: 22
    category: state
    check: "dispute_status IN {LAB_ASSIGNED, LAB_RESULT_RECEIVED} - a resolved dispute accepts no further lab result or resolution"
    error_id: ERR_DISPUTE_RESOLVED
    http_status: 409
    applies_to: "POST /capacity-disputes/{dispute_id}/lab-result, POST /capacity-disputes/{dispute_id}/resolve"

  - priority: 23
    category: state
    check: "dispute_status == LAB_RESULT_RECEIVED for a resolution - a dispute still awaiting a lab result (LAB_ASSIGNED, including one bounced back for a mandatory retest) cannot be resolved"
    error_id: ERR_LAB_RESULT_REQUIRED
    http_status: 409
    applies_to: "POST /capacity-disputes/{dispute_id}/resolve"

  - priority: 24
    category: state
    check: "the submitted containment step_index equals containment_steps_completed + 1 (steps may not be skipped or repeated) -> ERR_CONTAINMENT_STEP_OUT_OF_ORDER; and the closing step (step_index 3) additionally requires notification_status IN {NOT_REQUIRED, FILED, LATE_FILED} -> ERR_NOTIFICATION_STILL_PENDING, because the containment dimension may not close while the regulatory dimension is unsettled"
    error_id: ERR_CONTAINMENT_STEP_OUT_OF_ORDER | ERR_NOTIFICATION_STILL_PENDING
    http_status: 409
    applies_to: "POST /thermal-events/{event_id}/containment-step"

  - priority: 25
    category: state
    check: "notification_status == PENDING for a regulatory filing"
    error_id: ERR_NOTIFICATION_ALREADY_FILED
    http_status: 409
    applies_to: "POST /thermal-events/{event_id}/regulatory-notification"

  - priority: 26
    category: state
    check: "campaign status IN {LIMITED_RELEASE, FIELD_RELEASE} for consent solicitation; a DRAFT, SUSPENDED or CLOSED campaign solicits nothing"
    error_id: ERR_CAMPAIGN_NOT_RELEASED
    http_status: 409
    applies_to: "POST /remediation-consents"

  - priority: 27
    category: state
    check: "consent_status == PENDING for an owner decision"
    error_id: ERR_CONSENT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /remediation-consents/{consent_id}/decision"

  - priority: 28
    category: state
    check: "consent_status == GRANTED for an apply-update; PENDING, DECLINED, EXPIRED and APPLIED all reject"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /remediation-consents/{consent_id}/apply-update"

  - priority: 29
    category: state
    check: "CROSS-ENTITY - the vehicle's status is ACTIVE; an IMMOBILIZED vehicle may neither be solicited for consent nor flashed"
    error_id: ERR_VEHICLE_IMMOBILIZED
    http_status: 409
    applies_to: "POST /remediation-consents, POST /remediation-consents/{consent_id}/decision, POST /remediation-consents/{consent_id}/apply-update"

  - priority: 30
    category: state
    check: "the backing assessment's superseded flag is false - a newer assessment on the same vehicle invalidates it"
    error_id: ERR_ASSESSMENT_SUPERSEDED
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 31
    category: state
    check: "no other WarrantyClaim already cites this assessment_id unless that claim is CLOSED"
    error_id: ERR_ASSESSMENT_ALREADY_CLAIMED
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 32
    category: state
    check: "CASCADING - the backing assessment's diagnostic_validity == VALID; STALE_TELEMETRY, INSUFFICIENT_DATA and BENCH_OUT_OF_RANGE all reject, and this check runs BEFORE any coverage or retention comparison because those fields are null on an invalid assessment"
    error_id: ERR_DIAGNOSTIC_NOT_VALID
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 33
    category: state
    check: "the pack's status == REMOVED or QUARANTINED for a shipment; a pack still IN_SERVICE cannot be shipped"
    error_id: ERR_SHIPMENT_PACK_NOT_REMOVED
    http_status: 409
    applies_to: "POST /pack-shipments"

  - priority: 34
    category: state
    check: "shipment status == DRAFT for a tender and == TENDERED for a receipt"
    error_id: ERR_SHIPMENT_NOT_TENDERED
    http_status: 409
    applies_to: "POST /pack-shipments/{shipment_id}/tender, POST /pack-shipments/{shipment_id}/receive"

  - priority: 35
    category: state
    check: "CROSS-ENTITY - the origin center's status == ACTIVE; a center in SHIPPING_SUSPENDED or DECERTIFIED cannot tender hazardous freight"
    error_id: ERR_CENTER_SHIPPING_SUSPENDED
    http_status: 409
    applies_to: "POST /pack-shipments, POST /pack-shipments/{shipment_id}/tender"

  - priority: 36
    category: business_referential
    check: "pack_id equals the vehicle's installed_pack_id"
    error_id: ERR_PACK_VEHICLE_MISMATCH
    http_status: 422
    applies_to: "POST /soh-assessments, POST /thermal-events"

  - priority: 37
    category: business_referential
    check: "the backing assessment's vehicle_id equals the claim's vehicle_id"
    error_id: ERR_ASSESSMENT_VEHICLE_MISMATCH
    http_status: 422
    applies_to: "POST /warranty-claims"

  - priority: 38
    category: business_referential
    check: "the named technician's service_center_id equals the service_center_id of record for the operation"
    error_id: ERR_TECHNICIAN_CENTER_MISMATCH
    http_status: 422
    applies_to: "POST /warranty-claims, POST /warranty-claims/{claim_id}/fulfil, POST /pack-shipments"

  - priority: 39
    category: business_referential
    check: "CONDITIONAL - the vehicle's model_code equals the campaign's applies_to_model_code, the installed pack's pack_type matches applies_to_pack_type (ANY matches both), and under release_scope == LIMITED the vehicle's region_code is a member of pilot_region_codes"
    error_id: ERR_VEHICLE_NOT_TARGETED
    http_status: 422
    applies_to: "POST /remediation-consents"

  - priority: 40
    category: business_referential
    check: "an explicitly supplied replacement pack's stock_region_code equals the claim's service center's region_code and its module_count equals the removed pack's module_count"
    error_id: ERR_PACK_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /warranty-claims/{claim_id}/adjudicate"

  - priority: 41
    category: business_safety
    check: "CROSS-ENTITY - the center of record's status == ACTIVE at fulfilment time"
    error_id: ERR_CENTER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 42
    category: business_safety
    check: "CONDITIONAL - hv_certification_level == L3 to fulfil a PACK_REPLACEMENT; L2 or L3 to fulfil a MODULE_REPLACEMENT; any level for SOFTWARE_REMEDIATION"
    error_id: ERR_CENTER_CERT_LEVEL_INSUFFICIENT
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 43
    category: business_safety
    check: "CONDITIONAL - has_pack_lift == true to fulfil a PACK_REPLACEMENT"
    error_id: ERR_PACK_LIFT_REQUIRED
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 44
    category: business_safety
    check: "insulation_tester_cal_due_at is strictly greater than the current logical clock for any MODULE_REPLACEMENT or PACK_REPLACEMENT fulfilment"
    error_id: ERR_INSULATION_TESTER_OVERDUE
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 45
    category: business_safety
    check: "the fulfilling technician's cert_expires_at is strictly greater than the current logical clock (status ACTIVE, not CERT_LAPSED)"
    error_id: ERR_TECHNICIAN_CERT_EXPIRED
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil, POST /pack-shipments/{shipment_id}/tender"

  - priority: 46
    category: business_safety
    check: "CONDITIONAL - the fulfilling technician's hv_cert_level == L3 for a PACK_REPLACEMENT and L2 or L3 for a MODULE_REPLACEMENT"
    error_id: ERR_TECHNICIAN_LEVEL_INSUFFICIENT
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 47
    category: business_safety
    check: "CROSS-ENTITY - no ThermalEvent on the claim's pack with severity IN {S3, S4} has containment_status other than CONTAINMENT_CLOSED"
    error_id: ERR_THERMAL_CONTAINMENT_OPEN
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 48
    category: business_safety
    check: "TWO-PERSON RULE - the acting X-User-ID differs from the claim's adjudicated_by_user_id when resolving a dispute, and a shipment's certifying_technician_id differs from the claim's fulfilment_technician_id for the same pack"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /capacity-disputes/{dispute_id}/resolve, POST /pack-shipments"

  - priority: 49
    category: business_safety
    check: "the adjudicator may not approve a remedy weaker than a PACK_REPLACEMENT recommendation whose recommendation_basis IN {THERMAL_HISTORY, CELL_DELTA}; ordinal strength is SOFTWARE_REMEDIATION < MODULE_REPLACEMENT < PACK_REPLACEMENT, and DENIED is always permitted"
    error_id: ERR_REMEDY_OVERRIDE_FORBIDDEN
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/adjudicate"

  - priority: 50
    category: business_safety
    check: "transport_mode != AIR when hazmat_classification == UN3536"
    error_id: ERR_AIR_TRANSPORT_FORBIDDEN
    http_status: 409
    applies_to: "POST /pack-shipments"

  - priority: 51
    category: business_safety
    check: "packaging_spec equals required_packaging_spec at tender time"
    error_id: ERR_PACKAGING_NONCONFORMANT
    http_status: 409
    applies_to: "POST /pack-shipments/{shipment_id}/tender"

  - priority: 52
    category: business_safety
    check: "state_of_charge_pct is less than or equal to soc_limit_pct; the boundary value is ACCEPTED"
    error_id: ERR_SOC_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /pack-shipments/{shipment_id}/tender"

  - priority: 53
    category: business_temporal
    check: "hv_bay_window_end is strictly greater than hv_bay_window_start"
    error_id: ERR_INVALID_BAY_WINDOW
    http_status: 400
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 54
    category: business_temporal
    check: "AGGREGATE - the count of FULFILLED or CLOSED claims at this center whose half-open [start, end) bay window overlaps the requested window is strictly less than the center's hv_bay_count"
    error_id: ERR_HV_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 55
    category: business_temporal
    check: "the requested hv_bay_window_start is greater than or equal to the fulfilling technician's last_hv_window_end_at plus 60 minutes"
    error_id: ERR_TECHNICIAN_COOLDOWN_CONFLICT
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/fulfil"

  - priority: 56
    category: business_temporal
    check: "the current logical clock is less than or equal to the consent's expires_at"
    error_id: ERR_CONSENT_EXPIRED
    http_status: 409
    applies_to: "POST /remediation-consents/{consent_id}/decision, POST /remediation-consents/{consent_id}/apply-update"

  - priority: 57
    category: business_temporal
    check: "the current logical clock is less than or equal to the claim's adjudication instant plus program.dispute_window_days days; the boundary instant is INCLUSIVE"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /capacity-disputes"

  - priority: 58
    category: business_constraint
    check: "every entry of module_fault_positions and module_degraded_positions is an integer in 1..pack.module_count, the two arrays are disjoint, and neither contains duplicates"
    error_id: ERR_MODULE_POSITION_INVALID
    http_status: 422
    applies_to: "POST /soh-assessments"

  - priority: 59
    category: business_constraint
    check: "a pack created with installed_vehicle_id set requires that vehicle to have no pack installed"
    error_id: ERR_VEHICLE_ALREADY_HAS_PACK
    http_status: 409
    applies_to: "POST /battery-packs"

  - priority: 60
    category: business_constraint
    check: "the vehicle has no WarrantyClaim whose adjudication_status is not CLOSED"
    error_id: ERR_CLAIM_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 61
    category: business_constraint
    check: "the backing assessment's retention_pct is less than or equal to its applicable_min_retention_pct; retention exactly AT the threshold QUALIFIES"
    error_id: ERR_RETENTION_ABOVE_THRESHOLD
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 62
    category: business_constraint
    check: "the backing assessment's coverage_position != OUT_OF_COVERAGE"
    error_id: ERR_OUT_OF_COVERAGE
    http_status: 409
    applies_to: "POST /warranty-claims"

  - priority: 63
    category: business_constraint
    check: "info_request_round is strictly less than program.info_request_limit"
    error_id: ERR_INFO_REQUEST_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/request-info"

  - priority: 64
    category: business_constraint
    check: "no RemediationConsent with consent_status IN {PENDING, GRANTED} already exists for this (campaign_id, vehicle_id) pair, and any supplied superseded_consent_id points at a consent for the same pair whose status IN {DECLINED, EXPIRED}"
    error_id: ERR_DUPLICATE_ACTIVE_CONSENT
    http_status: 409
    applies_to: "POST /remediation-consents"

  - priority: 65
    category: business_constraint
    check: "no CapacityDispute with dispute_status IN {LAB_ASSIGNED, LAB_RESULT_RECEIVED} already exists on this claim"
    error_id: ERR_DUPLICATE_ACTIVE_DISPUTE
    http_status: 409
    applies_to: "POST /capacity-disputes"

  - priority: 66
    category: business_constraint
    check: "the event's notification_status != NOT_REQUIRED - an S1 or S2 event has no regulatory filing"
    error_id: ERR_NOTIFICATION_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /thermal-events/{event_id}/regulatory-notification"

  - priority: 67
    category: business_constraint
    check: "an explicitly supplied replacement pack has status == STOCK, installed_vehicle_id == null and, when pack_type == REMANUFACTURED, refurb_soh_pct >= program.reman_min_soh_pct"
    error_id: ERR_PACK_NOT_IN_STOCK
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/adjudicate"

  - priority: 68
    category: business_constraint
    check: "SELECTOR EXHAUSTION - the reman_pack_selection eligibility pool is non-empty, or program.allow_new_pack_substitution == true with a non-empty NEW pool"
    error_id: ERR_NO_REMAN_PACK_AVAILABLE
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/adjudicate"

  - priority: 69
    category: business_fiscal
    check: "AGGREGATE - program.accrued_liability_cents + this claim's computed oem_total_cents is less than or equal to program.liability_cap_cents; the cap is checked LAST so that every safety, referential and constraint failure outranks it"
    error_id: ERR_LIABILITY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /warranty-claims/{claim_id}/adjudicate"

  - priority: 70
    category: business_constraint
    check: "CONDITIONAL - a release with release_scope == LIMITED requires campaign.pilot_region_codes to be non-empty, because a limited release with no pilot region would solicit nothing; a FIELD release ignores the list entirely"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /remediation-campaigns/{campaign_id}/release"

# =============================================================================
# 1.5 API Endpoint Table
# All paths are prefixed with /battery-warranty. Every field marked with a trailing "?" is
# optional; every field WITHOUT "?" is required. Fields with a `default:` in §1.1 are optional
# here so that a test may configure only the constants it cares about.
# =============================================================================
endpoints:
  - method: POST
    path: "/battery-warranty/warranty-programs"
    description: "Register a capacity-retention warranty program. Every constant carries the reference-price-book default from §1.1, so only `name` is required."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "coverage_months?", "coverage_miles?", "retention_schedule?", "pack_replacement_retention_pct?", "module_replacement_cap?", "goodwill_months?", "goodwill_miles?", "diagnostic_fee_cents?", "module_unit_price_cents?", "pack_price_new_cents?", "pack_price_reman_cents?", "labor_hours_module?", "labor_hours_pack?", "surcharge_un3480_cents?", "surcharge_un3481_cents?", "surcharge_un3536_cents?", "snapshot_min_count?", "snapshot_window_size?", "snapshot_freshness_days?", "cell_delta_pack_threshold_mv?", "info_request_limit?", "reman_min_soh_pct?", "allow_new_pack_substitution?", "liability_cap_cents?", "lab_tolerance_pct?", "dispute_window_days?"]
    output: WarrantyProgram
    side_effects: ["retention_schedule sorted ascending by through_months and persisted in that order", "accrued_liability_cents = 0", "reman_available_count = 0", "reman_stock_state = DEPLETED"]

  - method: GET
    path: "/battery-warranty/warranty-programs/{program_id}"
    description: "Read a warranty program, including its two ledger mirrors."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: WarrantyProgram
    side_effects: []

  - method: POST
    path: "/battery-warranty/vehicles"
    description: "Register a vehicle under a warranty program."
    roles: [ProgramAdmin]
    code: 201
    input: ["vin", "warranty_program_id", "in_service_date", "model_code?", "region_code?", "owner_contact_email?", "odometer_miles?"]
    output: Vehicle
    side_effects: ["status = ACTIVE", "installed_pack_id = null", "warranty_hold = false"]

  - method: GET
    path: "/battery-warranty/vehicles/{vehicle_id}"
    description: "Read a vehicle, including its derived installed_pack_id mirror."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/battery-warranty/vehicles"
    description: "List vehicles, filterable by program and status."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["warranty_program_id?", "status?", "model_code?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/service-centers"
    description: "Register a high-voltage service center."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "region_code?", "hv_certification_level?", "has_pack_lift?", "insulation_tester_cal_due_at?", "hv_bay_count?", "labor_rate_cents_per_hour?"]
    output: ServiceCenter
    side_effects: ["status = ACTIVE", "compliance_score = 100", "open_hazmat_holds = 0", "rejected_shipment_count = 0", "late_notification_count = 0"]

  - method: GET
    path: "/battery-warranty/service-centers/{center_id}"
    description: "Read a service center, including its compliance score and certification status."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: []

  - method: GET
    path: "/battery-warranty/service-centers"
    description: "List service centers."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["region_code?", "status?", "hv_certification_level?", "limit?", "offset?"]
    output: ServiceCenter[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/service-centers/{id}/technicians"
    description: "Register a technician at a center."
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "hv_cert_level?", "cert_expires_at?"]
    output: Technician
    side_effects: ["service_center_id set from the path", "status derived from cert_expires_at against the logical clock", "last_hv_window_end_at = null"]

  - method: GET
    path: "/battery-warranty/service-centers/{id}/technicians"
    description: "List a center's technicians; status is re-derived against the logical clock on every read."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: ["Technician.status re-derived from cert_expires_at"]

  - method: POST
    path: "/battery-warranty/battery-packs"
    description: "Register a battery pack. Modules 1..module_count are cascade-created in status HEALTHY and are discoverable only through the pack's modules sub-resource."
    roles: [ProgramAdmin]
    code: 201
    input: ["serial_number", "pack_type?", "nominal_capacity_kwh?", "module_count?", "gross_weight_kg?", "stock_region_code?", "refurb_soh_pct?", "remanufacture_count?", "installed_vehicle_id?", "superseded_pack_id?", "damaged_defective?"]
    output: BatteryPack
    side_effects: ["module_count BatteryModule rows cascade-created with position_index 1..module_count, status HEALTHY, cell_delta_mv 0", "status = IN_SERVICE when installed_vehicle_id is supplied, else STOCK", "the named Vehicle's installed_pack_id mirror is set", "program.reman_available_count and reman_stock_state re-derived when pack_type == REMANUFACTURED and status == STOCK"]

  - method: GET
    path: "/battery-warranty/battery-packs/{pack_id}"
    description: "Read a battery pack, including its faulted_module_count and module_replacements_to_date counters."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: BatteryPack
    side_effects: []

  - method: GET
    path: "/battery-warranty/battery-packs"
    description: "List battery packs, filterable by installation, supersession chain, status, type and stock region."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["installed_vehicle_id?", "superseded_pack_id?", "status?", "pack_type?", "stock_region_code?", "limit?", "offset?"]
    output: BatteryPack[]
    side_effects: []

  - method: GET
    path: "/battery-warranty/battery-packs/{id}/modules"
    description: "List a pack's modules in ascending position_index order."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BatteryModule[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/vehicles/{id}/telematics-snapshots"
    description: "Ingest one telematics snapshot. Immutable event row: no version, no update endpoint."
    roles: [TelematicsGateway]
    code: 201
    input: ["captured_at", "odometer_miles", "reported_capacity_kwh", "charge_cycles?", "max_cell_delta_mv?", "coolant_temp_c?", "dcfc_session_count?"]
    output: TelematicsSnapshot
    side_effects: ["validity_flag computed: INVALID_FUTURE_CAPTURE when captured_at > clock_now; INVALID_CAPACITY_RANGE when reported_capacity_kwh <= 0 or > pack.nominal_capacity_kwh * 1.05; INVALID_ODOMETER_REGRESSION when some VALID snapshot on the same vehicle has captured_at <= this captured_at and a strictly greater odometer_miles; else VALID", "corrected_capacity_kwh computed by calculation temperature_correction_factor", "Vehicle.odometer_miles raised to MAX(current, odometer_miles) only for a VALID snapshot"]

  - method: GET
    path: "/battery-warranty/vehicles/{id}/telematics-snapshots"
    description: "List a vehicle's telematics snapshots, newest captured_at first."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, TelematicsGateway, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["validity_flag?", "limit?", "offset?"]
    output: TelematicsSnapshot[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/soh-assessments"
    description: "Run a state-of-health assessment. OPTIMISTIC CONCURRENCY: expected_vehicle_version must equal the Vehicle's current version."
    roles: [ServiceTechnician]
    code: 201
    input: ["vehicle_id", "pack_id", "technician_id", "variant", "expected_vehicle_version", "bench_measured_capacity_kwh?", "module_fault_positions?", "module_degraded_positions?"]
    output: SohAssessment
    side_effects: ["named module positions written to BatteryModule.status (FAULTED / DEGRADED) BEFORE nominal_basis_kwh is computed", "pack.faulted_module_count re-derived", "diagnostic_validity computed by calculation diagnostic_validity_gate", "retention_pct computed by calculation soh_retention for the selected variant", "coverage_position and elapsed_months computed by calculation elapsed_coverage_position", "qualifies_for_claim computed", "every earlier SohAssessment on the same vehicle has superseded set to true", "increments Vehicle.version by 1"]

  - method: GET
    path: "/battery-warranty/soh-assessments/{assessment_id}"
    description: "Read a state-of-health assessment."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: SohAssessment
    side_effects: []

  - method: GET
    path: "/battery-warranty/soh-assessments"
    description: "List assessments, filterable by vehicle, pack, technician and variant."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["vehicle_id?", "pack_id?", "technician_id?", "variant?", "diagnostic_validity?", "superseded?", "limit?", "offset?"]
    output: SohAssessment[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/warranty-claims"
    description: "File a warranty claim against a qualifying assessment."
    roles: [ServiceTechnician]
    code: 201
    input: [vehicle_id, service_center_id, assessment_id, diagnosing_technician_id]
    output: WarrantyClaim
    side_effects: ["adjudication_status = SUBMITTED", "recommended_remedy and recommendation_basis computed by calculation remedy_decision", "fulfilment_blocked derived from the center of record's status"]

  - method: GET
    path: "/battery-warranty/warranty-claims/{claim_id}"
    description: "Read a warranty claim, including its full settlement breakdown."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/battery-warranty/warranty-claims"
    description: "List warranty claims. Collapses all seven of the claim's foreign keys into one filtered list."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["vehicle_id?", "service_center_id?", "assessment_id?", "diagnosing_technician_id?", "fulfilment_technician_id?", "replacement_pack_id?", "linked_campaign_id?", "adjudication_status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/warranty-claims/{claim_id}/request-info"
    description: "Open an information request round on a submitted claim."
    roles: [WarrantyAdjudicator]
    code: 200
    input: ["reason_note?"]
    output: WarrantyClaim
    side_effects: ["adjudication_status = INFO_REQUESTED", "info_request_round incremented by 1"]

  - method: POST
    path: "/battery-warranty/warranty-claims/{claim_id}/resubmit"
    description: "Answer an information request and return the claim to adjudication; the remedy recommendation is recomputed from current pack, thermal and assessment state."
    roles: [ServiceTechnician]
    code: 200
    input: ["assessment_id?", "note?"]
    output: WarrantyClaim
    side_effects: ["adjudication_status = SUBMITTED", "assessment_id replaced when supplied", "recommended_remedy and recommendation_basis recomputed by calculation remedy_decision", "coverage_position re-read from the (possibly new) assessment"]

  - method: POST
    path: "/battery-warranty/warranty-claims/{claim_id}/adjudicate"
    description: "Decide a claim. Runs the settlement waterfall and, for a pack approval without an explicit replacement_pack_id, the remanufactured-pack selector."
    roles: [WarrantyAdjudicator]
    code: 200
    input: ["approved_remedy", "replacement_pack_id?", "linked_campaign_id?", "override_justification?", "decision_note?"]
    output: WarrantyClaim
    side_effects: ["adjudication_status = APPROVED_MODULE | APPROVED_PACK | APPROVED_SOFTWARE | DENIED", "adjudicated_by_user_id = X-User-ID", "replacement_pack_id resolved by calculation reman_pack_selection for a pack approval", "the selected pack moves STOCK -> RESERVED and program.reman_available_count is decremented for a REMANUFACTURED pack", "remedy_cost_cents by calculation remedy_cost_estimate", "settlement_variant, proration_factor, owner_share_cents, oem_share_cents, admin_fee_cents, oem_total_cents by calculation claim_settlement", "program.accrued_liability_cents increased by oem_total_cents", "denial_reason = ADJUDICATOR_DECISION on a denial, with every money field 0"]

  - method: POST
    path: "/battery-warranty/warranty-claims/{claim_id}/fulfil"
    description: "Execute the approved remedy inside a booked high-voltage bay window."
    roles: [ServiceTechnician]
    code: 200
    input: [fulfilment_technician_id, hv_bay_window_start, hv_bay_window_end]
    output: WarrantyClaim
    side_effects: ["adjudication_status = FULFILLED", "hv_bay_window_start and hv_bay_window_end recorded (half-open [start, end) occupancy)", "technician.last_hv_window_end_at raised to MAX(current, hv_bay_window_end)", "for MODULE_REPLACEMENT: the FAULTED modules move to REPLACED, pack.module_replacements_to_date increased by the replaced count, pack.faulted_module_count re-derived", "for PACK_REPLACEMENT: the removed pack moves IN_SERVICE -> REMOVED, the reserved pack moves RESERVED -> IN_SERVICE with superseded_pack_id set to the removed pack, and the Vehicle's installed_pack_id mirror follows", "pack_shipment_required = true for any hardware remedy"]

  - method: POST
    path: "/battery-warranty/warranty-claims/{claim_id}/close"
    description: "Close a fulfilled or denied claim. Terminal."
    roles: [WarrantyAdjudicator]
    code: 200
    input: ["closure_note?"]
    output: WarrantyClaim
    side_effects: ["adjudication_status = CLOSED"]

  - method: GET
    path: "/battery-warranty/warranty-claims/{id}/capacity-disputes"
    description: "List the capacity disputes filed against a claim."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["dispute_status?", "limit?", "offset?"]
    output: CapacityDispute[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/thermal-events"
    description: "Report a thermal event. Opens two INDEPENDENT state dimensions: containment and regulatory notification."
    roles: [ServiceTechnician, TelematicsGateway]
    code: 201
    input: ["vehicle_id", "pack_id", "severity", "detected_at", "source", "affected_module_positions?"]
    output: ThermalEvent
    side_effects: ["containment_status = DETECTED", "notification_deadline_at and notification_status by calculation regulatory_notification_deadline", "event_status = OPEN", "for severity S4: the vehicle moves ACTIVE -> IMMOBILIZED, every PENDING or GRANTED RemediationConsent on that vehicle moves to EXPIRED, and every campaign whose applies_to_model_code matches the vehicle's model_code with target_defect == THERMAL_MANAGEMENT and status IN {LIMITED_RELEASE, FIELD_RELEASE} moves to SUSPENDED", "for severity S3 or S4: named affected_module_positions move to FAULTED and pack.damaged_defective = true"]

  - method: GET
    path: "/battery-warranty/thermal-events/{event_id}"
    description: "Read a thermal event with both of its state dimensions and the derived join field."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, TelematicsGateway, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: ThermalEvent
    side_effects: []

  - method: GET
    path: "/battery-warranty/thermal-events"
    description: "List thermal events, filterable by vehicle, pack, severity, notification status and reporting center."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, TelematicsGateway, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["vehicle_id?", "pack_id?", "severity?", "notification_status?", "containment_status?", "reporting_service_center_id?", "limit?", "offset?"]
    output: ThermalEvent[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/thermal-events/{event_id}/containment-step"
    description: "Record the next containment step. step_index must be exactly containment_steps_completed + 1 (1 = isolate, 2 = quarantine pack, 3 = close containment)."
    roles: [ServiceTechnician]
    code: 200
    input: ["step_index", "step_note?"]
    output: ThermalEvent
    side_effects: ["containment_steps_completed incremented by 1", "containment_status advances DETECTED -> ISOLATED -> PACK_QUARANTINED -> CONTAINMENT_CLOSED", "at step 2 the pack moves to QUARANTINED and, when the pack has an origin center of record, that center's open_hazmat_holds is incremented", "event_status re-derived from both dimensions"]

  - method: POST
    path: "/battery-warranty/thermal-events/{event_id}/regulatory-notification"
    description: "File the regulatory notification for a reportable event. Late filing damages exactly the reporting center's compliance score."
    roles: [RegulatoryLiaison]
    code: 200
    input: [reporting_service_center_id, regulator_reference]
    output: ThermalEvent
    side_effects: ["notification_filed_at = clock_now", "notification_status = FILED when clock_now <= notification_deadline_at, else LATE_FILED", "on LATE_FILED: the named center's late_notification_count is incremented by 1, its compliance_score is recomputed by calculation center_compliance_score, and the center moves to DECERTIFIED when and only when the recomputed score is <= 20", "on DECERTIFIED: every non-terminal claim at that center has fulfilment_blocked set to true", "event_status re-derived from both dimensions"]

  - method: POST
    path: "/battery-warranty/remediation-campaigns"
    description: "Create a software remediation campaign in DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: ["campaign_code", "target_defect", "software_version", "applies_to_pack_type", "applies_to_model_code", "consent_required?", "pilot_region_codes?"]
    output: RemediationCampaign
    side_effects: ["status = DRAFT", "release_scope = null", "all three counters = 0"]

  - method: GET
    path: "/battery-warranty/remediation-campaigns/{campaign_id}"
    description: "Read a campaign with its solicitation counters."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: RemediationCampaign
    side_effects: []

  - method: GET
    path: "/battery-warranty/remediation-campaigns"
    description: "List campaigns."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["status?", "target_defect?", "applies_to_model_code?", "limit?", "offset?"]
    output: RemediationCampaign[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/remediation-campaigns/{campaign_id}/release"
    description: "Release a DRAFT campaign. FORK: release_scope LIMITED restricts solicitation to pilot_region_codes; FIELD opens it to every region."
    roles: [ProgramAdmin]
    code: 200
    input: [release_scope]
    output: RemediationCampaign
    side_effects: ["status = LIMITED_RELEASE for scope LIMITED, FIELD_RELEASE for scope FIELD", "release_scope recorded"]

  - method: POST
    path: "/battery-warranty/remediation-consents"
    description: "Solicit an owner's consent for a released campaign. OPTIMISTIC CONCURRENCY: expected_campaign_version must equal the campaign's current version."
    roles: [ProgramAdmin]
    code: 201
    input: ["campaign_id", "vehicle_id", "expected_campaign_version", "superseded_consent_id?"]
    output: RemediationConsent
    side_effects: ["consent_status = PENDING", "expires_at = created_at + 14 days", "solicitation_round = 1, or the superseded consent's solicitation_round + 1", "campaign.solicited_consent_count and open_consent_count incremented", "increments RemediationCampaign.version by 1"]

  - method: GET
    path: "/battery-warranty/remediation-consents/{consent_id}"
    description: "Read a consent record."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: RemediationConsent
    side_effects: []

  - method: GET
    path: "/battery-warranty/remediation-consents"
    description: "List consents, filterable by campaign, vehicle, supersession chain and status."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["campaign_id?", "vehicle_id?", "superseded_consent_id?", "consent_status?", "limit?", "offset?"]
    output: RemediationConsent[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/remediation-consents/{consent_id}/decision"
    description: "Record the owner's decision. A decline on a consent linked to an APPROVED_SOFTWARE claim collapses that claim to DENIED and reverses its accrual."
    roles: [VehicleOwner]
    code: 200
    input: ["decision", "owner_signature?"]
    output: RemediationConsent
    side_effects: ["consent_status = GRANTED for decision GRANT, DECLINED for decision DECLINE", "decision_at = clock_now", "on DECLINE: campaign.open_consent_count decremented; any WarrantyClaim with linked_campaign_id == this campaign, vehicle_id == this vehicle and adjudication_status == APPROVED_SOFTWARE moves to DENIED with denial_reason = CONSENT_DECLINED, all money fields reset to 0, and program.accrued_liability_cents reduced by the reversed oem_total_cents", "campaign moves to CLOSED when open_consent_count reaches 0 after at least one solicitation"]

  - method: POST
    path: "/battery-warranty/remediation-consents/{consent_id}/apply-update"
    description: "Record the applied software flash against a granted consent."
    roles: [ServiceTechnician]
    code: 200
    input: ["installer_note?"]
    output: RemediationConsent
    side_effects: ["consent_status = APPLIED", "applied_at = clock_now", "applied_software_version = campaign.software_version", "campaign.applied_count incremented and open_consent_count decremented", "campaign moves to CLOSED when open_consent_count reaches 0"]

  - method: POST
    path: "/battery-warranty/capacity-disputes"
    description: "File a capacity dispute against an adjudicated claim. OPTIMISTIC CONCURRENCY: expected_claim_version must equal the claim's current version."
    roles: [VehicleOwner]
    code: 201
    input: [claim_id, lab_name, owner_statement, expected_claim_version]
    output: CapacityDispute
    side_effects: ["dispute_status = LAB_ASSIGNED", "nominal_basis_kwh and oem_retention_pct snapshotted from the claim's backing assessment", "retest_count = 0", "increments WarrantyClaim.version by 1"]

  - method: GET
    path: "/battery-warranty/capacity-disputes/{dispute_id}"
    description: "Read a capacity dispute with its latest lab measurement and signed deviation."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: CapacityDispute
    side_effects: []

  - method: POST
    path: "/battery-warranty/capacity-disputes/{dispute_id}/lab-result"
    description: "Record an independent-lab measurement. A first result beyond tolerance bounces the dispute back to LAB_ASSIGNED for one mandatory retest."
    roles: [IndependentLab]
    code: 200
    input: ["lab_measured_capacity_kwh", "lab_report_reference?"]
    output: CapacityDispute
    side_effects: ["lab_retention_pct and deviation_pct by calculation lab_deviation", "dispute_status = LAB_ASSIGNED with retest_count incremented to 1 when ABS(deviation_pct) > program.lab_tolerance_pct and retest_count == 0", "dispute_status = LAB_RESULT_RECEIVED otherwise"]

  - method: POST
    path: "/battery-warranty/capacity-disputes/{dispute_id}/resolve"
    description: "Resolve a dispute. TWO-PERSON RULE: the resolving X-User-ID must differ from the claim's adjudicated_by_user_id."
    roles: [WarrantyAdjudicator]
    code: 200
    input: [resolution_note]
    output: CapacityDispute
    side_effects: ["dispute_status = RESOLVED_UPHELD | RESOLVED_OVERTURNED | RESOLVED_DOWNGRADED by calculation lab_deviation", "resolved_by_user_id = X-User-ID", "on RESOLVED_OVERTURNED: a DENIED claim returns to SUBMITTED with reopened_count incremented and denial_reason cleared", "on RESOLVED_DOWNGRADED: an APPROVED_PACK claim collapses to APPROVED_MODULE (releasing its reserved pack back to STOCK and restoring program.reman_available_count) with the settlement recomputed, and an APPROVED_MODULE claim collapses to DENIED with denial_reason = DISPUTE_DOWNGRADE and its accrual reversed", "program.accrued_liability_cents adjusted by the settlement delta"]

  - method: POST
    path: "/battery-warranty/pack-shipments"
    description: "Create a removed-pack shipment in DRAFT. Hazmat classification, packaging requirement, weight, fee and state-of-charge limit are all frozen at creation."
    roles: [ServiceTechnician]
    code: 201
    input: ["pack_id", "origin_service_center_id", "certifying_technician_id", "shipment_contents", "packaging_spec", "state_of_charge_pct", "transport_mode?", "destination?"]
    output: PackShipment
    side_effects: ["status = DRAFT", "hazmat_classification, required_packaging_spec, soc_limit_pct, gross_weight_kg and hazmat_fee_cents by calculation hazmat_classification"]

  - method: GET
    path: "/battery-warranty/pack-shipments/{shipment_id}"
    description: "Read a pack shipment with its frozen hazmat declaration."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: []
    output: PackShipment
    side_effects: []

  - method: GET
    path: "/battery-warranty/pack-shipments"
    description: "List pack shipments, filterable by pack, origin center, certifying technician and status."
    roles: [ProgramAdmin, WarrantyAdjudicator, ServiceTechnician, VehicleOwner, IndependentLab, RegulatoryLiaison]
    code: 200
    input: ["pack_id?", "origin_service_center_id?", "certifying_technician_id?", "status?", "hazmat_classification?", "limit?", "offset?"]
    output: PackShipment[]
    side_effects: []

  - method: POST
    path: "/battery-warranty/pack-shipments/{shipment_id}/tender"
    description: "Tender the shipment to the carrier. Validates packaging conformance and state of charge against the frozen declaration."
    roles: [ServiceTechnician]
    code: 200
    input: ["carrier_reference?"]
    output: PackShipment
    side_effects: ["status = TENDERED", "tendered_at = clock_now"]

  - method: POST
    path: "/battery-warranty/pack-shipments/{shipment_id}/receive"
    description: "Record receipt at the destination. Supply disposition for an accepted receipt or rejection_reason for a rejected one; exactly one of the two is required."
    roles: [ProgramAdmin]
    code: 200
    input: ["outcome", "disposition?", "refurb_soh_pct?", "rejection_reason?"]
    output: PackShipment
    side_effects: ["status = RECEIVED with the disposition recorded, or REJECTED with the rejection_reason recorded", "received_at = clock_now", "on RECEIVED with disposition REMANUFACTURE: the pack moves REMOVED -> STOCK as pack_type REMANUFACTURED with remanufacture_count incremented, and program.reman_available_count and reman_stock_state are re-derived", "on RECEIVED with disposition SCRAP: the pack moves to SCRAPPED (terminal)", "on REJECTED: the pack moves to QUARANTINED, the origin center's rejected_shipment_count and open_hazmat_holds are incremented, its compliance_score is recomputed by calculation center_compliance_score, the center moves to SHIPPING_SUSPENDED once open_hazmat_holds >= 2 and to DECERTIFIED once the score is <= 20"]

  - method: POST
    path: "/battery-warranty/_clock/set_current_utc"
    description: "TEST-DRIVING ENDPOINT. Set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. The clock never rewinds."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock used by every deadline, freshness, expiry, cooldown and certification comparison is set to current_utc", "Technician.status and SohAssessment freshness reads are re-derived against the new instant on their next read"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization -----------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent or not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the target endpoint"
  - id: ERR_ACTOR_REQUIRED
    http: 400
    condition: "X-User-ID absent on an endpoint that records an actor identity"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same user id would perform two duties the two-person rule keeps apart: resolving a dispute on a claim they adjudicated, or certifying the hazmat shipment of a pack they removed"

  # --- request shape ----------------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input is missing or null, an enum value is outside its declared set, or a numeric value violates its declared range or scale"
  - id: ERR_BENCH_CAPACITY_REQUIRED
    http: 400
    condition: "bench_measured_capacity_kwh missing for a BENCH_CAPACITY_TEST assessment, or supplied for a TELEMATICS_FLEET assessment"
  - id: ERR_DETECTED_AT_IN_FUTURE
    http: 400
    condition: "a thermal event's detected_at is later than the current logical clock"
  - id: ERR_INVALID_BAY_WINDOW
    http: 400
    condition: "hv_bay_window_end is not strictly later than hv_bay_window_start"
  - id: ERR_MODULE_POSITION_INVALID
    http: 422
    condition: "a module position is outside 1..pack.module_count, duplicated, or present in both the faulted and degraded arrays"

  # --- existence --------------------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "warranty_program_id or the program_id path segment does not resolve"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "vehicle_id does not resolve"
  - id: ERR_PACK_NOT_FOUND
    http: 404
    condition: "pack_id or replacement_pack_id does not resolve"
  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "service_center_id, origin_service_center_id, reporting_service_center_id or the center_id path segment does not resolve"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "technician_id, diagnosing_technician_id, fulfilment_technician_id or certifying_technician_id does not resolve"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id does not resolve"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "event_id does not resolve"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign_id or linked_campaign_id does not resolve"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "consent_id or superseded_consent_id does not resolve"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id does not resolve"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment_id does not resolve"

  # --- optimistic concurrency -------------------------------------------------------------
  - id: ERR_STALE_VEHICLE_VERSION
    http: 412
    condition: "expected_vehicle_version does not equal the Vehicle's current version"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the WarrantyClaim's current version"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not equal the RemediationCampaign's current version"

  # --- uniqueness -------------------------------------------------------------------------
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "a Vehicle with this vin already exists"
  - id: ERR_DUPLICATE_PACK_SERIAL
    http: 409
    condition: "a BatteryPack with this serial_number already exists"
  - id: ERR_DUPLICATE_CAMPAIGN_CODE
    http: 409
    condition: "a RemediationCampaign with this campaign_code already exists"

  # --- state ------------------------------------------------------------------------------
  - id: ERR_CLAIM_TERMINAL
    http: 409
    condition: "any action attempted on a CLOSED claim"
  - id: ERR_CLAIM_NOT_ADJUDICABLE
    http: 409
    condition: "adjudicate or request-info on a claim whose adjudication_status is not SUBMITTED"
  - id: ERR_INFO_REQUEST_NOT_OPEN
    http: 409
    condition: "resubmit on a claim whose adjudication_status is not INFO_REQUESTED"
  - id: ERR_CLAIM_NOT_FULFILLABLE
    http: 409
    condition: "fulfil on a claim whose adjudication_status is not one of APPROVED_MODULE, APPROVED_PACK, APPROVED_SOFTWARE"
  - id: ERR_CLAIM_NOT_CLOSABLE
    http: 409
    condition: "close on a claim that is neither FULFILLED nor DENIED"
  - id: ERR_CLAIM_NOT_DISPUTABLE
    http: 409
    condition: "a dispute filed on a claim that is still SUBMITTED, INFO_REQUESTED or already CLOSED"
  - id: ERR_DISPUTE_RESOLVED
    http: 409
    condition: "a lab result or resolution submitted against an already-resolved dispute"
  - id: ERR_LAB_RESULT_REQUIRED
    http: 409
    condition: "resolve on a dispute still in LAB_ASSIGNED, including one bounced back for its mandatory retest"
  - id: ERR_CONTAINMENT_STEP_OUT_OF_ORDER
    http: 409
    condition: "step_index is not exactly containment_steps_completed + 1"
  - id: ERR_NOTIFICATION_STILL_PENDING
    http: 409
    condition: "containment step 3 (CLOSE_CONTAINMENT) attempted while the event's notification_status is still PENDING"
  - id: ERR_NOTIFICATION_ALREADY_FILED
    http: 409
    condition: "a regulatory notification filed on an event whose notification_status is FILED or LATE_FILED"
  - id: ERR_CAMPAIGN_NOT_RELEASED
    http: 409
    condition: "consent solicited for a campaign in DRAFT, SUSPENDED or CLOSED"
  - id: ERR_CONSENT_ALREADY_DECIDED
    http: 409
    condition: "a decision recorded on a consent whose consent_status is not PENDING"
  - id: ERR_CONSENT_NOT_GRANTED
    http: 409
    condition: "apply-update on a consent whose consent_status is not GRANTED"
  - id: ERR_VEHICLE_IMMOBILIZED
    http: 409
    condition: "consent solicitation, decision or flash attempted on a vehicle whose status is IMMOBILIZED"
  - id: ERR_ASSESSMENT_SUPERSEDED
    http: 409
    condition: "a claim filed against an assessment whose superseded flag is true"
  - id: ERR_ASSESSMENT_ALREADY_CLAIMED
    http: 409
    condition: "a claim filed against an assessment already cited by a claim that is not CLOSED"
  - id: ERR_DIAGNOSTIC_NOT_VALID
    http: 409
    condition: "a claim filed against an assessment whose diagnostic_validity is STALE_TELEMETRY, INSUFFICIENT_DATA or BENCH_OUT_OF_RANGE"
  - id: ERR_SHIPMENT_PACK_NOT_REMOVED
    http: 409
    condition: "a shipment created for a pack whose status is neither REMOVED nor QUARANTINED"
  - id: ERR_SHIPMENT_NOT_TENDERED
    http: 409
    condition: "tender on a shipment not in DRAFT, or receive on a shipment not in TENDERED"
  - id: ERR_CENTER_SHIPPING_SUSPENDED
    http: 409
    condition: "a shipment created or tendered from a center in SHIPPING_SUSPENDED or DECERTIFIED"

  # --- referential coherence --------------------------------------------------------------
  - id: ERR_PACK_VEHICLE_MISMATCH
    http: 422
    condition: "pack_id is not the vehicle's installed_pack_id"
  - id: ERR_ASSESSMENT_VEHICLE_MISMATCH
    http: 422
    condition: "the backing assessment belongs to a different vehicle than the claim"
  - id: ERR_TECHNICIAN_CENTER_MISMATCH
    http: 422
    condition: "the named technician does not belong to the center of record for the operation"
  - id: ERR_VEHICLE_NOT_TARGETED
    http: 422
    condition: "the vehicle's model_code, installed pack_type or region_code puts it outside the campaign's declared target set"
  - id: ERR_PACK_REGION_MISMATCH
    http: 422
    condition: "an explicitly supplied replacement pack's stock_region_code or module_count does not match the claim's center region or the removed pack"

  # --- high-voltage safety, compliance and regulatory -------------------------------------
  - id: ERR_CENTER_NOT_CERTIFIED
    http: 409
    condition: "fulfilment attempted at a center whose status is not ACTIVE"
  - id: ERR_CENTER_CERT_LEVEL_INSUFFICIENT
    http: 409
    condition: "the center's hv_certification_level is below the level the approved remedy requires"
  - id: ERR_PACK_LIFT_REQUIRED
    http: 409
    condition: "a PACK_REPLACEMENT fulfilment attempted at a center without a certified pack lift"
  - id: ERR_INSULATION_TESTER_OVERDUE
    http: 409
    condition: "a hardware fulfilment attempted while the center's insulation tester calibration is due or overdue"
  - id: ERR_TECHNICIAN_CERT_EXPIRED
    http: 409
    condition: "the acting technician's high-voltage certification has lapsed against the current logical clock"
  - id: ERR_TECHNICIAN_LEVEL_INSUFFICIENT
    http: 409
    condition: "the acting technician's hv_cert_level is below the level the approved remedy requires"
  - id: ERR_THERMAL_CONTAINMENT_OPEN
    http: 409
    condition: "fulfilment attempted while an S3 or S4 thermal event on the pack has not reached CONTAINMENT_CLOSED"
  - id: ERR_REMEDY_OVERRIDE_FORBIDDEN
    http: 409
    condition: "an adjudicator approves a remedy weaker than a PACK_REPLACEMENT recommendation grounded in THERMAL_HISTORY or CELL_DELTA"
  - id: ERR_AIR_TRANSPORT_FORBIDDEN
    http: 409
    condition: "a UN3536 shipment declared for AIR transport"
  - id: ERR_PACKAGING_NONCONFORMANT
    http: 409
    condition: "packaging_spec does not equal required_packaging_spec at tender"
  - id: ERR_SOC_LIMIT_EXCEEDED
    http: 409
    condition: "state_of_charge_pct exceeds the shipment's soc_limit_pct"

  # --- temporal conflicts -----------------------------------------------------------------
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 409
    condition: "the requested logical clock instant is earlier than the current one"
  - id: ERR_HV_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested bay window overlaps as many occupied windows at the center as it has bays"
  - id: ERR_TECHNICIAN_COOLDOWN_CONFLICT
    http: 409
    condition: "the requested bay window starts less than 60 minutes after the technician's previous window ended"
  - id: ERR_CONSENT_EXPIRED
    http: 409
    condition: "a decision or flash recorded after the consent's expires_at"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 409
    condition: "a dispute filed more than program.dispute_window_days days after the claim's adjudication"

  # --- business constraints ---------------------------------------------------------------
  - id: ERR_VEHICLE_ALREADY_HAS_PACK
    http: 409
    condition: "a pack is created as installed on a vehicle that already has an installed pack"
  - id: ERR_CLAIM_ALREADY_OPEN
    http: 409
    condition: "the vehicle already has a claim that is not CLOSED"
  - id: ERR_RETENTION_ABOVE_THRESHOLD
    http: 409
    condition: "the assessment's retention_pct is strictly above the applicable minimum retention threshold"
  - id: ERR_OUT_OF_COVERAGE
    http: 409
    condition: "the assessment's coverage_position is OUT_OF_COVERAGE on both axes or on either axis beyond the goodwill band"
  - id: ERR_INFO_REQUEST_LIMIT_EXCEEDED
    http: 409
    condition: "an information request opened when info_request_round already equals program.info_request_limit"
  - id: ERR_DUPLICATE_ACTIVE_CONSENT
    http: 409
    condition: "a PENDING or GRANTED consent already exists for the campaign/vehicle pair, or the supplied superseded_consent_id is not a DECLINED or EXPIRED record for that same pair"
  - id: ERR_DUPLICATE_ACTIVE_DISPUTE
    http: 409
    condition: "an unresolved dispute already exists on the claim"
  - id: ERR_NOTIFICATION_NOT_REQUIRED
    http: 409
    condition: "a regulatory notification filed on an S1 or S2 event"
  - id: ERR_PACK_NOT_IN_STOCK
    http: 409
    condition: "an explicitly supplied replacement pack is not free STOCK, or a remanufactured one is below the program's minimum refurbished state of health"
  - id: ERR_NO_REMAN_PACK_AVAILABLE
    http: 409
    condition: "the remanufactured candidate pool is empty and NEW-pack substitution is not permitted"

  # --- fiscal -----------------------------------------------------------------------------
  - id: ERR_LIABILITY_CAP_EXCEEDED
    http: 409
    condition: "the approval's oem_total_cents would push program.accrued_liability_cents strictly above program.liability_cap_cents"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "OEM battery program administrator: configures the program, registers fleet and network master data, releases campaigns, solicits consent, receives returned packs and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /battery-warranty/warranty-programs"
      - "POST /battery-warranty/vehicles"
      - "POST /battery-warranty/service-centers"
      - "POST /battery-warranty/service-centers/{id}/technicians"
      - "POST /battery-warranty/battery-packs"
      - "POST /battery-warranty/remediation-campaigns"
      - "POST /battery-warranty/remediation-campaigns/{campaign_id}/release"
      - "POST /battery-warranty/remediation-consents"
      - "POST /battery-warranty/pack-shipments/{shipment_id}/receive"
      - "POST /battery-warranty/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: WarrantyAdjudicator
    description: "Warranty claims adjudicator: opens information requests, decides claims, closes them and resolves capacity disputes raised against OTHER adjudicators' decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /battery-warranty/warranty-claims/{claim_id}/request-info"
      - "POST /battery-warranty/warranty-claims/{claim_id}/adjudicate"
      - "POST /battery-warranty/warranty-claims/{claim_id}/close"
      - "POST /battery-warranty/capacity-disputes/{dispute_id}/resolve"
    shared_operations:
      - "every GET endpoint"

  - name: ServiceTechnician
    description: "High-voltage certified service technician: runs diagnostics, files and resubmits claims, executes remedies in a booked bay, records containment steps, applies software flashes and creates and tenders removed-pack shipments."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /battery-warranty/soh-assessments"
      - "POST /battery-warranty/warranty-claims"
      - "POST /battery-warranty/warranty-claims/{claim_id}/resubmit"
      - "POST /battery-warranty/warranty-claims/{claim_id}/fulfil"
      - "POST /battery-warranty/thermal-events/{event_id}/containment-step"
      - "POST /battery-warranty/remediation-consents/{consent_id}/apply-update"
      - "POST /battery-warranty/pack-shipments"
      - "POST /battery-warranty/pack-shipments/{shipment_id}/tender"
    shared_operations:
      - "POST /battery-warranty/thermal-events  (shared with TelematicsGateway)"
      - "every GET endpoint"

  - name: TelematicsGateway
    description: "Vehicle telematics ingestion gateway: the only producer of telematics snapshots, and a co-producer of machine-detected thermal events."
    identity: "opaque"
    exclusive_operations:
      - "POST /battery-warranty/vehicles/{id}/telematics-snapshots"
    shared_operations:
      - "POST /battery-warranty/thermal-events  (shared with ServiceTechnician)"
      - "GET /battery-warranty/vehicles/{id}/telematics-snapshots"
      - "GET /battery-warranty/thermal-events and GET /battery-warranty/thermal-events/{event_id}"

  - name: VehicleOwner
    description: "Registered owner of a vehicle: consents to or declines a software remediation flash and files capacity disputes. X-User-ID is the owner's Vehicle id."
    identity: "entity_backed:Vehicle"
    exclusive_operations:
      - "POST /battery-warranty/remediation-consents/{consent_id}/decision"
      - "POST /battery-warranty/capacity-disputes"
    shared_operations:
      - "every GET endpoint"

  - name: IndependentLab
    description: "Independent verification laboratory: the only producer of lab capacity measurements on a dispute."
    identity: "opaque"
    exclusive_operations:
      - "POST /battery-warranty/capacity-disputes/{dispute_id}/lab-result"
    shared_operations:
      - "every GET endpoint"

  - name: RegulatoryLiaison
    description: "Regulatory affairs liaison: the only role that may file a thermal-event notification with the regulator."
    identity: "opaque"
    exclusive_operations:
      - "POST /battery-warranty/thermal-events/{event_id}/regulatory-notification"
    shared_operations:
      - "every GET endpoint"

segregation_of_duties_rules:
  - rule_id: dispute-resolver-two-person
    description: "The X-User-ID resolving a CapacityDispute MUST differ from the claim's adjudicated_by_user_id. Both are opaque WarrantyAdjudicator identifiers, so the rule is a value comparison, never an entity lookup."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule_id: hazmat-certifier-two-person
    description: "A PackShipment's certifying_technician_id MUST differ from the fulfilment_technician_id of the claim that removed the pack. Both are Technician ids, matching the entity_backed identity of ServiceTechnician."
    error_id: ERR_SEGREGATION_OF_DUTIES
