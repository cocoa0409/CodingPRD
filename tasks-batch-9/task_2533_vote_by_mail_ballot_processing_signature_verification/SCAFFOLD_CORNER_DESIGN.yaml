      - name: email_uocava_delivery_for_a_domestic_voter_is_not_eligible
        claim_type: Conditional validation
        grounds:
          - validations[ERR_DELIVERY_METHOD_NOT_ELIGIBLE]
          - entities.Voter.fields.uocava_status
          - entities.BallotRequest.fields.delivery_method
        distinguishing_aspect: "delivery_method EMAIL_UOCAVA is accepted for a MILITARY voter and rejected with 422 ERR_DELIVERY_METHOD_NOT_ELIGIBLE for voter v1 whose uocava_status is NONE — the same payload shape, gated only by the voter's configuration."
        test_recipe:
          setup:
            - "Election e1; domestic voter v1 (uocava_status NONE) and overseas-military voter vM (uocava_status MILITARY)."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - &c_voter_uocava
              call: "POST /vote-by-mail/voters"
              payload: { full_name: "Milo Vance", party_affiliation: "NPP", residence_address: "Unit 7, FPO AE 09501", last_signature_update_at: "2026-01-08T00:00:00Z", uocava_status: "MILITARY" }
              as: ElectionsClerk
              captures: { vM: $.data.id, vM_v: $.data.version }
          trigger:
            - &c_request_uocava
              call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${vM}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "EMAIL_UOCAVA", expected_voter_version: "${vM_v}" }
              as: ElectionsClerk
              captures: { brM: $.data.id }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "EMAIL_UOCAVA", expected_voter_version: "${v1_v}" }
              as: ElectionsClerk
              captures: { not_eligible_err: $.data.error_id }
          assert:
            - "MILITARY voter: HTTP 201 with BallotRequest.delivery_method == \"EMAIL_UOCAVA\" and status == \"RECEIVED\""
            - "Domestic voter: HTTP 422 with data.error_id == \"ERR_DELIVERY_METHOD_NOT_ELIGIBLE\""
            - "GET /vote-by-mail/ballot-requests?voter_id=${v1} returns total_count == 0"

      - name: uocava_batch_rejects_a_domestic_voters_packet
        claim_type: Cross-entity validation
        grounds:
          - validations[ERR_UOCAVA_BATCH_MISMATCH]
          - entities.MailingBatch.fields.batch_type
        distinguishing_aspect: "Packet creation joins batch_type to the voter reached through the request: a UOCAVA batch accepts vM's packet and rejects v1's with 422 ERR_UOCAVA_BATCH_MISMATCH, leaving packet_count at 1."
        test_recipe:
          setup:
            - "Election e1 with an APPROVED request br1 for domestic voter v1 and an APPROVED request brM for MILITARY voter vM; one DRAFT UOCAVA batch mbU."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_voter_uocava
            - *c_request_uocava
            - &c_avM_lookup
              call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${brM}" }
              as: ElectionsClerk
              captures: { avM: "$.data[0].id" }
            - &c_avM_same
              call: "POST /vote-by-mail/address-verifications/${avM}/results"
              payload: { ncoa_result: "MATCH_SAME" }
              as: ElectionsClerk
            - &c_approveM
              call: "POST /vote-by-mail/ballot-requests/${brM}/approve"
              payload: {}
              as: ElectionsClerk
            - &c_batch_uocava
              call: "POST /vote-by-mail/mailing-batches"
              payload: { election_id: "${e1}", batch_type: "UOCAVA", scheduled_send_date: "2026-09-14" }
              as: ElectionsClerk
              captures: { mbU: $.data.id }
          trigger:
            - &c_packet_uocava
              call: "POST /vote-by-mail/mailing-batches/${mbU}/packets"
              payload: { ballot_request_id: "${brM}", packet_weight_grams: 28 }
              as: ElectionsClerk
              captures: { pkM: $.data.id }
            - call: "POST /vote-by-mail/mailing-batches/${mbU}/packets"
              payload: { ballot_request_id: "${br1}", packet_weight_grams: 28 }
              as: ElectionsClerk
              captures: { batch_mismatch_err: $.data.error_id }
          assert:
            - "MILITARY packet: HTTP 201 with packet_postage_cents == 152 (73 outbound + 11 rounded UOCAVA surcharge + 68 return postage)"
            - "Domestic packet into the UOCAVA batch: HTTP 422 with data.error_id == \"ERR_UOCAVA_BATCH_MISMATCH\""
            - "GET /vote-by-mail/mailing-batches/${mbU} returns packet_count == 1"
            - "GET /vote-by-mail/ballot-packets?mailing_batch_id=${mbU} returns total_count == 1 with data[0].id == ${pkM}"

      - name: packet_whose_request_belongs_to_another_election_returns_mismatch
