# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Organ Transplant Waitlist — task_0146
# Breadth probe across claim-extraction-guide sections. Grounds resolve into
# SCAFFOLD.yaml §1.1–§1.7. Setup chains use only declared §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_create_candidate_returns_201_defaults
        claim_type: Creation
        grounds:
          - entities.Candidate
          - endpoints
        distinguishing_aspect: "POST /candidates with all required fields returns 201; listing_status==DRAFT, medical_status==ACTIVE, current_meld_peld==0, version==1."
        test_recipe:
          setup:
            - "A registered center C."
          setup_api_calls:
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "N1", organ_type: "KIDNEY", blood_type: "B", date_of_birth: "1990-01-01T00:00:00Z", height_cm: 170, weight_kg: 70, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { cand_id: "$.data.id", ls: "$.data.listing_status", ms: "$.data.medical_status", cm: "$.data.current_meld_peld", v: "$.data.version" }
          assert:
            - "Candidate.${cand_id}.listing_status == DRAFT"
            - "Candidate.${cand_id}.medical_status == ACTIVE"
            - "Candidate.${cand_id}.current_meld_peld == 0"
            - "Candidate.${cand_id}.version == 1"

      - name: corner_candidate_not_found_404
        claim_type: Not Found
        grounds:
          - entities.Candidate
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /candidates/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB except clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
          trigger:
            - call: "GET /candidates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UNOSAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "GET returns HTTP 404 ERR_NOT_FOUND"

      - name: corner_create_candidate_missing_required_field_422
        claim_type: Required Fields
        grounds:
          - entities.Candidate.fields.blood_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /candidates omitting blood_type returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A registered center C."
          setup_api_calls:
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "N2", organ_type: "KIDNEY", date_of_birth: "1990-01-01T00:00:00Z", height_cm: 170, weight_kg: 70, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST returns HTTP 422 ERR_INVALID_REQUEST (missing blood_type)"

      - name: corner_create_candidate_invalid_enum_422
        claim_type: Type Constraints
        grounds:
          - entities.Candidate.fields.organ_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /candidates with organ_type not in {LIVER,KIDNEY,HEART,LUNG} returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A registered center C."
          setup_api_calls:
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "N3", organ_type: "PANCREAS", blood_type: "O", date_of_birth: "1990-01-01T00:00:00Z", height_cm: 170, weight_kg: 70, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST returns HTTP 422 ERR_INVALID_REQUEST (organ_type PANCREAS not allowed)"

      - name: corner_candidate_duplicate_mrn_409
        claim_type: Type Constraints
        grounds:
          - entities.Candidate.fields.mrn
          - validations[priority=6]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "POST /candidates with a (center_id,mrn) pair already used at that center returns 409 ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup:
            - "Center C already has candidate with mrn DUP."
          setup_api_calls:
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "DUP", organ_type: "KIDNEY", blood_type: "O", date_of_birth: "1990-01-01T00:00:00Z", height_cm: 170, weight_kg: 70, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "DUP", organ_type: "KIDNEY", blood_type: "A", date_of_birth: "1991-01-01T00:00:00Z", height_cm: 171, weight_kg: 71, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Second POST returns HTTP 409 ERR_DUPLICATE_RESOURCE"

      - name: corner_candidate_listing_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Candidate
          - response_envelope
        distinguishing_aspect: "GET /candidates returns an array response_type with pagination fields limit/offset/total_count/has_more present."
        test_recipe:
          setup:
            - "Center C with one candidate."
          setup_api_calls:
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "L1", organ_type: "KIDNEY", blood_type: "O", date_of_birth: "1990-01-01T00:00:00Z", height_cm: 170, weight_kg: 70, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
          trigger:
            - call: "GET /candidates?center_id=${c_id}&limit=10&offset=0"
              payload: {}
              as: UNOSAdmin
          assert:
            - "Response response_type == array; meta.total_count == 1; meta.has_more == false"

      - name: corner_candidate_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Candidate.fields.listing_status
          - entities.Candidate.fields.current_meld_peld
        distinguishing_aspect: "Client-supplied listing_status/current_meld_peld in POST /candidates are ignored; server sets DRAFT and 0 (unknown keys rejected at validation, so caller cannot seed them)."
        excluded_because:
          difficulty_instance: "(none) — covered by corner_create_candidate_returns_201_defaults asserting DRAFT/0 from a payload that legally cannot include those keys"
          rationale: "POST /candidates input schema excludes listing_status/current_meld_peld; the defaults assertion in corner_create_candidate_returns_201_defaults already proves system-set values."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_finalize_already_finalized_score_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ClinicalScore.DRAFT_to_FINALIZED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Finalizing a score already in FINALIZED returns 409 ERR_INVALID_STATE; no recompute fires."
        test_recipe:
          setup:
            - "A candidate with one FINALIZED ClinicalScore."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "S1", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { score_id: "$.data.id" }
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Second finalize returns HTTP 409 ERR_INVALID_STATE"

      - name: corner_list_candidate_without_finalized_score_blocked
        claim_type: precondition_violation
        grounds:
          - state_machines.Candidate.DRAFT_to_LISTED
          - validations[priority=9]
          - errors[ERR_NO_FINALIZED_SCORE]
        distinguishing_aspect: "Listing a DRAFT candidate with zero FINALIZED scores returns 409 ERR_NO_FINALIZED_SCORE; candidate stays DRAFT."
        test_recipe:
          setup:
            - "A DRAFT candidate with a DRAFT (un-finalized) score only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "S2", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "List returns HTTP 409 ERR_NO_FINALIZED_SCORE; Candidate.${cand_id}.listing_status == DRAFT"

      - name: corner_remove_from_draft_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Candidate.LISTED_to_REMOVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /candidates/{id}/remove on a DRAFT (never LISTED) candidate returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A DRAFT candidate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "S3", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { cand_id: "$.data.id" }
          trigger:
            - call: "POST /candidates/${cand_id}/remove"
              payload: { removal_reason: "OTHER" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Remove returns HTTP 409 ERR_INVALID_STATE (DRAFT has no remove transition)"

      - name: corner_initial_state_donor_organ_available
        claim_type: initial_state
        grounds:
          - state_machines.DonorOrgan
          - entities.DonorOrgan.fields.status
        distinguishing_aspect: "A newly created DonorOrgan starts in status==AVAILABLE with open_offer_count==0 and version==1."
        test_recipe:
          setup:
            - "A registered OPO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
          trigger:
            - call: "POST /donor-organs"
              payload: { opo_id: "${opo_id}", organ_type: "LIVER", blood_type: "O", donor_height_cm: 180, donor_weight_kg: 85, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"], recovered_at: "2026-06-01T00:00:00Z", max_cold_ischemia_hours: 10 }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { organ_id: "$.data.id", st: "$.data.status", ooc: "$.data.open_offer_count", v: "$.data.version" }
          assert:
            - "DonorOrgan.${organ_id}.status == AVAILABLE"
            - "DonorOrgan.${organ_id}.open_offer_count == 0"
            - "DonorOrgan.${organ_id}.version == 1"

      - name: corner_terminal_offer_decline_then_decline_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Offer.OFFERED_to_DECLINED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Declining an offer already in DECLINED (terminal) returns 409 ERR_INVALID_STATE; open_offer_count unchanged."
        test_recipe:
          setup:
            - "An offer already DECLINED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C5", unos_center_code: "C005", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c5_id}", mrn: "S4", organ_type: "LIVER", blood_type: "A", date_of_birth: "1975-01-01T00:00:00Z", height_cm: 178, weight_kg: 80, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { score_id: "$.data.id" }
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /donor-organs"
              payload: { opo_id: "${opo_id}", organ_type: "LIVER", blood_type: "O", donor_height_cm: 180, donor_weight_kg: 85, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"], recovered_at: "2026-06-01T00:00:00Z", max_cold_ischemia_hours: 10 }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { organ_id: "$.data.id", organ_v0: "$.data.version" }
            - call: "POST /match-runs"
              payload: { donor_organ_id: "${organ_id}", expected_donor_organ_version: "${organ_v0}", policy_code: "STANDARD" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { run_id: "$.data.id", organ_v1: "$.data.version" }
            - call: "POST /offers"
              payload: { donor_organ_id: "${organ_id}", candidate_id: "${cand_id}", match_run_id: "${run_id}", expected_donor_organ_version: "${organ_v1}" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { offer_id: "$.data.id" }
            - call: "POST /offers/${offer_id}/decline"
              payload: { decline_reason: "CENTER_DECLINE" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
          trigger:
            - call: "POST /offers/${offer_id}/decline"
              payload: { decline_reason: "OTHER" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Second decline returns HTTP 409 ERR_INVALID_STATE; DonorOrgan.${organ_id}.open_offer_count == 0"

      - name: corner_unos_report_reject_sets_reason
        claim_type: valid_transition
        grounds:
          - state_machines.UnosReport.SUBMITTED_to_REJECTED
          - entities.UnosReport.fields.rejection_reason
        distinguishing_aspect: "POST /unos-reports/{id}/reject moves SUBMITTED->REJECTED and sets rejection_reason from body."
        test_recipe:
          setup:
            - "A SUBMITTED REMOVAL report for a REMOVED candidate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C", unos_center_code: "C001", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c_id}", mrn: "U1", organ_type: "LIVER", blood_type: "O", date_of_birth: "1980-01-01T00:00:00Z", height_cm: 175, weight_kg: 75, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { score_id: "$.data.id" }
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c_id}"
            - call: "POST /candidates/${cand_id}/remove"
              payload: { removal_reason: "DECEASED" }
              as: TransplantCenter
              as_user_id: "${c_id}"
            - call: "POST /unos-reports"
              payload: { report_kind: "REMOVAL", candidate_id: "${cand_id}" }
              as: TransplantCenter
              as_user_id: "${c_id}"
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /unos-reports/${rep_id}/reject"
              payload: { rejection_reason: "incomplete documentation" }
              as: UNOSAdmin
              captures: { st: "$.data.status", rr: "$.data.rejection_reason" }
          assert:
            - "UnosReport.${rep_id}.status == REJECTED"
            - "UnosReport.${rep_id}.rejection_reason == 'incomplete documentation'"

      - name: corner_followup_mark_missed_before_due_invalid_state
        claim_type: precondition_violation
        grounds:
          - state_machines.FollowUp.SCHEDULED_to_MISSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "mark-missed before scheduled_for (clock <= scheduled_for) violates the precondition and returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A SCHEDULED follow-up due 2026-12-01; clock at 2026-06-01 (before due)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C5", unos_center_code: "C005", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /organ-procurement-orgs"
              payload: { name: "OPO5", opo_code: "OPO5", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { opo_id: "$.data.id" }
            - call: "POST /candidates"
