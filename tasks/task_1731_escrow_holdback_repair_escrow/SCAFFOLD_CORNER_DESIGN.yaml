      - name: holdback_amount_rounding_half_up
        claim_type: precision
        grounds: [calculations.holdback_sizing]
        distinguishing_aspect: "200000 x 1.10 is exact, but 10005 x 1.10 = 11005.5 must round half-UP to 11006 (a floor/truncation implementation yields 11005 and fails)."
        test_recipe:
          setup: ["escrow file exists"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
          trigger:
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Half-cent case", repair_estimate_cents: 10005, contingency_pct: 10, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: false }
              as: EscrowOfficer
              captures: { amt: $.data.holdback_amount_cents }
          assert:
            - "amt == 11006 (round_half_up(11005.5))"

      - name: amend_recomputes_amount_and_posts_funding_delta
        claim_type: correct_result
        grounds: [calculations.holdback_sizing, calculations.ledger_reconciliation, state_machines.Holdback.DRAFT_to_DRAFT]
        distinguishing_aspect: "Amendment up posts a FUNDING top-up (+57500) and amendment down posts REFUND_TO_SOURCE (-80500); running balances 230000 -> 287500 -> 207000 prove the chronological accumulator across mixed-sign entries."
        test_recipe:
          setup: ["DRAFT holdback, estimate 200000 contingency 15 (funded 230000)"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_id: $.data.id }
            - call: "POST /escrow/holdbacks"
              payload: { escrow_file_id: "${file_id}", repair_scope: "Roof", repair_estimate_cents: 200000, contingency_pct: 15, funding_source: "SELLER_PROCEEDS", overrun_responsibility: "BUYER", expiration_terms: "RETURN_TO_SELLER", work_deadline_date: "2026-09-15", hard_stop_date: "2026-10-15", exterior_work_flag: true }
              as: EscrowOfficer
              captures: { hb_id: $.data.id, hb_v1: $.data.version }
          trigger:
            - call: "POST /escrow/holdbacks/${hb_id}/amend"
              payload: { expected_holdback_version: "${hb_v1}", repair_estimate_cents: 250000 }
              as: EscrowOfficer
              captures: { hb_v2: $.data.version, amt2: $.data.holdback_amount_cents }
            - call: "POST /escrow/holdbacks/${hb_id}/amend"
              payload: { expected_holdback_version: "${hb_v2}", repair_estimate_cents: 180000 }
              as: EscrowOfficer
              captures: { amt3: $.data.holdback_amount_cents }
            - call: "GET /escrow/holdbacks/${hb_id}/ledger-entries"
              as: EscrowOfficer
              captures: { d1_type: "$.data[1].entry_type", d1_amt: "$.data[1].amount_cents", d1_run: "$.data[1].running_balance_cents", d2_type: "$.data[2].entry_type", d2_amt: "$.data[2].amount_cents", d2_run: "$.data[2].running_balance_cents" }
          assert:
            - "amt2 == 287500 (250000 x 1.15) and d1_type == FUNDING, d1_amt == 57500, d1_run == 287500"
            - "amt3 == 207000 (180000 x 1.15) and d2_type == REFUND_TO_SOURCE, d2_amt == -80500, d2_run == 207000"
            - "Holdback.${hb_id}.trust_balance_cents == 207000 and version advanced by exactly 1 per amend"

      - name: verifying_inspection_must_postdate_draw
        claim_type: input_set_filtering
        grounds: ["validations[priority=13]", "errors[ERR_NO_VERIFYING_INSPECTION]"]
        distinguishing_aspect: "A PASSED draw-verification inspection reported BEFORE the draw was created does not enter the approval input set (reported_at >= draw.created_at pinned); approval fails until a fresh pass exists."
        test_recipe:
          setup: ["ACTIVE holdback with selected bid; DRAW_VERIFICATION PASSED at 2026-08-20; draw created 2026-08-21 (clock advanced between)"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
