              captures: { ma_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "ownb@x.com", full_name: "OwnB" }
              as: Anonymous
              captures: { mb_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${ma_id}", plan_id: "${plan_id}" }
