            - call: "POST /hotel-management/budgets/${au_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${au_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/budgets/${au_bud}/variance-requests"
              payload: { category: "OPERATING", requested_amount_cents: 60000000, justification: "full-floor guestroom soft goods overrun" }
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
              captures: { au_var: $.data.id }
          trigger:
            - call: "POST /hotel-management/variance-requests/${au_var}/decision"
              payload: { decision: "APPROVE", note: "asset manager signing above its ceiling" }
              as: AssetManager
              as_user_id: "u-asset-1"
              captures: { au_err: $.data.error_id }
