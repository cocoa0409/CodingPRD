              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id, z_v: $.data.version }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 3, size_class: "SMALL", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /contamination-tickets"
              payload: { program_id: "${pid}", booking_id: "${b1}", category: "WREATH_WITH_WIRE" }
              as: SiteSupervisor
              as_user_id: sup_1
              captures: { t1: $.data.id }
            - call: "PATCH /zones/${zid}"
              payload: { daily_tree_capacity: 6, expected_zone_version: "${z_v}" }
              as: ProgramAdmin
          trigger:
            - call: "PATCH /zones/${zid}"
              payload: { daily_tree_capacity: 7, expected_zone_version: "${z_v}" }
              as: ProgramAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /contamination-tickets/${t1}/adjudicate"
              payload: { verdict: "UPHELD" }
              as: SiteSupervisor
              as_user_id: sup_1
              captures: { e2: $.data.error_id }
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 4, size_class: "MEDIUM", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { e3: $.data.error_id }
          assert:
            - "Stale version: error_id == ERR_STALE_VERSION with http 412 (zone version advanced by the successful capacity patch)"
            - "Reporter adjudicating own ticket: error_id == ERR_SEGREGATION_OF_DUTIES with http 403"
            - "Capacity overflow (3 reserved + 4 > 6): error_id == ERR_ROUTE_CAPACITY_EXCEEDED with http 422"

