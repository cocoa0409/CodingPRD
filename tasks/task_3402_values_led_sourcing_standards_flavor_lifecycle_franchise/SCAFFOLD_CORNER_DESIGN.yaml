        claim_type: role_exclusive_denied
        grounds: ["roles.ParentOpsController", "roles.IndependentBoardMember", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "ParentOpsController (operational control) cannot cast board decisions — social-mission authority is board-exclusive."
