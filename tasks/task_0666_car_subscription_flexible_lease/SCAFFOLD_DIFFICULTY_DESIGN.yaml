              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C1", fleet_id: "${fleet_id}", buffer_minutes: 0 }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T10:00:00Z", window_end_iso: "2026-04-01T11:00:00Z" }
              as: FleetOperator
          trigger:
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T10:30:00Z", window_end_iso: "2026-04-01T11:30:00Z" }
              as: FleetOperator
              captures: { err: $.data.error_id }
          assert:
            - "the back-to-back [10:00,11:00) slot was created successfully (adjacency end==start allowed)"
            - "HTTP 409 with error_id == ERR_VEHICLE_SLOT_OVERLAP for the overlapping [10:30,11:30) slot"

      - name: courier_closed_interval_plus_buffer_adjacency_rejected
        grounds:
          - validations[priority=12]
          - errors[ERR_COURIER_BUFFER_CONFLICT]
          - entities.Courier.fields.buffer_minutes
