          setup:
            - "Clock 2026-08-04T23:45:00Z. VIEWABILITY methodology VIEW-2026.1 is effective [2026-01-01T00:00:00Z, 2026-08-05T00:00:00Z) and still PROVISIONAL; the SUITABILITY version runs to 2027 so classification is unaffected. Two pages so no batch-window collision can interfere."
