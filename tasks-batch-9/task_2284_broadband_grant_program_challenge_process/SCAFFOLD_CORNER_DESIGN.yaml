      - name: scoring_posture_projection_across_program_phases
        claim_type: aggregation
        grounds:
          - calculations.program_scoring_posture
          - entities.GrantProgram.fields.scoring_posture
          - entities.GrantProgram.fields.stale_score_sheet_count
        distinguishing_aspect: |
          With stale_score_sheet_count pinned at 0 the posture is a pure projection of program_state:
          FROZEN in DRAFT and CHALLENGE_OPEN, OPEN in CHALLENGE_CLOSED and SCORING, and FROZEN again
          in ALLOCATION_CLOSED. The RESTRICTED branch never appears, which proves the count term and
          the phase term are separate inputs rather than one derived flag.
        test_recipe:
          setup:
            - "One program with no applications and therefore no score sheets, walked through every phase."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /broadband/programs/${p_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/close-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-scoring"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/close-allocation"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the first trigger call reports program_state DRAFT with scoring_posture FROZEN"
            - "after open-challenge-window: program_state CHALLENGE_OPEN and scoring_posture FROZEN"
            - "after close-challenge-window: program_state CHALLENGE_CLOSED and scoring_posture OPEN"
            - "after open-scoring: program_state SCORING and scoring_posture OPEN"
            - "after close-allocation: program_state ALLOCATION_CLOSED and scoring_posture FROZEN"
            - "GrantProgram.${p_id}.stale_score_sheet_count == 0 at every step"
            - "scoring_posture is never RESTRICTED anywhere in this walk"

      - name: application_cost_per_location_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.application_cost_per_location.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / application_cost_per_location_preliminary_vs_final
          rationale: "That instance asserts both variants on the same claim set and the exact delta introduced by excluding the SERVED location from the FINAL denominator."

      - name: milestone_disbursement_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.milestone_disbursement_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / milestone_disbursement_pro_rata_vs_cost_reimbursement
          rationale: "That instance drives one milestone on each evidence_basis over identical build progress and asserts the two different payable amounts and the holdback clamp."

      - name: capability_index_variant_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.subgrantee_capability_index.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / subgrantee_capability_index_initial_vs_remediation
          rationale: "That instance asserts the INITIAL index 68.00 -> REMEDIATION index 58.80 transition including the 0.85 haircut inside the rounding step and the withdrawn-personnel basis change."

      - name: award_match_per_location_rounding_precision
        claim_type: precision
        grounds:
          - calculations.award_match_requirement.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / award_match_per_location_round_then_sum
          rationale: "That instance pins round-then-sum (675003) against the forbidden sum-then-round (675002) on a claim set engineered so the two disagree."

      - name: award_obligation_waterfall_single_pass
        claim_type: waterfall_allocation
        grounds:
          - calculations.award_obligation_amount
        excluded_because:
          difficulty_instance: combinatorial_formula / award_obligation_single_pass_ehcl_order
          rationale: "That instance asserts the pinned nine-step order, the frozen post-deferral per-location cost and the absence of a second EHCL pass."

      - name: application_total_score_capped_component_interaction
        claim_type: weighted_scoring
        grounds:
          - calculations.application_total_score.note
        excluded_because:
          difficulty_instance: combinatorial_formula / application_total_score_nested_cap_interaction
          rationale: "That instance asserts each per-component cap clipping before the single capability multiplier and the final 100.00 clamp."

      - name: location_classification_threshold_boundaries
        claim_type: threshold
        grounds:
          - calculations.location_classification.note
        excluded_because:
          difficulty_instance: boundary_precision_check / location_classification_speed_and_latency_edges
          rationale: "That instance covers exactly 25/3, exactly 100/20 and latency exactly 100 against their strict comparison operators."

      - name: program_balance_reconciliation_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.program_balance_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / program_funds_identity_across_disbursement_and_clawback
          rationale: "That instance replays the full ledger through obligation, disbursement and clawback recovery and asserts the three-way balance identity holds after every mutation."

  - section: validations
    instances:
      - name: missing_user_id_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 10 is the first gate on every endpoint except the clock endpoint, so a request with
          no X-User-ID must return ERR_UNAUTHENTICATED even when the rest of the request is also
          broken (unknown program filter plus an out-of-range limit), and POST /_clock/set_current_utc
          must still succeed without the header.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: ""
            - call: "GET /broadband/programs"
              payload: { limit: 0 }
              as: ProgramAdmin
              as_user_id: ""
          assert:
            - "the first trigger call returns 200: the clock endpoint is exempt from priority 10"
            - "the second trigger call returns ERR_UNAUTHENTICATED (401), not ERR_INVALID_PAGINATION"

      - name: challenger_type_enum_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_INVALID_REQUEST
          - entities.Challenge.fields.challenger_type
        distinguishing_aspect: |
          Enum range is checked at priority 14, above the referential and business gates, so an
          unrecognised challenger_type must be refused before the location's program scope, the
          duplicate-challenge rule or the evidence standard are consulted, and no Challenge row is
          created.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z with location L1."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
