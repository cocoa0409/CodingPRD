            - { call: "POST /lease-program/maintenance-work-orders", payload: { lease_id: "${lease}", service_bay_id: "${bay}", category: "PREVENTIVE", description: "Oil and filters", scheduled_start: "2026-08-04T14:00:00Z", scheduled_end: "2026-08-04T15:00:00Z", estimated_cost_cents: 12000 }, as: MaintenanceCoordinator, captures: { wo3: "$.data.id" } }
