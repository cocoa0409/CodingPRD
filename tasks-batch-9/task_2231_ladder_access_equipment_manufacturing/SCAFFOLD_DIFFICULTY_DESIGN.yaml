- rule_id: non_linear_state_machine
  instances:
  - name: design_revision_review_cycle_increments_review_round
    grounds:
    - state_machines.DesignRevision.UNDER_REVIEW_to_CHANGES_REQUESTED
    - state_machines.DesignRevision.CHANGES_REQUESTED_to_DRAFT
    - state_machines.DesignRevision.DRAFT_to_UNDER_REVIEW
    - state_machines.DesignRevision.UNDER_REVIEW_to_APPROVED
    - entities.DesignRevision.fields.review_round
    distinguishing_aspect: 'CYCLIC shape: the revision re-enters DRAFT it already left, and the loop is bounded and observable through review_round, which increments from 1 to 2 on the revise edge while
      submitted_by_user_id is cleared and re-stamped.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA exists with revision A in CHANGES_REQUESTED and review_round 1 (the create default).
      - Revision A was submitted by eng-1 and reviewed by appr-1.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/review
        payload:
          decision: REQUEST_CHANGES
          reviewer_notes: Rail modulus too close to the floor.
        as: DesignApprover
        as_user_id: appr-1
      trigger:
      - call: POST /ladder-ops/design-revisions/${r1}/revise
        payload:
          structural_margin_pct: 7.25
          rail_section_modulus_in3: 0.31
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/review
        payload:
          decision: APPROVE
          reviewer_notes: Modulus now 0.310 in3; accepted.
        as: DesignApprover
        as_user_id: appr-1
      assert:
      - DesignRevision.${r1}.review_round == 2
      - DesignRevision.${r1}.structural_margin_pct == 7.25
      - DesignRevision.${r1}.rail_section_modulus_in3 == 0.310
      - DesignRevision.${r1}.status == APPROVED
      - DesignRevision.${r1}.submitted_by_user_id == eng-1
      - DesignRevision.${r1}.reviewed_by_user_id == appr-1
      - DesignRevision.${r1}.superseded_at == null
  - name: field_incident_fork_diverges_on_finding
    grounds:
    - state_machines.FieldIncident.UNDER_INVESTIGATION_to_NOT_SUBSTANTIATED
    - state_machines.FieldIncident.UNDER_INVESTIGATION_to_ROOT_CAUSE_IDENTIFIED
    - entities.FieldIncident.fields.requires_capa
    - entities.FieldIncident.fields.closed_at
    - calculations.design_risk_score
    distinguishing_aspect: 'BRANCHING shape: one endpoint forks on the payload finding into two states with disjoint side-effect sets — NOT_SUBSTANTIATED stamps closed_at and drops the incident out of the
      risk aggregate, while ROOT_CAUSE_IDENTIFIED leaves closed_at null, sets requires_capa true and keeps the points in the aggregate.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA exists (design never frozen).
      - FieldIncident 1 (SLIP_FALL / MINOR, incident_points 6.00) is UNDER_INVESTIGATION.
      - FieldIncident 2 (RUNG_SEPARATION / HOSPITALIZATION, incident_points 30.00) is UNDER_INVESTIGATION.
      - Product.risk_score_gross is 36.00 before the trigger.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/field-incidents
        payload:
          product_id: ${p1}
          incident_type: SLIP_FALL
          injury_severity: MINOR
          occurred_at: '2026-07-18T00:00:00Z'
          narrative: Slip on wet surface; bruised elbow.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi1: $.data.id
      - call: POST /ladder-ops/field-incidents/${fi1}/investigate
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
      - call: POST /ladder-ops/field-incidents
        payload:
          product_id: ${p1}
          incident_type: RUNG_SEPARATION
          injury_severity: HOSPITALIZATION
          occurred_at: '2026-07-25T00:00:00Z'
          narrative: Rung separated from rail; user fell and was hospitalised.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi2: $.data.id
      - call: POST /ladder-ops/field-incidents/${fi2}/investigate
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
      trigger:
      - call: POST /ladder-ops/field-incidents/${fi1}/resolve-investigation
        payload:
          finding: NOT_SUBSTANTIATED
        as: SafetyDirector
        as_user_id: safety-1
      - call: POST /ladder-ops/field-incidents/${fi2}/resolve-investigation
        payload:
          finding: ROOT_CAUSE_IDENTIFIED
          root_cause_code: RIVET_SHEAR_MARGIN
        as: SafetyDirector
        as_user_id: safety-1
      assert:
      - FieldIncident.${fi1}.status == NOT_SUBSTANTIATED
      - FieldIncident.${fi1}.closed_at == 2026-08-01T00:00:00Z
      - FieldIncident.${fi1}.requires_capa == false
      - FieldIncident.${fi1}.root_cause_code == null
      - FieldIncident.${fi1}.incident_points == 6.00
      - FieldIncident.${fi2}.status == ROOT_CAUSE_IDENTIFIED
      - FieldIncident.${fi2}.closed_at == null
      - FieldIncident.${fi2}.requires_capa == true
      - FieldIncident.${fi2}.root_cause_code == RIVET_SHEAR_MARGIN
      - Product.${p1}.risk_score_gross == 30.00
      - Product.${p1}.risk_score_mitigated == 30.00
