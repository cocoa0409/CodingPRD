            - call: "POST /h1b-petitions/${pet1}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /h1b-petitions/${pet1}/transitions"
              payload: { to_status: "APPROVED" }
