            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 2 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
