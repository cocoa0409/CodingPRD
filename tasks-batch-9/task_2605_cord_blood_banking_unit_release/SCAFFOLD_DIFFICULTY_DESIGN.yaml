          - validations[priority 31]
          - errors[ERR_HOLD_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Contended resource is the CordBloodUnit itself and the interval semantics are CLOSED intervals
          widened by a symmetric 24-hour logistics buffer on both sides, compared with strict `<`. The pair
          23:59:59 (rejected) / 24:00:00 (accepted) proves the buffered edge may be touched but not crossed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T03:00:00Z."
            - "One PUBLIC_DONATION unit CRYOPRESERVED, ELIGIBLE and LISTED in an ONLINE STANDARD tank."
