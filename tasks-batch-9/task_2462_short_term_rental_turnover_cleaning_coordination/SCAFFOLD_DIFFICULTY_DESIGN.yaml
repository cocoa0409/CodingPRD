          - errors[ERR_WINDOW_OVERRIDE_REQUIRED]
          - errors[ERR_TURNOVER_ALREADY_EXISTS]
          - calculations.turnover_window_and_requirement
        distinguishing_aspect: |
          Category pair business_temporal (priority 23) vs business_constraint (priority 29): a
          second turnover is opened on an outgoing booking that already carries a non-VOID turnover
          AND with an incoming check-in that leaves only 77 minutes against required_minutes 110 and
          no override_reason, so the response MUST be ERR_WINDOW_OVERRIDE_REQUIRED with HTTP 422,
          never ERR_TURNOVER_ALREADY_EXISTS with 409.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Property P1B 'AUS-102': ZONE_A, STUDIO, 1 bathroom, 1 bed, min_clean_minutes 60, min_skill_level 1 -> required_minutes 110."
            - "Outgoing booking OUT-2 [2026-08-06T21:00Z, 2026-08-08T16:00Z) and incoming booking IN-2 [2026-08-08T17:47Z, 2026-08-10T16:00Z) - a 77-minute window after the 30-minute inspection buffer."
            - "A first turnover T_a has already been opened on OUT-2 as a VACANT_GAP (no incoming booking) and is still PENDING_ASSIGNMENT, hence not VOID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-102", name: "Zilker Studio", zone_code: "ZONE_A", size_tier: "STUDIO", owner_contact_email: "owner2@example.com", bedroom_count: 1, bathroom_count: 1, bed_count: 1, local_utc_offset_minutes: -300, min_clean_minutes: 60, min_skill_level: 1 }
              as: PlatformAdmin
              captures: { p1b: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1b}", external_ref: "OUT-2", guest_name: "Guest Out 2", checkin_at: "2026-08-06T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out2: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1b}", external_ref: "IN-2", guest_name: "Guest In 2", checkin_at: "2026-08-08T17:47:00Z", checkout_at: "2026-08-10T16:00:00Z" }
              as: Coordinator
              captures: { b_in2: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out2}" }
              as: Coordinator
              captures: { t_a: "$.data.id", t_a_type: "$.data.turn_type", t_a_req: "$.data.required_minutes" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out2}", incoming_booking_id: "${b_in2}" }
              as: Coordinator
          assert:
            - "${t_a_type} == VACANT_GAP and ${t_a_req} == 110"
            - "HTTP status == 422"
            - "data.error_id == ERR_WINDOW_OVERRIDE_REQUIRED (priority 23 wins over priority 29)"
            - "data.error_id != ERR_TURNOVER_ALREADY_EXISTS"
            - "GET /turnovers?outgoing_booking_id=${b_out2} returns total_count == 1 (only T_a)"
            - "Turnover.${t_a}.status == PENDING_ASSIGNMENT and Turnover.${t_a}.incoming_booking_id == null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: window_minutes_exactly_equals_required_minutes_accepted
        grounds:
          - calculations.turnover_window_and_requirement
          - entities.Turnover.fields.window_minutes
          - entities.Turnover.fields.slack_minutes
          - entities.Turnover.fields.is_tight
          - validations[priority=23]
        distinguishing_aspect: |
          Metric: WHOLE MINUTES of cleaning window, endpoint POST /turnovers. window_minutes 198 ==
          required_minutes 198 is accepted with slack_minutes 0 and is_tight true, while an
          otherwise identical property whose incoming check-in is one minute earlier yields 197 and
          is refused with ERR_WINDOW_OVERRIDE_REQUIRED - the comparison is >=, not >.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Two identically configured properties: P1 'AUS-101' and P1B 'AUS-103', both ZONE_A, TWO_BR, 2 bathrooms, 3 beds, min_clean_minutes 120 -> required_minutes 198 (150 + 24 + 24)."
            - "On P1: OUT-1 checkout 2026-08-08T16:00Z and IN-1 check-in 2026-08-08T19:48Z, so window_end_at is 19:18Z and window_minutes is exactly 198."
            - "On P1B: OUT-3 checkout 2026-08-08T16:00Z and IN-3 check-in 2026-08-08T19:47Z, so window_minutes is 197."
            - "Neither creation call supplies override_reason."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-103", name: "Barton Loft B", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner3@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1b: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T19:48:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1b}", external_ref: "OUT-3", guest_name: "Guest Out 3", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out3: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1b}", external_ref: "IN-3", guest_name: "Guest In 3", checkin_at: "2026-08-08T19:47:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in3: "$.data.id" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t_ok: "$.data.id", w_ok: "$.data.window_minutes", r_ok: "$.data.required_minutes", s_ok: "$.data.slack_minutes", tight_ok: "$.data.is_tight", type_ok: "$.data.turn_type", esc_ok: "$.data.escalation_required" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out3}", incoming_booking_id: "${b_in3}" }
              as: Coordinator
          assert:
            - "first call: HTTP status == 201"
            - "${w_ok} == 198 and ${r_ok} == 198 and ${s_ok} == 0"
            - "${tight_ok} == true (slack_minutes 0 < TIGHT_SLACK_MINUTES 45)"
            - "${type_ok} == SAME_DAY and ${esc_ok} == false"
            - "Turnover.${t_ok}.window_end_at == 2026-08-08T19:18:00Z and window_start_at == 2026-08-08T16:00:00Z"
            - "second call: HTTP status == 422 and data.error_id == ERR_WINDOW_OVERRIDE_REQUIRED"
            - "GET /turnovers?property_id=${p1b} returns total_count == 0"

      - name: restock_qty_used_exactly_equals_on_hand_qty_accepted
        grounds:
          - validations[priority=35]
          - calculations.supply_on_hand_projection
          - entities.SupplyLine.fields.on_hand_qty
          - entities.SupplyLine.fields.below_par
          - endpoints["POST /checklist-tasks/{id}/submit"]
        distinguishing_aspect: |
          Metric: SUPPLY UNITS, endpoint POST /checklist-tasks/{id}/submit. qty_used 2 against an
          on_hand_qty of 1 is refused with ERR_INSUFFICIENT_ON_HAND while qty_used exactly equal to
          on_hand_qty (1) is accepted and drives the line to on_hand_qty 0 with below_par true - the
          guard is qty_used <= on_hand_qty, not <.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' with LIN-SHEET-Q (LINEN 260c par 6 on_hand 6) and WEL-WINE (WELCOME 900c par 1 on_hand 1)."
            - "Cleaner C accepted T1, outgoing guest CHECKED_OUT, clock 2026-08-08T16:00:00Z, clean IN_PROGRESS, SUPPLY_RESTOCK still PENDING."
            - "The over-quantity attempt is made FIRST, while the task is still PENDING, so the accepted at-boundary submission is a legal PENDING -> SUBMITTED transition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
