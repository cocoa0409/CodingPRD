              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d1_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d1_v0}" }
              as: Driver
              as_user_id: "${d2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 403 with data.error_id == ERR_UNAUTHORIZED (acting D2 is not the owner driver_id D1)."

  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_second_duty_append
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-append-stale-driver]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After appending one event (Driver.version advances), a second append still carrying the pre-append expected_driver_version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Driver D BOUND; client observes Driver.version then appends event 1 (which bumps the version)."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU23", vin: "CVIN23" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS23", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z33", full_name: "OCC Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 412 with data.error_id == ERR_STALE_VERSION (d_v0 is now stale after event 1 bumped Driver.version)."
      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-append-stale-driver]", entities.Driver.fields.version]
        distinguishing_aspect: "Using the freshly re-read Driver.version on the second append succeeds and advances Driver.version by 1 again."
        test_recipe:
          setup: ["Driver D BOUND; event 1 appended; client re-reads Driver.version before event 2."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU24", vin: "CVIN24" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS24", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z34", full_name: "OCC2 Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
          assert:
            - "Second append succeeds (201); Driver.${d_id}.version == ${d_v1} + 1."
      - name: occ_stale_version_on_adverse_claim_approve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[adverse-claim-approve-stale-claim]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approving an adverse claim with a stale expected_adverseconditionsclaim_version (one less than current) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A PENDING adverse claim exists; client holds claim.version then the claim is rejected-then... no — keep PENDING; deliberately send version-1."]
          setup_api_calls:
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z35", full_name: "AdvOCC Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id }
            - call: "POST /eld/adverse-claims"
              payload: { driver_id: "${d_id}", log_date: "2026-06-01", reason: "WEATHER", narrative: "Hail." }
              as: Driver
              as_user_id: "${d_id}"
              captures: { claim_id: $.data.id, claim_v0: $.data.version }
          trigger:
            - call: "POST /eld/adverse-claims/${claim_id}/approve"
              payload: { expected_adverseconditionsclaim_version: "${claim_v0} - 1" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Status 412 with data.error_id == ERR_STALE_VERSION (expected version one behind current; claim stays PENDING)."
      - name: cascade_recompute_reconciles_daily_totals_after_markerror
        claim_type: cascading_side_effects
        grounds: [calculations.hos_clocks, entities.DailyLog.fields.total_driving_minutes, state_machines.DutyStatusEvent.ACTIVE_to_INACTIVE_ERROR]
        distinguishing_aspect: "Marking the closing event INACTIVE_ERROR reconciles DailyLog.total_driving_minutes downward (the now-open driving interval no longer contributes)."
        test_recipe:
          setup: ["Driver D: DRIVING 06:30 -> OFF_DUTY 08:30 (120 driving min closed); a DailyLog for the day shows total_driving 120."]
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "CU25", vin: "CVIN25" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS25", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z36", full_name: "Reconcile Driver", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T08:30:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { close_id: $.data.id, close_v: $.data.version }
            - call: "POST /eld/daily-logs"
              payload: { driver_id: "${d_id}", log_date: "2026-06-01" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { log_id: $.data.id }
          trigger:
            - call: "POST /eld/duty-events/${close_id}/mark-error"
              payload: { expected_dutystatusevent_version: "${close_v}" }
              as: CarrierAdmin
            - call: "GET /eld/daily-logs/${log_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Before mark-error: DailyLog.${log_id}.total_driving_minutes == 120."
            - "After mark-error: DailyLog.${log_id}.total_driving_minutes == 0 (DRIVING event now open, no closed interval)."

