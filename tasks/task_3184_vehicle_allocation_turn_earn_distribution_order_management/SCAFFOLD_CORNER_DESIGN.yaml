scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed, system, type constraints
  # ===========================================================================
  - section: entities
    instances:
      - name: region_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Region]
        distinguishing_aspect: "POST /regions with required fields returns 201; status defaults to ACTIVE; id/created_at/version are system-minted and any client-supplied values are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wholesale/regions"
              payload: { code: "CR1", name: "Corner Region" }
              as: RegionalAllocator
              captures: { cr1_id: "$.data.id", cr1_status: "$.data.status", cr1_v: "$.data.version" }
          assert:
            - "cr1_status == 'ACTIVE' (default applied)"
            - "cr1_v == 1 (version starts at 1)"
            - "id is a bare UUID with no type prefix"

      - name: region_missing_required_code_returns_validation
        claim_type: violation_to_error
        grounds: [entities.Region, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /regions without the required `code` is rejected ERR_VALIDATION (400) — required-field check at priority 17."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wholesale/regions"
              payload: { name: "No Code Region" }
              as: RegionalAllocator
              captures: { e: "$.data.error_id" }
          assert:
            - "e == ERR_VALIDATION, HTTP 400"

      - name: dealer_allocation_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.DealerAllocation]
        distinguishing_aspect: "base_units/adjustment_units/final_units/consumed_units are computed; no endpoint accepts them as input and any supplied values are ignored."
        test_recipe:
          setup: ["region+dealer+line+run published"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CR2", name: "Corner Region 2" }
              as: RegionalAllocator
              captures: { cr2_id: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cr2_id}", dealer_code: "CD1", name: "Corner Dealer 1", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cd1: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CL1", name: "Corner Line 1" }
              as: RegionalAllocator
              captures: { cl1: "$.data.id" }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${cl1}", base_units: 3, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { crun1: "$.data.id" }
          trigger:
            - call: "GET /wholesale/allocation-runs/${crun1}/dealer-allocations"
              payload: { dealer_id: "${cd1}" }
              as: RegionalAllocator
              captures: { cda_adj: "$.data[0].adjustment_units", cda_con: "$.data[0].consumed_units" }
          assert:
            - "cda_adj == 0 and cda_con == 0 on a fresh run (computed defaults, not client-controllable)"

      - name: order_enum_invalid_value_returns_validation
        claim_type: type_constraints
        grounds: [entities.VehicleOrder, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "order_kind outside {RETAIL, STOCK} rejected ERR_VALIDATION before any business check."
        test_recipe:
          setup: ["published run with dealer"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CR3", name: "Corner Region 3" }
              as: RegionalAllocator
              captures: { cr3_id: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cr3_id}", dealer_code: "CD3", name: "Corner Dealer 3", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cd3: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CL3", name: "Corner Line 3" }
              as: RegionalAllocator
              captures: { cl3: "$.data.id" }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${cl3}", base_units: 3, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { crun3: "$.data.id" }
            - call: "POST /wholesale/allocation-runs/${crun3}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${crun3}/dealer-allocations"
              payload: { dealer_id: "${cd3}" }
              as: RegionalAllocator
              captures: { cda3_v: "$.data[0].version" }
          trigger:
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${cd3}", model_line_id: "${cl3}", run_id: "${crun3}", order_kind: "FLEET", expected_dealer_allocation_version: "${cda3_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${cd3}"
              captures: { e2: "$.data.error_id" }
          assert:
            - "e2 == ERR_VALIDATION, HTTP 400"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, side effects
  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_cancel_from_delivered_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.VehicleOrder]
        distinguishing_aspect: "DELIVERED is terminal for the cancel path; POST /orders/{id}/cancel on a DELIVERED order fails ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["order delivered end-to-end"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CS1", name: "Corner S1" }
              as: RegionalAllocator
              captures: { cs1: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cs1}", dealer_code: "CDS1", name: "Corner Dealer S1", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cds1: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CLS1", name: "Corner Line S1" }
              as: RegionalAllocator
              captures: { cls1: "$.data.id" }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${cls1}", base_units: 3, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { cruns1: "$.data.id" }
            - call: "POST /wholesale/allocation-runs/${cruns1}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${cruns1}/dealer-allocations"
              payload: { dealer_id: "${cds1}" }
              as: RegionalAllocator
              captures: { cdas1_v: "$.data[0].version" }
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${cds1}", model_line_id: "${cls1}", run_id: "${cruns1}", order_kind: "STOCK", expected_dealer_allocation_version: "${cdas1_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${cds1}"
              captures: { co1: "$.data.id" }
            - call: "POST /wholesale/orders/${co1}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${co1}/build"
              payload: {}
              as: ProductionScheduler
            - call: "POST /wholesale/carriers"
              payload: { code: "CCAR1", name: "Corner Carrier 1", weekly_capacity: 5 }
              as: LogisticsCoordinator
              captures: { ccar1: "$.data.id" }
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${co1}", carrier_id: "${ccar1}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { csh1: "$.data.id" }
            - call: "POST /wholesale/shipments/${csh1}/pickup"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /wholesale/shipments/${csh1}/deliver"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /wholesale/orders/${co1}/cancel"
              payload: { cancel_reason: "too late" }
              as: Dealer
              as_user_id: "${cds1}"
              captures: { e3: "$.data.error_id" }
          assert:
            - "e3 == ERR_INVALID_STATE, HTTP 409; order remains DELIVERED"

      - name: run_supersede_locks_children_and_freezes_pool
        claim_type: side_effect_execution
        grounds: [state_machines.AllocationRun.PUBLISHED_to_SUPERSEDED]
        distinguishing_aspect: "Creating a new run for the same line while one is PUBLISHED supersedes it; the old run's DealerAllocations flip to LOCKED and order entry against the old run fails ERR_PARENT_NOT_ACTIVE."
        test_recipe:
          setup: ["run A published for line; run B created for same line"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CS2", name: "Corner S2" }
              as: RegionalAllocator
              captures: { cs2: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cs2}", dealer_code: "CDS2", name: "Corner Dealer S2", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cds2: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CLS2", name: "Corner Line S2" }
              as: RegionalAllocator
              captures: { cls2: "$.data.id" }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${cls2}", base_units: 3, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { cruna: "$.data.id" }
            - call: "POST /wholesale/allocation-runs/${cruna}/publish"
              payload: {}
              as: RegionalAllocator
          trigger:
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-10", model_line_id: "${cls2}", base_units: 4, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { crunb: "$.data.id" }
          assert:
            - "old run ${cruna}.status == SUPERSEDED; its DealerAllocation children all LOCKED"
            - "order entry against ${cruna} now fails ERR_PARENT_NOT_ACTIVE (409)"

      - name: terminal_appeal_cannot_be_granted
        claim_type: terminal_lockdown
        grounds: [state_machines.Appeal]
        distinguishing_aspect: "GRANTED/DENIED/WITHDRAWN are terminal; grant on a DENIED appeal fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["appeal filed, reviewed, denied"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CS3", name: "Corner S3" }
              as: RegionalAllocator
              captures: { cs3: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cs3}", dealer_code: "CDS3", name: "Corner Dealer S3", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cds3: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CLS3", name: "Corner Line S3" }
              as: RegionalAllocator
              captures: { cls3: "$.data.id" }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${cls3}", base_units: 3, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { cruns3: "$.data.id" }
            - call: "POST /wholesale/allocation-runs/${cruns3}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "POST /wholesale/appeals"
              payload: { dealer_id: "${cds3}", run_id: "${cruns3}", appeal_type: "MARKET_GAP", requested_units: 1 }
              as: Dealer
              as_user_id: "${cds3}"
              captures: { cap1: "$.data.id" }
            - call: "POST /wholesale/appeals/${cap1}/review"
              payload: {}
              as: RegionalAllocator
            - call: "POST /wholesale/appeals/${cap1}/deny"
              payload: {}
              as: RegionalAllocator
          trigger:
            - call: "GET /wholesale/allocation-runs/${cruns3}"
              payload: {}
              as: RegionalAllocator
              captures: { cruns3_v: "$.data.version" }
            - call: "POST /wholesale/appeals/${cap1}/grant"
              payload: { granted_units: 1, expected_run_version: "${cruns3_v}" }
              as: RegionalAllocator
              captures: { e4: "$.data.error_id" }
          assert:
            - "e4 == ERR_INVALID_STATE, HTTP 409 (DENIED is terminal)"

  # ===========================================================================
  # Section: calculations — constants, input-set filtering, precision
  # ===========================================================================
  - section: calculations
    instances:
      - name: lookback_window_end_exclusive_filtering
        claim_type: input_set_filtering
        grounds: [calculations.allocation_share]
        distinguishing_aspect: "DELIVERED orders with delivered_at exactly == lookback_end are EXCLUDED (end-exclusive); delivered_at == lookback_start are INCLUDED (start-inclusive)."
        test_recipe:
          setup: ["dealer with two delivered orders: one at lookback_start, one at lookback_end"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CC1", name: "Corner C1" }
              as: RegionalAllocator
              captures: { cc1: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cc1}", dealer_code: "CDC1", name: "Corner Dealer C1", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cdc1: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CLC1", name: "Corner Line C1" }
              as: RegionalAllocator
              captures: { clc1: "$.data.id" }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-06", model_line_id: "${clc1}", base_units: 5, lookback_start: "2026-03-01T00:00:00Z", lookback_end: "2026-06-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { crunc1: "$.data.id" }
            - call: "POST /wholesale/allocation-runs/${crunc1}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${crunc1}/dealer-allocations"
              payload: { dealer_id: "${cdc1}" }
              as: RegionalAllocator
              captures: { cdac1_v: "$.data[0].version" }
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${cdc1}", model_line_id: "${clc1}", run_id: "${crunc1}", order_kind: "STOCK", expected_dealer_allocation_version: "${cdac1_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${cdc1}"
              captures: { coc1: "$.data.id" }
            - call: "POST /wholesale/orders/${coc1}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${coc1}/build"
              payload: {}
              as: ProductionScheduler
            - call: "POST /wholesale/carriers"
              payload: { code: "CCARC1", name: "Corner Carrier C1", weekly_capacity: 5 }
              as: LogisticsCoordinator
              captures: { ccarc1: "$.data.id" }
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${coc1}", carrier_id: "${ccarc1}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { cshc1: "$.data.id" }
            - call: "POST /wholesale/shipments/${cshc1}/pickup"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /wholesale/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalAllocator
            - call: "POST /wholesale/shipments/${cshc1}/deliver"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-10", model_line_id: "${clc1}", base_units: 5, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { crunc2: "$.data.id" }
            - call: "POST /wholesale/allocation-runs/${crunc2}/publish"
              payload: {}
              as: RegionalAllocator
          assert:
            - "order delivered exactly at 2026-09-01T00:00:00Z (lookback_end) is EXCLUDED: reported_sales_units for the new run's lookback == 0"

      - name: incentive_marginal_tier_straddle
        claim_type: correct_result
        grounds: [calculations.incentive_accrual]
        distinguishing_aspect: "VOLUME_BONUS tiers are MARGINAL: S=6 with tiers 3/5 and bonuses 500/900 yields (5-3)*500 + (6-5)*900 = 1900, not 6*900."
        test_recipe:
          setup: ["dealer with 6 delivered orders inside the program window"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CC2", name: "Corner C2" }
              as: RegionalAllocator
              captures: { cc2: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cc2}", dealer_code: "CDC2", name: "Corner Dealer C2", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cdc2: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CLC2", name: "Corner Line C2" }
              as: RegionalAllocator
              captures: { clc2: "$.data.id" }
            - call: "POST /wholesale/incentive-programs"
              payload: { code: "VB2", model_line_id: "${clc2}", kind: "VOLUME_BONUS", params: { tier1_threshold: 3, tier1_bonus_cents: 500, tier2_threshold: 5, tier2_bonus_cents: 900 }, window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cprog2: "$.data.id" }
          trigger:
            - call: "GET /wholesale/incentive-programs/${cprog2}/accruals"
              payload: { dealer_id: "${cdc2}" }
              as: RegionalAllocator
          assert:
            - "with S == 6 deliveries in window, amount_cents == 1900 (marginal straddle), NOT 5400 (average-rate mis-implementation)"

  # ===========================================================================
  # Section: validations — violation->error not already exercised in §1.8
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header yields ERR_UNAUTHENTICATED (401) before any role/existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wholesale/regions"
              payload: {}
              as: Anonymous
              captures: { e5: "$.data.error_id" }
          assert:
            - "e5 == ERR_UNAUTHENTICATED, HTTP 401"

      - name: not_found_on_unknown_order_id
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{random-uuid} yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wholesale/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RegionalAllocator
              captures: { e6: "$.data.error_id" }
          assert:
            - "e6 == ERR_NOT_FOUND, HTTP 404"

      - name: retail_order_without_customer_ref_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_CONFIGURATION]"]
        distinguishing_aspect: "RETAIL order without customer_ref fails ERR_INVALID_CONFIGURATION; STOCK order WITH customer_ref also fails the same check."
        test_recipe:
          setup: ["published run"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CV1", name: "Corner V1" }
              as: RegionalAllocator
              captures: { cv1: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cv1}", dealer_code: "CDV1", name: "Corner Dealer V1", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cdv1: "$.data.id" }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "CLV1", name: "Corner Line V1" }
              as: RegionalAllocator
              captures: { clv1: "$.data.id" }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${clv1}", base_units: 3, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 50 }
              as: RegionalAllocator
              captures: { crunv1: "$.data.id" }
            - call: "POST /wholesale/allocation-runs/${crunv1}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${crunv1}/dealer-allocations"
              payload: { dealer_id: "${cdv1}" }
              as: RegionalAllocator
              captures: { cdav1_v: "$.data[0].version" }
          trigger:
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${cdv1}", model_line_id: "${clv1}", run_id: "${crunv1}", order_kind: "RETAIL", expected_dealer_allocation_version: "${cdav1_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${cdv1}"
              captures: { e7: "$.data.error_id" }
          assert:
            - "e7 == ERR_INVALID_CONFIGURATION, HTTP 422 (RETAIL requires customer_ref)"

      - name: cross_region_trade_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_TRADE_INVALID]"]
        distinguishing_aspect: "Trade between dealers in different regions fails ERR_TRADE_INVALID at create."
        test_recipe:
          setup: ["dealers in R-A and R-B"]
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "CVA", name: "Corner VA" }
              as: RegionalAllocator
              captures: { cva: "$.data.id" }
            - call: "POST /wholesale/regions"
              payload: { code: "CVB", name: "Corner VB" }
              as: RegionalAllocator
              captures: { cvb: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cva}", dealer_code: "CDVA", name: "Corner Dealer VA", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { cdva: "$.data.id" }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${cvb}", dealer_code: "CDVB", name: "Corner Dealer VB", opened_on: "2020-01-01T00:00:00Z" }
