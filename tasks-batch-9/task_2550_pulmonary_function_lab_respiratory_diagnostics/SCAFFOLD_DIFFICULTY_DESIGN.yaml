      - name: interpreter_open_report_total_conserved_across_reassignment_and_amendment
        grounds:
          - calculations.interpreter_assignment_selection
          - state_machines.InterpretationReport.ASSIGNED_to_REASSIGNED
          - state_machines.InterpretationReport.SIGNED_to_AMENDED
          - entities.Staff.fields.open_report_count
          - concurrency_rules[report-assign-stale-session]
          - calculations.interpretation_sla_and_turnaround
        distinguishing_aspect: |
          The conserved quantity is the lab-wide open-report total: a superseding assignment moves the load
          from R-001 to R-002 (0/1 instead of 1/0) while the total stays exactly 1 and equals
          count(InterpretationReport where status in {ASSIGNED, AMENDED}), and an amendment re-opens the
          same seat (0 -> 1) before the re-signature closes it again - a counter-conservation compensation
          across two staff rows, not a consumable ledger on one lot.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T10:00:00Z"
            - "R-001 and R-002 are both ON_DUTY interpreting physicians credentialed for SPIROMETRY with max_concurrent_reports 1, R-001 created first"
            - "session SESS-1 is ACCEPTED with quality_grade A on a ROUTINE_CLINICAL order"
            - "report REP-1 has already been assigned and the selector picked R-001 because both interpreters were at open_report_count 0 and R-001 has the earlier created_at"
            - "the session version observed after that first assignment is re-read with GET /pft-lab/test-sessions/{session_id} so the second assignment can pass a current expected_session_version"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-090", full_name: "Cal Mensah", role_type: "TECHNOLOGIST", credential: "CPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], is_biologic_control: true, baseline_fev1_l: 4.000, baseline_fvc_l: 5.200, baseline_established_on: "2026-05-01" }
              as: LabManager
              captures: { bcs_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "D-001", full_name: "Dana Okafor", role_type: "ORDERING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"] }
              as: LabManager
              captures: { doc1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "R-001", full_name: "Rhea Lund", role_type: "INTERPRETING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], max_concurrent_reports: 1 }
              as: LabManager
              captures: { rad1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "R-002", full_name: "Ravi Menon", role_type: "INTERPRETING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], max_concurrent_reports: 1 }
              as: LabManager
              captures: { rad2_id: $.data.id }
            - call: "POST /pft-lab/reference-equations"
              payload: { equation_code: "GLI-M-2005", modality_scope: ["SPIROMETRY"], sex_scope: "MALE", applicable_age_min: 40, applicable_age_max: 60, lln_percentile: 5.0, ratio_lln: 0.700, a_fev1: 2.300, b_fev1: 0.020, c_fev1: 0.400, a_fvc: 1.350, b_fvc: 0.030, c_fvc: 0.400, rsd_frac: 0.130, bd_criterion: "PCT_BASELINE_2005" }
              as: LabManager
              captures: { eq2005_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "FILTER_REPLACEMENT", filter_serial: "F-1001" }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "HIGH_LEVEL_DISINFECT", dwell_minutes: 25 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
            - call: "POST /pft-lab/test-orders"
              payload: { patient_id: "${pat1_id}", indication_code: "DYSPNEA_EVALUATION", requested_modalities: ["SPIROMETRY"], test_context: "ROUTINE_CLINICAL", bronchodilator_requested: false, current_medication_classes: [] }
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
              captures: { ord1_id: $.data.id }
            - call: "POST /pft-lab/test-orders/${ord1_id}/submit"
              payload: {}
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
            - call: "POST /pft-lab/test-sessions"
              payload: { order_id: "${ord1_id}", device_id: "${dev1_id}", scheduled_start_at: "2026-08-03T11:00:00Z", scheduled_end_at: "2026-08-03T11:30:00Z" }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { sess1_id: $.data.id }
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.200, fev1_l: 2.400, pef_l_s: 6.00, back_extrapolated_volume_ml: 100, expiratory_time_s: 15.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.150, fev1_l: 2.250, pef_l_s: 5.80, back_extrapolated_volume_ml: 120, expiratory_time_s: 16.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.100, fev1_l: 2.200, pef_l_s: 5.60, back_extrapolated_volume_ml: 110, expiratory_time_s: 15.5, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess1_id}/finalize-quality"
              payload: { technologist_comment: "Three acceptable efforts, good coaching response." }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { sess1_v: $.data.version }
            - call: "POST /pft-lab/test-sessions/${sess1_id}/interpretation-reports"
              payload: { expected_session_version: "${sess1_v}" }
              as: LabManager
              captures: { rep1_id: $.data.id }
            - call: "GET /pft-lab/test-sessions/${sess1_id}"
              payload: {}
              as: LabManager
              captures: { sess1_v2: $.data.version }
          trigger:
            - call: "POST /pft-lab/test-sessions/${sess1_id}/interpretation-reports"
              payload: { expected_session_version: "${sess1_v2}" }
              as: LabManager
              captures: { rep2_id: $.data.id }
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/interpretation-reports/${rep2_id}/sign"
              payload: { clinical_comment: "Restrictive pattern, moderate severity." }
              as: InterpretingPhysician
              as_user_id: "${rad2_id}"
            - call: "POST /pft-lab/interpretation-reports/${rep2_id}/amend"
              payload: { amendment_reason: "Corrected the clinical comment on the DLCO context." }
              as: InterpretingPhysician
              as_user_id: "${rad2_id}"
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T10:30:00Z" }
              as: LabManager
            - call: "POST /pft-lab/interpretation-reports/${rep2_id}/sign"
              payload: { clinical_comment: "Amended comment signed off." }
              as: InterpretingPhysician
              as_user_id: "${rad2_id}"
          assert:
            - "InterpretationReport.${rep1_id}.interpreter_staff_id == ${rad1_id} and InterpretationReport.${rep2_id}.interpreter_staff_id == ${rad2_id}, because R-001 sat at its max_concurrent_reports of 1"
            - "after the second assignment InterpretationReport.${rep1_id}.status == REASSIGNED with superseded_by_report_id == ${rep2_id}"
            - "after the second assignment Staff.${rad1_id}.open_report_count == 0 and Staff.${rad2_id}.open_report_count == 1, and their sum is still 1"
            - "InterpretationReport.${rep2_id}.assigned_at == 2026-08-03T10:00:00Z with queue_load_pct == 50.00, load_tier == NORMAL, sla_minutes == 1440 and due_at == 2026-08-04T10:00:00Z"
            - "after the first signature InterpretationReport.${rep2_id}.status == SIGNED with turnaround_minutes == 1440 and sla_breached == false, because signed_at equals due_at exactly"
            - "after the first signature Staff.${rad2_id}.open_report_count == 0 and the sum over both interpreters is 0"
            - "after the first signature TestSession.${sess1_id}.session_status == REPORTED, TestOrder.${ord1_id}.status == COMPLETED and Patient.${pat1_id}.completed_order_count == 1"
            - "after the amendment InterpretationReport.${rep2_id}.status == AMENDED with amendment_count == 1, and Staff.${rad2_id}.open_report_count == 1 again"
            - "after the amendment TestSession.${sess1_id}.session_status == REPORTED, unchanged"
            - "after the re-signature InterpretationReport.${rep2_id}.turnaround_minutes == 1470 and sla_breached == true, both measured against the original assigned_at 2026-08-03T10:00:00Z and due_at 2026-08-04T10:00:00Z"
            - "after the re-signature Staff.${rad2_id}.open_report_count == 0 and Staff.${rad1_id}.open_report_count == 0"
            - "TestSession.${sess1_id}.turnaround_minutes == 1470 after the re-signature"

