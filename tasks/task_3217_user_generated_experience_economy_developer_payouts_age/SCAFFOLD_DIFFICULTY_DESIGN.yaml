              as: Creator
              as_user_id: "${par_g_id}"
            - call: "POST /ugc/users"
              payload: { username: "seller_g", email: "s_g@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { seller_g_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Big Hat", item_kind: "HAT", price_robux: 200 }
