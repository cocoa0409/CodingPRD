  # Stubs: corners already exercised by §1.8 difficulty instances.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: enroll_into_closed_series_returns_series_not_open_stub
        claim_type: Invalid Transitions
        grounds: [state_machines.Enrollment.PENDING_PREREQS_to_ACTIVE]
        excluded_because:
          difficulty_instance: enrollment_requires_series_open_pair_enrollment_series
          rationale: "The §1.8 cross_entity_state_dependency instance already asserts ERR_SERIES_NOT_OPEN when enrolling into a CLOSED series."
      - name: enrollment_active_to_suspended_on_vaccination_loss_stub
        claim_type: Cross-entity
        grounds: [state_machines.Enrollment.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: vaccination_void_depth2_enrollment_suspend
          rationale: "The §1.8 transitive_cascade depth-2 instance already drives ACTIVE->SUSPENDED via vaccination void."

  - section: calculations
    instances:
      - name: vaccination_expiry_boundary_stub
        claim_type: Constants Applied
        grounds: [calculations.vaccination_posture]
        excluded_because:
          difficulty_instance: vaccination_expiry_half_open_boundary_on_reinstate
