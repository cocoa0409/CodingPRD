        distinguishing_aspect: "A cross-entity cascade in one request: the permit becomes REVOKED (terminal), the system flips PERMITTED -> UNPERMITTED with unpermitted_since stamped, an UNPERMITTED_OPERATION_PENALTY invoice of 20000 + 1000 admin = 21000 is raised, and AlarmSite.unpermitted_system_count becomes 1 with the site version bumped."
