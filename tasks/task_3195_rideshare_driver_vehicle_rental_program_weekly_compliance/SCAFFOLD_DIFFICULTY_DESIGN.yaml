  - rule_id: boundary_precision_check
    instances:
      - name: activity_band_boundary_at_fifty_and_seventy_five
        grounds:
          - calculations.platform_activity_credit
          - constants.PLATFORM_CREDIT_PER_ACTIVITY_POINT_CENTS
