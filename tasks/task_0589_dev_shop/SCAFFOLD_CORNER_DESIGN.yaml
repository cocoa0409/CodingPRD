      - name: blocker_graph_cycle_is_rejected_on_block
        claim_type: violation_to_error
        grounds: ["validations[priority=56]", "errors[ERR_TICKET_CYCLE]", "endpoints.POST /tickets/{id}/block"]
        distinguishing_aspect: "Self-referential FK cycle detection: with B already blocked by A, POST /tickets/A/block {blocking_ticket_id: B} would close the loop A -> B -> A and returns 422 ERR_TICKET_CYCLE; a direct self-block (A -> A) is rejected the same way; A's blocking_ticket_id stays null."
