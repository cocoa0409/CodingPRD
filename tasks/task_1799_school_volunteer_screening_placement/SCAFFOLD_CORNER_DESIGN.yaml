            - { call: "POST /volunteers", payload: { full_name: "Worker Wendy", email: "wendy@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v2_id: $.data.id, v2_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v2_id}", level: "BASIC", expected_volunteer_version: "${v2_ver}" }, as: DistrictCoordinator, captures: { chk2_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v2_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk2_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 2.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v2_id}", captures: { he_id: $.data.id } }
            - { call: "POST /incident-reports", payload: { volunteer_id: "${v2_id}", severity: "LOW", description: "Minor issue" }, as: CampusAdmin, captures: { inc_id: $.data.id } }
          trigger:
            - { call: "POST /campuses", payload: { name: "Rogue Campus", campus_code: "RGE", badge_prefix: "RGE" }, as: Volunteer, as_user_id: "${v2_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: CampusAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /incident-reports/${inc_id}/adjudicate", payload: { outcome: "UNFOUNDED" }, as: CampusAdmin, captures: { err3: $.data.error_id } }
