              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_id}", floorplan_id: "${f_id}", applicant_name: "CM App", applicant_email: "cm@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: PropertyManager
