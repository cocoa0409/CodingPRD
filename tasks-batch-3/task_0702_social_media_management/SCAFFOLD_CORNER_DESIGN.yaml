# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0702_social_media_management
# Breadth probe across claim-extraction-guide sections. Names unique across §1.8+§1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_create_client_returns_201_with_onboarding_defaults
        claim_type: Creation
        grounds: [entities.Client.fields.status, entities.Client.fields.current_cycle_index, entities.Client.fields.boost_available_cents]
        distinguishing_aspect: "POST /clients with name+account_manager_id returns 201; status==ONBOARDING, current_cycle_index==0, all budget fields 0, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Fresh", account_manager_id: "am-9" }
              as: AccountManager
              captures: { cid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "Client.status == ONBOARDING"
            - "Client.current_cycle_index == 0"
            - "Client.boost_available_cents == 0"
            - "Client.version == 1"

      - name: corner_get_client_not_found_returns_404
        claim_type: Not Found
        grounds: ['errors[ERR_CLIENT_NOT_FOUND]']
        distinguishing_aspect: "GET /clients/{random-uuid} for a non-existent id returns 404 ERR_CLIENT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_CLIENT_NOT_FOUND"

      - name: corner_create_channel_missing_required_handle_returns_400
        claim_type: Required Fields
        grounds: [entities.Channel.fields.handle, 'validations[priority=18]']
        distinguishing_aspect: "POST /channels omitting required field handle returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ChReq", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "X" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: corner_channel_default_min_publish_gap_applied
        claim_type: Defaults
        grounds: [entities.Channel.fields.min_publish_gap_minutes]
        distinguishing_aspect: "Omitting min_publish_gap_minutes on POST /channels applies default 30."
        test_recipe:
          setup: ["a client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ChDef", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@chdef" }
              as: AccountManager
              captures: { gap: $.data.min_publish_gap_minutes }
          assert:
            - "Channel.min_publish_gap_minutes == 30"

      - name: corner_create_content_target_cross_client_returns_409
        claim_type: Foreign Key
        grounds: ['validations[priority=5]', 'errors[ERR_CROSS_CLIENT_REFERENCE]', entities.ContentTarget.fields.channel_id]
        distinguishing_aspect: "POST /content-targets where the channel belongs to a different client than the content item returns 409 ERR_CROSS_CLIENT_REFERENCE."
        test_recipe:
          setup: ["two clients A and B; a ContentItem under A; a Channel under B"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "A", account_manager_id: "am-1" }
              as: AccountManager
              captures: { ca: $.data.id }
            - call: "POST /clients"
              payload: { name: "B", account_manager_id: "am-2" }
              as: AccountManager
              captures: { cb: $.data.id }
            - call: "POST /content-items"
              payload: { client_id: "${ca}", author_id: "cc-1", title: "X", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
            - call: "POST /channels"
              payload: { client_id: "${cb}", platform: "X", handle: "@b" }
              as: AccountManager
              captures: { chb: $.data.id }
          trigger:
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci}", channel_id: "${chb}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_CROSS_CLIENT_REFERENCE"

      - name: corner_system_fields_ignored_on_create_client
        claim_type: System Fields
        grounds: [entities.Client.fields.id, entities.Client.fields.status]
        distinguishing_aspect: "POST /clients does not accept id/status as input; server mints id and forces status=ONBOARDING regardless."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Sys", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id, st: $.data.status }
          assert:
            - "Client.id is a server-minted UUID with no type prefix"
            - "Client.status == ONBOARDING"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_approve_content_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ContentItem.IN_REVIEW_to_APPROVED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Approving a ContentItem still in DRAFT (approve only defined from IN_REVIEW) returns 409 ERR_INVALID_STATE; status stays DRAFT."
        test_recipe:
          setup: ["a DRAFT ContentItem under an ONBOARDING client"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "InvCo2", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "D", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
          trigger:
            - call: "POST /content-items/${ci}/approve"
              payload: {}
              as: Approver
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: corner_transition_from_terminal_churned_client_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Client.ONBOARDING_to_CHURNED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Suspending an already-CHURNED client (terminal) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["a CHURNED client"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Term", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/churn"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /clients/${cid}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: corner_idempotent_publish_second_attempt_rejected
        claim_type: Idempotency
        grounds: [state_machines.ContentItem.SCHEDULED_to_PUBLISHED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Publishing an already-PUBLISHED ContentItem a second time returns 409 ERR_INVALID_STATE (publish only defined from SCHEDULED)."
        test_recipe:
          setup: ["a PUBLISHED ContentItem under an ACTIVE client"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Idem", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 300000, monthly_boost_budget_cents: 0, monthly_post_quota: 10, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@idem" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /content-items"
              payload: { client_id: "${cid}", author_id: "cc-1", title: "IB", body: "b" }
              as: ContentCreator
              captures: { ci: $.data.id }
            - call: "POST /content-targets"
              payload: { content_item_id: "${ci}", channel_id: "${ch}" }
              as: ContentCreator
            - call: "POST /content-items/${ci}/submit"
              payload: {}
              as: ContentCreator
            - call: "POST /content-items/${ci}/approve"
              payload: {}
              as: Approver
            - call: "POST /content-items/${ci}/schedule"
              payload: { channel_id: "${ch}", slot_start_utc: "2026-03-01T09:00:00Z", duration_minutes: 15 }
              as: AccountManager
            - call: "POST /content-items/${ci}/publish"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /content-items/${ci}/publish"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: corner_conversation_assign_requires_channel_live
        claim_type: guarded transitions
        grounds: [state_machines.Conversation.OPEN_to_ASSIGNED, 'errors[ERR_CHANNEL_NOT_LIVE]']
        distinguishing_aspect: "Assigning a Conversation whose channel is not LIVE returns 409 ERR_CHANNEL_NOT_LIVE."
        test_recipe:
          setup: ["an OPEN Conversation on a CONNECTED (not LIVE) channel"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ConvCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "FACEBOOK", handle: "@convco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /conversations"
              payload: { channel_id: "${ch}", kind: "DM", external_author_handle: "@fan" }
              as: CommunityAgent
              captures: { cv: $.data.id }
          trigger:
            - call: "POST /conversations/${cv}/assign"
              payload: {}
              as: CommunityAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_CHANNEL_NOT_LIVE"

      - name: corner_message_append_bumps_conversation_count
        claim_type: Side Effect Execution
        grounds: [entities.Conversation.fields.message_count, entities.EngagementMessage.fields.conversation_id]
        distinguishing_aspect: "POST /messages under a conversation recomputes Conversation.message_count to 1."
        test_recipe:
          setup: ["an OPEN Conversation on a LIVE channel"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "MsgCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "STARTER", monthly_retainer_fee_cents: 200000, monthly_boost_budget_cents: 0, monthly_post_quota: 5, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "X", handle: "@msgco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /conversations"
              payload: { channel_id: "${ch}", kind: "COMMENT", external_author_handle: "@fan" }
              as: CommunityAgent
              captures: { cv: $.data.id }
          trigger:
            - call: "POST /messages"
              payload: { conversation_id: "${cv}", direction: "INBOUND", body: "hi" }
              as: CommunityAgent
            - call: "GET /conversations/${cv}"
              payload: {}
              as: CommunityAgent
              captures: { mc: $.data.message_count }
          assert:
            - "Conversation.${cv}.message_count == 1"

      - name: corner_ugc_reject_cascade_on_collab_cancel
        claim_type: Cross-entity
        grounds: [state_machines.InfluencerCollab.PROPOSED_to_CANCELLED, state_machines.UGCAsset.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "Cancelling a collab transitions all its SUBMITTED UGCAssets to REJECTED."
        test_recipe:
          setup: ["a PROPOSED collab with one SUBMITTED UGC asset"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "UgcCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /influencer-collabs"
              payload: { client_id: "${cid}", influencer_handle: "@u", offer_fee_cents: 50000, deliverable_count: 1 }
              as: AccountManager
              captures: { col: $.data.id }
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/1" }
              as: AccountManager
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /influencer-collabs/${col}/cancel"
              payload: {}
              as: AccountManager
            - call: "GET /ugc-assets/${a1}"
              payload: {}
              as: AccountManager
              captures: { st: $.data.status }
          assert:
            - "UGCAsset.${a1}.status == REJECTED"

      - name: corner_revision_loop_already_covered
        claim_type: cyclic
        grounds: [state_machines.ContentItem.CHANGES_REQUESTED_to_IN_REVIEW]
        excluded_because:
          difficulty_instance: non_linear_state_machine / content_item_revision_cycle_loop
          rationale: "The IN_REVIEW<->CHANGES_REQUESTED loop and revision_round increment are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_engagement_rate_correct_result
        claim_type: Correct Result
        grounds: [calculations.engagement_rate, entities.AnalyticsSnapshot.fields.engagement_rate_bps]
        distinguishing_aspect: "Snapshot with total_engagements=350, total_impressions=20000 yields engagement_rate_bps == 175 (round_half_up(350*10000/20000))."
        test_recipe:
          setup: ["an ACTIVE client"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ErCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 300000, monthly_boost_budget_cents: 0, monthly_post_quota: 10, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@erco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /clients/${cid}/analytics-snapshots"
              payload: { total_impressions: 20000, total_engagements: 350 }
              as: AccountManager
              captures: { bps: $.data.engagement_rate_bps }
          assert:
            - "AnalyticsSnapshot.engagement_rate_bps == 175"

      - name: corner_engagement_rate_zero_impressions_edge
        claim_type: Precision
        grounds: [calculations.engagement_rate]
        distinguishing_aspect: "Snapshot with total_impressions=0 yields engagement_rate_bps == 0 (defined, not div-by-zero)."
        test_recipe:
          setup: ["an ACTIVE client"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ZeroCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "GROWTH", monthly_retainer_fee_cents: 300000, monthly_boost_budget_cents: 0, monthly_post_quota: 10, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@zeroco" }
              as: AccountManager
              captures: { ch: $.data.id }
            - call: "POST /channels/${ch}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /clients/${cid}/analytics-snapshots"
              payload: { total_impressions: 0, total_engagements: 100 }
              as: AccountManager
              captures: { bps: $.data.engagement_rate_bps }
          assert:
            - "AnalyticsSnapshot.engagement_rate_bps == 0"

      - name: corner_settlement_no_bonus_under_tier2_floor
        claim_type: Constants Applied
        grounds: [calculations.collab_settlement_amount]
        distinguishing_aspect: "With approved_asset_count=2 (== TIER2_FLOOR, no bonus units), settlement_amount_cents == offer_fee_cents == 100000."
        test_recipe:
          setup: ["an ACCEPTED collab offer_fee_cents=100000, deliverable_count=4, 2 RIGHTS_CLEARED assets"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "NoBonus", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /influencer-collabs"
              payload: { client_id: "${cid}", influencer_handle: "@nb", offer_fee_cents: 100000, deliverable_count: 4 }
              as: AccountManager
              captures: { col: $.data.id }
            - call: "POST /influencer-collabs/${col}/accept"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/1" }
              as: AccountManager
              captures: { a1: $.data.id }
            - call: "POST /ugc-assets/${a1}/clear-rights"
              payload: {}
              as: AccountManager
            - call: "POST /ugc-assets"
              payload: { collab_id: "${col}", asset_url: "http://u/2" }
              as: AccountManager
              captures: { a2: $.data.id }
            - call: "POST /ugc-assets/${a2}/clear-rights"
              payload: {}
              as: AccountManager
          trigger:
            - call: "GET /influencer-collabs/${col}/settlement-quote"
              payload: {}
              as: AccountManager
              captures: { amt: $.data.settlement_amount_cents }
          assert:
            - "settlement-quote.settlement_amount_cents == 100000"

      - name: corner_dual_variant_retainer_excluded
        claim_type: Variant Divergence
        grounds: [calculations.retainer_proration_on_churn]
        excluded_because:
          difficulty_instance: dual_variant_calc / retainer_churn_quote_forward_vs_chronological
          rationale: "Variant divergence of the retainer proration is the core assertion of the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: corner_duplicate_channel_handle_returns_409
        claim_type: Violation -> Error
        grounds: ['validations[priority=8]', 'errors[ERR_DUPLICATE_HANDLE]']
        distinguishing_aspect: "Creating a second channel with the same (client_id, platform, handle) returns 409 ERR_DUPLICATE_HANDLE."
        test_recipe:
          setup: ["a client with a channel @dup on INSTAGRAM"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "DupCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@dup" }
              as: AccountManager
              captures: { ch: $.data.id }
          trigger:
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@dup" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE_HANDLE"

      - name: corner_channel_limit_exceeded_on_go_live
        claim_type: Aggregate validation
        grounds: ['validations[priority=10]', 'errors[ERR_CHANNEL_LIMIT_EXCEEDED]', entities.RetainerPackage.fields.included_channels]
        distinguishing_aspect: "With included_channels=1 and one channel already LIVE, taking a second channel LIVE returns 409 ERR_CHANNEL_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["client with ACTIVE package included_channels=1, one LIVE channel, and a second CONNECTED channel"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "LimCo", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /retainer-packages"
              payload: { client_id: "${cid}", tier: "STARTER", monthly_retainer_fee_cents: 200000, monthly_boost_budget_cents: 0, monthly_post_quota: 5, included_channels: 1 }
              as: AccountManager
              captures: { pkg: $.data.id }
            - call: "POST /retainer-packages/${pkg}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "INSTAGRAM", handle: "@lim1" }
              as: AccountManager
              captures: { ch1: $.data.id }
            - call: "POST /channels/${ch1}/connect"
              payload: {}
              as: AccountManager
            - call: "POST /channels/${ch1}/go-live"
              payload: {}
              as: AccountManager
            - call: "POST /channels"
              payload: { client_id: "${cid}", platform: "FACEBOOK", handle: "@lim2" }
              as: AccountManager
              captures: { ch2: $.data.id }
            - call: "POST /channels/${ch2}/connect"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /channels/${ch2}/go-live"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_CHANNEL_LIMIT_EXCEEDED"

      - name: corner_activate_client_without_package_rejected
        claim_type: Cross-entity validation
        grounds: [state_machines.Client.ONBOARDING_to_ACTIVE, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Activating an ONBOARDING client with no ACTIVE package and no LIVE channel fails precondition with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["a bare ONBOARDING client (no package, no channels)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Bare", account_manager_id: "am-1" }
              as: AccountManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /clients/${cid}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: corner_quota_exceeded_excluded
        claim_type: Priority Ordering
        grounds: ['validations[priority=13]']
        excluded_because:
