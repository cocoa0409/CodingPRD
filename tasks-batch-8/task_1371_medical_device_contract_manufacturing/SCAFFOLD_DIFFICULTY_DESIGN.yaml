      - name: audit_notice_window_exactly_30_days
        grounds:
          - validations[priority=10]
          - errors[ERR_AUDIT_NOTICE_WINDOW_BREACHED]
          - entities.QualityAgreement.fields.audit_notice_days
        distinguishing_aspect: |
          Metric audit notice days, endpoint audit create: scheduled_start exactly 30 days after now
          satisfies >= audit_notice_days and is accepted, while 29 days is rejected
          ERR_AUDIT_NOTICE_WINDOW_BREACHED. Distinct metric and endpoint from the score/rate boundaries.
        test_recipe:
          setup:
            - "supplier SUP-A30 QUALIFIED with ACTIVE agreement (audit_notice_days = 30); clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-A30", name: "Notice Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-A30", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
          trigger:
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-08-31T00:00:00Z", scheduled_end: "2026-09-01T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { aud_ok: "$.data.id" } }
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-08-30T00:00:00Z", scheduled_end: "2026-08-31T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err_short: "$.data.error_id" } }
          assert:
            - "start exactly 30 days out (2026-08-31 vs 2026-08-01): audit created (201), status SCHEDULED"
            - "start 29 days out (2026-08-30): rejected 409 error_id == ERR_AUDIT_NOTICE_WINDOW_BREACHED"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: supplier_qualify_requires_active_agreement
        grounds:
          - state_machines.Supplier.PENDING_QUALIFICATION_to_QUALIFIED
          - state_machines.QualityAgreement.DRAFT_to_ACTIVE
          - errors[ERR_NO_ACTIVE_QUALITY_AGREEMENT]
        distinguishing_aspect: |
          Entity pair Supplier -> QualityAgreement: qualify is rejected while the supplier's only
          agreement is DRAFT, and succeeds once that agreement flips to ACTIVE — the supplier's valid
          transitions depend on a different entity's state.
        test_recipe:
          setup:
            - "supplier SUP-X1 PENDING_QUALIFICATION with agreement QA-X1 in DRAFT (effective window covers clock default)"
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-X1", name: "Xone" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-X1", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err_blocked: "$.data.error_id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { status_after: "$.data.status" } }
          assert:
            - "qualify with DRAFT agreement: 409 error_id == ERR_NO_ACTIVE_QUALITY_AGREEMENT; supplier stays PENDING_QUALIFICATION"
            - "after agreement activation: qualify succeeds, status == QUALIFIED"

      - name: lot_release_requires_validated_protocol
        grounds:
          - state_machines.DeviceLot.release
          - state_machines.ValidationProtocol
          - errors[ERR_PROTOCOL_NOT_VALIDATED]
        distinguishing_aspect: |
          Entity pair DeviceLot -> ValidationProtocol: a fully prepared lot (COMPLETED, sterility PASSED,
          label PRINTED, hold CLEAR) cannot be released while its protocol is still DRAFT; once the
          protocol reaches VALIDATED the same release succeeds.
        test_recipe:
          setup:
            - "DMR DEV-X2 rev A APPROVED; protocol VP-X2 in DRAFT (not executed); supplier SUP-X2 QUALIFIED; part PN-X2 received"
            - "lot LT-X2 COMPLETED with component, sterility PASSED, label PRINTED"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-X2", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-X2", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-X2", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-X2", name: "Xtwo" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-X2", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-X2", description: "cap", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/supplier-parts/${part_id}/receive", payload: { quantity: 100 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-X2", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot_id: "$.data.id" } }
