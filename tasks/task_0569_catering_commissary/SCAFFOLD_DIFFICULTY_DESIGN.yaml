          - calculations.equipment_availability
          - entities.EquipmentItem.fields.total_units
        distinguishing_aspect: "Conserved quantity = equipment unit-count over time. Reserving qty 6 then cancelling that reservation leaves free_units over the window back at the full 10 (total_units); no drift."
        test_recipe:
          setup:
            - "EquipmentItem CHAFER total_units 10; order CONFIRMED; reservation qty 6 [10:00,16:00) created then cancelled."
          setup_api_calls:
            - call: "POST /menu-items"
