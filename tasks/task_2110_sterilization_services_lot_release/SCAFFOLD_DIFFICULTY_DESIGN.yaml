              as: RegulatoryAdmin
              captures: { re_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${re_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${re_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { qe_id: $.data.id }
            - call: "POST /sterilization/qualifications/${qe_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-001", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${che1_id}", recipe_id: "${re_id}", cycle_code: "C-A", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z", raw_eto_charge_kg: 1200.0 }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc_id: $.data.id, cyc_v0: $.data.version }
            - call: "POST /sterilization/cycles/${cyc_id}/load-positions"
              payload: { lot_id: "${lot1_id}", position_index: 1, zone: "MIN_DOSE", pallet_count: 2, expected_cycle_version: "${cyc_v0}" }
              as: CycleOperator
              as_user_id: "op-1"
