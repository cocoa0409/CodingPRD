  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: edition_post_state_beats_print_budget
        grounds:
          - validations[priority=5]
          - validations[priority=27]
          - entities.PrintMarket.fields.status
          - entities.RegionHub.fields.max_print_tonnage_budget_cents
        distinguishing_aspect: "The conflicting pair is state (priority 5, ERR_INVALID_STATE) against business_fiscal (priority 27, ERR_PRINT_BUDGET_EXCEEDED): a request that both targets a withdrawn market and would breach the hub print budget must return the state error, proving the state check runs before the fiscal check."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub with a 500 cent print tonnage budget, site KOT, region North, market Riverton and route KOT->Riverton; Riverton has already been withdrawn, and the hub budget is already exhausted by a live edition."
          setup_api_calls:
            - *t_clock
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "Budget Hub", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 500, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_b_id: $.data.id }
