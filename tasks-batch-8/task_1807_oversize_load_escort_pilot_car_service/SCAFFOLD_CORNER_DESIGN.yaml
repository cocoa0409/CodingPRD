      - name: confirm_police_not_required_rejected
        claim_type: conditional_validation
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Police confirmation is conditional on the computed requirement flag: confirming a leg with requires_police_escort == false is a 400."
        test_recipe:
          setup: ["Quoted TX job width 170 / height 150 (requires_police_escort false)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Police Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "No police", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
