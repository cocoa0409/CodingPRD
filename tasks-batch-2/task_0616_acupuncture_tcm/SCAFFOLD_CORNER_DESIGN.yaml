              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["CV4"], planned_sessions: 5 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv0: $.data.version }
            - call: "POST /dispenses"
