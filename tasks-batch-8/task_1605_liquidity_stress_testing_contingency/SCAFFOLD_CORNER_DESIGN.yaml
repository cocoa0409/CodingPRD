            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 1000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
