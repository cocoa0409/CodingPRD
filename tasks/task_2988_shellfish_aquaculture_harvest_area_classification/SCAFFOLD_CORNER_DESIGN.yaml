        claim_type: side_effect_execution
        grounds:
          - "state_machines[GrowingArea.classification]"
          - "state_machines[GrowingArea.harvest_status]"
          - "entities.GrowingArea.fields.harvest_status"
        excluded_because:
          difficulty_instance: growing_area_classification_and_harvest_status_evolve_independently
          rationale: "The §1.8 non_linear_state_machine instance already proves the two dimensions are orthogonal by moving each one while pinning the other, including the note that a classification decision never touches harvest_status."

