scenario: |
  Heat Treating Service (commercial): load build & furnace recipe by alloy/spec, pyrometry survey (AMS2750) & instrument calibration, batch traceability & load thermocouple record, hardness testing & re-treat disposition, quench media & fixture distortion allowance, rush lane & turnaround guarantee, Nadcap audit evidence, customer material liability

domain_name: heat-treating-service
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer company name" }
      - { name: liability_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | EXTENDED; selects the liability_payout variant", constraints: "enum {STANDARD, EXTENDED}" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true, new work orders are rejected with ERR_CUSTOMER_CREDIT_HOLD" }
      - { name: outstanding_liability_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of payout_cents over this customer's LiabilityClaims with status in {PENDING, ACCEPTED}; recomputed on claim create/pay/reject" }

  - name: FurnaceRecipe
    parent: null
    common_fields: true
    fields:
      - { name: alloy_code, type: string, source: input, description: "Alloy designation, e.g. 4140" }
      - { name: spec_code, type: string, source: input, description: "Process spec, e.g. AMS2759" }
      - { name: soak_temp_f, type: integer, source: input, description: "Setpoint temperature for the soak" }
      - { name: soak_tolerance_f, type: integer, source: input, description: "Allowed +/- band around soak_temp_f for load thermocouples" }
      - { name: min_soak_minutes, type: integer, source: input, description: "Minimum time at temperature" }
      - { name: quench_media, type: enum, source: input, description: "OIL | WATER | POLYMER | AIR | GAS", constraints: "enum {OIL, WATER, POLYMER, AIR, GAS}" }
      - { name: required_furnace_class, type: enum, source: input, description: "Minimum AMS2750 furnace class; CLASS_1 strictest", constraints: "enum {CLASS_1, CLASS_2, CLASS_3, CLASS_5}" }
      - { name: max_retreats, type: integer, source: input, description: "Maximum number of re-treat cycles permitted per spec; RE_TREAT rejected when retreat_count == max_retreats" }
      - { name: fixture_distortion_allowance_in, type: number, source: input, description: "Max acceptable part distortion in inches given the recipe's fixturing" }
      - { name: hardness_min_hrc, type: integer, source: input, description: "Minimum acceptable average hardness (HRC), inclusive" }
      - { name: hardness_max_hrc, type: integer, source: input, description: "Maximum acceptable average hardness (HRC), inclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED", constraints: "enum {DRAFT, APPROVED}; (alloy_code, spec_code) unique across all recipes" }

  - name: Furnace
    parent: null
    common_fields: true
    fields:
      - { name: furnace_code, type: string, source: input, description: "Unique furnace identifier", constraints: "unique" }
      - { name: furnace_class, type: enum, source: input, description: "AMS2750 furnace class", constraints: "enum {CLASS_1, CLASS_2, CLASS_3, CLASS_5}; rank CLASS_1=1 < CLASS_2=2 < CLASS_3=3 < CLASS_5=5" }
      - { name: max_load_weight_lb, type: integer, source: input, description: "Maximum total charge weight per load" }
      - { name: quench_media_supported, type: array, source: input, description: "List of quench media this furnace can run (enum members of recipe quench_media)" }
      - { name: qualification_status, type: enum, source: computed, description: "UNQUALIFIED | SURVEY_OVERDUE | CALIBRATION_OVERDUE | QUALIFIED per furnace_qualification_posture", constraints: "enum {UNQUALIFIED, SURVEY_OVERDUE, CALIBRATION_OVERDUE, QUALIFIED}" }
      - { name: current_tus_due_at, type: datetime, source: computed, description: "next_due_at of the latest PASS TUS PyrometryRecord; null when none" }
      - { name: current_calibration_due_at, type: datetime, source: computed, description: "next_due_at of the latest PASS INSTRUMENT_CALIBRATION PyrometryRecord; null when none" }

  - name: PyrometryRecord
    parent: null
    common_fields: false
    fields:
      - { name: furnace_id, type: string, source: input, description: "FK -> Furnace.id; furnace surveyed/calibrated" }
      - { name: record_type, type: enum, source: input, description: "TUS (temperature uniformity survey) | INSTRUMENT_CALIBRATION", constraints: "enum {TUS, INSTRUMENT_CALIBRATION}" }
      - { name: performed_at, type: datetime, source: input, description: "When the survey/calibration was performed" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "enum {PASS, FAIL}" }
      - { name: instrument_id, type: string, source: input, description: "Instrument identifier for calibration records; optional for TUS" }
      - { name: next_due_at, type: datetime, source: computed, description: "performed_at + interval(record_type, furnace.furnace_class) per pyrometry_next_due" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owner of the material" }
      - { name: recipe_id, type: string, source: input, description: "FK -> FurnaceRecipe.id; recipe selected by alloy/spec" }
      - { name: part_quantity, type: integer, source: input, description: "Piece count in the lot" }
      - { name: received_weight_lb, type: number, source: input, description: "Lot weight in pounds, up to 3 decimal places" }
      - { name: declared_value_cents, type: integer, source: input, description: "Customer-declared material value, caps liability payout" }
      - { name: processing_charge_cents, type: integer, source: input, description: "Quoted heat-treat charge for the lot" }
      - { name: service_lane, type: enum, source: input, default: STANDARD, description: "STANDARD | RUSH", constraints: "enum {STANDARD, RUSH}" }
      - { name: guaranteed_turnaround_hours, type: integer, source: input, description: "Required iff service_lane == RUSH; must be >= 4", constraints: ">= 4 when present" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: promised_due_at, type: datetime, source: computed, description: "received_at + guaranteed_turnaround_hours; null for STANDARD" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical clock at ship; null until shipped" }
      - { name: turnaround_breached, type: boolean, source: computed, description: "RUSH only: shipped_at > promised_due_at; false until shipped" }
      - { name: rush_surcharge_quoted_cents, type: integer, source: computed, description: "Provisional rush surcharge at intake per rush_surcharge_quote; 0 for STANDARD" }
      - { name: rush_surcharge_final_cents, type: integer, source: computed, description: "Settled at ship: quoted when not breached, 0 when breached; null until shipped" }
      - { name: energy_surcharge_cents, type: integer, source: computed, description: "Per-order energy surcharge set at load complete-run per energy_surcharge_settlement; null until then" }
      - { name: retreat_count, type: integer, source: system, default: 0, description: "Number of RE_TREAT dispositions executed" }
      - { name: processing_status, type: enum, source: system, description: "RECEIVED | SCHEDULED | IN_PROCESS | PROCESSED | AWAITING_RETREAT | SHIPPED | SCRAPPED | CANCELLED", constraints: "enum {RECEIVED, SCHEDULED, IN_PROCESS, PROCESSED, AWAITING_RETREAT, SHIPPED, SCRAPPED, CANCELLED}" }
      - { name: quality_status, type: enum, source: system, description: "PENDING_TEST | PASSED | FAILED | WAIVED; independent dimension from processing_status", constraints: "enum {PENDING_TEST, PASSED, FAILED, WAIVED}" }

  - name: LoadBatch
    parent: null
    common_fields: true
    fields:
      - { name: furnace_id, type: string, source: input, description: "FK -> Furnace.id; furnace the load runs on" }
      - { name: recipe_id, type: string, source: input, description: "FK -> FurnaceRecipe.id; every assignment's work order must reference this recipe" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Planned run window start (must be < scheduled_end_at)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Planned run window end" }
      - { name: status, type: enum, source: system, description: "BUILDING | HOLD | RELEASED | RUNNING | COMPLETED | ABORTED", constraints: "enum {BUILDING, HOLD, RELEASED, RUNNING, COMPLETED, ABORTED}" }
      - { name: total_weight_lb, type: number, source: computed, default: 0, description: "Sum of received_weight_lb over ACTIVE LoadAssignments" }
      - { name: out_of_spec, type: boolean, source: computed, default: false, description: "Set at complete-run per tc_excursion_assessment" }
      - { name: total_energy_surcharge_cents, type: integer, source: computed, description: "Sum of per-order rounded energy surcharges; set at complete-run, null before" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock at start-run; null until RUNNING" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at complete-run; null until COMPLETED" }

  - name: LoadAssignment
    parent: null
    common_fields: true
    fields:
      - { name: load_batch_id, type: string, source: input, description: "FK -> LoadBatch.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED", constraints: "enum {ACTIVE, REMOVED}" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical clock at assignment" }

  - name: LoadThermocoupleReading
    parent: null
    common_fields: false
    fields:
      - { name: load_batch_id, type: string, source: input, description: "FK -> LoadBatch.id; load the reading belongs to" }
      - { name: channel, type: string, source: input, description: "Thermocouple channel label, e.g. LOAD_TC_1" }
      - { name: recorded_at, type: datetime, source: input, description: "Timestamp of the reading" }
      - { name: temp_f, type: integer, source: input, description: "Measured temperature" }

  - name: InspectionTest
    parent: null
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; lot under test" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID header of the recording QualityEngineer" }
      - { name: hardness_readings, type: array, source: input, description: "One or more HRC readings (numbers)" }
      - { name: measured_distortion_in, type: number, source: input, description: "Measured part distortion in inches" }
      - { name: avg_hardness_hrc, type: number, source: computed, description: "mean(hardness_readings) rounded to 1 decimal, round_half_up" }
      - { name: result, type: enum, source: computed, description: "PASS iff hardness_min_hrc <= avg <= hardness_max_hrc AND measured_distortion_in <= recipe.fixture_distortion_allowance_in; else FAIL", constraints: "enum {PASS, FAIL}" }

  - name: DispositionCase
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; failing lot" }
      - { name: inspection_test_id, type: string, source: system, description: "FK -> InspectionTest.id; the FAIL test that opened the case" }
      - { name: status, type: enum, source: system, description: "OPEN -> DECIDED", constraints: "enum {OPEN, DECIDED}" }
      - { name: decision, type: enum, source: input, description: "Set at decide: RE_TREAT | SCRAP | RETURN_AS_IS", constraints: "enum {RE_TREAT, SCRAP, RETURN_AS_IS}" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding QualityEngineer; must differ from inspection_test.recorded_by_user_id" }

  - name: LiabilityClaim
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; scrapped lot" }
      - { name: customer_id, type: string, source: system, description: "FK -> CustomerAccount.id; copied from the work order" }
      - { name: payout_cents, type: integer, source: computed, description: "Computed at creation per liability_payout variant selected by customer.liability_tier" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACCEPTED -> PAID; PENDING -> REJECTED", constraints: "enum {PENDING, ACCEPTED, PAID, REJECTED}" }

  - name: AuditPackage
    parent: null
    common_fields: true
    fields:
      - { name: furnace_id, type: string, source: input, description: "FK -> Furnace.id; furnace under Nadcap audit" }
      - { name: load_batch_ids, type: array, source: input, description: "Load batches (must be COMPLETED on this furnace) whose evidence is bundled" }
      - { name: evidence_manifest, type: object, source: computed, description: "Computed at creation, frozen at issue: { load_batch_ids, pyrometry_record_ids, thermocouple_reading_counts }" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED (locked)", constraints: "enum {DRAFT, ISSUED}" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issue; null while DRAFT" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FurnaceRecipe
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: POST /furnace-recipes/{recipeId}/approve
        actor: QualityEngineer
        preconditions:
          - "Recipe must be in DRAFT (ERR_INVALID_REQUEST on repeat approve)"
        side_effects: []

  - entity: Furnace
    initial_state: UNQUALIFIED
    terminal_states: []
    transitions:
      - from: ANY
        to: "<computed>"
        trigger: "system (furnace_qualification_posture recompute on PyrometryRecord create and on every read)"
        actor: system
        preconditions: []
        side_effects:
          - "When posture leaves QUALIFIED: every LoadBatch on this furnace in BUILDING -> HOLD"
          - "When posture returns to QUALIFIED: every LoadBatch on this furnace in HOLD -> BUILDING"
        note: "qualification_status is a derived posture field, not a stored state; see calculations.furnace_qualification_posture"

  - entity: WorkOrder
    initial_state: "processing_status=RECEIVED, quality_status=PENDING_TEST"
    terminal_states: [SHIPPED, SCRAPPED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: SCHEDULED
        trigger: "system (LoadAssignment created ACTIVE for this order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_RETREAT
        to: SCHEDULED
        trigger: "system (LoadAssignment created ACTIVE for this order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: RECEIVED
        trigger: "system (assignment unassigned; order had retreat_count == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: AWAITING_RETREAT
        trigger: "system (assignment unassigned; order had retreat_count > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: IN_PROCESS
        trigger: "system (parent LoadBatch start-run)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROCESS
        to: PROCESSED
        trigger: "system (parent LoadBatch complete-run)"
        actor: system
        preconditions: []
        side_effects:
          - "energy_surcharge_cents computed per energy_surcharge_settlement"
      - from: IN_PROCESS
        to: RECEIVED
        trigger: "system (parent LoadBatch abort)"
        actor: system
        preconditions: []
        side_effects:
          - "Assignment -> REMOVED"
      - from: PROCESSED
        to: SHIPPED
        trigger: POST /work-orders/{workOrderId}/ship
        actor: CustomerServiceRep
        preconditions:
          - "processing_status == PROCESSED and quality_status in {PASSED, WAIVED} (ERR_WORK_ORDER_NOT_SHIPPABLE)"
        side_effects:
          - "shipped_at = logical clock; turnaround_breached and rush_surcharge_final_cents computed per turnaround_breach_assessment"
      - from: PROCESSED
        to: AWAITING_RETREAT
        trigger: "system (DispositionCase decided RE_TREAT)"
        actor: system
        preconditions: []
        side_effects:
          - "retreat_count += 1"
          - "quality_status FAILED -> PENDING_TEST"
      - from: PROCESSED
        to: SCRAPPED
        trigger: "system (DispositionCase decided SCRAP)"
        actor: system
        preconditions: []
        side_effects:
          - "LiabilityClaim created PENDING with payout_cents per liability_payout (hop 2 of scrap cascade)"
      - from: RECEIVED
        to: CANCELLED
        trigger: POST /work-orders/{workOrderId}/cancel
        actor: CustomerServiceRep
        preconditions:
          - "processing_status in {RECEIVED, SCHEDULED} (ERR_WORK_ORDER_NOT_CANCELLABLE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /work-orders/{workOrderId}/cancel
        actor: CustomerServiceRep
        preconditions:
          - "processing_status in {RECEIVED, SCHEDULED} (ERR_WORK_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "ACTIVE assignment -> REMOVED; LoadBatch.total_weight_lb recomputed; LoadBatch.version += 1"
  - entity_note: "WorkOrder quality_status is an independent state dimension alongside processing_status: PENDING_TEST -> PASSED (InspectionTest PASS); PENDING_TEST -> FAILED (InspectionTest FAIL); FAILED -> PENDING_TEST (RE_TREAT decide); FAILED -> WAIVED (RETURN_AS_IS decide)."

  - entity: LoadBatch
    initial_state: BUILDING
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: BUILDING
        to: RELEASED
        trigger: POST /load-batches/{loadBatchId}/release
        actor: ShopScheduler
        preconditions:
          - "status == BUILDING (ERR_LOAD_NOT_BUILDING)"
          - "Furnace.qualification_status == QUALIFIED (ERR_FURNACE_NOT_QUALIFIED)"
          - "recipe status == APPROVED (ERR_RECIPE_NOT_APPROVED)"
          - "[scheduled_start_at, scheduled_end_at] contained in latest PASS TUS validity [performed_at, next_due_at) and latest PASS calibration validity (ERR_PYROMETRY_WINDOW_VIOLATION)"
          - "no overlap / purge-gap conflict with loads in {RELEASED, RUNNING, COMPLETED} on this furnace (ERR_FURNACE_SCHEDULE_OVERLAP, ERR_QUENCH_PURGE_GAP_VIOLATION)"
          - "at least one ACTIVE assignment (ERR_EMPTY_LOAD)"
        side_effects: []
      - from: BUILDING
        to: HOLD
        trigger: "system (furnace posture left QUALIFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HOLD
        to: BUILDING
        trigger: "system (furnace posture returned to QUALIFIED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: RUNNING
        trigger: POST /load-batches/{loadBatchId}/start-run
        actor: FurnaceOperator
        preconditions:
          - "status == RELEASED (ERR_LOAD_NOT_RELEASED)"
          - "Furnace.qualification_status == QUALIFIED (ERR_FURNACE_NOT_QUALIFIED)"
        side_effects:
          - "started_at = logical clock"
          - "Every ACTIVE assignment's WorkOrder: SCHEDULED -> IN_PROCESS"
      - from: RUNNING
        to: COMPLETED
        trigger: POST /load-batches/{loadBatchId}/complete-run
        actor: FurnaceOperator
        preconditions:
          - "status == RUNNING (ERR_LOAD_NOT_RUNNING)"
        side_effects:
          - "completed_at = logical clock"
          - "out_of_spec computed per tc_excursion_assessment"
          - "Every ACTIVE assignment's WorkOrder: IN_PROCESS -> PROCESSED with energy_surcharge_cents set"
          - "total_energy_surcharge_cents computed per energy_surcharge_settlement"
      - from: RUNNING
        to: ABORTED
        trigger: POST /load-batches/{loadBatchId}/abort
        actor: FurnaceOperator
        preconditions:
          - "status == RUNNING (ERR_LOAD_NOT_RUNNING)"
        side_effects:
          - "Every ACTIVE assignment -> REMOVED"
          - "Each removed WorkOrder: IN_PROCESS -> RECEIVED"
          - "total_weight_lb recomputed (0)"

  - entity: LoadAssignment
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /load-batches/{loadBatchId}/assignments/{assignmentId}/unassign OR system (load abort / order cancel)"
        actor: ShopScheduler | system
        preconditions:
          - "LoadBatch.status == BUILDING or HOLD when unassign is called directly (ERR_LOAD_NOT_BUILDING)"
        side_effects:
          - "WorkOrder returns to RECEIVED (retreat_count == 0) or AWAITING_RETREAT (retreat_count > 0)"
          - "LoadBatch.total_weight_lb recomputed; LoadBatch.version += 1"

  - entity: DispositionCase
    initial_state: OPEN
    terminal_states: [DECIDED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: POST /disposition-cases/{caseId}/decide
        actor: QualityEngineer
        preconditions:
          - "status == OPEN (ERR_DISPOSITION_NOT_OPEN)"
          - "X-User-ID != inspection_test.recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "decision == RE_TREAT requires work_order.retreat_count < recipe.max_retreats (ERR_RETREAT_LIMIT_REACHED)"
        side_effects:
          - "RE_TREAT: WorkOrder PROCESSED -> AWAITING_RETREAT, retreat_count += 1, quality FAILED -> PENDING_TEST"
          - "SCRAP: WorkOrder PROCESSED -> SCRAPPED; LiabilityClaim created PENDING (payout per liability_payout); CustomerAccount.outstanding_liability_exposure_cents += payout"
          - "RETURN_AS_IS: WorkOrder quality FAILED -> WAIVED (processing stays PROCESSED)"
          - "decided_by_user_id = X-User-ID"

  - entity: LiabilityClaim
    initial_state: PENDING
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: POST /liability-claims/{claimId}/accept
        actor: Customer
        preconditions:
          - "status == PENDING (ERR_CLAIM_NOT_PENDING)"
          - "X-User-ID == claim.customer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: ACCEPTED
        to: PAID
        trigger: POST /liability-claims/{claimId}/pay
        actor: CustomerServiceRep
        preconditions:
          - "status == ACCEPTED (ERR_CLAIM_NOT_ACCEPTED)"
        side_effects:
          - "CustomerAccount.outstanding_liability_exposure_cents -= payout_cents"
      - from: PENDING
        to: REJECTED
        trigger: POST /liability-claims/{claimId}/reject
        actor: CustomerServiceRep
        preconditions:
          - "status == PENDING (ERR_CLAIM_NOT_PENDING)"
        side_effects:
          - "CustomerAccount.outstanding_liability_exposure_cents -= payout_cents"

  - entity: AuditPackage
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /audit-packages/{packageId}/issue
        actor: NadcapAuditor
        preconditions:
          - "status == DRAFT (ERR_PACKAGE_NOT_DRAFT)"
        side_effects:
          - "issued_at = logical clock; evidence_manifest frozen (immutable thereafter)"

  - entity: PyrometryRecord
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Append-only; no state transitions, no update endpoints (common_fields: false)."

  - entity: LoadThermocoupleReading
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Append-only event log; created only while parent load is RUNNING (ERR_LOAD_NOT_RUNNING otherwise)."

  - entity: InspectionTest
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Immutable record; result computed at creation. A FAIL cascades: WorkOrder quality PENDING_TEST -> FAILED and a DispositionCase OPEN is created."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: load-assign-stale-version
    parent_entity: LoadBatch
    write_endpoint: POST /load-batches/{loadBatchId}/assignments
    occ_field: expected_load_batch_version
    description: |
      Creating a LoadAssignment against a LoadBatch whose version has advanced
      since the client last observed it is rejected. The client supplies the
      LoadBatch.version it last read; a stale value means another write (assign,
      unassign, or cascade) has changed the load build since that read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: load-unassign-stale-version
    parent_entity: LoadBatch
    write_endpoint: POST /load-batches/{loadBatchId}/assignments/{assignmentId}/unassign
    occ_field: expected_load_batch_version
    description: |
      Removing a LoadAssignment against a LoadBatch whose version has advanced
      since the client last observed it is rejected, for the same stale-view
      reason as assignment creation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rush_surcharge_quote
    trigger: "WorkOrder creation (provisional quote, RUSH lane only); ship (final settlement)"
    algorithm: tiered_pricing
    formula: |
      Provisional (at creation):
        base = RUSH_BASE_CENTS + round_half_up(RUSH_PCT * processing_charge_cents)
        if guaranteed_turnaround_hours <= EXPEDITE_THRESHOLD_HOURS:
          base = round_half_up(base * EXPEDITE_MULT)
        rush_surcharge_quoted_cents = max(RUSH_MIN_CENTS, min(RUSH_CAP_CENTS, base))
      Final (at ship, per turnaround_breach_assessment):
        if turnaround_breached: rush_surcharge_final_cents = 0
        else:                   rush_surcharge_final_cents = rush_surcharge_quoted_cents
      STANDARD lane: quoted = 0 at creation, final = 0 at ship.
    input_set: "The WorkOrder being created or shipped"
    constants:
      RUSH_BASE_CENTS: 15000
      RUSH_PCT: 0.20
      RUSH_MIN_CENTS: 25000
      RUSH_CAP_CENTS: 200000
      EXPEDITE_THRESHOLD_HOURS: 24
      EXPEDITE_MULT: 1.5
    precision: "integer cents; round_half_up at each marked step"
    variants:
      - name: provisional_quoted
        when: "at WorkOrder creation"
        difference: "charge-based quote before any turnaround outcome is known"
      - name: final_settled
        when: "at ship"
        difference: "0 when the turnaround guarantee is breached; identical inputs therefore produce different surcharge totals across variants"

  - name: liability_payout
    trigger: "DispositionCase decided SCRAP (LiabilityClaim creation)"
    algorithm: threshold
    formula: |
      Variant selected by CustomerAccount.liability_tier of the claim's customer:
      STANDARD:
        payout_cents = min(declared_value_cents, STANDARD_LIABILITY_MULT * processing_charge_cents)
      EXTENDED:
        raw = EXTENDED_RATE_CENTS_PER_LB * received_weight_lb
        rounded = round_half_up(raw)   # round the per-pound extension to whole cents FIRST
        payout_cents = min(declared_value_cents, rounded)   # apply the declared-value cap SECOND
      Rounding order is pinned: per-pound extension is rounded before the cap is
      applied.
    input_set: "The scrapped WorkOrder and its CustomerAccount"
    constants:
      STANDARD_LIABILITY_MULT: 3
      EXTENDED_RATE_CENTS_PER_LB: 85
    precision: "integer cents, round_half_up"
    variants:
      - name: standard_multiplier_of_charge
        when: "customer.liability_tier == STANDARD"
        difference: "caps payout at 3x the processing charge"
      - name: extended_per_pound
        when: "customer.liability_tier == EXTENDED"
        difference: "values material by weight at 85 cents/lb; identical work-order economics produce a different payout than the STANDARD variant"

  - name: furnace_qualification_posture
    trigger: "PyrometryRecord creation; evaluated against the logical clock on every Furnace read and every load release/start-run check"
    algorithm: aggregation
    formula: |
      latest(type) = PyrometryRecord of this furnace with record_type == type,
        greatest performed_at; tie-break: greatest created_at.
      1. If latest(TUS) is missing or result == FAIL, OR latest(INSTRUMENT_CALIBRATION)
         is missing or result == FAIL: qualification_status = UNQUALIFIED.
      2. Else if latest(TUS).next_due_at < now: SURVEY_OVERDUE.
      3. Else if latest(INSTRUMENT_CALIBRATION).next_due_at < now: CALIBRATION_OVERDUE.
      4. Else: QUALIFIED.
      Precedence is pinned top-to-bottom (UNQUALIFIED > SURVEY_OVERDUE >
      CALIBRATION_OVERDUE > QUALIFIED); when both are overdue the status is
      SURVEY_OVERDUE.
      Side effects on change: leaving QUALIFIED moves this furnace's BUILDING
      LoadBatches to HOLD; returning to QUALIFIED moves HOLD loads back to BUILDING.
    input_set: "All PyrometryRecords of the furnace"
    constants:
      TUS_INTERVAL_DAYS_CLASS_1: 30
      TUS_INTERVAL_DAYS_CLASS_2: 60
      TUS_INTERVAL_DAYS_CLASS_3: 90
      TUS_INTERVAL_DAYS_CLASS_5: 180
      CALIBRATION_INTERVAL_DAYS: 90

  - name: pyrometry_next_due
    trigger: "PyrometryRecord creation"
    algorithm: threshold
    formula: |
      next_due_at = performed_at + interval_days, where
      interval_days = TUS_INTERVAL_DAYS_<furnace.furnace_class> for TUS records,
      CALIBRATION_INTERVAL_DAYS for INSTRUMENT_CALIBRATION records.
    input_set: "The PyrometryRecord being created and its Furnace"
    constants:
      TUS_INTERVAL_DAYS_CLASS_1: 30
      TUS_INTERVAL_DAYS_CLASS_2: 60
      TUS_INTERVAL_DAYS_CLASS_3: 90
      TUS_INTERVAL_DAYS_CLASS_5: 180
      CALIBRATION_INTERVAL_DAYS: 90
    precision: "datetime, whole days"

  - name: load_weight_utilization
    trigger: "LoadAssignment create / unassign / abort / order cancel"
    algorithm: aggregation
    formula: |
      LoadBatch.total_weight_lb = sum(WorkOrder.received_weight_lb) over the
      load's assignments with status == ACTIVE.
      Assignment create is rejected when the resulting total would be strictly
      greater than Furnace.max_load_weight_lb; a total exactly equal to the
      maximum is allowed.
    input_set: "ACTIVE LoadAssignments of the load"
    precision: "pounds, up to 3 decimal places"

  - name: turnaround_breach_assessment
    trigger: "POST /work-orders/{id}/ship"
    algorithm: threshold
    formula: |
      RUSH only: turnaround_breached = (shipped_at > promised_due_at).
      Shipping exactly at promised_due_at is NOT a breach (guarantee met).
      Drives rush_surcharge_final_cents per rush_surcharge_quote final variant.
      STANDARD lane: turnaround_breached = false, final surcharge 0.
    input_set: "The WorkOrder being shipped"
    precision: "datetime comparison, second precision"

  - name: tc_excursion_assessment
    trigger: "POST /load-batches/{id}/complete-run"
    algorithm: threshold
    formula: |
      LoadBatch.out_of_spec = true iff at least one LoadThermocoupleReading of
      this load has |temp_f - recipe.soak_temp_f| > recipe.soak_tolerance_f.
      A reading exactly at soak_temp_f +/- soak_tolerance_f is in tolerance.
    input_set: "All LoadThermocoupleReadings of the load"
    precision: "integer degrees F"

  - name: energy_surcharge_settlement
    trigger: "POST /load-batches/{id}/complete-run"
    algorithm: aggregation
    formula: |
      For each ACTIVE assignment's WorkOrder (each transitions to PROCESSED):
        order_surcharge_cents = round_half_up(ENERGY_RATE_CENTS_PER_LB * received_weight_lb)
      LoadBatch.total_energy_surcharge_cents = sum of the PER-ORDER ROUNDED
      surcharges. Rounding order is pinned: round each order first, then sum
      (summing raw values then rounding once yields different cents and is
      non-conformant).
    input_set: "WorkOrders of ACTIVE assignments at complete-run"
    constants:
      ENERGY_RATE_CENTS_PER_LB: 133
    precision: "integer cents, round_half_up per order line"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per the endpoint table"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Customer-role requests may only touch resources whose customer_id == X-User-ID"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "GET /work-orders/{id}, POST /liability-claims/{id}/accept, GET /liability-claims/{id}"
  - priority: 4
    category: existence
    check: "Path ids validated left-to-right; body foreign keys (customer_id, recipe_id, furnace_id, work_order_id, load_batch_id) must reference existing resources"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_FURNACE_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_LOAD_BATCH_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_DISPOSITION_CASE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_AUDIT_PACKAGE_NOT_FOUND | ERR_PYROMETRY_RECORD_NOT_FOUND | ERR_THERMOCOUPLE_READING_NOT_FOUND | ERR_INSPECTION_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "Target resource must be in a state that permits the operation (state-machine preconditions); OCC: expected_load_batch_version must equal LoadBatch.version on assignment writes"
    error_id: "ERR_LOAD_NOT_BUILDING | ERR_LOAD_NOT_RELEASED | ERR_LOAD_NOT_RUNNING | ERR_WORK_ORDER_NOT_ASSIGNABLE | ERR_WORK_ORDER_NOT_TESTABLE | ERR_WORK_ORDER_NOT_SHIPPABLE | ERR_WORK_ORDER_NOT_CANCELLABLE | ERR_DISPOSITION_NOT_OPEN | ERR_CLAIM_NOT_PENDING | ERR_CLAIM_NOT_ACCEPTED | ERR_PACKAGE_NOT_DRAFT | ERR_LOAD_NOT_COMPLETED | ERR_STALE_VERSION"
    http_status: "409 (412 for ERR_STALE_VERSION)"
    applies_to: "state transition endpoints and OCC-guarded writes"
  - priority: 6
    category: business_safety
    check: "Furnace.qualification_status == QUALIFIED for release/start-run; furnace class rank <= recipe required rank; furnace supports recipe quench_media; disposition decider != inspection recorder"
    error_id: "ERR_FURNACE_NOT_QUALIFIED | ERR_RECIPE_CLASS_MISMATCH | ERR_QUENCH_MEDIA_INCOMPATIBLE | ERR_SEGREGATION_OF_DUTIES"
    http_status: "422 (403 for ERR_SEGREGATION_OF_DUTIES)"
    applies_to: "POST /load-batches, POST /load-batches/{id}/release, POST /load-batches/{id}/start-run, POST /disposition-cases/{id}/decide"
  - priority: 7
    category: business_referential
    check: "Recipe referenced by a load must be APPROVED; work order's recipe_id must equal the load's recipe_id; (alloy_code, spec_code) must be unique across recipes"
    error_id: "ERR_RECIPE_NOT_APPROVED | ERR_RECIPE_MISMATCH | ERR_DUPLICATE_RECIPE"
    http_status: "409 (422 for ERR_RECIPE_MISMATCH)"
    applies_to: "POST /furnace-recipes, POST /load-batches, POST /load-batches/{id}/release, POST /load-batches/{id}/assignments"
  - priority: 8
    category: business_temporal
    check: "RUSH guarantee window >= 4 hours; load window containment within pyrometry validity at release; no schedule overlap or purge-gap violation on the furnace schedule"
    error_id: "ERR_INVALID_GUARANTEE_WINDOW | ERR_PYROMETRY_WINDOW_VIOLATION | ERR_FURNACE_SCHEDULE_OVERLAP | ERR_QUENCH_PURGE_GAP_VIOLATION"
    http_status: "422 (409 for overlap and purge-gap)"
    applies_to: "POST /work-orders, POST /load-batches, POST /load-batches/{id}/release"
  - priority: 9
    category: business_constraint
    check: "Load total weight must stay <= Furnace.max_load_weight_lb; release requires >= 1 ACTIVE assignment; RE_TREAT requires retreat_count < recipe.max_retreats; required fields present (RUSH guarantee hours, hardness_readings non-empty, scheduled_start_at < scheduled_end_at, enum values valid)"
    error_id: "ERR_LOAD_WEIGHT_EXCEEDED | ERR_EMPTY_LOAD | ERR_RETREAT_LIMIT_REACHED | ERR_INVALID_REQUEST"
    http_status: "422 (400 for ERR_INVALID_REQUEST)"
    applies_to: "creation and action endpoints as applicable"
  - priority: 10
    category: business_fiscal
    check: "CustomerAccount.credit_hold must be false to create a work order"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /work-orders"

