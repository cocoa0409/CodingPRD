scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc — two dual-variant calculations on DIFFERENT
  # entity domains: ShowingFeedback scoring vs SyndicationJob delay auditing.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: feedback_score_raw_vs_decay_weighted
        grounds:
          - calculations.showing_feedback_scores
          - entities.Listing.fields.feedback_score_raw
          - entities.Listing.fields.feedback_score_weighted
        distinguishing_aspect: |
          Same INCLUDED feedback rows produce two different scores on the ShowingFeedback
          domain: raw mean ignores age, decay-weighted halves weight every 14 days, so
          ratings 5 (age 28d) and 3 (age 14d) yield raw 4.0 but weighted 3.667.
        test_recipe:
          setup:
            - "ACTIVE listing owned by the agent, one READY PHOTO, APPROVED review"
            - "Two ended showing windows, feedback 5 created 2026-08-01T12:00:00Z, feedback 3 created 2026-08-15T12:00:00Z, read at 2026-08-29T12:00:00Z"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/showing-windows", payload: { starts_at: "2026-08-01T10:00:00Z", ends_at: "2026-08-01T11:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { w1: $.data.id } }
            - { call: "POST /listings/${l_id}/showing-windows", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T11:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { w2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: MarketingDirector }
            - { call: "POST /showing-windows/${w1}/feedback", payload: { rating: 5 }, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: MarketingDirector }
            - { call: "POST /showing-windows/${w2}/feedback", payload: { rating: 3 }, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-29T12:00:00Z" }, as: MarketingDirector }
          trigger:
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
          assert:
            - "summary.feedback_score_raw == 4.0"
            - "summary.feedback_score_weighted == 3.667"
            - "feedback_score_raw != feedback_score_weighted for identical INCLUDED rows"

      - name: delay_audit_provisional_vs_audited
        grounds:
          - calculations.propagation_delay_audit
          - entities.Listing.fields.audited_breach_count
          - entities.Listing.fields.provisional_breach_count
        distinguishing_aspect: |
          Same SyndicationJob population on the syndication domain: provisional counts an
          in-flight DISPATCHED job 4200s past a 3600s SLA, audited counts terminal evidence
          only, so provisional_breach_count == 1 while audited_breach_count == 0 — a
          different entity domain than the feedback-score variant.
        test_recipe:
          setup:
            - "ACTIVE listing syndicated to a portal with sla_seconds 3600; FULL_SYNC dispatched at 2026-08-01T00:00:00Z and never acked"
            - "Clock advanced to 2026-08-01T01:10:00Z (job in flight 4200s > 3600s SLA)"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX", sla_seconds: 3600 }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:10:00Z" }, as: MarketingDirector }
          trigger:
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
          assert:
            - "summary.provisional_breach_count == 1"
            - "summary.audited_breach_count == 0"
            - "summary.syndication_posture == SYNDICATING (DEGRADED keys off audited only)"

  # ===========================================================================
  # Rule 2: combinatorial_formula — mode (a) tiered/branching relist fee vs
  # mode (b) nested-rounding portal display price. Different modes.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: relist_fee_tier_discount_volume_interaction
        grounds:
          - calculations.relist_fee_calculation
          - state_machines.Listing.WITHDRAWN_to_DRAFT
        distinguishing_aspect: |
          Mode (a): fee combines three non-linear inputs — relist_count tier multiplier,
          a conditional 0.25 discount branch at price_reduction_pct >= 5.0, and a volume
          multiplier on the agent's ACTIVE listings; with count 0, 6.0% reduction, and 0
          other ACTIVE listings the fee is 20000 * 1.0 * 1.0 * 0.75 = 15000 cents.
        test_recipe:
          setup:
            - "Listing price 50000000, activated, then WITHDRAWN at 2026-08-01T00:00:00Z (terminal_price_cents 50000000)"
            - "Clock at 2026-09-02T00:00:00Z (32 days, cooldown elapsed); agent owns no other ACTIVE listings"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/withdraw", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: MarketingDirector }
          trigger:
            - { call: "GET /listings/${l_id}/relist-quote", payload: { new_list_price_cents: 47000000 }, as: MarketingCoordinator }
            - { call: "POST /listings/${l_id}/relist", payload: { new_list_price_cents: 47000000 }, as: ListingAgent, as_user_id: "${a_id}", captures: { fee: $.data.fee_cents } }
          assert:
            - "quote.eligible == true and quote.price_reduction_pct == 6.0 and quote.relist_count_before == 0"
            - "quote.fee_cents == 15000"
            - "RelistRequest.fee_cents (${fee}) == 15000"
            - "after relist: Listing.lifecycle_status == DRAFT, relist_count == 1, list_price_cents == 47000000"

      - name: portal_display_price_nested_rounding
        grounds:
          - calculations.portal_display_price
          - entities.SyndicationJob.fields.payload_display_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — discount applied to the exact unrounded price
          THEN one round_half_up to the portal increment; price 50005000 with portal A
          (discount 0.037, increment 500000) yields 48154815 -> 48000000, while rounding
          the price first would yield 48150000; portal B (0 discount, increment 100000)
          yields 50000000, and the headline is the min, 48000000.
        test_recipe:
          setup:
            - "ACTIVE listing price 50005000 subscribed to portal A (discount_pct 0.037, increment 500000) and portal B (discount 0, increment 100000)"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalA", discount_pct: 0.037, rounding_increment_cents: 500000 }, as: MarketingDirector, captures: { pa_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalB", rounding_increment_cents: 100000 }, as: MarketingDirector, captures: { pb_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50005000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${pa_id}" }, as: MarketingCoordinator, captures: { sub_a: $.data.id } }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${pb_id}" }, as: MarketingCoordinator, captures: { sub_b: $.data.id } }
          trigger:
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
            - { call: "GET /feed-subscriptions/${sub_a}/jobs", payload: {}, as: MarketingCoordinator }
            - { call: "GET /feed-subscriptions/${sub_b}/jobs", payload: {}, as: MarketingCoordinator }
          assert:
            - "summary.headline_display_price_cents == 48000000"
            - "FULL_SYNC job of ${sub_a} has payload_display_price_cents == 48000000"
            - "FULL_SYNC job of ${sub_b} has payload_display_price_cents == 50000000"

  # ===========================================================================
  # Rule 3: non_linear_state_machine — Listing compliance revision cycle
  # (plus parallel posture dimension) vs SyndicationJob retry cycle.
  # Different entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: listing_compliance_revision_cycle
        grounds:
          - state_machines.Listing.PENDING_REVIEW_to_COMPLIANCE_HOLD
          - state_machines.Listing.COMPLIANCE_HOLD_to_DRAFT
          - state_machines.Listing.DRAFT_to_PENDING_REVIEW
        distinguishing_aspect: |
          Listing is cyclic (DRAFT -> PENDING_REVIEW -> COMPLIANCE_HOLD -> DRAFT revision
          loop) and carries a second parallel posture dimension; the loop is on Listing,
          a different entity than the SyndicationJob retry cycle.
        test_recipe:
          setup:
            - "Complete DRAFT listing with one READY PHOTO; submitted; officer rejects with flagged terms"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "REJECTED", flagged_terms: ["adults only"], notes: "revise remarks" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /listings/${l_id}/revise", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r2_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "GET /listings/${l_id}/events", payload: { event_type: "STATUS_CHANGE" }, as: MarketingCoordinator }
          assert:
            - "after revise: lifecycle_status == DRAFT (loop back to the cycle start)"
            - "final lifecycle_status == ACTIVE"
            - "STATUS_CHANGE events in seq order show DRAFT->PENDING_REVIEW, PENDING_REVIEW->COMPLIANCE_HOLD, COMPLIANCE_HOLD->DRAFT, DRAFT->PENDING_REVIEW, PENDING_REVIEW->ACTIVE"
            - "two ComplianceReviews exist: first REJECTED, second APPROVED"

      - name: syndication_job_retry_cycle_to_dead_letter
        grounds:
          - state_machines.SyndicationJob.DISPATCHED_to_FAILED
          - state_machines.SyndicationJob.FAILED_to_RETRY_QUEUED
          - state_machines.SyndicationJob.FAILED_to_DEAD_LETTER
        distinguishing_aspect: |
          SyndicationJob runs the QUEUED -> DISPATCHED -> FAILED -> RETRY_QUEUED ->
          DISPATCHED cycle with exponential backoff (120s then 240s) and exits to
          DEAD_LETTER at attempt 3 — a cyclic machine on a different entity than Listing.
        test_recipe:
          setup:
            - "ACTIVE listing syndicated to one portal; FULL_SYNC QUEUED at clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX", sla_seconds: 3600 }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
            - { call: "GET /feed-subscriptions/${sub_id}/jobs", payload: {}, as: MarketingCoordinator, captures: { job_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /feed-events/${job_id}/fail", payload: { error_code: "E1" }, as: PortalWebhook }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:02:00Z" }, as: MarketingDirector }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /feed-events/${job_id}/fail", payload: { error_code: "E2" }, as: PortalWebhook }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:06:00Z" }, as: MarketingDirector }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /feed-events/${job_id}/fail", payload: { error_code: "E3" }, as: PortalWebhook }
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
          assert:
            - "first fail: status RETRY_QUEUED, scheduled_at == 2026-08-01T00:02:00Z (60 * 2^1 s)"
            - "second fail: RETRY_QUEUED, scheduled_at == 2026-08-01T00:06:00Z (60 * 2^2 s after 00:02)"
            - "third fail: status DEAD_LETTER with attempt_count == 3"
            - "summary.audited_breach_count == 1 and summary.syndication_posture == DEGRADED"

  # ===========================================================================
  # Rule 4: transitive_cascade — withdraw cascade (depth 4) vs price-change
  # cascade (depth 3); different triggering transitions.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_cascade_subscription_pause_job_cancel_posture
        grounds:
          - state_machines.Listing.ACTIVE_to_WITHDRAWN
          - state_machines.FeedSubscription.SUBSCRIBED_to_PAUSED
          - state_machines.SyndicationJob.ANY_NON_TERMINAL_to_CANCELLED
        distinguishing_aspect: |
          Trigger withdraw: Listing -> WITHDRAWN (link 1) causes each SUBSCRIBED
          FeedSubscription -> PAUSED (link 2), each pause causes its live SyndicationJobs
          -> CANCELLED plus a TERMINAL_SYNC queued (link 3), and those mutations cause the
          derived posture -> SUSPENDED (link 4) — depth 4, triggered by withdraw.
        test_recipe:
          setup:
            - "ACTIVE listing price 50000000, one SUBSCRIBED subscription, one QUEUED PRICE_UPDATE job created by a price change (never swept)"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX" }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 49900000, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /listings/${l_id}/withdraw", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "GET /listings/${l_id}/feed-subscriptions", payload: {}, as: MarketingCoordinator }
            - { call: "GET /listings/${l_id}/feed-events", payload: {}, as: MarketingCoordinator }
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
          assert:
            - "Listing.lifecycle_status == WITHDRAWN and terminal_price_cents == 50000000"
            - "subscription ${sub_id} status == PAUSED (link 2)"
            - "the QUEUED PRICE_UPDATE job is CANCELLED and the QUEUED FULL_SYNC job is CANCELLED (link 3)"
            - "exactly one TERMINAL_SYNC job exists in QUEUED for ${sub_id} (link 3)"
            - "summary.syndication_posture == SUSPENDED (link 4)"

      - name: price_change_event_job_regen_posture_flip
        grounds:
          - state_machines.SyndicationJob.QUEUED_to_SUPERSEDED
          - calculations.portal_display_price
          - entities.Listing.fields.syndication_posture
        distinguishing_aspect: |
          Trigger price-changes: price mutation appends a PRICE_CHANGE ListingEvent
          (link 1), the event causes per-subscription job regeneration — old QUEUED
          PRICE_UPDATE SUPERSEDED, new QUEUED with a fresh display-price snapshot
          (link 2) — and the new live job flips the derived posture SYNDICATED ->
          SYNDICATING (link 3); different trigger than withdraw.
        test_recipe:
          setup:
            - "ACTIVE listing price 50000000; subscription to portal (discount 0, increment 100000); FULL_SYNC dispatched and ACKED at delay 1800s so posture == SYNDICATED"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX" }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:00Z" }, as: MarketingDirector }
            - { call: "GET /feed-subscriptions/${sub_id}/jobs", payload: {}, as: MarketingCoordinator, captures: { fs_job: "$.data[0].id" } }
            - { call: "POST /feed-events/${fs_job}/ack", payload: {}, as: PortalWebhook }
          trigger:
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 49900000, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}", captures: { ev_seq: $.data.seq } }
            - { call: "GET /listings/${l_id}/feed-events", payload: {}, as: MarketingCoordinator }
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
          assert:
            - "Listing.list_price_cents == 49900000 and Listing.version == ${lv} + 1"
            - "PRICE_CHANGE ListingEvent new_price_cents == 49900000 (old 50000000)"
            - "a new PRICE_UPDATE job is QUEUED with payload_display_price_cents == 49900000 (link 2)"
            - "FULL_SYNC job ${fs_job} remains ACKED with propagation_delay_seconds == 1800"
            - "summary.syndication_posture == SYNDICATING (flipped from SYNDICATED, link 3)"

  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict — state vs business_constraint,
  # and business_safety vs business_temporal. Different category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_constraint_on_price_change
        grounds:
          - validations[priority=6]
          - validations[priority=15]
        distinguishing_aspect: |
          Pair state (p6) vs business_constraint (p15): a price change on a WITHDRAWN
          listing with a too-small delta violates both; the state error wins.
        test_recipe:
          setup:
            - "Listing activated then WITHDRAWN; current price 50000000"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
            - { call: "POST /listings/${l_id}/withdraw", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 50000100, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (state priority 6 beats business_constraint priority 15)"
            - "Listing.list_price_cents remains 50000000 and no PRICE_CHANGE event is appended"

      - name: safety_beats_temporal_on_relist
        grounds:
          - validations[priority=9]
          - validations[priority=16]
        distinguishing_aspect: |
          Pair business_safety (p9) vs business_temporal (p16): a relist 10 days into the
          30-day cooldown whose new remarks contain 'adults only' violates both; the
          fair-housing error wins — a different category pair than state vs constraint.
        test_recipe:
          setup:
            - "Listing activated then WITHDRAWN at 2026-08-01T00:00:00Z; clock advanced 10 days"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/withdraw", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: MarketingDirector }
          trigger:
            - { call: "POST /listings/${l_id}/relist", payload: { new_marketing_remarks: "Adults only community" }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FAIR_HOUSING_VIOLATION (safety priority 9 beats temporal priority 16)"
            - "Listing remains WITHDRAWN, relist_count == 0, no RelistRequest created"

  # ===========================================================================
  # Rule 6: boundary_precision_check — money-delta boundary on price-changes vs
  # seconds boundary on feed ack. Different metrics, different endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: price_change_minimum_delta_boundary
        grounds:
          - validations[priority=15]
          - errors[ERR_PRICE_CHANGE_TOO_SMALL]
        distinguishing_aspect: |
          Metric money (cents) on POST /listings/{id}/price-changes: delta exactly
          50000 cents passes (>=), delta 49999 cents with 0.12% is rejected.
        test_recipe:
          setup:
            - "ACTIVE listing price 40000000"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 40000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
          trigger:
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 40050000, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "GET /listings/${l_id}", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv2: $.data.version } }
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 40000001, expected_listing_version: "${lv2}" }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "first change (delta exactly 50000 cents) succeeds: price == 40050000"
            - "second change (delta 49999 cents, 0.12%) fails with ${err} == ERR_PRICE_CHANGE_TOO_SMALL"
            - "price remains 40050000 after the rejected change"

      - name: sla_breach_strict_greater_boundary
        grounds:
          - calculations.propagation_delay_audit
          - errors[ERR_JOB_NOT_DISPATCHED]
        distinguishing_aspect: |
          Metric seconds on POST /feed-events/{id}/ack: delay exactly == sla_seconds (3600)
          is NOT a breach (strictly-greater rule); delay 3601 IS. Different metric and
          endpoint than the price-delta boundary.
        test_recipe:
          setup:
            - "ACTIVE listing subscribed to portal sla 3600; FULL_SYNC dispatched at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX", sla_seconds: 3600 }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: MarketingDirector }
            - { call: "GET /feed-subscriptions/${sub_id}/jobs", payload: {}, as: MarketingCoordinator, captures: { job1: "$.data[0].id" } }
          trigger:
            - { call: "POST /feed-events/${job1}/ack", payload: {}, as: PortalWebhook }
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
            - { call: "PATCH /listings/${l_id}", payload: { expected_listing_version: "${lv}", marketing_remarks: "Freshly staged photos" }, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:01Z" }, as: MarketingDirector }
            - { call: "GET /listings/${l_id}/feed-events", payload: { job_type: "REMARKS_UPDATE" }, as: MarketingCoordinator, captures: { job2: "$.data[0].id" } }
            - { call: "POST /feed-events/${job2}/ack", payload: {}, as: PortalWebhook }
            - { call: "GET /listings/${l_id}/summary", payload: {}, as: MarketingCoordinator }
          assert:
            - "ack of ${job1}: propagation_delay_seconds == 3600 and audited_breach_count stays 0 (== sla is not a breach)"
            - "REMARKS_UPDATE job dispatched at 01:00:00 acked at 02:00:01 has delay 3601 -> audited_breach_count == 1"
            - "summary.syndication_posture == DEGRADED after the 3601s ack"

  # ===========================================================================
  # Rule 7: cross_entity_state_dependency — Listing<-ComplianceReview and
  # FeedSubscription<-PortalAccount. Different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activation_requires_latest_review_approved
        grounds:
          - state_machines.Listing.PENDING_REVIEW_to_ACTIVE
          - validations[priority=14]
        distinguishing_aspect: |
          Pair Listing <- ComplianceReview: activation is gated on the LATEST review of a
          different entity being APPROVED; a PENDING latest review blocks with
          ERR_COMPLIANCE_NOT_APPROVED.
        test_recipe:
          setup:
            - "Complete DRAFT listing with READY PHOTO; review submitted and still PENDING"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_COMPLIANCE_NOT_APPROVED"
            - "Listing.lifecycle_status remains PENDING_REVIEW"

      - name: subscription_requires_portal_active
        grounds:
          - state_machines.FeedSubscription
          - validations[priority=17]
        distinguishing_aspect: |
          Pair FeedSubscription <- PortalAccount: subscribing an ACTIVE listing to a
          SUSPENDED portal is rejected with ERR_PORTAL_NOT_ACTIVE — a different entity
          pair than Listing <- ComplianceReview.
        test_recipe:
          setup:
            - "ACTIVE listing; portal created then SUSPENDED"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX" }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /portal-accounts/${p_id}/suspend", payload: {}, as: MarketingDirector }
          trigger:
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PORTAL_NOT_ACTIVE"
            - "no FeedSubscription exists for (${l_id}, ${p_id})"

  # ===========================================================================
  # Rule 8: resource_temporal_overlap — half-open showing windows on Listing vs
  # closed + 15-minute-buffered blackout windows on PortalAccount. Different
  # interval semantics and different resource entities.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: showing_window_half_open_adjacency
        grounds:
          - validations[priority=19]
          - state_machines.ShowingWindow
        distinguishing_aspect: |
          Half-open [start, end) semantics on Listing's ShowingWindow: a window starting
          exactly when another ends is allowed, while a 30-minute interior intersection
          collides — adjacency-allowed semantics on the Listing resource.
        test_recipe:
          setup:
            - "ACTIVE listing; window W1 [2026-08-01T10:00, 11:00) exists"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/showing-windows", payload: { starts_at: "2026-08-01T10:00:00Z", ends_at: "2026-08-01T11:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /listings/${l_id}/showing-windows", payload: { starts_at: "2026-08-01T11:00:00Z", ends_at: "2026-08-01T12:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { w2: $.data.id } }
            - { call: "POST /listings/${l_id}/showing-windows", payload: { starts_at: "2026-08-01T10:30:00Z", ends_at: "2026-08-01T11:30:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "adjacent window [11:00, 12:00) is created (touching endpoints do not overlap)"
            - "overlapping window [10:30, 11:30) fails with ${err} == ERR_WINDOW_OVERLAP"
            - "listing has exactly 2 SCHEDULED windows"

      - name: blackout_closed_interval_with_buffer
        grounds:
          - state_machines.SyndicationJob.QUEUED_to_DISPATCHED
          - entities.BlackoutWindow
        distinguishing_aspect: |
          Closed interval plus 15-minute buffer semantics on PortalAccount blackout:
          dispatch at 11:45 (buffer start) and 13:15 (buffer end) is deferred, dispatch
          at 13:16 proceeds — different interval geometry (closed + buffer) and a
          different resource entity than the half-open showing windows.
        test_recipe:
          setup:
            - "ACTIVE listing subscribed to portal with blackout [2026-08-01T12:00, 13:00] declared; FULL_SYNC QUEUED"
            - "Buffered exclusion zone is [11:45, 13:15] closed"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX" }, as: MarketingDirector, captures: { p_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/feed-subscriptions", payload: { portal_account_id: "${p_id}" }, as: MarketingCoordinator, captures: { sub_id: $.data.id } }
            - { call: "POST /portal-accounts/${p_id}/blackout-windows", payload: { starts_at: "2026-08-01T12:00:00Z", ends_at: "2026-08-01T13:00:00Z" }, as: MarketingDirector }
            - { call: "GET /feed-subscriptions/${sub_id}/jobs", payload: {}, as: MarketingCoordinator, captures: { job_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T11:45:00Z" }, as: MarketingDirector }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T13:15:00Z" }, as: MarketingDirector }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T13:16:00Z" }, as: MarketingDirector }
            - { call: "POST /_sweeps/run", payload: {}, as: MarketingDirector }
          assert:
            - "sweep at 11:45 defers ${job_id} (buffer start is inside the closed buffered window)"
            - "sweep at 13:15 still defers ${job_id} (buffer end inclusive)"
            - "sweep at 13:16 dispatches ${job_id} with dispatched_at == 2026-08-01T13:16:00Z and attempt_count == 1"

  # ===========================================================================
  # Rule 9: compensating_invariant — price-vs-history-head equality, and
  # exactly-one-primary-photo count. Different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: price_history_head_revert_consistency
        grounds:
          - entities.ListingEvent
          - entities.Listing.fields.list_price_cents
        distinguishing_aspect: |
          Conserved quantity: Listing.list_price_cents always equals the new_price_cents
          of the PRICE_CHANGE ListingEvent with max seq; a forward change (50000000 ->
          48000000) plus its compensating revert (-> 50000000) leaves price and history
          head identical with zero drift and exactly 2 PRICE_CHANGE events.
        test_recipe:
          setup:
            - "ACTIVE listing price 50000000"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
          trigger:
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 48000000, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "GET /listings/${l_id}", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv2: $.data.version } }
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 50000000, expected_listing_version: "${lv2}" }, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "GET /listings/${l_id}/events", payload: { event_type: "PRICE_CHANGE" }, as: MarketingCoordinator }
          assert:
            - "Listing.list_price_cents == 50000000 after forward + compensating change"
            - "exactly 2 PRICE_CHANGE events exist; the max-seq one has new_price_cents == 50000000 == list_price_cents"
            - "events ordered by seq show new_price_cents [48000000, 50000000]"

      - name: single_primary_photo_swap_invariant
        grounds:
          - state_machines.MediaAsset.UPLOADED_to_READY
          - entities.MediaAsset.fields.is_primary
        distinguishing_aspect: |
          Conserved quantity: the count of READY PHOTO assets with is_primary == true per
          listing stays exactly 1 across a set-primary swap (set new compensates by
          unsetting old atomically) — a count invariant, different from the price-head
          equality invariant.
        test_recipe:
          setup:
            - "DRAFT listing with READY PHOTO A (auto-primary) and READY PHOTO B"
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/a.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { ma: $.data.id } }
            - { call: "POST /media-assets/${ma}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/b.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { mb: $.data.id } }
            - { call: "POST /media-assets/${mb}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /media-assets/${mb}/set-primary", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "GET /listings/${l_id}/media-assets", payload: { kind: "PHOTO" }, as: MarketingCoordinator }
          assert:
            - "before swap: ${ma}.is_primary == true and ${mb}.is_primary == false (auto-primary on first READY PHOTO)"
            - "after swap: ${mb}.is_primary == true and ${ma}.is_primary == false"
            - "count of READY PHOTO assets with is_primary == true is exactly 1 before and after the swap"
