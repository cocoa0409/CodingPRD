# =============================================================================
# Scaffold: Critic Accreditation, Score Computation & Verified Audience
# (Rotten Tomatoes-style aggregate review platform)
# =============================================================================

scenario: |
  Critic Accreditation, Score Computation & Verified Audience (Rotten Tomatoes):
  critic and publication accreditation criteria with periodic review and revocation,
  review ingestion with fresh or rotten classification from a written review and
  critic self-designation, score computation as a percentage of positive reviews
  with minimum review counts and certification thresholds, embargo handling where
  reviews appear only after a set time, audience score computation with verified
  ticket purchase requirements to reduce manipulation, review bombing detection
  and temporary rating suspension, title matching across releases, re-releases and
  different cuts, disputes from studios and critics over classification and score
  display.

domain_name: critic-accreditation-scores
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - scheduled_deferred_actions
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Publication
    parent: null
    common_fields: true
    fields:
      - { name: outlet_name, type: string, source: input, description: "Publication outlet name; unique across non-revoked publications" }
      - { name: reach_tier, type: enum, source: input, description: "NATIONAL | REGIONAL | NICHE — accreditation weight class" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCREDITED | PROBATION | REVOKED", default: PENDING }
      - { name: accredited_critic_count, type: integer, source: computed, description: "Count of linked Critics whose accreditation_status == ACCREDITED; incremented on critic ACCREDIT, decremented exactly once per critic on each revocation cascade, restored by REAPPLY + ACCREDIT" }

  - name: Critic
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Critic full name" }
      - { name: publication_id, type: string, source: input, description: "FK -> Publication.id; employing publication" }
      - { name: is_top_critic, type: boolean, source: input, description: "Top-critic designation used by certification rule", default: false }
      - { name: accreditation_status, type: enum, source: system, description: "APPLIED | ACCREDITED | UNDER_REVIEW | PROBATION | REVOKED", default: APPLIED }
      - { name: standing_score_bps, type: integer, source: computed, description: "Critic standing score in basis points 0..10000; recomputed by standing-score rules" }
      - { name: last_review_period_start, type: datetime, source: system, description: "Start instant of the most recent closed periodic accreditation review" }

  - name: AccreditationReview
    parent: null
    common_fields: true
    fields:
      - { name: subject_critic_id, type: string, source: input, description: "FK -> Critic.id; exactly one of subject_critic_id / subject_publication_id is set" }
      - { name: subject_publication_id, type: string, source: input, description: "FK -> Publication.id; exactly one of subject_critic_id / subject_publication_id is set" }
      - { name: period_start, type: datetime, source: input, description: "Review window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Review window end (exclusive); half-open [start, end)" }
      - { name: status, type: enum, source: system, description: "FILED | IN_REVIEW | UPHELD | REVOKED | DISMISSED", default: FILED }
      - { name: decision_note, type: string, source: input, description: "Decision rationale recorded at ruling" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: canonical_name, type: string, source: input, description: "Canonical title name" }
      - { name: release_year, type: integer, source: input, description: "Original release year" }
      - { name: posture, type: enum, source: system, description: "SETUP | OPEN | RETIRED", default: SETUP }

  - name: Release
    parent: Title
    common_fields: true
    fields:
      - { name: title_id, type: string, source: system, description: "FK -> Title.id; parent title" }
      - { name: cut_label, type: string, source: input, description: "Cut / release label, e.g. THEATRICAL, DIRECTORS_CUT, RERELEASE_2026" }
      - { name: theatrical_window_start, type: datetime, source: input, description: "Theatrical window start (inclusive, closed interval)" }
      - { name: theatrical_window_end, type: datetime, source: input, description: "Theatrical window end (inclusive, closed interval)" }
      - { name: embargo_until, type: datetime, source: input, description: "Critic reviews may not become PUBLISHED before this instant (half-open: publish allowed at exactly embargo_until)" }
      - { name: status, type: enum, source: system, description: "UPCOMING | OPEN | CLOSED", default: UPCOMING }
      - { name: audience_display_suspended, type: boolean, source: system, description: "True while a CONFIRMED bombing incident covers this release", default: false }
      - { name: tomatometer_pct, type: integer, source: computed, description: "Latest certified tomatometer percentage 0..100 or null when not computable" }
      - { name: audience_score_pct, type: integer, source: computed, description: "Latest verified audience percentage 0..100 or null when not computable" }
      - { name: certification, type: enum, source: computed, description: "NONE | CERTIFIED_FRESH | CERTIFIED_ROTTEN" }

  - name: CriticReview
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id; reviewed release" }
      - { name: critic_id, type: string, source: input, description: "FK -> Critic.id; authoring critic" }
      - { name: body_text, type: string, source: input, description: "Written review text" }
      - { name: self_designation, type: enum, source: input, description: "FRESH | ROTTEN — critic's own designation at ingestion" }
      - { name: classification, type: enum, source: system, description: "FRESH | ROTTEN — effective classification; equals self_designation at publish, may change via upheld dispute" }
      - { name: status, type: enum, source: system, description: "INGESTED | PUBLISHED | FLAGGED | WITHDRAWN", default: INGESTED }
      - { name: published_at, type: datetime, source: system, description: "Instant the review became PUBLISHED" }

  - name: AudienceMember
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email" }
      - { name: display_name, type: string, source: input, description: "Public display name" }
      - { name: account_created_at, type: datetime, source: system, description: "Account creation instant (equals created_at; used by bombing detection)" }

  - name: TicketVerification
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id; release the ticket admits to" }
      - { name: audience_member_id, type: string, source: input, description: "FK -> AudienceMember.id; ticket holder" }
      - { name: showtime_at, type: datetime, source: input, description: "Showtime instant; must fall inside the release theatrical window (closed interval)" }
      - { name: exhibitor_code, type: string, source: input, description: "Partner exhibitor identifier" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED", default: SUBMITTED }

  - name: AudienceRating
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id; rated release" }
      - { name: audience_member_id, type: string, source: input, description: "FK -> AudienceMember.id; rater" }
      - { name: stars, type: integer, source: input, description: "1..5 star rating" }
      - { name: ticket_verification_id, type: string, source: input, description: "FK -> TicketVerification.id; required for VERIFIED state" }
      - { name: status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | INVALIDATED", default: UNVERIFIED }

  - name: ScoreSnapshot
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id" }
      - { name: scope, type: enum, source: system, description: "TOMATOMETER | AUDIENCE_VERIFIED" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL | CERTIFIED for TOMATOMETER; ALL_RATINGS | VERIFIED_ONLY for AUDIENCE_VERIFIED" }
      - { name: positive_count, type: integer, source: system, description: "Positive reviews/ratings counted" }
      - { name: total_count, type: integer, source: system, description: "Total reviews/ratings counted in the snapshot input set" }
      - { name: pct, type: integer, source: system, description: "Computed percentage 0..100 (round_half_up)" }
      - { name: superseded, type: boolean, source: system, description: "True once a newer snapshot for the same release+scope+variant exists", default: false }

  - name: BombingIncident
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id" }
      - { name: detection_index_bps, type: integer, source: system, description: "Bombing detection index in basis points at open time" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED | RESOLVED", default: OPEN }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: subject_review_id, type: string, source: input, description: "FK -> CriticReview.id; set for CLASSIFICATION disputes" }
      - { name: subject_release_id, type: string, source: input, description: "FK -> Release.id; set for SCORE_DISPLAY disputes" }
      - { name: dispute_kind, type: enum, source: input, description: "CLASSIFICATION | SCORE_DISPLAY" }
      - { name: filed_by_critic_id, type: string, source: input, description: "FK -> Critic.id; set when the filer is a critic" }
      - { name: filed_by_studio, type: string, source: input, description: "Studio name when the filer is a studio representative" }
      - { name: requested_classification, type: enum, source: input, description: "FRESH | ROTTEN — only for CLASSIFICATION disputes" }
      - { name: status, type: enum, source: system, description: "FILED | TRIAGED | UPHELD | REJECTED", default: FILED }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Publication
    field: status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACCREDITED
        trigger: "POST /publications/{id}/transition (action=ACCREDIT)"
        actor: AccreditationBoard
        preconditions: []
        side_effects: []
      - from: ACCREDITED
        to: PROBATION
        trigger: "system (accreditation review UPHELD with revoke outcome=PROBATION is not used for publications; board places on probation)"
        actor: AccreditationBoard
        preconditions: []
        side_effects:
          - "Publication.accredited_critic_count recomputed (unchanged by itself)"
      - from: PROBATION
        to: ACCREDITED
        trigger: "POST /publications/{id}/transition (action=REINSTATE)"
        actor: AccreditationBoard
        preconditions: []
        side_effects: []
      - from: ACCREDITED
        to: REVOKED
        trigger: "system (AccreditationReview ruled REVOKED for this publication)"
        actor: system
        preconditions: []
        side_effects:
          - "Every linked Critic with accreditation_status ACCREDITED or PROBATION transitions to REVOKED (publication-level cascade)"
          - "Each such critic revocation fires the critic-revocation cascade (see Critic transitions)"
      - from: PROBATION
        to: REVOKED
        trigger: "system (AccreditationReview ruled REVOKED for this publication)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as ACCREDITED -> REVOKED"

  - entity: Critic
    field: accreditation_status
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: ACCREDITED
        trigger: "POST /critics/{id}/transition (action=ACCREDIT)"
        actor: AccreditationBoard
        preconditions:
          - "Employing Publication.status is ACCREDITED (ERR_PUBLICATION_NOT_ACCREDITED)"
        side_effects:
          - "Publication.accredited_critic_count incremented"
      - from: ACCREDITED
        to: UNDER_REVIEW
        trigger: "POST /accreditation-reviews (subject_critic_id=this critic)"
        actor: AccreditationBoard
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ACCREDITED
        trigger: "system (AccreditationReview ruled DISMISSED or UPHELD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REVOKED
        trigger: "system (AccreditationReview ruled REVOKED for this critic)"
        actor: system
        preconditions: []
        side_effects:
          - "Publication.accredited_critic_count decremented"
          - "Every CriticReview by this critic in status PUBLISHED or FLAGGED is marked de-accredited for scoring: recompute tomatometer_score and certification for each affected Release (each recompute emits new ScoreSnapshots superseding prior ones)"
      - from: ACCREDITED
        to: REVOKED
        trigger: "system (employing Publication revoked)"
        actor: system
        preconditions: []
        side_effects:
          - "Same review de-accreditation cascade as UNDER_REVIEW -> REVOKED"
      - from: PROBATION
        to: REVOKED
        trigger: "system (employing Publication revoked)"
        actor: system
        preconditions: []
        side_effects:
          - "Same review de-accreditation cascade as UNDER_REVIEW -> REVOKED"
      - from: REVOKED
        to: APPLIED
        trigger: "POST /critics/{id}/transition (action=REAPPLY)"
        actor: Critic
        preconditions: []
        side_effects: []
        note: "Re-application cycle: REVOKED -> APPLIED -> ACCREDITED is allowed; REVOKED is not terminal for Critic."
      - from: ACCREDITED
        to: PROBATION
        trigger: "POST /critics/{id}/transition (action=PROBATE)"
        actor: AccreditationBoard
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: ACCREDITED
        trigger: "POST /critics/{id}/transition (action=REINSTATE)"
        actor: AccreditationBoard
        preconditions: []
        side_effects:
          - "Every CriticReview by this critic in status PUBLISHED or FLAGGED is marked accredited for scoring again: recompute tomatometer_score and certification for each affected Release"

  - entity: AccreditationReview
    field: status
    initial_state: FILED
    terminal_states: [UPHELD, REVOKED, DISMISSED]
    transitions:
      - from: FILED
        to: IN_REVIEW
        trigger: "POST /accreditation-reviews/{id}/transition (action=BEGIN_REVIEW)"
        actor: AccreditationBoard
        preconditions:
          - "Review window [period_start, period_end) does not overlap (half-open intersection) any other non-DISMISSED AccreditationReview for the same subject (ERR_ACC_REVIEW_PERIOD_OVERLAP)"
        side_effects: []
      - from: IN_REVIEW
        to: UPHELD
        trigger: "POST /accreditation-reviews/{id}/transition (action=RULE_UPHOLD)"
        actor: AccreditationBoard
        preconditions: []
        side_effects:
          - "Subject Critic: accreditation_status -> ACCREDITED; standing_score_bps recomputed (final variant)"
          - "Subject Critic.last_review_period_start = period_start"
      - from: IN_REVIEW
        to: REVOKED
        trigger: "POST /accreditation-reviews/{id}/transition (action=RULE_REVOKE)"
        actor: AccreditationBoard
        preconditions: []
        side_effects:
          - "Subject Critic or Publication transitions to REVOKED with full cascades (see Critic / Publication transitions)"
      - from: IN_REVIEW
        to: DISMISSED
        trigger: "POST /accreditation-reviews/{id}/transition (action=DISMISS)"
        actor: AccreditationBoard
        preconditions: []
        side_effects:
          - "Subject Critic (if UNDER_REVIEW because of this review) -> ACCREDITED"

  - entity: Title
    field: posture
    initial_state: SETUP
    terminal_states: [RETIRED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "PATCH /titles/{id} (posture=OPEN)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RETIRED
        trigger: "PATCH /titles/{id} (posture=RETIRED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Release
    field: status
    initial_state: UPCOMING
    terminal_states: [CLOSED]
    transitions:
      - from: UPCOMING
        to: OPEN
        trigger: "POST /releases/{id}/transition (action=OPEN)"
        actor: PlatformAdmin
        preconditions:
          - "Parent Title.posture == OPEN (ERR_TITLE_NOT_OPEN)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /releases/{id}/transition (action=CLOSE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: CriticReview
    field: status
    initial_state: INGESTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: INGESTED
        to: PUBLISHED
        trigger: "POST /reviews/{id}/transition (action=PUBLISH)"
        actor: Critic
        preconditions:
          - "Acting critic is the review author (ERR_FORBIDDEN)"
          - "Critic.accreditation_status is ACCREDITED or PROBATION (ERR_CRITIC_NOT_ACCREDITED)"
          - "Release.status == OPEN (ERR_INVALID_STATE)"
          - "Logical clock >= Release.embargo_until (ERR_EMBARGO_ACTIVE)"
          - "classification set to self_designation"
        side_effects:
          - "published_at set to current logical clock"
          - "Recompute tomatometer_score (provisional + certified) for the release; new ScoreSnapshots supersede prior ones; Release.tomatometer_pct and certification updated"
      - from: PUBLISHED
        to: FLAGGED
        trigger: "POST /disputes (dispute_kind=CLASSIFICATION, subject_review_id=this review)"
        actor: "Critic or StudioRep"
        preconditions: []
        side_effects: []
      - from: FLAGGED
        to: PUBLISHED
        trigger: "system (classification Dispute REJECTED, or UPHELD with classification unchanged)"
        actor: system
        preconditions: []
        side_effects:
          - "If dispute UPHELD with requested_classification != classification: classification := requested_classification and recompute tomatometer_score + certification for the release"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /reviews/{id}/transition (action=WITHDRAW)"
        actor: Critic
        preconditions:
          - "Acting critic is the review author (ERR_FORBIDDEN)"
        side_effects:
          - "Recompute tomatometer_score (provisional + certified) and certification; new ScoreSnapshots supersede prior ones"
      - from: FLAGGED
        to: WITHDRAWN
        trigger: "POST /reviews/{id}/transition (action=WITHDRAW)"
        actor: Critic
        preconditions:
          - "Acting critic is the review author (ERR_FORBIDDEN)"
          - "Any FILED or TRIAGED CLASSIFICATION dispute on this review is auto-REJECTED (moot)"
        side_effects:
          - "Recompute tomatometer_score and certification"

  - entity: TicketVerification
    field: status
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ticket-verifications/{id}/transition (action=VERIFY)"
        actor: PlatformAdmin
        preconditions:
          - "showtime_at falls inside [Release.theatrical_window_start, Release.theatrical_window_end] closed interval (ERR_VERIFICATION_WINDOW_MISS)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ticket-verifications/{id}/transition (action=REJECT)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: AudienceRating
    field: status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /audience-ratings/{id}/transition (action=VERIFY)"
        actor: AudienceMember
        preconditions:
          - "Acting audience member owns the rating (ERR_FORBIDDEN)"
          - "ticket_verification_id references a TicketVerification in status VERIFIED for the same release and same audience_member_id (ERR_TICKET_NOT_VERIFIED)"
        side_effects:
          - "Recompute audience_score (verified variant) for the release; new ScoreSnapshots supersede prior ones; Release.audience_score_pct updated"
      - from: VERIFIED
        to: INVALIDATED
        trigger: "system (bombing incident CONFIRMED marks in-window ratings INVALIDATED) or POST /audience-ratings/{id}/transition (action=INVALIDATE) by PlatformAdmin"
        actor: "system or PlatformAdmin"
        preconditions: []
        side_effects:
          - "Recompute audience_score (verified variant); Release.audience_score_pct updated"
      - from: UNVERIFIED
        to: INVALIDATED
        trigger: "POST /audience-ratings/{id}/transition (action=INVALIDATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: BombingIncident
    field: status
    initial_state: OPEN
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /bombing-incidents/{id}/transition (action=CONFIRM)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Release.audience_display_suspended := true"
          - "Audience ratings created within the incident window are INVALIDATED (see bombing_detection constants)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /bombing-incidents/{id}/transition (action=DISMISS)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /bombing-incidents/{id}/transition (action=RESOLVE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Release.audience_display_suspended := false"
          - "Recompute audience_score (verified variant); Release.audience_score_pct updated"

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: FILED
        to: TRIAGED
        trigger: "POST /disputes/{id}/transition (action=TRIAGE)"
        actor: AccreditationBoard
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: FILED
        trigger: "POST /disputes/{id}/transition (action=RETURN)"
        actor: AccreditationBoard
        preconditions: []
        side_effects: []
        note: "Branching with revert: TRIAGED -> FILED allowed for re-triage loops."
      - from: TRIAGED
        to: UPHELD
        trigger: "POST /disputes/{id}/transition (action=RULE_UPHOLD)"
        actor: AccreditationBoard
        preconditions:
          - "CLASSIFICATION: subject review in status FLAGGED; requested_classification present"
        side_effects:
          - "CLASSIFICATION: CriticReview.classification := requested_classification; review -> PUBLISHED; recompute tomatometer_score + certification for the release (cascade emits new ScoreSnapshots)"
          - "SCORE_DISPLAY: force a score-recalculation for the subject release (new ScoreSnapshots supersede prior ones; Release.tomatometer_pct / audience_score_pct refreshed)"
      - from: TRIAGED
        to: REJECTED
        trigger: "POST /disputes/{id}/transition (action=RULE_REJECT)"
        actor: AccreditationBoard
        preconditions: []
        side_effects:
          - "CLASSIFICATION: subject review -> PUBLISHED (classification unchanged)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: score-recalc-stale-release
    parent_entity: Release
    write_endpoint: "POST /releases/{id}/score-recalculation"
    occ_field: "expected_release_version"
    description: |
      Requesting a manual score recalculation against a Release whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just changed review composition (which
      legitimately supersedes the client's view of the score input set) and the
      current writer's view of the release is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: dispute-ruling-stale-dispute
    parent_entity: Dispute
    write_endpoint: "POST /disputes/{id}/transition"
    occ_field: "expected_dispute_version"
    description: |
      Ruling (RULE_UPHOLD / RULE_REJECT) a Dispute whose version has advanced
      since the board member last observed it is rejected. This captures the
      case where another ruling action has already been applied and the current
      member's view of the dispute is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tomatometer_score
    trigger: "CriticReview publish / withdraw / reclassification; critic revocation or reinstatement cascade; SCORE_DISPLAY dispute upheld; manual score-recalculation"
    algorithm: aggregation
    formula: |
      Input set (PROVISIONAL variant): all CriticReviews on the release with
      status PUBLISHED or FLAGGED (WITHDRAWN excluded).
      Input set (CERTIFIED variant): same, but additionally the review's
      critic.accreditation_status must be ACCREDITED or PROBATION at compute time.
      pct = round_half_up(100 * count(classification == FRESH) / total_count)
      total_count == 0 -> pct is null (not computable; ERR_SCORE_NOT_COMPUTABLE
      on score read surfaces pct: null, never 0).
      Each recompute appends a new ScoreSnapshot(scope=TOMATOMETER, variant) and
      marks the previous same-scope+variant snapshot superseded=true.
    input_set: "CriticReview rows for the release filtered by variant rules"
    constants:
      ROUND: round_half_up
    precision: "integer percent, round_half_up"
    variants:
      - name: provisional
        when: "always computed; powers the pre-certification display"
        difference: "includes reviews by REVOKED critics and reviews whose critic is UNDER_REVIEW; no minimum-count gate"
      - name: certified
        when: "powers certification decision and certified display"
        difference: "excludes reviews whose critic is not ACCREDITED/PROBATION at compute time; feeds certification_status"

  - name: certification_status
    trigger: "after every tomatometer_score (certified variant) recompute"
    algorithm: threshold
    formula: |
      Let N = total_count of the CERTIFIED tomatometer snapshot,
          P = its pct,
          T = count of top-critic reviews (critic.is_top_critic == true) in the
              CERTIFIED input set.
      Evaluation order is pinned (circular-looking dependency resolved):
        1. Compute N, P, T from the CERTIFIED input set.
        2. Gate 1: if N < MIN_REVIEWS_CERTIFIED -> certification = NONE (stop).
        3. Gate 2: if T < MIN_TOP_CRITIC_REVIEWS -> certification = NONE (stop).
        4. Gate 3: P >= CERTIFIED_FRESH_PCT -> CERTIFIED_FRESH;
                   P <= CERTIFIED_ROTTEN_PCT -> CERTIFIED_ROTTEN;
                   else NONE.
      Boundaries are inclusive exactly as written (>= and <=).
      Because accreditation changes alter the CERTIFIED input set (step 1) and
      the score alters certification (step 4), the evaluation order above is the
      ONLY sanctioned order; do not interleave.
    input_set: "CERTIFIED tomatometer snapshot for the release"
    constants:
      MIN_REVIEWS_CERTIFIED: 5
      MIN_TOP_CRITIC_REVIEWS: 2
      CERTIFIED_FRESH_PCT: 75
      CERTIFIED_ROTTEN_PCT: 60
    precision: "integer comparisons on round_half_up percent"
    variants: []

  - name: audience_score
    trigger: "AudienceRating create / verify / invalidate; bombing incident resolve; SCORE_DISPLAY dispute upheld"
    algorithm: weighted_scoring
    formula: |
      Verified variant (powers Release.audience_score_pct):
        Input set: AudienceRating rows on the release with status VERIFIED.
        positive = count(stars >= POSITIVE_STAR_THRESHOLD)
        pct = round_half_up(100 * positive / count)
      All-ratings variant (reference only):
        Input set: status VERIFIED or UNVERIFIED.
      Rounding order is pinned (nested rounding):
        1. Compute per-star-bucket counts as integers (no rounding).
        2. Form the single ratio positive/count as exact rational.
        3. Round ONCE to integer percent with round_half_up.
        (Per-bucket pre-rounding is FORBIDDEN: it drifts the total.)
      count == 0 -> pct null.
      While Release.audience_display_suspended is true, the score is still
      computed but GET /releases/{id}/score reports audience_display = "SUSPENDED"
      and omits audience_score_pct.
    input_set: "AudienceRating rows for the release filtered by variant"
    constants:
      POSITIVE_STAR_THRESHOLD: 4
      ROUND: round_half_up
    precision: "integer percent, round_half_up, single final rounding"
    variants:
      - name: verified_only
        when: "powers the public audience score"
        difference: "only VERIFIED ratings counted"
      - name: all_ratings
        when: "diagnostic variant surfaced on the score endpoint for comparison"
        difference: "VERIFIED + UNVERIFIED counted; can diverge sharply under manipulation"

  - name: bombing_detection_index
    trigger: "POST /releases/{id}/bombing-incidents (index computed at open time)"
    algorithm: threshold
    formula: |
      Computed over the trailing DETECTION_WINDOW_HOURS hours ending at the
      logical clock (half-open [now - window, now)):
        V = count of AudienceRating rows created in window (any status)
        N = count of those whose AudienceMember.account_created_at falls inside
            the same window (new-account share numerator)
        S = count of those with stars <= NEGATIVE_STAR_MAX
      index_bps = min(10000,
                      VELOCITY_WEIGHT * V
                      + NEW_ACCOUNT_WEIGHT * round_half_up(100 * N / max(V,1))
                      + NEG_SKEW_WEIGHT * round_half_up(100 * S / max(V,1)))
      Non-linear interaction: three inputs combined through a capped weighted
      sum with nested min() and max(); each ratio rounded to integer percent
      BEFORE weighting (order pinned here).
      Incident auto-flag: index_bps >= BOMBING_THRESHOLD_BPS marks the created
      incident auto_flagged (informational; status stays OPEN until PlatformAdmin
      confirms).
    input_set: "AudienceRating rows for the release created in the trailing window"
    constants:
      DETECTION_WINDOW_HOURS: 24
      VELOCITY_WEIGHT: 20
      NEW_ACCOUNT_WEIGHT: 40
      NEG_SKEW_WEIGHT: 30
      NEGATIVE_STAR_MAX: 2
      BOMBING_THRESHOLD_BPS: 6000
    precision: "basis points, round_half_up per ratio before weighting"
    variants: []

  - name: critic_standing_score
    trigger: "AccreditationReview ruled UPHELD (final) or periodic preview requested (provisional)"
    algorithm: decay_function
    formula: |
      Final variant (on AccreditationReview UPHELD, over the review window
      [period_start, period_end), half-open):
        R = reviews by the critic with published_at inside the window
        upheld_disputes = Disputes UPHELD against those reviews (classification changed)
        base = 10000 - DISPUTE_PENALTY_BPS * upheld_disputes
        standing = max(0, min(10000, base))
      Provisional variant (preview, over the trailing 365 days ending at logical clock):
        Same shape, but disputed reviews still in FLAGGED state count as
        PENDING_PENALTY_BPS each instead of DISPUTE_PENALTY_BPS.
      The two variants produce different scores for the same critic whenever
      pending disputes exist; the final variant is authoritative at ruling time.
    input_set: "CriticReview + Dispute rows for the critic in the window"
    constants:
      DISPUTE_PENALTY_BPS: 1500
      PENDING_PENALTY_BPS: 500
    precision: "basis points integer"
    variants:
      - name: provisional
        when: "trailing-365-day preview at review filing"
        difference: "FLAGGED reviews penalised at PENDING_PENALTY_BPS"
      - name: final
        when: "AccreditationReview UPHELD ruling"
        difference: "only UPHELD disputes penalised at DISPUTE_PENALTY_BPS; window is the review window, not trailing 365d"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles and §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: business_constraint
    check: "Required fields present; enum values valid; stars within 1..5; exactly one of subject_critic_id / subject_publication_id on AccreditationReview; dispute filer consistent with dispute_kind"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"
  - priority: 5
    category: state
    check: "Target entity in a state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /releases/{id}/score-recalculation, POST /disputes/{id}/transition"
  - priority: 7
    category: business_temporal
    check: "Review PUBLISH: logical clock >= Release.embargo_until (publish at exactly embargo_until is allowed)"
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 409
    applies_to: "POST /reviews/{id}/transition (action=PUBLISH)"
  - priority: 8
    category: business_referential
    check: "Review PUBLISH/ingest: critic.accreditation_status in {ACCREDITED, PROBATION}"
    error_id: ERR_CRITIC_NOT_ACCREDITED
    http_status: 409
    applies_to: "POST /releases/{id}/reviews, POST /reviews/{id}/transition"
  - priority: 9
    category: business_referential
    check: "Critic ACCREDIT: employing Publication.status == ACCREDITED"
    error_id: ERR_PUBLICATION_NOT_ACCREDITED
    http_status: 409
    applies_to: "POST /critics/{id}/transition (action=ACCREDIT)"
  - priority: 10
    category: business_constraint
    check: "At most one non-WITHDRAWN CriticReview per (critic, release)"
    error_id: ERR_DUPLICATE_REVIEW
    http_status: 409
    applies_to: "POST /releases/{id}/reviews"
  - priority: 11
    category: business_temporal
    check: "TicketVerification VERIFY: showtime_at within [theatrical_window_start, theatrical_window_end] closed interval (both endpoints inclusive)"
    error_id: ERR_VERIFICATION_WINDOW_MISS
    http_status: 409
    applies_to: "POST /ticket-verifications/{id}/transition (action=VERIFY)"
  - priority: 12
    category: business_referential
    check: "AudienceRating VERIFY: ticket_verification_id is a VERIFIED TicketVerification for the same release and the same audience_member_id"
    error_id: ERR_TICKET_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /audience-ratings/{id}/transition (action=VERIFY)"
  - priority: 13
    category: business_constraint
    check: "At most one non-INVALIDATED AudienceRating per (audience_member, release)"
    error_id: ERR_DUPLICATE_VERIFIED_RATING
    http_status: 409
    applies_to: "POST /releases/{id}/audience-ratings"
  - priority: 14
    category: business_temporal
    check: "AccreditationReview BEGIN_REVIEW: [period_start, period_end) must not half-open-overlap another non-DISMISSED review for the same subject; adjacency (end == other start) is NOT overlap"
    error_id: ERR_ACC_REVIEW_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /accreditation-reviews/{id}/transition (action=BEGIN_REVIEW)"
  - priority: 15
    category: business_safety
    check: "AudienceRating VERIFY while Release.audience_display_suspended is true (a CONFIRMED BombingIncident covers the release) is rejected; UNVERIFIED ratings may still be created but are INVALIDATED by the incident"
    error_id: ERR_BOMBING_SUSPENSION_ACTIVE
    http_status: 409
    applies_to: "POST /audience-ratings/{id}/transition (action=VERIFY)"
  - priority: 16
    category: state
    check: "Dispute rulings only from TRIAGED; terminal disputes reject all actions"
    error_id: ERR_DISPUTE_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /disputes/{id}/transition"
  - priority: 17
    category: business_constraint
    check: "CLASSIFICATION dispute: requested_classification must differ from the review's current classification and must be FRESH or ROTTEN"
    error_id: ERR_INVALID_RECLASSIFICATION
    http_status: 400
    applies_to: "POST /disputes"
  - priority: 18
    category: business_safety
    check: "Segregation of duties: a critic may not file a CLASSIFICATION dispute on their OWN review (filed_by_critic_id == review.critic_id); studio disputes are unaffected"
    error_id: ERR_SELF_DISPUTE_FORBIDDEN
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 19
    category: business_fiscal
    check: "Score read when the relevant input set is empty reports pct null; it is never reported as 0"
    error_id: ERR_SCORE_NOT_COMPUTABLE
    http_status: 409
    applies_to: "POST /releases/{id}/score-recalculation (when asked to persist a snapshot from an empty input set)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock set; embargo and window checks now evaluate against the new instant"]

  # --- Publication ---
  - method: POST
    path: "/publications"
    description: "Create a publication (status PENDING)"
    roles: [PlatformAdmin]
    code: 201
    input: [outlet_name, reach_tier]
    output: Publication
    side_effects: []
  - method: GET
    path: "/publications/{id}"
    description: "Get a publication"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: []
    output: Publication
    side_effects: []
  - method: POST
    path: "/publications/{id}/transition"
    description: "Publication accreditation transitions (ACCREDIT, PROBATE, REINSTATE)"
    roles: [AccreditationBoard]
    code: 200
    input: [action]
    output: Publication
    side_effects: ["Status transition per Publication state machine"]
  - method: GET
    path: "/publications/{id}/critics"
    description: "List critics of a publication (reverse reachability for Critic.publication_id)"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: []
    output: Critic[]
    side_effects: []

  # --- Critic ---
  - method: POST
    path: "/critics"
    description: "Create a critic (accreditation_status APPLIED)"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, publication_id, "is_top_critic?"]
    output: Critic
    side_effects: []
  - method: GET
    path: "/critics/{id}"
    description: "Get a critic"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: []
    output: Critic
    side_effects: []
  - method: POST
    path: "/critics/{id}/transition"
    description: "Critic accreditation transitions (ACCREDIT, PROBATE, REINSTATE by board; REAPPLY by the critic themselves)"
    roles: [AccreditationBoard, Critic]
    code: 200
    input: [action]
    output: Critic
    side_effects: ["Status transition per Critic state machine; revocation/reinstatement cascades recompute affected release scores"]

  # --- AccreditationReview ---
  - method: POST
    path: "/accreditation-reviews"
    description: "File a periodic accreditation review for a critic or publication"
    roles: [AccreditationBoard]
    code: 201
    input: ["subject_critic_id?", "subject_publication_id?", period_start, period_end, "decision_note?"]
    output: AccreditationReview
    side_effects: ["Subject critic (if any, and ACCREDITED) -> UNDER_REVIEW"]
  - method: GET
    path: "/accreditation-reviews"
    description: "List accreditation reviews, filterable by subject (reverse reachability for AccreditationReview FKs)"
    roles: [PlatformAdmin, AccreditationBoard]
    code: 200
    input: ["subject_critic_id?", "subject_publication_id?"]
    output: AccreditationReview[]
    side_effects: []
  - method: GET
    path: "/accreditation-reviews/{id}"
    description: "Get an accreditation review"
    roles: [PlatformAdmin, AccreditationBoard]
    code: 200
    input: []
    output: AccreditationReview
    side_effects: []
  - method: POST
    path: "/accreditation-reviews/{id}/transition"
    description: "Review workflow (BEGIN_REVIEW, RULE_UPHOLD, RULE_REVOKE, DISMISS)"
    roles: [AccreditationBoard]
    code: 200
    input: [action, "decision_note?"]
    output: AccreditationReview
    side_effects: ["Rulings fire the subject cascades defined in the AccreditationReview state machine"]

  # --- Title ---
  - method: POST
    path: "/titles"
    description: "Create a title (posture SETUP)"
    roles: [PlatformAdmin]
    code: 201
    input: [canonical_name, release_year]
    output: Title
    side_effects: []
  - method: PATCH
    path: "/titles/{id}"
    description: "Update title posture (SETUP -> OPEN -> RETIRED)"
    roles: [PlatformAdmin]
    code: 200
    input: [posture]
    output: Title
    side_effects: ["Posture transition per Title state machine"]
  - method: POST
    path: "/titles/{id}/releases"
    description: "Create a release/cut under a title (status UPCOMING). Re-releases and different cuts are separate Release rows under the same Title."
    roles: [PlatformAdmin]
    code: 201
    input: [cut_label, theatrical_window_start, theatrical_window_end, embargo_until]
    output: Release
    side_effects: ["Initial ScoreSnapshots are NOT created; scores remain null until input sets are non-empty"]

  # --- Release ---
  - method: GET
    path: "/releases"
    description: "List releases, filterable by title (reverse reachability for Release.title_id)"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: ["title_id?"]
    output: Release[]
    side_effects: []
  - method: GET
    path: "/releases/{id}"
    description: "Get a release (includes tomatometer_pct, audience_score_pct, certification, audience_display_suspended)"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: []
    output: Release
    side_effects: []
  - method: POST
    path: "/releases/{id}/transition"
    description: "Release lifecycle (OPEN, CLOSE)"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: Release
    side_effects: []
  - method: POST
    path: "/releases/{id}/score-recalculation"
    description: "Force a score recalculation; OCC on expected_release_version"
    roles: [AccreditationBoard, PlatformAdmin]
    code: 200
    input: [expected_release_version]
    output: Release
    side_effects: ["Recompute tomatometer + audience scores; new ScoreSnapshots supersede prior ones; increments Release.version by 1"]
  - method: GET
    path: "/releases/{id}/score-snapshots"
    description: "List score snapshots for a release (reverse reachability for ScoreSnapshot.release_id)"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: []
    output: ScoreSnapshot[]
    side_effects: []
  - method: GET
    path: "/releases/{id}/bombing-incidents"
    description: "List bombing incidents for a release (reverse reachability for BombingIncident.release_id)"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: []
    output: BombingIncident[]
    side_effects: []

  # --- CriticReview ---
  - method: POST
    path: "/releases/{id}/reviews"
    description: "Ingest a critic review (status INGESTED)"
    roles: [Critic]
    code: 201
    input: [critic_id, body_text, self_designation]
    output: CriticReview
    side_effects: ["critic_id must equal X-User-ID (ERR_FORBIDDEN otherwise)"]
  - method: GET
    path: "/reviews"
    description: "List critic reviews, filterable by release and critic (reverse reachability for CriticReview.release_id and CriticReview.critic_id)"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: ["release_id?", "critic_id?"]
    output: CriticReview[]
    side_effects: []
  - method: GET
    path: "/reviews/{id}"
    description: "Get a critic review"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep, AudienceMember]
    code: 200
    input: []
    output: CriticReview
    side_effects: []
  - method: POST
    path: "/reviews/{id}/transition"
    description: "Review lifecycle (PUBLISH, WITHDRAW)"
    roles: [Critic]
    code: 200
    input: [action]
    output: CriticReview
    side_effects: ["Transitions per CriticReview state machine; publishes/withdrawals recompute release scores"]

  # --- AudienceMember ---
  - method: POST
    path: "/audience-members"
    description: "Register an audience member"
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: AudienceMember
    side_effects: ["account_created_at set to logical clock"]

  # --- TicketVerification ---
  - method: POST
    path: "/releases/{id}/ticket-verifications"
    description: "Submit a ticket verification (status SUBMITTED)"
    roles: [AudienceMember]
    code: 201
    input: [audience_member_id, showtime_at, exhibitor_code]
    output: TicketVerification
    side_effects: ["audience_member_id must equal X-User-ID (ERR_FORBIDDEN otherwise)"]
  - method: GET
    path: "/ticket-verifications"
    description: "List ticket verifications, filterable by release and member (reverse reachability for TicketVerification FKs)"
    roles: [PlatformAdmin, AccreditationBoard, AudienceMember]
    code: 200
    input: ["release_id?", "audience_member_id?"]
    output: TicketVerification[]
    side_effects: []
  - method: GET
    path: "/ticket-verifications/{id}"
    description: "Get a ticket verification"
    roles: [PlatformAdmin, AccreditationBoard, AudienceMember]
    code: 200
    input: []
    output: TicketVerification
    side_effects: []
  - method: POST
    path: "/ticket-verifications/{id}/transition"
    description: "Ticket verification workflow (VERIFY, REJECT)"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: TicketVerification
    side_effects: ["VERIFY enforces the closed theatrical-window check (ERR_VERIFICATION_WINDOW_MISS)"]

  # --- AudienceRating ---
  - method: POST
    path: "/releases/{id}/audience-ratings"
    description: "Create an audience rating (status UNVERIFIED)"
    roles: [AudienceMember]
    code: 201
    input: [audience_member_id, stars, "ticket_verification_id?"]
    output: AudienceRating
    side_effects: ["audience_member_id must equal X-User-ID; all-ratings variant recomputed"]
  - method: GET
    path: "/audience-ratings"
    description: "List audience ratings, filterable by release, member and ticket verification (reverse reachability for AudienceRating FKs)"
    roles: [PlatformAdmin, AccreditationBoard, AudienceMember]
    code: 200
    input: ["release_id?", "audience_member_id?", "ticket_verification_id?"]
    output: AudienceRating[]
    side_effects: []
  - method: GET
    path: "/audience-ratings/{id}"
    description: "Get an audience rating"
    roles: [PlatformAdmin, AccreditationBoard, AudienceMember]
    code: 200
    input: []
    output: AudienceRating
    side_effects: []
  - method: POST
    path: "/audience-ratings/{id}/transition"
    description: "Rating lifecycle (VERIFY by owner, INVALIDATE by PlatformAdmin)"
    roles: [AudienceMember, PlatformAdmin]
    code: 200
    input: [action, "ticket_verification_id?"]
    output: AudienceRating
    side_effects: ["VERIFY/INVALIDATE recompute the verified audience score; Release.audience_score_pct updated"]

  # --- BombingIncident ---
  - method: POST
    path: "/releases/{id}/bombing-incidents"
    description: "Open a review-bombing incident; detection index computed at open time"
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: BombingIncident
    side_effects: ["detection_index_bps computed per bombing_detection_index"]
  - method: POST
    path: "/bombing-incidents/{id}/transition"
    description: "Incident workflow (CONFIRM, DISMISS, RESOLVE)"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: BombingIncident
    side_effects: ["CONFIRM suspends audience display + invalidates in-window ratings; RESOLVE lifts suspension and recomputes"]

  # --- Dispute ---
  - method: POST
    path: "/disputes"
    description: "File a dispute (CLASSIFICATION against a review, or SCORE_DISPLAY against a release)"
    roles: [Critic, StudioRep]
    code: 201
    input: [dispute_kind, "subject_review_id?", "subject_release_id?", "filed_by_critic_id?", "filed_by_studio?", "requested_classification?"]
    output: Dispute
    side_effects: ["CLASSIFICATION: subject review PUBLISHED -> FLAGGED"]
  - method: GET
    path: "/disputes"
    description: "List disputes, filterable by subject review, subject release and filing critic (reverse reachability for Dispute FKs)"
    roles: [PlatformAdmin, AccreditationBoard]
    code: 200
    input: ["subject_review_id?", "subject_release_id?", "filed_by_critic_id?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/disputes/{id}"
    description: "Get a dispute"
    roles: [PlatformAdmin, AccreditationBoard, Critic, StudioRep]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/transition"
    description: "Dispute workflow (TRIAGE, RETURN, RULE_UPHOLD, RULE_REJECT); ruling actions require expected_dispute_version (OCC)"
    roles: [AccreditationBoard]
    code: 200
    input: [action, "expected_dispute_version?"]
    output: Dispute
    side_effects: ["Rulings fire the review/score cascades per the Dispute state machine; increments Dispute.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed caller is not the owner/author of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or malformed body" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that admits the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version" }
  - { id: ERR_TITLE_NOT_OPEN, http: 409, condition: "Release OPEN requires parent Title.posture == OPEN" }
  - { id: ERR_EMBARGO_ACTIVE, http: 409, condition: "Review publish attempted before Release.embargo_until" }
  - { id: ERR_CRITIC_NOT_ACCREDITED, http: 409, condition: "Critic is not ACCREDITED/PROBATION for review ingestion or publish" }
  - { id: ERR_PUBLICATION_NOT_ACCREDITED, http: 409, condition: "Critic accreditation requires employing publication to be ACCREDITED" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "Critic already has a non-WITHDRAWN review on this release" }
  - { id: ERR_VERIFICATION_WINDOW_MISS, http: 409, condition: "Showtime outside the release theatrical window (closed interval)" }
  - { id: ERR_TICKET_NOT_VERIFIED, http: 409, condition: "Rating verification requires a VERIFIED ticket verification matching release and member" }
  - { id: ERR_DUPLICATE_VERIFIED_RATING, http: 409, condition: "Audience member already has a non-INVALIDATED rating on this release" }
  - { id: ERR_BOMBING_SUSPENSION_ACTIVE, http: 409, condition: "Verified-path rating rejected while a CONFIRMED bombing incident suspends the release" }
  - { id: ERR_ACC_REVIEW_PERIOD_OVERLAP, http: 409, condition: "Accreditation review window half-open-overlaps an existing non-DISMISSED review for the same subject" }
  - { id: ERR_DISPUTE_ALREADY_TERMINAL, http: 409, condition: "Action attempted on an UPHELD/REJECTED dispute" }
  - { id: ERR_INVALID_RECLASSIFICATION, http: 400, condition: "Requested classification missing, invalid, or equal to current classification" }
  - { id: ERR_SELF_DISPUTE_FORBIDDEN, http: 409, condition: "A critic may not dispute the classification of their own review" }
  - { id: ERR_SCORE_NOT_COMPUTABLE, http: 409, condition: "Persisting a score snapshot from an empty input set is forbidden; pct is null instead" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operations: titles, releases, publications, audience members, ticket verification rulings, bombing incidents"
    identity: opaque
    exclusive_operations:
      - "POST /titles, PATCH /titles/{id}"
      - "POST /titles/{id}/releases, POST /releases/{id}/transition"
      - "POST /publications"
      - "POST /critics"
      - "POST /audience-members"
      - "POST /ticket-verifications/{id}/transition"
      - "POST /releases/{id}/bombing-incidents, POST /bombing-incidents/{id}/transition"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /releases/{id}/score-recalculation"
      - "POST /audience-ratings/{id}/transition (INVALIDATE only)"
  - name: AccreditationBoard
    description: "Board governing accreditation reviews, dispute rulings, and accreditation transitions"
    identity: opaque
    exclusive_operations:
      - "POST /publications/{id}/transition"
      - "POST /critics/{id}/transition (ACCREDIT, PROBATE, REINSTATE)"
      - "POST /accreditation-reviews, POST /accreditation-reviews/{id}/transition"
      - "POST /disputes/{id}/transition"
      - "GET /accreditation-reviews, GET /disputes"
    shared_operations:
      - "All GET endpoints"
      - "POST /releases/{id}/score-recalculation"
  - name: Critic
    description: "Accredited critic authoring reviews and disputing others' classifications"
    identity: "entity_backed:Critic"
    exclusive_operations:
      - "POST /releases/{id}/reviews (as author)"
      - "POST /reviews/{id}/transition (own reviews)"
      - "POST /critics/{id}/transition (REAPPLY, own record only)"
    shared_operations:
      - "POST /disputes (CLASSIFICATION disputes on others' reviews; SCORE_DISPLAY)"
      - "All public GET endpoints"
  - name: StudioRep
    description: "Studio representative filing disputes over classification and score display"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /disputes"
      - "All public GET endpoints"
  - name: AudienceMember
    description: "Registered audience member submitting ticket verifications and ratings"
    identity: "entity_backed:AudienceMember"
    exclusive_operations:
      - "POST /releases/{id}/ticket-verifications (own)"
      - "POST /releases/{id}/audience-ratings (own)"
      - "POST /audience-ratings/{id}/transition (VERIFY, own ratings)"
    shared_operations:
      - "All public GET endpoints"
