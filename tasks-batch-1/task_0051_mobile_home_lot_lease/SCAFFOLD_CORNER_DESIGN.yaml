        distinguishing_aspect: "Creating a lease whose lot and resident belong to different communities returns ERR_CROSS_COMMUNITY_REFERENCE (409)."
        test_recipe:
          setup:
            - "Two CA communities; a lot in community 1 and a resident in community 2"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "C1", state_code: "CA" }
              as: ParkManager
              captures: { comm1: $.data.id }
            - call: "POST /communities"
              payload: { name: "C2", state_code: "CA" }
              as: ParkManager
              captures: { comm2: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm1}", lot_number: "CC", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm2}", full_name: "RCC", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
          assert:
            - "response error_id == ERR_CROSS_COMMUNITY_REFERENCE"
            - "http status == 409"

      - name: duplicate_lot_number_within_community_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_LOT_NUMBER]
        distinguishing_aspect: "Creating a second lot with an existing lot_number in the same community returns ERR_DUPLICATE_LOT_NUMBER (409)."
        test_recipe:
          setup:
