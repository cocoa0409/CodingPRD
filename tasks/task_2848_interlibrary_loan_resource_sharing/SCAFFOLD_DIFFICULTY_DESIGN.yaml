            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_art_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2026-08-20T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 12 }
