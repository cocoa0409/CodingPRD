            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["STATUS_DETAIL"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar}", expected_senior_record_version: "${sr_v}" } }
            - { call: "POST /fafsa/support-cases", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", case_type: "SPECIAL_CIRCUMSTANCE" } }
