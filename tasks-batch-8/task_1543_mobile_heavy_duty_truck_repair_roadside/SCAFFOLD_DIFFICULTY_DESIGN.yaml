  # ---------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: dispatch_window_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=16]
          - entities.Dispatch.fields.window_start_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on the Technician resource - a new dispatch
          whose window touches an existing window's endpoint (12:00 == 12:00) is allowed, while
          a strict interior overlap (11:00-15:00 vs 09:00-12:00) is rejected.
        test_recipe:
          setup:
            - "Two TRIAGED retail calls; technician T4 AVAILABLE with one PROPOSED dispatch 09:00-12:00 on call A."
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { vehA: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0003", unit_number: "R-02", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 80000 }, as: Dispatcher, captures: { vehB: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehA}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "site A", distance_miles_from_depot: 20, symptom_category: "ENGINE_NO_START", symptom_description: "no start" }, as: Dispatcher, captures: { scA: $.data.id } }
            - { call: "POST /roadside/service-calls/${scA}/triage", payload: { severity: "DRIVABLE" }, as: Dispatcher, captures: { scA_v: $.data.version } }
            - { call: "POST /roadside/service-calls/${scA}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T12:00:00Z", planned_travel_miles: 20, expected_service_call_version: "${scA_v}" }, as: Dispatcher, captures: { dA: $.data.id } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehB}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "site B", distance_miles_from_depot: 25, symptom_category: "ENGINE_NO_START", symptom_description: "no start" }, as: Dispatcher, captures: { scB: $.data.id } }
            - { call: "POST /roadside/service-calls/${scB}/triage", payload: { severity: "DRIVABLE" }, as: Dispatcher, captures: { scB_v: $.data.version } }
          trigger:
            - { call: "POST /roadside/service-calls/${scB}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-05T11:00:00Z", window_end_at: "2026-08-05T15:00:00Z", planned_travel_miles: 25, expected_service_call_version: "${scB_v}" }, as: Dispatcher, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /roadside/service-calls/${scB}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-05T12:00:00Z", window_end_at: "2026-08-05T15:00:00Z", planned_travel_miles: 25, expected_service_call_version: "${scB_v}" }, as: Dispatcher, captures: { d3: $.data.id, d3_status: $.data.status } }
          assert:
            - "err_overlap == ERR_DISPATCH_WINDOW_OVERLAP (11:00-15:00 strictly intersects 09:00-12:00)"
            - "the failed create did not bump the call version (the second create reuses ${scB_v} successfully)"
            - "d3_status == PROPOSED (12:00 == existing window_end is adjacency, allowed under half-open semantics)"

      - name: tow_pickup_window_buffered_touch_conflicts
        grounds:
          - validations[priority=17]
          - entities.TowOrder.fields.tow_unit_id
        distinguishing_aspect: |
          Different interval semantics on a different resource (TowOrder pickup windows on
          tow_unit_id): each window is expanded by +/-30 minutes and even a TOUCH of the expanded
          intervals conflicts. Order A 10:00-12:00 occupies 09:30-12:30 effectively; B 12:00-14:00
          conflicts; C 13:01-15:00 (expanded 12:31-15:30, clear of 12:30) is accepted.
