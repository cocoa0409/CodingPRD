        claim_type: correct_result
        grounds:
          - calculations.panelist_selector
          - endpoints.POST_/udrp/cases/{id}/appointments
        distinguishing_aspect: "Three seats are filled by the selector with panelist_id omitted every time: the first pick is decided by roster_admitted_at ASC, the second by the created_at fallback between two panelists whose roster dates are identical, and the third is whatever remains - so the whole ranking is exercised and Panelist.id is never a ranking input at any level."
