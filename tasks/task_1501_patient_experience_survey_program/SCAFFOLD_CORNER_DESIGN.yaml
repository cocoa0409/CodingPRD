  # ============================================== cross-cutting layers ======
  - section: cross_cutting_layers
    instances:
      - name: vendor_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[vendor-create-stale-program]"
          - "errors[ERR_STALE_PROGRAM_VERSION]"
        distinguishing_aspect: "OCC: after vendor V1 creation bumps SurveyProgram.version 1 -> 2, a second POST /api/vendors carrying the stale expected_program_version 1 is rejected 412 ERR_STALE_PROGRAM_VERSION and no supersede happens."
        test_recipe:
          setup: ["program created (version 1 captured); vendor V1 created with expected 1 (version now 2)"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CC1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 50000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { v1: "$.data.id" } }
          trigger:
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V2", cycle_budget_cents: 60000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "412 ERR_STALE_PROGRAM_VERSION (expected_program_version 1 != current 2)"
            - "SurveyVendor.${v1} remains ACTIVE; GET /api/vendors?program_id=${pg} returns exactly 1 vendor"

      - name: logical_clock_default_is_fixed
        claim_type: scheduled_actions
        grounds:
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z (no wall-clock fallback): a response created without touching the clock gets received_at == 2026-08-01T00:00:00Z and is_late == false."
        test_recipe:
          setup: ["cycle FIELDING with 1 IN_FIELD case; clock never set"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CC2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[0]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}", captures: { ra: "$.data.received_at" } }
          assert:
            - "SurveyResponse.received_at == 2026-08-01T00:00:00Z (fixed default, not wall clock)"
            - "is_late == false and status == ACCEPTED"

  # ===================================================== consistency model ====
  - section: consistency_model
    instances:
      - name: mutations_visible_in_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: every mutation's result (including cascaded derived fields) is visible in the mutation's own response — start-fielding's response shows status FIELDING and sampled_count already updated."
        test_recipe:
          setup: ["cycle SAMPLING_OPEN with 2 SAMPLED cases"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CM1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 2, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
          trigger:
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin, captures: { st: "$.data.status", sc: "$.data.sampled_count", den: "$.data.eligible_denominator" } }
          assert:
            - "start-fielding response itself shows status == FIELDING, sampled_count == 2, eligible_denominator == 2"
            - "immediate GET /api/sample-cases/${c_ids[0]} shows IN_FIELD (no lag)"

  # ============================================== excluded stubs ============
  # Corners already covered by §1.8 difficulty instances — no test_recipe.
  - section: state_machines
    instances:
      - name: corner_cycle_reopen_loop
        claim_type: valid_transition
        grounds:
          - state_machines.SurveyCycle.RECONCILIATION_to_FIELDING
        excluded_because:
          difficulty_instance: cycle_fielding_reconciliation_reopen_loop
          rationale: "The cyclic reopen transition and its NONRESPONSE -> IN_FIELD revert are the subject of the named §1.8 instance."
      - name: corner_initiative_missed_escalation_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.SurveyCycle.SCORING_to_PUBLISHED
        excluded_because:
          difficulty_instance: publish_to_response_flag_cascade
          rationale: "The publish -> initiative TARGET_MISSED -> ticket ESCALATED -> response-flag chain is asserted hop-by-hop in the named §1.8 instance."
      - name: corner_discharge_exclusion_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.Discharge.ELIGIBLE_to_EXCLUDED
        excluded_because:
          difficulty_instance: discharge_exclusion_cascade
          rationale: "Post-sample exclusion cascade (case -> EXCLUDED_POST_SAMPLE, vendor credit, counter recompute) is covered by the named §1.8 instance."

  - section: calculations
    instances:
      - name: corner_topbox_variant_divergence
        claim_type: correct_result
        grounds:
          - calculations.top_box_composite_scores
        excluded_because:
          difficulty_instance: topbox_raw_vs_mode_adjusted_on_cycle
          rationale: "RAW vs MODE_ADJUSTED divergence on identical data is the named §1.8 instance's assertion."
      - name: corner_vbp_rounding_order
        claim_type: precision
        grounds:
          - calculations.vbp_payment_adjustment
        excluded_because:
          difficulty_instance: vbp_per_composite_rounding_order
          rationale: "Per-composite-round-then-sum vs sum-then-round divergence is pinned and asserted in the named §1.8 instance."
      - name: corner_star_thresholds
        claim_type: boundary
        grounds:
          - calculations.star_rating
        excluded_because:
          difficulty_instance: star_threshold_80_inclusive
          rationale: "The inclusive 80.00 breakpoint and the response-rate cap interaction are covered by §1.8 boundary_precision_check and combinatorial_formula instances."

  - section: validations
    instances:
      - name: corner_cycle_window_overlap
        claim_type: temporal_validation
        grounds:
          - "errors[ERR_CYCLE_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: cycle_fielding_closed_interval_touch_conflicts
          rationale: "Closed-interval touching-date conflict is the named §1.8 instance."
      - name: corner_initiative_window_overlap
        claim_type: temporal_validation
        grounds:
          - "errors[ERR_INITIATIVE_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: initiative_half_open_window_adjacency_allowed
          rationale: "Half-open window adjacency-allowed / overlap-rejected is the named §1.8 instance."
      - name: corner_priority_conflict_pairs
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
          - "validations[priority=6]"
          - "validations[priority=9]"
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_sample_create
          rationale: "Both dual-failure priority pairs (state/fiscal and safety/referential) are covered by the two §1.8 priority_pair_validation_conflict instances."
      - name: corner_baseline_cycle_gate
        claim_type: cross_entity_validation
        grounds:
          - "errors[ERR_BASELINE_CYCLE_NOT_PUBLISHED]"
        excluded_because:
          difficulty_instance: initiative_activate_gated_by_baseline_cycle_state
          rationale: "Initiative activation gated on baseline PUBLISHED is the named §1.8 cross-entity instance."
      - name: corner_publish_threshold_gate
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BELOW_PUBLICATION_THRESHOLD]"
        excluded_because:
          difficulty_instance: publication_min_completed_count_boundary
          rationale: "The completed-count publication gate (24 rejected) is asserted in the named §1.8 boundary instance."

  - section: cross_cutting_layers
    instances:
      - name: corner_dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.initiative_progress
        excluded_because:
          difficulty_instance: initiative_progress_pinned_vs_rolling
          rationale: "PINNED vs ROLLING baseline divergence is the named §1.8 dual_variant_calc instance."
      - name: corner_compensating_invariants
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.vendor_budget_reconciliation
          - calculations.completed_responses_reconciliation
        excluded_because:
          difficulty_instance: vendor_budget_charge_credit_conservation
          rationale: "Both compensating-pair invariants (money and count) are asserted by the two §1.8 compensating_invariant instances."
