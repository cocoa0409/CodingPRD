        distinguishing_aspect: "TRIALING→ACTIVE requires Publication.status == ACTIVE; paying the initial invoice while the publication is SUSPENDED is rejected with ERR_PUBLICATION_SUSPENDED and the subscription stays TRIALING. Pair: Subscription ↔ Publication."
