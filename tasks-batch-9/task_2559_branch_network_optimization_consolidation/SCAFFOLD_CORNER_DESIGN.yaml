              as_user_id: "u_compliance_1"
            - call: "POST /distribution/closure-notices"
              payload: { consolidation_case_id: "${case_id}", notice_type: "REGULATOR", effective_closure_date: "2026-11-01" }
              as: ComplianceOfficer
