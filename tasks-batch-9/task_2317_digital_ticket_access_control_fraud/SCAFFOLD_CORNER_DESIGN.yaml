            - call: "POST /resale-listings/${l_id}/purchase"
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { l_status: $.data.status, l_buyer: $.data.buyer_patron_id, fee_p: $.data.platform_fee_cents, fee_r: $.data.venue_royalty_cents, fee_x: $.data.processing_fee_cents, payout: $.data.seller_payout_cents }
          assert:
            - "${err_self} == ERR_SELF_PURCHASE with HTTP 422, and the listing was still LISTED immediately afterwards"
            - "${l_status} == SOLD and ${l_buyer} == ${p_bob_id}"
            - "${fee_p} == 870, ${fee_r} == 420 and ${fee_x} == 378 (round_half_up(12000 * 0.029) == 348, plus the 30-cent fixed component)"
            - "${payout} == 10332 — 12000 minus the 1668 of summed deductions"
            - "Patron.${p_ada_id}.payout_balance_cents == 10332 and Patron.${p_bob_id}.payout_balance_cents == 0"
            - "Event.${ev_id}.settlement_pool_cents == 12420 — the 12000 booked at issuance plus the 420 venue royalty only"
            - "Ticket.${t_id}.lifecycle_status == RESOLD, holder_patron_id == ${p_bob_id} and device_binding_status is not BOUND"

      - name: counterfeit_seed_is_adjudicated_before_the_epoch_and_device_checks
        claim_type: cascading_validation
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=22]
          - errors.ERR_COUNTERFEIT_BARCODE
          - errors.ERR_BARCODE_EPOCH_INVALID
          - calculations.patron_fraud_risk_score
        distinguishing_aspect: |
          The adjudication ladder must run strictly in order even when several clauses fail
          at once. An unknown seed presented with a wrong fingerprint is
          ERR_COUNTERFEIT_BARCODE, not ERR_DEVICE_MISMATCH, and books no strike because no
          holder can be identified; a real seed with a future epoch and the same wrong
          fingerprint is ERR_BARCODE_EPOCH_INVALID, which does book a strike and maps to a
          COUNTERFEIT incident; only when both are fixed does the scan admit.
        test_recipe:
          setup:
            - "Event DOORS_OPEN; AccessZone GA1; Gate G1; Ada verified holding a bound PAID ticket; ONLINE session S1 open at 2026-09-12T18:10:00Z, where now_epoch is 20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 200, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id }
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { seed: $.data.barcode_seed, bc_ok: $.data.current_barcode }
          trigger:
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "NOSUCHSEED-20", device_fingerprint: "DEV-WRONG", direction: "IN", dedupe_key: "K1" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { err_fake: $.data.error_id }
            - call: "GET /patrons/${p_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { strikes1: $.data.strike_count, score1: $.data.fraud_risk_score }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${seed}-99", device_fingerprint: "DEV-WRONG", direction: "IN", dedupe_key: "K2" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { err_epoch: $.data.error_id }
            - call: "GET /patrons/${p_ada_id}"
