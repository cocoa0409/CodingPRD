            - { call: "GET /treasury/enrollments/${enr}", payload: {}, as: BankTreasuryManager, captures: { st_mid: $.data.status, loss_mid: $.data.ytd_bank_loss_cents } }
            - { call: "POST /treasury/liability-cases/${case2}/resolve", payload: { resolution: "BANK_LIABLE" }, as: BankTreasuryManager, as_user_id: "bank-mgr-9", captures: { c2_bank: $.data.bank_liability_cents } }
            - { call: "GET /treasury/enrollments/${enr}", payload: {}, as: BankTreasuryManager, captures: { st_end: $.data.status, loss_end: $.data.ytd_bank_loss_cents, prov_end: $.data.provisional_credit_outstanding_cents } }
