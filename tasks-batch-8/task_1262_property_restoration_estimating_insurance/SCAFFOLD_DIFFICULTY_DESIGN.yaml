            - "FIRE claim: one line 2500 @ 200c = 500,000c (dep 0), FLAT deductible 50,000; direct-pay WA signed; ACV advance 450,000 APPROVED+ISSUED+CLEARED; work complete; invoice 500,000 ISSUED (recovery 0 -> no auto payment)"
