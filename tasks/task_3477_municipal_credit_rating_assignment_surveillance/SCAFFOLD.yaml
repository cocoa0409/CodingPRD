# =============================================================================
# SCAFFOLD.yaml — Municipal Credit Rating Assignment & Surveillance
# Seed tables: §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Municipal Credit Rating Assignment & Surveillance (S&P Global Ratings): rating request from an issuer or underwriter with engagement terms and information requirements, analytical framework covering economy, management, budgetary performance, flexibility, liquidity and debt profile with weights, rating committee process with jurisdiction-specific criteria for general obligation, revenue and enterprise credits, rating publication with rationale and outlook and the effect on borrowing cost at sale, surveillance requiring periodic financial disclosure from the issuer with rating action when data is not provided, criteria changes causing portfolio-wide rating reviews with issuer communication, appeals before publication limited to new information, unsolicited ratings and issuer decisions to rate with multiple agencies

domain_name: municipal-credit-ratings
api_prefix: /muni

complexity_profile:
  primary_archetype: multi_party_negotiation   # rating committee quorum + median tally
  secondary_archetype: compliance_audit        # surveillance disclosure deadlines, forced rating actions, audit log
  complexity_layers:
    - optimistic_concurrency        # OCC on RatingEngagement.version (scorecard supersede) and Rating.version (rating actions)
    - cascading_side_effects        # criteria activation fan-out; clock-driven delinquency cascade
    - dual_variant_calculation      # weak-link capped scorecard; provisional vs final sale pricing
    - ops_run_checkpoint            # logical clock sweep advances disclosures, postures, escalations, auto-withdrawals
  entity_topology: hybrid                      # issuer-rooted tree plus cross-aggregate pins (criteria versions, scorecards)
  state_machine_shape: cyclic                  # engagement appeal re-deliberation cycle; rating withdraw->reinstate cycle; parallel axes on Rating
  relationship_patterns:
    - one_to_many                  # Issuer->Engagement->Rating->Obligation/Appeal; Session->Vote
    - cross_aggregate              # Scorecard/Session/Rating pin CriteriaVersion; ReviewItem spans CriteriaVersion x Rating
  role_model: segregation_of_duties            # scorecard author (lead analyst) is barred from committee voting; chair vs member split
  consistency_model: immediate                 # every mutation visible in its own response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Issuer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the municipal issuer" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code, e.g. CA" }
      - { name: issuer_type, type: enum, source: input, constraints: "GENERAL_GOVERNMENT | SPECIAL_DISTRICT | ENTERPRISE_PROVIDER", description: "Issuer classification" }
      - { name: fiscal_year_end, type: string, source: input, constraints: "MM-DD format, e.g. 06-30", description: "Issuer fiscal year end month-day used to schedule disclosure obligations" }
      - { name: population, type: integer, source: input, description: "Population served" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Fee credit from withdrawal refunds; applicable to future engagement fees" }
      - { name: delinquent_flag, type: boolean, source: computed, default: false, description: "True while any DisclosureObligation of this issuer's ratings is in DEFAULTED; cleared when all such obligations reach SUBMITTED_LATE" }

  - name: Underwriter
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Underwriting firm name" }
      - { name: license_number, type: string, source: input, description: "Municipal underwriter license number" }

  - name: RatingEngagement
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; the rated municipal issuer" }
      - { name: underwriter_id, type: string, source: input, description: "FK -> Underwriter.id; nullable, set when an underwriter requests on the issuer's behalf" }
      - { name: solicitation, type: enum, source: input, constraints: "SOLICITED | UNSOLICITED", description: "SOLICITED requested by issuer/underwriter; UNSOLICITED initiated by the agency (LeadAnalyst)" }
      - { name: credit_type, type: enum, source: input, constraints: "GENERAL_OBLIGATION | REVENUE | ENTERPRISE", description: "Credit family; drives required documents, fee, and criteria selection" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction key for criteria selection, e.g. US-CA" }
      - { name: fee_cents, type: integer, source: computed, description: "Engagement fee by credit_type (4500000 GO / 5200000 REVENUE / 5800000 ENTERPRISE); 0 when UNSOLICITED" }
      - { name: fee_paid, type: boolean, source: system, default: false, description: "Set true by accept-terms (SOLICITED); true at creation for UNSOLICITED (waived)" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Refund credited to issuer on withdrawal: round_half_up(fee_cents * 0.5) when fee_paid, else 0" }
      - { name: required_document_codes, type: array, source: computed, description: "Information requirement set derived from solicitation + credit_type" }
      - { name: received_document_codes, type: array, source: system, default: [], description: "Document codes accepted so far; ANALYSIS reached when this covers required_document_codes" }
      - { name: assigned_analyst_id, type: string, source: system, description: "X-User-ID of the LeadAnalyst who submitted the scorecard; that analyst is barred from voting (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ENGAGED -> INFORMATION_GATHERING -> ANALYSIS -> COMMITTEE_READY -> RATING_ASSIGNED -> PUBLISHED; cycle RATING_ASSIGNED -> COMMITTEE_READY on upheld appeal; WITHDRAWN terminal alternative" }

  - name: AnalyticalScorecard
    parent: RatingEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> RatingEngagement.id" }
      - { name: criteria_version_id, type: string, source: computed, description: "FK -> CriteriaVersion.id; ACTIVE version for (jurisdiction_code, credit_type) whose weights were used" }
      - { name: score_economy, type: integer, source: input, constraints: "integer 1..5", description: "Economy factor score" }
      - { name: score_management, type: integer, source: input, constraints: "integer 1..5", description: "Management factor score" }
      - { name: score_budgetary_performance, type: integer, source: input, constraints: "integer 1..5", description: "Budgetary performance factor score" }
      - { name: score_flexibility, type: integer, source: input, constraints: "integer 1..5", description: "Flexibility factor score" }
      - { name: score_liquidity, type: integer, source: input, constraints: "integer 1..5", description: "Liquidity factor score" }
      - { name: score_debt_profile, type: integer, source: input, constraints: "integer 1..5", description: "Debt profile factor score" }
      - { name: weighted_score, type: number, source: computed, description: "Sum(weight_i * score_i) rounded to 4 decimal places round_half_up" }
      - { name: anchor_notch, type: enum, source: computed, description: "Anchor-table rating from weighted_score before any cap" }
      - { name: capped, type: boolean, source: computed, description: "True when the ENTERPRISE weak-link cap fired (min factor score == 1)" }
      - { name: indicative_notch, type: enum, source: computed, description: "Final indicative rating the committee may deviate from by at most 1 notch" }

  - name: CriteriaVersion
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction key this criteria set governs" }
      - { name: credit_type, type: enum, source: input, constraints: "GENERAL_OBLIGATION | REVENUE | ENTERPRISE", description: "Credit family this criteria set governs" }
      - { name: version_label, type: string, source: input, description: "Human label, e.g. GO-2026.2" }
      - { name: w_economy, type: number, source: input, description: "Weight for economy factor; six weights must sum to exactly 1.000" }
      - { name: w_management, type: number, source: input, description: "Weight for management factor" }
      - { name: w_budgetary_performance, type: number, source: input, description: "Weight for budgetary performance factor" }
      - { name: w_flexibility, type: number, source: input, description: "Weight for flexibility factor" }
      - { name: w_liquidity, type: number, source: input, description: "Weight for liquidity factor" }
      - { name: w_debt_profile, type: number, source: input, description: "Weight for debt profile factor" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED; at most one ACTIVE per (jurisdiction_code, credit_type)" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock value at activation; null while DRAFT" }

  - name: CommitteeSession
    parent: RatingEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> RatingEngagement.id" }
      - { name: criteria_version_id, type: string, source: system, description: "FK -> CriteriaVersion.id; ACTIVE version pinned at scheduling; never re-pointed by later activations" }
      - { name: chair_id, type: string, source: system, description: "X-User-ID of the scheduling CommitteeChair; only that chair may open/close/appoint alternates" }
      - { name: voter_ids, type: array, source: input, description: "Exactly 5 distinct opaque voter identifiers (the committee pool)" }
      - { name: appointed_alternate_ids, type: array, source: system, default: [], description: "Alternates appointed after recusals" }
      - { name: recused_voter_ids, type: array, source: system, default: [], description: "Voters who cast a RECUSAL vote" }
      - { name: eligible_voter_count, type: integer, source: computed, description: "5 - len(recused_voter_ids) + len(appointed_alternate_ids)" }
      - { name: start_at, type: datetime, source: input, description: "Session window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Session window end (exclusive); must be after start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_SESSION -> COMPLETED | ADJOURNED" }
      - { name: outcome_notch, type: enum, source: computed, description: "Committee median notch when COMPLETED; null otherwise" }
      - { name: adjourn_reason, type: enum, source: computed, description: "QUORUM_NOT_MET | NOTCH_DEVIATION_EXCEEDED when ADJOURNED; null otherwise" }

  - name: CommitteeVote
    parent: CommitteeSession
    common_fields: false
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> CommitteeSession.id" }
      - { name: voter_id, type: string, source: input, description: "Opaque voter identifier; must equal X-User-ID and belong to the session pool" }
      - { name: kind, type: enum, source: computed, constraints: "VOTE | RECUSAL", description: "VOTE when notch_vote present, RECUSAL when recusal_reason present; exactly one required" }
      - { name: notch_vote, type: enum, source: input, constraints: "AAA | AA | A | BBB | BB | B | CCC; null on recusal", description: "Cast rating notch" }
      - { name: recusal_reason, type: string, source: input, description: "Reason text on recusal; null on vote" }

  - name: Rating
    parent: RatingEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> RatingEngagement.id" }
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; denormalized from the engagement for filtering" }
      - { name: criteria_version_id, type: string, source: system, description: "FK -> CriteriaVersion.id; pinned from the completing committee session" }
      - { name: credit_type, type: enum, source: system, description: "Copied from the engagement at assignment" }
      - { name: jurisdiction_code, type: string, source: system, description: "Copied from the engagement at assignment" }
      - { name: notch, type: enum, source: system, constraints: "AAA | AA | A | BBB | BB | B | CCC", description: "Current rating notch; committee median at assignment, then mutated by rating actions and criteria reviews" }
      - { name: outlook, type: enum, source: input, constraints: "POSITIVE | STABLE | NEGATIVE | DEVELOPING", description: "Set at publication; adjustable by later rating actions" }
      - { name: rationale, type: string, source: input, description: "Published rationale text" }
      - { name: status, type: enum, source: system, description: "ASSIGNED -> PUBLISHED; ASSIGNED -> REMANDED (appeal upheld, terminal); PUBLISHED -> WITHDRAWN; WITHDRAWN -> PUBLISHED via reinstate (cycle)" }
      - { name: surveillance_posture, type: enum, source: computed, description: "Parallel axis: CURRENT | GRACE | DELINQUENT, derived from this rating's obligations (GRACE if any OVERDUE, DELINQUENT if any DELINQUENT, else CURRENT); frozen when status leaves PUBLISHED" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical clock at committee completion; appeal window = assigned_at + 120h inclusive" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock at publication; null until PUBLISHED" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Logical clock at withdrawal; null until WITHDRAWN" }
      - { name: withdraw_reason, type: enum, source: system, constraints: "NON_DISCLOSURE | ISSUER_REQUEST | CRITERIA", description: "NON_DISCLOSURE set only by the clock sweep" }
      - { name: notch_at_withdrawal, type: enum, source: system, description: "Notch frozen at withdrawal; restored by reinstate" }
      - { name: review_pending, type: boolean, source: computed, description: "True while any CriteriaReviewItem for this rating is PENDING, IN_REVIEW, or ESCALATED" }
      - { name: notch_history, type: array, source: system, default: [], description: "Append-only entries {notch, changed_at, cause}; cause in COMMITTEE_ASSIGNMENT | SURVEILLANCE_ACTION | CRITERIA_REVIEW | REINSTATEMENT" }

  - name: Appeal
    parent: Rating
    common_fields: true
    fields:
      - { name: rating_id, type: string, source: system, description: "FK -> Rating.id" }
      - { name: new_information_codes, type: array, source: input, description: "Document codes not previously received on the engagement; non-empty and disjoint from received_document_codes" }
      - { name: status, type: enum, source: system, description: "FILED -> UPHELD | DENIED" }
      - { name: decision_rationale, type: string, source: input, description: "Committee chair rationale at decision; null until decided" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at decision; null until decided" }

  - name: BondSale
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id" }
      - { name: rating_id, type: string, source: input, description: "FK -> Rating.id; rating of the same issuer used for pricing" }
      - { name: par_amount_cents, type: integer, source: input, constraints: "> 0", description: "Par amount in cents" }
      - { name: maturity_years, type: integer, source: input, constraints: "1..30", description: "Bullet maturity in years" }
      - { name: sale_date, type: datetime, source: input, description: "Expected sale date" }
      - { name: pricing_mode, type: enum, source: input, constraints: "PROVISIONAL | FINAL", description: "PROVISIONAL prices off the scorecard indicative notch; FINAL off the published current notch" }
      - { name: effective_yield_bps, type: integer, source: computed, description: "300 + spread(notch) per the spread schedule" }
      - { name: annual_interest_cents, type: integer, source: computed, description: "round_half_up(par_amount_cents * effective_yield_bps / 10000) to whole cents" }
      - { name: total_interest_cents, type: integer, source: computed, description: "maturity_years * annual_interest_cents (per-year rounding pinned before summation)" }

  - name: DisclosureObligation
    parent: Rating
    common_fields: true
    fields:
      - { name: rating_id, type: string, source: system, description: "FK -> Rating.id" }
      - { name: period_index, type: integer, source: system, description: "1 for the first post-publication fiscal year, incrementing annually" }
      - { name: fiscal_year_end, type: datetime, source: computed, description: "First issuer fiscal_year_end (MM-DD at 00:00:00Z) strictly after published_at, then annually" }
      - { name: due_at, type: datetime, source: computed, description: "fiscal_year_end + 210 days" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission; null until submitted" }
      - { name: status, type: enum, source: system, description: "PENDING -> SUBMITTED_ON_TIME; PENDING -> OVERDUE (clock > due_at); OVERDUE -> SUBMITTED_LATE | DELINQUENT (clock > due_at+30d); DELINQUENT -> SUBMITTED_LATE | DEFAULTED (clock > due_at+60d); DEFAULTED -> SUBMITTED_LATE" }

  - name: CriteriaReviewItem
    parent: null
    common_fields: true
    fields:
      - { name: criteria_version_id, type: string, source: system, description: "FK -> CriteriaVersion.id; the newly activated version that triggered this review" }
      - { name: rating_id, type: string, source: system, description: "FK -> Rating.id; the PUBLISHED rating under review" }
      - { name: due_at, type: datetime, source: computed, description: "activated_at of the new criteria version + 90 days" }
      - { name: status, type: enum, source: system, description: "PENDING -> IN_REVIEW -> COMPLETED_NO_ACTION | COMPLETED_RATING_ACTION; PENDING -> ESCALATED (clock > due_at); ESCALATED -> IN_REVIEW via begin" }
      - { name: outcome_notch, type: enum, source: input, description: "New notch when outcome is RATING_ACTION; null otherwise" }
      - { name: rationale, type: string, source: input, description: "Review rationale at completion" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion; null until completed" }

  - name: IssuerNotification
    parent: Issuer
    common_fields: false
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id" }
      - { name: event_type, type: enum, source: system, constraints: "ENGAGEMENT_WITHDRAWN | RATING_ASSIGNED | RATING_PUBLISHED | RATING_ACTION | RATING_WITHDRAWN | RATING_REINSTATED | APPEAL_UPHELD | APPEAL_DENIED | OBLIGATION_DELINQUENT | REVIEW_OPENED | REVIEW_COMPLETED", description: "Notification kind" }
      - { name: reference_id, type: string, source: system, description: "Id of the related entity (rating, obligation, review item, engagement)" }
      - { name: message, type: string, source: system, description: "Human-readable issuer communication" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RatingEngagement
    initial_state: REQUESTED
    terminal_states: [WITHDRAWN, PUBLISHED]
    transitions:
      - from: REQUESTED
        to: ENGAGED
        trigger: "POST /muni/engagements/{id}/accept-terms"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == engagement.issuer_id (ERR_NOT_RESOURCE_OWNER)"
          - "engagement.solicitation == SOLICITED (ERR_WITHDRAWAL_NOT_PERMITTED semantics do not apply here; unsolicited engagements are never in REQUESTED)"
          - "fee_payment_cents + apply_credit_cents == fee_cents (ERR_FEE_PAYMENT_MISMATCH)"
          - "apply_credit_cents <= issuer.credit_balance_cents (ERR_INSUFFICIENT_ISSUER_CREDIT)"
        side_effects:
          - "fee_paid = true; issuer.credit_balance_cents -= apply_credit_cents"
          - "increments RatingEngagement.version by 1"
      - from: ENGAGED
        to: INFORMATION_GATHERING
        trigger: "system (automatic on first accepted document via POST /muni/engagements/{id}/documents)"
        actor: system
        preconditions: []
        side_effects:
          - "received_document_codes += document_code"
          - "increments RatingEngagement.version by 1"
      - from: INFORMATION_GATHERING
        to: INFORMATION_GATHERING
        trigger: "system (further accepted documents while required set not yet covered)"
        actor: system
        preconditions: []
        side_effects:
          - "received_document_codes += document_code"
          - "increments RatingEngagement.version by 1"
      - from: INFORMATION_GATHERING
        to: ANALYSIS
        trigger: "system (automatic on the document POST that completes required_document_codes)"
        actor: system
        preconditions:
          - "received_document_codes superset of required_document_codes after appending"
        side_effects:
          - "received_document_codes += document_code"
          - "increments RatingEngagement.version by 1"
      - from: ANALYSIS
        to: COMMITTEE_READY
        trigger: "POST /muni/engagements/{id}/scorecard (first submission)"
        actor: LeadAnalyst
        preconditions:
          - "expected_engagement_version == engagement.version (ERR_STALE_ENGAGEMENT_VERSION, 412)"
        side_effects:
          - "AnalyticalScorecard created (or replaced) with computed weighted_score/anchor_notch/capped/indicative_notch"
          - "assigned_analyst_id = caller X-User-ID"
          - "increments RatingEngagement.version by 1"
      - from: COMMITTEE_READY
        to: COMMITTEE_READY
        trigger: "POST /muni/engagements/{id}/scorecard (re-submission supersedes the prior scorecard; the OCC-guarded create-with-supersede path)"
        actor: LeadAnalyst
        preconditions:
          - "expected_engagement_version == engagement.version (ERR_STALE_ENGAGEMENT_VERSION, 412)"
        side_effects:
          - "AnalyticalScorecard replaced; assigned_analyst_id updated to caller"
          - "increments RatingEngagement.version by 1"
      - from: COMMITTEE_READY
        to: RATING_ASSIGNED
        trigger: "system (committee session close with quorum and in-band median)"
        actor: system
        preconditions:
          - "closing session eligible non-recusal votes >= 3"
          - "median notch within 1 notch of scorecard indicative_notch"
        side_effects:
          - "Rating created: status ASSIGNED, notch = session outcome_notch, surveillance_posture CURRENT, assigned_at = clock, notch_history = [{notch, assigned_at, COMMITTEE_ASSIGNMENT}]"
          - "Rating.criteria_version_id = session.criteria_version_id (pin carried forward)"
          - "IssuerNotification RATING_ASSIGNED logged"
      - from: RATING_ASSIGNED
        to: COMMITTEE_READY
        trigger: "system (appeal UPHELD via POST /muni/appeals/{id}/decide)"
        actor: system
        preconditions: []
        side_effects:
          - "the appealed Rating -> REMANDED (terminal)"
          - "engagement returns to COMMITTEE_READY for re-deliberation with the new information (appeal cycle)"
      - from: RATING_ASSIGNED
        to: PUBLISHED
        trigger: "system (POST /muni/ratings/{id}/publish succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "engagement lifecycle ends; surveillance continues on the Rating"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /muni/engagements/{id}/withdraw"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == engagement.issuer_id (ERR_NOT_RESOURCE_OWNER)"
          - "solicitation == SOLICITED (ERR_WITHDRAWAL_NOT_PERMITTED)"
        side_effects:
          - "refund_cents = 0 (fee not yet paid); no credit movement"
          - "IssuerNotification ENGAGEMENT_WITHDRAWN logged"
      - from: ENGAGED
        to: WITHDRAWN
        trigger: "POST /muni/engagements/{id}/withdraw"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == engagement.issuer_id (ERR_NOT_RESOURCE_OWNER)"
          - "solicitation == SOLICITED (ERR_WITHDRAWAL_NOT_PERMITTED)"
        side_effects:
          - "refund_cents = round_half_up(fee_cents * 0.5); issuer.credit_balance_cents += refund_cents"
          - "IssuerNotification ENGAGEMENT_WITHDRAWN logged"
      - from: INFORMATION_GATHERING
        to: WITHDRAWN
        trigger: "POST /muni/engagements/{id}/withdraw"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == engagement.issuer_id (ERR_NOT_RESOURCE_OWNER)"
          - "solicitation == SOLICITED (ERR_WITHDRAWAL_NOT_PERMITTED)"
        side_effects:
          - "refund_cents = round_half_up(fee_cents * 0.5); issuer.credit_balance_cents += refund_cents"
          - "IssuerNotification ENGAGEMENT_WITHDRAWN logged"
      - from: ANALYSIS
        to: WITHDRAWN
        trigger: "POST /muni/engagements/{id}/withdraw"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == engagement.issuer_id (ERR_NOT_RESOURCE_OWNER)"
          - "solicitation == SOLICITED (ERR_WITHDRAWAL_NOT_PERMITTED)"
        side_effects:
          - "refund_cents = round_half_up(fee_cents * 0.5); issuer.credit_balance_cents += refund_cents"
          - "IssuerNotification ENGAGEMENT_WITHDRAWN logged"
      - from: COMMITTEE_READY
        to: WITHDRAWN
        trigger: "POST /muni/engagements/{id}/withdraw"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == engagement.issuer_id (ERR_NOT_RESOURCE_OWNER)"
          - "solicitation == SOLICITED (ERR_WITHDRAWAL_NOT_PERMITTED)"
        side_effects:
          - "refund_cents = round_half_up(fee_cents * 0.5); issuer.credit_balance_cents += refund_cents"
          - "IssuerNotification ENGAGEMENT_WITHDRAWN logged"
        note: "Withdrawal from RATING_ASSIGNED or later is rejected (ERR_WITHDRAWAL_NOT_PERMITTED): the appeal process is the only pre-publication remedy."

  - entity: CommitteeSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ADJOURNED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /muni/committee-sessions/{id}/open"
        actor: CommitteeChair
        preconditions:
          - "caller X-User-ID == session.chair_id (ERR_NOT_RESOURCE_OWNER)"
          - "start_at <= clock < end_at (ERR_SESSION_NOT_OPENABLE)"
        side_effects: []
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /muni/committee-sessions/{id}/close (quorum met and median within 1 notch of indicative)"
        actor: CommitteeChair
        preconditions:
          - "caller X-User-ID == session.chair_id (ERR_NOT_RESOURCE_OWNER)"
          - "non-recusal votes >= 3"
          - "| median_index - indicative_index | <= 1"
        side_effects:
          - "outcome_notch = median notch (even count: worse of the two middle notches)"
          - "Rating created ASSIGNED; engagement -> RATING_ASSIGNED; IssuerNotification RATING_ASSIGNED"
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /muni/committee-sessions/{id}/close (quorum missed or median out of band)"
        actor: CommitteeChair
        preconditions:
          - "caller X-User-ID == session.chair_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "adjourn_reason = QUORUM_NOT_MET | NOTCH_DEVIATION_EXCEEDED"
          - "engagement remains COMMITTEE_READY; a new session may be scheduled (24h cooling-off applies)"
      - from: SCHEDULED
        to: ADJOURNED
        trigger: "POST /muni/committee-sessions/{id}/close (chair cancels an unopened session)"
        actor: CommitteeChair
        preconditions:
          - "caller X-User-ID == session.chair_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "adjourn_reason = QUORUM_NOT_MET (zero votes recorded)"

  - entity: Rating
    initial_state: ASSIGNED
    terminal_states: [REMANDED]
    transitions:
      - from: ASSIGNED
        to: PUBLISHED
        trigger: "POST /muni/ratings/{id}/publish"
        actor: LeadAnalyst
        preconditions:
          - "clock > assigned_at + 120h (ERR_PUBLISH_WINDOW_NOT_ELAPSED)"
          - "no Appeal with status FILED exists for this rating (ERR_APPEAL_PENDING)"
        side_effects:
          - "outlook and rationale set from payload; published_at = clock"
          - "engagement -> PUBLISHED"
          - "DisclosureObligation period_index 1 created (PENDING) per disclosure_schedule"
          - "IssuerNotification RATING_PUBLISHED logged"
      - from: ASSIGNED
        to: REMANDED
        trigger: "system (appeal UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "engagement -> COMMITTEE_READY (appeal cycle)"
          - "IssuerNotification APPEAL_UPHELD logged"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /muni/ratings/{id}/actions with action AFFIRM | UPGRADE | DOWNGRADE"
        actor: LeadAnalyst | SurveillanceOfficer
        preconditions:
          - "expected_rating_version == rating.version (ERR_STALE_RATING_VERSION, 412)"
          - "review_pending == false (ERR_REVIEW_PENDING)"
          - "AFFIRM requires surveillance_posture in {CURRENT, GRACE} (ERR_AFFIRM_BLOCKED_BY_POSTURE)"
          - "UPGRADE requires surveillance_posture == CURRENT (ERR_UPGRADE_BLOCKED_BY_POSTURE)"
          - "UPGRADE: new_notch exactly one notch better; DOWNGRADE: exactly one notch worse (ERR_NOTCH_STEP_INVALID)"
        side_effects:
          - "notch updated (AFFIRM keeps notch); outlook updated when new_outlook present"
          - "notch_history += {notch, clock, SURVEILLANCE_ACTION}"
          - "IssuerNotification RATING_ACTION logged"
          - "increments Rating.version by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /muni/ratings/{id}/actions with action WITHDRAW, or system sweep on non-disclosure"
        actor: LeadAnalyst | SurveillanceOfficer | system
        preconditions:
          - "manual path: expected_rating_version == rating.version (ERR_STALE_RATING_VERSION, 412); withdraw_reason in {ISSUER_REQUEST, CRITERIA}"
          - "system path: an obligation crossed due_at + 60 days (sweep sets withdraw_reason NON_DISCLOSURE)"
        side_effects:
          - "withdrawn_at = clock; notch_at_withdrawal = notch; surveillance_posture frozen"
          - "manual path: IssuerNotification RATING_WITHDRAWN; increments Rating.version by 1"
          - "system path: IssuerNotification RATING_WITHDRAWN logged after the DEFAULTED flip and delinquency notification (cascade hop 3)"
      - from: WITHDRAWN
        to: PUBLISHED
        trigger: "POST /muni/ratings/{id}/reinstate"
        actor: SurveillanceOfficer
        preconditions:
          - "withdraw_reason == NON_DISCLOSURE (ERR_REINSTATE_NOT_PERMITTED)"
          - "clock <= withdrawn_at + 180 days (ERR_REINSTATE_WINDOW_EXPIRED)"
          - "every DisclosureObligation of this rating is SUBMITTED_ON_TIME or SUBMITTED_LATE (ERR_UNRESOLVED_OBLIGATIONS)"
        side_effects:
          - "notch restored to notch_at_withdrawal; surveillance_posture recomputed (CURRENT)"
          - "if no obligation of this rating is in an open state (PENDING/OVERDUE/DELINQUENT/DEFAULTED), the next-period DisclosureObligation is created per disclosure_schedule (period_index = last period + 1)"
          - "notch_history += {notch, clock, REINSTATEMENT}"
          - "IssuerNotification RATING_REINSTATED logged"
          - "increments Rating.version by 1"
    note: "surveillance_posture is a parallel state axis computed from DisclosureObligation states; it evolves independently of the publication axis while status == PUBLISHED."

  - entity: DisclosureObligation
    initial_state: PENDING
    terminal_states: [SUBMITTED_ON_TIME, SUBMITTED_LATE]
    transitions:
      - from: PENDING
        to: SUBMITTED_ON_TIME
        trigger: "POST /muni/disclosure-obligations/{id}/submit with clock <= due_at"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == obligation's rating's issuer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "submitted_at = clock; next-period DisclosureObligation created (period_index + 1)"
          - "rating.surveillance_posture recomputed"
      - from: PENDING
        to: OVERDUE
        trigger: "system (clock sweep: clock > due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "rating.surveillance_posture -> GRACE"
      - from: OVERDUE
        to: SUBMITTED_LATE
        trigger: "POST /muni/disclosure-obligations/{id}/submit"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == obligation's rating's issuer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "submitted_at = clock; next-period DisclosureObligation created"
          - "rating.surveillance_posture recomputed (CURRENT when no other open obligation is late)"
      - from: OVERDUE
        to: DELINQUENT
        trigger: "system (clock sweep: clock > due_at + 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "rating.surveillance_posture -> DELINQUENT"
          - "issuer.delinquent_flag unaffected at this hop"
          - "IssuerNotification OBLIGATION_DELINQUENT logged"
      - from: DELINQUENT
        to: SUBMITTED_LATE
        trigger: "POST /muni/disclosure-obligations/{id}/submit"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == obligation's rating's issuer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "submitted_at = clock; next-period DisclosureObligation created"
          - "rating.surveillance_posture recomputed"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system (clock sweep: clock > due_at + 60 days)"
        actor: system
        preconditions: []
        side_effects:
          - "issuer.delinquent_flag = true (cleared when all DEFAULTED obligations of the issuer reach SUBMITTED_LATE)"
          - "rating -> WITHDRAWN with withdraw_reason NON_DISCLOSURE (cascade hop 3)"
          - "IssuerNotification RATING_WITHDRAWN logged"
      - from: DEFAULTED
        to: SUBMITTED_LATE
        trigger: "POST /muni/disclosure-obligations/{id}/submit (late cure enabling reinstatement)"
        actor: Issuer
        preconditions:
          - "caller X-User-ID == obligation's rating's issuer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "submitted_at = clock; no next-period obligation created while rating is WITHDRAWN"
          - "issuer.delinquent_flag recomputed"

  - entity: CriteriaVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /muni/criteria-versions/{id}/activate"
        actor: SurveillanceOfficer
        preconditions: []
        side_effects:
          - "activated_at = clock"
          - "prior ACTIVE version for the same (jurisdiction_code, credit_type) -> SUPERSEDED (cascade hop 1)"
          - "when a prior ACTIVE version existed: CriteriaReviewItem created for every PUBLISHED rating with matching jurisdiction_code and credit_type, ordered by rating.published_at ASC then created_at ASC (cascade hop 2)"
          - "each affected rating.review_pending = true and IssuerNotification REVIEW_OPENED logged (cascade hop 3)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer CriteriaVersion for the same (jurisdiction_code, credit_type) is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /muni/appeals/{id}/decide with decision UPHELD"
        actor: CommitteeChair
        preconditions: []
        side_effects:
          - "decided_at = clock; decision_rationale set"
          - "rating -> REMANDED; engagement -> COMMITTEE_READY (re-deliberation with the new information)"
          - "IssuerNotification APPEAL_UPHELD logged"
      - from: FILED
        to: DENIED
        trigger: "POST /muni/appeals/{id}/decide with decision DENIED"
        actor: CommitteeChair
        preconditions: []
        side_effects:
          - "decided_at = clock; decision_rationale set"
          - "rating stays ASSIGNED; publish permitted once the appeal window has elapsed"
          - "IssuerNotification APPEAL_DENIED logged"

  - entity: CriteriaReviewItem
    initial_state: PENDING
    terminal_states: [COMPLETED_NO_ACTION, COMPLETED_RATING_ACTION]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /muni/review-items/{id}/begin"
        actor: SurveillanceOfficer
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: IN_REVIEW
        trigger: "POST /muni/review-items/{id}/begin"
        actor: SurveillanceOfficer
        preconditions: []
        side_effects: []
      - from: PENDING
        to: ESCALATED
        trigger: "system (clock sweep: clock > due_at; IN_REVIEW items are exempt)"
        actor: system
        preconditions: []
        side_effects:
          - "while any item for an issuer's ratings is ESCALATED, committee scheduling for that issuer's engagements is blocked (ERR_ESCALATED_REVIEW_BLOCKS_SCHEDULING)"
      - from: IN_REVIEW
        to: COMPLETED_NO_ACTION
        trigger: "POST /muni/review-items/{id}/complete with outcome NO_ACTION"
        actor: SurveillanceOfficer
        preconditions: []
        side_effects:
          - "completed_at = clock; rating.review_pending recomputed"
          - "IssuerNotification REVIEW_COMPLETED logged"
      - from: IN_REVIEW
        to: COMPLETED_RATING_ACTION
        trigger: "POST /muni/review-items/{id}/complete with outcome RATING_ACTION"
        actor: SurveillanceOfficer
        preconditions:
          - "new_notch present (ERR_REVIEW_OUTCOME_NOTCH_REQUIRED)"
        side_effects:
          - "rating.notch = new_notch; notch_history += {new_notch, clock, CRITERIA_REVIEW}; increments Rating.version by 1"
          - "completed_at = clock; rating.review_pending recomputed"
          - "IssuerNotification REVIEW_COMPLETED logged"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: scorecard-submit-stale-engagement
    parent_entity: RatingEngagement
    write_endpoint: "POST /muni/engagements/{id}/scorecard"
    occ_field: expected_engagement_version
    description: |
      Submitting (or superseding) the analytical scorecard against a
      RatingEngagement whose version has advanced since the client last
      observed it is rejected. The scorecard create-with-supersede path makes
      the client's view of the engagement the consistency anchor: a stale
      expected_engagement_version means another scorecard (or a document /
      accept-terms mutation) landed in between.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
  - rule_id: rating-action-stale-rating
    parent_entity: Rating
    write_endpoint: "POST /muni/ratings/{id}/actions"
    occ_field: expected_rating_version
    description: |
      Posting a surveillance rating action (AFFIRM/UPGRADE/DOWNGRADE/WITHDRAW)
      against a Rating whose version has advanced since the client last
      observed it is rejected, because each action supersedes the rating's
      previously published state as the basis for the next action.
    error_id: ERR_STALE_RATING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engagement_fee_and_refund
    trigger: "engagement creation (fee), accept-terms (collection), withdraw (refund)"
    algorithm: threshold
    formula: |
      fee_cents = FEE_BY_CREDIT_TYPE[credit_type] when solicitation == SOLICITED else 0
      accept-terms: require fee_payment_cents + apply_credit_cents == fee_cents
      withdraw refund (only when fee_paid): refund_cents = round_half_up(fee_cents * WITHDRAWAL_REFUND_RATIO)
      issuer.credit_balance_cents += refund_cents on withdraw; -= apply_credit_cents on accept-terms
    input_set: "the engagement being created/accepted/withdrawn and its issuer's credit_balance_cents"
    constants:
      FEE_GO_CENTS: 4500000
      FEE_REVENUE_CENTS: 5200000
      FEE_ENTERPRISE_CENTS: 5800000
      FEE_UNSOLICITED_CENTS: 0
      WITHDRAWAL_REFUND_RATIO: 0.5
    precision: "0 decimal places (whole cents), round_half_up"

  - name: weighted_scorecard
    trigger: "POST /muni/engagements/{id}/scorecard (every submission, including superseding re-submissions)"
    algorithm: weighted_scoring
    formula: |
      weights come from the ACTIVE CriteriaVersion for (engagement.jurisdiction_code, engagement.credit_type)
      weighted_score = round_half_up_4dp( w_economy*score_economy + w_management*score_management
                       + w_budgetary_performance*score_budgetary_performance + w_flexibility*score_flexibility
                       + w_liquidity*score_liquidity + w_debt_profile*score_debt_profile )
      anchor_notch = first notch whose ANCHOR threshold <= weighted_score (thresholds are INCLUSIVE lower bounds):
        weighted_score >= 4.50 -> AAA; >= 4.00 -> AA; >= 3.50 -> A; >= 3.00 -> BBB; >= 2.50 -> BB; >= 2.00 -> B; else CCC
      The anchor comparison runs on the ROUNDED 4-decimal weighted_score.
    input_set: "the six factor scores on the submission; weights of the ACTIVE criteria version"
    constants:
      ANCHOR_AAA: 4.50
      ANCHOR_AA: 4.00
      ANCHOR_A: 3.50
      ANCHOR_BBB: 3.00
      ANCHOR_BB: 2.50
      ANCHOR_B: 2.00
      WEAK_LINK_MIN_SCORE: 1
      WEAK_LINK_CAP_NOTCH: BB
    precision: "4 decimal places, round_half_up"
    variants:
      - name: standard
        when: "engagement.credit_type in {GENERAL_OBLIGATION, REVENUE}"
        difference: "indicative_notch = anchor_notch; capped = false"
      - name: weak_link_cap
        when: "engagement.credit_type == ENTERPRISE"
        difference: "when min(six factor scores) == 1, indicative_notch = the worse of (anchor_notch, BB) and capped = true; otherwise identical to standard"

  - name: committee_outcome_tally
    trigger: "POST /muni/committee-sessions/{id}/close from IN_SESSION"
    algorithm: threshold
    formula: |
      votes = CommitteeVote rows of the session with kind == VOTE (recusals excluded)
      eligible = eligible_voter_count = COMMITTEE_SIZE - len(recused_voter_ids) + len(appointed_alternate_ids)
      if len(votes) < QUORUM_MIN_VOTES: session -> ADJOURNED with adjourn_reason QUORUM_NOT_MET
      else:
        idx = sorted(NOTCH_SCALE.index(v.notch_vote) for v in votes)   # ascending, AAA=0 ... CCC=6
        median_idx = idx[len(idx) // 2]   # even count: integer division picks the WORSE (higher-index) of the two middle values
        if |median_idx - NOTCH_SCALE.index(scorecard.indicative_notch)| > NOTCH_DEVIATION_MAX:
          session -> ADJOURNED with adjourn_reason NOTCH_DEVIATION_EXCEEDED
        else:
          outcome_notch = NOTCH_SCALE[median_idx]; session -> COMPLETED
    input_set: "CommitteeVote rows of this session; the engagement's current AnalyticalScorecard.indicative_notch"
    constants:
      COMMITTEE_SIZE: 5
      QUORUM_MIN_VOTES: 3
      NOTCH_DEVIATION_MAX: 1
      NOTCH_SCALE: [AAA, AA, A, BBB, BB, B, CCC]
    precision: "integer notch arithmetic; no rounding"

  - name: borrowing_cost_at_sale
    trigger: "POST /muni/bond-sales"
    algorithm: tiered_pricing
    formula: |
      notch_for_pricing = (pricing_mode == PROVISIONAL) ? scorecard.indicative_notch of the rating's engagement
                                                       : rating.notch (current published notch)
      effective_yield_bps = BENCHMARK_YIELD_BPS + SPREAD_BPS[notch_for_pricing]
      annual_interest_cents = round_half_up(par_amount_cents * effective_yield_bps / 10000)   # whole cents, PER YEAR FIRST
      total_interest_cents = maturity_years * annual_interest_cents                          # THEN multiply
      PINNED ROUNDING ORDER: round each year's interest to whole cents first, then multiply by
      maturity_years. The alternative (multiply exact annual interest by years, then round) is
      a different, forbidden order; e.g. par 1000000008 cents at 625 bps for 3 years yields
      total_interest_cents 187500003 (not 187500002).
    input_set: "the BondSale payload; the referenced rating (and, for PROVISIONAL, its engagement's scorecard)"
    constants:
      BENCHMARK_YIELD_BPS: 300
      SPREAD_AAA_BPS: 25
      SPREAD_AA_BPS: 45
      SPREAD_A_BPS: 90
      SPREAD_BBB_BPS: 150
      SPREAD_BB_BPS: 325
      SPREAD_B_BPS: 600
      SPREAD_CCC_BPS: 900
    precision: "0 decimal places (whole cents), round_half_up, per-year-then-multiply"
    variants:
      - name: PROVISIONAL
        when: "pricing_mode == PROVISIONAL; rating may be ASSIGNED or PUBLISHED"
        difference: "prices off the scorecard indicative_notch (pre-committee estimate)"
      - name: FINAL
        when: "pricing_mode == FINAL; rating must be PUBLISHED (ERR_RATING_STATE_INVALID)"
        difference: "prices off the rating's current published notch, reflecting post-publication actions"

  - name: disclosure_schedule
    trigger: "rating publication (period 1); each obligation submission (next period)"
    algorithm: chronological
    formula: |
      period 1 at publication: fiscal_year_end = first occurrence of issuer.fiscal_year_end (MM-DD at 00:00:00Z)
      STRICTLY AFTER published_at; if the issuer's MM-DD in the publication year is <= published_at's date,
      roll forward one calendar year.
      period n+1 at submission of period n: fiscal_year_end = period n's fiscal_year_end + 1 calendar year.
      due_at = fiscal_year_end + DISCLOSURE_DUE_DAYS days.
    input_set: "the rating being published / the obligation being submitted; issuer.fiscal_year_end"
    constants:
      DISCLOSURE_DUE_DAYS: 210
      DELINQUENCY_GRACE_DAYS: 30
      NONDISCLOSURE_WITHDRAW_DAYS: 60
    precision: "day granularity at 00:00:00Z"

  - name: surveillance_posture_derivation
    trigger: "clock sweep; obligation submission; rating reinstatement"
    algorithm: aggregation
    formula: |
      For a rating with status == PUBLISHED, over its obligations with status in {PENDING, OVERDUE, DELINQUENT}:
        surveillance_posture = DELINQUENT if any obligation is DELINQUENT
                             else GRACE if any obligation is OVERDUE
                             else CURRENT
      Ratings with status != PUBLISHED keep their last posture (frozen).
    input_set: "DisclosureObligation rows of the rating in open states"
    constants: {}
    precision: "exact state derivation; no rounding"

  - name: nondisclosure_sweep
    trigger: "POST /_clock/set_current_utc (every clock advance runs the full sweep)"
    algorithm: threshold
    formula: |
      EVALUATION ORDER IS PINNED (the steps form a circular-looking dependency between posture and
      withdrawal; this order resolves it deterministically):
        (1) per obligation of a PUBLISHED rating, in created_at ASC order:
              PENDING   and clock > due_at                  -> OVERDUE
              OVERDUE   and clock > due_at + 30 days        -> DELINQUENT (log OBLIGATION_DELINQUENT)
              DELINQUENT and clock > due_at + 60 days       -> DEFAULTED (set issuer.delinquent_flag = true)
            A single clock jump walks an obligation through as many flips as its thresholds allow,
            in this order, within the same sweep.
        (2) for each obligation flipped to DEFAULTED in step (1): its rating -> WITHDRAWN with
            withdraw_reason NON_DISCLOSURE, withdrawn_at = clock, notch_at_withdrawal = notch;
            log IssuerNotification RATING_WITHDRAWN.
        (3) recompute surveillance_posture for ratings still PUBLISHED (surveillance_posture_derivation);
            ratings withdrawn in step (2) are EXCLUDED (their posture stays DELINQUENT, frozen).
      Boundary semantics: all comparisons are STRICTLY greater-than; clock == due_at leaves PENDING.
    input_set: "all DisclosureObligation rows in {PENDING, OVERDUE, DELINQUENT} whose rating is PUBLISHED"
    constants:
      DELINQUENCY_GRACE_DAYS: 30
      NONDISCLOSURE_WITHDRAW_DAYS: 60
    precision: "second-precision clock comparisons, strict >"

  - name: criteria_review_fanout
    trigger: "POST /muni/criteria-versions/{id}/activate when a prior ACTIVE version for the same (jurisdiction_code, credit_type) existed"
    algorithm: aggregation
    formula: |
      eligible ratings = all Rating rows with status == PUBLISHED
        AND jurisdiction_code == activated.jurisdiction_code
        AND credit_type == activated.credit_type
        (regardless of which criteria version the rating was originally pinned to: the review is portfolio-wide)
      for each eligible rating, ordered by published_at ASC then created_at ASC:
        create CriteriaReviewItem { criteria_version_id = newly activated version, rating_id,
          status PENDING, due_at = activated_at + REVIEW_COMPLETION_DAYS days }
        set rating.review_pending = true
        log IssuerNotification REVIEW_OPENED for rating.issuer_id
      First activation of a (jurisdiction_code, credit_type) pair (no prior ACTIVE) creates NO items.
    input_set: "all PUBLISHED ratings in the activated criteria version's jurisdiction + credit segment"
    constants:
      REVIEW_COMPLETION_DAYS: 90
    precision: "day precision on due_at; deterministic fan-out order (published_at ASC, created_at ASC tie-break)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The caller's role must appear in the endpoint's roles list (incl. solicitation-role rule: only LeadAnalyst may create an UNSOLICITED engagement; only Issuer/Underwriter may create SOLICITED)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right; body-supplied FK references (issuer_id, underwriter_id, rating_id) must exist"
    error_id: "ERR_ISSUER_NOT_FOUND / ERR_UNDERWRITER_NOT_FOUND / ERR_ENGAGEMENT_NOT_FOUND / ERR_CRITERIA_VERSION_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_RATING_NOT_FOUND / ERR_APPEAL_NOT_FOUND / ERR_OBLIGATION_NOT_FOUND / ERR_BOND_SALE_NOT_FOUND / ERR_REVIEW_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK payload fields"
  - priority: 4
    category: existence
    check: "Request body well-formedness: required fields present, enums in range, end_at > start_at, par_amount_cents > 0, maturity_years in 1..30, withdraw_reason present iff action == WITHDRAW"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: business_referential
    check: "Ownership: caller X-User-ID must equal the owning id (engagement.issuer_id for accept-terms/documents/withdraw/appeals/obligation submit via the rating's issuer; session.chair_id for open/close/alternates); underwriter-created engagements must carry underwriter_id == X-User-ID; bond-sale rating must belong to the payload issuer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "accept-terms, documents, withdraw, appeals create, obligation submit, session open/close/alternates, engagement create, bond-sale create"
  - priority: 6
    category: state
    check: "Target resource state permits the operation (engagement state for documents/scorecard/scheduling; session SCHEDULED|IN_SESSION for open/close; IN_SESSION for votes; rating ASSIGNED for publish/appeals; rating PUBLISHED for actions; obligation not already submitted; review item PENDING|ESCALATED for begin, IN_REVIEW for complete; criteria DRAFT for activate; rating WITHDRAWN for reinstate incl. ERR_REINSTATE_NOT_PERMITTED when withdraw_reason != NON_DISCLOSURE)"
    error_id: "ERR_ENGAGEMENT_STATE_INVALID / ERR_SESSION_STATE_INVALID / ERR_RATING_STATE_INVALID / ERR_APPEAL_STATE_INVALID / ERR_OBLIGATION_STATE_INVALID / ERR_REVIEW_ITEM_STATE_INVALID / ERR_CRITERIA_VERSION_STATE_INVALID / ERR_WITHDRAWAL_NOT_PERMITTED / ERR_REINSTATE_NOT_PERMITTED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_engagement_version must equal engagement.version (scorecard POST); expected_rating_version must equal rating.version (actions POST)"
    error_id: "ERR_STALE_ENGAGEMENT_VERSION / ERR_STALE_RATING_VERSION"
    http_status: 412
    applies_to: "POST /muni/engagements/{id}/scorecard, POST /muni/ratings/{id}/actions"
  - priority: 8
    category: business_safety
    check: "Segregation of duties and vote integrity: a voter_id equal to the engagement's assigned_analyst_id may not cast a vote (ERR_ANALYST_VOTE_FORBIDDEN); a recused voter may not later cast a VOTE in the same session (ERR_RECUSED_VOTER_VOTE_FORBIDDEN); voter_id must equal X-User-ID and belong to the session pool (ERR_VOTER_NOT_ELIGIBLE)"
    error_id: "ERR_ANALYST_VOTE_FORBIDDEN / ERR_RECUSED_VOTER_VOTE_FORBIDDEN / ERR_VOTER_NOT_ELIGIBLE"
    http_status: 403
    applies_to: "POST /muni/committee-sessions/{id}/votes"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: appeal filing requires clock <= rating.assigned_at + 120h (ERR_APPEAL_WINDOW_CLOSED); session open requires start_at <= clock < end_at (ERR_SESSION_NOT_OPENABLE); publish requires clock > assigned_at + 120h (ERR_PUBLISH_WINDOW_NOT_ELAPSED); reinstate requires clock <= withdrawn_at + 180d (ERR_REINSTATE_WINDOW_EXPIRED)"
    error_id: "ERR_APPEAL_WINDOW_CLOSED / ERR_SESSION_NOT_OPENABLE / ERR_PUBLISH_WINDOW_NOT_ELAPSED / ERR_REINSTATE_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "appeals create, session open, rating publish, rating reinstate"
  - priority: 10
    category: business_constraint
    check: "Structural business rules, in this sub-order: (a) voter pool exactly 5 distinct ids (ERR_VOTER_POOL_INVALID); (b) vote kind exactly one of notch_vote / recusal_reason (ERR_VOTE_KIND_AMBIGUOUS); (c) criteria weights sum to exactly 1.000 (ERR_WEIGHT_SUM_INVALID); (d) factor scores integer 1..5 (ERR_FACTOR_SCORE_OUT_OF_RANGE); (e) document code in registry and not already received (ERR_DOCUMENT_CODE_UNKNOWN / ERR_DUPLICATE_DOCUMENT); (f) one appeal per rating, new-information codes disjoint from received (ERR_APPEAL_ALREADY_EXISTS / ERR_NO_NEW_INFORMATION); (g) one vote or recusal per voter per session (ERR_DUPLICATE_COMMITTEE_VOTE); (h) alternate only for a recused seat and not already pooled (ERR_ALTERNATE_NOT_PERMITTED); (i) an ACTIVE criteria version exists for (jurisdiction, credit_type) at scorecard submission (ERR_NO_ACTIVE_CRITERIA); (j) no ESCALATED review item on any rating of the engagement's issuer (ERR_ESCALATED_REVIEW_BLOCKS_SCHEDULING); (k) chair calendar half-open overlap and 24h same-engagement cooling-off (ERR_SESSION_WINDOW_OVERLAP / ERR_SESSION_COOLING_OFF); (l) posture gates on AFFIRM/UPGRADE and review_pending gate on actions (ERR_AFFIRM_BLOCKED_BY_POSTURE / ERR_UPGRADE_BLOCKED_BY_POSTURE / ERR_REVIEW_PENDING); (m) issuer delinquent_flag blocks new SOLICITED engagements (ERR_ISSUER_DELINQUENT); (n) reinstate requires all obligations resolved (ERR_UNRESOLVED_OBLIGATIONS); (o) adjacent-notch rule on UPGRADE/DOWNGRADE and new_notch required for RATING_ACTION review completion (ERR_NOTCH_STEP_INVALID / ERR_REVIEW_OUTCOME_NOTCH_REQUIRED)"
    error_id: "ERR_VOTER_POOL_INVALID / ERR_VOTE_KIND_AMBIGUOUS / ERR_WEIGHT_SUM_INVALID / ERR_FACTOR_SCORE_OUT_OF_RANGE / ERR_DOCUMENT_CODE_UNKNOWN / ERR_DUPLICATE_DOCUMENT / ERR_APPEAL_ALREADY_EXISTS / ERR_NO_NEW_INFORMATION / ERR_DUPLICATE_COMMITTEE_VOTE / ERR_ALTERNATE_NOT_PERMITTED / ERR_NO_ACTIVE_CRITERIA / ERR_ESCALATED_REVIEW_BLOCKS_SCHEDULING / ERR_SESSION_WINDOW_OVERLAP / ERR_SESSION_COOLING_OFF / ERR_AFFIRM_BLOCKED_BY_POSTURE / ERR_UPGRADE_BLOCKED_BY_POSTURE / ERR_REVIEW_PENDING / ERR_ISSUER_DELINQUENT / ERR_UNRESOLVED_OBLIGATIONS / ERR_NOTCH_STEP_INVALID / ERR_REVIEW_OUTCOME_NOTCH_REQUIRED"
    http_status: 422
    applies_to: "domain mutating endpoints"
  - priority: 11
    category: business_fiscal
    check: "Fee settlement: fee_payment_cents + apply_credit_cents == fee_cents (ERR_FEE_PAYMENT_MISMATCH); apply_credit_cents <= issuer.credit_balance_cents (ERR_INSUFFICIENT_ISSUER_CREDIT)"
    error_id: "ERR_FEE_PAYMENT_MISMATCH / ERR_INSUFFICIENT_ISSUER_CREDIT"
    http_status: 422
    applies_to: "POST /muni/engagements/{id}/accept-terms"
  - priority: 12
    category: business_constraint
    check: "Pagination: limit within 1..100, offset >= 0"
    error_id: ERR_INVALID_PAGINATION_PARAMETERS
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# All business endpoints live under api_prefix /muni. The logical-clock
# test-driving endpoint is a platform endpoint and intentionally unprefixed.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time. Each call runs the nondisclosure_sweep: obligation state flips, delinquency notifications, non-disclosure withdrawals, review-item escalations, posture recomputation, in the pinned evaluation order."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "nondisclosure_sweep across obligations, ratings, review items, issuer delinquent_flag"

  # --- Issuers ---
  - method: POST
    path: "/muni/issuers"
    description: "Register a municipal issuer"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, state_code, issuer_type, fiscal_year_end, population]
    output: Issuer
    side_effects:
      - "credit_balance_cents = 0; delinquent_flag = false"
  - method: GET
    path: "/muni/issuers"
    description: "List issuers"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "Issuer[]"
    side_effects: []
  - method: GET
    path: "/muni/issuers/{id}"
    description: "Get one issuer"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: Issuer
    side_effects: []
  - method: GET
    path: "/muni/issuers/{id}/notifications"
    description: "List the issuer's notification log (append-only issuer communications); result order pinned: created_at ASC (emission order)"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "IssuerNotification[]"
    side_effects: []

  # --- Underwriters ---
  - method: POST
    path: "/muni/underwriters"
    description: "Register an underwriter"
    roles: [PlatformAdmin]
    code: 201
    input: [firm_name, license_number]
    output: Underwriter
    side_effects: []
  - method: GET
    path: "/muni/underwriters/{id}"
    description: "Get one underwriter"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: Underwriter
    side_effects: []

  # --- Engagements ---
  - method: POST
    path: "/muni/engagements"
    description: "Open a rating engagement. Issuer role: issuer_id must equal X-User-ID. Underwriter role: underwriter_id must equal X-User-ID. LeadAnalyst role: creates UNSOLICITED engagements (solicitation must be UNSOLICITED). Multiple concurrent engagements per issuer (same or different credit_type) are permitted, modeling issuers rating with multiple agencies."
    roles: [Issuer, Underwriter, LeadAnalyst]
    code: 201
    input: [issuer_id, "underwriter_id?", solicitation, credit_type, jurisdiction_code]
    output: RatingEngagement
    side_effects:
      - "fee_cents per engagement_fee_and_refund; fee_paid = false (SOLICITED) / true (UNSOLICITED, fee waived)"
      - "required_document_codes derived from credit_type (SOLICITED) or [PUBLIC_FILING_FY] (UNSOLICITED)"
      - "status = REQUESTED (SOLICITED) | INFORMATION_GATHERING (UNSOLICITED)"
      - "SOLICITED creation blocked while issuer.delinquent_flag (ERR_ISSUER_DELINQUENT)"
  - method: GET
    path: "/muni/engagements"
    description: "List engagements with filters"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["issuer_id?", "underwriter_id?", "status?", "credit_type?", "limit?", "offset?"]
    output: "RatingEngagement[]"
    side_effects: []
  - method: GET
    path: "/muni/engagements/{id}"
    description: "Get one engagement"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: RatingEngagement
    side_effects: []
  - method: POST
    path: "/muni/engagements/{id}/accept-terms"
    description: "Issuer accepts engagement terms and settles the fee (cash + optional credit)"
    roles: [Issuer]
    code: 200
    input: [fee_payment_cents, "apply_credit_cents?"]
    output: RatingEngagement
    side_effects:
      - "REQUESTED -> ENGAGED; fee_paid = true; issuer.credit_balance_cents -= apply_credit_cents (default 0)"
      - "increments RatingEngagement.version by 1"
  - method: POST
    path: "/muni/engagements/{id}/documents"
    description: "Submit one information document by code. Issuer (owner) for SOLICITED engagements; LeadAnalyst for UNSOLICITED engagements."
    roles: [Issuer, LeadAnalyst]
    code: 200
    input: [document_code]
    output: RatingEngagement
    side_effects:
      - "ENGAGED -> INFORMATION_GATHERING on first document; -> ANALYSIS when required set covered"
      - "increments RatingEngagement.version by 1"
  - method: POST
    path: "/muni/engagements/{id}/withdraw"
    description: "Issuer withdraws a SOLICITED engagement before RATING_ASSIGNED; 50% fee refund to issuer credit when fee_paid"
    roles: [Issuer]
    code: 200
    input: []
    output: RatingEngagement
    side_effects:
      - "-> WITHDRAWN; refund_cents per engagement_fee_and_refund; issuer.credit_balance_cents += refund_cents"
      - "IssuerNotification ENGAGEMENT_WITHDRAWN"
      - "increments RatingEngagement.version by 1"
  - method: POST
    path: "/muni/engagements/{id}/scorecard"
    description: "Submit or supersede the analytical scorecard (OCC-guarded). Requires engagement in ANALYSIS or COMMITTEE_READY and an ACTIVE criteria version for the engagement's (jurisdiction_code, credit_type) (ERR_NO_ACTIVE_CRITERIA)."
    roles: [LeadAnalyst]
    code: 200
    input: [score_economy, score_management, score_budgetary_performance, score_flexibility, score_liquidity, score_debt_profile, expected_engagement_version]
    output: AnalyticalScorecard
    side_effects:
      - "weighted_scorecard calculation; ANALYSIS -> COMMITTEE_READY on first submission"
      - "assigned_analyst_id = caller X-User-ID"
      - "increments RatingEngagement.version by 1"
  - method: GET
    path: "/muni/engagements/{id}/scorecard"
    description: "Get the engagement's current scorecard (array of 0 or 1)"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: "AnalyticalScorecard[]"
    side_effects: []
  - method: GET
    path: "/muni/criteria-versions/{id}/scorecards"
    description: "List scorecards computed under a given criteria version"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "AnalyticalScorecard[]"
    side_effects: []

  # --- Criteria versions ---
  - method: POST
    path: "/muni/criteria-versions"
    description: "Create a jurisdiction-specific criteria version (DRAFT); the six weights must sum to exactly 1.000"
    roles: [SurveillanceOfficer]
    code: 201
    input: [jurisdiction_code, credit_type, version_label, w_economy, w_management, w_budgetary_performance, w_flexibility, w_liquidity, w_debt_profile]
    output: CriteriaVersion
    side_effects:
      - "status = DRAFT; activated_at = null"
  - method: GET
    path: "/muni/criteria-versions"
    description: "List criteria versions with filters"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["jurisdiction_code?", "credit_type?", "status?", "limit?", "offset?"]
    output: "CriteriaVersion[]"
    side_effects: []
  - method: GET
    path: "/muni/criteria-versions/{id}"
    description: "Get one criteria version"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: CriteriaVersion
    side_effects: []
  - method: POST
    path: "/muni/criteria-versions/{id}/activate"
    description: "Activate a DRAFT criteria version; supersedes the prior ACTIVE version for the same segment and fans out portfolio-wide review items"
    roles: [SurveillanceOfficer]
    code: 200
    input: []
    output: CriteriaVersion
    side_effects:
      - "DRAFT -> ACTIVE; activated_at = clock"
      - "prior ACTIVE version -> SUPERSEDED"
      - "criteria_review_fanout: review items + REVIEW_OPENED notifications + review_pending = true on affected PUBLISHED ratings"
      - "increments CriteriaVersion.version by 1"

  # --- Committee sessions ---
  - method: POST
    path: "/muni/engagements/{id}/committee-sessions"
    description: "Schedule a rating committee session. Pins the ACTIVE criteria version for the engagement's segment. Requires COMMITTEE_READY; blocked while any of the issuer's ratings has an ESCALATED review item; chair calendar half-open overlap and 24h same-engagement cooling-off apply."
    roles: [CommitteeChair]
    code: 201
    input: [start_at, end_at, voter_ids]
    output: CommitteeSession
    side_effects:
      - "status = SCHEDULED; chair_id = caller X-User-ID; criteria_version_id pinned; eligible_voter_count = 5"
  - method: GET
    path: "/muni/committee-sessions"
    description: "List committee sessions with filters"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["engagement_id?", "criteria_version_id?", "status?", "limit?", "offset?"]
    output: "CommitteeSession[]"
    side_effects: []
  - method: GET
    path: "/muni/committee-sessions/{id}"
    description: "Get one committee session"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: CommitteeSession
    side_effects: []
  - method: POST
    path: "/muni/committee-sessions/{id}/open"
    description: "Open a scheduled session; clock must satisfy start_at <= clock < end_at"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: CommitteeSession
    side_effects:
      - "SCHEDULED -> IN_SESSION; increments CommitteeSession.version by 1"
  - method: POST
    path: "/muni/committee-sessions/{id}/votes"
    description: "Cast a vote or recusal (one per voter; voter_id must equal X-User-ID and be in the pool; the engagement's assigned analyst and recused voters are barred from voting)"
    roles: [CommitteeMember]
    code: 201
    input: [voter_id, "notch_vote?", "recusal_reason?"]
    output: CommitteeVote
    side_effects:
      - "CommitteeVote appended; recusals extend session.recused_voter_ids"
      - "increments CommitteeSession.version by 1"
  - method: GET
    path: "/muni/committee-sessions/{id}/votes"
    description: "List votes of a session"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CommitteeVote[]"
    side_effects: []
  - method: POST
    path: "/muni/committee-sessions/{id}/alternates"
    description: "Appoint an alternate voter for a recused seat, restoring the eligible pool toward 5"
    roles: [CommitteeChair]
    code: 200
    input: [recused_voter_id, alternate_voter_id]
    output: CommitteeSession
    side_effects:
      - "appointed_alternate_ids += alternate_voter_id; eligible_voter_count recomputed"
      - "increments CommitteeSession.version by 1"
  - method: POST
    path: "/muni/committee-sessions/{id}/close"
    description: "Close and tally the session per committee_outcome_tally; COMPLETED assigns the rating, ADJOURNED leaves the engagement COMMITTEE_READY"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: CommitteeSession
    side_effects:
      - "committee_outcome_tally; on COMPLETED: Rating created ASSIGNED, engagement -> RATING_ASSIGNED, RATING_ASSIGNED notification"
      - "increments CommitteeSession.version by 1"

  # --- Ratings ---
  - method: GET
    path: "/muni/ratings"
    description: "List ratings with filters; result order pinned: created_at ASC (insertion order)"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["issuer_id?", "engagement_id?", "criteria_version_id?", "status?", "limit?", "offset?"]
    output: "Rating[]"
    side_effects: []
  - method: GET
    path: "/muni/ratings/{id}"
    description: "Get one rating"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: Rating
    side_effects: []
  - method: POST
    path: "/muni/ratings/{id}/publish"
    description: "Publish an ASSIGNED rating with rationale and outlook after the 120h appeal window has elapsed and no appeal is pending"
    roles: [LeadAnalyst]
    code: 200
    input: [outlook, rationale]
    output: Rating
    side_effects:
      - "ASSIGNED -> PUBLISHED; published_at = clock; engagement -> PUBLISHED"
      - "DisclosureObligation period 1 created per disclosure_schedule; RATING_PUBLISHED notification"
      - "increments Rating.version by 1"
  - method: POST
    path: "/muni/ratings/{id}/actions"
    description: "Surveillance rating action (OCC-guarded). AFFIRM/UPGRADE gated by surveillance_posture and review_pending; UPGRADE/DOWNGRADE move exactly one notch; WITHDRAW requires withdraw_reason ISSUER_REQUEST or CRITERIA."
    roles: [LeadAnalyst, SurveillanceOfficer]
    code: 200
    input: [action, "new_notch?", "new_outlook?", rationale, "withdraw_reason?", expected_rating_version]
    output: Rating
    side_effects:
      - "AFFIRM/UPGRADE/DOWNGRADE stay PUBLISHED; WITHDRAW -> WITHDRAWN (notch_at_withdrawal frozen)"
      - "notch_history appended; RATING_ACTION notification"
      - "increments Rating.version by 1"
  - method: POST
    path: "/muni/ratings/{id}/reinstate"
    description: "Reinstate a NON_DISCLOSURE-withdrawn rating within 180 days once all obligations are resolved"
    roles: [SurveillanceOfficer]
    code: 200
    input: []
    output: Rating
    side_effects:
      - "WITHDRAWN -> PUBLISHED; notch restored from notch_at_withdrawal; posture recomputed; RATING_REINSTATED notification"
      - "increments Rating.version by 1"

  # --- Appeals ---
  - method: POST
    path: "/muni/ratings/{id}/appeals"
    description: "Issuer files a pre-publication appeal citing document codes that constitute new information (disjoint from received_document_codes); one appeal per rating; window 120h from assignment inclusive"
    roles: [Issuer]
    code: 201
    input: [new_information_codes]
    output: Appeal
    side_effects:
      - "Appeal FILED"
  - method: GET
    path: "/muni/ratings/{id}/appeals"
    description: "List appeals for a rating (0 or 1)"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/muni/appeals/{id}"
    description: "Get one appeal"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/muni/appeals/{id}/decide"
    description: "Committee chair decides an appeal; UPHELD remands the rating and returns the engagement to COMMITTEE_READY"
    roles: [CommitteeChair]
    code: 200
    input: [decision, rationale]
    output: Appeal
    side_effects:
      - "FILED -> UPHELD | DENIED; on UPHELD rating -> REMANDED and engagement -> COMMITTEE_READY"
      - "APPEAL_UPHELD / APPEAL_DENIED notification"

  # --- Disclosure obligations ---
  - method: GET
    path: "/muni/ratings/{id}/disclosure-obligations"
    description: "List a rating's disclosure obligations in period order"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "DisclosureObligation[]"
    side_effects: []
  - method: GET
    path: "/muni/disclosure-obligations/{id}"
    description: "Get one disclosure obligation"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: DisclosureObligation
    side_effects: []
  - method: POST
    path: "/muni/disclosure-obligations/{id}/submit"
    description: "Issuer submits the periodic financial disclosure; on-time/late classification from the clock; creates the next annual period (except while the rating is WITHDRAWN)"
    roles: [Issuer]
    code: 200
    input: []
    output: DisclosureObligation
    side_effects:
      - "-> SUBMITTED_ON_TIME | SUBMITTED_LATE; submitted_at = clock"
      - "next-period obligation created when rating PUBLISHED; posture and issuer.delinquent_flag recomputed"

  # --- Bond sales ---
  - method: POST
    path: "/muni/bond-sales"
    description: "Price a bond sale against a rating of the same issuer; PROVISIONAL uses the scorecard indicative notch, FINAL requires PUBLISHED and uses the current notch (borrowing_cost_at_sale)"
    roles: [Issuer, Underwriter]
    code: 201
    input: [issuer_id, rating_id, par_amount_cents, maturity_years, sale_date, pricing_mode]
    output: BondSale
    side_effects:
      - "effective_yield_bps, annual_interest_cents, total_interest_cents computed"
  - method: GET
    path: "/muni/bond-sales"
    description: "List bond sales with filters"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["issuer_id?", "rating_id?", "limit?", "offset?"]
    output: "BondSale[]"
    side_effects: []
  - method: GET
    path: "/muni/bond-sales/{id}"
    description: "Get one bond sale"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: BondSale
    side_effects: []

  # --- Criteria review items ---
  - method: GET
    path: "/muni/review-items"
    description: "List portfolio review items with filters (fan-out order: rating published_at ASC, created_at ASC)"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: ["criteria_version_id?", "rating_id?", "status?", "limit?", "offset?"]
    output: "CriteriaReviewItem[]"
    side_effects: []
  - method: GET
    path: "/muni/review-items/{id}"
    description: "Get one review item"
    roles: [PlatformAdmin, Issuer, Underwriter, LeadAnalyst, CommitteeChair, CommitteeMember, SurveillanceOfficer]
    code: 200
    input: []
    output: CriteriaReviewItem
    side_effects: []
  - method: POST
    path: "/muni/review-items/{id}/begin"
    description: "Begin a review (PENDING or ESCALATED -> IN_REVIEW)"
    roles: [SurveillanceOfficer]
    code: 200
    input: []
    output: CriteriaReviewItem
    side_effects:
      - "-> IN_REVIEW; increments CriteriaReviewItem.version by 1"
  - method: POST
    path: "/muni/review-items/{id}/complete"
    description: "Complete a review with NO_ACTION or RATING_ACTION (new_notch required for the latter); notifies the issuer"
    roles: [SurveillanceOfficer]
    code: 200
    input: [outcome, "new_notch?", rationale]
    output: CriteriaReviewItem
    side_effects:
      - "IN_REVIEW -> COMPLETED_NO_ACTION | COMPLETED_RATING_ACTION"
      - "RATING_ACTION: rating.notch = new_notch, notch_history appended, Rating.version incremented"
      - "rating.review_pending recomputed; REVIEW_COMPLETED notification"
      - "increments CriteriaReviewItem.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list; also: non-LeadAnalyst creating UNSOLICITED engagement, or LeadAnalyst creating SOLICITED" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "X-User-ID does not match the owning identity (engagement issuer, session chair, underwriter on engagement create, bond-sale issuer)" }
  # --- existence ---
  - { id: ERR_ISSUER_NOT_FOUND, http: 404, condition: "issuer id does not exist" }
  - { id: ERR_UNDERWRITER_NOT_FOUND, http: 404, condition: "underwriter id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "engagement id does not exist" }
  - { id: ERR_CRITERIA_VERSION_NOT_FOUND, http: 404, condition: "criteria version id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "committee session id does not exist" }
  - { id: ERR_RATING_NOT_FOUND, http: 404, condition: "rating id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal id does not exist" }
  - { id: ERR_OBLIGATION_NOT_FOUND, http: 404, condition: "disclosure obligation id does not exist" }
  - { id: ERR_BOND_SALE_NOT_FOUND, http: 404, condition: "bond sale id does not exist" }
  - { id: ERR_REVIEW_ITEM_NOT_FOUND, http: 404, condition: "review item id does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum out of range, end_at <= start_at, par_amount_cents <= 0, maturity_years outside 1..30, withdraw_reason present iff action == WITHDRAW violated" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit outside 1..100 or offset < 0" }
  # --- state ---
  - { id: ERR_ENGAGEMENT_STATE_INVALID, http: 409, condition: "Engagement state does not permit the operation (e.g., documents before ENGAGED, scorecard before ANALYSIS, scheduling before COMMITTEE_READY)" }
  - { id: ERR_SESSION_STATE_INVALID, http: 409, condition: "Session state does not permit the operation (e.g., votes unless IN_SESSION, open/close from terminal states)" }
  - { id: ERR_RATING_STATE_INVALID, http: 409, condition: "Rating state does not permit the operation (e.g., publish/appeal unless ASSIGNED, actions unless PUBLISHED, reinstate unless WITHDRAWN, FINAL pricing unless PUBLISHED)" }
  - { id: ERR_APPEAL_STATE_INVALID, http: 409, condition: "Appeal already decided (decide from UPHELD/DENIED)" }
  - { id: ERR_OBLIGATION_STATE_INVALID, http: 409, condition: "Obligation already submitted (submit from SUBMITTED_ON_TIME or SUBMITTED_LATE)" }
  - { id: ERR_REVIEW_ITEM_STATE_INVALID, http: 409, condition: "Review item state does not permit the operation (begin unless PENDING/ESCALATED; complete unless IN_REVIEW)" }
  - { id: ERR_CRITERIA_VERSION_STATE_INVALID, http: 409, condition: "Criteria version not DRAFT (activate from ACTIVE/SUPERSEDED)" }
  - { id: ERR_WITHDRAWAL_NOT_PERMITTED, http: 409, condition: "Withdrawal of an UNSOLICITED engagement, or any withdrawal from RATING_ASSIGNED onward" }
  - { id: ERR_REINSTATE_NOT_PERMITTED, http: 409, condition: "Reinstate attempted on a rating withdrawn for a reason other than NON_DISCLOSURE" }
  # --- optimistic concurrency ---
  - { id: ERR_STALE_ENGAGEMENT_VERSION, http: 412, condition: "expected_engagement_version != engagement.version on scorecard submission" }
  - { id: ERR_STALE_RATING_VERSION, http: 412, condition: "expected_rating_version != rating.version on a rating action" }
  # --- business safety (vote integrity / segregation of duties) ---
  - { id: ERR_ANALYST_VOTE_FORBIDDEN, http: 403, condition: "voter_id equals the engagement's assigned_analyst_id (segregation of duties)" }
  - { id: ERR_RECUSED_VOTER_VOTE_FORBIDDEN, http: 403, condition: "a voter who recorded a RECUSAL attempts to cast a VOTE in the same session" }
  - { id: ERR_VOTER_NOT_ELIGIBLE, http: 403, condition: "voter_id does not equal X-User-ID or is not in the session pool (voter_ids + appointed_alternate_ids)" }
  # --- business temporal ---
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "clock > rating.assigned_at + 120h at appeal filing (boundary at exactly +120h is allowed)" }
  - { id: ERR_SESSION_NOT_OPENABLE, http: 409, condition: "session open outside [start_at, end_at): clock < start_at or clock >= end_at" }
  - { id: ERR_PUBLISH_WINDOW_NOT_ELAPSED, http: 409, condition: "publish attempted at clock <= assigned_at + 120h" }
  - { id: ERR_REINSTATE_WINDOW_EXPIRED, http: 422, condition: "reinstate attempted at clock > withdrawn_at + 180 days" }
  # --- business constraint ---
  - { id: ERR_VOTER_POOL_INVALID, http: 422, condition: "voter_ids is not exactly 5 distinct identifiers" }
  - { id: ERR_VOTE_KIND_AMBIGUOUS, http: 422, condition: "both or neither of notch_vote / recusal_reason supplied" }
  - { id: ERR_WEIGHT_SUM_INVALID, http: 422, condition: "the six criteria weights do not sum to exactly 1.000" }
  - { id: ERR_FACTOR_SCORE_OUT_OF_RANGE, http: 422, condition: "a factor score is not an integer in 1..5" }
  - { id: ERR_DOCUMENT_CODE_UNKNOWN, http: 422, condition: "document_code not in the document registry: AUDIT_FY, ADOPTED_BUDGET, TAX_BASE_REPORT, DEBT_STATEMENT, RATE_COVENANT, FLOW_OF_FUNDS, ENGINEERING_REPORT, MANAGEMENT_DISCUSSION, CAPITAL_PLAN, PUBLIC_FILING_FY, PENSION_VALUATION, EPA_LITIGATION_REPORT" }
  - { id: ERR_DUPLICATE_DOCUMENT, http: 409, condition: "document_code already in received_document_codes" }
  - { id: ERR_DUPLICATE_COMMITTEE_VOTE, http: 409, condition: "voter already has a recorded vote or recusal in this session" }
  - { id: ERR_APPEAL_ALREADY_EXISTS, http: 409, condition: "an appeal already exists for this rating (one appeal per rating)" }
  - { id: ERR_NO_NEW_INFORMATION, http: 422, condition: "new_information_codes empty, contains unknown codes, or any code already present in received_document_codes" }
  - { id: ERR_NO_ACTIVE_CRITERIA, http: 422, condition: "no ACTIVE criteria version for the engagement's (jurisdiction_code, credit_type) at scorecard submission" }
  - { id: ERR_SESSION_WINDOW_OVERLAP, http: 409, condition: "chair already has a SCHEDULED or IN_SESSION session whose half-open [start_at, end_at) intersects the requested window; adjacency (end == start) is permitted" }
  - { id: ERR_SESSION_COOLING_OFF, http: 409, condition: "same-engagement session start_at earlier than 24h after the latest prior session's end_at (gap >= 24h required, boundary allowed)" }
  - { id: ERR_ALTERNATE_NOT_PERMITTED, http: 409, condition: "recused_voter_id has no recorded recusal, alternate already in the pool or recused, or session terminal" }
  - { id: ERR_AFFIRM_BLOCKED_BY_POSTURE, http: 409, condition: "AFFIRM attempted while surveillance_posture == DELINQUENT" }
  - { id: ERR_UPGRADE_BLOCKED_BY_POSTURE, http: 409, condition: "UPGRADE attempted while surveillance_posture != CURRENT" }
  - { id: ERR_REVIEW_PENDING, http: 409, condition: "rating action attempted while review_pending is true (open criteria review item)" }
  - { id: ERR_ESCALATED_REVIEW_BLOCKS_SCHEDULING, http: 409, condition: "any rating of the engagement's issuer has an ESCALATED criteria review item" }
  - { id: ERR_ISSUER_DELINQUENT, http: 409, condition: "issuer.delinquent_flag true at SOLICITED engagement creation" }
  - { id: ERR_UNRESOLVED_OBLIGATIONS, http: 409, condition: "reinstate attempted while an obligation is PENDING, OVERDUE, DELINQUENT, or DEFAULTED" }
  - { id: ERR_NOTCH_STEP_INVALID, http: 422, condition: "UPGRADE/DOWNGRADE new_notch is not exactly one notch step on the NOTCH_SCALE" }
  - { id: ERR_REVIEW_OUTCOME_NOTCH_REQUIRED, http: 422, condition: "review completion with outcome RATING_ACTION lacks new_notch" }
  - { id: ERR_APPEAL_PENDING, http: 409, condition: "publish attempted while an appeal is FILED for the rating" }
  # --- fiscal ---
  - { id: ERR_FEE_PAYMENT_MISMATCH, http: 422, condition: "fee_payment_cents + apply_credit_cents != fee_cents at accept-terms" }
  - { id: ERR_INSUFFICIENT_ISSUER_CREDIT, http: 422, condition: "apply_credit_cents exceeds issuer.credit_balance_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; registers issuers/underwriters and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /muni/issuers"
      - "POST /muni/underwriters"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: Issuer
    description: "Municipal issuer acting on its own engagements, ratings, appeals, disclosures, and bond sales"
    identity: "entity_backed:Issuer"
    exclusive_operations:
      - "POST /muni/engagements/{id}/accept-terms"
      - "POST /muni/engagements/{id}/withdraw"
      - "POST /muni/ratings/{id}/appeals"
      - "POST /muni/disclosure-obligations/{id}/submit"
    shared_operations:
      - "POST /muni/engagements (SOLICITED, issuer_id == X-User-ID; shared with Underwriter)"
      - "POST /muni/engagements/{id}/documents (SOLICITED engagements owned by the issuer; shared with LeadAnalyst for UNSOLICITED)"
      - "POST /muni/bond-sales (shared with Underwriter)"
      - "All GET endpoints"
  - name: Underwriter
    description: "Underwriter requesting ratings on an issuer's behalf and pricing bond sales"
    identity: "entity_backed:Underwriter"
    exclusive_operations: []
    shared_operations:
      - "POST /muni/engagements (SOLICITED, underwriter_id == X-User-ID; shared with Issuer)"
      - "POST /muni/bond-sales (shared with Issuer)"
      - "All GET endpoints"
  - name: LeadAnalyst
    description: "Rating analyst; authors scorecards (becoming the barred assigned analyst), publishes ratings, files surveillance actions, creates unsolicited engagements"
    identity: opaque
    exclusive_operations:
      - "POST /muni/engagements/{id}/scorecard"
      - "POST /muni/ratings/{id}/publish"
    shared_operations:
      - "POST /muni/engagements (UNSOLICITED only)"
      - "POST /muni/engagements/{id}/documents (UNSOLICITED engagements only)"
      - "POST /muni/ratings/{id}/actions (shared with SurveillanceOfficer)"
      - "All GET endpoints"
  - name: CommitteeChair
    description: "Rating committee chair; schedules, opens, and closes sessions, appoints alternates, decides appeals"
    identity: opaque
    exclusive_operations:
      - "POST /muni/engagements/{id}/committee-sessions"
      - "POST /muni/committee-sessions/{id}/open"
      - "POST /muni/committee-sessions/{id}/close"
      - "POST /muni/committee-sessions/{id}/alternates"
      - "POST /muni/appeals/{id}/decide"
    shared_operations:
      - "All GET endpoints"
  - name: CommitteeMember
    description: "Committee voter; casts one vote or recusal per session"
    identity: opaque
    exclusive_operations:
      - "POST /muni/committee-sessions/{id}/votes"
    shared_operations:
      - "All GET endpoints"
  - name: SurveillanceOfficer
    description: "Surveillance and criteria officer; manages criteria versions, portfolio reviews, rating actions, reinstatements"
    identity: opaque
    exclusive_operations:
      - "POST /muni/criteria-versions"
      - "POST /muni/criteria-versions/{id}/activate"
      - "POST /muni/review-items/{id}/begin"
      - "POST /muni/review-items/{id}/complete"
      - "POST /muni/ratings/{id}/reinstate"
    shared_operations:
      - "POST /muni/ratings/{id}/actions (shared with LeadAnalyst)"
      - "All GET endpoints"
