# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# SFR Investment Marketplace (task_3307)
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: underwriting_noi_base_vs_redacted_variant
        grounds:
          - calculations.projected_noi
          - entities.Listing.fields.seller_asks_confidential
          - entities.UnderwritingReport.fields.disclosure_limited
        distinguishing_aspect: |
          Disclosure-limited variant operates on the UnderwritingReport entity
          domain (investment underwriting): identical rent/vacancy/opex inputs
          produce a different projected_noi_cents because the REDACTED variant
          adds a 300 bps vacancy uplift before the per-line floor.
        test_recipe:
          setup:
            - "Seller S with two listings: L_OPEN (seller_asks_confidential=false) and L_CONF (seller_asks_confidential=true), both SINGLE, asking_price_cents 24000000, in state TX"
            - "Buyer B registered in CA"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Sunbelt Holdings LLC", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Cal Capital", buyer_state: "CA", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "1 Oak St", listing_state: "TX", asking_price_cents: 24000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_open: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "2 Pine St", listing_state: "TX", asking_price_cents: 24000000, listing_kind: "SINGLE", seller_asks_confidential: true }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_conf: $.data.id }
          trigger:
            - call: "POST /marketplace/listings/${l_open}/underwriting-reports"
              payload: { buyer_id: "${b_id}", rent_estimate_cents: 200000, vacancy_rate_bps: 500, opex_rate_bps: 4000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { uw_open: $.data.id }
            - call: "POST /marketplace/listings/${l_conf}/underwriting-reports"
              payload: { buyer_id: "${b_id}", rent_estimate_cents: 200000, vacancy_rate_bps: 500, opex_rate_bps: 4000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { uw_conf: $.data.id }
          assert:
            - "UnderwritingReport.${uw_open}.disclosure_limited == false"
            - "UnderwritingReport.${uw_open}.projected_noi_cents == 1320000 (gross 2400000; vac floor(120000)=120000; opex floor(2280000*0.4)=912000)"
            - "UnderwritingReport.${uw_conf}.disclosure_limited == true"
            - "UnderwritingReport.${uw_conf}.projected_noi_cents == 1344000 (vac floor(2400000*0.08)=192000; opex floor(2208000*0.4)=883200)"
            - "UnderwritingReport.${uw_open}.projected_noi_cents != UnderwritingReport.${uw_conf}.projected_noi_cents for identical inputs"

      - name: guarantee_claim_vacancy_vs_lease_up_variant
        grounds:
          - calculations.guarantee_claim_amount
          - entities.Guarantee.fields.guarantee_kind
        distinguishing_aspect: |
          Guarantee variant divergence operates on the Guarantee/claim entity
          domain (insurance payout, not underwriting): VACANCY pays forward-
          looking remaining covered months while LEASE_UP reimburses historical
          unpaid/late PaymentRecords in the claim window, capped.
        test_recipe:
          setup:
            - "Program PROG cap 12; seller S with listing L1 (confidential=false) certified and LISTED; lease rent 150000 disclosed"
            - "Buyer B (CA, funds 100000000) bought L1: offer accepted, escrow signed (remote)/funded/closed at clock 2026-10-01; lease ASSIGNED"
            - "Two guarantees on L1: G_VAC (VACANCY, 6 months) and G_LU (LEASE_UP, 6 months), both ACTIVE"
            - "L1's lease is terminated post-sale via system state: to make VACANCY claimable the setup instead uses a second listing bought WITHOUT a lease (L2) — see chain; G_VAC is issued on L2"
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Sunbelt Holdings LLC", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Cal Capital", buyer_state: "CA", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "CertStd", min_inspection_score: 80, min_title_grade: "B", requires_lease_disclosure: false, guarantee_months_cap: 12 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "10 Main St", listing_state: "TX", asking_price_cents: 30000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id, l1_v0: $.data.version }
            - call: "POST /marketplace/listings/${l1}/inspection-reports"
              payload: { inspector_name: "Insp A", inspection_date: "2026-08-01T00:00:00Z", overall_score: 90, roof_score: 90, systems_score: 88, title_grade: "A", disclosed_defects: [ { code: "ROOF-1", severity: "LOW", description: "minor" } ] }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir1: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir1}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir1}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l1}/leases"
              payload: { tenant_alias: "T-1", monthly_rent_cents: 150000, lease_start: "2026-01-01T00:00:00Z", lease_end: "2026-12-31T00:00:00Z", deposit_cents: 150000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lease1: $.data.id }
            - call: "POST /marketplace/listings/${l1}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l1}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l1}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l1}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/listings/${l1}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1_v1: $.data.version }
            - call: "POST /marketplace/listings/${l1}/offers"
              payload: { buyer_id: "${b_id}", amount_cents: 30000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l1_v1}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off1: $.data.id }
            - call: "POST /marketplace/offers/${off1}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/offers/${off1}/transition"
              payload: { action: "ACCEPT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/offers/${off1}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc1: $.data.0.id, esc1_v0: $.data.0.version }
            - call: "POST /marketplace/escrows/${esc1}/transition"
              payload: { action: "SEND_DOCS", escrow_officer_name: "Officer One" }
              as: EscrowOfficer
            - call: "GET /marketplace/offers/${off1}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc1_v1: $.data.0.version }
            - call: "POST /marketplace/escrows/${esc1}/sign"
              payload: { expected_escrow_version: "${esc1_v1}", remote_notarization_ref: "NOTARY-99" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/escrows/${esc1}/fund"
              payload: { funded_amount_cents: 30000000 }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/escrows/${esc1}/transition"
              payload: { action: "CLOSE" }
              as: EscrowOfficer
            - call: "POST /marketplace/listings/${l1}/guarantees"
              payload: { guarantee_kind: "LEASE_UP", coverage_months: 6 }
              as: PlatformAdmin
              captures: { g_lu: $.data.id }
            - call: "POST /marketplace/leases/${lease1}/payment-records"
              payload: { due_date: "2026-10-01T00:00:00Z", amount_cents: 150000 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/guarantees/${g_lu}/transition"
              payload: { action: "CLAIM" }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "Guarantee.${g_lu}.status == CLAIMED"
            - "Guarantee.${g_lu}.claim_amount_cents == 150000 (one unpaid October record; LEASE_UP chronological variant sums unpaid/late records in window)"
            - "A VACANCY guarantee on the same listing would instead compute forward-looking remaining covered months; with the lease still ASSIGNED its claim is rejected ERR_GUARANTEE_NOT_CLAIMABLE — variant divergence is structural, not a sign flip"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: projected_noi_nested_rounding_order
        grounds:
          - calculations.projected_noi
          - calculations.projected_yield
        distinguishing_aspect: |
          Mode (b) nested rounding: the formula floors the vacancy line first,
          then floors opex on the post-vacancy base, then subtracts. Flooring
          only the final total (gross*(1-vac)*(1-opex) style) yields different
          cents and is forbidden.
        test_recipe:
          setup:
            - "Seller S, Buyer B, listing L SINGLE asking 24000000, seller_asks_confidential=false"
            - "Inputs chosen so rounding order matters: rent 199999, vac 333 bps, opex 3333 bps"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Roundtrip LLC", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Precise Buyer", buyer_state: "CA", entity_type: "INDIVIDUAL", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "3 Elm St", listing_state: "TX", asking_price_cents: 24000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /marketplace/listings/${l_id}/underwriting-reports"
              payload: { buyer_id: "${b_id}", rent_estimate_cents: 199999, vacancy_rate_bps: 333, opex_rate_bps: 3333 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { uw: $.data.id }
          assert:
            - "gross = 199999*12 = 2399988"
            - "vac = floor(2399988*333/10000) = floor(79919.6) = 79919"
            - "opex = floor((2399988-79919)*3333/10000) = floor(773225.99...) = 773225"
            - "UnderwritingReport.${uw}.projected_noi_cents == 1546844"
            - "UnderwritingReport.${uw}.projected_yield_bps == floor(1546844*10000/24000000) == 644"

      - name: pm_onboarding_fee_circular_order_pinned
        grounds:
          - calculations.pm_onboarding_fee
          - state_machines.Escrow.FUNDED_to_CLOSED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the onboarding fee derives from
          the lease's scheduled annual rent and the PM fee basis, computed in a
          pinned order (resolve lease -> annualize -> apply bps -> floor) at
          the moment the referral onboards during the closing cascade; the fee
          must not feed back into the lease or offer.
        test_recipe:
          setup:
            - "Full sale pipeline on listing L with lease rent 125000 (12*125000=1500000 annual) and PM fee 150 bps"
            - "Escrow FUNDED; referral in ACCEPTED; clock at 2026-09-15"
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Fee Test LLC", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Buyer B", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "Prog", min_inspection_score: 50, min_title_grade: "C", requires_lease_disclosure: false, guarantee_months_cap: 12 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/property-managers"
              payload: { company_name: "PM Co", markets: ["TX"], onboarding_fee_bps: 150, monthly_fee_bps: 800 }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "7 Fee St", listing_state: "TX", asking_price_cents: 20000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "Insp", inspection_date: "2026-08-15T00:00:00Z", overall_score: 70, roof_score: 70, systems_score: 70, disclosed_defects: [], title_grade: "B" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/leases"
              payload: { tenant_alias: "T-F", monthly_rent_cents: 125000, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z", deposit_cents: 125000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/management-referrals"
              payload: { property_manager_id: "${pm_id}" }
              as: PlatformAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /marketplace/management-referrals/${ref_id}/transition"
              payload: { action: "ACCEPT" }
              as: PropertyManager
              as_user_id: "${pm_id}"
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b_id}", amount_cents: 20000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id }
            - call: "POST /marketplace/offers/${off_id}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/offers/${off_id}/transition"
              payload: { action: "ACCEPT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/offers/${off_id}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc_id: $.data.0.id }
            - call: "POST /marketplace/escrows/${esc_id}/transition"
              payload: { action: "SEND_DOCS", escrow_officer_name: "Officer" }
              as: EscrowOfficer
            - call: "GET /marketplace/offers/${off_id}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc_v: $.data.0.version }
            - call: "POST /marketplace/escrows/${esc_id}/sign"
              payload: { expected_escrow_version: "${esc_v}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/escrows/${esc_id}/fund"
              payload: { funded_amount_cents: 20000000 }
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /marketplace/escrows/${esc_id}/transition"
              payload: { action: "CLOSE" }
              as: EscrowOfficer
          assert:
            - "ManagementReferral.${ref_id}.status == ONBOARDED"
            - "ManagementReferral.${ref_id}.onboarding_fee_cents == 22500 (floor(125000*12*150/10000))"
            - "ManagementReferral.${ref_id}.lease_continuity_confirmed == true"
            - "Lease.${lease_id}.status == ASSIGNED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycle
        grounds:
          - state_machines.Offer.SUBMITTED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on the Offer entity: SUBMITTED->COUNTERED->SUBMITTED
          loops with round_number incrementing per cycle until
          MAX_NEGOTIATION_ROUNDS; expires_at refreshes on each resubmit.
        test_recipe:
          setup:
            - "Certified LISTED listing L (program min score 50, no lease requirement); buyer B with funds; offer O submitted at clock 2026-09-01"
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Cycle Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Cycle Buyer", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "P", min_inspection_score: 50, min_title_grade: "C", requires_lease_disclosure: false, guarantee_months_cap: 6 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "9 Loop St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 60, roof_score: 60, systems_score: 60, disclosed_defects: [], title_grade: "B" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b_id}", amount_cents: 9000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off: $.data.id }
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "COUNTER", counter_amount_cents: 9500000 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "RESUBMIT", amount_cents: 9400000 }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "COUNTER", counter_amount_cents: 9600000 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "RESUBMIT", amount_cents: 9550000 }
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "Offer.${off}.status == SUBMITTED after the second resubmit"
            - "Offer.${off}.round_number == 3 (1 initial + 2 counter cycles)"
            - "Offer.${off}.amount_cents == 9550000"

      - name: inspection_revision_loop
        grounds:
          - state_machines.InspectionReport.REJECTED_to_DRAFT
          - state_machines.InspectionReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on the InspectionReport entity (different entity than
          Offer): DRAFT->SUBMITTED->REJECTED->DRAFT revision loop, usable
          multiple times until verification succeeds.
        test_recipe:
          setup:
            - "Seller S with DRAFT listing L; inspection report IR created"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
