          setup:
            - "Customer C7 ACTIVE, PA7 ACTIVE TOLLING_FEE, R7 APPROVED with FLAMMABLE component, L7 FLAMMABLE lot"
            - "Tank T7 Z_FLAM CLEAN_VALIDATED"
