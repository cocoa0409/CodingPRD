            - { call: "POST /gifted/students", payload: { student_number: "ST-B", legal_name: "Stu B", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-b" }, as: GiftedCoordinator, captures: { stu_b: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu_b}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_b: $.data.id } }
