  - section: consistency
    instances:
      - name: immediate_consistency_after_write
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the create response itself carries computed fields (net_wet_cwt 363.00, provisional 340.32), and a read-after-write on lot, bin stock (100.00 after store) and contract (fulfilled 100.00 after grade) reflects the mutation without any delay or refresh call."
        test_recipe:
          setup: ["season INTAKE_OPEN; grower; contract 400.00; bin"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/contracts"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", contracted_cwt: 400.00, base_price_cents_per_cwt: 1500, grade_adjustments: { US_NO_1: 0, US_NO_2: 0, US_NO_3: 0, US_NO_4: 0, US_NO_5: 0, SAMPLE: 0 } }
              as: Merchandiser
              captures: { c_id: $.data.id, cv1: $.data.version }
            - call: "POST /mill/bins"
              payload: { season_id: "${s_id}", bin_code: "B-01", capacity_cwt: 500.00 }
              as: MillAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${cv1}", gross_weight_lbs: 48300, tare_weight_lbs: 12000, scheduled_date: "2026-08-10", moisture_pct_handheld: 18.0 }
              as: ScaleOperator
              captures: { l1: $.data.id, net: $.data.net_wet_cwt, prov: $.data.provisional_dry_weight_cwt }
            - call: "POST /mill/lots/${l1}/grade"
              payload: { moisture_pct_official: 13.0, foreign_matter_pct: 0.2, damage_pct: 0.2, broken_pct: 0.6 }
