scenario: |
  Transcript Ordering & Credential Verification (registrar transcript office): order intake & identity/authorization verification, hold checks (financial/library) & release rules, electronic vs paper delivery & recipient routing, rush processing & fee schedule, third-party verification request handling & consent, historical/archived record retrieval, error correction & reissue, national clearinghouse reporting

domain_name: transcript-ordering-credential
api_prefix: /registrar

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
    - soft_delete
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: "Institution-assigned student number; unique tenant-wide."
        constraints: "Unique; 6–12 alphanumeric."
      - name: full_name
        type: string
        source: input
        description: "Legal name on record."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date; used by identity verification."
      - name: email
        type: string
        source: input
        description: "Primary contact email."
      - name: status
        type: enum
        source: system
        description: "Registrar-level enrollment posture."
        constraints: "ACTIVE | INACTIVE | GRADUATED | WITHDRAWN | DECEASED"
        default: ACTIVE
      - name: ferpa_restricted
        type: boolean
        source: input
        description: "FERPA directory-information restriction flag; when true, third-party verification without explicit consent is forbidden."
        default: false
      - name: archived_record_flag
        type: boolean
        source: input
        description: "True when the student's record has been moved to the offline archive (typically pre-1990 paper records)."
        default: false

  - name: StudentRecord
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; owning student."
      - name: effective_term
        type: string
        source: input
        description: "Term this record snapshot represents (e.g. 2026-SPR)."
      - name: gpa_cents
        type: integer
        source: computed
        description: "GPA * 100 (2.50 -> 250); integer to avoid float drift."
      - name: earned_credits
        type: integer
        source: input
        description: "Total earned credit hours."
      - name: degree_awarded
        type: boolean
        source: input
        description: "Whether a degree has been conferred on this record."
        default: false
      - name: record_version
        type: integer
        source: system
        description: "Monotonic snapshot counter; increments whenever registrar publishes a new snapshot for the same student."
        default: 1
      - name: is_current
        type: boolean
        source: computed
        description: "True iff this is the latest record_version for the student; recomputed on every publish."

  - name: Recipient
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: "Routing discriminator."
        constraints: "ELECTRONIC_NETWORK | EMAIL_PDF | PAPER_MAIL | PICKUP"
      - name: display_name
        type: string
        source: input
        description: "Human-readable recipient name (university, employer, self)."
      - name: network_code
        type: string
        source: input
        description: "Clearinghouse network routing code. Required iff kind == ELECTRONIC_NETWORK; null otherwise."
      - name: email_address
        type: string
        source: input
        description: "Required iff kind == EMAIL_PDF; null otherwise."
      - name: postal_address
        type: string
        source: input
        description: "Required iff kind == PAPER_MAIL; null otherwise."
      - name: active
        type: boolean
        source: input
        description: "Soft-deactivation flag; inactive recipients cannot be added to new orders but historical OrderLineItems keep their FK."
        default: true

  - name: Hold
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student the hold sits on."
      - name: hold_type
        type: enum
        source: input
        description: "Origin office of the hold."
        constraints: "FINANCIAL | LIBRARY | REGISTRAR | DISCIPLINARY"
      - name: status
        type: enum
        source: system
        description: "Hold lifecycle."
        constraints: "ACTIVE | RELEASED | EXPIRED"
        default: ACTIVE
      - name: blocking_scope
        type: enum
        source: input
        description: "What this hold blocks. OFFICIAL blocks official transcripts only; ALL blocks official + verification requests; NONE is retained for legacy data."
        constraints: "OFFICIAL | ALL | NONE"
      - name: amount_cents
        type: integer
        source: input
        description: "For FINANCIAL holds, the outstanding balance; 0 for non-financial."
        default: 0
      - name: placed_at
        type: datetime
        source: system
        description: "Server-stamped at creation."
      - name: released_at
        type: datetime
        source: system
        description: "Server-stamped on release; null while ACTIVE."

  - name: IdentityVerification
    parent: Student
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; subject of the verification."
      - name: order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; order this verification is bound to."
      - name: method
        type: enum
        source: input
        description: "How identity was established."
        constraints: "SSN_DOB | GOVERNMENT_ID | IN_PERSON | NOTARIZED"
      - name: status
        type: enum
        source: system
        description: "Verification lifecycle."
        constraints: "PENDING | VERIFIED | REJECTED | EXPIRED"
        default: PENDING
      - name: verification_token
        type: string
        source: system
        description: "Server-minted one-time token returned to the caller; must be presented to /identity-verifications/{id}/confirm."
      - name: expires_at
        type: datetime
        source: system
        description: "Server-set to created_at + 72h at creation; compared against the logical clock."

  - name: TranscriptOrder
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; subject of the order."
      - name: order_kind
        type: enum
        source: input
        description: "OFFICIAL = sealed/registrar-issued; UNOFFICIAL = student-view copy."
        constraints: "OFFICIAL | UNOFFICIAL"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment pipeline state (parallel dimension 1)."
        constraints: "DRAFT | SUBMITTED | IDENTITY_PENDING | HOLD_CHECK | READY_TO_FULFILL | IN_TRANSIT | DELIVERED | REISSUE_PENDING | CANCELLED | FAILED"
        default: DRAFT
      - name: payment_status
        type: enum
        source: system
        description: "Payment pipeline state (parallel dimension 2); evolves independently of fulfillment_status."
        constraints: "UNPAID | AUTHORIZED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED | WAIVED"
        default: UNPAID
      - name: rush_requested
        type: boolean
        source: input
        description: "Whether the requestor asked for rush handling."
        default: false
      - name: rush_qualified
        type: boolean
        source: computed
        description: "True iff rush_requested AND the order was submitted before the current day's rush cutoff AND every line item's delivery_kind supports rush. Recomputed at submit and whenever a line item changes."
        default: false
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: "Provisional fee quote at submit time (see fee_quote_provisional); never changes after submit."
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Final reconciled fee (see fee_quote_final); starts equal to quoted_fee_cents, recalculated on capture, line-item adjustment, or reissue."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Server-stamped at DRAFT -> SUBMITTED."
      - name: cancelled_reason
        type: string
        source: input
        description: "Free-text reason supplied on cancel."
      - name: reissue_of_order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; self-referential — set when this order is itself a reissue of an earlier delivered order; null otherwise."

  - name: OrderLineItem
    parent: TranscriptOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; owning order."
      - name: recipient_id
        type: string
        source: input
        description: "FK -> Recipient.id; routing target."
      - name: delivery_kind
        type: enum
        source: input
        description: "Format requested for this line."
        constraints: "ELECTRONIC_NETWORK | EMAIL_PDF | PAPER_MAIL | PICKUP"
      - name: quantity
        type: integer
        source: input
        description: "Copies for this recipient; 1–10."
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Per-copy price from the fee schedule that was effective at order submit."
        default: 0
      - name: line_status
        type: enum
        source: system
        description: "Per-line delivery lifecycle."
        constraints: "PENDING | QUEUED | SENT | DELIVERED | BOUNCED | CANCELLED"
        default: PENDING
      - name: tracking_ref
        type: string
        source: system
        description: "Carrier/network tracking reference once SENT; null before."
      - name: archived_retrieval_id
        type: string
        source: input
        description: "FK -> ArchivedRecordRetrieval.id; non-null when this line could only be fulfilled by pulling the record from archive."

  - name: ArchivedRecordRetrieval
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; whose archived record is being retrieved."
      - name: requested_by_order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; order that triggered the retrieval."
      - name: retrieval_status
        type: enum
        source: system
        description: "Archive-pull lifecycle."
        constraints: "REQUESTED | PULLED | DIGITIZED | ATTACHED | FAILED"
        default: REQUESTED
      - name: sla_due_at
        type: datetime
        source: computed
        description: "created_at + RETRIEVAL_SLA_HOURS (48); drives escalations."
      - name: digitized_record_id
        type: string
        source: input
        description: "FK -> StudentRecord.id; record produced by digitization; null until DIGITIZED."

  - name: ConsentGrant
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; grantor."
      - name: grantee_name
        type: string
        source: input
        description: "Third party allowed to receive verification."
      - name: scope
        type: enum
        source: input
        description: "What the grant covers."
        constraints: "ENROLLMENT_ONLY | DEGREE_ONLY | FULL_RECORD"
      - name: status
        type: enum
        source: system
        description: "Grant lifecycle."
        constraints: "ACTIVE | REVOKED | EXPIRED"
        default: ACTIVE
      - name: expires_at
        type: datetime
        source: input
        description: "Grant expiry; must be in the future at grant time."

  - name: VerificationRequest
    parent: null
    common_fields: true
    fields:
      - name: requester_name
        type: string
        source: input
        description: "Third party making the request (employer, background-check firm)."
      - name: subject_student_id
        type: string
        source: input
        description: "FK -> Student.id; whose credential is being verified."
      - name: consent_grant_id
        type: string
        source: input
        description: "FK -> ConsentGrant.id; required iff subject_student.ferpa_restricted is true OR scope exceeds ENROLLMENT_ONLY; otherwise optional."
      - name: scope
        type: enum
        source: input
        description: "Breadth of verification requested."
        constraints: "ENROLLMENT_ONLY | DEGREE_ONLY | FULL_RECORD"
      - name: status
        type: enum
        source: system
        description: "Verification pipeline state."
        constraints: "RECEIVED | CONSENT_CHECK | APPROVED | DENIED | REPORTED | CANCELLED"
        default: RECEIVED
      - name: fee_cents
        type: integer
        source: computed
        description: "Verification fee (see verification_fee); fixed at approval."
        default: 0
      - name: denial_reason
        type: string
        source: system
        description: "Reason code when status == DENIED."

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique schedule code (e.g. STD-2026)."
        constraints: "Unique."
      - name: official_base_cents
        type: integer
        source: input
        description: "Per-copy base price for OFFICIAL transcripts."
      - name: unofficial_base_cents
        type: integer
        source: input
        description: "Per-copy base price for UNOFFICIAL transcripts."
      - name: paper_surcharge_cents
        type: integer
        source: input
        description: "Per-copy surcharge for PAPER_MAIL delivery."
      - name: pickup_surcharge_cents
        type: integer
        source: input
        description: "Per-copy surcharge for PICKUP."
      - name: rush_flat_cents
        type: integer
        source: input
        description: "Flat per-order rush fee."
      - name: rush_multiplier_bp
        type: integer
        source: input
        description: "Rush multiplier in basis points applied to the subtotal (e.g. 15000 = 1.5x). Applied in addition to rush_flat_cents."
      - name: volume_tiers
        type: array
        source: input
        description: "Ordered list of {min_copies:int, discount_bp:int} — discount applies to the whole order when total copies >= min_copies. Higher min_copies wins; at tie on min_copies the first-listed tier wins."
      - name: effective_from
        type: datetime
        source: input
        description: "Start of effective window (inclusive)."
      - name: effective_to
        type: datetime
        source: input
        description: "End of effective window (exclusive); null means open-ended."
      - name: active
        type: boolean
        source: input
        description: "Soft-toggle. Only one schedule may be active at any logical instant."
        default: true

  - name: Payment
    parent: TranscriptOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; owning order."
      - name: amount_cents
        type: integer
        source: computed
        description: "Authorized amount; equals quoted_fee_cents at authorize, reconciled to final_fee_cents at capture."
        default: 0
      - name: captured_cents
        type: integer
        source: computed
        description: "Total captured to date."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Total refunded to date."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle."
        constraints: "AUTHORIZED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED | VOIDED | FAILED"
        default: AUTHORIZED
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied idempotency key; unique per order."
      - name: gateway_ref
        type: string
        source: system
        description: "Server-stamped payment-gateway reference at authorize."

  - name: ReissueRequest
    parent: TranscriptOrder
    common_fields: true
    fields:
      - name: original_order_id
        type: string
        source: input
        description: "FK -> TranscriptOrder.id; the DELIVERED order being corrected."
      - name: reason
        type: enum
        source: input
        description: "Why a reissue is needed."
        constraints: "NAME_CORRECTION | RECORD_CORRECTION | DAMAGED_IN_MAIL | NEVER_RECEIVED | WRONG_RECIPIENT"
      - name: status
        type: enum
        source: system
        description: "Reissue lifecycle."
        constraints: "REQUESTED | APPROVED | REJECTED | FULFILLED"
        default: REQUESTED
      - name: replacement_order_id
        type: string
        source: system
        description: "FK -> TranscriptOrder.id; new order created upon APPROVED; null before."
      - name: reviewed_by
        type: string
        source: system
        description: "X-User-ID of the RegistrarReviewer who approved/rejected; used to enforce segregation of duties."
      - name: fee_waived
        type: boolean
        source: input
        description: "If true, replacement order is created with payment_status = WAIVED; if false, replacement goes through normal authorization."
        default: false

  - name: ClearinghouseReportBatch
    parent: null
    common_fields: true
    fields:
      - name: report_period_start
        type: datetime
        source: input
        description: "Inclusive start of reporting period."
      - name: report_period_end
        type: datetime
        source: input
        description: "Exclusive end of reporting period."
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle."
        constraints: "OPEN | LOCKED | TRANSMITTED | ACKED | FAILED"
        default: OPEN
      - name: order_count
        type: integer
        source: computed
        description: "Number of orders swept into this batch."
        default: 0
      - name: verification_count
        type: integer
        source: computed
        description: "Number of VerificationRequests swept into this batch."
        default: 0
      - name: transmitted_at
        type: datetime
        source: system
        description: "Server-stamped at LOCKED -> TRANSMITTED."

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: aggregate_type
        type: string
        source: system
        description: "Entity type of the affected aggregate."
      - name: aggregate_id
      # generic FK — polymorphic; not parsed by FK linter because description does not start with FK ->
        type: string
        source: system
        description: "ID of the affected aggregate (polymorphic across entities)."
      - name: actor_role
        type: string
        source: system
        description: "Role header that performed the action."
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID header that performed the action; null for system."
      - name: action
        type: string
        source: system
        description: "Stable action identifier (e.g. ORDER_SUBMIT, HOLD_RELEASE)."
      - name: payload_hash
        type: string
        source: system
        description: "SHA-256 over the canonical event payload; tamper evidence."
      - name: recorded_at
        type: datetime
        source: system
        description: "Server-stamped."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TranscriptOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED, FAILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /registrar/orders/{id}/submit"
        actor: Student
        preconditions:
          - "fulfillment_status == DRAFT"
          - "order has >= 1 OrderLineItem"
          - "IdentityVerification for this order exists with status == VERIFIED"
          - "expected_order_version == TranscriptOrder.version"
        side_effects:
          - "set submitted_at = clock.now()"
          - "recompute rush_qualified via rush_qualification"
          - "compute quoted_fee_cents via fee_quote_provisional; store on order"
          - "set final_fee_cents = quoted_fee_cents"
          - "advance fulfillment_status -> HOLD_CHECK if any blocking Hold exists; else advance directly to READY_TO_FULFILL"
          - "increments TranscriptOrder.version by 1"
          - "emit AuditEvent ORDER_SUBMIT"
      - from: SUBMITTED
        to: HOLD_CHECK
        trigger: "system (entered when submit detects >= 1 ACTIVE Hold with blocking_scope IN {ALL, OFFICIAL} and order_kind == OFFICIAL)"
        actor: system
        preconditions:
          - "order_kind == OFFICIAL"
          - "exists Hold h on student with h.status == ACTIVE and (h.blocking_scope == ALL or h.blocking_scope == OFFICIAL)"
        side_effects:
          - "notify student (side effect only — no state change)"
          - "increments TranscriptOrder.version by 1"
      - from: HOLD_CHECK
        to: READY_TO_FULFILL
        trigger: "system (fired when the last blocking Hold on the student leaves ACTIVE)"
        actor: system
        preconditions:
          - "no Hold h on student with h.status == ACTIVE and (h.blocking_scope == ALL or h.blocking_scope == OFFICIAL)"
        side_effects:
          - "fan out: each PENDING OrderLineItem -> QUEUED"
          - "increments TranscriptOrder.version by 1"
          - "emit AuditEvent HOLD_CLEARED"
      - from: HOLD_CHECK
        to: CANCELLED
        trigger: "POST /registrar/orders/{id}/cancel"
        actor: Student
        preconditions:
          - "fulfillment_status IN {HOLD_CHECK, READY_TO_FULFILL, IDENTITY_PENDING}"
          - "payment_status IN {UNPAID, AUTHORIZED} (refund handled on payment dimension)"
        side_effects:
          - "cancel all non-terminal OrderLineItems"
          - "void Payment if status == AUTHORIZED"
          - "increments TranscriptOrder.version by 1"
          - "emit AuditEvent ORDER_CANCELLED"
      - from: READY_TO_FULFILL
        to: IN_TRANSIT
        trigger: "system (fired when first OrderLineItem -> SENT)"
        actor: system
        preconditions:
          - "payment_status IN {CAPTURED, WAIVED}"
        side_effects:
          - "increments TranscriptOrder.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (fired when all OrderLineItems reach a terminal delivery state and at least one is DELIVERED)"
        actor: system
        preconditions:
          - "every OrderLineItem.line_status IN {DELIVERED, BOUNCED, CANCELLED}"
          - "count of OrderLineItem.line_status == DELIVERED >= 1"
        side_effects:
          - "increments TranscriptOrder.version by 1"
          - "emit AuditEvent ORDER_DELIVERED"
      - from: IN_TRANSIT
        to: FAILED
        trigger: "system (fired when all OrderLineItems reach a terminal delivery state and none is DELIVERED)"
        actor: system
        preconditions:
          - "every OrderLineItem.line_status IN {DELIVERED, BOUNCED, CANCELLED}"
          - "count of OrderLineItem.line_status == DELIVERED == 0"
        side_effects:
          - "auto-refund Payment.captured_cents (status -> REFUNDED)"
          - "increments TranscriptOrder.version by 1"
          - "emit AuditEvent ORDER_FAILED"
      - from: DELIVERED
        to: REISSUE_PENDING
        trigger: "POST /registrar/orders/{id}/reissue-requests"
        actor: Student
        preconditions:
          - "fulfillment_status == DELIVERED"
        side_effects:
          - "create ReissueRequest with status REQUESTED"
          - "increments TranscriptOrder.version by 1"
      - from: REISSUE_PENDING
        to: DELIVERED
        trigger: "POST /registrar/reissue-requests/{id}/reject"
        actor: RegistrarReviewer
        preconditions:
          - "ReissueRequest.status == REQUESTED"
          - "reviewer X-User-ID != Student.id who placed the original order (segregation of duties)"
        side_effects:
          - "ReissueRequest.status -> REJECTED"
          - "increments TranscriptOrder.version by 1"
      - from: REISSUE_PENDING
        to: IN_TRANSIT
        trigger: "POST /registrar/reissue-requests/{id}/approve"
        actor: RegistrarReviewer
        preconditions:
          - "ReissueRequest.status == REQUESTED"
          - "reviewer X-User-ID != Student.id who placed the original order (segregation of duties)"
        side_effects:
          - "ReissueRequest.status -> APPROVED, reviewed_by set"
          - "create replacement TranscriptOrder (reissue_of_order_id = original.id, fulfillment_status = READY_TO_FULFILL)"
          - "replacement OrderLineItems copied from original, line_status = QUEUED"
          - "if ReissueRequest.fee_waived, replacement.payment_status = WAIVED"
          - "increments TranscriptOrder.version by 1"
          - "emit AuditEvent REISSUE_APPROVED"

  - entity: TranscriptOrder.payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, WAIVED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /registrar/payments (authorize)"
        actor: Student
        preconditions:
          - "order.fulfillment_status IN {SUBMITTED, HOLD_CHECK, READY_TO_FULFILL}"
          - "no existing Payment for order with status IN {AUTHORIZED, CAPTURED}"
        side_effects:
          - "create Payment with amount_cents = order.quoted_fee_cents, status AUTHORIZED"
          - "increments TranscriptOrder.version by 1"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /registrar/payments/{id}/capture"
        actor: RegistrarOperator
        preconditions:
          - "Payment.status == AUTHORIZED"
          - "order.fulfillment_status != CANCELLED"
        side_effects:
          - "Payment.captured_cents = recomputed via payment_capture_reconcile (may differ from amount_cents if final_fee_cents drifted)"
          - "Payment.amount_cents = order.final_fee_cents (reconciliation)"
          - "order.final_fee_cents recomputed via fee_quote_final"
          - "increments TranscriptOrder.version by 1"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /registrar/payments/{id}/refund"
        actor: RegistrarOperator
        preconditions:
          - "Payment.status == CAPTURED"
          - "refund amount < Payment.captured_cents - Payment.refunded_cents"
        side_effects:
          - "Payment.refunded_cents += refund_amount"
          - "increments TranscriptOrder.version by 1"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /registrar/payments/{id}/refund (full) or system auto-refund on order FAILED"
        actor: RegistrarOperator
        preconditions:
          - "Payment.status IN {CAPTURED, PARTIALLY_REFUNDED}"
          - "cumulative refund == Payment.captured_cents"
        side_effects:
          - "Payment.refunded_cents = Payment.captured_cents"
          - "increments TranscriptOrder.version by 1"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /registrar/payments/{id}/refund (cumulative reaches captured_cents)"
        actor: RegistrarOperator
        preconditions:
          - "cumulative refund == Payment.captured_cents"
        side_effects:
          - "increments TranscriptOrder.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /registrar/payments/{id}/void"
        actor: RegistrarOperator
        preconditions:
          - "Payment.status == AUTHORIZED"
        side_effects:
          - "order.payment_status -> UNPAID"
          - "increments TranscriptOrder.version by 1"

  - entity: OrderLineItem
    initial_state: PENDING
    terminal_states: [DELIVERED, BOUNCED, CANCELLED]
    transitions:
      - from: PENDING
        to: QUEUED
        trigger: "system (order enters READY_TO_FULFILL)"
        actor: system
        preconditions:
          - "order.fulfillment_status == READY_TO_FULFILL"
        side_effects:
          - "increments OrderLineItem.version by 1"
      - from: QUEUED
        to: SENT
        trigger: "POST /registrar/line-items/{id}/dispatch"
        actor: RegistrarOperator
        preconditions:
          - "line_status == QUEUED"
          - "order.payment_status IN {CAPTURED, WAIVED}"
          - "if delivery_kind == ELECTRONIC_NETWORK, recipient.active == true"
        side_effects:
          - "set tracking_ref"
          - "if first SENT on order, order.fulfillment_status -> IN_TRANSIT"
          - "increments OrderLineItem.version by 1"
      - from: SENT
        to: DELIVERED
        trigger: "POST /registrar/line-items/{id}/mark-delivered"
        actor: RegistrarOperator
        preconditions:
          - "line_status == SENT"
        side_effects:
          - "evaluate order-level bubble-up: if all terminal and >=1 DELIVERED, order -> DELIVERED"
          - "increments OrderLineItem.version by 1"
      - from: SENT
        to: BOUNCED
        trigger: "POST /registrar/line-items/{id}/mark-bounced"
        actor: RegistrarOperator
        preconditions:
          - "line_status == SENT"
        side_effects:
          - "evaluate order-level bubble-up: if all terminal and 0 DELIVERED, order -> FAILED"
          - "increments OrderLineItem.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "system (order cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "increments OrderLineItem.version by 1"
      - from: QUEUED
        to: CANCELLED
        trigger: "system (order cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "increments OrderLineItem.version by 1"

  - entity: Hold
    initial_state: ACTIVE
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /registrar/holds/{id}/release"
        actor: RegistrarOperator
        preconditions:
          - "Hold.status == ACTIVE"
          - "actor role must match hold_type office OR be RegistrarAdmin (segregation: FINANCIAL holds released only by BursarOffice, LIBRARY holds only by LibraryOffice, etc.)"
        side_effects:
          - "set released_at = clock.now()"
          - "cascade: for every order on this student in HOLD_CHECK, if no more blocking holds, advance order HOLD_CHECK -> READY_TO_FULFILL; that advance itself fans out OrderLineItems PENDING -> QUEUED (depth-3 cascade)"
          - "increments Hold.version by 1"
          - "emit AuditEvent HOLD_RELEASED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock advances past Hold expiry — financial holds auto-expire 365 days after placed_at if amount_cents == 0)"
        actor: system
        preconditions:
          - "Hold.status == ACTIVE"
          - "Hold.hold_type == FINANCIAL"
          - "Hold.amount_cents == 0"
          - "clock.now() > placed_at + 365d"
        side_effects:
          - "cascade: same as RELEASED — re-evaluate HOLD_CHECK orders on this student"
          - "increments Hold.version by 1"

  - entity: IdentityVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /registrar/identity-verifications/{id}/confirm"
        actor: Student
        preconditions:
          - "status == PENDING"
          - "verification_token matches"
          - "clock.now() < expires_at"
        side_effects:
          - "emit AuditEvent IDENTITY_VERIFIED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /registrar/identity-verifications/{id}/reject"
        actor: RegistrarReviewer
        preconditions:
          - "status == PENDING"
        side_effects:
          - "cascade: any order bound to this IdentityVerification in IDENTITY_PENDING -> CANCELLED"
          - "emit AuditEvent IDENTITY_REJECTED"
      - from: PENDING
        to: EXPIRED
        trigger: "system (clock.now() >= expires_at)"
        actor: system
        preconditions:
          - "status == PENDING"
        side_effects:
          - "cascade: any order bound to this IdentityVerification in IDENTITY_PENDING -> CANCELLED"

  - entity: ConsentGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /registrar/consent-grants/{id}/revoke"
        actor: Student
        preconditions:
          - "ConsentGrant.status == ACTIVE"
          - "X-User-ID == ConsentGrant.student_id (student may only revoke own grant)"
        side_effects:
          - "cascade: any VerificationRequest referencing this grant in CONSENT_CHECK -> DENIED (denial_reason = CONSENT_REVOKED)"
          - "increments ConsentGrant.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock.now() >= expires_at)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "cascade: any VerificationRequest referencing this grant in CONSENT_CHECK -> DENIED (denial_reason = CONSENT_EXPIRED)"

  - entity: VerificationRequest
    initial_state: RECEIVED
    terminal_states: [REPORTED, DENIED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: CONSENT_CHECK
        trigger: "POST /registrar/verification-requests/{id}/begin-review"
        actor: RegistrarReviewer
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "increments VerificationRequest.version by 1"
      - from: CONSENT_CHECK
        to: APPROVED
        trigger: "POST /registrar/verification-requests/{id}/approve"
        actor: RegistrarReviewer
        preconditions:
          - "status == CONSENT_CHECK"
          - "if subject_student.ferpa_restricted OR scope != ENROLLMENT_ONLY, a ConsentGrant must exist with grantee_name == requester_name, scope >= requested scope, status == ACTIVE, expires_at > clock.now()"
          - "no Hold h on subject with h.status == ACTIVE and h.blocking_scope == ALL"
          - "reviewer X-User-ID != the Student who would be the subject (segregation of duties)"
        side_effects:
          - "compute fee_cents via verification_fee"
          - "increments VerificationRequest.version by 1"
      - from: CONSENT_CHECK
        to: DENIED
        trigger: "POST /registrar/verification-requests/{id}/deny"
        actor: RegistrarReviewer
        preconditions:
          - "status == CONSENT_CHECK"
        side_effects:
          - "set denial_reason"
          - "increments VerificationRequest.version by 1"
      - from: APPROVED
        to: REPORTED
        trigger: "system (swept into a ClearinghouseReportBatch that transitions to TRANSMITTED)"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "increments VerificationRequest.version by 1"

  - entity: ArchivedRecordRetrieval
    initial_state: REQUESTED
    terminal_states: [ATTACHED, FAILED]
    transitions:
      - from: REQUESTED
        to: PULLED
        trigger: "POST /registrar/archived-retrievals/{id}/mark-pulled"
        actor: ArchiveClerk
        preconditions:
          - "retrieval_status == REQUESTED"
        side_effects:
          - "increments ArchivedRecordRetrieval.version by 1"
      - from: PULLED
        to: DIGITIZED
        trigger: "POST /registrar/archived-retrievals/{id}/attach-record"
        actor: ArchiveClerk
        preconditions:
          - "retrieval_status == PULLED"
          - "digitized_record_id refers to an existing StudentRecord for the same student"
        side_effects:
          - "increments ArchivedRecordRetrieval.version by 1"
      - from: DIGITIZED
        to: ATTACHED
        trigger: "POST /registrar/archived-retrievals/{id}/attach-to-order"
        actor: ArchiveClerk
        preconditions:
          - "retrieval_status == DIGITIZED"
          - "requested_by_order_id fulfillment_status == READY_TO_FULFILL"
        side_effects:
          - "cascade: any OrderLineItem on requested_by_order_id with archived_retrieval_id == this.id and line_status == PENDING becomes QUEUED"
          - "increments ArchivedRecordRetrieval.version by 1"
      - from: REQUESTED
        to: FAILED
        trigger: "POST /registrar/archived-retrievals/{id}/mark-failed"
        actor: ArchiveClerk
        preconditions:
          - "retrieval_status == REQUESTED"
        side_effects:
          - "cascade: dependent OrderLineItems stay PENDING and block order fulfillment; operator must cancel them"
          - "increments ArchivedRecordRetrieval.version by 1"

  - entity: ClearinghouseReportBatch
    initial_state: OPEN
    terminal_states: [ACKED, FAILED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /registrar/clearinghouse-batches/{id}/lock"
        actor: RegistrarOperator
        preconditions:
          - "status == OPEN"
          - "order_count + verification_count > 0"
        side_effects:
          - "freeze membership — no new items may be swept in"
          - "increments ClearinghouseReportBatch.version by 1"
      - from: LOCKED
        to: TRANSMITTED
        trigger: "POST /registrar/clearinghouse-batches/{id}/transmit"
        actor: RegistrarOperator
        preconditions:
          - "status == LOCKED"
        side_effects:
          - "set transmitted_at = clock.now()"
          - "cascade: every DELIVERED order swept into this batch has been reported; every APPROVED VerificationRequest swept in transitions to REPORTED (depth-2 cascade)"
          - "increments ClearinghouseReportBatch.version by 1"
      - from: TRANSMITTED
        to: ACKED
        trigger: "POST /registrar/clearinghouse-batches/{id}/ack"
        actor: RegistrarOperator
        preconditions:
          - "status == TRANSMITTED"
        side_effects:
          - "increments ClearinghouseReportBatch.version by 1"
      - from: TRANSMITTED
        to: FAILED
        trigger: "POST /registrar/clearinghouse-batches/{id}/mark-failed"
        actor: RegistrarOperator
        preconditions:
          - "status == TRANSMITTED"
        side_effects:
          - "membership unlocked — next sweep re-includes the same items (compensating action)"

  - entity: ReissueRequest
    initial_state: REQUESTED
    terminal_states: [FULFILLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /registrar/reissue-requests/{id}/approve"
        actor: RegistrarReviewer
        preconditions:
          - "status == REQUESTED"
          - "original order fulfillment_status == REISSUE_PENDING"
        side_effects:
          - "see TranscriptOrder REISSUE_PENDING -> IN_TRANSIT side effects"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /registrar/reissue-requests/{id}/reject"
        actor: RegistrarReviewer
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "original order fulfillment_status -> DELIVERED (revert)"
      - from: APPROVED
        to: FULFILLED
        trigger: "system (replacement order reaches DELIVERED)"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "replacement_order_id order has fulfillment_status == DELIVERED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-submit-stale-version
    parent_entity: TranscriptOrder
    write_endpoint: "POST /registrar/orders/{id}/submit"
    occ_field: "expected_order_version"
    description: |
      Submitting a TranscriptOrder whose version has advanced since the client
      last observed it is rejected. Captures the case where another writer has
      modified the order (e.g. added a line item that changes rush_qualified or
      quoted_fee_cents) since the client's view was taken.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: line-item-add-stale-version
    parent_entity: TranscriptOrder
    write_endpoint: "POST /registrar/orders/{id}/line-items"
    occ_field: "expected_order_version"
    description: |
      Adding an OrderLineItem to a DRAFT order whose version has advanced since
      the client last observed the order is rejected; the new line item would
      recompute quoted_fee_cents and rush_qualified against stale inputs.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_quote_provisional
    trigger: "on POST /registrar/orders/{id}/submit (DRAFT -> SUBMITTED)"
    algorithm: tiered_pricing
    formula: |
      schedule = FeeSchedule active at order.submitted_at (effective_from <= submitted_at < effective_to)
      base_per_copy = schedule.official_base_cents if order.order_kind == OFFICIAL else schedule.unofficial_base_cents

      # Per-line unit price (per-line rounding pinned: round each line to cents BEFORE summing)
      for each line in order.line_items:
        line_base = base_per_copy
        if line.delivery_kind == PAPER_MAIL: line_base += schedule.paper_surcharge_cents
        if line.delivery_kind == PICKUP:     line_base += schedule.pickup_surcharge_cents
        line.unit_price_cents = round_half_up(line_base)  # per-line, integer cents
      subtotal = sum(line.unit_price_cents * line.quantity for line in order.line_items)

      # Volume discount — whole-order discount from highest tier satisfied
      total_copies = sum(line.quantity for line in order.line_items)
      discount_bp = max(t.discount_bp for t in schedule.volume_tiers if total_copies >= t.min_copies) or 0
      discounted_subtotal = round_half_up(subtotal * (10000 - discount_bp) / 10000)

      # Rush — multiplicative then additive, in this pinned order
      if order.rush_qualified:
        after_mult = round_half_up(discounted_subtotal * schedule.rush_multiplier_bp / 10000)
        total = after_mult + schedule.rush_flat_cents
      else:
        total = discounted_subtotal

      order.quoted_fee_cents = total
    input_set: "All OrderLineItem rows belonging to the order at submit time; line.line_status is not filtered (all PENDING at submit)."
    constants:
      BP_DENOMINATOR: 10000
    precision: "integer cents throughout; round_half_up at each pinned step"
    variants:
      - name: estimate_at_draft
        when: "called implicitly by GET /registrar/orders/{id}/quote-preview while order still in DRAFT; uses current clock instead of submitted_at and current active FeeSchedule"
        difference: "Result is advisory only; not persisted; may differ from quoted_fee_cents if clock crosses a schedule boundary between preview and submit."

  - name: fee_quote_final
    trigger: "on POST /registrar/payments/{id}/capture, and on any OrderLineItem quantity/delivery_kind adjustment before capture"
    algorithm: tiered_pricing
    formula: |
      Same shape as fee_quote_provisional EXCEPT the schedule used is the one
      effective at CAPTURE time (clock.now()), not submit time, and reissue_of
      orders with fee_waived = true short-circuit to 0.
      Additionally, if order.rush_qualified was true at submit but the capture
      clock is past the same-day rush cutoff + 4h grace, rush components are
      dropped and only the base+discount portion is kept.
      order.final_fee_cents = recomputed total
    input_set: "Same as fee_quote_provisional but evaluated at capture clock."
    constants:
      RUSH_GRACE_HOURS: 4
    precision: "integer cents; round_half_up at each pinned step"
    variants:
      - name: capture_time_reprice
        when: "capture happens on a different fee-schedule window than submit"
        difference: "May produce final_fee_cents != quoted_fee_cents; delta is absorbed by the payment gateway reconciliation."

  - name: rush_qualification
    trigger: "on POST /registrar/orders/{id}/submit and on any OrderLineItem mutation before submit"
    algorithm: threshold
    formula: |
      cutoff = 14:00 local registrar time on submitted_at calendar date (weekend and holiday submissions fail)
      order.rush_qualified = (
        order.rush_requested
        AND local_time(order.submitted_at) < cutoff             # STRICT <: at 14:00:00 exactly, NOT qualified
        AND weekday(order.submitted_at) IN {Mon..Fri}
        AND order.submitted_at.date not in REGISTRAR_HOLIDAYS
        AND every line.delivery_kind IN {ELECTRONIC_NETWORK, EMAIL_PDF, PICKUP}   # PAPER_MAIL is never rush-qualifiable
      )
    input_set: "Order + all line items at evaluation time."
    constants:
      RUSH_CUTOFF_LOCAL: "14:00"
      RUSH_GRACE_HOURS: 4
    precision: "second precision on cutoff comparison"

  - name: verification_fee
    trigger: "on POST /registrar/verification-requests/{id}/approve (CONSENT_CHECK -> APPROVED)"
    algorithm: weighted_scoring
    formula: |
      base = 500  # $5.00
      scope_surcharge = { ENROLLMENT_ONLY: 0, DEGREE_ONLY: 300, FULL_RECORD: 700 }[scope]
      # Historical lookup surcharge applies when the subject's record is archived
      archive_surcharge = 1500 if subject_student.archived_record_flag else 0
      fee_cents = base + scope_surcharge + archive_surcharge
    input_set: "VerificationRequest.scope + subject_student.archived_record_flag."
    constants:
      BASE_CENTS: 500
      DEGREE_SURCHARGE_CENTS: 300
      FULL_RECORD_SURCHARGE_CENTS: 700
      ARCHIVE_SURCHARGE_CENTS: 1500
    precision: "integer cents"

  - name: payment_capture_reconcile
    trigger: "on POST /registrar/payments/{id}/capture"
    algorithm: chronological
    formula: |
      # Reconcile provisional authorization against the final fee.
      # Rule: never capture more than the final fee, never less than 0.
      target = max(0, order.final_fee_cents - payment.refunded_cents)
      captured = min(payment.amount_cents, target)   # min() interaction — never exceed authorized
      # If final > authorized, the shortfall is recorded but NOT auto-charged;
      # the order is held at READY_TO_FULFILL until a supplemental authorization.
      shortfall = target - captured
      payment.captured_cents = captured
    input_set: "Payment row + owning TranscriptOrder at capture."
    constants: {}
    precision: "integer cents"

  - name: order_refund_on_failure
    trigger: "on order transition IN_TRANSIT -> FAILED"
    algorithm: waterfall_allocation
    formula: |
      # Refund is apportioned back to captured amount; refund NEVER exceeds captured.
      refundable = payment.captured_cents - payment.refunded_cents
      refund_amount = refundable   # full refund on FAILED
      payment.refunded_cents += refund_amount
      # Invariant: refunded_cents <= captured_cents always
    input_set: "Payment of the failing order."
    constants: {}
    precision: "integer cents"

  - name: gpa_cents_recompute
    trigger: "on POST /registrar/students/{id}/records (publish new snapshot)"
    algorithm: forward_looking
    formula: |
      # GPA is a weighted average over grade points. Computed on the server from the
      # course list supplied in the publish payload; output stored as integer cents.
      total_points = sum(c.grade_points * c.credits for c in payload.courses)
      total_credits = sum(c.credits for c in payload.courses)
      gpa_cents = round_half_up(100 * total_points / total_credits) if total_credits > 0 else 0
    input_set: "Courses supplied in the publish payload."
    constants: {}
    precision: "integer cents; round_half_up"

  - name: clearinghouse_sweep
    trigger: "on POST /registrar/clearinghouse-batches (batch creation) and lazily on lock"
    algorithm: aggregation
    formula: |
      # Inclusion set (pinned):
      #   - TranscriptOrder with fulfillment_status == DELIVERED
      #     AND submitted_at IN [report_period_start, report_period_end)
      #     AND NOT already in any batch with status IN {OPEN, LOCKED, TRANSMITTED, ACKED}
      #   - VerificationRequest with status == APPROVED
      #     AND updated_at IN [report_period_start, report_period_end)
      #     AND NOT already swept into a non-failed batch
      # Tie-break for sweep ordering when two items share submitted_at: created_at ASC, never id.
      order_count = count of qualifying orders
      verification_count = count of qualifying verification requests
    input_set: "Delivered orders and approved verifications in period; membership excludes items already in non-failed batches."
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role authorized for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path-templated resource exists (left-to-right resolution)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Referenced FK bodies exist (student_id, recipient_id, consent_grant_id, original_order_id, digitized_record_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK payload fields"
  - priority: 5
    category: state
    check: "Target resource is in a from-state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version == parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /registrar/orders/{id}/submit, POST /registrar/orders/{id}/line-items"
  - priority: 7
    category: business_safety
    check: "FERPA consent: if subject_student.ferpa_restricted OR scope != ENROLLMENT_ONLY, an ACTIVE ConsentGrant must exist with grantee_name == requester_name, scope >= requested scope, expires_at > clock.now()"
    error_id: ERR_FERPA_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /registrar/verification-requests/{id}/approve"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: reviewer X-User-ID must differ from the student who placed the order / the subject of the verification"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /registrar/reissue-requests/{id}/approve, POST /registrar/reissue-requests/{id}/reject, POST /registrar/verification-requests/{id}/approve"
  - priority: 9
    category: business_safety
    check: "Hold release segregation: hold_type must be released by the matching office role (FINANCIAL -> BursarOffice, LIBRARY -> LibraryOffice, REGISTRAR/DISCIPLINARY -> RegistrarAdmin)"
    error_id: ERR_HOLD_OFFICE_MISMATCH
    http_status: 403
    applies_to: "POST /registrar/holds/{id}/release"
  - priority: 10
    category: business_constraint
    check: "Hold check: OFFICIAL order cannot advance past HOLD_CHECK while any Hold with status == ACTIVE and blocking_scope IN {ALL, OFFICIAL} exists on the student"
    error_id: ERR_HOLD_BLOCKING
    http_status: 422
    applies_to: "POST /registrar/orders/{id}/submit (transition to READY_TO_FULFILL); re-evaluated on Hold release"
  - priority: 11
    category: business_constraint
    check: "Recipient routing validity: recipient.kind must match line.delivery_kind; required routing fields must be non-null for that kind; recipient.active must be true at line-item add and dispatch time"
    error_id: ERR_RECIPIENT_ROUTING_INVALID
    http_status: 422
    applies_to: "POST /registrar/orders/{id}/line-items, POST /registrar/line-items/{id}/dispatch"
  - priority: 12
    category: business_constraint
    check: "Identity verification: order submission requires a VERIFIED IdentityVerification bound to the order"
    error_id: ERR_IDENTITY_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /registrar/orders/{id}/submit"
  - priority: 13
    category: business_temporal
    check: "ConsentGrant.expires_at must be > clock.now() at creation"
    error_id: ERR_CONSENT_EXPIRED
    http_status: 422
    applies_to: "POST /registrar/consent-grants"
  - priority: 14
    category: business_temporal
    check: "IdentityVerification.confirm must arrive before expires_at"
    error_id: ERR_VERIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /registrar/identity-verifications/{id}/confirm"
  - priority: 15
    category: business_temporal
    check: "FeeSchedule.effective_from < FeeSchedule.effective_to when effective_to is non-null; only one schedule may be active at any instant"
    error_id: ERR_SCHEDULE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /registrar/fee-schedules"
  - priority: 16
    category: business_referential
    check: "ReissueRequest.original_order_id must reference an order with fulfillment_status == DELIVERED; replacement order must reference the same student as original"
    error_id: ERR_REISSUE_SOURCE_INVALID
    http_status: 422
    applies_to: "POST /registrar/orders/{id}/reissue-requests"
  - priority: 17
    category: business_fiscal
    check: "Capture cannot exceed authorized amount (post-reconciliation min())"
    error_id: ERR_CAPTURE_EXCEEDS_AUTHORIZED
    http_status: 422
    applies_to: "POST /registrar/payments/{id}/capture"
  - priority: 18
    category: business_fiscal
    check: "Refund amount must satisfy cumulative_refund + new_refund <= captured_cents"
    error_id: ERR_REFUND_EXCEEDS_CAPTURED
    http_status: 422
    applies_to: "POST /registrar/payments/{id}/refund"
  - priority: 19
    category: business_fiscal
    check: "Duplicate idempotency_key on a different payload -> reject; same key + same payload -> return original"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /registrar/payments"
  - priority: 20
    category: business_constraint
    check: "Required-field presence & enum/range shape per entity §1.1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Students ---
  - method: POST
    path: "/registrar/students"
    description: "Register a student record subject"
    roles: [RegistrarAdmin]
    code: 201
    input: [student_number, full_name, date_of_birth, email, "status?", "ferpa_restricted?", "archived_record_flag?"]
    output: Student
    side_effects: [emit AuditEvent STUDENT_CREATED]
  - method: GET
    path: "/registrar/students"
    description: "List students"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, BursarOffice, LibraryOffice, ArchiveClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "ferpa_restricted?", "archived_record_flag?"]
    output: Student[]
    side_effects: []
  - method: GET
    path: "/registrar/students/{id}"
    description: "Fetch one student"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, BursarOffice, LibraryOffice, ArchiveClerk, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: PATCH
    path: "/registrar/students/{id}"
    description: "Update student (status, ferpa_restricted, archived_record_flag)"
    roles: [RegistrarAdmin]
    code: 200
    input: ["status?", "ferpa_restricted?", "archived_record_flag?"]
    output: Student
    side_effects: [increments Student.version by 1, emit AuditEvent STUDENT_UPDATED]
  - method: GET
    path: "/registrar/students/{id}/records"
    description: "List record snapshots for a student"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: StudentRecord[]
    side_effects: []
  - method: POST
    path: "/registrar/students/{id}/records"
    description: "Publish a new StudentRecord snapshot (increments record_version; recomputes gpa_cents and is_current)"
    roles: [RegistrarAdmin]
    code: 201
    input: [effective_term, courses, earned_credits, "degree_awarded?"]
    output: StudentRecord
    side_effects:
      - "compute gpa_cents via gpa_cents_recompute"
      - "mark all prior StudentRecords for this student is_current=false"
      - "increments Student.version by 1"

  # --- Recipients ---
  - method: POST
    path: "/registrar/recipients"
    description: "Register a recipient"
    roles: [RegistrarAdmin, RegistrarOperator]
    code: 201
    input: [kind, display_name, "network_code?", "email_address?", "postal_address?", "active?"]
    output: Recipient
    side_effects: []
  - method: GET
    path: "/registrar/recipients"
    description: "List recipients"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "kind?", "active?"]
    output: Recipient[]
    side_effects: []
  - method: GET
    path: "/registrar/recipients/{id}"
    description: "Fetch one recipient"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: []
    output: Recipient
    side_effects: []
  - method: PATCH
    path: "/registrar/recipients/{id}"
    description: "Update recipient (active flag, routing fields)"
    roles: [RegistrarAdmin, RegistrarOperator]
    code: 200
    input: ["display_name?", "network_code?", "email_address?", "postal_address?", "active?"]
    output: Recipient
    side_effects: [increments Recipient.version by 1]

  # --- Holds ---
  - method: POST
    path: "/registrar/holds"
    description: "Place a hold on a student"
    roles: [BursarOffice, LibraryOffice, RegistrarAdmin]
    code: 201
    input: [student_id, hold_type, blocking_scope, "amount_cents?"]
    output: Hold
    side_effects:
      - "set placed_at = clock.now()"
      - "cascade: any of this student's orders in SUBMITTED that should be in HOLD_CHECK move to HOLD_CHECK (only if order_kind == OFFICIAL and blocking scope matches)"
  - method: GET
    path: "/registrar/holds"
    description: "List holds (filtered)"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, BursarOffice, LibraryOffice, Student]
    code: 200
    input: ["limit?", "offset?", "student_id?", "hold_type?", "status?"]
    output: Hold[]
    side_effects: []
  - method: GET
    path: "/registrar/students/{id}/holds"
    description: "List holds for a student (sub-resource form)"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, BursarOffice, LibraryOffice, Student]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Hold[]
    side_effects: []
  - method: GET
    path: "/registrar/holds/{id}"
    description: "Fetch one hold"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, BursarOffice, LibraryOffice]
    code: 200
    input: []
    output: Hold
    side_effects: []
  - method: POST
    path: "/registrar/holds/{id}/release"
    description: "Release an ACTIVE hold (segregated by office role)"
    roles: [BursarOffice, LibraryOffice, RegistrarAdmin]
    code: 200
    input: []
    output: Hold
    side_effects:
      - "Hold.status -> RELEASED"
      - "set released_at"
      - "cascade: re-evaluate HOLD_CHECK orders on this student; if no more blocking holds, order advances to READY_TO_FULFILL and line items fan out PENDING -> QUEUED"
      - "increments Hold.version by 1"

  # --- IdentityVerifications ---
  - method: POST
    path: "/registrar/identity-verifications"
    description: "Start identity verification for a (student, order) pair"
    roles: [Student]
    code: 201
    input: [student_id, order_id, method]
    output: IdentityVerification
    side_effects:
      - "set verification_token, expires_at = clock.now() + 72h"
      - "cascade: order.fulfillment_status -> IDENTITY_PENDING if it was SUBMITTED"
  - method: GET
    path: "/registrar/identity-verifications/{id}"
    description: "Fetch one identity verification"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: []
    output: IdentityVerification
    side_effects: []
  - method: GET
    path: "/registrar/students/{id}/identity-verifications"
    description: "List identity verifications for a student"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: IdentityVerification[]
    side_effects: []
  - method: GET
    path: "/registrar/orders/{id}/identity-verifications"
    description: "List identity verifications bound to an order (FK reverse-lookup)"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: IdentityVerification[]
    side_effects: []
  - method: POST
    path: "/registrar/identity-verifications/{id}/confirm"
    description: "Confirm identity with the one-time token"
    roles: [Student]
    code: 200
    input: [verification_token]
    output: IdentityVerification
    side_effects:
      - "IdentityVerification.status -> VERIFIED"
      - "cascade: bound order IDENTITY_PENDING -> HOLD_CHECK or READY_TO_FULFILL per hold evaluation"
  - method: POST
    path: "/registrar/identity-verifications/{id}/reject"
    description: "Reject a PENDING identity verification"
    roles: [RegistrarReviewer]
    code: 200
    input: []
    output: IdentityVerification
    side_effects:
      - "IdentityVerification.status -> REJECTED"
      - "cascade: bound order IDENTITY_PENDING -> CANCELLED"

  # --- Orders ---
  - method: POST
    path: "/registrar/orders"
    description: "Create a DRAFT transcript order"
    roles: [Student]
    code: 201
    input: [student_id, order_kind, "rush_requested?"]
    output: TranscriptOrder
    side_effects: [emit AuditEvent ORDER_CREATED]
  - method: GET
    path: "/registrar/orders"
    description: "List orders"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "student_id?", "fulfillment_status?", "payment_status?", "order_kind?", "reissue_of_order_id?"]
    output: TranscriptOrder[]
    side_effects: []
  - method: GET
    path: "/registrar/orders/{id}"
    description: "Fetch one order"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: []
    output: TranscriptOrder
    side_effects: []
  - method: GET
    path: "/registrar/orders/{id}/quote-preview"
    description: "Provisional fee quote using current clock + active FeeSchedule (DRAFT only)"
    roles: [RegistrarAdmin, RegistrarOperator, Student]
    code: 200
    input: []
    output: { quoted_fee_cents: integer, rush_qualified: boolean, schedule_code: string }
    side_effects: []
  - method: POST
    path: "/registrar/orders/{id}/line-items"
    description: "Add a line item to a DRAFT order (OCC-protected)"
    roles: [Student]
    code: 201
    input: [recipient_id, delivery_kind, quantity, expected_order_version]
    output: OrderLineItem
    side_effects:
      - "recompute rush_qualified (any PAPER_MAIL line disqualifies)"
      - "recompute quoted_fee_cents provisional"
      - "increments TranscriptOrder.version by 1"
  - method: GET
    path: "/registrar/orders/{id}/line-items"
    description: "List line items for an order"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "line_status?"]
    output: OrderLineItem[]
    side_effects: []
  - method: POST
    path: "/registrar/orders/{id}/submit"
    description: "Submit a DRAFT order (OCC-protected)"
    roles: [Student]
    code: 200
    input: [expected_order_version]
    output: TranscriptOrder
    side_effects:
      - "fulfillment_status: DRAFT -> SUBMITTED -> (HOLD_CHECK | READY_TO_FULFILL)"
      - "set submitted_at; recompute rush_qualified via rush_qualification"
      - "compute quoted_fee_cents via fee_quote_provisional; set final_fee_cents = quoted_fee_cents"
      - "increments TranscriptOrder.version by 1"
  - method: POST
    path: "/registrar/orders/{id}/cancel"
    description: "Cancel an order in HOLD_CHECK / READY_TO_FULFILL / IDENTITY_PENDING"
    roles: [Student]
    code: 200
    input: [cancelled_reason]
    output: TranscriptOrder
    side_effects:
      - "cancel non-terminal line items"
      - "void AUTHORIZED payment"
      - "increments TranscriptOrder.version by 1"

  # --- Line items ---
  - method: GET
    path: "/registrar/line-items"
    description: "List line items (supports FK reverse-lookup by order_id, recipient_id, archived_retrieval_id)"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "order_id?", "recipient_id?", "archived_retrieval_id?", "line_status?", "delivery_kind?"]
    output: OrderLineItem[]
    side_effects: []
  - method: GET
    path: "/registrar/line-items/{id}"
    description: "Fetch one line item"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: []
    output: OrderLineItem
    side_effects: []
  - method: POST
    path: "/registrar/line-items/{id}/dispatch"
    description: "Mark a QUEUED line item as SENT"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: OrderLineItem
    side_effects:
      - "set tracking_ref"
      - "bubble up: first SENT flips order to IN_TRANSIT"
      - "increments OrderLineItem.version by 1"
  - method: POST
    path: "/registrar/line-items/{id}/mark-delivered"
    description: "Mark a SENT line item as DELIVERED"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: OrderLineItem
    side_effects:
      - "bubble up: order -> DELIVERED if all terminal and >=1 DELIVERED"
      - "increments OrderLineItem.version by 1"
  - method: POST
    path: "/registrar/line-items/{id}/mark-bounced"
    description: "Mark a SENT line item as BOUNCED"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: OrderLineItem
    side_effects:
      - "bubble up: order -> FAILED if all terminal and 0 DELIVERED"
      - "increments OrderLineItem.version by 1"

  # --- Payments ---
  - method: POST
    path: "/registrar/payments"
    description: "Authorize a payment for an order"
    roles: [Student]
    code: 201
    input: [order_id, idempotency_key]
    output: Payment
    side_effects:
      - "set Payment.amount_cents = order.quoted_fee_cents, status AUTHORIZED"
      - "order.payment_status -> AUTHORIZED"
      - "increments TranscriptOrder.version by 1"
  - method: GET
    path: "/registrar/payments/{id}"
    description: "Fetch one payment"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/registrar/orders/{id}/payments"
    description: "List payments for an order"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/registrar/payments/{id}/capture"
    description: "Capture an authorized payment (reconciles against final_fee_cents at capture-time clock)"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "recompute order.final_fee_cents via fee_quote_final (capture-time clock)"
      - "apply payment_capture_reconcile"
      - "Payment.status -> CAPTURED; order.payment_status -> CAPTURED"
      - "increments TranscriptOrder.version by 1"
  - method: POST
    path: "/registrar/payments/{id}/refund"
    description: "Refund a captured payment (partial or full)"
    roles: [RegistrarOperator]
    code: 200
    input: [refund_amount_cents]
    output: Payment
    side_effects:
      - "Payment.refunded_cents += refund_amount_cents"
      - "Payment.status -> PARTIALLY_REFUNDED or REFUNDED per waterfall"
      - "order.payment_status mirrors Payment.status"
      - "increments TranscriptOrder.version by 1"
  - method: POST
    path: "/registrar/payments/{id}/void"
    description: "Void an authorized (not captured) payment"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Payment.status -> VOIDED"
      - "order.payment_status -> UNPAID"
      - "increments TranscriptOrder.version by 1"

  # --- Consent Grants ---
  - method: POST
    path: "/registrar/consent-grants"
    description: "Student grants a third party consent"
    roles: [Student]
    code: 201
    input: [student_id, grantee_name, scope, expires_at]
    output: ConsentGrant
    side_effects: []
  - method: GET
    path: "/registrar/consent-grants"
    description: "List consent grants (filtered)"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "student_id?", "status?"]
    output: ConsentGrant[]
    side_effects: []
  - method: GET
    path: "/registrar/students/{id}/consent-grants"
    description: "List a student's consent grants"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ConsentGrant[]
    side_effects: []
  - method: GET
    path: "/registrar/consent-grants/{id}"
    description: "Fetch one consent grant"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: []
    output: ConsentGrant
    side_effects: []
  - method: POST
    path: "/registrar/consent-grants/{id}/revoke"
    description: "Student revokes an ACTIVE grant"
    roles: [Student]
    code: 200
    input: []
    output: ConsentGrant
    side_effects:
      - "ConsentGrant.status -> REVOKED"
      - "cascade: VerificationRequests in CONSENT_CHECK referencing this grant -> DENIED"
      - "increments ConsentGrant.version by 1"

  # --- Verification Requests ---
  - method: POST
    path: "/registrar/verification-requests"
    description: "Third party initiates a credential verification request"
    roles: [VerificationRequester]
    code: 201
    input: [requester_name, subject_student_id, scope, "consent_grant_id?"]
    output: VerificationRequest
    side_effects: []
  - method: GET
    path: "/registrar/verification-requests"
    description: "List verification requests"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, VerificationRequester]
    code: 200
    input: ["limit?", "offset?", "subject_student_id?", "status?", "scope?", "consent_grant_id?"]
    output: VerificationRequest[]
    side_effects: []
  - method: GET
    path: "/registrar/verification-requests/{id}"
    description: "Fetch one verification request"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, VerificationRequester]
    code: 200
    input: []
    output: VerificationRequest
    side_effects: []
  - method: GET
    path: "/registrar/students/{id}/verification-requests"
    description: "List verification requests against a student"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: VerificationRequest[]
    side_effects: []
  - method: POST
    path: "/registrar/verification-requests/{id}/begin-review"
    description: "Move request RECEIVED -> CONSENT_CHECK"
    roles: [RegistrarReviewer]
    code: 200
    input: []
    output: VerificationRequest
    side_effects: [increments VerificationRequest.version by 1]
  - method: POST
    path: "/registrar/verification-requests/{id}/approve"
    description: "Approve a request (subject to FERPA consent + hold checks + SoD)"
    roles: [RegistrarReviewer]
    code: 200
    input: []
    output: VerificationRequest
    side_effects:
      - "compute fee_cents via verification_fee"
      - "VerificationRequest.status -> APPROVED"
      - "increments VerificationRequest.version by 1"
  - method: POST
    path: "/registrar/verification-requests/{id}/deny"
    description: "Deny a request in CONSENT_CHECK"
    roles: [RegistrarReviewer]
    code: 200
    input: [denial_reason]
    output: VerificationRequest
    side_effects:
      - "VerificationRequest.status -> DENIED"
      - "increments VerificationRequest.version by 1"

  # --- Archived Retrievals ---
  - method: POST
    path: "/registrar/archived-retrievals"
    description: "Request an archived record retrieval"
    roles: [RegistrarOperator, ArchiveClerk]
    code: 201
    input: [student_id, requested_by_order_id]
    output: ArchivedRecordRetrieval
    side_effects:
      - "compute sla_due_at = clock.now() + 48h"
  - method: GET
    path: "/registrar/archived-retrievals"
    description: "List archived retrievals"
    roles: [RegistrarAdmin, RegistrarOperator, ArchiveClerk]
    code: 200
    input: ["limit?", "offset?", "student_id?", "retrieval_status?", "requested_by_order_id?", "digitized_record_id?"]
    output: ArchivedRecordRetrieval[]
    side_effects: []
  - method: GET
    path: "/registrar/archived-retrievals/{id}"
    description: "Fetch one archived retrieval"
    roles: [RegistrarAdmin, RegistrarOperator, ArchiveClerk]
    code: 200
    input: []
    output: ArchivedRecordRetrieval
    side_effects: []
  - method: GET
    path: "/registrar/students/{id}/archived-retrievals"
    description: "List archived retrievals for a student"
    roles: [RegistrarAdmin, RegistrarOperator, ArchiveClerk, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: ArchivedRecordRetrieval[]
    side_effects: []
  - method: POST
    path: "/registrar/archived-retrievals/{id}/mark-pulled"
    description: "Mark retrieval REQUESTED -> PULLED"
    roles: [ArchiveClerk]
    code: 200
    input: []
    output: ArchivedRecordRetrieval
    side_effects: [increments ArchivedRecordRetrieval.version by 1]
  - method: POST
    path: "/registrar/archived-retrievals/{id}/attach-record"
    description: "Mark retrieval PULLED -> DIGITIZED with the digitized record"
    roles: [ArchiveClerk]
    code: 200
    input: [digitized_record_id]
    output: ArchivedRecordRetrieval
    side_effects: [increments ArchivedRecordRetrieval.version by 1]
  - method: POST
    path: "/registrar/archived-retrievals/{id}/attach-to-order"
    description: "Mark retrieval DIGITIZED -> ATTACHED; cascade line items to QUEUED"
    roles: [ArchiveClerk]
    code: 200
    input: []
    output: ArchivedRecordRetrieval
    side_effects:
      - "cascade: OrderLineItems on requested_by_order_id with archived_retrieval_id == id and line_status == PENDING -> QUEUED"
      - "increments ArchivedRecordRetrieval.version by 1"
  - method: POST
    path: "/registrar/archived-retrievals/{id}/mark-failed"
    description: "Mark retrieval REQUESTED -> FAILED"
    roles: [ArchiveClerk]
    code: 200
    input: []
    output: ArchivedRecordRetrieval
    side_effects: [increments ArchivedRecordRetrieval.version by 1]

  # --- Reissue Requests ---
  - method: POST
    path: "/registrar/orders/{id}/reissue-requests"
    description: "Open a reissue request against a DELIVERED order"
    roles: [Student]
    code: 201
    input: [reason, "fee_waived?"]
    output: ReissueRequest
    side_effects:
      - "original order fulfillment_status: DELIVERED -> REISSUE_PENDING"
      - "increments TranscriptOrder.version by 1"
  - method: GET
    path: "/registrar/reissue-requests"
    description: "List reissue requests"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: ["limit?", "offset?", "original_order_id?", "replacement_order_id?", "status?"]
    output: ReissueRequest[]
    side_effects: []
  - method: GET
    path: "/registrar/reissue-requests/{id}"
    description: "Fetch one reissue request"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer, Student]
    code: 200
    input: []
    output: ReissueRequest
    side_effects: []
  - method: POST
    path: "/registrar/reissue-requests/{id}/approve"
    description: "Approve a reissue (creates replacement order)"
    roles: [RegistrarReviewer]
    code: 200
    input: []
    output: ReissueRequest
    side_effects:
      - "ReissueRequest.status -> APPROVED, set reviewed_by"
      - "create replacement TranscriptOrder (reissue_of_order_id = original)"
      - "copy line items to replacement, line_status = QUEUED"
      - "if fee_waived, replacement.payment_status = WAIVED"
      - "original order REISSUE_PENDING -> IN_TRANSIT"
      - "increments TranscriptOrder.version by 1 (both orders)"
  - method: POST
    path: "/registrar/reissue-requests/{id}/reject"
    description: "Reject a reissue"
    roles: [RegistrarReviewer]
    code: 200
    input: []
    output: ReissueRequest
    side_effects:
      - "ReissueRequest.status -> REJECTED"
      - "original order REISSUE_PENDING -> DELIVERED (revert)"
      - "increments TranscriptOrder.version by 1"

  # --- Clearinghouse ---
  - method: POST
    path: "/registrar/clearinghouse-batches"
    description: "Open a new report batch for a period; sweeps eligible items in"
    roles: [RegistrarOperator]
    code: 201
    input: [report_period_start, report_period_end]
    output: ClearinghouseReportBatch
    side_effects:
      - "compute order_count, verification_count via clearinghouse_sweep"
  - method: GET
    path: "/registrar/clearinghouse-batches"
    description: "List batches"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ClearinghouseReportBatch[]
    side_effects: []
  - method: GET
    path: "/registrar/clearinghouse-batches/{id}"
    description: "Fetch one batch"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer]
    code: 200
    input: []
    output: ClearinghouseReportBatch
    side_effects: []
  - method: POST
    path: "/registrar/clearinghouse-batches/{id}/lock"
    description: "Lock an OPEN batch"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: ClearinghouseReportBatch
    side_effects: [increments ClearinghouseReportBatch.version by 1]
  - method: POST
    path: "/registrar/clearinghouse-batches/{id}/transmit"
    description: "Transmit a LOCKED batch"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: ClearinghouseReportBatch
    side_effects:
      - "set transmitted_at"
      - "cascade: swept APPROVED VerificationRequests -> REPORTED"
      - "increments ClearinghouseReportBatch.version by 1"
  - method: POST
    path: "/registrar/clearinghouse-batches/{id}/ack"
    description: "Acknowledge a TRANSMITTED batch"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: ClearinghouseReportBatch
    side_effects: [increments ClearinghouseReportBatch.version by 1]
  - method: POST
    path: "/registrar/clearinghouse-batches/{id}/mark-failed"
    description: "Mark a TRANSMITTED batch as FAILED (membership released for re-sweep)"
    roles: [RegistrarOperator]
    code: 200
    input: []
    output: ClearinghouseReportBatch
    side_effects: [increments ClearinghouseReportBatch.version by 1]

  # --- Fee schedules ---
  - method: POST
    path: "/registrar/fee-schedules"
    description: "Register a fee schedule with effective window"
    roles: [RegistrarAdmin]
    code: 201
    input: [code, official_base_cents, unofficial_base_cents, paper_surcharge_cents, pickup_surcharge_cents, rush_flat_cents, rush_multiplier_bp, volume_tiers, effective_from, "effective_to?", "active?"]
    output: FeeSchedule
    side_effects:
      - "if active=true, atomically deactivate any other schedule whose window overlaps"
  - method: GET
    path: "/registrar/fee-schedules"
    description: "List fee schedules"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: FeeSchedule[]
    side_effects: []
  - method: GET
    path: "/registrar/fee-schedules/{id}"
    description: "Fetch one fee schedule"
    roles: [RegistrarAdmin, RegistrarOperator, RegistrarReviewer]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  # --- Audit events ---
  - method: GET
    path: "/registrar/audit-events"
    description: "List audit events (append-only, tamper-evident)"
    roles: [RegistrarAdmin, RegistrarReviewer]
    code: 200
    input: ["limit?", "offset?", "aggregate_type?", "aggregate_id?", "action?"]
    output: AuditEvent[]
    side_effects: []

  # --- Clock (test-driving endpoint) ---
  - method: POST
    path: "/registrar/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call, the logical clock reads that default and never falls back to wall-clock."
    roles: [RegistrarAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "re-evaluate ConsentGrant EXPIRED transitions whose expires_at <= new clock"
      - "re-evaluate IdentityVerification EXPIRED transitions whose expires_at <= new clock"
      - "re-evaluate Hold EXPIRED transitions (financial zero-amount holds past 365d)"
      - "cascade from each: orders in HOLD_CHECK/IDENTITY_PENDING advance/cancel per rules"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role is not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource does not exist"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "A body-supplied FK references a non-existent entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state that does not admit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, or enum/range violation"
  - id: ERR_FERPA_CONSENT_REQUIRED
    http: 422
    condition: "Subject is FERPA-restricted OR requested scope exceeds ENROLLMENT_ONLY, and no ACTIVE consent grant covers the requester"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Reviewer X-User-ID equals the student who placed the order / the subject of the verification"
  - id: ERR_HOLD_OFFICE_MISMATCH
    http: 403
    condition: "Hold release attempted by a role that does not match the hold_type's office"
  - id: ERR_HOLD_BLOCKING
    http: 422
    condition: "OFFICIAL order has at least one ACTIVE blocking hold; cannot advance to READY_TO_FULFILL"
  - id: ERR_RECIPIENT_ROUTING_INVALID
    http: 422
    condition: "Recipient kind/routing fields incompatible with the requested delivery_kind, or recipient is inactive"
  - id: ERR_IDENTITY_NOT_VERIFIED
    http: 422
    condition: "Order submission requires a VERIFIED IdentityVerification bound to the order"
  - id: ERR_CONSENT_EXPIRED
    http: 422
    condition: "ConsentGrant.expires_at is not in the future at creation time"
  - id: ERR_VERIFICATION_EXPIRED
    http: 422
    condition: "IdentityVerification confirm attempted after expires_at"
  - id: ERR_SCHEDULE_WINDOW_INVALID
    http: 422
    condition: "FeeSchedule effective_from >= effective_to, or window overlaps another active schedule"
  - id: ERR_REISSUE_SOURCE_INVALID
    http: 422
    condition: "ReissueRequest target order is not DELIVERED, or replacement student mismatch"
  - id: ERR_CAPTURE_EXCEEDS_AUTHORIZED
    http: 422
    condition: "Capture amount would exceed Payment.amount_cents"
  - id: ERR_REFUND_EXCEEDS_CAPTURED
    http: 422
    condition: "Cumulative refund would exceed Payment.captured_cents"
  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "idempotency_key already used with a different payload"
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "Line-item mutation attempted on a non-DRAFT order"
  - id: ERR_RECIPIENT_INACTIVE
    http: 422
    condition: "Recipient referenced is no longer active"
  - id: ERR_NO_BLOCKING_HOLD
    http: 422
    condition: "Order attempted to leave HOLD_CHECK but blocking holds still exist"
  - id: ERR_RETRIEVAL_SLA_BREACHED
    http: 422
    condition: "Archived retrieval attempted to transition after sla_due_at without escalation"
  - id: ERR_BATCH_EMPTY
    http: 422
    condition: "Lock attempted on a batch with order_count + verification_count == 0"
  - id: ERR_BATCH_ALREADY_LOCKED
    http: 409
    condition: "Membership mutation attempted on a batch not in OPEN"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "The records subject; owns orders, consent grants, and identity verifications for self"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /registrar/orders"
      - "POST /registrar/orders/{id}/line-items"
      - "POST /registrar/orders/{id}/submit"
      - "POST /registrar/orders/{id}/cancel"
      - "POST /registrar/orders/{id}/reissue-requests"
      - "POST /registrar/identity-verifications"
      - "POST /registrar/identity-verifications/{id}/confirm"
      - "POST /registrar/consent-grants"
      - "POST /registrar/consent-grants/{id}/revoke"
      - "POST /registrar/payments"
    shared_operations:
      - "GET /registrar/students/{id}"
      - "GET /registrar/students/{id}/records"
      - "GET /registrar/students/{id}/holds"
      - "GET /registrar/students/{id}/consent-grants"
      - "GET /registrar/students/{id}/identity-verifications"
      - "GET /registrar/students/{id}/archived-retrievals"
      - "GET /registrar/orders, /registrar/orders/{id}"
      - "GET /registrar/recipients"

  - name: RegistrarOperator
    description: "Day-to-day operator; dispatches line items, captures payments, runs clearinghouse batches"
    identity: opaque
    exclusive_operations:
      - "POST /registrar/line-items/{id}/dispatch"
      - "POST /registrar/line-items/{id}/mark-delivered"
      - "POST /registrar/line-items/{id}/mark-bounced"
      - "POST /registrar/payments/{id}/capture"
      - "POST /registrar/payments/{id}/refund"
      - "POST /registrar/payments/{id}/void"
      - "POST /registrar/clearinghouse-batches and lifecycle"
      - "POST /registrar/archived-retrievals"
    shared_operations:
      - "GET most resources"

  - name: RegistrarReviewer
    description: "Reviews identity verifications, verification requests, reissues; segregation-of-duties counterparty to Student"
    identity: opaque
    exclusive_operations:
      - "POST /registrar/identity-verifications/{id}/reject"
      - "POST /registrar/verification-requests/{id}/begin-review"
      - "POST /registrar/verification-requests/{id}/approve"
      - "POST /registrar/verification-requests/{id}/deny"
      - "POST /registrar/reissue-requests/{id}/approve"
      - "POST /registrar/reissue-requests/{id}/reject"
    shared_operations:
      - "GET most resources"
      - "GET /registrar/audit-events"

  - name: RegistrarAdmin
    description: "Administrator; manages students, fee schedules, clock"
    identity: opaque
    exclusive_operations:
      - "POST /registrar/students"
      - "PATCH /registrar/students/{id}"
      - "POST /registrar/students/{id}/records"
      - "POST /registrar/fee-schedules"
      - "POST /registrar/_clock/set_current_utc"
    shared_operations:
      - "GET most resources"
      - "GET /registrar/audit-events"
      - "POST /registrar/holds/{id}/release (REGISTRAR/DISCIPLINARY types)"

  - name: BursarOffice
    description: "Releases FINANCIAL holds; segregation-of-duties counterparty to RegistrarAdmin on financial matters"
    identity: opaque
    exclusive_operations:
      - "POST /registrar/holds (FINANCIAL)"
    shared_operations:
      - "POST /registrar/holds/{id}/release (FINANCIAL only)"
      - "GET /registrar/holds"

  - name: LibraryOffice
    description: "Releases LIBRARY holds"
    identity: opaque
    exclusive_operations:
      - "POST /registrar/holds (LIBRARY)"
    shared_operations:
      - "POST /registrar/holds/{id}/release (LIBRARY only)"
      - "GET /registrar/holds"

  - name: ArchiveClerk
    description: "Pulls and digitizes archived records"
    identity: opaque
    exclusive_operations:
      - "POST /registrar/archived-retrievals/{id}/mark-pulled"
      - "POST /registrar/archived-retrievals/{id}/attach-record"
      - "POST /registrar/archived-retrievals/{id}/attach-to-order"
      - "POST /registrar/archived-retrievals/{id}/mark-failed"
    shared_operations:
      - "GET /registrar/archived-retrievals"
      - "POST /registrar/archived-retrievals"

  - name: VerificationRequester
    description: "Third-party requester (employer, background-check firm); creates VerificationRequests"
    identity: opaque
    exclusive_operations:
      - "POST /registrar/verification-requests"
    shared_operations:
      - "GET /registrar/verification-requests (own)"
