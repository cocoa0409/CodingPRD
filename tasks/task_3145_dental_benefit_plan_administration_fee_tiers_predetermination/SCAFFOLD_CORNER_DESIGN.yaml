        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A body FK (subscriber_id) that does not resolve returns the generic 404 ERR_NOT_FOUND — typed 404s are reserved for path parameters."
