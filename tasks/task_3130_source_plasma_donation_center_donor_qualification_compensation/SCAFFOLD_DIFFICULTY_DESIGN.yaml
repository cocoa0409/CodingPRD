  # =====================================================================
  # Rule 9 — compensating_invariant: forward + compensating action pairs
  # leaving a named conserved quantity unchanged; DIFFERENT quantities per
  # instance (money accumulator; capacity slots; unit cardinality).
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: ytd_finalize_clawback_conservation_with_sticky_1099
        grounds:
          - calculations.ytd_compensation_accumulator
          - entities.Donor.fields.ytd_compensation_cents
          - entities.Donor.fields.requires_1099
        distinguishing_aspect: |
          Conserved quantity = donor.ytd_compensation_cents, pinned as
          SUM(net_cents over FINALIZED payments in the calendar year). Forward pair:
          two FINALIZEs raise ytd 0 -> 65000; compensating pair: two look-back
          CLAWED_BACKs return ytd to EXACTLY 0 — no drift. The carve-out pinned by the
          scaffold is that requires_1099 is deliberately NOT conserved: it latched true
          at 65000 >= 60000 and MUST stay true after ytd falls back below the threshold.
        test_recipe:
          setup:
            - "Center with schedule first=35000 second=30000; donor completes d1 (09-01, ytd 35000) and d2 (09-04, ytd 65000, requires_1099 true, donor QUALIFIED, u1/u2 RELEASED)"
            - "Reactive VIRAL_MARKER on s3 (09-05) opens case; u1,u2 -> LOOKBACK_HOLD; case UNITS_QUARANTINED"
