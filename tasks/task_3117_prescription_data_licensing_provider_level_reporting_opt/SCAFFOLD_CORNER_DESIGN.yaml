            - "forced include fails with error_id == ERR_JURISDICTION_RESTRICTED (HTTP 422)"
            - "plain compile succeeds with included_prescriber_ids == [] (P1 auto-excluded by jurisdictional filtering) and status COMPILED"

      - name: recompute_zero_sampled_outlets_invalid_request
        claim_type: Violation to Error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.ProjectionCell.fields.sampled_outlets
        distinguishing_aspect: "sampled_outlets 0 on recompute violates the >= 1 schema constraint (division-by-zero guard) and returns 400 ERR_INVALID_REQUEST before any projection runs."
        test_recipe:
          setup:
            - "Methodology + one cell."
          setup_api_calls:
            - call: "POST /projection-methodologies"
              payload: { name: "M-Z", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
