  - rule_id: resource_temporal_overlap
    instances:
      - name: walkthrough_closed_interval_overlap_on_site_contact
        grounds:
          - validations[priority=11]
          - errors[ERR_WALKTHROUGH_OVERLAP]
          - state_machines.RfpOpportunity.OPEN_to_WALKTHROUGH_SCHEDULED
        distinguishing_aspect: |
          Closed-interval semantics (no buffer): a second Walkthrough on the same SiteContact whose
          window touches/overlaps an existing SCHEDULED one is rejected — adjacency at the shared
          endpoint counts as overlap (closed interval).
        test_recipe:
          setup:
            - "A SiteContact with a SCHEDULED walkthrough 09:00-10:00; a second RFP attempts 10:00-11:00 (shares endpoint)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "WT Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
