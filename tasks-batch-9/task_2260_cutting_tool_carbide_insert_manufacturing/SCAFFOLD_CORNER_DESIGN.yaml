      - name: wheel_expires_after_the_maximum_dress_count
        claim_type: cyclic_loop_termination
        grounds:
          - state_machines.GrindingWheel
          - calculations.wheel_life_consumption
          - errors.ERR_WHEEL_EXPIRED
        distinguishing_aspect: "The AVAILABLE -> DRESSING -> AVAILABLE loop is bounded by MAX_DRESS_COUNT: the same dress trigger takes the AVAILABLE branch three times and the EXPIRED branch on the fourth call, and the two branches have divergent side effects — only the AVAILABLE branch resets consumed_life_units, so an EXPIRED wheel keeps the 860 units it was carrying and can no longer back a new grinding run."
        test_recipe:
          setup:
            - "Wheel WH-2 with initial_life_units 1000, DRESS_THRESHOLD_UNITS 150 and MAX_DRESS_COUNT 3"
            - "Product EM-10-1 with grind_units_per_tool 20, so a 43-unit run charges 860 life units and leaves remaining_life_units at 140, one step below the dress threshold"
            - "Four sequential CELL_A windows spaced an hour apart so the setup buffer is always clear"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
