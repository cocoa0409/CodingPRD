          assert:
            - "HTTP 200"
            - "${fl} == 15000"
            - "${src} == 'STANDARD'"
            - "${aid} == null"
            - "PricingException.${exc}.status == REQUESTED"

      - name: effective_floor_excludes_a_channel_scoped_exception_on_another_channel
        claim_type: input_set_filtering
        grounds: ["calculations.effective_map_floor"]
        distinguishing_aspect: "A PHYSICAL_RETAIL-scoped exception does not reach a MARKETPLACE query, so the same instant yields 13000 on one channel and STANDARD 15000 on the other."
        test_recipe:
          setup: ["APPROVED PHYSICAL_RETAIL exception E1 [2026-08-10, 2026-08-20) at 13000 on SKU-AUDIO-1."]
          setup_api_calls:
