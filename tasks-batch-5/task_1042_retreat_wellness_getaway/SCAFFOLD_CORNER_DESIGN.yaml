scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: corner_retreat_creation_returns_draft
        claim_type: Creation
        grounds: [entities.Retreat.fields.status, entities.Retreat.fields.version]
        distinguishing_aspect: "POST /v1/retreats with all required fields returns 201 with status=DRAFT, version=1, reserved_count=0, schedule_ready=false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /v1/retreats"
              payload: { name: "New", theme: "YOGA", location: "Bali", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 100000 }
              as: Operator
              captures: { rid: $.data.id }
          assert:
            - "Retreat.${rid}.status == DRAFT"
            - "Retreat.${rid}.version == 1"
            - "Retreat.${rid}.reserved_count == 0"

      - name: corner_retreat_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Retreat.fields.base_price_cents, "validations[priority=4]"]
        distinguishing_aspect: "Omitting base_price_cents on POST /v1/retreats returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/retreats"
              payload: { name: "Bad", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: corner_guest_default_dietary_notes_empty
        claim_type: Defaults
        grounds: [entities.Guest.fields.dietary_notes]
        distinguishing_aspect: "Registering a guest without dietary_notes applies the default empty string."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/guests"
              payload: { email: "d@x.com", full_name: "D" }
              as: Anonymous
              captures: { gid: $.data.id }
          assert:
            - "Guest.${gid}.dietary_notes == \"\""

      - name: corner_retreat_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_RETREAT_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/retreats/{unknown} returns ERR_RETREAT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/retreats/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_RETREAT_NOT_FOUND"

      - name: corner_booking_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/bookings/{unknown} returns ERR_BOOKING_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/bookings/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_BOOKING_NOT_FOUND"

      - name: corner_room_kind_enum_invalid_rejected
        claim_type: Type Constraints
        grounds: [entities.Room.fields.kind, "validations[priority=4]"]
        distinguishing_aspect: "POST /v1/rooms with kind='PALACE' (not in {LODGING, COMMON}) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A retreat exists."]
          setup_api_calls:
            - call: "POST /v1/retreats"
              payload: { name: "K", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 100000 }
              as: Operator
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "PALACE", tier: "STANDARD", tier_delta_cents: 0, bed_count: 2, label: "R" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: corner_booking_total_charge_computed
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.total_cents]
        excluded_because:
          difficulty_instance: booking_total_nonlinear_tiered_mode_a
          rationale: "booking_total_charge correctness is exercised by the mode-a difficulty instance."

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_cancel_already_cancelled_booking_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Booking.PENDING_DEPOSIT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED booking a second time returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A PUBLISHED retreat, LODGING room, a booking cancelled once."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C1", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "c1@x.com", full_name: "C1" }
              as: Anonymous
              captures: { gid: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${rid}", guest_id: "${gid}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${gid}"
              captures: { bid: $.data.id }
            - call: "POST /v1/bookings/${bid}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${gid}"
          trigger:
            - call: "POST /v1/bookings/${bid}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${gid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: corner_publish_already_published_retreat_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Retreat.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a retreat already in PUBLISHED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PUBLISHED retreat with a LODGING room."]
          setup_api_calls:
            - call: "POST /v1/retreats"
              payload: { name: "C2", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: corner_waiver_sign_from_pending_ok
        claim_type: valid_transition
        grounds: [state_machines.Waiver.PENDING_to_SIGNED]
        distinguishing_aspect: "Signing a PENDING waiver moves it to SIGNED and stamps signature_name."
        test_recipe:
          setup: ["A PUBLISHED retreat, booking, and a PENDING waiver."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C3", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "c3@x.com", full_name: "C3" }
              as: Anonymous
              captures: { gid: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${rid}", guest_id: "${gid}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${gid}"
              captures: { bid: $.data.id }
            - call: "POST /v1/waivers"
              payload: { booking_id: "${bid}", health_disclosures: "none" }
              as: Guest
              as_user_id: "${gid}"
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /v1/waivers/${wid}/sign"
              payload: { signature_name: "C3" }
              as: Guest
              as_user_id: "${gid}"
          assert:
            - "Waiver.${wid}.status == SIGNED"

      - name: corner_complete_before_end_date_invalid
        claim_type: precondition_enforcement
        grounds: [state_machines.Retreat.PUBLISHED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a retreat while current_utc < end_date returns ERR_INVALID_STATE (temporal precondition not met)."
        test_recipe:
          setup: ["A PUBLISHED retreat with a LODGING room; clock at 2026-07-01 (before end_date)."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C4", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /v1/retreats/${rid}/complete"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: corner_review_cleared_waiver_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Waiver.SIGNED_to_CLEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reviewing a waiver already in terminal CLEARED returns ERR_INVALID_STATE (only SIGNED waivers are reviewable)."
        test_recipe:
          setup: ["A booking with a CLEARED waiver."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C5", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "c5@x.com", full_name: "C5" }
              as: Anonymous
              captures: { gid: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${rid}", guest_id: "${gid}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${gid}"
              captures: { bid: $.data.id }
            - call: "POST /v1/waivers"
              payload: { booking_id: "${bid}", health_disclosures: "none" }
              as: Guest
              as_user_id: "${gid}"
              captures: { wid: $.data.id }
            - call: "POST /v1/waivers/${wid}/sign"
              payload: { signature_name: "C5" }
              as: Guest
              as_user_id: "${gid}"
            - call: "POST /v1/waivers/${wid}/review"
              payload: { decision: "CLEAR" }
              as: Operator
          trigger:
            - call: "POST /v1/waivers/${wid}/review"
              payload: { decision: "REJECT" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_deposit_and_balance_computed_party2
        claim_type: Correct Result
        grounds: [calculations.booking_tax, entities.Booking.fields.deposit_cents, entities.Booking.fields.balance_due_cents]
        distinguishing_aspect: "Party_size 2 on a base_price_cents=150000 STANDARD room yields total_cents=276000, tax_cents=25500, grand_total_cents=301500, deposit_cents=90450, balance_due_cents=211050."
        test_recipe:
          setup: ["A PUBLISHED retreat base 150000; a party_size-2 booking in a STANDARD room (no add-ons)."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C6", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "c6@x.com", full_name: "C6" }
              as: Anonymous
              captures: { gid: $.data.id }
          trigger:
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${rid}", guest_id: "${gid}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${gid}"
              captures: { bid: $.data.id }
          assert:
            - "Booking.${bid}.total_cents == 276000"
            - "Booking.${bid}.tax_cents == 25500"
            - "Booking.${bid}.grand_total_cents == 301500"
            - "Booking.${bid}.deposit_cents == 90450"
            - "Booking.${bid}.balance_due_cents == 211050"

      - name: corner_operator_cancel_full_refund_variant
        claim_type: Variant Selection
        grounds: [calculations.cancellation_refund]
        excluded_because:
          difficulty_instance: retreat_cancel_cascade_to_shuttle_depth3
          rationale: "The operator_cancel full-refund variant (refund_cents=90450 regardless of timing) is asserted inside the retreat-cancel cascade difficulty instance."

  # =========================================================================
  - section: validations
    instances:
      - name: corner_pay_deposit_wrong_amount_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Paying a deposit with amount_cents != deposit_cents (90450) returns ERR_PAYMENT_AMOUNT_MISMATCH (422)."
        test_recipe:
          setup: ["A PENDING_DEPOSIT booking with deposit_cents=90450."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C7", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "c7@x.com", full_name: "C7" }
              as: Anonymous
              captures: { gid: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${rid}", guest_id: "${gid}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${gid}"
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /v1/bookings/${bid}/pay-deposit"
              payload: { amount_cents: 88888 }
              as: Guest
              as_user_id: "${gid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PAYMENT_AMOUNT_MISMATCH"

      - name: corner_pay_balance_without_cleared_waiver_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_WAIVER_NOT_CLEARED]"]
        distinguishing_aspect: "Paying the balance while the booking's waiver is not CLEARED returns ERR_WAIVER_NOT_CLEARED (422), even with the correct amount."
        test_recipe:
          setup: ["A DEPOSIT_PAID booking whose waiver is still PENDING."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C8", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "c8@x.com", full_name: "C8" }
              as: Anonymous
              captures: { gid: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${rid}", guest_id: "${gid}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${gid}"
              captures: { bid: $.data.id }
            - call: "POST /v1/bookings/${bid}/pay-deposit"
              payload: { amount_cents: 90450 }
              as: Guest
              as_user_id: "${gid}"
          trigger:
            - call: "POST /v1/bookings/${bid}/pay-balance"
              payload: { amount_cents: 211050 }
              as: Guest
              as_user_id: "${gid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_WAIVER_NOT_CLEARED"

      - name: corner_checkin_too_early_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_CHECKIN_TOO_EARLY]"]
        distinguishing_aspect: "Checking in a CONFIRMED booking while current_utc < start_date returns ERR_CHECKIN_TOO_EARLY (409)."
        test_recipe:
          setup: ["A CONFIRMED booking (deposit + cleared waiver + balance) at clock 2026-07-01, before start 2026-09-01."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "C9", theme: "YOGA", location: "X", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 10, base_price_cents: 150000 }
              as: Operator
              captures: { rid: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${rid}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${rid}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "c9@x.com", full_name: "C9" }
              as: Anonymous
              captures: { gid: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${rid}", guest_id: "${gid}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${gid}"
              captures: { bid: $.data.id }
            - call: "POST /v1/bookings/${bid}/pay-deposit"
              payload: { amount_cents: 90450 }
              as: Guest
              as_user_id: "${gid}"
            - call: "POST /v1/waivers"
              payload: { booking_id: "${bid}", health_disclosures: "none" }
              as: Guest
              as_user_id: "${gid}"
              captures: { wid: $.data.id }
            - call: "POST /v1/waivers/${wid}/sign"
              payload: { signature_name: "C9" }
              as: Guest
              as_user_id: "${gid}"
            - call: "POST /v1/waivers/${wid}/review"
              payload: { decision: "CLEAR" }
              as: Operator
            - call: "POST /v1/bookings/${bid}/pay-balance"
              payload: { amount_cents: 211050 }
              as: Guest
              as_user_id: "${gid}"
          trigger:
            - call: "POST /v1/bookings/${bid}/check-in"
              payload: {}
              as: Operator
